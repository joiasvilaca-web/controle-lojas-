<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

/* ============================================================
   ESTADO / STORAGE — a config é a MESMA tabela usada pelo hub,
   pelo O.S. e pelas Transferências: "gestao_config" (id='config').
   Vendas ficam na sua própria tabela "vendas_pdv" (uma linha por venda).
   A partir daqui o app não fala mais direto com o banco: tudo passa pela
   Edge Function "db-gateway", que exige a senha de um acesso válido.
   ============================================================ */
let config = null;
let vendas = [];
let currentUser = null;
let currentTab = 'nova';
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){
  return gatewayCall({ op:'login', senha: senhaTentativa });
}
/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 1000 } });
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }

let produtosEstoque = [];

function unidadeEstoqueLabel(u){ return u==='g' ? 'g' : u==='kg' ? 'kg' : 'un'; }

/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`,
 * explodindo pela composição (receita) em cascata quando falta estoque em
 * qualquer nível — ex: falta o produto pronto -> usa o insumo secundário ->
 * se também faltar, usa os insumos primários que compõem o secundário.
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
function planejarConsumoEstoque(produtoId, quantidadeNecessaria, reservas){
  const produto = produtosEstoque.find(p=>p.id===produtoId);
  if(!produto) return { ok:false, faltando:[{ produtoId, nome:'(produto não encontrado)', quantidade:quantidadeNecessaria }] };

  const jaReservado = reservas[produtoId] || 0;
  const disponivel = Math.max(0, (Number(produto.estoque)||0) - jaReservado);
  const usarDoProprio = Math.min(disponivel, quantidadeNecessaria);
  if(usarDoProprio > 0) reservas[produtoId] = jaReservado + usarDoProprio;

  const faltaAinda = quantidadeNecessaria - usarDoProprio;
  if(faltaAinda <= 1e-9) return { ok:true, faltando:[] };

  if(!produto.composicao || produto.composicao.length===0){
    return { ok:false, faltando:[{ produtoId, nome:produto.nome, quantidade:faltaAinda }] };
  }

  let tudoOk = true;
  const faltandoTotal = [];
  produto.composicao.forEach(comp=>{
    const qtdComponente = (Number(comp.quantidade)||0) * faltaAinda;
    const resultado = planejarConsumoEstoque(comp.insumoId, qtdComponente, reservas);
    if(!resultado.ok){ tudoOk = false; faltandoTotal.push(...resultado.faltando); }
  });
  return { ok: tudoOk, faltando: faltandoTotal };
}

/** Aplica os consumos planejados (debita do estoque, mesmo que fique negativo) e salva cada produto afetado. */
async function aplicarConsumosEstoque(reservas){
  const ids = Object.keys(reservas).filter(id=> reservas[id] > 0);
  for(const id of ids){
    const produto = produtosEstoque.find(p=>p.id===id);
    if(!produto) continue;
    produto.estoque = (Number(produto.estoque)||0) - reservas[id];
    await produtoEstoqueAtualizar(produto);
  }
}

}
const STATUS_ORCAMENTO_PADRAO = [
  { id:'pendente', nome:'Pendente', inicial:true, encerra:false, mensagemWhatsapp:'' },
  { id:'cutucado', nome:'Cutucado', inicial:false, encerra:false, mensagemWhatsapp:'' },
  { id:'aprovado', nome:'Aprovado', inicial:false, encerra:true, mensagemWhatsapp:'' },
  { id:'recusado', nome:'Recusado', inicial:false, encerra:true, mensagemWhatsapp:'' },
];
function statusList(){ return (config.statusOrcamento && config.statusOrcamento.length>0) ? config.statusOrcamento : STATUS_ORCAMENTO_PADRAO; }
function statusInfoDe(id){ return statusList().find(s=>s.id===id) || statusList()[0]; }
/** Orçamentos ainda em aberto (status que não "encerra") do mesmo cliente — por telefone ou nome. */
function orcamentosAbertosDoCliente(cliente){
  if(!cliente) return [];
  const telDigits = onlyDigits(cliente.telefone||'');
  const nomeLower = (cliente.nome||'').trim().toLowerCase();
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    const mesmoTelefone = telDigits && onlyDigits(o.telefone||'') === telDigits;
    const mesmoNome = nomeLower && (o.cliente||'').trim().toLowerCase() === nomeLower;
    return mesmoTelefone || mesmoNome;
  });
}

/* ============================================================
   CLIENTES (cadastro compartilhado com O.S. e Orçamentos)
   ============================================================ */
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
function findClienteIndex(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  return clientes.findIndex(c=>
    (tel && onlyDigits(c.telefone) === tel) ||
    (doc && onlyDigitsCpf(c.cpf) === doc)
  );
}
async function clientesGet(){
  try{
    const { data, error } = await supabaseClient.from('clientes_cadastro').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar clientes', e); return []; }
}
async function salvarUmCliente(cliente){
  try{
    const { error } = await supabaseClient.from('clientes_cadastro').upsert({ id: cliente.id, payload: cliente });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar cliente', e); showToast('Não foi possível salvar o cliente.'); return false; }
}
/** Busca endereço pelo CEP usando o ViaCEP (gratuito, sem chave). Retorna null se não achar. */
async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  try{
    const res = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
    const data = await res.json();
    if(data.erro) return null;
    return { endereco: data.logradouro || '', bairro: data.bairro || '', cidade: data.localidade || '', estado: data.uf || '' };
  }catch(e){ return null; }
}
/** Monta o HTML dos campos completos de cliente (mesmo padrão do O.S.). */
function clienteFieldsHtml(prefix, c){
  c = c || {};
  const nome = c.cliente !== undefined ? c.cliente : (c.nome || '');
  return `
    <div class="grid-2">
      <div class="field"><label>CPF</label><input id="${prefix}_cpf" placeholder="000.000.000-00" value="${escapeHtml(c.cpf||'')}"></div>
      <div class="field"><label>Nome do cliente</label><input id="${prefix}_cliente" placeholder="Nome completo" value="${escapeHtml(nome)}"></div>
      <div class="field"><label>Telefone</label><input id="${prefix}_telefone" placeholder="(00) 00000-0000" value="${escapeHtml(c.telefone||'')}"></div>
      <div class="field"><label>E-mail do cliente</label><input type="email" id="${prefix}_email" placeholder="cliente@email.com" value="${escapeHtml(c.email||'')}"></div>
      <div class="field"><label>Data de nascimento</label><input type="date" id="${prefix}_nascimento" value="${c.dataNascimento||''}"></div>
      <div class="field"><label>CEP</label><input id="${prefix}_cep" placeholder="00000-000" value="${escapeHtml(c.cep||'')}"></div>
    </div>
    <div class="grid-2" style="margin-top:10px;">
      <div class="field"><label>Endereço</label><input id="${prefix}_endereco" placeholder="Rua / Avenida" value="${escapeHtml(c.endereco||'')}"></div>
      <div class="field"><label>Número</label><input id="${prefix}_numero" placeholder="Nº" value="${escapeHtml(c.numero||'')}"></div>
      <div class="field"><label>Complemento</label><input id="${prefix}_complemento" placeholder="Apto, bloco…" value="${escapeHtml(c.complemento||'')}"></div>
      <div class="field"><label>Bairro</label><input id="${prefix}_bairro" placeholder="Bairro" value="${escapeHtml(c.bairro||'')}"></div>

function wireClienteFields(prefix){
  const cepInp = document.getElementById(prefix+'_cep');
  if(cepInp){
    cepInp.addEventListener('blur', async ()=>{
      const cepDigits = onlyDigits(cepInp.value);
      if(cepDigits.length !== 8) return;
      const endereco = await buscarEnderecoPorCep(cepDigits);
      if(!endereco) return;
      const enderecoInp = document.getElementById(prefix+'_endereco');
      const bairroInp = document.getElementById(prefix+'_bairro');
      const cidadeInp = document.getElementById(prefix+'_cidade');
      const estadoInp = document.getElementById(prefix+'_estado');
      if(enderecoInp) enderecoInp.value = endereco.endereco;
      if(bairroInp) bairroInp.value = endereco.bairro;
      if(cidadeInp) cidadeInp.value = endereco.cidade;
      if(estadoInp) estadoInp.value = endereco.estado;
      showToast('Endereço preenchido — falta só número e complemento.');
    });
  }
}
/**
 * Abre a tela de cliente com busca (lupa): digitando, filtra os clientes já
 * cadastrados; clicar num resultado preenche o formulário com os dados dele;
 * ou preenche do zero pra cadastrar alguém novo. Ao confirmar, salva e chama
 * `onConfirmar(cliente)` com o registro final. `permitirVazio` deixa cancelar
 * sem selecionar nada (usado em telas onde o cliente é opcional).
 */
function abrirSeletorCliente(onConfirmar, clienteAtual){
  let selecionado = clienteAtual ? { ...clienteAtual } : null;
  openModal(`
    <h3>Cliente</h3>
    <div class="field"><label>🔍 Buscar cliente já cadastrado</label><input id="busca_cliente" placeholder="Nome, telefone ou CPF..." autocomplete="off"></div>
    <div id="resultados_cliente" style="max-height:180px; overflow-y:auto; margin-bottom:12px;"></div>
    <div style="border-top:1px solid var(--line); padding-top:12px;">
      <p class="muted" style="margin:0 0 8px;">Ou preencha os dados abaixo pra cadastrar um cliente novo:</p>
      ${clienteFieldsHtml('sel', clienteAtual || {})}
    </div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnConfirmarSelecaoCliente">Confirmar</button>
      <button class="btn btn-ghost" id="btnCancelarSelecaoCliente">Cancelar</button>
    </div>
  `);
  wireClienteFields('sel');

  function preencherFormulario(c){
    const map = { cpf:c.cpf, cliente:c.nome, telefone:c.telefone, email:c.email, nascimento:c.dataNascimento,
      cep:c.cep, endereco:c.endereco, numero:c.numero, complemento:c.complemento, bairro:c.bairro, cidade:c.cidade, estado:c.estado };
    Object.keys(map).forEach(campo=>{
      const el = document.getElementById('sel_'+campo);
      if(el) el.value = map[campo] || '';
    });
    selecionado = c;
  }
  function renderResultados(termo){
    const wrap = document.getElementById('resultados_cliente');
    if(!termo){ wrap.innerHTML=''; return; }
    const termoDigits = onlyDigits(termo);
    const termoLower = termo.toLowerCase();
    const achados = clientes.filter(c=>
      (c.nome||'').toLowerCase().includes(termoLower) ||
      (termoDigits.length>=4 && onlyDigits(c.telefone||'').includes(termoDigits)) ||
      (termoDigits.length>=4 && onlyDigitsCpf(c.cpf||'').includes(termoDigits))
    ).slice(0,8);
    wrap.innerHTML = achados.length===0
      ? `<div class="empty">Nenhum cliente encontrado — preencha abaixo pra cadastrar um novo.</div>`
      : achados.map(c=>`<div class="code-list-item" style="cursor:pointer;" data-selcli="${c.id}"><div><b>${escapeHtml(c.nome)}</b> <span class="muted">${escapeHtml(c.telefone||'—')}</span></div></div>`).join('');
    wrap.querySelectorAll('[data-selcli]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const c = clientes.find(x=>x.id===el.dataset.selcli);
        if(c){ preencherFormulario(c); showToast('Dados preenchidos — confira e confirme.'); }
      });
    });
  }
  document.getElementById('busca_cliente').addEventListener('input', e=> renderResultados(e.target.value.trim()));

  document.getElementById('btnCancelarSelecaoCliente').addEventListener('click', closeModal);
  document.getElementById('btnConfirmarSelecaoCliente').addEventListener('click', async ()=>{
    const nome = document.getElementById('sel_cliente').value.trim();
    if(!nome){ showToast('Informe o nome do cliente.'); return; }
    const patch = {
      nome,
      telefone: document.getElementById('sel_telefone').value.trim(),
      email: document.getElementById('sel_email').value.trim(),
      cpf: document.getElementById('sel_cpf').value.trim(),
      dataNascimento: document.getElementById('sel_nascimento').value,
      cep: document.getElementById('sel_cep').value.trim(),
      endereco: document.getElementById('sel_endereco').value.trim(),
      numero: document.getElementById('sel_numero').value.trim(),
      complemento: document.getElementById('sel_complemento').value.trim(),
      bairro: document.getElementById('sel_bairro').value.trim(),
      cidade: document.getElementById('sel_cidade').value.trim(),
      estado: document.getElementById('sel_estado').value.trim(),
    };
    let clienteFinal;
    if(selecionado && selecionado.id){
      clienteFinal = { ...selecionado, ...patch };
      const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
      if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
    } else {
      const idxExistente = findClienteIndex(patch.telefone, patch.cpf);
      if(idxExistente >= 0){
        clienteFinal = { ...clientes[idxExistente], ...patch };
        clientes[idxExistente] = clienteFinal;
      } else {
        clienteFinal = { id: uid('cli'), ...patch, criadoEm: Date.now() };
        clientes.unshift(clienteFinal);
      }
    }
    await salvarUmCliente(clienteFinal);
    closeModal();
    onConfirmar(clienteFinal);
  });
}

/* ============================================================
   HELPERS DE LOJA / FUNCIONÁRIO / PRODUTO (a partir da config unificada)
   ============================================================ */
function lojaOptionsHtml(selected){
  return (config.lojas||[]).map(l=>`<option value="${l.id}" ${selected===l.id?'selected':''}>${escapeHtml(l.nome)} (${escapeHtml(l.abreviacao)})</option>`).join('');
}
/** Nome que aparece nas listas dos módulos: o apelido do cadastro, ou o nome completo se não tiver apelido. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Um nome gravado num lançamento antigo pode ser o nome completo; aqui bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
function vendedoraOptionsHtml(selected){
  const lista = (config.funcionarios||[]).filter(f=>(f.cargos||[]).includes('vendedora'));
  const naLista = lista.some(f=>nomeExibicaoFuncionario(f)===selected);
  // lançamento antigo pode ter sido salvo com o nome completo: converte pro apelido
  const equivalente = !naLista && selected ? lista.find(f=>funcionarioBateComNome(f, selected)) : null;
  const valorSel = equivalente ? nomeExibicaoFuncionario(equivalente) : selected;
  const extra = (valorSel && !lista.some(f=>nomeExibicaoFuncionario(f)===valorSel))
    ? `<option value="${escapeHtml(valorSel)}" selected>${escapeHtml(valorSel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${valorSel===n?'selected':''}>${escapeHtml(n)}</option>`;
  }).join('');
}
function produtoJoiaOptionsHtml(selected){
  return `<option value="">Selecione</option>` + (config.joiasProdutos||[]).map(p=>`<option value="${escapeHtml(p)}" ${selected===p?'selected':''}>${escapeHtml(p)}</option>`).join('');
}
function metalOptionsHtml(selected){
  return `<option value="">—</option>` + (config.metais||[]).map(m=>`<option value="${escapeHtml(m)}" ${selected===m?'selected':''}>${escapeHtml(m)}</option>`).join('');
}

/**
 * Valida a exigência: quando emite nota, a empresa que RECEBEU o pagamento
 * precisa ser a mesma que EMITIU a nota (mesmo CNPJ pagando e faturando).
 * Retorna null se estiver tudo certo, ou uma mensagem de erro pra mostrar.
 */
function notaEmpresasErro(holder){
  if(holder.emissaoNota !== 'sim') return null;
  if(!holder.lojaSaidaId || !holder.lojaPagamentoId || !holder.lojaNotaId){
    return 'Selecione as 3 empresas (saída da joia, pagamento e nota).';
  }
  if(holder.lojaPagamentoId !== holder.lojaNotaId){
    return 'A empresa que recebeu o pagamento precisa ser a mesma que emitiu a nota.';
  }
  return null;
}

      </div>

      <div class="muted" id="pagSomaHint" style="margin-top:6px;"></div>
      <div id="pagNotaWrap" style="margin-top:14px; display:none;">
        <div class="field">
          <label>Emitiu nota fiscal?</label>
          <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:2px;">

            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; text-transform:none; letter-spacing:0;">
              <input type="radio" name="pagEmiteNota" value="nao" ${holder.emissaoNota==='nao'?'checked':''}> Não
            </label>
          </div>
        </div>
        <div id="pagNotaCamposWrap" style="display:none;">
          <div class="field"><label>Número da nota</label><input id="pagNumeroNota" placeholder="Ex: 12345" value="${escapeHtml(holder.numeroNota||'')}"></div>
          <div class="grid-3">
            <div class="field"><label>Empresa de onde sai a joia</label><select id="pagLojaSaida">${lojaOptionsHtml(holder.lojaSaidaId||'')}</select></div>
            <div class="field"><label>Empresa que recebeu o pagamento</label><select id="pagLojaPagamento">${lojaOptionsHtml(holder.lojaPagamentoId||'')}</select></div>

  function atualizarVisibilidadeNota(){

    });
    wrap.querySelectorAll('[data-pagvalor]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        holder.pagamentos[Number(inp.dataset.pagvalor)].valor = inp.value === '' ? '' : parseFloat(inp.value);
        updateHint();

      b.addEventListener('click', ()=>{ holder.pagamentos.splice(Number(b.dataset.pagdel),1); drawRows(); updateHint(); });

  function updateHint(){
    const hint = container.querySelector('#pagSomaHint');
    if(!hint) return;
    if(holder.pagamentos.length === 0){ hint.textContent = ''; return; }
    const soma = holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
    const total = Number(holder.valorTotal)||0;
    if(Math.abs(soma - total) > 0.009){
      hint.innerHTML = `<span style="color:var(--danger);">Soma dos pagamentos (R$ ${soma.toFixed(2)}) diferente do valor total (R$ ${total.toFixed(2)}).</span>`;
    }else{
      hint.innerHTML = `<span style="color:var(--ok);">Soma dos pagamentos confere com o valor total (R$ ${total.toFixed(2)}).</span>`;
    }
  }

  draw();
}
function valorRecebidoDe(v){ return (v.pagamentos||[]).reduce((acc,p)=> acc + ((p.formaId==='__fiado'||p.formaId==='__credito') ? 0 : (Number(p.valor)||0)), 0); }
/* Fiado e crédito não movimentam o caixa na venda: fiado só entra quando as parcelas
   são recebidas (Cadastro → Clientes → Débitos); crédito entrou no caixa na recarga. */
function valorAReceberDe(v){ return Math.max(0, (Number(v.valorTotal)||0) - valorRecebidoDe(v)); }
function semPagamentoLancado(v){ return !v.valorTotal && (!v.pagamentos || v.pagamentos.length===0); }

          <input type="number" min="1" step="1" data-itfield="quantidade" value="${it.quantidade!==undefined?it.quantidade:1}">
          <input type="number" min="0" step="0.01" data-itfield="valorUnitario" placeholder="0,00" value="${it.valorUnitario!==undefined && it.valorUnitario!=='' ? it.valorUnitario : ''}">
          <button type="button" class="icon-btn" data-itdel="${i}" title="Remover">✕</button>
        </div>
        <div class="item-row-estoque">
          <label class="muted" style="font-size:11.5px; text-transform:uppercase; font-weight:700;">Descontar do estoque</label>
          <select data-itfield="produtoEstoqueId" style="max-width:260px;">
            <option value="">— Sem controle de estoque —</option>
            ${vendaveis.map(p=>`<option value="${p.id}" ${it.produtoEstoqueId===p.id?'selected':''}>${escapeHtml(p.nome)} (${Number(p.estoque||0)} ${escapeHtml(unidadeEstoqueLabel(p.unidade))} em estoque)</option>`).join('')}
          </select>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const row = el.closest('[data-idx]');
        const idx = Number(row.dataset.idx);
        const field = el.dataset.itfield;
        holder.itens[idx][field] = (field==='quantidade'||field==='valorUnitario') ? (el.value===''?'':parseFloat(el.value)) : el.value;
        updateTotalHint();
      });
      el.addEventListener('change', ()=>{
        const row = el.closest('[data-idx]');
        const idx = Number(row.dataset.idx);
        const field = el.dataset.itfield;
        holder.itens[idx][field] = (field==='quantidade'||field==='valorUnitario') ? (el.value===''?'':parseFloat(el.value)) : el.value;
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click', ()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    if(!hint) return;
    hint.innerHTML = `Total dos itens: <b>R$ ${totalItens().toFixed(2)}</b> <span class="muted">(você pode ajustar o valor total do pagamento manualmente se houver desconto/acréscimo)</span>`;
  }
  draw();
  return { totalItens };
}

/* ============================================================
   MODO EMBUTIDO — ver mesma explicação no painel-ordens.html.
   ============================================================ */
const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    } else if(ev.data.type === 'clientesAtualizados'){
      // O módulo Cadastro mexeu no cadastro de clientes. Como este módulo fica
      // vivo no iframe, a lista em memória ficaria velha — recarrega na hora.
      if(__gatewaySenha){ clientes = await clientesGet(); }
    }
  });
}

/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  if(r.user.nivel === 'oficina'){ err.textContent = 'Esse acesso não tem permissão para o módulo de Vendas.'; err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null;
  __gatewaySenha = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  document.getElementById('linkConfigHub').style.display = currentUser.nivel==='diretoria' ? '' : 'none';
  buildTabs();
  currentTab = 'nova';
  if(EMBEDDED){
    const permitido = tabsForLevel();
    if(!permitido.some(t=>t.id===currentTab)) currentTab = permitido[0] ? permitido[0].id : 'vendas';
    parent.postMessage({ type:'tabs', modulo:'vendas', tabs: permitido, active: currentTab }, '*');
  }
  renderTabs();
  renderView();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function tabsForLevel(){
  const t = [
    { id:'nova', label:'Nova venda', icon:'🧾' },
    { id:'vendas', label:'Vendas', icon:'📋' },
  ];
  if(window.__permissoesAbasOverride){
    return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'vendas', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='nova') renderNovaVenda(main);
  else if(currentTab==='vendas') renderVendas(main);
}

/**
 * Se o cliente tem orçamento(s) em aberto (status que não "encerra"), mostra uma
 * tela com a lista: dá pra ver os itens, mudar o status, ou confirmar que um deles
 * é exatamente o que está virando esta venda agora (marca como aprovado).
 */
function mostrarOrcamentosAbertosModal(cliente){
  const abertos = orcamentosAbertosDoCliente(cliente);
  if(abertos.length === 0) return;
  openModal(`
    <h3>⚠️ ${escapeHtml(cliente.nome)} tem ${abertos.length} orçamento(s) em aberto</h3>
    <p class="muted">Se um deles é o que está virando esta venda agora, confirme. Os outros, vale checar o status com o cliente.</p>
    <div id="orcAbertosLista"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharOrcAbertos">Continuar</button></div>
  `);
  function draw(){
    const wrap = document.getElementById('orcAbertosLista');
    if(abertos.length===0){ wrap.innerHTML = '<p class="muted">Nenhum orçamento em aberto restante.</p>'; return; }
    wrap.innerHTML = abertos.map(o=>{
      const info = statusInfoDe(o.status);
      return `<div style="border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
          <div><b>${fmtMoeda(o.valorTotal)}</b> <span class="muted">— ${fmtDate(o.data)} · válido até ${fmtDate(o.validade)}</span></div>
          <span class="badge badge-loja">${escapeHtml(info?info.nome:o.status)}</span>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
          <button type="button" class="btn btn-ghost btn-sm" data-verorc="${o.id}">Ver itens</button>
          <select data-statusorc="${o.id}" style="max-width:170px;">${statusList().map(s=>`<option value="${s.id}" ${o.status===s.id?'selected':''}>${escapeHtml(s.nome)}</option>`).join('')}</select>
          <button type="button" class="btn btn-accent btn-sm" data-confirmarorc="${o.id}">✓ É este</button>
        </div>
        <div data-itensorc="${o.id}" style="display:none; margin-top:8px; font-size:12.5px; color:var(--muted);"></div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('[data-verorc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const o = abertos.find(x=>x.id===b.dataset.verorc);
        const div = wrap.querySelector(`[data-itensorc="${o.id}"]`);
        div.style.display = div.style.display==='none' ? 'block' : 'none';
        div.innerHTML = (o.itens||[]).map(it=>`${escapeHtml(it.produto)} x${it.quantidade} — ${fmtMoeda(it.valorUnitario)}`).join('<br>') || 'Sem itens.';
      });
    });
    wrap.querySelectorAll('[data-statusorc]').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const o = abertos.find(x=>x.id===sel.dataset.statusorc);
        o.status = sel.value;
        await orcamentoSalvar(o);
        showToast('Status atualizado.');
        const infoNovo = statusInfoDe(o.status);
        if(infoNovo && infoNovo.encerra){ abertos.splice(abertos.indexOf(o),1); }
        draw();
      });
    });
    wrap.querySelectorAll('[data-confirmarorc]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const o = abertos.find(x=>x.id===b.dataset.confirmarorc);
        const statusAprovado = statusList().find(s=>s.encerra) || statusList()[0];
        o.status = statusAprovado.id;
        await orcamentoSalvar(o);
        showToast('Orçamento confirmado como esta venda.');
        abertos.splice(abertos.indexOf(o),1);
        draw();
      });
    });
  }
  draw();
  document.getElementById('btnFecharOrcAbertos').addEventListener('click', closeModal);
}

/* ============================================================
   NOVA VENDA
   ============================================================ */
function renderNovaVenda(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Nova venda</h1>
        <p class="page-sub">Registre os itens vendidos e o pagamento.</p>
      </div>
    </div>
    <div class="card">
      <div class="section-label">Venda</div>
      <div class="grid-2">
        <div class="field"><label>Loja</label><select id="v_loja"><option value="">Selecione</option>${lojaOptionsHtml('')}</select></div>
        <div class="field"><label>Vendedora</label><select id="v_vendedora">${vendedoraOptionsHtml(currentUser.nivel==='vendedora'?currentUser.nome:'')}</select></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Data</label><input type="date" id="v_data" value="${todayStr()}"></div>
        <div class="field"><label>Cliente <span class="muted">(opcional)</span></label>
          <div id="v_clienteResumo" style="padding:9px 10px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; font-size:13.5px; margin-bottom:6px;">
            <span class="muted">Nenhum cliente selecionado.</span>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="btnSelecionarClienteVenda">🔍 Selecionar / cadastrar cliente</button>
        </div>
      </div>
      <input type="hidden" id="v_cliente"><input type="hidden" id="v_telefone">
    </div>
    <div class="card"><div id="itensContainerNova"></div></div>
    <div class="card"><div id="pagamentoContainerNova"></div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-accent" id="btnSalvarVenda">Lançar venda</button>
      <button class="btn btn-ghost" id="btnLimparVenda">Limpar</button>
    </div>
  `;
  const tempItensHolder = { itens:[ { id: uid('it'), produto:'', metal:'', quantidade:1, valorUnitario:'' } ] };
  const itensApi = mountItens(document.getElementById('itensContainerNova'), tempItensHolder);
  const tempPagHolder = { valorTotal:null, pagamentos:[] };
  mountPagamentos(document.getElementById('pagamentoContainerNova'), tempPagHolder);

  // Guarda o registro completo do cliente escolhido, pra o ✎ conseguir abrir o
  // cadastro dele já preenchido (os campos da tela só guardam nome e telefone).
  let clienteSelecionadoVenda = null;
  function atualizarResumoClienteVenda(){
    const nome = document.getElementById('v_cliente').value;
    const tel = document.getElementById('v_telefone').value;
    const resumo = document.getElementById('v_clienteResumo');
    resumo.innerHTML = nome
      ? `<div style="display:flex; align-items:center; gap:8px; justify-content:space-between;">
           <div><b>${escapeHtml(nome)}</b>${tel ? ' — '+escapeHtml(tel) : ''}</div>
           ${clienteSelecionadoVenda && clienteSelecionadoVenda.id ? `<button type="button" class="btn btn-ghost btn-sm" id="btnEditarClienteVenda" title="Editar cadastro deste cliente">✎ Editar cadastro</button>` : ''}
         </div>`
      : `<span class="muted">Nenhum cliente selecionado.</span>`;
    const btnEd = document.getElementById('btnEditarClienteVenda');
    if(btnEd) btnEd.addEventListener('click', abrirEdicaoClienteVenda);
  }
  function aplicarClienteVenda(clienteFinal){
    clienteSelecionadoVenda = clienteFinal;
    document.getElementById('v_cliente').value = clienteFinal.nome || '';
    document.getElementById('v_telefone').value = clienteFinal.telefone || '';
    atualizarResumoClienteVenda();
  }
  /** Abre o cadastro do cliente selecionado. O que for alterado aqui vale pro
   *  cadastro central (clientes_cadastro), ou seja, pra todos os módulos. */
  function abrirEdicaoClienteVenda(){
    if(!clienteSelecionadoVenda) return;
    abrirSeletorCliente((clienteFinal)=>{
      aplicarClienteVenda(clienteFinal);
      showToast('Cadastro do cliente atualizado.');
    }, clienteSelecionadoVenda);
  }
  document.getElementById('btnSelecionarClienteVenda').addEventListener('click', ()=>{
    abrirSeletorCliente((clienteFinal)=>{
      aplicarClienteVenda(clienteFinal);
      mostrarOrcamentosAbertosModal(clienteFinal);
    });
  });

  document.getElementById('btnLimparVenda').addEventListener('click', ()=> renderNovaVenda(main) );

  document.getElementById('btnSalvarVenda').addEventListener('click', async ()=>{
    const lojaId = document.getElementById('v_loja').value;
    const vendedora = document.getElementById('v_vendedora').value.trim();
    const data = document.getElementById('v_data').value;
    const cliente = document.getElementById('v_cliente').value.trim();
    const telefone = document.getElementById('v_telefone').value.trim();
    const itensValidos = tempItensHolder.itens.filter(it=>it.produto);

    if(!lojaId || !vendedora || !data){ showToast('Preencha loja, vendedora e data.'); return; }
    if(itensValidos.length===0){ showToast('Adicione ao menos um item vendido.'); return; }
    const erroNota = notaEmpresasErro(tempPagHolder);
    if(erroNota){ showToast(erroNota); return; }

    // Planeja o desconto de estoque (com explosão em cascata pela composição) pra
    // cada item vinculado a um produto do catálogo. Itens sem vínculo (produtoEstoqueId
    // vazio) não mexem em estoque nenhum, como sempre foi.
    const reservas = {};
    let faltandoGeral = [];
    itensValidos.forEach(it=>{
      if(!it.produtoEstoqueId) return;
      const resultado = planejarConsumoEstoque(it.produtoEstoqueId, Number(it.quantidade)||0, reservas);
      if(!resultado.ok) faltandoGeral.push(...resultado.faltando);
    });
    if(faltandoGeral.length > 0){
      const lista = faltandoGeral.map(f=> `${f.nome} (faltam ${f.quantidade.toFixed(2)})`).join(', ');
      const prosseguir = confirm(`Estoque insuficiente pra: ${lista}.\n\nLançar a venda mesmo assim? O estoque desses itens vai ficar negativo, sinalizando que precisa repor.`);
      if(!prosseguir) return;
    }

    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    const venda = {
      id: uid('venda'),
      loja: loja ? loja.nome : '',
      lojaId, vendedora, data, cliente, telefone,
      itens: itensValidos,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: tempPagHolder.pagamentos,
      momentoPagamento: tempPagHolder.momentoPagamento,
      emissaoNota: tempPagHolder.emissaoNota,
      numeroNota: tempPagHolder.numeroNota || '',
      lojaSaidaId: tempPagHolder.lojaSaidaId || '',
      lojaPagamentoId: tempPagHolder.lojaPagamentoId || '',
      lojaNotaId: tempPagHolder.lojaNotaId || '',
      status: 'ativa',
      criadoPor: currentUser.nome,
      criadoEm: Date.now(),
    };
    // ===== Crédito do cliente / Fiado =====
    const pagsCredito = (venda.pagamentos||[]).filter(p=>p.formaId==='__credito');
    const pagsFiado = (venda.pagamentos||[]).filter(p=>p.formaId==='__fiado');
    let clienteCadastro = null;
    if(pagsCredito.length>0 || pagsFiado.length>0){
      const telD = (venda.telefone||'').replace(/\D/g,'');
      const nomeL = (venda.cliente||'').trim().toLowerCase();
      clienteCadastro = clientes.find(c=> (telD && (c.telefone||'').replace(/\D/g,'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL));
      if(!clienteCadastro){
        showToast('Pra usar Crédito ou Fiado, selecione um cliente já cadastrado (busque pela lupa).');
        return;
      }
      const totalCredito = pagsCredito.reduce((a,p)=>a+(Number(p.valor)||0),0);
      if(totalCredito>0 && (Number(clienteCadastro.credito)||0) < totalCredito - 0.001){
        showToast(`Saldo de crédito insuficiente: cliente tem R$ ${(Number(clienteCadastro.credito)||0).toFixed(2)}.`);
        return;
      }
    }
    const ok = await vendaSalvar(venda);
    if(ok){
      if(clienteCadastro){
        const totalCredito = pagsCredito.reduce((a,p)=>a+(Number(p.valor)||0),0);
        if(totalCredito>0){
          clienteCadastro.credito = (Number(clienteCadastro.credito)||0) - totalCredito;
          if(!clienteCadastro.creditoMovimentos) clienteCadastro.creditoMovimentos = [];
          clienteCadastro.creditoMovimentos.push({ data: venda.data, valor: -totalCredito, tipo:'uso', obs:`Venda ${String(venda.id).slice(-8)}` });
        }
        const totalFiado = pagsFiado.reduce((a,p)=>a+(Number(p.valor)||0),0);
        if(totalFiado>0){
          if(!clienteCadastro.fiadoDebitos) clienteCadastro.fiadoDebitos = [];
          clienteCadastro.fiadoDebitos.push({ id:'fd_'+Math.random().toString(36).slice(2)+Date.now().toString(36), origem:'Venda', numero:String(venda.id).slice(-8), data:venda.data, valor:totalFiado, valorPago:0, loja:venda.loja||'' });
        }
        if(totalCredito>0 || totalFiado>0) await salvarUmCliente(clienteCadastro);
      }
      await aplicarConsumosEstoque(reservas);
      vendas.unshift(venda);
      showToast('Venda lançada com sucesso.');
      currentTab = 'vendas';
      renderTabs(); renderView();
    }
  });
}

/* ============================================================
   LISTA DE VENDAS
   ============================================================ */
function renderVendas(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Vendas</h1>
        <p class="page-sub">Consulte, filtre e acompanhe os pagamentos das vendas lançadas.</p>
      </div>
    </div>
    <div class="filters">
      <select id="filtroLoja"><option value="">Todas as lojas</option>${lojaOptionsHtml('')}</select>
      <input type="date" id="filtroData">
      <input type="text" id="filtroBusca" placeholder="Buscar cliente/vendedora...">
      <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--danger);">
        <input type="checkbox" id="filtroSemPagamento"> Só sem pagamento
      </label>
      <button class="btn btn-ghost btn-sm" id="btnLimparFiltroVendas">Limpar filtros</button>
    </div>
    <div id="resumoValoresVendas" class="muted" style="margin:2px 0 12px; font-size:13px;"></div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <div id="tabelaVendasWrap"></div>
    </div>
  `;
  const fLoja = document.getElementById('filtroLoja');
  const fData = document.getElementById('filtroData');
  const fBusca = document.getElementById('filtroBusca');
  const fSemPagamento = document.getElementById('filtroSemPagamento');

  function itensResumo(v){
    return (v.itens||[]).map(it=>`${it.quantidade}x ${escapeHtml(it.produto)}${it.metal?' ('+escapeHtml(it.metal)+')':''}`).join(', ');
  }

  function renderTable(){
    let list = [...vendas];
    if(fLoja.value) list = list.filter(v=>v.lojaId===fLoja.value);
    if(fData.value) list = list.filter(v=>v.data===fData.value);
    if(fBusca.value.trim()){
      const q = fBusca.value.trim().toLowerCase();
      list = list.filter(v=> (v.cliente||'').toLowerCase().includes(q) || (v.vendedora||'').toLowerCase().includes(q));
    }
    if(fSemPagamento.checked) list = list.filter(v=>semPagamentoLancado(v));
    list.sort((a,b)=> b.criadoEm - a.criadoEm);

    const totalRecebido = list.reduce((acc,v)=> acc + valorRecebidoDe(v), 0);
    const totalAReceber = list.reduce((acc,v)=> acc + valorAReceberDe(v), 0);
    const semPagCount = list.filter(v=>semPagamentoLancado(v)).length;
    document.getElementById('resumoValoresVendas').innerHTML =
      `Nesta lista: <b style="color:var(--ok);">Recebido R$ ${totalRecebido.toFixed(2)}</b> · <b style="color:var(--danger);">A receber R$ ${totalAReceber.toFixed(2)}</b>` +
      (semPagCount>0 ? ` · <b style="color:var(--danger);">${semPagCount} sem pagamento lançado</b>` : '');

    const wrap = document.getElementById('tabelaVendasWrap');
    if(list.length===0){ wrap.innerHTML = `<div class="empty">Nenhuma venda encontrada com esses filtros.</div>`; return; }
    wrap.innerHTML = `
      <table>
        <thead><tr><th>Data</th><th>Loja</th><th>Vendedora</th><th>Cliente</th><th>Itens</th><th>Recebido</th><th>A receber</th><th>Ações</th></tr></thead>
        <tbody>
          ${list.map(v=>{
            const semPag = semPagamentoLancado(v);
            const recebido = valorRecebidoDe(v);
            const aReceber = valorAReceberDe(v);
            return `
            <tr>
              <td>${fmtDate(v.data)}</td>
              <td><span class="badge badge-loja">${escapeHtml(v.loja)}</span></td>
              <td>${escapeHtml(v.vendedora)}</td>
              <td>${escapeHtml(v.cliente||'—')}${semPag ? `<div style="margin-top:4px; color:var(--danger); font-weight:700; font-size:11.5px;">⚠ Sem pagamento lançado</div>` : ''}</td>
              <td>${itensResumo(v)}</td>
              <td style="color:var(--ok); white-space:nowrap;">R$ ${recebido.toFixed(2)}</td>
              <td style="${aReceber>0?'color:var(--danger); font-weight:700;':''} white-space:nowrap;">R$ ${aReceber.toFixed(2)}</td>
              <td style="white-space:nowrap;">
                <button class="icon-btn" data-view="${v.id}" title="Ver detalhes">👁</button>
                ${currentUser.nivel==='diretoria' ? `<button class="icon-btn" data-del="${v.id}" title="Excluir">🗑️</button>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', ()=> abrirDetalheVenda(vendas.find(x=>x.id===b.dataset.view)) ));
    wrap.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Excluir esta venda? Essa ação não pode ser desfeita.')) return;
        const id = b.dataset.del;
        const ok = await vendaExcluir(id);
        if(ok){ vendas = vendas.filter(x=>x.id!==id); showToast('Venda excluída.'); renderTable(); }
      });
    });
  }
  [fLoja,fData,fBusca,fSemPagamento].forEach(el=>el.addEventListener('input', renderTable));
  document.getElementById('btnLimparFiltroVendas').addEventListener('click', ()=>{
    fLoja.value=''; fData.value=''; fBusca.value=''; fSemPagamento.checked=false; renderTable();
  });
  renderTable();
}

function abrirDetalheVenda(v){
  if(!v) return;
  const paymentTypesMap = {}; (config.formasPagamento||[]).forEach(pt=>{ paymentTypesMap[pt.id]=pt.nome; }); paymentTypesMap['__credito']='Crédito do cliente'; paymentTypesMap['__fiado']='Fiado';
  const nomeLoja = (id)=> { const l = (config.lojas||[]).find(x=>x.id===id); return l ? l.nome : '—'; };
  openModal(`
    <h3>Venda — ${escapeHtml(v.cliente || 'cliente não identificado')}</h3>
    <p class="muted">${fmtDate(v.data)} · ${escapeHtml(v.loja)} · Vendedora ${escapeHtml(v.vendedora)}</p>
    <div class="section-label" style="margin-top:14px;">Itens</div>
    <table>
      <thead><tr><th>Produto</th><th>Metal</th><th>Qtd.</th><th>Valor unit.</th></tr></thead>
      <tbody>
        ${(v.itens||[]).map(it=>`<tr><td>${escapeHtml(it.produto)}</td><td>${escapeHtml(it.metal||'—')}</td><td>${it.quantidade}</td><td>R$ ${Number(it.valorUnitario||0).toFixed(2)}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="section-label" style="margin-top:14px;">Pagamento</div>
    <table>
      <tr><td class="muted" style="width:150px;">Momento</td><td>${v.momentoPagamento==='na_volta' ? 'Pagar na volta' : 'Pago no ato da venda'}</td></tr>
      <tr><td class="muted">Valor total</td><td>R$ ${Number(v.valorTotal||0).toFixed(2)}</td></tr>
      ${(v.pagamentos||[]).filter(p=>p.formaId).map(p=>`<tr><td class="muted">${escapeHtml(paymentTypesMap[p.formaId]||'—')}</td><td>R$ ${Number(p.valor||0).toFixed(2)}</td></tr>`).join('')}
      <tr><td class="muted">Recebido</td><td>R$ ${valorRecebidoDe(v).toFixed(2)}</td></tr>
      <tr><td class="muted">A receber</td><td>R$ ${valorAReceberDe(v).toFixed(2)}</td></tr>
      ${v.emissaoNota==='sim' ? `
        <tr><td class="muted">Nota</td><td>${escapeHtml(v.numeroNota||'—')}</td></tr>
        <tr><td class="muted">Saída da joia</td><td>${escapeHtml(nomeLoja(v.lojaSaidaId))}</td></tr>
        <tr><td class="muted">Recebeu pagamento</td><td>${escapeHtml(nomeLoja(v.lojaPagamentoId))}</td></tr>
        <tr><td class="muted">Emitiu a nota</td><td>${escapeHtml(nomeLoja(v.lojaNotaId))}</td></tr>
      ` : ''}
    </table>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnImprimirVenda">🖨️ Imprimir</button>
      <button class="btn btn-ghost" id="fecharDetalheVenda">Fechar</button>
    </div>
  `);
  document.getElementById('fecharDetalheVenda').addEventListener('click', closeModal);
  document.getElementById('btnImprimirVenda').addEventListener('click', ()=> printVenda(v));
}

/** Abre uma janela de impressão em formato de bobina (recibo térmico), com a largura configurada. */
function abrirImpressaoBobina(titulo, conteudoHtml, larguraMm){
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titulo)}</title>
<style>
  @page{ margin:0; }
  body{ font-family:'Courier New', monospace; width:${larguraMm}mm; margin:0 auto; padding:6mm 3mm; color:#000; font-size:11.5px; line-height:1.45; }
  .titulo{ font-size:14px; font-weight:700; text-align:center; }
  .sub{ font-size:10.5px; color:#333; text-align:center; }
  .linha{ border-top:1px dashed #000; margin:6px 0; }
  b{ font-weight:700; }
  @media print{ body{ padding:2mm 2mm; } }
</style>
</head>
<body>
  ${conteudoHtml}
</body>
</html>`;
  const printWin = window.open('', '_blank', 'width=420,height=700');
  if(!printWin){ showToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups do navegador.'); return; }
  printWin.document.open();
  printWin.document.write(html);
  printWin.document.close();
  printWin.focus();
  setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 300);
}

function printVenda(v){
  const paymentTypesMap = {}; (config.formasPagamento||[]).forEach(pt=>{ paymentTypesMap[pt.id]=pt.nome; }); paymentTypesMap['__credito']='Crédito do cliente'; paymentTypesMap['__fiado']='Fiado';
  const imp = (config.impressao && config.impressao.vendas) || {};
  const larguraMm = (config.impressao && config.impressao.larguraBobina) || 80;

  const linhas = [];
  linhas.push(`<div class="titulo">VENDA</div>`);
  linhas.push(`<div class="sub">${escapeHtml(v.loja)}</div>`);
  linhas.push(`<div class="sub">${fmtDate(v.data)}</div>`);
  linhas.push(`<div class="linha"></div>`);

  if(imp.cliente !== false){
    linhas.push(`<div><b>Cliente:</b> ${escapeHtml(v.cliente||'—')}</div>`);
  }
  if(imp.telefone !== false && v.telefone){
    linhas.push(`<div><b>Telefone:</b> ${escapeHtml(v.telefone)}</div>`);
  }
  if(imp.vendedora !== false){
    linhas.push(`<div><b>Vendedora:</b> ${escapeHtml(v.vendedora||'—')}</div>`);
  }

  if(imp.itens !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>ITENS</b></div>`);
    (v.itens||[]).forEach(it=>{
      linhas.push(`<div>${escapeHtml(it.produto)}${it.metal?' ('+escapeHtml(it.metal)+')':''} x${it.quantidade} — R$ ${Number(it.valorUnitario||0).toFixed(2)}</div>`);
    });
  }

  if(imp.valores !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div>Valor total: R$ ${Number(v.valorTotal||0).toFixed(2)}</div>`);
    linhas.push(`<div>Recebido: R$ ${valorRecebidoDe(v).toFixed(2)}</div>`);
    linhas.push(`<div>A receber: R$ ${valorAReceberDe(v).toFixed(2)}</div>`);
  }
  if(imp.formaPagamento !== false){
    (v.pagamentos||[]).filter(p=>p.formaId).forEach(p=>{
      linhas.push(`<div>${escapeHtml(paymentTypesMap[p.formaId]||'—')}: R$ ${Number(p.valor||0).toFixed(2)}</div>`);
    });
  }

  abrirImpressaoBobina('Venda', linhas.join(''), larguraMm);
}
