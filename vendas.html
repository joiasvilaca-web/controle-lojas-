<script>
/* ===== WhatsApp automático (05/11): o ícone do WhatsApp dispara a via/mensagem direto pelo número da loja (função enviar-via).
   Sempre pelo número de atendimento cadastrado; se estiver desconectado, avisa e NÃO abre o WhatsApp comum (regra 09/11). ===== */
(function(){
  var emAndamento = false;
  function aviso(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  /* opts: { telefone, texto, lojaId, senha, tipo:'venda'|'os'|'orcamento', registroId, via } */
  async function enviar(opts){
    if(emAndamento) return;
    if(String(window.SUPABASE_URL||'').indexOf('mpgkvstzigeaimuynpxc')>=0){ aviso('TREINAMENTO: o envio de WhatsApp fica desligado aqui — nada sai para clientes. Na versão oficial a via é enviada normalmente.'); return; }
    emAndamento = true;
    aviso('Enviando pelo WhatsApp da loja…');
    try{
      var r = await fetch(window.SUPABASE_URL + '/functions/v1/enviar-via', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'apikey':window.SUPABASE_ANON_KEY, 'Authorization':'Bearer '+window.SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha:opts.senha, lojaId:opts.lojaId, telefone:opts.telefone, texto:opts.texto, tipo:opts.tipo, registroId:opts.registroId, via:opts.via })
      });
      var j = await r.json().catch(function(){ return {}; });
      if(j && j.ok){ aviso('Enviado pelo WhatsApp da loja ✓'); return; }
      if(j && j.fallback){ aviso((j.erro||'O WhatsApp de atendimento está desconectado.')+' A via NÃO foi enviada — avise a diretoria para reconectar o número e tente de novo.'); return; }
      aviso((j && (j.erro||j.error)) || 'Não foi possível enviar.');
    }catch(e){
      console.error('WhatsAuto:', e);
      aviso('Sem conexão com o envio automático. A via NÃO foi enviada — confira a internet e tente de novo.');
    }finally{ emAndamento = false; }
  }
  window.WhatsAuto = { enviar: enviar };
})();

</script>

<script>/* condicoes-pagamento (embutido em vendas.html) */
/* Condições de pagamento — à vista x parcelado no cartão (Venda, Pedido, Reserva, Orçamento).
 * Regra (Felipe, 01/nov):
 *  - À vista (Dinheiro, PIX, Ouro, Fiado, Crédito, Cashback): 1x, valor após o desconto.
 *  - Cartão: sempre 20% acima do à vista (mesmo em 1x), em até 12x sem acréscimo.
 *  - No pagamento com cartão, `valor` é o que passa na maquininha (com os 20%);
 *    `valorBase` é a parte do à vista que ele quita (valor / 1,2). O valorTotal da via
 *    continua sendo o à vista — saldo/"a receber" é conferido pela base.
 *  - Na via impressa: valor total sem desconto, desconto à vista e desconto parcelado
 *    (em reais, sem porcentagem).
 */
(function(){
  var FATOR = 1.2, MAX_PARC = 12;
  function r2(n){ return Math.round((Number(n)||0)*100)/100; }
  function formas(config){ return ((config && config.formasPagamento) || []).concat((config && config.paymentTypes) || []); }
  /* 07/11 (Felipe): DÉBITO deixa de ter os 20% do cartão — fica igual ao Pix — para pagamentos de 08/11/2026 em diante.
     Pagamento antigo (data anterior ao corte) continua como cartão, para não mexer em vias já lançadas. */
  var CORTE_DEBITO = '2026-11-07';   // antecipado a pedido (07/11): pagamento de débito de 07/11 em diante sem acréscimo; os 4 de 07/11 já lançados com 20% levam debitoAntigo:true
  function hojeLocal(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function ehDebito(f){ var n = (f && f.nome) || ''; return /d[eé]bito/i.test(n) && !/cr[eé]dito|link\s*eco/i.test(n); }
  function ehCartao(formaId, config, p){
    if(!formaId || String(formaId).indexOf('__')===0) return false;
    var f = formas(config).filter(function(x){ return x.id===formaId; })[0];
    var cart = !!(f && (f.cartao===true || /cart[aã]o|cr[eé]dito|d[eé]bito|link\s*eco/i.test(f.nome||'')));   // LINK ECO = cartão (04/11)
    if(cart && ehDebito(f)){ if(p && p.debitoAntigo) return true; var d = String((p && p.data) || '').slice(0,10) || hojeLocal(); if(d >= CORTE_DEBITO) return false; }
    return cart;
  }
  /* Formas "a prazo": cartão e, quando o módulo liga CondPag.fiadoPrazo, o Fiado (Felipe, 02/nov). */
  function ehPrazo(formaId, config, p){
    return ehCartao(formaId, config, p) || (formaId==='__fiado' && !!(window.CondPag && window.CondPag.fiadoPrazo));
  }
  /* Quanto do valor à vista este pagamento quita. */
  function base(p, config){
    var v = Number(p && p.valor) || 0;
    if(p && p.noTotal) return v;   // venda concluída: o valor da maquininha já está dentro do valorTotal
    return ehPrazo(p && p.formaId, config, p) ? r2(v / FATOR) : v;
  }
  function somaBase(pags, config, filtro){
    return (pags||[]).filter(filtro || function(){ return true; }).reduce(function(a,p){ return a + base(p, config); }, 0);
  }
  function parcelado(vista){ return r2((Number(vista)||0) * FATOR); }
  /* Cartão sugerido pelo sistema (_auto) acompanha o à vista final: se o total mudar (desconto,
     acréscimo, item), o valor da maquininha é refeito = (à vista que falta) × 1,2. Valor digitado à mão não muda. */
  function ajustarAuto(pags, totalVista, config){
    (pags||[]).forEach(function(p){
      if(!p || !p._auto || !ehPrazo(p.formaId, config, p)) return;
      var outros = somaBase((pags||[]).filter(function(q){ return q!==p && q._modo!=='editar'; }), config);
      var falta = Math.max(0, r2((Number(totalVista)||0) - outros));
      p.valor = falta > 0.009 ? parcelado(falta) : p.valor;
    });
  }
  /* Ajusta os campos de cartão antes de gravar (parcelas e valorBase). */
  function carimbar(pags, config){
    (pags||[]).forEach(function(p){
      delete p._auto;
      if(ehCartao(p.formaId, config, p)){
        p.parcelas = Math.min(MAX_PARC, Math.max(1, parseInt(p.parcelas,10) || 1));
        p.valorBase = base(p, config);
      } else if(ehPrazo(p.formaId, config, p)){ delete p.parcelas; p.valorBase = base(p, config); }
      else { delete p.parcelas; delete p.valorBase; }
    });
    return pags;
  }
  /* Venda concluída (Felipe, 02/nov): o total passa a ser o que o cliente pagou de fato.
     Os 20% do cartão entram no valorTotal; o à vista fica guardado em valorAVista. */
  function fecharTotal(via, config){
    if(!via) return via;
    var acr = 0;
    (via.pagamentos||[]).forEach(function(p){
      if(!p || p.noTotal || !ehPrazo(p.formaId, config, p)) return;
      var v = Number(p.valor)||0;
      acr += r2(v - r2(v / FATOR));
      p.valorBase = v; p.noTotal = true;
    });
    acr = r2(acr);
    if(!(Number(via.valorTotal) > 0)){   // segurança: sem total à vista, usa o que os pagamentos quitam (cartão pela base)
      via.valorTotal = r2((via.pagamentos||[]).reduce(function(a,p){ return a + (p && p.noTotal ? r2((Number(p.valor)||0) / FATOR) : base(p, config)); }, 0));
    }
    if(acr > 0.009){
      if(via.valorAVista == null) via.valorAVista = r2(via.valorTotal);
      via.valorTotal = r2((Number(via.valorTotal)||0) + acr);
      via.acrescimoCartao = r2((Number(via.acrescimoCartao)||0) + acr);
    }
    return via;
  }
  /* Ao editar: volta ao à vista (o fecharTotal refaz ao salvar). */
  function abrirTotal(via, config){
    if(!via) return via;
    if(via.valorAVista == null) return via;   // venda antiga sem acréscimo: o valor pago já é o total
    via.valorTotal = r2(via.valorAVista);
    delete via.valorAVista; delete via.acrescimoCartao;
    (via.pagamentos||[]).forEach(function(p){ if(p && p.noTotal){ delete p.noTotal; p.valorBase = r2((Number(p.valor)||0) / FATOR); } });
    return via;
  }
  function rotuloPag(p, nomeForma, config, fmt){
    nomeForma = String(nomeForma||'').toUpperCase();   // forma de pagamento sempre em maiúsculas (Felipe, 02/nov)
    if(ehCartao(p.formaId, config, p)){
      var n = Math.max(1, parseInt(p.parcelas,10) || 1);
      return nomeForma + ' ' + n + 'x de ' + fmt(r2((Number(p.valor)||0)/n));
    }
    return nomeForma;
  }
  /* <select> de parcelas para a linha de pagamento em edição. */
  function selectParcelasHtml(p, i, fmt){
    var n = Math.max(1, parseInt(p.parcelas,10) || 1), v = Number(p.valor)||0, o = '';
    for(var k=1;k<=MAX_PARC;k++) o += '<option value="'+k+'"'+(k===n?' selected':'')+'>'+k+'x'+(v>0?' de '+fmt(r2(v/k)):'')+'</option>';
    return '<select data-pagparc="'+i+'" aria-label="Parcelas no cartão" title="Parcelas (até 12x sem acréscimo)">'+o+'</select>';
  }
  /* Valor bruto dos itens (preço de tabela, antes de qualquer desconto). */
  function brutoItens(itens){
    return r2((itens||[]).reduce(function(a,it){
      var b = (it.ajusteTipo && it.ajusteTipo!=='nenhum' && it.precoOriginal!=='' && it.precoOriginal!=null) ? it.precoOriginal : it.valorUnitario;
      return a + (Number(b)||0) * (Number(it.quantidade)||1);
    }, 0));
  }
  /* Fim da via: só o à vista e o parcelado no cartão (pedido do Felipe, 01/nov). */
  function cupomHtml(itens, valorAVista, fmt){
    var vista = r2(valorAVista);
    if(!(vista > 0)) return '';
    return '<div class="linha"></div>'
      + '<div class="destaque">À vista: '+fmt(vista)+'</div>'
      + '<div class="destaque">Ou '+MAX_PARC+'x de '+fmt(r2(parcelado(vista)/MAX_PARC))+' no cartão</div>';
  }
  /* Linha da observação do item na via. */
  function obsItemHtml(it, esc){
    var t = String((it && it.observacaoItem) || '').trim();
    return t ? '<div style="font-size:11px;">Obs.: '+esc(t)+'</div>' : '';
  }
  window.CondPag = { FATOR:FATOR, MAX_PARC:MAX_PARC, r2:r2, ehCartao:ehCartao, ehPrazo:ehPrazo, fiadoPrazo:false, base:base, somaBase:somaBase, parcelado:parcelado, ajustarAuto:ajustarAuto,
    carimbar:carimbar, fecharTotal:fecharTotal, abrirTotal:abrirTotal, rotuloPag:rotuloPag, selectParcelasHtml:selectParcelasHtml, brutoItens:brutoItens, cupomHtml:cupomHtml, obsItemHtml:obsItemHtml };
})();
</script>

<style>
/* Vendas (PDV) — cores SEMPRE pelas variáveis do tema (tema.css). Nada de hex aqui. */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.so-cel{display:none;}

/* ---------- login e cabeçalho (só quando a tela abre fora do app) ---------- */
.hub-back-link{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.hub-back-link:hover{color:rgba(255,255,255,1);}
.login-card .hub-back-link{color:var(--ink-faint);}
#view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--t-dark);}
.login-card{background:var(--surface);border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:var(--t-shadow-lg);}
.login-tag{font-size:12px;font-weight:700;color:var(--accent);margin:16px 0 6px;}
.login-title{font-size:22px;letter-spacing:-.015em;font-weight:700;margin:0 0 6px;}
.login-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
.login-error{display:none;background:var(--danger-soft);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint);font-size:12.5px;margin-top:12px;line-height:1.5;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;background:var(--t-dark);color:rgba(255,255,255,.95);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
.brand-name{font-weight:700;font-size:15px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);border:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
.tabs button.active{background:var(--t-primary-strong);color:rgba(255,255,255,1);}
.who{display:flex;align-items:center;gap:10px;font-size:13px;}
.level-pill{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.icon-btn{background:none;border:none;color:inherit;cursor:pointer;padding:6px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:rgba(255,255,255,.1);}
.icon-btn-sair:hover{background:rgba(242,133,122,.25);}

/* ---------- página ---------- */
#mainContent{max-width:1120px;margin:0 auto;padding:24px 24px 96px;}
#mainContent.modo-pdv{max-width:1360px;padding-bottom:24px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.page-title{font-size:20px;letter-spacing:-.015em;font-weight:700;margin:0 0 4px;color:var(--ink);}
.page-sub{color:var(--muted);font-size:13.5px;margin:0;line-height:1.5;}
.page-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.link-voltar{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink-faint);text-decoration:none;}
.link-voltar:hover{color:var(--accent);}
.atalhos{font-size:12px;color:var(--ink-faint);}
.atalhos kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--ink-soft);font:600 11px/1.5 var(--t-font);text-align:center;}

.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid var(--line);box-shadow:var(--t-shadow-sm);}
.card-tabela{padding:4px 8px;overflow-x:auto;}
.section-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0 0 14px;}
.section-label .ico{color:var(--accent);}
.section-label .conta{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-faint);}
.muted{color:var(--muted);font-size:13px;}
.empty{color:var(--ink-faint);font-size:13.5px;padding:14px 0;line-height:1.5;}
.estado-vazio{padding:40px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.5;}
.estado-vazio .ico{display:block;margin:0 auto 10px;color:var(--line-strong);}
.estado-vazio b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;}
.so-leitor{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ---------- campos ---------- */
.field{margin-bottom:12px;min-width:0;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;}
.field input:not([type=checkbox]):not([type=radio]),.field select{min-height:40px;}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=email],select{padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;min-height:40px;}
textarea{padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }

/* ---------- botões ---------- */
.btn{border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;min-height:40px;white-space:nowrap;background:var(--surface);color:var(--ink);}
.btn-accent,.btn-primary{background:var(--t-primary-strong);border-color:var(--t-primary-strong);color:rgba(255,255,255,1);}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);}
.btn-danger{background:var(--danger);border-color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:6px 12px;font-size:12.5px;min-height:32px;gap:6px;}
.btn-lg{padding:12px 22px;font-size:15px;min-height:48px;}
.btn-link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.btn-link:hover{color:var(--accent-ink);}
.btn-icone.perigo{color:var(--danger);}

/* ---------- selos ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap;}
.badge-loja{background:var(--surface-2);color:var(--ink-soft);font-weight:700;letter-spacing:.02em;}
.selo-ok{background:var(--ok-soft);color:var(--ok);}
.selo-wait{background:var(--wait-soft);color:var(--wait);}
.selo-danger{background:var(--danger-soft);color:var(--danger);}
.selo-info{background:var(--t-info-soft);color:var(--info);}
.selo-neutro{background:var(--surface-2);color:var(--ink-faint);}

/* ---------- filtros e resumo ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow-sm);}
.filters select,.filters input[type=date],.filters input[type=text]{font-size:13.5px;}
.filters select{flex:0 1 220px;}
.campo-busca{position:relative;flex:1 1 240px;min-width:0;}
.campo-busca .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
.campo-busca input{width:100%;padding-left:34px !important;}
.chk-chip{display:inline-flex;align-items:center;gap:8px;padding:0 12px;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;user-select:none;background:var(--surface);}
.chk-chip:has(input:checked){background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.resumo-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--t-shadow-sm);min-width:0;}
.kpi-rot{font-size:12.5px;font-weight:600;color:var(--ink-faint);display:flex;align-items:center;gap:6px;}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-.015em;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-nota{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.kpi-ok .kpi-val{color:var(--ok);}
.kpi-danger .kpi-val{color:var(--danger);}
.kpi-nota.alerta{color:var(--danger);font-weight:600;}
.faixa-resumo{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:13.5px;color:var(--ink-soft);}
.faixa-resumo b{color:var(--ink);font-variant-numeric:tabular-nums;}
.faixa-resumo .alerta{color:var(--danger);}
.faixa-resumo .atencao{color:var(--wait);}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
td.num b{font-weight:700;}
th.acoes,td.acoes{text-align:right;width:1%;white-space:nowrap;}
.td-via{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;}
.cli-nome{font-weight:600;color:var(--ink);}
.selos-linha{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
tr.linha-cancelada td{color:var(--ink-faint);}
tr.linha-cancelada .cli-nome{text-decoration:line-through;color:var(--ink-faint);}
.valor-ok{color:var(--ok);}
.valor-falta{color:var(--danger);font-weight:700;}
.acoes-linha{display:inline-flex;gap:2px;align-items:center;}
.tabela-kv td:first-child{color:var(--ink-faint);width:170px;}
.tabela-kv td{padding:8px 4px;}

/* menu "Mais ações" da linha */
.menu-acoes{position:fixed;z-index:70;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);padding:6px;display:none;}
.menu-acoes.aberto{display:block;}
.menu-acoes button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left;}
.menu-acoes button:hover,.menu-acoes button:focus-visible{background:var(--surface-2);}
.menu-acoes button .ico{color:var(--ink-faint);}
.menu-acoes button.perigo,.menu-acoes button.perigo .ico{color:var(--danger);}
.menu-acoes hr{border:0;border-top:1px solid var(--line);margin:4px 0;}

/* ---------- nova venda (PDV) ---------- */
.pdv-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start;}
.pdv-lado{position:sticky;top:16px;}
.pdv-barra{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:4px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow);}
.pdv-barra-total{display:flex;flex-direction:column;min-width:0;}
.pdv-barra-total span{font-size:12.5px;font-weight:600;color:var(--ink-faint);}
.pdv-barra-total strong{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15;}
.pdv-barra-status{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.pdv-barra-status.falta{color:var(--wait);}
.pdv-barra-status.excede{color:var(--danger);}
.pdv-barra-status.ok{color:var(--ok);}
.pdv-barra-status.neutro{color:var(--ink-faint);font-weight:500;}
.pdv-barra-acoes{margin-left:auto;display:flex;gap:8px;align-items:center;}
.loja-fixa{display:flex;align-items:center;gap:8px;min-height:40px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);}
.loja-fixa .ico{color:var(--ink-faint);}
.banner-orc{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 16px;background:var(--accent-soft);border:1px solid var(--t-primary-line);border-radius:12px;margin-bottom:16px;font-size:13.5px;color:var(--ink);}
.banner-orc .ico{color:var(--accent);}

/* itens */
.item-row{border:1px solid var(--line-strong);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface);}
.item-row-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.item-row-produto{flex:1 1 240px;min-width:200px;}
.item-row-valor{width:120px;flex-shrink:0;position:relative;}
.item-row-valor::before{content:"R$";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:600;color:var(--ink-faint);pointer-events:none;}
.item-row-valor input{width:100%;padding:8px 8px 8px 32px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;height:40px;text-align:right;font-variant-numeric:tabular-nums;}
.item-row-desc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;order:5;flex:1 1 100%;}
.btn-ajuste{padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-soft);height:36px;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s;}
.btn-ajuste:hover{background:var(--surface-2);}
.btn-ajuste.ativo-desc{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
.btn-ajuste.ativo-acr{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);}
.item-row-desc .campo-perc,.item-row-desc .campo-val,.campo-perc,.campo-val{width:76px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;height:36px;min-height:36px;background:var(--surface);color:var(--ink);}
.desc-sep{font-size:12px;color:var(--ink-faint);font-weight:600;}
.desc-total{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums;}
.prod-ac-fator-inline{font-size:12px;color:var(--ok);white-space:nowrap;flex-shrink:0;}
.item-row-obs{margin-top:8px;}
.item-row-rodape{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;}
.chk-avulso{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
.btn-add-item{display:inline-flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--t-primary-strong);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--t-primary-strong);color:rgba(255,255,255,1);height:40px;white-space:nowrap;flex-shrink:0;}
.btn-add-item:hover{background:var(--t-primary-dark);border-color:var(--t-primary-dark);}
.lista-itens-ok{display:flex;flex-direction:column;gap:6px;}
.venda-item-compact{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13.5px;}
.venda-compact-nome{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.venda-compact-val{font-size:14px;font-weight:700;color:var(--ink);flex-shrink:0;font-variant-numeric:tabular-nums;text-align:right;}
.venda-compact-val small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-faint);}
.venda-compact-obs{font-size:12.5px;color:var(--ink-soft);margin:-2px 0 4px;padding:6px 10px;background:var(--surface-2);border-radius:8px;display:none;}
.venda-compact-icones{display:flex;gap:2px;flex-shrink:0;}
.venda-compact-btn.tem-obs{color:var(--accent);}
.obs-geral-box label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.obs-geral-box textarea,.info-interna-box textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;resize:vertical;min-height:64px;background:var(--surface);color:var(--ink);font-family:inherit;}
.info-interna-box{margin-top:12px;}
.info-interna-box textarea{border-style:dashed;border-color:var(--wait);background:var(--wait-soft);}
.info-interna-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;background:var(--wait-soft);color:var(--wait);border-radius:999px;font-size:12px;font-weight:600;margin-bottom:6px;}
.item-row-obs input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--ink);}
.prod-ac-wrap{position:relative;}
.prod-ac-input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);outline:none;min-width:0;min-height:40px;}
.prod-ac-input:focus{border-color:var(--accent);box-shadow:var(--t-ring);}
.prod-ac-drop,.cli-ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);max-height:260px;overflow-y:auto;z-index:1300;}
.prod-ac-item{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);}
.prod-ac-item:last-child{border-bottom:none;}
.prod-ac-item:hover,.prod-ac-item.pf{background:var(--accent-soft);}
.prod-ac-item b{display:block;font-size:13.5px;font-weight:600;}
.prod-ac-item span{font-size:12px;color:var(--ink-faint);}
.prod-ac-sel{display:flex;align-items:center;gap:8px;background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:0 4px 0 11px;min-height:40px;font-size:14px;min-width:0;}
.prod-ac-sel b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ok);font-weight:600;}
.prod-ac-sel .pa-clr{background:none;border:none;cursor:pointer;color:var(--ok);padding:4px;border-radius:6px;display:inline-flex;flex-shrink:0;}
.prod-ac-sel .pa-clr:hover{background:var(--surface);}
.prod-ac-fator{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.item-row-estoque{margin-top:8px;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);}
.item-row-estoque .ico{color:var(--ink-faint);}
.disp-ok{color:var(--ok);} .disp-falta{color:var(--danger);}
.cv-radio{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.4;}
.cv-radio input[type=radio]{width:18px;height:18px;min-height:0;flex:0 0 18px;margin:2px 0 0;padding:0;}
.cv-radio span{flex:1;min-width:0;}
.aviso{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;margin-top:8px;border:1px solid;}
.aviso .ico{margin-top:1px;}
.aviso-wait{background:var(--wait-soft);border-color:var(--wait);color:var(--wait);}
.aviso-danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.aviso-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.aviso-info{background:var(--accent-soft);border-color:var(--t-primary-line);color:var(--ink);}
.aviso small{display:block;font-weight:500;margin-top:2px;color:var(--ink-soft);}
.total-itens{display:flex;justify-content:flex-end;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);}
.total-itens{flex-wrap:wrap;}
.total-itens .pend{margin-right:auto;}
.total-itens b{white-space:nowrap;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;}

/* pagamento */
.pag-ajuste{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;}
.pag-ajuste-rot{font-size:12.5px;font-weight:600;color:var(--ink-faint);}
.pag-ajuste-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
.pag-ajuste-ctrl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;flex:1 1 100%;}
.pag-ajuste-ctrl input{min-width:0;width:100% !important;}
.pag-ajuste-fim{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.pag-ajuste-fim.desc{color:var(--danger);} .pag-ajuste-fim.acr{color:var(--ok);}
.pag-info-row{display:flex;flex-wrap:wrap;gap:14px 16px;padding:14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;margin-bottom:12px;}
.pag-info-cel{display:flex;flex-direction:column;gap:2px;flex:1 1 100%;}
.pag-info-cel-label{font-size:12.5px;font-weight:600;color:var(--ink-faint);display:flex;align-items:center;}
.pag-info-cel-val{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;}
.pag-toggle-cel{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;}
.toggle-group{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface);}
.toggle-opt{flex:1;position:relative;}
.toggle-opt input[type="radio"]{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
.toggle-opt label{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);white-space:nowrap;user-select:none;transition:background-color .15s,color .15s;}
.toggle-opt label:hover{background:var(--surface-2);color:var(--ink);}
.toggle-opt input[type="radio"]:checked + label{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);}
.toggle-opt input[type="radio"]:focus-visible + label{box-shadow:var(--t-ring);}
.toggle-opt:not(:last-child) label{border-right:1px solid var(--line-strong);}
.pag-toggle-inner .toggle-opt{flex:1 1 auto;}
.pag-linha{display:grid;grid-template-columns:minmax(0,1fr) 130px 40px;gap:8px;margin-bottom:8px;align-items:center;}
.pag-linha select,.pag-linha input{width:100%;}
.pag-linha input{text-align:right;font-variant-numeric:tabular-nums;}
.pag-vazio{font-size:13px;color:var(--ink-faint);padding:4px 0 10px;}

/* cliente */
.cli-ac-wrap{position:relative;}
.cli-ac-input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);outline:none;min-height:40px;}
.cli-ac-input:focus{border-color:var(--accent);box-shadow:var(--t-ring);}
.cli-ac-item{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
.cli-ac-item:last-child{border-bottom:none;}
.cli-ac-item:hover,.cli-ac-item.focused{background:var(--accent-soft);}
.cli-ac-item b{font-size:13.5px;font-weight:600;}
.cli-ac-item span{font-size:12px;color:var(--ink-faint);}
.cli-ac-msg{padding:10px 12px;font-size:13px;color:var(--ink-faint);}
.cli-ac-selecionado{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:6px 6px 6px 12px;min-height:40px;font-size:14px;}
.cli-ac-selecionado b{color:var(--ok);flex:1;min-width:0;font-weight:600;}
.cli-ac-selecionado .cli-ac-tel{color:var(--ink-soft);font-size:12.5px;}
.cli-ac-selecionado .cli-ac-clear,.cli-ac-selecionado .cli-ac-edit{background:none;border:none;cursor:pointer;color:var(--ok);padding:4px 8px;border-radius:6px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.cli-ac-selecionado .cli-ac-clear:hover,.cli-ac-selecionado .cli-ac-edit:hover{background:var(--surface);}
.cli-result-card{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);transition:background-color .1s;border-radius:8px;}
.cli-result-card:last-child{border-bottom:none;}
.cli-result-card:hover,.cli-result-card.focused{background:var(--accent-soft);}
.cli-result-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cli-result-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.cli-result-nome{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cli-result-sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.cli-result-tag{font-size:12px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:4px;}

/* bolinha de ajuda (?) */
.ajuda-ponto{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line-strong);font-size:10.5px;font-weight:700;cursor:help;margin-left:5px;vertical-align:middle;position:relative;flex-shrink:0;}
.ajuda-ponto .balao{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:500;line-height:1.5;width:250px;text-align:left;z-index:999;box-shadow:var(--t-shadow-lg);text-transform:none;letter-spacing:0;}
.ajuda-ponto:hover .balao,.ajuda-ponto.aberto .balao{display:block;}
.ajuda-ponto .balao::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);}
@media(max-width:600px){ .ajuda-ponto .balao{width:200px;} }

/* ---------- toast e popups ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s var(--t-ease),transform .2s var(--t-ease);z-index:80;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:24px;}
.modal h3{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0 0 6px;padding-right:28px;line-height:1.3;}
.modal > p.muted:first-of-type{margin-top:0;}
.modal .section-label{margin-top:18px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end;}
.modal-largo{max-width:900px;}
/* 04/11 (Felipe): editar a venda abre a VIA DE VERDADE em tela cheia (não um popup); os botões ficam presos embaixo */
#modalOverlay.tela-cheia{padding:0;align-items:stretch;background:var(--page,#f4f6f8) !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;overflow-y:auto;}
#modalOverlay.tela-cheia #modalBox{max-width:1100px;width:100%;max-height:none;min-height:100%;border:none;border-radius:0;margin:0 auto;padding:22px 28px 0;box-shadow:none;overflow:visible;animation:none;}
#modalOverlay.tela-cheia #modalBox > .modal-actions:last-child{position:sticky;bottom:0;background:var(--surface);margin:24px -28px 0;padding:14px 28px;box-shadow:0 -8px 18px -14px rgba(0,0,0,.35);z-index:4;}
@media (max-width:640px){ #modalOverlay.tela-cheia #modalBox{padding:16px 14px 0;} #modalOverlay.tela-cheia #modalBox > .modal-actions:last-child{margin:20px -14px 0;padding:12px 14px;} }
.orc-aberto{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
.orc-aberto-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.orc-aberto-acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}

/* ---------- barra de abas no celular (fora do app) ---------- */
.mobile-tabbar{display:none;}
@media (max-width:1100px){
  .pdv-grid{grid-template-columns:minmax(0,1fr);}
  .pdv-lado{position:static;}
}
@media (max-width:760px){
  .mobile-tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--t-dark);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;}
  .mobile-tabbar button{flex:1;background:none;border:none;color:rgba(255,255,255,.62);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;}
  .mobile-tabbar button.active{color:rgba(255,255,255,1);}
  .tabs{display:none;}
  #mainContent{padding:16px 16px 96px;}
  #mainContent.modo-pdv{padding-bottom:16px;}
  .card{padding:16px;}
  .card-tabela{padding:0 12px;}
  .resumo-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .resumo-kpis .kpi:first-child{grid-column:1 / -1;}
  .kpi{padding:12px;}

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = window.SUPABASE_URL;        // vem de supabase-config.js
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;  // vem de supabase-config.js
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

/* ============================================================
   ESTADO / STORAGE — a config é a MESMA tabela usada pelo hub,
   pelo O.S. e pelas Transferências: "gestao_config" (id='config').
   Vendas ficam na sua própria tabela "vendas_pdv" (uma linha por venda).
   A partir daqui o app não fala mais direto com o banco: tudo passa pela
   Edge Function "db-gateway", que exige a senha de um acesso válido.
   ============================================================ */
let config = null;
let vendas = [];
let currentUser = null;
const MODO_RESERVA = new URLSearchParams(location.search).get('modo')==='reserva';   // card Reservar
const MODO_CANCEL = new URLSearchParams(location.search).get('modo')==='cancelamento';   // card Cancelamento
const MOD_SHELL = MODO_RESERVA ? 'reserva' : (MODO_CANCEL ? 'cancelamento' : 'vendas');
let reservas = []; let __reservaEditando = null; let __conversaoReserva = null; let __reservaPrazoDias = 7;
let currentTab = 'vendas';
let modoNovaVenda = false;

/* Atalhos de teclado do balcão (PDV). Só age quando não tem modal aberto (senão
 * atrapalharia digitar normalmente dentro do modal) e a tela já está montada. */
document.addEventListener('keydown', (e)=>{
  const modalAberto = document.getElementById('modalOverlay') && document.getElementById('modalOverlay').classList.contains('show');
  if(modalAberto || !currentUser) return;
  if(e.key === 'F2'){
    e.preventDefault();
    if(!modoNovaVenda){ modoNovaVenda = true; renderView(); }
  } else if(e.key === 'F4' && modoNovaVenda){
    e.preventDefault();
    const inp = document.getElementById('cliAcInput');
    if(inp) inp.focus();
  } else if(e.key === 'F8' && modoNovaVenda){
    e.preventDefault();
    const pag = document.getElementById('pagamentoContainerNova');
    if(pag){
      pag.scrollIntoView({ behavior:'smooth', block:'center' });
      const primeiroFoco = pag.querySelector('input, select, button');
      if(primeiroFoco) primeiroFoco.focus();
    }
  } else if(e.key === 'Enter' && modoNovaVenda){
    // Se o foco está num campo de produto dentro dos itens da venda, Enter adiciona
    // a linha (equivalente a clicar "+ Adicionar item") em vez de submeter algo.
    const dentroDosItens = e.target.closest && e.target.closest('#itensContainerNova');
    if(dentroDosItens){
      // confirma via Enter: clica em 'Adicionar' da primeira linha em edição
      const btnPlus = document.querySelector('[data-itadd]');
      if(btnPlus){ e.preventDefault(); btnPlus.click(); }
    }
  }
});
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    if(body && body.op==='searchClients' && window.Busca){ const _bc = await Busca.clientes(GATEWAY_URL, SUPABASE_ANON_KEY, __gatewaySenha, body); if(_bc) return _bc; }   // busca de cliente única (buscar-clientes); se falhar, usa o gateway
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){
  return gatewayCall({ op:'login', senha: senhaTentativa });
}
/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 1000 } });   // o servidor (Supabase) devolve no máximo 1000 linhas por chamada: pedir mais fazia o fim da lista sumir
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/** Busca de produto nos autocompletes: ignora acento e maiúscula, aceita palavras em qualquer ordem
 *  (ex.: "alianca 9 f0,3"), procura também no código interno e mostra primeiro quem começa com o texto digitado. */
function filtrarProdutosBusca(lista, texto){
  // busca única do app (busca.js): por qualquer parte, palavras em qualquer ordem, vírgula = ponto; vem na ordem do que foi digitado
  return Busca.filtrar(lista, texto, p=>[p.nome,p.codigo,p.codigoInterno,p.codigoBarras,p.fator,p.fornecedor], {limite:40});
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }   // data LOCAL (toISOString viraria o dia depois das 21h)
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
/* Evita lançar a mesma venda duas vezes com clique duplo: o botão fica travado até terminar. */
function travarCliqueDuplo(fn){
  return async function(ev){
    const btn = ev && ev.currentTarget;
    if(btn && btn.dataset.salvando) return;
    if(btn){ btn.dataset.salvando = '1'; btn.disabled = true; }
    try{ return await fn.apply(this, arguments); }
    finally{ if(btn){ delete btn.dataset.salvando; btn.disabled = false; } }
  };
}
function fmtMoeda(v){ return window.Fmt ? Fmt.brl(v) : 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
/** Ícone do sistema (icones.js); vazio se o arquivo não carregou. */
function ic(nome, tam){ return window.Icone ? Icone(nome, tam ? { tam } : undefined) : ''; }
/** Botão só de ícone, com título e aria-label (padrão do app para ações de linha). */
function btnIcone(nome, titulo, attrs, perigo){ return `<button type="button" class="btn-icone${perigo?' perigo':''}" title="${escapeHtml(titulo)}" aria-label="${escapeHtml(titulo)}" ${attrs||''}>${ic(nome)}</button>`; }
/* Envia o link da via ao cliente pelo WhatsApp (abre a conversa com a mensagem pronta; quem envia é a vendedora). O mesmo link mostra, sozinho, o botão da retirada por terceiros quando liberada. */
function enviarViaWhatsApp(v){
  if(!v) return;
  let tel = String(v.telefone||'').replace(/\D/g,'');
  if(!tel){ showToast('Esta venda não tem telefone do cliente.'); return; }
  if(tel.length<=11) tel = '55'+tel;
  const link = (window.APP_URL || 'https://vilaca.app') + '/via.html?t=venda&id=' + encodeURIComponent(v.id);
  const nome = String(v.cliente||'').trim().split(/\s+/)[0].toLowerCase();
  const nomeBonito = nome ? nome.charAt(0).toUpperCase()+nome.slice(1) : '';
  const txt = 'Olá' + (nomeBonito?', '+nomeBonito:'') + '! Segue a sua via da Vilaça Joias' + (v.codigoVia?' ('+v.codigoVia+')':'') + ': ' + link;
  if(window.WhatsAuto){ WhatsAuto.enviar({ telefone:tel, texto:txt, lojaId:v.lojaId||'', senha:__gatewaySenha, tipo:'venda', registroId:v.id, via:v.codigoVia||'' }); return; }
  showToast('Envio automático indisponível. Recarregue a página e tente de novo.');
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}
[c])); }
/** Padroniza texto livre em maiúscula ao salvar (nome, endereço, observação...) —
 * nunca aplicar em e-mail, senha, número/CPF/CEP ou campos que vêm de uma lista
 * já controlada (select). */
/* Cria a bolinha "?" com explicação. Uso: ajudaPonto('texto que explica') */
function ajudaPonto(texto){
  return '<span class="ajuda-ponto" onclick="this.classList.toggle(\'aberto\')">?<span class="balao">' +
    String(texto).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) +
    '</span></span>';
}
function maiusc(s){ return (s==null?'':String(s)).trim().toUpperCase(); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){
  if(window.__itensHolderPrev){ window.__itensHolder = window.__itensHolderPrev; window.__itensHolderPrev = null; }
  document.getElementById('modalOverlay').classList.remove('show','tela-cheia');
  document.getElementById('modalBox').innerHTML='';
  if(history.state && history.state.modalAberto) history.back();
}
function telaCheiaModal(){ const ov = document.getElementById('modalOverlay'); ov.classList.add('tela-cheia'); ov.scrollTop = 0; }   // 04/11: edição da via em tela cheia
function openModal(html){
  document.getElementById('modalOverlay').classList.remove('tela-cheia');
  document.getElementById('modalBox').classList.remove('modal-largo');
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  history.pushState({ modalAberto:true }, '');
}
/* 07/11: pergunta POR CIMA da via em edição (Pix PF/loja, abater crédito/cashback, nº da nota): guarda o conteúdo da via, mostra a pergunta e,
   ao fechar, devolve a via intacta. Antes essas perguntas usavam openModal, que trocava o conteúdo da via e o closeModal fechava tudo (a edição era perdida). */
const _subStack = [];
function openSubModal(html){
  const box = document.getElementById('modalBox'), ov = document.getElementById('modalOverlay');
  const wasShown = ov.classList.contains('show');
  const frag = document.createDocumentFragment();
  while(box.firstChild) frag.appendChild(box.firstChild);
  _subStack.push({ frag, wasShown, wasTela: ov.classList.contains('tela-cheia'), wasLargo: box.classList.contains('modal-largo') });
  box.innerHTML = html;
  ov.classList.remove('tela-cheia'); box.classList.remove('modal-largo'); ov.classList.add('show');
  if(!wasShown) history.pushState({ modalAberto:true }, '');
}
function closeSubModal(){
  const s = _subStack.pop();
  if(!s){ closeModal(); return; }
  const box = document.getElementById('modalBox'), ov = document.getElementById('modalOverlay');
  box.innerHTML = '';
  if(!s.wasShown){ closeModal(); return; }

let produtosEstoque = [];
/* ---------- PEDRAS: preço acompanha o dólar do dia ----------
   Produto com `pedraCalc` = { custoUSD, mult, cravacao } (categoria PEDRA).
   Custo R$ = custoUSD × dólar do dia (Fator); Venda = custo R$ × mult + (cravacao ? 50% do serviço Cravação : 0).
   Custo zero = preço zero (pedra ainda sem valor). */
function pedraDolarDia(){ const q=(typeof config!=='undefined' && config && config.fator && config.fator.dolar)||null; const v=q?Number(q.valor):NaN; return isNaN(v)||v<=0?null:v; }
function pedraMeiaCravacao(lista){
  const s=(lista||[]).find(p=>p && /SERVI[CÇ]O\s+CRAVA[CÇ][AÃ]O\s*$/i.test(String(p.nome||'').trim()));
  const v=s?Number(s.precoVenda):NaN;
  return isNaN(v)||v<=0 ? 7.5 : Math.round(v/2*100)/100;
}
function pedraCalcular(pc, dolar, meiaCrav){
  const usd=Number(pc&&pc.custoUSD)||0, mult=Number(pc&&pc.mult)||0;
  if(!usd || !dolar) return { custoBRL: 0, venda: 0 };
  const custoBRL=Math.round(usd*dolar*100)/100;
  const v=Math.round((usd*dolar*mult + (pc.cravacao?meiaCrav:0))*100)/100;
  return { custoBRL, venda: Math.ceil(v-0.000001) };   // preço de venda sempre inteiro (centavos arredondam pra cima)
}
function aplicarPrecoPedras(lista){
  const dolar=pedraDolarDia(); if(!dolar||!Array.isArray(lista)) return lista;
  const meia=pedraMeiaCravacao(lista);
  lista.forEach(p=>{ if(p && p.pedraCalc && Number(p.pedraCalc.custoUSD)>0){ const r=pedraCalcular(p.pedraCalc,dolar,meia); p.custo=r.custoBRL; p.precoVenda=r.venda; } });
  return lista;
}

let __reservadasPorLoja = {};      // lojaId -> { produtoId: qtdReservada }
let __reservadasCarregando = {};   // lojaId -> Promise
let __reservadasFalhou = {};       // lojaId -> true (não tenta de novo em loop)
function reservadasMapaDeLinhas(linhas, lojaId){
  const mapa = {};
  (linhas||[]).forEach(x=>{
    if(!x || !x.produto_id) return;
    if(lojaId && x.loja_id && String(x.loja_id)!==String(lojaId)) return;
    mapa[x.produto_id] = (mapa[x.produto_id]||0) + (Number(x.quantidade)||0);
  });
  return mapa;
}

function carregarReservadas(lojaId){
  if(!lojaId) return Promise.resolve(null);

    __reservadasFalhou[lojaId] = true;

}

/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`,
 * explodindo pela composição (receita) em cascata quando falta estoque em
 * qualquer nível — ex: falta o produto pronto -> usa o insumo secundário ->
 * se também faltar, usa os insumos primários que compõem o secundário.
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`, NA
 * LOJA `lojaId` (estoque agora é por loja, não mais um número global), explodindo
 * pela composição (receita) em cascata quando falta estoque em qualquer nível —
 * ex: falta o produto pronto -> usa o insumo secundário -> se também faltar, usa
 * os insumos primários que compõem o secundário (sempre dentro da mesma loja).
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
function planejarConsumoEstoque(produtoId, quantidadeNecessaria, reservas, lojaId){
  const produto = produtosEstoque.find(p=>p.id===produtoId);
  if(!produto) return { ok:false, faltando:[{ produtoId, nome:'(produto não encontrado)', quantidade:quantidadeNecessaria }] };

  const estoqueNaLoja = Number((produto.estoquePorLoja||{})[lojaId]) || 0;
  const jaReservado = reservas[produtoId] || 0;
  const disponivel = Math.max(0, estoqueNaLoja - jaReservado);
  const usarDoProprio = Math.min(disponivel, quantidadeNecessaria);
  if(usarDoProprio > 0) reservas[produtoId] = jaReservado + usarDoProprio;

  const faltaAinda = quantidadeNecessaria - usarDoProprio;
  if(faltaAinda <= 1e-9) return { ok:true, faltando:[] };

  if(!produto.composicao || produto.composicao.length===0){
    return { ok:false, faltando:[{ produtoId, nome:produto.nome, quantidade:faltaAinda }] };
  }

  let tudoOk = true;
  const faltandoTotal = [];
  produto.composicao.forEach(comp=>{
    const qtdComponente = (Number(comp.quantidade)||0) * faltaAinda;
    const resultado = planejarConsumoEstoque(comp.insumoId, qtdComponente, reservas, lojaId);
    if(!resultado.ok){ tudoOk = false; faltandoTotal.push(...resultado.faltando); }
  });
  return { ok: tudoOk, faltando: faltandoTotal };
}

/** Aplica os consumos planejados NA LOJA `lojaId` via o Kardex (registra o movimento
 * e atualiza o saldo numa transação atômica no banco — evita duas vendas do mesmo
 * produto/loja pisarem uma na outra, e deixa histórico de quem/quando/por quê). */
async function aplicarConsumosEstoque(reservas, lojaId, referenciaId){
  const ids = Object.keys(reservas).filter(id=> reservas[id] > 0);
  for(const id of ids){
    const produto = produtosEstoque.find(p=>p.id===id);
    if(!produto) continue;
    const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{
      produtoId:id, lojaId, tipoMovimento:'VENDA', quantidade: -reservas[id], referenciaId: referenciaId||null
    }});
    if(!produto.estoquePorLoja) produto.estoquePorLoja = {};
    if(r && !r.error && typeof r.saldoNovo === 'number'){
      produto.estoquePorLoja[lojaId] = r.saldoNovo;
    }else{
      console.error('erro ao registrar movimento de estoque', id, r && r.error);
      // fallback: pelo menos mantém a tela coerente, mesmo se o Kardex falhar
      produto.estoquePorLoja[lojaId] = (Number(produto.estoquePorLoja[lojaId])||0) - reservas[id];
    }
  }
}

/* ============================================================
   CLIENTES (cadastro compartilhado com O.S. e Orçamentos)
   ============================================================ */
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
/** Separa um telefone já salvo (qualquer formato) em {ddd, numero}, pra preencher os
 * dois campos separados na edição. Aceita tanto o novo padrão (11 dígitos, celular)
 * quanto números antigos de 10 (fixo, salvos antes dessa mudança). */
function separarTelefone(str){
  const digitos = onlyDigits(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
/** Formata os dígitos do número conforme a pessoa digita — XXXXX-XXXX (celular) ou
 * XXXX-XXXX se for um fixo antigo de 8 dígitos, mantido por compatibilidade. */
function formatarNumeroTelefone(digitos){
  digitos = digitos.slice(0,9);
  if(digitos.length<=4) return digitos;
  if(digitos.length<=8) return digitos.slice(0,digitos.length-4)+'-'+digitos.slice(-4);
  return digitos.slice(0,5)+'-'+digitos.slice(5);
}
function wireTelefoneMask(prefix){
  const dddInp = document.getElementById(prefix+'_telefoneDDD');
  const numInp = document.getElementById(prefix+'_telefoneNum');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigits(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefone(onlyDigits(numInp.value)); });
}
/** Junta DDD+número num telefone só, no formato "(XX) XXXXX-XXXX", pra continuar
 * gravando como sempre (compatível com tudo que já lê o campo "telefone"). Os dois
 * em branco = válido, salva vazio. Só um preenchido ou número incompleto = erro —
 * avisa e retorna null, pro chamador não deixar salvar assim. */
function combinarTelefoneValidado(prefix){
  const ddd = onlyDigits((document.getElementById(prefix+'_telefoneDDD')||{}).value);
  const numero = onlyDigits((document.getElementById(prefix+'_telefoneNum')||{}).value);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==9){
    showToast('Telefone incompleto — preencha o DDD (2 dígitos) e o número (9 dígitos), ou deixe os dois em branco.');
    return null;
  }
  if(Number(ddd) < 11 || numero.charAt(0) !== '9'){   // 07/11: só celular no padrão
    showToast('Telefone fora do padrão de celular: DDD válido + número de 9 dígitos começando com 9. Corrija para salvar.', 6000);
    return null;
  }
  return `(${ddd}) ${numero.slice(0,5)}-${numero.slice(5)}`;
}
/** Localiza no banco um cliente por telefone ou CPF (usado pra evitar duplicar cadastro).
 * Consulta o servidor sob demanda — não precisa (nem tem) o cadastro inteiro em memória. */
async function buscarClientePorTelefoneOuCpf(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  if(!tel && !doc) return null;
  const cacheado = clientes.find(c=>
    (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
  );
  if(cacheado) return cacheado;
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo: doc || tel } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    const achado = achados.find(c=>
      (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
    ) || null;
    if(achado && !clientes.some(x=>x.id===achado.id)) clientes.push(achado);
    return achado;
  }catch(e){ console.error('erro ao localizar cliente', e); return null; }
}

/** Busca endereço pelo CEP usando o ViaCEP (gratuito, sem chave). Retorna null se não achar. */
async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  // Tenta ViaCEP primeiro, BrasilAPI como fallback
  const fontes = [
    async () => {
      const r = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
      const d = await r.json();
      if(d.erro) return null;
      return { endereco: d.logradouro||'', bairro: d.bairro||'', cidade: d.localidade||'', estado: d.uf||'' };
    },
    async () => {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${cepDigits}`);
      if(!r.ok) return null;
      const d = await r.json();
      return { endereco: d.street||'', bairro: d.neighborhood||'', cidade: d.city||'', estado: d.state||'' };
    }
  ];
  for(const fn of fontes){
    try{ const res = await fn(); if(res) return res; }catch(e){}
  }
  return null;
}

// Busca CPF na Receita Federal via BrasilAPI — retorna { nome, situacao } ou null
async function buscarCpfReceita(cpf){
  const digits = onlyDigits(cpf);
  if(digits.length !== 11) return null;
  try{
    const r = await fetch(`https://brasilapi.com.br/api/cpf/v1/${digits}`);
    if(!r.ok) return null;
    const d = await r.json();
    // BrasilAPI retorna { cpf, name, birthday, situation }
    if(!d || !d.name) return null;
    return { nome: d.name, situacao: d.situation||'' };

window.__cbCli = { id:null, cli:null, info:null };
function cbDataLimite(){ const el=document.getElementById('f_data'); return el && el.value ? el.value : null; }
function definirCashbackCliente(c){
  window.__cbCli = { id: c && c.id || null, cli: c || null, info: (c && c.id && window.Cashback) ? Cashback.info(c, cbDataLimite()) : null };

/** Confere o valor em cashback de uma linha de pagamento. Devolve mensagem de erro ou ''. */
function cbConferirLinha(holder, p, total){
  if(p.formaId!=='__cashback' || !window.Cashback) return '';
  const inf = window.__cbCli && window.__cbCli.info;
  if(!inf) return 'Para usar cashback, escolha um cliente cadastrado na busca.';
  const outros = holder.pagamentos.filter(x=>x!==p && x._modo!=='editar' && x.formaId==='__cashback').reduce((a,x)=>a+(Number(x.valor)||0),0);
  const lim = Math.min(inf.disp, Cashback.maxUso(total)) - outros;
  return Number(p.valor) > lim + 0.009 ? 'Cashback: pode abater no máximo '+fmtMoeda(Math.max(0,lim))+' (saldo disponível hoje e limite de 50% do total).' : '';
}
function cbTotais(pags){
  const formas = (config.formasPagamento||config.paymentTypes||[]); let din=0, uso=0;
  (pags||[]).forEach(p=>{ if(p._modo==='editar') return; const v=Number(p.valor)||0; if(p.formaId==='__cashback') uso+=v; else if(window.Cashback && Cashback.ehDinheiro(p.formaId, formas)) din+=v; });

async function cbAcharClienteId(reg){
  const telD = String(reg.telefone||'').replace(/\D/g,''); if(!telD) return null;
  try{ const r = await gatewayCall({ op:'searchClients', params:{ termo: telD } }); const a = ((r&&r.data)||[]).find(c=>String(c.telefone||'').replace(/\D/g,'')===telD); return a ? a.id : null; }catch(e){ return null; }
}
/** modo 'validar' (antes de salvar o registro) ou 'gravar' (depois). anterior = reg.cashback de ANTES desta gravação. */
async function cashbackProcessar(reg, tipo, total, modo, anterior, clienteIdHint){
  if(!window.Cashback) return { ok:true };
  const t = cbTotais(reg.pagamentos);
  if(!anterior && t.din<=0.004 && t.uso<=0.004) return { ok:true };
  let cid = (anterior && anterior.clienteId) || clienteIdHint || null;
  if(!cid) cid = await cbAcharClienteId(reg);
  if(!cid){ if(t.uso>0.004) return { ok:false, erro:'Para usar cashback, escolha um cliente cadastrado na busca.' }; return { ok:true, semCliente:true }; }
  const r = await Cashback.aplicar(gatewayCall, cid, { registroId:reg.id, tipo, via:reg.codigoVia||reg.via||'', loja:reg.lojaId||'', dinheiroTotal:t.din, usadoTotal:t.uso, total:Number(total)||0, anterior }, modo==='validar' ? 'validar' : null);
  if(r.erro) return { ok:false, erro:r.erro };
  return { ok:true, resumo:r.resumo };
}

              <div id="receitaResult" style="margin-top:6px;font-size:12.5px;"></div>
            </div>` : ''}
            <div class="muted" style="margin-top:8px;font-size:12px;">Preencha os dados abaixo para cadastrar.</div>
          </div>`;
        if(parece_cpf){

            if(!resultado){

            } else {

                <button type="button" class="btn btn-ghost btn-sm" id="btnUsarNomeReceita" style="margin-left:8px;">Usar este nome</button>`;
              document.getElementById('btnUsarNomeReceita')?.addEventListener('click', ()=>{
                const nomeInp = document.getElementById('sel_cliente');

                div.innerHTML = '<span class="muted">Nome e CPF preenchidos nos dados abaixo.</span>';
              });
            }
          });
        }
      }
    });
  }
  document.getElementById('busca_cliente').addEventListener('input', e=> renderResultados(e.target.value.trim()));
  document.getElementById('busca_cliente').focus();

  document.getElementById('btnCancelarSelecaoCliente').addEventListener('click', closeModal);
  document.getElementById('btnConfirmarSelecaoCliente').addEventListener('click', async ()=>{
    const nome = maiusc(document.getElementById('sel_cliente').value);
    if(!nome){ showToast('Digite o nome do cliente para continuar.'); return; }
    const telefoneCombinado = combinarTelefoneValidado('sel');
    if(telefoneCombinado === null) return;
    const patch = {
      nome,
      telefone: telefoneCombinado,
      email: document.getElementById('sel_email').value.trim(),
      cpf: document.getElementById('sel_cpf').value.trim(),
      dataNascimento: document.getElementById('sel_nascimento').value,
      cep: document.getElementById('sel_cep').value.trim(),
      endereco: maiusc(document.getElementById('sel_endereco').value),
      numero: maiusc(document.getElementById('sel_numero').value),
      complemento: maiusc(document.getElementById('sel_complemento').value),
      bairro: maiusc(document.getElementById('sel_bairro').value),
      cidade: maiusc(document.getElementById('sel_cidade').value),
      estado: maiusc(document.getElementById('sel_estado').value),
    };
    { const _cpfD=String(patch.cpf||'').replace(/\D/g,''); if(_cpfD.length===11 && selecionado && selecionado.id){ const _d=await buscarClientePorTelefoneOuCpf('', patch.cpf); if(_d && _d.id!==selecionado.id){ showToast('Este CPF já está cadastrado para '+(_d.nome||'outro cliente')+'. Não é permitido o mesmo CPF em dois cadastros.'); return; } } }
    let clienteFinal;
    if(selecionado && selecionado.id){
      clienteFinal = { ...selecionado, ...patch };
      const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
      if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
    } else {
      // Evita duplicar: procura no servidor alguém com o mesmo telefone/CPF.
      const existente = await buscarClientePorTelefoneOuCpf(patch.telefone, patch.cpf);
      if(existente){
        clienteFinal = { ...existente, ...patch };
        const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
        if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
      } else {
        clienteFinal = { id: uid('cli'), ...patch, criadoEm: Date.now() };
        clientes.unshift(clienteFinal);
      }
    }
    await salvarUmCliente(clienteFinal);
    closeModal();
    onConfirmar(clienteFinal);
  });
}

function lojaOptionsHtml(selected){

}
/** Nome que aparece nas listas dos módulos: o apelido do cadastro, ou o nome completo se não tiver apelido. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Um nome gravado num lançamento antigo pode ser o nome completo; aqui bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** Código (id no cadastro de funcionários) da vendedora escolhida. Vazio se o nome não bater com exatamente um funcionário.
 *  Gravado junto com o nome para o DP ligar a venda à vendedora sem depender de grafia/apelido. */
/** Vendedora e gerente lançam sempre em nome de quem está logado (como na loja). Diretoria/oficina escolhem. Vazio = campo livre. */
function vendedoraTravadaNoLogin(){
  if(!currentUser || (currentUser.nivel!=='vendedora' && currentUser.nivel!=='gerente')) return '';
  const f = (config.funcionarios||[]).find(x=>currentUser.funcionarioId && x.id===currentUser.funcionarioId);
  return f ? nomeExibicaoFuncionario(f) : (currentUser.nome||'');
}
function vendedoraIdPorNome(nome){
  const alvo = String(nome||'').trim().toLowerCase();
  if(!alvo) return '';
  const achados = (config.funcionarios||[]).filter(f=> String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo);
  return achados.length===1 ? achados[0].id : '';
}
/** Carimba a data (AAAA-MM-DD) em cada pagamento que ainda não tem. Se a data da venda foi corrigida,
 *  o pagamento que tinha a data antiga acompanha a nova. Base do regime de caixa no DP. */
/* dataNovos (06/11): data dos pagamentos NOVOS. Na edição de uma venda que tinha saldo a receber ("pagar depois"),
   o pagamento novo é dinheiro entrando HOJE: antes ele recebia a data da venda e ia para o caixa de um dia antigo. */
function carimbarPagamentos(pags, dataVenda, dataAntiga, dataNovos){
  return (pags||[]).map(p=>{
    const q = { ...p };
    if(!q.data) q.data = dataNovos || dataVenda;
    else if(dataAntiga && q.data===dataAntiga && dataAntiga!==dataVenda) q.data = dataVenda;
    if(window.CondPag) CondPag.carimbar([q], config);
    return q;
  });
}
function vendedoraOptionsHtml(selected){
  const lista = (config.funcionarios||[]).filter(f=>(f.cargos||[]).includes('vendedora'));
  const naLista = lista.some(f=>nomeExibicaoFuncionario(f)===selected);
  // lançamento antigo pode ter sido salvo com o nome completo: converte pro apelido
  const equivalente = !naLista && selected ? lista.find(f=>funcionarioBateComNome(f, selected)) : null;
  const valorSel = equivalente ? nomeExibicaoFuncionario(equivalente) : selected;
  const extra = (valorSel && !lista.some(f=>nomeExibicaoFuncionario(f)===valorSel))
    ? `<option value="${escapeHtml(valorSel)}" selected>${escapeHtml(valorSel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${valorSel===n?'selected':''}>${escapeHtml(n)}</option>`;
  }).join('');
}
function produtoJoiaOptionsHtml(selected){
  return `<option value="">Selecione</option>` + (config.joiasProdutos||[]).map(p=>`<option value="${escapeHtml(p)}" ${selected===p?'selected':''}>${escapeHtml(p)}</option>`).join('');
}
function metalOptionsHtml(selected){

/**
 * A baixa de estoque acontece sempre na Empresa joia (de onde o produto saiu de
 * verdade) — isso vale COM ou SEM nota fiscal emitida. Quando tem nota e ela é da
 * MESMA empresa da joia, a própria nota já cobre essa baixa — não precisa de mais
 * nada. Em qualquer outro caso em que a Empresa joia seja diferente da loja da
 * venda (com ou sem nota), a baixa não fica registrada em lugar nenhum
 * automaticamente — por isso pedimos confirmação de que ela vai ser feita
 * manualmente, na empresa certa.
 * `lojaVendaId` é a loja escolhida lá em cima na tela (onde o cliente foi atendido).
 * Retorna null se estiver tudo certo, ou uma mensagem de erro pra mostrar.
 */
function notaEmpresasErro(holder, lojaVendaId){
  if(holder.emissaoNota === 'sim'){
    // A tela não pede mais as 3 empresas: sem escolha, vale a loja da venda (nota, pagamento e joia da própria loja).
    { const _def = lojaVendaId || holder.lojaId || (window.__lojaAtual && window.__lojaAtual.id) || '';
      if(_def){ if(!holder.lojaSaidaId) holder.lojaSaidaId = _def; if(!holder.lojaPagamentoId) holder.lojaPagamentoId = _def; if(!holder.lojaNotaId) holder.lojaNotaId = _def; } }
    if(!holder.lojaSaidaId || !holder.lojaPagamentoId || !holder.lojaNotaId){
      return 'Selecione as 3 empresas (joia, pagamento e nota).';
    }
    if(holder.lojaPagamentoId !== holder.lojaNotaId){
      return 'A empresa do pagamento precisa ser a mesma que emitiu a nota.';
    }
    if(holder.lojaNotaId !== holder.lojaSaidaId){
      if(!holder.lojaBaixaEstoqueId){
        return 'A nota é de uma empresa diferente de onde saiu a joia — confirme em qual empresa a baixa de estoque vai ser feita manualmente.';
      }
      if(holder.lojaBaixaEstoqueId !== holder.lojaSaidaId){
        return 'A baixa de estoque precisa ser feita na mesma empresa de onde saiu a joia, não na empresa da nota.';
      }
    }
    return null;
  }
  // Sem nota fiscal: só existe algo a confirmar se a Empresa joia foi preenchida
  // E é diferente da loja da própria venda — aí sim o estoque não sai "sozinho"
  // da loja certa, precisando de confirmação de baixa manual.
  if(holder.lojaSaidaId && holder.lojaSaidaId !== lojaVendaId){
    if(!holder.lojaBaixaEstoqueId){
      return 'A joia saiu de uma empresa diferente da loja da venda — confirme em qual empresa a baixa de estoque vai ser feita manualmente.';
    }
    if(holder.lojaBaixaEstoqueId !== holder.lojaSaidaId){
      return 'A baixa de estoque precisa ser feita na mesma empresa de onde saiu a joia.';
    }
  }
  return null;
}
function todasEmpresasIguais(holder){
  return holder.emissaoNota==='sim' && holder.lojaSaidaId && holder.lojaPagamentoId && holder.lojaNotaId &&
    holder.lojaSaidaId===holder.lojaPagamentoId && holder.lojaPagamentoId===holder.lojaNotaId;
}

/** Pix: o campo PF/PJ ao lado da forma de pagamento. PF não entra nos casos que exigem número de nota fiscal. */
function formaEhPix(formaId){

  const f = (config.formasPagamento||config.paymentTypes||[]).find(x=>x.id===formaId);
  return !!(f && /pix/i.test(f.nome||''));
}
function pessoaPixHtml(p, i){

  const t = p.pessoa==='PF' ? 'Pix PF' : p.pessoa==='PJ' ? 'Pix loja' : 'Tipo do Pix?';
  return `<button type="button" class="btn btn-ghost btn-sm pix-tipo" data-pagpessoa="${i}" title="Clique para trocar entre Pix loja e Pix pessoa física" style="white-space:nowrap;${p.pessoa?'':'border-color:var(--wait,#B7791F);color:var(--wait,#7A4E0A);'}">${t}</button>`;

const __pixAsked = new WeakSet();
function soPixPF(pags){ const v=(pags||[]).filter(p=>(Number(p.valor)||0)>0); return v.length>0 && v.every(p=>formaEhPix(p.formaId)&&p.pessoa==='PF'); }
/* Regra da nota pelo tipo de Pix: Pix loja (PJ) = nota "Sim" fixa (cobra o número no fechamento do caixa);
   só Pix pessoa física (PF) = nota "Não" como padrão (pode trocar) e o fechamento do caixa não cobra número. */
function regraNotaPix(container, holder){
  const pix = (holder.pagamentos||[]).filter(p=> formaEhPix(p.formaId) && p.pessoa);
  const temPJ = pix.some(p=> p.pessoa==='PJ');
  const soPF = soPixPF(holder.pagamentos) || (pix.length>0 && !temPJ && (holder.pagamentos||[]).every(p=> !p.formaId || (formaEhPix(p.formaId) && p.pessoa==='PF')));
  const set = (k,v)=> Object.defineProperty(holder, k, { value:v, writable:true, configurable:true, enumerable:false });
  if(temPJ){
    if(holder.emissaoNota!=='sim'){ holder.emissaoNota = 'sim'; }
    set('_notaPixLoja', true);
  } else {
    if(holder._notaPixLoja){ set('_notaPixLoja', false); if(!String(holder.numeroNota||'').trim()) holder.emissaoNota = soPF ? 'nao' : ''; }
    else if(soPF && !holder.emissaoNota){ holder.emissaoNota = 'nao'; }
  }
  const rs = container.querySelector('#pagNotaSim'), rn = container.querySelector('#pagNotaNao');
  if(rs) rs.checked = holder.emissaoNota==='sim';
  if(rn){ rn.checked = holder.emissaoNota==='nao'; rn.disabled = temPJ; if(rn.parentNode) rn.parentNode.style.opacity = temPJ ? '.45' : ''; }
  const nh = container.querySelector('#pagNotaPfHint');
  if(nh) nh.textContent = temPJ ? 'Pix loja: nota fiscal obrigatória — o fechamento do caixa cobra o número da nota.'
                        : soPF ? 'Pix de pessoa física: nota "Não" como padrão; o fechamento do caixa não cobra o número.' : '';
}
/* Pergunta de onde veio o Pix: da loja (PJ) ou de pessoa física (PF). */
