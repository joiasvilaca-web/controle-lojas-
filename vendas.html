<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}

#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn:hover{background:rgba(255,255,255,0.1);}
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}

#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}
.periodo-box{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.periodo-box input[type=month]{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13.5px;}
.save-status{font-size:12px; color:var(--ink-faint);}
.save-status.saving{color:var(--wait);}
.save-status.saved{color:var(--ok);}

.card{background:var(--surface); border-radius:14px; padding:18px 20px; margin-bottom:16px; border:1px solid var(--line);}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;}
.muted{color:var(--muted); font-size:13px;}
.notice{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;}

.field-inline{display:flex; flex-direction:column; gap:3px;}
.field-inline label{font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint);}
.field-inline input{padding:7px 8px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2); color:var(--ink); font-size:13.5px; width:100%;}
.field-inline input:disabled{background:#F1F1F1; color:var(--ink-faint); border-style:dashed;}
.field-inline input.declarado{background:#FBEEDF;}

.vd-card{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px;}
.vd-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.vd-head b{font-size:15px;}
.vd-lojas{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px;}
@media (max-width:640px){ .vd-lojas{grid-template-columns:1fr;} }
.vd-loja{background:var(--surface-2); border-radius:9px; padding:10px;}
.vd-loja-nome{font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--gold-ink); margin-bottom:6px;}
.vd-loja-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.vd-liquido{margin-top:7px; font-size:12px; color:var(--ink-soft);}
.vd-totais{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; padding:8px 0 4px; border-top:1px dashed var(--line); margin-top:4px; font-size:13px;}
.vd-totais .perc-field{max-width:100px;}
.vd-itens{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}
.vd-itens-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
@media (max-width:900px){ .vd-itens-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:520px){ .vd-itens-grid{grid-template-columns:repeat(2,1fr);} }
.vd-itens-resumo{margin-top:9px; font-size:13px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-erro{background:var(--danger-soft); color:var(--danger);}
.badge-neutro{background:var(--surface-2); color:var(--ink-faint);}

.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:640px){ .kpis{grid-template-columns:1fr;} }
.kpi{background:var(--surface-2); border-radius:12px; padding:14px 16px;}
.kpi .lbl{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
.kpi .val{font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:700; margin-top:2px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 8px; border-bottom:2px solid var(--line);}
td{padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
td input{width:100px; padding:6px 7px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2); font-size:13px;}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Vendas (módulo temporário)</div>
    <div class="login-title">Acessar vendas</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira com a diretoria.</div>
    <div class="field-inline" style="margin-bottom:14px;"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn" id="btnLogin" style="width:100%; border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700; background:var(--gold); color:#fff;">Entrar</button>
    <div class="login-hint">Use a mesma senha do restante do sistema. Disponível para vendedoras e diretoria.</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">💰</div>
      <div class="brand-name">Vendas</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn" id="btnLogout" title="Sair">⏻</button>
    </div>
  </header>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

let currentUser = null;
let currentTab = 'lancar';
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return { maybeSingle: async ()=> gatewayCall({ op:'selectOne', table, params:{ column, value } }) };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){ return gatewayCall({ op:'upsert', table, params:{ row } }); },
    };
  }
};

function numVal(x){ const n = Number(x); return isFinite(n) ? n : 0; }
function fmtMoeda(v){ return 'R$ ' + numVal(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============================================================
   ESTRUTURA FIXA — mesma configuração da planilha VENDAS.xlsx
   ============================================================ */
const LOJAS = ['MC','JV','JD'];
const VENDEDORAS_FIXAS = [
  { id:'v1', nome:'CRISTINA' },
  { id:'v2', nome:'PATRICIA' },
  { id:'v3', nome:'MARIANA' },
  { id:'v4', nome:'OUTROS' },
  { id:'v5', nome:'OUTROS' },
  { id:'v6', nome:'OUTROS' },
  { id:'v7', nome:'GERENTE' },
  { id:'v8', nome:'FELIPE E PHABRINNE' },
];
const CATEGORIAS = [
  { id:'alianca',     nome:'ALIANÇA',      peso:0.01 },
  { id:'fabricacao',  nome:'FABRICAÇÃO',   peso:0.02 },
  { id:'servico',     nome:'SERVIÇO',      peso:0.03 },
  { id:'represOuro',  nome:'REPRES OURO',  peso:0.04 },
  { id:'represPrata', nome:'REPRES PRATA', peso:0.05 },
  { id:'relogio',     nome:'RELÓGIO',      peso:0.06 },
];

function defaultVendedoraData(){
  const porLoja = {}; LOJAS.forEach(l=> porLoja[l] = { bruto:0, devol:0 });
  const itens = {}; CATEGORIAS.forEach(c=> itens[c.id] = 0);
  return { porLoja, percVend:null, itens };
}
function defaultPeriodo(id){
  const itensDecl = {}; CATEGORIAS.forEach(c=> itensDecl[c.id] = null);
  return {
    id,
    vendedoras: {},
    declarado: { totalBruto:null, totalDevol:null, totalLiquido:null, itens: itensDecl },
    atualizadoPor:null, atualizadoEm:null,
  };
}
function ensureVendedora(periodo, vid){
  if(!periodo.vendedoras[vid]) periodo.vendedoras[vid] = defaultVendedoraData();
  const v = periodo.vendedoras[vid];
  LOJAS.forEach(l=>{ if(!v.porLoja[l]) v.porLoja[l] = { bruto:0, devol:0 }; });
  CATEGORIAS.forEach(c=>{ if(v.itens[c.id]===undefined) v.itens[c.id] = 0; });
  return v;
}

/* ---- fórmulas (equivalentes às da planilha) ---- */
function liqLoja(v, loja){ return numVal(v.porLoja[loja].bruto) - numVal(v.porLoja[loja].devol); }
function totalVendCampo(v, campo){ return LOJAS.reduce((s,l)=> s + numVal(v.porLoja[l][campo]), 0); }
function totalLiquidoVend(v){ return totalVendCampo(v,'bruto') - totalVendCampo(v,'devol'); }
function totalItensVend(v){ return CATEGORIAS.reduce((s,c)=> s + numVal(v.itens[c.id]), 0); }
function diferencaVend(v){ return totalItensVend(v) - totalLiquidoVend(v); }
function fatorIndividualVend(v){ return CATEGORIAS.reduce((s,c)=> s + numVal(v.itens[c.id]) * c.peso, 0); }
function confVend(v){
  const ti = totalItensVend(v), tl = totalLiquidoVend(v);
  if(ti===0 && tl===0) return null;
  return Math.abs(diferencaVend(v)) < 0.01 ? 'OK' : 'ERRO';
}
function totalGeralLojaCampo(periodo, loja, campo){
  return VENDEDORAS_FIXAS.reduce((s,vd)=> s + numVal(ensureVendedora(periodo,vd.id).porLoja[loja][campo]), 0);
}
function totalGeralCampo(periodo, campo){
  return LOJAS.reduce((s,l)=> s + totalGeralLojaCampo(periodo,l,campo), 0);
}
function totalCategoriaGeral(periodo, catId){
  return VENDEDORAS_FIXAS.reduce((s,vd)=> s + numVal(ensureVendedora(periodo,vd.id).itens[catId]), 0);
}
function totalItensGeral(periodo){ return CATEGORIAS.reduce((s,c)=> s + totalCategoriaGeral(periodo,c.id), 0); }
function totalLiquidoGeral(periodo){ return totalGeralCampo(periodo,'bruto') - totalGeralCampo(periodo,'devol'); }
function badgeConf(status){
  if(status===null || status===undefined) return `<span class="badge badge-neutro">—</span>`;
  return status==='OK' ? `<span class="badge badge-ok">OK</span>` : `<span class="badge badge-erro">ERRO</span>`;
}

/* ============================================================
   BANCO — tabela isolada "vendas_planilha" (um registro por mês)
   ============================================================ */
async function periodoCarregar(id){
  try{
    const { data, error } = await supabaseClient.from('vendas_planilha').select('id,payload').eq('id', id).maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar período', e); return null; }
}
async function periodoSalvar(p){
  try{
    const { error } = await supabaseClient.from('vendas_planilha').upsert({ id: p.id, payload: p });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar período', e); showToast('Não foi possível salvar. Tente novamente.'); return false; }
}

let periodoAtual = null;
let saveTimer = null;
function marcarStatus(txt, cls){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = txt;
  el.className = 'save-status ' + (cls||'');
}
function agendarSalvar(){
  marcarStatus('Editando…','saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    marcarStatus('Salvando…','saving');
    periodoAtual.atualizadoPor = currentUser.nome;
    periodoAtual.atualizadoEm = Date.now();
    const ok = await periodoSalvar(periodoAtual);
    marcarStatus(ok ? 'Salvo ✓' : 'Erro ao salvar', ok ? 'saved' : '');
  }, 700);
}

function mesAtualStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
async function carregarPeriodo(id){
  const dados = await periodoCarregar(id);
  periodoAtual = dados || defaultPeriodo(id);
  VENDEDORAS_FIXAS.forEach(vd=> ensureVendedora(periodoAtual, vd.id));
  if(!periodoAtual.declarado) periodoAtual.declarado = defaultPeriodo(id).declarado;
  marcarStatus(dados ? 'Carregado' : 'Novo período — ainda sem lançamentos', '');
  renderView();
}

/* ============================================================
   AUTENTICAÇÃO / NAVEGAÇÃO (mesmo padrão do restante do app)
   ============================================================ */
const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      if(currentUser.nivel === 'oficina') return;
      await carregarPeriodo(mesAtualStr());
      enterApp();
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs(); renderView();
    }
  });
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); err.textContent = 'Senha não encontrada. Confira com a diretoria.'; return; }
  if(r.user.nivel === 'oficina'){
    err.textContent = 'Este módulo é exclusivo para vendedoras e diretoria.';
    err.classList.add('show');
    return;
  }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await carregarPeriodo(mesAtualStr());
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null; __gatewaySenha = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  buildTabs();
  currentTab = 'lancar';
  if(EMBEDDED){
    const permitido = tabsForLevel();
    if(!permitido.some(t=>t.id===currentTab)) currentTab = permitido[0] ? permitido[0].id : 'lancar';
    parent.postMessage({ type:'tabs', modulo:'vendas', tabs: permitido, active: currentTab }, '*');
  }
  renderTabs();
  renderView();
}
function tabsForLevel(){
  const t = [
    { id:'lancar', label:'Lançar vendas', icon:'📝' },
    { id:'conferencia', label:'Conferência', icon:'✅' },
  ];
  if(window.__permissoesAbasOverride) return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'vendas', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='lancar') renderLancar(main);
  else if(currentTab==='conferencia') renderConferencia(main);
}

/* ============================================================
   ABA: LANÇAR VENDAS
   ============================================================ */
function renderLancar(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Lançar vendas</h1>
        <p class="page-sub">Preencha os valores de cada vendedora. Os campos de líquido, total e diferença são calculados automaticamente.</p>
      </div>
      <div class="periodo-box">
        <input type="month" id="periodoSel" value="${periodoAtual.id}">
        <span class="save-status" id="saveStatus"></span>
      </div>
    </div>
    <div class="notice">⚑ Preencha o Total Bruto, Devolução (por loja) e os Itens vendidos por categoria de cada vendedora. TOTAL ITENS deve igualar T LÍQUIDO — quando não bate, aparece "ERRO" em vermelho.</div>
    <div id="vdCards"></div>
  `;
  document.getElementById('periodoSel').addEventListener('change', (e)=>{
    if(e.target.value) carregarPeriodo(e.target.value);
  });
  const wrap = document.getElementById('vdCards');
  VENDEDORAS_FIXAS.forEach(vd=> wrap.appendChild(criarCardVendedora(vd)));
}

function criarCardVendedora(vd){
  const v = ensureVendedora(periodoAtual, vd.id);
  const card = document.createElement('div');
  card.className = 'vd-card';
  card.innerHTML = `
    <div class="vd-head"><b>${escapeHtml(vd.nome)}</b></div>
    <div class="vd-lojas">
      ${LOJAS.map(l=>`
        <div class="vd-loja">
          <div class="vd-loja-nome">${l}</div>
          <div class="vd-loja-grid">
            <div class="field-inline"><label>T. Bruto</label><input type="number" step="0.01" data-vid="${vd.id}" data-loja="${l}" data-campo="bruto" value="${v.porLoja[l].bruto || ''}"></div>
            <div class="field-inline"><label>Devol.</label><input type="number" step="0.01" data-vid="${vd.id}" data-loja="${l}" data-campo="devol" value="${v.porLoja[l].devol || ''}"></div>
          </div>
          <div class="vd-liquido">T. Líquido: <b id="liq_${vd.id}_${l}">${fmtMoeda(liqLoja(v,l))}</b></div>
        </div>
      `).join('')}
    </div>
    <div class="vd-totais">
      <div>Total Bruto: <b id="totBruto_${vd.id}">${fmtMoeda(totalVendCampo(v,'bruto'))}</b></div>
      <div>Total Devol.: <b id="totDevol_${vd.id}">${fmtMoeda(totalVendCampo(v,'devol'))}</b></div>
      <div>Total Líquido: <b id="totLiq_${vd.id}">${fmtMoeda(totalLiquidoVend(v))}</b></div>
      <div class="field-inline perc-field"><label>% Vend.</label><input type="number" step="0.1" data-vid="${vd.id}" data-campo="percVend" value="${v.percVend ?? ''}"></div>
    </div>
    <div class="vd-itens">
      <div class="section-label">Itens vendidos por categoria</div>
      <div class="vd-itens-grid">
        ${CATEGORIAS.map(c=>`
          <div class="field-inline"><label>${escapeHtml(c.nome)}</label><input type="number" step="0.01" data-vid="${vd.id}" data-cat="${c.id}" value="${v.itens[c.id] || ''}"></div>
        `).join('')}
      </div>
      <div class="vd-itens-resumo">
        <span>Total Itens: <b id="totItens_${vd.id}">${fmtMoeda(totalItensVend(v))}</b></span>
        <span>Diferença: <b id="diff_${vd.id}">${fmtMoeda(diferencaVend(v))}</b></span>
        <span id="conf_${vd.id}">${badgeConf(confVend(v))}</span>
      </div>
    </div>
  `;
  card.querySelectorAll('input[data-loja]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const vid = inp.dataset.vid, loja = inp.dataset.loja, campo = inp.dataset.campo;
      const vv = ensureVendedora(periodoAtual, vid);
      vv.porLoja[loja][campo] = inp.value === '' ? 0 : Number(inp.value);
      atualizarCalculosVendedora(vid);
      agendarSalvar();
    });
  });
  card.querySelectorAll('input[data-cat]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const vid = inp.dataset.vid, cat = inp.dataset.cat;
      const vv = ensureVendedora(periodoAtual, vid);
      vv.itens[cat] = inp.value === '' ? 0 : Number(inp.value);
      atualizarCalculosVendedora(vid);
      agendarSalvar();
    });
  });
  const percInput = card.querySelector('input[data-campo="percVend"]');
  if(percInput){
    percInput.addEventListener('input', ()=>{
      const vv = ensureVendedora(periodoAtual, vd.id);
      vv.percVend = percInput.value === '' ? null : Number(percInput.value);
      agendarSalvar();
    });
  }
  return card;
}

function atualizarCalculosVendedora(vid){
  const v = ensureVendedora(periodoAtual, vid);
  LOJAS.forEach(l=>{
    const el = document.getElementById(`liq_${vid}_${l}`);
    if(el) el.textContent = fmtMoeda(liqLoja(v,l));
  });
  const setTxt = (id, txt)=>{ const el = document.getElementById(id); if(el) el.textContent = txt; };
  setTxt(`totBruto_${vid}`, fmtMoeda(totalVendCampo(v,'bruto')));
  setTxt(`totDevol_${vid}`, fmtMoeda(totalVendCampo(v,'devol')));
  setTxt(`totLiq_${vid}`, fmtMoeda(totalLiquidoVend(v)));
  setTxt(`totItens_${vid}`, fmtMoeda(totalItensVend(v)));
  setTxt(`diff_${vid}`, fmtMoeda(diferencaVend(v)));
  const confEl = document.getElementById(`conf_${vid}`);
  if(confEl) confEl.innerHTML = badgeConf(confVend(v));
}

/* ============================================================
   ABA: CONFERÊNCIA
   ============================================================ */
function renderConferencia(main){
  const podeDeclarar = currentUser.nivel === 'diretoria';
  const p = periodoAtual;
  const totBruto = totalGeralCampo(p,'bruto'), totDevol = totalGeralCampo(p,'devol'), totLiq = totalLiquidoGeral(p);

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Conferência</h1>
        <p class="page-sub">Totais calculados a partir dos lançamentos das vendedoras, comparados com os valores declarados pela diretoria.</p>
      </div>
      <div class="periodo-box">
        <input type="month" id="periodoSelC" value="${p.id}">
      </div>
    </div>

    <div class="card">
      <div class="section-label">Totais do período — ${p.id}</div>
      <div class="kpis">
        <div class="kpi"><div class="lbl">Total Bruto</div><div class="val">${fmtMoeda(totBruto)}</div></div>
        <div class="kpi"><div class="lbl">Devolução</div><div class="val">${fmtMoeda(totDevol)}</div></div>
        <div class="kpi"><div class="lbl">Total Líquido</div><div class="val">${fmtMoeda(totLiq)}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Conciliação por loja</div>
      <table>
        <thead><tr><th></th><th>MC</th><th>JV</th><th>JD</th><th>Total</th><th>Declarado</th><th>Dif.</th><th>Conf.</th></tr></thead>
        <tbody id="conciliacaoLojaBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-label">Itens vendidos por categoria — total vendedoras × declarado</div>
      <table>
        <thead><tr><th>Categoria</th><th>Total vendedoras</th><th>Gerente (declarado)</th><th>Diferença</th><th>Conf.</th></tr></thead>
        <tbody id="itensCategoriaBody"></tbody>
      </table>
    </div>
  `;
  document.getElementById('periodoSelC').addEventListener('change', (e)=>{
    if(e.target.value) carregarPeriodo(e.target.value);
  });

  const linhasConc = [
    { rotulo:'Bruto', campo:'bruto', declKey:'totalBruto' },
    { rotulo:'Devolução', campo:'devol', declKey:'totalDevol' },
  ];
  const bodyConc = document.getElementById('conciliacaoLojaBody');
  bodyConc.innerHTML = linhasConc.map(row=>{
    const porLoja = LOJAS.map(l=> fmtMoeda(totalGeralLojaCampo(p,l,row.campo)));
    const total = totalGeralCampo(p, row.campo);
    const declarado = p.declarado[row.declKey];
    const dif = declarado===null || declarado===undefined ? null : total - declarado;
    const conf = declarado===null || declarado===undefined ? null : (Math.abs(dif) < 0.01 ? 'OK' : 'ERRO');
    return `<tr>
      <td><b>${row.rotulo}</b></td>
      <td>${porLoja[0]}</td><td>${porLoja[1]}</td><td>${porLoja[2]}</td>
      <td><b>${fmtMoeda(total)}</b></td>
      <td>${podeDeclarar ? `<input type="number" step="0.01" data-decl="${row.declKey}" value="${declarado ?? ''}">` : (declarado===null||declarado===undefined ? '—' : fmtMoeda(declarado))}</td>
      <td>${dif===null ? '—' : fmtMoeda(dif)}</td>
      <td>${badgeConf(conf)}</td>
    </tr>`;
  }).join('') + (()=>{
    const declLiq = p.declarado.totalLiquido;
    const difLiq = declLiq===null||declLiq===undefined ? null : totLiq - declLiq;
    const confLiq = declLiq===null||declLiq===undefined ? null : (Math.abs(difLiq) < 0.01 ? 'OK' : 'ERRO');
    return `<tr>
      <td><b>Líquido</b></td>
      <td colspan="3" class="muted">calculado a partir de Bruto − Devolução</td>
      <td><b>${fmtMoeda(totLiq)}</b></td>
      <td>${podeDeclarar ? `<input type="number" step="0.01" data-decl="totalLiquido" value="${declLiq ?? ''}">` : (declLiq===null||declLiq===undefined ? '—' : fmtMoeda(declLiq))}</td>
      <td>${difLiq===null ? '—' : fmtMoeda(difLiq)}</td>
      <td>${badgeConf(confLiq)}</td>
    </tr>`;
  })();
  bodyConc.querySelectorAll('input[data-decl]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      p.declarado[inp.dataset.decl] = inp.value === '' ? null : Number(inp.value);
      agendarSalvar();
      renderConferencia(main);
    });
  });

  const bodyCat = document.getElementById('itensCategoriaBody');
  const linhasCat = CATEGORIAS.map(c=>{
    const total = totalCategoriaGeral(p, c.id);
    const declarado = p.declarado.itens[c.id];
    const dif = declarado===null || declarado===undefined ? null : total - declarado;
    const conf = declarado===null || declarado===undefined ? null : (Math.abs(dif) < 0.01 ? 'OK' : 'ERRO');
    return `<tr>
      <td>${escapeHtml(c.nome)}</td>
      <td>${fmtMoeda(total)}</td>
      <td>${podeDeclarar ? `<input type="number" step="0.01" data-declcat="${c.id}" value="${declarado ?? ''}">` : (declarado===null||declarado===undefined ? '—' : fmtMoeda(declarado))}</td>
      <td>${dif===null ? '—' : fmtMoeda(dif)}</td>
      <td>${badgeConf(conf)}</td>
    </tr>`;
  }).join('');
  const totGeralItens = totalItensGeral(p);
  const totGeralDecl = CATEGORIAS.every(c=> p.declarado.itens[c.id]===null || p.declarado.itens[c.id]===undefined)
    ? null
    : CATEGORIAS.reduce((s,c)=> s + numVal(p.declarado.itens[c.id]), 0);
  const difGeral = totGeralDecl===null ? null : totGeralItens - totGeralDecl;
  const confGeral = totGeralDecl===null ? null : (Math.abs(difGeral) < 0.01 ? 'OK' : 'ERRO');
  bodyCat.innerHTML = linhasCat + `
    <tr style="border-top:2px solid var(--line);">
      <td><b>TOTAL ITENS</b></td>
      <td><b>${fmtMoeda(totGeralItens)}</b></td>
      <td><b>${totGeralDecl===null ? '—' : fmtMoeda(totGeralDecl)}</b></td>
      <td>${difGeral===null ? '—' : fmtMoeda(difGeral)}</td>
      <td>${badgeConf(confGeral)}</td>
    </tr>
  `;
  bodyCat.querySelectorAll('input[data-declcat]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      p.declarado.itens[inp.dataset.declcat] = inp.value === '' ? null : Number(inp.value);
      agendarSalvar();
      renderConferencia(main);
    });
  });
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'vendas' }, '*');
    return;
  }
})();
</script>
</body>
</html>
