}

/** Pix: o campo PF/PJ ao lado da forma de pagamento. PF não entra nos casos que exigem número de nota fiscal. */
function formaEhPix(formaId){
  if(!formaId || String(formaId).startsWith('__')) return false;
  const f = (config.formasPagamento||config.paymentTypes||[]).find(x=>x.id===formaId);
  return !!(f && /pix/i.test(f.nome||''));
}
function pessoaPixHtml(p, i){
  if(!formaEhPix(p.formaId)) return '';
  return `<select data-pagpessoa="${i}" aria-label="Pix de pessoa física ou jurídica" title="Pix recebido de pessoa física (PF) ou jurídica (PJ)" style="max-width:110px;"><option value="">PF ou PJ?</option><option value="PF" ${p.pessoa==='PF'?'selected':''}>PF</option><option value="PJ" ${p.pessoa==='PJ'?'selected':''}>PJ</option></select>`;
}
function pixSemPessoa(pagamentos){
  return (pagamentos||[]).some(p=> formaEhPix(p.formaId) && (Number(p.valor)||0)>0 && !p.pessoa);
}

function mountPagamentos(container, holder, getLojaVendaId){
  const _onCred = ()=>{ if(container.isConnected && container.querySelector('#pagRows')) drawRows(); else document.removeEventListener('credito-cliente', _onCred); };
  document.addEventListener('credito-cliente', _onCred);
  if(!holder.pagamentos) holder.pagamentos = [];
  if(!holder.momentoPagamento) holder.momentoPagamento = ''; // sem pré-seleção — obrigatório escolher
  if(!holder.emissaoNota) holder.emissaoNota = ''; // sem pré-seleção — usuário deve escolher
  getLojaVendaId = getLojaVendaId || (()=>'');

  // desconto/acréscimo sobre o total no bloco de pagamento
  if(!holder.descTotalTipo) holder.descTotalTipo='nenhum';
  if(!holder.descTotalModo) holder.descTotalModo='percentual';
  if(holder.descTotalPerc===undefined) holder.descTotalPerc='';
  if(holder.descTotalR===undefined) holder.descTotalR='';

  function calcTotalItens(){
    // Só conta itens confirmados (_modo==='ok') — a linha em edição não entra no total
    // até o usuário clicar em "Adicionar". Isso garante que o pagamento mostra o valor
    // real dos itens já lançados, não o que ainda está sendo digitado.
    if(window.__itensHolder) return window.__itensHolder.itens
      .filter(it=>it._modo==='ok')
      .reduce((acc,it)=>acc+(Number(it.valorUnitario)||0),0);
    return 0;
  }
  function calcTotalFinal(subtotal){
    if(holder.descTotalTipo==='nenhum') return subtotal;
    const qtd=Number(holder.descTotalPerc||holder.descTotalR)||0;
    const delta=holder.descTotalModo==='percentual'?subtotal*qtd/100:qtd;
    return Math.max(0,holder.descTotalTipo==='desconto'?subtotal-delta:subtotal+delta);
  }

  function draw(){
    const subtotal = calcTotalItens();
    const totalFinal = calcTotalFinal(subtotal);
    container.innerHTML = `
      <div class="section-label">${ic('carteira')} Pagamento</div>
      <!-- Total dos itens + desconto/acréscimo sobre o total -->
      <div class="pag-ajuste">
        <div>
          <div class="pag-ajuste-rot">Total dos itens</div>
          <div class="pag-ajuste-val" id="pagSubtotal">${fmtMoeda(subtotal)}</div>
        </div>
        <div class="pag-ajuste-ctrl">
          <button type="button" class="btn-ajuste ${holder.descTotalTipo==='desconto'?'ativo-desc':''}" id="pagBtnDesc" title="Dar desconto no total">Desconto</button>
          <button type="button" class="btn-ajuste ${holder.descTotalTipo==='acrescimo'?'ativo-acr':''}" id="pagBtnAcr" title="Acrescentar valor ao total">Acréscimo</button>
          <input type="number" min="0" step="0.01" class="campo-perc" id="pagDescPerc" placeholder="%" aria-label="Percentual" value="${escapeHtml(String(holder.descTotalPerc||''))}">
          <span class="desc-sep">ou</span>
          <input type="number" min="0" step="0.01" class="campo-val" id="pagDescR" placeholder="R$" aria-label="Valor em reais" value="${escapeHtml(String(holder.descTotalR||''))}">
        </div>
        ${(()=>{
          if(holder.descTotalTipo!=='nenhum') return `<div class="pag-ajuste-fim ${holder.descTotalTipo==='desconto'?'desc':'acr'}">= ${fmtMoeda(totalFinal)}</div>`;
          return '';
        })()}
      </div>

      <!-- Valor total + momento + nota fiscal -->
      <div class="pag-info-row">
        <div class="pag-info-cel">
          <div class="pag-info-cel-label">Valor total da venda</div>
          <div class="pag-info-cel-val total" id="pagValorTotalDisplay">${fmtMoeda(totalFinal>0?totalFinal:0)}</div>
          <input type="hidden" id="pagValorTotal" value="${totalFinal>0?totalFinal.toFixed(2):''}">
        </div>
        <div class="pag-toggle-cel">
          <div class="pag-info-cel-label">Quando o cliente paga?</div>
          <div class="pag-toggle-inner toggle-group" role="radiogroup" aria-label="Quando o cliente paga">
            <div class="toggle-opt">
              <input type="radio" name="pagMomento" id="pagMomEnc" value="na_encomenda" ${holder.momentoPagamento==='na_encomenda'?'checked':''}>
              <label for="pagMomEnc">Pago agora</label>
            </div>
            <div class="toggle-opt">
              <input type="radio" name="pagMomento" id="pagMomVolta" value="na_volta" ${holder.momentoPagamento==='na_volta'?'checked':''}>
              <label for="pagMomVolta">Paga na volta</label>
            </div>
          </div>
        </div>
        <div class="pag-toggle-cel">
          <div class="pag-info-cel-label">Nota fiscal emitida? ${ajudaPonto('Marque "Sim" só se a nota já foi emitida.')}</div>
          <div class="pag-toggle-inner toggle-group" role="radiogroup" aria-label="Nota fiscal emitida">
            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaSim" value="sim" ${holder.emissaoNota==='sim'?'checked':''}>
              <label for="pagNotaSim">Sim</label>
            </div>
            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaNao" value="nao" ${holder.emissaoNota==='nao'?'checked':''}>
              <label for="pagNotaNao">Não</label>
            </div>
          </div>
          ${numeroNotaBtnHtml(holder)}
        </div>
      </div>

      <div class="pag-info-cel-label" style="margin-bottom:8px;">Formas de pagamento</div>
      <div id="pagRows"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddPagamento">${ic('mais',14)} Adicionar forma de pagamento</button>
      <div id="pagSomaHint" style="margin-top:4px;"></div>
    `;
    drawRows();
    container.querySelectorAll('input[name="pagMomento"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.momentoPagamento = r.value; });
    });
    container.querySelectorAll('input[name="pagEmiteNota"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.emissaoNota = r.value; if(r.value!=='sim'){ holder.numeroNota = ''; const b2 = container.querySelector('[data-numnota]'); if(b2) b2.textContent = 'Número da nota'; } });
    });
    const bn = container.querySelector('[data-numnota]'); if(bn) bn.addEventListener('click', ()=> abrirNumeroNota(holder, draw));
    // pagValorTotal agora é hidden — valor vem dos itens + desconto/acréscimo
    const inpTotal = container.querySelector('#pagValorTotal');
    if(inpTotal && inpTotal.value) holder.valorTotal = parseFloat(inpTotal.value) || null;
    container.querySelector('#btnAddPagamento').addEventListener('click', ()=>{
      const primeiraForma = (config.formasPagamento && config.formasPagamento[0]) ? config.formasPagamento[0].id : '';
      // Agiliza o balcão: a nova forma já vem com o valor que falta cobrir (dá pra mudar).
      const falta = (Number(holder.valorTotal)||calcTotalItens()) - holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
      holder.pagamentos.push({ formaId: primeiraForma, valor: falta > 0.009 ? Math.round(falta*100)/100 : '' });
      drawRows();
      const novos = container.querySelectorAll('[data-pagform]');
      if(novos.length) novos[novos.length-1].focus();
    });
    // Botões desconto/acréscimo sobre o total
    function aplicarDescTotal(){
      const sub=calcTotalItens();
      const fin=calcTotalFinal(sub);
      const el=container.querySelector('#pagSubtotal'); if(el) el.textContent=fmtMoeda(sub);
      const inpT=container.querySelector('#pagValorTotal');
      if(inpT&&(holder.valorTotal===null||holder.valorTotal===undefined)){
        inpT.value=fin.toFixed(2); holder.valorTotal=fin;
      }
      updateHint();
      // atualiza o badge de total final inline
      const finEl=container.querySelector('.ativo-desc,#pagBtnDesc')?.closest('div')?.querySelector('[style*="b91c1c"],[style*="17794a"]');
    }
    const btnDesc=container.querySelector('#pagBtnDesc');
    const btnAcr=container.querySelector('#pagBtnAcr');
    const dpPerc=container.querySelector('#pagDescPerc');
    const dpR=container.querySelector('#pagDescR');
    if(btnDesc) btnDesc.addEventListener('click',()=>{
      holder.descTotalTipo=holder.descTotalTipo==='desconto'?'nenhum':'desconto';
      holder.descTotalPerc=''; holder.descTotalR=''; holder.valorTotal=null; draw(); updateHint();
    });
    if(btnAcr) btnAcr.addEventListener('click',()=>{
      holder.descTotalTipo=holder.descTotalTipo==='acrescimo'?'nenhum':'acrescimo';
      holder.descTotalPerc=''; holder.descTotalR=''; holder.valorTotal=null; draw(); updateHint();
    });
    if(dpPerc) dpPerc.addEventListener('input',()=>{
      holder.descTotalPerc=dpPerc.value; holder.descTotalR=''; holder.descTotalModo='percentual';
      // Ativa desconto automaticamente se ainda não clicou em nenhum botão
      if(holder.descTotalTipo==='nenhum' && dpPerc.value!=='') { holder.descTotalTipo='desconto'; draw(); return; }
      const dr=container.querySelector('#pagDescR'); if(dr) dr.value='';
      const sub=calcTotalItens(); const fin=calcTotalFinal(sub);
      const inpT=container.querySelector('#pagValorTotal'); if(inpT){ inpT.value=fin.toFixed(2); holder.valorTotal=fin; }
      updateHint();
    });
    if(dpR) dpR.addEventListener('input',()=>{
      holder.descTotalR=dpR.value; holder.descTotalPerc=''; holder.descTotalModo='valor';
      // Ativa desconto automaticamente se ainda não clicou em nenhum botão
      if(holder.descTotalTipo==='nenhum' && dpR.value!=='') { holder.descTotalTipo='desconto'; draw(); return; }
      const dp2=container.querySelector('#pagDescPerc'); if(dp2) dp2.value='';
      const sub=calcTotalItens(); const fin=calcTotalFinal(sub);
      const inpT=container.querySelector('#pagValorTotal'); if(inpT){ inpT.value=fin.toFixed(2); holder.valorTotal=fin; }
      updateHint();
    });
  }

  function drawRows(){
    const wrap = container.querySelector('#pagRows');
    wrap.innerHTML = holder.pagamentos.length===0 ? `<div class="pag-vazio">Nenhuma forma lançada ainda. Clique em “Adicionar forma de pagamento”.</div>` : holder.pagamentos.map((p,i)=>`
      <div class="pag-linha">
        <select data-pagform="${i}" aria-label="Forma de pagamento">${(config.formasPagamento||[]).map(pt=>`<option value="${pt.id}" ${p.formaId===pt.id?'selected':''}>${escapeHtml(pt.nome)}</option>`).join('')}${(window.__credCli.valor>0 || p.formaId==='__credito') ? `<option value="__credito" ${p.formaId==='__credito'?'selected':''}>CRÉDITO CLIENTE${window.__credCli.valor>0?' (disp. '+fmtMoeda(window.__credCli.valor)+')':''}</option>` : ''}<option value="__fiado" ${p.formaId==='__fiado'?'selected':''}>Fiado</option></select>
        ${pessoaPixHtml(p,i)}
        <input type="number" step="0.01" min="0" data-pagvalor="${i}" placeholder="0,00" aria-label="Valor" value="${p.valor!==undefined && p.valor!==null && p.valor!=='' ? p.valor : ''}">
        ${btnIcone('lixeira','Remover esta forma de pagamento',`data-pagdel="${i}"`,true)}
      </div>
    `).join('');
    wrap.querySelectorAll('[data-pagform]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ const pg = holder.pagamentos[Number(sel.dataset.pagform)]; pg.formaId = sel.value; if(!formaEhPix(pg.formaId)) delete pg.pessoa; drawRows(); });
    });
    wrap.querySelectorAll('[data-pagpessoa]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ holder.pagamentos[Number(sel.dataset.pagpessoa)].pessoa = sel.value; });
    });
    wrap.querySelectorAll('[data-pagvalor]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        holder.pagamentos[Number(inp.dataset.pagvalor)].valor = inp.value === '' ? '' : parseFloat(inp.value);
        updateHint();
      });
    });
    wrap.querySelectorAll('[data-pagdel]').forEach(b=>{
      b.addEventListener('click', ()=>{ holder.pagamentos.splice(Number(b.dataset.pagdel),1); drawRows(); updateHint(); });
    });
    updateHint();
  }

  function updateHint(){
    const hint = container.querySelector('#pagSomaHint');
    if(!hint) return;
    const soma = holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
    const total = Number(holder.valorTotal)||calcTotalItens();
    if(container.id==='pagamentoContainerNova') atualizarBarraPdv(total, soma);
    if(holder.pagamentos.length === 0 && total <= 0){ hint.textContent = ''; return; }
    const saldo = total - soma;
    if(saldo > 0.009){
      hint.innerHTML = `<div class="aviso aviso-wait">${ic('alerta')}<div><b>Falta cobrir ${fmtMoeda(saldo)}</b><small>Total ${fmtMoeda(total)} · lançado ${fmtMoeda(soma)}</small></div></div>`;
    } else if(saldo < -0.009){
      hint.innerHTML = `<div class="aviso aviso-danger">${ic('alerta')}<div><b>Passou do total em ${fmtMoeda(Math.abs(saldo))}</b><small>Diminua o valor de alguma forma de pagamento.</small></div></div>`;
    } else {
      hint.innerHTML = `<div class="aviso aviso-ok">${ic('check')}<div><b>Pagamento completo — ${fmtMoeda(total)}</b></div></div>`;
    }
  }

  draw();
  // Expõe redraw globalmente para os itens chamarem quando mudam
  window.__pagRedraw = ()=>{ holder.valorTotal=null; draw(); };
  return { redraw: window.__pagRedraw };
}
function valorRecebidoDe(v){ return (v.pagamentos||[]).reduce((acc,p)=> acc + ((p.formaId==='__fiado'||p.formaId==='__credito') ? 0 : (Number(p.valor)||0)), 0); }
/* Fiado e crédito não movimentam o caixa na venda: fiado só entra quando as parcelas
   são recebidas (Cadastro → Clientes → Débitos); crédito entrou no caixa na recarga. */
function valorAReceberDe(v){ return Math.max(0, (Number(v.valorTotal)||0) - valorRecebidoDe(v)); }
function semPagamentoLancado(v){ return !v.valorTotal && (!v.pagamentos || v.pagamentos.length===0); }

/* ============================================================
   ITENS DA VENDA
   ============================================================ */
function mountItens(container, holder, getLojaId){
  if(!holder.itens) holder.itens = [];
  getLojaId = getLojaId || (()=>'');

  function totalItens(){ return holder.itens.reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0); }

  /** Recalcula valorUnitario a partir do preço original + desconto/acréscimo (se algum
   * ajuste estiver configurado). Se não houver ajuste, não mexe no que já está lá — a
   * pessoa ainda pode digitar o valor unitário na mão, direto. */
  /* Recalcula o valor final após um ajuste de desconto/acréscimo via botões.
   Atualiza o campo de valor e o span de total inline sem redesenhar a linha. */
function recalcularAjusteNovo(it, idx, row){
  if(it.ajusteTipo==='nenhum'||it.ajusteQtd===''||it.ajusteQtd==null){ return; }
  const base = Number(it.precoOriginal)||0;
  if(!base) return;
  const qtd = Number(it.ajusteQtd)||0;
  const delta = it.ajusteModo==='percentual' ? base*qtd/100 : qtd;
  it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
  const inpVal=row ? row.querySelector('[data-itfield="valorUnitario"]') : null;
  if(inpVal) inpVal.value=Number(it.valorUnitario).toFixed(2);
  const span=document.getElementById('descTotal_'+idx);
  if(span) span.textContent='= '+fmtMoeda(it.valorUnitario);
  updateTotalHint();
}
function recalcularValorAjustado(it){
    if(it.ajusteTipo==='desconto' || it.ajusteTipo==='acrescimo'){
      const base = Number(it.precoOriginal)||0;
      const qtdAjuste = Number(it.ajusteQtd)||0;
      const delta = it.ajusteModo==='percentual' ? base*qtdAjuste/100 : qtdAjuste;
      it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
    }
  }
  function outrasLojasComEstoque(produto, lojaAtualId){
    const porLoja = (produto && produto.estoquePorLoja) || {};
    return (config.lojas||[]).filter(l=> l.id!==lojaAtualId && (Number(porLoja[l.id])||0) > 0)
      .map(l=> `${l.abreviacao} (${Number(porLoja[l.id])||0})`);
  }

  function draw(){
    container.innerHTML = `
      <div class="section-label">${ic('joia')} Itens vendidos</div>
      <div id="itensRows"></div>
      <div id="itensTotalHint"></div>
    `;
    drawRows();
  }
  function drawRows(){
    const wrap = container.querySelector('#itensRows');
    const vendaveis = (produtosEstoque||[]).filter(p=>p.vendavel!==false);
    const lojaAtual = getLojaId();
    if(vendaveis.length===0){
      wrap.innerHTML = `<div class="estado-vazio">${ic('pacote',32)}<b>Nenhum produto cadastrado</b>Cadastre os produtos em Configurações › Cadastro › Produto antes de lançar uma venda.</div>`;
      return;
    }
    let __html='';
    let __htmlOk='';
    holder.itens.forEach((it,i)=>{
      if(it._modo==='ok'){
        let __html='';
        const temObs=!!(it.observacaoItem||'').trim();
        const descInfo=it.ajusteTipo!=='nenhum'&&it.valorUnitario!==''&&it.valorUnitario!=null
          ?`${it.ajusteTipo==='desconto'?'Desconto':'Acréscimo'} ${it.ajustePerc?String(it.ajustePerc).replace('.',',')+'%':fmtMoeda(it.ajusteValR)}`:'';
        __html+=`<div class="venda-item-compact" data-idx="${i}">
          <span class="venda-compact-nome" title="${escapeHtml(it.produto||'')}">${escapeHtml(it.produto||'Item')}${it.avulso?' <span class="badge selo-neutro">Avulso</span>':(!it.produtoEstoqueId?' <span class="badge selo-wait" title="Escolha o produto do catálogo ou marque como item avulso">Fora do catálogo</span>':'')}</span>
          <span class="venda-compact-val">${it.valorUnitario!==''&&it.valorUnitario!=null?fmtMoeda(it.valorUnitario):''}${descInfo?`<small>${escapeHtml(descInfo)}</small>`:''}</span>
          <div class="venda-compact-icones">
            ${temObs?`<button type="button" class="btn-icone venda-compact-btn tem-obs" data-itobstoggle="${i}" title="Ver observação: ${escapeHtml(it.observacaoItem)}" aria-label="Ver observação do item">${ic('mensagem')}</button>`:''}
            <button type="button" class="btn-icone venda-compact-btn" data-iteditar="${i}" title="Editar item" aria-label="Editar item">${ic('lapis')}</button>
            <button type="button" class="btn-icone perigo venda-compact-btn" data-itdel="${i}" title="Tirar item da venda" aria-label="Tirar item da venda">${ic('lixeira')}</button>
          </div>
        </div>
        <div class="venda-compact-obs" id="vendaObs_${i}">${temObs?escapeHtml(it.observacaoItem):''}</div>`;
        __htmlOk+=__html;
      } else {
        const produtoAtual=it.produtoEstoqueId?vendaveis.find(p=>p.id===it.produtoEstoqueId):null;
        const estoqueAqui=produtoAtual?(Number((produtoAtual.estoquePorLoja||{})[lojaAtual])||0):null;
        const outras=produtoAtual?outrasLojasComEstoque(produtoAtual,lojaAtual):[];
        __html+=`<div class="item-row" data-idx="${i}">
          <div class="item-row-topo">
            <div class="prod-ac-wrap item-row-produto" id="pacWrap_${i}">
              ${produtoAtual
                ?`<div class="prod-ac-sel">
                     <b title="${escapeHtml(produtoAtual.nome)}">${escapeHtml(produtoAtual.nome)}</b>
                     ${produtoAtual.fator!=null&&produtoAtual.fator!==''?`<span class="prod-ac-fator-inline">Fator ${escapeHtml(String(produtoAtual.fator))}</span>`:''}
                     <button type="button" class="pa-clr" data-paclear="${i}" title="Trocar produto" aria-label="Trocar produto">${ic('x',14)}</button>
                   </div>`
                :it.avulso
                ?`<input class="prod-ac-input" placeholder="Descrição do item avulso (obrigatório)" autocomplete="off" spellcheck="false" data-avulsodesc="${i}" value="${escapeHtml(it.produto||'')}">`
                :`<input class="prod-ac-input" id="pacInp_${i}" placeholder="Busque o produto ou passe o leitor de código" aria-label="Produto" autocomplete="off" spellcheck="false" data-pac="${i}" value="${escapeHtml(it.produto||'')}">
                   <div class="prod-ac-drop" id="pacDrop_${i}" style="display:none;"></div>`}
            </div>
            <div class="item-row-valor">
              <input type="number" min="0" step="0.01" data-itfield="valorUnitario" placeholder="0,00" aria-label="Valor do item"
                value="${it.valorUnitario!==undefined&&it.valorUnitario!==''?it.valorUnitario:''}">
            </div>
            <div class="item-row-desc">
              <button type="button" class="btn-ajuste ${it.ajusteTipo==='desconto'?'ativo-desc':''}" data-aidbtn="desconto" data-idx2="${i}" title="Desconto neste item">Desc.</button>
              <button type="button" class="btn-ajuste ${it.ajusteTipo==='acrescimo'?'ativo-acr':''}" data-aidbtn="acrescimo" data-idx2="${i}" title="Acréscimo neste item">Acrés.</button>
              <input type="number" min="0" step="0.01" class="campo-perc" data-itfield="ajustePerc" placeholder="%" title="Percentual"
                value="${it.ajustePerc!==undefined&&it.ajustePerc!==''?it.ajustePerc:''}">
              <span class="desc-sep">ou</span>
              <input type="number" min="0" step="0.01" class="campo-val" data-itfield="ajusteValR" placeholder="R$" title="Valor em reais"
                value="${it.ajusteValR!==undefined&&it.ajusteValR!==''?it.ajusteValR:''}">
              <span class="desc-total" id="descTotal_${i}">${(()=>{
                if(it.ajusteTipo!=='nenhum'&&it.valorUnitario!==''&&it.valorUnitario!=null) return '= '+fmtMoeda(it.valorUnitario);
                return '';
              })()}</span>
            </div>
            <button type="button" class="btn-add-item" data-itadd="${i}" title="Confirmar este item e abrir outra linha (Enter)">${ic('check',14)} Adicionar</button>
            ${btnIcone('x','Limpar esta linha',`data-itdel="${i}"`,true)}
          </div>
          ${produtoAtual?`
          <div class="item-row-estoque">
            <span>${ic('pacote',14)} Nesta loja: <b>${estoqueAqui}</b> ${escapeHtml(unidadeEstoqueLabel(produtoAtual.unidade))} em estoque${__reservadasPorLoja[lojaAtual]?(()=>{ const res=reservadoDe(produtoAtual.id,lojaAtual); const disp=estoqueAqui-res; return ` · <b>${res}</b> reservado · <b class="${disp>0?'disp-ok':'disp-falta'}">${disp}</b> disponível`; })():''}</span>
            ${outras.length>0?`<span>· Também tem em: ${outras.join(', ')}</span>`:`<span>· Sem estoque em outras lojas</span>`}
          </div>
          ${estoqueAqui<=0&&outras.length>0?`
          <div class="aviso aviso-wait">${ic('alerta')}<div><b>Sem estoque nesta loja, mas tem em ${outras.join(', ')}.</b><small>A peça é de outro CNPJ — confirme com a gerência como fazer a baixa de estoque.</small></div></div>`:''}
          `:''}
          <div class="item-row-rodape">
            <label class="chk-avulso" title="Marque só para itens que não estão no catálogo (ex.: serviço, peça do cliente). Item avulso não mexe no estoque.">
              <input type="checkbox" data-itavulso="${i}" ${it.avulso?'checked':''} style="width:auto;"> Item avulso (fora do catálogo, não mexe no estoque)
            </label>
          </div>
          <div class="item-row-obs">
            <input type="text" data-itfield="observacaoItem" placeholder="Observação do item (opcional)" aria-label="Observação do item"
              value="${escapeHtml(it.observacaoItem||'')}">
          </div>
        </div>`;
      }
    });
    const __qtdOk = holder.itens.filter(x=>x._modo==='ok').length;
    wrap.innerHTML=__html + (__htmlOk ? `<div class="pag-info-cel-label" style="margin:14px 0 8px;">Na venda (${__qtdOk} ${__qtdOk===1?'item':'itens'})</div><div class="lista-itens-ok">${__htmlOk}</div>` : '');
    if(lojaAtual && !__reservadasPorLoja[lojaAtual] && !__reservadasFalhou[lojaAtual] && !__reservadasCarregando[lojaAtual]
       && holder.itens.some(x=>x._modo!=='ok'&&x.produtoEstoqueId)){
      carregarReservadas(lojaAtual).then(m=>{ if(m && container.isConnected) drawRows(); });
    }

    // ── Autocomplete de produto ──
    wrap.querySelectorAll('[data-pac]').forEach(inp=>{
      const i = Number(inp.dataset.pac);
      const drop = document.getElementById('pacDrop_'+i);
      let pacTimer=null, pacFocus=-1, pacAchados=[];
      function fecharDrop(){ drop.style.display='none'; pacFocus=-1; }
      function renderDrop(lista){
        pacAchados=lista;
        if(!lista.length){ drop.innerHTML='<div class="prod-ac-item" style="color:var(--ink-faint);">Nenhum produto encontrado. Confira o nome ou marque “Item avulso”.</div>'; drop.style.display='block'; return; }
        drop.innerHTML=lista.map((p,k)=>`<div class="prod-ac-item" data-pk="${k}"><b>${escapeHtml(p.nome)}</b><span>${[p.codigo?'Cód. '+escapeHtml(String(p.codigo)):null,p.fator!=null&&p.fator!==''?'Fator '+escapeHtml(String(p.fator)):null,p.fornecedor?escapeHtml(p.fornecedor):null,p.precoVenda!=null?fmtMoeda(p.precoVenda):null].filter(Boolean).join(' · ')}</span></div>`).join('');
        drop.style.display='block';
        drop.querySelectorAll('.prod-ac-item[data-pk]').forEach(el=>{
          el.addEventListener('mouseover',()=>{ pacFocus=Number(el.dataset.pk); drop.querySelectorAll('.prod-ac-item').forEach((e,k)=>e.classList.toggle('pf',k===pacFocus)); });
          el.addEventListener('mousedown',e=>{ e.preventDefault(); selecionarProduto(i,pacAchados[Number(el.dataset.pk)]); });
        });
      }
      inp.addEventListener('input',()=>{ holder.itens[i].produto=inp.value; holder.itens[i].produtoEstoqueId=''; clearTimeout(pacTimer); pacTimer=setTimeout(()=>{
        const t=inp.value.toLowerCase().trim();
        if(!t){ fecharDrop(); return; }
        const codigoExato=/^\d{6,}$/.test(inp.value.trim());
        if(codigoExato){
          const porCod=vendaveis.find(p=>(p.codigoBarras&&String(p.codigoBarras).trim()===inp.value.trim())||(p.codigo&&String(p.codigo).trim()===inp.value.trim()));
          if(porCod){ selecionarProduto(i,porCod); fecharDrop(); return; }
        }
        renderDrop(filtrarProdutosBusca(vendaveis, inp.value));
      },120); });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.prod-ac-item[data-pk]');
        if(!items.length) return;
        if(e.key==='ArrowDown'){ e.preventDefault(); pacFocus=Math.min(pacFocus+1,items.length-1); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); pacFocus=Math.max(pacFocus-1,0); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='Enter'){ e.preventDefault();
          if(pacFocus>=0) selecionarProduto(i,pacAchados[pacFocus]);
          else if(pacAchados.length===1) selecionarProduto(i,pacAchados[0]);
        }
        else if(e.key==='Escape'){ fecharDrop(); }
      });
      inp.addEventListener('blur',()=>{ setTimeout(fecharDrop,150); });
      inp.focus();
    });
    // Item avulso (sem estoque): desvincula do catálogo e pede descrição livre
    wrap.querySelectorAll('[data-itavulso]').forEach(chk=>{
      chk.addEventListener('change',()=>{
        const it=holder.itens[Number(chk.dataset.itavulso)];
        it.avulso=chk.checked;
        if(it.avulso){ it.produtoEstoqueId=''; }
        drawRows(); updateTotalHint();
        if(it.avulso){ const d=wrap.querySelector('[data-avulsodesc="'+chk.dataset.itavulso+'"]'); if(d) d.focus(); }
      });
    });
    wrap.querySelectorAll('[data-avulsodesc]').forEach(inp=>{
      inp.addEventListener('input',()=>{ holder.itens[Number(inp.dataset.avulsodesc)].produto=inp.value; });
    });
    // ＋ confirma → compacto + nova linha vazia
    wrap.querySelectorAll('[data-itadd]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.itadd);
        const it=holder.itens[idx];
        if(!it.produtoEstoqueId&&!it.valorUnitario&&!(it.produto||'').trim()&&!it.avulso) return;
        if(!it.produtoEstoqueId&&!it.avulso){ showToast('Escolha o produto na lista de busca ou marque "Item avulso (sem estoque)".'); return; }
        if(it.avulso&&!(it.produto||'').trim()){ showToast('Descreva o item avulso.'); return; }
        it._modo='ok';
        holder.itens.splice(0,0,{id:uid('it'),produto:'',metal:'',quantidade:1,valorUnitario:'',produtoEstoqueId:'',precoOriginal:'',ajusteTipo:'nenhum',ajusteModo:'percentual',ajusteQtd:'',ajustePerc:'',ajusteValR:'',observacaoItem:'',_modo:'editar'});
        drawRows(); updateTotalHint();
      });
    });
    // ✏️ volta ao modo editar
    wrap.querySelectorAll('[data-iteditar]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        holder.itens[Number(btn.dataset.iteditar)]._modo='editar';
        drawRows(); updateTotalHint();
      });
    });
    // 💬 toggle obs
    wrap.querySelectorAll('[data-itobstoggle]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const box=document.getElementById('vendaObs_'+btn.dataset.itobstoggle);
        if(box) box.style.display=box.style.display==='block'?'none':'block';
      });
    });

    // Botão × limpa produto
    wrap.querySelectorAll('[data-paclear]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.paclear);
        const it=holder.itens[i];
        it.produtoEstoqueId=''; it.produto=''; it.precoOriginal=''; it.valorUnitario=''; it.ajusteTipo='nenhum'; it.ajusteQtd='';
        drawRows(); updateTotalHint();
      });
    });

    // ── Botões Desconto / Acréscimo ──
    wrap.querySelectorAll('[data-aidbtn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.idx2);
        const it=holder.itens[idx];
        const tipo=btn.dataset.aidbtn;
        // toggle: clicar no mesmo botão ativo desativa
        it.ajusteTipo = it.ajusteTipo===tipo ? 'nenhum' : tipo;
        // atualiza aparência dos botões sem redesenhar a linha inteira
        const row=wrap.querySelector('[data-idx="'+idx+'"]');
        row.querySelectorAll('[data-aidbtn]').forEach(b=>{
          b.classList.remove('ativo-desc','ativo-acr');
          if(it.ajusteTipo==='desconto'&&b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
          if(it.ajusteTipo==='acrescimo'&&b.dataset.aidbtn==='acrescimo') b.classList.add('ativo-acr');
        });
        if(it.ajusteTipo==='nenhum'){
          it.ajustePerc=''; it.ajusteValR='';
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          // restaura valor original
          if(it.precoOriginal!==''&&it.precoOriginal!=null){
            it.valorUnitario=it.precoOriginal;
            const inpVal=row.querySelector('[data-itfield="valorUnitario"]');
            if(inpVal) inpVal.value=Number(it.precoOriginal).toFixed(2);
          }
          updateTotalHint();
        } else {
          recalcularAjusteNovo(it, idx, row);
        }
      });
    });

    // ── Campos de valor e desconto ──
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input',()=>{
        const row=el.closest('[data-idx]');
        const idx=Number(row.dataset.idx);
        const field=el.dataset.itfield;
        const it=holder.itens[idx];

        if(field==='valorUnitario'){
          it.valorUnitario=el.value===''?'':parseFloat(el.value);
          it.precoOriginal=it.valorUnitario;
          // limpa desconto ao editar valor manualmente
          it.ajustePerc=''; it.ajusteValR=''; it.ajusteTipo='nenhum';
          row.querySelectorAll('[data-aidbtn]').forEach(b=>b.classList.remove('ativo-desc','ativo-acr'));
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          updateTotalHint(); return;
        }
        if(field==='ajustePerc'){
          it.ajustePerc=el.value===''?'':parseFloat(el.value);
          it.ajusteValR='';
          it.ajusteModo='percentual'; it.ajusteQtd=it.ajustePerc;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajustePerc!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='ajusteValR'){
          it.ajusteValR=el.value===''?'':parseFloat(el.value);
          it.ajustePerc='';
          it.ajusteModo='valor'; it.ajusteQtd=it.ajusteValR;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajusteValR!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='observacaoItem'){ it.observacaoItem=el.value; return; }
        it[field]=el.value; updateTotalHint();
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click',()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }

  // Seleciona produto pelo autocomplete
  function selecionarProduto(idx, produto){
    const it=holder.itens[idx];
    it.produtoEstoqueId=produto.id; it.produto=produto.nome; it.avulso=false;
    it.precoOriginal=produto.precoVenda!=null?produto.precoVenda:'';
    if(it.valorUnitario===''||it.valorUnitario==null) it.valorUnitario=it.precoOriginal||'';
    drawRows();
    // Foca no campo de valor após selecionar produto
    setTimeout(()=>{
      const row=container.querySelector('[data-idx="'+idx+'"]');
      if(row){ const v=row.querySelector('[data-itfield="valorUnitario"]'); if(v) v.focus(); }
    },50);
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    if(hint){
      // Na nova venda só contam os itens já adicionados (igual ao bloco de pagamento);
      // a linha que ainda está sendo digitada aparece como lembrete à parte.
      if(holder === window.__itensHolder){
        const ok = holder.itens.filter(it=>it._modo==='ok').reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0);
        const pend = holder.itens.filter(it=>it._modo!=='ok' && (it.produtoEstoqueId || it.avulso) && Number(it.valorUnitario)).reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0);
        hint.innerHTML = `<div class="total-itens">${pend>0 ? `<span class="muted pend">${ic('info',14)} ${fmtMoeda(pend)} ainda não adicionado — toque em “Adicionar” ou Enter</span>` : ''}Total dos itens <b>${fmtMoeda(ok)}</b></div>`;
      } else {
        hint.innerHTML = `<div class="total-itens">Total dos itens <b>${fmtMoeda(totalItens())}</b></div>`;
      }
    }
    // Avisa o bloco de pagamento para recalcular o total
    if(typeof window.__pagRedraw==='function') window.__pagRedraw();
  }
  draw();
  return { totalItens, refreshEstoque: drawRows };
}

/* ============================================================
   MODO EMBUTIDO — ver mesma explicação no painel-ordens.html.
   ============================================================ */
const EMBEDDED = window.self !== window.top;
let pendingAbrirId = null;
/* Chamado quando o shell muda a loja ativa. Re-renderiza o formulário de
   nova venda para refletir a loja nova. Aguarda o config se necessário. */
function atualizarFaixaLoja(){
  const faixa = document.getElementById('lojaFaixa');
  if(!faixa) return;
  if(window.__lojaAtual && window.__lojaAtual.nome){
    faixa.style.display = 'block';
    faixa.style.setProperty('--loja-cor', window.__lojaAtual.cor || 'var(--t-primary)');
    faixa.textContent = window.__lojaAtual.nome;
  } else {
    faixa.style.display = 'none';
  }
}
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!mensagemConfiavel(ev)) return;
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'converterOrcamento'){
      // Veio do módulo Orçamento ("🛒 Converter em Venda") via shell. Se o app ainda
      // não terminou de carregar (login/auth), fica pendente e roda no enterApp().
      pendingConverterOrcId = ev.data.id;
      processarConverterOrcamentoPendente();
    } else if(ev.data.type === 'pedirRascunho'){
      { const __ov = document.getElementById('modalOverlay'); if(__ov && __ov.classList.contains('show')) closeModal(); }
      if(EMBEDDED) parent.postMessage({ type:'semRascunho', modulo:'vendas' }, '*');
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    } else if(ev.data.type === 'abrirRegistro'){
      // Veio do "Leitor de código" no menu — pede pra abrir uma venda específica assim
      // que os dados estiverem carregados (se já estiverem, abre na hora).
      pendingAbrirId = ev.data.id;
      if(currentUser && Array.isArray(vendas) && vendas.length){
        const alvo = vendas.find(v=>v.id===pendingAbrirId);
        if(alvo){ abrirDetalheVenda(alvo); pendingAbrirId = null; }
      }
    } else if(ev.data.type === 'clientesAtualizados'){
      // O módulo Cadastro mexeu no cadastro de clientes. Como este módulo fica
      // vivo no iframe, a lista em memória ficaria velha — recarrega na hora.
      // Sem lista completa em memória: só limpa o cache local pra não usar dado velho.
      clientes = [];
    } else if(ev.data.type === 'lojaAtual'){
      // Shell avisou qual é a loja ativa (módulo Loja) — passa a filtrar a lista
      // de vendas por essa loja e já pré-seleciona ela em "Nova venda".
      window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
      invalidarReservadas();
      if(currentUser && window.__lojaAtual.id) carregarReservadas(window.__lojaAtual.id);
      atualizarFaixaLoja();
      if(currentUser && config) renderView();
    }
  });
}

/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  if(r.user.nivel === 'oficina'){ err.textContent = 'Esse acesso não tem permissão para o módulo de Vendas.'; err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null;
  __gatewaySenha = null;
  __appPronto = false;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  document.getElementById('linkConfigHub').style.display = currentUser.nivel==='diretoria' ? '' : 'none';
  buildTabs();
  currentTab = 'vendas';
  modoNovaVenda = false;
  if(EMBEDDED){
    const permitido = tabsForLevel();
    if(!permitido.some(t=>t.id===currentTab)) currentTab = permitido[0] ? permitido[0].id : 'vendas';
    parent.postMessage({ type:'tabs', modulo:'vendas', tabs: permitido, active: currentTab }, '*');
  }
  renderTabs();
  renderView();
  if(pendingAbrirId){
    const alvo = vendas.find(v=>v.id===pendingAbrirId);
    if(alvo) abrirDetalheVenda(alvo);
    pendingAbrirId = null;
  }
  invalidarReservadas();
  if(window.__lojaAtual && window.__lojaAtual.id) carregarReservadas(window.__lojaAtual.id);
  __appPronto = true;
  if(pendingConverterOrcId) processarConverterOrcamentoPendente();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function tabsForLevel(){
  const t = [
    { id:'vendas', label:'Lançadas', icon:'📋' },
  ];
  // Relatório fiscal: só diretoria e gerente
  if(currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente')){
    t.push({ id:'semnota', label:'Sem nota', icon:'⚠️' });
    t.push({ id:'comnota', label:'Com nota', icon:'🧾' });
    t.push({ id:'interloja', label:'Entre lojas', icon:'🔄' });
  }
  if(window.__permissoesAbasOverride){
    return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; modoNovaVenda = false; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    const icoTab = { vendas:'lista', semnota:'alerta', comnota:'recibo', interloja:'trocar' }[t.id];
    b.innerHTML = `<span class="mt-icon">${icoTab ? ic(icoTab, 20) : ''}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; modoNovaVenda = false; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'vendas', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.classList.toggle('modo-pdv', !!modoNovaVenda);
  if(!modoNovaVenda) __conversaoOrcamento = null;
  if(modoNovaVenda) renderNovaVenda(main);
  else if(currentTab==='vendas') renderVendas(main);
  else if(currentTab==='semnota') renderSemNota(main);
  else if(currentTab==='comnota') renderComNota(main);
  else if(currentTab==='interloja') renderInterloja(main);
}

/* ══════════════════════════════════════════════════════════════════════════════
   RELATÓRIO — VENDAS SEM NOTA FISCAL
   Lista as vendas gravadas com "Nota fiscal: Não" para regularização posterior:
   emitir a nota depois ou corrigir o lançamento. Só diretoria/gerente acessam.
   ══════════════════════════════════════════════════════════════════════════════ */
function renderSemNota(main){
  const lojaNome = (id)=>{ const l=(config.lojas||[]).find(x=>x.id===id); return l?l.nome:'—'; };
  const hojeStr = hoje();
  const diasEmAberto = (dataStr)=>{
    if(!dataStr) return 0;
    const d = new Date(dataStr+'T00:00:00'), h = new Date(hojeStr+'T00:00:00');
    return Math.max(0, Math.round((h-d)/86400000));
  };
  // Filtra vendas sem nota, não canceladas
  let lista = (vendas||[]).filter(v=> v.emissaoNota !== 'sim' && v.status !== 'cancelada');
  // Vendedora só vê da própria loja; gestão vê todas (com filtro)
  const fLojaSalvo = window.__semNotaFiltroLoja || '';
  if(fLojaSalvo) lista = lista.filter(v=> v.lojaId === fLojaSalvo);
  const fDe = window.__semNotaDe || '', fAte = window.__semNotaAte || '';
  if(fDe) lista = lista.filter(v=> (v.data||'') >= fDe);
  if(fAte) lista = lista.filter(v=> (v.data||'') <= fAte);
  lista.sort((a,b)=> (b.data||'').localeCompare(a.data||''));

  const total = lista.reduce((s,v)=> s + Number(v.valorTotal||0), 0);
  const antigas = lista.filter(v=> diasEmAberto(v.data) > 30).length;

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Vendas sem nota fiscal</h1>
        <p class="page-sub">Vendas lançadas com “Nota fiscal: Não”. Emita a nota e registre aqui, ou corrija o lançamento.</p>
      </div>
      <div class="page-acoes"><button class="btn btn-ghost" id="sn_excel">${ic('baixar')} Exportar planilha</button></div>
    </div>
    <div class="filters">
      <select id="sn_loja" aria-label="Loja"><option value="">Todas as lojas</option>${(config.lojas||[]).map(l=>`<option value="${l.id}" ${fLojaSalvo===l.id?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select>
      <input type="date" id="sn_de" value="${escapeHtml(fDe)}" aria-label="De" title="De">
      <span class="desc-sep">até</span>
      <input type="date" id="sn_ate" value="${escapeHtml(fAte)}" aria-label="Até" title="Até">
      <div class="faixa-resumo" style="margin-left:auto;">
        <span><b>${lista.length}</b> ${lista.length===1?'venda':'vendas'}</span>
        <span>Total <b>${fmtMoeda(total)}</b></span>
        ${antigas>0?`<span class="alerta"><b class="alerta">${antigas}</b> há mais de 30 dias</span>`:''}
      </div>
    </div>
    <div class="card card-tabela">
      ${lista.length===0 ? `<div class="estado-vazio">${ic('check',32)}<b>Nenhuma venda sem nota</b>Não há vendas sem nota neste período e loja.</div>` : `
      <table class="tabela-cartoes">
        <thead><tr><th>Data</th><th class="num">Dias</th><th>Via</th><th>Loja</th><th>Cliente</th><th>Vendedora</th><th class="num">Valor</th><th class="acoes"><span class="so-leitor">Ações</span></th></tr></thead>
        <tbody>
          ${lista.map(v=>{
            const dias = diasEmAberto(v.data);
            return `<tr>
              <td class="so-mesa">${fmtDate(v.data)}</td>
              <td class="num so-mesa">${dias>30?`<span class="badge selo-danger">${dias}</span>`:dias}</td>
              <td class="so-mesa">${escapeHtml(v.codigoVia||'—')}</td>
              <td class="so-mesa">${escapeHtml(lojaNome(v.lojaId))}</td>
              <td class="c-cli"><span class="so-mesa cli-nome">${escapeHtml(v.cliente||'Não identificado')}</span>
                <div class="so-cel"><div class="cel-topo"><span class="cli-nome">${escapeHtml(v.cliente||'Não identificado')}</span><span class="cel-total">${fmtMoeda(v.valorTotal)}</span></div>
                <div class="cel-meta">${fmtDate(v.data)} · ${escapeHtml(v.codigoVia||'sem via')} · ${escapeHtml(lojaNome(v.lojaId))} · ${escapeHtml(v.vendedora||'—')}</div>
                <div class="selos-linha"><span class="badge ${dias>30?'selo-danger':'selo-wait'}">${dias} ${dias===1?'dia':'dias'} sem nota</span></div></div></td>
              <td class="so-mesa">${escapeHtml(v.vendedora||'—')}</td>
              <td class="num so-mesa">${fmtMoeda(v.valorTotal)}</td>
              <td class="acoes"><div class="acoes-linha">
                ${btnIcone('olho','Ver detalhes da venda',`data-ver="${v.id}"`)}
                <button type="button" class="btn btn-ghost btn-sm" data-marcar="${v.id}">${ic('check',14)} Nota emitida</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  // Filtros
  const aplicar = ()=>{
    window.__semNotaFiltroLoja = document.getElementById('sn_loja').value;
    window.__semNotaDe = document.getElementById('sn_de').value;
    window.__semNotaAte = document.getElementById('sn_ate').value;
    renderView();
  };
  document.getElementById('sn_loja').addEventListener('change', aplicar);
  document.getElementById('sn_de').addEventListener('change', aplicar);
  document.getElementById('sn_ate').addEventListener('change', aplicar);
  // Ver detalhe
  main.querySelectorAll('[data-ver]').forEach(b=> b.addEventListener('click', ()=>{
    const v = vendas.find(x=>x.id===b.dataset.ver); if(v) abrirDetalheVenda(v);
  }));
  // Marcar nota emitida
  main.querySelectorAll('[data-marcar]').forEach(b=> b.addEventListener('click', ()=>{
    const v = vendas.find(x=>x.id===b.dataset.marcar); if(v) marcarNotaEmitida(v);
  }));
  // Exportar
  const btnX = document.getElementById('sn_excel');
  if(btnX) btnX.addEventListener('click', ()=> exportarSemNota(lista));
}

/** Registra que a nota desta venda foi emitida (informando o número), tirando-a do relatório. */
function marcarNotaEmitida(v){
  openModal(`
    <h3>Registrar nota emitida</h3>

  `);

/* ══════════════════════════════════════════════════════════════════════════════
   RELATÓRIO — VENDAS ENTRE LOJAS (peça de um CNPJ vendida por outro)
   Lista as vendas em que a joia saiu de uma empresa diferente da que fez a venda
   ou da que emitiu a nota. Cada linha precisa de acerto fiscal entre os CNPJs
   (venda à ordem ou consignação) — o relatório é o que o contador usa pra isso.
   ══════════════════════════════════════════════════════════════════════════════ */
function renderInterloja(main){
  const lojaNome = (id)=>{ const l=(config.lojas||[]).find(x=>x.id===id); return l?l.nome:'—'; };
  const lojaAbrev = (id)=>{ const l=(config.lojas||[]).find(x=>x.id===id); return l?(l.abreviacao||l.nome):'—'; };

  // Venda interloja = a joia saiu de empresa diferente da loja da venda,
  // OU a nota foi emitida por empresa diferente de onde a joia saiu.
  let lista = (vendas||[]).filter(v=>{
    if(v.status === 'cancelada') return false;
    const saida = v.lojaSaidaId || '';
    if(saida && saida !== v.lojaId) return true;
    if(v.emissaoNota==='sim' && v.lojaNotaId && saida && v.lojaNotaId !== saida) return true;
    return false;
  });

  const fDe = window.__ilDe || '', fAte = window.__ilAte || '';
  if(fDe) lista = lista.filter(v=> (v.data||'') >= fDe);
  if(fAte) lista = lista.filter(v=> (v.data||'') <= fAte);
  lista.sort((a,b)=> (b.data||'').localeCompare(a.data||''));

  const total = lista.reduce((s,v)=> s + Number(v.valorTotal||0), 0);
  const semBaixa = lista.filter(v=> !v.baixaEstoqueConfirmada).length;

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Vendas entre lojas</h1>
        <p class="page-sub">A joia saiu de uma empresa e a venda ou a nota foi de outra. Cada uma precisa de acerto fiscal entre os CNPJs.</p>
      </div>
      <div class="page-acoes"><button class="btn btn-ghost" id="il_excel">${ic('baixar')} Exportar planilha</button></div>
    </div>
    <div class="filters">
      <span class="pag-info-cel-label">Período</span>
      <input type="date" id="il_de" value="${escapeHtml(fDe)}" aria-label="De" title="De">
      <span class="desc-sep">até</span>
      <input type="date" id="il_ate" value="${escapeHtml(fAte)}" aria-label="Até" title="Até">
      <div class="faixa-resumo" style="margin-left:auto;">
        <span><b>${lista.length}</b> ${lista.length===1?'venda':'vendas'}</span>
        <span>Total <b>${fmtMoeda(total)}</b></span>
        ${semBaixa>0?`<span class="atencao"><b class="atencao">${semBaixa}</b> aguardando baixa manual</span>`:''}
      </div>
    </div>
    <div class="card card-tabela">
      ${lista.length===0 ? `<div class="estado-vazio">${ic('loja',32)}<b>Nenhuma venda entre lojas</b>Não há vendas entre lojas neste período.</div>` : `
      <table class="tabela-cartoes">
        <thead><tr><th>Data</th><th>Via</th><th>Joia saiu de</th><th>Vendida por</th><th>Nota por</th><th>Baixa em</th><th class="num">Valor</th><th class="acoes"><span class="so-leitor">Ações</span></th></tr></thead>
        <tbody>
          ${lista.map(v=>`<tr>
            <td class="so-mesa">${fmtDate(v.data)}</td>
            <td class="so-mesa">${escapeHtml(v.codigoVia||'—')}</td>
            <td class="so-mesa"><b>${escapeHtml(lojaAbrev(v.lojaSaidaId))}</b></td>
            <td class="so-mesa">${escapeHtml(lojaAbrev(v.lojaId))}</td>
            <td class="so-mesa">${v.emissaoNota==='sim' ? escapeHtml(lojaAbrev(v.lojaNotaId)) : '<span class="badge selo-neutro">Sem nota</span>'}</td>
            <td class="so-mesa">${v.lojaBaixaEstoqueId ? escapeHtml(lojaAbrev(v.lojaBaixaEstoqueId)) : '—'} ${v.baixaEstoqueConfirmada?'<span class="badge selo-ok">Feita</span>':'<span class="badge selo-wait">Pendente</span>'}</td>
            <td class="num so-mesa">${fmtMoeda(v.valorTotal)}</td>
            <td class="c-cli so-cel"><div class="cel-topo"><span class="cli-nome">${escapeHtml(v.codigoVia||'Sem via')}</span><span class="cel-total">${fmtMoeda(v.valorTotal)}</span></div>
              <div class="cel-meta">${fmtDate(v.data)} · Joia de <b>${escapeHtml(lojaAbrev(v.lojaSaidaId))}</b> · Vendida por ${escapeHtml(lojaAbrev(v.lojaId))} · Nota ${v.emissaoNota==='sim' ? 'por '+escapeHtml(lojaAbrev(v.lojaNotaId)) : 'não emitida'}</div>
              <div class="selos-linha"><span class="badge ${v.baixaEstoqueConfirmada?'selo-ok':'selo-wait'}">Baixa ${v.baixaEstoqueConfirmada?'feita':'pendente'}${v.lojaBaixaEstoqueId?' em '+escapeHtml(lojaAbrev(v.lojaBaixaEstoqueId)):''}</span></div></td>
            <td class="acoes"><div class="acoes-linha">
              ${btnIcone('olho','Ver detalhes da venda',`data-ilver="${v.id}"`)}
              ${!v.baixaEstoqueConfirmada?`<button type="button" class="btn btn-ghost btn-sm" data-ilbaixa="${v.id}">${ic('check',14)} Baixa feita</button>`:''}
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  const aplicar = ()=>{
    window.__ilDe = document.getElementById('il_de').value;
    window.__ilAte = document.getElementById('il_ate').value;
    renderView();
  };
  document.getElementById('il_de').addEventListener('change', aplicar);
  document.getElementById('il_ate').addEventListener('change', aplicar);
  main.querySelectorAll('[data-ilver]').forEach(b=> b.addEventListener('click', ()=>{

  }));
  main.querySelectorAll('[data-ilbaixa]').forEach(b=> b.addEventListener('click', async ()=>{
    const v = vendas.find(x=>x.id===b.dataset.ilbaixa); if(!v) return;
    if(!confirm('Confirmar que a baixa de estoque foi feita manualmente na empresa ' + lojaNome(v.lojaBaixaEstoqueId||v.lojaSaidaId) + '?')) return;
    v.baixaEstoqueConfirmada = true;
    v.baixaConfirmadaEm = new Date().toISOString();
    v.baixaConfirmadaPor = currentUser ? currentUser.nome : '';
    const ok = await vendaSalvar(v);
    if(ok){ showToast('Baixa confirmada.'); renderView(); } else showToast('Não foi possível salvar. Confira a internet e tente de novo.');
  }));
  const btnX = document.getElementById('il_excel');
  if(btnX) btnX.addEventListener('click', ()=>{
    const linhas = [['Data','Via','Joia saiu de','Vendida por','Nota por','Baixa em','Cliente','Valor']];
    lista.forEach(v=> linhas.push([
      v.data||'', v.codigoVia||'', lojaNome(v.lojaSaidaId), lojaNome(v.lojaId),
      v.emissaoNota==='sim'?lojaNome(v.lojaNotaId):'sem nota',
      v.lojaBaixaEstoqueId?lojaNome(v.lojaBaixaEstoqueId):'',
      v.cliente||'', Number(v.valorTotal||0).toFixed(2).replace('.',',')
    ]));
    const csv = linhas.map(l=> l.map(c=> '"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vendas-entre-lojas-'+hoje()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  });
}

/** Exporta o relatório em CSV (abre no Excel). */
function exportarSemNota(lista){
  const lojaNome = (id)=>{ const l=(config.lojas||[]).find(x=>x.id===id); return l?l.nome:''; };
  const linhas = [['Data','Via','Loja','Cliente','Vendedora','Valor','Forma de pagamento']];
  lista.forEach(v=>{
    const formas = (v.pagamentos||[]).map(p=>p.tipoNome||p.tipo||'').filter(Boolean).join(' + ');
    linhas.push([ v.data||'', v.codigoVia||'', lojaNome(v.lojaId), v.cliente||'', v.vendedora||'', Number(v.valorTotal||0).toFixed(2).replace('.',','), formas ]);
  });
  const csv = linhas.map(l=> l.map(c=> '"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vendas-sem-nota-'+hoje()+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

/**
 * Se o cliente tem orçamento(s) em aberto (status que não "encerra"), mostra uma
 * tela com a lista: dá pra ver os itens, mudar o status, ou confirmar que um deles
 * é exatamente o que está virando esta venda agora (marca como aprovado).
 */
function mostrarOrcamentosAbertosModal(cliente, aoConfirmar){
  const abertos = orcamentosAbertosDoCliente(cliente);
  if(abertos.length === 0) return;
  openModal(`
    <h3>${escapeHtml(cliente.nome)} tem ${abertos.length===1?'1 orçamento em aberto':abertos.length+' orçamentos em aberto'}</h3>
    <p class="muted">Se um deles é o que está virando esta venda, toque em “É este” para trazer os itens. Nos outros, vale conferir o status com o cliente.</p>
    <div id="orcAbertosLista" style="margin-top:14px;"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharOrcAbertos">Continuar sem orçamento</button></div>
  `);
  function draw(){
    const wrap = document.getElementById('orcAbertosLista');
    if(abertos.length===0){ wrap.innerHTML = '<p class="muted">Nenhum orçamento em aberto restante.</p>'; return; }
    wrap.innerHTML = abertos.map(o=>{
      const info = statusInfoDe(o.status);
      return `<div class="orc-aberto">
        <div class="orc-aberto-topo">
          <div><b class="num">${fmtMoeda(o.valorTotal)}</b> <span class="muted">· ${fmtDate(o.data)} · válido até ${fmtDate(o.validade)}</span></div>
          <span class="badge selo-wait">${escapeHtml(info?info.nome:o.status)}</span>
        </div>
        <div class="orc-aberto-acoes">
          <button type="button" class="btn btn-ghost btn-sm" data-verorc="${o.id}">${ic('lista',14)} Ver itens</button>
          <select data-statusorc="${o.id}" aria-label="Status do orçamento" style="max-width:180px;min-height:32px;padding:4px 8px;font-size:13px;">${statusList().map(s=>`<option value="${s.id}" ${o.status===s.id?'selected':''}>${escapeHtml(s.nome)}</option>`).join('')}</select>
          <button type="button" class="btn btn-accent btn-sm" data-confirmarorc="${o.id}" style="margin-left:auto;">${ic('check',14)} É este</button>
        </div>
        <div data-itensorc="${o.id}" style="display:none; margin-top:8px; font-size:13px; color:var(--ink-soft);"></div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('[data-verorc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const o = abertos.find(x=>x.id===b.dataset.verorc);
        const div = wrap.querySelector(`[data-itensorc="${o.id}"]`);
        div.style.display = div.style.display==='none' ? 'block' : 'none';
        div.innerHTML = (o.itens||[]).map(it=>`${escapeHtml(it.produto)} × ${escapeHtml(String(it.quantidade))} — ${fmtMoeda(it.valorUnitario)}`).join('<br>') || 'Este orçamento não tem itens.';
      });
    });
    wrap.querySelectorAll('[data-statusorc]').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const o = abertos.find(x=>x.id===sel.dataset.statusorc);
        o.status = sel.value;
        await orcamentoSalvar(o);
        showToast('Status atualizado.');
        const infoNovo = statusInfoDe(o.status);
        if(infoNovo && infoNovo.encerra){ abertos.splice(abertos.indexOf(o),1); }
        draw();
      });
    });
    wrap.querySelectorAll('[data-confirmarorc]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const o = abertos.find(x=>x.id===b.dataset.confirmarorc);
        // Carrega os itens do orçamento no carrinho e vincula (o "convertidoEm" é gravado
        // quando a venda for lançada). Se a pessoa não quiser substituir o carrinho, não faz nada.
        if(typeof aoConfirmar === 'function' && aoConfirmar(o) === false) return;
        const statusAprovado = statusAprovadoOrcamento();
        o.status = statusAprovado.id;
        await orcamentoSalvar(o);
        showToast('Orçamento confirmado como esta venda — itens carregados no carrinho.');
        abertos.splice(abertos.indexOf(o),1);
        draw();
      });
    });
  }
  draw();
  document.getElementById('btnFecharOrcAbertos').addEventListener('click', closeModal);
}

   ============================================================ */
let __conversaoOrcamento = null;      // { orcamentoId, orcamento, cliente } — vínculo do formulário de nova venda
let pendingConverterOrcId = null;     // pedido do shell que chegou antes do app estar pronto
let __appPronto = false;
function codigoOrcamento(o){ return (o && (o.codigoVia || o.codigo)) || (o && o.id ? String(o.id).slice(-8) : ''); }
function statusAprovadoOrcamento(){
  const lista = statusList();
  return lista.find(s=>s.id==='aprovado') || lista.find(s=>s.encerra && s.id!=='recusado') || lista.find(s=>s.encerra) || lista[0];
}
function itensDoOrcamentoParaVenda(o){
  return (o.itens||[]).filter(it=>it && (it.produto || it.produtoEstoqueId)).map(it=>{
    const vinculado = it.produtoEstoqueId && produtosEstoque.some(p=>p.id===it.produtoEstoqueId) ? it.produtoEstoqueId : '';
    return {
      id: uid('it'), produto: it.produto||'', metal: it.metal||'', quantidade: Number(it.quantidade)||1,
      valorUnitario: it.valorUnitario!==undefined && it.valorUnitario!==null ? it.valorUnitario : '',
      produtoEstoqueId: vinculado, avulso: !vinculado && !!it.avulso,
      precoOriginal: it.precoOriginal!==undefined && it.precoOriginal!=='' ? it.precoOriginal : (it.valorUnitario!==undefined ? it.valorUnitario : ''),
      ajusteTipo: it.ajusteTipo||'nenhum', ajusteModo: it.ajusteModo||'percentual', ajusteQtd: it.ajusteQtd!==undefined ? it.ajusteQtd : '',
      ajustePerc: it.ajustePerc!==undefined ? it.ajustePerc : '', ajusteValR: it.ajusteValR!==undefined ? it.ajusteValR : '',
      observacaoItem: it.observacaoItem||'', _modo:'ok'
    };
  });
}
/** Acha o cliente do orçamento no cadastro (id, telefone/CPF); se não achar, usa nome/telefone do orçamento. */
async function clienteDoOrcamento(o){
  let c = null;
  try{
    if(o.clienteId) c = clientes.find(x=>x.id===o.clienteId) || null;
    if(!c && (o.telefone || o.cpf)) c = await buscarClientePorTelefoneOuCpf(o.telefone||'', o.cpf||'');
  }catch(e){ console.error('erro ao localizar cliente do orçamento', e); }
  if(c) return c;
  return o.cliente ? { nome: o.cliente, telefone: o.telefone||'', email: o.email||'' } : null;
}
/** Shell pediu "Converter em Venda": abre a nova venda já preenchida com o orçamento. */
async function processarConverterOrcamentoPendente(){
  const id = pendingConverterOrcId;
  if(!id || !__appPronto) return;
  pendingConverterOrcId = null;
  const lista = await orcamentosGet();
  if(Array.isArray(lista) && lista.length) orcamentos = lista;
  const o = orcamentos.find(x=>x.id===id);
  if(!o){ showToast('Orçamento não encontrado.'); return; }
  if(o.convertidoEm && !confirm(`Este orçamento já foi convertido em ${o.convertidoEm.tipo==='pedido'?'Pedido':'Venda'} ${o.convertidoEm.codigo||''}. Criar outra venda a partir dele mesmo assim?`)) return;
  const cliente = await clienteDoOrcamento(o);
  { const ov = document.getElementById('modalOverlay'); if(ov && ov.classList.contains('show')) closeModal(); }
  __conversaoOrcamento = { orcamentoId: o.id, orcamento: o, cliente };
  modoNovaVenda = true;
  renderView();
  showToast('Venda a partir do orçamento ' + codigoOrcamento(o) + ' — confira os itens e o pagamento.');
}
/** Depois de lançar a venda: orçamento vira "aprovado" e guarda em qual venda foi convertido. */
async function marcarOrcamentoConvertidoEmVenda(orcamentoId, venda){
  let o = orcamentos.find(x=>x.id===orcamentoId);
  if(!o){ const lista = await orcamentosGet(); if(Array.isArray(lista) && lista.length) orcamentos = lista; o = orcamentos.find(x=>x.id===orcamentoId); }
  if(!o){ console.error('orçamento de origem não encontrado', orcamentoId); return; }
  o.status = statusAprovadoOrcamento().id;
  o.convertidoEm = { tipo:'venda', id: venda.id, codigo: venda.codigoVia || String(venda.id).slice(-8), data: new Date().toISOString() };
  const ok = await orcamentoSalvar(o);
  if(!ok) showToast('Venda lançada, mas não foi possível marcar o orçamento como convertido.');
}
/** Retorna o texto do aviso se a venda vai consumir unidades reservadas (ou '' se não). */
async function avisoConsumoReservado(reservas, lojaId){
  const ids = Object.keys(reservas||{}).filter(id=> reservas[id] > 0);
  if(!lojaId || ids.length===0) return '';
  const r = await estoqueApi('reservadas', { lojaId, produtoIds: ids });
  let mapa;
  if(r && r.ok && Array.isArray(r.data)){ mapa = reservadasMapaDeLinhas(r.data, lojaId); }
  else if(__reservadasPorLoja[lojaId]){ mapa = __reservadasPorLoja[lojaId]; }
  else return '';
  const linhas = [];
  ids.forEach(id=>{
    const reservado = Number(mapa[id])||0;
    if(reservado <= 0) return;
    const p = produtosEstoque.find(x=>x.id===id);
    const emEstoque = p ? (Number((p.estoquePorLoja||{})[lojaId])||0) : 0;
    const disponivel = Math.max(0, emEstoque - reservado);
    const usar = Number(reservas[id])||0;
    if(usar <= disponivel + 1e-9) return;
    const n = Math.min(reservado, usar - disponivel);
    linhas.push(`${Number(n.toFixed(3))} unidade(s) de "${p ? p.nome : id}" estão reservadas para pedido/transferência.`);
  });
  if(linhas.length===0) return '';
  return linhas.join('\n') + '\n\nVender mesmo assim?';
}

/** Atualiza a barra fixa de fechamento (total, quanto falta, pronto para lançar).
 *  Só apresentação: lê o total final do campo escondido do bloco de pagamento. */
function atualizarBarraPdv(total, pago){
  const elT = document.getElementById('pdvBarraTotal');
  const elS = document.getElementById('pdvBarraStatus');
  if(!elT || !elS) return;
  const inp = document.getElementById('pagValorTotal');
  const t = inp && inp.value !== '' ? (Number(inp.value)||0) : (Number(total)||0);
  const p = Number(pago)||0;
  elT.textContent = fmtMoeda(t);
  const saldo = t - p;
  if(t <= 0 && p <= 0){ elS.className = 'pdv-barra-status neutro'; elS.textContent = 'Adicione os itens da venda.'; }
  else if(saldo > 0.009){ elS.className = 'pdv-barra-status falta'; elS.innerHTML = ic('alerta',14) + ' Falta cobrir ' + fmtMoeda(saldo); }
  else if(saldo < -0.009){ elS.className = 'pdv-barra-status excede'; elS.innerHTML = ic('alerta',14) + ' Pagamento passa do total em ' + fmtMoeda(-saldo); }
  else { elS.className = 'pdv-barra-status ok'; elS.innerHTML = ic('check',14) + ' Pagamento completo'; }
}

}

function renderNovaVenda(main){
  if(!currentUser || !config){
    // config ainda não chegou do servidor — aguarda e tenta de novo
    main.innerHTML='<p class="muted" style="padding:24px;">Carregando…</p>';

  }
  main.innerHTML = `
    <div class="page-head">

              <div class="loja-fixa">${ic('loja')} ${escapeHtml(window.__lojaAtual && window.__lojaAtual.nome ? window.__lojaAtual.nome : 'Escolha a loja no topo')}</div>
              <input type="hidden" id="v_loja" value="${window.__lojaAtual ? escapeHtml(window.__lojaAtual.id) : ''}">
            </div>
            <div class="field"><label for="v_vendedora">Vendedora</label>${vendedoraTravadaNoLogin() ? `<input id="v_vendedora" value="${escapeHtml(vendedoraTravadaNoLogin())}" readonly title="Preenchido com o seu login">` : `<select id="v_vendedora">${vendedoraOptionsHtml('')}</select>`}</div>
            <div class="field"><label for="v_data">Data da venda</label><input type="date" id="v_data" value="${todayStr()}" readonly tabindex="-1" title="A data da venda é sempre o dia de hoje" style="pointer-events:none;"></div>
          </div>
          <input type="hidden" id="v_cliente"><input type="hidden" id="v_telefone">
        </div>

        <div class="card"><div id="itensContainerNova"></div></div>
        <div class="card">
          <div class="obs-geral-box">
            <label for="v_observacaoGeral">Observação da venda <span class="muted">(opcional — sai na via impressa)</span></label>
            <textarea id="v_observacaoGeral" placeholder="Ex.: embrulhar para presente"></textarea>
          </div>
          <div class="info-interna-box" id="infoInternaBox" style="display:none;">
            <div class="info-interna-badge">${ic('cadeado',12)} Informação interna — só a equipe vê</div>
            <textarea id="v_infoInterna" placeholder="Anotações internas (não saem na via do cliente)"></textarea>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="btnToggleInfoInterna" style="margin-top:10px;">${ic('cadeado',14)} Adicionar informação interna</button>
        </div>
      </div>
      <div class="pdv-lado">
        <div class="card"><div id="pagamentoContainerNova"></div></div>
      </div>
    </div>
    <div class="pdv-barra" role="region" aria-label="Fechamento da venda">
      <div class="pdv-barra-total"><span>Total da venda</span><strong id="pdvBarraTotal">${fmtMoeda(0)}</strong></div>
      <div class="pdv-barra-status neutro" id="pdvBarraStatus">Adicione os itens da venda.</div>
      <div class="pdv-barra-acoes">
        <button class="btn btn-ghost" id="btnLimparVenda" title="Apagar tudo e começar de novo">Limpar</button>
        <button class="btn btn-accent btn-lg" id="btnSalvarVenda">${ic('check',18)} Lançar venda</button>
      </div>
    </div>
  `;
  const linkVoltarV = document.getElementById('linkVoltarVendas');
  if(linkVoltarV) linkVoltarV.addEventListener('click', (e)=>{ e.preventDefault(); __conversaoOrcamento = null; modoNovaVenda = false; currentTab = 'vendas'; renderTabs(); renderView(); });
  const tempItensHolder = { itens:[ { id: uid('it'), produto:'', metal:'', quantidade:1, valorUnitario:'', produtoEstoqueId:'', precoOriginal:'', ajusteTipo:'nenhum', ajusteModo:'percentual', ajusteQtd:'', ajustePerc:'', ajusteValR:'', observacaoItem:'', _modo:'editar' } ] };
  window.__itensHolder = tempItensHolder; // exposto para calcTotalItens() no bloco de pagamento
  // Venda a partir de um orçamento (Converter em Venda / "✓ É este"): carrega os itens
  // e guarda o vínculo (orcamentoOrigemId) pra marcar o orçamento como convertido ao salvar.
  const formState = { orcamentoOrigemId: __conversaoOrcamento ? __conversaoOrcamento.orcamentoId : null };
  if(__conversaoOrcamento && __conversaoOrcamento.orcamento){
    tempItensHolder.itens.push(...itensDoOrcamentoParaVenda(__conversaoOrcamento.orcamento));
  }
  // Novo formulário = número de reservas fresco (outros módulos podem ter reservado).
  { const lj = window.__lojaAtual && window.__lojaAtual.id; if(lj){ delete __reservadasPorLoja[lj]; delete __reservadasFalhou[lj]; } }
  const __itensEl = document.getElementById('itensContainerNova');
  const __pagEl = document.getElementById('pagamentoContainerNova');
  if(!__itensEl || !__pagEl){
    // Containers não estão no DOM ainda — alguma condição de corrida.
    // Tenta de novo em 200ms, que é tempo suficiente pro DOM estabilizar.
    setTimeout(()=>{ if(modoNovaVenda) renderView(); }, 200);
    return;
  }
  const itensApi = mountItens(__itensEl, tempItensHolder, ()=> document.getElementById('v_loja').value);
  function desenharBannerOrcamento(){
    const el = document.getElementById('orcOrigemBanner');
    if(!el) return;
    const o = __conversaoOrcamento && __conversaoOrcamento.orcamento;
    formState.orcamentoOrigemId = __conversaoOrcamento ? __conversaoOrcamento.orcamentoId : null;
    if(!o){ el.innerHTML = ''; return; }
    el.innerHTML = `<div class="banner-orc">
      <span style="display:inline-flex;align-items:center;gap:8px;">${ic('documento')} <span>Venda a partir do orçamento <b>${escapeHtml(codigoOrcamento(o))}</b> — ${escapeHtml(o.cliente||'')} · ${fmtMoeda(o.valorTotal)} <span class="muted">(${fmtDate(o.data)})</span></span></span>
      <button type="button" class="btn btn-ghost btn-sm" id="btnDesvincularOrc" title="Esta venda não vai mais marcar o orçamento como convertido">${ic('x',14)} Desvincular</button>
    </div>`;
    document.getElementById('btnDesvincularOrc').addEventListener('click', ()=>{ __conversaoOrcamento = null; desenharBannerOrcamento(); });
  }
  desenharBannerOrcamento();
  /** "✓ É este" no aviso de orçamentos em aberto: carrega os itens do orçamento no carrinho. */
  function carregarOrcamentoNoCarrinho(o){
    const temItens = tempItensHolder.itens.some(itemTemConteudo);
    if(temItens && !confirm('O carrinho já tem itens. Substituir pelos itens deste orçamento?')) return false;
    __conversaoOrcamento = { orcamentoId: o.id, orcamento: o, cliente: __conversaoOrcamento ? __conversaoOrcamento.cliente : null };
    const vazia = { id: uid('it'), produto:'', metal:'', quantidade:1, valorUnitario:'', produtoEstoqueId:'', precoOriginal:'', ajusteTipo:'nenhum', ajusteModo:'percentual', ajusteQtd:'', ajustePerc:'', ajusteValR:'', observacaoItem:'', _modo:'editar' };
    tempItensHolder.itens.splice(0, tempItensHolder.itens.length, vazia, ...itensDoOrcamentoParaVenda(o));
    itensApi.refreshEstoque();
    desenharBannerOrcamento();
    return true;
  }
  // loja fixa pelo contexto do shell — sem listener de troca
  const tempPagHolder = { valorTotal:null, pagamentos:[] };
  mountPagamentos(__pagEl, tempPagHolder, ()=> document.getElementById('v_loja').value);
  // Foco automático no primeiro campo de produto — agiliza quem já sabe o que vai
  // vender (com o select nativo, dá pra digitar o começo do nome pra pular direto).
  // Observação: hoje o produto é escolhido por uma lista suspensa (não por um campo
  // de texto/código), então não tem como ler um leitor de código de barras de 1 bip
  // ainda — isso exigiria cadastrar um código em cada produto, que não existe hoje.
  setTimeout(()=>{
    const primeiroSelectProduto = document.querySelector('#itensContainerNova select[data-itfield="produtoEstoqueId"]');
    if(primeiroSelectProduto) primeiroSelectProduto.focus();
  }, 50);

  // Autocomplete inline de cliente
  const clienteDaConversao = __conversaoOrcamento ? __conversaoOrcamento.cliente : null;
  if(clienteDaConversao){
    document.getElementById('v_cliente').value = clienteDaConversao.nome || '';
    document.getElementById('v_telefone').value = clienteDaConversao.telefone || '';
  }
  montarClienteAutocomplete(
    document.getElementById('v_clienteAcWrap'),
    (clienteFinal)=>{
      if(clienteFinal){
        document.getElementById('v_cliente').value = clienteFinal.nome || '';
        document.getElementById('v_telefone').value = clienteFinal.telefone || '';
        mostrarOrcamentosAbertosModal(clienteFinal, carregarOrcamentoNoCarrinho);
      } else {
        document.getElementById('v_cliente').value = '';
        document.getElementById('v_telefone').value = '';

    },
