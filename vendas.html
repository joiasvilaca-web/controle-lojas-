  document.getElementById('btnLimparVenda').addEventListener('click', ()=>{ __conversaoOrcamento = null; renderNovaVenda(main); });
  balaoCancelarPreenchimento(main, ()=>{ __conversaoOrcamento = null; modoNovaVenda = false; renderView(); });
  document.getElementById('btnToggleInfoInterna').addEventListener('click', ()=>{
    const box = document.getElementById('infoInternaBox');
    const btn = document.getElementById('btnToggleInfoInterna');
    const visivel = box.style.display !== 'none';
    box.style.display = visivel ? 'none' : 'block';
    btn.innerHTML = ic('cadeado',14) + (visivel ? ' Adicionar informação interna' : ' Esconder informação interna');
    if(!visivel) document.getElementById('v_infoInterna').focus();
  });

  document.getElementById('btnSalvarVenda').addEventListener('click', travarCliqueDuplo(async ()=>{
    const lojaId = document.getElementById('v_loja').value;
    if(!lojaId){ showToast('Escolha a loja no topo da tela antes de lançar a venda.'); return; }
    if(await bloqueadoPorCaixaFechado(lojaId)) return;
    const observacaoGeral = (document.getElementById('v_observacaoGeral')?.value||'').trim();
    const infoInterna = (document.getElementById('v_infoInterna')?.value||'').trim();
    const vendedora = document.getElementById('v_vendedora').value.trim();
    const data = todayStr();   // data da venda é fixa: o dia do lançamento
    const cliente = document.getElementById('v_cliente').value.trim();
    const telefone = document.getElementById('v_telefone').value.trim();
    const itensValidos = tempItensHolder.itens.filter(it=>it.produto);

    if(!lojaId || !vendedora || !data){ showToast('Escolha a vendedora e a data da venda.'); return; }
    if(itensValidos.length===0){ showToast('Adicione pelo menos um item à venda.'); return; }
    { const semCat = itensSemCatalogo(tempItensHolder.itens); if(semCat.length){ showToast(mensagemItensSemCatalogo(semCat)); return; } }
    if(!cliente){ showToast('Escolha o cliente antes de lançar a venda (F4 vai direto para a busca).'); return; }
    if(!tempPagHolder.momentoPagamento){ showToast('Marque quando o cliente paga: “Pago agora” ou “Paga na volta”.'); return; }
    if(!tempPagHolder.emissaoNota){ showToast('Marque se a nota fiscal foi emitida (Sim ou Não).'); return; }
    if(pixSemPessoa(tempPagHolder.pagamentos)){ showToast('No pagamento em Pix, escolha PF ou PJ.'); return; }
    if(!tempPagHolder.pagamentos || tempPagHolder.pagamentos.length===0){ showToast('Adicione pelo menos uma forma de pagamento.'); return; }
    const totalPago = tempPagHolder.pagamentos.reduce((acc,p)=>acc+(Number(p.valor)||0),0);
    const totalVenda = Number(tempPagHolder.valorTotal)||0;
    if(totalVenda>0 && Math.abs(totalPago-totalVenda)>0.009){ showToast(totalVenda>totalPago ? `Pagamento incompleto — falta cobrir ${fmtMoeda(totalVenda-totalPago)}.` : `As formas de pagamento passam do total em ${fmtMoeda(totalPago-totalVenda)}. Ajuste os valores.`); return; }
    const erroNota = notaEmpresasErro(tempPagHolder, lojaId);
    if(erroNota){ showToast(erroNota); return; }

    // Planeja o desconto de estoque (com explosão em cascata pela composição) pra
    // cada item vinculado a um produto do catálogo. Itens sem vínculo (produtoEstoqueId
    // vazio) não mexem em estoque nenhum, como sempre foi.
    // Também guarda o consumo POR ITEM (não só o total da venda), pra permitir
    // devolver ao estoque com precisão quando um item específico for trocado depois.
    // Estoque é descontado da loja da venda, a não ser que a nota fiscal indique
    // uma Empresa joia diferente — nesse caso, é de lá que o produto sai de verdade.
    const lojaEstoque = lojaEstoqueDaVenda(lojaId, tempPagHolder);
    const reservas = {};
    let faltandoGeral = [];
    itensValidos.forEach(it=>{
      if(!it.produtoEstoqueId){ it.estoqueConsumidoItem = {}; return; }
      const antes = {...reservas};
      const resultado = planejarConsumoEstoque(it.produtoEstoqueId, Number(it.quantidade)||0, reservas, lojaEstoque);
      if(!resultado.ok) faltandoGeral.push(...resultado.faltando);
      const delta = {};
      Object.keys(reservas).forEach(pid=>{
        const d = (reservas[pid]||0) - (antes[pid]||0);
        if(d > 0) delta[pid] = d;
      });
      it.estoqueConsumidoItem = delta;
    });
    if(faltandoGeral.length > 0){
      const lista = faltandoGeral.map(f=> `${f.nome} (faltam ${f.quantidade.toFixed(2)})`).join(', ');
      const prosseguir = confirm(`Estoque insuficiente pra: ${lista}.\n\nLançar a venda mesmo assim? O estoque desses itens vai ficar negativo, sinalizando que precisa repor.`);
      if(!prosseguir) return;
    }
    // Peças reservadas (Pedido/O.S. ou Transferência) continuam no saldo, mas já estão
    // prometidas — avisa antes de vender o que não está realmente disponível.
    const avisoReserva = await avisoConsumoReservado(reservas, lojaEstoque);
    if(avisoReserva && !confirm(avisoReserva)) return;
    const convOrc = __conversaoOrcamento;

    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    // ===== Crédito do cliente / Fiado =====
    // Calculados antes de montar a venda pra já guardar dentro dela o id do débito de\n    // fiado gerado (fiadoDebitoId) e o valor de crédito usado (creditoUsado). Isso permite\n    // reverter com precisão no cancelamento, sem precisar "adivinhar" qual débito é qual.
    const pagsCredito = (tempPagHolder.pagamentos||[]).filter(p=>p.formaId==='__credito');
    const pagsFiado = (tempPagHolder.pagamentos||[]).filter(p=>p.formaId==='__fiado');
    const totalCredito = pagsCredito.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const totalFiado = pagsFiado.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const novoFiadoDebitoId = totalFiado>0 ? ('fd_'+Math.random().toString(36).slice(2)+Date.now().toString(36)) : null;

    const venda = {
      id: uid('venda'),
      loja: loja ? loja.nome : '',
      lojaId, vendedora, vendedoraId: vendedoraIdPorNome(vendedora), data, cliente, telefone,
      itens: itensValidos,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: carimbarPagamentos(tempPagHolder.pagamentos, data),
      momentoPagamento: tempPagHolder.momentoPagamento,
      emissaoNota: tempPagHolder.emissaoNota,
      numeroNota: tempPagHolder.numeroNota || '',
      lojaSaidaId: tempPagHolder.lojaSaidaId || '',
      lojaPagamentoId: tempPagHolder.lojaPagamentoId || '',
      lojaNotaId: tempPagHolder.lojaNotaId || '',
      lojaBaixaEstoqueId: tempPagHolder.lojaBaixaEstoqueId || '',
      status: 'ativa',
      // Guardado pra permitir devolver ao estoque exatamente o que foi baixado nesta
      // venda, mesmo que a composição do produto mude depois (cancelamento). E qual
      // loja teve o estoque baixado, pra devolver/consumir sempre na loja certa.
      estoqueConsumido: reservas,
      estoqueLojaId: lojaEstoque,
      creditoUsado: totalCredito,
      fiadoDebitoId: novoFiadoDebitoId,
      criadoPor: currentUser.nome,
      criadoEm: Date.now(),
      observacaoGeral: observacaoGeral || '',
      infoInterna: infoInterna || '',
    };
    if(convOrc && convOrc.orcamentoId) venda.orcamentoId = convOrc.orcamentoId;
    // Código de barras da via, gerado só agora que a venda realmente vai ser salva
    // (pra não "queimar" números de vendas que a pessoa desistiu de lançar).
    venda.codigoVia = await bumpCodigoVia('venda', venda.lojaId||'');
    let clienteCadastro = null;
    if(pagsCredito.length>0 || pagsFiado.length>0){
      const telD = (venda.telefone||'').replace(/\D/g,'');
      const nomeL = (venda.cliente||'').trim().toLowerCase();
      clienteCadastro = clientes.find(c=> (telD && (c.telefone||'').replace(/\D/g,'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL));
      if(!clienteCadastro){
        showToast('Para usar Crédito ou Fiado, escolha um cliente já cadastrado na busca de cliente.');
        return;
      }
      if(totalCredito>0 && (Number(clienteCadastro.credito)||0) < totalCredito - 0.001){
        showToast(`Crédito insuficiente: o cliente tem ${fmtMoeda(clienteCadastro.credito)}. Diminua o valor em crédito.`);
        return;
      }
    }
    const ok = await vendaSalvar(venda);
    if(ok){
      if(clienteCadastro){
        if(totalCredito>0){
          clienteCadastro.credito = (Number(clienteCadastro.credito)||0) - totalCredito;
          if(!clienteCadastro.creditoMovimentos) clienteCadastro.creditoMovimentos = [];
          clienteCadastro.creditoMovimentos.push({ data: venda.data, valor: -totalCredito, tipo:'uso', obs:`Venda ${String(venda.id).slice(-8)}` });
        }
        if(totalFiado>0){
          if(!clienteCadastro.fiadoDebitos) clienteCadastro.fiadoDebitos = [];
          clienteCadastro.fiadoDebitos.push({ id:novoFiadoDebitoId, origem:'Venda', numero:String(venda.id).slice(-8), data:venda.data, valor:totalFiado, valorPago:0, loja:venda.loja||'' });
        }
        if(totalCredito>0 || totalFiado>0) await salvarUmCliente(clienteCadastro);
      }
      await aplicarConsumosEstoque(reservas, lojaEstoque, venda.id);
      vendas.unshift(venda);
      if(venda.orcamentoId) await marcarOrcamentoConvertidoEmVenda(venda.orcamentoId, venda);
      __conversaoOrcamento = null;
      invalidarReservadas();
      if(lojaEstoque) carregarReservadas(lojaEstoque);
      showToast('Venda lançada com sucesso.');
      currentTab = 'vendas';
      modoNovaVenda = false;
      renderTabs(); renderView();
    }
  }));
}

/* ============================================================
   CANCELAMENTO DE VENDA
   - Devolve ao estoque exatamente o que foi consumido na venda (se soubermos, ou
     seja, vendas lançadas a partir desta atualização; vendas antigas não têm esse
     registro e o estoque precisa ser ajustado manualmente).
   - Reverte crédito do cliente usado como pagamento e cancela débito de fiado
     pendente (se já havia parcela paga do fiado, essa parcela volta como crédito).
   - Não mexe no valor de itens/soma: só marca a venda como cancelada e registra
     quanto dinheiro efetivamente recebido "sai do caixa" (usado depois na aba Caixa).
   ============================================================ */
/* ── PERMISSÃO POR LOJA ──────────────────────────────────────────────────────
   Regra: diretoria e gerente editam qualquer registro. Demais perfis editam
   apenas registros da loja ativa no momento (contexto do shell). Registros de
   outra loja ficam disponíveis para visualizar e imprimir, mas não editar.
   ──────────────────────────────────────────────────────────────────────────── */
function ehGestaoLoja(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
function podeEditarRegistro(reg){
  if(!currentUser || !reg) return false;
  if(ehGestaoLoja()) return true;
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return false;
  const lojaDoReg = reg.lojaId || reg.lojaOrigemId || null;
  return lojaDoReg === lojaAtiva;
}
function motivoSemEdicao(reg){
  if(ehGestaoLoja()) return '';
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return 'Selecione uma loja no topo para editar.';
  const lojaDoReg = reg && (reg.lojaId || reg.lojaOrigemId);
  const l = (config.lojas||[]).find(x=>x.id===lojaDoReg);
  return 'Este registro é da loja ' + (l ? l.nome : 'outra') + ' — você pode visualizar e imprimir, mas não editar.';
}

function podeCancelarVenda(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
async function abrirCancelarVenda(venda){
  if(!venda || venda.status==='cancelada') return;
  if(!podeCancelarVenda()){ showToast('Só gerente ou diretoria podem cancelar uma venda.'); return; }
  if(!podeEditarRegistro(venda)){ showToast(motivoSemEdicao(venda)); return; }
  if(await bloqueadoPorCaixaFechado(venda.lojaId)) return;
  if(venda.trocas && venda.trocas.length>0){ showToast('Esta venda já teve item(ns) trocado(s) — cancelamento direto não é permitido para evitar inconsistência de estoque/caixa. Fale com quem programou o sistema se precisar desfazer essa venda.'); return; }
  const recebido = valorRecebidoDe(venda);
  openModal(`
    <h3>Cancelar venda</h3>
    <p class="muted">Venda de ${escapeHtml(venda.cliente||'cliente não identificado')} · ${fmtDate(venda.data)} · <b>${fmtMoeda(venda.valorTotal)}</b></p>
    ${recebido>0 ? `<div class="aviso aviso-danger">${ic('alerta')}<div><b>Esta venda já recebeu ${fmtMoeda(recebido)}.</b><small>Ao confirmar, você escolhe: deixar como crédito do cliente ou devolver o valor.</small></div></div>` : ''}
    ${venda.estoqueConsumido && Object.keys(venda.estoqueConsumido).length>0 ? `<div class="aviso aviso-info">${ic('pacote')}<div>Os itens desta venda voltam ao estoque automaticamente.</div></div>` : `<div class="aviso aviso-wait">${ic('alerta')}<div><b>Venda antiga, sem registro de baixa de estoque.</b><small>Se ela baixou estoque, ajuste à mão em Configurações › Cadastro › Produto.</small></div></div>`}
    <div class="field" style="margin-top:14px;"><label for="cv_motivo">Motivo do cancelamento <span class="muted">(obrigatório)</span></label><textarea id="cv_motivo" style="min-height:70px;" placeholder="Ex.: cliente desistiu, erro de lançamento"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cv_fechar">Voltar</button>
      <button class="btn btn-danger" id="cv_confirmar">${ic('cancelar')} Cancelar venda</button>
    </div>
  `);
  document.getElementById('cv_fechar').addEventListener('click', closeModal);
  document.getElementById('cv_confirmar').addEventListener('click', async ()=>{
    const motivo = maiusc(document.getElementById('cv_motivo').value);
    if(!motivo){ showToast('Escreva o motivo do cancelamento.'); return; }
    let dest = null;
    if(recebido > 0.004){
      const cli = await localizarClienteDaVenda(venda);
      dest = await perguntarDestinoEstorno(recebido, !!cli, 'Esta venda');
      if(!dest){ closeModal(); return; }
    }
    await executarCancelamentoVenda(venda, motivo, dest);
    closeModal();
  });
}
async function localizarClienteDaVenda(venda){
  const telD = (venda.telefone||'').replace(/\D/g,'');
  const nomeL = (venda.cliente||'').trim().toLowerCase();
  let c = clientes.find(x=> (telD && (x.telefone||'').replace(/\D/g,'')===telD) || (nomeL && (x.nome||'').trim().toLowerCase()===nomeL));
  if(!c && telD) c = await buscarClientePorTelefoneOuCpf(venda.telefone, '');
  return c || null;
}
/* Pergunta o destino do valor já recebido: crédito do cliente ou devolução (dinheiro / pix). Resolve null se voltar. */

        <label style="display:flex;gap:8px;align-items:flex-start;"><input type="radio" name="dst" value="devolver" ${temCliente?'':'checked'}> <span><b>Devolver o valor</b> ao cliente</span></label>

      <div class="modal-actions">

    const sync = ()=>{ const v = (document.querySelector('input[name=dst]:checked')||{}).value; document.getElementById('dst_formaBox').style.display = v==='devolver' ? '' : 'none'; };
    document.querySelectorAll('input[name=dst]').forEach(r=> r.addEventListener('change', sync));

async function executarCancelamentoVenda(venda, motivo, dest){
  const recebido = valorRecebidoDe(venda);
  // Devolve estoque — sempre na mesma loja de onde foi descontado (venda.estoqueLojaId).
  // Vendas antigas (antes do estoque virar por loja) não têm esse campo; nesse caso não
  // dá pra saber com certeza a loja certa, então pula a devolução automática.
  if(venda.estoqueConsumido && venda.estoqueLojaId){
    for(const [produtoId, qtd] of Object.entries(venda.estoqueConsumido)){
      if(!qtd) continue;
      const produto = produtosEstoque.find(p=>p.id===produtoId);
      if(!produto) continue;
      if(!produto.estoquePorLoja) produto.estoquePorLoja = {};
      const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{
        produtoId, lojaId:venda.estoqueLojaId, tipoMovimento:'CANCELAMENTO_VENDA', quantidade: qtd, referenciaId: venda.id
      }});
      if(r && !r.error && typeof r.saldoNovo === 'number'){
        produto.estoquePorLoja[venda.estoqueLojaId] = r.saldoNovo;
      }else{
        console.error('erro ao devolver estoque no cancelamento', produtoId, r && r.error);
        produto.estoquePorLoja[venda.estoqueLojaId] = (Number(produto.estoquePorLoja[venda.estoqueLojaId])||0) + qtd;
      }
    }
  }
  // Reverte crédito/fiado do cliente
  const telD = (venda.telefone||'').replace(/\D/g,'');
  const nomeL = (venda.cliente||'').trim().toLowerCase();
  const clienteCadastro = clientes.find(c=> (telD && (c.telefone||'').replace(/\D/g,'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL));
  if(clienteCadastro){
    let mudou = false;
    if(venda.creditoUsado > 0){
      clienteCadastro.credito = (Number(clienteCadastro.credito)||0) + venda.creditoUsado;
      if(!clienteCadastro.creditoMovimentos) clienteCadastro.creditoMovimentos = [];
      clienteCadastro.creditoMovimentos.push({ data: hoje(), valor: venda.creditoUsado, tipo:'estorno', obs:`Cancelamento venda ${String(venda.id).slice(-8)}` });
      mudou = true;
    }
    if(venda.fiadoDebitoId && Array.isArray(clienteCadastro.fiadoDebitos)){
      const idx = clienteCadastro.fiadoDebitos.findIndex(d=>d.id===venda.fiadoDebitoId);
      if(idx > -1){
        const debito = clienteCadastro.fiadoDebitos[idx];
        const jaPago = Number(debito.valorPago)||0;
        if(jaPago > 0){
          if(!clienteCadastro.creditoMovimentos) clienteCadastro.creditoMovimentos = [];
          clienteCadastro.credito = (Number(clienteCadastro.credito)||0) + jaPago;
          clienteCadastro.creditoMovimentos.push({ data: hoje(), valor: jaPago, tipo:'estorno', obs:`Cancelamento venda ${String(venda.id).slice(-8)} (parcela de fiado já paga)` });
        }
        clienteCadastro.fiadoDebitos.splice(idx,1);
        mudou = true;
      }
    }
    if(mudou) await salvarUmCliente(clienteCadastro);
  }
  venda.status = 'cancelada';
  venda.motivoCancelamento = motivo;
  venda.canceladoPor = currentUser.nome;
  venda.canceladoEm = Date.now();
  venda.caixaSaidaCancelamento = recebido;
  if(dest && recebido > 0.004){
    venda.cancelamentoDestino = { tipo: dest.tipo, valor: recebido };
    if(dest.tipo === 'credito'){
      const cli = clienteCadastro || await localizarClienteDaVenda(venda);
      if(cli){
        cli.credito = (Number(cli.credito)||0) + recebido;
        if(!cli.creditoMovimentos) cli.creditoMovimentos = [];
        cli.creditoMovimentos.push({ data: hoje(), valor: recebido, tipo:'cancelamento', obs:`Cancelamento venda ${String(venda.id).slice(-8)}` });
        await salvarUmCliente(cli);
        venda.caixaSaidaCancelamento = 0;   // o dinheiro fica na loja como crédito do cliente
      }
    }
  }
  await vendaSalvar(venda);
  showToast('Venda cancelada.');
  renderTabs(); renderView();
}
/* Fechamento do caixa do dia (por loja): gravado em painel_ordens_kv, chave caixa_fech:<loja>:<data>. Fechado = não lança nem cancela até reabrir (gerente/diretoria). */
async function caixaFechadoEm(lojaId, data){
  if(!lojaId) return null;
  try{
    const r = await gatewayCall({ op:'kvGet', table:'painel_ordens_kv', params:{ key:'caixa_fech:'+lojaId+':'+data } });
    return (r && r.value && r.value.fechado) ? r.value : null;
  }catch(e){ return null; }
}
async function bloqueadoPorCaixaFechado(lojaId){
  const f = await caixaFechadoEm(lojaId, hoje());
  if(!f) return false;
  showToast('O caixa de hoje desta loja já foi fechado por '+(f.por||'—')+'. Peça à gerente ou diretoria para reabrir em Resumo do caixa › Fechar caixa.');
  return true;
}
function hoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/** De qual loja o estoque deve ser descontado/devolvido: por padrão, a própria
 * loja da venda. Se a Empresa joia foi preenchida (com ou sem nota fiscal — a
 * regra vale igual nos dois casos), usa a Empresa joia, que é de lá que o
 * produto realmente saiu. */
function lojaEstoqueDaVenda(lojaIdVenda, dadosNota){
  if(dadosNota && dadosNota.lojaSaidaId) return dadosNota.lojaSaidaId;
  return lojaIdVenda;
}

/* ============================================================
   TROCA DE ITEM
   Troca sempre 1 item antigo -> 1 item novo, dentro de uma venda ativa.
   - Devolve ao estoque o item antigo (com precisão se a venda já guarda
     estoqueConsumidoItem; senão, devolve de forma simples só o próprio produto,
     sem reconstituir a composição — venda anterior a esta atualização).
   - Baixa do estoque o item novo, com a mesma explosão em cascata da venda normal.
   - A diferença de valor (novo - antigo) movimenta o caixa: se positiva, é cobrada
     do cliente; se negativa, é devolvida a ele. Ambas registradas em venda.trocas
     pra aparecer depois na aba Caixa.
   ============================================================ */
function encontrarClienteDaVenda(venda){
  const telD = (venda.telefone||'').replace(/\D/g,'');
  const nomeL = (venda.cliente||'').trim().toLowerCase();
  return clientes.find(c=> (telD && (c.telefone||'').replace(/\D/g,'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL)) || null;
}
/* ============================================================
   DEVOLUÇÃO DE ITEM (sem item novo)
   Devolve UM item inteiro da venda: volta o estoque do item (igual à troca/cancelamento) e o valor
   do item sai do caixa (dinheiro/PIX/cartão) ou vira crédito do cliente. É gravada em venda.trocas
   com tipoMov:'devolucao' — assim o Caixa já a enxerga na linha "Trocas (diferença líquida)"
   e o DP desconta da comissão no mês em que a devolução aconteceu.
   Devolução de só parte da quantidade de um item: hoje não existe — devolva o item e lance de novo o que ficou.
   ============================================================ */
async function devolverEstoqueDoItem(venda, item, lojaEstoque){
  if(item.estoqueConsumidoItem && Object.keys(item.estoqueConsumidoItem).length>0){
    for(const [pid, qtd] of Object.entries(item.estoqueConsumidoItem)){
      const p = produtosEstoque.find(x=>x.id===pid);
      if(!p) continue;
      if(!p.estoquePorLoja) p.estoquePorLoja = {};
      const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{ produtoId:pid, lojaId:lojaEstoque, tipoMovimento:'CANCELAMENTO_VENDA', quantidade: qtd, referenciaId: venda.id }});
      if(r && !r.error && typeof r.saldoNovo === 'number'){ p.estoquePorLoja[lojaEstoque] = r.saldoNovo; }
      else{ console.error('erro ao devolver estoque (devolução de item)', pid, r && r.error); p.estoquePorLoja[lojaEstoque] = (Number(p.estoquePorLoja[lojaEstoque])||0) + qtd; }
    }
  } else if(item.produtoEstoqueId){
    const p = produtosEstoque.find(x=>x.id===item.produtoEstoqueId);
    if(p){
      if(!p.estoquePorLoja) p.estoquePorLoja = {};
      const qtd = Number(item.quantidade||0);
      const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{ produtoId:item.produtoEstoqueId, lojaId:lojaEstoque, tipoMovimento:'CANCELAMENTO_VENDA', quantidade: qtd, referenciaId: venda.id,
        observacao:'Devolução simples (venda anterior ao controle por item) — confira manualmente se tem composição.' }});
      if(r && !r.error && typeof r.saldoNovo === 'number'){ p.estoquePorLoja[lojaEstoque] = r.saldoNovo; }
      else{ console.error('erro ao devolver estoque simples (devolução de item)', r && r.error); p.estoquePorLoja[lojaEstoque] = (Number(p.estoquePorLoja[lojaEstoque])||0) + qtd; }
      showToast('Item devolvido ao estoque de forma simples (venda anterior a este controle) — confira manualmente se ele tem composição.');
    }
  }
}
function abrirDevolucaoItem(venda){
  if(!venda || venda.status==='cancelada') return;
  if(!podeCancelarVenda()){ showToast('Só gerente ou diretoria podem registrar uma devolução.'); return; }
  const disponiveis = (venda.itens||[]).map((it,idx)=>({it,idx})).filter(x=>!x.it.trocado && !x.it.devolvido);
  if(disponiveis.length===0){ showToast('Não há itens desta venda disponíveis pra devolução.'); return; }
  const lojaEstoqueDev = venda.estoqueLojaId || venda.lojaId;
  openModal(`
    <h3>Devolver item</h3>
    <p class="muted">Venda de ${escapeHtml(venda.cliente||'cliente não identificado')} · ${fmtDate(venda.data)}. O item volta ao estoque e o valor dele é devolvido ao cliente.</p>
    <div class="field" style="margin-top:14px;"><label for="dv_item">Item devolvido</label>
      <select id="dv_item">${disponiveis.map(x=>`<option value="${x.idx}">${x.it.quantidade}× ${escapeHtml(x.it.produto)}${x.it.metal?' ('+escapeHtml(x.it.metal)+')':''} — ${fmtMoeda(Number(x.it.quantidade)*Number(x.it.valorUnitario||0))}</option>`).join('')}</select></div>
    <div class="field"><label for="dv_forma">Devolver o valor como</label>
      <select id="dv_forma">${(config.formasPagamento||[]).map(pt=>`<option value="${pt.id}">${escapeHtml(pt.nome)}</option>`).join('')}<option value="__credito">Crédito do cliente (fica para a próxima compra)</option></select></div>
    <div class="field"><label for="dv_motivo">Motivo</label><input id="dv_motivo" placeholder="Ex.: cliente desistiu, defeito"></div>
    <div id="dv_hint" class="aviso aviso-info" style="font-weight:700;"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="dv_fechar">Voltar</button><button class="btn btn-danger" id="dv_confirmar">${ic('devolver')} Confirmar devolução</button></div>
  `);
  const elItem = document.getElementById('dv_item'), elForma = document.getElementById('dv_forma'), elHint = document.getElementById('dv_hint');
  const valorDoItem = ()=>{ const it = venda.itens[Number(elItem.value)]; return Math.round(Number(it.quantidade)*Number(it.valorUnitario||0)*100)/100; };
  const atualizarHint = ()=>{ elHint.textContent = 'Valor a devolver: ' + fmtMoeda(valorDoItem()); };
  elItem.addEventListener('input', atualizarHint); atualizarHint();
  document.getElementById('dv_fechar').addEventListener('click', closeModal);
  document.getElementById('dv_confirmar').addEventListener('click', async ()=>{
    const btn = document.getElementById('dv_confirmar'); btn.disabled = true;
    try{
      const idx = Number(elItem.value); const item = venda.itens[idx];
      if(!item || item.trocado || item.devolvido){ showToast('Esse item já foi trocado ou devolvido.'); return; }
      const valor = valorDoItem(); const forma = elForma.value; const motivo = document.getElementById('dv_motivo').value.trim();
      if(!(valor>0)){ showToast('Este item não tem valor — não há o que devolver.'); return; }
      if(!forma){ showToast('Escolha como devolver o valor.'); return; }
      let cliente = null;
      if(forma==='__credito'){
        cliente = encontrarClienteDaVenda(venda);
        if(!cliente){ showToast('Para devolver como crédito, o cliente precisa estar cadastrado. Escolha outra forma ou cadastre o cliente.'); return; }
      } else {
        // alerta se o valor devolvido em dinheiro passa do que realmente foi recebido nesta venda
        const trocas = venda.trocas||[];
        const recebidoLiquido = valorRecebidoDe(venda)
          + trocas.filter(t=>t.diferenca>0 && t.formaDiferenca!=='__credito' && t.formaDiferenca!=='__fiado').reduce((a,t)=>a+t.diferenca,0)
          - trocas.filter(t=>t.diferenca<0 && t.formaDiferenca!=='__credito').reduce((a,t)=>a+Math.abs(t.diferenca),0);
        if(valor > recebidoLiquido + 0.005 && !confirm(`Esta venda recebeu só ${fmtMoeda(Math.max(0,recebidoLiquido))} em dinheiro/PIX/cartão (o resto foi fiado ou crédito), mas a devolução é de ${fmtMoeda(valor)}.\n\nDevolver mesmo assim?`)) return;
      }
      await devolverEstoqueDoItem(venda, item, lojaEstoqueDev);
      if(cliente){
        cliente.credito = (Number(cliente.credito)||0) + valor;
        if(!cliente.creditoMovimentos) cliente.creditoMovimentos = [];
        cliente.creditoMovimentos.push({ data: hoje(), valor, tipo:'estorno', obs:`Devolução de item — venda ${String(venda.id).slice(-8)}` });
        await salvarUmCliente(cliente);
      }
      const reg = {
        id: uid('troca'), tipoMov:'devolucao', motivo,
        itemAntigoDescricao: `${item.quantidade}x ${item.produto}${item.metal?' ('+item.metal+')':''}`, itemAntigoValor: valor,
        itemNovo: { produto:'(devolução — sem item novo)', metal:'', quantidade:0, valorUnitario:0, produtoEstoqueId:'', estoqueConsumidoItem:{} }, itemNovoValor: 0,
        diferenca: -valor, formaDiferenca: forma, fiadoDebitoId: null,
        data: hoje(), feitoPor: currentUser.nome, criadoEm: Date.now(),
      };
      item.trocado = true; item.devolvido = true; item.trocaId = reg.id;
      if(!venda.trocas) venda.trocas = [];
      venda.trocas.push(reg);
      const ok = await vendaSalvar(venda);
      if(ok){ showToast('Devolução registrada.'); closeModal(); renderTabs(); renderView(); }
    } finally { btn.disabled = false; }
  });
}

  function atualizarDiferenca(){
    const antigo = itemAntigoSelecionado();
    const valorAntigo = Number(antigo.quantidade)*Number(antigo.valorUnitario||0);
    const valorNovo = (Number(elQtd.value)||0)*(Number(elValor.value)||0);
    const diferenca = valorNovo - valorAntigo;
    if(Math.abs(diferenca) < 0.005){
      elHint.innerHTML = `Troca sem diferença de valor (${fmtMoeda(valorNovo)} = ${fmtMoeda(valorAntigo)}).`;
      elPagWrap.style.display = 'none';
    } else if(diferenca > 0){
      elHint.innerHTML = `<span style="color:var(--danger);">Cliente paga a diferença: ${fmtMoeda(diferenca)}</span>`;
      elPagLabel.textContent = 'Forma de pagamento da diferença (recebida)';
      elPagSelect.innerHTML = (config.formasPagamento||[]).map(pt=>`<option value="${pt.id}">${escapeHtml(pt.nome)}</option>`).join('') + `<option value="__credito">Crédito do cliente</option><option value="__fiado">Fiado</option>`;
      elPagWrap.style.display = '';
    } else {
      elHint.innerHTML = `<span style="color:var(--ok);">Devolver ao cliente: ${fmtMoeda(Math.abs(diferenca))}</span>`;
      elPagLabel.textContent = 'Forma de devolução da diferença';
      elPagSelect.innerHTML = (config.formasPagamento||[]).map(pt=>`<option value="${pt.id}">${escapeHtml(pt.nome)}</option>`).join('') + `<option value="__credito">Crédito do cliente (fica para a próxima compra)</option>`;
      elPagWrap.style.display = '';
    }
  }
  [elItemAntigo,elQtd,elValor].forEach(el=> el.addEventListener('input', atualizarDiferenca));
  atualizarDiferenca();

  document.getElementById('tr_fechar').addEventListener('click', closeModal);
  document.getElementById('tr_confirmar').addEventListener('click', async ()=>{
    const idx = Number(elItemAntigo.value);
    const antigo = venda.itens[idx];
    const produtoEstoqueIdNovo = elProduto ? elProduto.value : '';
    const produtoNovoObj = produtoNovoSelecionado();
    const produtoNovo = produtoNovoObj ? produtoNovoObj.nome : '';
    const metalNovo = document.getElementById('tr_metal').value;
    const qtdNovo = Number(elQtd.value)||0;
    const valorUnitNovo = Number(elValor.value)||0;
    if(!produtoEstoqueIdNovo || !produtoNovo || qtdNovo<=0){ showToast('Escolha o produto novo (precisa estar cadastrado) e a quantidade.'); return; }

    const valorAntigo = Number(antigo.quantidade)*Number(antigo.valorUnitario||0);
    const valorNovo = qtdNovo*valorUnitNovo;
    const diferenca = valorNovo - valorAntigo;
    let formaDiferenca = null;
    if(Math.abs(diferenca) >= 0.005){
      formaDiferenca = elPagSelect.value;
      if(!formaDiferenca){ showToast('Selecione a forma de pagamento/devolução da diferença.'); return; }
    }

    // Baixa estoque do produto novo (mesma explosão em cascata da venda normal),
    // sempre na mesma loja de onde a venda já vinha descontando estoque.
    const reservasNovo = {};
    if(produtoEstoqueIdNovo){
      const resultado = planejarConsumoEstoque(produtoEstoqueIdNovo, qtdNovo, reservasNovo, lojaEstoqueTroca);
      if(!resultado.ok){
        const lista = resultado.faltando.map(f=> `${f.nome} (faltam ${f.quantidade.toFixed(2)})`).join(', ');
        const prosseguir = confirm(`Estoque insuficiente pra: ${lista}.\n\nRegistrar a troca mesmo assim? O estoque vai ficar negativo.`);
        if(!prosseguir) return;
      }
    }

    // Devolve estoque do item antigo (mesma loja)
    if(antigo.estoqueConsumidoItem && Object.keys(antigo.estoqueConsumidoItem).length>0){
      for(const [pid, qtd] of Object.entries(antigo.estoqueConsumidoItem)){
        const p = produtosEstoque.find(x=>x.id===pid);
        if(!p) continue;
        if(!p.estoquePorLoja) p.estoquePorLoja = {};
        const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{
          produtoId:pid, lojaId:lojaEstoqueTroca, tipoMovimento:'CANCELAMENTO_VENDA', quantidade: qtd, referenciaId: venda.id
        }});
        if(r && !r.error && typeof r.saldoNovo === 'number'){ p.estoquePorLoja[lojaEstoqueTroca] = r.saldoNovo; }
        else{ console.error('erro ao devolver item antigo (troca)', pid, r && r.error); p.estoquePorLoja[lojaEstoqueTroca] = (Number(p.estoquePorLoja[lojaEstoqueTroca])||0) + qtd; }
      }
    } else if(antigo.produtoEstoqueId){
      const p = produtosEstoque.find(x=>x.id===antigo.produtoEstoqueId);
      if(p){
        if(!p.estoquePorLoja) p.estoquePorLoja = {};
        const qtdDevolver = Number(antigo.quantidade||0);
        const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{
          produtoId:antigo.produtoEstoqueId, lojaId:lojaEstoqueTroca, tipoMovimento:'CANCELAMENTO_VENDA', quantidade: qtdDevolver, referenciaId: venda.id,
          observacao:'Devolução simples (venda anterior ao controle por item) — confira manualmente se tem composição.'
        }});
        if(r && !r.error && typeof r.saldoNovo === 'number'){ p.estoquePorLoja[lojaEstoqueTroca] = r.saldoNovo; }
        else{ console.error('erro ao devolver item antigo simples (troca)', antigo.produtoEstoqueId, r && r.error); p.estoquePorLoja[lojaEstoqueTroca] = (Number(p.estoquePorLoja[lojaEstoqueTroca])||0) + qtdDevolver; }
        showToast('Item antigo devolvido ao estoque de forma simples (venda anterior a este controle) — confira manualmente se ele tem composição.');
      }
    }
    await aplicarConsumosEstoque(reservasNovo, lojaEstoqueTroca, venda.id);

    // Movimenta crédito/fiado do cliente se a diferença usar isso
    let clienteCadastro = null;
    if(formaDiferenca==='__credito' || formaDiferenca==='__fiado'){
      clienteCadastro = encontrarClienteDaVenda(venda);
      if(!clienteCadastro){ showToast('Pra usar Crédito ou Fiado na diferença, o cliente precisa estar no cadastro.'); return; }
    }
    let fiadoDebitoIdTroca = null;
    if(diferenca > 0){
      if(formaDiferenca==='__credito'){
        if((Number(clienteCadastro.credito)||0) < diferenca - 0.001){ showToast(`Crédito insuficiente: o cliente tem ${fmtMoeda(clienteCadastro.credito)}.`); return; }
        clienteCadastro.credito = (Number(clienteCadastro.credito)||0) - diferenca;
        if(!clienteCadastro.creditoMovimentos) clienteCadastro.creditoMovimentos = [];
        clienteCadastro.creditoMovimentos.push({ data: hoje(), valor: -diferenca, tipo:'uso', obs:`Troca — venda ${String(venda.id).slice(-8)}` });
      } else if(formaDiferenca==='__fiado'){
        fiadoDebitoIdTroca = 'fd_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
        if(!clienteCadastro.fiadoDebitos) clienteCadastro.fiadoDebitos = [];
        clienteCadastro.fiadoDebitos.push({ id:fiadoDebitoIdTroca, origem:'Troca', numero:String(venda.id).slice(-8), data:hoje(), valor:diferenca, valorPago:0, loja:venda.loja||'' });
      }
    } else if(diferenca < 0 && formaDiferenca==='__credito'){
      clienteCadastro = clienteCadastro || encontrarClienteDaVenda(venda);
      if(!clienteCadastro){ showToast('Pra devolver como crédito, o cliente precisa estar no cadastro.'); return; }
      clienteCadastro.credito = (Number(clienteCadastro.credito)||0) + Math.abs(diferenca);
      if(!clienteCadastro.creditoMovimentos) clienteCadastro.creditoMovimentos = [];
      clienteCadastro.creditoMovimentos.push({ data: hoje(), valor: Math.abs(diferenca), tipo:'estorno', obs:`Troca — venda ${String(venda.id).slice(-8)}` });
    }
    if(clienteCadastro) await salvarUmCliente(clienteCadastro);

    const troca = {
      id: uid('troca'),
      itemAntigoDescricao: `${antigo.quantidade}x ${antigo.produto}${antigo.metal?' ('+antigo.metal+')':''}`,
      itemAntigoValor: valorAntigo,
      itemNovo: { produto:produtoNovo, metal:metalNovo, quantidade:qtdNovo, valorUnitario:valorUnitNovo, produtoEstoqueId:produtoEstoqueIdNovo, estoqueConsumidoItem:reservasNovo },
      itemNovoValor: valorNovo,
      diferenca,
      formaDiferenca,
      fiadoDebitoId: fiadoDebitoIdTroca,
      data: hoje(),
      feitoPor: currentUser.nome,
      criadoEm: Date.now(),
    };
    antigo.trocado = true;
    antigo.trocaId = troca.id;
    if(!venda.trocas) venda.trocas = [];
    venda.trocas.push(troca);
    await vendaSalvar(venda);
    showToast('Troca registrada.');
    closeModal();
    renderTabs(); renderView();
  });
}

    </div>
    <div class="filters" role="search">

    </div>
    <div id="resumoValoresVendas" class="resumo-kpis" aria-live="polite"></div>

      <div id="tabelaVendasWrap"></div>
    </div>
  `;
  const fLoja = document.getElementById('filtroLoja');
  const fData = document.getElementById('filtroData');
  const fBusca = document.getElementById('filtroBusca');
  const fSemPagamento = document.getElementById('filtroSemPagamento');
  document.getElementById('btnNovaVendaLista').addEventListener('click', ()=>{ modoNovaVenda = true; renderView(); });

  function abrevLojaDe(v){
    const l = (config.lojas||[]).find(x=>x.id===v.lojaId);
    return l ? l.abreviacao : v.loja;
  }

  function renderTable(){
    let list = [...vendas];
    if(fLoja.value) list = list.filter(v=>v.lojaId===fLoja.value);
    if(fData.value) list = list.filter(v=>v.data===fData.value);
    if(fBusca.value.trim()){
      const q = fBusca.value.trim().toLowerCase();
      list = list.filter(v=> (v.cliente||'').toLowerCase().includes(q) || (v.vendedora||'').toLowerCase().includes(q));
    }
    if(fSemPagamento.checked) list = list.filter(v=>semPagamentoLancado(v));
    list.sort((a,b)=> b.criadoEm - a.criadoEm);

    const totalRecebido = list.filter(v=>v.status!=='cancelada').reduce((acc,v)=> acc + valorRecebidoDe(v), 0);
    const totalAReceber = list.filter(v=>v.status!=='cancelada').reduce((acc,v)=> acc + valorAReceberDe(v), 0);
    const semPagCount = list.filter(v=>v.status!=='cancelada' && semPagamentoLancado(v)).length;
    const ativas = list.filter(v=>v.status!=='cancelada').length;
    const canceladas = list.length - ativas;
    document.getElementById('resumoValoresVendas').innerHTML = `
      <div class="kpi"><div class="kpi-rot">${ic('recibo',14)} Vendas nesta lista</div><div class="kpi-val">${window.Fmt ? Fmt.num(ativas) : ativas}</div><div class="kpi-nota">${canceladas>0 ? `${canceladas} ${canceladas===1?'cancelada':'canceladas'} fora da soma` : 'Canceladas ficam fora da soma'}</div></div>
      <div class="kpi ${totalRecebido>0.009?'kpi-ok':''}"><div class="kpi-rot">${ic('check',14)} Recebido</div><div class="kpi-val">${fmtMoeda(totalRecebido)}</div><div class="kpi-nota">Dinheiro, PIX e cartão</div></div>
      <div class="kpi ${totalAReceber>0.009?'kpi-danger':''}"><div class="kpi-rot">${ic('relogio',14)} A receber</div><div class="kpi-val">${fmtMoeda(totalAReceber)}</div><div class="kpi-nota ${semPagCount>0?'alerta':''}">${semPagCount>0 ? `${semPagCount} sem pagamento lançado` : 'Fiado, crédito e saldo em aberto'}</div></div>`;

    const wrap = document.getElementById('tabelaVendasWrap');
    if(list.length===0){
      const temFiltro = fLoja.value || fData.value || fBusca.value.trim() || fSemPagamento.checked;
      wrap.innerHTML = window.__vendasErro
        ? `<div class="estado-vazio">${ic('alerta',32)}<b>Não foi possível carregar as vendas</b>Confira a internet e abra a tela de novo (ou aperte F5).</div>`
        : temFiltro
        ? `<div class="estado-vazio">${ic('busca',32)}<b>Nenhuma venda com esses filtros</b>Mude a busca ou toque em “Limpar filtros”.</div>`
        : `<div class="estado-vazio">${ic('carrinho',32)}<b>Nenhuma venda lançada ainda</b>Use o botão “Nova venda” (ou a tecla F2) para lançar a primeira.</div>`;
      return;
    }
    const gestao = podeCancelarVenda();
    wrap.innerHTML = `
      <table class="tabela-cartoes tabela-vendas">
        <thead><tr><th>Data</th><th>Loja</th><th>Cliente</th><th>Vendedora</th><th>Itens</th><th>Nota</th><th class="num">Recebido</th><th class="num">A receber</th><th class="acoes"><span class="so-leitor">Ações</span></th></tr></thead>
        <tbody>
          ${list.map(v=>{
            const semPag = semPagamentoLancado(v);
            const recebido = valorRecebidoDe(v);
            const aReceber = valorAReceberDe(v);
            const cancelada = v.status==='cancelada';
            const qtdItens = (v.itens||[]).length;
            const temNota = v.emissaoNota==='sim';
            const selos = [
              cancelada ? `<span class="badge selo-danger" title="${escapeHtml(v.motivoCancelamento||'')}">Cancelada${v.canceladoPor?' por '+escapeHtml(v.canceladoPor):''}</span>` : '',
              semPag && !cancelada ? `<span class="badge selo-wait">Sem pagamento lançado</span>` : '',
              !cancelada && (v.trocas||[]).length ? `<span class="badge selo-info">${(v.trocas||[]).length===1?'1 troca/devolução':(v.trocas||[]).length+' trocas/devoluções'}</span>` : '',
            ].filter(Boolean).join('');
            const itensBtn = `<button type="button" class="btn-link btn-link-itens" data-itens="${v.id}" title="Ver itens da venda">${qtdItens} ${qtdItens===1?'item':'itens'}</button>`;
            const notaBtn = `<button type="button" class="btn-link-nota" data-nota="${v.id}" title="Ver dados da nota fiscal" style="background:none;border:0;padding:0;cursor:pointer;"><span class="badge ${temNota?'selo-ok':'selo-neutro'}">${temNota?'Com nota':'Sem nota'}</span></button>`;
            const temMais = !cancelada && gestao;
            return `
            <tr class="${cancelada?'linha-cancelada':''}">
              <td class="so-mesa" style="white-space:nowrap;">${fmtDate(v.data)}${v.codigoVia?`<span class="td-via">${escapeHtml(v.codigoVia)}</span>`:''}</td>
              <td class="so-mesa"><span class="badge badge-loja">${escapeHtml(abrevLojaDe(v)||'—')}</span></td>
              <td class="c-cli">
                <span class="so-mesa"><span class="cli-nome">${escapeHtml(v.cliente||'Cliente não identificado')}</span>${selos?`<div class="selos-linha">${selos}</div>`:''}</span>
                <div class="so-cel">
                  <div class="cel-topo"><span class="cli-nome">${escapeHtml(v.cliente||'Cliente não identificado')}</span><span class="cel-total">${fmtMoeda(v.valorTotal)}</span></div>
                  <div class="cel-meta">${fmtDate(v.data)} · ${escapeHtml(abrevLojaDe(v)||'—')}${v.codigoVia?' · '+escapeHtml(v.codigoVia):''} · ${escapeHtml(v.vendedora||'—')}</div>
                  <div class="cel-valores">Recebido <b class="valor-ok">${fmtMoeda(recebido)}</b>${aReceber>0.009 && !cancelada ? ` · A receber <b class="valor-falta">${fmtMoeda(aReceber)}</b>` : ''}</div>
                  ${selos?`<div class="selos-linha">${selos}</div>`:''}
                </div>
              </td>
              <td class="so-mesa">${escapeHtml(v.vendedora||'—')}</td>
              <td>${itensBtn}</td>
              <td>${notaBtn}</td>
              <td class="num so-mesa ${cancelada||recebido<=0?'':'valor-ok'}">${fmtMoeda(recebido)}</td>
              <td class="num so-mesa ${aReceber>0.009 && !cancelada?'valor-falta':''}">${fmtMoeda(aReceber)}</td>
              <td class="acoes">
                <div class="acoes-linha">
                  ${btnIcone('olho','Ver detalhes',`data-view="${v.id}"`)}
                  ${btnIcone('impressora','Imprimir via',`data-print="${v.id}"`)}
                  ${temMais ? btnIcone('mais3','Mais ações',`data-mais="${v.id}" aria-haspopup="menu" aria-expanded="false"`) : ''}
                </div>
                ${temMais ? `<div class="menu-acoes" role="menu" data-menu="${v.id}">
                  <button type="button" role="menuitem" data-editar="${v.id}">${ic('lapis')} Editar venda</button>
                  <hr>
                  <button type="button" role="menuitem" class="perigo" data-cancelar="${v.id}">${ic('cancelar')} Cancelar venda</button>
                </div>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-mais]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); alternarMenuAcoes(b); }));
    wrap.querySelectorAll('.menu-acoes button').forEach(b=> b.addEventListener('click', ()=> fecharMenusAcoes()));
    wrap.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', ()=> abrirDetalheVenda(vendas.find(x=>x.id===b.dataset.view)) ));
    wrap.querySelectorAll('[data-print]').forEach(b=> b.addEventListener('click', ()=> printVenda(vendas.find(x=>x.id===b.dataset.print)) ));
    wrap.querySelectorAll('[data-itens]').forEach(b=> b.addEventListener('click', ()=> abrirItensVenda(vendas.find(x=>x.id===b.dataset.itens)) ));
    wrap.querySelectorAll('[data-nota]').forEach(b=> b.addEventListener('click', ()=> abrirNotaVenda(vendas.find(x=>x.id===b.dataset.nota)) ));
    wrap.querySelectorAll('[data-editar]').forEach(b=> b.addEventListener('click', ()=> abrirEditarVenda(vendas.find(x=>x.id===b.dataset.editar)) ));
    wrap.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', ()=> abrirCancelarVenda(vendas.find(x=>x.id===b.dataset.cancelar)) ));
  }
  [fLoja,fData,fBusca,fSemPagamento].forEach(el=>el.addEventListener('input', renderTable));
  document.getElementById('btnLimparFiltroVendas').addEventListener('click', ()=>{
    fLoja.value=''; fData.value=''; fBusca.value=''; fSemPagamento.checked=false; renderTable();
  });
  // Travar o filtro na loja ativa só faz sentido pra quem realmente trabalha numa loja
  // só (vendedora/oficina). Diretoria e gerente costumam acompanhar mais de uma loja —
  // travar escondia vendas de outra loja até a pessoa lembrar de trocar a loja ativa
  // no menu, o que gerava confusão ("cadê a venda que acabei de lançar?").
  const restringirPorLojaAtiva = currentUser && (currentUser.nivel==='vendedora' || currentUser.nivel==='oficina');
  if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id){
    fLoja.value = window.__lojaAtual.id;
    fLoja.disabled = true;
    fLoja.title = 'Filtrando pela loja ativa — pra ver outra loja, troque em "Loja" no menu.';
  }
  renderTable();
}

/* Menu "Mais ações" das linhas da lista (Editar / Troca / Devolução / Cancelar).
   Abre com position:fixed para não ser cortado pela rolagem da tabela. */
function fecharMenusAcoes(){
  document.querySelectorAll('.menu-acoes.aberto').forEach(m=>m.classList.remove('aberto'));
  document.querySelectorAll('[data-mais][aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}
function alternarMenuAcoes(btn){
  const menu = btn.closest('td') && btn.closest('td').querySelector('.menu-acoes');
  if(!menu) return;
  const jaAberto = menu.classList.contains('aberto');
  fecharMenusAcoes();
  if(jaAberto) return;
  menu.classList.add('aberto');
  btn.setAttribute('aria-expanded','true');
  const r = btn.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let top = r.bottom + 4;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.top = top + 'px';
  menu.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.right - mw)) + 'px';
  const primeiro = menu.querySelector('button'); if(primeiro) primeiro.focus({ preventScroll:true });
}
document.addEventListener('click', (e)=>{ if(!e.target.closest || !e.target.closest('.menu-acoes')) fecharMenusAcoes(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') fecharMenusAcoes(); });
window.addEventListener('scroll', fecharMenusAcoes, true);
window.addEventListener('resize', fecharMenusAcoes);

  openModal(`

      <thead><tr><th>Produto</th><th>Metal</th><th class="num">Qtd.</th><th class="num">Valor unit.</th><th class="num">Subtotal</th></tr></thead>
      <tbody>
        ${(v.itens||[]).map(it=>`<tr${it.trocado?' style="opacity:.6;"':''}><td>${escapeHtml(it.produto)}${it.devolvido?' <span class="badge selo-neutro">Devolvido</span>':(it.trocado?' <span class="badge selo-neutro">Trocado</span>':'')}</td><td>${escapeHtml(it.metal||'—')}</td><td class="num">${escapeHtml(String(it.quantidade))}</td><td class="num">${fmtMoeda(it.valorUnitario)}</td><td class="num">${fmtMoeda(Number(it.quantidade)*Number(it.valorUnitario||0))}</td></tr>`).join('')}

      <button class="btn btn-ghost" id="btnFecharItensVenda">Fechar</button>

   Antes de editar, pergunta se a nota já foi tirada (impressa/emitida de fato).
   Se sim, edição direta é bloqueada — o caminho correto é Cancelar ou Trocar (que já
   fazem a reversão de estoque/caixa/crédito direito), e a pessoa precisa lembrar de
   refletir isso no sistema de nota fiscal também (fora deste app).
   Se não, abre um formulário com os campos administrativos (não mexe em itens nem
   em formas de pagamento — isso é o que Troca e Cancelamento já cobrem).

function abrirEditarVenda(v){
  if(!v || v.status==='cancelada') return;

function abrirFormularioEdicaoVenda(v){

/** Edição completa: só liberada quando a venda é de HOJE e não teve troca — nesse caso
 * dá pra mexer em tudo (itens, estoque, pagamento, crédito/fiado, nota fiscal), porque
 * ainda não entrou em nenhum fechamento/relatório de dia anterior. O salvamento desfaz
 * o que a venda original tinha lançado (estoque + crédito/fiado do cliente antigo) e
 * relança do zero com os dados novos — igual criar uma venda, só que por cima da mesma. */
function abrirFormularioEdicaoCompleta(v){
  openModal(`
    <h3>Editar venda</h3>
    <div class="aviso aviso-ok" style="margin-bottom:12px;">${ic('check')}<div>Venda de hoje — dá para editar tudo, inclusive itens e pagamento.</div></div>
    <div class="grid-2">
      <div class="field"><label>Loja</label><select id="ed_loja"><option value="">Selecione</option>${lojaOptionsHtml('')}</select><div class="muted" style="font-size:11px; margin-top:3px;">Era: ${escapeHtml(v.loja||'—')}</div></div>
      <div class="field"><label>Vendedora</label><select id="ed_vendedora">${vendedoraOptionsHtml('')}</select><div class="muted" style="font-size:11px; margin-top:3px;">Era: ${escapeHtml(v.vendedora||'—')}</div></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Data</label><input type="date" id="ed_data" value="${v.data||''}"></div>
      <div class="field"><label>Telefone / WhatsApp</label><div style="display:flex; gap:6px;">
        <input id="ed_telefoneDDD" placeholder="DDD" maxlength="2" inputmode="numeric" style="width:56px; flex-shrink:0;" value="${escapeHtml(separarTelefone(v.telefone||'').ddd)}">
        <input id="ed_telefoneNum" placeholder="00000-0000" maxlength="10" inputmode="numeric" value="${escapeHtml(formatarNumeroTelefone(separarTelefone(v.telefone||'').numero))}">
      </div></div>
    </div>
    <div class="field"><label>Cliente</label><input id="ed_cliente" value="${escapeHtml(v.cliente||'')}"></div>
    <div id="ed_itensContainer"></div>
    <div id="ed_pagamentoContainer"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="ed_fechar">Cancelar</button>
      <button class="btn btn-accent" id="ed_salvar">Salvar alterações</button>
    </div>
  `);
  document.getElementById('modalBox').classList.add('modal-largo');
  const itensHolder = { itens: (v.itens||[]).map(it=>({ id:it.id||uid('it'), produto:it.produto, metal:it.metal, quantidade:it.quantidade, valorUnitario:it.valorUnitario, produtoEstoqueId:it.produtoEstoqueId||'', avulso:!!it.avulso, precoOriginal:it.precoOriginal!==undefined?it.precoOriginal:'', ajusteTipo:it.ajusteTipo||'nenhum', ajusteModo:it.ajusteModo||'percentual', ajusteQtd:it.ajusteQtd!==undefined?it.ajusteQtd:'' })) };
  const itensApiEd = mountItens(document.getElementById('ed_itensContainer'), itensHolder, ()=> document.getElementById('ed_loja').value);
  document.getElementById('ed_loja').addEventListener('change', ()=> itensApiEd.refreshEstoque());
  const pagHolder = {
    valorTotal: v.valorTotal, pagamentos: (v.pagamentos||[]).map(p=>({...p})),
    momentoPagamento: v.momentoPagamento, emissaoNota: v.emissaoNota, numeroNota: v.numeroNota,
    lojaSaidaId: '', lojaPagamentoId: '', lojaNotaId: '', lojaBaixaEstoqueId: '',
  };
  if(v.emissaoNota==='sim'){
    const nomeLojaAnterior = (id)=>{ const l=(config.lojas||[]).find(x=>x.id===id); return l ? l.abreviacao : '—'; };
    document.getElementById('ed_pagamentoContainer').insertAdjacentHTML('beforebegin', `<div class="muted" style="font-size:12px; margin:8px 0;">Empresas da nota anteriores — joia: ${escapeHtml(nomeLojaAnterior(v.lojaSaidaId))} · pagamento: ${escapeHtml(nomeLojaAnterior(v.lojaPagamentoId))} · nota: ${escapeHtml(nomeLojaAnterior(v.lojaNotaId))}${v.lojaBaixaEstoqueId?' · baixa: '+escapeHtml(nomeLojaAnterior(v.lojaBaixaEstoqueId)):''} — escolha de novo abaixo.</div>`);
  }
  mountPagamentos(document.getElementById('ed_pagamentoContainer'), pagHolder, ()=> document.getElementById('ed_loja').value);

  wireTelefoneMask('ed');
  document.getElementById('ed_fechar').addEventListener('click', closeModal);
  document.getElementById('ed_salvar').addEventListener('click', async ()=>{
    const lojaId = document.getElementById('ed_loja').value;
    const vendedora = document.getElementById('ed_vendedora').value.trim();
    const data = document.getElementById('ed_data').value;
    const telefone = combinarTelefoneValidado('ed'); if(telefone === null) return;
    const cliente = document.getElementById('ed_cliente').value.trim();
    const itensValidos = itensHolder.itens.filter(it=>it.produto);
    if(!lojaId || !vendedora || !data){ showToast('Escolha a loja, a vendedora e a data.'); return; }
    if(itensValidos.length===0){ showToast('Adicione ao menos um item vendido.'); return; }
    { const semCat = itensSemCatalogo(itensHolder.itens); if(semCat.length){ showToast(mensagemItensSemCatalogo(semCat)); return; } }
    const erroNota = notaEmpresasErro(pagHolder, lojaId);
    if(erroNota){ showToast(erroNota); return; }

    // ===== 1) Desfaz o que a venda original lançou (estoque + crédito/fiado do cliente antigo) =====
    // Devolve na mesma loja de onde saiu (vendas antigas sem esse registro não são revertidas
    // automaticamente — o ajuste de estoque, se necessário, precisa ser manual).
    if(v.estoqueConsumido && v.estoqueLojaId){
      for(const [produtoId, qtd] of Object.entries(v.estoqueConsumido)){
        if(!qtd) continue;
        const p = produtosEstoque.find(x=>x.id===produtoId);
        if(!p) continue;
        if(!p.estoquePorLoja) p.estoquePorLoja = {};
        const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{
          produtoId, lojaId:v.estoqueLojaId, tipoMovimento:'CANCELAMENTO_VENDA', quantidade: qtd, referenciaId: v.id,
          observacao:'Desfeito pra reaplicar edição da venda.'
        }});
        if(r && !r.error && typeof r.saldoNovo === 'number'){ p.estoquePorLoja[v.estoqueLojaId] = r.saldoNovo; }
        else{ console.error('erro ao desfazer consumo original (edição)', produtoId, r && r.error); p.estoquePorLoja[v.estoqueLojaId] = (Number(p.estoquePorLoja[v.estoqueLojaId])||0) + qtd; }
      }
    }
    const clienteAntigo = encontrarClienteDaVenda(v);
    if(clienteAntigo){
      let mudou = false;
      if(v.creditoUsado > 0){
        clienteAntigo.credito = (Number(clienteAntigo.credito)||0) + v.creditoUsado;
        if(!clienteAntigo.creditoMovimentos) clienteAntigo.creditoMovimentos = [];
        clienteAntigo.creditoMovimentos.push({ data: hoje(), valor: v.creditoUsado, tipo:'estorno', obs:`Edição da venda ${String(v.id).slice(-8)}` });
        mudou = true;
      }
      if(v.fiadoDebitoId && Array.isArray(clienteAntigo.fiadoDebitos)){
        const idx = clienteAntigo.fiadoDebitos.findIndex(d=>d.id===v.fiadoDebitoId);
        if(idx > -1){
          const jaPago = Number(clienteAntigo.fiadoDebitos[idx].valorPago)||0;
          if(jaPago > 0){
            clienteAntigo.credito = (Number(clienteAntigo.credito)||0) + jaPago;
            if(!clienteAntigo.creditoMovimentos) clienteAntigo.creditoMovimentos = [];
            clienteAntigo.creditoMovimentos.push({ data: hoje(), valor: jaPago, tipo:'estorno', obs:`Edição da venda ${String(v.id).slice(-8)} (parcela de fiado já paga)` });
          }
          clienteAntigo.fiadoDebitos.splice(idx,1);
          mudou = true;
        }
      }
      if(mudou) await salvarUmCliente(clienteAntigo);
    }

    // ===== 2) Planeja o novo consumo de estoque (igual a uma venda nova) =====
    const lojaEstoqueEdicao = lojaEstoqueDaVenda(lojaId, pagHolder);
    const reservas = {};
    let faltandoGeral = [];
    itensValidos.forEach(it=>{
      if(!it.produtoEstoqueId){ it.estoqueConsumidoItem = {}; return; }
      const antes = {...reservas};
      const resultado = planejarConsumoEstoque(it.produtoEstoqueId, Number(it.quantidade)||0, reservas, lojaEstoqueEdicao);
      if(!resultado.ok) faltandoGeral.push(...resultado.faltando);
      const delta = {};
      Object.keys(reservas).forEach(pid=>{ const d=(reservas[pid]||0)-(antes[pid]||0); if(d>0) delta[pid]=d; });
      it.estoqueConsumidoItem = delta;
    });
    if(faltandoGeral.length > 0){
      const lista = faltandoGeral.map(f=> `${f.nome} (faltam ${f.quantidade.toFixed(2)})`).join(', ');
      const prosseguir = confirm(`Estoque insuficiente pra: ${lista}.\n\nSalvar mesmo assim? O estoque desses itens vai ficar negativo.`);
      if(!prosseguir) return;
    }

    // ===== 3) Novo crédito/fiado (igual a uma venda nova), pro cliente (novo) da edição =====
    const pagsCredito = (pagHolder.pagamentos||[]).filter(p=>p.formaId==='__credito');
    const pagsFiado = (pagHolder.pagamentos||[]).filter(p=>p.formaId==='__fiado');
    const totalCredito = pagsCredito.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const totalFiado = pagsFiado.reduce((a,p)=>a+(Number(p.valor)||0),0);
    let clienteNovo = null;
    if(pagsCredito.length>0 || pagsFiado.length>0){
      const telD = (telefone||'').replace(/\D/g,'');
      const nomeL = (cliente||'').trim().toLowerCase();
      clienteNovo = clientes.find(c=> (telD && (c.telefone||'').replace(/\D/g,'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL));
      if(!clienteNovo){ showToast('Para usar Crédito ou Fiado, o cliente precisa estar cadastrado.'); return; }
      if(totalCredito>0 && (Number(clienteNovo.credito)||0) < totalCredito - 0.001){
        showToast(`Crédito insuficiente: o cliente tem ${fmtMoeda(clienteNovo.credito)}.`);
        return;
      }
    }

    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    const novoFiadoDebitoId = totalFiado>0 ? ('fd_'+Math.random().toString(36).slice(2)+Date.now().toString(36)) : null;

    // ===== 4) Aplica tudo e regrava a venda =====
    await aplicarConsumosEstoque(reservas, lojaEstoqueEdicao, v.id);
    if(clienteNovo){
      if(totalCredito>0){
        clienteNovo.credito = (Number(clienteNovo.credito)||0) - totalCredito;
        if(!clienteNovo.creditoMovimentos) clienteNovo.creditoMovimentos = [];
        clienteNovo.creditoMovimentos.push({ data: hoje(), valor: -totalCredito, tipo:'uso', obs:`Venda ${String(v.id).slice(-8)} (editada)` });
      }
      if(totalFiado>0){
        if(!clienteNovo.fiadoDebitos) clienteNovo.fiadoDebitos = [];
        clienteNovo.fiadoDebitos.push({ id:novoFiadoDebitoId, origem:'Venda', numero:String(v.id).slice(-8), data, valor:totalFiado, valorPago:0, loja:loja?loja.nome:'' });
      }
      if(totalCredito>0 || totalFiado>0) await salvarUmCliente(clienteNovo);
    }

    const dataAntigaV = v.data;
    v.lojaId = lojaId;
    v.loja = loja ? loja.nome : v.loja;
    v.vendedora = vendedora;
    v.vendedoraId = vendedoraIdPorNome(vendedora);
    v.data = data;
    v.telefone = telefone;
    v.cliente = cliente;
    v.itens = itensValidos;
    v.valorTotal = pagHolder.valorTotal;
    v.pagamentos = carimbarPagamentos(pagHolder.pagamentos, data, dataAntigaV);
    v.momentoPagamento = pagHolder.momentoPagamento;
    v.emissaoNota = pagHolder.emissaoNota;
    v.numeroNota = pagHolder.numeroNota || '';
    v.lojaSaidaId = pagHolder.lojaSaidaId || '';
    v.lojaPagamentoId = pagHolder.lojaPagamentoId || '';
    v.lojaNotaId = pagHolder.lojaNotaId || '';
    v.lojaBaixaEstoqueId = pagHolder.lojaBaixaEstoqueId || '';
    v.estoqueConsumido = reservas;
    v.estoqueLojaId = lojaEstoqueEdicao;
    v.creditoUsado = totalCredito;
    v.fiadoDebitoId = novoFiadoDebitoId;

    const ok = await vendaSalvar(v);
    if(ok){
      showToast('Venda atualizada.');
      closeModal();
      renderTabs(); renderView();
    }
  });
}

      <thead><tr><th>Data</th><th>O que aconteceu</th><th class="num">Diferença</th><th>Feito por</th></tr></thead>
      <tbody>
        ${v.trocas.map(t=>`<tr><td>${fmtDate(t.data)}</td><td>${t.tipoMov==='devolucao' ? 'Devolução: ' + escapeHtml(t.itemAntigoDescricao||'') : 'Troca por '+escapeHtml(t.itemNovo.quantidade)+'× '+escapeHtml(t.itemNovo.produto)}</td><td class="num" style="${t.diferenca>0?'color:var(--ok);':t.diferenca<0?'color:var(--danger);':''}">${fmtMoeda(t.diferenca)}</td><td>${escapeHtml(t.feitoPor||'—')}</td></tr>`).join('')}
      </tbody>
    </table></div>
    ` : ''}
    <div class="section-label">Pagamento</div>
    <table class="tabela-kv">
      <tr><td class="muted" style="width:150px;">Quando paga</td><td>${v.momentoPagamento==='na_volta' ? 'Paga na volta' : 'Pago no ato da venda'}</td></tr>
      <tr><td class="muted">Valor total</td><td class="num" style="text-align:left;"><b>${fmtMoeda(v.valorTotal)}</b></td></tr>
      ${(v.pagamentos||[]).filter(p=>p.formaId).map(p=>`<tr><td class="muted">${escapeHtml(paymentTypesMap[p.formaId]||'—')}</td><td class="num" style="text-align:left;">${fmtMoeda(p.valor)}</td></tr>`).join('')}
      <tr><td class="muted">Recebido</td><td class="num valor-ok" style="text-align:left;">${fmtMoeda(valorRecebidoDe(v))}</td></tr>
      <tr><td class="muted">A receber</td><td class="num ${valorAReceberDe(v)>0.009?'valor-falta':''}" style="text-align:left;">${fmtMoeda(valorAReceberDe(v))}</td></tr>
      <tr><td class="muted">Nota fiscal</td><td>${v.emissaoNota==='sim' ? `<span class="badge selo-ok">Com nota</span>${v.numeroNota?' nº '+escapeHtml(v.numeroNota):''}` : '<span class="badge selo-neutro">Sem nota</span>'}</td></tr>
      ${v.emissaoNota==='sim' ? `
        <tr><td class="muted">Empresa joia</td><td>${escapeHtml(nomeLoja(v.lojaSaidaId))}</td></tr>
        <tr><td class="muted">Empresa do pagamento</td><td>${escapeHtml(nomeLoja(v.lojaPagamentoId))}</td></tr>
        <tr><td class="muted">Empresa nota</td><td>${escapeHtml(nomeLoja(v.lojaNotaId))}</td></tr>
        ${v.lojaBaixaEstoqueId ? `<tr><td class="muted">Baixa estoque</td><td>${escapeHtml(nomeLoja(v.lojaBaixaEstoqueId))}</td></tr>` : ''}
      ` : (v.lojaSaidaId ? `
        <tr><td class="muted">Empresa joia</td><td>${escapeHtml(nomeLoja(v.lojaSaidaId))}</td></tr>
        ${v.lojaBaixaEstoqueId ? `<tr><td class="muted">Baixa estoque</td><td>${escapeHtml(nomeLoja(v.lojaBaixaEstoqueId))}</td></tr>` : ''}
      ` : '')}
    </table>
    ${!podeEditarRegistro(v) ? `<p class="muted" style="margin-top:12px;font-size:12.5px;display:flex;gap:6px;align-items:center;">${ic('cadeado',14)} ${escapeHtml(motivoSemEdicao(v))}</p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="fecharDetalheVenda">Fechar</button>
      <button class="btn btn-accent" id="btnImprimirVenda">${ic('impressora')} Imprimir via</button>
    </div>
  `);
  document.getElementById('fecharDetalheVenda').addEventListener('click', closeModal);
  document.getElementById('btnImprimirVenda').addEventListener('click', ()=> printVenda(v));
}

/** Abre uma janela de impressão em formato de bobina (recibo térmico), com a largura
 * configurada. Se `codigoVia` for passado, imprime um código de barras nítido no
 * rodapé, com o número do código escrito logo abaixo dele. */
const ESCALA_BOBINA_PX = {
  pequena: { base:12, titulo:14, sub:11 },
  media:   { base:14, titulo:17, sub:12.5 },
  grande:  { base:16.5, titulo:20, sub:14.5 },
};
function abrirImpressaoBobina(titulo, conteudoHtml, larguraMm, codigoVia){
  const impCfg = config.impressao || {};
  const px = ESCALA_BOBINA_PX[impCfg.escalaTexto] || ESCALA_BOBINA_PX.media;
  const peso = impCfg.negrito!==false ? 700 : 400;
  const reforcoCss = impCfg.reforcoTraco ? 'text-shadow:0.3px 0 0 currentColor, -0.3px 0 0 currentColor;' : '';
  const rodape = (impCfg.mensagemRodape||'').trim();
  const codigoHtml = codigoVia ? `
    <div class="linha"></div>
    <div class="barcode-wrap"><svg id="barcodeSvg"></svg></div>
    <div class="sub" style="text-align:center; font-weight:800; letter-spacing:.04em; margin-top:2px;">${escapeHtml(codigoVia)}</div>
  ` : '';
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titulo)}</title>
${codigoVia ? `<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>` : ''}
<style>
  @page{ margin:0; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ font-family:'Courier New', monospace; box-sizing:border-box; width:${larguraMm}mm; margin:0 auto; padding:1mm 2mm; color:#000; font-weight:${peso}; font-size:${px.base}px; line-height:1.42; -webkit-font-smoothing:none; ${reforcoCss} }
  .titulo{ font-size:${px.titulo}px; font-weight:800; text-align:center; letter-spacing:.02em; }
  .sub{ font-size:${px.sub}px; color:#000; text-align:center; }
  .linha{ border-top:1px dashed #000; margin:6px 0; }
  .rodape{ text-align:center; margin-top:10px; font-size:${px.sub}px; }
  b{ font-weight:800; }
  .barcode-wrap{ text-align:center; margin-top:6px; }
  .barcode-wrap svg{ max-width:100%; }
  html{ margin:0; padding:0; height:auto; background:#fff; }
</style>
</head>
<body>
  ${codigoHtml}
  ${conteudoHtml}
  ${rodape ? `<div class="linha"></div><div class="rodape">${escapeHtml(rodape)}</div>` : ''}
</body>
</html>`;
  const printWin = window.open('', '_blank', 'width=420,height=700');
  if(!printWin){ showToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups do navegador.'); return; }
  printWin.document.open();
  printWin.document.write(html);
  printWin.document.close();
  printWin.focus();
  // A impressora térmica recebe uma página com a altura EXATA do que foi escrito (sem sobra em cima/embaixo e sem cortar o fim).
  const imprimirAjustado = ()=>{
    try{
      const d = printWin.document;
      const h = Math.ceil(d.body.getBoundingClientRect().height);
      const mm = Math.ceil(h * 25.4 / 96) + 2;
      const st = d.createElement('style');
      st.textContent = `@page{ size:${larguraMm}mm ${mm}mm; margin:0; }`;
      d.head.appendChild(st);
    }catch(e){}
    try{ printWin.print(); }catch(e){}
  };
  if(codigoVia){
    const tentarGerarCodigo = ()=>{
      try{
        if(printWin.JsBarcode){
          printWin.JsBarcode(printWin.document.getElementById('barcodeSvg'), codigoVia, { format:'CODE128', width:2, height:42, displayValue:false, margin:0 });
        }
      }catch(e){}
      setTimeout(imprimirAjustado, 250);
    };
    setTimeout(tentarGerarCodigo, 400);
  } else {
    setTimeout(imprimirAjustado, 300);
  }
}

function printVenda(v){
  const paymentTypesMap = {}; (config.formasPagamento||[]).forEach(pt=>{ paymentTypesMap[pt.id]=pt.nome; }); paymentTypesMap['__credito']='CRÉDITO CLIENTE'; paymentTypesMap['__fiado']='Fiado';
  const imp = (config.impressao && config.impressao.vendas) || {};
  const larguraMm = (config.impressao && config.impressao.larguraBobina) || 80;

  const linhas = [];
  linhas.push(`<div class="titulo">VENDA</div>`);
  linhas.push(`<div class="sub">${escapeHtml(v.loja)}${v.codigoVia?' · Via '+escapeHtml(v.codigoVia):''}</div>`);
  linhas.push(`<div class="sub">${fmtDate(v.data)}</div>`);
  linhas.push(`<div class="linha"></div>`);

  if(imp.cliente !== false){
    linhas.push(`<div><b>Cliente:</b> ${escapeHtml(v.cliente||'—')}</div>`);
  }
  if(imp.telefone !== false && v.telefone){
    linhas.push(`<div><b>Telefone:</b> ${escapeHtml(v.telefone)}</div>`);
  }
  if(imp.vendedora !== false){
    linhas.push(`<div><b>Vendedora:</b> ${escapeHtml(v.vendedora||'—')}</div>`);
  }

  if(imp.itens !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>ITENS</b></div>`);
    (v.itens||[]).forEach(it=>{
      linhas.push(`<div>${escapeHtml(it.produto)}${it.metal?' ('+escapeHtml(it.metal)+')':''} x${it.quantidade} — ${fmtMoeda(it.valorUnitario)}</div>`);
    });
  }

  if(imp.valores !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div>Valor total: ${fmtMoeda(v.valorTotal)}</div>`);
    linhas.push(`<div>Recebido: ${fmtMoeda(valorRecebidoDe(v))}</div>`);
    linhas.push(`<div>A receber: ${fmtMoeda(valorAReceberDe(v))}</div>`);
  }
  if(imp.formaPagamento !== false){
    (v.pagamentos||[]).filter(p=>p.formaId).forEach(p=>{
      linhas.push(`<div>${escapeHtml(paymentTypesMap[p.formaId]||'—')}: ${fmtMoeda(p.valor)}</div>`);
    });
  }

  abrirImpressaoBobina('Venda', linhas.join(''), larguraMm, v.codigoVia);
}

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
