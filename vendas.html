<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas (PDV) · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="icones.js"></script>
<script src="formato.js"></script>
<script src="cliente-lojas.js"></script>
<style>
/* Vendas (PDV) — cores SEMPRE pelas variáveis do tema (tema.css). Nada de hex aqui. */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.so-cel{display:none;}

/* ---------- login e cabeçalho (só quando a tela abre fora do app) ---------- */
.hub-back-link{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.hub-back-link:hover{color:rgba(255,255,255,1);}
.login-card .hub-back-link{color:var(--ink-faint);}
#view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--t-dark);}
.login-card{background:var(--surface);border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:var(--t-shadow-lg);}
.login-tag{font-size:12px;font-weight:700;color:var(--accent);margin:16px 0 6px;}
.login-title{font-size:22px;letter-spacing:-.015em;font-weight:700;margin:0 0 6px;}
.login-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
.login-error{display:none;background:var(--danger-soft);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint);font-size:12.5px;margin-top:12px;line-height:1.5;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;background:var(--t-dark);color:rgba(255,255,255,.95);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
.brand-name{font-weight:700;font-size:15px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);border:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
.tabs button.active{background:var(--t-primary-strong);color:rgba(255,255,255,1);}
.who{display:flex;align-items:center;gap:10px;font-size:13px;}
.level-pill{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.icon-btn{background:none;border:none;color:inherit;cursor:pointer;padding:6px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:rgba(255,255,255,.1);}
.icon-btn-sair:hover{background:rgba(242,133,122,.25);}

/* ---------- página ---------- */
#mainContent{max-width:1120px;margin:0 auto;padding:24px 24px 96px;}
#mainContent.modo-pdv{max-width:1360px;padding-bottom:24px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.page-title{font-size:20px;letter-spacing:-.015em;font-weight:700;margin:0 0 4px;color:var(--ink);}
.page-sub{color:var(--muted);font-size:13.5px;margin:0;line-height:1.5;}
.page-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.link-voltar{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink-faint);text-decoration:none;}
.link-voltar:hover{color:var(--accent);}
.atalhos{font-size:12px;color:var(--ink-faint);}
.atalhos kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--ink-soft);font:600 11px/1.5 var(--t-font);text-align:center;}

.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid var(--line);box-shadow:var(--t-shadow-sm);}
.card-tabela{padding:4px 8px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0 0 14px;}
.section-label .ico{color:var(--accent);}
.section-label .conta{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-faint);}
.muted{color:var(--muted);font-size:13px;}
.empty{color:var(--ink-faint);font-size:13.5px;padding:14px 0;line-height:1.5;}
.estado-vazio{padding:40px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.5;}
.estado-vazio .ico{display:block;margin:0 auto 10px;color:var(--line-strong);}
.estado-vazio b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;}
.so-leitor{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ---------- campos ---------- */
.field{margin-bottom:12px;min-width:0;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;}
.field input:not([type=checkbox]):not([type=radio]),.field select{min-height:40px;}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=email],select{padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;min-height:40px;}
textarea{padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }

/* ---------- botões ---------- */
.btn{border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;min-height:40px;white-space:nowrap;background:var(--surface);color:var(--ink);}
.btn-accent,.btn-primary{background:var(--t-primary-strong);border-color:var(--t-primary-strong);color:rgba(255,255,255,1);}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);}
.btn-danger{background:var(--danger);border-color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:6px 12px;font-size:12.5px;min-height:32px;gap:6px;}
.btn-lg{padding:12px 22px;font-size:15px;min-height:48px;}
.btn-link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.btn-link:hover{color:var(--accent-ink);}
.btn-icone.perigo{color:var(--danger);}

/* ---------- selos ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap;}
.badge-loja{background:var(--surface-2);color:var(--ink-soft);font-weight:700;letter-spacing:.02em;}
.selo-ok{background:var(--ok-soft);color:var(--ok);}
.selo-wait{background:var(--wait-soft);color:var(--wait);}
.selo-danger{background:var(--danger-soft);color:var(--danger);}
.selo-info{background:var(--t-info-soft);color:var(--info);}
.selo-neutro{background:var(--surface-2);color:var(--ink-faint);}

/* ---------- filtros e resumo ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow-sm);}
.filters select,.filters input[type=date],.filters input[type=text]{font-size:13.5px;}
.filters select{flex:0 1 220px;}
.campo-busca{position:relative;flex:1 1 240px;min-width:0;}
.campo-busca .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
.campo-busca input{width:100%;padding-left:34px !important;}
.chk-chip{display:inline-flex;align-items:center;gap:8px;padding:0 12px;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;user-select:none;background:var(--surface);}
.chk-chip:has(input:checked){background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.resumo-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--t-shadow-sm);min-width:0;}
.kpi-rot{font-size:12.5px;font-weight:600;color:var(--ink-faint);display:flex;align-items:center;gap:6px;}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-.015em;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-nota{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.kpi-ok .kpi-val{color:var(--ok);}
.kpi-danger .kpi-val{color:var(--danger);}
.kpi-nota.alerta{color:var(--danger);font-weight:600;}
.faixa-resumo{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:13.5px;color:var(--ink-soft);}
.faixa-resumo b{color:var(--ink);font-variant-numeric:tabular-nums;}
.faixa-resumo .alerta{color:var(--danger);}
.faixa-resumo .atencao{color:var(--wait);}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
td.num b{font-weight:700;}
th.acoes,td.acoes{text-align:right;width:1%;white-space:nowrap;}
.td-via{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;}
.cli-nome{font-weight:600;color:var(--ink);}
.selos-linha{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
tr.linha-cancelada td{color:var(--ink-faint);}
tr.linha-cancelada .cli-nome{text-decoration:line-through;color:var(--ink-faint);}
.valor-ok{color:var(--ok);}
.valor-falta{color:var(--danger);font-weight:700;}
.acoes-linha{display:inline-flex;gap:2px;align-items:center;}
.tabela-kv td:first-child{color:var(--ink-faint);width:170px;}
.tabela-kv td{padding:8px 4px;}

/* menu "Mais ações" da linha */
.menu-acoes{position:fixed;z-index:70;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);padding:6px;display:none;}
.menu-acoes.aberto{display:block;}
.menu-acoes button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left;}
.menu-acoes button:hover,.menu-acoes button:focus-visible{background:var(--surface-2);}
.menu-acoes button .ico{color:var(--ink-faint);}
.menu-acoes button.perigo,.menu-acoes button.perigo .ico{color:var(--danger);}
.menu-acoes hr{border:0;border-top:1px solid var(--line);margin:4px 0;}

/* ---------- nova venda (PDV) ---------- */
.pdv-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start;}
.pdv-lado{position:sticky;top:16px;}
.pdv-barra{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:4px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow);}
.pdv-barra-total{display:flex;flex-direction:column;min-width:0;}
.pdv-barra-total span{font-size:12.5px;font-weight:600;color:var(--ink-faint);}
.pdv-barra-total strong{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15;}
.pdv-barra-status{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.pdv-barra-status.falta{color:var(--wait);}
.pdv-barra-status.excede{color:var(--danger);}
.pdv-barra-status.ok{color:var(--ok);}
.pdv-barra-status.neutro{color:var(--ink-faint);font-weight:500;}
.pdv-barra-acoes{margin-left:auto;display:flex;gap:8px;align-items:center;}
.loja-fixa{display:flex;align-items:center;gap:8px;min-height:40px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);}
.loja-fixa .ico{color:var(--ink-faint);}
.banner-orc{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 16px;background:var(--accent-soft);border:1px solid var(--t-primary-line);border-radius:12px;margin-bottom:16px;font-size:13.5px;color:var(--ink);}
.banner-orc .ico{color:var(--accent);}

/* itens */
.item-row{border:1px solid var(--line-strong);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface);}
.item-row-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.item-row-produto{flex:1 1 240px;min-width:200px;}
.item-row-valor{width:120px;flex-shrink:0;position:relative;}
.item-row-valor::before{content:"R$";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:600;color:var(--ink-faint);pointer-events:none;}
.item-row-valor input{width:100%;padding:8px 8px 8px 32px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;height:40px;text-align:right;font-variant-numeric:tabular-nums;}
.item-row-desc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;order:5;flex:1 1 100%;}
.btn-ajuste{padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-soft);height:36px;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s;}
.btn-ajuste:hover{background:var(--surface-2);}
.btn-ajuste.ativo-desc{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
.btn-ajuste.ativo-acr{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);}
.item-row-desc .campo-perc,.item-row-desc .campo-val,.campo-perc,.campo-val{width:76px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;height:36px;min-height:36px;background:var(--surface);color:var(--ink);}
.desc-sep{font-size:12px;color:var(--ink-faint);font-weight:600;}
.desc-total{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums;}
.prod-ac-fator-inline{font-size:12px;color:var(--ok);white-space:nowrap;flex-shrink:0;}
.item-row-obs{margin-top:8px;}
.item-row-rodape{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;}
.chk-avulso{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
.btn-add-item{display:inline-flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--t-primary-strong);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--t-primary-strong);color:rgba(255,255,255,1);height:40px;white-space:nowrap;flex-shrink:0;}
.btn-add-item:hover{background:var(--t-primary-dark);border-color:var(--t-primary-dark);}
.lista-itens-ok{display:flex;flex-direction:column;gap:6px;}
.venda-item-compact{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13.5px;}
.venda-compact-nome{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.venda-compact-val{font-size:14px;font-weight:700;color:var(--ink);flex-shrink:0;font-variant-numeric:tabular-nums;text-align:right;}
.venda-compact-val small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-faint);}
.venda-compact-obs{font-size:12.5px;color:var(--ink-soft);margin:-2px 0 4px;padding:6px 10px;background:var(--surface-2);border-radius:8px;display:none;}
.venda-compact-icones{display:flex;gap:2px;flex-shrink:0;}
.venda-compact-btn.tem-obs{color:var(--accent);}
.obs-geral-box label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.obs-geral-box textarea,.info-interna-box textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;resize:vertical;min-height:64px;background:var(--surface);color:var(--ink);font-family:inherit;}
.info-interna-box{margin-top:12px;}
.info-interna-box textarea{border-style:dashed;border-color:var(--wait);background:var(--wait-soft);}
.info-interna-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;background:var(--wait-soft);color:var(--wait);border-radius:999px;font-size:12px;font-weight:600;margin-bottom:6px;}
.item-row-obs input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--ink);}
.prod-ac-wrap{position:relative;}
.prod-ac-input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);outline:none;min-width:0;min-height:40px;}
.prod-ac-input:focus{border-color:var(--accent);box-shadow:var(--t-ring);}
.prod-ac-drop,.cli-ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);max-height:260px;overflow-y:auto;z-index:1300;}
.prod-ac-item{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);}
.prod-ac-item:last-child{border-bottom:none;}
.prod-ac-item:hover,.prod-ac-item.pf{background:var(--accent-soft);}
.prod-ac-item b{display:block;font-size:13.5px;font-weight:600;}
.prod-ac-item span{font-size:12px;color:var(--ink-faint);}
.prod-ac-sel{display:flex;align-items:center;gap:8px;background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:0 4px 0 11px;min-height:40px;font-size:14px;min-width:0;}
.prod-ac-sel b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ok);font-weight:600;}
.prod-ac-sel .pa-clr{background:none;border:none;cursor:pointer;color:var(--ok);padding:4px;border-radius:6px;display:inline-flex;flex-shrink:0;}
.prod-ac-sel .pa-clr:hover{background:var(--surface);}
.prod-ac-fator{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.item-row-estoque{margin-top:8px;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);}
.item-row-estoque .ico{color:var(--ink-faint);}
.disp-ok{color:var(--ok);} .disp-falta{color:var(--danger);}
.aviso{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;margin-top:8px;border:1px solid;}
.aviso .ico{margin-top:1px;}
.aviso-wait{background:var(--wait-soft);border-color:var(--wait);color:var(--wait);}
.aviso-danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.aviso-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.aviso-info{background:var(--accent-soft);border-color:var(--t-primary-line);color:var(--ink);}
.aviso small{display:block;font-weight:500;margin-top:2px;color:var(--ink-soft);}

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

/* ============================================================
   ESTADO / STORAGE — a config é a MESMA tabela usada pelo hub,
   pelo O.S. e pelas Transferências: "gestao_config" (id='config').
   Vendas ficam na sua própria tabela "vendas_pdv" (uma linha por venda).
   A partir daqui o app não fala mais direto com o banco: tudo passa pela
   Edge Function "db-gateway", que exige a senha de um acesso válido.
   ============================================================ */
let config = null;
let vendas = [];
let currentUser = null;
let currentTab = 'vendas';
let modoNovaVenda = false;

/* Atalhos de teclado do balcão (PDV). Só age quando não tem modal aberto (senão
 * atrapalharia digitar normalmente dentro do modal) e a tela já está montada. */
document.addEventListener('keydown', (e)=>{
  const modalAberto = document.getElementById('modalOverlay') && document.getElementById('modalOverlay').classList.contains('show');
  if(modalAberto || !currentUser) return;
  if(e.key === 'F2'){
    e.preventDefault();
    if(!modoNovaVenda){ modoNovaVenda = true; renderView(); }
  } else if(e.key === 'F4' && modoNovaVenda){
    e.preventDefault();
    const inp = document.getElementById('cliAcInput');
    if(inp) inp.focus();
  } else if(e.key === 'F8' && modoNovaVenda){
    e.preventDefault();
    const pag = document.getElementById('pagamentoContainerNova');
    if(pag){
      pag.scrollIntoView({ behavior:'smooth', block:'center' });
      const primeiroFoco = pag.querySelector('input, select, button');
      if(primeiroFoco) primeiroFoco.focus();
    }
  } else if(e.key === 'Enter' && modoNovaVenda){
    // Se o foco está num campo de produto dentro dos itens da venda, Enter adiciona
    // a linha (equivalente a clicar "+ Adicionar item") em vez de submeter algo.
    const dentroDosItens = e.target.closest && e.target.closest('#itensContainerNova');
    if(dentroDosItens){
      // confirma via Enter: clica em 'Adicionar' da primeira linha em edição
      const btnPlus = document.querySelector('[data-itadd]');
      if(btnPlus){ e.preventDefault(); btnPlus.click(); }
    }
  }
});
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){
  return gatewayCall({ op:'login', senha: senhaTentativa });
}
/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 1000 } });   // o servidor (Supabase) devolve no máximo 1000 linhas por chamada: pedir mais fazia o fim da lista sumir
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/** Busca de produto nos autocompletes: ignora acento e maiúscula, aceita palavras em qualquer ordem
 *  (ex.: "alianca 9 f0,3"), procura também no código interno e mostra primeiro quem começa com o texto digitado. */
function filtrarProdutosBusca(lista, texto){
  const norm = s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[;.]/g,',');   // ponto, vírgula e ponto e vírgula valem o mesmo
  const q = norm(texto).trim();
  const toks = q.split(/\s+/).filter(Boolean);
  if(!toks.length) return [];
  const achados = (lista||[]).filter(p=>{
    const alvo = norm([p.nome,p.codigo,p.codigoInterno,p.codigoBarras,p.fator,p.fornecedor].filter(x=>x!=null&&x!=='').join(' '));
    return toks.every(t=>alvo.includes(t));
  });
  achados.sort((a,b)=>{ const na=norm(a.nome), nb=norm(b.nome);
    return ((nb===q)-(na===q)) || ((nb.startsWith(q))-(na.startsWith(q))) || na.localeCompare(nb,'pt-BR',{numeric:true}); });
  return achados.slice(0,40);
}

/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`,
 * explodindo pela composição (receita) em cascata quando falta estoque em
 * qualquer nível — ex: falta o produto pronto -> usa o insumo secundário ->
 * se também faltar, usa os insumos primários que compõem o secundário.
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`, NA
 * LOJA `lojaId` (estoque agora é por loja, não mais um número global), explodindo
 * pela composição (receita) em cascata quando falta estoque em qualquer nível —
 * ex: falta o produto pronto -> usa o insumo secundário -> se também faltar, usa
 * os insumos primários que compõem o secundário (sempre dentro da mesma loja).
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
function planejarConsumoEstoque(produtoId, quantidadeNecessaria, reservas, lojaId){
  const produto = produtosEstoque.find(p=>p.id===produtoId);
  if(!produto) return { ok:false, faltando:[{ produtoId, nome:'(produto não encontrado)', quantidade:quantidadeNecessaria }] };

  const estoqueNaLoja = Number((produto.estoquePorLoja||{})[lojaId]) || 0;
  const jaReservado = reservas[produtoId] || 0;
  const disponivel = Math.max(0, estoqueNaLoja - jaReservado);
  const usarDoProprio = Math.min(disponivel, quantidadeNecessaria);
  if(usarDoProprio > 0) reservas[produtoId] = jaReservado + usarDoProprio;

  const faltaAinda = quantidadeNecessaria - usarDoProprio;
  if(faltaAinda <= 1e-9) return { ok:true, faltando:[] };

  if(!produto.composicao || produto.composicao.length===0){
    return { ok:false, faltando:[{ produtoId, nome:produto.nome, quantidade:faltaAinda }] };
  }

  let tudoOk = true;
  const faltandoTotal = [];
  produto.composicao.forEach(comp=>{
    const qtdComponente = (Number(comp.quantidade)||0) * faltaAinda;
    const resultado = planejarConsumoEstoque(comp.insumoId, qtdComponente, reservas, lojaId);
    if(!resultado.ok){ tudoOk = false; faltandoTotal.push(...resultado.faltando); }
  });
  return { ok: tudoOk, faltando: faltandoTotal };
}

/** Aplica os consumos planejados NA LOJA `lojaId` via o Kardex (registra o movimento
 * e atualiza o saldo numa transação atômica no banco — evita duas vendas do mesmo
 * produto/loja pisarem uma na outra, e deixa histórico de quem/quando/por quê). */
async function aplicarConsumosEstoque(reservas, lojaId, referenciaId){
  const ids = Object.keys(reservas).filter(id=> reservas[id] > 0);
  for(const id of ids){
    const produto = produtosEstoque.find(p=>p.id===id);
    if(!produto) continue;
    const r = await gatewayCall({ op:'registrarMovimentoEstoque', params:{
      produtoId:id, lojaId, tipoMovimento:'VENDA', quantidade: -reservas[id], referenciaId: referenciaId||null
    }});
    if(!produto.estoquePorLoja) produto.estoquePorLoja = {};
    if(r && !r.error && typeof r.saldoNovo === 'number'){
      produto.estoquePorLoja[lojaId] = r.saldoNovo;
    }else{
      console.error('erro ao registrar movimento de estoque', id, r && r.error);
      // fallback: pelo menos mantém a tela coerente, mesmo se o Kardex falhar
      produto.estoquePorLoja[lojaId] = (Number(produto.estoquePorLoja[lojaId])||0) - reservas[id];
    }
  }
}

/* ============================================================
   CLIENTES (cadastro compartilhado com O.S. e Orçamentos)
   ============================================================ */
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
/** Separa um telefone já salvo (qualquer formato) em {ddd, numero}, pra preencher os
 * dois campos separados na edição. Aceita tanto o novo padrão (11 dígitos, celular)
 * quanto números antigos de 10 (fixo, salvos antes dessa mudança). */
function separarTelefone(str){
  const digitos = onlyDigits(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
/** Formata os dígitos do número conforme a pessoa digita — XXXXX-XXXX (celular) ou
 * XXXX-XXXX se for um fixo antigo de 8 dígitos, mantido por compatibilidade. */
function formatarNumeroTelefone(digitos){
  digitos = digitos.slice(0,9);
  if(digitos.length<=4) return digitos;
  if(digitos.length<=8) return digitos.slice(0,digitos.length-4)+'-'+digitos.slice(-4);
  return digitos.slice(0,5)+'-'+digitos.slice(5);
}
function wireTelefoneMask(prefix){
  const dddInp = document.getElementById(prefix+'_telefoneDDD');
  const numInp = document.getElementById(prefix+'_telefoneNum');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigits(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefone(onlyDigits(numInp.value)); });
}
/** Junta DDD+número num telefone só, no formato "(XX) XXXXX-XXXX", pra continuar
 * gravando como sempre (compatível com tudo que já lê o campo "telefone"). Os dois
 * em branco = válido, salva vazio. Só um preenchido ou número incompleto = erro —
 * avisa e retorna null, pro chamador não deixar salvar assim. */
function combinarTelefoneValidado(prefix){
  const ddd = onlyDigits((document.getElementById(prefix+'_telefoneDDD')||{}).value);
  const numero = onlyDigits((document.getElementById(prefix+'_telefoneNum')||{}).value);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==9){
    showToast('Telefone incompleto — preencha o DDD (2 dígitos) e o número (9 dígitos), ou deixe os dois em branco.');
    return null;
  }
  return `(${ddd}) ${numero.slice(0,5)}-${numero.slice(5)}`;
}
/** Localiza no banco um cliente por telefone ou CPF (usado pra evitar duplicar cadastro).
 * Consulta o servidor sob demanda — não precisa (nem tem) o cadastro inteiro em memória. */
async function buscarClientePorTelefoneOuCpf(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  if(!tel && !doc) return null;
  const cacheado = clientes.find(c=>
    (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
  );
  if(cacheado) return cacheado;
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo: doc || tel } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    const achado = achados.find(c=>
      (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
    ) || null;
    if(achado && !clientes.some(x=>x.id===achado.id)) clientes.push(achado);
    return achado;
  }catch(e){ console.error('erro ao localizar cliente', e); return null; }
}

/** Busca endereço pelo CEP usando o ViaCEP (gratuito, sem chave). Retorna null se não achar. */
async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  // Tenta ViaCEP primeiro, BrasilAPI como fallback
  const fontes = [
    async () => {
      const r = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
      const d = await r.json();
      if(d.erro) return null;
      return { endereco: d.logradouro||'', bairro: d.bairro||'', cidade: d.localidade||'', estado: d.uf||'' };
    },
    async () => {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${cepDigits}`);
      if(!r.ok) return null;
      const d = await r.json();
      return { endereco: d.street||'', bairro: d.neighborhood||'', cidade: d.city||'', estado: d.state||'' };
    }
  ];
  for(const fn of fontes){
    try{ const res = await fn(); if(res) return res; }catch(e){}
  }
  return null;
}

// Busca CPF na Receita Federal via BrasilAPI — retorna { nome, situacao } ou null
async function buscarCpfReceita(cpf){
  const digits = onlyDigits(cpf);
  if(digits.length !== 11) return null;
  try{
    const r = await fetch(`https://brasilapi.com.br/api/cpf/v1/${digits}`);
    if(!r.ok) return null;
    const d = await r.json();
    // BrasilAPI retorna { cpf, name, birthday, situation }
    if(!d || !d.name) return null;
    return { nome: d.name, situacao: d.situation||'' };
  }catch(e){ return null; }
}

function wireClienteFields(prefix){
  wireTelefoneMask(prefix);

  // Auto-fill de endereço ao digitar/sair do CEP
  const cepInp = document.getElementById(prefix+'_cep');
  if(cepInp){
    cepInp.addEventListener('blur', async ()=>{
      const cepDigits = onlyDigits(cepInp.value);
      if(cepDigits.length !== 8) return;
      cepInp.placeholder = 'Buscando endereço…';
      const endereco = await buscarEnderecoPorCep(cepDigits);
      cepInp.placeholder = '00000-000';
      if(!endereco){ showToast('CEP não encontrado. Confira os números ou preencha o endereço à mão.'); return; }
      const f = k => document.getElementById(prefix+'_'+k);
      if(f('endereco') && !f('endereco').value) f('endereco').value = endereco.endereco;
      if(f('bairro')   && !f('bairro').value)   f('bairro').value   = endereco.bairro;
      if(f('cidade')   && !f('cidade').value)    f('cidade').value   = endereco.cidade;
      if(f('estado')   && !f('estado').value)    f('estado').value   = endereco.estado;
      // focar no número após preencher
      const numInp = f('numero'); if(numInp) numInp.focus();
      showToast('Endereço preenchido — informe o número.');
    });
  }

  // Auto-busca de nome na Receita Federal ao sair do campo CPF
  const cpfInp = document.getElementById(prefix+'_cpf');
  const nomeInp = document.getElementById(prefix+'_cliente');
  if(cpfInp && nomeInp){
    cpfInp.addEventListener('blur', async ()=>{
      const digits = onlyDigits(cpfInp.value);
      if(digits.length !== 11) return;
      if(nomeInp.value.trim()) return; // já tem nome preenchido, não sobrescreve
      cpfInp.style.background = 'var(--wait-soft)';
      const res = await buscarCpfReceita(digits);
      cpfInp.style.background = '';
      if(res && res.nome){
        nomeInp.value = res.nome;
        showToast('Nome preenchido pela Receita Federal — confira.');
      }
    });
  }
}
/**
 * Abre a tela de cliente com busca (lupa): digitando, filtra os clientes já
 * cadastrados; clicar num resultado preenche o formulário com os dados dele;
 * ou preenche do zero pra cadastrar alguém novo. Ao confirmar, salva e chama
 * `onConfirmar(cliente)` com o registro final. `permitirVazio` deixa cancelar
 * sem selecionar nada (usado em telas onde o cliente é opcional).
 */
/* Busca clientes no SERVIDOR (até 10 resultados, por nome/telefone/CPF) em vez de
 * filtrar a lista inteira carregada no navegador — com debounce de 300ms pra não
 * disparar uma chamada a cada tecla digitada. */
// Gera o HTML de um card de resultado de busca de cliente
function clienteCardHtml(c, idx){
  const partes = (c.nome||'').trim().split(/\s+/);
  const iniciais = partes.length>=2 ? partes[0][0]+partes[partes.length-1][0] : (partes[0]||'?')[0];
  const cpfFmt = c.cpf ? String(c.cpf).replace(/[^\d]/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : '';
  const tags = [
    c.telefone ? `<span class="cli-result-tag">${ic('telefone',12)} ${escapeHtml(c.telefone)}</span>` : '',
    cpfFmt     ? `<span class="cli-result-tag">CPF ${escapeHtml(cpfFmt)}</span>` : '',
    c.cidade   ? `<span class="cli-result-tag">${ic('pin',12)} ${escapeHtml(c.cidade)}</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="cli-result-card" data-idx="${idx}">
    <div class="cli-result-avatar">${escapeHtml(iniciais.toUpperCase())}</div>
    <div class="cli-result-info">
      <div class="cli-result-nome">${escapeHtml(c.nome||'')}${window.ClienteLojas?ClienteLojas.html(c):''}</div>
      ${tags ? `<div class="cli-result-sub">${tags}</div>` : ''}
    </div>
  </div>`;
}

let __debounceClienteTimer = null;

  __debounceClienteTimer = setTimeout(async ()=>{

    aoAchar((r && r.data) || []);
  }, 300);
}
/* Crédito do cliente selecionado: libera a forma CRÉDITO CLIENTE no pagamento e avisa a vendedora */
window.__credCli = { id:null, valor:0 };
function definirCreditoCliente(c, avisar){
  const v = c ? Math.max(0, Number(c.credito)||0) : 0;
  const mudou = window.__credCli.id !== (c && c.id || null) || window.__credCli.valor !== v;
  window.__credCli = { id: c && c.id || null, valor: v };
  if(mudou){
    document.dispatchEvent(new CustomEvent('credito-cliente'));
    if(avisar && v > 0) showToast('Este cliente tem '+fmtMoeda(v)+' de crédito disponível.');
  }
}
function avisoCreditoHtml(c){
  const v = c ? Number(c.credito)||0 : 0;

}

        else if(e.key==='Enter' && focusIdx>=0){ e.preventDefault(); items[focusIdx].dispatchEvent(new MouseEvent('mousedown')); }
        else if(e.key==='Escape'){ fecharDrop(); }
      });

      document.addEventListener('mousedown', function handler(e){
        if(!wrap.contains(e.target)){ fecharDrop(); document.removeEventListener('mousedown',handler); }
      });

    let clienteFinal;
    if(selecionado && selecionado.id){
      clienteFinal = { ...selecionado, ...patch };
      const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
      if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
    } else {
      // Evita duplicar: procura no servidor alguém com o mesmo telefone/CPF.
      const existente = await buscarClientePorTelefoneOuCpf(patch.telefone, patch.cpf);
      if(existente){
        clienteFinal = { ...existente, ...patch };
        const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
        if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
      } else {
        clienteFinal = { id: uid('cli'), ...patch, criadoEm: Date.now() };
        clientes.unshift(clienteFinal);
      }
    }
    await salvarUmCliente(clienteFinal);
    closeModal();
    onConfirmar(clienteFinal);
  });
}

function lojaOptionsHtml(selected){
  return ((config&&config.lojas)||[]).filter(l=>!l.interna).map(l=>`<option value="${l.id}" ${selected===l.id?'selected':''}>${escapeHtml(l.nome)} (${escapeHtml(l.abreviacao)})</option>`).join('');
}
/** Nome que aparece nas listas dos módulos: o apelido do cadastro, ou o nome completo se não tiver apelido. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Um nome gravado num lançamento antigo pode ser o nome completo; aqui bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** Código (id no cadastro de funcionários) da vendedora escolhida. Vazio se o nome não bater com exatamente um funcionário.
 *  Gravado junto com o nome para o DP ligar a venda à vendedora sem depender de grafia/apelido. */
/** Vendedora e gerente lançam sempre em nome de quem está logado (como na loja). Diretoria/oficina escolhem. Vazio = campo livre. */
function vendedoraTravadaNoLogin(){
  if(!currentUser || (currentUser.nivel!=='vendedora' && currentUser.nivel!=='gerente')) return '';
  const f = (config.funcionarios||[]).find(x=>currentUser.funcionarioId && x.id===currentUser.funcionarioId);
  return f ? nomeExibicaoFuncionario(f) : (currentUser.nome||'');
}
function vendedoraIdPorNome(nome){
  const alvo = String(nome||'').trim().toLowerCase();
  if(!alvo) return '';
  const achados = (config.funcionarios||[]).filter(f=> String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo);
  return achados.length===1 ? achados[0].id : '';
}
/** Carimba a data (AAAA-MM-DD) em cada pagamento que ainda não tem. Se a data da venda foi corrigida,
 *  o pagamento que tinha a data antiga acompanha a nova. Base do regime de caixa no DP. */
function carimbarPagamentos(pags, dataVenda, dataAntiga){
  return (pags||[]).map(p=>{
    const q = { ...p };
    if(!q.data || (dataAntiga && q.data===dataAntiga && dataAntiga!==dataVenda)) q.data = dataVenda;
    return q;
  });
}
function vendedoraOptionsHtml(selected){
  const lista = (config.funcionarios||[]).filter(f=>(f.cargos||[]).includes('vendedora'));
  const naLista = lista.some(f=>nomeExibicaoFuncionario(f)===selected);
  // lançamento antigo pode ter sido salvo com o nome completo: converte pro apelido
  const equivalente = !naLista && selected ? lista.find(f=>funcionarioBateComNome(f, selected)) : null;
  const valorSel = equivalente ? nomeExibicaoFuncionario(equivalente) : selected;
  const extra = (valorSel && !lista.some(f=>nomeExibicaoFuncionario(f)===valorSel))
    ? `<option value="${escapeHtml(valorSel)}" selected>${escapeHtml(valorSel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${valorSel===n?'selected':''}>${escapeHtml(n)}</option>`;
  }).join('');
}
function produtoJoiaOptionsHtml(selected){
  return `<option value="">Selecione</option>` + (config.joiasProdutos||[]).map(p=>`<option value="${escapeHtml(p)}" ${selected===p?'selected':''}>${escapeHtml(p)}</option>`).join('');
}
function metalOptionsHtml(selected){
  return `<option value="">—</option>` + (config.metais||[]).map(m=>`<option value="${escapeHtml(m)}" ${selected===m?'selected':''}>${escapeHtml(m)}</option>`).join('');
}

/**
 * A baixa de estoque acontece sempre na Empresa joia (de onde o produto saiu de
 * verdade). Quando a nota é emitida pela MESMA empresa da joia, a própria nota já
 * cobre essa baixa — não precisa de mais nada. Quando a nota é de uma empresa
 * DIFERENTE da joia, a baixa não fica registrada em lugar nenhum automaticamente —
 * por isso pedimos confirmação de que ela vai ser feita manualmente, na empresa certa.
 * Retorna null se estiver tudo certo, ou uma mensagem de erro pra mostrar.
 */
/** Botão "Número da nota" do bloco de pagamento: já marca "Nota fiscal: Sim" e guarda o número (holder.numeroNota). */
function numeroNotaBtnHtml(holder){
  const n = (holder && holder.numeroNota) ? String(holder.numeroNota) : '';
  const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return `<button type="button" class="btn btn-ghost btn-sm" data-numnota style="margin-top:6px;" title="Informar o número da nota fiscal (marca Nota fiscal: Sim)">${n ? 'Nota nº ' + esc(n) : 'Número da nota'}</button>`;
}
function abrirNumeroNota(holder, aoSalvar){
  openModal(`
    <h3>Número da nota fiscal</h3>
    <p class="muted">Ao informar o número, a venda/pedido fica como <b>com nota</b>.</p>
    <div class="field" style="margin-top:12px;"><label for="nn_numero">Número da nota</label><input id="nn_numero" autocomplete="off" placeholder="Ex.: 12345" value="${(holder.numeroNota||'').replace(/"/g,'&quot;')}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="nn_cancel" type="button">Cancelar</button>
      <button class="btn btn-accent" id="nn_ok" type="button">Confirmar</button>
    </div>`);
  document.getElementById('nn_cancel').addEventListener('click', closeModal);
  const ok = ()=>{
    const n = document.getElementById('nn_numero').value.trim();
    if(!n){ showToast('Digite o número da nota fiscal.'); return; }
    holder.emissaoNota = 'sim'; holder.numeroNota = n;

  };
  document.getElementById('nn_ok').addEventListener('click', ok);

/**
 * A baixa de estoque acontece sempre na Empresa joia (de onde o produto saiu de
 * verdade) — isso vale COM ou SEM nota fiscal emitida. Quando tem nota e ela é da
 * MESMA empresa da joia, a própria nota já cobre essa baixa — não precisa de mais
 * nada. Em qualquer outro caso em que a Empresa joia seja diferente da loja da
 * venda (com ou sem nota), a baixa não fica registrada em lugar nenhum
 * automaticamente — por isso pedimos confirmação de que ela vai ser feita
 * manualmente, na empresa certa.
 * `lojaVendaId` é a loja escolhida lá em cima na tela (onde o cliente foi atendido).
 * Retorna null se estiver tudo certo, ou uma mensagem de erro pra mostrar.
 */
function notaEmpresasErro(holder, lojaVendaId){
  if(holder.emissaoNota === 'sim'){
    if(!holder.lojaSaidaId || !holder.lojaPagamentoId || !holder.lojaNotaId){
      return 'Selecione as 3 empresas (joia, pagamento e nota).';
    }
    if(holder.lojaPagamentoId !== holder.lojaNotaId){
      return 'A empresa do pagamento precisa ser a mesma que emitiu a nota.';
    }
    if(holder.lojaNotaId !== holder.lojaSaidaId){
      if(!holder.lojaBaixaEstoqueId){
        return 'A nota é de uma empresa diferente de onde saiu a joia — confirme em qual empresa a baixa de estoque vai ser feita manualmente.';
      }
      if(holder.lojaBaixaEstoqueId !== holder.lojaSaidaId){
        return 'A baixa de estoque precisa ser feita na mesma empresa de onde saiu a joia, não na empresa da nota.';
      }
    }
    return null;
  }
  // Sem nota fiscal: só existe algo a confirmar se a Empresa joia foi preenchida
  // E é diferente da loja da própria venda — aí sim o estoque não sai "sozinho"
  // da loja certa, precisando de confirmação de baixa manual.
  if(holder.lojaSaidaId && holder.lojaSaidaId !== lojaVendaId){
    if(!holder.lojaBaixaEstoqueId){
      return 'A joia saiu de uma empresa diferente da loja da venda — confirme em qual empresa a baixa de estoque vai ser feita manualmente.';
    }
    if(holder.lojaBaixaEstoqueId !== holder.lojaSaidaId){
      return 'A baixa de estoque precisa ser feita na mesma empresa de onde saiu a joia.';
    }
  }
  return null;
}
function todasEmpresasIguais(holder){
  return holder.emissaoNota==='sim' && holder.lojaSaidaId && holder.lojaPagamentoId && holder.lojaNotaId &&
    holder.lojaSaidaId===holder.lojaPagamentoId && holder.lojaPagamentoId===holder.lojaNotaId;
}
/** Opções de loja pro seletor de "Nota fiscal": mostra a ABREVIAÇÃO (o que foi pedido),
 * com o nome completo só como dica ao passar o mouse. Sempre começa vazio — nunca
 * pré-seleciona a primeira loja da lista sozinho. */
function lojaAbrevOptionsHtml(selected){
