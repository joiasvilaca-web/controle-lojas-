<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas (PDV) · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
  --delivered:#4A1830; --delivered-soft:#F0DDE6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link-dark{color:var(--ink-faint);}
.hub-back-link:hover{color:#fff;}

#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn:hover{background:rgba(255,255,255,0.1);}
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}

#mainContent{max-width:1040px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}

.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:16px; border:1px solid var(--line);}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.item-row{display:grid; grid-template-columns:1.4fr 1fr 70px 100px 34px; gap:8px; margin-bottom:6px; align-items:center;}
@media (max-width:640px){ .item-row{grid-template-columns:1fr 1fr; grid-template-areas:"produto metal" "qtd valor" "del del";} }
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Vendas (PDV)</div>
    <div class="login-title">Acessar vendas</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira com a diretoria.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint" id="loginHint"></div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">$</div>
      <div class="brand-name">Vendas (PDV)</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <a class="icon-btn" id="linkConfigHub" href="index.html#config" title="Configurações (Gestão e Controle)" style="display:none;">⚙️</a>
      <button class="icon-btn" id="btnLogout" title="Sair">⏻</button>
    </div>
  </header>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   ESTADO / STORAGE — a config é a MESMA tabela usada pelo hub,
   pelo O.S. e pelas Transferências: "gestao_config" (id='config').
   Vendas ficam na sua própria tabela "vendas_pdv" (uma linha por venda).
   ============================================================ */
let config = null;
let vendas = [];
let currentUser = null;
let currentTab = 'nova';

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modalBox').innerHTML=''; }
function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

async function configGetUnificada(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar config', e); return null; }
}
async function vendasGet(){
  try{
    const { data, error } = await supabaseClient.from('vendas_pdv').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar vendas', e); return []; }
}
async function vendaSalvar(venda){
  try{
    const { error } = await supabaseClient.from('vendas_pdv').upsert({ id: venda.id, payload: venda, updated_at: new Date().toISOString() });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar venda', e); showToast('Não foi possível salvar. Tente novamente.'); return false; }
}
async function vendaExcluir(id){
  try{
    const { error } = await supabaseClient.from('vendas_pdv').delete().eq('id', id);
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao excluir venda', e); return false; }
}

async function loadAll(){
  config = await configGetUnificada();
  if(!config){
    config = { lojas:[], funcionarios:[], users:[], formasPagamento:[], joiasProdutos:[], metais:[] };
  }
  vendas = await vendasGet();
}

/* ============================================================
   HELPERS DE LOJA / FUNCIONÁRIO / PRODUTO (a partir da config unificada)
   ============================================================ */
function lojaOptionsHtml(selected){
  return (config.lojas||[]).map(l=>`<option value="${l.id}" ${selected===l.id?'selected':''}>${escapeHtml(l.nome)} (${escapeHtml(l.abreviacao)})</option>`).join('');
}
function vendedoraOptionsHtml(selected){
  const lista = (config.funcionarios||[]).filter(f=>(f.cargos||[]).includes('vendedora'));
  return `<option value="">Selecione</option>` + lista.map(f=>`<option value="${escapeHtml(f.nome)}" ${selected===f.nome?'selected':''}>${escapeHtml(f.nome)}</option>`).join('');
}
function produtoJoiaOptionsHtml(selected){
  return `<option value="">Selecione</option>` + (config.joiasProdutos||[]).map(p=>`<option value="${escapeHtml(p)}" ${selected===p?'selected':''}>${escapeHtml(p)}</option>`).join('');
}
function metalOptionsHtml(selected){
  return `<option value="">—</option>` + (config.metais||[]).map(m=>`<option value="${escapeHtml(m)}" ${selected===m?'selected':''}>${escapeHtml(m)}</option>`).join('');
}

/* ============================================================
   PAGAMENTO — mesmo modelo do Painel de O.S. (momento, formas,
   emissão de nota condicional), aqui reaproveitado no PDV.
   ============================================================ */
function mountPagamentos(container, holder){
  if(!holder.pagamentos) holder.pagamentos = [];
  if(!holder.momentoPagamento) holder.momentoPagamento = 'na_encomenda';
  if(!holder.emissaoNota) holder.emissaoNota = 'nao';

  function draw(){
    container.innerHTML = `
      <div class="section-label" style="margin-top:14px;">Pagamento</div>
      <div class="field">
        <label>Momento do pagamento</label>
        <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:2px;">
          <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; text-transform:none; letter-spacing:0;">
            <input type="radio" name="pagMomento" value="na_encomenda" ${holder.momentoPagamento==='na_encomenda'?'checked':''}> Pago no ato da venda
          </label>
          <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; text-transform:none; letter-spacing:0;">
            <input type="radio" name="pagMomento" value="na_volta" ${holder.momentoPagamento==='na_volta'?'checked':''}> Pagar na volta (retirada/entrega)
          </label>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Valor total (R$)</label><input type="number" step="0.01" min="0" id="pagValorTotal" placeholder="0,00" value="${holder.valorTotal!==undefined && holder.valorTotal!==null ? holder.valorTotal : ''}"></div>
      </div>
      <div id="pagRows"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddPagamento">+ Adicionar forma de pagamento</button>
      <div class="muted" id="pagSomaHint" style="margin-top:6px;"></div>
      <div id="pagNotaWrap" style="margin-top:14px; display:none;">
        <div class="field">
          <label>Emitir nota fiscal?</label>
          <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:2px;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; text-transform:none; letter-spacing:0;">
              <input type="radio" name="pagEmiteNota" value="sim" ${holder.emissaoNota==='sim'?'checked':''}> Sim
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; text-transform:none; letter-spacing:0;">
              <input type="radio" name="pagEmiteNota" value="nao" ${holder.emissaoNota==='nao'?'checked':''}> Não
            </label>
          </div>
        </div>
        <div class="grid-2" id="pagNotaCamposWrap" style="display:none;">
          <div class="field"><label>Número da nota</label><input id="pagNumeroNota" placeholder="Ex: 12345" value="${escapeHtml(holder.numeroNota||'')}"></div>
          <div class="field"><label>Local da nota</label><select id="pagLojaNota">${lojaOptionsHtml(holder.lojaNotaId||'')}</select></div>
        </div>
      </div>
    `;
    drawRows();
    atualizarVisibilidadeNota();
    container.querySelectorAll('input[name="pagMomento"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.momentoPagamento = r.value; atualizarVisibilidadeNota(); });
    });
    container.querySelector('#pagValorTotal').addEventListener('input', (e)=>{
      holder.valorTotal = e.target.value === '' ? null : parseFloat(e.target.value);
      updateHint();
    });
    container.querySelector('#btnAddPagamento').addEventListener('click', ()=>{
      const primeiraForma = (config.formasPagamento && config.formasPagamento[0]) ? config.formasPagamento[0].id : '';
      holder.pagamentos.push({ formaId: primeiraForma, valor: '' });
      drawRows();
    });
    container.querySelectorAll('input[name="pagEmiteNota"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.emissaoNota = r.value; atualizarVisibilidadeNota(); });
    });
    const numNotaEl = container.querySelector('#pagNumeroNota');
    if(numNotaEl) numNotaEl.addEventListener('input', ()=>{ holder.numeroNota = numNotaEl.value.trim(); });
    const lojaNotaEl = container.querySelector('#pagLojaNota');
    if(lojaNotaEl) lojaNotaEl.addEventListener('change', ()=>{ holder.lojaNotaId = lojaNotaEl.value; });
  }

  function atualizarVisibilidadeNota(){
    const notaWrap = container.querySelector('#pagNotaWrap');
    const camposWrap = container.querySelector('#pagNotaCamposWrap');
    if(!notaWrap) return;
    if(holder.momentoPagamento === 'na_encomenda'){
      notaWrap.style.display = '';
      camposWrap.style.display = holder.emissaoNota === 'sim' ? '' : 'none';
    }else{
      notaWrap.style.display = 'none';
      holder.emissaoNota = 'nao'; holder.numeroNota = ''; holder.lojaNotaId = '';
    }
  }

  function drawRows(){
    const wrap = container.querySelector('#pagRows');
    wrap.innerHTML = holder.pagamentos.map((p,i)=>`
      <div class="grid-2" style="margin-bottom:6px;">
        <select data-pagform="${i}">${(config.formasPagamento||[]).map(pt=>`<option value="${pt.id}" ${p.formaId===pt.id?'selected':''}>${escapeHtml(pt.nome)}</option>`).join('')}</select>
        <div style="display:flex; gap:6px;">
          <input type="number" step="0.01" min="0" data-pagvalor="${i}" placeholder="Valor" value="${p.valor!==undefined && p.valor!==null && p.valor!=='' ? p.valor : ''}" style="flex:1;">
          <button type="button" class="icon-btn" data-pagdel="${i}" title="Remover">✕</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-pagform]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ holder.pagamentos[Number(sel.dataset.pagform)].formaId = sel.value; });
    });
    wrap.querySelectorAll('[data-pagvalor]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        holder.pagamentos[Number(inp.dataset.pagvalor)].valor = inp.value === '' ? '' : parseFloat(inp.value);
        updateHint();
      });
    });
    wrap.querySelectorAll('[data-pagdel]').forEach(b=>{
      b.addEventListener('click', ()=>{ holder.pagamentos.splice(Number(b.dataset.pagdel),1); drawRows(); updateHint(); });
    });
    updateHint();
  }

  function updateHint(){
    const hint = container.querySelector('#pagSomaHint');
    if(!hint) return;
    if(holder.pagamentos.length === 0){ hint.textContent = ''; return; }
    const soma = holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
    const total = Number(holder.valorTotal)||0;
    if(Math.abs(soma - total) > 0.009){
      hint.innerHTML = `<span style="color:var(--danger);">Soma dos pagamentos (R$ ${soma.toFixed(2)}) diferente do valor total (R$ ${total.toFixed(2)}).</span>`;
    }else{
      hint.innerHTML = `<span style="color:var(--ok);">Soma dos pagamentos confere com o valor total (R$ ${total.toFixed(2)}).</span>`;
    }
  }

  draw();
}
function valorRecebidoDe(v){ return (v.pagamentos||[]).reduce((acc,p)=> acc + (Number(p.valor)||0), 0); }
function valorAReceberDe(v){ return Math.max(0, (Number(v.valorTotal)||0) - valorRecebidoDe(v)); }
function semPagamentoLancado(v){ return !v.valorTotal && (!v.pagamentos || v.pagamentos.length===0); }

/* ============================================================
   ITENS DA VENDA
   ============================================================ */
function mountItens(container, holder){
  if(!holder.itens) holder.itens = [];

  function totalItens(){ return holder.itens.reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0); }

  function draw(){
    container.innerHTML = `
      <div class="section-label">Itens vendidos</div>
      <div class="item-row" style="border-bottom:none; padding-top:0;">
        <div class="muted">Produto</div><div class="muted">Metal</div><div class="muted">Qtd.</div><div class="muted">Valor unit. (R$)</div><div></div>
      </div>
      <div id="itensRows"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddItem" style="margin-top:6px;">+ Adicionar item</button>
      <div class="muted" id="itensTotalHint" style="margin-top:8px;"></div>
    `;
    drawRows();
    container.querySelector('#btnAddItem').addEventListener('click', ()=>{
      holder.itens.push({ id: uid('it'), produto:'', metal:'', quantidade:1, valorUnitario:'' });
      drawRows();
    });
  }
  function drawRows(){
    const wrap = container.querySelector('#itensRows');
    wrap.innerHTML = holder.itens.map((it,i)=>`
      <div class="item-row" data-idx="${i}">
        <select data-itfield="produto">${produtoJoiaOptionsHtml(it.produto)}</select>
        <select data-itfield="metal">${metalOptionsHtml(it.metal)}</select>
        <input type="number" min="1" step="1" data-itfield="quantidade" value="${it.quantidade!==undefined?it.quantidade:1}">
        <input type="number" min="0" step="0.01" data-itfield="valorUnitario" placeholder="0,00" value="${it.valorUnitario!==undefined && it.valorUnitario!=='' ? it.valorUnitario : ''}">
        <button type="button" class="icon-btn" data-itdel="${i}" title="Remover">✕</button>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const row = el.closest('[data-idx]');
        const idx = Number(row.dataset.idx);
        const field = el.dataset.itfield;
        holder.itens[idx][field] = (field==='quantidade'||field==='valorUnitario') ? (el.value===''?'':parseFloat(el.value)) : el.value;
        updateTotalHint();
      });
      el.addEventListener('change', ()=>{
        const row = el.closest('[data-idx]');
        const idx = Number(row.dataset.idx);
        const field = el.dataset.itfield;
        holder.itens[idx][field] = (field==='quantidade'||field==='valorUnitario') ? (el.value===''?'':parseFloat(el.value)) : el.value;
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click', ()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    if(!hint) return;
    hint.innerHTML = `Total dos itens: <b>R$ ${totalItens().toFixed(2)}</b> <span class="muted">(você pode ajustar o valor total do pagamento manualmente se houver desconto/acréscimo)</span>`;
  }
  draw();
  return { totalItens };
}

/* ============================================================
   MODO EMBUTIDO — ver mesma explicação no painel-ordens.html.
   ============================================================ */
const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      window.__permissoesAbasOverride = ev.data.abas || null;
      enterApp();
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    }
  });
}

/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  if(!pass) return;
  err.classList.remove('show');
  const user = (config.users||[]).find(u=>u.senha===pass);
  if(!user){ err.classList.add('show'); return; }
  if(user.nivel === 'oficina'){ err.textContent = 'Esse acesso não tem permissão para o módulo de Vendas.'; err.classList.add('show'); return; }
  currentUser = { id:user.id, nome:user.nome, nivel:user.nivel };
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  document.getElementById('linkConfigHub').style.display = currentUser.nivel==='diretoria' ? '' : 'none';
  buildTabs();
  currentTab = 'nova';
  if(EMBEDDED){
    const permitido = tabsForLevel();
    if(!permitido.some(t=>t.id===currentTab)) currentTab = permitido[0] ? permitido[0].id : 'vendas';
    parent.postMessage({ type:'tabs', modulo:'vendas', tabs: permitido, active: currentTab }, '*');
  }
  renderTabs();
  renderView();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function tabsForLevel(){
  const t = [
    { id:'nova', label:'Nova venda', icon:'🧾' },
    { id:'vendas', label:'Vendas', icon:'📋' },
  ];
  if(window.__permissoesAbasOverride){
    return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'vendas', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='nova') renderNovaVenda(main);
  else if(currentTab==='vendas') renderVendas(main);
}

/* ============================================================
   NOVA VENDA
   ============================================================ */
function renderNovaVenda(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Nova venda</h1>
        <p class="page-sub">Registre os itens vendidos e o pagamento.</p>
      </div>
    </div>
    <div class="card">
      <div class="section-label">Venda</div>
      <div class="grid-2">
        <div class="field"><label>Loja</label><select id="v_loja"><option value="">Selecione</option>${lojaOptionsHtml('')}</select></div>
        <div class="field"><label>Vendedora</label><select id="v_vendedora">${vendedoraOptionsHtml(currentUser.nivel==='vendedora'?currentUser.nome:'')}</select></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Data</label><input type="date" id="v_data" value="${todayStr()}"></div>
        <div class="field"><label>Cliente <span class="muted">(opcional)</span></label><input id="v_cliente" placeholder="Nome do cliente"></div>
      </div>
      <div class="field"><label>Telefone do cliente <span class="muted">(opcional)</span></label><input id="v_telefone" placeholder="(32) 9...."></div>
    </div>
    <div class="card"><div id="itensContainerNova"></div></div>
    <div class="card"><div id="pagamentoContainerNova"></div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-accent" id="btnSalvarVenda">Lançar venda</button>
      <button class="btn btn-ghost" id="btnLimparVenda">Limpar</button>
    </div>
  `;
  const tempItensHolder = { itens:[ { id: uid('it'), produto:'', metal:'', quantidade:1, valorUnitario:'' } ] };
  const itensApi = mountItens(document.getElementById('itensContainerNova'), tempItensHolder);
  const tempPagHolder = { valorTotal:null, pagamentos:[] };
  mountPagamentos(document.getElementById('pagamentoContainerNova'), tempPagHolder);

  document.getElementById('btnLimparVenda').addEventListener('click', ()=> renderNovaVenda(main) );

  document.getElementById('btnSalvarVenda').addEventListener('click', async ()=>{
    const lojaId = document.getElementById('v_loja').value;
    const vendedora = document.getElementById('v_vendedora').value.trim();
    const data = document.getElementById('v_data').value;
    const cliente = document.getElementById('v_cliente').value.trim();
    const telefone = document.getElementById('v_telefone').value.trim();
    const itensValidos = tempItensHolder.itens.filter(it=>it.produto);

    if(!lojaId || !vendedora || !data){ showToast('Preencha loja, vendedora e data.'); return; }
    if(itensValidos.length===0){ showToast('Adicione ao menos um item vendido.'); return; }

    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    const venda = {
      id: uid('venda'),
      loja: loja ? loja.nome : '',
      lojaId, vendedora, data, cliente, telefone,
      itens: itensValidos,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: tempPagHolder.pagamentos,
      momentoPagamento: tempPagHolder.momentoPagamento,
      emissaoNota: tempPagHolder.emissaoNota,
      numeroNota: tempPagHolder.numeroNota || '',
      lojaNotaId: tempPagHolder.lojaNotaId || '',
      status: 'ativa',
      criadoPor: currentUser.nome,
      criadoEm: Date.now(),
    };
    const ok = await vendaSalvar(venda);
    if(ok){
      vendas.unshift(venda);
      showToast('Venda lançada com sucesso.');
      currentTab = 'vendas';
      renderTabs(); renderView();
    }
  });
}

/* ============================================================
   LISTA DE VENDAS
   ============================================================ */
function renderVendas(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Vendas</h1>
        <p class="page-sub">Consulte, filtre e acompanhe os pagamentos das vendas lançadas.</p>
      </div>
    </div>
    <div class="filters">
      <select id="filtroLoja"><option value="">Todas as lojas</option>${lojaOptionsHtml('')}</select>
      <input type="date" id="filtroData">
      <input type="text" id="filtroBusca" placeholder="Buscar cliente/vendedora...">
      <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--danger);">
        <input type="checkbox" id="filtroSemPagamento"> Só sem pagamento
      </label>
      <button class="btn btn-ghost btn-sm" id="btnLimparFiltroVendas">Limpar filtros</button>
    </div>
    <div id="resumoValoresVendas" class="muted" style="margin:2px 0 12px; font-size:13px;"></div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <div id="tabelaVendasWrap"></div>
    </div>
  `;
  const fLoja = document.getElementById('filtroLoja');
  const fData = document.getElementById('filtroData');
  const fBusca = document.getElementById('filtroBusca');
  const fSemPagamento = document.getElementById('filtroSemPagamento');

  function itensResumo(v){
    return (v.itens||[]).map(it=>`${it.quantidade}x ${escapeHtml(it.produto)}${it.metal?' ('+escapeHtml(it.metal)+')':''}`).join(', ');
  }

  function renderTable(){
    let list = [...vendas];
    if(fLoja.value) list = list.filter(v=>v.lojaId===fLoja.value);
    if(fData.value) list = list.filter(v=>v.data===fData.value);
    if(fBusca.value.trim()){
      const q = fBusca.value.trim().toLowerCase();
      list = list.filter(v=> (v.cliente||'').toLowerCase().includes(q) || (v.vendedora||'').toLowerCase().includes(q));
    }
    if(fSemPagamento.checked) list = list.filter(v=>semPagamentoLancado(v));
    list.sort((a,b)=> b.criadoEm - a.criadoEm);

    const totalRecebido = list.reduce((acc,v)=> acc + valorRecebidoDe(v), 0);
    const totalAReceber = list.reduce((acc,v)=> acc + valorAReceberDe(v), 0);
    const semPagCount = list.filter(v=>semPagamentoLancado(v)).length;
    document.getElementById('resumoValoresVendas').innerHTML =
      `Nesta lista: <b style="color:var(--ok);">Recebido R$ ${totalRecebido.toFixed(2)}</b> · <b style="color:var(--danger);">A receber R$ ${totalAReceber.toFixed(2)}</b>` +
      (semPagCount>0 ? ` · <b style="color:var(--danger);">${semPagCount} sem pagamento lançado</b>` : '');

    const wrap = document.getElementById('tabelaVendasWrap');
    if(list.length===0){ wrap.innerHTML = `<div class="empty">Nenhuma venda encontrada com esses filtros.</div>`; return; }
    wrap.innerHTML = `
      <table>
        <thead><tr><th>Data</th><th>Loja</th><th>Vendedora</th><th>Cliente</th><th>Itens</th><th>Recebido</th><th>A receber</th><th>Ações</th></tr></thead>
        <tbody>
          ${list.map(v=>{
            const semPag = semPagamentoLancado(v);
            const recebido = valorRecebidoDe(v);
            const aReceber = valorAReceberDe(v);
            return `
            <tr>
              <td>${fmtDate(v.data)}</td>
              <td><span class="badge badge-loja">${escapeHtml(v.loja)}</span></td>
              <td>${escapeHtml(v.vendedora)}</td>
              <td>${escapeHtml(v.cliente||'—')}${semPag ? `<div style="margin-top:4px; color:var(--danger); font-weight:700; font-size:11.5px;">⚠ Sem pagamento lançado</div>` : ''}</td>
              <td>${itensResumo(v)}</td>
              <td style="color:var(--ok); white-space:nowrap;">R$ ${recebido.toFixed(2)}</td>
              <td style="${aReceber>0?'color:var(--danger); font-weight:700;':''} white-space:nowrap;">R$ ${aReceber.toFixed(2)}</td>
              <td style="white-space:nowrap;">
                <button class="icon-btn" data-view="${v.id}" title="Ver detalhes">👁</button>
                ${currentUser.nivel==='diretoria' ? `<button class="icon-btn" data-del="${v.id}" title="Excluir">🗑️</button>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', ()=> abrirDetalheVenda(vendas.find(x=>x.id===b.dataset.view)) ));
    wrap.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Excluir esta venda? Essa ação não pode ser desfeita.')) return;
        const id = b.dataset.del;
        const ok = await vendaExcluir(id);
        if(ok){ vendas = vendas.filter(x=>x.id!==id); showToast('Venda excluída.'); renderTable(); }
      });
    });
  }
  [fLoja,fData,fBusca,fSemPagamento].forEach(el=>el.addEventListener('input', renderTable));
  document.getElementById('btnLimparFiltroVendas').addEventListener('click', ()=>{
    fLoja.value=''; fData.value=''; fBusca.value=''; fSemPagamento.checked=false; renderTable();
  });
  renderTable();
}

function abrirDetalheVenda(v){
  if(!v) return;
  const paymentTypesMap = {}; (config.formasPagamento||[]).forEach(pt=>{ paymentTypesMap[pt.id]=pt.nome; });
  const lojaNota = (config.lojas||[]).find(l=>l.id===v.lojaNotaId);
  openModal(`
    <h3>Venda — ${escapeHtml(v.cliente || 'cliente não identificado')}</h3>
    <p class="muted">${fmtDate(v.data)} · ${escapeHtml(v.loja)} · Vendedora ${escapeHtml(v.vendedora)}</p>
    <div class="section-label" style="margin-top:14px;">Itens</div>
    <table>
      <thead><tr><th>Produto</th><th>Metal</th><th>Qtd.</th><th>Valor unit.</th></tr></thead>
      <tbody>
        ${(v.itens||[]).map(it=>`<tr><td>${escapeHtml(it.produto)}</td><td>${escapeHtml(it.metal||'—')}</td><td>${it.quantidade}</td><td>R$ ${Number(it.valorUnitario||0).toFixed(2)}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="section-label" style="margin-top:14px;">Pagamento</div>
    <table>
      <tr><td class="muted" style="width:150px;">Momento</td><td>${v.momentoPagamento==='na_volta' ? 'Pagar na volta' : 'Pago no ato da venda'}</td></tr>
      <tr><td class="muted">Valor total</td><td>R$ ${Number(v.valorTotal||0).toFixed(2)}</td></tr>
      ${(v.pagamentos||[]).filter(p=>p.formaId).map(p=>`<tr><td class="muted">${escapeHtml(paymentTypesMap[p.formaId]||'—')}</td><td>R$ ${Number(p.valor||0).toFixed(2)}</td></tr>`).join('')}
      <tr><td class="muted">Recebido</td><td>R$ ${valorRecebidoDe(v).toFixed(2)}</td></tr>
      <tr><td class="muted">A receber</td><td>R$ ${valorAReceberDe(v).toFixed(2)}</td></tr>
      ${v.emissaoNota==='sim' ? `<tr><td class="muted">Nota</td><td>${escapeHtml(v.numeroNota||'—')} ${lojaNota?'· '+escapeHtml(lojaNota.nome):''}</td></tr>` : ''}
    </table>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="fecharDetalheVenda">Fechar</button>
    </div>
  `);
  document.getElementById('fecharDetalheVenda').addEventListener('click', closeModal);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadAll();
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'vendas' }, '*');
    return;
  }
  const hint = document.getElementById('loginHint');
  const hasUsers = (config.users||[]).length > 0;
  if(!hasUsers){
    hint.innerHTML = 'Nenhum acesso cadastrado ainda. Cadastre senhas em <a href="index.html#config">Configurações</a>.';
  }else{
    hint.innerHTML = 'Use a mesma senha do Painel de O.S. — os acessos são únicos para todo o sistema.';
  }
})();
</script>
