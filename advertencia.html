<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vilaça Joias">
<meta property="og:image" content="https://vilaca-controle-lojas.vercel.app/logo-vilaca.png">
<meta property="og:title" content="Advertência — Vilaça Joias">
<title>Advertência · Vilaça Joias</title>
<meta name="robots" content="noindex">
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* Página pública de funcionário (link da advertência). Cores só pelo sistema (tema.css). */
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px; font-family:var(--t-font); background:var(--t-bg); color:var(--ink);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:30px 28px 26px; max-width:520px; width:100%; box-shadow:var(--t-shadow-lg);}
.logo{width:96px; height:auto; display:block; margin:0 auto 16px; border-radius:10px;}
h1{font-size:21px; font-weight:700; letter-spacing:-.015em; margin:0 0 16px; text-align:center; color:var(--ink);}
.info{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px; font-size:14px; line-height:1.55; color:var(--ink-soft);}
.info b{display:block; margin-bottom:2px; color:var(--ink); font-size:15px;}
.texto-formal{font-size:14px; line-height:1.75; color:var(--ink-soft); margin:0 0 22px;}
.texto-formal b{color:var(--ink);}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:1px solid transparent; border-radius:10px; padding:13px 16px; font-size:14.5px; font-weight:600; cursor:pointer;}
.confirmado{display:flex; align-items:center; justify-content:center; gap:8px; background:var(--ok-soft); color:var(--ok); padding:12px 16px; border-radius:10px; font-size:14px; font-weight:600; text-align:center;}
.erro{background:var(--danger-soft); color:var(--danger); padding:12px 16px; border-radius:10px; font-size:14px; line-height:1.5; margin-bottom:14px;}
.loading{color:var(--muted); font-size:14px; text-align:center;}
.rodape{margin-top:20px; text-align:center; font-size:12px; color:var(--muted);}
@media (max-width:480px){ .card{padding:26px 18px 22px; border-radius:20px;} }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="logo-vilaca.png" alt="Vilaça Joias">
  <h1 id="titulo">Carregando…</h1>
  <div id="conteudo"><p class="loading">Só um instante…</p></div>
  <div class="rodape">Vilaça Joias · Departamento Pessoal</div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

// Tudo passa pela Edge Function confirmar-leitura-dp (v6+): as tabelas não têm mais
// acesso direto pela chave anon (auditoria de segurança), então a página não lê
// dp_registros — pede à função só os campos que precisa mostrar.
async function chamarFuncao(body){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/confirmar-leitura-dp`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer '+SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  return await res.json();
}
async function buscarRegistro(id){
  try{
    const r = await chamarFuncao({ id, acao:'buscar' });
    return r && r.registro ? r.registro : null;
  }catch(e){ console.error('Falha ao buscar', e); return null; }
}
async function confirmarLeitura(id){
  const r = await chamarFuncao({ id, acao:'confirmar' });
  if(r && r.error) throw new Error(r.error);
  return r;
}
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }

(async function init(){
  if(!id){
    document.getElementById('titulo').textContent = 'Link inválido';
    document.getElementById('conteudo').innerHTML = '<div class="erro">Este link está incompleto. Peça à diretoria para enviar de novo.</div>';
    return;
  }
  const reg = await buscarRegistro(id);
  if(!reg || reg.tipo !== 'aviso'){
    document.getElementById('titulo').textContent = 'Notificação não encontrada';
    document.getElementById('conteudo').innerHTML = '<div class="erro">Não encontramos esta notificação. Confira se abriu o link completo ou fale com a diretoria.</div>';
    return;
  }
  document.getElementById('titulo').textContent = 'Notificação de advertência';
  render(reg);

  function render(reg){
    const conteudo = document.getElementById('conteudo');
    const jaConfirmado = !!reg.confirmadoEm;
    conteudo.innerHTML = `
      <div class="info">
        <b>${escapeHtml(reg.tipoAviso || 'Advertência')}</b>
        ${reg.motivo ? 'Motivo: '+escapeHtml(reg.motivo) : ''}
      </div>
      <p class="texto-formal">
        Prezado(a) colaborador(a),<br><br>
        Por meio deste comunicado, formalizamos uma <b>advertência ${escapeHtml((reg.tipoAviso||'').toLowerCase())}</b> referente à sua conduta profissional, conforme descrito abaixo, em conformidade com as normas internas da empresa.<br><br>
        ${reg.descricao ? escapeHtml(reg.descricao) + '<br><br>' : ''}
        Ao confirmar abaixo, você declara estar ciente do teor desta notificação. Esta confirmação fica registrada com data e hora, e não representa concordância com o conteúdo — apenas a ciência de tê-lo recebido.
      </p>
      ${jaConfirmado
        ? `<div class="confirmado" role="status">${window.Icone ? Icone('check',{tam:18}) : ''} Recebimento confirmado em ${window.Fmt ? Fmt.dataHora(reg.confirmadoEm) : new Date(reg.confirmadoEm).toLocaleString('pt-BR')}</div>`
        : `<button class="btn btn-accent" id="btnConfirmar" disabled>Aguarde…</button>`
      }
    `;
    if(!jaConfirmado){
      setTimeout(()=>{
        const btn = document.getElementById('btnConfirmar');
        if(!btn) return;
        btn.disabled = false;
        btn.textContent = 'Estou ciente e confirmo o recebimento';
      }, 1500);
      document.getElementById('btnConfirmar').addEventListener('click', async ()=>{
        const btn = document.getElementById('btnConfirmar');
        btn.disabled = true; btn.textContent = 'Confirmando…';
        try{
          await confirmarLeitura(id);
          reg.confirmadoEm = new Date().toISOString();
        }catch(e){ console.error('Falha ao confirmar', e); }
        render(reg);
      });
    }
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
</body>
</html>
