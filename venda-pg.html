*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

let config = null;
let currentUser = null;
let __gatewaySenha = null;
let registro = null; // o registro do mês/loja atual sendo editado

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='gerente' ? 'Gerente' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function n(v){ return v===null || v===undefined || v==='' ? 0 : Number(v); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML = '';
  if(history.state && history.state.modalAberto) history.back();
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  history.pushState({ modalAberto:true }, '');
}
window.addEventListener('popstate', ()=>{
  const overlay = document.getElementById('modalOverlay');
  if(overlay && overlay.classList.contains('show')) history.pushState({ modalAberto:true }, '');
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const overlay = document.getElementById('modalOverlay');
    if(overlay && overlay.classList.contains('show')){ e.preventDefault(); e.stopPropagation(); }
  }
});

async function configGetUnificada(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar config', e); return null; }
}
async function registroGet(id){
  try{
    const { data, error } = await supabaseClient.from('venda_pg').select('id,payload').eq('id', id).maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar registro', e); return null; }
}
async function registroSalvar(r){
  try{
    const { error } = await supabaseClient.from('venda_pg').upsert({ id: r.id, payload: r });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar', e); showToast('Não foi possível salvar. Tente novamente.'); return false; }
}

/** Categorias fixas da planilha original (mantidas como estavam). */
const CATEGORIAS = [
  { id:'alianca', label:'Aliança' },
  { id:'fabricacao', label:'Fabricação' },
  { id:'servico', label:'Serviço' },
  { id:'represOuro', label:'Repres. Ouro' },
  { id:'represPrata', label:'Repres. Prata' },
  { id:'relogio', label:'Relógio' },
];
/** Tabela de fator padrão da planilha original (7 níveis, um fator por categoria). */
const FATOR_PADRAO = [
  [1,2,3,4,5,6], [2,3,4,5,6,7], [3,4,5,6,7,8], [4,5,6,7,8,9],
  [5,6,7,8,9,10], [6,7,8,9,10,11], [7,8,9,10,11,12],
];

/**
 * Lista de quem vende, direto do cadastro central (Cadastro → Funcionários):
 * Vendedora, Gerente e Diretor(a).
 */
function vendedorasDoCadastro(){
  return (config.funcionarios||[]).filter(f=>{
    const c = (Array.isArray(f.cargos) && f.cargos.length) ? f.cargos : (f.area?[f.area]:[]);
    return c.includes('vendedora') || c.includes('gerente') || c.includes('diretor');
  });
}
/** Nome que aparece nas listas: apelido do cadastro, ou nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Um nome lançado em mês anterior pode ser o nome completo; aqui bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** <option> de vendedora. Mantém um nome antigo que não esteja mais no cadastro, pra não perder lançamento já feito. */
function vendedoraOptionsHtml(selected){
  const lista = vendedorasDoCadastro();
  const vazio = lista.length===0 ? `<option value="" disabled>Nenhum(a) cadastrado(a) em Cadastro → Funcionários</option>` : '';
  const equivalente = selected ? lista.find(f=>funcionarioBateComNome(f, selected)) : null;
  const sel = equivalente ? nomeExibicaoFuncionario(equivalente) : selected;
  const foraDoCadastro = sel && !lista.some(f=>nomeExibicaoFuncionario(f)===sel);
  const extra = foraDoCadastro ? `<option value="${escapeHtml(sel)}" selected>${escapeHtml(sel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${vazio}${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${sel===n?'selected':''}>${escapeHtml(n)}</option>`;
  }).join('');
}

function novoRegistro(id, lojaId, mesAno){
  const lojas = (config.lojas||[]).map(l=>l.abreviacao);
  const vendedorasIniciais = vendedorasDoCadastro().map(f=>({
    id: uid('vpgv'), nome: nomeExibicaoFuncionario(f),
    porLoja: Object.fromEntries(lojas.map(ab=>[ab,{bruto:null,devol:null}])),
    percVend: null, nivel: 1,
    itens: Object.fromEntries(CATEGORIAS.map(c=>[c.id,null])),
  }));
  return {
    id, lojaId, mesAno,
    totalBruto: null, devolucao: null,
    categoriasDeclaradas: Object.fromEntries(CATEGORIAS.map(c=>[c.id,null])),
    conferenciaLojas: { bruto: Object.fromEntries(lojas.map(ab=>[ab,null])), dev: Object.fromEntries(lojas.map(ab=>[ab,null])) },
    vendedoras: vendedorasIniciais,
    fatorTabela: JSON.parse(JSON.stringify(FATOR_PADRAO)),
    conferido: null, // { por, em (timestamp), dataStr } — preenchido só pelo "Conferir" com senha da diretoria
  };
}

/* ============================================================
   CONFERÊNCIA DA DIRETORIA — trava a edição e manda os totais de
   cada vendedora pra ficha dela em Departamento Pessoal
   ============================================================ */
async function dpFuncionariosGet(senha){
  try{
    const { data, error } = await supabaseClient.from('dp_funcionarios').select('id,payload').order('created_at', { ascending:true });
    // observação: supabaseClient já embute __gatewaySenha por padrão; pra usar outra senha
    // (a da diretoria confirmada na hora), essa função é chamada só depois de já termos
    // trocado __gatewaySenha temporariamente — ver confirmarConferencia().
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar funcionários do DP', e); return null; }
}
async function dpRegistroSalvar(reg){
  try{
    const { error } = await supabaseClient.from('dp_registros').upsert({ id: reg.id, payload: reg });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar no DP', e); return false; }
}
/**
 * Confirma a conferência com a senha da diretoria (digitada na hora, não precisa ser
 * quem está logado no momento). Se validar, tranca a edição do mês pra quem não é
 * diretoria, e manda os totais de cada vendedora (por item) pra ficha dela no DP —
 * cria ou atualiza (mesmo id determinístico, então conferir de novo não duplica).
 */
async function confirmarConferencia(senhaDigitada){
  const r = await gatewayCall({ op:'login', senha: senhaDigitada });
  if(!r || !r.ok || r.user.nivel !== 'diretoria'){
    return { ok:false, erro:'Senha incorreta ou sem acesso de diretoria.' };
  }
  const senhaAntiga = __gatewaySenha;
  __gatewaySenha = senhaDigitada; // temporariamente, só pra essas chamadas
  try{
    const funcionariosDp = await dpFuncionariosGet();
    if(funcionariosDp === null){ return { ok:false, erro:'Não foi possível acessar o Departamento Pessoal agora.' }; }
    let enviados = 0, semCorrespondencia = [];
    for(const v of registro.vendedoras){
      const totalItens = totalItensVendedora(v);
      if(totalItens<=0) continue; // nada lançado, não manda registro vazio
      // casa pelo nome completo OU pelo apelido — assim mês antigo (nome completo)
      // e mês novo (apelido) caem no mesmo funcionário
      const func = funcionariosDp.find(f=> funcionarioBateComNome(f, v.nome));
      if(!func){ semCorrespondencia.push(v.nome); continue; }
      const idFuncionarioLigado = func.funcionarioId || func.id;
      const loja = (config.lojas||[]).find(l=>l.id===registro.lojaId);
      const regDp = {
        id: 'vpgsync_' + registro.id + '_' + func.id, // determinístico: reconferir atualiza, não duplica
        tipo: 'vendaspg', funcionarioId: idFuncionarioLigado, data: todayStr(), mesReferencia: registro.mesAno,
        loja: loja?loja.nome:'', alianca:v.itens.alianca, fabricacao:v.itens.fabricacao, servico:v.itens.servico,
        represOuro:v.itens.represOuro, represPrata:v.itens.represPrata, relogio:v.itens.relogio,
        observacoes: 'Enviado automaticamente da conferência do Venda PG.', criadoEm: Date.now(),
      };
      const ok = await dpRegistroSalvar(regDp);
      if(ok) enviados++;
    }
    registro.conferido = { por: currentUser.nome, em: Date.now(), dataStr: todayStr() };
    await registroSalvar(registro);
    return { ok:true, enviados, semCorrespondencia };
  } finally {
    __gatewaySenha = senhaAntiga; // volta a sessão normal, seja lá quem estiver logado
  }
}

/* ============================================================
   FÓRMULAS (mesma lógica da planilha original, conferida contra os números reais)
   ============================================================ */
function totalLiquido(r){ return n(r.totalBruto) - n(r.devolucao); }
function totalItensCategorias(r){ return CATEGORIAS.reduce((acc,c)=> acc + n(r.categoriasDeclaradas[c.id]), 0); }
function totalItensVendedora(v){ return CATEGORIAS.reduce((acc,c)=> acc + n(v.itens[c.id]), 0); }
function tLiquiVendedoraPorLoja(v, ab){ const p = v.porLoja[ab]||{}; return n(p.bruto) - n(p.devol); }
function tBrutoVendedoraTotal(v, lojas){ return lojas.reduce((acc,ab)=> acc + n((v.porLoja[ab]||{}).bruto), 0); }
function tDevolVendedoraTotal(v, lojas){ return lojas.reduce((acc,ab)=> acc + n((v.porLoja[ab]||{}).devol), 0); }
function tLiquiVendedoraTotal(v, lojas){ return tBrutoVendedoraTotal(v,lojas) - tDevolVendedoraTotal(v,lojas); }
function diferencaVendedora(v, lojas){ return totalItensVendedora(v) - tLiquiVendedoraTotal(v,lojas); }
function confOk(diferenca){ return Math.abs(diferenca) < 0.01; }
function totalVendedorasCategoria(r, catId){ return r.vendedoras.reduce((acc,v)=> acc + n(v.itens[catId]), 0); }
function totalVendedorasItens(r){ return CATEGORIAS.reduce((acc,c)=> acc + totalVendedorasCategoria(r,c.id), 0); }
function totalVendedorasTLiquido(r, lojas){ return r.vendedoras.reduce((acc,v)=> acc + tLiquiVendedoraTotal(v,lojas), 0); }
function diferencaVendGerCategoria(r, catId){ return totalVendedorasCategoria(r,catId) - n(r.categoriasDeclaradas[catId]); }
function fatorIndividual(v, fatorTabela){
  const linha = fatorTabela[(v.nivel||1)-1] || fatorTabela[0];
  return CATEGORIAS.reduce((acc,c,i)=> acc + n(v.itens[c.id]) * (linha[i]||0) / 100, 0);
}
function conferenciaLojaCalc(r, campo, ab){ return n(r.conferenciaLojas[campo][ab]); }
function totalConferenciaLoja(r, campo, lojas){ return lojas.reduce((acc,ab)=> acc + conferenciaLojaCalc(r,campo,ab), 0); }

const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');

document.getElementById('btnLogin').addEventListener('click', doLogin);

async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  config = await configGetUnificada();
  if(!config) config = { lojas:[], funcionarios:[] };
  enterApp();
}

let currentTab = 'planilha';

  { id:'geral', label:'Geral (comparativo)' },

function buildTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  TABS.forEach(t=>{

    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });

async function todosRegistrosGet(){
  try{
    const { data, error } = await supabaseClient.from('venda_pg').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar todos os registros', e); return []; }
}
function agregarPorVendedora(registros){
  const map = {};
  registros.forEach(r=> r.vendedoras.forEach(v=>{
    const total = totalItensVendedora(v);
    if(total<=0) return;
    map[v.nome] = (map[v.nome]||0) + total;
  }));
  return map;
}
function agregarPorLoja(registros){
  const map = {};
  registros.forEach(r=>{
    const loja = (config.lojas||[]).find(l=>l.id===r.lojaId);
    const nome = loja ? loja.nome : r.lojaId;
    const total = r.vendedoras.reduce((acc,v)=> acc + totalItensVendedora(v), 0);
    if(total<=0) return;
    map[nome] = (map[nome]||0) + total;
  });
  return map;
}
function agregarPorCategoria(registros){
  const map = {};
  CATEGORIAS.forEach(c=> map[c.label] = 0);
  registros.forEach(r=> r.vendedoras.forEach(v=>{
    CATEGORIAS.forEach(c=>{ map[c.label] += Number(v.itens[c.id])||0; });
  }));
  return map;
}
/** Marca quem está bem abaixo (<70% da média) ou bem acima (>130%) do grupo. */
function detectarDivergencia(mapa){
  const valores = Object.values(mapa);
  if(valores.length===0) return { media:0, itens:[] };
  const media = valores.reduce((a,b)=>a+b,0) / valores.length;
  const itens = Object.entries(mapa).map(([nome,total])=>{
    const percDaMedia = media>0 ? (total/media*100) : 0;
    const status = percDaMedia < 70 ? 'abaixo' : percDaMedia > 130 ? 'acima' : 'normal';
    return { nome, total, percDaMedia, status };
  }).sort((a,b)=> b.total - a.total);
  return { media, itens };
}
/** Gráfico de barra horizontal simples, sem depender de nenhuma biblioteca externa. */
function barrasHtml(itens, corFn){
  if(itens.length===0) return `<p class="muted">Sem dados nesse período ainda.</p>`;
  const max = Math.max(...itens.map(i=>i.total), 1);
  return itens.map(i=>{
    const pct = Math.max((i.total/max*100), 2);
    const cor = corFn ? corFn(i) : 'var(--gold)';
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;">
          <span><b>${escapeHtml(i.nome)}</b>${i.status && i.status!=='normal' ? ` <span class="badge ${i.status==='abaixo'?'badge-erro':'badge-ok'}">${i.status==='abaixo'?'abaixo da média':'acima da média'}</span>` : ''}</span>
          <span>${fmtMoeda(i.total)}</span>
        </div>
        <div style="background:var(--surface-2); border-radius:6px; height:14px; overflow:hidden;">
          <div style="width:${pct}%; height:100%; background:${cor}; border-radius:6px;"></div>
        </div>
      </div>
    `;
  }).join('');
}
async function renderGeral(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="page-head"><h1 class="page-title">Geral — comparativo</h1><p class="page-sub">Carregando...</p></div>`;
  const todos = await todosRegistrosGet();
  const mesesDisponiveis = [...new Set(todos.map(r=>r.mesAno))].sort().reverse();
  let mesFiltro = mesesDisponiveis[0] || mesAtual();

  function desenhar(){
    const filtrados = mesFiltro==='__todos__' ? todos : todos.filter(r=>r.mesAno===mesFiltro);
    const porVendedora = detectarDivergencia(agregarPorVendedora(filtrados));
    const porLoja = detectarDivergencia(agregarPorLoja(filtrados));
    const porCategoria = Object.entries(agregarPorCategoria(filtrados)).map(([nome,total])=>({nome,total})).sort((a,b)=>b.total-a.total);

    main.innerHTML = `
      <div class="page-head">
        <h1 class="page-title">Geral — comparativo</h1>
        <p class="page-sub">Compara vendedoras, lojas e categorias — pra ver quem está bem próxima do grupo e quem está destoando.</p>
      </div>
      <div class="card" style="max-width:320px;">
        <div class="field" style="margin-bottom:0;"><label>Período</label>
          <select id="ger_mes">
            ${mesesDisponiveis.map(m=>`<option value="${m}" ${mesFiltro===m?'selected':''}>${m}</option>`).join('')}
            <option value="__todos__" ${mesFiltro==='__todos__'?'selected':''}>Todos os meses</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Vendedoras ${porVendedora.itens.length>0?`<span class="muted" style="text-transform:none; font-weight:400;">— média ${fmtMoeda(porVendedora.media)}</span>`:''}</div>
        ${barrasHtml(porVendedora.itens, i=> i.status==='abaixo' ? 'var(--danger)' : i.status==='acima' ? 'var(--ok)' : 'var(--gold)')}
        ${porVendedora.itens.some(i=>i.status==='abaixo') ? `<p class="muted" style="margin-top:8px;">⚠️ Quem está "abaixo da média" vendeu menos de 70% do que a média do grupo nesse período — pode valer a pena conversar/entender o motivo.</p>` : ''}
      </div>

      <div class="card">
        <div class="section-label">Lojas ${porLoja.itens.length>0?`<span class="muted" style="text-transform:none; font-weight:400;">— média ${fmtMoeda(porLoja.media)}</span>`:''}</div>
        ${barrasHtml(porLoja.itens, i=> i.status==='abaixo' ? 'var(--danger)' : i.status==='acima' ? 'var(--ok)' : 'var(--gold)')}
      </div>

      <div class="card">
        <div class="section-label">Categorias de produto</div>
        ${barrasHtml(porCategoria)}
      </div>
    `;
    document.getElementById('ger_mes').addEventListener('change', (e)=>{ mesFiltro = e.target.value; desenhar(); });
  }
  desenhar();
}

    });
    let totalLiq = 0;

    document.getElementById('pg_confLiqTotal').textContent = fmtMoeda(totalLiq);
    document.getElementById('pg_confLiqDecl').textContent = fmtMoeda(declLiq);
    document.getElementById('pg_confLiqDif').textContent = fmtMoeda(difLiq);
    document.getElementById('pg_confLiqConf').innerHTML = confOk(difLiq) ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-erro">ERRO</span>';
  }
  document.querySelectorAll('.pg_confLoja').forEach(el=>{
    el.addEventListener('input', ()=>{
      registro.conferenciaLojas[el.dataset.camp][el.dataset.ab] = el.value===''?null:parseFloat(el.value);
      recalcularConferenciaLojas();
    });
  });

  // ---- Blocos de vendedora (venda por loja) ----
  function drawVendedorasBlocos(){
    const wrap = document.getElementById('pg_vendedorasBlocos');
    wrap.innerHTML = registro.vendedoras.map((v,vi)=>`
      <div style="border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; flex-wrap:wrap;">
          <select data-vnome="${vi}" style="font-weight:800; max-width:220px;" ${podeDiretoria?'':'disabled'}>${vendedoraOptionsHtml(v.nome)}</select>
          <div style="display:flex; align-items:center; gap:8px;">
            <label class="muted" style="text-transform:none;">% Vend</label><input type="number" step="0.1" data-vperc="${vi}" value="${v.percVend??''}" style="width:80px;" ${podeDiretoria?'':'disabled'}>
            <label class="muted" style="text-transform:none;">Nível</label><select data-vnivel="${vi}" style="width:70px;" ${podeDiretoria?'':'disabled'}>${FATOR_PADRAO.map((_,i)=>`<option value="${i+1}" ${v.nivel===i+1?'selected':''}>${i+1}</option>`).join('')}</select>
            <button type="button" class="icon-btn" data-vdel="${vi}" title="Remover linha" style="color:var(--danger);">✕</button>
          </div>
        </div>
        <table>
          <thead><tr><th></th>${lojas.map(ab=>`<th>${ab}</th>`).join('')}<th>Total</th></tr></thead>
          <tbody>
            <tr><td class="rotulo">T. Bruto</td>${lojas.map(ab=>`<td><input type="number" step="0.01" class="vend-input" data-vb="${vi}" data-ab="${ab}" value="${(v.porLoja[ab]||{}).bruto??''}"></td>`).join('')}<td><span class="calc" id="pg_vb_total_${vi}"></span></td></tr>
            <tr><td class="rotulo">Devol.</td>${lojas.map(ab=>`<td><input type="number" step="0.01" class="vend-input" data-vd="${vi}" data-ab="${ab}" value="${(v.porLoja[ab]||{}).devol??''}"></td>`).join('')}<td><span class="calc" id="pg_vd_total_${vi}"></span></td></tr>
            <tr><td class="rotulo">T. Líquido</td>${lojas.map(ab=>`<td><span class="calc" id="pg_vl_${vi}_${ab}"></span></td>`).join('')}<td><span class="calc" id="pg_vl_total_${vi}"></span></td></tr>
          </tbody>
        </table>
      </div>
    `).join('');

    wrap.querySelectorAll('[data-vnome]').forEach(el=> el.addEventListener('change', ()=>{ registro.vendedoras[Number(el.dataset.vnome)].nome = el.value; drawItensRows(); recalcularItens(); }));
    wrap.querySelectorAll('[data-vperc]').forEach(el=> el.addEventListener('input', ()=>{ registro.vendedoras[Number(el.dataset.vperc)].percVend = el.value===''?null:parseFloat(el.value); }));
    wrap.querySelectorAll('[data-vnivel]').forEach(el=> el.addEventListener('change', ()=>{ registro.vendedoras[Number(el.dataset.vnivel)].nivel = Number(el.value); recalcularFatorIndividual(); }));
    wrap.querySelectorAll('[data-vdel]').forEach(el=> el.addEventListener('click', ()=>{
      registro.vendedoras.splice(Number(el.dataset.vdel),1);
      drawVendedorasBlocos(); recalcularItens();
    }));
    wrap.querySelectorAll('[data-vb]').forEach(el=> el.addEventListener('input', ()=>{
      const vi = Number(el.dataset.vb), ab = el.dataset.ab;
      if(!registro.vendedoras[vi].porLoja[ab]) registro.vendedoras[vi].porLoja[ab] = {bruto:null,devol:null};
      registro.vendedoras[vi].porLoja[ab].bruto = el.value===''?null:parseFloat(el.value);
      recalcularBlocoVendedora(vi); recalcularItens(); recalcularConferenciaLojas();
    }));
    wrap.querySelectorAll('[data-vd]').forEach(el=> el.addEventListener('input', ()=>{
      const vi = Number(el.dataset.vd), ab = el.dataset.ab;
      if(!registro.vendedoras[vi].porLoja[ab]) registro.vendedoras[vi].porLoja[ab] = {bruto:null,devol:null};
      registro.vendedoras[vi].porLoja[ab].devol = el.value===''?null:parseFloat(el.value);
      recalcularBlocoVendedora(vi); recalcularItens(); recalcularConferenciaLojas();
    }));

    registro.vendedoras.forEach((v,vi)=> recalcularBlocoVendedora(vi));
  }
  function recalcularBlocoVendedora(vi){
    const v = registro.vendedoras[vi];
    lojas.forEach(ab=>{
      const el = document.getElementById(`pg_vl_${vi}_${ab}`);
      if(el) el.textContent = fmtMoeda(tLiquiVendedoraPorLoja(v, ab));
    });
    const elBT = document.getElementById('pg_vb_total_'+vi); if(elBT) elBT.textContent = fmtMoeda(tBrutoVendedoraTotal(v, lojas));
    const elDT = document.getElementById('pg_vd_total_'+vi); if(elDT) elDT.textContent = fmtMoeda(tDevolVendedoraTotal(v, lojas));
    const elLT = document.getElementById('pg_vl_total_'+vi); if(elLT) elLT.textContent = fmtMoeda(tLiquiVendedoraTotal(v, lojas));
  }
  document.getElementById('btnAddVendedora').addEventListener('click', ()=>{
    registro.vendedoras.push({ id: uid('vpgv'), nome:'', porLoja: Object.fromEntries(lojas.map(ab=>[ab,{bruto:null,devol:null}])), percVend:null, nivel:1, itens: Object.fromEntries(CATEGORIAS.map(c=>[c.id,null])) });
    drawVendedorasBlocos(); recalcularItens();
  });

  // ---- Itens vendidos por vendedora ----
  function drawItensRows(){
    const tbody = document.getElementById('pg_itensRows');
    tbody.innerHTML = registro.vendedoras.map((v,vi)=>`
      <tr>
        <td class="rotulo">${escapeHtml(v.nome)}</td>
        ${CATEGORIAS.map(c=>`<td><input type="number" step="0.01" class="vend-input" data-ic="${c.id}" data-iv="${vi}" value="${v.itens[c.id]??''}"></td>`).join('')}
        <td><span class="calc" id="pg_ti_${vi}"></span></td>
        <td><span class="calc" id="pg_tl_${vi}"></span></td>
        <td><span id="pg_dif_${vi}"></span></td>
        <td><span id="pg_conf_${vi}"></span></td>
      </tr>
    `).join('');
    tbody.querySelectorAll('[data-ic]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const vi = Number(el.dataset.iv);
        registro.vendedoras[vi].itens[el.dataset.ic] = el.value===''?null:parseFloat(el.value);
        recalcularItens();
      });
    });
  }
  function recalcularItens(){
    registro.vendedoras.forEach((v,vi)=>{
      const ti = totalItensVendedora(v);
      const tl = tLiquiVendedoraTotal(v, lojas);
      const dif = ti - tl;
      const elTi = document.getElementById('pg_ti_'+vi); if(elTi) elTi.textContent = fmtMoeda(ti);
      const elTl = document.getElementById('pg_tl_'+vi); if(elTl) elTl.textContent = fmtMoeda(tl);
      const elDif = document.getElementById('pg_dif_'+vi); if(elDif) elDif.textContent = fmtMoeda(dif);
      const elConf = document.getElementById('pg_conf_'+vi);
      if(elConf) elConf.innerHTML = confOk(dif) ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-erro">ERRO</span>';
    });
    // rodapé: total vendedoras / gerente declarado / diferença / conferência
    const foot = document.getElementById('pg_itensFoot');
    const totVendCats = CATEGORIAS.map(c=> totalVendedorasCategoria(registro, c.id));
    const totVendItens = totalVendedorasItens(registro);
    const totVendTL = totalVendedorasTLiquido(registro, lojas);
    const totVendDif = totVendItens - totVendTL;
    const gerCats = CATEGORIAS.map(c=> n(registro.categoriasDeclaradas[c.id]));
    const gerItens = totalItensCategorias(registro);
    const gerTL = totalLiquido(registro);
    const gerDif = gerItens - gerTL;
    const difVendGer = CATEGORIAS.map((c,i)=> totVendCats[i] - gerCats[i]);
    foot.innerHTML = `
      <tr style="font-weight:800; background:var(--surface-2);">
        <td class="rotulo">TOTAL VENDEDORAS</td>
        ${totVendCats.map(v=>`<td>${fmtMoeda(v)}</td>`).join('')}
        <td>${fmtMoeda(totVendItens)}</td><td>${fmtMoeda(totVendTL)}</td><td>${fmtMoeda(totVendDif)}</td>
        <td>${confOk(totVendDif)?'<span class="badge badge-ok">OK</span>':'<span class="badge badge-erro">ERRO</span>'}</td>
      </tr>
      <tr style="font-weight:700;">
        <td class="rotulo">GERENTE (declarado)</td>
        ${gerCats.map(v=>`<td>${fmtMoeda(v)}</td>`).join('')}
        <td>${fmtMoeda(gerItens)}</td><td>${fmtMoeda(gerTL)}</td><td>${fmtMoeda(gerDif)}</td>
        <td>${confOk(gerDif)?'<span class="badge badge-ok">OK</span>':'<span class="badge badge-erro">ERRO</span>'}</td>
      </tr>
      <tr>
        <td class="rotulo">DIFERENÇA (Vend−Ger)</td>
        ${difVendGer.map(v=>`<td>${fmtMoeda(v)}</td>`).join('')}
        <td>${fmtMoeda(totVendItens-gerItens)}</td><td>${fmtMoeda(totVendTL-gerTL)}</td><td></td><td></td>
      </tr>
      <tr>
        <td class="rotulo">CONFERÊNCIA</td>
        ${difVendGer.map(v=> `<td>${confOk(v)?'<span class="badge badge-ok">OK</span>':'<span class="badge badge-erro">ERRO</span>'}</td>`).join('')}
        <td colspan="4"></td>
      </tr>
    `;
    recalcularFatorIndividual();
  }

  // ---- Fator ----
  function drawFatorRows(){
    const tbody = document.getElementById('pg_fatorRows');
    tbody.innerHTML = registro.fatorTabela.map((linha,li)=>{
      const media = linha.reduce((a,b)=>a+n(b),0) / linha.length;
      return `<tr><td class="rotulo">${li+1}</td>${linha.map((val,ci)=>`<td><input type="number" step="0.1" data-fl="${li}" data-fc="${ci}" value="${val}" ${podeDiretoria?'':'disabled'}></td>`).join('')}<td><span class="calc">${media.toFixed(1)}</span></td></tr>`;
    }).join('');
    tbody.querySelectorAll('[data-fl]').forEach(el=>{
      el.addEventListener('input', ()=>{
        registro.fatorTabela[Number(el.dataset.fl)][Number(el.dataset.fc)] = parseFloat(el.value)||0;
        drawFatorRows(); recalcularFatorIndividual();
      });
    });
  }
  function recalcularFatorIndividual(){
    const tbody = document.getElementById('pg_fatorIndivRows');
    if(!tbody) return;
    tbody.innerHTML = registro.vendedoras.map(v=>{
      const linha = registro.fatorTabela[(v.nivel||1)-1] || registro.fatorTabela[0];
      const valores = CATEGORIAS.map((c,i)=> n(v.itens[c.id]) * (linha[i]||0) / 100);
      const total = valores.reduce((a,b)=>a+b,0);
      return `<tr><td class="rotulo">${escapeHtml(v.nome)}</td>${valores.map(val=>`<td>${val.toFixed(2)}</td>`).join('')}<td><b>${total.toFixed(2)}</b></td></tr>`;
    }).join('');
  }

  drawVendedorasBlocos();
  drawItensRows();
  drawFatorRows();
  recalcularDeclarado();
  recalcularConferenciaLojas();
  recalcularItens();

  // Trava geral: se já foi conferido e quem está logado não é diretoria, ninguém edita mais nada.
  if(registro.conferido && !podeDiretoria){
    document.querySelectorAll('#mainContent input, #mainContent select, #mainContent textarea').forEach(el=> el.disabled = true);
    const btnSalvar = document.getElementById('btnSalvarPlanilha');
    if(btnSalvar){ btnSalvar.disabled = true; btnSalvar.textContent = '🔒 Mês travado (conferido)'; }
    const btnAdd = document.getElementById('btnAddVendedora');
    if(btnAdd) btnAdd.disabled = true;
  }

  const btnAbrirConf = document.getElementById('btnAbrirConferencia');
  if(btnAbrirConf){
    btnAbrirConf.addEventListener('click', ()=>{
      openModal(`
        <h3>Conferir este mês</h3>
        <p class="muted">Confirme com a senha da diretoria. Os totais de cada vendedora (por item) vão pra ficha dela em Departamento Pessoal, e o mês trava pra edição de quem não é diretoria.</p>
        <div class="field"><label>Senha da diretoria</label><input type="password" id="conf_senha" autocomplete="off"></div>
        <div id="conf_erro" class="muted" style="color:var(--danger); display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-accent" id="btnConfirmarConferencia">Confirmar</button>
          <button class="btn btn-ghost" id="btnCancelarConferencia">Cancelar</button>
        </div>
      `);
      document.getElementById('btnCancelarConferencia').addEventListener('click', closeModal);
      document.getElementById('btnConfirmarConferencia').addEventListener('click', async ()=>{
        const senha = document.getElementById('conf_senha').value.trim();
        const erroEl = document.getElementById('conf_erro');
        erroEl.style.display = 'none';
        if(!senha) return;
        const btn = document.getElementById('btnConfirmarConferencia');
        btn.disabled = true; btn.textContent = 'Confirmando...';
        const resultado = await confirmarConferencia(senha);
        btn.disabled = false; btn.textContent = 'Confirmar';
        if(!resultado.ok){
          erroEl.textContent = resultado.erro;
          erroEl.style.display = 'block';
          return;
        }
        closeModal();
        let msg = `Conferido! ${resultado.enviados} vendedora(s) sincronizada(s) com o Departamento Pessoal.`;
        if(resultado.semCorrespondencia.length>0) msg += ` Sem cadastro no DP (não sincronizadas): ${resultado.semCorrespondencia.join(', ')}.`;
        showToast(msg);
        renderPlanilha();
      });
    });
  }
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'vendapg' }, '*');
  }
})();
</script>
</body>
</html>
