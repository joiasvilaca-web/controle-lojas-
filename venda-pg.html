<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venda PG · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;}
.brand-name{font-weight:700; font-size:15px;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
.icon-btn:hover{background:rgba(255,255,255,0.1);}
#mainContent{max-width:1200px; margin:0 auto; padding:22px 18px 60px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}
.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); overflow-x:auto; box-shadow:0 2px 10px -4px rgba(43,15,31,0.08);}
.section-label{font-size:12.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:12.5px;}
.field label{display:block; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px;}
input[type=text], input[type=number], input[type=password], input[type=date], input[type=month], select{padding:8px 9px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2); color:var(--ink); font-size:13.5px; width:100%;}
input:disabled{background:#F0EAE2; color:var(--ink-faint); cursor:not-allowed;}
.btn{border:none; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:6px 12px; font-size:12px;}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px;}
th{text-align:center; font-size:10.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); padding:6px 7px; border-bottom:2px solid var(--line); white-space:nowrap;}
td{padding:5px 6px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle;}
td.rotulo{text-align:left; font-weight:700; white-space:nowrap;}
td input[type=number]{text-align:right; padding:5px 6px; font-size:12.5px;}
.calc{background:var(--surface-2); border-radius:6px; padding:5px 6px; font-weight:700; display:inline-block; min-width:64px;}
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:800;}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-erro{background:var(--danger-soft); color:var(--danger);}
.vend-input{background:#FFF9EE !important; border-color:var(--gold-soft) !important;}
.legenda{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:10px;}
.legenda .amostra{width:16px; height:16px; border-radius:4px; background:#FFF9EE; border:1px solid var(--gold-soft); display:inline-block;}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Venda PG</div>
    <div class="login-title">Acessar Venda PG</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira com a diretoria.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint">Use a mesma senha do restante do sistema.</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">PG</div>
      <div class="brand-name">Venda PG</div>
    </div>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair">🚪</button>
    </div>
  </header>
  <main id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

let config = null;
let currentUser = null;
let __gatewaySenha = null;
let registro = null; // o registro do mês/loja atual sendo editado

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function n(v){ return v===null || v===undefined || v==='' ? 0 : Number(v); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function configGetUnificada(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar config', e); return null; }
}
async function registroGet(id){
  try{
    const { data, error } = await supabaseClient.from('venda_pg').select('id,payload').eq('id', id).maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar registro', e); return null; }
}
async function registroSalvar(r){
  try{
    const { error } = await supabaseClient.from('venda_pg').upsert({ id: r.id, payload: r });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar', e); showToast('Não foi possível salvar. Tente novamente.'); return false; }
}

/** Categorias fixas da planilha original (mantidas como estavam). */
const CATEGORIAS = [
  { id:'alianca', label:'Aliança' },
  { id:'fabricacao', label:'Fabricação' },
  { id:'servico', label:'Serviço' },
  { id:'represOuro', label:'Repres. Ouro' },
  { id:'represPrata', label:'Repres. Prata' },
  { id:'relogio', label:'Relógio' },
];
/** Tabela de fator padrão da planilha original (7 níveis, um fator por categoria). */
const FATOR_PADRAO = [
  [1,2,3,4,5,6], [2,3,4,5,6,7], [3,4,5,6,7,8], [4,5,6,7,8,9],
  [5,6,7,8,9,10], [6,7,8,9,10,11], [7,8,9,10,11,12],
];

function novoRegistro(id, lojaId, mesAno){
  const lojas = (config.lojas||[]).map(l=>l.abreviacao);
  const vendedorasIniciais = (config.funcionarios||[]).filter(f=>(f.cargos||[]).includes('vendedora')).map(f=>({
    id: uid('vpgv'), nome: f.nome,
    porLoja: Object.fromEntries(lojas.map(ab=>[ab,{bruto:null,devol:null}])),
    percVend: null, nivel: 1,
    itens: Object.fromEntries(CATEGORIAS.map(c=>[c.id,null])),
  }));
  return {
    id, lojaId, mesAno,
    totalBruto: null, devolucao: null,
    categoriasDeclaradas: Object.fromEntries(CATEGORIAS.map(c=>[c.id,null])),
    conferenciaLojas: { bruto: Object.fromEntries(lojas.map(ab=>[ab,null])), dev: Object.fromEntries(lojas.map(ab=>[ab,null])) },
    vendedoras: vendedorasIniciais,
    fatorTabela: JSON.parse(JSON.stringify(FATOR_PADRAO)),
  };
}

/* ============================================================
   FÓRMULAS (mesma lógica da planilha original, conferida contra os números reais)
   ============================================================ */
function totalLiquido(r){ return n(r.totalBruto) - n(r.devolucao); }
function totalItensCategorias(r){ return CATEGORIAS.reduce((acc,c)=> acc + n(r.categoriasDeclaradas[c.id]), 0); }
function totalItensVendedora(v){ return CATEGORIAS.reduce((acc,c)=> acc + n(v.itens[c.id]), 0); }
function tLiquiVendedoraPorLoja(v, ab){ const p = v.porLoja[ab]||{}; return n(p.bruto) - n(p.devol); }
function tBrutoVendedoraTotal(v, lojas){ return lojas.reduce((acc,ab)=> acc + n((v.porLoja[ab]||{}).bruto), 0); }
function tDevolVendedoraTotal(v, lojas){ return lojas.reduce((acc,ab)=> acc + n((v.porLoja[ab]||{}).devol), 0); }
function tLiquiVendedoraTotal(v, lojas){ return tBrutoVendedoraTotal(v,lojas) - tDevolVendedoraTotal(v,lojas); }
function diferencaVendedora(v, lojas){ return totalItensVendedora(v) - tLiquiVendedoraTotal(v,lojas); }
function confOk(diferenca){ return Math.abs(diferenca) < 0.01; }
function totalVendedorasCategoria(r, catId){ return r.vendedoras.reduce((acc,v)=> acc + n(v.itens[catId]), 0); }
function totalVendedorasItens(r){ return CATEGORIAS.reduce((acc,c)=> acc + totalVendedorasCategoria(r,c.id), 0); }
function totalVendedorasTLiquido(r, lojas){ return r.vendedoras.reduce((acc,v)=> acc + tLiquiVendedoraTotal(v,lojas), 0); }
function diferencaVendGerCategoria(r, catId){ return totalVendedorasCategoria(r,catId) - n(r.categoriasDeclaradas[catId]); }
function fatorIndividual(v, fatorTabela){
  const linha = fatorTabela[(v.nivel||1)-1] || fatorTabela[0];
  return CATEGORIAS.reduce((acc,c,i)=> acc + n(v.itens[c.id]) * (linha[i]||0) / 100, 0);
}
function conferenciaLojaCalc(r, campo, ab){ return n(r.conferenciaLojas[campo][ab]); }
function totalConferenciaLoja(r, campo, lojas){ return lojas.reduce((acc,ab)=> acc + conferenciaLojaCalc(r,campo,ab), 0); }

/* ============================================================
   LOGIN
   ============================================================ */
const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      config = await configGetUnificada();
      if(!config) config = { lojas:[], funcionarios:[] };
      enterApp();
      parent.postMessage({ type:'tabs', modulo:'vendapg', tabs: [], active: null }, '*');
    }
  });
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  config = await configGetUnificada();
  if(!config) config = { lojas:[], funcionarios:[] };
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null; __gatewaySenha = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  renderSeletor();
}

/* ============================================================
   SELETOR DE LOJA / MÊS
   ============================================================ */
function mesAtual(){ const d=new Date(); return d.toISOString().slice(0,7); }
function renderSeletor(){
  const main = document.getElementById('mainContent');
  const lojas = config.lojas||[];
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">Venda PG</h1>
      <p class="page-sub">Conferência de vendas por vendedora, igual à planilha — só que todo mundo preenche direto aqui.</p>
    </div>
    <div class="card" style="max-width:420px;">
      <div class="field" style="margin-bottom:10px;"><label>Loja</label>
        <select id="selLoja">${lojas.map(l=>`<option value="${l.id}">${escapeHtml(l.nome)}</option>`).join('')}</select>
      </div>
      <div class="field" style="margin-bottom:14px;"><label>Mês</label><input type="month" id="selMes" value="${mesAtual()}"></div>
      <button class="btn btn-accent btn-block" id="btnAbrirPlanilha">Abrir planilha</button>
    </div>
  `;
  document.getElementById('btnAbrirPlanilha').addEventListener('click', async ()=>{
    const lojaId = document.getElementById('selLoja').value;
    const mesAno = document.getElementById('selMes').value;
    if(!lojaId || !mesAno){ showToast('Escolha a loja e o mês.'); return; }
    const id = 'vpg_' + lojaId + '_' + mesAno;
    const existente = await registroGet(id);
    registro = existente || novoRegistro(id, lojaId, mesAno);
    renderPlanilha();
  });
}

/* ============================================================
   PLANILHA
   ============================================================ */
async function salvarRegistro(mostrarToast){
  const ok = await registroSalvar(registro);
  if(ok && mostrarToast) showToast('Salvo.');
  return ok;
}
function renderPlanilha(){
  const main = document.getElementById('mainContent');
  const lojas = (config.lojas||[]).map(l=>l.abreviacao);
  const loja = (config.lojas||[]).find(l=>l.id===registro.lojaId);
  const podeDiretoria = currentUser.nivel === 'diretoria';

  main.innerHTML = `
    <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 class="page-title" id="pg_tituloMes">${escapeHtml(loja?loja.nome:'')} — ${escapeHtml(registro.mesAno)} <button type="button" class="icon-btn" id="btnEditarMes" title="Trocar o mês" style="font-size:15px; vertical-align:2px;">✎</button></h1>
        <p class="page-sub">Campos com fundo amarelo claro são preenchidos pelas vendedoras. O resto é da diretoria.</p>
        <div id="pg_editorMesWrap" style="display:none; margin-top:8px; align-items:center; gap:8px;">
          <input type="month" id="pg_novoMes" value="${registro.mesAno}" style="width:auto;">
          <button class="btn btn-accent btn-sm" id="btnConfirmarMes">Trocar</button>
          <button class="btn btn-ghost btn-sm" id="btnCancelarMes">Cancelar</button>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnVoltarSeletor">← Trocar loja/mês</button>
    </div>
    <div class="legenda"><span class="amostra"></span> Campo preenchido pela vendedora</div>

    <div class="card">
      <div class="section-label">Totais e categorias declaradas ${podeDiretoria?'':'(só a diretoria edita)'}</div>
      <table style="min-width:auto;">
        <tr><td class="rotulo">Total Bruto</td><td><input type="number" step="0.01" id="pg_totalBruto" value="${registro.totalBruto??''}" ${podeDiretoria?'':'disabled'}></td>
            <td class="rotulo">Devolução</td><td><input type="number" step="0.01" id="pg_devolucao" value="${registro.devolucao??''}" ${podeDiretoria?'':'disabled'}></td>
            <td class="rotulo">Total Líquido</td><td><span class="calc" id="pg_totalLiquido"></span></td></tr>
      </table>
      <table style="margin-top:10px;">
        <thead><tr><th></th>${CATEGORIAS.map(c=>`<th>${c.label}</th>`).join('')}<th>Total Itens</th></tr></thead>
        <tbody><tr><td class="rotulo">Declarado</td>${CATEGORIAS.map(c=>`<td><input type="number" step="0.01" data-cat="${c.id}" class="pg_catDecl" value="${registro.categoriasDeclaradas[c.id]??''}" ${podeDiretoria?'':'disabled'}></td>`).join('')}<td><span class="calc" id="pg_totalItensDecl"></span></td></tr></tbody>
      </table>
      <p class="muted" id="pg_confDeclarado" style="margin-top:8px;"></p>
    </div>

    <div class="card">
      <div class="section-label">Conferência por loja ${podeDiretoria?'':'(só a diretoria edita)'}</div>
      <table>
        <thead><tr><th></th>${lojas.map(ab=>`<th>${ab}</th>`).join('')}<th>Total</th><th>Declarado</th><th>Dif.</th><th>Conf.</th></tr></thead>
        <tbody>
          <tr><td class="rotulo">Bruto</td>${lojas.map(ab=>`<td><input type="number" step="0.01" data-camp="bruto" data-ab="${ab}" class="pg_confLoja" value="${registro.conferenciaLojas.bruto[ab]??''}" ${podeDiretoria?'':'disabled'}></td>`).join('')}<td><span class="calc" id="pg_confBrutoTotal"></span></td><td><span class="calc" id="pg_confBrutoDecl"></span></td><td><span id="pg_confBrutoDif"></span></td><td><span id="pg_confBrutoConf"></span></td></tr>
          <tr><td class="rotulo">Dev.</td>${lojas.map(ab=>`<td><input type="number" step="0.01" data-camp="dev" data-ab="${ab}" class="pg_confLoja" value="${registro.conferenciaLojas.dev[ab]??''}" ${podeDiretoria?'':'disabled'}></td>`).join('')}<td><span class="calc" id="pg_confDevTotal"></span></td><td><span class="calc" id="pg_confDevDecl"></span></td><td><span id="pg_confDevDif"></span></td><td><span id="pg_confDevConf"></span></td></tr>
          <tr><td class="rotulo">Líquido</td>${lojas.map(ab=>`<td><span class="calc" id="pg_confLiq_${ab}"></span></td>`).join('')}<td><span class="calc" id="pg_confLiqTotal"></span></td><td><span class="calc" id="pg_confLiqDecl"></span></td><td><span id="pg_confLiqDif"></span></td><td><span id="pg_confLiqConf"></span></td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-label">Vendedoras — vendas por loja</div>
      <div id="pg_vendedorasBlocos"></div>
      <button class="btn btn-ghost btn-sm" id="btnAddVendedora">+ Adicionar linha</button>
    </div>

    <div class="card">
      <div class="section-label">Itens vendidos por vendedora</div>
      <table>
        <thead><tr><th>Vendedora</th>${CATEGORIAS.map(c=>`<th>${c.label}</th>`).join('')}<th>Total Itens</th><th>T. Líquido</th><th>Diferença</th><th>Conf.</th></tr></thead>
        <tbody id="pg_itensRows"></tbody>
        <tfoot id="pg_itensFoot"></tfoot>
      </table>
    </div>

    <div class="card">
      <div class="section-label">Fator ${podeDiretoria?'':'(só a diretoria edita)'}</div>
      <table>
        <thead><tr><th>Nível</th>${CATEGORIAS.map(c=>`<th>${c.label}</th>`).join('')}<th>Média</th></tr></thead>
        <tbody id="pg_fatorRows"></tbody>
      </table>
      <div class="section-label" style="margin-top:16px;">Fator individual (calculado)</div>
      <table>
        <thead><tr><th>Vendedora</th>${CATEGORIAS.map(c=>`<th>${c.label}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody id="pg_fatorIndivRows"></tbody>
      </table>
    </div>

    <button class="btn btn-accent" id="btnSalvarPlanilha" style="margin-bottom:30px;">💾 Salvar</button>
  `;

  document.getElementById('btnVoltarSeletor').addEventListener('click', renderSeletor);

  document.getElementById('btnEditarMes').addEventListener('click', ()=>{
    const wrap = document.getElementById('pg_editorMesWrap');
    wrap.style.display = wrap.style.display === 'none' ? 'flex' : 'none';
  });
  document.getElementById('btnCancelarMes').addEventListener('click', ()=>{
    document.getElementById('pg_editorMesWrap').style.display = 'none';
  });
  document.getElementById('btnConfirmarMes').addEventListener('click', async ()=>{
    const novoMes = document.getElementById('pg_novoMes').value;
    if(!novoMes){ showToast('Escolha um mês.'); return; }
    if(novoMes === registro.mesAno){ document.getElementById('pg_editorMesWrap').style.display = 'none'; return; }
    // Antes de trocar, salva o que já está preenchido no mês atual, pra não perder nada.
    await salvarRegistro(false);
    const novoId = 'vpg_' + registro.lojaId + '_' + novoMes;
    const existente = await registroGet(novoId);
    registro = existente || novoRegistro(novoId, registro.lojaId, novoMes);
    renderPlanilha();
    showToast('Mês trocado para ' + novoMes + '.');
  });
  document.getElementById('btnSalvarPlanilha').addEventListener('click', ()=> salvarRegistro(true));

  // ---- Totais/categorias declaradas ----
  function recalcularDeclarado(){
    document.getElementById('pg_totalLiquido').textContent = fmtMoeda(totalLiquido(registro));
    const totalItens = totalItensCategorias(registro);
    document.getElementById('pg_totalItensDecl').textContent = fmtMoeda(totalItens);
    const dif = totalItens - totalLiquido(registro);
    document.getElementById('pg_confDeclarado').innerHTML = confOk(dif)
      ? '<span class="badge badge-ok">OK — Total Itens bate com Total Líquido</span>'
      : `<span class="badge badge-erro">ERRO — diferença de ${fmtMoeda(dif)}</span>`;
  }
  document.getElementById('pg_totalBruto').addEventListener('input', e=>{ registro.totalBruto = e.target.value===''?null:parseFloat(e.target.value); recalcularDeclarado(); recalcularConferenciaLojas(); });
  document.getElementById('pg_devolucao').addEventListener('input', e=>{ registro.devolucao = e.target.value===''?null:parseFloat(e.target.value); recalcularDeclarado(); recalcularConferenciaLojas(); });
  document.querySelectorAll('.pg_catDecl').forEach(el=>{
    el.addEventListener('input', ()=>{
      registro.categoriasDeclaradas[el.dataset.cat] = el.value===''?null:parseFloat(el.value);
      recalcularDeclarado(); recalcularItens();
    });
  });

  // ---- Conferência por loja ----
  function recalcularConferenciaLojas(){
    ['bruto','dev'].forEach(campo=>{
      const total = totalConferenciaLoja(registro, campo, lojas);
      const decl = campo==='bruto' ? n(registro.totalBruto) : n(registro.devolucao);
      const dif = total - decl;
      document.getElementById(campo==='bruto'?'pg_confBrutoTotal':'pg_confDevTotal').textContent = fmtMoeda(total);
      document.getElementById(campo==='bruto'?'pg_confBrutoDecl':'pg_confDevDecl').textContent = fmtMoeda(decl);
      document.getElementById(campo==='bruto'?'pg_confBrutoDif':'pg_confDevDif').textContent = fmtMoeda(dif);
      document.getElementById(campo==='bruto'?'pg_confBrutoConf':'pg_confDevConf').innerHTML = confOk(dif) ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-erro">ERRO</span>';
    });
    let totalLiq = 0;
    lojas.forEach(ab=>{
      const liq = conferenciaLojaCalc(registro,'bruto',ab) - conferenciaLojaCalc(registro,'dev',ab);
      totalLiq += liq;
      const elLiq = document.getElementById('pg_confLiq_'+ab);
      if(elLiq) elLiq.textContent = fmtMoeda(liq);
    });
    const declLiq = totalLiquido(registro);
    const difLiq = totalLiq - declLiq;
    document.getElementById('pg_confLiqTotal').textContent = fmtMoeda(totalLiq);
    document.getElementById('pg_confLiqDecl').textContent = fmtMoeda(declLiq);
    document.getElementById('pg_confLiqDif').textContent = fmtMoeda(difLiq);
    document.getElementById('pg_confLiqConf').innerHTML = confOk(difLiq) ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-erro">ERRO</span>';
  }
  document.querySelectorAll('.pg_confLoja').forEach(el=>{
    el.addEventListener('input', ()=>{
      registro.conferenciaLojas[el.dataset.camp][el.dataset.ab] = el.value===''?null:parseFloat(el.value);
      recalcularConferenciaLojas();
    });
  });

  // ---- Blocos de vendedora (venda por loja) ----
  function drawVendedorasBlocos(){
    const wrap = document.getElementById('pg_vendedorasBlocos');
    wrap.innerHTML = registro.vendedoras.map((v,vi)=>`
      <div style="border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; flex-wrap:wrap;">
          <input type="text" data-vnome="${vi}" value="${escapeHtml(v.nome)}" style="font-weight:800; max-width:220px;" ${podeDiretoria?'':'disabled'}>
          <div style="display:flex; align-items:center; gap:8px;">
            <label class="muted" style="text-transform:none;">% Vend</label><input type="number" step="0.1" data-vperc="${vi}" value="${v.percVend??''}" style="width:80px;" ${podeDiretoria?'':'disabled'}>
            <label class="muted" style="text-transform:none;">Nível</label><select data-vnivel="${vi}" style="width:70px;" ${podeDiretoria?'':'disabled'}>${FATOR_PADRAO.map((_,i)=>`<option value="${i+1}" ${v.nivel===i+1?'selected':''}>${i+1}</option>`).join('')}</select>
            <button type="button" class="icon-btn" data-vdel="${vi}" title="Remover linha" style="color:var(--danger);">✕</button>
          </div>
        </div>
        <table>
          <thead><tr><th></th>${lojas.map(ab=>`<th>${ab}</th>`).join('')}<th>Total</th></tr></thead>
          <tbody>
            <tr><td class="rotulo">T. Bruto</td>${lojas.map(ab=>`<td><input type="number" step="0.01" class="vend-input" data-vb="${vi}" data-ab="${ab}" value="${(v.porLoja[ab]||{}).bruto??''}"></td>`).join('')}<td><span class="calc" id="pg_vb_total_${vi}"></span></td></tr>
            <tr><td class="rotulo">Devol.</td>${lojas.map(ab=>`<td><input type="number" step="0.01" class="vend-input" data-vd="${vi}" data-ab="${ab}" value="${(v.porLoja[ab]||{}).devol??''}"></td>`).join('')}<td><span class="calc" id="pg_vd_total_${vi}"></span></td></tr>
            <tr><td class="rotulo">T. Líquido</td>${lojas.map(ab=>`<td><span class="calc" id="pg_vl_${vi}_${ab}"></span></td>`).join('')}<td><span class="calc" id="pg_vl_total_${vi}"></span></td></tr>
          </tbody>
        </table>
      </div>
    `).join('');

    wrap.querySelectorAll('[data-vnome]').forEach(el=> el.addEventListener('input', ()=>{ registro.vendedoras[Number(el.dataset.vnome)].nome = el.value; }));
    wrap.querySelectorAll('[data-vperc]').forEach(el=> el.addEventListener('input', ()=>{ registro.vendedoras[Number(el.dataset.vperc)].percVend = el.value===''?null:parseFloat(el.value); }));
    wrap.querySelectorAll('[data-vnivel]').forEach(el=> el.addEventListener('change', ()=>{ registro.vendedoras[Number(el.dataset.vnivel)].nivel = Number(el.value); recalcularFatorIndividual(); }));
    wrap.querySelectorAll('[data-vdel]').forEach(el=> el.addEventListener('click', ()=>{
      registro.vendedoras.splice(Number(el.dataset.vdel),1);
      drawVendedorasBlocos(); recalcularItens();
    }));
    wrap.querySelectorAll('[data-vb]').forEach(el=> el.addEventListener('input', ()=>{
      const vi = Number(el.dataset.vb), ab = el.dataset.ab;
      if(!registro.vendedoras[vi].porLoja[ab]) registro.vendedoras[vi].porLoja[ab] = {bruto:null,devol:null};
      registro.vendedoras[vi].porLoja[ab].bruto = el.value===''?null:parseFloat(el.value);
      recalcularBlocoVendedora(vi); recalcularItens(); recalcularConferenciaLojas();
    }));
    wrap.querySelectorAll('[data-vd]').forEach(el=> el.addEventListener('input', ()=>{
      const vi = Number(el.dataset.vd), ab = el.dataset.ab;
      if(!registro.vendedoras[vi].porLoja[ab]) registro.vendedoras[vi].porLoja[ab] = {bruto:null,devol:null};
      registro.vendedoras[vi].porLoja[ab].devol = el.value===''?null:parseFloat(el.value);
      recalcularBlocoVendedora(vi); recalcularItens(); recalcularConferenciaLojas();
    }));

    registro.vendedoras.forEach((v,vi)=> recalcularBlocoVendedora(vi));
  }
  function recalcularBlocoVendedora(vi){
    const v = registro.vendedoras[vi];
    lojas.forEach(ab=>{
      const el = document.getElementById(`pg_vl_${vi}_${ab}`);
      if(el) el.textContent = fmtMoeda(tLiquiVendedoraPorLoja(v, ab));
    });
    const elBT = document.getElementById('pg_vb_total_'+vi); if(elBT) elBT.textContent = fmtMoeda(tBrutoVendedoraTotal(v, lojas));
    const elDT = document.getElementById('pg_vd_total_'+vi); if(elDT) elDT.textContent = fmtMoeda(tDevolVendedoraTotal(v, lojas));
    const elLT = document.getElementById('pg_vl_total_'+vi); if(elLT) elLT.textContent = fmtMoeda(tLiquiVendedoraTotal(v, lojas));
  }
  document.getElementById('btnAddVendedora').addEventListener('click', ()=>{
    registro.vendedoras.push({ id: uid('vpgv'), nome:'Nova linha', porLoja: Object.fromEntries(lojas.map(ab=>[ab,{bruto:null,devol:null}])), percVend:null, nivel:1, itens: Object.fromEntries(CATEGORIAS.map(c=>[c.id,null])) });
    drawVendedorasBlocos(); recalcularItens();
  });

  // ---- Itens vendidos por vendedora ----
  function drawItensRows(){
    const tbody = document.getElementById('pg_itensRows');
    tbody.innerHTML = registro.vendedoras.map((v,vi)=>`
      <tr>
        <td class="rotulo">${escapeHtml(v.nome)}</td>
        ${CATEGORIAS.map(c=>`<td><input type="number" step="0.01" class="vend-input" data-ic="${c.id}" data-iv="${vi}" value="${v.itens[c.id]??''}"></td>`).join('')}
        <td><span class="calc" id="pg_ti_${vi}"></span></td>
        <td><span class="calc" id="pg_tl_${vi}"></span></td>
        <td><span id="pg_dif_${vi}"></span></td>
        <td><span id="pg_conf_${vi}"></span></td>
      </tr>
    `).join('');
    tbody.querySelectorAll('[data-ic]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const vi = Number(el.dataset.iv);
        registro.vendedoras[vi].itens[el.dataset.ic] = el.value===''?null:parseFloat(el.value);
        recalcularItens();
      });
    });
  }
  function recalcularItens(){
    registro.vendedoras.forEach((v,vi)=>{
      const ti = totalItensVendedora(v);
      const tl = tLiquiVendedoraTotal(v, lojas);
      const dif = ti - tl;
      const elTi = document.getElementById('pg_ti_'+vi); if(elTi) elTi.textContent = fmtMoeda(ti);
      const elTl = document.getElementById('pg_tl_'+vi); if(elTl) elTl.textContent = fmtMoeda(tl);
      const elDif = document.getElementById('pg_dif_'+vi); if(elDif) elDif.textContent = fmtMoeda(dif);
      const elConf = document.getElementById('pg_conf_'+vi);
      if(elConf) elConf.innerHTML = confOk(dif) ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-erro">ERRO</span>';
    });
    // rodapé: total vendedoras / gerente declarado / diferença / conferência
    const foot = document.getElementById('pg_itensFoot');
    const totVendCats = CATEGORIAS.map(c=> totalVendedorasCategoria(registro, c.id));
    const totVendItens = totalVendedorasItens(registro);
    const totVendTL = totalVendedorasTLiquido(registro, lojas);
    const totVendDif = totVendItens - totVendTL;
    const gerCats = CATEGORIAS.map(c=> n(registro.categoriasDeclaradas[c.id]));
    const gerItens = totalItensCategorias(registro);
    const gerTL = totalLiquido(registro);
    const gerDif = gerItens - gerTL;
    const difVendGer = CATEGORIAS.map((c,i)=> totVendCats[i] - gerCats[i]);
    foot.innerHTML = `
      <tr style="font-weight:800; background:var(--surface-2);">
        <td class="rotulo">TOTAL VENDEDORAS</td>
        ${totVendCats.map(v=>`<td>${fmtMoeda(v)}</td>`).join('')}
        <td>${fmtMoeda(totVendItens)}</td><td>${fmtMoeda(totVendTL)}</td><td>${fmtMoeda(totVendDif)}</td>
        <td>${confOk(totVendDif)?'<span class="badge badge-ok">OK</span>':'<span class="badge badge-erro">ERRO</span>'}</td>
      </tr>
      <tr style="font-weight:700;">
        <td class="rotulo">GERENTE (declarado)</td>
        ${gerCats.map(v=>`<td>${fmtMoeda(v)}</td>`).join('')}
        <td>${fmtMoeda(gerItens)}</td><td>${fmtMoeda(gerTL)}</td><td>${fmtMoeda(gerDif)}</td>
        <td>${confOk(gerDif)?'<span class="badge badge-ok">OK</span>':'<span class="badge badge-erro">ERRO</span>'}</td>
      </tr>
      <tr>
        <td class="rotulo">DIFERENÇA (Vend−Ger)</td>
        ${difVendGer.map(v=>`<td>${fmtMoeda(v)}</td>`).join('')}
        <td>${fmtMoeda(totVendItens-gerItens)}</td><td>${fmtMoeda(totVendTL-gerTL)}</td><td></td><td></td>
      </tr>
      <tr>
        <td class="rotulo">CONFERÊNCIA</td>
        ${difVendGer.map(v=> `<td>${confOk(v)?'<span class="badge badge-ok">OK</span>':'<span class="badge badge-erro">ERRO</span>'}</td>`).join('')}
        <td colspan="4"></td>
      </tr>
    `;
    recalcularFatorIndividual();
  }

  // ---- Fator ----
  function drawFatorRows(){
    const tbody = document.getElementById('pg_fatorRows');
    tbody.innerHTML = registro.fatorTabela.map((linha,li)=>{
      const media = linha.reduce((a,b)=>a+n(b),0) / linha.length;
      return `<tr><td class="rotulo">${li+1}</td>${linha.map((val,ci)=>`<td><input type="number" step="0.1" data-fl="${li}" data-fc="${ci}" value="${val}" ${podeDiretoria?'':'disabled'}></td>`).join('')}<td><span class="calc">${media.toFixed(1)}</span></td></tr>`;
    }).join('');
    tbody.querySelectorAll('[data-fl]').forEach(el=>{
      el.addEventListener('input', ()=>{
        registro.fatorTabela[Number(el.dataset.fl)][Number(el.dataset.fc)] = parseFloat(el.value)||0;
        drawFatorRows(); recalcularFatorIndividual();
      });
    });
  }
  function recalcularFatorIndividual(){
    const tbody = document.getElementById('pg_fatorIndivRows');
    if(!tbody) return;
    tbody.innerHTML = registro.vendedoras.map(v=>{
      const linha = registro.fatorTabela[(v.nivel||1)-1] || registro.fatorTabela[0];
      const valores = CATEGORIAS.map((c,i)=> n(v.itens[c.id]) * (linha[i]||0) / 100);
      const total = valores.reduce((a,b)=>a+b,0);
      return `<tr><td class="rotulo">${escapeHtml(v.nome)}</td>${valores.map(val=>`<td>${val.toFixed(2)}</td>`).join('')}<td><b>${total.toFixed(2)}</b></td></tr>`;
    }).join('');
  }

  drawVendedorasBlocos();
  drawItensRows();
  drawFatorRows();
  recalcularDeclarado();
  recalcularConferenciaLojas();
  recalcularItens();
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'vendapg' }, '*');
  }
})();
</script>
</body>
</html>
