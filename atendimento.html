<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento — Gestão e Controle</title>
<style>
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#F1F4F7;--ink:#1A1D24;--ink-soft:#4B5566;--ink-faint:#7C8592;
  --line:#E1E5EA;--accent:#662344;--accent-soft:#F3E6D8;--ok:#17794A;--ok-soft:#E3F5EA;--danger:#B91C1C;--danger-soft:#FBEAEA;
  --wait:#B45309;--wait-soft:#FCEEDC;--bubble-in:#FFFFFF;--bubble-out:#E8F3E8;--radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
button,input,textarea,select{font-family:inherit;font-size:13.5px;}
button{cursor:pointer;}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--accent);} .btn:disabled{opacity:.5;cursor:default;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
.btn-sm{padding:5px 9px;font-size:12px;}
.muted{color:var(--ink-faint);font-size:12px;}
.app{display:flex;height:100vh;}
/* ---- lista ---- */
.lista{width:340px;min-width:280px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;}
.lista-top{padding:10px 12px;border-bottom:1px solid var(--line);}
.lista-top h1{margin:0 0 8px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.conexao{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);}
.conexao.on{background:var(--ok-soft);color:var(--ok);} .conexao.off{background:var(--danger-soft);color:var(--danger);}
.filtros{display:flex;gap:4px;margin-bottom:8px;}
.filtros button{flex:1;padding:6px 4px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-soft);}
.filtros button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.filtros button .n{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.08);font-size:10.5px;margin-left:3px;}
.filtros button.active .n{background:rgba(255,255,255,.25);}
.busca{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
.conversas{flex:1;overflow-y:auto;}
.conv{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;}
.conv:hover{background:var(--surface-2);} .conv.active{background:var(--accent-soft);}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;font-size:15px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.conv .info{flex:1;min-width:0;}
.conv .l1{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
.conv .nome{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .hora{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.conv .l2{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:2px;}
.conv .prev{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.conv .quem{font-size:11px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tagchip{display:inline-block;font-size:10.5px;background:var(--surface-2);color:var(--ink-soft);border-radius:999px;padding:1px 7px;margin-right:4px;}
/* ---- chat ---- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:15px;text-align:center;padding:20px;}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;}
.chat-head .titulo{flex:1;min-width:160px;}
.chat-head .titulo b{font-size:14.5px;display:block;}
.chat-head .acoes{display:flex;gap:6px;flex-wrap:wrap;}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);}
.bubble{max-width:72%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.05);position:relative;word-wrap:break-word;white-space:pre-wrap;}
.bubble.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:3px;}
.bubble.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:3px;}
.bubble.sis{align-self:center;background:var(--wait-soft);color:var(--wait);font-size:12px;border-radius:999px;padding:4px 12px;max-width:90%;}
.bubble .meta{font-size:10.5px;color:var(--ink-faint);margin-top:4px;text-align:right;}
.bubble .autor{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px;}
.bubble img{max-width:100%;border-radius:8px;display:block;margin-top:4px;cursor:zoom-in;}
.bubble audio,.bubble video{max-width:100%;margin-top:4px;display:block;}
.bubble .doc{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;background:var(--surface-2);border-radius:8px;margin-top:4px;text-decoration:none;color:var(--ink);font-weight:600;}
.compose{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;}
.compose .linha{display:flex;gap:8px;align-items:flex-end;}
.compose textarea{flex:1;min-height:42px;max-height:140px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;resize:vertical;}
.compose .rapidas{margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;}
.compose .rapidas button{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);}
.aviso-bloqueado{background:var(--wait-soft);color:var(--wait);padding:8px 12px;font-size:12.5px;text-align:center;}
/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px;}
.modal h2{margin:0 0 12px;font-size:16px;}
.field{margin-bottom:10px;} .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
.modal .rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
.resumo{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap;font-size:12px;}
.resumo span b{color:var(--accent);}
.res-item{display:flex;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;}
.res-item .t{font-weight:700;font-size:13px;} .res-item .x{font-size:12px;color:var(--ink-soft);white-space:pre-wrap;}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;display:none;z-index:99;}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;}
.zoom img{max-width:95vw;max-height:95vh;}
.sep-dia{align-self:center;background:var(--surface);color:var(--ink-faint);font-size:11px;font-weight:700;border-radius:999px;padding:3px 12px;margin:6px 0;box-shadow:0 1px 1px rgba(0,0,0,.05);}
.mais-antigas{align-self:center;}
.bubble a.lnk{color:#1D4ED8;word-break:break-all;}
.bubble .meta .lida{color:#1D8FE1;font-weight:700;}
.espera{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-right:4px;background:var(--wait-soft);color:var(--wait);}
.espera.alta{background:var(--danger-soft);color:var(--danger);}
.sugestoes{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden;background:var(--surface);}
.sugestoes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:7px 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sugestoes button:last-child{border-bottom:0;} .sugestoes button:hover,.sugestoes button:first-child{background:var(--accent-soft);}
.sugestoes button span{color:var(--ink-soft);}
.chat.arrastando{outline:3px dashed var(--accent);outline-offset:-8px;}
.previa{text-align:center;margin-bottom:10px;} .previa img{max-width:100%;max-height:260px;border-radius:8px;}
.tag-sug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag-sug button{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);}
.tag-sug button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;margin-top:8px;}
.mbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;} .mbtn .ic{font-size:18px;line-height:1;}
.mbtn:hover{background:var(--surface-2);} .mbtn .n{position:absolute;top:2px;right:4px;background:#dc2626;color:#fff;border-radius:999px;min-width:16px;padding:0 4px;font-size:10px;}
.mbtn .n:empty{display:none;}
.voltar-lista{display:none;}
.chat-vazio.painel{display:block;overflow:auto;text-align:left;padding:14px 18px;color:var(--ink);font-size:13px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
.kpi{background:var(--accent);color:#fff;border-radius:10px;padding:10px 12px;cursor:default;} .kpi b{display:block;font-size:22px;line-height:1.1;margin-top:4px;} .kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;opacity:.9;}
.kpi.cl{cursor:pointer;}
.ptab{width:100%;border-collapse:collapse;margin-bottom:16px;} .ptab th{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:6px 4px;border-bottom:1px solid var(--line);} .ptab th:first-child{text-align:left;}
.ptab td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center;} .ptab td:first-child{text-align:left;font-weight:700;}
.ptab tr.lin{cursor:pointer;} .ptab tr.lin:hover{background:var(--surface-2);} .ptab tr.sel{background:var(--surface-2);}
.pill{display:inline-block;min-width:34px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;} .pill.z{background:transparent;color:var(--ink-faint);font-weight:400;cursor:default;}
.pill.g{background:#16a34a;} .pill.b{background:#2563eb;} .pill.o{background:#f59e0b;} .pill.r{background:#dc2626;}
.fx{display:none;margin:6px 0 0;font-size:12px;} .fx button{margin-left:6px;}
.modal.largo{max-width:760px;}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;} .abas button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:700;}
.abas button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.cartao{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;}
.cartao .t{font-weight:700;} .cartao .x{font-size:12px;color:var(--ink-soft);}
.hor-dia{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px;align-items:center;margin-bottom:4px;font-size:12.5px;}
.hor-dia input[type=time]{padding:4px 6px;border:1px solid var(--line);border-radius:6px;}
.dep-chk{display:flex;gap:10px;flex-wrap:wrap;} .dep-chk label{font-weight:400;display:flex;gap:4px;align-items:center;font-size:12.5px;}
.on-off{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);}
.on-off.on{background:#16a34a;color:#fff;border-color:#16a34a;}
@media(max-width:760px){
  .app.ver-chat .lista{display:none;} .app:not(.ver-chat) .chat{display:none;}
  .lista{width:100%;} .voltar-lista{display:inline-block;}
  .bubble{max-width:88%;}
}
.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--border,#d9d9d9);border-radius:8px;padding:8px 10px;font:inherit;min-height:64px;resize:vertical;background:var(--surface,#fff);color:inherit}
.sec{border:1px solid var(--border,#e5e5e5);border-radius:10px;margin:10px 0;overflow:hidden}
.sec>summary{cursor:pointer;padding:10px 12px;font-weight:600;background:rgba(127,127,127,.08)}
.sec>div{padding:10px 12px}
.lin{display:grid;grid-template-columns:56px 1fr 1fr 32px;gap:6px;margin-bottom:6px;align-items:center}
.lin input,.lin select{width:100%;box-sizing:border-box}
.kw{border:1px dashed var(--border,#ccc);border-radius:8px;padding:8px;margin-bottom:8px}
.prev{white-space:pre-wrap;background:#dcf8c6;color:#111;border-radius:10px;padding:10px 12px;font-size:13px;max-width:380px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lista">
    <div class="lista-top">
      <h1><span>💬 Atendimento</span><span class="conexao" id="conexao">…</span></h1>
      <div class="filtros" id="filtros">
        <button data-f="minhas" class="active">Minhas<span class="n" id="n_minhas"></span></button>
        <button data-f="fila">Fila<span class="n" id="n_fila"></span></button>
        <button data-f="todas">Todas</button>
        <button data-f="finalizadas">Final.</button>
      </div>
      <input class="busca" id="busca" placeholder="Buscar por nome ou número…">
      <div style="display:flex;gap:6px;margin-top:6px;"><select class="busca" id="filtroBot" style="display:none;"><option value="">Todos os bots</option></select><select class="busca" id="filtroDep" style="display:none;"><option value="">Todos os departamentos</option></select></div>
      <select class="busca" id="filtroCanal" style="display:none;margin-top:6px;"><option value="">Todos os canais</option><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option></select>
      <button class="btn btn-accent" id="btnNova" style="width:100%;margin-top:8px;">➕ Nova conversa</button>
      <div class="menu-grid">
        <button class="mbtn" id="btnPainel" style="display:none;" title="Painel de acompanhamento de todas as conversas"><span class="ic">📊</span>Painel</button>
        <button class="mbtn" id="btnTarefas" title="Minhas tarefas do CRM"><span class="ic">✅</span>Tarefas<span class="n" id="n_tarefas"></span></button>
        <button class="mbtn" id="btnFunil" title="Funil de oportunidades"><span class="ic">🧭</span>Funil</button>
        <button class="mbtn" id="btnConfig" style="display:none;" title="Bots, departamentos, equipe e respostas"><span class="ic">⚙️</span>Administrar</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;align-items:center;">
        <button class="btn btn-sm" id="btnOnline" title="Ficar online/offline para receber atendimentos" style="flex:1;">⚪ Offline</button>
        <button class="btn btn-sm" id="btnSom" title="Aviso sonoro de mensagem nova">🔔</button>
        <button class="btn btn-sm" id="btnAtualizar" title="Atualizar">↻</button>
      </div>
    </div>
    <div class="fx" id="fxInfo"></div>
    <div class="resumo" id="resumo" style="display:none;"></div>
    <div class="conversas" id="conversas"><p class="muted" style="padding:14px;">Carregando…</p></div>
  </aside>
  <section class="chat" id="chat">
    <div class="chat-vazio" id="chatVazio">Escolha uma conversa à esquerda.<br><span class="muted">Mensagens novas aparecem sozinhas.</span></div>
    <div id="chatArea" style="display:none;flex:1;flex-direction:column;min-height:0;">
      <div class="chat-head">
        <button class="btn btn-sm voltar-lista" id="btnVoltarLista">←</button>
        <button class="btn btn-sm" id="btnVoltarPainel" style="display:none;" title="Voltar ao painel">📊</button>
        <div class="avatar" id="chAvatar"></div>
        <div class="titulo"><b id="chNome"></b><span class="muted" id="chSub"></span></div>
        <div class="acoes" id="chAcoes"></div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="aviso-bloqueado" id="avisoBloqueado" style="display:none;"></div>
      <div class="compose" id="compose">
        <div class="rapidas" id="rapidas"></div>
        <div class="sugestoes" id="sugestoes" style="display:none;"></div>
        <div class="linha">
          <button class="btn" id="btnAnexo" title="Enviar foto, áudio ou arquivo">📎</button>
          <input type="file" id="arquivo" style="display:none;">
          <textarea id="texto" placeholder="Escreva a mensagem… (Enter envia · Shift+Enter quebra linha · / respostas rápidas)"></textarea>
          <button class="btn btn-accent" id="btnEnviar">Enviar</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const API_URL = SUPABASE_URL + "/functions/v1/atendimento-api";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
const EMBEDDED = window.parent !== window;

let __gatewaySenha = null, currentUser = null, config = {};
let estado = { filtro:'minhas', busca:'', conversas:[], atual:null, mensagens:[], gestao:false, meuId:null, meuNome:'', setores:[], respostas:[], instancias:{}, canal:'', variosCanais:false, limite:80, temAntigas:false, aviso:true, bots:[], departamentos:[], atendentes:[], funcionarios:[], meuReg:null, botId:'', depId:'', fx:{dep:'',at:'',st:''}, painel:false, todas:[] };
let pollTimer = null;
const urlsMidia = {};

async function api(body){
  try{
    const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) });
    return await res.json();
  }catch(e){ return { error:String(e) }; }
}
async function gateway(body){
  try{
    const res = await fetch(GATEWAY_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) });
    return await res.json();
  }catch(e){ return { error:String(e) }; }
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._x); t._x=setTimeout(()=>t.style.display='none',3200); }
function fmtHora(iso){ if(!iso) return ''; const d=new Date(iso), h=new Date(); const mesmoDia=d.toDateString()===h.toDateString(); const hh=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); return mesmoDia?hh:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+hh; }
function fmtTel(n){ const d=(n||'').replace(/\D/g,''); if(d.length===13) return `(${d.slice(2,4)}) ${d.slice(4,9)}-${d.slice(9)}`; if(d.length===12) return `(${d.slice(2,4)}) ${d.slice(4,8)}-${d.slice(8)}`; return n||''; }
function iniciais(nome){ return (nome||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase(); }
function avatarHtml(c){ return c.contato_foto ? `<img src="${escapeHtml(c.contato_foto)}" alt="" onerror="this.parentNode.textContent='${escapeHtml(iniciais(c.contato_nome||c.contato_id))}'">` : escapeHtml(iniciais(c.contato_nome||c.contato_id)); }
function nomeConv(c){ return c.contato_nome || fmtTel(c.contato_id); }
function statusLabel(c){ return c.status==='aguardando' ? 'Na fila' : c.status==='finalizado' ? 'Finalizada' : (c.atendente_nome ? 'Com '+c.atendente_nome : 'Em atendimento'); }

/* ================= AVISOS (som, notificação, título da aba) ================= */
function prefLer(k, padrao){ try{ const v = localStorage.getItem(k); return v===null ? padrao : v; }catch(e){ return padrao; } }
function prefGravar(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
estado.aviso = prefLer('atd_aviso','1') === '1';
let audioCtx = null, tituloOriginal = null, vistos = null; const avisados = {};
function tocarSom(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [880, 1175].forEach((f,i)=>{ const o = audioCtx.createOscillator(), g = audioCtx.createGain(), ini = t + i*0.16; o.type='sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, ini); g.gain.exponentialRampToValueAtTime(0.25, ini+0.02); g.gain.exponentialRampToValueAtTime(0.0001, ini+0.15); o.connect(g); g.connect(audioCtx.destination); o.start(ini); o.stop(ini+0.16); });
  }catch(e){}
}
function tituloAba(total){
  try{ const d = window.top.document; if(tituloOriginal===null) tituloOriginal = d.title.replace(/^\(\d+\)\s*/,''); d.title = total ? `(${total}) ${tituloOriginal}` : tituloOriginal; }catch(e){}
}
function avisarNova(c){
  if(!estado.aviso || !c) return;
  const k = c.id + '|' + (c.ultima_mensagem_em||''); if(avisados[k]) return; avisados[k] = 1;
  tocarSom();
  try{ if(navigator.vibrate) navigator.vibrate([100,50,100]); }catch(e){}
  try{
    if(document.hidden && window.Notification && Notification.permission==='granted'){
      const n = new Notification('Nova mensagem — ' + nomeConv(c), { body: c.ultima_mensagem_texto || '', tag: 'atd_'+c.id });
      n.onclick = ()=>{ try{ window.top.focus(); }catch(e){} abrirConversa(c.id); n.close(); };
    }
  }catch(e){}
}
function detectarNovas(listas){
  const mapa = {}, novas = [];
  listas.forEach(l=> (l||[]).forEach(c=>{ if(c.ultima_direcao==='in' && c.nao_lidas && !mapa[c.id]){ mapa[c.id] = c.ultima_mensagem_em || '1'; if(vistos && vistos[c.id] !== mapa[c.id]) novas.push(c); } }));
  const primeira = !vistos; vistos = mapa;
  if(primeira) return;
  novas.forEach(c=>{ if(estado.atual && estado.atual.id===c.id && !document.hidden) return; avisarNova(c); });
}
function renderSino(){ const b = document.getElementById('btnSom'); b.textContent = estado.aviso ? '🔔' : '🔕'; b.title = estado.aviso ? 'Avisos de mensagem nova: ligados (clique para desligar)' : 'Avisos de mensagem nova: desligados (clique para ligar)'; }
function alternarSino(){
  estado.aviso = !estado.aviso; prefGravar('atd_aviso', estado.aviso ? '1' : '0'); renderSino();
  if(estado.aviso){ tocarSom(); try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){} showToast('Avisos de mensagem nova ligados.'); }
  else showToast('Avisos de mensagem nova desligados.');
}
function botChip(c){ if(estado.bots.length<2||!c.bot_id) return ''; const b=estado.bots.find(x=>x.id===c.bot_id); return b?`<span class="tagchip" title="Bot">🤖 ${escapeHtml(b.nome)}</span>`:''; }
function canalChip(c){ if(c.canal==='instagram') return '<span class="tagchip" title="Instagram">📷 IG</span>'; return estado.variosCanais ? '<span class="tagchip" title="WhatsApp">WA</span>' : ''; }
function esperaHtml(c){
  if(c.status==='finalizado' || c.ultima_direcao!=='in' || !c.ultima_mensagem_em) return '';
  const min = Math.floor((Date.now() - new Date(c.ultima_mensagem_em).getTime())/60000); if(!(min>=5)) return '';
  const txt = min<60 ? min+' min' : min<1440 ? Math.floor(min/60)+' h' : Math.floor(min/1440)+' d';
  return `<span class="espera ${min>=30?'alta':''}" title="Cliente aguardando resposta">⏱ ${txt}</span>`;
}
function linkar(html){ return html.replace(/(https?:\/\/[^\s<]+)/g, '<a class="lnk" href="$1" target="_blank" rel="noopener noreferrer">$1</a>'); }
function rotuloDia(iso){
  const d = new Date(iso), h = new Date(), o = new Date(); o.setDate(h.getDate()-1);
  if(d.toDateString()===h.toDateString()) return 'Hoje'; if(d.toDateString()===o.toDateString()) return 'Ontem';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

/* ================= LISTA ================= */
async function carregarLista(silencioso){
  const r = await api({ op:'listarConversas', filtro: estado.filtro, busca: estado.busca, canal: estado.canal || undefined, botId: estado.botId || undefined, departamentoId: estado.depId || undefined });
  if(!r){ if(!silencioso) showToast('Erro ao carregar'); return; }
  if(r.error){
    // Sessão expirada: parar polling e pedir novo login
    if(r.error === 'não autorizado' || String(r.error).includes('autorizado')){
      if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; }
      if(EMBEDDED) parent.postMessage({ type:'sessaoExpirada', modulo:'atendimento' }, '*');
      return;
    }
    if(!silencioso) showToast(r.error || 'Erro ao carregar');
    return;
  }
  estado.conversas = aplicarFx(r.data || []);
  renderLista();
  contadores();
}
async function contadores(){
  // Reaproveita a lista já carregada quando ela é exatamente a de "Minhas" ou a da "Fila" (uma chamada a menos a cada ciclo)
  const limpa = !estado.busca && !estado.canal && !estado.botId && !estado.depId && !temFx();
  const pronta = f => (limpa && estado.filtro===f) ? Promise.resolve({ data: estado.conversas }) : api({ op:'listarConversas', filtro:f });
  const [m, f] = await Promise.all([ pronta('minhas'), pronta('fila') ]);
  const nm = (m && m.data) ? m.data.reduce((a,c)=>a+(c.nao_lidas||0),0) : 0;
  const nf = (f && f.data) ? f.data.length : 0;
  document.getElementById('n_minhas').textContent = nm ? nm : '';
  document.getElementById('n_fila').textContent = nf ? nf : '';
  if(EMBEDDED) parent.postMessage({ type:'atendimentoTotal', modulo:'atendimento', total: nm + nf }, '*');
  tituloAba(nm + nf);
  if(m && m.data && f && f.data) detectarNovas([m.data, f.data]);
}
function renderLista(){
  const wrap = document.getElementById('conversas');
  if(!estado.conversas.length){ wrap.innerHTML = `<p class="muted" style="padding:14px;">Nenhuma conversa aqui.</p>`; return; }
  wrap.innerHTML = estado.conversas.map(c=>`
    <div class="conv ${estado.atual && estado.atual.id===c.id?'active':''}" data-id="${c.id}">
      <div class="avatar">${avatarHtml(c)}</div>
      <div class="info">
        <div class="l1"><span class="nome">${escapeHtml(nomeConv(c))}</span><span class="hora">${fmtHora(c.ultima_mensagem_em)}</span></div>
        <div class="l2"><span class="prev">${c.ultima_direcao==='out'?'✓ ':''}${escapeHtml(c.ultima_mensagem_texto||'')}</span>${c.nao_lidas?`<span class="badge">${c.nao_lidas}</span>`:''}</div>
        <div class="quem">${esperaHtml(c)}${canalChip(c)}${botChip(c)}${escapeHtml(statusLabel(c))}${c.setor?' · '+escapeHtml(c.setor):''} ${(c.tags||[]).map(t=>`<span class="tagchip">${escapeHtml(t)}</span>`).join('')}</div>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('.conv').forEach(el=> el.addEventListener('click', ()=> abrirConversa(el.dataset.id)));
}

/* ================= CHAT ================= */
async function abrirConversa(id){
  if(!estado.atual || estado.atual.id!==id) estado.limite = 80;
  const r = await api({ op:'mensagens', conversaId:id, limite: estado.limite });
  if(!r || r.error){ showToast(r && r.error || 'Erro ao abrir'); return; }
  estado.atual = r.conversa; estado.mensagens = r.data || []; estado.temAntigas = estado.mensagens.length >= estado.limite;
  document.getElementById('app').classList.add('ver-chat');
  document.getElementById('chatVazio').style.display='none'; estado.painel=false;
  document.getElementById('btnVoltarPainel').style.display = estado.gestao ? '' : 'none';
  const area = document.getElementById('chatArea'); area.style.display='flex';
  renderHead(); renderMsgs(true); renderLista();
  if(estado.atual.nao_lidas){ await api({ op:'marcarLida', conversaId:id }); estado.atual.nao_lidas=0; contadores(); }
}
function podeResponder(){
  const c = estado.atual; if(!c) return false;
  if(estado.gestao) return true;
  return !c.atendente_id || c.atendente_id===estado.meuId;
}
function renderHead(){
  const c = estado.atual;
  document.getElementById('chAvatar').innerHTML = avatarHtml(c);
  document.getElementById('chNome').textContent = nomeConv(c);
  document.getElementById('chSub').textContent = `${fmtTel(c.contato_id)} · ${statusLabel(c)}${c.setor?' · '+c.setor:''}${(estado.bots.length>1&&c.bot_id&&estado.bots.find(x=>x.id===c.bot_id))?' · 🤖 '+estado.bots.find(x=>x.id===c.bot_id).nome:''}${c.cliente_id?' · 👤 cliente vinculado':''}`;
  const a = [];
  if(c.status!=='finalizado' && (!c.atendente_id || (c.atendente_id!==estado.meuId && estado.gestao))) a.push(`<button class="btn btn-sm btn-accent" data-a="assumir">✋ Assumir</button>`);
  if(c.status!=='finalizado') a.push(`<button class="btn btn-sm" data-a="transferir">↪ Transferir</button>`);
  a.push(`<button class="btn btn-sm" data-a="crm">📇 CRM</button>`);
  a.push(`<button class="btn btn-sm" data-a="cliente">👤 Cliente</button>`);
  a.push(`<button class="btn btn-sm" data-a="tags">🏷️ Tags</button>`);
  if(c.status!=='finalizado') a.push(`<button class="btn btn-sm btn-danger" data-a="finalizar">✔ Finalizar</button>`);
  if(c.status==='finalizado') a.unshift(`<button class="btn btn-sm btn-accent" data-a="reabrir">↩ Reabrir</button>`);
  const wrap = document.getElementById('chAcoes'); wrap.innerHTML = a.join('');
  wrap.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> acao(b.dataset.a)));
  const bloq = document.getElementById('avisoBloqueado');
  if(!podeResponder()){ bloq.style.display='block'; bloq.textContent = `Esta conversa está com ${c.atendente_nome||'outro atendente'}. Só ele(a) ou a gestão responde.`; document.getElementById('compose').style.display='none'; }
  else { bloq.style.display='none'; document.getElementById('compose').style.display='block'; }
  document.getElementById('rapidas').innerHTML = estado.respostas.map((r,i)=>`<button data-i="${i}" title="${escapeHtml(r.texto)}">${escapeHtml(r.titulo)}</button>`).join('');
  document.getElementById('rapidas').querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ const t=document.getElementById('texto'); t.value = (t.value?t.value+'\n':'') + estado.respostas[b.dataset.i].texto; t.focus(); }));
}
function bubbleHtml(m){
  if(m.tipo==='sistema') return `<div class="bubble sis">${escapeHtml(m.texto||'')}</div>`;
  const cls = m.direcao==='out' ? 'out' : 'in';
  let corpo = '';
  if(m.midia_path){
    const mime = m.midia_mime||'';
    if(mime.startsWith('image/')) corpo += `<img data-path="${escapeHtml(m.midia_path)}" alt="foto">`;
    else if(mime.startsWith('audio/')) corpo += `<audio controls data-path="${escapeHtml(m.midia_path)}"></audio>`;
    else if(mime.startsWith('video/')) corpo += `<video controls data-path="${escapeHtml(m.midia_path)}"></video>`;
    else corpo += `<a class="doc" href="#" data-path="${escapeHtml(m.midia_path)}" target="_blank">📎 ${escapeHtml(m.midia_nome||'Arquivo')}</a>`;
  } else if(['imagem','audio','video','documento','sticker'].includes(m.tipo) && !m.texto){
    corpo += `<span class="muted">[${m.tipo}] mídia não disponível</span>`;
  }
  if(m.texto) corpo += linkar(escapeHtml(m.texto));
  const st = m.direcao==='out' ? (m.status==='lida'?' <span class="lida" title="Lida">✓✓</span>':m.status==='entregue'?' ✓✓':m.status==='erro'?' ⚠️':' ✓') : '';
  return `<div class="bubble ${cls}">${m.direcao==='out'&&m.autor_nome?`<div class="autor">${escapeHtml(m.autor_nome)}</div>`:''}${corpo}<div class="meta">${fmtHora(m.enviada_em)}${st}</div></div>`;
}
async function renderMsgs(scroll){
  const wrap = document.getElementById('msgs');
  let dia = '', html = estado.temAntigas ? `<button class="btn btn-sm mais-antigas" id="btnAntigas">⬆ Carregar mensagens anteriores</button>` : '';
  estado.mensagens.forEach(m=>{ const k = m.enviada_em ? new Date(m.enviada_em).toDateString() : dia; if(k!==dia){ dia = k; html += `<div class="sep-dia">${rotuloDia(m.enviada_em)}</div>`; } html += bubbleHtml(m); });
  wrap.innerHTML = html;
  const ba = document.getElementById('btnAntigas'); if(ba) ba.onclick = carregarAntigas;
  if(scroll) wrap.scrollTop = wrap.scrollHeight;
  wrap.querySelectorAll('[data-path]').forEach(async el=>{
    const path = el.dataset.path; let url = urlsMidia[path];
    if(!url){ const r = await api({ op:'midiaUrl', path }); if(r && r.url){ url = r.url; urlsMidia[path]=url; } }
    if(!url) return;
    if(el.tagName==='IMG'){ el.src = url; el.addEventListener('click', ()=>{ document.getElementById('zoomImg').src=url; document.getElementById('zoom').style.display='flex'; }); if(scroll) el.addEventListener('load', ()=>{ wrap.scrollTop = wrap.scrollHeight; }); }
    else if(el.tagName==='A') el.href = url;
    else el.src = url;
  });
}
async function carregarAntigas(){
  if(!estado.atual) return;
  const id = estado.atual.id, wrap = document.getElementById('msgs'), antes = wrap.scrollHeight;
  const b = document.getElementById('btnAntigas'); if(b){ b.disabled = true; b.textContent = 'Carregando…'; }
  const r = await api({ op:'mensagens', conversaId:id, limite: estado.limite + 200 });
  if(!estado.atual || estado.atual.id!==id) return;
  if(!r || r.error){ showToast(r && r.error || 'Erro ao carregar'); renderMsgs(false); return; }
  estado.limite += 200; estado.mensagens = r.data || []; estado.temAntigas = estado.mensagens.length >= estado.limite;
  renderMsgs(false); wrap.scrollTop = wrap.scrollHeight - antes;
}
async function atualizarMensagens(){
  if(!estado.atual) return;
  const ultimo = estado.mensagens.length ? estado.mensagens[estado.mensagens.length-1].enviada_em : null;
  const r = await api({ op:'mensagens', conversaId: estado.atual.id, depoisDe: ultimo, limite: 50 });
  if(!r || r.error) return;
  const mudouStatus = JSON.stringify([r.conversa.status, r.conversa.atendente_id, r.conversa.setor, r.conversa.cliente_id, r.conversa.tags]) !== JSON.stringify([estado.atual.status, estado.atual.atendente_id, estado.atual.setor, estado.atual.cliente_id, estado.atual.tags]);
  estado.atual = r.conversa;
  if(mudouStatus) renderHead();
  const novas = (r.data||[]).filter(m=> !estado.mensagens.some(x=>x.id===m.id));
  if(novas.length && novas.some(m=>m.direcao==='in')){
    // Conversa aberta mas aba/janela fora de vista: avisa (som + notificação)
    if(document.hidden) avisarNova(r.conversa);
  }
  if(novas.length){
    const wrap = document.getElementById('msgs'); const noFim = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80;
    estado.mensagens.push(...novas); renderMsgs(noFim);
    if(novas.some(m=>m.direcao==='in')) api({ op:'marcarLida', conversaId: estado.atual.id });
  }
}

/* ================= AÇÕES ================= */
async function acao(a){
  const c = estado.atual; if(!c) return;
  if(a==='assumir'){ const r = await api({ op:'assumir', conversaId:c.id }); if(r&&r.ok){ showToast('Conversa assumida.'); await abrirConversa(c.id); carregarLista(true);} else showToast(r&&r.error||'Erro'); }
  if(a==='finalizar'){ if(!confirm('Finalizar este atendimento?')) return; const r = await api({ op:'finalizar', conversaId:c.id }); if(r&&r.ok){ botApi({ op:'finalizou', conversaId:c.id }); showToast('Atendimento finalizado.'); await abrirConversa(c.id); carregarLista(true);} else showToast(r&&r.error||'Erro'); }
  if(a==='reabrir'){ const r = await api({ op:'assumir', conversaId:c.id }); if(r&&r.ok){ showToast('Conversa reaberta com você.'); await abrirConversa(c.id); carregarLista(true);} else showToast(r&&r.error||'Erro'); }
  if(a==='transferir') modalTransferir();
  if(a==='crm') modalCRM();
  if(a==='cliente') modalCliente();
  if(a==='tags') modalTags();
}
function abrirModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function fecharModal(){ document.getElementById('modalBg').classList.remove('show'); document.getElementById('modalBox').classList.remove('largo'); }
function modalTransferir(){
  const funcs = (config.funcionarios||[]).filter(f=>f.id!==estado.meuId);
  abrirModal(`<h2>Transferir conversa</h2>
    <div class="field"><label>Para o atendente</label><select id="tAt"><option value="">— devolver pra fila —</option>${funcs.map(f=>`<option value="${f.id}">${escapeHtml((f.apelido||'').trim()||f.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Departamento</label><select id="tDep"><option value="">— manter / nenhum —</option>${estado.departamentos.filter(d=>d.ativo&&(!d.bot_id||!estado.atual.bot_id||d.bot_id===estado.atual.bot_id)).map(d=>`<option value="${d.id}" ${estado.atual.departamento_id===d.id?'selected':''}>${escapeHtml(d.nome)}</option>`).join('')}</select></div>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-accent" id="mOk">Transferir</button></div>`);
  document.getElementById('mCancel').onclick = fecharModal;
  document.getElementById('mOk').onclick = async ()=>{
    const r = await api({ op:'transferir', conversaId: estado.atual.id, atendenteId: document.getElementById('tAt').value || null, departamentoId: document.getElementById('tDep').value || (estado.atual.departamento_id ? estado.atual.departamento_id : undefined) });
    if(r&&r.ok){ fecharModal(); showToast('Transferida.'); await abrirConversa(estado.atual.id); carregarLista(true); } else showToast(r&&r.error||'Erro');
  };
}
function modalTags(){
  abrirModal(`<h2>Tags da conversa</h2><div class="field"><label>Separe por vírgula</label><input id="tTags" value="${escapeHtml((estado.atual.tags||[]).join(', '))}" placeholder="orçamento, aliança, urgente"></div>
    <div class="tag-sug" id="tSug"></div>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-accent" id="mOk">Salvar</button></div>`);
  document.getElementById('mCancel').onclick = fecharModal;
  // Tags já usadas nas conversas da lista viram botões de um clique
  const usadas = [...new Set(estado.conversas.flatMap(x=>x.tags||[]).concat(estado.atual.tags||[]))].sort((a,b)=>a.localeCompare(b,'pt-BR')).slice(0,30);
  const lerTags = ()=> document.getElementById('tTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const pintarSug = ()=>{ const at = lerTags(); document.getElementById('tSug').innerHTML = usadas.map((t,i)=>`<button type="button" data-i="${i}" class="${at.includes(t)?'on':''}">${escapeHtml(t)}</button>`).join(''); document.getElementById('tSug').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ const t = usadas[b.dataset.i]; let l = lerTags(); l = l.includes(t) ? l.filter(x=>x!==t) : l.concat(t); document.getElementById('tTags').value = l.join(', '); pintarSug(); }); };
  pintarSug(); document.getElementById('tTags').addEventListener('input', pintarSug);
  document.getElementById('mOk').onclick = async ()=>{
    const tags = document.getElementById('tTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const r = await api({ op:'tags', conversaId: estado.atual.id, tags }); if(r&&r.ok){ fecharModal(); await abrirConversa(estado.atual.id); carregarLista(true);} else showToast(r&&r.error||'Erro');
  };
}
function modalCliente(){
  abrirModal(`<h2>Vincular ao cadastro de clientes</h2>
    <div class="field"><label>Buscar cliente (nome, telefone ou CPF)</label><input id="cBusca" placeholder="Digite pelo menos 2 letras" value="${escapeHtml(fmtTel(estado.atual.contato_id).replace(/\D/g,'').slice(-8))}"></div>
    <div id="cLista" class="muted">Buscando…</div>
    <div class="field" style="margin-top:10px;"><label>Ou só ajustar o nome exibido</label><input id="cNome" value="${escapeHtml(estado.atual.contato_nome||'')}"></div>

const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function horarioHtml(pref, h, opcional){
  const tem = !!(h && h.dias);
  const base = h && h.dias ? h : { dias: Object.fromEntries([0,1,2,3,4,5,6].map(i=>[String(i),{ativo:i>0,faixas:[['09:00','18:00']]}])) };
  let html = opcional ? `<label style="display:flex;gap:6px;align-items:center;margin-bottom:6px;font-weight:400;"><input type="checkbox" id="${pref}_usar" ${tem?'checked':''}> Usar horário próprio (senão herda o do nível acima)</label>` : '';
  html += `<div id="${pref}_box" style="${opcional&&!tem?'display:none':''}">` + [1,2,3,4,5,6,0].map(i=>{ const d = base.dias[String(i)]||{ativo:false,faixas:[]}; const f = (d.faixas&&d.faixas[0])||['09:00','18:00'];
    return `<div class="hor-dia"><label style="font-weight:400;display:flex;gap:4px;align-items:center;"><input type="checkbox" id="${pref}_a${i}" ${d.ativo?'checked':''}> ${DIAS[i]}</label><input type="time" id="${pref}_i${i}" value="${f[0]}"><input type="time" id="${pref}_f${i}" value="${f[1]}"></div>`; }).join('') + `<div class="muted" style="font-size:11.5px;">00:00 às 00:00 = 24 horas. Dia desmarcado = fechado.</div></div>`;
  return html;
}
function horarioLer(pref, opcional){
  if(opcional){ const u = document.getElementById(pref+'_usar'); if(!u || !u.checked) return null; }
  const dias = {}; for(let i=0;i<7;i++){ const a = document.getElementById(`${pref}_a${i}`).checked; const ini = document.getElementById(`${pref}_i${i}`).value||'00:00', fim = document.getElementById(`${pref}_f${i}`).value||'00:00'; dias[String(i)] = { ativo:a, faixas:[[ini,fim]] }; }
  return { dias };
}
function ligarHorario(pref){ const u = document.getElementById(pref+'_usar'); if(u) u.onchange = ()=>{ document.getElementById(pref+'_box').style.display = u.checked ? '' : 'none'; }; }
function resumoHorario(h){ if(!h||!h.dias) return 'sem restrição (24h)'; const ab = [1,2,3,4,5,6,0].filter(i=>h.dias[String(i)]&&h.dias[String(i)].ativo); return ab.length ? ab.map(i=>DIAS[i].slice(0,3)).join(', ') : 'fechado'; }

  c.innerHTML = `<div class="field"><label>Respostas rápidas — uma por linha, no formato <b>Título | texto</b></label><textarea id="cfRes" rows="9">${escapeHtml(estado.respostas.map(r=>r.titulo+' | '+r.texto).join('\n'))}</textarea></div><div class="rodape"><button class="btn btn-accent" id="cfOk">Salvar</button></div>`;
  document.getElementById('cfOk').onclick = async ()=>{
    const respostasRapidas = document.getElementById('cfRes').value.split('\n').map(l=>{ const i=l.indexOf('|'); if(i<0) return null; return { titulo:l.slice(0,i).trim(), texto:l.slice(i+1).trim() }; }).filter(r=>r&&r.titulo&&r.texto);
    const r = await api({ op:'salvarConfig', respostasRapidas }); if(r&&r.ok){ estado.respostas=respostasRapidas; showToast('Salvo.'); if(estado.atual) renderHead(); } else showToast(r&&r.error||'Erro');
  };
}

let fluxoBotId = null;
function abaFluxo(){
  const c = document.getElementById('abCorpo');
  if(!estado.bots.length){ c.innerHTML = '<p class="muted">Crie um bot primeiro na aba “Bots e canais”.</p>'; return; }
  if(!fluxoBotId || !estado.bots.find(b=>b.id===fluxoBotId)) fluxoBotId = estado.bots[0].id;
  const bot = estado.bots.find(b=>b.id===fluxoBotId);
  const f = (bot.config && bot.config.fluxo) || {};
  const m = Object.assign({}, MSG_PADRAO, Object.fromEntries(Object.entries(f.msgs||{}).filter(([k,v])=>v)));
  const deps = estado.departamentos.filter(d=>d.ativo);
  const optDep = (sel,vazio)=> (vazio?`<option value="">${vazio}</option>`:'') + deps.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${escapeHtml(d.nome)}</option>`).join('');
  const menu = (f.menu && f.menu.length) ? f.menu : [];
  const pal = f.palavras || [];
  const linMenu = (it)=>`<div class="lin fm"><input class="mn" value="${escapeHtml(it.n||'')}" placeholder="Nº" maxlength="3"><select class="md">${optDep(it.departamento_id)}</select><input class="mr" value="${escapeHtml(it.rotulo||'')}" placeholder="Texto (vazio = nome do departamento)"><button class="btn btn-sm" data-x="1" title="Remover">✕</button></div>`;
  const linPal = (it)=>`<div class="kw fp"><input class="pk" value="${escapeHtml((it.chaves||[]).join(', '))}" placeholder="Palavras separadas por vírgula (ex.: preço, valor, quanto custa)" style="width:100%;box-sizing:border-box;margin-bottom:6px;"><textarea class="pr" placeholder="Resposta automática">${escapeHtml(it.resposta||'')}</textarea><div style="display:flex;gap:6px;margin-top:6px;"><select class="pd" style="flex:1;">${optDep(it.departamento_id,'Só responder (não encaminhar)')}</select><button class="btn btn-sm" data-x="1">Remover</button></div></div>`;
  c.innerHTML = `${estado.bots.length>1?`<div class="field"><label>Bot</label><select id="flBot">${estado.bots.map(b=>`<option value="${b.id}" ${b.id===fluxoBotId?'selected':''}>${escapeHtml(b.nome)}</option>`).join('')}</select></div>`:`<p class="muted" style="margin-top:0">Bot: <b>${escapeHtml(bot.nome)}</b></p>`}
    <label style="display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0 4px;"><input type="checkbox" id="flAtivo" ${f.ativo?'checked':''}> Atendimento automático ligado (boas-vindas + menu)</label>
    <p class="muted" style="margin:0 0 8px;">Desligado, o bot não envia nada: as conversas só caem na fila. Horário do bot: <b>${escapeHtml(resumoHorario(bot.horario))}</b> (muda em “Bots e canais”).</p>
    <div class="field"><label>Nome da empresa nas mensagens</label><input id="flEmp" value="${escapeHtml(f.empresa||'Vilaça Joias')}"></div>
    <details class="sec" open><summary>📋 Menu de opções (localidade / departamento)</summary><div><div id="flMenu">${menu.map(linMenu).join('')}</div><button class="btn btn-sm" id="flMenuAdd">➕ Opção</button><p class="muted">O cliente digita o número e a conversa vai direto para o departamento escolhido, respeitando o horário dele.</p></div></details>
    <details class="sec"><summary>✉️ Mensagens</summary><div><p class="muted" style="margin-top:0">Variáveis: <b>{{empresa}}</b> <b>{{contato}}</b> <b>{{protocolo}}</b> <b>{{departamento}}</b> <b>{{atendente}}</b> <b>{{horario}}</b>. Também aceito {{client.name}}, {{contact.name}} e {{ticket.id}}.</p>
      ${MSG_ROTULO.map(([k,t,h])=>`<div class="field"><label>${t}</label><textarea data-m="${k}">${escapeHtml(m[k])}</textarea>${h?`<div class="muted">${h}</div>`:''}</div>`).join('')}</div></details>
    <details class="sec"><summary>🔑 Palavras-chave</summary><div><div id="flPal">${pal.map(linPal).join('')}</div><button class="btn btn-sm" id="flPalAdd">➕ Palavra-chave</button><p class="muted">Se a mensagem do cliente contiver uma das palavras, o bot responde na hora (e pode encaminhar ao departamento).</p></div></details>
    <details class="sec"><summary>⚙️ Opções</summary><div>
      <div class="field"><label>Dígito para voltar ao menu</label><input id="flVoltar" value="${escapeHtml(f.voltar_digito||'9')}" maxlength="3" style="width:80px;"></div>
      <div class="field"><label>Recomeçar com boas-vindas após (horas sem conversa)</label><input id="flHoras" type="number" min="1" max="168" value="${Number(f.reenviar_apos_horas)||12}" style="width:100px;"></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-bottom:6px;"><input type="checkbox" id="flEnc" ${f.enviar_encerramento?'checked':''}> Enviar mensagem de encerramento ao finalizar</label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;"><input type="checkbox" id="flEnq" ${f.enquete&&f.enquete.ativa?'checked':''}> Pedir nota de 1 a 5 (enquete de satisfação) ao finalizar</label></div></details>
    <details class="sec"><summary>👁 Pré-visualização</summary><div><div class="prev" id="flPrev"></div></div></details>
    <div class="rodape"><button class="btn btn-accent" id="flSalvar">Salvar</button></div>`;
  const ler = ()=>{
    const msgs = {}; c.querySelectorAll('[data-m]').forEach(t=>{ msgs[t.dataset.m] = t.value; });
    const menu = [...c.querySelectorAll('.fm')].map(r=>({ n:r.querySelector('.mn').value.trim(), departamento_id:r.querySelector('.md').value, rotulo:r.querySelector('.mr').value.trim() })).filter(x=>x.n&&x.departamento_id);
    const palavras = [...c.querySelectorAll('.fp')].map(r=>({ chaves:r.querySelector('.pk').value.split(',').map(x=>x.trim()).filter(Boolean), resposta:r.querySelector('.pr').value, departamento_id:r.querySelector('.pd').value||null })).filter(x=>x.chaves.length&&(x.resposta||x.departamento_id));
    return { ativo:document.getElementById('flAtivo').checked, empresa:document.getElementById('flEmp').value, voltar_digito:document.getElementById('flVoltar').value, reenviar_apos_horas:Number(document.getElementById('flHoras').value)||12, enviar_encerramento:document.getElementById('flEnc').checked, enquete:{ ativa:document.getElementById('flEnq').checked }, msgs, menu, palavras };
  };
  const prev = ()=>{
    const x = ler(); const v = t=> String(t||'').replace(/\{\{\s*(empresa|client\.name)\s*\}\}/g, x.empresa).replace(/\{\{\s*[\w.]+\s*\}\}/g,'…');
    const lista = x.menu.map(i=>`${i.n} - ${i.rotulo || ((deps.find(d=>d.id===i.departamento_id)||{}).nome||'')}`).join('\n');
    document.getElementById('flPrev').textContent = [v(x.msgs.boasvindas), lista, v(x.msgs.escolha)].filter(Boolean).join('\n\n');
  };
  const ligar = ()=>{ c.querySelectorAll('[data-x]').forEach(b=> b.onclick = ()=>{ b.closest('.fm,.fp').remove(); prev(); }); c.querySelectorAll('input,textarea,select').forEach(e=>{ e.oninput = prev; e.onchange = prev; }); };
  document.getElementById('flMenuAdd').onclick = ()=>{ const n = c.querySelectorAll('.fm').length+1; document.getElementById('flMenu').insertAdjacentHTML('beforeend', linMenu({ n:String(n), departamento_id:'' })); ligar(); prev(); };
  document.getElementById('flPalAdd').onclick = ()=>{ document.getElementById('flPal').insertAdjacentHTML('beforeend', linPal({})); ligar(); };
  if(document.getElementById('flBot')) document.getElementById('flBot').onchange = e=>{ fluxoBotId = e.target.value; abaFluxo(); };
  ligar(); prev();
  document.getElementById('flSalvar').onclick = async ()=>{
    const x = ler();
    if(x.ativo && !x.menu.length && !confirm('O menu está vazio: o bot só enviará a mensagem de boas-vindas. Continuar?')) return;
    const r = await botApi({ op:'fluxoSalvar', botId:fluxoBotId, fluxo:x });
    if(r&&r.ok){ showToast(x.ativo?'Salvo. Atendimento automático LIGADO.':'Salvo. Atendimento automático desligado.'); await carregarStatus(); abaFluxo(); } else showToast((r&&r.error)||'Erro ao salvar');
  };
}

const CRM_URL = SUPABASE_URL + "/functions/v1/crm-api";
async function crm(body){
  try{ const res = await fetch(CRM_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) }); return await res.json(); }
  catch(e){ return { error:String(e) }; }
}
const BOT_URL = SUPABASE_URL + "/functions/v1/atendimento-bot";
async function botApi(body){
  try{ const res = await fetch(BOT_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) }); return await res.json(); }
  catch(e){ return { error:String(e) }; }
}
const ETAPA_NOME = { novo:'Novo', em_negociacao:'Em negociação', orcamento_enviado:'Orçamento enviado', aguardando_pagamento:'Aguardando pagamento', ganho:'Ganho', perdido:'Perdido' };
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtData = d => { if(!d) return ''; const x = new Date(d.length===10 ? d+'T12:00:00' : d); return isNaN(x) ? String(d) : x.toLocaleDateString('pt-BR'); };
const prazoVencido = t => t.status==='aberta' && t.prazo && new Date(t.prazo) < new Date();
async function contarTarefas(){ const r = await crm({ op:'minhasTarefas' }); if(r && r.ok){ const n = r.data.filter(prazoVencido).length || ''; document.getElementById('n_tarefas').textContent = n; } }
let crmFicha = null, crmAba = 'resumo';
async function modalCRM(aba){
  crmAba = aba || 'resumo';
  if(!crmFicha || crmFicha._conv !== estado.atual.id || !aba){ abrirModal('<p class="muted">Carregando ficha…</p>'); document.getElementById('modalBox').classList.add('largo'); const r = await crm({ op:'ficha', conversaId: estado.atual.id }); if(!r || r.error){ abrirModal('<p>'+escapeHtml((r&&r.error)||'Erro ao carregar')+'</p><div class="rodape"><button class="btn" id="mCancel">Fechar</button></div>'); document.getElementById('mCancel').onclick = fecharModal; return; } r._conv = estado.atual.id; crmFicha = r; }
  const f = crmFicha; const c = f.cliente || {};
  const abas = [['resumo','📇 Ficha'],['tarefas',`✅ Tarefas (${f.tarefas.filter(t=>t.status==='aberta').length})`],['ops',`🧭 Oportunidades (${f.oportunidades.length})`],['notas',`📝 Notas (${f.notas.length})`]];
  let corpo = '';
  if(crmAba==='resumo'){
    const lista = (tit, arr, fn) => arr.length ? `<h4 style="margin:10px 0 4px;font-size:13px;">${tit} (${arr.length})</h4>` + arr.slice(0,8).map(fn).join('') : '';
    const linha = (a,b,c2) => `<div class="cartao" style="padding:6px 10px;margin-bottom:4px;"><div class="x">${escapeHtml(a)}</div><div class="x">${escapeHtml(b||'')}</div><div class="t" style="font-size:12.5px;">${escapeHtml(c2||'')}</div></div>`;
    corpo = `<div class="cartao"><div><div class="t">${escapeHtml(f.nome||'Contato sem cadastro')}</div><div class="x">${f.cliente?'✔ Cliente cadastrado':'⚠ Ainda não está no cadastro de clientes — use "👤 Cliente" para vincular'} ${c.cpf?'· CPF '+escapeHtml(c.cpf):''} ${c.dataNascimento?'· 🎂 '+escapeHtml(fmtData(c.dataNascimento)):''}</div><div class="x">${escapeHtml([c.endereco,c.numero,c.bairro,c.cidade].filter(Boolean).join(', '))}</div></div></div>
      <div class="resumo" style="border:1px solid var(--line);border-radius:10px;"><span>Compras: <b>${f.resumo.qtdCompras}</b></span><span>Vendas: <b>${brl(f.resumo.totalVendas)}</b></span><span>O.S.: <b>${brl(f.resumo.totalOS)}</b></span><span>Última: <b>${f.resumo.ultimaCompra?fmtData(f.resumo.ultimaCompra):'—'}</b></span></div>` +
      lista('Vendas', f.historico.vendas, v=>linha(fmtData(v.data)+' · '+(v.codigo||''), v.status+' · '+(v.vendedora||''), brl(v.valor))) +
      lista('Ordens de serviço', f.historico.os, v=>linha(fmtData(v.data)+' · '+(v.codigo||''), (v.descricao||'').slice(0,60)+' · '+v.status, v.valor?brl(v.valor):'')) +
      lista('Orçamentos', f.historico.orcamentos, v=>linha(fmtData(v.data), v.status, v.valor?brl(v.valor):'')) +
      lista('Reformas', f.historico.reformas, v=>linha('R'+String(v.numero).padStart(5,'0'), v.status, fmtData(v.criado))) +
      (f.conversas.length>1 ? `<h4 style="margin:10px 0 4px;font-size:13px;">Conversas (${f.conversas.length})</h4><div class="muted">${f.conversas.map(x=>(x.canal==='instagram'?'📷':'📱')+' '+escapeHtml(x.status)+' · '+fmtHora(x.ultima_mensagem_em)).join(' &nbsp;|&nbsp; ')}</div>`:'');
  }
  if(crmAba==='tarefas'){
    const funcs = estado.gestao ? (estado.funcionarios||[]) : [];
    corpo = `<div class="field"><label>Nova tarefa / retorno</label><input id="tkTit" placeholder="Ex.: Ligar para confirmar medida da aliança"><div style="display:flex;gap:6px;margin-top:6px;"><input type="datetime-local" id="tkPrazo">${funcs.length?`<select id="tkResp"><option value="">Eu mesma</option>${funcs.map(x=>`<option value="${x.id}">${escapeHtml(x.nome)}</option>`).join('')}</select>`:''}<button class="btn btn-accent" id="tkAdd">Criar</button></div></div>` +
      (f.tarefas.map(t=>`<div class="cartao"><div><div class="t" style="${t.status!=='aberta'?'text-decoration:line-through;opacity:.6':''}">${escapeHtml(t.titulo)}</div><div class="x" style="${prazoVencido(t)?'color:#dc2626;font-weight:700':''}">${t.prazo?'⏰ '+fmtHora(t.prazo):'sem prazo'} · ${escapeHtml(t.responsavel_nome||'')}</div></div>${t.status==='aberta'?`<button class="btn btn-sm" data-ok="${t.id}">✔ Feita</button>`:`<span class="muted">${t.status}</span>`}</div>`).join('') || '<p class="muted">Nenhuma tarefa para este cliente.</p>');
  }
  if(crmAba==='ops'){
    corpo = `<div class="field"><label>Nova oportunidade (negócio em andamento)</label><div style="display:flex;gap:6px;"><input id="opTit" placeholder="Ex.: Aliança de ouro 18k"><input id="opVal" type="number" placeholder="Valor" style="max-width:110px;"><button class="btn btn-accent" id="opAdd">Criar</button></div></div>` +
      (f.oportunidades.map(o=>`<div class="cartao"><div><div class="t">${escapeHtml(o.titulo)} ${o.valor?'· '+brl(o.valor):''}</div><div class="x">${escapeHtml(o.responsavel_nome||'')} · atualizado ${fmtData(o.updated_at)}${o.motivo_perda?' · motivo: '+escapeHtml(o.motivo_perda):''}</div></div><select data-mv="${o.id}">${Object.entries(ETAPA_NOME).map(([k,v])=>`<option value="${k}" ${o.etapa===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('') || '<p class="muted">Nenhuma oportunidade ainda.</p>');
  }
  if(crmAba==='notas'){
    corpo = `<div class="field"><label>Nova anotação</label><textarea id="ntTxt" rows="3" placeholder="Gosto da cliente, tamanho do dedo, preferências, combinados…"></textarea><div style="text-align:right;margin-top:6px;"><button class="btn btn-accent" id="ntAdd">Salvar nota</button></div></div>` +
      (f.notas.map(n=>`<div class="cartao" style="display:block;"><div class="x">${escapeHtml(n.autor_nome||'')} · ${fmtHora(n.created_at)}</div><div>${escapeHtml(n.texto).replace(/\n/g,'<br>')}</div></div>`).join('') || '<p class="muted">Sem anotações.</p>');
  }
  abrirModal(`<h2>CRM · ${escapeHtml(f.nome||nomeConv(estado.atual))}</h2><div class="abas">${abas.map(([k,t])=>`<button data-k="${k}" class="${k===crmAba?'on':''}">${t}</button>`).join('')}</div>${corpo}<div class="rodape"><button class="btn" id="mCancel">Fechar</button></div>`);
  document.getElementById('modalBox').classList.add('largo');
  document.getElementById('mCancel').onclick = fecharModal;
  document.querySelectorAll('.abas button').forEach(b=> b.onclick = ()=> modalCRM(b.dataset.k));
  const recarregar = async (ab)=>{ crmFicha = null; await modalCRM(ab||crmAba); contarTarefas(); };
  const alvo = { conversaId: estado.atual.id };
  if(document.getElementById('tkAdd')) document.getElementById('tkAdd').onclick = async ()=>{ const r = await crm({ op:'tarefaSalvar', ...alvo, titulo:document.getElementById('tkTit').value, prazo: document.getElementById('tkPrazo').value ? new Date(document.getElementById('tkPrazo').value).toISOString() : null, responsavelId: (document.getElementById('tkResp')||{}).value || undefined }); if(r&&r.ok){ showToast('Tarefa criada.'); recarregar('tarefas'); } else showToast((r&&r.error)||'Erro'); };
  document.querySelectorAll('[data-ok]').forEach(b=> b.onclick = async ()=>{ const r = await crm({ op:'tarefaStatus', id:b.dataset.ok, status:'feita' }); if(r&&r.ok) recarregar('tarefas'); else showToast((r&&r.error)||'Erro'); });
  if(document.getElementById('opAdd')) document.getElementById('opAdd').onclick = async ()=>{ const r = await crm({ op:'oportunidadeSalvar', ...alvo, titulo:document.getElementById('opTit').value, valor:document.getElementById('opVal').value }); if(r&&r.ok){ showToast('Oportunidade criada.'); recarregar('ops'); } else showToast((r&&r.error)||'Erro'); };
  document.querySelectorAll('[data-mv]').forEach(sel=> sel.onchange = async ()=>{ let motivo; if(sel.value==='perdido') motivo = prompt('Motivo da perda (opcional):')||''; const r = await crm({ op:'oportunidadeMover', id:sel.dataset.mv, etapa:sel.value, motivo }); if(r&&r.ok) recarregar('ops'); else showToast((r&&r.error)||'Erro'); });
  if(document.getElementById('ntAdd')) document.getElementById('ntAdd').onclick = async ()=>{ const r = await crm({ op:'notaAdd', ...alvo, texto:document.getElementById('ntTxt').value }); if(r&&r.ok){ showToast('Nota salva.'); recarregar('notas'); } else showToast((r&&r.error)||'Erro'); };
}
async function modalTarefas(todas){
  abrirModal('<p class="muted">Carregando…</p>'); document.getElementById('modalBox').classList.add('largo');
  const r = await crm({ op:'minhasTarefas', todas: !!todas }); if(!r||r.error){ fecharModal(); showToast((r&&r.error)||'Erro'); return; }

/* ================= PAINEL (DASHBOARD) ================= */
function temFx(){ const f=estado.fx; return !!(f.dep||f.at||f.st); }
function aplicarFx(lista){
  const f = estado.fx; if(!temFx()) return lista;
  return lista.filter(c=>{
    if(f.dep) { if(f.dep==='__none' ? !!c.departamento_id : c.departamento_id!==f.dep) return false; }
    if(f.at) { if(f.at==='__fila' ? !!c.atendente_id : c.atendente_id!==f.at) return false; }
    if(f.st==='aguardando' && c.status!=='aguardando') return false;
    if(f.st==='em_atendimento' && c.status!=='em_atendimento') return false;
    if(f.st==='nao_lidas' && !(c.nao_lidas>0)) return false;
    return true;
  });
}
function descFx(){
  const f=estado.fx; const p=[];
  if(f.dep) p.push(f.dep==='__none'?'sem departamento':(estado.departamentos.find(d=>d.id===f.dep)||{}).nome||'departamento');
  if(f.at) p.push(f.at==='__fila'?'na fila (sem atendente)':'atendente '+((estado.atendentes.find(a=>a.funcionario_id===f.at)||{}).nome||''));
  if(f.st) p.push({aguardando:'pendentes',em_atendimento:'em atendimento',nao_lidas:'com mensagens novas'}[f.st]);
  return p.join(' · ');
}
function atualizarFxInfo(){
  const el=document.getElementById('fxInfo');
  if(!temFx()){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='block'; el.innerHTML=`<span style="padding:0 12px;">🔎 ${escapeHtml(descFx())}<button class="btn btn-sm" id="fxLimpar">limpar</button></span>`;
  document.getElementById('fxLimpar').onclick = ()=>{ estado.fx={dep:'',at:'',st:''}; atualizarFxInfo(); carregarLista(); if(estado.painel) renderPainel(); };
}
function ativarAba(f){ estado.filtro=f; document.querySelectorAll('#filtros button').forEach(x=>x.classList.toggle('active',x.dataset.f===f)); }
function filtrarPeloPainel(fx){
  estado.fx = Object.assign({dep:'',at:'',st:''}, fx); ativarAba('todas'); atualizarFxInfo(); carregarLista();
  document.getElementById('app').classList.remove('ver-chat'); renderPainel();
}
async function abrirPainel(){
  estado.painel = true; estado.atual = null;
  document.getElementById('chatArea').style.display='none';
  const v = document.getElementById('chatVazio'); v.style.display='block'; v.classList.add('painel');
  document.getElementById('app').classList.add('ver-chat');
  await atualizarPainel();
}
async function atualizarPainel(){
  const r = await api({ op:'listarConversas', filtro:'todas', botId: estado.botId || undefined });
  if(r && r.ok){ estado.todas = r.data||[]; renderPainel(); }
}
function renderPainel(){
  if(!estado.painel) return;
  const L = estado.todas, f = estado.fx;
  const novas = c=>c.nao_lidas||0;
  const tot = a=>({ novas:a.reduce((s,c)=>s+novas(c),0), ativos:a.filter(c=>c.status==='em_atendimento').length, pend:a.filter(c=>c.status==='aguardando').length });
  const T = tot(L); const online = estado.atendentes.filter(a=>a.online).length;
  const pill = (n,cor,fx)=> n ? `<span class="pill ${cor}" data-fx='${JSON.stringify(fx).replace(/'/g,'&#39;')}'>${n}</span>` : `<span class="pill z">0</span>`;
  const linha = (nome, sub, a, base, sel)=>{ const t=tot(a); return `<tr class="lin ${sel?'sel':''}" data-fx='${JSON.stringify(base).replace(/'/g,'&#39;')}'><td>${escapeHtml(nome)}<div class="muted" style="font-weight:400;font-size:11px;">${sub}</div></td><td>${pill(t.novas,'g',Object.assign({},base,{st:'nao_lidas'}))}</td><td>${pill(t.ativos,'b',Object.assign({},base,{st:'em_atendimento'}))}</td><td>${pill(t.pend,'o',Object.assign({},base,{st:'aguardando'}))}</td></tr>`; };
  const deps = estado.departamentos.filter(d=>d.ativo);
  const semDep = L.filter(c=>!c.departamento_id);
  const ats = estado.atendentes.slice().sort((a,b)=>(b.online?1:0)-(a.online?1:0)||String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const filaSem = L.filter(c=>!c.atendente_id);
  const kp = (rot,val,fx)=>`<div class="kpi ${fx?'cl':''}" ${fx?`data-fx='${JSON.stringify(fx)}'`:''}><span>${rot}</span><b>${val}</b></div>`;
  const box = document.getElementById('chatVazio');
  box.innerHTML = `<h2 style="margin:0 0 10px;font-size:16px;">📊 Painel de atendimento <span class="muted" style="font-size:12px;font-weight:400;">· clique em uma linha ou número para ver as conversas ao lado</span></h2>
    <div class="kpis">${kp('Atendentes online',online)}${kp('Mensagens novas',T.novas,{st:'nao_lidas'})}${kp('Atendimentos ativos',T.ativos,{st:'em_atendimento'})}${kp('Pendentes (fila)',T.pend,{st:'aguardando'})}${kp('Sem atendente',filaSem.length,{at:'__fila'})}${kp('Conversas abertas',L.length,{})}</div>
    <table class="ptab"><thead><tr><th>Departamento</th><th>Novas msgs</th><th>Ativos</th><th>Pendentes</th></tr></thead><tbody>
      ${deps.map(d=>linha(d.nome, (estado.bots.find(b=>b.id===d.bot_id)||{}).nome||'todos os bots', L.filter(c=>c.departamento_id===d.id), {dep:d.id}, f.dep===d.id && !f.st)).join('')}
      ${linha('Sem departamento','ainda não classificadas', semDep, {dep:'__none'}, f.dep==='__none' && !f.st)}
    </tbody></table>
    <table class="ptab"><thead><tr><th>Atendente</th><th>Novas msgs</th><th>Ativos</th><th>Pendentes</th></tr></thead><tbody>
      ${ats.map(a=>linha(a.nome, a.online?'🟢 online':'⚪ offline', L.filter(c=>c.atendente_id===a.funcionario_id), {at:a.funcionario_id}, f.at===a.funcionario_id && !f.st)).join('')}
      ${linha('Fila (sem atendente)','aguardando alguém assumir', filaSem, {at:'__fila'}, f.at==='__fila' && !f.st)}
    </tbody></table>`;
  box.querySelectorAll('[data-fx]').forEach(el=> el.addEventListener('click', ev=>{ ev.stopPropagation(); filtrarPeloPainel(JSON.parse(el.getAttribute('data-fx'))); }));
}

async function enviarTexto(){
  const t = document.getElementById('texto'); const texto = t.value.trim(); if(!texto || !estado.atual) return;
  const btn = document.getElementById('btnEnviar'); btn.disabled = true; t.value='';
  const r = await api({ op:'enviarTexto', conversaId: estado.atual.id, texto });
  btn.disabled = false;
  if(!r || !r.ok){ showToast(r && r.error || 'Não enviou'); t.value = texto; return; }
  await atualizarMensagens(); if(!estado.mensagens.some(m=>m.texto===texto && m.direcao==='out')){ estado.mensagens.push({ id:'tmp'+Date.now(), direcao:'out', tipo:'texto', texto, autor_nome:estado.meuNome, status:'enviada', enviada_em:new Date().toISOString() }); renderMsgs(true); }
  carregarLista(true);
}
function enviarArquivo(file){
  if(!file || !estado.atual) return;
  if(!podeResponder()){ showToast('Esta conversa está com outro atendente.'); return; }
  if(file.size > 15*1024*1024){ showToast('Arquivo grande demais (máx. 15 MB).'); return; }
  const conversaId = estado.atual.id, ehImg = (file.type||'').startsWith('image/'), url = ehImg ? URL.createObjectURL(file) : '';
  abrirModal(`<h2>Enviar ${ehImg?'foto':'arquivo'} para ${escapeHtml(nomeConv(estado.atual))}</h2>
    <div class="previa">${ehImg ? `<img src="${url}" alt="">` : `📎 <b>${escapeHtml(file.name||'Arquivo')}</b> <span class="muted">(${(file.size/1024/1024).toFixed(1)} MB)</span>`}</div>
    <div class="field"><label>Legenda (opcional)</label><input id="aLeg"></div>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-accent" id="mOk">Enviar</button></div>`);
  const fechar = ()=>{ if(url) try{ URL.revokeObjectURL(url); }catch(e){} fecharModal(); };
  const ok = ()=>{ const legenda = document.getElementById('aLeg').value.trim(); fechar(); enviarArquivoAgora(file, legenda, conversaId); };
  document.getElementById('mCancel').onclick = fechar;
  document.getElementById('mOk').onclick = ok;
  const leg = document.getElementById('aLeg'); leg.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } }); leg.focus();
}
async function enviarArquivoAgora(file, legenda, conversaId){
  const base64 = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.split(',')[1]); fr.onerror=rej; fr.readAsDataURL(file); });
  showToast('Enviando…');
  const r = await api({ op:'enviarMidia', conversaId, base64, mimetype: file.type || 'application/octet-stream', nome: file.name, legenda: legenda||'' });
  if(!r || !r.ok){ showToast(r && r.error || 'Não enviou'); return; }
  showToast('Enviado.');
  if(estado.atual && estado.atual.id===conversaId) await abrirConversa(conversaId);
  carregarLista(true);
}
/* Respostas rápidas pelo teclado: digite "/" no campo da mensagem */
function atualizarSugestoes(){
  const t = document.getElementById('texto'), box = document.getElementById('sugestoes'), v = t.value;
  box._l = [];
  if(v[0]!=='/' || v.includes('\n') || !estado.respostas.length){ box.style.display='none'; return; }
  const termo = v.slice(1).toLowerCase();
  const l = estado.respostas.filter(r=> (r.titulo+' '+r.texto).toLowerCase().includes(termo)).slice(0,6);
  if(!l.length){ box.style.display='none'; return; }
  box._l = l;
  box.innerHTML = l.map((r,i)=>`<button type="button" data-i="${i}"><b>${escapeHtml(r.titulo)}</b> <span>${escapeHtml(r.texto)}</span></button>`).join('');
  box.style.display = 'block';
  box.querySelectorAll('button').forEach(b=> b.onclick = ()=> usarSugestao(+b.dataset.i));
}
function usarSugestao(i){
  const t = document.getElementById('texto'), box = document.getElementById('sugestoes'), r = (box._l||[])[i]; if(!r) return false;
  t.value = r.texto; box._l = []; box.style.display='none'; t.focus(); return true;
}

let fotosRodando=false;
async function sincronizarFotos(){
  if(fotosRodando || !__gatewaySenha) return; fotosRodando=true;
  try{
    for(let i=0;i<6;i++){
      const res = await fetch(SUPABASE_URL + '/functions/v1/atendimento-fotos', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, max: 12 }) });
      const r = await res.json().catch(()=>null);
      if(!r || !r.ok) break;
      if(r.feitas) carregarLista(true);
      if(!r.feitas) break;
    }
  }catch(e){ console.error('fotos', e); }
  fotosRodando=false;
}

    try{ await carregarLista(true); await atualizarMensagens(); if(estado.painel) await atualizarPainel(); }catch(e){ console.error('poll',e); }

}

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
