<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://wxiokmqnjtgbejgoepch.supabase.co" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
:root{
  --bg:#F6F8FA;--surface:#FFFFFF;--surface-2:#F0F3F6;--ink:#1B2733;--ink-soft:#3E4C59;--ink-faint:#5B6B7A;
  --line:#E3E8EE;--accent:#1F6F8B;--accent-soft:#E6F1F5;--ok:#1E8E5A;--ok-soft:#E7F5EE;--danger:#B42318;--danger-soft:#FDECEA;
  --wait:#B7791F;--wait-soft:#FDF3E1;--bubble-in:#FFFFFF;--bubble-out:#E8F3E8;--radius:10px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
button,input,textarea,select{font-family:inherit;font-size:13.5px;}
button{cursor:pointer;}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--accent);} .btn:disabled{opacity:.5;cursor:default;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
.btn-sm{padding:5px 9px;font-size:12px;}
.muted{color:var(--ink-faint);font-size:12px;}
.app{display:flex;height:100vh;}
/* ---- lista ---- */
.lista{width:340px;min-width:280px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;}
.lista-top{padding:10px 12px;border-bottom:1px solid var(--line);}
.lista-top h1{margin:0 0 8px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.conexao{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);}
.conexao.on{background:var(--ok-soft);color:var(--ok);} .conexao.off{background:var(--danger-soft);color:var(--danger);}
.filtros{display:flex;gap:4px;margin-bottom:8px;}
.filtros button{flex:1;padding:6px 4px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-soft);}
.filtros button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.filtros button .n{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.08);font-size:10.5px;margin-left:3px;}
.filtros button.active .n{background:rgba(255,255,255,.25);}
.busca{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
.conversas{flex:1;overflow-y:auto;}
.conv{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;}
.conv:hover{background:var(--surface-2);} .conv.active{background:var(--accent-soft);}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;font-size:15px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.conv .info{flex:1;min-width:0;}
.conv .l1{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
.conv .nome{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .hora{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.conv .l2{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:2px;}
.conv .prev{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.conv .quem{font-size:11px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tagchip{display:inline-block;font-size:10.5px;background:var(--surface-2);color:var(--ink-soft);border-radius:999px;padding:1px 7px;margin-right:4px;}
/* ---- chat ---- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:15px;text-align:center;padding:20px;}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;}
.chat-head .titulo{flex:1;min-width:160px;}
.chat-head .titulo b{font-size:14.5px;display:block;}
.chat-head .acoes{display:flex;gap:6px;flex-wrap:wrap;}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);}
.bubble{max-width:72%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.05);position:relative;word-wrap:break-word;white-space:pre-wrap;}
.bubble.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:3px;}
.bubble.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:3px;}
.bubble.sis{align-self:center;background:var(--wait-soft);color:var(--wait);font-size:12px;border-radius:999px;padding:4px 12px;max-width:90%;}
.bubble .meta{font-size:10.5px;color:var(--ink-faint);margin-top:4px;text-align:right;}
.bubble .autor{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px;}
.bubble img{max-width:100%;border-radius:8px;display:block;margin-top:4px;cursor:zoom-in;}
.bubble audio,.bubble video{max-width:100%;margin-top:4px;display:block;}
.bubble .doc{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;background:var(--surface-2);border-radius:8px;margin-top:4px;text-decoration:none;color:var(--ink);font-weight:600;}
.compose{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;}
.compose .linha{display:flex;gap:8px;align-items:flex-end;}
.compose textarea{flex:1;min-height:42px;max-height:140px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;resize:vertical;}
.compose .rapidas{margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;}
.compose .rapidas button{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);}
.aviso-bloqueado{background:var(--wait-soft);color:var(--wait);padding:8px 12px;font-size:12.5px;text-align:center;}
/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px;}
.modal h2{margin:0 0 12px;font-size:16px;}
.field{margin-bottom:10px;} .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
.modal .rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
.resumo{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap;font-size:12px;}
.resumo span b{color:var(--accent);}
.res-item{display:flex;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;}
.res-item .t{font-weight:700;font-size:13px;} .res-item .x{font-size:12px;color:var(--ink-soft);white-space:pre-wrap;}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;display:none;z-index:99;}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;}
.zoom img{max-width:95vw;max-height:95vh;}
.sep-dia{align-self:center;background:var(--surface);color:var(--ink-faint);font-size:11px;font-weight:700;border-radius:999px;padding:3px 12px;margin:6px 0;box-shadow:0 1px 1px rgba(0,0,0,.05);}
.mais-antigas{align-self:center;}
.bubble a.lnk{color:#2563EB;word-break:break-all;}
.bubble .meta .lida{color:#1D8FE1;font-weight:700;}
.espera{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-right:4px;background:var(--wait-soft);color:var(--wait);}
.espera.alta{background:var(--danger-soft);color:var(--danger);}
.sugestoes{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden;background:var(--surface);}
.sugestoes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:7px 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sugestoes button:last-child{border-bottom:0;} .sugestoes button:hover,.sugestoes button:first-child{background:var(--accent-soft);}
.sugestoes button span{color:var(--ink-soft);}
.chat.arrastando{outline:3px dashed var(--accent);outline-offset:-8px;}
.previa{text-align:center;margin-bottom:10px;} .previa img{max-width:100%;max-height:260px;border-radius:8px;}
.tag-sug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag-sug button{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);}
.tag-sug button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;margin-top:8px;}
.mbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;} .mbtn .ic{font-size:18px;line-height:1;}
.mbtn:hover{background:var(--surface-2);} .mbtn .n{position:absolute;top:2px;right:4px;background:#dc2626;color:#fff;border-radius:999px;min-width:16px;padding:0 4px;font-size:10px;}
.mbtn .n:empty{display:none;}
.voltar-lista{display:none;}
.chat-vazio.painel{display:block;overflow:auto;text-align:left;padding:14px 18px;color:var(--ink);font-size:13px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
.kpi{background:var(--accent);color:#fff;border-radius:10px;padding:10px 12px;cursor:default;} .kpi b{display:block;font-size:22px;line-height:1.1;margin-top:4px;} .kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;opacity:.9;}
.kpi.cl{cursor:pointer;}
.ptab{width:100%;border-collapse:collapse;margin-bottom:16px;} .ptab th{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:6px 4px;border-bottom:1px solid var(--line);} .ptab th:first-child{text-align:left;}
.ptab td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center;} .ptab td:first-child{text-align:left;font-weight:700;}
.ptab tr.lin{cursor:pointer;} .ptab tr.lin:hover{background:var(--surface-2);} .ptab tr.sel{background:var(--surface-2);}
.pill{display:inline-block;min-width:34px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;} .pill.z{background:transparent;color:var(--ink-faint);font-weight:400;cursor:default;}
.pill.g{background:#16a34a;} .pill.b{background:#2563eb;} .pill.o{background:#f59e0b;} .pill.r{background:#dc2626;}
.fx{display:none;margin:6px 0 0;font-size:12px;} .fx button{margin-left:6px;}
.modal.largo{max-width:960px;}
.tb{width:100%;border-collapse:collapse;font-size:12px;}.tb th,.tb td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;}.tb th{font-size:11px;color:var(--ink-soft);}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;} .abas button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:700;}
.abas button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.cartao{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;}
.cartao .t{font-weight:700;} .cartao .x{font-size:12px;color:var(--ink-soft);}
.hor-dia{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px;align-items:center;margin-bottom:4px;font-size:12.5px;}
.hor-dia input[type=time]{padding:4px 6px;border:1px solid var(--line);border-radius:6px;}
.dep-chk{display:flex;gap:10px;flex-wrap:wrap;} .dep-chk label{font-weight:400;display:flex;gap:4px;align-items:center;font-size:12.5px;}
.on-off{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);}
.on-off.on{background:#16a34a;color:#fff;border-color:#16a34a;}
@media(max-width:760px){
  .app.ver-chat .lista{display:none;} .app:not(.ver-chat) .chat{display:none;}
  .lista{width:100%;} .voltar-lista{display:inline-block;}
  .bubble{max-width:88%;}
}
.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--border,#d9d9d9);border-radius:8px;padding:8px 10px;font:inherit;min-height:64px;resize:vertical;background:var(--surface,#fff);color:inherit}
.sec{border:1px solid var(--border,#e5e5e5);border-radius:10px;margin:10px 0;overflow:hidden}
.sec>summary{cursor:pointer;padding:10px 12px;font-weight:600;background:rgba(127,127,127,.08)}
.sec>div{padding:10px 12px}
.lin{display:grid;grid-template-columns:56px 1fr 1fr 32px;gap:6px;margin-bottom:6px;align-items:center}
.lin input,.lin select{width:100%;box-sizing:border-box}
.kw{border:1px dashed var(--border,#ccc);border-radius:8px;padding:8px;margin-bottom:8px}
.prev{white-space:pre-wrap;background:#dcf8c6;color:#111;border-radius:10px;padding:10px 12px;font-size:13px;max-width:380px}
.int-wrap{display:flex;gap:0;border:1px solid var(--line,#e5e5e5);border-radius:12px;overflow:hidden;height:calc(100vh - 90px);min-height:380px;background:var(--surface,#fff);color:var(--ink,#111)}
.int-lista{width:260px;max-width:42%;border-right:1px solid var(--line,#e5e5e5);display:flex;flex-direction:column}
.int-lista .top{padding:10px;border-bottom:1px solid var(--line,#e5e5e5);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.int-lista .itens{overflow:auto;flex:1}
.int-it{padding:9px 10px;border-bottom:1px solid var(--line,#eee);cursor:pointer;display:flex;gap:8px;align-items:center}
.int-it:hover,.int-it.on{background:rgba(37,99,235,.09)}
.int-it .nm{font-weight:600;font-size:13px}.int-it .pv{font-size:11.5px;color:var(--ink-faint,#777);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.int-it .bd{margin-left:auto;background:#e11d48;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.int-conv{flex:1;display:flex;flex-direction:column;min-width:0}
.int-conv .hd{padding:10px 12px;border-bottom:1px solid var(--line,#e5e5e5);font-weight:700}
.int-conv .ms{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.int-m{max-width:78%;padding:7px 10px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;background:rgba(127,127,127,.14);align-self:flex-start}
.int-m.eu{align-self:flex-end;background:#dcf8c6;color:#111}
.int-m .q{font-size:10.5px;opacity:.7;margin-bottom:2px}
.int-conv .cp{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line,#e5e5e5)}
.int-conv .cp textarea{flex:1;min-height:40px;max-height:110px}
#bannerInt{position:fixed;top:12px;right:12px;z-index:9999;max-width:330px;background:#111827;color:#fff;border-left:5px solid #22c55e;border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer;display:none;font-size:14px;animation:binS .25s ease-out}
#bannerInt b{display:block;margin-bottom:3px;font-size:13px;color:#86efac}
@keyframes binS{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
/* ===== Agenda: quadro de tarefas, calendário e minhas vias ===== */
.ag-wrap{display:flex;flex-direction:column;gap:12px;min-height:100%;}
.ag-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ag-top h2{margin:0;font-size:18px;font-weight:750;margin-right:auto;}
.ag-abas{display:inline-flex;gap:3px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;}
.ag-abas button{border:none;background:transparent;color:var(--ink-faint);font-weight:600;font-size:13px;padding:6px 13px;border-radius:8px;cursor:pointer;}
.ag-abas button.on{background:var(--accent);color:#fff;font-weight:700;}
.ag-filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.ag-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.ag-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.ag-legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-faint);margin-left:auto;}
.ag-legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
.ag-quadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;}
@media(max-width:900px){.ag-quadro{grid-template-columns:minmax(0,1fr);}}
.ag-col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;}
.ag-col.sobre{outline:2px dashed var(--accent);outline-offset:-4px;}
.ag-col h3{margin:0 2px 2px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:flex;justify-content:space-between;}
.ag-card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:10px;padding:9px 10px;cursor:grab;box-shadow:0 1px 2px rgba(16,24,40,.06);}
.ag-card:hover{box-shadow:0 4px 12px -4px rgba(16,24,40,.18);}
.ag-card.arrastando{opacity:.5;}
.ag-card.feito .ag-tt{text-decoration:line-through;color:var(--ink-faint);}
.ag-card .ag-tt{font-weight:700;font-size:13.5px;word-break:break-word;}
.ag-card .ag-ds{font-size:12px;color:var(--ink-soft);margin-top:3px;white-space:pre-wrap;word-break:break-word;max-height:3.9em;overflow:hidden;}
.ag-card .ag-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:11px;color:var(--ink-faint);}
.ag-tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;color:#fff;background:var(--tc);}
.ag-cls{display:inline-block;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;border:1px solid currentColor;}
.ag-card .ag-mv{display:flex;gap:4px;margin-top:6px;justify-content:flex-end;}
.ag-card .ag-mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;}
.ag-vazio{font-size:12px;color:var(--ink-faint);text-align:center;padding:14px 4px;}
.t-privada{--tc:#7C3AED;} .t-loja{--tc:#0F766E;} .t-compartilhada{--tc:#EA580C;}
.c-urgente{color:#B42318;} .c-importante{color:#B7791F;} .c-normal{color:#1F6F8B;} .c-baixa{color:#5B6B7A;}
.ag-cal-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ag-cal-top b{font-size:15px;min-width:150px;text-align:center;}
.ag-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.ag-cal .dow{font-size:11px;font-weight:700;color:var(--ink-faint);text-align:center;padding:4px 0;text-transform:uppercase;}

/* Conversa interna na lista principal: faixa azul + etiqueta "Interno" */
.conv.interno{background:#EEF4FF;box-shadow:inset 5px 0 0 #2563EB;}
.conv.interno.active{background:#DCE7FD;}

/* ===== VISUAL v2 — mais limpo, itens maiores ===== */
:root{--bg:#F6F8FA;--surface-2:#F0F3F6;--line:#E3E8EE;--accent-soft:#E6F1F5;--ink-soft:#3E4C59;--ink-faint:#5B6B7A;--bubble-out:#E6F1F5;--radius:12px;--sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);}
body{font-size:14.5px;letter-spacing:-.005em;}
button,input,textarea,select{font-size:14px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#CBD3DC;border-radius:9px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#AEB9C5;background-clip:content-box;border:2px solid transparent}
.btn{min-height:38px;padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:650;transition:background-color .12s,border-color .12s,box-shadow .12s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.btn-accent{box-shadow:0 1px 2px rgba(31,111,139,.35);} .btn-accent:hover{background:#17566C;border-color:#17566C;}
.btn-danger{background:var(--danger-soft);} .btn-danger:hover{background:#f6d6d6;border-color:transparent;}
.btn-sm{min-height:32px;padding:5px 11px;font-size:12.5px;border-radius:9px;}
.muted{font-size:12.5px;}
/* lista */
.lista{width:392px;min-width:320px;box-shadow:var(--sombra);z-index:2;}
.lista-top{padding:16px 16px 12px;}
.lista-top h1{font-size:19px;margin-bottom:12px;font-weight:750;}
.conexao{font-size:11.5px;padding:3px 10px;}
.filtros{background:var(--surface-2);padding:4px;border-radius:12px;gap:2px;margin-bottom:12px;}
.filtros button{border:0;background:transparent;padding:9px 4px;font-size:13px;border-radius:9px;transition:background-color .12s;}
.filtros button:hover{background:rgba(31,111,139,.07);}
.filtros button.active{background:var(--accent);box-shadow:0 1px 3px rgba(31,111,139,.35);}
.busca{padding:11px 14px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;font-size:14px;} .busca:focus{background:#fff;border-color:var(--accent);outline:none;}
.menu-grid{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.mbtn{padding:10px 4px 8px;border-radius:12px;gap:4px;font-size:12px;border:1px solid var(--line);transition:background-color .12s,border-color .12s,transform .12s;}
.mbtn .ic{font-size:21px;} .mbtn:hover{background:var(--accent-soft);border-color:var(--accent);} .mbtn:active{transform:scale(.97);}
.mbtn .n{top:3px;right:5px;min-width:18px;font-size:10.5px;line-height:16px;}
#btnNova{min-height:44px;border-radius:12px;font-size:14.5px;margin-top:12px!important;}
.conv{padding:14px 16px;gap:13px;border-bottom:1px solid #EEF1F4;position:relative;transition:background-color .1s;}
.conv.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);}
.avatar{width:50px;height:50px;font-size:16px;background:var(--accent-soft);}
.conv .nome{font-size:15px;} .conv .hora{font-size:11.5px;} .conv .prev{font-size:13.5px;}
.conv .quem{font-size:11.5px;margin-top:4px;}
.badge{min-width:22px;height:22px;background:var(--accent);font-size:11.5px;}
.tagchip{font-size:11px;padding:2px 8px;background:var(--surface-2);}
.resumo{padding:10px 16px;font-size:12.5px;}
/* chat */
.chat{background:var(--bg);}
.chat-head{padding:14px 22px;gap:14px;box-shadow:var(--sombra);position:relative;z-index:1;}
.chat-head .titulo b{font-size:16.5px;}
.chat-head .acoes{gap:6px;}
.msgs{padding:22px 26px;gap:8px;background:var(--bg);}
/* identidade da instância: cor de fundo na lista + marca d'água no chat */
.conv.inst-reforma{background:#F6EEF8;box-shadow:inset 5px 0 0 #7B2D8E;}
.conv.inst-vilaca{background:#FBF4E2;box-shadow:inset 5px 0 0 #B8892B;}
.conv.inst-reforma.active{background:#EBDDF0;}.conv.inst-vilaca.active{background:#F5E7C4;}
.msgs.inst-reforma,.msgs.inst-vilaca{background-repeat:no-repeat;background-position:center;background-size:min(70%,520px) auto;}
.msgs.inst-reforma{background-color:#FAF6FB;}.msgs.inst-vilaca{background-color:#FDFAF2;}
.inst-pop{position:fixed;inset:0;background:rgba(20,10,25,.45);display:flex;align-items:center;justify-content:center;z-index:9999;}
.inst-pop .c{background:#fff;border-radius:16px;padding:26px 28px;max-width:380px;width:90%;text-align:center;border-top:10px solid var(--ic);box-shadow:0 20px 50px rgba(0,0,0,.3);}
.inst-pop .n{font-size:22px;font-weight:800;color:var(--ic);margin:8px 0 6px;letter-spacing:.5px;}
.inst-pop button{margin-top:16px;background:var(--ic);color:#fff;border:0;border-radius:10px;padding:10px 26px;font-size:15px;font-weight:700;cursor:pointer;}
.bubble{max-width:68%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 2px rgba(40,20,35,.07);}
.bubble.in{border-bottom-left-radius:5px;} .bubble.out{border-bottom-right-radius:5px;}
.bubble.sis{font-size:12.5px;padding:5px 14px;box-shadow:none;}
/* nota interna (nunca enviada ao cliente) */
.bubble.interna{align-self:center;background:#fef9c3;color:#713f12;border:1.5px dashed #ca8a04;max-width:85%;box-shadow:none;}
.bubble.interna .autor{color:#a16207;font-weight:700;}
#btnInterna.on{background:#fef08a;border-color:#ca8a04;color:#713f12;}
#texto.modo-interna{background:#fefce8;border:1.5px dashed #ca8a04;}
.bubble .meta{font-size:11px;} .bubble .autor{font-size:12px;}
.compose{padding:14px 20px 16px;border-top:1px solid var(--line);}
.compose .linha{gap:10px;}
.compose textarea{min-height:46px;padding:12px 16px;border-radius:23px;background:var(--surface-2);border:1px solid transparent;resize:none;line-height:1.4;} .compose textarea:focus{background:#fff;border-color:var(--accent);outline:none;}
#btnEnviar{min-height:46px;border-radius:23px;padding:0 22px;font-size:14px;}
#btnAnexo{min-height:46px;width:46px;border-radius:50%;padding:0;font-size:18px;}
.compose .rapidas button{font-size:12.5px;padding:5px 12px;transition:background-color .12s;} .compose .rapidas button:hover{background:var(--accent-soft);border-color:var(--accent);}
.chat-vazio{font-size:16px;line-height:1.6;}
/* modais */
.modal-bg{background:rgba(30,12,22,.45);}
.modal{border-radius:18px;padding:26px;max-width:560px;box-shadow:0 24px 70px rgba(30,12,22,.28);}
.modal.largo{max-width:1020px;}
.modal h2{font-size:19px;margin-bottom:16px;font-weight:750;}
.field{margin-bottom:14px;} .field label{font-size:12.5px;margin-bottom:6px;}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:10px;font-size:14px;background:#fff;} .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,139,.12);}
.modal .rodape{margin-top:18px;gap:10px;padding-top:4px;}
.abas{gap:6px;margin-bottom:16px;background:var(--surface-2);padding:5px;border-radius:12px;}
.abas button{border:0;background:transparent;padding:9px 15px;font-size:13.5px;border-radius:10px;transition:background-color .12s;} .abas button:hover{background:rgba(31,111,139,.08);}
.abas button.on{background:var(--accent);box-shadow:0 1px 3px rgba(31,111,139,.35);}
.cartao{border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;} .cartao .t{font-size:14.5px;} .cartao .x{font-size:13px;}
.sec{border-radius:12px;margin:12px 0;} .sec>summary{padding:13px 16px;font-size:14px;} .sec>div{padding:14px 16px;}
.tb{font-size:13px;} .tb th{padding:8px 10px;font-size:11.5px;background:var(--surface-2);} .tb td{padding:10px;} .tb tbody tr:hover{background:var(--surface-2);}
.res-item{border-radius:12px;padding:11px 12px;}
.toast{padding:12px 20px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);}
.kpi{border-radius:12px;padding:14px 16px;} .kpi b{font-size:26px;}
.tag-sug button{font-size:12.5px;padding:5px 12px;}
.on-off{padding:5px 12px;font-size:12.5px;}

.conv .prev{background:none;padding:0;border-radius:0;max-width:none;color:var(--ink-soft);white-space:nowrap;}
.voltar-lista{display:none!important;}
@media(max-width:760px){.voltar-lista{display:inline-flex!important;}}
@media(max-width:760px){.lista{width:100%;}.msgs{padding:14px;}.modal{padding:20px;}.menu-grid{grid-template-columns:repeat(4,1fr);}.bubble{max-width:90%;}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Agente de IA ===== */
.ia-bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ia-bar .btn{min-height:30px;padding:4px 11px;font-size:12.5px;border-radius:999px;}
.compose textarea.ia-sug{border-color:#9b5de5;background:#f7f1fd;}
.ia-res{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin-bottom:12px;}
.ia-res b{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding-top:2px;}
.ia-k{display:block;}
.ia-k .x{white-space:pre-wrap;max-height:4.5em;overflow:hidden;}
.ia-pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--surface-2);color:var(--ink-soft);}
.ia-pill.ap{background:#efe4fb;color:#6b21a8;} .ia-pill.off{background:var(--danger-soft);color:var(--danger);}
.ia-sw{display:flex;gap:8px;align-items:flex-start;font-weight:400!important;margin-bottom:8px;font-size:13.5px;}
.ia-sw span{display:block;} .ia-sw small{color:var(--ink-faint);display:block;}

/* ===== Painel de atendimento (visual didático) ===== */
.chat-vazio.painel{background:var(--bg);padding:18px 22px;}
.pn{max-width:1100px;margin:0 auto;}

.pn-head h2{margin:0;font-size:20px;} .pn-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13px;}

.pn-v{font-size:28px;font-weight:800;line-height:1;color:var(--c);} .pn-v small{font-size:13px;color:var(--ink-faint);font-weight:600;}
.pn-r{font-weight:700;font-size:13.5px;margin-top:3px;} .pn-e{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.pn-lojas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.pn-loja{background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;}
.pn-loja .pn-lt{color:var(--c);font-weight:800;letter-spacing:.4px;}
.pn-lojan{display:flex;gap:14px;margin-top:6px;font-size:12.5px;color:var(--ink-soft);} .pn-lojan b{font-size:18px;color:var(--ink);}

.pn-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;} .pn-cols .pn-box{margin-top:0;}
.pn-bt{font-weight:800;font-size:14px;margin-bottom:6px;}
.pn-lin{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line);}
.pn-lin:last-child{border-bottom:0;} .pn-lin:hover,.pn-lin.sel{background:var(--surface-2);}
.pn-av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;position:relative;}
.pn-av.on{background:#dcfce7;color:#166534;} .pn-av.fila{background:#fef3c7;}
.pn-ln{flex:1;min-width:0;} .pn-lt{font-weight:700;font-size:13.5px;} .pn-ls{font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:5px;}
.pn-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;} .pn-dot.on{background:#22c55e;}
.pn-lc{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.pn-chip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);cursor:pointer;white-space:nowrap;} .pn-chip b{font-size:13px;}
.pn-chip:hover{background:var(--c);color:#fff;}
.pn-zero{font-size:12px;color:var(--ink-faint);}
.pn-ks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}

.pn-ki{font-size:22px;} .pn-kv{font-size:22px;font-weight:800;line-height:1.1;} .pn-kv small{font-size:11px;color:var(--ink-faint);font-weight:600;}
.pn-kt{font-weight:700;font-size:12.5px;} .pn-ke{font-size:11px;color:var(--ink-faint);}

.pn-bar{flex:1;text-align:center;font-size:10px;color:var(--ink-faint);} .pn-bw{height:80px;display:flex;align-items:flex-end;}

.pn-tab{width:100%;border-collapse:collapse;font-size:13px;} .pn-tab th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-faint);padding:6px 4px;border-bottom:1px solid var(--line);}

function tocarSom(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [880, 1175].forEach((f,i)=>{ const o = audioCtx.createOscillator(), g = audioCtx.createGain(), ini = t + i*0.16; o.type='sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, ini); g.gain.exponentialRampToValueAtTime(0.25, ini+0.02); g.gain.exponentialRampToValueAtTime(0.0001, ini+0.15); o.connect(g); g.connect(audioCtx.destination); o.start(ini); o.stop(ini+0.16); });
  }catch(e){}
}
function tituloAba(total){
  try{ const d = window.top.document; if(tituloOriginal===null) tituloOriginal = d.title.replace(/^\(\d+\)\s*/,''); d.title = total ? `(${total}) ${tituloOriginal}` : tituloOriginal; }catch(e){}
}

function detectarNovas(listas){

}

function botChip(c){ return ''; } // identificação da instância agora é pela cor de fundo (instInfo)

/* ================= LISTA ================= */
async function carregarLista(silencioso){
  const r = await api({ op:'listarConversas', filtro: estado.filtro, busca: estado.busca, canal: estado.canal || undefined, botId: estado.botId || undefined, departamentoId: estado.depId || undefined });
  if(!r){ if(!silencioso) showToast('Erro ao carregar'); return; }
  if(r.error){
    // Sessão expirada: parar polling e pedir novo login
    if(r.error === 'não autorizado' || String(r.error).includes('autorizado')){
      if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; }
      if(EMBEDDED) parent.postMessage({ type:'sessaoExpirada', modulo:'atendimento' }, '*');
      return;
    }
    if(!silencioso) showToast(r.error || 'Erro ao carregar');
    return;
  }
  estado.conversas = aplicarBl(aplicarFx(r.data || []));
  renderLista();
  contadores();
}
async function contadores(){
  // Reaproveita a lista já carregada quando ela é exatamente a de "Minhas" ou a da "Fila" (uma chamada a menos a cada ciclo)
  const limpa = !estado.busca && !estado.canal && !estado.botId && !estado.depId && !temFx();
  const agoraC = Date.now(); const reuso = !limpa && contadores._r && (agoraC - contadores._t) < 30000;
  const pronta = f => (limpa && estado.filtro===f) ? Promise.resolve({ data: estado.conversas }) : (reuso ? Promise.resolve(contadores._r[f]) : api({ op:'listarConversas', filtro:f }));
  const [m, f] = await Promise.all([ pronta('minhas'), pronta('fila') ]);
  if(!reuso && !limpa){ contadores._r = { minhas:m, fila:f }; contadores._t = agoraC; }
  const nm = (m && m.data) ? m.data.reduce((a,c)=>a+(c.nao_lidas||0),0) : 0;
  const nf = (f && f.data) ? f.data.length : 0;
  document.getElementById('n_minhas').textContent = nm ? nm : '';
  document.getElementById('n_fila').textContent = nf ? nf : '';
  if(EMBEDDED) parent.postMessage({ type:'atendimentoTotal', modulo:'atendimento', total: nm + nf }, '*');
  tituloAba(nm + nf);
  if(m && m.data && f && f.data) detectarNovas([m.data, f.data]);
}
/* Conversas internas que entram na lista principal (abas Minhas e Todas), filtradas pela busca. */
function internosDaLista(){
  if(!estado.int || !['minhas','todas','finalizadas'].includes(estado.filtro)) return [];
  const q = String(estado.busca||'').trim().toLowerCase();
  const verFinalizadas = estado.filtro==='finalizadas';
  return (estado.int.threads||[]).filter(t=> !!t.finalizada===verFinalizadas && (!q || String(t.titulo||'').toLowerCase().includes(q)))
    .slice().sort((a,b)=> String((b.ultima||{}).em||'').localeCompare(String((a.ultima||{}).em||'')));
}
function itemInternoHtml(t){
  const ativo = estado.interno && estado.int.atual && estado.int.atual.chave===t.chave;
  const dep = t.tipo==='departamento';
  const nome = String(t.titulo||'').replace(/^🏷\s*/,'');
  const u = t.ultima || {};
  return `
    <div class="conv interno ${ativo?'active':''}" data-int="${escapeHtml(t.chave)}">

  const pedacos = []; let j = 0;
  estado.conversas.forEach(c=>{
    while(j<internos.length && String((internos[j].ultima||{}).em||'') > String(c.ultima_mensagem_em||'')) pedacos.push(itemInternoHtml(internos[j++]));
    pedacos.push(itemConversaHtml(c));

  const htmlL = pedacos.join('');
  if(wrap._h === htmlL) return; wrap._h = htmlL; const st = wrap.scrollTop; wrap.innerHTML = htmlL; wrap.scrollTop = st;

  const a = [];
  if(c.status!=='finalizado' && estado.papel!=='administrativo' && (!c.atendente_id || (c.atendente_id!==estado.meuId && estado.gestao))) a.push(`<button class="btn btn-sm btn-accent" data-a="assumir">✋ Assumir</button>`);

  else { bloq.style.display='none'; document.getElementById('compose').style.display='block'; }

function bubbleHtml(m){
  if(m.direcao==='interna' || m.tipo==='interna') return `<div class="bubble interna" title="Nota interna — o cliente não vê"><div class="autor">🔒 Nota interna · ${escapeHtml(m.autor_nome||'')}</div>${linkar(escapeHtml(m.texto||'')).replace(/\n/g,'<br>')}<div class="meta">${fmtHora(m.enviada_em)}</div></div>`;
  if(m.tipo==='sistema') return `<div class="bubble sis">${escapeHtml(m.texto||'')}</div>`;
  const cls = m.direcao==='out' ? 'out' : 'in';
  let corpo = '';
  if(m.midia_path){
    const mime = m.midia_mime||'';
    if(mime.startsWith('image/')) corpo += `<img data-path="${escapeHtml(m.midia_path)}" alt="foto">`;
    else if(mime.startsWith('audio/')) corpo += `<audio controls data-path="${escapeHtml(m.midia_path)}"></audio>`;
    else if(mime.startsWith('video/')) corpo += `<video controls data-path="${escapeHtml(m.midia_path)}"></video>`;
    else corpo += `<a class="doc" href="#" data-path="${escapeHtml(m.midia_path)}" target="_blank">📎 ${escapeHtml(m.midia_nome||'Arquivo')}</a>`;
  } else if(['imagem','audio','video','documento','sticker'].includes(m.tipo) && !m.texto){
    corpo += `<span class="muted">[${m.tipo}] mídia não disponível</span>`;
  }
  if(m.texto) corpo += linkar(escapeHtml(m.texto));
  const st = m.direcao==='out' ? (m.status==='lida'?' <span class="lida" title="Lida">✓✓</span>':m.status==='entregue'?' ✓✓':m.status==='erro'?' ⚠️':' ✓') : '';
  return `<div class="bubble ${cls}" data-mid="${escapeHtml(m.id||'')}">${m.direcao==='out'&&m.autor_nome?`<div class="autor">${escapeHtml(m.autor_nome)}</div>`:''}${typeof ctxCardHtml==='function'?ctxCardHtml(m):''}${corpo}<div class="meta">${fmtHora(m.enviada_em)}${st}</div></div>`;
}
async function renderMsgs(scroll){
  const wrap = document.getElementById('msgs');
  let dia = '', html = estado.temAntigas ? `<button class="btn btn-sm mais-antigas" id="btnAntigas">⬆ Carregar mensagens anteriores</button>` : '';
  estado.mensagens.forEach(m=>{ const k = m.enviada_em ? new Date(m.enviada_em).toDateString() : dia; if(k!==dia){ dia = k; html += `<div class="sep-dia">${rotuloDia(m.enviada_em)}</div>`; } html += bubbleHtml(m); });
  wrap.innerHTML = html;
  const ba = document.getElementById('btnAntigas'); if(ba) ba.onclick = carregarAntigas;
  if(typeof socialCtxRender==='function') socialCtxRender();
  if(scroll) wrap.scrollTop = wrap.scrollHeight;
  wrap.querySelectorAll('[data-path]').forEach(async el=>{
    const path = el.dataset.path; let url = urlsMidia[path];
    if(!url){ const r = await api({ op:'midiaUrl', path }); if(r && r.url){ url = r.url; urlsMidia[path]=url; } }
    if(!url) return;
    if(el.tagName==='IMG'){ el.src = url; el.addEventListener('click', ()=>{ document.getElementById('zoomImg').src=url; document.getElementById('zoom').style.display='flex'; }); if(scroll) el.addEventListener('load', ()=>{ wrap.scrollTop = wrap.scrollHeight; }); }
    else if(el.tagName==='A') el.href = url;
    else el.src = url;
  });
}
async function carregarAntigas(){
  if(!estado.atual) return;
  const id = estado.atual.id, wrap = document.getElementById('msgs'), antes = wrap.scrollHeight;
  const b = document.getElementById('btnAntigas'); if(b){ b.disabled = true; b.textContent = 'Carregando…'; }
  const r = await api({ op:'mensagens', conversaId:id, limite: estado.limite + 200 });
  if(!estado.atual || estado.atual.id!==id) return;
  if(!r || r.error){ showToast(r && r.error || 'Erro ao carregar'); renderMsgs(false); return; }
  estado.limite += 200; estado.mensagens = r.data || []; estado.temAntigas = estado.mensagens.length >= estado.limite;
  renderMsgs(false); wrap.scrollTop = wrap.scrollHeight - antes;
}
async function atualizarMensagens(){
  if(!estado.atual) return;
  const ultimo = estado.mensagens.length ? estado.mensagens[estado.mensagens.length-1].enviada_em : null;
  const r = await api({ op:'mensagens', conversaId: estado.atual.id, depoisDe: ultimo, limite: 50 });
  if(!r || r.error) return;
  const mudouStatus = JSON.stringify([r.conversa.status, r.conversa.atendente_id, r.conversa.setor, r.conversa.cliente_id, r.conversa.tags]) !== JSON.stringify([estado.atual.status, estado.atual.atendente_id, estado.atual.setor, estado.atual.cliente_id, estado.atual.tags]);
  estado.atual = r.conversa;
  if(mudouStatus) renderHead();
  const novas = (r.data||[]).filter(m=> !estado.mensagens.some(x=>x.id===m.id));
  if(novas.length && novas.some(m=>m.direcao==='in')){
    // Conversa aberta mas aba/janela fora de vista: avisa (som + notificação)
    if(document.hidden) avisarNova(r.conversa);
  }
  if(novas.length){
    const wrap = document.getElementById('msgs'); const noFim = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80;
    estado.mensagens.push(...novas); renderMsgs(noFim);
    if(novas.some(m=>m.direcao==='in')) api({ op:'marcarLida', conversaId: estado.atual.id });
  }
}

async function acao(a){
  const c = estado.atual; if(!c) return;
  if(a==='assumir'){ const r = await api({ op:'assumir', conversaId:c.id }); if(r&&r.ok){ botApi({ op:'assumiu', conversaId:c.id }); showToast('Conversa assumida.'); await abrirConversa(c.id); popupInstancia(estado.atual||c); carregarLista(true);} else showToast(r&&r.error||'Erro'); }
  if(a==='finalizar') return modalFinalizar();
  if(a==='reabrir'){ const r = await ext({ op:'reabrir', conversaId:c.id }); if(r&&r.ok){ botApi({ op:'assumiu', conversaId:c.id }); showToast('Conversa reaberta com você.'); await abrirConversa(c.id); popupInstancia(estado.atual||c); carregarLista(true);} else showToast(r&&r.error||'Erro'); }
  if(a==='transferir') modalTransferir();
  if(a==='crm') modalCRM();
  if(a==='cliente') modalCliente();
  if(a==='tags') modalTags();
  if(a==='retorno') modalRetorno();
  if(a==='programar') modalProgramar({ conversaId:c.id });
  if(a==='campos') modalCamposConv();
  if(a==='modeloOficial') modalTemplate({ conversaId:c.id });

}

/* ➕ Cadastrar cliente direto da conversa (op clienteCadastrar: confere duplicidade por telefone/CPF no servidor) */
function mascaraTel(v){ let d = String(v||'').replace(/\D/g,''); if(d.length>11 && d.startsWith('55')) d = d.slice(2); d = d.slice(0,11);
  if(d.length<=2) return d ? '('+d : ''; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; }
function mascaraCpf(v){ const d = String(v||'').replace(/\D/g,'').slice(0,11); return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2'); }

  document.getElementById('ccOk').onclick = async ()=>{
    const nome = maiu(document.getElementById('ccNome').value.trim()), tdig = tel.value.replace(/\D/g,''), cdig = cpf.value.replace(/\D/g,'');

    if(!tdig && !cdig){ showToast('Informe o telefone ou o CPF.'); return; }
    const b = document.getElementById('ccOk'); b.disabled = true;

const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function horarioHtml(pref, h, opcional){
  const tem = !!(h && h.dias);
  const base = h && h.dias ? h : { dias: Object.fromEntries([0,1,2,3,4,5,6].map(i=>[String(i),{ativo:i>0,faixas:[['09:00','18:00']]}])) };
  let html = opcional ? `<label style="display:flex;gap:6px;align-items:center;margin-bottom:6px;font-weight:400;"><input type="checkbox" id="${pref}_usar" ${tem?'checked':''}> Usar horário próprio (senão herda o do nível acima)</label>` : '';
  html += `<div id="${pref}_box" style="${opcional&&!tem?'display:none':''}">` + [1,2,3,4,5,6,0].map(i=>{ const d = base.dias[String(i)]||{ativo:false,faixas:[]}; const f = (d.faixas&&d.faixas[0])||['09:00','18:00'];
    return `<div class="hor-dia"><label style="font-weight:400;display:flex;gap:4px;align-items:center;"><input type="checkbox" id="${pref}_a${i}" ${d.ativo?'checked':''}> ${DIAS[i]}</label><input type="time" id="${pref}_i${i}" value="${f[0]}"><input type="time" id="${pref}_f${i}" value="${f[1]}"></div>`; }).join('') + `<div class="muted" style="font-size:11.5px;">00:00 às 00:00 = 24 horas. Dia desmarcado = fechado.</div></div>`;
  return html;
}
function horarioLer(pref, opcional){
  if(opcional){ const u = document.getElementById(pref+'_usar'); if(!u || !u.checked) return null; }
  const dias = {}; for(let i=0;i<7;i++){ const a = document.getElementById(`${pref}_a${i}`).checked; const ini = document.getElementById(`${pref}_i${i}`).value||'00:00', fim = document.getElementById(`${pref}_f${i}`).value||'00:00'; dias[String(i)] = { ativo:a, faixas:[[ini,fim]] }; }
  return { dias };
}
function ligarHorario(pref){ const u = document.getElementById(pref+'_usar'); if(u) u.onchange = ()=>{ document.getElementById(pref+'_box').style.display = u.checked ? '' : 'none'; }; }
function resumoHorario(h){ if(!h||!h.dias) return 'sem restrição (24h)'; const ab = [1,2,3,4,5,6,0].filter(i=>h.dias[String(i)]&&h.dias[String(i)].ativo); return ab.length ? ab.map(i=>DIAS[i].slice(0,3)).join(', ') : 'fechado'; }

let fluxoBotId = null;
function abaFluxo(){
  const c = document.getElementById('abCorpo');
  if(!estado.bots.length){ c.innerHTML = '<p class="muted">Crie um bot primeiro na aba “Bots e canais”.</p>'; return; }
  if(!fluxoBotId || !estado.bots.find(b=>b.id===fluxoBotId)) fluxoBotId = estado.bots[0].id;
  const bot = estado.bots.find(b=>b.id===fluxoBotId);
  const f = (bot.config && bot.config.fluxo) || {};
  const m = Object.assign({}, MSG_PADRAO, Object.fromEntries(Object.entries(f.msgs||{}).filter(([k,v])=>v)));
  const deps = estado.departamentos.filter(d=>d.ativo);
  const optDep = (sel,vazio)=> (vazio?`<option value="">${vazio}</option>`:'') + deps.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${escapeHtml(d.nome)}</option>`).join('');
  const menu = (f.menu && f.menu.length) ? f.menu : [];
  const pal = f.palavras || [];
  const linMenu = (it)=>`<div class="lin fm"><input class="mn" value="${escapeHtml(it.n||'')}" placeholder="Nº" maxlength="3"><select class="md">${optDep(it.departamento_id)}</select><input class="mr" value="${escapeHtml(it.rotulo||'')}" placeholder="Texto (vazio = nome do departamento)"><button class="btn btn-sm" data-x="1" title="Remover">✕</button></div>`;
  const linPal = (it)=>`<div class="kw fp"><input class="pk" value="${escapeHtml((it.chaves||[]).join(', '))}" placeholder="Palavras separadas por vírgula (ex.: preço, valor, quanto custa)" style="width:100%;box-sizing:border-box;margin-bottom:6px;"><textarea class="pr" placeholder="Resposta automática">${escapeHtml(it.resposta||'')}</textarea><div style="display:flex;gap:6px;margin-top:6px;"><select class="pd" style="flex:1;">${optDep(it.departamento_id,'Só responder (não encaminhar)')}</select><button class="btn btn-sm" data-x="1">Remover</button></div></div>`;
  c.innerHTML = `${estado.bots.length>1?`<div class="field"><label>Bot</label><select id="flBot">${estado.bots.map(b=>`<option value="${b.id}" ${b.id===fluxoBotId?'selected':''}>${escapeHtml(b.nome)}</option>`).join('')}</select></div>`:`<p class="muted" style="margin-top:0">Bot: <b>${escapeHtml(bot.nome)}</b></p>`}
    <label style="display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0 4px;"><input type="checkbox" id="flAtivo" ${f.ativo?'checked':''}> Atendimento automático ligado (boas-vindas + menu)</label>
    <p class="muted" style="margin:0 0 8px;">Desligado, o bot não envia nada: as conversas só caem na fila. Horário do bot: <b>${escapeHtml(resumoHorario(bot.horario))}</b> (muda em “Bots e canais”).</p>
    <div class="field"><label>Nome da empresa nas mensagens</label><input id="flEmp" value="${escapeHtml(f.empresa||'Vilaça Joias')}"></div>
    <details class="sec" open><summary>📋 Menu de opções (localidade / departamento)</summary><div><div id="flMenu">${menu.map(linMenu).join('')}</div><button class="btn btn-sm" id="flMenuAdd">➕ Opção</button><p class="muted">O cliente digita o número e a conversa vai direto para o departamento escolhido, respeitando o horário dele.</p></div></details>
    <details class="sec"><summary>✉️ Mensagens</summary><div><p class="muted" style="margin-top:0">Variáveis: <b>{{empresa}}</b> <b>{{contato}}</b> <b>{{protocolo}}</b> <b>{{departamento}}</b> <b>{{atendente}}</b> <b>{{horario}}</b>. Também aceito {{client.name}}, {{contact.name}} e {{ticket.id}}.</p>
      ${MSG_ROTULO.map(([k,t,h])=>`<div class="field"><label>${t}</label><textarea data-m="${k}">${escapeHtml(m[k])}</textarea>${h?`<div class="muted">${h}</div>`:''}</div>`).join('')}</div></details>
    <details class="sec"><summary>🔑 Palavras-chave</summary><div><div id="flPal">${pal.map(linPal).join('')}</div><button class="btn btn-sm" id="flPalAdd">➕ Palavra-chave</button><p class="muted">Se a mensagem do cliente contiver uma das palavras, o bot responde na hora (e pode encaminhar ao departamento).</p></div></details>
    <details class="sec"><summary>⚙️ Opções</summary><div>
      <div class="field"><label>Dígito para voltar ao menu</label><input id="flVoltar" value="${escapeHtml(f.voltar_digito||'9')}" maxlength="3" style="width:80px;"></div>
      <div class="field"><label>Recomeçar com boas-vindas após (horas sem conversa)</label><input id="flHoras" type="number" min="1" max="168" value="${Number(f.reenviar_apos_horas)||12}" style="width:100px;"></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-bottom:6px;"><input type="checkbox" id="flEnc" ${f.enviar_encerramento?'checked':''}> Enviar mensagem de encerramento ao finalizar</label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-bottom:6px;"><input type="checkbox" id="flAss" ${f.avisar_assumiu?'checked':''}> Avisar o cliente quando um atendente assumir</label>
      <div class="field"><label>Distribuição das conversas</label><select id="flDist"><option value="manual" ${f.distribuicao!=='online'?'selected':''}>Manual: fica na fila do departamento até alguém assumir</option><option value="online" ${f.distribuicao==='online'?'selected':''}>Automática: vai para quem está online no departamento (menos conversas)</option></select></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;"><input type="checkbox" id="flEnq" ${f.enquete&&f.enquete.ativa?'checked':''}> Pedir nota de 1 a 5 (enquete de satisfação) ao finalizar</label></div></details>
    ${fluxoExtraHtml(f)}
    <details class="sec"><summary>👁 Pré-visualização</summary><div><div class="prev" id="flPrev"></div></div></details>
    <div class="rodape"><button class="btn btn-accent" id="flSalvar">Salvar</button></div>`;
  const ler0 = ()=>{
    const msgs = {}; c.querySelectorAll('[data-m]').forEach(t=>{ msgs[t.dataset.m] = t.value; });
    const menu = [...c.querySelectorAll('.fm')].map(r=>({ n:r.querySelector('.mn').value.trim(), departamento_id:r.querySelector('.md').value, rotulo:r.querySelector('.mr').value.trim() })).filter(x=>x.n&&x.departamento_id);
    const palavras = [...c.querySelectorAll('.fp')].map(r=>({ chaves:r.querySelector('.pk').value.split(',').map(x=>x.trim()).filter(Boolean), resposta:r.querySelector('.pr').value, departamento_id:r.querySelector('.pd').value||null })).filter(x=>x.chaves.length&&(x.resposta||x.departamento_id));
    return { ativo:document.getElementById('flAtivo').checked, empresa:document.getElementById('flEmp').value, voltar_digito:document.getElementById('flVoltar').value, reenviar_apos_horas:Number(document.getElementById('flHoras').value)||12, enviar_encerramento:document.getElementById('flEnc').checked, enquete:{ ativa:document.getElementById('flEnq').checked }, avisar_assumiu:document.getElementById('flAss').checked, distribuicao:document.getElementById('flDist').value, msgs, menu, palavras };
  };
  const ler = ()=> Object.assign(ler0(), lerExtraFluxo(c));
  const prev = ()=>{
    const x = ler(); const v = t=> String(t||'').replace(/\{\{\s*(empresa|client\.name)\s*\}\}/g, x.empresa).replace(/\{\{\s*[\w.]+\s*\}\}/g,'…');
    const lista = x.menu.map(i=>`${i.n} - ${i.rotulo || ((deps.find(d=>d.id===i.departamento_id)||{}).nome||'')}`).join('\n');
    document.getElementById('flPrev').textContent = [v(x.msgs.boasvindas), lista, v(x.msgs.escolha)].filter(Boolean).join('\n\n');
  };
  const ligar = ()=>{ c.querySelectorAll('[data-x]').forEach(b=> b.onclick = ()=>{ b.closest('.fm,.fp').remove(); prev(); }); c.querySelectorAll('input,textarea,select').forEach(e=>{ e.oninput = prev; e.onchange = prev; }); };
  document.getElementById('flMenuAdd').onclick = ()=>{ const n = c.querySelectorAll('.fm').length+1; document.getElementById('flMenu').insertAdjacentHTML('beforeend', linMenu({ n:String(n), departamento_id:'' })); ligar(); prev(); };
  document.getElementById('flPalAdd').onclick = ()=>{ document.getElementById('flPal').insertAdjacentHTML('beforeend', linPal({})); ligar(); };
  if(document.getElementById('flBot')) document.getElementById('flBot').onchange = e=>{ fluxoBotId = e.target.value; abaFluxo(); };
  ligar(); prev();
  document.getElementById('flSalvar').onclick = async ()=>{
    const x = ler();
    if(x.ativo && !x.menu.length && !confirm('O menu está vazio: o bot só enviará a mensagem de boas-vindas. Continuar?')) return;
    const r = await botApi({ op:'fluxoSalvar', botId:fluxoBotId, fluxo:x });
    if(r&&r.ok){ showToast(x.ativo?'Salvo. Atendimento automático LIGADO.':'Salvo. Atendimento automático desligado.'); await carregarStatus(); abaFluxo(); } else showToast((r&&r.error)||'Erro ao salvar');
  };
}

async function carregarCatalogo(){
  const r = await botApi({ op:'catalogo' });
  if(r && r.ok){
    estado.modelos = r.modelos||[]; estado.tags = r.tags||[];
    const dep = estado.atual ? estado.atual.departamento_id : null;
    estado.respostas = estado.modelos.filter(m=> !m.departamento_id || !dep || m.departamento_id===dep || true).map(m=>({ id:m.id, titulo:m.titulo, atalho:m.atalho, mensagens:m.mensagens||[], texto:(m.mensagens||[])[0]||'' }));
    if(estado.atual) renderHead();
  }
}
function substModelo(t){
  const c = estado.atual || {};
  return String(t||'').replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_m,k)=>({ contato:c.contato_nome||'', 'contact.name':c.contato_nome||'', atendente:estado.meuNome||'', empresa:'Vilaça Joias', 'client.name':'Vilaça Joias', protocolo:String(c.id||'').slice(0,8).toUpperCase(), 'ticket.id':String(c.id||'').slice(0,8).toUpperCase() })[k]||'');
}
async function usarModelo(r){
  if(!r || !estado.atual) return;
  const msgs = (r.mensagens && r.mensagens.length) ? r.mensagens : [r.texto];
  const t = document.getElementById('texto');
  if(msgs.length===1){ t.value = (t.value?t.value+'\n':'') + substModelo(msgs[0]); t.focus(); return; }
  if(!confirm(`Enviar as ${msgs.length} mensagens de “${r.titulo}” agora?`)) return;
  for(const m of msgs){ const x = await ext({ op:'enviarTexto', conversaId:estado.atual.id, texto:substModelo(m) }); if(!x||!x.ok){ showToast((x&&x.error)||'Falhou no envio'); break; } }
  await atualizarMensagens(); carregarLista(true);
}

/* ================= CHAT INTERNO ================= */
const CHAT_URL = SUPABASE_URL + "/functions/v1/atendimento-chat";
async function chat(body){
  try{ const res = await fetch(CHAT_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) }); return await res.json(); }
  catch(e){ return { error:String(e) }; }
}
estado.int = { threads:[], atual:null, msgs:[] };
estado.chatDesde = null;
function chatBadge(total){ const el = document.getElementById('n_chat'); if(el) el.textContent = total || ''; }
function bannerInterno(n){
  const b = document.getElementById('bannerInt'); if(!b) return;
  b.innerHTML = `<b>💬 Mensagem interna · ${escapeHtml(n.titulo && n.titulo.startsWith('🏷') ? n.de+' → '+n.titulo.replace('🏷 ','') : n.de||'')}</b>${escapeHtml(String(n.texto||'').slice(0,140))}`;
  b.style.display = 'block'; b.onclick = ()=>{ b.style.display='none'; abrirInterno(n.chave); };
  clearTimeout(b._t); b._t = setTimeout(()=>{ b.style.display='none'; }, 12000);
}
async function pollChat(){
  if(!__gatewaySenha) return;
  const r = await chat({ op:'poll', desde: estado.chatDesde || undefined });
  if(!r || !r.ok) return;
  const primeira = !estado.chatDesde; estado.chatDesde = r.agora;
  chatBadge(r.total);
  const novas = primeira ? [] : (r.novas||[]);
  if(novas.length){
    const aberta = estado.interno && estado.int.atual && !document.hidden;
    const fora = novas.filter(n=> !(aberta && estado.int.atual.chave===n.chave));
    if(fora.length){
      if(estado.aviso) tocarSom();
      try{ if(navigator.vibrate) navigator.vibrate([100,50,100]); }catch(e){}
      const n = fora[fora.length-1]; bannerInterno(n);
      try{ if(document.hidden && window.Notification && Notification.permission==='granted'){ const nt = new Notification('Mensagem interna — '+(n.de||''), { body:n.texto, tag:'int_'+n.chave }); nt.onclick = ()=>{ try{ window.top.focus(); }catch(e){} abrirInterno(n.chave); nt.close(); }; } }catch(e){}
    }
  }
  const mudou = primeira || novas.length || r.total !== estado.int.ultTotal; estado.int.ultTotal = r.total;
  if(mudou){
    if(estado.interno && estado.int.atual) await carregarMsgsInterno(true);
    await carregarThreads(true);
  }
}
async function carregarThreads(silencio){
  const r = await chat({ op:'lista' }); if(!r||!r.ok){ if(!silencio) showToast((r&&r.error)||'Erro'); return; }
  estado.int.threads = r.threads||[]; chatBadge(r.total); renderLista();
}
async function carregarMsgsInterno(silencio){
  const t = estado.int.atual; if(!t) return;
  const r = await chat({ op:'mensagens', chave:t.chave }); if(!r||!r.ok){ if(!silencio) showToast((r&&r.error)||'Erro'); return; }
  const mudou = (r.data||[]).length !== estado.int.msgs.length;
  estado.int.msgs = r.data||[]; if(mudou || !silencio) pintarMsgsInterno();
  chatBadge((estado.int.threads||[]).filter(x=>x.chave!==t.chave).reduce((s,x)=>s+x.nao_lidas,0));
}
/* Abre uma conversa interna pela chave (banner/notificação). Sem chave: começa uma nova. */
async function abrirInterno(chaveAbrir){
  if(!chaveAbrir) return novaInterna();
  let t = (estado.int.threads||[]).find(x=>x.chave===chaveAbrir);
  if(!t){ await carregarThreads(true); t = (estado.int.threads||[]).find(x=>x.chave===chaveAbrir); }
  if(t) abrirThreadInterno(t);
}
/* A conversa interna abre na área do chat, igual a uma conversa de cliente. */
async function abrirThreadInterno(t){
  estado.interno = true; estado.painel = false; estado.atual = null;
  document.getElementById('chatArea').style.display='none';
  const v = document.getElementById('chatVazio'); v.style.display='block'; v.classList.add('painel');
  document.getElementById('app').classList.add('ver-chat');
  estado.int.atual = { chave:t.chave, tipo:t.tipo, outro_id:t.outro_id, titulo:t.titulo, finalizada:!!t.finalizada }; estado.int.msgs = [];
  const dep = t.tipo==='departamento';
  v.innerHTML = `<div class="int-wrap solo"><div class="int-conv" id="intConv">
    <div class="hd"><button class="btn btn-sm voltar-lista" id="intVoltar">←</button><span class="tagchip tag-int">Interno</span><span>${escapeHtml(String(t.titulo||'').replace(/^🏷\s*/,''))}</span><span class="sub">${dep?'Departamento':'Conversa da equipe'}</span>
      ${t.finalizada ? `<button class="btn btn-sm btn-accent" id="intFinalizar" data-op="reabrir" style="margin-left:auto;">↩ Reabrir</button>` : `<button class="btn btn-sm btn-danger" id="intFinalizar" data-op="finalizar" style="margin-left:auto;">✔ Finalizar</button>`}</div>
    <div class="ms" id="intMs"></div>
    <div class="cp"><textarea id="intTxt" placeholder="Escreva a mensagem… (Enter envia)"></textarea><button class="btn btn-accent" id="intEnv">Enviar</button></div>
  </div></div>`;
  document.getElementById('intVoltar').onclick = ()=> document.getElementById('app').classList.remove('ver-chat');
  document.getElementById('intFinalizar').onclick = ()=> finalizarInterno(t);
  renderLista();
  document.getElementById('intEnv').onclick = enviarInterno;
  document.getElementById('intTxt').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarInterno(); } });
  await carregarMsgsInterno(); await carregarThreads(true);
  const x = document.getElementById('intTxt'); if(x) x.focus();
}
function pintarMsgsInterno(){
  const ms = document.getElementById('intMs'); if(!ms) return;
  const eu = estado.meuId; const fim = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 80;
  ms.innerHTML = estado.int.msgs.map(m=>{ const meu = m.remetente_id===eu; const h = new Date(m.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); return `<div class="int-m ${meu?'eu':''}"><div class="q">${meu?'Você':escapeHtml(m.remetente_nome||'')} · ${h}</div>${escapeHtml(m.texto)}</div>`; }).join('') || '<div class="muted">Sem mensagens ainda. Escreva a primeira.</div>';
  if(fim || estado.int.msgs.length<=1) ms.scrollTop = ms.scrollHeight;
}
/* Finalizar tira a conversa interna da lista de quem finalizou (vai para Finalizadas).
 * Se chegar mensagem nova, ela volta sozinha. */
async function finalizarInterno(t){
  const op = document.getElementById('intFinalizar').dataset.op;
  const r = await chat({ op, chave:t.chave });
  if(!r || !r.ok){ showToast((r && r.error) || 'Não consegui '+(op==='finalizar'?'finalizar':'reabrir')+'.'); return; }
  estado.interno = false; estado.int.atual = null;
  const v = document.getElementById('chatVazio'); v.classList.remove('painel');
  v.innerHTML = 'Escolha uma conversa à esquerda.<br><span class="muted">Mensagens novas aparecem sozinhas.</span>';
  document.getElementById('app').classList.remove('ver-chat');
  await carregarThreads(true);
  showToast(op==='finalizar' ? 'Conversa interna finalizada' : 'Conversa interna reaberta');
}
async function enviarInterno(){
  const t = estado.int.atual, x = document.getElementById('intTxt'); if(!t || !x) return;
  const texto = x.value.trim(); if(!texto) return; x.value='';
  const r = await chat({ op:'enviar', destino_tipo:t.tipo==='departamento'?'departamento':'pessoa', destino_id:t.outro_id, texto });
  if(!r||!r.ok){ showToast((r&&r.error)||'Não enviou'); x.value = texto; return; }
  await carregarMsgsInterno(); await carregarThreads(true);
}
function novaInterna(){
  const pessoas = estado.atendentes.filter(a=>a.funcionario_id!==estado.meuId).slice().sort((a,b)=>(b.online?1:0)-(a.online?1:0)||String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const deps = estado.departamentos.filter(d=>d.ativo);
  abrirModal(`<h2>Nova conversa interna</h2>
    <p class="muted" style="margin:-4px 0 12px;">Escolha com quem falar. A conversa aparece na lista de conversas de vocês dois (ou de todo o departamento).</p>
    <div class="field"><label>Falar com</label><select id="inTipo"><option value="pessoa">Uma pessoa</option><option value="departamento">Um departamento</option></select></div>
    <div class="field"><label>Destinatário</label><select id="inDest"></select></div>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-accent" id="mOk">Abrir conversa</button></div>`);
  const pintar = ()=>{ const t = document.getElementById('inTipo').value; document.getElementById('inDest').innerHTML = (t==='pessoa' ? pessoas.map(a=>`<option value="${escapeHtml(a.funcionario_id)}">${a.online?'🟢':'⚪'} ${escapeHtml(a.nome)}</option>`) : deps.map(d=>`<option value="${d.id}">${escapeHtml(d.nome)}</option>`)).join(''); };
  pintar(); document.getElementById('inTipo').onchange = pintar;
  document.getElementById('mCancel').onclick = fecharModal;
  document.getElementById('mOk').onclick = ()=>{
    const tipo = document.getElementById('inTipo').value, id = document.getElementById('inDest').value; if(!id) return;
    const chave = tipo==='pessoa' ? 'p:'+[estado.meuId,id].sort().join('|') : 'd:'+id;
    const ex = estado.int.threads.find(x=>x.chave===chave);
    const titulo = tipo==='pessoa' ? ((pessoas.find(a=>a.funcionario_id===id)||{}).nome||'') : '🏷 '+((deps.find(d=>d.id===id)||{}).nome||'');
    fecharModal(); abrirThreadInterno(ex || { chave, tipo, outro_id:id, titulo });
  };
}

/* ================= PAINEL (DASHBOARD) ================= */
function temFx(){ const f=estado.fx; return !!(f.dep||f.at||f.st); }
function aplicarFx(lista){
  const f = estado.fx; if(!temFx()) return lista;
  return lista.filter(c=>{
    if(f.dep) { if(f.dep==='__none' ? !!c.departamento_id : c.departamento_id!==f.dep) return false; }
    if(f.at) { if(f.at==='__fila' ? !!c.atendente_id : c.atendente_id!==f.at) return false; }
    if(f.st==='aguardando' && c.status!=='aguardando') return false;
    if(f.st==='em_atendimento' && c.status!=='em_atendimento') return false;
    if(f.st==='nao_lidas' && !(c.nao_lidas>0)) return false;
    return true;
  });
}
function descFx(){
  const f=estado.fx; const p=[];
  if(f.dep) p.push(f.dep==='__none'?'sem departamento':(estado.departamentos.find(d=>d.id===f.dep)||{}).nome||'departamento');
  if(f.at) p.push(f.at==='__fila'?'na fila (sem atendente)':'atendente '+((estado.atendentes.find(a=>a.funcionario_id===f.at)||{}).nome||''));
  if(f.st) p.push({aguardando:'pendentes',em_atendimento:'em atendimento',nao_lidas:'com mensagens novas'}[f.st]);
  return p.join(' · ');
}
function atualizarFxInfo(){
  const el=document.getElementById('fxInfo');
  if(!temFx()){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='block'; el.innerHTML=`<span style="padding:0 12px;">🔎 ${escapeHtml(descFx())}<button class="btn btn-sm" id="fxLimpar">limpar</button></span>`;
  document.getElementById('fxLimpar').onclick = ()=>{ estado.fx={dep:'',at:'',st:''}; atualizarFxInfo(); carregarLista(); if(estado.painel) renderPainel(); };
}
function ativarAba(f){ estado.filtro=f; document.querySelectorAll('#filtros button').forEach(x=>x.classList.toggle('active',x.dataset.f===f)); }
function filtrarPeloPainel(fx){

async function enviarTexto(){
  const t = document.getElementById('texto'); const texto = t.value.trim(); if(!texto || !estado.atual) return;
  const sugIA = (estado.iaSug && estado.iaSug.conversaId===estado.atual.id) ? estado.iaSug : null;
  const btn = document.getElementById('btnEnviar'); btn.disabled = true; t.value='';
  if(estado.modoInterna){
    const ri = await api({ op:'notaInterna', conversaId: estado.atual.id, texto }); btn.disabled = false;
    if(!ri || !ri.ok){ showToast((ri && ri.error) || 'Não salvou a nota'); t.value = texto; return; }
    await atualizarMensagens(); if(ri.mensagem && !estado.mensagens.some(m=>m.id===ri.mensagem.id)){ estado.mensagens.push(ri.mensagem); renderMsgs(true); }
    showToast('🔒 Nota interna salva (o cliente não vê).'); return;
  }
  const r = await ext({ op:'enviarTexto', conversaId: estado.atual.id, texto });
  btn.disabled = false;
  if(r && r.error==='JANELA_24H'){ t.value = texto; modalTemplate({ conversaId: estado.atual.id }); return; }
  if(!r || !r.ok){ showToast(r && r.error || 'Não enviou'); t.value = texto; return; }
  if(sugIA){ estado.iaSug = null; t.classList.remove('ia-sug'); if(sugIA.logId) ia({ op:'marcarUso', logId:sugIA.logId, usado:true, textoFinal:texto }); }
  await atualizarMensagens(); if(!estado.mensagens.some(m=>m.texto===texto && m.direcao==='out')){ estado.mensagens.push({ id:'tmp'+Date.now(), direcao:'out', tipo:'texto', texto, autor_nome:estado.meuNome, status:'enviada', enviada_em:new Date().toISOString() }); renderMsgs(true); }
  carregarLista(true);
}
function enviarArquivo(file){
  if(!file || !estado.atual) return;
  if(!podeResponder()){ showToast('Esta conversa está com outro atendente.'); return; }
  if(file.size > 15*1024*1024){ showToast('Arquivo grande demais (máx. 15 MB).'); return; }
  const conversaId = estado.atual.id, ehImg = (file.type||'').startsWith('image/'), url = ehImg ? URL.createObjectURL(file) : '';
  abrirModal(`<h2>Enviar ${ehImg?'foto':'arquivo'} para ${escapeHtml(nomeConv(estado.atual))}</h2>
    <div class="previa">${ehImg ? `<img src="${url}" alt="">` : `📎 <b>${escapeHtml(file.name||'Arquivo')}</b> <span class="muted">(${(file.size/1024/1024).toFixed(1)} MB)</span>`}</div>
    <div class="field"><label>Legenda (opcional)</label><input id="aLeg"></div>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-accent" id="mOk">Enviar</button></div>`);
  const fechar = ()=>{ if(url) try{ URL.revokeObjectURL(url); }catch(e){} fecharModal(); };
  const ok = ()=>{ const legenda = document.getElementById('aLeg').value.trim(); fechar(); enviarArquivoAgora(file, legenda, conversaId); };
  document.getElementById('mCancel').onclick = fechar;
  document.getElementById('mOk').onclick = ok;
  const leg = document.getElementById('aLeg'); leg.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } }); leg.focus();
}
async function enviarArquivoAgora(file, legenda, conversaId){
  const base64 = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.split(',')[1]); fr.onerror=rej; fr.readAsDataURL(file); });
  showToast('Enviando…');
  const ofc = estado.atual && estado.atual.id===conversaId && ehOficial(estado.atual);
  const r = await (ofc ? ext : api)({ op: ofc ? 'enviarMidiaCloud' : 'enviarMidia', conversaId, base64, mimetype: file.type || 'application/octet-stream', nome: file.name, legenda: legenda||'' });
  if(r && r.error==='JANELA_24H'){ modalTemplate({ conversaId }); return; }
  if(!r || !r.ok){ showToast(r && r.error || 'Não enviou'); return; }
  showToast('Enviado.');
  if(estado.atual && estado.atual.id===conversaId) await abrirConversa(conversaId);
  carregarLista(true);
}
/* Respostas rápidas pelo teclado: digite "/" no campo da mensagem */
function atualizarSugestoes(){
  const t = document.getElementById('texto'), box = document.getElementById('sugestoes'), v = t.value;
  box._l = [];
  if(v[0]!=='/' || v.includes('\n') || !estado.respostas.length){ box.style.display='none'; return; }
  const termo = v.slice(1).toLowerCase();
  const l = estado.respostas.filter(r=> ((r.atalho||'')+' '+r.titulo+' '+r.texto).toLowerCase().includes(termo)).sort((a,b)=> ((b.atalho||'')===termo)-((a.atalho||'')===termo)).slice(0,6);

  box.style.display = 'block';
  box.querySelectorAll('button').forEach(b=> b.onclick = ()=> usarSugestao(+b.dataset.i));
}
function usarSugestao(i){
  const t = document.getElementById('texto'), box = document.getElementById('sugestoes'), r = (box._l||[])[i]; if(!r) return false;
  t.value=''; box._l = []; box.style.display='none'; usarModelo(r); return true;
}

/* ================= FOTOS DOS CONTATOS ================= */
let fotosRodando=false;
async function sincronizarFotos(){
  if(fotosRodando || !__gatewaySenha) return; fotosRodando=true;
  try{
    for(let i=0;i<6;i++){
      const res = await fetch(SUPABASE_URL + '/functions/v1/atendimento-fotos', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, max: 12 }) });
      const r = await res.json().catch(()=>null);
      if(!r || !r.ok) break;
      if(r.feitas) carregarLista(true);
      if(!r.feitas) break;
    }
  }catch(e){ console.error('fotos', e); }
  fotosRodando=false;
}

/* ================= INIT ================= */
function iniciarPolling(){
  if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; }
  async function tick(){
    try{ await Promise.all([ carregarLista(true), atualizarMensagens(), estado.painel ? atualizarPainel() : null, pollChat() ]); }catch(e){ console.error('poll',e); }
    finally{ pollTimer = setTimeout(tick, document.hidden ? 15000 : 5000); }
  }
  pollTimer = setTimeout(tick, 5000);
  extTimers();
}
// Reativar polling quando a aba volta ao foco (celular minimizou e voltou)
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && __gatewaySenha){
    if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; }
    carregarLista(true); atualizarMensagens();
    iniciarPolling();
  }
});
document.getElementById('filtros').querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ estado.filtro=b.dataset.f; document.querySelectorAll('#filtros button').forEach(x=>x.classList.toggle('active',x===b)); carregarLista(); }));
let tb; document.getElementById('busca').addEventListener('input', e=>{ clearTimeout(tb); tb=setTimeout(()=>{ estado.busca=e.target.value.trim(); carregarLista(); }, 350); });
document.getElementById('btnNova').addEventListener('click', modalNova);
document.getElementById('btnConfig').addEventListener('click', ()=> modalAdmin('bots'));
