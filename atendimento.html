// ===== Falar com a Agenda (lembretes pessoais por login — vale para todas as instâncias) =====
const AGENDA_URL = SUPABASE_URL + "/functions/v1/atendimento-agenda-chat";
let agendaHist = [];
async function agendaApi(texto){
  try{ const res = await fetch(AGENDA_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, texto }) }); return await res.json(); }
  catch(e){ return { error:'Falha de conexão' }; }
}
function pintarAgenda(){
  const el = document.getElementById('agMsgs'); if(!el) return;
  el.innerHTML = agendaHist.length ? agendaHist.map(m=>`<div style="display:flex;justify-content:${m.eu?'flex-end':'flex-start'};margin:6px 0;"><div style="max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px;background:${m.eu?'var(--accent,#2563eb)':'#f1f5f9'};color:${m.eu?'#fff':'#111'};">${escapeHtml(m.t)}</div></div>`).join('') : '<p class="muted" style="font-size:13px;">Ex.: "me lembra de pagar a luz dia 10 às 9h", "meus lembretes", "cancela o 0003/26".</p>';
  el.scrollTop = el.scrollHeight;
}
async function enviarAgenda(){
  const inp = document.getElementById('agTxt'); const t = (inp.value||'').trim(); if(!t) return;
  inp.value=''; agendaHist.push({eu:true,t}); agendaHist.push({eu:false,t:'…'}); pintarAgenda();
  const r = await agendaApi(t); agendaHist.pop();
  agendaHist.push({eu:false,t: (r && (r.resposta || r.error)) || 'Erro'}); pintarAgenda();
  // o pedido pode ter criado/cancelado lembrete: atualiza o calendário
  tarefasApi({ op:'lembretes' }).then(l=>{ if(l && l.ok) estado.ag.lembretes = l.data || []; });
}
/* ================= AGENDA: tarefas (quadro), calendário, minhas vias e assistente =================
 * Tarefas ficam na tabela agenda_tarefas, sempre pela Edge Function agenda-tarefas, que decide
 * quem enxerga cada uma: privada (só quem criou), loja (gerente e diretoria também) ou
 * compartilhada (quem criou + quem recebeu). */
const TAREFAS_URL = SUPABASE_URL + "/functions/v1/agenda-tarefas";
async function tarefasApi(body){
  try{ const res = await fetch(TAREFAS_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) }); return await res.json(); }
  catch(e){ return { error:'Falha de conexão' }; }
}
const AG_TIPOS = { privada:{ nome:'Privada', desc:'Só você vê' }, loja:{ nome:'Loja', desc:'Gerente e diretoria também veem' }, compartilhada:{ nome:'Compartilhada', desc:'Você e quem você escolher' } };
const AG_CLASSES = { urgente:'Urgente', importante:'Importante', normal:'Normal', baixa:'Baixa' };
const AG_COLUNAS = [ ['a_fazer','A fazer'], ['fazendo','Fazendo'], ['feito','Feito'] ];
const AG_VIA = { orcamento:{ nome:'Orçamento', alvo:'orcamentos' }, venda:{ nome:'Venda', alvo:'pdv' }, pedido:{ nome:'Pedido', alvo:'os' } };
estado.ag = { aba:'quadro', ini:null, tarefas:[], lembretes:[], vias:null, viasErro:null, filtroTipo:'', filtroCls:'', viaTipo:'', viaBusca:'', mes:null, mostrarVias:true };

function agDataISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function agFmtData(s){ if(!s) return ''; const [y,m,d] = String(s).slice(0,10).split('-'); return `${d}/${m}${y!==String(new Date().getFullYear())?'/'+y:''}`; }
function agNomePessoa(id){ const p = ((estado.ag.ini||{}).pessoas||[]).find(x=>x.id===id); return p ? p.nome : (id===((estado.ag.ini||{}).me||{}).id ? 'Você' : '—'); }
function agNomeLoja(id){ const l = ((estado.ag.ini||{}).lojas||[]).find(x=>x.id===id); return l ? l.nome : (id||''); }

async function abrirAgenda(){
  estado.interno = false; estado.painel = false; estado.atual = null; renderLista();
  document.getElementById('chatArea').style.display='none';
  const v = document.getElementById('chatVazio'); v.style.display='block'; v.classList.add('painel');
  document.getElementById('app').classList.add('ver-chat');
  v.innerHTML = `<div class="ag-wrap" id="agWrap">
    <div class="ag-top">
      <button class="btn btn-sm voltar-lista" id="agVoltar">←</button>
      <h2>📅 Agenda</h2>
      <div class="ag-abas" role="tablist">
        ${[['quadro','Tarefas'],['calendario','Calendário'],['vias','Minhas vias'],['assistente','Assistente']].map(([id,n])=>`<button type="button" role="tab" data-agaba="${id}" class="${estado.ag.aba===id?'on':''}" aria-selected="${estado.ag.aba===id}">${n}</button>`).join('')}
      </div>
      <button class="btn btn-sm" id="agAtualizar" title="Atualizar">↻</button>
      <button class="btn btn-sm btn-accent" id="agNova">➕ Nova tarefa</button>
    </div>
    <div id="agCorpo"><p class="muted">Carregando…</p></div>
  </div>`;
  document.getElementById('agVoltar').onclick = ()=> document.getElementById('app').classList.remove('ver-chat');
  document.getElementById('agNova').onclick = ()=> agEditar(null);
  document.getElementById('agAtualizar').onclick = ()=> agCarregar(true);
  v.querySelectorAll('[data-agaba]').forEach(b=> b.onclick = ()=>{
    estado.ag.aba = b.dataset.agaba;
    v.querySelectorAll('[data-agaba]').forEach(x=>{ x.classList.toggle('on', x===b); x.setAttribute('aria-selected', x===b); });
    agRender();
    if(estado.ag.aba==='vias' && !estado.ag.vias) agCarregarVias();
  });
  await agCarregar(false);
}
async function agCarregar(forcarVias){
  if(!estado.ag.ini){
    const r = await tarefasApi({ op:'init' });
    if(!r || !r.ok){ agErro((r && r.error) || 'Não consegui abrir a agenda.'); return; }
    estado.ag.ini = r;
  }
  const [t, l] = await Promise.all([ tarefasApi({ op:'listar' }), tarefasApi({ op:'lembretes' }) ]);
  if(!t || !t.ok){ agErro((t && t.error) || 'Não consegui carregar as tarefas.'); return; }
  estado.ag.tarefas = t.data || [];
  estado.ag.lembretes = (l && l.ok && l.data) || [];
  if(forcarVias || (estado.ag.aba==='vias' && !estado.ag.vias)) await agCarregarVias(true);
  agRender();
}
async function agCarregarVias(semRender){
  const r = await tarefasApi({ op:'minhasVias' });
  if(r && r.ok){ estado.ag.vias = r.data || []; estado.ag.viasErro = null; }
  else { estado.ag.vias = []; estado.ag.viasErro = (r && r.error) || 'Não consegui buscar suas vias.'; }
  if(!semRender) agRender();
}
function agErro(msg){ const c = document.getElementById('agCorpo'); if(c) c.innerHTML = `<p class="muted" style="padding:14px;">${escapeHtml(msg)}</p>`; }
function agRender(){
  const c = document.getElementById('agCorpo'); if(!c) return;
  const a = estado.ag.aba;
  if(a==='quadro') agRenderQuadro(c);
  else if(a==='calendario') agRenderCalendario(c);
  else if(a==='vias') agRenderVias(c);
  else agRenderAssistente(c);
}
function agLegenda(){
  return `<div class="ag-legenda">${Object.entries(AG_TIPOS).map(([k,t])=>`<span class="t-${k}"><i style="background:var(--tc)"></i>${t.nome}</span>`).join('')}</div>`;
}

/* ---------- Quadro (estilo Trello) ---------- */
function agCardHtml(t){
  const meId = ((estado.ag.ini||{}).me||{}).id;
  const quem = t.tipo==='loja' ? agNomeLoja(t.loja_id)
    : t.tipo==='compartilhada' ? (t.criador_id===meId ? 'Com '+(t.participantes||[]).map(agNomePessoa).join(', ') : 'De '+(t.criador_nome||'—'))
    : '';
  const i = AG_COLUNAS.findIndex(c=>c[0]===t.coluna);
  return `<div class="ag-card t-${t.tipo} ${t.coluna==='feito'?'feito':''}" draggable="true" data-agid="${escapeHtml(t.id)}">
    <div class="ag-tt">${escapeHtml(t.titulo)}</div>
    ${t.descricao?`<div class="ag-ds">${escapeHtml(t.descricao)}</div>`:''}
    <div class="ag-meta">
      <span class="ag-tag">${AG_TIPOS[t.tipo].nome}</span>
      ${t.classificacao!=='normal'?`<span class="ag-cls c-${t.classificacao}">${AG_CLASSES[t.classificacao]}</span>`:''}
      ${t.data?`<span>📅 ${agFmtData(t.data)}${t.hora?' '+escapeHtml(t.hora):''}</span>`:''}
      ${quem?`<span>${escapeHtml(quem)}</span>`:''}
    </div>
    <div class="ag-mv">
      ${i>0?`<button type="button" data-agmv="${escapeHtml(t.id)}" data-col="${AG_COLUNAS[i-1][0]}" title="Voltar para ${AG_COLUNAS[i-1][1]}">← ${AG_COLUNAS[i-1][1]}</button>`:''}
      ${i<AG_COLUNAS.length-1?`<button type="button" data-agmv="${escapeHtml(t.id)}" data-col="${AG_COLUNAS[i+1][0]}" title="Passar para ${AG_COLUNAS[i+1][1]}">${AG_COLUNAS[i+1][1]} →</button>`:''}
    </div>
  </div>`;
}
function agRenderQuadro(c){
  const f = estado.ag;
  const lista = f.tarefas.filter(t=> (!f.filtroTipo || t.tipo===f.filtroTipo) && (!f.filtroCls || t.classificacao===f.filtroCls));
  const ordemCls = { urgente:0, importante:1, normal:2, baixa:3 };
  c.innerHTML = `
    <div class="ag-filtros" style="margin-bottom:10px;">
      ${[['','Todas'],['privada','Privadas'],['loja','Loja'],['compartilhada','Compartilhadas']].map(([k,n])=>`<button type="button" class="ag-chip ${f.filtroTipo===k?'on':''}" data-agft="${k}">${n}</button>`).join('')}
      <select class="busca" id="agFiltroCls" style="width:auto;margin:0;padding:5px 10px;"><option value="">Toda classificação</option>${Object.entries(AG_CLASSES).map(([k,n])=>`<option value="${k}" ${f.filtroCls===k?'selected':''}>${n}</option>`).join('')}</select>
      ${agLegenda()}
    </div>
    <div class="ag-quadro">
      ${AG_COLUNAS.map(([col,nome])=>{
        const itens = lista.filter(t=>t.coluna===col).sort((a,b)=> col==='feito' ? 0 : (ordemCls[a.classificacao]-ordemCls[b.classificacao]) || (a.ordem-b.ordem));
        return `<div class="ag-col" data-agcol="${col}"><h3><span>${nome}</span><span>${itens.length}</span></h3>${itens.map(agCardHtml).join('') || '<div class="ag-vazio">Arraste uma tarefa pra cá</div>'}</div>`;
      }).join('')}
    </div>
    ${!f.tarefas.length?`<p class="muted" style="margin-top:12px;">Nenhuma tarefa ainda. Clique em <b>➕ Nova tarefa</b> para criar a primeira.</p>`:''}`;
  c.querySelectorAll('[data-agft]').forEach(b=> b.onclick = ()=>{ f.filtroTipo = b.dataset.agft; agRender(); });
  document.getElementById('agFiltroCls').onchange = e=>{ f.filtroCls = e.target.value; agRender(); };
  c.querySelectorAll('.ag-card').forEach(el=>{
    el.addEventListener('click', e=>{ if(e.target.closest('[data-agmv]')) return; agEditar(f.tarefas.find(t=>t.id===el.dataset.agid)); });
    el.addEventListener('dragstart', e=>{ el.classList.add('arrastando'); e.dataTransfer.setData('text/plain', el.dataset.agid); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', ()=> el.classList.remove('arrastando'));
  });
  c.querySelectorAll('[data-agmv]').forEach(b=> b.onclick = ()=> agMover(b.dataset.agmv, b.dataset.col));
  c.querySelectorAll('.ag-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('sobre'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('sobre'));
    col.addEventListener('drop', e=>{ e.preventDefault(); col.classList.remove('sobre'); const id = e.dataTransfer.getData('text/plain'); if(id) agMover(id, col.dataset.agcol); });
  });
}
async function agMover(id, coluna){
  const t = estado.ag.tarefas.find(x=>x.id===id); if(!t || t.coluna===coluna) return;
  const antes = t.coluna; t.coluna = coluna; agRender(); // otimista
  const ordem = Math.max(0, ...estado.ag.tarefas.filter(x=>x.coluna===coluna && x.id!==id).map(x=>Number(x.ordem)||0)) + 1;
  const r = await tarefasApi({ op:'mover', id, coluna, ordem });
  if(!r || !r.ok){ t.coluna = antes; agRender(); showToast((r && r.error) || 'Não consegui mover.'); return; }
  Object.assign(t, r.data); agRender();
}

/* ---------- Formulário da tarefa ---------- */
function agEditar(t, dataPadrao){
  const ini = estado.ag.ini || {}; const me = ini.me || {};
  const nova = !t;
  t = t || { tipo:'privada', classificacao:'normal', coluna:'a_fazer', participantes:[], data: dataPadrao || '', loja_id: (me.lojas||[])[0] || ((ini.lojas||[])[0]||{}).id || '' };
  const souCriador = nova || t.criador_id===me.id;
  abrirModal(`<h2>${nova?'Nova tarefa':'Tarefa'}</h2>
    ${!souCriador?`<p class="muted" style="margin:-6px 0 10px;">Criada por <b>${escapeHtml(t.criador_nome||'—')}</b>. Você pode mudar o andamento e os detalhes; quem enxerga a tarefa só quem criou muda.</p>`:''}
    <div class="field"><label>Título</label><input id="agfTitulo" maxlength="200" value="${escapeHtml(t.titulo||'')}" placeholder="Ex.: Ligar para a cliente da O.S. MC12P"></div>
    <div class="field"><label>Detalhes</label><textarea id="agfDesc" rows="3" maxlength="4000" placeholder="Opcional">${escapeHtml(t.descricao||'')}</textarea></div>
    <div class="field"><label>Quem vê</label><div class="ag-tipo-op" id="agfTipo">
      ${Object.entries(AG_TIPOS).map(([k,x])=>`<label class="t-${k} ${t.tipo===k?'on':''}"><input type="radio" name="agfTipo" value="${k}" ${t.tipo===k?'checked':''} ${souCriador?'':'disabled'}><b>${x.nome}</b>${x.desc}</label>`).join('')}
    </div></div>
    <div class="field" id="agfLojaBox"><label>Loja</label><select id="agfLoja" ${souCriador?'':'disabled'}>${(ini.lojas||[]).map(l=>`<option value="${escapeHtml(l.id)}" ${l.id===t.loja_id?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select></div>
    <div class="field" id="agfPessoasBox"><label>Compartilhar com</label><div class="ag-pessoas">
      ${(ini.pessoas||[]).map(p=>`<label><input type="checkbox" value="${escapeHtml(p.id)}" ${(t.participantes||[]).includes(p.id)?'checked':''} ${souCriador?'':'disabled'}> ${escapeHtml(p.nome)}</label>`).join('') || '<span class="muted">Nenhuma outra pessoa cadastrada.</span>'}
    </div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">
      <div class="field"><label>Classificação</label><select id="agfCls">${Object.entries(AG_CLASSES).map(([k,n])=>`<option value="${k}" ${t.classificacao===k?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label>Andamento</label><select id="agfCol">${AG_COLUNAS.map(([k,n])=>`<option value="${k}" ${t.coluna===k?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label>Data</label><input type="date" id="agfData" value="${escapeHtml(t.data||'')}"></div>
      <div class="field"><label>Hora</label><input type="time" id="agfHora" value="${escapeHtml(t.hora||'')}"></div>
    </div>
    <p class="muted" id="agfErro" style="color:var(--danger,#B42318);display:none;margin:4px 0 0;"></p>
    <div class="rodape">
      ${!nova && t.posso_excluir?`<button class="btn btn-danger" id="agfExcluir" style="margin-right:auto;">Excluir</button>`:''}
      <button class="btn" id="agfCancelar">Cancelar</button><button class="btn btn-accent" id="agfSalvar">Salvar</button>
    </div>`);
  const tipoAtual = ()=> (document.querySelector('input[name="agfTipo"]:checked')||{}).value || 'privada';
  const pintarTipo = ()=>{
    const tp = tipoAtual();
    document.querySelectorAll('#agfTipo label').forEach(l=> l.classList.toggle('on', l.querySelector('input').value===tp));
    document.getElementById('agfLojaBox').style.display = tp==='loja' ? '' : 'none';
    document.getElementById('agfPessoasBox').style.display = tp==='compartilhada' ? '' : 'none';
  };
  document.querySelectorAll('input[name="agfTipo"]').forEach(r=> r.onchange = pintarTipo); pintarTipo();
  document.getElementById('agfCancelar').onclick = fecharModal;
  const ex = document.getElementById('agfExcluir');
  if(ex) ex.onclick = async ()=>{
    if(ex.dataset.confirma!=='1'){ ex.dataset.confirma='1'; ex.textContent='Confirmar exclusão'; return; }
    const r = await tarefasApi({ op:'excluir', id:t.id });
    if(!r || !r.ok){ showToast((r && r.error) || 'Não consegui excluir.'); return; }
    estado.ag.tarefas = estado.ag.tarefas.filter(x=>x.id!==t.id); fecharModal(); agRender(); showToast('Tarefa excluída');
  };
  document.getElementById('agfSalvar').onclick = async ()=>{
    const tarefa = {
      id: t.id || undefined,
      titulo: document.getElementById('agfTitulo').value.trim(),
      descricao: document.getElementById('agfDesc').value.trim(),
      tipo: tipoAtual(),
      loja_id: document.getElementById('agfLoja').value,
      participantes: [...document.querySelectorAll('#agfPessoasBox input:checked')].map(x=>x.value),
      classificacao: document.getElementById('agfCls').value,
      coluna: document.getElementById('agfCol').value,
      data: document.getElementById('agfData').value || null,
      hora: document.getElementById('agfHora').value || null,
      concluida_em: t.concluida_em || undefined,
    };
    const erro = document.getElementById('agfErro');
    const r = await tarefasApi({ op:'salvar', tarefa });
    if(!r || !r.ok){ erro.textContent = (r && r.error) || 'Não consegui salvar.'; erro.style.display='block'; return; }
    const salvo = { ...r.data, posso_excluir: nova ? true : t.posso_excluir };
    const i = estado.ag.tarefas.findIndex(x=>x.id===salvo.id);
    if(i>=0) estado.ag.tarefas[i] = salvo; else estado.ag.tarefas.push(salvo);
    fecharModal(); agRender(); showToast(nova ? 'Tarefa criada' : 'Tarefa salva');
  };
  document.getElementById('agfTitulo').focus();
}

/* ---------- Calendário: tarefas + lembretes + minhas vias ---------- */
function agEventosDoDia(iso){
  const ev = [];
  estado.ag.tarefas.filter(t=>t.data===iso).sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||''))).forEach(t=> ev.push({ cls:`t-${t.tipo} ${t.coluna==='feito'?'feito':''}`, txt:(t.hora?t.hora+' ':'')+t.titulo, tarefa:t.id }));
  estado.ag.lembretes.forEach(l=>{ const d = new Date(l.disparar_em); if(agDataISO(d)===iso) ev.push({ cls:'lemb', txt:'🔔 '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' '+(l.descricao||'') }); });
  if(estado.ag.mostrarVias) (estado.ag.vias||[]).forEach(v=>{
    const dia = v.tipo==='orcamento' ? v.validade : v.data;
    if(dia===iso && v.status!=='entregue' && v.status!=='cancelada' && v.status!=='cancelado') ev.push({ cls:'via', txt:(v.tipo==='pedido'?'🧾 entrega ':v.tipo==='orcamento'?'📝 vence ':'🛒 ')+(v.codigoVia||'')+' '+(v.cliente||''), via:v });
  });
  return ev;
}
function agRenderCalendario(c){
  const hoje = new Date();
  if(!estado.ag.mes) estado.ag.mes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const m = estado.ag.mes;
  const inicio = new Date(m.getFullYear(), m.getMonth(), 1 - m.getDay());
  const dias = []; for(let i=0;i<42;i++){ const d = new Date(inicio); d.setDate(inicio.getDate()+i); dias.push(d); }
  const hojeIso = agDataISO(hoje);
  c.innerHTML = `
    <div class="ag-cal-top" style="margin-bottom:8px;">
      <button class="btn btn-sm" id="agMesAnt">‹</button><b>${(t=>t.charAt(0).toUpperCase()+t.slice(1))(m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</b><button class="btn btn-sm" id="agMesProx">›</button>
      <button class="btn btn-sm" id="agMesHoje">Hoje</button>
      <label style="display:flex;gap:5px;align-items:center;font-size:12.5px;margin-left:8px;"><input type="checkbox" id="agMostrarVias" ${estado.ag.mostrarVias?'checked':''}> Mostrar minhas vias</label>
      ${agLegenda()}
    </div>
    <div class="ag-cal">
      ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${dias.map(d=>{
        const iso = agDataISO(d); const ev = agEventosDoDia(iso);
        return `<div class="ag-dia ${d.getMonth()!==m.getMonth()?'fora':''} ${iso===hojeIso?'hoje':''}" data-agdia="${iso}" title="Clique para criar uma tarefa neste dia">
          <span class="n">${d.getDate()}</span>
          ${ev.slice(0,3).map((e,i)=>`<span class="ag-ev ${e.cls}" data-agev="${i}" title="${escapeHtml(e.txt)}">${escapeHtml(e.txt)}</span>`).join('')}
          ${ev.length>3?`<span class="ag-mais">+${ev.length-3} mais</span>`:''}

   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();

  abrirModal(`<h2>Agendar retorno</h2><p class="muted" style="margin-top:0">Lembrete para você falar de novo com ${escapeHtml(nomeConv(c))}.</p>
    <div class="field"><label>Quando</label><input id="rtQuando" type="datetime-local" value="${dtLocal(3600000)}"></div>
    <div class="field"><label>Repetir</label><select id="rtRec"><option value="nenhuma">Não repetir</option><option value="diaria">Todo dia</option><option value="semanal">Toda semana</option><option value="mensal">Todo mês</option></select></div>
    <div class="field"><label>Observação</label><input id="rtObs"></div>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-accent" id="mOk">Salvar</button></div>`);
  document.getElementById('mCancel').onclick = fecharModal;
  document.getElementById('mOk').onclick = async ()=>{
    const q = document.getElementById('rtQuando').value; if(!q){ showToast('Informe a data e hora.'); return; }
    const r = await ext({ op:'retornoSalvar', conversaId:c.id, quando:new Date(q).toISOString(), recorrencia:document.getElementById('rtRec').value, observacao:document.getElementById('rtObs').value });
    if(r && r.ok){ fecharModal(); showToast('Retorno agendado.'); } else showToast(r && r.error || 'Erro');
  };
}
// opts: { conversaId } (conversa existente)  |  {} (contato novo; exige permissão de atendimento ativo)
function modalProgramar(opts){
  opts = opts||{}; const c = opts.conversaId ? estado.atual : null;
  const botsWa = estado.bots.filter(b=>b.ativo && b.canais.some(x=>x.tipo==='whatsapp'));
  abrirModal(`<h2>Programar mensagem</h2>
    ${c ? `<p class="muted" style="margin-top:0">Para ${escapeHtml(nomeConv(c))}.</p>` : `<div class="field"><label>Pelo bot / número</label><select id="pgBot">${botsWa.map(b=>`<option value="${b.id}">${escapeHtml(b.nome)}</option>`).join('')}</select></div><div class="field"><label>WhatsApp do cliente (com DDD)</label><input id="pgNum" inputmode="numeric" placeholder="32999998888"></div><div class="field"><label>Nome (opcional)</label><input id="pgNome"></div>`}
    <div class="field"><label>Enviar em</label><input id="pgQuando" type="datetime-local" value="${dtLocal(3600000)}"></div>
    <div class="field"><label>Mensagem</label><textarea id="pgTexto" rows="4"></textarea></div>
    <p class="muted">Número OFICIAL: fora da janela de 24h a mensagem precisa ser um modelo aprovado — use “Programar com modelo”.</p>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn" id="pgTpl">Programar com modelo</button><button class="btn btn-accent" id="mOk">Programar</button></div>`);
  document.getElementById('mCancel').onclick = fecharModal;
  const base = ()=>{
    const q = document.getElementById('pgQuando').value; if(!q){ showToast('Informe data e hora.'); return null; }
    const o = { op:'programadaSalvar', quando:new Date(q).toISOString() };
    if(c) o.conversaId = c.id; else { o.botId = document.getElementById('pgBot').value; o.numero = document.getElementById('pgNum').value; o.nome = document.getElementById('pgNome').value.trim(); }
    return o;
  };
  document.getElementById('mOk').onclick = async ()=>{
    const o = base(); if(!o) return; o.texto = document.getElementById('pgTexto').value.trim(); if(!o.texto){ showToast('Escreva a mensagem.'); return; }
    const r = await ext(o); if(r && r.ok){ fecharModal(); showToast('Mensagem programada.'); } else showToast(r && r.error || 'Erro');
  };
  document.getElementById('pgTpl').onclick = ()=>{
    const o = base(); if(!o) return;
    const inst = c ? c.instancia : ofInst(o.botId); if(!inst || !String(inst).startsWith('wa_')){ showToast('Modelos aprovados só existem no número oficial.'); return; }
    modalTemplate({ instancia:inst, aviso:'Escolha o modelo que será enviado no horário programado.', acao: t=> ext({ ...o, template:t }), aoOk:()=>{ fecharModal(); showToast('Mensagem programada.'); } });
  };
}
function modalCampanha(){
  const botsWa = estado.bots.filter(b=>b.ativo && b.canais.some(x=>x.tipo==='whatsapp'));
  abrirModal(`<h2>Nova campanha</h2>
    <div class="field"><label>Nome da campanha</label><input id="cpNome"></div>
    <div class="field"><label>Pelo bot / número</label><select id="cpBot">${botsWa.map(b=>`<option value="${b.id}">${escapeHtml(b.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Quem recebe</label><select id="cpOrig"><option value="tag">Contatos com uma tag (conversas do bot)</option><option value="agenda">Agenda de contatos</option></select></div>
    <div class="field" id="cpTagBox"><label>Tag</label><input id="cpTag" placeholder="Ex.: ALIANÇA"></div>
    <div class="field" id="cpDepBox" style="display:none;"><label>Departamento (opcional)</label><select id="cpDep">${optDepAll('', 'Todos')}</select></div>
    <div class="field"><label>Início</label><input id="cpIni" type="datetime-local" value="${dtLocal(600000)}"></div>
    <div class="field"><label>Intervalo entre envios (segundos, mín. 5)</label><input id="cpInt" type="number" min="5" value="30" style="width:100px;"></div>
    <div class="field"><label>Mensagem</label><textarea id="cpTexto" rows="4"></textarea></div>
    <p class="muted">Contatos da blacklist são ignorados. Número OFICIAL: use “Criar com modelo”.</p>
    <div class="rodape"><button class="btn" id="mCancel">Cancelar</button><button class="btn" id="cpTpl">Criar com modelo</button><button class="btn btn-accent" id="mOk">Criar</button></div>`);
  document.getElementById('mCancel').onclick = fecharModal;
  const o2 = document.getElementById('cpOrig'); o2.onchange = ()=>{ document.getElementById('cpTagBox').style.display = o2.value==='tag'?'':'none'; document.getElementById('cpDepBox').style.display = o2.value==='agenda'?'':'none'; };
  const base = ()=>{
    const nome = document.getElementById('cpNome').value.trim(); if(!nome){ showToast('Dê um nome à campanha.'); return null; }
    return { op:'campanhaCriar', nome, botId:document.getElementById('cpBot').value, origem:o2.value, tag:document.getElementById('cpTag').value.trim() || undefined, departamentoId:document.getElementById('cpDep').value || undefined, inicio:new Date(document.getElementById('cpIni').value || Date.now()).toISOString(), intervaloSeg:Number(document.getElementById('cpInt').value)||30 };
  };
  const fim = r=>{ fecharModal(); showToast(`Campanha criada: ${r.total} envio(s) programado(s)${r.ignorados?` (${r.ignorados} ignorado(s))`:''}.`); };
  document.getElementById('mOk').onclick = async ()=>{
    const o = base(); if(!o) return; o.texto = document.getElementById('cpTexto').value.trim(); if(!o.texto){ showToast('Escreva a mensagem.'); return; }
    if(!confirm('Criar a campanha e programar os envios?')) return;
    const r = await ext(o); if(r && r.ok) fim(r); else showToast(r && r.error || 'Erro');
  };
  document.getElementById('cpTpl').onclick = ()=>{
    const o = base(); if(!o) return; const inst = ofInst(o.botId); if(!inst){ showToast('Este bot não tem número oficial.'); return; }
    modalTemplate({ instancia:inst, aviso:'Modelo que será enviado a todos da campanha.', acao: t=> ext({ ...o, template:t }), aoOk: fim });
  };
}
async function blacklistDaConversa(){
  const c = estado.atual; if(!c) return; if(!confirm(`Colocar ${nomeConv(c)} na blacklist? O bot e os atendentes deixam de enviar mensagens a este contato.`)) return;
  const r = await ext({ op:'blacklistSalvar', canal:c.canal, contato:c.contato_id, nome:c.contato_nome||'' });
  if(r && r.ok){ showToast('Contato na blacklist.'); await carregarBl(); carregarLista(true); } else showToast(r && r.error || 'Erro');
}
function extraAcoes(c, a){
  if(c.status!=='finalizado'){ a.push(`<button class="btn btn-sm" data-a="retorno" title="Agendar retorno">⏰ Retorno</button>`); a.push(`<button class="btn btn-sm" data-a="programar" title="Programar mensagem">🗓 Programar</button>`); }
  a.push(`<button class="btn btn-sm" data-a="campos" title="Campos do atendimento">📋 Campos</button>`);
  if(ehOficial(c) && c.status!=='finalizado') a.push(`<button class="btn btn-sm" data-a="modeloOficial" title="Enviar modelo aprovado">📄 Modelo</button>`);
  if(souSup()) a.push(`<button class="btn btn-sm" data-a="blacklist" title="Bloquear contato">🚫</button>`);
}

/* ---------- FERRAMENTAS ---------- */
let ferrAba = null;
function modalFerr(aba){
  const abas = [];
  if(temP('verAgenda')) abas.push(['agenda','📒 Agenda']);
  abas.push(['retornos','🔁 Retornos'],['prog','🗓 Programadas'],['pot','🎯 Potenciais'],['recados','📝 Recados']);
  if(souSup()) abas.push(['sup','👁 Supervisão']);
  abas.push(['rel','📑 Relatórios']);
  if(souSup()) abas.push(['bl','🚫 Blacklist']);
  if(estado.admin) abas.push(['campos','🧩 Campos']);
  ferrAba = aba || (abas.some(x=>x[0]===ferrAba) ? ferrAba : abas[0][0]);
  abrirModal(`<h2>Ferramentas</h2><div class="abas" id="ftAbas">${abas.map(([k,t])=>`<button data-k="${k}" class="${k===ferrAba?'on':''}">${t}</button>`).join('')}</div><div id="ftCorpo"></div><div class="rodape"><button class="btn" id="mFechar">Fechar</button></div>`);
  document.getElementById('modalBox').classList.add('largo');
  document.getElementById('mFechar').onclick = fecharModal;
  document.querySelectorAll('#ftAbas button').forEach(b=> b.onclick = ()=> modalFerr(b.dataset.k));
  ({ agenda:ftAgenda, retornos:ftRetornos, prog:ftProg, pot:ftPot, recados:ftRecados, sup:ftSup, rel:ftRel, bl:ftBl, campos:ftCampos })[ferrAba]();
}
const tabelaHtml = (cab, linhas) => `<div style="overflow:auto;"><table class="tb"><thead><tr>${cab.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${linhas.join('')}</tbody></table></div>`;
const vazio = (n, txt) => n ? '' : `<p class="muted">${txt||'Nada encontrado.'}</p>`;
function abrirDaFerr(id){ fecharModal(); abrirConversa(id); document.getElementById('app').classList.add('ver-chat'); }

/* agenda / carteira */
function ftAgenda(){
  const c = document.getElementById('ftCorpo');
  c.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin-bottom:8px;"><div class="field" style="margin:0;"><label>Nome ou telefone</label><input id="agBusca"></div><div class="field" style="margin:0;"><label>Atendente</label><select id="agAt">${optAt('', 'Todos')}</select></div><label style="display:flex;gap:4px;align-items:center;font-weight:400;"><input type="checkbox" id="agCart"> Só carteira</label><button class="btn btn-accent" id="agBuscar">Buscar</button><button class="btn" id="agNovo">➕ Novo contato</button></div><div id="agRes" class="muted">Use “Buscar” para listar os contatos.</div>`;
  document.getElementById('agNovo').onclick = ()=> ftContatoForm(null);
  document.getElementById('agBuscar').onclick = async ()=>{
    const res = document.getElementById('agRes'); res.textContent = 'Buscando…';
    const r = await ext({ op:'contatosLista', busca:document.getElementById('agBusca').value.trim(), atendenteId:document.getElementById('agAt').value || undefined, carteira:document.getElementById('agCart').checked || undefined });
    if(!r || !r.ok){ res.textContent = (r && r.error) || 'Erro'; return; }
    const l = r.data||[]; res.className = '';
    res.innerHTML = vazio(l.length, 'Nenhum contato.') + (l.length ? tabelaHtml(['Nome','Telefone','Atendente','Carteira','Obs.',''], l.map((x,i)=>`<tr><td>${escapeHtml(x.nome||'')}</td><td>${escapeHtml(x.canal==='whatsapp'?fmtTel(x.telefone):x.telefone)}</td><td>${escapeHtml(x.atendente_nome||'')}</td><td>${x.carteira?'✔':''}</td><td>${escapeHtml(x.observacao||'')}</td><td><button class="btn btn-sm" data-e="${i}">Editar</button> <button class="btn btn-sm btn-danger" data-d="${i}">✕</button></td></tr>`)) : '');
    res.querySelectorAll('[data-e]').forEach(b=> b.onclick = ()=> ftContatoForm(l[b.dataset.e]));
    res.querySelectorAll('[data-d]').forEach(b=> b.onclick = async ()=>{ const x = l[b.dataset.d]; if(!confirm('Excluir '+(x.nome||x.telefone)+' da agenda?')) return; const rr = await ext({ op:'contatoExcluir', id:x.id }); if(rr && rr.ok){ showToast('Excluído.'); document.getElementById('agBuscar').click(); } else showToast(rr && rr.error || 'Erro'); });
  };
}
async function ftContatoForm(x){
  x = x || { canal:'whatsapp', carteira:false, campos:{} };
  const c = document.getElementById('ftCorpo'); const rc = await ext({ op:'camposLista' }); const campos = ((rc && rc.data)||[]).filter(k=>k.entidade==='contato');
  const podeCart = estado.gestao || souSup();
  c.innerHTML = `<div class="field"><label>Nome</label><input id="ctNome" value="${escapeHtml(x.nome||'')}"></div>
    <div class="field"><label>Telefone (com DDD)</label><input id="ctTel" inputmode="numeric" value="${escapeHtml(x.telefone ? (x.canal==='whatsapp'?fmtTel(x.telefone):x.telefone) : '')}" ${x.id?'disabled':''} placeholder="(32) 99999-8888"></div>
    <div class="field"><label>Atendente responsável</label><select id="ctAt">${optAt(x.atendente_id, '— nenhum —')}</select></div>
    <div class="field"><label>Departamento</label><select id="ctDep">${optDepAll(x.departamento_id, '— nenhum —')}</select></div>
    <label style="display:flex;gap:6px;align-items:center;font-weight:400;margin-bottom:8px;"><input type="checkbox" id="ctCart" ${x.carteira?'checked':''} ${podeCart?'':'disabled'}> Carteira: este contato sempre cai direto para o atendente responsável</label>
    <div class="field"><label>Observação</label><input id="ctObs" value="${escapeHtml(x.observacao||'')}"></div>
    <div id="ctCampos">${camposHtml(campos, x.campos)}</div>
    <div class="rodape"><button class="btn" id="ctVolta">Voltar</button><button class="btn btn-accent" id="ctOk">Salvar</button></div>`;
  document.getElementById('ctVolta').onclick = ftAgenda;
  document.getElementById('ctOk').onclick = async ()=>{
    const r = await ext({ op:'contatoSalvar', id:x.id, canal:x.canal||'whatsapp', telefone:x.telefone || document.getElementById('ctTel').value, nome:document.getElementById('ctNome').value, atendente_id:document.getElementById('ctAt').value || null, departamento_id:document.getElementById('ctDep').value || null, carteira:document.getElementById('ctCart').checked, observacao:document.getElementById('ctObs').value, campos:camposLer(document.getElementById('ctCampos')) });
    if(r && r.ok){ showToast('Contato salvo.'); ftAgenda(); } else showToast(r && r.error || 'Erro');
  };
}

/* recados */
function ftRecados(){
  const c = document.getElementById('ftCorpo');
  c.innerHTML = `<p class="muted" style="margin-top:0">Mensagens deixadas fora do horário de atendimento.</p><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin-bottom:8px;"><div class="field" style="margin:0;"><label>De</label><input type="date" id="rcDe"></div><div class="field" style="margin:0;"><label>Até</label><input type="date" id="rcAte"></div><div class="field" style="margin:0;"><label>Situação</label><select id="rcSt"><option value="">Todas</option><option value="pendente">Pendentes</option><option value="em atendimento">Em atendimento</option><option value="finalizado">Finalizados</option></select></div><button class="btn btn-accent" id="rcBuscar">Buscar</button></div><div id="rcRes" class="muted">Use “Buscar”.</div>`;
  document.getElementById('rcBuscar').onclick = async ()=>{
    const res = document.getElementById('rcRes'); res.textContent = 'Buscando…';
    const de = document.getElementById('rcDe').value, ate = document.getElementById('rcAte').value;
    const r = await ext({ op:'recados', situacao:document.getElementById('rcSt').value || undefined, de: de ? new Date(de+'T00:00:00').toISOString() : undefined, ate: ate ? new Date(ate+'T23:59:59').toISOString() : undefined });

    const l = r.data||[]; res.className = '';
    res.innerHTML = vazio(l.length, 'Nenhum recado.') + (l.length ? tabelaHtml(['Contato','Canal','Última mensagem','Situação',''], l.map((x,i)=>`<tr><td>${escapeHtml(x.contato_nome||fmtTel(x.contato_id))}</td><td>${escapeHtml(x.canal)}</td><td>${fmtDH(x.ultima_mensagem_em)}<div class="muted">${escapeHtml((x.ultima_mensagem_texto||'').slice(0,60))}</div></td><td>${escapeHtml(x.situacao)}</td><td><button class="btn btn-sm" data-o="${i}">Abrir</button></td></tr>`)) : '');

}

/* supervisão */
function ftSup(){
  const c = document.getElementById('ftCorpo');
  c.innerHTML = `<p class="muted" style="margin-top:0">Conversas abertas dos departamentos que você supervisiona.</p><button class="btn btn-accent" id="spBuscar" style="margin-bottom:8px;">Buscar</button><div id="spRes" class="muted">Use “Buscar”.</div>`;
  document.getElementById('spBuscar').onclick = async ()=>{
    const res = document.getElementById('spRes'); res.textContent = 'Buscando…';
    const r = await ext({ op:'supLista' }); if(!r || !r.ok){ res.textContent = (r && r.error) || 'Erro'; return; }
    const l = r.data||[]; res.className = '';
    res.innerHTML = vazio(l.length, 'Nenhuma conversa aberta.') + (l.length ? tabelaHtml(['Contato','Departamento','Atendente','Última mensagem',''], l.map((x,i)=>`<tr><td>${escapeHtml(x.contato_nome||fmtTel(x.contato_id))}</td><td>${escapeHtml(nomeDep(x.departamento_id)||x.setor||'')}</td><td>${escapeHtml(x.atendente_nome||'— fila —')}</td><td>${fmtDH(x.ultima_mensagem_em)}</td><td><button class="btn btn-sm" data-v="${i}">Ver / atribuir</button></td></tr>`)) : '');
    res.querySelectorAll('[data-v]').forEach(b=> b.onclick = ()=> spVer(l[b.dataset.v].id));
  };
}
async function spVer(id){
  const c = document.getElementById('ftCorpo'); c.innerHTML = '<p class="muted">Carregando…</p>';
  const r = await ext({ op:'supMensagens', conversaId:id }); if(!r || !r.ok){ c.innerHTML = `<p class="muted">${escapeHtml((r && r.error)||'Erro')}</p><button class="btn" id="spV">Voltar</button>`; document.getElementById('spV').onclick = ftSup; return; }
  const cv = r.conversa;
  c.innerHTML = `<h3 style="margin:0 0 6px;font-size:14px;">${escapeHtml(cv.contato_nome||fmtTel(cv.contato_id))} <span class="muted">· ${escapeHtml(cv.atendente_nome||'na fila')}</span></h3>
    <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);">${(r.data||[]).map(m=>`<div style="margin:4px 0;${m.direcao==='out'?'text-align:right;':''}"><span class="muted" style="font-size:11px;">${escapeHtml(m.autor_nome||(m.direcao==='in'?'Cliente':''))} · ${fmtDH(m.enviada_em)}</span><div>${escapeHtml(m.texto||(m.tipo!=='texto'?'['+m.tipo+']':''))}</div></div>`).join('')}</div>
    <div class="field" style="margin-top:10px;"><label>Atribuir a</label><select id="spAt">${optAt(cv.atendente_id, '— devolver para a fila —')}</select></div>
    <div class="rodape"><button class="btn" id="spV">Voltar</button><button class="btn btn-accent" id="spOk">Atribuir</button></div>`;
  document.getElementById('spV').onclick = ftSup;
  document.getElementById('spOk').onclick = async ()=>{ const rr = await ext({ op:'supAtribuir', conversaId:id, atendenteId:document.getElementById('spAt').value || null }); if(rr && rr.ok){ showToast('Conversa redistribuída.'); ftSup(); carregarLista(true); } else showToast(rr && rr.error || 'Erro'); };
}

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"><button class="btn btn-accent" id="rlBuscar">Buscar</button><button class="btn" id="rlCsv" disabled>⬇ Exportar CSV</button><button class="btn" id="rlNotas">⭐ Notas médias</button><button class="btn" id="rlCont">👥 Relatório de contatos</button></div><div id="rlRes" class="muted">Use “Buscar”.</div>`;

    ultimo = r.data||[]; res.className = '';

  };
  document.getElementById('rlCont').onclick = async ()=>{
    const res = document.getElementById('rlRes'); res.textContent = 'Buscando contatos…';
    const [r, rc] = await Promise.all([ ext({ op:'relContatos' }), ext({ op:'camposLista' }) ]); if(!r || !r.ok){ res.textContent = (r && r.error) || 'Erro'; return; }
    const campos = ((rc && rc.data)||[]).filter(k=>k.entidade==='contato'); const l = r.data||[]; res.className = '';

    document.getElementById('rlCsv2').onclick = ()=> csvBaixar('contatos.csv', [['Nome','Canal','Telefone','Atendente','Carteira','Observação','Atendimentos','Última mensagem'].concat(campos.map(k=>k.nome))].concat(l.map(x=>[x.nome||'', x.canal, x.canal==='whatsapp'?fmtTel(x.contato_id):x.contato_id, x.atendente||'', x.carteira?'SIM':'', x.observacao||'', x.atendimentos, fmtDH(x.ultima)].concat(campos.map(k=>(x.campos||{})[k.id]||'')))));
  };
}

/* campos customizados (cadastro) */
async function ftCampos(){
  const c = document.getElementById('ftCorpo'); c.innerHTML = '<p class="muted">Carregando…</p>';
  const r = await ext({ op:'camposLista' }); if(!r || !r.ok){ c.innerHTML = `<p class="muted">${escapeHtml((r && r.error)||'Erro')}</p>`; return; }
  const l = r.data||[];
  c.innerHTML = `<p class="muted" style="margin-top:0">Campos extras que aparecem na ficha do contato (agenda) e no atendimento.</p>` + (l.map((x,i)=>`<div class="cartao"><div><div class="t">${escapeHtml(x.nome)}</div><div class="x">${x.entidade==='contato'?'Contato':'Atendimento'} · ${escapeHtml(x.tipo)}${x.opcoes&&x.opcoes.length?' · '+escapeHtml(x.opcoes.join(', ')):''}</div></div><div style="display:flex;gap:6px;"><button class="btn btn-sm" data-e="${i}">Editar</button><button class="btn btn-sm btn-danger" data-d="${i}">✕</button></div></div>`).join('') || '<p class="muted">Nenhum campo cadastrado.</p>') +
    `<div style="display:flex;gap:6px;margin-top:8px;"><button class="btn btn-accent" id="cmNovo">➕ Novo campo</button><button class="btn" id="cmPad">Criar campos padrão</button></div>`;
  c.querySelectorAll('[data-e]').forEach(b=> b.onclick = ()=> ftCampoForm(l[b.dataset.e]));
  c.querySelectorAll('[data-d]').forEach(b=> b.onclick = async ()=>{ if(!confirm('Excluir este campo? Os valores já preenchidos deixam de aparecer.')) return; const rr = await ext({ op:'campoExcluir', id:l[b.dataset.d].id }); if(rr && rr.ok) ftCampos(); else showToast(rr && rr.error || 'Erro'); });
  document.getElementById('cmNovo').onclick = ()=> ftCampoForm(null);
  document.getElementById('cmPad').onclick = async ()=>{ const rr = await ext({ op:'camposPadrao' }); if(rr && rr.ok){ showToast(`${rr.criados} campo(s) criado(s).`); ftCampos(); } else showToast(rr && rr.error || 'Erro'); };
}
function ftCampoForm(x){
  x = x || { entidade:'contato', tipo:'texto' };
  const c = document.getElementById('ftCorpo');
  c.innerHTML = `<div class="field"><label>Nome</label><input id="cfNome" value="${escapeHtml(x.nome||'')}"></div>
    <div class="field"><label>Pertence a</label><select id="cfEnt"><option value="contato" ${x.entidade==='contato'?'selected':''}>Contato (agenda)</option><option value="atendimento" ${x.entidade==='atendimento'?'selected':''}>Atendimento</option></select></div>
    <div class="field"><label>Tipo</label><select id="cfTipo">${['texto','numero','data','lista'].map(t=>`<option ${x.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field" id="cfOpBox"><label>Opções da lista (separe por vírgula)</label><input id="cfOp" value="${escapeHtml((x.opcoes||[]).join(', '))}"></div>
    <div class="field"><label>Nome para integração (opcional)</label><input id="cfInt" value="${escapeHtml(x.nome_integracao||'')}" placeholder="ex.: cpf"></div>
    <div class="rodape"><button class="btn" id="cfV">Voltar</button><button class="btn btn-accent" id="cfOk">Salvar</button></div>`;
  const t = document.getElementById('cfTipo'); const sh = ()=>{ document.getElementById('cfOpBox').style.display = t.value==='lista'?'':'none'; }; t.onchange = sh; sh();
  document.getElementById('cfV').onclick = ftCampos;
  document.getElementById('cfOk').onclick = async ()=>{ const r = await ext({ op:'campoSalvar', id:x.id, nome:document.getElementById('cfNome').value, entidade:document.getElementById('cfEnt').value, tipo:t.value, opcoes:document.getElementById('cfOp').value, nome_integracao:document.getElementById('cfInt').value, ordem:x.ordem||0 }); if(r && r.ok){ showToast('Campo salvo.'); ftCampos(); } else showToast(r && r.error || 'Erro'); };
}

function lerExtraFluxo(c){
  const g = id => document.getElementById(id);
  return {
    enviar_nome_atendente: g('fxNome').checked, motivo_obrigatorio: g('fxMotObr').checked,
    motivos: g('fxMot').value.split('\n').map(s=>s.trim()).filter(Boolean),
    contato_pode_finalizar: g('fxCpf').checked, palavras_finalizar: g('fxPalFin').value.split(',').map(s=>s.trim()).filter(Boolean),
    agrupar_segundos: Number(g('fxAgr').value)||0, recado_minutos: Number(g('fxRec').value)||0, interativo: g('fxInt').checked,
    enquete: { ativa: g('flEnq').checked, escala: g('fxEsc').value, tempo_min: Number(g('fxEnqT').value)||0 },
    potenciais: { modo: g('fxPot').value, minutos: Number(g('fxPotMin').value)||10 }
  };
}

/* ================= AGENTE DE IA (função atendimento-ia) ================= */
const IA_URL = SUPABASE_URL + "/functions/v1/atendimento-ia";
async function ia(body){
  try{
    const res = await fetch(IA_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) });
    return await res.json();
  }catch(e){ return { error:String(e) }; }
}
const ETAPA_IA = { curioso:'Curioso', orcamento:'Orçamento', negociando:'Negociando', fechado:'Fechado', 'pos-venda':'Pós-venda' };
const iaCfgBot = id => { const b = estado.bots.find(x=>x.id===id); return (b && b.config && b.config.ia) || {}; };
function iaBarRender(c){
  const bar = document.getElementById('iaBar'); if(!bar || !c) return;
  document.getElementById('btnIaSug').style.display = iaCfgBot(c.bot_id).sugerir===false ? 'none' : '';
  const d = c.ia_dados || {};
  document.getElementById('btnIaRes').textContent = '📝 Resumo IA' + (d.etapa && ETAPA_IA[d.etapa] ? ' · ' + ETAPA_IA[d.etapa] : '');
}
function iaDescartarSug(){
  const s = estado.iaSug; estado.iaSug = null;
  const t = document.getElementById('texto'); if(t) t.classList.remove('ia-sug');
  if(s && s.logId) ia({ op:'marcarUso', logId:s.logId, usado:false });
}
async function iaSugerir(){
  const c = estado.atual; if(!c) return;
  const t = document.getElementById('texto'), btn = document.getElementById('btnIaSug');
  if(t.value.trim() && !estado.iaSug && !confirm('Substituir o texto que já está no campo pela sugestão da IA?')) return;
  btn.disabled = true; const rot = btn.textContent; btn.textContent = '✨ Pensando…';
  const r = await ia({ op:'sugerir', conversaId:c.id });
  btn.disabled = false; btn.textContent = rot;
  if(!estado.atual || estado.atual.id!==c.id) return;
  if(!r || !r.ok){ showToast((r && r.error) || 'A IA não respondeu'); return; }
  if(estado.iaSug && estado.iaSug.logId) ia({ op:'marcarUso', logId:estado.iaSug.logId, usado:false });
  estado.iaSug = { logId:r.logId, conversaId:c.id, texto:r.sugestao };
  t.value = r.sugestao; t.classList.add('ia-sug'); t.focus();
  showToast('Sugestão da IA no campo — revise antes de enviar.');
}
async function modalResumoIA(forcar){
  const c = estado.atual; if(!c) return;
  const desatualizado = !c.ia_resumo || !c.ia_resumo_em || (c.ultima_mensagem_em && new Date(c.ultima_mensagem_em) > new Date(c.ia_resumo_em));
  if(forcar || !c.ia_resumo){
    abrirModal('<h2>📝 Resumo IA</h2><p class="muted">A IA está lendo a conversa…</p>');
    const r = await ia({ op:'resumir', conversaId:c.id });
    if(!estado.atual || estado.atual.id!==c.id) return;
    if(!r || !r.ok){ abrirModal(`<h2>📝 Resumo IA</h2><p>${escapeHtml((r&&r.error)||'Erro ao gerar o resumo')}</p><div class="rodape"><button class="btn" id="mCancel">Fechar</button></div>`); document.getElementById('mCancel').onclick = fecharModal; return; }
    c.ia_resumo = r.resumo.resumo; c.ia_resumo_em = r.resumo.ia_resumo_em; c.ia_dados = Object.assign({}, c.ia_dados||{}, r.resumo);
    iaBarRender(c);
  }
  const d = c.ia_dados || {}; const atuais = c.tags || [];
  const sug = (d.etiquetasSugeridas||[]).filter(Boolean);
  const linha = (rot, v) => v ? `<b>${rot}</b><div>${v}</div>` : '';
  abrirModal(`<h2>📝 Resumo IA</h2>
    <div class="ia-res">
      ${linha('Resumo', escapeHtml(c.ia_resumo||''))}
      ${linha('Interesse', escapeHtml(d.interesse||''))}
      ${linha('Etapa', escapeHtml(ETAPA_IA[d.etapa]||d.etapa||''))}
      ${linha('Produtos', (d.produtos||[]).map(p=>`<span class="tagchip">${escapeHtml(p)}</span>`).join(''))}
      ${linha('Sentimento', escapeHtml(d.sentimento||''))}
      ${linha('Próxima ação', escapeHtml(d.proximaAcao||''))}
    </div>
    ${sug.length?`<div class="field"><label>Etiquetas sugeridas (clique para marcar/desmarcar)</label><div class="tag-sug" id="iaTags">${sug.map((t,i)=>`<button type="button" data-i="${i}" class="${atuais.includes(t)?'':'on'}">${escapeHtml(t)}${atuais.includes(t)?' ✓':''}</button>`).join('')}</div></div>`:''}
    <p class="muted" style="margin:0;">${c.ia_resumo_em?'Gerado em '+escapeHtml(fmtDH(c.ia_resumo_em)):''}${desatualizado&&!forcar&&c.ia_resumo?' · há mensagens novas depois deste resumo':''}</p>
    <div class="rodape"><button class="btn" id="mCancel">Fechar</button><button class="btn" id="iaAtualizar">↻ Atualizar resumo</button>${sug.length?'<button class="btn btn-accent" id="iaAplicar">🏷 Aplicar etiquetas</button>':''}</div>`);
  document.getElementById('mCancel').onclick = fecharModal;
  document.getElementById('iaAtualizar').onclick = ()=> modalResumoIA(true);
  const box = document.getElementById('iaTags');
  if(box) box.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ if(atuais.includes(sug[+b.dataset.i])) return; b.classList.toggle('on'); });
  const ap = document.getElementById('iaAplicar');
  if(ap) ap.onclick = async ()=>{
    const marcadas = [...box.querySelectorAll('button.on')].map(b=> sug[+b.dataset.i]);
    const tags = [...new Set(atuais.concat(marcadas))];
    if(tags.length===atuais.length){ showToast('Nenhuma etiqueta nova marcada.'); return; }
    const r = await api({ op:'tags', conversaId:c.id, tags });
    if(r && r.ok){ fecharModal(); showToast('Etiquetas aplicadas.'); await abrirConversa(c.id); carregarLista(true); } else showToast((r&&r.error)||'Erro');
  };
}

/* ---------- Administrar: aba Agente de IA ---------- */
let iaBotId = null;
async function abaIA(){
  const c = document.getElementById('abCorpo');
  if(!estado.bots.length){ c.innerHTML = '<p class="muted">Crie um bot primeiro na aba “Bots e canais”.</p>'; return; }
  if(!iaBotId || !estado.bots.find(b=>b.id===iaBotId)) iaBotId = estado.bots[0].id;
  const bot = estado.bots.find(b=>b.id===iaBotId);
  c.innerHTML = '<p class="muted">Carregando…</p>';
  const [rc, rk] = await Promise.all([ ia({ op:'config', botId:iaBotId }), ia({ op:'conhecimentoLista', botId:iaBotId }) ]);
  if(document.getElementById('abCorpo')!==c || adminAba!=='ia') return;
  if(!rc || !rc.ok){ c.innerHTML = `<p>${escapeHtml((rc&&rc.error)||'Erro ao carregar')}</p><p class="muted">A função <b>atendimento-ia</b> precisa estar publicada.</p>`; return; }
  const x = rc.ia || {}; const itens = (rk && rk.data) || [];
  const sw = (id, on, t, d) => `<label class="ia-sw"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${t}<small>${d}</small></span></label>`;
  const semHorario = !bot.horario || !bot.horario.dias;
  c.innerHTML = `${estado.bots.length>1?`<div class="field"><label>Bot</label><select id="iaBot">${estado.bots.map(b=>`<option value="${b.id}" ${b.id===iaBotId?'selected':''}>${escapeHtml(b.nome)}</option>`).join('')}</select></div>`:`<p class="muted" style="margin-top:0">Bot: <b>${escapeHtml(bot.nome)}</b></p>`}
    ${rc.temGemini===false?'<div class="aviso-bloqueado" style="border-radius:10px;margin-bottom:10px;">A chave GEMINI_API_KEY não está configurada nas funções — a IA não vai responder.</div>':''}
    <details class="sec" open><summary>⚙️ Configuração do agente</summary><div>
      ${sw('iaAtivo', x.ativo, '<b>Agente de IA ligado</b>', 'Liga as ações automáticas abaixo (responder fora do horário e resumo automático).')}
      ${sw('iaSugerir', x.sugerir!==false, '✨ Sugerir respostas', 'Mostra o botão “Sugerir resposta” nas conversas deste bot (a atendente revisa antes de enviar).')}
      ${sw('iaResAuto', x.resumoAuto, '📝 Resumo automático', 'Ao finalizar um atendimento, a IA grava o resumo, a etapa e as etiquetas sugeridas.')}
      ${sw('iaFora', x.foraHorario, '🌙 Responder fora do horário', `Fora do expediente a IA responde com base na base de conhecimento (máx. ${escapeHtml(String(x.maxAuto||6))} respostas por conversa) e sempre avisa que um atendente continua no horário comercial.`)}
      ${semHorario?`<p class="muted" style="margin:-2px 0 10px 26px;color:var(--wait);">⚠️ Este bot está sem horário definido (24h) — a resposta fora do horário só acontece depois de definir o horário em “Bots e canais”.</p>`:`<p class="muted" style="margin:-2px 0 10px 26px;">Horário do bot: ${escapeHtml(rc.horario||'')}</p>`}
      <div class="field"><label>Persona / instruções da IA</label><textarea id="iaPersona" rows="5" placeholder="Ex.: Você é a atendente da Vilaça Joias, joalheria em Juiz de Fora. Fale de forma calorosa e elegante, chame o cliente pelo nome, ofereça visita à loja…">${escapeHtml(x.persona||'')}</textarea></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <div class="field" style="flex:2;min-width:200px;"><label>Assinatura das respostas automáticas</label><input id="iaAss" value="${escapeHtml(x.assinatura||'🤖 Assistente Vilaça')}" maxlength="60"></div>
        <div class="field" style="flex:1;min-width:120px;"><label>Máx. respostas por conversa</label><input id="iaMax" type="number" min="1" max="10" value="${escapeHtml(String(x.maxAuto||6))}"></div>
      </div>
      <div class="field"><label>Frase final fora do horário (opcional)</label><input id="iaFim" value="${escapeHtml(x.mensagemFim||'')}" placeholder="Padrão: Um(a) atendente da nossa equipe continua seu atendimento assim que abrirmos (horário). 😊"></div>
      <button class="btn btn-accent" id="iaSalvar">Salvar configuração</button>
    </div></details>
    <details class="sec" open><summary>📚 Base de conhecimento (${itens.length})</summary><div>
      <p class="muted" style="margin-top:0">A IA só afirma o que estiver aqui (preços, prazos, serviços, pagamento, políticas). Itens “todos os bots” valem para Reforma e Vilaça.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"><button class="btn btn-accent" id="iaNovoK">➕ Novo item</button><button class="btn" id="iaAprender">🧠 Aprender com as conversas (últimos 30 dias)</button></div>
      <div id="iaLista">${itens.map(k=>`<div class="cartao ia-k"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;"><div class="t">${escapeHtml(k.titulo)}<span class="ia-pill">${k.bot_id?escapeHtml(nomeBot(k.bot_id)||'bot'):'todos os bots'}</span>${k.origem==='aprendido'?'<span class="ia-pill ap">🧠 aprendido</span>':''}${k.ativo?'':'<span class="ia-pill off">inativo</span>'}</div><div style="display:flex;gap:6px;flex-shrink:0;"><button class="btn btn-sm" data-ke="${k.id}">Editar</button><button class="btn btn-sm btn-danger" data-kx="${k.id}">Excluir</button></div></div><div class="x">${escapeHtml(k.conteudo)}</div></div>`).join('') || '<p class="muted">Nenhum item ainda. Adicione manualmente ou use “Aprender com as conversas”.</p>'}</div>
    </div></details>`;
  if(document.getElementById('iaBot')) document.getElementById('iaBot').onchange = e=>{ iaBotId = e.target.value; abaIA(); };
  document.getElementById('iaSalvar').onclick = async ()=>{
    const g = id => document.getElementById(id);
    const r = await ia({ op:'configSalvar', botId:iaBotId, ia:{ ativo:g('iaAtivo').checked, persona:g('iaPersona').value, sugerir:g('iaSugerir').checked, resumoAuto:g('iaResAuto').checked, foraHorario:g('iaFora').checked, assinatura:g('iaAss').value.trim(), maxAuto:Number(g('iaMax').value)||6, mensagemFim:g('iaFim').value.trim() } });
    if(r && r.ok){ bot.config = Object.assign({}, bot.config||{}, { ia:r.ia }); showToast('Agente de IA salvo.'); abaIA(); } else showToast((r&&r.error)||'Erro');
  };
  document.getElementById('iaNovoK').onclick = ()=> formConhecimento(null);
  c.querySelectorAll('[data-ke]').forEach(b=> b.onclick = ()=> formConhecimento(itens.find(k=>String(k.id)===b.dataset.ke)));
  c.querySelectorAll('[data-kx]').forEach(b=> b.onclick = async ()=>{ if(!confirm('Excluir este item da base de conhecimento?')) return; const r = await ia({ op:'conhecimentoExcluir', id:Number(b.dataset.kx) }); if(r&&r.ok){ showToast('Excluído.'); abaIA(); } else showToast((r&&r.error)||'Erro'); });
  document.getElementById('iaAprender').onclick = async ()=>{
    if(!confirm('A IA vai ler as conversas atendidas pela equipe nos últimos 30 dias (Reforma e Vilaça) e criar itens de conhecimento. Revise o que ela aprender. Continuar?')) return;
    const bt = document.getElementById('iaAprender'); bt.disabled = true; bt.textContent = '🧠 Analisando… (pode levar até 1 minuto)';
    const r = await ia({ op:'aprender', dias:30 });
    if(document.getElementById('iaAprender')){ bt.disabled = false; bt.textContent = '🧠 Aprender com as conversas (últimos 30 dias)'; }
    if(!r || !r.ok){ showToast((r&&r.error)||'Erro ao aprender'); return; }
    showToast(r.aviso ? r.aviso : `${r.inseridos} item(ns) aprendido(s) de ${r.analisadas} conversa(s)${r.ignorados?' · '+r.ignorados+' repetido(s) ignorado(s)':''}.`);
    if(adminAba==='ia') abaIA();
  };
}
function formConhecimento(k){
  k = k || { titulo:'', conteudo:'', bot_id:iaBotId, ativo:true };
  const c = document.getElementById('abCorpo');
  c.innerHTML = `<h3 style="margin:0 0 12px;">${k.id?'Editar':'Novo'} item de conhecimento ${k.origem==='aprendido'?'<span class="ia-pill ap">🧠 aprendido</span>':''}</h3>
    <div class="field"><label>Título / pergunta</label><input id="kTit" maxlength="150" value="${escapeHtml(k.titulo)}" placeholder="Ex.: Prazo de conserto de corrente"></div>
    <div class="field"><label>Conteúdo / resposta</label><textarea id="kCont" rows="7" placeholder="Ex.: Consertos simples de corrente ficam prontos em até 3 dias úteis…">${escapeHtml(k.conteudo)}</textarea></div>
    <div class="field"><label>Vale para</label><select id="kBot"><option value="">Todos os bots</option>${estado.bots.map(b=>`<option value="${b.id}" ${k.bot_id===b.id?'selected':''}>${escapeHtml(b.nome)}</option>`).join('')}</select></div>
    <label style="display:flex;gap:6px;align-items:center;font-weight:400;"><input type="checkbox" id="kAtivo" ${k.ativo!==false?'checked':''}> Ativo (a IA usa este item)</label>
    <div class="rodape"><button class="btn" id="kVoltar">Voltar</button><button class="btn btn-accent" id="kOk">Salvar</button></div>`;
  document.getElementById('kVoltar').onclick = ()=> abaIA();
  document.getElementById('kOk').onclick = async ()=>{
    const r = await ia({ op:'conhecimentoSalvar', id:k.id, botId:document.getElementById('kBot').value || null, titulo:document.getElementById('kTit').value, conteudo:document.getElementById('kCont').value, ativo:document.getElementById('kAtivo').checked });
    if(r && r.ok){ showToast('Item salvo.'); abaIA(); } else showToast((r&&r.error)||'Erro');
  };
}

async function cloudUi(b){
  const box = document.getElementById('fbCloud'); if(!box) return;
  const r = await ext({ op:'cloudLista' }); if(!r || !r.ok){ box.textContent = (r && r.error) || 'Erro'; return; }
  const meus = (r.data||[]).filter(x=>x.bot_id===b.id);
  box.className = '';
  box.innerHTML = `${meus.map(x=>`<div class="cartao"><div><div class="t">${escapeHtml(x.numero||x.phone_number_id)}</div><div class="x">ID ${escapeHtml(x.phone_number_id)} · WABA ${escapeHtml(x.waba_id||'—')} · ${x.temSegredoApp?'assinatura ligada':'sem segredo do app'}</div></div><button class="btn btn-sm btn-danger" data-x="${escapeHtml(x.instancia)}">Remover</button></div>`).join('') || '<p class="muted" style="margin:0 0 6px;">Nenhum número oficial neste bot.</p>'}
    <details class="sec"><summary>➕ Cadastrar número oficial</summary><div>

      <div class="field"><label>WABA ID (necessário para listar os modelos)</label><input id="cdWaba" inputmode="numeric"></div>
      <div class="field"><label>Token de acesso permanente</label><input id="cdTok" type="password" autocomplete="off"></div>
      <div class="field"><label>Segredo do app (opcional — valida a assinatura das mensagens)</label><input id="cdSec" type="password" autocomplete="off"></div>
      <button class="btn btn-accent" id="cdOk">Validar e cadastrar</button></div></details>`;
  box.querySelectorAll('[data-x]').forEach(bt=> bt.onclick = async ()=>{ if(!confirm('Remover este número oficial do bot?')) return; const rr = await ext({ op:'cloudExcluir', instancia:bt.dataset.x }); if(rr && rr.ok){ showToast('Removido.'); recarregarAdmin(); } else showToast(rr && rr.error || 'Erro'); });
  document.getElementById('cdOk').onclick = async ()=>{
    const rr = await ext({ op:'cloudSalvar', botId:b.id, phone_number_id:document.getElementById('cdPn').value, waba_id:document.getElementById('cdWaba').value, token:document.getElementById('cdTok').value, app_secret:document.getElementById('cdSec').value });
    if(rr && rr.ok){ showToast(`Número oficial vinculado: ${rr.numero||rr.instancia}${rr.nomeVerificado?' · '+rr.nomeVerificado:''}`); recarregarAdmin(); } else showToast(rr && rr.error || 'Erro');
  };
}
