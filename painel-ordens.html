      if(order.status !== 'entregue') recebidoEm = Date.now();
    }
    // Catálogo obrigatório + conferência de estoque (rascunho/cancelado não são validados)
    let planoEdit = null;
    if(status !== 'rascunho' && status !== 'cancelado'){
      if(!validarCatalogoItensOs(editItensHolder, itensApiEdit)) return;
      if(!order.estoqueBaixadoEm){
        planoEdit = planoConsumoDaOrdem({ itens: itensOsParaSalvar(editItensHolder), lojaId: loja, lojaSaidaId: editPagHolder ? editPagHolder.lojaSaidaId : order.lojaSaidaId });
        if(!(await confirmarDisponibilidadeOrdem(planoEdit, order.id))) return;
      }
    }

    let encaixe = order.encaixe;
    let autorizadoPor = order.autorizadoPor;

    if(status !== 'rascunho' && !sameAsOriginal()){
      const res = checkSlot(sid, dt, order.id);
      if(!res.ok){
        const codigoDigitado = document.getElementById('e_codigo').value.trim().toUpperCase();
        if(!codigoDigitado){
          showToast('Informe o código de autorização para concluir a alteração.');
          return;
        }
        // Recarrega os códigos direto do banco (quem gerou pode estar em outra sessão/dispositivo).
        codes = await storageGet('codes', true) || [];
        const codeObj = codes.find(c=>c.codigo === codigoDigitado && !c.usado);
        if(!codeObj){
          showToast('Código inválido ou já utilizado.');
          return;
        }
        if(codeObj.solicitacaoId && codeObj.viaNumero!==String(order.via||'')){
          showToast('Este código foi liberado para outra via (' + (codeObj.viaNumero||'—') + ').');
          return;
        }
        codeObj.usado = true;
        codeObj.usadoEm = Date.now();
        encaixe = true;
        autorizadoPor = codeObj.autorizadoPor;
        await saveCodes();
      } else {
        encaixe = false;
        autorizadoPor = null;
      }
    }

    const st = config.serviceTypes.find(s=>s.id===sid);
    Object.assign(order, {
      cliente, telefone, email, cpf, dataNascimento, cep, endereco, numero, complemento, bairro, cidade, estado,
      via, vendedora, vendedoraId: vendedoraIdPorNome(vendedora), descricao, lojaId: loja, status,
      serviceTypeId: sid, serviceTypeName: st?st.nome:'', data: dt,
      encaixe, autorizadoPor, recebidoPor, recebidoEm,
      // Itens e pagamento — pegados dos holders se existirem
      itens: editItensHolder ? itensOsParaSalvar(editItensHolder) : order.itens,
      valorTotal: editPagHolder ? editPagHolder.valorTotal : order.valorTotal,
      pagamentos: carimbarPagamentosOS(editPagHolder ? editPagHolder.pagamentos : order.pagamentos),
      momentoPagamento: editPagHolder ? editPagHolder.momentoPagamento : order.momentoPagamento,
      emissaoNota: editPagHolder ? editPagHolder.emissaoNota : order.emissaoNota,
      numeroNota: editPagHolder ? (editPagHolder.emissaoNota==='sim' ? (editPagHolder.numeroNota||'') : '') : order.numeroNota,
      lojaSaidaId: editPagHolder ? editPagHolder.lojaSaidaId : order.lojaSaidaId,
      lojaPagamentoId: editPagHolder ? editPagHolder.lojaPagamentoId : order.lojaPagamentoId,
      lojaNotaId: editPagHolder ? editPagHolder.lojaNotaId : order.lojaNotaId,
      lojaBaixaEstoqueId: editPagHolder ? editPagHolder.lojaBaixaEstoqueId : order.lojaBaixaEstoqueId,
      descTotalTipo: editPagHolder ? editPagHolder.descTotalTipo : order.descTotalTipo,
      descTotalModo: editPagHolder ? editPagHolder.descTotalModo : order.descTotalModo,
      descTotalPerc: editPagHolder ? editPagHolder.descTotalPerc : order.descTotalPerc,
      descTotalR: editPagHolder ? editPagHolder.descTotalR : order.descTotalR,
    });
    // Estoque: entregue → baixa; demais → (re)reserva os itens atuais. Nunca bloqueia.
    let sincronizarDepois = false;
    if(status === 'entregue'){
      if(!order.estoqueBaixadoEm) await estoqueAoEntregar(order);
    } else if(!order.estoqueBaixadoEm){
      const pl = planoConsumoDaOrdem(order);
      if(pl.itens.length && status !== 'rascunho') order.reservaLojaId = pl.lojaId;
      planoEdit = pl;
      sincronizarDepois = true;
    }
    await saveOrders();
    await upsertClienteFromOrder({ cliente, telefone, email, cpf, dataNascimento, cep, endereco, numero, complemento, bairro, cidade, estado });
    closeModal();
    showToast('Pedido atualizado.');
    if(sincronizarDepois) await sincronizarReservasOrdem(order, planoEdit);
    renderView();
  });
}

  const fStatus = document.getElementById('filtroStatus');
  const fData = document.getElementById('filtroData');
  const fBusca = document.getElementById('filtroBusca');
  const fSemPagamento = document.getElementById('filtroSemPagamento');

  function renderTable(){
    renderProntosCard();
    let list = [...orders];
    if(currentUser.nivel==='oficina'){
      list = list.filter(o=>o.status!=='rascunho');
    }
    if(fStatus.value==='todos'){
      // todos os status (rascunho só para quem pode vê-lo, já tratado acima)
    } else if(fStatus.value){
      list = list.filter(o=>o.status===fStatus.value);
    } else {
      list = list.filter(o=>o.status!=='entregue' && o.status!=='rascunho');
    }
    if(fServico.value) list = list.filter(o=>o.serviceTypeId===fServico.value);
    if(fLoja.value) list = list.filter(o=>o.lojaId===fLoja.value);
    if(fLocal.value) list = list.filter(o=>(o.localAtual||'loja')===fLocal.value);
    if(fData.value) list = list.filter(o=>o.data===fData.value);
    if(fBusca.value.trim()) {
      const q = fBusca.value.trim().toLowerCase();
      const qDig = onlyDigits(q);
      list = list.filter(o=> (o.cliente||'').toLowerCase().includes(q)
        || String(o.via||'').toLowerCase().includes(q) || String(o.codigoVia||'').toLowerCase().includes(q)
        || (qDig.length>=4 && onlyDigits(o.telefone||'').includes(qDig)));
    }
    if(fSemPagamento.checked) list = list.filter(o=>semPagamentoLancado(o));
    if(fStatus.value==='todos') list.sort((a,b)=> (b.criadoEm||0)-(a.criadoEm||0));   // mais recentes primeiro
    else list.sort((a,b)=> a.data.localeCompare(b.data) || b.criadoEm-a.criadoEm );

    const totalRecebido = list.reduce((acc,o)=> acc + valorRecebidoDe(o), 0);
    const totalAReceber = list.reduce((acc,o)=> acc + valorAReceberDe(o), 0);
    const semPagCount = list.filter(o=>semPagamentoLancado(o)).length;
    document.getElementById('resumoValores').innerHTML =
      `<span><b>${list.length}</b> ${list.length===1?'pedido':'pedidos'}</span><span class="sep"></span>` +
      `<span class="ok">Recebido <b>${fmtMoeda(totalRecebido)}</b></span>` +
      `<span class="perigo">A receber <b>${fmtMoeda(totalAReceber)}</b></span>` +
      (semPagCount>0 ? `<span class="badge badge-flag">${semPagCount} sem pagamento lançado</span>` : '');

    const wrap = document.getElementById('tabelaWrap');
    if(list.length===0){
      const temFiltro = fServico.value||fLocal.value||fStatus.value||fData.value||fBusca.value.trim()||fSemPagamento.checked;
      wrap.innerHTML = `<div class="empty">${ico('busca',28)}<b>Nenhum pedido encontrado</b>${temFiltro ? 'Mude ou limpe os filtros para ver mais pedidos.' : 'Os pedidos lançados aparecem aqui. Use “Novo pedido” para lançar o primeiro.'}</div>`;
      return;
    }
    wrap.innerHTML = `
      <table class="tabela-os">
        <thead>
          <tr>
            <th>Via</th><th>Cliente</th><th>Serviço</th><th>Loja</th><th>Data</th>
            <th class="num">Recebido</th><th class="num">A receber</th><th>Status</th><th class="num"><span class="sr-only">Ações</span></th>
          </tr>
        </thead>
        <tbody>
          ${list.map(o=>rowHtml(o)).join('')}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll('select.status-select').forEach(sel=>{
      applyStatusClass(sel);
      sel.addEventListener('change', async ()=>{
        const ord = orders.find(o=>o.id===sel.dataset.id);
        const previous = ord.status;
        if(sel.value === 'entregue'){
          promptRecebidoPor(async (nome)=>{
            ord.status = 'entregue';
            ord.recebidoPor = nome;
            ord.recebidoEm = Date.now();
            await estoqueAoEntregar(ord);
            await saveOrders();
            showToast('Ordem marcada como entregue para ' + nome + '.');
            renderTable();
          }, ()=>{ sel.value = previous; applyStatusClass(sel); });
          return;
        }
        if(sel.value === 'cancelado' && previous !== 'cancelado'){
          if(!podeCancelarOrdem()){ showToast('Só gerente ou diretoria podem cancelar uma O.S.'); sel.value = previous; applyStatusClass(sel); return; }
          const motivo = (prompt('Motivo do cancelamento (obrigatório):')||'').trim();
          if(!motivo){ showToast('Cancelamento não confirmado: motivo não informado.'); sel.value = previous; applyStatusClass(sel); return; }
          await aplicarCancelamentoOrdem(ord, motivo);
          await saveOrders();
          showToast('O.S. cancelada.');
          renderTable();
          return;
        }
        ord.status = sel.value;
        if(sel.value==='enviado_fabrica' && ord.localAtual!=='fabrica'){
          ord.localAtual = 'fabrica'; ord.historicoLocal = ord.historicoLocal || [];
          ord.historicoLocal.push({ local:'fabrica', em: Date.now(), por: currentUser.nome });
        }
        await saveOrders();
        // Pedido reativado (saiu de cancelado/rascunho): volta a reservar as peças
        if((previous === 'cancelado' || previous === 'rascunho') && !ord.estoqueBaixadoEm){
          const planoReativ = planoConsumoDaOrdem(ord);
          if(planoReativ.itens.length){ ord.reservaLojaId = planoReativ.lojaId; await saveOrders(); await sincronizarReservasOrdem(ord, planoReativ); }
        }
        applyStatusClass(sel);
        showToast('Status atualizado para "' + statusLabel(sel.value) + '". ' + (!STATUS_OCUPA_VAGA.includes(sel.value) ? 'Vaga liberada.' : ''));
        renderTable();
      });
    });
    wrap.querySelectorAll('[data-wa]').forEach(b=>{
      b.addEventListener('click', ()=> sendWhatsApp(orders.find(x=>x.id===b.dataset.wa)) );
    });
    wrap.querySelectorAll('[data-mail]').forEach(b=>{
      b.addEventListener('click', ()=> sendEmail(orders.find(x=>x.id===b.dataset.mail)) );
    });
    wrap.querySelectorAll('[data-view]').forEach(b=>{
      b.addEventListener('click', ()=> openEditModal(b.dataset.view, true) );
    });
    wrap.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=> openEditModal(b.dataset.edit, false) );
    });
    wrap.querySelectorAll('[data-print]').forEach(b=>{
      b.addEventListener('click', ()=> printOrder(orders.find(x=>x.id===b.dataset.print)) );
    });
    wrap.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', ()=> abrirExcluirOrdem(orders.find(x=>x.id===b.dataset.del)) );
    });
    wrap.querySelectorAll('.menu-mais-btn').forEach(b=>{
      b.addEventListener('click', (e)=>{ e.stopPropagation(); alternarMenuMais(b); });
    });
  }

  function rowHtml(o){

    const isRascunho = o.status === 'rascunho';

        <td class="c-data" style="white-space:nowrap;">${fmtDate(o.data)}${atrasada ? `<span class="data-atraso">Atrasado</span>` : ''}</td>

        <td class="num c-areceber ${aReceber>0?'valor-receber':''}" data-rotulo="A receber">${fmtMoeda(aReceber)}</td>
        <td class="c-status">
          ${isRascunho
            ? `<span class="selo st-rascunho">Rascunho</span>`
            : oficina
              ? seloStatusHtml(o.status)
              : `<select class="status-select" data-id="${o.id}" aria-label="Status do pedido ${escapeHtml(o.via||'')}">
                  <option value="aguardando" ${o.status==='aguardando'?'selected':''}>Aguardando</option>
                  <option value="enviado_fabrica" ${o.status==='enviado_fabrica'?'selected':''}>Enviado p/ fábrica</option>
                  <option value="pendencia" ${o.status==='pendencia'?'selected':''}>Pendência</option>
                  <option value="oficina_pronto" ${o.status==='oficina_pronto'?'selected':''}>Fábrica pronto</option>
                  <option value="pronto" ${o.status==='pronto'?'selected':''}>Pronto</option>
                  <option value="entregue" ${o.status==='entregue'?'selected':''}>Entregue</option>
                  <option value="cancelado" ${o.status==='cancelado'?'selected':''}>Cancelado</option>
                </select>`
          }
        </td>
        <td class="acoes">
          <div class="acoes-linha">
          ${oficina ? `<button class="btn-icone" data-view="${o.id}" title="Ver detalhes" aria-label="Ver detalhes">${ico('olho')}</button>` : ''}
          <button class="btn-icone" data-edit="${o.id}" title="${oficina?'Observações e localização':'Editar pedido'}" aria-label="${oficina?'Observações e localização':'Editar pedido'}">${ico('lapis')}</button>
          <button class="btn-icone" data-print="${o.id}" title="Imprimir via" aria-label="Imprimir via">${ico('impressora')}</button>
          ${!oficina ? `
          <button class="btn-icone wa" data-wa="${o.id}" title="Enviar WhatsApp ao cliente" aria-label="Enviar WhatsApp ao cliente">${waIconSvg(17)}</button>
          <div class="menu-mais">
            <button class="btn-icone menu-mais-btn" type="button" title="Mais ações" aria-label="Mais ações" aria-haspopup="true">${ico('mais3')}</button>
            <div class="menu-mais-lista" role="menu">
              <button type="button" role="menuitem" data-view="${o.id}">${ico('olho')} Ver detalhes</button>
              <button type="button" role="menuitem" data-mail="${o.id}">${ico('email')} Enviar e-mail ao cliente</button>
              ${podeCancelarOrdem() ? `<hr><button type="button" role="menuitem" class="perigo" data-del="${o.id}">${ico('lixeira')} Excluir pedido</button>` : ''}
            </div>
          </div>
          ` : (podeCancelarOrdem() ? `<button class="btn-icone perigo" data-del="${o.id}" title="Excluir pedido" aria-label="Excluir pedido">${ico('lixeira')}</button>` : '')}
          </div>
        </td>
      </tr>
    `;
  }

  [fServico,fLoja,fLocal,fStatus,fData,fBusca,fSemPagamento].forEach(el=>el.addEventListener('input', renderTable));
  document.getElementById('btnLimparFiltro').addEventListener('click', ()=>{
    fServico.value=''; fLoja.value=''; fLocal.value=''; fStatus.value=''; fData.value=''; fBusca.value=''; fSemPagamento.checked=false;
    if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id) fLoja.value = window.__lojaAtual.id;
    renderTable();
  });

  const btnNovoPedido = document.getElementById('btnNovoPedidoPainel');
  if(btnNovoPedido) btnNovoPedido.addEventListener('click', ()=>{ modoNovaOrdem = true; renderView(); });

  const restringirPorLojaAtiva = currentUser && (currentUser.nivel==='vendedora' || currentUser.nivel==='oficina');
  if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id){
    fLoja.value = window.__lojaAtual.id;
    fLoja.disabled = true;
    fLoja.title = 'Mostrando só a loja em que você está. Para ver outra loja, troque a loja no topo do app.';
  }
  renderTable();
}
function applyStatusClass(sel){
  sel.className = 'status-select status-' + sel.value;
}
function statusBg(s){ return s==='aguardando' ? 'var(--wait-soft)' : s==='enviado_fabrica' ? 'var(--st-roxo-soft)' : s==='pendencia' ? 'var(--st-laranja-soft)' : s==='oficina_pronto' ? 'var(--info-soft)' : s==='pronto' ? 'var(--ok-soft)' : s==='entregue' ? 'var(--st-neutro-soft)' : 'var(--danger-soft)'; }
function statusFg(s){ return s==='aguardando' ? 'var(--wait)' : s==='enviado_fabrica' ? 'var(--st-roxo)' : s==='pendencia' ? 'var(--st-laranja)' : s==='oficina_pronto' ? 'var(--info)' : s==='pronto' ? 'var(--ok)' : s==='entregue' ? 'var(--st-neutro)' : 'var(--danger)'; }

function renderAgenda(main){
  const now = new Date();
  if(agendaYear===undefined){ agendaYear = now.getFullYear(); agendaMonth = now.getMonth(); }

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Agenda da oficina</h1>
        <p class="page-sub">Pedidos agendados em cada dia e as vagas ocupadas por tipo de serviço (ocupadas/máximo). Clique em um dia para ver os pedidos.</p>
      </div>
    </div>
    <div class="card">
      <div class="agenda-head">
        <div class="agenda-nav">
          <button class="btn-icone" id="agPrev" title="Mês anterior" aria-label="Mês anterior">${ico('esquerda',18)}</button>
          <div class="agenda-month" id="agMonthLabel" aria-live="polite"></div>
          <button class="btn-icone" id="agNext" title="Próximo mês" aria-label="Próximo mês">${ico('direita',18)}</button>
          <button class="btn btn-ghost btn-sm" id="agToday">Hoje</button>
        </div>
        <div class="agenda-legend" id="agLegend"></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  `;

  document.getElementById('agLegend').innerHTML = (config.serviceTypes.length ? '' : '<span class="muted">Nenhum tipo de serviço cadastrado. Cadastre em CONFIGURAÇÕES › Cadastro › Produto › Tipos de ordem.</span>') + config.serviceTypes.map(s=>`
    <span class="legend-item"><span class="legend-dot" style="background:${serviceColor(s.id)}"></span>${escapeHtml(s.nome)}</span>
  `).join('');

  document.getElementById('agPrev').addEventListener('click', ()=>{
    agendaMonth--; if(agendaMonth<0){agendaMonth=11; agendaYear--;} drawCalendar();
  });
  document.getElementById('agNext').addEventListener('click', ()=>{
    agendaMonth++; if(agendaMonth>11){agendaMonth=0; agendaYear++;} drawCalendar();
  });
  document.getElementById('agToday').addEventListener('click', ()=>{
    agendaYear = now.getFullYear(); agendaMonth = now.getMonth(); drawCalendar();
  });

  function drawCalendar(){
    const label = new Date(agendaYear, agendaMonth, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    document.getElementById('agMonthLabel').textContent = label;

    const grid = document.getElementById('calGrid');
    const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');

    const firstDow = new Date(agendaYear, agendaMonth, 1).getDay();
    const daysInMonth = new Date(agendaYear, agendaMonth+1, 0).getDate();
    const todayIso = todayStr();

    for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty-cell"></div>`;

    for(let d=1; d<=daysInMonth; d++){
      const iso = `${agendaYear}-${String(agendaMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayOrders = orders.filter(o=>o.data===iso && o.status!=='entregue');
      const byService = {};
      dayOrders.forEach(o=>{
        const stO = config.serviceTypes.find(s=>s.id===o.serviceTypeId);
        const chave = stO && stO.grupoId ? 'g:'+stO.grupoId : o.serviceTypeId; // grupo = um chip só (vagas somadas)
        if(!byService[chave]) byService[chave] = { aguardando:0, total:0, nome:o.serviceTypeName, grupoId: stO && stO.grupoId, tipoId:o.serviceTypeId };
        byService[chave].total++;
        if(STATUS_OCUPA_VAGA.includes(o.status)) byService[chave].aguardando++;
      });
      const chips = Object.keys(byService).slice(0,3).map(sid=>{
        const info = byService[sid];
        const st = config.serviceTypes.find(s=>s.id===info.tipoId);
        const max = st ? st.maxPorDia : '?';
        const over = st && info.aguardando > st.maxPorDia;
        const rotulo = info.grupoId ? ((config.gruposTipoOrdem||[]).find(g=>g.id===info.grupoId)||{}).nome || 'GRUPO' : (st?st.nome:info.nome);
        return `<span class="cal-chip ${over?'over':''}" style="background:${serviceColor(info.tipoId)}" title="${escapeHtml(rotulo)}: ${info.aguardando} de ${max} vagas${over?' — acima do máximo':''}">
          <span>${escapeHtml(String(rotulo||'—').slice(0,10))}</span><span>${info.aguardando}/${max}</span>
        </span>`;
      }).join('');
      const extra = Object.keys(byService).length > 3 ? `<div class="cal-more">+${Object.keys(byService).length-3} ${Object.keys(byService).length-3===1?'serviço':'serviços'}</div>` : '';

      html += `
        <div class="cal-cell ${iso===todayIso?'today':''} ${iso<todayIso?'passado':''}" data-day="${iso}" role="button" tabindex="0" aria-label="${fmtDate(iso)}: ${dayOrders.length} ${dayOrders.length===1?'pedido':'pedidos'}">
          <div class="cal-daynum">${d}</div>
          ${chips}
          ${extra}
        </div>
      `;
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
      cell.addEventListener('click', ()=> openDayModal(cell.dataset.day) );
      cell.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openDayModal(cell.dataset.day); } });
    });
  }
  drawCalendar();
}

function openDayModal(iso){
  const dayOrders = orders.filter(o=>o.data===iso && o.status!=='entregue').sort((a,b)=>a.serviceTypeName.localeCompare(b.serviceTypeName));
  const capacityRows = config.serviceTypes.map(s=>{
    const res = checkSlot(s.id, iso, null);
    return `<div class="legend-item" style="font-size:13px;">
      <span class="legend-dot" style="background:${serviceColor(s.id)}"></span>
      ${escapeHtml(s.nome)}: <b style="margin-left:3px;">${res.ocupadas}/${res.vagas}</b>
      ${res.ok ? '' : `<span class="badge badge-aviso" style="margin-left:4px;">${!res.quantidadeOk ? 'lotado' : 'fora do prazo'}</span>`}
    </div>`;
  }).join('');

  openModal(`
    <h3>${ico('calendario',18)} ${(s=>s.charAt(0).toUpperCase()+s.slice(1))(new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'}))}, ${fmtDate(iso)}</h3>
    <p>${dayOrders.length===0 ? 'Nenhum pedido agendado neste dia.' : dayOrders.length + (dayOrders.length===1?' pedido agendado':' pedidos agendados') + ' neste dia (sem contar os entregues).'}</p>
    <div class="section-label">Vagas por serviço</div>
    <div class="ocupacao-lista">${capacityRows || '<span class="muted">Nenhum tipo de serviço cadastrado.</span>'}</div>
    <div class="section-label">Pedidos do dia</div>
    ${dayOrders.length===0 ? '<div class="empty" style="padding:20px;">Nenhum pedido agendado.</div>' : dayOrders.map(o=>`
      <div class="day-order-item">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
          <span><span style="font-family:var(--mono);font-weight:700;">${escapeHtml(o.via||'')}</span> <b>${escapeHtml(o.cliente)}</b></span>
          ${seloStatusHtml(o.status)}
        </div>
        <div class="muted" style="margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span class="legend-dot" style="background:${serviceColor(o.serviceTypeId)}"></span>${escapeHtml(o.serviceTypeName||'')} · Loja ${escapeHtml(nomeLojaOrder(o))} · Vendedora ${escapeHtml(o.vendedora||'—')}${o.encaixe?' · <span class="badge badge-encaixe">Encaixe</span>':''}</div>
      </div>
    `).join('')}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dayClose">Fechar</button>
    </div>
  `);
  document.getElementById('dayClose').addEventListener('click', closeModal);
}

function renderGerarCodigo(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Código de autorização</h1>
        <p class="page-sub">Libera um pedido fora do prazo ou acima do máximo de vagas do dia (encaixe). Cada código vale para um pedido só.</p>
      </div>
    </div>
    <div class="card" id="cardSolicitacoes">
      <div class="section-label">Solicitações de autorização <span class="muted" id="solCont"></span></div>
      <div id="solLista"><div class="empty" style="padding:20px;">Carregando…</div></div>
    </div>
    <div class="card">
      <div class="section-label">Novo código</div>
      <div class="grid-2">
        <div class="field" style="margin-bottom:0;"><label for="c_autorizador">Quem está autorizando</label><select id="c_autorizador">${funcionarioOptionsOficinaOuDiretoriaHtml('')}</select></div>
        <div style="display:flex; align-items:flex-end;"><button class="btn btn-accent btn-block" id="btnGerarCodigo">${ico('cadeado')} Gerar código</button></div>

    </div>
    <div class="card">
      <div class="section-label">Códigos gerados</div>
      <div id="codeHistory"></div>
    </div>
  `;

  document.getElementById('btnGerarCodigo').addEventListener('click', async ()=>{
    const nome = maiusc(document.getElementById('c_autorizador').value);
    if(!nome){ showToast('Escolha quem está autorizando.'); return; }
    const codigo = Array.from({length:6}, ()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
    const obj = { codigo, autorizadoPor: nome, nivelGerador: currentUser.nivel, geradoPor: currentUser.nome, criadoEm: Date.now(), usado:false };
    codes.unshift(obj);
    await saveCodes();
    document.getElementById('c_autorizador').value = '';
    document.getElementById('codeResult').innerHTML = `
      <div class="slot-banner slot-ok" style="align-items:center;">
        <span class="dot"></span>
        <div>Código gerado: <span class="code-chip">${codigo}</span><button type="button" class="copy-btn" id="btnCopyCodeNovo">${ico('copiar',14)} Copiar</button><br>Passe este código para a vendedora concluir o pedido.</div>
      </div>
    `;
    document.getElementById('btnCopyCodeNovo').addEventListener('click', ()=> copyToClipboard(codigo));
    renderCodeHistory();
  });

  function renderCodeHistory(){
    const wrap = document.getElementById('codeHistory');
    if(codes.length===0){ wrap.innerHTML = `<div class="empty" style="padding:24px;"><b>Nenhum código gerado ainda</b>Os códigos que você gerar aparecem aqui, com quem autorizou e se já foram usados.</div>`; return; }
    wrap.innerHTML = codes.slice(0,25).map(c=>`
      <div class="code-list-item">
        <div>
          <span class="cl-code">${c.codigo}</span>
          <button type="button" class="copy-btn" data-copyhist="${c.codigo}" aria-label="Copiar código ${c.codigo}">${ico('copiar',14)} Copiar</button>
          <span class="muted" style="margin-left:10px;">autorizado por ${escapeHtml(c.autorizadoPor)}${c.criadoEm ? ' · ' + Fmt.dataHora(c.criadoEm) : ''}</span>
        </div>
        <span class="selo ${c.usado ? 'st-entregue' : 'st-pronto'}">${c.usado ? 'Usado' : 'Disponível'}</span>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-copyhist]').forEach(b=>{
      b.addEventListener('click', ()=> copyToClipboard(b.dataset.copyhist));
    });
  }
  renderCodeHistory();
  (async ()=>{
    codes = await storageGet('codes', true) || codes;
    renderCodeHistory();
  })();

  // ── Solicitações de autorização vindas das lojas ──
  const nomeLojaSol = id => { const l=(config.lojas||[]).find(x=>x.id===id); return l ? (l.abreviacao||l.nome) : (id||'—'); };
  async function desenharSolicitacoes(){
    const box = document.getElementById('solLista'); if(!box) return;
    const lista = await autorizacoesGet();
    const pend = lista.filter(r=>r.status==='pendente');
    const rec = lista.filter(r=>r.status!=='pendente').slice(0,8);
    const cont = document.getElementById('solCont'); if(cont) cont.textContent = pend.length ? `· ${pend.length} aguardando` : '';
    const linha = (r, hist) => `<div class="code-list-item" style="align-items:center;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div><b>${escapeHtml(r.via.numeroVia||'—')}</b> · ${escapeHtml(nomeLojaSol(r.lojaId))} · ${escapeHtml(r.via.servico||'')} para ${fmtDate(r.via.dataPedida)}
        <div class="muted" style="font-size:12.5px;">${Fmt.dataHora(r.criadoEm)} · ${escapeHtml(r.motivo||'')}</div>
        <div style="font-size:12.5px;"><b>Solicitado por:</b> ${escapeHtml(r.solicitante||'—')}${r.status==='recusado'?` · <b>Recusado por:</b> ${escapeHtml(r.recusadoPor||'—')}`:''}</div></div>
      ${hist ? `<span class="selo ${r.status==='liberado'?'st-pronto':'st-entregue'}">${r.status==='liberado'?'Liberado'+(r.liberadoPor?' por '+escapeHtml(r.liberadoPor):''):r.status==='recusado'?'Recusado':'Cancelado'}</span>`
             : `<button class="btn btn-sm btn-accent" data-ver="${r.id}" type="button">Ver via</button>`}</div>`;
    box.innerHTML = (pend.length ? pend.map(r=>linha(r,false)).join('') : `<div class="empty" style="padding:20px;"><b>Nenhuma solicitação aguardando</b>Quando uma loja pedir permissão para um pedido fora do padrão, ela aparece aqui.</div>`)
      + (rec.length ? `<div class="muted" style="margin:14px 0 4px;font-size:12px;">Últimas respondidas</div>` + rec.map(r=>linha(r,true)).join('') : '');
    box.querySelectorAll('[data-ver]').forEach(b=> b.addEventListener('click', ()=> verSolicitacao(pend.find(r=>r.id===b.dataset.ver))));
  }
  function viaCompletaHtml(c, v){
    const cl = c.cliente||{}, pg = c.pagamento||{};
    const campo = (rot, val) => val ? `<div><div class="muted" style="font-size:12px;">${rot}</div>${escapeHtml(String(val))}</div>` : '';
    const forma = id => { const f=(config.formasPagamento||config.pagamentos||[]).find(x=>x.id===id); return f ? (f.nome||f.label||id) : (id==='__credito'?'Crédito do cliente':id==='__fiado'?'Fiado':id==='__sem_custo'?'Sem custo':id); };
    const endereco = [cl.endereco, cl.numero, cl.complemento, cl.bairro, cl.cidade, cl.estado, cl.cep].filter(Boolean).join(', ');
    const itens = (c.itens||[]).map((it,i)=>{ const q=Number(it.quantidade)||1, u=Number(it.valorUnitario)||0; const aj = it.ajusteTipo && it.ajusteTipo!=='nenhum' ? `${it.ajusteTipo==='desconto'?'Desconto':'Acréscimo'}: ${it.ajusteModo==='percentual'?(it.ajustePerc||0)+'%':fmtMoeda(Number(it.ajusteValR)||0)}` : '';
      const extra = [it.metal?'Metal: '+it.metal:'', aj].filter(Boolean).join(' · ');
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line);">${escapeHtml(nomeItemOs(it,i))}${it.avulso?' <span class="muted">(avulso)</span>':''}${extra?`<div class="muted" style="font-size:12px;">${escapeHtml(extra)}</div>`:''}${it.observacaoItem?`<div style="font-size:12.5px;margin-top:2px;"><b>Obs. do item:</b> ${escapeHtml(it.observacaoItem)}</div>`:''}${(it.fotos||[]).length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">${it.fotos.map(f=>`<img data-solfoto="${escapeHtml(f.id||'')}" src="${escapeHtml(f.driveUrl||'')}" alt="${escapeHtml(f.nome||'')}" style="width:104px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2);">`).join('')}</div>`:''}</div>`; }).join('');
    const fotoImg = f => `<img data-solfoto="${escapeHtml(f.id||'')}" src="${escapeHtml(f.driveUrl||'')}" alt="${escapeHtml(f.nome||'')}" style="width:104px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2);">`;
    const obs = Array.isArray(c.observacoes) ? c.observacoes.map(o=>typeof o==='string' ? `<div>${escapeHtml(o)}</div>` : `<div style="margin-bottom:10px;"><b>${escapeHtml(o.nome||'')}</b>${o.descricao?`<div style="white-space:pre-wrap;">${escapeHtml(o.descricao)}</div>`:''}${(o.notificarPara||[]).length?`<div class="muted" style="font-size:12px;">Avisar: ${escapeHtml((o.notificarPara||[]).join(', '))}</div>`:''}${(o.fotos||[]).length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">${o.fotos.map(fotoImg).join('')}</div>`:''}</div>`).join('') : escapeHtml(String(c.observacoes||''));
    return `<div class="section-label" style="margin-top:16px;">Itens do pedido</div>
      <div>${itens||'—'}</div>
      ${c.descricao?`<div style="margin-top:12px;"><div class="muted" style="font-size:12px;">Descrição do serviço</div>${escapeHtml(c.descricao)}</div>`:''}
      <div class="section-label" style="margin-top:16px;">Pagamento</div>
      <div class="grid-2">${campo('Quando paga',pg.momentoPagamento==='na_volta'?'Paga na retirada':pg.momentoPagamento==='agora'?'Pago agora':pg.momentoPagamento)}</div>
      ${(pg.pagamentos||[]).length?`<div style="margin-top:8px;">${pg.pagamentos.map(x=>`<div>${escapeHtml(forma(x.formaId))}${x.parcelas?` · ${escapeHtml(String(x.parcelas))}x`:''}</div>`).join('')}</div>`:''}
      ${obs?`<div class="section-label" style="margin-top:16px;">Observações da via (internas)</div>${obs}`:''}
      ${c.infoInterna?`<div class="section-label" style="margin-top:16px;">Informação interna</div><div style="white-space:pre-wrap;">${escapeHtml(c.infoInterna)}</div>`:''}
      ${(c.fotos||[]).length?`<div class="section-label" style="margin-top:16px;">Fotos da via</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${c.fotos.map(fotoImg).join('')}</div>`:''}`;
  }
  function verSolicitacao(r){
    if(!r) return;
    const v = r.via||{};
    openModal(`<div class="modal-titulo"><h3>Solicitação de autorização · ${escapeHtml(v.numeroVia||'')}</h3></div>
      <div class="slot-banner slot-bad" style="background:var(--danger);border-color:var(--danger);color:#fff;margin-top:0;"><span class="dot" style="background:#fff;"></span><div><b>Fora do padrão:</b> ${escapeHtml(r.motivo||'')}</div></div>
      <div class="grid-2" style="margin-top:12px;">
        <div><div class="muted" style="font-size:12px;">Loja</div>${escapeHtml(nomeLojaSol(r.lojaId))}</div>
        <div><div class="muted" style="font-size:12px;">Vendedora</div>${escapeHtml(v.vendedora||'—')}</div>
        <div><div class="muted" style="font-size:12px;">Tipo de serviço</div>${escapeHtml(v.servico||'—')}</div>
        <div><div class="muted" style="font-size:12px;">Data pedida</div>${fmtDate(v.dataPedida)}</div>
      </div>
      ${r.completa ? viaCompletaHtml(r.completa, v) : `<div style="margin-top:12px;"><div class="muted" style="font-size:12px;">Itens</div>${(v.itens||[]).map(i=>`<div>${escapeHtml(i.nome||'')}</div>`).join('')||'—'}</div>
      ${v.descricao?`<div style="margin-top:12px;"><div class="muted" style="font-size:12px;">Descrição</div>${escapeHtml(v.descricao)}</div>`:''}`}
      <div class="modal-actions"><button class="btn btn-ghost" id="solFechar" type="button">Fechar</button><button class="btn btn-danger" id="solRecusar" type="button">Recusar</button><button class="btn btn-accent" id="solLiberar" type="button">${ico('check')} Liberar</button></div>`);
    document.querySelectorAll('[data-solfoto]').forEach(async img=>{
      if(!img.getAttribute('src') && img.dataset.solfoto){ const d = await getPhotoDataUrl(img.dataset.solfoto); if(d) img.src = d; }
      img.addEventListener('click', ()=>{ if(!img.src) return; const z=document.createElement('div'); z.style.cssText='position:fixed;inset:0;background:rgba(8,20,30,.85);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:16px;'; z.innerHTML=`<img src="${img.src}" style="max-width:96vw;max-height:92vh;border-radius:8px;">`; z.addEventListener('click',()=>z.remove()); document.body.appendChild(z); });
    });
    document.getElementById('solFechar').addEventListener('click', closeModal);
    document.getElementById('solRecusar').addEventListener('click', async ()=>{
      const mot = (prompt('Motivo da recusa (a loja vê):')||'').trim(); if(mot===''){ return; }
      await autorizacoesMut(l=>{ const x=l.find(y=>y.id===r.id); if(x && x.status==='pendente'){ x.status='recusado'; x.motivoRecusa=mot; x.recusadoPor=currentUser.nome; x.respondidoEm=Date.now(); } });
      closeModal(); showToast('Solicitação recusada.'); desenharSolicitacoes();
    });
    document.getElementById('solLiberar').addEventListener('click', async ()=>{
      const b = document.getElementById('solLiberar'); b.disabled = true;
      const codigo = Array.from({length:6}, ()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
      const quem = maiusc(currentUser.nome||'');
      let liberou = false;
      await autorizacoesMut(l=>{ const x=l.find(y=>y.id===r.id); if(x && x.status==='pendente'){ x.status='liberado'; x.codigo=codigo; x.liberadoPor=quem; x.respondidoEm=Date.now(); liberou=true; } });
      if(!liberou){ showToast('Esta solicitação já foi respondida.'); closeModal(); desenharSolicitacoes(); return; }
      codes = await storageGet('codes', true) || codes;
      codes.unshift({ codigo, autorizadoPor: quem, nivelGerador: currentUser.nivel, geradoPor: currentUser.nome, criadoEm: Date.now(), usado:false, solicitacaoId: r.id, viaNumero: (r.via&&r.via.numeroVia)||'', lojaId: r.lojaId, solicitante: r.solicitante||'' });
      await saveCodes(); renderCodeHistory();
      closeModal(); showToast('Liberado. A loja já pode lançar o pedido.'); desenharSolicitacoes();
    });
  }
  desenharSolicitacoes();
  const __tSol = setInterval(()=>{ if(!document.getElementById('solLista')){ clearInterval(__tSol); return; } desenharSolicitacoes(); }, 10000);
}

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
<script src="modal-x.js"></script>
</body>
