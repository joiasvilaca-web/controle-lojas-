/* ============================================================
   AGENDA
   ============================================================ */
function renderAgenda(main){
  const now = new Date();
  if(agendaYear===undefined){ agendaYear = now.getFullYear(); agendaMonth = now.getMonth(); }

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Agenda</h1>
        <p class="page-sub">Visualize todos os lançamentos do mês e veja rapidamente onde ainda há vaga.</p>
      </div>
    </div>
    <div class="card">
      <div class="agenda-head">
        <div class="agenda-nav">
          <button class="icon-btn" id="agPrev">‹</button>
          <div class="agenda-month" id="agMonthLabel"></div>
          <button class="icon-btn" id="agNext">›</button>
          <button class="btn btn-ghost btn-sm" id="agToday">Hoje</button>
        </div>
        <div class="agenda-legend" id="agLegend"></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  `;

  document.getElementById('agLegend').innerHTML = config.serviceTypes.map(s=>`
    <span class="legend-item"><span class="legend-dot" style="background:${serviceColor(s.id)}"></span>${escapeHtml(s.nome)}</span>
  `).join('');

  document.getElementById('agPrev').addEventListener('click', ()=>{
    agendaMonth--; if(agendaMonth<0){agendaMonth=11; agendaYear--;} drawCalendar();
  });
  document.getElementById('agNext').addEventListener('click', ()=>{
    agendaMonth++; if(agendaMonth>11){agendaMonth=0; agendaYear++;} drawCalendar();
  });
  document.getElementById('agToday').addEventListener('click', ()=>{
    agendaYear = now.getFullYear(); agendaMonth = now.getMonth(); drawCalendar();
  });

  function drawCalendar(){
    const label = new Date(agendaYear, agendaMonth, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    document.getElementById('agMonthLabel').textContent = label;

    const grid = document.getElementById('calGrid');
    const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');

    const firstDow = new Date(agendaYear, agendaMonth, 1).getDay();
    const daysInMonth = new Date(agendaYear, agendaMonth+1, 0).getDate();
    const todayIso = todayStr();

    for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty-cell"></div>`;

    for(let d=1; d<=daysInMonth; d++){
      const iso = `${agendaYear}-${String(agendaMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayOrders = orders.filter(o=>o.data===iso && o.status!=='entregue');
      const byService = {};
      dayOrders.forEach(o=>{
        if(!byService[o.serviceTypeId]) byService[o.serviceTypeId] = { aguardando:0, total:0, nome:o.serviceTypeName };
        byService[o.serviceTypeId].total++;
        if(o.status===STATUS.AGUARDANDO) byService[o.serviceTypeId].aguardando++;
      });
      const chips = Object.keys(byService).slice(0,3).map(sid=>{
        const st = config.serviceTypes.find(s=>s.id===sid);
        const max = st ? st.maxPorDia : '?';
        const info = byService[sid];
        const over = st && info.aguardando > st.maxPorDia;
        return `<span class="cal-chip ${over?'over':''}" style="background:${serviceColor(sid)}">
          <span>${escapeHtml((st?st.nome:info.nome).slice(0,10))}</span><span>${info.aguardando}/${max}</span>
        </span>`;
      }).join('');
      const extra = Object.keys(byService).length > 3 ? `<div class="cal-more">+${Object.keys(byService).length-3} serviço(s)</div>` : '';

      html += `
        <div class="cal-cell ${iso===todayIso?'today':''}" data-day="${iso}">
          <div class="cal-daynum">${d}</div>
          ${chips}
          ${extra}
        </div>
      `;
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
      cell.addEventListener('click', ()=> openDayModal(cell.dataset.day) );
    });
  }
  drawCalendar();
}

function openDayModal(iso){
  const dayOrders = orders.filter(o=>o.data===iso && o.status!=='entregue').sort((a,b)=>a.serviceTypeName.localeCompare(b.serviceTypeName));
  const capacityRows = config.serviceTypes.map(s=>{
    const res = checkSlot(s.id, iso, null);
    return `<div class="legend-item" style="margin-bottom:4px;">
      <span class="legend-dot" style="background:${serviceColor(s.id)}"></span>
      ${escapeHtml(s.nome)}: <b style="margin-left:3px;">${res.ocupadas}/${res.vagas}</b>
      ${res.ok ? '' : '<span class="badge" style="background:var(--wait-soft); color:var(--wait); margin-left:6px;">lotado/fora do prazo</span>'}
    </div>`;
  }).join('');

  openModal(`
    <h3>${fmtDate(iso)}</h3>
    <p>${dayOrders.length} ordem(ns) lançada(s) neste dia.</p>
    <div class="section-label">Ocupação por serviço</div>
    <div style="margin-bottom:16px;">${capacityRows}</div>
    <div class="section-label">Ordens do dia</div>
    ${dayOrders.length===0 ? '<div class="empty">Nenhuma ordem lançada.</div>' : dayOrders.map(o=>`
      <div class="day-order-item">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b>${escapeHtml(o.cliente)}</b>
          <span class="badge" style="background:${serviceColor(o.serviceTypeId)}22; color:${serviceColor(o.serviceTypeId)};">${escapeHtml(o.serviceTypeName)}</span>
        </div>
        <div class="muted" style="margin-top:2px;">Loja ${escapeHtml(o.loja)} · Vendedora ${escapeHtml(o.vendedora)} · Status ${statusLabel(o.status)}${o.encaixe?' · Encaixe':''}</div>
      </div>
    `).join('')}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dayClose">Fechar</button>
    </div>
  `);
  document.getElementById('dayClose').addEventListener('click', closeModal);
}

/* ============================================================
   CLIENTES (cadastro + mala direta de aniversário)
   ============================================================ */
function renderClientes(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Clientes</h1>
        <p class="page-sub">Cadastro para acompanhamento, edição e mala direta de aniversário.</p>
      </div>
      <button class="btn btn-accent" id="btnNovoCliente">+ Novo cliente</button>
    </div>

    <div id="aniversarioCard"></div>

    <div class="filters">
      <input type="text" id="clienteBusca" placeholder="Buscar por nome, telefone ou CPF...">
    </div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <div id="clientesTableWrap"></div>
    </div>
  `;

  function renderAniversarioCard(){
    const card = document.getElementById('aniversarioCard');
    const hoje = new Date();
    const mes = hoje.getMonth()+1, dia = hoje.getDate();
    const aniversariantes = clientes.filter(c=>{
      if(!c.dataNascimento) return false;
      const partes = c.dataNascimento.split('-').map(Number);
      const m = partes[1], d = partes[2];
      return m===mes && d===dia;
    });
    if(aniversariantes.length===0){
      card.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="section-label">🎂 Aniversariantes de hoje</div>
          <div class="muted">Nenhum aniversariante hoje.</div>
        </div>`;
      return;
    }
    card.innerHTML = `
      <div class="card" style="border-color:var(--encaixe); background:var(--encaixe-soft); margin-bottom:16px;">
        <div class="section-label" style="color:var(--encaixe); margin-bottom:10px;">🎂 Aniversariantes de hoje (${aniversariantes.length})</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${aniversariantes.map(c=>`
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 12px; flex-wrap:wrap;">
              <div style="font-size:13px;"><b>${escapeHtml(c.nome)}</b><span class="muted"> · ${escapeHtml(c.telefone||'sem telefone')}</span></div>
              <div style="display:flex; gap:6px;">
                <button class="icon-btn" data-aniverswa="${c.id}" title="Enviar WhatsApp">💬</button>
                <button class="icon-btn" data-aniversmail="${c.id}" title="Enviar e-mail">✉️</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    card.querySelectorAll('[data-aniverswa]').forEach(b=>{
      b.addEventListener('click', ()=> sendWhatsAppCliente(clientes.find(x=>x.id===b.dataset.aniverswa)) );
    });
    card.querySelectorAll('[data-aniversmail]').forEach(b=>{
      b.addEventListener('click', ()=> sendEmailCliente(clientes.find(x=>x.id===b.dataset.aniversmail)) );
    });
  }
  renderAniversarioCard();

  const buscaInp = document.getElementById('clienteBusca');

  function renderTable(){
    let list = [...clientes];
    const q = buscaInp.value.trim().toLowerCase();
    if(q){
      const qDigits = onlyDigits(q);
      const qCpf = onlyDigitsCpf(q);
      list = list.filter(c=>
        (c.nome||'').toLowerCase().includes(q) ||
        (qDigits && onlyDigits(c.telefone).includes(qDigits)) ||
        (qCpf && onlyDigitsCpf(c.cpf).includes(qCpf))
      );
    }
    list.sort((a,b)=> (a.nome||'').localeCompare(b.nome||''));

    const wrap = document.getElementById('clientesTableWrap');
    if(list.length===0){
      wrap.innerHTML = `<div class="empty">Nenhum cliente encontrado.</div>`;
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>CPF</th><th>Nascimento</th><th>Ações</th></tr></thead>
        <tbody>
          ${list.map(c=>`
            <tr>
              <td><b>${escapeHtml(c.nome)}</b>${c.endereco?`<div class="muted" style="margin-top:2px;">${escapeHtml(c.endereco)}</div>`:''}</td>
              <td>${escapeHtml(c.telefone||'—')}</td>
              <td>${escapeHtml(c.email||'—')}</td>
              <td>${escapeHtml(c.cpf||'—')}</td>
              <td>${c.dataNascimento?fmtDate(c.dataNascimento):'—'}</td>
              <td style="white-space:nowrap;">
                <button class="icon-btn" data-editcli="${c.id}" title="Editar">✎</button>
                <button class="icon-btn" data-delcli="${c.id}" title="Excluir">🗑</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-editcli]').forEach(b=>{
      b.addEventListener('click', ()=> openClienteModal(clientes.find(x=>x.id===b.dataset.editcli)) );
    });
    wrap.querySelectorAll('[data-delcli]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const clienteId = b.dataset.delcli;
        openModal(`
          <h3>Excluir cliente</h3>
          <p>Tem certeza que deseja excluir este cliente do cadastro? Essa ação não pode ser desfeita.</p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="cliDelCancel">Cancelar</button>
            <button class="btn btn-danger" id="cliDelConfirm">Excluir</button>
          </div>
        `);
        document.getElementById('cliDelCancel').addEventListener('click', closeModal);
        document.getElementById('cliDelConfirm').addEventListener('click', async ()=>{
          clientes = clientes.filter(x=>x.id!==clienteId);
          await saveClientes();
          closeModal();
          renderAniversarioCard();
          renderTable();
          showToast('Cliente excluído.');
        });
      });
    });
  }
  buscaInp.addEventListener('input', renderTable);
  renderTable();

  document.getElementById('btnNovoCliente').addEventListener('click', ()=> openClienteModal(null) );

  function openClienteModal(cliente){
    const editing = !!cliente;
    const c = cliente || { nome:'', telefone:'', email:'', cpf:'', dataNascimento:'', endereco:'' };
    openModal(`
      <h3>${editing?'Editar cliente':'Novo cliente'}</h3>
      <div class="field"><label>Nome</label><input id="cli_nome" value="${escapeHtml(c.nome)}"></div>
      <div class="grid-2">
        <div class="field"><label>Telefone</label><input id="cli_telefone" value="${escapeHtml(c.telefone)}"></div>
        <div class="field"><label>E-mail</label><input type="email" id="cli_email" value="${escapeHtml(c.email)}"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>CPF</label><input id="cli_cpf" value="${escapeHtml(c.cpf)}"></div>
        <div class="field"><label>Data de nascimento</label><input type="date" id="cli_nascimento" value="${c.dataNascimento||''}"></div>
      </div>
      <div class="field"><label>Endereço</label><input id="cli_endereco" value="${escapeHtml(c.endereco)}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cliCancel">Cancelar</button>
        <button class="btn btn-accent" id="cliSave">Salvar</button>
      </div>
    `);
    document.getElementById('cliCancel').addEventListener('click', closeModal);
    document.getElementById('cliSave').addEventListener('click', async ()=>{
      const nome = document.getElementById('cli_nome').value.trim();
      if(!nome){ showToast('Informe o nome do cliente.'); return; }
      const patch = {
        nome,
        telefone: document.getElementById('cli_telefone').value.trim(),
        email: document.getElementById('cli_email').value.trim(),
        cpf: document.getElementById('cli_cpf').value.trim(),
        dataNascimento: document.getElementById('cli_nascimento').value,
        endereco: document.getElementById('cli_endereco').value.trim(),
      };
      if(editing){
        Object.assign(cliente, patch);
      } else {
        clientes.unshift({ id: uid('cli'), ...patch, criadoEm: Date.now() });
      }
      await saveClientes();
      closeModal();
      renderAniversarioCard();
      renderTable();
      showToast(editing ? 'Cliente atualizado.' : 'Cliente cadastrado.');
    });
  }
}

    const obj = { codigo, autorizadoPor: nome, nivelGerador: currentUser.nivel, geradoPor: currentUser.nome, criadoEm: Date.now(), usado:false };

      </div>
    `;
    document.getElementById('btnCopyCodeNovo').addEventListener('click', ()=> copyToClipboard(codigo));
    renderCodeHistory();
  });

  function renderCodeHistory(){
    const wrap = document.getElementById('codeHistory');
    if(codes.length===0){ wrap.innerHTML = `<div class="empty">Nenhum código gerado ainda.</div>`; return; }
    wrap.innerHTML = codes.slice(0,25).map(c=>`
      <div class="code-list-item">
        <div>
          <span class="cl-code">${c.codigo}</span>
          <button type="button" class="copy-btn" data-copyhist="${c.codigo}">📋 Copiar</button>

    `).join('');
    wrap.querySelectorAll('[data-copyhist]').forEach(b=>{
      b.addEventListener('click', ()=> copyToClipboard(b.dataset.copyhist));
    });
  }
  renderCodeHistory();
  (async ()=>{
    codes = await storageGet('codes', true) || codes;
    renderCodeHistory();
  })();
}

      <div style="margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label style="font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint);">Mensagem — Status Entregue</label>
          <button class="btn btn-ghost btn-sm" id="btnRestaurarEntregue">Restaurar padrão</button>
        </div>
        <textarea id="c_mensagemEntregue" class="plain-input">${escapeHtml(config.mensagemEntregue)}</textarea>
        <p class="muted" style="margin-top:6px;">Use {recebidoPor} para inserir o nome de quem recebeu o produto.</p>
      </div>

      <button class="btn btn-accent btn-sm" id="btnSalvarMensagens">Salvar mensagens</button>
    </div>

    <div class="card">
      <div class="section-label">Mensagem de aniversário</div>
      <p class="muted" style="margin:-4px 0 14px;">Usada na aba Clientes para enviar parabéns aos aniversariantes do dia. Marcador disponível: {cliente}.</p>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint);">Mensagem</label>
        <button class="btn btn-ghost btn-sm" id="btnRestaurarAniversario">Restaurar padrão</button>
      </div>
      <textarea id="c_mensagemAniversario" class="plain-input">${escapeHtml(config.mensagemAniversario)}</textarea>
      <button class="btn btn-accent btn-sm" style="margin-top:12px;" id="btnSalvarAniversario">Salvar mensagem</button>
    </div>
  `;

  function renderServiceRows(){
    const wrap = document.getElementById('serviceRows');
    wrap.innerHTML = config.serviceTypes.map((s,i)=>`
      <div class="config-row" data-idx="${i}">
        <input value="${escapeHtml(s.nome)}" data-field="nome">
        <input type="number" min="1" value="${s.maxPorDia}" data-field="maxPorDia">
        <input type="number" min="0" value="${s.prazoMinimoDias}" data-field="prazoMinimoDias">
        <button class="icon-btn" data-remove="${i}" title="Remover">✕</button>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-remove]').forEach(b=>{
      b.addEventListener('click', ()=>{
        config.serviceTypes.splice(Number(b.dataset.remove),1);
        renderServiceRows();
      });
    });
  }
  renderServiceRows();

  document.getElementById('btnAddServico').addEventListener('click', ()=>{
    config.serviceTypes.push({ id: uid('st'), nome:'Novo serviço', maxPorDia:5, prazoMinimoDias:1 });
    renderServiceRows();
  });

  document.getElementById('btnSalvarServicos').addEventListener('click', async ()=>{
    const rows = document.querySelectorAll('#serviceRows .config-row');
    rows.forEach((row, i)=>{
      const nome = row.querySelector('[data-field="nome"]').value.trim() || 'Serviço';
      const max = Math.max(1, parseInt(row.querySelector('[data-field="maxPorDia"]').value)||1);
      const prazo = Math.max(0, parseInt(row.querySelector('[data-field="prazoMinimoDias"]').value)||0);
      config.serviceTypes[i].nome = nome;
      config.serviceTypes[i].maxPorDia = max;
      config.serviceTypes[i].prazoMinimoDias = prazo;
    });
    await saveConfig();
    showToast('Parâmetros de serviço salvos.');
    renderServiceRows();
  });

  function renderPaymentRows(){
    const wrap = document.getElementById('paymentRows');
    if(!config.paymentTypes) config.paymentTypes = [];
    if(config.paymentTypes.length===0){ wrap.innerHTML = `<div class="empty">Nenhuma forma de pagamento cadastrada.</div>`; return; }
    wrap.innerHTML = config.paymentTypes.map((pt,i)=>`
      <div class="code-list-item">
        <div>${escapeHtml(pt.nome)}</div>
        <button class="icon-btn" data-delpayment="${i}" title="Remover">✕</button>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-delpayment]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        config.paymentTypes.splice(Number(b.dataset.delpayment),1);
        await saveConfig();
        renderPaymentRows();
        showToast('Forma de pagamento removida.');
      });
    });
  }
  renderPaymentRows();

  document.getElementById('btnAddPaymentType').addEventListener('click', async ()=>{
    const nome = document.getElementById('pt_nome').value.trim();
    if(!nome){ showToast('Informe o nome da forma de pagamento.'); return; }
    config.paymentTypes.push({ id: uid('pt'), nome });
    await saveConfig();
    document.getElementById('pt_nome').value = '';
    renderPaymentRows();
    showToast('Forma de pagamento adicionada.');
  });

  function renderUserRows(){
    const wrap = document.getElementById('userRows');
    wrap.innerHTML = config.users.map((u,i)=>`
      <div class="code-list-item">
        <div><b>${escapeHtml(u.nome)}</b> <span class="muted" style="margin-left:8px;">senha: ${escapeHtml(u.senha)}</span></div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="level-pill" style="background:var(--surface-2); color:var(--ink-soft);">${levelLabel(u.nivel)}</span>
          <button class="icon-btn" data-deluser="${i}" title="Remover">✕</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-deluser]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(config.users.length<=1){ showToast('É necessário manter ao menos um acesso.'); return; }
        config.users.splice(Number(b.dataset.deluser),1);
        await saveConfig();
        renderUserRows();
        showToast('Acesso removido.');
      });
    });
  }
  renderUserRows();

  document.getElementById('btnAddUser').addEventListener('click', async ()=>{
    const nome = document.getElementById('u_nome').value.trim();
    const senha = document.getElementById('u_senha').value.trim();
    const nivel = document.getElementById('u_nivel').value;
    if(!nome || !senha){ showToast('Preencha nome e senha.'); return; }
    if(config.users.some(u=>u.senha===senha)){ showToast('Essa senha já está em uso.'); return; }
    config.users.push({ id: uid('u'), nome, senha, nivel });
    await saveConfig();
    document.getElementById('u_nome').value='';
    document.getElementById('u_senha').value='';
    renderUserRows();
    showToast('Senha criada.');
  });

  document.getElementById('btnSalvarMensagens').addEventListener('click', async ()=>{
    config.mensagemPadrao = document.getElementById('c_mensagemGeral').value;
    config.mensagemPronto = document.getElementById('c_mensagemPronto').value;
    config.mensagemEntregue = document.getElementById('c_mensagemEntregue').value;
    await saveConfig();
    showToast('Mensagens salvas.');
  });
  document.getElementById('btnRestaurarGeral').addEventListener('click', ()=>{
    document.getElementById('c_mensagemGeral').value = DEFAULT_TEMPLATE;
  });
  document.getElementById('btnRestaurarPronto').addEventListener('click', ()=>{
    document.getElementById('c_mensagemPronto').value = DEFAULT_TEMPLATE_PRONTO;
  });
  document.getElementById('btnRestaurarEntregue').addEventListener('click', ()=>{
    document.getElementById('c_mensagemEntregue').value = DEFAULT_TEMPLATE_ENTREGUE;
  });
  document.getElementById('btnSalvarAniversario').addEventListener('click', async ()=>{
    config.mensagemAniversario = document.getElementById('c_mensagemAniversario').value;
    await saveConfig();
    showToast('Mensagem de aniversário salva.');
  });
  document.getElementById('btnRestaurarAniversario').addEventListener('click', ()=>{
    document.getElementById('c_mensagemAniversario').value = DEFAULT_TEMPLATE_ANIVERSARIO;
  });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadAll();
  const hint = document.getElementById('loginHint');
  const hasCustomDirector = config.users.some(u=>u.nivel==='diretoria' && u.senha!=='diretor123');
  if(!hasCustomDirector){
    hint.innerHTML = 'Primeiro acesso? Entre com a senha padrão da diretoria: <b>diretor123</b> e cadastre as demais senhas em Configurações.';
  }
})();
</script>
</body>
</html>
