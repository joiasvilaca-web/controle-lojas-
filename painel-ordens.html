function renderAlerts(){
  const bar = document.getElementById('alertBar');
  if(!bar) return;
  if(!currentUser){ bar.innerHTML = ''; return; }
  const pending = [];
  orders.forEach(o=>{
    (o.observacoes||[]).forEach(ob=>{
      if(!ob.ciente && ob.notificarPara && ob.notificarPara.includes(currentUser.id)){
        pending.push({ order:o, obs:ob });
      }
    });
  });
  if(pending.length===0){ bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <div class="alert-bar">
      <div class="alert-inner">
        <div class="alert-title">${ico('sino')} ${pending.length===1 ? '1 observação aguarda a sua ciência' : pending.length + ' observações aguardam a sua ciência'}</div>
        ${pending.map(p=>`
          <div class="alert-item">
            <div><b>${escapeHtml(p.order.cliente)}</b> — ${escapeHtml(p.obs.nome)}: ${escapeHtml(p.obs.descricao)}</div>
            <button class="btn btn-accent btn-sm" data-alertciente="${p.order.id}|${p.obs.id}">${ico('check',14)} Marcar ciente</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  bar.querySelectorAll('[data-alertciente]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [oid, obid] = b.dataset.alertciente.split('|');
      promptCiente(async (nome)=>{
        const order = orders.find(x=>x.id===oid);
        const obs = order.observacoes.find(x=>x.id===obid);
        obs.ciente = true; obs.cienteNome = nome; obs.cienteEm = Date.now();
        await saveOrders();
        renderAlerts();
        renderView();
      });
    });
  });
}

/**
 * Mounts a self-contained observations UI (list + add/edit form) into `container`.
 * `orderLike` is either a real persisted order (persisted=true, changes are saved to storage)
 * or a temporary plain object { observacoes: [] } used while a new order is still being drafted
 * (persisted=false, changes only live in memory until the order itself is created).
 */
function mountObservacoes(container, orderLike, persisted){
  if(!orderLike.observacoes) orderLike.observacoes = [];
  let editingId = null;

  async function persistIfNeeded(){
    if(persisted){ await saveOrders(); renderAlerts(); }
  }

  function draw(){
    container.innerHTML = `
      <div class="section-label">Observações <span class="muted">uso interno — o cliente não vê</span></div>
      <div id="obsListInner"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnNovaObsInner">${ico('mais',14)} Nova observação</button>
      <div id="obsFormInner" class="obs-form" style="display:none;"></div>
    `;
    drawList();
    container.querySelector('#btnNovaObsInner').addEventListener('click', ()=>{
      editingId = null;
      openForm();
    });
  }

  function drawList(){
    const listEl = container.querySelector('#obsListInner');
    const list = orderLike.observacoes;
    if(list.length===0){
      listEl.innerHTML = `<div class="muted" style="margin-bottom:10px;">Nenhuma observação ainda.</div>`;
      return;
    }
    listEl.innerHTML = list.slice().sort((a,b)=>b.criadoEm-a.criadoEm).map(o=>`
      <div class="obs-item ${!o.ciente && o.notificarPara.length>0 ? 'obs-pending':''}">
        <div style="display:flex; justify-content:space-between; gap:8px;">
          <div><b>${escapeHtml(o.nome)}</b> <span class="muted">${Fmt.dataHora(o.criadoEm)}</span></div>
          <div style="display:flex; gap:2px; flex-shrink:0;">
            <button type="button" class="icon-btn" data-obsedit="${o.id}" title="Editar observação" aria-label="Editar observação">${ico('lapis')}</button>
            <button type="button" class="icon-btn perigo" data-obsdel="${o.id}" title="Excluir observação" aria-label="Excluir observação">${ico('lixeira')}</button>
          </div>
        </div>
        <div style="margin:6px 0; font-size:13.5px; line-height:1.5;">${escapeHtml(o.descricao)}</div>
        ${o.fotos && o.fotos.length>0 ? `<div class="foto-grid" data-obsfotos="${o.id}"></div>` : ''}
        ${o.notificarPara.length>0 ? `<div class="muted" style="margin-bottom:6px;">Notificar: ${o.notificarPara.map(id=>{const u=config.users.find(x=>x.id===id); return u?escapeHtml(u.nome):'—';}).join(', ')}</div>` : ''}
        ${o.ciente
          ? `<span class="badge badge-ok">${ico('check',13)} Ciente: ${escapeHtml(o.cienteNome)} · ${Fmt.data(o.cienteEm)}</span>`
          : (o.notificarPara.length>0 ? `<button type="button" class="btn btn-danger btn-sm" data-obsciente="${o.id}">${ico('check',14)} Marcar ciente</button>` : `<span class="badge">Sem notificação</span>`)
        }
      </div>
    `).join('');

    listEl.querySelectorAll('[data-obsfotos]').forEach(el=>{
      const obs = list.find(x=>x.id===el.dataset.obsfotos);
      if(obs) mountFotosInline(el, obs.fotos);
    });
    listEl.querySelectorAll('[data-obsedit]').forEach(b=>{
      b.addEventListener('click', ()=>{ editingId = b.dataset.obsedit; openForm(); });
    });
    listEl.querySelectorAll('[data-obsdel]').forEach(b=>{
      b.addEventListener('click', ()=>{
        openModal(`
          <h3>Excluir observação</h3>
          <p>A observação será apagada e não dá para desfazer.</p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="obsDelCancel">Cancelar</button>
            <button class="btn btn-danger" id="obsDelConfirm">Excluir observação</button>
          </div>
        `);
        document.getElementById('obsDelCancel').addEventListener('click', closeModal);
        document.getElementById('obsDelConfirm').addEventListener('click', async ()=>{
          orderLike.observacoes = orderLike.observacoes.filter(x=>x.id!==b.dataset.obsdel);
          await persistIfNeeded();
          closeModal();
          draw();
          showToast('Observação excluída.');
        });
      });
    });
    listEl.querySelectorAll('[data-obsciente]').forEach(b=>{
      b.addEventListener('click', ()=>{

const EMBEDDED = window.self !== window.top;
let pendingAbrirId = null;
function atualizarFaixaLoja(){
  const faixa = document.getElementById('lojaFaixa');
  if(!faixa) return;
  if(window.__lojaAtual && window.__lojaAtual.nome){
    faixa.style.display = 'block';
    faixa.style.setProperty('--loja-cor', window.__lojaAtual.cor || 'var(--t-primary)');
    faixa.textContent = window.__lojaAtual.nome;
  } else {
    faixa.style.display = 'none';
  }
}
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  function mensagemConfiavel(ev){
    try{
      if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
      return true;
    }catch(e){ return false; }
  }

  window.addEventListener('message', async (ev)=>{
    if(!mensagemConfiavel(ev)) return;
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      __appPronto = false;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'pedirRascunho'){
      { const __ov = document.getElementById('modalOverlay'); if(__ov && __ov.classList.contains('show')) closeModal(); }
      if(EMBEDDED) parent.postMessage({ type:'semRascunho', modulo:MOD_ID }, '*');
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    } else if(ev.data.type === 'abrirRegistro'){
      // Veio do "Leitor de código" no menu — abre a O.S. assim que os dados estiverem
      // carregados (se já estiverem, abre na hora).
      pendingAbrirId = ev.data.id;
      if(currentUser && Array.isArray(orders) && orders.length){
        const alvo = orders.find(o=>o.id===pendingAbrirId);
        if(alvo){ openEditModal(alvo.id, false); pendingAbrirId = null; }
      }
    } else if(ev.data.type === 'converterOrcamento'){
      // Vem do módulo Orçamentos (via shell): abre a Nova Ordem já preenchida.
      // Se chegar antes do login/carregamento terminar, fica pendente e o enterApp processa.
      pendingConverterOrcamentoId = ev.data.id || null;
      if(__appPronto && currentUser && config){
        const idConv = pendingConverterOrcamentoId; pendingConverterOrcamentoId = null;
        processarConverterOrcamento(idConv);
      }
    } else if(ev.data.type === 'clientesAtualizados'){
      // O módulo Cadastro mexeu no cadastro de clientes. Como este módulo fica
      // vivo no iframe, a lista em memória ficaria velha — recarrega na hora.
      clientes = []; // sem lista completa em memória: só limpa o cache local
    } else if(ev.data.type === 'lojaAtual'){
      window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
      atualizarFaixaLoja();
      if(currentUser && config) renderView();
    }
  });
}

  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass){ return; }
  btn.disabled = true;
  const r = await gatewayLogin(pass);

function tabsForLevel(){
  const t = [];
  if(SO_CODIGO) return t;
  t.push({ id:'painel', label:'Lançados', icon:'lista' });
  t.push({ id:'agenda', label:'Agenda', icon:'calendario' });
  if(currentUser.nivel==='diretoria'){   // Oficina usa o cartão CÓDIGO do CAIXA
    t.push({ id:'codigo', label:'Código', icon:'cadeado' });
  }
  if(window.__permissoesAbasOverride){
    return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();

  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; modoNovaOrdem = false; renderTabs(); renderView(); });
    nav.appendChild(b);

    b.addEventListener('click', ()=>{ currentTab = t.id; modoNovaOrdem = false; renderTabs(); renderView(); });

/* ============================================================
   REGRAS DE VAGA / PRAZO
   ============================================================ */
/* Tipos do mesmo grupo (t.grupoId) dividem vagas e prazo: a contagem do dia soma todos. */
function idsDoMesmoGrupo(serviceTypeId){
  const st = (config.serviceTypes||[]).find(s=>s.id===serviceTypeId);
  if(!st || !st.grupoId) return [serviceTypeId];
  return config.serviceTypes.filter(s=>s.grupoId===st.grupoId).map(s=>s.id);
}
function checkSlot(serviceTypeId, dateStr, excludeOrderId){
  const st = config.serviceTypes.find(s=>s.id===serviceTypeId);
  if(!st || !dateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateStr+'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  const prazoOk = diffDays >= st.prazoMinimoDias;
  const idsGrupo = idsDoMesmoGrupo(serviceTypeId);
  const countDay = orders.filter(o=> idsGrupo.includes(o.serviceTypeId) && o.data===dateStr && STATUS_OCUPA_VAGA.includes(o.status) && o.id!==excludeOrderId).length;
  const quantidadeOk = countDay < st.maxPorDia;
  return {
    st, prazoOk, quantidadeOk, ok: prazoOk && quantidadeOk,
    ocupadas:countDay, vagas: st.maxPorDia, diffDays
  };
}

/**
 * A partir do tipo de ordem, encontra a PRIMEIRA data (a contar do prazo mínimo
 * configurado pra esse tipo) que ainda tem vaga livre — respeitando a quantidade
 * máxima por dia já cadastrada em Configurações → Tipos de Ordem. Varre no máximo
 * 120 dias à frente; se não achar vaga nesse intervalo (configuração incomum),
 * devolve a data do prazo mínimo mesmo assim, pra não deixar o campo vazio.
 */
function proximaDataDisponivel(serviceTypeId, excludeOrderId){
  const st = config.serviceTypes.find(s=>s.id===serviceTypeId);
  if(!st) return null;
  const base = new Date(todayStr()+'T00:00:00');
  for(let i=st.prazoMinimoDias; i<=st.prazoMinimoDias+120; i++){
    const d = new Date(base); d.setDate(d.getDate()+i);
    const dateStr = d.toISOString().slice(0,10);
    const res = checkSlot(serviceTypeId, dateStr, excludeOrderId);
    if(res && res.ok) return dateStr;
  }
  // Fallback: nenhuma vaga livre em 120 dias — devolve a data do prazo mínimo mesmo assim
  const d = new Date(base); d.setDate(d.getDate()+st.prazoMinimoDias);
  return d.toISOString().slice(0,10);
}

/**
 * Valida em tempo real o código digitado no campo de encaixe, mostrando um retorno
 * visual imediato (código válido / já usado / não encontrado) sem esperar o clique
 * em salvar. A validação definitiva (marcar como usado) continua acontecendo só no
 * momento de salvar a ordem.
 */
function wireCodigoHint(inpId, hintId){
  const inp = document.getElementById(inpId);
  const hint = document.getElementById(hintId);
  if(!inp || !hint) return;
  inp.addEventListener('input', ()=>{
    const val = inp.value.trim().toUpperCase();
    if(!val){ hint.innerHTML=''; return; }
    const valido = (codes||[]).find(c=>c.codigo===val && !c.usado);
    if(valido){
      hint.innerHTML = `<span style="color:var(--ok);font-weight:700;">${ico('check',14)} Código válido — autorizado por ${escapeHtml(valido.autorizadoPor)}. A via pode ser agendada.</span>`;
      return;
    }
    const usado = (codes||[]).find(c=>c.codigo===val && c.usado);
    if(usado){
      hint.innerHTML = `<span style="color:var(--danger);font-weight:700;">Este código já foi utilizado.</span>`;
    } else if(val.length>=6){
      hint.innerHTML = `<span style="color:var(--danger);font-weight:700;">Código não encontrado. Confira as letras com quem gerou.</span>`;
    } else {
      hint.innerHTML = '';
    }
  });
}

/** Cargos de um funcionário do cadastro central, sempre como array (aceita registros antigos com 'area'). */
function cargosDoFuncionario(f){
  if(Array.isArray(f.cargos) && f.cargos.length) return f.cargos;
  return f.area ? [f.area] : [];
}
/**
 * Diz se o funcionário atende a uma área da tela.
 * 'vendedora' = quem vende: Vendedora, Gerente e Diretor(a) (definido em Cadastro → Funcionários).
 * 'oficina'   = quem tem a função Oficina marcada.
 */
function funcionarioAtendeArea(f, area){
  const cargos = cargosDoFuncionario(f);
  if(area==='oficina') return cargos.includes('oficina');
  return cargos.includes('vendedora') || cargos.includes('gerente') || cargos.includes('diretor');
}
/** Nome que aparece nas listas dos módulos: o apelido do cadastro, ou o nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Um nome gravado numa O.S. antiga pode ser o nome completo; aqui bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** Converte um nome gravado (completo ou apelido) pro apelido atual do cadastro. */
function nomeGravadoParaExibicao(lista, nomeGravado){
  const f = (lista||[]).find(x=>funcionarioBateComNome(x, nomeGravado));
  return f ? nomeExibicaoFuncionario(f) : nomeGravado;
}
/** Rótulo curto da função principal, usado nas listas que misturam áreas. */
function cargoLabelFuncionario(f){
  const cargos = cargosDoFuncionario(f);
  if(cargos.includes('diretor')) return 'Diretor(a)';
  if(cargos.includes('gerente')) return 'Gerente';
  if(cargos.includes('vendedora')) return 'Vendedora';
  if(cargos.includes('oficina')) return 'Oficina';
  return 'Funcionário';
}
/** Monta as <option> de funcionários com acesso Oficina OU Diretoria — usado no gerador
 * de código de autorização, já que só esses dois níveis podem autorizar um encaixe. */
function funcionarioOptionsOficinaOuDiretoriaHtml(selected){
  const lista = (config.funcionarios||[]).filter(f=>{
    const cargos = cargosDoFuncionario(f);
    return cargos.includes('oficina') || cargos.includes('diretor');
  });
  const vazio = lista.length===0 ? `<option value="" disabled>Nenhum(a) funcionário(a) de Oficina ou Diretoria cadastrado(a)</option>` : '';
  const sel = nomeGravadoParaExibicao(config.funcionarios||[], selected);
  const naoEstaNaLista = sel && !lista.some(f=>nomeExibicaoFuncionario(f)===sel);
  const extra = naoEstaNaLista ? `<option value="${escapeHtml(sel)}" selected>${escapeHtml(sel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${vazio}${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${sel===n?'selected':''}>${escapeHtml(n)} (${cargoLabelFuncionario(f)})</option>`;
  }).join('');
}
/** Monta as <option> de funcionários de uma área específica ('vendedora' ou 'oficina'). */
function funcionarioOptionsHtml(area, selected){
  const lista = (config.funcionarios||[]).filter(f=>funcionarioAtendeArea(f, area));
  const vazio = lista.length===0 ? `<option value="" disabled>Nenhum(a) ${area==='vendedora'?'vendedora':'ourives'} cadastrado(a)</option>` : '';
  const sel = nomeGravadoParaExibicao(config.funcionarios||[], selected);
  const naoEstaNaLista = sel && !lista.some(f=>nomeExibicaoFuncionario(f)===sel);
  const extra = naoEstaNaLista ? `<option value="${escapeHtml(sel)}" selected>${escapeHtml(sel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${vazio}${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${sel===n?'selected':''}>${escapeHtml(n)}</option>`;
  }).join('');
}
/** Monta as <option> de TODOS os funcionários (vendedoras e ourives juntos), com a área indicada. */
function funcionarioOptionsTodosHtml(selected){
  const lista = config.funcionarios||[];
  const vazio = lista.length===0 ? `<option value="" disabled>Nenhum funcionário cadastrado</option>` : '';
  const sel = nomeGravadoParaExibicao(lista, selected);

function montarMensagemOS(order, template){
  const st = (config.serviceTypes||[]).find(s=>s.id===order.serviceTypeId);
  const loja = (config.lojas||[]).find(l=>l.id===order.lojaId);
  const nota = order.codigoVia || order.via || '';
  const notaLinha = nota ? `Número da nota: ${nota}
` : '';
  const linkAcomp = `https://vilaca-controle-lojas.vercel.app/acompanhar.html?id=${encodeURIComponent(order.id||'')}`;   // página pública de acompanhamento (acompanhar.html lê o id da O.S.)
  return (template||DEFAULT_TEMPLATE)
    .replace(/\{cliente\}/g, order.cliente||'')
    .replace(/\{via\}/g, order.via||'')
    .replace(/\{status\}/g, statusLabel(order.status))
    .replace(/\{servico\}/g, st ? st.nome : (order.serviceTypeName||''))
    .replace(/\{data\}/g, fmtDate(order.data))
    .replace(/\{loja\}/g, loja ? loja.nome : (order.lojaId||''))
    .replace(/\{vendedora\}/g, order.vendedora||'')
    .replace(/\{recebidoPor\}/g, order.recebidoPor||'')
    .replace(/\{notaLinha\}/g, notaLinha)
    .replace(/\{linkAcompanhamento\}/g, linkAcomp);
}

/**
 * Abre uma janela com um documento formatado da ordem de serviço, pronto para impressão
 * (ou salvar como PDF pelo próprio diálogo de impressão do navegador).
 */
function printOrder(order){
  const paymentTypesMap = {};
  (config.paymentTypes||[]).forEach(pt=>{ paymentTypesMap[pt.id] = pt.nome; });

  pequena: { base:12, titulo:14, sub:11 },

<html lang="pt-BR">

${codigoVia ? `<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>` : ''}

  .sub{ font-size:${px.sub}px; color:#000; text-align:center; }

  b{ font-weight:800; }
  .destaque{ font-weight:800; font-size:${Math.round(px.base*1.25)}px; }
  .barcode-wrap{ text-align:center; margin-top:6px; }
  .barcode-wrap svg{ max-width:100%; }
  @media print{ body{ padding:1mm 2mm; } }
</style>
</head>
<body>
  ${codigoHtml}
  ${conteudoHtml}
  ${rodape ? `<div class="linha"></div><div class="rodape">${escapeHtml(rodape)}</div>` : ''}
</body>
</html>`;
  const printWin = window.open('', '_blank', 'width=420,height=700');
  if(!printWin){ showToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups do navegador.'); return; }
  printWin.document.open();
  printWin.document.write(html);
  printWin.document.close();
  printWin.focus();
  if(codigoVia){
    const tentarGerarCodigo = ()=>{
      try{
        if(printWin.JsBarcode){
          printWin.JsBarcode(printWin.document.getElementById('barcodeSvg'), codigoVia, { format:'CODE128', width:2, height:42, displayValue:false, margin:0 });

      setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 250);

    setTimeout(tentarGerarCodigo, 400);
  } else {
    setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 300);
  }
}

/* ============================================================
   NOVA ORDEM
   ============================================================ */
let produtosEstoque = [];

function unidadeEstoqueLabel(u){ return u==='g' ? 'g' : u==='kg' ? 'kg' : 'un'; }

/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`,
 * explodindo pela composição (receita) em cascata quando falta estoque em
 * qualquer nível — ex: falta o produto pronto -> usa o insumo secundário ->
 * se também faltar, usa os insumos primários que compõem o secundário.
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`, NA
 * LOJA `lojaId` (estoque agora é por loja, não mais um número global), explodindo
 * pela composição (receita) em cascata quando falta estoque em qualquer nível —
 * ex: falta o produto pronto -> usa o insumo secundário -> se também faltar, usa
 * os insumos primários que compõem o secundário (sempre dentro da mesma loja).
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
function planejarConsumoEstoque(produtoId, quantidadeNecessaria, reservas, lojaId){
  const produto = produtosEstoque.find(p=>p.id===produtoId);
  if(!produto) return { ok:false, faltando:[{ produtoId, nome:'(produto não encontrado)', quantidade:quantidadeNecessaria }] };

  const estoqueNaLoja = Number((produto.estoquePorLoja||{})[lojaId]) || 0;
  const jaReservado = reservas[produtoId] || 0;
  const disponivel = Math.max(0, estoqueNaLoja - jaReservado);
  const usarDoProprio = Math.min(disponivel, quantidadeNecessaria);
  if(usarDoProprio > 0) reservas[produtoId] = jaReservado + usarDoProprio;

  const faltaAinda = quantidadeNecessaria - usarDoProprio;
  if(faltaAinda <= 1e-9) return { ok:true, faltando:[] };

  if(!produto.composicao || produto.composicao.length===0){
    return { ok:false, faltando:[{ produtoId, nome:produto.nome, quantidade:faltaAinda }] };
  }

  let tudoOk = true;
  const faltandoTotal = [];
  produto.composicao.forEach(comp=>{
    const qtdComponente = (Number(comp.quantidade)||0) * faltaAinda;
    const resultado = planejarConsumoEstoque(comp.insumoId, qtdComponente, reservas, lojaId);
    if(!resultado.ok){ tudoOk = false; faltandoTotal.push(...resultado.faltando); }
  });
  return { ok: tudoOk, faltando: faltandoTotal };
}

/* ============================================================
   ESTOQUE DO PEDIDO (Edge Function estoque-api)
   - Ao salvar um pedido ativo: reserva as peças do catálogo (op reservar, idempotente).
   - Ao entregar: baixa no Kardex (op baixar, VENDA_PEDIDO).
   - Ao cancelar/excluir: libera a reserva; se já tinha baixado, pergunta se devolve.
   Falha aqui NUNCA bloqueia a mudança de status — só mostra aviso.
   ============================================================ */
const ESTOQUE_API_URL = SUPABASE_URL + '/functions/v1/estoque-api';
async function estoqueApi(op, params){
  try{
    const res = await fetch(ESTOQUE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, op, ...(params||{}) }),
    });
    let j = null;
    try{ j = await res.json(); }catch(e){ j = null; }
    if(!j) return { ok:false, error:'Resposta inválida do servidor de estoque (HTTP '+res.status+').' };
    if(!res.ok && !j.error) j.error = 'HTTP '+res.status;
    return j;
  }catch(e){
    console.error('estoque-api', op, e);
    return { ok:false, error:'Não foi possível falar com o servidor de estoque.' };
  }
}
function estoqueApiFalhou(r){ return !r || r.ok===false || !!r.error; }
/** Loja cujo estoque o pedido consome — mesma regra do PDV (lojaEstoqueDaVenda):
 * a empresa de "saída da joia" (quando informada) ou a loja do pedido. */
function estoqueLojaIdDaOrdem(o){ return (o && (o.lojaSaidaId || o.lojaId)) || ''; }
function nomeLojaPorId(id){ const l = (config.lojas||[]).find(x=>x.id===id); return l ? l.nome : (id||'—'); }
function itemOsPreenchido(it){
  return !!(it && (it.produtoEstoqueId || String(it.produto||'').trim() || (it.valorUnitario!=='' && it.valorUnitario!=null)));
}
/** Itens que vão para a ordem: os confirmados + linha em edição que já tem conteúdo. */
function itensOsParaSalvar(holder){
  return (holder && holder.itens ? holder.itens : []).filter(it=> it._modo==='ok' || itemOsPreenchido(it)).map(it=>{
    const c = { ...it };
    if(c.avulso){ c.produtoEstoqueId = ''; c.produto = maiusc(c.produto); }
    if(c.quantidade==null || c.quantidade==='') c.quantidade = 1;
    return c;
  });
}
/** Itens sem vínculo com o catálogo e não marcados como avulso (ou avulso sem descrição). */
function itensOsInvalidos(itens){
  return (itens||[]).filter(it=> it.avulso ? !String(it.produto||'').trim() : !it.produtoEstoqueId);
}
function nomeItemOs(it, idx){
  const nome = String(it.produto||'').trim();
  if(nome) return nome;
  return 'item ' + (idx+1) + (it.valorUnitario!=='' && it.valorUnitario!=null ? ' (R$ '+Number(it.valorUnitario).toFixed(2)+')' : ' (sem descrição)');
}
/** Valida o catálogo obrigatório. Retorna true se ok; senão mostra o aviso, abre as linhas para correção e retorna false. */
function validarCatalogoItensOs(holder, itensApi){
  const itens = itensOsParaSalvar(holder);
  const ruins = itensOsInvalidos(itens);
  if(!ruins.length) return true;
  const nomes = ruins.map(r=> nomeItemOs(r, itens.indexOf(r)));
  (holder.itens||[]).forEach(it=>{ if(ruins.some(r=>r.id===it.id)) it._modo = 'editar'; });
  if(itensApi && typeof itensApi.refreshEstoque==='function'){ try{ itensApi.refreshEstoque(); }catch(e){} }
  showToast('Vincule ao catálogo ou marque "Item avulso (sem estoque)": ' + nomes.join(', ') + '.');
  return false;
}
function itensCatalogoDaOrdem(o){ return (o && o.itens ? o.itens : []).filter(it=> it && it.produtoEstoqueId && !it.avulso); }
/** Planeja o consumo (com composição/BOM) dos itens de catálogo. Se faltar estoque
 * para um item, reserva o próprio produto na quantidade cheia (permite vender sem saldo). */
function planoConsumoDaOrdem(o){
  const lojaId = estoqueLojaIdDaOrdem(o);
  const reservas = {};
  itensCatalogoDaOrdem(o).forEach(it=>{
    const qtd = Number(it.quantidade) || 1;
    const tentativa = { ...reservas };
    const r = planejarConsumoEstoque(it.produtoEstoqueId, qtd, tentativa, lojaId);
    if(r.ok){ Object.assign(reservas, tentativa); }
    else { reservas[it.produtoEstoqueId] = (reservas[it.produtoEstoqueId]||0) + qtd; }
  });
  const itens = Object.keys(reservas).filter(id=> reservas[id] > 0).map(id=>({ produtoId:id, quantidade: Math.round(reservas[id]*1000)/1000 }));
  return { lojaId, itens };
}
/** Reservado (por produto) na loja, excluindo opcionalmente este pedido. null se falhar. */
async function reservadasNaLoja(lojaId, produtoIds, excluirOrigemId){
  const params = { lojaId };
  if(produtoIds && produtoIds.length) params.produtoIds = produtoIds;
  if(excluirOrigemId) params.excluirOrigem = { tipo:'os', id: excluirOrigemId };
  const r = await estoqueApi('reservadas', params);
  if(estoqueApiFalhou(r) || !Array.isArray(r.data)) return null;
  const mapa = {};
  r.data.forEach(x=>{ if(!x) return; if(x.loja_id && lojaId && x.loja_id!==lojaId) return; mapa[x.produto_id] = (mapa[x.produto_id]||0) + (Number(x.quantidade)||0); });
  return mapa;
}
/** Confere disponível (estoque − reservado por outros) x necessário. Se faltar, pergunta.
 * Retorna true para seguir com o salvamento. Nunca bloqueia por falha do servidor. */
async function confirmarDisponibilidadeOrdem(plano, excluirOrigemId){
  if(!plano || !plano.itens.length || !plano.lojaId) return true;
  const reservadoOutros = await reservadasNaLoja(plano.lojaId, plano.itens.map(i=>i.produtoId), excluirOrigemId) || {};
  const faltas = [];
  plano.itens.forEach(i=>{
    const p = produtosEstoque.find(x=>x.id===i.produtoId);
    const estoque = Number(((p&&p.estoquePorLoja)||{})[plano.lojaId]) || 0;
    const disp = estoque - (reservadoOutros[i.produtoId]||0);
    if(disp < i.quantidade - 1e-9) faltas.push(`• ${p ? p.nome : i.produtoId}: precisa ${i.quantidade}, disponível ${Math.max(0, Math.round(disp*1000)/1000)}`);
  });
  if(!faltas.length) return true;
  return confirm('Estoque insuficiente na loja ' + nomeLojaPorId(plano.lojaId) + ':\n\n' + faltas.join('\n') + '\n\nSalvar o pedido mesmo assim (a reserva fica registrada)?');
}
/** Reserva (ou libera, se não houver mais itens de catálogo) as peças do pedido. */
async function sincronizarReservasOrdem(order, plano){
  try{
    if(!order || order.status===STATUS.ENTREGUE || order.status===STATUS.CANCELADO) return;
    if(order.estoqueBaixadoEm) return;
    plano = plano || planoConsumoDaOrdem(order);
    const itens = order.status===STATUS.RASCUNHO ? [] : plano.itens;
    if(!itens.length && !order.reservaLojaId) return;
    const r = await estoqueApi('reservar', { origemTipo:'os', origemId: order.id, lojaId: plano.lojaId || order.reservaLojaId, itens });
    if(estoqueApiFalhou(r)) showToast('Pedido salvo, mas a reserva de estoque falhou: ' + ((r&&r.error)||'erro desconhecido') + '.');
  }catch(e){ console.error('sincronizarReservasOrdem', e); showToast('Pedido salvo, mas a reserva de estoque falhou.'); }
}
function aplicarSaldosEstoque(saldos){
  if(!saldos || typeof saldos!=='object') return;
  Object.keys(saldos).forEach(pid=>{
    const p = produtosEstoque.find(x=>x.id===pid);
    if(!p) return;
    if(!p.estoquePorLoja) p.estoquePorLoja = {};
    Object.keys(saldos[pid]||{}).forEach(lj=>{ const v = Number(saldos[pid][lj]); if(!isNaN(v)) p.estoquePorLoja[lj] = v; });
  });
}
/** Pedido entregue: garante a reserva atual e baixa no Kardex. Muta `order` (não salva). */
async function estoqueAoEntregar(order){
  try{
    if(!order || order.estoqueBaixadoEm) return;
    const plano = planoConsumoDaOrdem(order);
    if(!plano.itens.length && !order.reservaLojaId) return;
    if(plano.itens.length){
      order.reservaLojaId = plano.lojaId;
      const rr = await estoqueApi('reservar', { origemTipo:'os', origemId: order.id, lojaId: plano.lojaId, itens: plano.itens });
      if(estoqueApiFalhou(rr)) console.warn('reservar antes da baixa falhou', rr);
    }
    const r = await estoqueApi('baixar', { origemTipo:'os', origemId: order.id, tipoMovimento:'VENDA_PEDIDO' });
    // baixar devolve ok:false quando ALGUMA linha falhou (as demais já foram baixadas)
    const temSaldos = r && r.saldos && typeof r.saldos==='object' && Object.keys(r.saldos).length > 0;
    if(estoqueApiFalhou(r) && !temSaldos){ showToast('Status salvo, mas a baixa de estoque falhou: ' + ((r&&r.error) || (r&&Array.isArray(r.falhas)&&r.falhas.join('; ')) || 'erro desconhecido') + '. Confira o estoque.'); return; }
    if(!temSaldos){ if(plano.itens.length) showToast('Nenhuma peça foi baixada do estoque (reserva não encontrada). Confira o estoque.'); return; }
    aplicarSaldosEstoque(r.saldos);
    order.estoqueBaixadoEm = Date.now();
    if(Array.isArray(r.falhas) && r.falhas.length) showToast('Baixa de estoque parcial: ' + r.falhas.length + ' item(ns) com falha. Confira o estoque.');
  }catch(e){ console.error('estoqueAoEntregar', e); showToast('Status salvo, mas a baixa de estoque falhou.'); }
}
/** Cancelamento/exclusão: libera reservas e, se já tinha baixado, oferece devolver. Muta `order` (não salva). */
async function estoqueAoCancelarOuExcluir(order, motivo){
  try{
    if(!order || (!order.reservaLojaId && !order.estoqueBaixadoEm)) return;
    const r = await estoqueApi('liberar', { origemTipo:'os', origemId: order.id, motivo });
    if(estoqueApiFalhou(r)) showToast('Não foi possível liberar a reserva de estoque: ' + ((r&&r.error)||'erro desconhecido') + '.');
    if(!order.estoqueBaixadoEm || order.estoqueEstornadoEm) return;
    if(!confirm('Este pedido já tinha baixado peças do estoque.\n\nDevolver as peças ao estoque?')) return;
    const d = await estoqueApi('daOrigem', { origemTipo:'os', origemId: order.id });
    if(estoqueApiFalhou(d) || !Array.isArray(d.data)){ showToast('Não foi possível consultar as peças baixadas: ' + ((d&&d.error)||'erro') + '. Devolva manualmente.'); return; }
    const baixadas = d.data.filter(x=> x && x.status==='baixada' && Number(x.quantidade)>0);
    let falhas = 0;
    for(const row of baixadas){
      const qtd = Math.abs(Number(row.quantidade)||0);
      const g = await gatewayCall({ op:'registrarMovimentoEstoque', params:{ produtoId: row.produto_id, lojaId: row.loja_id, tipoMovimento:'CANCELAMENTO_PEDIDO', quantidade: qtd, referenciaId: order.id } });
      if(g && !g.error){
        const p = produtosEstoque.find(x=>x.id===row.produto_id);
        if(p){ if(!p.estoquePorLoja) p.estoquePorLoja = {}; p.estoquePorLoja[row.loja_id] = typeof g.saldoNovo==='number' ? g.saldoNovo : (Number(p.estoquePorLoja[row.loja_id])||0) + qtd; }
      } else { falhas++; console.error('estorno de estoque falhou', row, g && g.error); }
    }
    if(baixadas.length && falhas < baixadas.length) order.estoqueEstornadoEm = Date.now();
    showToast(falhas ? `${falhas} peça(s) não voltaram ao estoque — confira manualmente.` : (baixadas.length ? 'Peças devolvidas ao estoque.' : 'Nenhuma peça baixada para devolver.'));
  }catch(e){ console.error('estoqueAoCancelarOuExcluir', e); showToast('Falha ao ajustar o estoque deste pedido.'); }
}
/** Linha de status do estoque na visualização/edição do pedido. */
function estoqueStatusLinhaHtml(order){
  if(!order) return '';
  const dm = ms=> Fmt.data(ms);
  const estilo = 'margin:6px 0 10px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;';
  if(order.estoqueEstornadoEm) return `<div class="muted" style="${estilo}">${ico('devolver',14)} Peças devolvidas ao estoque em ${dm(order.estoqueEstornadoEm)}</div>`;
  if(order.estoqueBaixadoEm) return `<div style="${estilo} color:var(--ok);">${ico('check',14)} Baixado do estoque em ${dm(order.estoqueBaixadoEm)}</div>`;
  if(order.status===STATUS.CANCELADO || order.status===STATUS.RASCUNHO || !order.reservaLojaId) return '';
  const n = itensCatalogoDaOrdem(order).reduce((a,it)=> a + (Number(it.quantidade)||1), 0);
  if(!n) return '';
  return `<div class="muted" style="${estilo}">${ico('pacote',14)} Estoque: ${n} ${n===1?'item reservado':'itens reservados'} na loja ${escapeHtml(nomeLojaPorId(order.reservaLojaId))}</div>`;
}

/* ===== CONVERTER ORÇAMENTO EM PEDIDO ===== */
let novaOrdemPrefill = null;           // { orcamento, cliente, itens } — usado por renderNovaOrdem
let pendingConverterOrcamentoId = null;
let __appPronto = false;
function statusOrcamentoConvertido(){
  const l = statusList();
  return l.find(s=>s.id==='aprovado') || l.find(s=>s.encerra && s.id!=='recusado') || l[0];
}
function itensDoOrcamentoParaOS(o){
  return (o && o.itens ? o.itens : []).map(it=>{
    const vinculado = !!it.produtoEstoqueId && !it.avulso;
    const avulso = !!it.avulso;
    return { id: uid('it'), produto: it.produto||'', metal: it.metal||'', quantidade: Number(it.quantidade)||1,
      valorUnitario: (it.valorUnitario!=null ? it.valorUnitario : ''), produtoEstoqueId: vinculado ? it.produtoEstoqueId : '', avulso,
      precoOriginal: it.precoOriginal!=null && it.precoOriginal!=='' ? it.precoOriginal : (it.valorUnitario!=null ? it.valorUnitario : ''),
      ajusteTipo:'nenhum', ajusteModo:'percentual', ajusteQtd:'', ajustePerc:'', ajusteValR:'', observacaoItem: it.observacaoItem||'',
      _modo: (vinculado || (avulso && String(it.produto||'').trim())) ? 'ok' : 'editar' };
  });
}
async function processarConverterOrcamento(id){
  if(!id) return;
  try{
    const lista = await orcamentosGet();
    if(Array.isArray(lista) && lista.length) orcamentos = lista;
    const o = orcamentos.find(x=>x.id===id);
    if(!o){ showToast('Orçamento não encontrado.'); return; }
    if(o.convertidoEm && o.convertidoEm.id){
      if(!confirm('Este orçamento já virou o pedido ' + (o.convertidoEm.codigo||'') + '. Criar outro pedido mesmo assim?')) return;
    }
    let cli = null;
    try{ if(o.telefone || o.cpf) cli = await buscarClientePorTelefoneOuCpf(o.telefone||'', o.cpf||''); }catch(e){ cli = null; }
    if(!cli) cli = { nome: o.cliente||'', telefone: o.telefone||'', email: o.email||'', cpf: o.cpf||'' };
    novaOrdemPrefill = { orcamento: o, cliente: cli, itens: itensDoOrcamentoParaOS(o) };
    { const __ov = document.getElementById('modalOverlay'); if(__ov && __ov.classList.contains('show')) closeModal(); }
    currentTab = 'painel';
    modoNovaOrdem = true;
    renderTabs(); renderView();
  }catch(e){ console.error('converterOrcamento', e); showToast('Não foi possível abrir o orçamento.'); }
}
/** Depois de salvar o pedido: marca o orçamento como convertido (status aprovado). */
async function marcarOrcamentoConvertido(orc, ordem){
  if(!orc || !ordem) return;
  try{
    const atual = orcamentos.find(x=>x.id===orc.id) || orc;
    const st = statusOrcamentoConvertido();
    if(st) atual.status = st.id;
    atual.convertidoEm = { tipo:'pedido', id: ordem.id, codigo: ordem.codigoVia || ordem.via || '', data: new Date().toISOString() };
    const ok = await orcamentoSalvar(atual);
    if(ok) showToast('Orçamento marcado como convertido em pedido.');
  }catch(e){ console.error('marcarOrcamentoConvertido', e); }
}

function mountItens(container, holder, getLojaId, opts){

  // Reservado por produto na loja (outros pedidos; exclui este quando editando)
  let reservadoMapa = null, reservadoLoja = null, reservadoCarregando = false;
  function estoqueInfoHtml(produto, lojaId){
    const est = Number(((produto&&produto.estoquePorLoja)||{})[lojaId]) || 0;
    const un = escapeHtml(unidadeEstoqueLabel(produto.unidade));
    if(!reservadoMapa || reservadoLoja!==lojaId) return `${ico('pacote',13)} <b>${est}</b> ${un} em estoque · <span class="muted">conferindo reservas…</span>`;
    if(reservadoMapa==='erro') return `${ico('pacote',13)} <b>${est}</b> ${un} em estoque · <span class="muted">não deu para conferir as reservas</span>`;
    const res = reservadoMapa[produto.id] || 0;
    const disp = Math.round((est - res)*1000)/1000;
    return `${ico('pacote',13)} <b>${est}</b> ${un} em estoque · ${res} reservado · <b style="color:${disp>0?'var(--ok)':'var(--danger)'};">${disp} disponível</b>`;
  }
  function atualizarInfosEstoque(){
    const lojaId = getLojaId();
    container.querySelectorAll('[data-estinfo]').forEach(el=>{
      const p = (produtosEstoque||[]).find(x=>x.id===el.dataset.estinfo);
      if(p) el.innerHTML = estoqueInfoHtml(p, lojaId);
    });
  }
  function carregarReservadas(){
    const lojaId = getLojaId();
    if(!lojaId || reservadoCarregando || (reservadoMapa && reservadoLoja===lojaId)) return;
    reservadoCarregando = true;
    reservadasNaLoja(lojaId, null, opts.excluirOrigemId).then(m=>{
      reservadoCarregando = false;
      reservadoMapa = m || 'erro'; reservadoLoja = lojaId;
      atualizarInfosEstoque();
    });
  }

  function totalItens(){ return holder.itens.reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0); }

  /** Recalcula valorUnitario a partir do preço original + desconto/acréscimo (se algum
   * ajuste estiver configurado). Se não houver ajuste, não mexe no que já está lá — a
   * pessoa ainda pode digitar o valor unitário na mão, direto. */
  /* Recalcula o valor final após um ajuste de desconto/acréscimo via botões.
   Atualiza o campo de valor e o span de total inline sem redesenhar a linha. */
function recalcularAjusteNovo(it, idx, row){
  if(it.ajusteTipo==='nenhum'||it.ajusteQtd===''||it.ajusteQtd==null){ return; }
  const base = Number(it.precoOriginal)||0;
  if(!base) return;
  const qtd = Number(it.ajusteQtd)||0;
  const delta = it.ajusteModo==='percentual' ? base*qtd/100 : qtd;
  it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
  const inpVal=row ? row.querySelector('[data-itfield="valorUnitario"]') : null;
  if(inpVal) inpVal.value=Number(it.valorUnitario).toFixed(2);
  const span=document.getElementById('descTotal_'+idx);
  if(span) span.textContent='= '+fmtMoeda(it.valorUnitario);
  updateTotalHint();
}
function recalcularValorAjustado(it){
    if(it.ajusteTipo==='desconto' || it.ajusteTipo==='acrescimo'){
      const base = Number(it.precoOriginal)||0;
      const qtdAjuste = Number(it.ajusteQtd)||0;
      const delta = it.ajusteModo==='percentual' ? base*qtdAjuste/100 : qtdAjuste;
      it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
    }
  }

      .map(l=> `${l.abreviacao} (${Number(porLoja[l.id])||0})`);
  }

    container.innerHTML = `
      <div class="section-label">Itens do pedido</div>

        if(driveResult && driveResult.url) it.fotos.push({ id:fotoId, nome:file.name, criadoEm:Date.now(), driveUrl:driveResult.url, driveFileId:driveResult.fileId });
        else { photoCache[fotoId] = dataUrl; await storageSet('foto:' + fotoId, dataUrl, true); it.fotos.push({ id:fotoId, nome:file.name, criadoEm:Date.now() }); }
      }catch(e){ showToast('Não foi possível processar uma das fotos.'); }

            <div class="foto-grid" data-itfotogrid="${i}" data-edit="1"></div>
            <input type="file" accept="image/*" multiple data-itfotoin="${i}" style="display:none;">
            <input type="file" accept="image/*" capture="environment" data-itfotocam="${i}" style="display:none;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
              <button type="button" class="btn btn-ghost btn-sm" data-itfotobtn="${i}:gal">${ico('imagem',14)} Foto do item</button>
              <button type="button" class="btn btn-ghost btn-sm" data-itfotobtn="${i}:cam">${ico('camera',14)} Tirar foto</button>
            </div>
          </div>
        </div>`;
      }
    });
    wrap.innerHTML=__html;
    if(container.querySelector('[data-estinfo]')) carregarReservadas();
    ligarFotosItens(wrap);

    // ── Autocomplete de produto ──
    wrap.querySelectorAll('[data-pac]').forEach(inp=>{
      const i = Number(inp.dataset.pac);
      const drop = document.getElementById('pacDrop_'+i);
      let pacTimer=null, pacFocus=-1, pacAchados=[];
      function fecharDrop(){ drop.style.display='none'; pacFocus=-1; }
      function renderDrop(lista){
        pacAchados=lista;
        if(!lista.length){ drop.innerHTML='<div class="prod-ac-item" style="color:var(--ink-faint);">Nenhum produto encontrado.</div>'; drop.style.display='block'; return; }
        drop.innerHTML=lista.map((p,k)=>`<div class="prod-ac-item" data-pk="${k}"><b>${escapeHtml(p.nome)}</b><span>${[p.codigo?'Cód. '+escapeHtml(String(p.codigo)):null,p.fator!=null&&p.fator!==''?'Fator '+escapeHtml(String(p.fator)):null,p.fornecedor?escapeHtml(p.fornecedor):null,p.precoVenda!=null?fmtMoeda(p.precoVenda):null].filter(Boolean).join(' · ')}</span></div>`).join('');
        drop.style.display='block';
        drop.querySelectorAll('.prod-ac-item[data-pk]').forEach(el=>{
          el.addEventListener('mouseover',()=>{ pacFocus=Number(el.dataset.pk); drop.querySelectorAll('.prod-ac-item').forEach((e,k)=>e.classList.toggle('pf',k===pacFocus)); });
          el.addEventListener('mousedown',e=>{ e.preventDefault(); selecionarProduto(i,pacAchados[Number(el.dataset.pk)]); });
        });
      }
      inp.addEventListener('input',()=>{ clearTimeout(pacTimer); pacTimer=setTimeout(()=>{
        const t=inp.value.toLowerCase().trim();
        if(!t){ fecharDrop(); return; }
        const codigoExato=/^\d{6,}$/.test(inp.value.trim());
        if(codigoExato){
          const porCod=vendaveis.find(p=>(p.codigoBarras&&String(p.codigoBarras).trim()===inp.value.trim())||(p.codigo&&String(p.codigo).trim()===inp.value.trim()));
          if(porCod){ selecionarProduto(i,porCod); fecharDrop(); return; }
        }
        renderDrop(filtrarProdutosBusca(vendaveis, inp.value));
      },120); });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.prod-ac-item[data-pk]');
        if(!items.length) return;
        if(e.key==='ArrowDown'){ e.preventDefault(); pacFocus=Math.min(pacFocus+1,items.length-1); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); pacFocus=Math.max(pacFocus-1,0); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='Enter'){ e.preventDefault();
          if(pacFocus>=0) selecionarProduto(i,pacAchados[pacFocus]);
          else if(pacAchados.length===1) selecionarProduto(i,pacAchados[0]);
        }
        else if(e.key==='Escape'){ fecharDrop(); }
      });
      inp.addEventListener('blur',()=>{ setTimeout(fecharDrop,150); });
      inp.focus();
    });
    // ＋ confirma → compacto + nova linha vazia
    wrap.querySelectorAll('[data-itadd]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.itadd);
        const it=holder.itens[idx];
        if(it.avulso){ if(!String(it.produto||'').trim()){ showToast('Descreva o item avulso.'); return; } }
        else if(!it.produtoEstoqueId&&!it.valorUnitario) return;
        it._modo='ok';
        holder.itens.splice(0,0,{id:uid('it'),produto:'',metal:'',quantidade:1,valorUnitario:'',produtoEstoqueId:'',precoOriginal:'',ajusteTipo:'nenhum',ajusteModo:'percentual',ajusteQtd:'',ajustePerc:'',ajusteValR:'',observacaoItem:'',_modo:'editar'});
        drawRows(); updateTotalHint();
      });
    });
    // lápis: volta ao modo editar
    wrap.querySelectorAll('[data-iteditar]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        holder.itens[Number(btn.dataset.iteditar)]._modo='editar';
        drawRows(); updateTotalHint();
      });
    });
    // balão: mostra/esconde a observação
    wrap.querySelectorAll('[data-itobstoggle]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const box=document.getElementById('vendaObs_'+btn.dataset.itobstoggle);
        if(box) box.style.display=box.style.display==='block'?'none':'block';
      });
    });

    // Item avulso (sem estoque): troca o catálogo por uma descrição livre
    wrap.querySelectorAll('[data-itavulso]').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const it=holder.itens[Number(cb.dataset.itavulso)];
        it.avulso=cb.checked;
        if(it.avulso) it.produtoEstoqueId='';
        drawRows(); updateTotalHint();
      });
    });
    // Botão × limpa produto
    wrap.querySelectorAll('[data-paclear]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.paclear);
        const it=holder.itens[i];
        it.produtoEstoqueId=''; it.produto=''; it.precoOriginal=''; it.valorUnitario=''; it.ajusteTipo='nenhum'; it.ajusteQtd='';
        drawRows(); updateTotalHint();
      });
    });

    // ── Botões Desconto / Acréscimo ──
    wrap.querySelectorAll('[data-aidbtn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.idx2);
        const it=holder.itens[idx];
        const tipo=btn.dataset.aidbtn;
        // toggle: clicar no mesmo botão ativo desativa
        it.ajusteTipo = it.ajusteTipo===tipo ? 'nenhum' : tipo;
        // atualiza aparência dos botões sem redesenhar a linha inteira
        const row=wrap.querySelector('[data-idx="'+idx+'"]');
        row.querySelectorAll('[data-aidbtn]').forEach(b=>{
          b.classList.remove('ativo-desc','ativo-acr');
          if(it.ajusteTipo==='desconto'&&b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
          if(it.ajusteTipo==='acrescimo'&&b.dataset.aidbtn==='acrescimo') b.classList.add('ativo-acr');
        });
        if(it.ajusteTipo==='nenhum'){
          it.ajustePerc=''; it.ajusteValR='';
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          // restaura valor original
          if(it.precoOriginal!==''&&it.precoOriginal!=null){
            it.valorUnitario=it.precoOriginal;
            const inpVal=row.querySelector('[data-itfield="valorUnitario"]');
            if(inpVal) inpVal.value=Number(it.precoOriginal).toFixed(2);
          }
          updateTotalHint();
        } else {
          recalcularAjusteNovo(it, idx, row);
        }
      });
    });

    // ── Campos de valor e desconto ──
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input',()=>{
        const row=el.closest('[data-idx]');
        const idx=Number(row.dataset.idx);
        const field=el.dataset.itfield;
        const it=holder.itens[idx];

        if(field==='valorUnitario'){
          it.valorUnitario=el.value===''?'':parseFloat(el.value);
          it.precoOriginal=it.valorUnitario;
          // limpa desconto ao editar valor manualmente
          it.ajustePerc=''; it.ajusteValR=''; it.ajusteTipo='nenhum';
          row.querySelectorAll('[data-aidbtn]').forEach(b=>b.classList.remove('ativo-desc','ativo-acr'));
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          updateTotalHint(); return;
        }
        if(field==='ajustePerc'){
          it.ajustePerc=el.value===''?'':parseFloat(el.value);
          it.ajusteValR='';
          it.ajusteModo='percentual'; it.ajusteQtd=it.ajustePerc;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajustePerc!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='ajusteValR'){
          it.ajusteValR=el.value===''?'':parseFloat(el.value);
          it.ajustePerc='';
          it.ajusteModo='valor'; it.ajusteQtd=it.ajusteValR;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajusteValR!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='observacaoItem'){ it.observacaoItem=el.value; return; }
        it[field]=el.value; updateTotalHint();
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click',()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }

  // Seleciona produto pelo autocomplete
  function selecionarProduto(idx, produto){
    const it=holder.itens[idx];
    it.produtoEstoqueId=produto.id; it.produto=produto.nome; it.avulso=false;
    it.precoOriginal=produto.precoVenda!=null?produto.precoVenda:'';
    if(it.valorUnitario===''||it.valorUnitario==null) it.valorUnitario=it.precoOriginal||'';
    drawRows();
    // Foca no campo de valor após selecionar produto
    setTimeout(()=>{
      const row=container.querySelector('[data-idx="'+idx+'"]');
      if(row){ const v=row.querySelector('[data-itfield="valorUnitario"]'); if(v) v.focus(); }
    },50);
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    if(hint) hint.innerHTML = `Total dos itens: <b>${fmtMoeda(totalItens())}</b> · desconto ou acréscimo no total é dado em Pagamento.`;
    // Avisa o bloco de pagamento para recalcular o total
    if(typeof window.__pagRedraw==='function') window.__pagRedraw();
  }
  draw();
  return { totalItens, refreshEstoque: drawRows };
}

    const proximo = (r && r.ok) ? r.proximo : ((config.viaSequences[loja] || 0) + 1);
    config.viaSequences[loja] = proximo;
    viaInp.value = `${abrev}-${proximo}`;
  })();

  // ── Fora do padrão: pedido de permissão à Oficina ─────────────────────────────
  let foraPadrao = false, tenhoCodigo = false, solicitacaoAtual = null, pollSol = null, motivoForaPadrao = '';
  const btnLancar = document.getElementById('btnSalvarOrdem'), btnSolic = document.getElementById('btnSolicitarPerm'), btnTenho = document.getElementById('btnTenhoCodigo'), solBox = document.getElementById('solicitacaoBox');
  function atualizarBotoesPermissao(){
    const liberado = !!(solicitacaoAtual && solicitacaoAtual.status==='liberado');
    const mostrarLancar = !foraPadrao || tenhoCodigo || liberado;
    btnLancar.style.display = mostrarLancar ? '' : 'none';
    const pendente = !!(solicitacaoAtual && solicitacaoAtual.status==='pendente');
    btnSolic.style.display = (!mostrarLancar && !pendente) ? '' : 'none';
    btnTenho.style.display = (foraPadrao && !mostrarLancar) ? '' : 'none';
    codeArea.style.display = (foraPadrao && (tenhoCodigo || liberado)) ? 'block' : 'none';
    if(!foraPadrao || !solicitacaoAtual){ solBox.innerHTML = ''; return; }
    if(pendente) solBox.innerHTML = `<div class="slot-banner slot-bad" style="margin-top:10px;"><span class="dot"></span><div><b>Aguardando a Oficina liberar.</b> Os dados da via já foram enviados (${escapeHtml(solicitacaoAtual.via.numeroVia||'')}). Esta tela libera sozinha quando a Oficina aprovar. <button type="button" class="btn btn-sm" id="btnCancelarSol" style="margin-left:8px;">Cancelar solicitação</button></div></div>`;
    else if(liberado) solBox.innerHTML = `<div class="slot-banner slot-ok" style="margin-top:10px;"><span class="dot"></span><div><b>Liberado por ${escapeHtml(solicitacaoAtual.liberadoPor||'Oficina')}.</b> O código já foi preenchido — pode lançar o pedido.</div></div>`;
    const bc = document.getElementById('btnCancelarSol');
    if(bc) bc.onclick = async ()=>{ await autorizacoesMut(l=>{ const r=l.find(x=>x.id===solicitacaoAtual.id); if(r && r.status==='pendente') r.status='cancelado'; }); solicitacaoAtual=null; if(pollSol){clearInterval(pollSol);pollSol=null;} atualizarBotoesPermissao(); showToast('Solicitação cancelada.'); };
  }
  function iniciarPollSolicitacao(){
    if(pollSol) clearInterval(pollSol);
    pollSol = setInterval(async ()=>{
      if(!document.getElementById('btnSolicitarPerm')){ clearInterval(pollSol); pollSol=null; return; }   // saiu da tela
      if(!solicitacaoAtual) return;
      const l = await autorizacoesGet(); const r = l.find(x=>x.id===solicitacaoAtual.id);
      if(!r) return;
      if(r.status!==solicitacaoAtual.status){
        solicitacaoAtual = r;
        if(r.status==='liberado'){
          codes = await storageGet('codes', true) || codes;
          document.getElementById('f_codigo').value = r.codigo||''; clearInterval(pollSol); pollSol=null; showToast('A Oficina liberou o pedido.');
        } else if(r.status==='recusado'){ showToast('A Oficina recusou a solicitação' + (r.motivoRecusa?': '+r.motivoRecusa:'.')); solicitacaoAtual=null; clearInterval(pollSol); pollSol=null; }
        atualizarBotoesPermissao();
      }
    }, 6000);
  }
  btnTenho.addEventListener('click', ()=>{ tenhoCodigo = true; atualizarBotoesPermissao(); const f=document.getElementById('f_codigo'); if(f) f.focus(); });
  btnSolic.addEventListener('click', async ()=>{
    const cli = collectClienteFields(); const sid = servicoSel.value, dt = dataInp.value;
    const itens = itensOsParaSalvar(tempItensHolder);
    const faltam = [];
    if(!cli.cliente) faltam.push('cliente'); if(!cli.telefone) faltam.push('telefone'); if(!itens.length) faltam.push('itens do pedido'); if(!sid) faltam.push('tipo de serviço'); if(!dt) faltam.push('data');
    if(faltam.length){ showToast('Preencha os dados da via antes de solicitar: ' + faltam.join(', ') + '.'); return; }
    const st = config.serviceTypes.find(s=>s.id===sid);
    const req = { id: uid('aut'), criadoEm: Date.now(), lojaId: lojaSel.value, solicitante: currentUser.nome, solicitanteId: currentUser.id||null, status:'pendente', motivo: motivoForaPadrao,
      via: { numeroVia: viaInp.value.trim(), cliente: cli.cliente, telefone: cli.telefone, vendedora: (document.getElementById('f_vendedora').value||'').trim(), serviceTypeId: sid, servico: st?st.nome:'', dataPedida: dt,
             descricao: (document.getElementById('f_descricao').value||'').trim(), itens: itens.map((it,i)=>({ nome: nomeItemOs(it,i), quantidade: it.quantidade||1 })), valorTotal: tempPagHolder.valorTotal||0, observacoes: tempObsHolder.observacoes||'' },
      completa: { cliente: cli, itens: itens, descricao: (document.getElementById('f_descricao').value||'').trim(),
        pagamento: { pagamentos: tempPagHolder.pagamentos||[], valorTotal: tempPagHolder.valorTotal||0, momentoPagamento: tempPagHolder.momentoPagamento||'', emissaoNota: tempPagHolder.emissaoNota||'', numeroNota: tempPagHolder.numeroNota||'', lojaSaidaId: tempPagHolder.lojaSaidaId||'', lojaPagamentoId: tempPagHolder.lojaPagamentoId||'' },
        fotos: (tempFotoHolder.fotos||[]).map(f=>({ id:f.id, nome:f.nome, driveUrl:f.driveUrl||'' })),
        observacoes: tempObsHolder.observacoes||[], infoInterna: (document.getElementById('f_infoInterna')?.value||'').trim() } };
    btnSolic.disabled = true;
    const ok = await autorizacoesMut(l=>{ l.unshift(req); });
    btnSolic.disabled = false;
    if(!ok){ showToast('Não consegui enviar a solicitação. Tente de novo.'); return; }
    solicitacaoAtual = req; atualizarBotoesPermissao(); iniciarPollSolicitacao();
    showToast('Solicitação enviada para a Oficina.');
  });

  function updateBanner(){
    const sid = servicoSel.value;
    const dt = dataInp.value;
    banner.innerHTML = '';
    foraPadrao = false; motivoForaPadrao = '';
    if(!sid || !dt){ atualizarBotoesPermissao(); return; }
    const res = checkSlot(sid, dt, null);
    if(!res){ atualizarBotoesPermissao(); return; }
    if(res.ok){
      banner.innerHTML = `<div class="slot-banner slot-ok"><span class="dot"></span><div><b>Tem vaga.</b> ${res.ocupadas} de ${res.vagas} vagas ocupadas em ${fmtDate(dt)}, dentro do prazo mínimo.</div></div>`;
    } else {
      const motivos = [];
      if(!res.prazoOk) motivos.push('a data está abaixo do prazo mínimo de confecção (' + res.st.prazoMinimoDias + ' dia(s))');
      if(!res.quantidadeOk) motivos.push('a quantidade máxima do dia já foi atingida (' + res.ocupadas + '/' + res.vagas + ')');
      motivoForaPadrao = motivos.join(' e ');
      foraPadrao = true;
      banner.innerHTML = `<div class="slot-banner slot-bad" style="background:var(--danger);border-color:var(--danger);color:#fff;"><span class="dot" style="background:#fff;"></span><div><b>Fora do padrão:</b> ${motivoForaPadrao}.<br>Preencha os dados da via e clique em <b>Solicitar permissão</b> — a Oficina libera por aqui. Se você já tem o código, clique em <b>Tenho o código</b>.</div></div>`;
      // Busca os códigos mais atuais (podem ter sido gerados agora mesmo em outro
      // dispositivo/sessão) pra validar em tempo real o que a vendedora digitar.
      storageGet('codes', true).then(c=>{ if(c) codes = c; });
    }
    atualizarBotoesPermissao();
  }
  // Ao escolher o tipo de ordem, sugere automaticamente a primeira data com vaga
  // livre (respeitando prazo mínimo e quantidade máxima cadastrados em Tipos de
  // Ordem). A vendedora pode trocar a data manualmente depois se precisar.
  function aoTrocarServico(){
    const sid = servicoSel.value;
    if(sid && !dataInp.value){
      try{
        const sugerida = proximaDataDisponivel(sid, null);
        if(sugerida) dataInp.value = sugerida;
      }catch(e){
        console.error('Falha ao calcular data automática, usando prazo mínimo simples:', e);
        // Fallback: pelo menos aplica o prazo mínimo do tipo, sem checar a agenda,
        // pra nunca deixar o campo vazio por causa de um erro inesperado.
        try{
          const st = config.serviceTypes.find(s=>s.id===sid);
          if(st){
            const d = new Date(todayStr()+'T00:00:00');
            d.setDate(d.getDate()+(Number(st.prazoMinimoDias)||0));
            dataInp.value = d.toISOString().slice(0,10);
          }
        }catch(e2){ console.error('Fallback de data também falhou:', e2); }
      }
    }
    updateBanner();
  }
  servicoSel.addEventListener('change', aoTrocarServico);
  dataInp.addEventListener('change', updateBanner);
  wireCodigoHint('f_codigo','f_codigoHint');
  // Roda uma vez já na montagem: cobre o caso raro do navegador restaurar
  // um valor no <select> sem disparar 'change' (acontece ao recriar o
  // formulário via innerHTML logo após um "Limpar", por exemplo).
  aoTrocarServico();

  document.getElementById('btnLimparOrdem').addEventListener('click', ()=>{ novaOrdemPrefill = null; renderView(); });

  document.getElementById('btnSalvarRascunho').addEventListener('click', async ()=>{

      vendedora: document.getElementById('f_vendedora').value.trim(),

      lojaPagamentoId: tempPagHolder.lojaPagamentoId || '',

      localAtual: 'loja',

  document.getElementById('btnSalvarOrdem').addEventListener('click', async ()=>{
    const cli = collectClienteFields();
    const { cliente, telefone } = cli;
    const via = viaInp.value.trim();
    const numeroNota = tempPagHolder.numeroNota || '';
    const vendedora = document.getElementById('f_vendedora').value.trim();
    const descricao = maiusc(document.getElementById('f_descricao').value);
    const loja = lojaSel.value;
    const sid = servicoSel.value;
    const dt = dataInp.value;

    // ── Highlight visual dos campos faltando ──────────────────────
    const camposFaltando = [
      { vazio: !cliente,   ids: ['f_clienteAcWrap'],               label: null },
      { vazio: !telefone,  ids: ['f_clienteAcWrap'],               label: null },
      { vazio: !vendedora, ids: ['f_vendedora'],                   label: 'vendedora' },
      { vazio: !loja,      ids: [],                                label: null }, // loja vem do shell
      { vazio: !sid,       ids: ['f_servico'],                     label: 'tipo de serviço' },
      { vazio: !dt,        ids: ['f_data'],                        label: 'data' },
    ];
    // Limpar highlights anteriores
    document.querySelectorAll('.campo-faltando').forEach(el=>el.classList.remove('campo-faltando'));
    document.querySelectorAll('.campo-faltando-label').forEach(el=>el.classList.remove('campo-faltando-label'));
    const faltando = [];
    camposFaltando.forEach(({ vazio, ids, label })=>{
      if(!vazio) return;
      if(label) faltando.push(label);
      ids.forEach(id=>{
        const el = document.getElementById(id);
        if(!el) return;
        el.classList.add('campo-faltando');
        // Marcar o label anterior também
        const fieldDiv = el.closest('.field');
        if(fieldDiv){ const lbl = fieldDiv.querySelector('label'); if(lbl) lbl.classList.add('campo-faltando-label'); }
        el.scrollIntoView({ behavior:'smooth', block:'center' });
      });
    });
    if(!cliente || !telefone){
      faltando.unshift('cliente');
      const wrap = document.getElementById('f_clienteAcWrap');
      if(wrap){ wrap.scrollIntoView({ behavior:'smooth', block:'center' }); }
    }
    if(!loja) faltando.unshift('loja (escolha no topo do app)');
    if(faltando.length > 0){
      showToast('Falta preencher: ' + faltando.join(', ') + '.');
      return;
    }
    // Catálogo obrigatório: cada item ligado a um produto ou marcado como avulso
    if(!validarCatalogoItensOs(tempItensHolder, itensApiNova)) return;
    const itensNova = itensOsParaSalvar(tempItensHolder);
    const planoNova = planoConsumoDaOrdem({ itens: itensNova, lojaId: loja, lojaSaidaId: tempPagHolder.lojaSaidaId || '' });
    if(!(await confirmarDisponibilidadeOrdem(planoNova, null))) return;
    // Garantir que a via foi gerada (pode estar vazia se a loja foi trocada)
    if(!via){
      const abrev = lojaAbreviacao(loja);
      const r = await gatewayCall({ op:'bumpViaSequence', params:{ loja } });
      const proximo = (r && r.ok) ? r.proximo : ((config.viaSequences||{})[loja]||0)+1;
      if(config.viaSequences) config.viaSequences[loja] = proximo;
      viaInp.value = `${abrev}-${proximo}`;
    }
    if(!tempPagHolder.momentoPagamento){ showToast('Em Pagamento, escolha quando o cliente paga: "Pago agora" ou "Paga na retirada".'); return; }
    if(!tempPagHolder.emissaoNota){ showToast('Em Pagamento, responda se a nota fiscal já foi emitida (Sim ou Não).'); return; }
    if(pixSemPessoa(tempPagHolder.pagamentos)){ showToast('No pagamento em Pix, escolha PF ou PJ.'); return; }
    const erroNota = notaEmpresasErro(tempPagHolder);
    if(erroNota){
      showToast(erroNota);
      return;
    }
    const res = checkSlot(sid, dt, null);
    let encaixe = false;
    let autorizadoPor = null;
    let codeObjParaUsar = null;

    if(!res.ok){
      const codigoDigitado = document.getElementById('f_codigo').value.trim().toUpperCase();
      if(!codigoDigitado){
        showToast('Digite o código de autorização para lançar o encaixe.');
        return;
      }
      // Recarrega os códigos direto do banco: quem gerou o código pode estar em outro
      // dispositivo/sessão, então a lista em memória aqui pode estar desatualizada.
      codes = await storageGet('codes', true) || [];
      const codeObj = codes.find(c=>c.codigo === codigoDigitado && !c.usado);
      if(!codeObj){
        showToast('Código inválido ou já utilizado.');
        return;
      }
      // Código liberado por solicitação é INDIVIDUAL: vale só para a via que o pediu (não serve para outro pedido)
      if(codeObj.solicitacaoId && !(solicitacaoAtual && solicitacaoAtual.id===codeObj.solicitacaoId) && codeObj.viaNumero!==via){
        showToast('Este código foi liberado para outra via (' + (codeObj.viaNumero||'—') + '). Solicite a permissão para este pedido.');
        return;
      }
      // O código só é "queimado" quando o pedido for realmente salvo (mais abaixo): se algum aviso
      // interromper o lançamento (cliente fora do cadastro, crédito insuficiente…), o código continua valendo.
      codeObjParaUsar = codeObj;
      encaixe = true;
      autorizadoPor = codeObj.autorizadoPor;
    }

    const st = config.serviceTypes.find(s=>s.id===sid);
    // ===== Crédito do cliente / Fiado =====
    // Calculados antes de montar a ordem pra já guardar dentro dela o id do débito de\n    // fiado (fiadoDebitoId) e o crédito usado (creditoUsado) — permite reverter com\n    // precisão em caso de cancelamento.
    const pagsCreditoOS = (tempPagHolder.pagamentos||[]).filter(p=>p.formaId==='__credito');
    const pagsFiadoOS = (tempPagHolder.pagamentos||[]).filter(p=>p.formaId==='__fiado');
    const totalCredOS = pagsCreditoOS.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const totalFiaOS = pagsFiadoOS.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const novoFiadoDebitoIdOS = totalFiaOS>0 ? ('fd_'+Math.random().toString(36).slice(2)+Date.now().toString(36)) : null;
    const novaOrdem = {
      id: uid('ord'),
      ...cli,
      via, numeroNota, vendedora, vendedoraId: vendedoraIdPorNome(vendedora), descricao, lojaId: loja,
      serviceTypeId: sid,
      serviceTypeName: st ? st.nome : '',
      data: dt,
      status: STATUS.AGUARDANDO,
      encaixe, autorizadoPor,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: carimbarPagamentosOS(tempPagHolder.pagamentos),
      momentoPagamento: tempPagHolder.momentoPagamento,
      emissaoNota: tempPagHolder.emissaoNota,
      lojaSaidaId: tempPagHolder.lojaSaidaId || '',
      lojaPagamentoId: tempPagHolder.lojaPagamentoId || '',
      lojaNotaId: tempPagHolder.lojaNotaId || '',
      localAtual: 'loja',
      historicoLocal: [{ local:'loja', em: Date.now(), por: currentUser.nome }],
      observacoes: tempObsHolder.observacoes,
      fotos: tempFotoHolder.fotos,
      infoInterna: (document.getElementById('f_infoInterna')?.value||'').trim(),
      creditoUsado: totalCredOS,
      fiadoDebitoId: novoFiadoDebitoIdOS,
      itens: itensNova,
      criadoEm: Date.now()
    };
    if(planoNova.itens.length) novaOrdem.reservaLojaId = planoNova.lojaId;
    if(orcamentoOrigem){ novaOrdem.orcamentoOrigemId = orcamentoOrigem.id; novaOrdem.orcamentoId = orcamentoOrigem.id; }
    // Código de barras da via, gerado só agora que a O.S. realmente vai ser lançada
    // (rascunho não gera código — só quando vira uma O.S. de verdade).
    novaOrdem.codigoVia = await bumpCodigoVia('pedido', novaOrdem.lojaId||'');
    // Forma "Sem custo": zera o valorTotal e pula validações de Fiado/Crédito
    const temSemCustoNova = (tempPagHolder.pagamentos||[]).some(p=>p.formaId==='__sem_custo');
    if(temSemCustoNova){ novaOrdem.valorTotal = 0; }
    if(!temSemCustoNova && (pagsCreditoOS.length>0 || pagsFiadoOS.length>0)){
      const telD = onlyDigits(novaOrdem.telefone||'');
      // Clientes não ficam em memória (22k+) — busca pelo telefone ou nome
      let cliCad = clientes.find(c=> telD && onlyDigits(c.telefone||'')===telD);
      if(!cliCad && telD) cliCad = await buscarClientePorTelefoneOuCpf(novaOrdem.telefone, '');
      if(!cliCad && novaOrdem.cliente){
        try{
          const r = await gatewayCall({ op:'searchClients', params:{ termo: novaOrdem.cliente.trim() } });
          const nomeL = novaOrdem.cliente.trim().toLowerCase();
          cliCad = ((r&&r.data)||[]).find(c=>(c.nome||'').trim().toLowerCase()===nomeL)||null;
        }catch(e){ cliCad = null; }
      }
      if(!cliCad){
        showToast('Pra usar Crédito ou Fiado, o cliente precisa estar no cadastro (selecione pela busca).');
        return;
      }
      if(totalCredOS>0 && (Number(cliCad.credito)||0) < totalCredOS - 0.001){
        showToast(`Crédito insuficiente: o cliente tem ${fmtMoeda(Number(cliCad.credito)||0)}.`);
        return;
      }
      if(totalCredOS>0){
        cliCad.credito = (Number(cliCad.credito)||0) - totalCredOS;
        if(!cliCad.creditoMovimentos) cliCad.creditoMovimentos = [];
        cliCad.creditoMovimentos.push({ data: dt, valor: -totalCredOS, tipo:'uso', obs:`O.S. ${via}` });
      }
      if(totalFiaOS>0){
        if(!cliCad.fiadoDebitos) cliCad.fiadoDebitos = [];
        cliCad.fiadoDebitos.push({ id:novoFiadoDebitoIdOS, origem:'O.S.', numero:via, data:dt, valor:totalFiaOS, valorPago:0, loja:loja||'' });
      }
      await salvarUmCliente(cliCad);
    }
    if(codeObjParaUsar){
      // relê para não sobrescrever códigos gerados enquanto a tela estava aberta
      const atuais = await storageGet('codes', true) || codes;
      const alvo = atuais.find(c=>c.codigo===codeObjParaUsar.codigo);
      if(alvo){ alvo.usado = true; alvo.usadoEm = Date.now(); alvo.usadoPor = currentUser.nome; }
      codes = atuais; await saveCodes();
    }
    orders.unshift(novaOrdem);
    await saveOrders();
    await upsertClienteFromOrder(cli);
    showToast(encaixe ? 'Pedido lançado como encaixe autorizado.' : 'Pedido lançado.');
    await sincronizarReservasOrdem(novaOrdem, planoNova);
    if(orcamentoOrigem) await marcarOrcamentoConvertido(orcamentoOrigem, novaOrdem);
    novaOrdemPrefill = null;
    currentTab = 'painel';
    modoNovaOrdem = false;
    renderTabs(); renderView();
    renderAlerts();
    openNotifyModal(novaOrdem);
  });
}

/* ============================================================
   EDITAR ORDEM (modal)
   ============================================================ */
async function openEditModal(orderId, somenteLeitura){
  // Recarrega SÓ essa ordem direto do banco (uma linha, não a lista inteira): o
  // cliente pode ter confirmado uma leitura (ou o status pode ter mudado em outra
  // aba/sessão) depois que esta página carregou.
  try{
    const r = await gatewayCall({ op:'selectOne', table:'ordens_servico', params:{ column:'id', value: orderId } });
    if(r && r.data && r.data.payload){
      const idx = orders.findIndex(o=>o.id===orderId);
      if(idx>=0) orders[idx] = r.data.payload; else orders.push(r.data.payload);
    }
  }catch(e){ console.error('Não foi possível atualizar a ordem antes de abrir:', e); }
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  if(currentUser.nivel==='oficina'){
    openEditModalOficina(order);
  } else {
    openEditModalCompleto(order, { somenteLeitura: !!somenteLeitura });
  }
}

/**
 * Rastreamento simples de onde a peça está fisicamente: na loja ou enviada para a fábrica
 * (fabricação/laser/conserto externo). Qualquer nível com acesso à ordem pode alternar
 * (inclusive a oficina, que normalmente só vê observações — essa é a exceção proposital,
 * já que é quem mais lida com o envio/retorno da fábrica no dia a dia).
 * A troca já salva na hora (não depende do botão "Salvar alterações" do resto do formulário).
 */
function mountLocalizacao(container, order, somenteLeitura){
  function draw(){
    const naFabrica = order.localAtual === 'fabrica';
    const hist = (order.historicoLocal||[]).slice(-5).reverse();
    container.innerHTML = `
      <div class="section-label">Onde está a peça</div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="badge ${naFabrica?'st-enviado_fabrica':'badge-ok'}">
          ${naFabrica ? ico('ferramenta',13)+' Na fábrica' : ico('loja',13)+' Na loja'}
        </span>
        ${somenteLeitura ? '' : `<button type="button" class="btn btn-ghost btn-sm" id="btnToggleLocal">${naFabrica ? 'Registrar retorno para a loja' : 'Enviar para a fábrica'}</button>`}
      </div>
      ${hist.length ? `
        <div class="muted" style="margin-top:8px; font-size:12px;">
          ${hist.map(h=>`${h.local==='fabrica'?'Enviado para a fábrica':'Voltou para a loja'} — ${Fmt.data(h.em)} por ${escapeHtml(h.por||'—')}`).join('<br>')}
        </div>
      ` : ''}
    `;
    if(!somenteLeitura){
      const btn = container.querySelector('#btnToggleLocal');
      btn.addEventListener('click', async ()=>{
        order.localAtual = naFabrica ? 'loja' : 'fabrica';
        if(!order.historicoLocal) order.historicoLocal = [];
        order.historicoLocal.push({ local: order.localAtual, em: Date.now(), por: currentUser.nome });
        if(order.localAtual==='fabrica' && order.status==='aguardando') order.status = 'enviado_fabrica';
        else if(order.localAtual==='loja' && order.status==='enviado_fabrica') order.status = 'aguardando';
        await saveOrders();
        showToast(order.localAtual==='fabrica' ? 'Marcado como enviado para a fábrica.' : 'Marcado como retornado para a loja.');
        draw();
      });
    }
  }
  draw();
}

/* ── PERMISSÃO POR LOJA ──────────────────────────────────────────────────────
   Diretoria e gerente editam qualquer ordem. Demais perfis editam apenas
   ordens da loja ativa; ordens de outra loja abrem em modo somente leitura.
   ──────────────────────────────────────────────────────────────────────────── */
function ehGestaoLoja(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
function podeEditarRegistro(reg){
  if(!currentUser || !reg) return false;
  if(ehGestaoLoja()) return true;
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return false;
  return (reg.lojaId||null) === lojaAtiva;
}
function motivoSemEdicao(reg){
  if(ehGestaoLoja()) return '';
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return 'Selecione uma loja no topo para editar.';
  const l = (config.lojas||[]).find(x=>x.id===(reg&&reg.lojaId));
  return 'Esta ordem é da loja ' + (l ? l.nome : 'outra') + ' — você pode visualizar e imprimir, mas não editar.';
}
