<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos e O.S. — Gestão e Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="marketing-off.js"></script>
<script src="cliente-lojas.js"></script>
<style>
  /* =====================================================================
     CAIXA › PEDIDO / O.S. — visual no sistema "azul-petróleo refinado" (DESIGN.md).
     Cores SEMPRE por variável. As cores próprias desta tela (selos de status que
     o tema não tem: roxo e laranja) são definidas aqui uma vez, para os dois temas.
     ===================================================================== */
  :root{
    --radius:12px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --st-roxo:#6A3DB8;   --st-roxo-soft:#F1EBFA;
    --st-laranja:#A6470F; --st-laranja-soft:#FCEDE2;
    --st-neutro:var(--t-text-soft); --st-neutro-soft:var(--t-surface-2);
    --info-soft:var(--t-info-soft);
    --sombra-pop:var(--t-shadow-lg);
    --texto-sobre-cor:#fff;
  }
  html[data-theme=dark]{
    --st-roxo:#B9A0F2;   --st-roxo-soft:rgba(185,160,242,.15);
    --st-laranja:#F2A472; --st-laranja-soft:rgba(242,164,114,.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }

  /* ---------- LOGIN (só fora do app) ---------- */
  #view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
  .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px 26px;box-shadow:var(--t-shadow);position:relative;}
  .login-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .hub-back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none;margin-bottom:14px;}
  .hub-back-link:hover{color:var(--accent);text-decoration:underline;}
  .hub-back-link-dark{color:var(--t-surface);margin-bottom:0;font-size:16px;padding:2px 2px 2px 0;opacity:.8;}
  .hub-back-link-dark:hover{color:var(--t-surface);opacity:1;}
  .login-title{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:4px 0 2px;}
  .login-sub{color:var(--ink-soft);font-size:13px;margin:0 0 22px;line-height:1.5;}
  .login-error{background:var(--danger-soft);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}
  .login-hint{margin-top:18px;font-size:12px;color:var(--ink-faint);line-height:1.5;border-top:1px solid var(--line);padding-top:14px;}

  /* ---------- CAMPOS ---------- */
  .field{margin-bottom:14px;min-width:0;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea,textarea.plain-input{
    width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;color:var(--ink);background:var(--surface);outline:none;min-height:40px;
  }
  .field textarea,textarea.plain-input{resize:vertical;min-height:96px;line-height:1.5;}
  html[data-ds] .field input[readonly]{background-color:var(--surface-2) !important;color:var(--ink-soft);}
  .field .cli-ac-input{padding-left:38px;height:44px;}
  .campo-faltando{border-color:var(--danger) !important;box-shadow:0 0 0 3px var(--danger-soft) !important;}
  .campo-faltando-label{color:var(--danger) !important;font-weight:700;}
  .valor-fixo{padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;min-height:40px;display:flex;align-items:center;gap:8px;}

  /* ---------- BOTÕES (a aparência vem do tema; aqui só tamanho e ícone) ---------- */
  .btn{border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;min-height:40px;white-space:nowrap;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:13px;min-height:32px;gap:6px;}
  .btn .ico{flex-shrink:0;}
  .btn-mail{background:var(--surface);color:var(--ink);border-color:var(--line);}
  .btn-texto{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .btn-texto:hover{text-decoration:underline;}
  .btn-icone.wa{color:var(--ok);}
  .btn-icone.wa:hover{background:var(--ok-soft);color:var(--ok);border-color:transparent;}
  .icon-btn{background:transparent;border:1px solid transparent;border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);padding:0;flex-shrink:0;}
  .icon-btn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink);}
  .icon-btn.perigo:hover{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
  .icon-btn-wa{color:var(--ok);}
  .icon-btn-wa:hover{background:var(--ok-soft);color:var(--ok);}
  .icon-btn-sair{color:var(--danger);}
  .copy-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;margin-left:8px;display:inline-flex;align-items:center;gap:6px;vertical-align:middle;}
  .copy-btn:hover{background:var(--surface-2);color:var(--ink);}

  /* ---------- SHELL PRÓPRIO (só quando aberto fora do app) ---------- */
  #view-app{display:none;min-height:100vh;}
  header.topbar{background:var(--t-dark);color:var(--t-surface);padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;position:sticky;top:0;z-index:40;}
  html[data-theme=dark] header.topbar{color:var(--ink);}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:12px;color:var(--t-surface);}
  .brand-name{font-weight:700;font-size:15px;white-space:nowrap;}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{background:transparent;border:none;color:inherit;opacity:.7;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:8px;white-space:nowrap;flex-shrink:0;}
  nav.tabs button:hover{opacity:1;}
  nav.tabs button.active{opacity:1;background:var(--t-hover);box-shadow:inset 0 -2px 0 var(--accent);}
  .who{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-shrink:0;}
  .who b{font-weight:650;}
  .level-pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--t-hover);white-space:nowrap;}
  .who .icon-btn{color:inherit;}
  .mobile-tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--t-dark);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;}
  .mobile-tabbar button{background:transparent;border:none;color:var(--t-surface);opacity:.7;font-size:11px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:8px;flex:1;min-width:0;}
  .mobile-tabbar button.active{opacity:1;background:rgba(255,255,255,.12);}
  .mobile-tabbar button .mt-icon{line-height:1;}
  html.embedded #view-login{display:none !important;}
  html.embedded .topbar{display:none !important;}
  html.embedded .mobile-tabbar{display:none !important;}

  /* ---------- PÁGINA ---------- */
  main{max-width:1240px;margin:0 auto;padding:24px 24px 64px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .page-title{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px;}
  .page-sub{font-size:13.5px;color:var(--ink-faint);margin:0;max-width:720px;line-height:1.5;}
  .voltar-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none;}
  .voltar-link:hover{color:var(--accent);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--t-shadow-sm);}
  .card + .card{margin-top:16px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 16px;}
  .muted{color:var(--ink-faint);font-size:12.5px;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:14px;line-height:1.6;}
  .empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:2px;}
  .empty .ico{color:var(--ink-faint);margin-bottom:8px;}
  .section-label{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .section-label .muted{font-weight:500;font-size:12.5px;}
  .divider-nova{height:1px;background:var(--line);margin:24px 0;}
  .ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--t-shadow-sm);}
  .barra-acoes{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;
    margin:24px -24px -24px;padding:14px 24px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px;}
  .barra-acoes .espaco{flex:1;}

  /* ---------- SELOS (status e marcas) ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;line-height:1.4;white-space:nowrap;background:var(--surface-2);color:var(--ink-soft);}
  .badge .ico{width:13px;height:13px;}
  .badge-encaixe{background:var(--accent-soft);color:var(--accent);}
  .badge-loja{background:var(--surface-2);color:var(--ink-soft);font-weight:700;letter-spacing:.02em;}
  .badge-flag{background:var(--danger-soft);color:var(--danger);}
  .badge-aviso{background:var(--wait-soft);color:var(--wait);}
  .badge-ok{background:var(--ok-soft);color:var(--ok);}
  .rascunho-badge{background:transparent;color:var(--ink-soft);border:1px dashed var(--line-strong);}
  .selo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;line-height:1.3;}
  .selo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .st-aguardando{background:var(--wait-soft);color:var(--wait);}
  .st-enviado_fabrica{background:var(--st-roxo-soft);color:var(--st-roxo);}
  .st-pendencia{background:var(--st-laranja-soft);color:var(--st-laranja);}
  .st-oficina_pronto{background:var(--info-soft);color:var(--info);}
  .st-pronto{background:var(--ok-soft);color:var(--ok);}
  .st-entregue{background:var(--st-neutro-soft);color:var(--st-neutro);}
  .st-cancelado{background:var(--danger-soft);color:var(--danger);}
  .st-rascunho{background:transparent;color:var(--ink-soft);border:1px dashed var(--line-strong);}
  /* select de status com cara de selo (o tema dá estilo de campo a todo select: aqui precisa de mais peso) */
  /* o tema dá estilo de campo a todo select com seletor muito forte (:is com vários :not) — aqui é preciso !important */
  html[data-ds] select.status-select{
    border:1px solid transparent !important;border-radius:999px !important;font-size:12px;font-weight:700;min-height:30px;height:30px;
    padding:0 26px 0 12px !important;appearance:none;-webkit-appearance:none;cursor:pointer;box-shadow:none;max-width:100%;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%) !important;
    background-position:calc(100% - 14px) 52%,calc(100% - 10px) 52% !important;background-size:4px 4px,4px 4px !important;background-repeat:no-repeat !important;
  }
  html[data-ds] select.status-select:hover{border-color:currentColor !important;}
  html[data-ds] select.status-select:focus{box-shadow:var(--t-ring);border-color:currentColor !important;}
  html[data-ds] select.status-select option{background:var(--surface);color:var(--ink);}
  html[data-ds] select.status-aguardando{background-color:var(--wait-soft) !important;color:var(--wait) !important;}
  html[data-ds] select.status-enviado_fabrica{background-color:var(--st-roxo-soft) !important;color:var(--st-roxo) !important;}
  html[data-ds] select.status-pendencia{background-color:var(--st-laranja-soft) !important;color:var(--st-laranja) !important;}
  html[data-ds] select.status-oficina_pronto{background-color:var(--info-soft) !important;color:var(--info) !important;}
  html[data-ds] select.status-pronto{background-color:var(--ok-soft) !important;color:var(--ok) !important;}
  html[data-ds] select.status-cancelado{background-color:var(--danger-soft) !important;color:var(--danger) !important;}
  html[data-ds] select.status-entregue{background-color:var(--st-neutro-soft) !important;color:var(--st-neutro) !important;}

  /* ---------- LISTA DE PEDIDOS ---------- */
  .filtros-os{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow-sm);}
  .filtros-os select,.filtros-os input[type=date],.filtros-os input[type=text]{height:38px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--ink);min-width:0;}
  .filtros-os .busca{position:relative;flex:1 1 260px;min-width:200px;}
  .filtros-os .busca .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
  .filtros-os .busca input{width:100%;padding-left:34px;}
  .filtros-os .btn-filtros{display:none;}
  .filtros-os .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);padding:0 4px;cursor:pointer;white-space:nowrap;}
  .filtros-os select:disabled{opacity:.75;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .resumo-os{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 2px 12px;font-size:13px;color:var(--ink-faint);}
  .resumo-os b{color:var(--ink);font-weight:700;}
  .resumo-os .ok b{color:var(--ok);}
  .resumo-os .perigo b{color:var(--danger);}
  .resumo-os .sep{width:1px;height:14px;background:var(--line-strong);}
  .tabela-card{padding:0;overflow:hidden;}
  .tabela-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:12px 12px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;}
  tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  th.num,td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tabela-os .via{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--ink);white-space:nowrap;}
  .tabela-os .cli-nome{font-weight:700;color:var(--ink);font-size:13.5px;line-height:1.35;}
  .tabela-os .sub{color:var(--ink-faint);font-size:12.5px;margin-top:2px;line-height:1.4;}
  .tabela-os .marcas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .tabela-os .valor-receber{color:var(--danger);font-weight:700;}
  .tabela-os .valor-ok{color:var(--ok);}
  .tabela-os .data-atraso{color:var(--danger);font-weight:600;font-size:12px;display:block;margin-top:2px;}
  .tabela-os td.acoes{white-space:nowrap;text-align:right;width:1%;}
  .acoes-linha{display:inline-flex;gap:2px;align-items:center;}
  .sigla-loja{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--ink-soft);background:var(--surface-2);padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;}
  .sigla-loja::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--loja-cor,var(--accent));}
  /* menu "Mais" das ações da linha */
  .menu-mais{position:relative;display:inline-block;}
  .menu-mais-lista{display:none;position:fixed;z-index:120;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);padding:6px;}
  .menu-mais.aberto .menu-mais-lista{display:block;}
  .menu-mais-lista button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;border-radius:6px;padding:9px 10px;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left;}
  .menu-mais-lista button:hover{background:var(--surface-2);}
  .menu-mais-lista button.perigo{color:var(--danger);}
  .menu-mais-lista button.perigo:hover{background:var(--danger-soft);}
  .menu-mais-lista hr{border:none;border-top:1px solid var(--line);margin:4px 0;}
  /* cartão "Prontos para retirada" */
  html[data-ds] .prontos-card{border-color:var(--ok);background:var(--ok-soft);margin-bottom:16px;padding:14px 16px;box-shadow:none;}
  .prontos-lista{max-height:232px;overflow-y:auto;}
  .prontos-titulo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ok);font-size:14.5px;margin-bottom:10px;}
  .prontos-lista{display:flex;flex-direction:column;gap:6px;}
  .pronto-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px;flex-wrap:nowrap;font-size:13px;}
  .pronto-item > div:first-child{min-width:0;flex:1;line-height:1.45;}
  .pronto-item > div:last-child{flex-shrink:0;}

  /* ---------- AVISOS / FAIXAS ---------- */
  .slot-banner{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:12px 0 4px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent;}
  .slot-ok{background:var(--ok-soft);color:var(--ink);border-color:var(--ok-soft);}
  .slot-bad{background:var(--wait-soft);color:var(--ink);border-color:var(--wait-soft);}
  .slot-banner .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .slot-ok .dot{background:var(--ok);}
  .slot-bad .dot{background:var(--wait);}
  .locked-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:16px;}
  .locked-note .ico{color:var(--accent);margin-top:2px;}
  .aviso-linha{margin-top:6px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.45;}
  .aviso-linha .ico{margin-top:2px;flex-shrink:0;}
  .aviso-linha.falta{background:var(--wait-soft);color:var(--wait);}
  .aviso-linha.excede{background:var(--danger-soft);color:var(--danger);}
  .aviso-linha.completo{background:var(--ok-soft);color:var(--ok);}
  .aviso-linha .fraco{font-weight:500;color:var(--ink-soft);}
  #alertBar{width:100%;}
  .alert-bar{background:var(--danger-soft);border-bottom:1px solid var(--danger);padding:14px 24px;}
  .alert-inner{max-width:1240px;margin:0 auto;}
  .alert-title{font-weight:700;color:var(--danger);font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .alert-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;flex-wrap:wrap;}

  /* ---------- POPUPS ---------- */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:150;padding:20px;overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;margin:auto;}
  .modal:has(#itensContainerEdit,#obsContainerEdit,#resultados_cliente,#orcAbertosLista){max-width:860px;}
  .modal h3{margin:0 40px 6px 0;font-size:18px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;}
  .modal > p{margin:0 0 16px;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;align-items:center;}
  .modal > .modal-actions:last-child{position:sticky;bottom:-24px;margin:20px -24px -24px;padding:14px 24px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 16px 16px;z-index:4;}
  .modal-actions .espaco{flex:1;}
  .modal-secao{border-top:1px solid var(--line);margin-top:20px;padding-top:18px;}
  .resumo-ordem{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--ink-soft);margin:-6px 0 14px;}
  .modal-acoes-topo{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .photo-lightbox-overlay{position:fixed;inset:0;background:rgba(8,20,30,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .photo-lightbox-overlay.show{display:flex;}
  .photo-lightbox-box{max-width:640px;width:100%;text-align:center;}
  .photo-lightbox-box img{width:100%;border-radius:12px;display:block;}
  .photo-lightbox-close{margin-top:12px;}
  .itens-leitura{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .itens-leitura .linha-item{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .itens-leitura .linha-item:last-child{border-bottom:none;}
  .itens-leitura .linha-item .obs{display:block;color:var(--ink-faint);font-size:12.5px;}

  /* ---------- AGENDA ---------- */
  .agenda-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .agenda-nav{display:flex;align-items:center;gap:6px;}
  .agenda-month{font-size:16px;font-weight:700;min-width:170px;text-align:center;}
  .agenda-month::first-letter{text-transform:uppercase;}
  .agenda-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cal-dow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);text-align:center;padding-bottom:4px;}
  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .15s,background-color .15s;min-width:0;}
  .cal-cell:hover{border-color:var(--accent);background:var(--accent-soft);}
  .cal-cell:focus-visible{outline:none;box-shadow:var(--t-ring);}
  .cal-cell.empty-cell{background:transparent;border:none;cursor:default;}
  .cal-cell.passado{background:var(--surface-2);}
  .cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .cal-cell.today .cal-daynum{color:var(--t-surface);background:var(--accent);border-radius:999px;align-self:flex-start;padding:0 7px;}
  .cal-chip{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;color:var(--texto-sobre-cor);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden;min-width:0;}
  .cal-chip > span:first-child{overflow:hidden;text-overflow:ellipsis;}
  .cal-chip.over{box-shadow:0 0 0 2px var(--danger);}
  .cal-more{font-size:11px;color:var(--ink-faint);font-weight:600;padding-left:2px;}
  .day-order-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .day-order-item:last-child{border-bottom:none;}
  .ocupacao-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px;margin-bottom:16px;}

  /* ---------- CÓDIGO DE AUTORIZAÇÃO ---------- */
  .code-chip{font-family:var(--mono);font-weight:700;letter-spacing:.08em;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);padding:6px 12px;border-radius:8px;display:inline-block;margin:0 4px;}
  .code-list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;flex-wrap:wrap;}
  .code-list-item .cl-code{font-family:var(--mono);font-weight:700;letter-spacing:.06em;font-size:14px;}

  /* ---------- OBSERVAÇÕES ---------- */
  .obs-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--surface);}
  .obs-item.obs-pending{border-color:var(--danger);background:var(--danger-soft);}
  .obs-form{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2);}

  /* ---------- FOTOS ---------- */
  .foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .foto-thumb{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);flex-shrink:0;}
  .foto-thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;}
  .foto-del{position:absolute;top:4px;right:4px;background:var(--surface);color:var(--danger);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--t-shadow-sm);}
  .foto-del:hover{background:var(--danger);color:var(--t-surface);}

  /* ---------- AJUDA (?) ---------- */
  .ajuda-ponto{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;cursor:help;margin-left:5px;vertical-align:middle;position:relative;flex-shrink:0;text-transform:none;letter-spacing:0;}
  .ajuda-ponto .balao{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:500;line-height:1.5;width:250px;text-align:left;z-index:999;box-shadow:var(--t-shadow-lg);}
  .ajuda-ponto:hover .balao,.ajuda-ponto.aberto .balao{display:block;}
  @media(max-width:600px){ .ajuda-ponto .balao{width:200px;} }

  /* ---------- CLIENTE (busca) ---------- */
  .cli-ac-wrap{position:relative;}
  .cli-ac-input{width:100%;height:44px;padding:0 12px 0 38px !important;border:1px solid var(--line-strong);border-radius:8px;font-size:14.5px;background:var(--surface);color:var(--ink);outline:none;}
  .cli-ac-wrap > .ico{position:absolute;left:12px;top:14px;color:var(--ink-faint);pointer-events:none;}
  .cli-ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);max-height:280px;overflow-y:auto;z-index:1200;}
  .cli-ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
  .cli-ac-item:hover,.cli-ac-item.focused{background:var(--surface-2);}
  .cli-ac-msg{padding:12px;font-size:13px;color:var(--ink-faint);}
  .cli-ac-selecionado{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ok-soft);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;}
  .cli-ac-selecionado b{color:var(--ink);flex:1;min-width:140px;}
  .cli-ac-selecionado .cli-ac-clear{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;border-radius:6px;display:inline-flex;}
  .cli-ac-selecionado .cli-ac-clear:hover{background:var(--surface);color:var(--danger);}
  .cli-ac-selecionado .cli-ac-edit{background:none;border:none;cursor:pointer;font-size:13px;color:var(--accent);padding:0;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .cli-ac-selecionado .cli-ac-edit:hover{text-decoration:underline;}
  .cli-result-card{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .cli-result-card:last-child{border-bottom:none;}
  .cli-result-card:hover,.cli-result-card.focused{background:var(--surface-2);}
  .cli-result-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cli-result-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .cli-result-nome{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cli-result-sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .cli-result-tag{font-size:12px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:4px;}

  /* ---------- ESCOLHA EM BOTÕES (rádio) ---------- */
  .toggle-group{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface);}
  .toggle-opt{flex:1;position:relative;}
  .toggle-opt input[type="radio"]{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
  .toggle-opt label{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);white-space:nowrap;text-align:center;line-height:1.3;user-select:none;background:var(--surface);min-height:36px;transition:background-color .15s,color .15s;}
  .toggle-opt label:hover{background:var(--surface-2);color:var(--ink);}
  .toggle-opt input[type="radio"]:checked + label{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .toggle-opt input[type="radio"]:focus-visible + label{box-shadow:var(--t-ring);}
  .toggle-opt:not(:last-child) label{border-right:1px solid var(--line-strong);}
  .pag-info-row{display:flex;align-items:stretch;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;}
  .pag-info-cel{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;gap:4px;}
  .pag-info-cel:not(:last-child){border-right:1px solid var(--line);}
  .pag-info-cel-label{font-size:12px;font-weight:600;color:var(--ink-faint);display:flex;align-items:center;}
  .pag-info-cel-val{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .pag-toggle-cel{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .pag-toggle-cel:not(:last-child){border-right:1px solid var(--line);}
  .pag-toggle-inner{display:flex;gap:0;border-radius:8px;overflow:hidden;}
  .pag-toggle-inner .toggle-opt{flex:0 0 auto;}
  .pag-desc-box{padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .pag-desc-box .rotulo{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .pag-desc-box .total{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .pag-final{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
  .pag-final.desc{color:var(--danger);}
  .pag-final.acr{color:var(--ok);}
  .pag-linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px;}
  .pag-linha select,.pag-linha input{height:40px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;width:100%;min-width:0;}
  .pag-valor-input{border:none !important;background:transparent !important;font-size:20px !important;font-weight:700;width:130px;padding:0 !important;outline:none;color:var(--ink);box-shadow:none !important;min-height:0 !important;}

  /* ---------- ITENS ---------- */
  .prod-ac-wrap{position:relative;}
  .prod-ac-input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);outline:none;min-width:0;}
  .prod-ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);max-height:260px;overflow-y:auto;z-index:1300;}
  .prod-ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
  .prod-ac-item:last-child{border-bottom:none;}
  .prod-ac-item:hover,.prod-ac-item.pf{background:var(--surface-2);}
  .prod-ac-item b{display:block;font-size:13.5px;}
  .prod-ac-item span{font-size:12px;color:var(--ink-faint);}
  .prod-ac-sel{display:flex;align-items:center;gap:6px;background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:0 6px 0 12px;height:40px;font-size:13.5px;min-width:0;}
  .prod-ac-sel b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .prod-ac-sel .pa-clr{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;border-radius:6px;display:inline-flex;flex-shrink:0;}
  .prod-ac-sel .pa-clr:hover{background:var(--surface);color:var(--danger);}
  .prod-ac-fator,.prod-ac-fator-inline{font-size:12px;color:var(--ok);white-space:nowrap;flex-shrink:0;}
  .item-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;background:var(--surface-2);}
  .item-row-topo{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;}
  .item-row-produto{flex:1;min-width:180px;}
  .item-row-valor{width:120px;flex-shrink:0;}
  .item-row-valor input{width:100%;height:40px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;text-align:right;}
  .item-row-desc{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
  .item-row-desc .campo-perc,.item-row-desc .campo-val,.pag-desc-box .campo-perc,.pag-desc-box .campo-val{width:76px;height:36px;padding:0 8px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);}
  .desc-sep{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .desc-total{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap;min-width:70px;}
  .btn-ajuste{padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-soft);height:36px;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s;}
  .btn-ajuste:hover{background:var(--surface-2);color:var(--ink);}
  .btn-ajuste.ativo-desc{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
  .btn-ajuste.ativo-acr{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);}
  .btn-add-item{padding:0 14px;border:1px solid var(--t-primary-strong);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--t-primary-strong);color:var(--texto-sobre-cor);height:40px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;}
  .btn-add-item:hover{filter:brightness(1.12);}
  .item-row-produto input[type=text]{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .item-row-obs{margin-top:8px;}
  .item-row-obs input{width:100%;height:38px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px;}
  .item-row-estoque{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .item-avulso-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:8px;cursor:pointer;font-weight:600;color:var(--ink-soft);}
  .venda-item-compact{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface);font-size:13.5px;}
  .venda-compact-nome{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .venda-compact-val{font-size:13.5px;font-weight:700;color:var(--ink);flex-shrink:0;font-variant-numeric:tabular-nums;}
  .venda-compact-obs{font-size:12.5px;color:var(--ink-soft);margin:-2px 0 8px;padding:6px 10px;background:var(--surface-2);border-radius:8px;display:none;}
  .venda-compact-icones{display:flex;gap:2px;flex-shrink:0;}
  .venda-compact-btn{background:none;border:1px solid transparent;cursor:pointer;width:32px;height:32px;padding:0;color:var(--ink-soft);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
  .venda-compact-btn:hover{background:var(--surface-2);color:var(--ink);}
  .venda-compact-btn.tem-obs{color:var(--accent);}
  .venda-compact-btn.perigo:hover{background:var(--danger-soft);color:var(--danger);}
  .itens-total{margin-top:8px;font-size:13px;color:var(--ink-faint);}
  .itens-total b{color:var(--ink);font-size:14px;}

  /* ---------- INFORMAÇÃO INTERNA ---------- */
  .info-interna-box{margin-top:8px;}
  .info-interna-box textarea{width:100%;padding:9px 12px;border:1px dashed var(--wait);border-radius:8px;font-size:13.5px;resize:vertical;min-height:64px;background:var(--wait-soft);color:var(--ink);font-family:inherit;}
  .info-interna-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;background:var(--wait-soft);color:var(--wait);border-radius:999px;font-size:12px;font-weight:700;margin-bottom:6px;}

  /* ---------- CELULAR ---------- */
  @media (max-width:760px){
    .grid-2,.grid-3{grid-template-columns:1fr;}
    nav.tabs{display:none;}
    header.topbar{padding:0 14px;height:54px;}
    .brand-name{display:none;}
    main{padding:16px 12px 88px;}
    html.embedded main{padding-bottom:40px;}
    .mobile-tabbar{display:flex;}
    .card,.ticket{padding:16px;}
    .barra-acoes{margin:20px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
    .barra-acoes .btn{flex:1 1 auto;}
    .barra-acoes .espaco{display:none;}
    .page-head .btn-accent{width:100%;}
    .filtros-os{padding:10px;}
    .filtros-os > *{flex:1 1 calc(50% - 8px);}
    .filtros-os .busca{flex:1 1 0;}
    .filtros-os select,.filtros-os input{height:44px;}
    /* lista vira cartões */
    html[data-ds] .tabela-card{background:transparent;border:none;box-shadow:none;overflow:visible;}
    html[data-ds] .tabela-os tbody tr > td{background:transparent !important;}
    .tabela-os td.c-servico .sub:not(:empty)::before{content:" · ";}
    .filtros-os .btn-filtros{display:inline-flex;flex:0 0 auto;}
    .filtros-os:not(.aberto) > :not(.busca):not(.btn-filtros){display:none;}
    .tabela-os thead{display:none;}
    .tabela-os,.tabela-os tbody{display:block;}
    .tabela-os tr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--t-shadow-sm);}
    .tabela-os tbody tr:hover > td{background:transparent;}
    .tabela-os td{display:block;padding:0;border:none;min-width:0;}
    .tabela-os td.c-via{grid-column:1;}
    .tabela-os td.c-status{grid-column:2;grid-row:1;justify-self:end;}
    .tabela-os td.c-cliente{grid-column:1 / -1;}
    .tabela-os td.c-servico{grid-column:1 / -1;}
    .tabela-os td.c-servico .sub{display:inline;}
    .tabela-os td.c-loja{grid-column:1;}

function filtrarProdutosBusca(lista, texto){

  achados.sort((a,b)=>{ const na=norm(a.nome), nb=norm(b.nome);

}

/**

 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas

async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 1000 } });   // o servidor (Supabase) devolve no máximo 1000 linhas por chamada: pedir mais fazia o fim da lista sumir
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}

/* ============================================================
   CANCELAMENTO DE O.S.
   - Reverte crédito/fiado do cliente e registra o valor que sai do caixa (se já
     tinha sido recebido). Estoque: libera a reserva das peças do catálogo e, se o
     pedido já tinha baixado, pergunta se devolve (estoqueAoCancelarOuExcluir).
   ============================================================ */
function podeCancelarOrdem(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
async function reverterFiadoECreditoOrdem(order, rotulo){
  rotulo = rotulo || 'Cancelamento';
  const telD = onlyDigits(order.telefone||'');
  const nomeL = (order.cliente||'').trim().toLowerCase();
  // Procura o cliente no servidor (telefone; se não achar, nome) — sem lista completa em memória.
  let cliCad = clientes.find(c=> (telD && onlyDigits(c.telefone||'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL)) || null;
  if(!cliCad && telD) cliCad = await buscarClientePorTelefoneOuCpf(order.telefone, '');
  if(!cliCad && nomeL){
    try{
      const r = await gatewayCall({ op:'searchClients', params:{ termo: (order.cliente||'').trim() } });
      cliCad = ((r && r.data) || []).find(c=> (c.nome||'').trim().toLowerCase()===nomeL) || null;
    }catch(e){ cliCad = null; }
  }
  if(!cliCad) return;
  let mudou = false;
  if(order.creditoUsado > 0){
    cliCad.credito = (Number(cliCad.credito)||0) + order.creditoUsado;
    if(!cliCad.creditoMovimentos) cliCad.creditoMovimentos = [];
    cliCad.creditoMovimentos.push({ data: hojeStr(), valor: order.creditoUsado, tipo:'estorno', obs:`${rotulo} O.S. ${order.via||''}` });
    mudou = true;
  }
  if(order.fiadoDebitoId && Array.isArray(cliCad.fiadoDebitos)){
    const idx = cliCad.fiadoDebitos.findIndex(d=>d.id===order.fiadoDebitoId);
    if(idx > -1){
      const debito = cliCad.fiadoDebitos[idx];
      const jaPago = Number(debito.valorPago)||0;
      if(jaPago > 0){
        if(!cliCad.creditoMovimentos) cliCad.creditoMovimentos = [];
        cliCad.credito = (Number(cliCad.credito)||0) + jaPago;
        cliCad.creditoMovimentos.push({ data: hojeStr(), valor: jaPago, tipo:'estorno', obs:`${rotulo} O.S. ${order.via||''} (parcela de fiado já paga)` });
      }
      cliCad.fiadoDebitos.splice(idx,1);
      mudou = true;
    }
  }
  if(mudou) await salvarUmCliente(cliCad);
}

/** Aplica o cancelamento em cima do objeto `order` em memória (não salva sozinho —

/* ============================================================
   EXCLUSÃO DE O.S. (só gerente/diretoria)
   - Guarda uma cópia de segurança (painel_ordens_kv, chave os_excluida_<id>) ANTES de apagar;
     se a cópia falhar, nada é apagado.
   - Apaga a linha em ordens_servico → a vaga da agenda e os valores recebidos deixam de ser
     contados (tudo é calculado a partir das O.S. existentes).
   - Reverte crédito usado e débito de fiado do cliente (igual ao cancelamento), exceto se a
     O.S. já estava cancelada (nesse caso a reversão já foi feita no cancelamento).
   - Devolve o número da via à sequência quando ele for o último emitido da loja.
   ============================================================ */
async function excluirOrdemDefinitivo(order, motivo){
  const copia = { ...order, excluidoPor: currentUser.nome, excluidoEm: Date.now(), motivoExclusao: motivo };
  const okBackup = await storageSet('os_excluida_'+order.id, copia, true);
  if(!okBackup) throw new Error('Não foi possível guardar a cópia de segurança. Nada foi excluído.');
  const r = await gatewayCall({ op:'delete', table:'ordens_servico', params:{ column:'id', value: order.id } });
  if(!r || r.error) throw new Error('Falha ao excluir no servidor: ' + ((r && r.error) || 'sem resposta') + '. Nada foi alterado.');
  orders = orders.filter(x=>x.id!==order.id);
  // Estoque: libera reserva / oferece devolver peças já baixadas (não bloqueia a exclusão).
  await estoqueAoCancelarOuExcluir(order, 'excluído');
  let avisoReversao = '';
  if(order.status !== 'cancelado'){
    try{ await reverterFiadoECreditoOrdem(order, 'Exclusão'); }
    catch(e){ console.error('erro ao reverter fiado/crédito na exclusão', e); avisoReversao = ' Atenção: não foi possível estornar fiado/crédito do cliente automaticamente — confira o cadastro do cliente.'; }
  }
  try{
    const m = /^([A-Za-z]+)(\d+)P$/.exec(String(order.codigoVia||''));
    if(m) await gatewayCall({ op:'liberarCodigoViaSequence', params:{ tipo:'pedido', lojaAbrev: m[1].toUpperCase(), numero: Number(m[2]) } });
  }catch(e){ /* melhor esforço: se não for o último número, a sequência segue normalmente */ }
  return avisoReversao;
}
function abrirExcluirOrdem(order){
  if(!order) return;
  if(!podeCancelarOrdem()){ showToast('Só gerente ou diretoria podem excluir uma O.S.'); return; }
  const recebido = valorRecebidoDe(order);
  const temCredito = order.status!=='cancelado' && Number(order.creditoUsado)>0;
  const temFiado = order.status!=='cancelado' && !!order.fiadoDebitoId;
  openModal(`
    <h3>Excluir pedido</h3>
    <p>${escapeHtml(order.cliente||'Cliente não identificado')} · Via ${escapeHtml(order.via||'—')} · <b>${fmtMoeda(order.valorTotal)}</b> · ${seloStatusHtml(order.status)}</p>
    <div class="aviso-linha excede">${ico('alerta')}<span>A exclusão é definitiva: o pedido some da lista e da agenda (a vaga é liberada).</span></div>
    <ul style="margin:10px 0 12px 18px; font-size:13px; line-height:1.6; color:var(--ink-soft);">
      ${recebido>0 ? `<li>${fmtMoeda(recebido)} já recebidos deixam de contar no caixa e nos relatórios.</li>` : ''}
      ${temCredito ? `<li>O crédito usado (${fmtMoeda(order.creditoUsado)}) volta para o cliente.</li>` : ''}
      ${temFiado ? `<li>O débito de fiado deste pedido é removido do cliente (parcelas já pagas viram crédito).</li>` : ''}
      <li>Uma cópia de segurança do pedido fica guardada.</li>
    </ul>
    ${order.status==='entregue' ? `<div class="aviso-linha excede" style="margin-bottom:12px;">${ico('alerta')}<span>Este pedido já foi entregue. Confira se ele realmente deve ser excluído.</span></div>` : ''}
    <div class="field"><label>Motivo da exclusão <span class="muted">(obrigatório)</span></label><textarea id="ex_motivo" style="min-height:70px;" placeholder="Ex: lançado em duplicidade, erro de digitação..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="ex_fechar">Voltar</button>
      <button class="btn btn-danger" id="ex_confirmar">Excluir pedido</button>
    </div>
  `);
  document.getElementById('ex_fechar').addEventListener('click', closeModal);
  const btn = document.getElementById('ex_confirmar');
  btn.addEventListener('click', async ()=>{
    const motivo = maiusc(document.getElementById('ex_motivo').value);
    if(!motivo){ showToast('Informe o motivo da exclusão.'); return; }
    btn.disabled = true;
    try{
      const aviso = await excluirOrdemDefinitivo(order, motivo);
      showToast('Pedido excluído.' + aviso);
      closeModal();
      renderView();
    }catch(e){
      btn.disabled = false;
      showToast(e.message || 'Erro ao excluir o pedido.');
    }
  });
}

 * (a lista pode ter milhares de registros, então não faz sentido regravar tudo de uma vez). */
async function clientesGet(){

    if(error) throw error;

async function salvarUmCliente(cliente){
  try{
    const { error } = await supabaseClient.from('clientes_cadastro').upsert({ id: cliente.id, payload: cliente });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar cliente', e); showToast('Não foi possível salvar o cliente.'); return false; }

function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
async function buscarClientePorTelefoneOuCpf(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  if(!tel && !doc) return null;
  const cacheado = clientes.find(c=>
    (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
  );
  if(cacheado) return cacheado;
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo: doc || tel } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    const achado = achados.find(c=>
      (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
    ) || null;
    if(achado && !clientes.some(x=>x.id===achado.id)) clientes.push(achado);
    return achado;
  }catch(e){ console.error('erro ao localizar cliente', e); return null; }
}
/**
 * Após salvar uma O.S., atualiza o cadastro do cliente no banco com os dados
 * mais recentes (nome, telefone, e-mail, endereço). Se o cliente ainda não
 * existir no cadastro, cria um novo registro com uid gerado.
 */
async function upsertClienteFromOrder(cli){
  if(!cli || !cli.cliente) return;
  const telD = onlyDigits(cli.telefone||'');
  // Buscar cliente existente pelo telefone (sem carregar lista completa em memória)
  let cliCad = null;
  if(telD) cliCad = await buscarClientePorTelefoneOuCpf(cli.telefone, '');
  if(!cliCad && cli.cpf) cliCad = await buscarClientePorTelefoneOuCpf('', cli.cpf);
  if(cliCad){
    // Atualizar campos com os dados mais recentes da O.S.
    const atualizado = Object.assign({}, cliCad, {
      nome:          (cli.cliente||'').trim() || cliCad.nome,
      telefone:      cli.telefone  || cliCad.telefone,
      email:         cli.email     || cliCad.email,
      cpf:           cli.cpf       || cliCad.cpf,
      dataNascimento:cli.dataNascimento || cliCad.dataNascimento,
      cep:           cli.cep       || cliCad.cep,
      endereco:      cli.endereco  || cliCad.endereco,
      numero:        cli.numero    || cliCad.numero,
      complemento:   cli.complemento || cliCad.complemento,
      bairro:        cli.bairro    || cliCad.bairro,
      cidade:        cli.cidade    || cliCad.cidade,
      estado:        cli.estado    || cliCad.estado,
    });
    await salvarUmCliente(atualizado);
  } else {
    // Cliente novo — criar registro
    const novo = {
      id: uid('cli'),
      nome: (cli.cliente||'').trim(),
      telefone: cli.telefone||'',
      email: cli.email||'',
      cpf: cli.cpf||'',
      dataNascimento: cli.dataNascimento||'',
      cep: cli.cep||'',
      endereco: cli.endereco||'',
      numero: cli.numero||'',
      complemento: cli.complemento||'',
      bairro: cli.bairro||'',
      cidade: cli.cidade||'',
      estado: cli.estado||'',
      credito: 0, fiadoDebitos: [], creditoMovimentos: [],
      criadoEm: Date.now(),
    };
    await salvarUmCliente(novo);
  }
}

          drop.querySelectorAll('.cli-result-card').forEach((el,i)=>{

          });
        } else {
          const t=inp.value.trim();
          const parece_cpf=/^[\d.\-]+$/.test(t)&&onlyDigits(t).length===11;
          drop.innerHTML=`
            <div style="padding:10px 12px;">
              <div style="font-size:13px;color:var(--ink-faint);margin-bottom:8px;">Nenhum cliente encontrado no cadastro.</div>
              <div style="display:flex;flex-direction:column;gap:6px;">

              </div>

          drop.style.display='block';
          if(parece_cpf){

              e.preventDefault();

            e.preventDefault();fechar();
            abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});

      inp.addEventListener('input',()=>{

        if(t.length<2){fechar();return;}
        msg('Buscando...');clearTimeout(timer);

          const r=await gatewayCall({op:'searchClients',params:{termo:t}});

        if(e.key==='ArrowDown'){e.preventDefault();focusIdx=Math.min(focusIdx+1,items.length-1);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='ArrowUp'){e.preventDefault();focusIdx=Math.max(focusIdx-1,0);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='Enter'&&focusIdx>=0){e.preventDefault();items[focusIdx].dispatchEvent(new MouseEvent('mousedown'));}
        else if(e.key==='Escape'){fechar();}
      });
      document.addEventListener('mousedown',function h(e){if(!wrap.contains(e.target)){fechar();document.removeEventListener('mousedown',h);}});
      wrap.querySelector('#cliAcCad_os').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    }
  }
  renderWrap();
  return {getCliente:()=>clienteSel};

async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  // Tenta ViaCEP primeiro, BrasilAPI como fallback
  const fontes = [
    async () => {
      const r = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
      const d = await r.json();
      if(d.erro) return null;
      return { endereco: d.logradouro||'', bairro: d.bairro||'', cidade: d.localidade||'', estado: d.uf||'' };
    },
    async () => {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${cepDigits}`);
      if(!r.ok) return null;
      const d = await r.json();
      return { endereco: d.street||'', bairro: d.neighborhood||'', cidade: d.city||'', estado: d.state||'' };
    }
  ];
  for(const fn of fontes){
    try{ const res = await fn(); if(res) return res; }catch(e){}
  }
  return null;
}

async function buscarCpfReceita(cpf){
  const digits = onlyDigits(cpf);
  if(digits.length !== 11) return null;
  try{
    const r = await fetch(`https://brasilapi.com.br/api/cpf/v1/${digits}`);
    if(!r.ok) return null;
    const d = await r.json();
    // BrasilAPI retorna { cpf, name, birthday, situation }
    if(!d || !d.name) return null;
    return { nome: d.name, situacao: d.situation||'' };
  }catch(e){ return null; }
}

function wireClienteFields(prefix, opts){
  opts = opts || {};
  wireTelefoneMask(prefix);

  // Auto-fill de endereço ao digitar/sair do CEP
  const cepInp = document.getElementById(prefix+'_cep');
  if(cepInp){
    cepInp.addEventListener('blur', async ()=>{
      const cepDigits = onlyDigits(cepInp.value);
      if(cepDigits.length !== 8) return;
      cepInp.placeholder = 'Buscando…';
      const endereco = await buscarEnderecoPorCep(cepDigits);
      cepInp.placeholder = '00000-000';
      if(!endereco){ showToast('CEP não encontrado.'); return; }
      const f = k => document.getElementById(prefix+'_'+k);
      if(f('endereco') && !f('endereco').value) f('endereco').value = endereco.endereco;
      if(f('bairro')   && !f('bairro').value)   f('bairro').value   = endereco.bairro;
      if(f('cidade')   && !f('cidade').value)    f('cidade').value   = endereco.cidade;
      if(f('estado')   && !f('estado').value)    f('estado').value   = endereco.estado;
      const numInp = f('numero'); if(numInp) numInp.focus();
      showToast('Endereço preenchido — informe o número.');
    });
  }

  // Busca no cadastro local pelo CPF e, se não achar, oferece Receita Federal
  const cpfInp = document.getElementById(prefix+'_cpf');
  const nomeInp = document.getElementById(prefix+'_cliente');
  if(cpfInp){
    cpfInp.addEventListener('blur', async ()=>{
      const digits = onlyDigits(cpfInp.value);
      if(digits.length !== 11) return;
      if(opts.buscarClientePorCpf && Array.isArray(clientes)){
        const found = clientes.find(c=> onlyDigits(c.cpf||'') === digits);
        if(found){
          const map = { cliente:found.nome,telefone:found.telefone,email:found.email,
            nascimento:found.dataNascimento,cep:found.cep,endereco:found.endereco,
            numero:found.numero,complemento:found.complemento,bairro:found.bairro,
            cidade:found.cidade,estado:found.estado };
          Object.keys(map).forEach(c=>{ const el=document.getElementById(prefix+'_'+c); if(el&&!el.value&&map[c]) el.value=map[c]; });
          showToast('Cliente já cadastrado — dados preenchidos automaticamente.');
          return;
        }
      }
      if(nomeInp && nomeInp.value.trim()) return;
      const res = await buscarCpfReceita(digits);
      if(res && res.nome && nomeInp){
        nomeInp.value = res.nome;
        showToast('Nome preenchido pela Receita Federal — confira.');
      }
    });
  }
}

let photoCache = {};

function compressImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function getPhotoDataUrl(fotoId){

  const val = await storageGet('foto:' + fotoId, true);

}

/**
 * Mounts a photo attachment widget into `container`, bound to `holder.fotos` (array of {id, nome, criadoEm}).
 * Actual image bytes are stored separately per photo (key "foto:<id>") to keep the main orders record light.
 * `persisted`: true saves the parent orders array to storage after each change (holder is a real order/observation).
 * `readOnly`: true shows thumbnails only, no add/remove controls (used for the oficina view).
 */
function mountFotos(container, holder, persisted, readOnly){
  if(!holder.fotos) holder.fotos = [];

  function draw(){
    container.innerHTML = `
      <div class="section-label">Fotos</div>
      <div class="foto-grid" id="fotoGridInner"></div>
      ${readOnly ? '' : `
        <input type="file" accept="image/*" multiple id="fotoInputGaleria" style="display:none;">
        <input type="file" accept="image/*" capture="environment" id="fotoInputCamera" style="display:none;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-ghost btn-sm" id="btnAddFotoGaleria">${ico('imagem',14)} Anexar foto</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnAddFotoCamera">${ico('camera',14)} Tirar foto</button>
        </div>
      `}
    `;
    drawGrid();
    if(!readOnly){
      const inpGaleria = container.querySelector('#fotoInputGaleria');
      const inpCamera = container.querySelector('#fotoInputCamera');
      container.querySelector('#btnAddFotoGaleria').addEventListener('click', ()=> inpGaleria.click());
      container.querySelector('#btnAddFotoCamera').addEventListener('click', ()=> inpCamera.click());

      async function processFiles(inputEl){
        const files = Array.from(inputEl.files || []);
        if(files.length===0) return;
        for(const file of files){
          try{
            const dataUrl = await compressImage(file);
            const fotoId = uid('foto');
            let driveResult = null;
            try{
              driveResult = await uploadFotoParaDrive(dataUrl, fotoId + '_' + file.name);
            }catch(driveErr){
              console.error('Falha ao enviar foto para o Google Drive, salvando localmente:', driveErr);
            }
            if(driveResult && driveResult.url){
              holder.fotos.push({ id: fotoId, nome: file.name, criadoEm: Date.now(), driveUrl: driveResult.url, driveFileId: driveResult.fileId });
            }else{
              photoCache[fotoId] = dataUrl;
              await storageSet('foto:' + fotoId, dataUrl, true);
              holder.fotos.push({ id: fotoId, nome: file.name, criadoEm: Date.now() });
            }
          }catch(e){ showToast('Não foi possível processar uma das fotos.'); }
        }
        inputEl.value = '';
        if(persisted) await saveOrders();
        drawGrid();
        showToast('Foto(s) anexada(s).');
      }
      inpGaleria.addEventListener('change', ()=>processFiles(inpGaleria));
      inpCamera.addEventListener('change', ()=>processFiles(inpCamera));
    }
  }

  function drawGrid(){
    const grid = container.querySelector('#fotoGridInner');
    if(holder.fotos.length===0){
      grid.innerHTML = `<div class="muted">Nenhuma foto anexada${readOnly ? '.' : '. Use “Anexar foto” ou “Tirar foto”.'}</div>`;
      return;
    }
    grid.innerHTML = holder.fotos.map(f=>`
      <div class="foto-thumb" data-fid="${f.id}">
        <img data-fotoimg="${f.id}" src="${escapeHtml(f.driveUrl || photoCache[f.id] || '')}" alt="${escapeHtml(f.nome)}">
        ${readOnly ? '' : `<button type="button" class="foto-del" data-fotodel="${f.id}" title="Remover foto" aria-label="Remover foto">${ico('x',13)}</button>`}
      </div>
    `).join('');
    grid.querySelectorAll('img[data-fotoimg]').forEach(img=>{
      const fid = img.dataset.fotoimg;
      const fObj = holder.fotos.find(x=>x.id===fid);
      if(fObj && fObj.driveUrl){
        img.addEventListener('click', ()=>{ if(img.src) openPhotoModal(img.src); });
        return;
      }
      if(!photoCache[fid]){
        getPhotoDataUrl(fid).then(url=>{ if(url){ img.src = url; } });
      }
      img.addEventListener('click', ()=>{ if(img.src) openPhotoModal(img.src); });
    });
    if(!readOnly){
      grid.querySelectorAll('[data-fotodel]').forEach(b=>{
        b.addEventListener('click', async (e)=>{
          e.stopPropagation();
          holder.fotos = holder.fotos.filter(x=>x.id!==b.dataset.fotodel);
          if(persisted) await saveOrders();
          drawGrid();
        });
      });
    }
  }

  draw();
}

/**
 * Mounts a "valor total + formas de pagamento" widget bound to `holder` ({valorTotal, pagamentos:[{formaId,valor}]}).
 * Supports more than one payment method per order (ex: parte no cartão, parte no PIX).
 */
/**
 * Mounts o widget de pagamento vinculado ao `holder`:
 * { momentoPagamento:'na_encomenda'|'na_volta', valorTotal, pagamentos:[{formaId,valor}],
 *   emissaoNota:'sim'|'nao', numeroNota, lojaNotaId }
 * Regras:
 * - "Pago no ato da encomenda" ou "Pagar na volta (retirada)".
 * - Só quando "pago no ato" é que aparece a pergunta de emissão de nota; se sim, número + loja da nota.
 * - Valores recebidos/a receber são calculados a partir da soma dos pagamentos vs valor total,
 *   usados no Painel e no Dashboard para os filtros de "Recebido"/"A receber".
 */
/**
 * Valida a exigência: quando emite nota, a empresa que RECEBEU o pagamento
 * precisa ser a mesma que EMITIU a nota (mesmo CNPJ pagando e faturando).
 * Retorna null se estiver tudo certo, ou uma mensagem de erro pra mostrar.
 */
function notaEmpresasErro(holder){
  if(holder.emissaoNota !== 'sim') return null;
  if(!holder.lojaSaidaId || !holder.lojaPagamentoId || !holder.lojaNotaId){
    return 'Selecione as 3 empresas (saída da joia, pagamento e nota).';
  }
  if(holder.lojaPagamentoId !== holder.lojaNotaId){
    return 'A empresa que recebeu o pagamento precisa ser a mesma que emitiu a nota.';
  }
  return null;
}

function mountPagamentos(container, holder, getLojaVendaId){
  if(!holder.pagamentos) holder.pagamentos = [];
  if(!holder.momentoPagamento) holder.momentoPagamento = ''; // sem pré-seleção — obrigatório escolher
  if(!holder.emissaoNota) holder.emissaoNota = ''; // sem pré-seleção — usuário deve escolher
  getLojaVendaId = getLojaVendaId || (()=>'');

  // desconto/acréscimo sobre o total no bloco de pagamento
  if(!holder.descTotalTipo) holder.descTotalTipo='nenhum';
  if(!holder.descTotalModo) holder.descTotalModo='percentual';
  if(holder.descTotalPerc===undefined) holder.descTotalPerc='';
  if(holder.descTotalR===undefined) holder.descTotalR='';

  function calcTotalItens(){
    // Só conta itens confirmados (_modo==='ok') — a linha em edição não entra no total
    // até o usuário clicar em "Adicionar". Isso garante que o pagamento mostra o valor
    // real dos itens já lançados, não o que ainda está sendo digitado.
    if(window.__itensHolder) return window.__itensHolder.itens
      .filter(it=>it._modo==='ok')
      .reduce((acc,it)=>acc+(Number(it.valorUnitario)||0),0);
    return 0;

  function calcTotalFinal(subtotal){
    if(holder.descTotalTipo==='nenhum') return subtotal;
    const qtd=Number(holder.descTotalPerc||holder.descTotalR)||0;
    const delta=holder.descTotalModo==='percentual'?subtotal*qtd/100:qtd;
    return Math.max(0,holder.descTotalTipo==='desconto'?subtotal-delta:subtotal+delta);

            <span class="desc-sep">ou</span>
            <input type="number" min="0" step="0.01" class="campo-val" id="pagDescR" placeholder="R$" value="${escapeHtml(String(holder.descTotalR||''))}">
          </div>
          ${(()=>{
            if(holder.descTotalTipo!=='nenhum') return `<div class="pag-final ${holder.descTotalTipo==='desconto'?'desc':'acr'}">= ${fmtMoeda(totalFinal)}</div>`;
            if(subtotal>0) return `<div class="pag-final">= ${fmtMoeda(subtotal)}</div>`;
            return '';
          })()}
        </div>
      </div>

      <!-- Faixa: Valor Total + Momento + Nota Fiscal (mesma linha) -->
      <div class="pag-info-row">
        <!-- Valor total -->
        <div class="pag-info-cel" style="flex:1 1 auto;min-width:120px;">
          <div class="pag-info-cel-label">Valor total</div>
          <div class="pag-info-cel-val" id="pagValorTotalDisplay">${fmtMoeda(totalFinal>0?totalFinal:0)}</div>
          <input type="hidden" id="pagValorTotal" value="${totalFinal>0?totalFinal.toFixed(2):''}">
        </div>
        <!-- Momento do pagamento -->
        <div class="pag-toggle-cel" style="flex:0 0 auto;">
          <div class="pag-info-cel-label">Quando o cliente paga?</div>
          <div class="pag-toggle-inner toggle-group">
            <div class="toggle-opt">
              <input type="radio" name="pagMomento" id="pagMomEnc" value="na_encomenda" ${holder.momentoPagamento==='na_encomenda'?'checked':''}>
              <label for="pagMomEnc">Pago agora</label>
            </div>

        <!-- Nota fiscal -->

            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaNao" value="nao" ${holder.emissaoNota==='nao'?'checked':''}>

    `;
    drawRows();

    });
    container.querySelectorAll('input[name="pagEmiteNota"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.emissaoNota = r.value; if(r.value!=='sim'){ holder.numeroNota = ''; const b2 = container.querySelector('[data-numnota]'); if(b2) b2.textContent = 'Número da nota'; } });
    });
    const bn = container.querySelector('[data-numnota]'); if(bn) bn.addEventListener('click', ()=> abrirNumeroNota(holder, draw));
    // pagValorTotal agora é hidden — valor vem dos itens + desconto/acréscimo
    const inpTotal = container.querySelector('#pagValorTotal');
    if(inpTotal && inpTotal.value) holder.valorTotal = parseFloat(inpTotal.value) || null;
    container.querySelector('#btnAddPagamento').addEventListener('click', ()=>{
      const primeiraForma = (config.paymentTypes && config.paymentTypes[0]) ? config.paymentTypes[0].id : '';
      holder.pagamentos.push({ formaId: primeiraForma, valor: '' });
      drawRows();
    });
    // Botões desconto/acréscimo sobre o total
    function aplicarDescTotal(){
      const sub=calcTotalItens();
      const fin=calcTotalFinal(sub);
      const el=container.querySelector('#pagSubtotal'); if(el) el.textContent=fmtMoeda(sub);
      const inpT=container.querySelector('#pagValorTotal');

        inpT.value=fin.toFixed(2); holder.valorTotal=fin;

    }
    const btnDesc=container.querySelector('#pagBtnDesc');
    const btnAcr=container.querySelector('#pagBtnAcr');
    const dpPerc=container.querySelector('#pagDescPerc');
    const dpR=container.querySelector('#pagDescR');
    if(btnDesc) btnDesc.addEventListener('click',()=>{
      holder.descTotalTipo=holder.descTotalTipo==='desconto'?'nenhum':'desconto';
      holder.descTotalPerc=''; holder.descTotalR=''; holder.valorTotal=null; draw(); updateHint();
    });
    if(btnAcr) btnAcr.addEventListener('click',()=>{
      holder.descTotalTipo=holder.descTotalTipo==='acrescimo'?'nenhum':'acrescimo';
      holder.descTotalPerc=''; holder.descTotalR=''; holder.valorTotal=null; draw(); updateHint();
    });
    if(dpPerc) dpPerc.addEventListener('input',()=>{
      holder.descTotalPerc=dpPerc.value; holder.descTotalR=''; holder.descTotalModo='percentual';
      // Ativa desconto automaticamente se ainda não clicou em nenhum botão
      if(holder.descTotalTipo==='nenhum' && dpPerc.value!=='') { holder.descTotalTipo='desconto'; draw(); return; }
      const dr=container.querySelector('#pagDescR'); if(dr) dr.value='';

    });

      const inpT=container.querySelector('#pagValorTotal'); if(inpT){ inpT.value=fin.toFixed(2); holder.valorTotal=fin; }
      updateHint();

  function drawRows(){
    const wrap = container.querySelector('#pagRows');
    wrap.innerHTML = holder.pagamentos.map((p,i)=>`
      <div class="pag-linha">
        <select data-pagform="${i}" aria-label="Forma de pagamento">${opcoesFormaPagamentoHtml(p.formaId)}</select>

          ${pessoaPixHtml(p,i)}

          <button type="button" class="icon-btn perigo" data-pagdel="${i}" title="Remover forma de pagamento" aria-label="Remover forma de pagamento">${ico('lixeira')}</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-pagform]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ const pg = holder.pagamentos[Number(sel.dataset.pagform)]; pg.formaId = sel.value; if(!formaEhPix(pg.formaId)) delete pg.pessoa; drawRows(); });
    });
    wrap.querySelectorAll('[data-pagpessoa]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ holder.pagamentos[Number(sel.dataset.pagpessoa)].pessoa = sel.value; });
    });
    wrap.querySelectorAll('[data-pagvalor]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        holder.pagamentos[Number(inp.dataset.pagvalor)].valor = inp.value === '' ? '' : parseFloat(inp.value);
        updateHint();
      });
    });
    wrap.querySelectorAll('[data-pagdel]').forEach(b=>{
      b.addEventListener('click', ()=>{ holder.pagamentos.splice(Number(b.dataset.pagdel),1); drawRows(); updateHint(); });
    });
    updateHint();
  }

  function updateHint(){
    const hint = container.querySelector('#pagSomaHint');
    if(!hint) return;
    const temSemCusto = holder.pagamentos.some(p=>p.formaId==='__sem_custo');
    if(temSemCusto){ holder.valorTotal = 0; }
    const soma = holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
    const total = temSemCusto ? 0 : (Number(holder.valorTotal)||calcTotalItens());
    if(holder.pagamentos.length === 0 && total <= 0){ hint.textContent = ''; return; }
    const saldo = total - soma;
    if(saldo > 0.009){
      hint.innerHTML = `<div class="aviso-linha falta">${ico('carteira')}<span>Falta lançar ${fmtMoeda(saldo)} <span class="fraco">(total ${fmtMoeda(total)} · lançado ${fmtMoeda(soma)})</span></span></div>`;
    } else if(saldo < -0.009){
      hint.innerHTML = `<div class="aviso-linha excede">${ico('alerta')}<span>Os pagamentos passam do total em ${fmtMoeda(Math.abs(saldo))}. Confira os valores.</span></div>`;
    } else {
      hint.innerHTML = `<div class="aviso-linha completo">${ico('check')}<span>Pagamento completo — ${fmtMoeda(total)}</span></div>`;
    }
  }

  draw();
  // Expõe redraw globalmente para os itens chamarem quando mudam
  window.__pagRedraw = ()=>{ holder.valorTotal=null; draw(); };
  return { redraw: window.__pagRedraw };
}

/** Soma já paga de uma ordem/venda (a partir dos pagamentos lançados). */
/* Opções do select de forma de pagamento: SOMENTE as formas cadastradas em
   Administração › Cadastro › Formas de Pagamento. Ordens antigas lançadas com
   Crédito do cliente / Fiado / Sem custo mantêm a opção só na própria linha,
   pra edição não mostrar a forma errada. */
function opcoesFormaPagamentoHtml(formaIdAtual){
  const formas = (config.paymentTypes||[]);
  let html = formas.map(pt=>`<option value="${pt.id}" ${formaIdAtual===pt.id?'selected':''}>${escapeHtml(pt.nome)}</option>`).join('');
  const legado = { '__credito':'Crédito do cliente', '__fiado':'Fiado', '__sem_custo':'Sem custo' };
  if(legado[formaIdAtual]) html += `<option value="${formaIdAtual}" selected>${legado[formaIdAtual]}</option>`;
  return html;
}
function valorRecebidoDe(o){ return (o.pagamentos||[]).reduce((acc,p)=> acc + ((p.formaId==='__fiado'||p.formaId==='__credito') ? 0 : (Number(p.valor)||0)), 0); }
/* Fiado/crédito não entram como recebido: fiado movimenta o caixa só quando as parcelas
   são pagas (Cadastro → Clientes → Débitos); crédito entrou no caixa na recarga. */
/** Valor ainda pendente (nunca negativo). */
function valorAReceberDe(o){ return Math.max(0, (Number(o.valorTotal)||0) - valorRecebidoDe(o)); }
/** true quando NENHUMA informação de pagamento foi lançada — dispara o aviso vermelho e o filtro. */
function semPagamentoLancado(o){ return !o.valorTotal && (!o.pagamentos || o.pagamentos.length===0); }

function promptCiente(callback){
  openModal(`
    <h3>Marcar como ciente</h3>
    <p>Quem está tomando ciência desta observação?</p>
    <div class="field"><label for="cienteNomeInp">Seu nome</label><input id="cienteNomeInp" placeholder="Nome"></div>
    <div class="modal-actions">

    </div>
  `);
  document.getElementById('cienteCancel').addEventListener('click', closeModal);
  document.getElementById('cienteConfirm').addEventListener('click', ()=>{
    const nome = maiusc(document.getElementById('cienteNomeInp').value);
    if(!nome){ showToast('Informe o nome.'); return; }
    closeModal();
    callback(nome);

}

/**
 * Asks who received the product before an order can be marked as "Entregue".
 * onCancel fires if the modal is dismissed (Cancelar button OR clicking outside),
 * so callers can revert a <select> that already changed value visually.
 */
function promptRecebidoPor(onConfirm, onCancel){
  modalOnClose = onCancel || null;
  openModal(`
    <h3>Marcar como entregue</h3>
    <p>Quem retirou a peça? O nome fica registrado no pedido.</p>
    <div class="field"><label for="recebidoNomeInp">Recebido por</label><input id="recebidoNomeInp" placeholder="Nome de quem recebeu"></div>
    <div class="modal-actions">

      <button class="btn btn-accent" id="recebidoConfirm">Marcar entregue</button>
    </div>
  `);
  document.getElementById('recebidoCancel').addEventListener('click', closeModal);
  document.getElementById('recebidoConfirm').addEventListener('click', ()=>{
    const nome = maiusc(document.getElementById('recebidoNomeInp').value);
    if(!nome){ showToast('Informe o nome de quem recebeu.'); return; }
    modalOnClose = null;
    closeModal();
    onConfirm(nome);
  });
