          </div>
          ${estoqueAqui<=0&&outras.length>0?`
          <div style="margin-top:6px;padding:8px 10px;background:var(--wait-soft,#fceedc);border:1px solid var(--wait,#b45309);border-radius:8px;font-size:12.5px;color:var(--wait,#b45309);font-weight:600;">
            ⚠️ Sem estoque nesta loja, mas <b>tem em ${outras.join(', ')}</b>.
            <div style="font-weight:500;margin-top:3px;">A peça é de outro CNPJ — verifique com a gerência a baixa de estoque correta.</div>
          </div>`:''}
          `:''}
          <div class="item-row-obs">
            <input type="text" data-itfield="observacaoItem" placeholder="Observação do item (opcional)"
              value="${escapeHtml(it.observacaoItem||'')}">
          </div>
        </div>`;
      }
    });
    wrap.innerHTML=__html;

    // ── Autocomplete de produto ──
    wrap.querySelectorAll('[data-pac]').forEach(inp=>{
      const i = Number(inp.dataset.pac);
      const drop = document.getElementById('pacDrop_'+i);
      let pacTimer=null, pacFocus=-1, pacAchados=[];
      function fecharDrop(){ drop.style.display='none'; pacFocus=-1; }
      function renderDrop(lista){
        pacAchados=lista;
        if(!lista.length){ drop.innerHTML='<div class="prod-ac-item" style="color:var(--ink-faint);">Nenhum produto encontrado.</div>'; drop.style.display='block'; return; }
        drop.innerHTML=lista.map((p,k)=>`<div class="prod-ac-item" data-pk="${k}"><b>${escapeHtml(p.nome)}</b><span>${[p.codigo?'Cód. '+p.codigo:null,p.fator!=null&&p.fator!==''?'Fator '+p.fator:null,p.tipo||null,p.fornecedor||null,p.precoVenda!=null?'R$ '+Number(p.precoVenda).toFixed(2):null].filter(Boolean).join(' · ')}</span></div>`).join('');
        drop.style.display='block';
        drop.querySelectorAll('.prod-ac-item[data-pk]').forEach(el=>{
          el.addEventListener('mouseover',()=>{ pacFocus=Number(el.dataset.pk); drop.querySelectorAll('.prod-ac-item').forEach((e,k)=>e.classList.toggle('pf',k===pacFocus)); });
          el.addEventListener('mousedown',e=>{ e.preventDefault(); selecionarProduto(i,pacAchados[Number(el.dataset.pk)]); });
        });
      }
      inp.addEventListener('input',()=>{ clearTimeout(pacTimer); pacTimer=setTimeout(()=>{
        const t=inp.value.toLowerCase().trim();
        if(!t){ fecharDrop(); return; }
        const codigoExato=/^\d{6,}$/.test(inp.value.trim());
        if(codigoExato){
          const porCod=vendaveis.find(p=>(p.codigoBarras&&String(p.codigoBarras).trim()===inp.value.trim())||(p.codigo&&String(p.codigo).trim()===inp.value.trim()));
          if(porCod){ selecionarProduto(i,porCod); fecharDrop(); return; }
        }
        renderDrop(vendaveis.filter(p=>{
          const campos=[p.nome,p.codigo,p.codigoBarras,String(p.fator||''),p.tipo,p.fornecedor];
          return campos.some(c=>c&&String(c).toLowerCase().includes(t));
        }).slice(0,15));
      },120); });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.prod-ac-item[data-pk]');
        if(!items.length) return;
        if(e.key==='ArrowDown'){ e.preventDefault(); pacFocus=Math.min(pacFocus+1,items.length-1); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); pacFocus=Math.max(pacFocus-1,0); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='Enter'){ e.preventDefault();
          if(pacFocus>=0) selecionarProduto(i,pacAchados[pacFocus]);
          else if(pacAchados.length===1) selecionarProduto(i,pacAchados[0]);
        }
        else if(e.key==='Escape'){ fecharDrop(); }
      });
      inp.addEventListener('blur',()=>{ setTimeout(fecharDrop,150); });
      inp.focus();
    });
    // ＋ confirma → compacto + nova linha vazia
    wrap.querySelectorAll('[data-itadd]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.itadd);
        const it=holder.itens[idx];
        if(!it.produtoEstoqueId&&!it.valorUnitario) return;
        it._modo='ok';
        holder.itens.splice(0,0,{id:uid('it'),produto:'',metal:'',quantidade:1,valorUnitario:'',produtoEstoqueId:'',precoOriginal:'',ajusteTipo:'nenhum',ajusteModo:'percentual',ajusteQtd:'',ajustePerc:'',ajusteValR:'',observacaoItem:'',_modo:'editar'});
        drawRows(); updateTotalHint();
      });
    });
    // ✏️ volta ao modo editar
    wrap.querySelectorAll('[data-iteditar]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        holder.itens[Number(btn.dataset.iteditar)]._modo='editar';
        drawRows(); updateTotalHint();
      });
    });
    // 💬 toggle obs
    wrap.querySelectorAll('[data-itobstoggle]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const box=document.getElementById('vendaObs_'+btn.dataset.itobstoggle);
        if(box) box.style.display=box.style.display==='block'?'none':'block';
      });
    });

    // Botão × limpa produto
    wrap.querySelectorAll('[data-paclear]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.paclear);
        const it=holder.itens[i];
        it.produtoEstoqueId=''; it.produto=''; it.precoOriginal=''; it.valorUnitario=''; it.ajusteTipo='nenhum'; it.ajusteQtd='';
        drawRows(); updateTotalHint();
      });
    });

    // ── Botões Desconto / Acréscimo ──
    wrap.querySelectorAll('[data-aidbtn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.idx2);
        const it=holder.itens[idx];
        const tipo=btn.dataset.aidbtn;
        // toggle: clicar no mesmo botão ativo desativa
        it.ajusteTipo = it.ajusteTipo===tipo ? 'nenhum' : tipo;
        // atualiza aparência dos botões sem redesenhar a linha inteira
        const row=wrap.querySelector('[data-idx="'+idx+'"]');
        row.querySelectorAll('[data-aidbtn]').forEach(b=>{
          b.classList.remove('ativo-desc','ativo-acr');
          if(it.ajusteTipo==='desconto'&&b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
          if(it.ajusteTipo==='acrescimo'&&b.dataset.aidbtn==='acrescimo') b.classList.add('ativo-acr');
        });
        if(it.ajusteTipo==='nenhum'){
          it.ajustePerc=''; it.ajusteValR='';
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          // restaura valor original
          if(it.precoOriginal!==''&&it.precoOriginal!=null){
            it.valorUnitario=it.precoOriginal;
            const inpVal=row.querySelector('[data-itfield="valorUnitario"]');
            if(inpVal) inpVal.value=Number(it.precoOriginal).toFixed(2);
          }
          updateTotalHint();
        } else {
          recalcularAjusteNovo(it, idx, row);
        }
      });
    });

    // ── Campos de valor e desconto ──
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input',()=>{
        const row=el.closest('[data-idx]');
        const idx=Number(row.dataset.idx);
        const field=el.dataset.itfield;
        const it=holder.itens[idx];

        if(field==='valorUnitario'){
          it.valorUnitario=el.value===''?'':parseFloat(el.value);
          it.precoOriginal=it.valorUnitario;
          // limpa desconto ao editar valor manualmente
          it.ajustePerc=''; it.ajusteValR=''; it.ajusteTipo='nenhum';
          row.querySelectorAll('[data-aidbtn]').forEach(b=>b.classList.remove('ativo-desc','ativo-acr'));
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          updateTotalHint(); return;
        }
        if(field==='ajustePerc'){
          it.ajustePerc=el.value===''?'':parseFloat(el.value);
          it.ajusteValR='';
          it.ajusteModo='percentual'; it.ajusteQtd=it.ajustePerc;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajustePerc!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='ajusteValR'){
          it.ajusteValR=el.value===''?'':parseFloat(el.value);
          it.ajustePerc='';
          it.ajusteModo='valor'; it.ajusteQtd=it.ajusteValR;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajusteValR!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='observacaoItem'){ it.observacaoItem=el.value; return; }
        it[field]=el.value; updateTotalHint();
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click',()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }

  // Seleciona produto pelo autocomplete
  function selecionarProduto(idx, produto){
    const it=holder.itens[idx];
    it.produtoEstoqueId=produto.id; it.produto=produto.nome;
    it.precoOriginal=produto.precoVenda!=null?produto.precoVenda:'';
    if(it.valorUnitario===''||it.valorUnitario==null) it.valorUnitario=it.precoOriginal||'';
    drawRows();
    // Foca no campo de valor após selecionar produto
    setTimeout(()=>{
      const row=container.querySelector('[data-idx="'+idx+'"]');
      if(row){ const v=row.querySelector('[data-itfield="valorUnitario"]'); if(v) v.focus(); }
    },50);
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    if(hint) hint.innerHTML = `Total dos itens: <b>R$ ${totalItens().toFixed(2)}</b> <span class="muted">(você pode ajustar o valor total do pagamento manualmente se houver desconto/acréscimo)</span>`;
    // Avisa o bloco de pagamento para recalcular o total
    if(typeof window.__pagRedraw==='function') window.__pagRedraw();
  }
  draw();
  return { totalItens, refreshEstoque: drawRows };
}

    orders.unshift(rascunho);
    await saveOrders();
    if(cli.cliente){ await upsertClienteFromOrder(cli); }
    showToast('Rascunho salvo.');
    currentTab = 'painel';
    modoNovaOrdem = false;
    renderTabs(); renderView();
  });

  document.getElementById('btnSalvarOrdem').addEventListener('click', async ()=>{
    const cli = collectClienteFields();
    const { cliente, telefone } = cli;
    const via = viaInp.value.trim();
    const numeroNota = tempPagHolder.numeroNota || '';
    const vendedora = document.getElementById('f_vendedora').value.trim();
    const descricao = maiusc(document.getElementById('f_descricao').value);
    const loja = lojaSel.value;
    const sid = servicoSel.value;
    const dt = dataInp.value;

    if(!cliente || !telefone || !vendedora || !loja || !sid || !dt){
      showToast('Preencha todos os campos obrigatórios antes de lançar.');
      return;
    }
    if(!tempPagHolder.momentoPagamento){ showToast('Informe o momento do pagamento (Pago agora ou Pagar na volta).'); return; }
    if(!tempPagHolder.emissaoNota){ showToast('Informe se haverá nota fiscal (Sim ou Não).'); return; }
    const erroNota = notaEmpresasErro(tempPagHolder);
    if(erroNota){
      showToast(erroNota);
      return;
    }
    const res = checkSlot(sid, dt, null);
    let encaixe = false;
    let autorizadoPor = null;

    if(!res.ok){
      const codigoDigitado = document.getElementById('f_codigo').value.trim().toUpperCase();
      if(!codigoDigitado){
        showToast('Informe o código de autorização para concluir o encaixe.');
        return;
      }
      // Recarrega os códigos direto do banco: quem gerou o código pode estar em outro
      // dispositivo/sessão, então a lista em memória aqui pode estar desatualizada.
      codes = await storageGet('codes', true) || [];
      const codeObj = codes.find(c=>c.codigo === codigoDigitado && !c.usado);
      if(!codeObj){
        showToast('Código inválido ou já utilizado.');
        return;
      }
      codeObj.usado = true;
      codeObj.usadoEm = Date.now();
      encaixe = true;
      autorizadoPor = codeObj.autorizadoPor;
      await saveCodes();
    }

    const st = config.serviceTypes.find(s=>s.id===sid);
    // ===== Crédito do cliente / Fiado =====
    // Calculados antes de montar a ordem pra já guardar dentro dela o id do débito de\n    // fiado (fiadoDebitoId) e o crédito usado (creditoUsado) — permite reverter com\n    // precisão em caso de cancelamento.
    const pagsCreditoOS = (tempPagHolder.pagamentos||[]).filter(p=>p.formaId==='__credito');
    const pagsFiadoOS = (tempPagHolder.pagamentos||[]).filter(p=>p.formaId==='__fiado');
    const totalCredOS = pagsCreditoOS.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const totalFiaOS = pagsFiadoOS.reduce((a,p)=>a+(Number(p.valor)||0),0);
    const novoFiadoDebitoIdOS = totalFiaOS>0 ? ('fd_'+Math.random().toString(36).slice(2)+Date.now().toString(36)) : null;
    const novaOrdem = {
      id: uid('ord'),
      ...cli,
      via, numeroNota, vendedora, descricao, lojaId: loja,
      serviceTypeId: sid,
      serviceTypeName: st ? st.nome : '',
      data: dt,
      status: STATUS.AGUARDANDO,
      encaixe, autorizadoPor,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: tempPagHolder.pagamentos,
      momentoPagamento: tempPagHolder.momentoPagamento,
      emissaoNota: tempPagHolder.emissaoNota,
      lojaSaidaId: tempPagHolder.lojaSaidaId || '',
      lojaPagamentoId: tempPagHolder.lojaPagamentoId || '',
      lojaNotaId: tempPagHolder.lojaNotaId || '',
      localAtual: 'loja',
      historicoLocal: [{ local:'loja', em: Date.now(), por: currentUser.nome }],
      observacoes: tempObsHolder.observacoes,
      fotos: tempFotoHolder.fotos,
      infoInterna: (document.getElementById('f_infoInterna')?.value||'').trim(),
      creditoUsado: totalCredOS,
      fiadoDebitoId: novoFiadoDebitoIdOS,
      criadoEm: Date.now()
    };
    // Código de barras da via, gerado só agora que a O.S. realmente vai ser lançada
    // (rascunho não gera código — só quando vira uma O.S. de verdade).
    novaOrdem.codigoVia = await bumpCodigoVia('pedido', novaOrdem.lojaId||'');
    if(pagsCreditoOS.length>0 || pagsFiadoOS.length>0){
      const telD = onlyDigits(novaOrdem.telefone||'');
      const nomeL = (novaOrdem.cliente||'').trim().toLowerCase();
      const cliCad = clientes.find(c=> (telD && onlyDigits(c.telefone||'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL));
      if(!cliCad){
        showToast('Pra usar Crédito ou Fiado, o cliente precisa estar no cadastro (selecione pela busca).');
        return;
      }
      if(totalCredOS>0 && (Number(cliCad.credito)||0) < totalCredOS - 0.001){
        showToast(`Saldo de crédito insuficiente: cliente tem R$ ${(Number(cliCad.credito)||0).toFixed(2)}.`);
        return;
      }
      if(totalCredOS>0){
        cliCad.credito = (Number(cliCad.credito)||0) - totalCredOS;
        if(!cliCad.creditoMovimentos) cliCad.creditoMovimentos = [];
        cliCad.creditoMovimentos.push({ data: dt, valor: -totalCredOS, tipo:'uso', obs:`O.S. ${via}` });
      }
      if(totalFiaOS>0){
        if(!cliCad.fiadoDebitos) cliCad.fiadoDebitos = [];
        cliCad.fiadoDebitos.push({ id:novoFiadoDebitoIdOS, origem:'O.S.', numero:via, data:dt, valor:totalFiaOS, valorPago:0, loja:loja||'' });
      }
      await salvarUmCliente(cliCad);
    }
    orders.unshift(novaOrdem);
    await saveOrders();
    await upsertClienteFromOrder(cli);
    showToast(encaixe ? 'Ordem lançada como encaixe autorizado.' : 'Ordem lançada com sucesso.');
    currentTab = 'painel';
    modoNovaOrdem = false;
    renderTabs(); renderView();
    renderAlerts();
    openNotifyModal(novaOrdem);
  });
}

/* ============================================================
   EDITAR ORDEM (modal)
   ============================================================ */
async function openEditModal(orderId, somenteLeitura){
  // Recarrega SÓ essa ordem direto do banco (uma linha, não a lista inteira): o
  // cliente pode ter confirmado uma leitura (ou o status pode ter mudado em outra
  // aba/sessão) depois que esta página carregou.
  try{
    const r = await gatewayCall({ op:'selectOne', table:'ordens_servico', params:{ column:'id', value: orderId } });
    if(r && r.data && r.data.payload){
      const idx = orders.findIndex(o=>o.id===orderId);
      if(idx>=0) orders[idx] = r.data.payload; else orders.push(r.data.payload);
    }
  }catch(e){ console.error('Não foi possível atualizar a ordem antes de abrir:', e); }
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  if(currentUser.nivel==='oficina'){
    openEditModalOficina(order);
  } else {
    openEditModalCompleto(order, { somenteLeitura: !!somenteLeitura });
  }
}

/**
 * Rastreamento simples de onde a peça está fisicamente: na loja ou enviada para a fábrica
 * (fabricação/laser/conserto externo). Qualquer nível com acesso à ordem pode alternar
 * (inclusive a oficina, que normalmente só vê observações — essa é a exceção proposital,
 * já que é quem mais lida com o envio/retorno da fábrica no dia a dia).
 * A troca já salva na hora (não depende do botão "Salvar alterações" do resto do formulário).
 */
function mountLocalizacao(container, order, somenteLeitura){
  function draw(){
    const naFabrica = order.localAtual === 'fabrica';
    const hist = (order.historicoLocal||[]).slice(-5).reverse();
    container.innerHTML = `
      <div class="section-label" style="margin-top:14px;">Localização da peça</div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="badge" style="background:${naFabrica?'var(--wait-soft)':'var(--ok-soft)'}; color:${naFabrica?'var(--wait)':'var(--ok)'};">
          ${naFabrica ? '🏭 Na fábrica' : '📍 Na loja'}
        </span>
        ${somenteLeitura ? '' : `<button type="button" class="btn btn-ghost btn-sm" id="btnToggleLocal">${naFabrica ? 'Registrar retorno para a loja' : 'Enviar para a fábrica'}</button>`}
      </div>
      ${hist.length ? `
        <div class="muted" style="margin-top:8px; font-size:12px;">
          ${hist.map(h=>`${h.local==='fabrica'?'🏭 Enviado para a fábrica':'📍 Retornou para a loja'} — ${fmtDate(new Date(h.em).toISOString().slice(0,10))} por ${escapeHtml(h.por||'—')}`).join('<br>')}
        </div>
      ` : ''}
    `;
    if(!somenteLeitura){
      const btn = container.querySelector('#btnToggleLocal');
      btn.addEventListener('click', async ()=>{
        order.localAtual = naFabrica ? 'loja' : 'fabrica';
        if(!order.historicoLocal) order.historicoLocal = [];
        order.historicoLocal.push({ local: order.localAtual, em: Date.now(), por: currentUser.nome });
        await saveOrders();
        showToast(order.localAtual==='fabrica' ? 'Marcado como enviado para a fábrica.' : 'Marcado como retornado para a loja.');
        draw();
      });
    }
  }
  draw();
}

/* ── PERMISSÃO POR LOJA ──────────────────────────────────────────────────────
   Diretoria e gerente editam qualquer ordem. Demais perfis editam apenas
   ordens da loja ativa; ordens de outra loja abrem em modo somente leitura.
   ──────────────────────────────────────────────────────────────────────────── */
function ehGestaoLoja(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
function podeEditarRegistro(reg){
  if(!currentUser || !reg) return false;
  if(ehGestaoLoja()) return true;
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return false;
  return (reg.lojaId||null) === lojaAtiva;
}
function motivoSemEdicao(reg){
  if(ehGestaoLoja()) return '';
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return 'Selecione uma loja no topo para editar.';
  const l = (config.lojas||[]).find(x=>x.id===(reg&&reg.lojaId));
  return 'Esta ordem é da loja ' + (l ? l.nome : 'outra') + ' — você pode visualizar e imprimir, mas não editar.';
}

        order.cpf = clienteFinal.cpf || '';

    const email = document.getElementById('e_email').value.trim();

    const dataNascimento = document.getElementById('e_nascimento').value;
    const cep = document.getElementById('e_cep').value.trim();
    const endereco = maiusc(document.getElementById('e_endereco').value);
    const numero = maiusc(document.getElementById('e_numero').value);
    const complemento = maiusc(document.getElementById('e_complemento').value);

    const estado = maiusc(document.getElementById('e_estado').value);
    const via = document.getElementById('e_via').value.trim();
    const vendedora = document.getElementById('e_vendedora').value.trim();
    const descricao = maiusc(document.getElementById('e_descricao').value);
    const loja = document.getElementById('e_loja').value;
    const status = document.getElementById('e_status').value;
    const sid = servicoSel.value;
    const dt = dataInp.value;

    if(status !== 'rascunho' && (!cliente || !telefone || !vendedora || !loja || !sid || !dt)){
      showToast('Preencha todos os campos obrigatórios.');
      return;
    }
    if(status === 'rascunho' && !cliente){
      showToast('Informe ao menos o nome do cliente.');
      return;
    }
    if(status !== 'rascunho'){
      const erroNota = notaEmpresasErro(order);
      if(erroNota){
        showToast(erroNota);
        return;
      }
    }
    // Cancelamento pedido pelo dropdown de status desta tela (via alternativa ao
    // botão "Cancelar O.S." da lista): exige motivo e reverte fiado/crédito igual.
    if(status === 'cancelado' && order.status !== 'cancelado'){
      if(!podeCancelarOrdem()){ showToast('Só gerente ou diretoria podem cancelar uma O.S.'); return; }
      const motivo = (prompt('Motivo do cancelamento (obrigatório):')||'').trim();
      if(!motivo){ showToast('Cancelamento não confirmado: motivo não informado.'); return; }
      await aplicarCancelamentoOrdem(order, motivo);
      await saveOrders();
      closeModal();
      showToast('O.S. cancelada.');
      renderView();
      return;
    }
    let recebidoPor = order.recebidoPor || null;
    let recebidoEm = order.recebidoEm || null;
    if(status === 'entregue'){
      recebidoPor = maiusc(document.getElementById('e_recebidoPor').value);
      if(!recebidoPor){
        showToast('Informe quem recebeu o produto.');
        return;
      }
      if(order.status !== 'entregue') recebidoEm = Date.now();
    }

    let encaixe = order.encaixe;
    let autorizadoPor = order.autorizadoPor;

    if(status !== 'rascunho' && !sameAsOriginal()){
      const res = checkSlot(sid, dt, order.id);
      if(!res.ok){
        const codigoDigitado = document.getElementById('e_codigo').value.trim().toUpperCase();
        if(!codigoDigitado){
          showToast('Informe o código de autorização para concluir a alteração.');
          return;
        }
        // Recarrega os códigos direto do banco (quem gerou pode estar em outra sessão/dispositivo).
        codes = await storageGet('codes', true) || [];
        const codeObj = codes.find(c=>c.codigo === codigoDigitado && !c.usado);
        if(!codeObj){
          showToast('Código inválido ou já utilizado.');
          return;
        }
        codeObj.usado = true;
        codeObj.usadoEm = Date.now();
        encaixe = true;
        autorizadoPor = codeObj.autorizadoPor;
        await saveCodes();
      } else {
        encaixe = false;
        autorizadoPor = null;
      }
    }

    const st = config.serviceTypes.find(s=>s.id===sid);
    Object.assign(order, {
      cliente, telefone, email, cpf, dataNascimento, cep, endereco, numero, complemento, bairro, cidade, estado,
      via, vendedora, descricao, lojaId: loja, status,
      serviceTypeId: sid, serviceTypeName: st?st.nome:'', data: dt,
      encaixe, autorizadoPor, recebidoPor, recebidoEm,
    });
    await saveOrders();
    await upsertClienteFromOrder({ cliente, telefone, email, cpf, dataNascimento, cep, endereco, numero, complemento, bairro, cidade, estado });
    closeModal();
    showToast('Ordem atualizada.');
    renderView();
  });
}

function renderPainel(main){

  function renderProntosCard(){

        <div style="display:flex; flex-direction:column; gap:8px;">

            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 12px; flex-wrap:wrap;">
              <div style="font-size:13px;">
                <b>${escapeHtml(o.cliente)}</b>
                <span class="muted"> · ${escapeHtml(o.serviceTypeName)} · ${escapeHtml(nomeLojaOrder(o))} · agendado ${fmtDate(o.data)}</span>
              </div>
              ${currentUser.nivel!=='oficina' ? `
              <div style="display:flex; gap:6px;">
                <button class="icon-btn icon-btn-wa" data-prontowa="${o.id}" title="Enviar WhatsApp">${waIconSvg()}</button>
                <button class="icon-btn" data-prontomail="${o.id}" title="Enviar e-mail">✉️</button>

    });
    card.querySelectorAll('[data-prontomail]').forEach(b=>{

    });

  const fServico = document.getElementById('filtroServico');
  const fLoja = document.getElementById('filtroLoja');
  const fLocal = document.getElementById('filtroLocal');
  const fStatus = document.getElementById('filtroStatus');
  const fData = document.getElementById('filtroData');
  const fBusca = document.getElementById('filtroBusca');
  const fSemPagamento = document.getElementById('filtroSemPagamento');

  function renderTable(){
    renderProntosCard();
    let list = [...orders];
    if(currentUser.nivel==='oficina'){
      list = list.filter(o=>o.status!=='rascunho');
    }
    if(fStatus.value){
      list = list.filter(o=>o.status===fStatus.value);
    } else {
      list = list.filter(o=>o.status!=='entregue' && o.status!=='rascunho');
    }
    if(fServico.value) list = list.filter(o=>o.serviceTypeId===fServico.value);
    if(fLoja.value) list = list.filter(o=>o.lojaId===fLoja.value);
    if(fLocal.value) list = list.filter(o=>(o.localAtual||'loja')===fLocal.value);
    if(fData.value) list = list.filter(o=>o.data===fData.value);
    if(fBusca.value.trim()) {
      const q = fBusca.value.trim().toLowerCase();
      list = list.filter(o=>o.cliente.toLowerCase().includes(q));
    }
    if(fSemPagamento.checked) list = list.filter(o=>semPagamentoLancado(o));
    list.sort((a,b)=> a.data.localeCompare(b.data) || b.criadoEm-a.criadoEm );

    const totalRecebido = list.reduce((acc,o)=> acc + valorRecebidoDe(o), 0);
    const totalAReceber = list.reduce((acc,o)=> acc + valorAReceberDe(o), 0);
    const semPagCount = list.filter(o=>semPagamentoLancado(o)).length;
    document.getElementById('resumoValores').innerHTML =
      `Nesta lista: <b style="color:var(--ok);">Recebido R$ ${totalRecebido.toFixed(2)}</b> · <b style="color:var(--danger);">A receber R$ ${totalAReceber.toFixed(2)}</b>` +
      (semPagCount>0 ? ` · <b style="color:var(--danger);">${semPagCount} sem pagamento lançado</b>` : '');

    const wrap = document.getElementById('tabelaWrap');
    if(list.length===0){
      wrap.innerHTML = `<div class="empty">Nenhuma ordem encontrada com esses filtros.</div>`;
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Cliente</th><th>Telefone</th><th>Via</th><th>Vendedora</th><th>Loja</th>
            <th>Serviço</th><th>Data</th><th>Recebido</th><th>A receber</th><th>Status</th><th>Ações</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(o=>rowHtml(o)).join('')}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll('select.status-select').forEach(sel=>{
      applyStatusClass(sel);
      sel.addEventListener('change', async ()=>{
        const ord = orders.find(o=>o.id===sel.dataset.id);
        const previous = ord.status;
        if(sel.value === 'entregue'){
          promptRecebidoPor(async (nome)=>{
            ord.status = 'entregue';
            ord.recebidoPor = nome;
            ord.recebidoEm = Date.now();
            await saveOrders();
            showToast('Ordem marcada como entregue para ' + nome + '.');
            renderTable();
          }, ()=>{ sel.value = previous; applyStatusClass(sel); });
          return;
        }
        if(sel.value === 'cancelado' && previous !== 'cancelado'){
          if(!podeCancelarOrdem()){ showToast('Só gerente ou diretoria podem cancelar uma O.S.'); sel.value = previous; applyStatusClass(sel); return; }
          const motivo = (prompt('Motivo do cancelamento (obrigatório):')||'').trim();
          if(!motivo){ showToast('Cancelamento não confirmado: motivo não informado.'); sel.value = previous; applyStatusClass(sel); return; }
          await aplicarCancelamentoOrdem(ord, motivo);
          await saveOrders();
          showToast('O.S. cancelada.');
          renderTable();
          return;
        }
        ord.status = sel.value;
        await saveOrders();
        applyStatusClass(sel);
        showToast('Status atualizado para "' + statusLabel(sel.value) + '". ' + (sel.value!=='aguardando' ? 'Vaga liberada.' : ''));
        renderTable();
      });
    });
    wrap.querySelectorAll('[data-wa]').forEach(b=>{
      b.addEventListener('click', ()=> sendWhatsApp(orders.find(x=>x.id===b.dataset.wa)) );
    });
    wrap.querySelectorAll('[data-mail]').forEach(b=>{
      b.addEventListener('click', ()=> sendEmail(orders.find(x=>x.id===b.dataset.mail)) );
    });
    wrap.querySelectorAll('[data-view]').forEach(b=>{
      b.addEventListener('click', ()=> openEditModal(b.dataset.view, true) );
    });
    wrap.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=> openEditModal(b.dataset.edit, false) );
    });
    wrap.querySelectorAll('[data-print]').forEach(b=>{
      b.addEventListener('click', ()=> printOrder(orders.find(x=>x.id===b.dataset.print)) );
    });
  }

  function rowHtml(o){
    const pendObs = (o.observacoes||[]).some(ob=>!ob.ciente && ob.notificarPara && ob.notificarPara.length>0);
    const isRascunho = o.status === 'rascunho';
    const semPag = semPagamentoLancado(o);
    const recebido = valorRecebidoDe(o);
    const aReceber = valorAReceberDe(o);
    return `
      <tr>
        <td><b>${escapeHtml(o.cliente)}</b>${isRascunho ? `<div class="badge rascunho-badge" style="margin-top:4px;">📝 Rascunho</div>` : ''}${o.encaixe ? `<div class="badge badge-encaixe" style="margin-top:4px;" title="Autorizado por ${escapeHtml(o.autorizadoPor||'')}">Encaixe</div>` : ''}${pendObs ? `<div class="badge badge-flag" style="margin-top:4px;">⚠ Observação pendente</div>` : ''}${semPag && o.status!=='cancelado' ? `<div style="margin-top:4px; color:var(--danger); font-weight:700; font-size:11.5px;">⚠ Sem pagamento lançado</div>` : ''}${o.numeroNota ? `<div class="muted" style="margin-top:4px;">Nota ${escapeHtml(o.numeroNota)}</div>` : ''}${o.status==='entregue' ? `<div class="muted" style="margin-top:4px;">Recebido por ${escapeHtml(o.recebidoPor||'—')}</div>` : ''}</td>
        <td>${escapeHtml(o.telefone)}</td>
        <td>${escapeHtml(o.via)}</td>
        <td>${escapeHtml(o.vendedora)}</td>
        <td><span class="badge badge-loja">${escapeHtml(nomeLojaOrder(o))}</span>${o.localAtual==='fabrica' ? `<div class="badge" style="margin-top:4px; background:var(--wait-soft); color:var(--wait);">🏭 Fábrica</div>` : ''}</td>
        <td>${escapeHtml(o.serviceTypeName)}</td>
        <td>${fmtDate(o.data)}</td>
        <td style="color:var(--ok); white-space:nowrap;">R$ ${recebido.toFixed(2)}</td>
        <td style="${aReceber>0?'color:var(--danger); font-weight:700;':''} white-space:nowrap;">R$ ${aReceber.toFixed(2)}</td>
        <td>
          ${isRascunho
            ? `<span class="badge rascunho-badge">📝 Rascunho</span>`
            : currentUser.nivel==='oficina'
              ? `<span class="badge" style="background:${statusBg(o.status)}; color:${statusFg(o.status)};">${statusLabel(o.status)}</span>`
              : `<select class="status-select" data-id="${o.id}">
                  <option value="aguardando" ${o.status==='aguardando'?'selected':''}>Aguardando</option>
                  <option value="pronto" ${o.status==='pronto'?'selected':''}>Pronto</option>
                  <option value="entregue" ${o.status==='entregue'?'selected':''}>Entregue</option>
                  <option value="cancelado" ${o.status==='cancelado'?'selected':''}>Cancelado</option>
                </select>`
          }
        </td>
        <td style="white-space:nowrap;">
          <button class="icon-btn" data-view="${o.id}" title="Ver detalhes (somente leitura)">👁</button>
          <button class="icon-btn" data-edit="${o.id}" title="Editar ordem">✎</button>
          <button class="icon-btn" data-print="${o.id}" title="Imprimir ordem">🖨️</button>
          ${currentUser.nivel!=='oficina' ? `
          <button class="icon-btn icon-btn-wa" data-wa="${o.id}" title="Enviar WhatsApp">${waIconSvg()}</button>
          <button class="icon-btn" data-mail="${o.id}" title="Enviar e-mail">✉️</button>
          ` : ''}
        </td>

  [fServico,fLoja,fLocal,fStatus,fData,fBusca,fSemPagamento].forEach(el=>el.addEventListener('input', renderTable));
  document.getElementById('btnLimparFiltro').addEventListener('click', ()=>{
    fServico.value=''; fLoja.value=''; fLocal.value=''; fStatus.value=''; fData.value=''; fBusca.value=''; fSemPagamento.checked=false;
    if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id) fLoja.value = window.__lojaAtual.id;
    renderTable();
  });

  const btnNovoPedido = document.getElementById('btnNovoPedidoPainel');
  if(btnNovoPedido) btnNovoPedido.addEventListener('click', ()=>{ modoNovaOrdem = true; renderView(); });

  const restringirPorLojaAtiva = currentUser && (currentUser.nivel==='vendedora' || currentUser.nivel==='oficina');
  if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id){
    fLoja.value = window.__lojaAtual.id;
    fLoja.disabled = true;
    fLoja.title = 'Filtrando pela loja ativa — pra ver outra loja, troque em "Loja" no menu.';
  }
  renderTable();
}
function applyStatusClass(sel){
  sel.className = 'status-select status-' + sel.value;
}
function statusBg(s){ return s==='aguardando' ? 'var(--wait-soft)' : s==='pronto' ? 'var(--ok-soft)' : s==='entregue' ? 'var(--delivered-soft)' : 'var(--danger-soft)'; }
function statusFg(s){ return s==='aguardando' ? 'var(--wait)' : s==='pronto' ? 'var(--ok)' : s==='entregue' ? 'var(--delivered)' : 'var(--danger)'; }

   AGENDA
   ============================================================ */
function renderAgenda(main){
  const now = new Date();
  if(agendaYear===undefined){ agendaYear = now.getFullYear(); agendaMonth = now.getMonth(); }

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Agenda</h1>
        <p class="page-sub">Visualize todos os lançamentos do mês e veja rapidamente onde ainda há vaga.</p>
      </div>
    </div>
    <div class="card">
      <div class="agenda-head">
        <div class="agenda-nav">
          <button class="icon-btn" id="agPrev">‹</button>
          <div class="agenda-month" id="agMonthLabel"></div>
          <button class="icon-btn" id="agNext">›</button>
          <button class="btn btn-ghost btn-sm" id="agToday">Hoje</button>
        </div>
        <div class="agenda-legend" id="agLegend"></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  `;

  document.getElementById('agLegend').innerHTML = config.serviceTypes.map(s=>`
    <span class="legend-item"><span class="legend-dot" style="background:${serviceColor(s.id)}"></span>${escapeHtml(s.nome)}</span>
  `).join('');

  document.getElementById('agPrev').addEventListener('click', ()=>{
    agendaMonth--; if(agendaMonth<0){agendaMonth=11; agendaYear--;} drawCalendar();
  });
  document.getElementById('agNext').addEventListener('click', ()=>{
    agendaMonth++; if(agendaMonth>11){agendaMonth=0; agendaYear++;} drawCalendar();
  });
  document.getElementById('agToday').addEventListener('click', ()=>{
    agendaYear = now.getFullYear(); agendaMonth = now.getMonth(); drawCalendar();
  });

  function drawCalendar(){
    const label = new Date(agendaYear, agendaMonth, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    document.getElementById('agMonthLabel').textContent = label;

    const grid = document.getElementById('calGrid');
    const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');

    const firstDow = new Date(agendaYear, agendaMonth, 1).getDay();
    const daysInMonth = new Date(agendaYear, agendaMonth+1, 0).getDate();
    const todayIso = todayStr();

    for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty-cell"></div>`;

    for(let d=1; d<=daysInMonth; d++){
      const iso = `${agendaYear}-${String(agendaMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayOrders = orders.filter(o=>o.data===iso && o.status!=='entregue');
      const byService = {};
      dayOrders.forEach(o=>{
        if(!byService[o.serviceTypeId]) byService[o.serviceTypeId] = { aguardando:0, total:0, nome:o.serviceTypeName };
        byService[o.serviceTypeId].total++;
        if(o.status===STATUS.AGUARDANDO) byService[o.serviceTypeId].aguardando++;
      });
      const chips = Object.keys(byService).slice(0,3).map(sid=>{
        const st = config.serviceTypes.find(s=>s.id===sid);
        const max = st ? st.maxPorDia : '?';
        const info = byService[sid];
        const over = st && info.aguardando > st.maxPorDia;
        return `<span class="cal-chip ${over?'over':''}" style="background:${serviceColor(sid)}">
          <span>${escapeHtml((st?st.nome:info.nome).slice(0,10))}</span><span>${info.aguardando}/${max}</span>
        </span>`;
      }).join('');
      const extra = Object.keys(byService).length > 3 ? `<div class="cal-more">+${Object.keys(byService).length-3} serviço(s)</div>` : '';

      html += `
        <div class="cal-cell ${iso===todayIso?'today':''}" data-day="${iso}">
          <div class="cal-daynum">${d}</div>
          ${chips}
          ${extra}
        </div>
      `;
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
      cell.addEventListener('click', ()=> openDayModal(cell.dataset.day) );
    });
  }
  drawCalendar();
}

function openDayModal(iso){
  const dayOrders = orders.filter(o=>o.data===iso && o.status!=='entregue').sort((a,b)=>a.serviceTypeName.localeCompare(b.serviceTypeName));
  const capacityRows = config.serviceTypes.map(s=>{
    const res = checkSlot(s.id, iso, null);
    return `<div class="legend-item" style="margin-bottom:4px;">
      <span class="legend-dot" style="background:${serviceColor(s.id)}"></span>
      ${escapeHtml(s.nome)}: <b style="margin-left:3px;">${res.ocupadas}/${res.vagas}</b>
      ${res.ok ? '' : '<span class="badge" style="background:var(--wait-soft); color:var(--wait); margin-left:6px;">lotado/fora do prazo</span>'}
    </div>`;
  }).join('');

  openModal(`
    <h3>${fmtDate(iso)}</h3>
    <p>${dayOrders.length} ordem(ns) lançada(s) neste dia.</p>
    <div class="section-label">Ocupação por serviço</div>
    <div style="margin-bottom:16px;">${capacityRows}</div>
    <div class="section-label">Ordens do dia</div>
    ${dayOrders.length===0 ? '<div class="empty">Nenhuma ordem lançada.</div>' : dayOrders.map(o=>`
      <div class="day-order-item">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b>${escapeHtml(o.cliente)}</b>
          <span class="badge" style="background:${serviceColor(o.serviceTypeId)}22; color:${serviceColor(o.serviceTypeId)};">${escapeHtml(o.serviceTypeName)}</span>
        </div>
        <div class="muted" style="margin-top:2px;">Loja ${escapeHtml(nomeLojaOrder(o))} · Vendedora ${escapeHtml(o.vendedora)} · Status ${statusLabel(o.status)}${o.encaixe?' · Encaixe':''}</div>
      </div>
    `).join('')}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dayClose">Fechar</button>
    </div>
  `);
  document.getElementById('dayClose').addEventListener('click', closeModal);
}

function renderGerarCodigo(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Gerar código de autorização</h1>
        <p class="page-sub">Use este código para liberar um lançamento fora do prazo ou da quantidade permitida. Cada código é de uso único.</p>
      </div>
    </div>
    <div class="card">
      <div class="section-label">Novo código</div>
      <div class="grid-2">
        <div class="field"><label>Quem autorizou</label><select id="c_autorizador">${funcionarioOptionsOficinaOuDiretoriaHtml('')}</select></div>
        <div style="display:flex; align-items:flex-end;"><button class="btn btn-accent btn-block" id="btnGerarCodigo">Gerar código</button></div>
      </div>
      <div id="codeResult"></div>
    </div>
    <div class="card">
      <div class="section-label">Códigos gerados</div>
      <div id="codeHistory"></div>
    </div>
  `;

  document.getElementById('btnGerarCodigo').addEventListener('click', async ()=>{
    const nome = maiusc(document.getElementById('c_autorizador').value);
    if(!nome){ showToast('Informe quem está autorizando.'); return; }
    const codigo = Array.from({length:6}, ()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
    const obj = { codigo, autorizadoPor: nome, nivelGerador: currentUser.nivel, geradoPor: currentUser.nome, criadoEm: Date.now(), usado:false };
    codes.unshift(obj);
    await saveCodes();
    document.getElementById('c_autorizador').value = '';
    document.getElementById('codeResult').innerHTML = `
      <div class="slot-banner slot-ok" style="align-items:center;">
        <span class="dot"></span>
        <div>Código gerado: <span class="code-chip">${codigo}</span><button type="button" class="copy-btn" id="btnCopyCodeNovo">📋 Copiar</button> — repasse para a vendedora concluir o lançamento.</div>
      </div>
    `;
    document.getElementById('btnCopyCodeNovo').addEventListener('click', ()=> copyToClipboard(codigo));
    renderCodeHistory();
  });

  function renderCodeHistory(){
    const wrap = document.getElementById('codeHistory');
    if(codes.length===0){ wrap.innerHTML = `<div class="empty">Nenhum código gerado ainda.</div>`; return; }
    wrap.innerHTML = codes.slice(0,25).map(c=>`
      <div class="code-list-item">
        <div>
          <span class="cl-code">${c.codigo}</span>
          <button type="button" class="copy-btn" data-copyhist="${c.codigo}">📋 Copiar</button>
          <span class="muted" style="margin-left:10px;">autorizado por ${escapeHtml(c.autorizadoPor)}</span>
        </div>
        <div class="badge" style="background:${c.usado ? 'var(--danger-soft)' : 'var(--ok-soft)'}; color:${c.usado ? 'var(--danger)' : 'var(--ok)'};">
          ${c.usado ? 'Utilizado' : 'Disponível'}
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-copyhist]').forEach(b=>{
      b.addEventListener('click', ()=> copyToClipboard(b.dataset.copyhist));
    });
  }
  renderCodeHistory();
  (async ()=>{
    codes = await storageGet('codes', true) || codes;
    renderCodeHistory();
  })();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'os' }, '*');
    return;
  }
  const hint = document.getElementById('loginHint');
  if(hint) hint.innerHTML = 'Use a mesma senha do restante do sistema.';
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
