<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Ordens — Gestão e Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --surface-2:#F5F7F9;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --ink-faint:#8B93A1;
    --line:#DBE0E6;
    --line-strong:#C3CAD2;
    --accent:#C97A2B;
    --accent-ink:#7A4415;
    --accent-soft:#FBE9D4;
    --ok:#2E7D53;
    --ok-soft:#E1F3E8;
    --danger:#B23A3A;
    --danger-soft:#FBE4E4;
    --wait:#B4780F;
    --wait-soft:#FCEEDD;
    --encaixe:#6E45A8;
    --encaixe-soft:#EEE6F7;
    --delivered:#2A5FA8;
    --delivered-soft:#E3ECFA;
    --radius:10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;cursor:pointer;}
  input, select, textarea{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #view-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 18% 20%, rgba(201,122,43,0.09), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(110,69,168,0.07), transparent 40%),
      var(--bg);
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 32px 30px;
    box-shadow:0 1px 3px rgba(20,30,45,0.06), 0 12px 32px -18px rgba(20,30,45,0.25);
    position:relative;
  }
  .login-tag{
    position:absolute;
    top:-11px; left:28px;
    background:var(--accent);
    color:#fff;
    font-size:10.5px;
    letter-spacing:.09em;
    font-weight:700;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
  }
  .hub-back-link{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:14px;
  }
  .hub-back-link:hover{color:var(--accent-ink); text-decoration:underline;}
  .hub-back-link-dark{
    color:rgba(255,255,255,0.65);
    margin-bottom:0;
    font-size:16px;
    padding:2px 2px 2px 0;
  }
  .hub-back-link-dark:hover{color:#fff;}
  .login-title{
    font-size:20px;
    font-weight:750;
    letter-spacing:-0.01em;
    margin:6px 0 2px;
  }
  .login-sub{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 26px;
    line-height:1.5;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea, textarea.plain-input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    font-size:14.5px;
    color:var(--ink);
    background:var(--surface-2);
    outline:none;
    transition:border-color .12s, background .12s;
  }
  .field textarea, textarea.plain-input{resize:vertical; min-height:120px; line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus, textarea.plain-input:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:14px;
    font-weight:650;
    transition:filter .1s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-accent:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-wa{background:#25D366; color:#08380F;}
  .btn-wa:hover{filter:brightness(1.05);}
  .btn-mail{background:var(--ink); color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .login-error{
    background:var(--danger-soft);
    color:var(--danger);
    font-size:13px;
    padding:9px 12px;
    border-radius:7px;
    margin-bottom:14px;
    display:none;
  }
  .login-hint{
    margin-top:18px;
    font-size:11.5px;
    color:var(--ink-faint);
    line-height:1.5;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }

  /* ---------- APP SHELL ---------- */
  #view-app{display:none; min-height:100vh;}
  header.topbar{
    background:var(--ink);
    color:#fff;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    height:58px;
    position:sticky; top:0; z-index:40;
  }
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand-mark{
    width:28px;height:28px;border-radius:7px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-weight:800;
    font-size:13px;
    color:#241203;
    flex-shrink:0;
  }
  .brand-name{font-weight:750; font-size:15px; letter-spacing:-0.01em; white-space:nowrap;}
  nav.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.62);
    font-size:13.5px;
    font-weight:600;
    padding:8px 13px;
    border-radius:7px;
    transition:background .12s, color .12s;
    white-space:nowrap;
    flex-shrink:0;
  }
  nav.tabs button:hover{color:#fff; background:rgba(255,255,255,0.07);}
  nav.tabs button.active{color:#fff; background:rgba(255,255,255,0.14);}
  .who{
    display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:rgba(255,255,255,0.7);
    flex-shrink:0;
  }
  .who b{color:#fff; font-weight:650;}
  .level-pill{
    font-size:10px; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
    background:rgba(255,255,255,0.12); color:#fff;
    white-space:nowrap;
  }
  main{
    max-width:1180px;
    margin:0 auto;
    padding:26px 22px 60px;
  }
  .page-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:20px; gap:16px; flex-wrap:wrap;
  }
  .page-title{font-size:21px; font-weight:750; letter-spacing:-0.01em; margin:0 0 4px;}
  .page-sub{font-size:13px; color:var(--ink-soft); margin:0;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
  }
  .card + .card{margin-top:16px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

  /* ---------- MOBILE NAV ---------- */
  .mobile-tabbar{
    display:none;
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--ink);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -6px 18px rgba(10,14,20,0.22);
    gap:2px;
  }
  .mobile-tabbar button{
    background:transparent; border:none; color:rgba(255,255,255,0.6);
    font-size:10px; font-weight:650; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 4px; border-radius:9px; flex:1; min-width:0;
  }
  .mobile-tabbar button .mt-icon{font-size:17px; line-height:1;}
  .mobile-tabbar button.active{color:#fff; background:rgba(255,255,255,0.14);}

  @media (max-width:720px){
    .grid-2, .grid-3{grid-template-columns:1fr;}
    nav.tabs{display:none;}
    header.topbar{padding:0 14px; height:54px;}
    .brand-name{display:none;}
    main{padding:18px 14px 84px;}
    .mobile-tabbar{display:flex;}
    .card{padding:16px;}
    .page-title{font-size:18px;}
    table{font-size:12.5px;}
    .modal{padding:18px; max-width:100%;}
    .cal-grid{gap:4px;}
    .cal-cell{min-height:64px; padding:4px 3px 5px;}
    .cal-chip{font-size:9px; padding:2px 4px;}
    .cal-daynum{font-size:10px;}
    .agenda-month{min-width:0; font-size:14px;}
    .foto-thumb{width:64px; height:64px;}
  }
  @media (max-width:420px){
    .who{gap:6px;}
    .level-pill{display:none;}
    .login-card{padding:28px 22px 24px;}
  }

  .section-label{
    font-size:11px; font-weight:750; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 12px;
  }
  .divider-nova{height:1px;background:var(--line);margin:18px 0;}
  .rascunho-badge{background:#EDEFF2;color:#6B7280;}
  .copy-btn{border:none;background:var(--surface-2);color:var(--ink-soft);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:8px;}
  .copy-btn:hover{background:#fff;color:var(--ink);}

  .slot-banner{
    border-radius:9px; padding:13px 14px; font-size:13.5px; line-height:1.5;
    margin:14px 0 4px; display:flex; gap:10px; align-items:flex-start;
  }
  .slot-ok{background:var(--ok-soft); color:#1E5A3B;}
  .slot-bad{background:var(--wait-soft); color:var(--accent-ink);}
  .slot-banner .dot{width:8px;height:8px;border-radius:50%; margin-top:5px; flex-shrink:0;}
  .slot-ok .dot{background:var(--ok);}
  .slot-bad .dot{background:var(--wait);}

  .ticket{
    position:relative;
    background:
      radial-gradient(circle at 0 50%, transparent 8px, var(--surface) 8.5px) left / 16px 100%,
      radial-gradient(circle at 100% 50%, transparent 8px, var(--surface) 8.5px) right / 16px 100%;
    background-repeat:no-repeat;
    border:1px dashed var(--line-strong);
    border-radius:14px;
    padding:22px 26px;
  }

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:750; padding:0 10px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px;
  }
  .badge-encaixe{background:var(--encaixe-soft); color:var(--encaixe);}
  .badge-loja{background:var(--surface-2); color:var(--ink-soft); font-family:var(--mono); white-space:normal; text-align:left; line-height:1.3;}
  select.status-select{
    border:none; border-radius:20px; font-size:11.5px; font-weight:750;
    padding:5px 22px 5px 10px; appearance:none; -webkit-appearance:none;
    background-repeat:no-repeat; background-position:right 8px center; background-size:9px;
    cursor:pointer;
  }
  select.status-aguardando{background-color:var(--wait-soft); color:var(--wait);}
  select.status-pronto{background-color:var(--ok-soft); color:var(--ok);}
  select.status-cancelado{background-color:var(--danger-soft); color:var(--danger);}
  select.status-entregue{background-color:var(--delivered-soft); color:var(--delivered);}

  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    color:var(--ink-soft); margin-right:4px;
  }
  .icon-btn:hover{background:#fff; border-color:var(--line-strong); color:var(--ink);}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-faint); font-size:13.5px;
  }

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filters select, .filters input{
    padding:8px 10px; border:1px solid var(--line-strong); border-radius:7px; font-size:13px;
    background:var(--surface);
  }

  .config-row{
    display:grid; grid-template-columns:1.6fr 0.9fr 0.9fr 0.5fr; gap:10px; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .config-row:last-child{border-bottom:none;}
  .config-row input{padding:7px 9px; border:1px solid var(--line-strong); border-radius:6px; font-size:13px;}
  .muted{color:var(--ink-faint); font-size:12px;}

  .code-chip{
    font-family:var(--mono); font-weight:700; letter-spacing:.06em; font-size:15px;
    background:var(--ink); color:#fff; padding:8px 14px; border-radius:7px; display:inline-block;
  }
  .code-list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
    font-size:13px;
  }
  .code-list-item .cl-code{font-family:var(--mono); font-weight:700; letter-spacing:.04em;}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:200; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,25,35,0.45); display:none;
    align-items:center; justify-content:center; z-index:150; padding:20px; overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:12px; padding:24px; width:100%; max-width:480px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 6px; font-size:16px;}
  .modal p{margin:0 0 16px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}

  .locked-note{
    display:flex; gap:10px; align-items:center; background:var(--accent-soft); color:var(--accent-ink);
    padding:11px 13px; border-radius:8px; font-size:13px; margin-bottom:16px;
  }

  /* ---------- AGENDA ---------- */
  .agenda-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .agenda-nav{display:flex; align-items:center; gap:10px;}
  .agenda-month{font-size:16px; font-weight:750; min-width:170px; text-align:center; text-transform:capitalize;}
  .agenda-legend{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft);}
  .legend-item{display:flex; align-items:center; gap:5px;}
  .legend-dot{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:10.5px; font-weight:750; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); text-align:center; padding-bottom:4px;}
  .cal-cell{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    min-height:88px; padding:6px 6px 8px; display:flex; flex-direction:column; gap:3px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .cal-cell:hover{border-color:var(--line-strong); background:#fff;}
  .cal-cell.empty-cell{background:transparent; border:none; cursor:default;}
  .cal-cell.today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-daynum{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .cal-cell.today .cal-daynum{color:var(--accent-ink);}
  .cal-chip{
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px; color:#fff;
    display:flex; justify-content:space-between; gap:4px; white-space:nowrap; overflow:hidden;
  }
  .cal-chip.over{outline:2px solid var(--danger);}
  .cal-more{font-size:10px; color:var(--ink-faint); font-weight:650; padding-left:2px;}

  .day-order-item{
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .day-order-item:last-child{border-bottom:none;}

  /* ---------- OBSERVAÇÕES / ALERTAS ---------- */
  .obs-item{border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:8px; background:var(--surface);}
  .obs-item.obs-pending{border-color:var(--danger); background:var(--danger-soft);}
  .badge-flag{background:var(--danger-soft); color:var(--danger); font-size:10.5px; margin-top:4px;}
  #alertBar{width:100%;}
  .alert-bar{background:var(--danger-soft); border-bottom:2px solid var(--danger); padding:14px 22px;}
  .alert-inner{max-width:1180px; margin:0 auto;}
  .alert-title{font-weight:750; color:var(--danger); font-size:13px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .alert-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:#fff; border:1px solid var(--danger); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:13px;
  }

  /* ---------- FOTOS ---------- */
  .foto-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .foto-thumb{position:relative; width:74px; height:74px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--surface-2); flex-shrink:0;}
  .foto-thumb img{width:100%; height:100%; object-fit:cover; cursor:pointer; display:block;}
  .foto-del{
    position:absolute; top:2px; right:2px; background:rgba(20,20,20,0.6); color:#fff; border:none;
    border-radius:50%; width:19px; height:19px; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .foto-del:hover{background:rgba(178,58,58,0.85);}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link">← Gestão e Controle</a>
    <div class="login-tag">Ordens de Serviço</div>
    <div class="login-title">Acessar painel</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira com a diretoria.</div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint" id="loginHint"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="view-app">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link hub-back-link-dark" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">OS</div>
      <div class="brand-name">Painel de Ordens</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn" id="btnLogout" title="Sair">⏻</button>
    </div>
  </header>
  <div id="alertBar"></div>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   ESTADO / STORAGE
   ============================================================ */
let config = null;          // { serviceTypes:[], users:[], mensagemPadrao:'' }
let orders = [];
let codes = [];
let clientes = [];
let currentUser = null;     // { id, nome, nivel }
let currentTab = 'nova';
let agendaYear, agendaMonth;

const STATUS = { AGUARDANDO:'aguardando', CANCELADO:'cancelado', PRONTO:'pronto', ENTREGUE:'entregue', RASCUNHO:'rascunho' };
const LOJAS = ['Vilaça Marechal Center', 'Vilaça João Beraldo', 'Vilaça Jardim Norte'];

/**
 * Envia uma foto (data URL) para a pasta "FOTOS" do Google Drive, via Edge Function do Supabase.
 * Retorna { fileId, url } em caso de sucesso, ou lança erro (o chamador deve tratar com fallback).
 */
async function uploadFotoParaDrive(dataUrl, filename){
  const { data, error } = await supabaseClient.functions.invoke('upload-foto-drive', {
    body: { dataUrl, filename }
  });
  if(error) throw error;
  if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
  return data;
}

function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }

function findClienteIndex(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  return clientes.findIndex(c=>
    (tel && onlyDigits(c.telefone) === tel) ||
    (doc && onlyDigitsCpf(c.cpf) === doc)
  );
}

/**
 * Creates/updates a lightweight client record whenever an order is saved with client data.
 * Matches by phone first, then CPF, so the same person isn't duplicated across orders.
 */
async function upsertClienteFromOrder(data){
  if(!data.cliente && !data.telefone) return;
  const idx = findClienteIndex(data.telefone, data.cpf);
  const patch = {
    nome: data.cliente || '',
    telefone: data.telefone || '',
    email: data.email || '',
    endereco: data.endereco || '',
    dataNascimento: data.dataNascimento || '',
    cpf: data.cpf || ''
  };
  if(idx === -1){
    clientes.unshift({ id: uid('cli'), ...patch, criadoEm: Date.now() });
  } else {
    const existing = clientes[idx];
    clientes[idx] = {
      ...existing,
      nome: patch.nome || existing.nome,
      telefone: patch.telefone || existing.telefone,
      email: patch.email || existing.email,
      endereco: patch.endereco || existing.endereco,
      dataNascimento: patch.dataNascimento || existing.dataNascimento,
      cpf: patch.cpf || existing.cpf
    };
  }
  await saveClientes();
}

function buildMessage(order){
  let tpl;
  if(order.status === 'pronto') tpl = config.mensagemPronto || DEFAULT_TEMPLATE_PRONTO;
  else if(order.status === 'entregue') tpl = config.mensagemEntregue || DEFAULT_TEMPLATE_ENTREGUE;
  else tpl = config.mensagemPadrao || DEFAULT_TEMPLATE;
  const notaLinha = order.numeroNota ? `Número da nota: ${order.numeroNota}\n` : '';
  return tpl
    .replaceAll('{status}', statusLabel(order.status))
    .replaceAll('{cliente}', order.cliente || '')
    .replaceAll('{via}', order.via || '')
    .replaceAll('{servico}', order.serviceTypeName || '')
    .replaceAll('{data}', fmtDate(order.data))
    .replaceAll('{loja}', order.loja || '')
    .replaceAll('{vendedora}', order.vendedora || '')
    .replaceAll('{recebidoPor}', order.recebidoPor || '')
    .replaceAll('{nota}', order.numeroNota || '')
    .replaceAll('{notaLinha}', notaLinha);
}
function sendWhatsApp(order){
  const msg = encodeURIComponent(buildMessage(order));
  const url = `https://wa.me/55${onlyDigits(order.telefone)}?text=${msg}`;
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/**
 * mailto: links opened via window.open() are unreliable — many browsers block them as a
 * popup, and inside a sandboxed preview there's often no default mail app to hand off to.
 * This opens a compose modal: it still tries to launch the device's mail app via a real
 * <a href="mailto:..."> click (more reliable than window.open), but also lets the person
 * copy the ready-made message so it works even when no mail client is configured.
 */
function sendEmail(order){
  const subject = `Ordem de serviço - ${order.cliente}`;
  const body = buildMessage(order);
  openEmailComposeModal(order.email || '', subject, body, 'Este cliente não tem e-mail cadastrado. Edite a ordem para adicionar um, ou copie a mensagem abaixo para enviar manualmente.');
}

let photoCache = {};

function compressImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function getPhotoDataUrl(fotoId){
  if(photoCache[fotoId]) return photoCache[fotoId];
  const val = await storageGet('foto:' + fotoId, true);

  return val;
}

/**
 * Mounts a photo attachment widget into `container`, bound to `holder.fotos` (array of {id, nome, criadoEm}).
 * Actual image bytes are stored separately per photo (key "foto:<id>") to keep the main orders record light.
 * `persisted`: true saves the parent orders array to storage after each change (holder is a real order/observation).
 * `readOnly`: true shows thumbnails only, no add/remove controls (used for the oficina view).
 */
function mountFotos(container, holder, persisted, readOnly){
  if(!holder.fotos) holder.fotos = [];

  function draw(){
    container.innerHTML = `
      <div class="section-label" style="margin-top:14px;">Fotos</div>
      <div class="foto-grid" id="fotoGridInner"></div>
      ${readOnly ? '' : `
        <input type="file" accept="image/*" multiple id="fotoInputGaleria" style="display:none;">
        <input type="file" accept="image/*" capture="environment" id="fotoInputCamera" style="display:none;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-ghost btn-sm" id="btnAddFotoGaleria">🖼️ Anexar foto</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnAddFotoCamera">📷 Tirar foto</button>
        </div>
      `}
    `;
    drawGrid();
    if(!readOnly){
      const inpGaleria = container.querySelector('#fotoInputGaleria');
      const inpCamera = container.querySelector('#fotoInputCamera');
      container.querySelector('#btnAddFotoGaleria').addEventListener('click', ()=> inpGaleria.click());
      container.querySelector('#btnAddFotoCamera').addEventListener('click', ()=> inpCamera.click());

      async function processFiles(inputEl){
        const files = Array.from(inputEl.files || []);
        if(files.length===0) return;
        for(const file of files){
          try{
            const dataUrl = await compressImage(file);
            const fotoId = uid('foto');
            let driveResult = null;
            try{
              driveResult = await uploadFotoParaDrive(dataUrl, fotoId + '_' + file.name);
            }catch(driveErr){
              console.error('Falha ao enviar foto para o Google Drive, salvando localmente:', driveErr);
            }
            if(driveResult && driveResult.url){
              holder.fotos.push({ id: fotoId, nome: file.name, criadoEm: Date.now(), driveUrl: driveResult.url, driveFileId: driveResult.fileId });
            }else{
              photoCache[fotoId] = dataUrl;
              await storageSet('foto:' + fotoId, dataUrl, true);
              holder.fotos.push({ id: fotoId, nome: file.name, criadoEm: Date.now() });
            }
          }catch(e){ showToast('Não foi possível processar uma das fotos.'); }
        }
        inputEl.value = '';
        if(persisted) await saveOrders();
        drawGrid();
        showToast('Foto(s) anexada(s).');
      }
      inpGaleria.addEventListener('change', ()=>processFiles(inpGaleria));
      inpCamera.addEventListener('change', ()=>processFiles(inpCamera));
    }
  }

  function drawGrid(){
    const grid = container.querySelector('#fotoGridInner');
    if(holder.fotos.length===0){
      grid.innerHTML = `<div class="muted">Nenhuma foto anexada.</div>`;
      return;
    }
    grid.innerHTML = holder.fotos.map(f=>`
      <div class="foto-thumb" data-fid="${f.id}">
        <img data-fotoimg="${f.id}" src="${escapeHtml(f.driveUrl || photoCache[f.id] || '')}" alt="${escapeHtml(f.nome)}">
        ${readOnly ? '' : `<button type="button" class="foto-del" data-fotodel="${f.id}" title="Remover foto">✕</button>`}
      </div>
    `).join('');
    grid.querySelectorAll('img[data-fotoimg]').forEach(img=>{
      const fid = img.dataset.fotoimg;
      const fObj = holder.fotos.find(x=>x.id===fid);
      if(fObj && fObj.driveUrl){
        img.addEventListener('click', ()=>{ if(img.src) openPhotoModal(img.src); });
        return;
      }
      if(!photoCache[fid]){
        getPhotoDataUrl(fid).then(url=>{ if(url){ img.src = url; } });
      }
      img.addEventListener('click', ()=>{ if(img.src) openPhotoModal(img.src); });
    });
    if(!readOnly){
      grid.querySelectorAll('[data-fotodel]').forEach(b=>{
        b.addEventListener('click', async (e)=>{
          e.stopPropagation();
          holder.fotos = holder.fotos.filter(x=>x.id!==b.dataset.fotodel);
          if(persisted) await saveOrders();
          drawGrid();
        });
      });
    }
  }

  draw();
}

function mountFotosInline(container, fotosArray){

  container.innerHTML = fotosArray.map(f=>`

      <img data-fotoimg="${f.id}" src="${escapeHtml(f.driveUrl || photoCache[f.id] || '')}" alt="${escapeHtml(f.nome)}">
    </div>
  `).join('');
  container.querySelectorAll('img[data-fotoimg]').forEach(img=>{

    const fObj = fotosArray.find(x=>x.id===fid);
    if(fObj && fObj.driveUrl){
      img.addEventListener('click', ()=>{ if(img.src) openPhotoModal(img.src); });
      return;

    if(!photoCache[fid]){

  });
}

function mountPagamentos(container, holder){

  function draw(){
    container.innerHTML = `
      <div class="section-label" style="margin-top:14px;">Pagamento</div>

      <div class="grid-2" style="margin-bottom:6px;">
        <select data-pagform="${i}">${(config.paymentTypes||[]).map(pt=>`<option value="${pt.id}" ${p.formaId===pt.id?'selected':''}>${escapeHtml(pt.nome)}</option>`).join('')}</select>
        <div style="display:flex; gap:6px;">
          <input type="number" step="0.01" min="0" data-pagvalor="${i}" placeholder="Valor" value="${p.valor!==undefined && p.valor!==null && p.valor!=='' ? p.valor : ''}" style="flex:1;">
          <button type="button" class="icon-btn" data-pagdel="${i}" title="Remover">✕</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-pagform]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ holder.pagamentos[Number(sel.dataset.pagform)].formaId = sel.value; });
    });
    wrap.querySelectorAll('[data-pagvalor]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        holder.pagamentos[Number(inp.dataset.pagvalor)].valor = inp.value === '' ? '' : parseFloat(inp.value);
        updateHint();
      });
    });
    wrap.querySelectorAll('[data-pagdel]').forEach(b=>{
      b.addEventListener('click', ()=>{
        holder.pagamentos.splice(Number(b.dataset.pagdel),1);
        drawRows();
        updateHint();
      });
    });
    updateHint();
  }

  function updateHint(){
    const hint = container.querySelector('#pagSomaHint');
    if(!hint) return;
    if(holder.pagamentos.length === 0){ hint.textContent = ''; return; }
    const soma = holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
    const total = Number(holder.valorTotal)||0;
    if(Math.abs(soma - total) > 0.009){
      hint.innerHTML = `<span style="color:var(--danger);">Soma dos pagamentos (R$ ${soma.toFixed(2)}) diferente do valor total (R$ ${total.toFixed(2)}).</span>`;
    }else{
      hint.innerHTML = `<span style="color:var(--ok);">Soma dos pagamentos confere com o valor total (R$ ${total.toFixed(2)}).</span>`;
    }
  }

  draw();
}

 * onCancel fires if the modal is dismissed (Cancelar button OR clicking outside),

 */

  modalOnClose = onCancel || null;

function renderAlerts(){
  const bar = document.getElementById('alertBar');
  if(!bar) return;
  if(!currentUser){ bar.innerHTML = ''; return; }
  const pending = [];
  orders.forEach(o=>{
    (o.observacoes||[]).forEach(ob=>{
      if(!ob.ciente && ob.notificarPara && ob.notificarPara.includes(currentUser.id)){
        pending.push({ order:o, obs:ob });
      }
    });
  });
  if(pending.length===0){ bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <div class="alert-bar">
      <div class="alert-inner">
        <div class="alert-title">⚠ ${pending.length} observação(ões) aguardando sua ciência</div>
        ${pending.map(p=>`
          <div class="alert-item">
            <div><b>${escapeHtml(p.order.cliente)}</b> — ${escapeHtml(p.obs.nome)}: ${escapeHtml(p.obs.descricao)}</div>
            <button class="btn btn-primary btn-sm" data-alertciente="${p.order.id}|${p.obs.id}">Marcar ciente</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  bar.querySelectorAll('[data-alertciente]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [oid, obid] = b.dataset.alertciente.split('|');
      promptCiente(async (nome)=>{
        const order = orders.find(x=>x.id===oid);
        const obs = order.observacoes.find(x=>x.id===obid);
        obs.ciente = true; obs.cienteNome = nome; obs.cienteEm = Date.now();
        await saveOrders();
        renderAlerts();
        renderView();
      });
    });
  });
}

/**
 * Mounts a self-contained observations UI (list + add/edit form) into `container`.
 * `orderLike` is either a real persisted order (persisted=true, changes are saved to storage)
 * or a temporary plain object { observacoes: [] } used while a new order is still being drafted
 * (persisted=false, changes only live in memory until the order itself is created).
 */
function mountObservacoes(container, orderLike, persisted){
  if(!orderLike.observacoes) orderLike.observacoes = [];
  let editingId = null;

  async function persistIfNeeded(){
    if(persisted){ await saveOrders(); renderAlerts(); }
  }

  function draw(){
    container.innerHTML = `
      <div class="section-label" style="margin-top:18px;">Observações</div>
      <div id="obsListInner"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnNovaObsInner">+ Lançar nova observação</button>
      <div id="obsFormInner" style="display:none; margin-top:12px; border:1px solid var(--line); border-radius:9px; padding:14px; background:var(--surface-2);"></div>
    `;
    drawList();
    container.querySelector('#btnNovaObsInner').addEventListener('click', ()=>{
      editingId = null;
      openForm();
    });
  }

  function drawList(){
    const listEl = container.querySelector('#obsListInner');
    const list = orderLike.observacoes;
    if(list.length===0){
      listEl.innerHTML = `<div class="muted" style="margin-bottom:8px;">Nenhuma observação registrada.</div>`;
      return;
    }
    listEl.innerHTML = list.slice().sort((a,b)=>b.criadoEm-a.criadoEm).map(o=>`
      <div class="obs-item ${!o.ciente && o.notificarPara.length>0 ? 'obs-pending':''}">
        <div style="display:flex; justify-content:space-between; gap:8px;">
          <div><b>${escapeHtml(o.nome)}</b> <span class="muted">${new Date(o.criadoEm).toLocaleString('pt-BR')}</span></div>
          <div style="display:flex; gap:4px; flex-shrink:0;">
            <button type="button" class="icon-btn" data-obsedit="${o.id}" title="Editar">✎</button>
            <button type="button" class="icon-btn" data-obsdel="${o.id}" title="Excluir observação">🗑</button>
          </div>
        </div>
        <div style="margin:6px 0; font-size:13px;">${escapeHtml(o.descricao)}</div>
        ${o.fotos && o.fotos.length>0 ? `<div class="foto-grid" data-obsfotos="${o.id}"></div>` : ''}
        ${o.notificarPara.length>0 ? `<div class="muted" style="margin-bottom:6px;">Notificar: ${o.notificarPara.map(id=>{const u=config.users.find(x=>x.id===id); return u?escapeHtml(u.nome):'—';}).join(', ')}</div>` : ''}
        ${o.ciente
          ? `<span class="badge" style="background:var(--ok-soft); color:var(--ok);">Ciente: ${escapeHtml(o.cienteNome)} · ${new Date(o.cienteEm).toLocaleDateString('pt-BR')}</span>`
          : (o.notificarPara.length>0 ? `<button type="button" class="btn btn-danger btn-sm" data-obsciente="${o.id}">⚠ Marcar ciente</button>` : `<span class="badge" style="background:var(--surface-2); color:var(--ink-faint);">Sem notificação</span>`)
        }
      </div>
    `).join('');

    listEl.querySelectorAll('[data-obsfotos]').forEach(el=>{
      const obs = list.find(x=>x.id===el.dataset.obsfotos);
      if(obs) mountFotosInline(el, obs.fotos);
    });
    listEl.querySelectorAll('[data-obsedit]').forEach(b=>{
      b.addEventListener('click', ()=>{ editingId = b.dataset.obsedit; openForm(); });
    });
    listEl.querySelectorAll('[data-obsdel]').forEach(b=>{
      b.addEventListener('click', ()=>{
        openModal(`
          <h3>Excluir observação</h3>
          <p>Tem certeza que deseja excluir esta observação? Essa ação não pode ser desfeita.</p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="obsDelCancel">Cancelar</button>
            <button class="btn btn-danger" id="obsDelConfirm">Excluir</button>
          </div>
        `);
        document.getElementById('obsDelCancel').addEventListener('click', closeModal);
        document.getElementById('obsDelConfirm').addEventListener('click', async ()=>{
          orderLike.observacoes = orderLike.observacoes.filter(x=>x.id!==b.dataset.obsdel);
          await persistIfNeeded();
          closeModal();
          draw();
          showToast('Observação excluída.');
        });
      });
    });
    listEl.querySelectorAll('[data-obsciente]').forEach(b=>{
      b.addEventListener('click', ()=>{
        promptCiente(async (nome)=>{
          const obs = orderLike.observacoes.find(x=>x.id===b.dataset.obsciente);
          obs.ciente = true; obs.cienteNome = nome; obs.cienteEm = Date.now();
          await persistIfNeeded();
          draw();
        });
      });
    });
  }

  function openForm(){
    const formEl = container.querySelector('#obsFormInner');
    const editing = editingId ? orderLike.observacoes.find(o=>o.id===editingId) : null;
    const obsFotoHolder = editing || { fotos: [] };
    formEl.style.display = 'block';
    formEl.innerHTML = `
      <div class="field"><label>Nome</label><input id="obsNomeInp" value="${editing?escapeHtml(editing.nome):''}"></div>
      <div class="field"><label>Descrição</label><textarea id="obsDescInp" style="min-height:80px;">${editing?escapeHtml(editing.descricao):''}</textarea></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnToggleNotif">🔔 Notificar</button>
      <div id="notifyBoxInner" style="display:none; margin-top:10px;">
        <div class="muted" style="margin-bottom:6px;">Selecione quem deve ser notificado:</div>
        ${config.users.map(u=>`
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;">
            <input type="checkbox" value="${u.id}" class="obsNotifChk" ${editing && editing.notificarPara.includes(u.id) ? 'checked':''}>
            ${escapeHtml(u.nome)} <span class="muted">(${levelLabel(u.nivel)})</span>
          </label>
        `).join('')}
      </div>
      <div id="obsFotoContainer"></div>
      <div class="modal-actions" style="justify-content:flex-start; margin-top:12px;">
        <button type="button" class="btn btn-accent btn-sm" id="btnConcluirObsInner">Concluir</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnCancelObsInner">Cancelar</button>
      </div>
    `;
    mountFotos(formEl.querySelector('#obsFotoContainer'), obsFotoHolder, persisted && !!editing, false);
    if(editing && editing.notificarPara.length>0){
      formEl.querySelector('#notifyBoxInner').style.display = 'block';
    }
    formEl.querySelector('#btnToggleNotif').addEventListener('click', ()=>{
      const box = formEl.querySelector('#notifyBoxInner');
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    });
    formEl.querySelector('#btnCancelObsInner').addEventListener('click', ()=>{
      formEl.style.display = 'none'; formEl.innerHTML = ''; editingId = null;
    });
    formEl.querySelector('#btnConcluirObsInner').addEventListener('click', async ()=>{
      const nome = formEl.querySelector('#obsNomeInp').value.trim();
      const descricao = formEl.querySelector('#obsDescInp').value.trim();
      if(!nome || !descricao){ showToast('Preencha nome e descrição da observação.'); return; }
      const notificarPara = Array.from(formEl.querySelectorAll('.obsNotifChk:checked')).map(c=>c.value);
      if(editing){
        editing.nome = nome; editing.descricao = descricao; editing.notificarPara = notificarPara;
      } else {
        orderLike.observacoes.push({
          id: uid('obs'), nome, descricao, notificarPara,
          criadoEm: Date.now(), ciente:false, cienteNome:null, cienteEm:null,
          fotos: obsFotoHolder.fotos
        });
      }
      await persistIfNeeded();
      formEl.style.display = 'none'; formEl.innerHTML = ''; editingId = null;
      draw();
      showToast('Observação registrada.');
    });
  }

  draw();
}

   NAVEGAÇÃO
   ============================================================ */
function tabsForLevel(){
  const t = [];
  if(currentUser.nivel!=='oficina'){
    t.push({ id:'nova', label:'Nova ordem', icon:'📝' });
  }
  t.push({ id:'painel', label:'Painel', icon:'📋' });
  t.push({ id:'agenda', label:'Agenda', icon:'🗓️' });
  if(currentUser.nivel!=='oficina'){
    t.push({ id:'clientes', label:'Clientes', icon:'👤' });
  }
  if(currentUser.nivel==='oficina' || currentUser.nivel==='diretoria'){
    t.push({ id:'codigo', label:'Código', icon:'🔑' });
  }
  if(currentUser.nivel==='diretoria'){
    t.push({ id:'config', label:'Config', icon:'⚙️' });
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();

  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });

  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
}
function renderView(){
  renderAlerts();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='nova') renderNovaOrdem(main);
  else if(currentTab==='painel') renderPainel(main);
  else if(currentTab==='agenda') renderAgenda(main);
  else if(currentTab==='clientes') renderClientes(main);
  else if(currentTab==='codigo') renderGerarCodigo(main);
  else if(currentTab==='config') renderConfig(main);
}

/* ============================================================
   REGRAS DE VAGA / PRAZO
   ============================================================ */
function checkSlot(serviceTypeId, dateStr, excludeOrderId){
  const st = config.serviceTypes.find(s=>s.id===serviceTypeId);
  if(!st || !dateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateStr+'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  const prazoOk = diffDays >= st.prazoMinimoDias;
  const countDay = orders.filter(o=> o.serviceTypeId===serviceTypeId && o.data===dateStr && o.status===STATUS.AGUARDANDO && o.id!==excludeOrderId).length;
  const quantidadeOk = countDay < st.maxPorDia;
  return {
    st, prazoOk, quantidadeOk, ok: prazoOk && quantidadeOk,
    ocupadas:countDay, vagas: st.maxPorDia, diffDays
  };
}

function lojaOptionsHtml(selected){
  return LOJAS.map(l=>`<option value="${l}" ${selected===l?'selected':''}>${l}</option>`).join('');

function servicoOptionsHtml(selected){

}

    if(!res) return;
    if(res.ok){
      banner.innerHTML = `<div class="slot-banner slot-ok"><span class="dot"></span><div><b>Vaga disponível.</b> ${res.ocupadas}/${res.vagas} ordens já lançadas para ${fmtDate(dt)}. Prazo mínimo respeitado.</div></div>`;
    } else {
      const motivos = [];
      if(!res.prazoOk) motivos.push('a data está abaixo do prazo mínimo de confecção (' + res.st.prazoMinimoDias + ' dia(s))');
      if(!res.quantidadeOk) motivos.push('a quantidade máxima do dia já foi atingida (' + res.ocupadas + '/' + res.vagas + ')');
      banner.innerHTML = `<div class="slot-banner slot-bad"><span class="dot"></span><div><b>Fora do padrão configurado:</b> ${motivos.join(' e ')}. Este lançamento será registrado como <b>encaixe</b> e exige código de autorização da oficina ou diretoria.</div></div>`;
      codeArea.style.display = 'block';
    }
  }
  servicoSel.addEventListener('change', updateBanner);
  dataInp.addEventListener('change', updateBanner);

  document.getElementById('btnLimparOrdem').addEventListener('click', ()=>renderView());

  function collectClienteFields(){
    return {
      cliente: document.getElementById('f_cliente').value.trim(),
      telefone: document.getElementById('f_telefone').value.trim(),
      email: document.getElementById('f_email').value.trim(),
      cpf: document.getElementById('f_cpf').value.trim(),
      dataNascimento: document.getElementById('f_nascimento').value,
      endereco: document.getElementById('f_endereco').value.trim(),
    };
  }

  document.getElementById('btnSalvarRascunho').addEventListener('click', async ()=>{
    const cli = collectClienteFields();
    if(!cli.cliente){
      showToast('Informe ao menos o nome do cliente para salvar o rascunho.');
      return;
    }
    const loja = lojaSel.value;
    const sid = servicoSel.value;
    const st = config.serviceTypes.find(s=>s.id===sid);
    const rascunho = {
      id: uid('ord'),
      ...cli,
      via: viaInp.value.trim(),
      numeroNota: document.getElementById('f_nota').value.trim(),
      vendedora: document.getElementById('f_vendedora').value.trim(),
      loja,
      serviceTypeId: sid,
      serviceTypeName: st ? st.nome : '',
      data: dataInp.value,
      status: STATUS.RASCUNHO,
      encaixe: false, autorizadoPor: null,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: tempPagHolder.pagamentos,
      observacoes: tempObsHolder.observacoes,
      fotos: tempFotoHolder.fotos,
      criadoEm: Date.now()
    };
    orders.unshift(rascunho);
    await saveOrders();
    if(cli.cliente){ await upsertClienteFromOrder(cli); }
    showToast('Rascunho salvo.');
    currentTab = 'painel';
    renderTabs(); renderView();
  });

  document.getElementById('btnSalvarOrdem').addEventListener('click', async ()=>{
    const cli = collectClienteFields();
    const { cliente, telefone, email, cpf, dataNascimento, endereco } = cli;
    const via = viaInp.value.trim();
    const numeroNota = document.getElementById('f_nota').value.trim();
    const vendedora = document.getElementById('f_vendedora').value.trim();
    const loja = lojaSel.value;
    const sid = servicoSel.value;
    const dt = dataInp.value;

    if(!cliente || !telefone || !vendedora || !loja || !sid || !dt){
      showToast('Preencha todos os campos obrigatórios antes de lançar.');
      return;
    }
    const res = checkSlot(sid, dt, null);
    let encaixe = false;
    let autorizadoPor = null;

    if(!res.ok){
      const codigoDigitado = document.getElementById('f_codigo').value.trim().toUpperCase();
      if(!codigoDigitado){
        showToast('Informe o código de autorização para concluir o encaixe.');
        return;
      }
      // Recarrega os códigos direto do banco: quem gerou o código pode estar em outro
      // dispositivo/sessão, então a lista em memória aqui pode estar desatualizada.
      codes = await storageGet('codes', true) || [];
      const codeObj = codes.find(c=>c.codigo === codigoDigitado && !c.usado);
      if(!codeObj){
        showToast('Código inválido ou já utilizado.');
        return;
      }
      codeObj.usado = true;
      codeObj.usadoEm = Date.now();
      encaixe = true;
      autorizadoPor = codeObj.autorizadoPor;
      await saveCodes();
    }

    const st = config.serviceTypes.find(s=>s.id===sid);
    const novaOrdem = {
      id: uid('ord'),
      cliente, telefone, email, cpf, dataNascimento, endereco, via, numeroNota, vendedora, loja,
      serviceTypeId: sid,
      serviceTypeName: st ? st.nome : '',
      data: dt,
      status: STATUS.AGUARDANDO,
      encaixe, autorizadoPor,
      valorTotal: tempPagHolder.valorTotal,
      pagamentos: tempPagHolder.pagamentos,
      observacoes: tempObsHolder.observacoes,
      fotos: tempFotoHolder.fotos,
      criadoEm: Date.now()
    };
    orders.unshift(novaOrdem);
    await saveOrders();
    await upsertClienteFromOrder(cli);
    showToast(encaixe ? 'Ordem lançada como encaixe autorizado.' : 'Ordem lançada com sucesso.');
    currentTab = 'painel';
    renderTabs(); renderView();
    renderAlerts();
    openNotifyModal(novaOrdem);
  });
}

/* ============================================================
   EDITAR ORDEM (modal)
   ============================================================ */
function openEditModal(orderId){
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  if(currentUser.nivel==='oficina'){
    openEditModalOficina(order);
  } else {
    openEditModalCompleto(order);
  }
}

function openEditModalOficina(order){
  openModal(`
    <h3>Ordem de ${escapeHtml(order.cliente)}</h3>
    <p>${escapeHtml(order.serviceTypeName)} · ${fmtDate(order.data)} · Loja ${escapeHtml(order.loja)} · Status ${statusLabel(order.status)}</p>
    <div class="locked-note">🔒 Este acesso permite apenas incluir observações e dar ciência. Para alterar os demais dados, fale com a vendedora ou a diretoria.</div>
    <div id="fotoContainerEditOficina"></div>
    <div id="obsContainerEdit"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="editCancel">Fechar</button>
    </div>
  `);
  mountFotos(document.getElementById('fotoContainerEditOficina'), order, false, true);
  mountObservacoes(document.getElementById('obsContainerEdit'), order, true);
  document.getElementById('editCancel').addEventListener('click', ()=>{ closeModal(); renderView(); });
}

function openEditModalCompleto(order){
  openModal(`
    <h3>Editar ordem de serviço</h3>
    <p>Ajuste os dados abaixo. Se a nova data/serviço sair do padrão configurado, será solicitado um código de autorização.</p>
    <div class="field"><label>Nome do cliente</label><input id="e_cliente" value="${escapeHtml(order.cliente)}"></div>
    <div class="grid-2">
      <div class="field"><label>Telefone</label><input id="e_telefone" value="${escapeHtml(order.telefone)}"></div>
      <div class="field"><label>E-mail</label><input type="email" id="e_email" value="${escapeHtml(order.email||'')}"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>CPF</label><input id="e_cpf" value="${escapeHtml(order.cpf||'')}" placeholder="000.000.000-00"></div>
      <div class="field"><label>Data de nascimento</label><input type="date" id="e_nascimento" value="${order.dataNascimento||''}"></div>
    </div>
    <div class="field"><label>Endereço</label><input id="e_endereco" value="${escapeHtml(order.endereco||'')}" placeholder="Rua, número, bairro"></div>
    <div class="grid-2">
      <div class="field"><label>Número da via</label><input id="e_via" value="${escapeHtml(order.via)}"></div>
      <div class="field"><label>Número da nota <span class="muted">(opcional)</span></label><input id="e_nota" value="${escapeHtml(order.numeroNota||'')}" placeholder="Ex: 12345"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Vendedora</label><input id="e_vendedora" value="${escapeHtml(order.vendedora)}"></div>
      <div class="field"><label>Loja</label><select id="e_loja">${lojaOptionsHtml(order.loja)}</select></div>
    </div>
    <div class="field"><label>Status</label>
      <select id="e_status">
        <option value="rascunho" ${order.status==='rascunho'?'selected':''}>Rascunho</option>
        <option value="aguardando" ${order.status==='aguardando'?'selected':''}>Aguardando</option>
        <option value="pronto" ${order.status==='pronto'?'selected':''}>Pronto</option>
        <option value="entregue" ${order.status==='entregue'?'selected':''}>Entregue</option>
        <option value="cancelado" ${order.status==='cancelado'?'selected':''}>Cancelado</option>
      </select>
    </div>
    <div class="field" id="e_recebidoWrap" style="display:none;">
      <label>Recebido por</label>
      <input id="e_recebidoPor" placeholder="Nome de quem recebeu o produto" value="${escapeHtml(order.recebidoPor||'')}">
    </div>
    <div class="field"><label>Tipo de serviço</label><select id="e_servico">${servicoOptionsHtml(order.serviceTypeId)}</select></div>
    <div class="field"><label>Data de agendamento</label><input type="date" id="e_data" value="${order.data}"></div>
    <div id="editSlotBanner"></div>
    <div id="editCodeArea" style="display:none;">
      <div class="field" style="margin-top:6px;">
        <label>Código de autorização (encaixe)</label>
        <input id="e_codigo" placeholder="Código da oficina/diretoria" style="text-transform:uppercase;">
      </div>
    </div>
    <div id="pagamentoContainerEdit"></div>
    <div id="fotoContainerEdit"></div>
    <div id="obsContainerEdit"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="editCancel">Cancelar</button>
      <button class="btn btn-accent" id="editSave">Salvar alterações</button>
    </div>
  `);
  mountFotos(document.getElementById('fotoContainerEdit'), order, true, false);
  mountObservacoes(document.getElementById('obsContainerEdit'), order, true);
  mountPagamentos(document.getElementById('pagamentoContainerEdit'), order);

  const servicoSel = document.getElementById('e_servico');
  const dataInp = document.getElementById('e_data');
  const banner = document.getElementById('editSlotBanner');
  const codeArea = document.getElementById('editCodeArea');
  const statusSel = document.getElementById('e_status');
  const recebidoWrap = document.getElementById('e_recebidoWrap');

  function updateRecebidoVisibility(){
    recebidoWrap.style.display = statusSel.value === 'entregue' ? 'block' : 'none';
  }
  statusSel.addEventListener('change', updateRecebidoVisibility);
  updateRecebidoVisibility();

  function sameAsOriginal(){
    return servicoSel.value===order.serviceTypeId && dataInp.value===order.data;
  }
  function updateBanner(){
    banner.innerHTML = '';
    codeArea.style.display = 'none';
    if(statusSel.value === 'rascunho'){
      banner.innerHTML = `<div class="slot-banner slot-ok"><span class="dot"></span><div>Rascunho não ocupa vaga — nenhuma verificação necessária enquanto estiver como rascunho.</div></div>`;
      return;
    }
    if(!servicoSel.value || !dataInp.value) return;
    if(sameAsOriginal()){
      banner.innerHTML = `<div class="slot-banner slot-ok"><span class="dot"></span><div>Mesma vaga já ocupada por esta ordem — nenhuma verificação adicional necessária.</div></div>`;
      return;
    }
    const res = checkSlot(servicoSel.value, dataInp.value, order.id);
    if(res.ok){
      banner.innerHTML = `<div class="slot-banner slot-ok"><span class="dot"></span><div><b>Vaga disponível.</b> ${res.ocupadas}/${res.vagas} ordens para ${fmtDate(dataInp.value)}.</div></div>`;
    } else {
      const motivos = [];
      if(!res.prazoOk) motivos.push('abaixo do prazo mínimo (' + res.st.prazoMinimoDias + ' dia(s))');
      if(!res.quantidadeOk) motivos.push('quantidade máxima do dia atingida (' + res.ocupadas + '/' + res.vagas + ')');
      banner.innerHTML = `<div class="slot-banner slot-bad"><span class="dot"></span><div><b>Fora do padrão:</b> ${motivos.join(' e ')}. Exige código de autorização.</div></div>`;
      codeArea.style.display = 'block';
    }
  }
  servicoSel.addEventListener('change', updateBanner);
  dataInp.addEventListener('change', updateBanner);
  statusSel.addEventListener('change', updateBanner);
  updateBanner();

  document.getElementById('editCancel').addEventListener('click', closeModal);
  document.getElementById('editSave').addEventListener('click', async ()=>{
    const cliente = document.getElementById('e_cliente').value.trim();
    const telefone = document.getElementById('e_telefone').value.trim();
    const email = document.getElementById('e_email').value.trim();
    const cpf = document.getElementById('e_cpf').value.trim();
    const dataNascimento = document.getElementById('e_nascimento').value;
    const endereco = document.getElementById('e_endereco').value.trim();
    const via = document.getElementById('e_via').value.trim();
    const numeroNota = document.getElementById('e_nota').value.trim();
    const vendedora = document.getElementById('e_vendedora').value.trim();
    const loja = document.getElementById('e_loja').value;
    const status = document.getElementById('e_status').value;
    const sid = servicoSel.value;
    const dt = dataInp.value;

    if(status !== 'rascunho' && (!cliente || !telefone || !vendedora || !loja || !sid || !dt)){
      showToast('Preencha todos os campos obrigatórios.');
      return;
    }
    if(status === 'rascunho' && !cliente){
      showToast('Informe ao menos o nome do cliente.');
      return;
    }
    let recebidoPor = order.recebidoPor || null;
    let recebidoEm = order.recebidoEm || null;
    if(status === 'entregue'){
      recebidoPor = document.getElementById('e_recebidoPor').value.trim();
      if(!recebidoPor){
        showToast('Informe quem recebeu o produto.');
        return;
      }
      if(order.status !== 'entregue') recebidoEm = Date.now();
    }

    let encaixe = order.encaixe;
    let autorizadoPor = order.autorizadoPor;

    if(status !== 'rascunho' && !sameAsOriginal()){
      const res = checkSlot(sid, dt, order.id);
      if(!res.ok){
        const codigoDigitado = document.getElementById('e_codigo').value.trim().toUpperCase();
        if(!codigoDigitado){
          showToast('Informe o código de autorização para concluir a alteração.');
          return;
        }
        // Recarrega os códigos direto do banco (quem gerou pode estar em outra sessão/dispositivo).
        codes = await storageGet('codes', true) || [];
        const codeObj = codes.find(c=>c.codigo === codigoDigitado && !c.usado);
        if(!codeObj){
          showToast('Código inválido ou já utilizado.');
          return;
        }
        codeObj.usado = true;
        codeObj.usadoEm = Date.now();
        encaixe = true;
        autorizadoPor = codeObj.autorizadoPor;
        await saveCodes();
      } else {
        encaixe = false;
        autorizadoPor = null;
      }
    }

    const st = config.serviceTypes.find(s=>s.id===sid);
    Object.assign(order, {
      cliente, telefone, email, cpf, dataNascimento, endereco, via, numeroNota, vendedora, loja, status,
      serviceTypeId: sid, serviceTypeName: st?st.nome:'', data: dt,
      encaixe, autorizadoPor, recebidoPor, recebidoEm
    });
    await saveOrders();
    await upsertClienteFromOrder({ cliente, telefone, email, cpf, dataNascimento, endereco });
    closeModal();
    showToast('Ordem atualizada.');
    renderView();
  });
}

/* ============================================================
   PAINEL
   ============================================================ */
function renderPainel(main){
  const st = config.serviceTypes;
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Painel de ordens</h1>
        <p class="page-sub">Acompanhe, edite e atualize o status de cada ordem lançada. Ordens entregues ficam ocultas por padrão — use o filtro de status para encontrá-las.</p>
      </div>
    </div>
    <div id="prontosCard"></div>
    <div class="filters">
      <select id="filtroServico"><option value="">Todos os serviços</option>${st.map(s=>`<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('')}</select>
      <select id="filtroLoja"><option value="">Todas as lojas</option>${lojaOptionsHtml('')}</select>
      <select id="filtroStatus">
        <option value="">Todos os status (exceto entregues)</option>
        <option value="rascunho">Rascunho</option>
        <option value="aguardando">Aguardando</option>
        <option value="pronto">Pronto</option>
        <option value="entregue">Entregue</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <input type="date" id="filtroData">
      <input type="text" id="filtroBusca" placeholder="Buscar cliente...">
      <button class="btn btn-ghost btn-sm" id="btnLimparFiltro">Limpar filtros</button>
    </div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <div id="tabelaWrap"></div>
    </div>
  `;

  function renderProntosCard(){
    const card = document.getElementById('prontosCard');
    const prontos = orders.filter(o=>o.status==='pronto').sort((a,b)=>a.data.localeCompare(b.data));
    if(prontos.length===0){ card.innerHTML = ''; return; }
    card.innerHTML = `
      <div class="card" style="border-color:var(--ok); background:var(--ok-soft); margin-bottom:16px;">
        <div class="section-label" style="color:var(--ok); margin-bottom:10px;">🟢 Prontos para retirada (${prontos.length})</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${prontos.map(o=>`
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 12px; flex-wrap:wrap;">
              <div style="font-size:13px;">
                <b>${escapeHtml(o.cliente)}</b>
                <span class="muted"> · ${escapeHtml(o.serviceTypeName)} · ${escapeHtml(o.loja)} · agendado ${fmtDate(o.data)}</span>
              </div>
              ${currentUser.nivel!=='oficina' ? `
              <div style="display:flex; gap:6px;">
                <button class="icon-btn" data-prontowa="${o.id}" title="Enviar WhatsApp">💬</button>
                <button class="icon-btn" data-prontomail="${o.id}" title="Enviar e-mail">✉️</button>
              </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
    card.querySelectorAll('[data-prontowa]').forEach(b=>{
      b.addEventListener('click', ()=> sendWhatsApp(orders.find(x=>x.id===b.dataset.prontowa)) );
    });
    card.querySelectorAll('[data-prontomail]').forEach(b=>{
      b.addEventListener('click', ()=> sendEmail(orders.find(x=>x.id===b.dataset.prontomail)) );
    });
  }

  const fServico = document.getElementById('filtroServico');
  const fLoja = document.getElementById('filtroLoja');
  const fStatus = document.getElementById('filtroStatus');
  const fData = document.getElementById('filtroData');
  const fBusca = document.getElementById('filtroBusca');

  function renderTable(){
    renderProntosCard();
    let list = [...orders];
    if(currentUser.nivel==='oficina'){
      list = list.filter(o=>o.status!=='rascunho');
    }
    if(fStatus.value){
      list = list.filter(o=>o.status===fStatus.value);
    } else {
      list = list.filter(o=>o.status!=='entregue' && o.status!=='rascunho');
    }
    if(fServico.value) list = list.filter(o=>o.serviceTypeId===fServico.value);
    if(fLoja.value) list = list.filter(o=>o.loja===fLoja.value);
    if(fData.value) list = list.filter(o=>o.data===fData.value);
    if(fBusca.value.trim()) {
      const q = fBusca.value.trim().toLowerCase();
      list = list.filter(o=>o.cliente.toLowerCase().includes(q));
    }
    list.sort((a,b)=> a.data.localeCompare(b.data) || b.criadoEm-a.criadoEm );

    const wrap = document.getElementById('tabelaWrap');
    if(list.length===0){
      wrap.innerHTML = `<div class="empty">Nenhuma ordem encontrada com esses filtros.</div>`;
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Cliente</th><th>Telefone</th><th>Via</th><th>Vendedora</th><th>Loja</th>
            <th>Serviço</th><th>Data</th><th>Status</th><th>Ações</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(o=>rowHtml(o)).join('')}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll('select.status-select').forEach(sel=>{
      applyStatusClass(sel);
      sel.addEventListener('change', async ()=>{
        const ord = orders.find(o=>o.id===sel.dataset.id);
        const previous = ord.status;
        if(sel.value === 'entregue'){
          promptRecebidoPor(async (nome)=>{
            ord.status = 'entregue';
            ord.recebidoPor = nome;
            ord.recebidoEm = Date.now();
            await saveOrders();
            showToast('Ordem marcada como entregue para ' + nome + '.');
            renderTable();
          }, ()=>{ sel.value = previous; applyStatusClass(sel); });
          return;
        }
        ord.status = sel.value;
        await saveOrders();
        applyStatusClass(sel);
        showToast('Status atualizado para "' + statusLabel(sel.value) + '". ' + (sel.value!=='aguardando' ? 'Vaga liberada.' : ''));
        renderTable();
      });
    });
    wrap.querySelectorAll('[data-wa]').forEach(b=>{
      b.addEventListener('click', ()=> sendWhatsApp(orders.find(x=>x.id===b.dataset.wa)) );
    });
    wrap.querySelectorAll('[data-mail]').forEach(b=>{
      b.addEventListener('click', ()=> sendEmail(orders.find(x=>x.id===b.dataset.mail)) );
    });
    wrap.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=> openEditModal(b.dataset.edit) );
    });
  }

  function rowHtml(o){
    const pendObs = (o.observacoes||[]).some(ob=>!ob.ciente && ob.notificarPara && ob.notificarPara.length>0);
    const isRascunho = o.status === 'rascunho';
    return `
      <tr>
        <td><b>${escapeHtml(o.cliente)}</b>${isRascunho ? `<div class="badge rascunho-badge" style="margin-top:4px;">📝 Rascunho</div>` : ''}${o.encaixe ? `<div class="badge badge-encaixe" style="margin-top:4px;" title="Autorizado por ${escapeHtml(o.autorizadoPor||'')}">Encaixe</div>` : ''}${pendObs ? `<div class="badge badge-flag" style="margin-top:4px;">⚠ Observação pendente</div>` : ''}${o.numeroNota ? `<div class="muted" style="margin-top:4px;">Nota ${escapeHtml(o.numeroNota)}</div>` : ''}${o.status==='entregue' ? `<div class="muted" style="margin-top:4px;">Recebido por ${escapeHtml(o.recebidoPor||'—')}</div>` : ''}</td>
        <td>${escapeHtml(o.telefone)}</td>
        <td>${escapeHtml(o.via)}</td>
        <td>${escapeHtml(o.vendedora)}</td>
        <td><span class="badge badge-loja">${escapeHtml(o.loja)}</span></td>
        <td>${escapeHtml(o.serviceTypeName)}</td>
        <td>${fmtDate(o.data)}</td>
        <td>
          ${isRascunho
            ? `<span class="badge rascunho-badge">📝 Rascunho</span>`
            : currentUser.nivel==='oficina'
              ? `<span class="badge" style="background:${statusBg(o.status)}; color:${statusFg(o.status)};">${statusLabel(o.status)}</span>`
              : `<select class="status-select" data-id="${o.id}">
                  <option value="aguardando" ${o.status==='aguardando'?'selected':''}>Aguardando</option>
                  <option value="pronto" ${o.status==='pronto'?'selected':''}>Pronto</option>
                  <option value="entregue" ${o.status==='entregue'?'selected':''}>Entregue</option>
                  <option value="cancelado" ${o.status==='cancelado'?'selected':''}>Cancelado</option>
                </select>`
          }
        </td>
        <td style="white-space:nowrap;">
          <button class="icon-btn" data-edit="${o.id}" title="Editar ordem">✎</button>
          ${currentUser.nivel!=='oficina' ? `
          <button class="icon-btn" data-wa="${o.id}" title="Enviar WhatsApp">💬</button>
          <button class="icon-btn" data-mail="${o.id}" title="Enviar e-mail">✉️</button>
          ` : ''}
        </td>
      </tr>
    `;
  }

  [fServico,fLoja,fStatus,fData,fBusca].forEach(el=>el.addEventListener('input', renderTable));
  document.getElementById('btnLimparFiltro').addEventListener('click', ()=>{
    fServico.value=''; fLoja.value=''; fStatus.value=''; fData.value=''; fBusca.value='';
    renderTable();
  });

  renderTable();
}
function applyStatusClass(sel){
  sel.className = 'status-select status-' + sel.value;
}
function statusBg(s){ return s==='aguardando' ? 'var(--wait-soft)' : s==='pronto' ? 'var(--ok-soft)' : s==='entregue' ? 'var(--delivered-soft)' : 'var(--danger-soft)'; }
