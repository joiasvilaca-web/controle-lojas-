<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Ordens — Gestão e Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --surface-2:#F1F4F7;
    --ink:#1A1D24;
    --ink-soft:#4B5566;
    --ink-faint:#7C8592;
    --line:#E1E5EA;
    --line-strong:#C7CDD5;
    --accent:#662344;
    --accent-ink:#4A1830;
    --accent-soft:#F3E6D8;
    --ok:#17794A;
    --ok-soft:#E3F5EA;
    --danger:#B91C1C;
    --danger-soft:#FBEAEA;
    --wait:#B45309;
    --wait-soft:#FCEEDC;
    --encaixe:#6425C9;
    --encaixe-soft:#EFE5FA;
    --delivered:#1D4ED8;
    --delivered-soft:#E7EEFC;
    --radius:10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;cursor:pointer;}
  input, select, textarea{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #view-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 18% 20%, rgba(201,122,43,0.09), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(110,69,168,0.07), transparent 40%),
      var(--bg);
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 32px 30px;
    box-shadow:0 1px 3px rgba(20,30,45,0.06), 0 12px 32px -18px rgba(20,30,45,0.25);
    position:relative;
  }
  .login-tag{
    position:absolute;
    top:-11px; left:28px;
    background:var(--accent);
    color:#fff;
    font-size:10.5px;
    letter-spacing:.09em;
    font-weight:700;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
  }
  .hub-back-link{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:14px;
  }
  .hub-back-link:hover{color:var(--accent-ink); text-decoration:underline;}
  .hub-back-link-dark{
    color:rgba(255,255,255,0.65);
    margin-bottom:0;
    font-size:16px;
    padding:2px 2px 2px 0;
  }
  .hub-back-link-dark:hover{color:#fff;}
  .login-title{
    font-size:20px;
    font-weight:750;
    letter-spacing:-0.01em;
    margin:6px 0 2px;
  }
  .login-sub{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 26px;
    line-height:1.5;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea, textarea.plain-input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    font-size:14.5px;
    color:var(--ink);
    background:var(--surface-2);
    outline:none;
    transition:border-color .12s, background .12s;
  }
  .field textarea, textarea.plain-input{resize:vertical; min-height:120px; line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus, textarea.plain-input:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .btn{border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.14);
  position:relative;top:0;transition:top .08s,box-shadow .08s;}
.btn:active{top:3px;box-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn-primary,.btn-accent{background:linear-gradient(180deg,#7f2a52 0%,#5c1d3b 100%);color:#fff;border-bottom:4px solid #3d1025;}
.btn-accent:hover,.btn-primary:hover{background:linear-gradient(180deg,#8e3260 0%,#6a2248 100%);}
.btn-ghost{background:linear-gradient(180deg,#f5f5f5 0%,#e0e0e0 100%);color:var(--ink-soft);border:1px solid #c8c8c8;border-bottom:4px solid #b0b0b0;}
.btn-ghost:hover{background:linear-gradient(180deg,#fafafa 0%,#ececec 100%);}
.btn-block{width:100%;}
.btn-sm{padding:6px 12px;font-size:12.5px;box-shadow:0 3px 0 rgba(0,0,0,.2),0 1px 4px rgba(0,0,0,.12);}
.btn-sm:active{top:2px;box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .login-error{
    background:var(--danger-soft);
    color:var(--danger);
    font-size:13px;
    padding:9px 12px;
    border-radius:7px;
    margin-bottom:14px;
    display:none;
  }
  .login-hint{
    margin-top:18px;
    font-size:11.5px;
    color:var(--ink-faint);
    line-height:1.5;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }

  /* ---------- APP SHELL ---------- */
  #view-app{display:none; min-height:100vh;}
  header.topbar{
    background:var(--ink);
    color:#fff;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    height:58px;
    position:sticky; top:0; z-index:40;
  }
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand-mark{
    width:28px;height:28px;border-radius:7px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-weight:800;
    font-size:13px;
    color:#241203;
    flex-shrink:0;
  }
  .brand-name{font-weight:750; font-size:15px; letter-spacing:-0.01em; white-space:nowrap;}
  nav.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.62);
    font-size:13.5px;
    font-weight:600;
    padding:8px 13px;
    border-radius:7px;
    transition:background .12s, color .12s;
    white-space:nowrap;
    flex-shrink:0;
  }
  nav.tabs button:hover{color:#fff; background:rgba(255,255,255,0.07);}
  nav.tabs button.active{color:#fff; background:rgba(255,255,255,0.14);}
  .who{
    display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:rgba(255,255,255,0.7);
    flex-shrink:0;
  }
  .who b{color:#fff; font-weight:650;}
  .level-pill{
    font-size:10px; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
    background:rgba(255,255,255,0.12); color:#fff;
    white-space:nowrap;
  }
  main{
    max-width:1180px;
    margin:0 auto;
    padding:26px 22px 60px;
  }
  .page-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:20px; gap:16px; flex-wrap:wrap;
  }
  .page-title{font-size:21px; font-weight:750; letter-spacing:-0.01em; margin:0 0 4px;}
  .page-sub{font-size:13px; color:var(--ink-soft); margin:0;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
  }
  .card + .card{margin-top:22px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

  /* ---------- MOBILE NAV ---------- */
  .mobile-tabbar{
    display:none;
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--ink);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -6px 18px rgba(10,14,20,0.22);
    gap:2px;
  }
  .mobile-tabbar button{
    background:transparent; border:none; color:rgba(255,255,255,0.6);
    font-size:10px; font-weight:650; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 4px; border-radius:9px; flex:1; min-width:0;
  }
  .mobile-tabbar button .mt-icon{font-size:17px; line-height:1;}
  .mobile-tabbar button.active{color:#fff; background:rgba(255,255,255,0.14);}

  @media (max-width:720px){
    .grid-2, .grid-3{grid-template-columns:1fr;}
    nav.tabs{display:none;}
    header.topbar{padding:0 14px; height:54px;}
    .brand-name{display:none;}
    main{padding:18px 14px 84px;}
    .mobile-tabbar{display:flex;}
    .card{padding:16px;}
    .page-title{font-size:18px;}
    table{font-size:12.5px;}
    .modal{padding:18px; max-width:100%;}
    .cal-grid{gap:4px;}
    .cal-cell{min-height:64px; padding:4px 3px 5px;}
    .cal-chip{font-size:9px; padding:2px 4px;}
    .cal-daynum{font-size:10px;}
    .agenda-month{min-width:0; font-size:14px;}
    .foto-thumb{width:64px; height:64px;}
  }
  @media (max-width:420px){
    .who{gap:6px;}
    .level-pill{display:none;}
    .login-card{padding:28px 22px 24px;}
  }

  .section-label{
    font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:var(--accent-ink); margin:0 0 14px; padding:2px 0 10px 9px;
    border-left:3px solid var(--accent); border-bottom:1px solid var(--line); line-height:1.4;
  }
  .divider-nova{height:4px;background:var(--accent-soft);margin:22px 0;border-radius:3px;}
  .rascunho-badge{background:#EDEFF2;color:#6B7280;}
  .copy-btn{border:none;background:var(--surface-2);color:var(--ink-soft);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:8px;}
  .copy-btn:hover{background:#fff;color:var(--ink);}

  .slot-banner{
    border-radius:9px; padding:13px 14px; font-size:13.5px; line-height:1.5;
    margin:14px 0 4px; display:flex; gap:10px; align-items:flex-start;
  }
  .slot-ok{background:var(--ok-soft); color:#1E5A3B;}
  .slot-bad{background:var(--wait-soft); color:var(--accent-ink);}
  .slot-banner .dot{width:8px;height:8px;border-radius:50%; margin-top:5px; flex-shrink:0;}
  .slot-ok .dot{background:var(--ok);}
  .slot-bad .dot{background:var(--wait);}

  .ticket{
    position:relative;
    background:
      radial-gradient(circle at 0 50%, transparent 8px, var(--surface) 8.5px) left / 16px 100%,
      radial-gradient(circle at 100% 50%, transparent 8px, var(--surface) 8.5px) right / 16px 100%;
    background-repeat:no-repeat;
    border:1px dashed var(--line-strong);
    border-radius:14px;
    padding:22px 26px;
  }

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:750; padding:0 10px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px;
  }
  .badge-encaixe{background:var(--encaixe-soft); color:var(--encaixe);}
  .badge-loja{background:var(--surface-2); color:var(--ink-soft); font-family:var(--mono); white-space:normal; text-align:left; line-height:1.3;}
  select.status-select{
    border:none; border-radius:20px; font-size:11.5px; font-weight:750;
    padding:5px 22px 5px 10px; appearance:none; -webkit-appearance:none;
    background-repeat:no-repeat; background-position:right 8px center; background-size:9px;
    cursor:pointer;
  }
  select.status-aguardando{background-color:var(--wait-soft); color:var(--wait);}
  select.status-pronto{background-color:var(--ok-soft); color:var(--ok);}
  select.status-cancelado{background-color:var(--danger-soft); color:var(--danger);}
  select.status-entregue{background-color:var(--delivered-soft); color:var(--delivered);}

  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    color:var(--ink-soft); margin-right:4px;
  }
  .icon-btn:hover{background:#fff; border-color:var(--line-strong); color:var(--ink);}
  .icon-btn-wa{ background:#25D366; border-color:#1DA851; color:#fff; }
  .icon-btn-wa:hover{ background:#1DA851; color:#fff; }
  .icon-btn-sair{ background:var(--danger-soft, #FBE7E5); border-color:#E8A9A2; color:#B91C1C; }
  .icon-btn-sair:hover{ background:#F6C9C4; color:#8f1c16; }

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-faint); font-size:13.5px;
  }

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filters select, .filters input{
    padding:8px 10px; border:1px solid var(--line-strong); border-radius:7px; font-size:13px;
    background:var(--surface);
  }

  .config-row{
    display:grid; grid-template-columns:1.6fr 0.9fr 0.9fr 0.5fr; gap:10px; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .config-row:last-child{border-bottom:none;}
  .config-row input{padding:7px 9px; border:1px solid var(--line-strong); border-radius:6px; font-size:13px;}
  .muted{color:var(--ink-faint); font-size:12px;}

  .code-chip{
    font-family:var(--mono); font-weight:700; letter-spacing:.06em; font-size:15px;
    background:var(--ink); color:#fff; padding:8px 14px; border-radius:7px; display:inline-block;
  }
  .code-list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
    font-size:13px;
  }
  .code-list-item .cl-code{font-family:var(--mono); font-weight:700; letter-spacing:.04em;}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:200; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,25,35,0.45); display:none;
    align-items:center; justify-content:center; z-index:150; padding:20px; overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .photo-lightbox-overlay{
    position:fixed; inset:0; background:rgba(10,12,18,0.75); display:none;
    align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .photo-lightbox-overlay.show{display:flex;}
  .photo-lightbox-box{ max-width:640px; width:100%; }
  .photo-lightbox-box img{ width:100%; border-radius:10px; display:block; }
  .photo-lightbox-close{ margin-top:12px; }
  .modal{
    background:#fff; border-radius:12px; padding:24px; width:100%; max-width:480px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 6px; font-size:16px;}
  .modal p{margin:0 0 16px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}

  .locked-note{
    display:flex; gap:10px; align-items:center; background:var(--accent-soft); color:var(--accent-ink);
    padding:11px 13px; border-radius:8px; font-size:13px; margin-bottom:16px;
  }

  /* ---------- AGENDA ---------- */
  .agenda-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .agenda-nav{display:flex; align-items:center; gap:10px;}
  .agenda-month{font-size:16px; font-weight:750; min-width:170px; text-align:center; text-transform:capitalize;}
  .agenda-legend{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft);}
  .legend-item{display:flex; align-items:center; gap:5px;}
  .legend-dot{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:10.5px; font-weight:750; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); text-align:center; padding-bottom:4px;}
  .cal-cell{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    min-height:88px; padding:6px 6px 8px; display:flex; flex-direction:column; gap:3px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .cal-cell:hover{border-color:var(--line-strong); background:#fff;}
  .cal-cell.empty-cell{background:transparent; border:none; cursor:default;}
  .cal-cell.today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-daynum{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .cal-cell.today .cal-daynum{color:var(--accent-ink);}
  .cal-chip{
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px; color:#fff;
    display:flex; justify-content:space-between; gap:4px; white-space:nowrap; overflow:hidden;
  }
  .cal-chip.over{outline:2px solid var(--danger);}
  .cal-more{font-size:10px; color:var(--ink-faint); font-weight:650; padding-left:2px;}

  .day-order-item{
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .day-order-item:last-child{border-bottom:none;}

  /* ---------- OBSERVAÇÕES / ALERTAS ---------- */
  .obs-item{border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:8px; background:var(--surface);}
  .obs-item.obs-pending{border-color:var(--danger); background:var(--danger-soft);}
  .badge-flag{background:var(--danger-soft); color:var(--danger); font-size:10.5px; margin-top:4px;}
  #alertBar{width:100%;}
  .alert-bar{background:var(--danger-soft); border-bottom:2px solid var(--danger); padding:14px 22px;}
  .alert-inner{max-width:1180px; margin:0 auto;}
  .alert-title{font-weight:750; color:var(--danger); font-size:13px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .alert-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:#fff; border:1px solid var(--danger); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:13px;
  }

  /* ---------- FOTOS ---------- */
  .foto-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .foto-thumb{position:relative; width:74px; height:74px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--surface-2); flex-shrink:0;}
  .foto-thumb img{width:100%; height:100%; object-fit:cover; cursor:pointer; display:block;}
  .foto-del{
    position:absolute; top:2px; right:2px; background:rgba(20,20,20,0.6); color:#fff; border:none;
    border-radius:50%; width:19px; height:19px; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .foto-del:hover{background:rgba(178,58,58,0.85);}

  /* Modo embutido: este arquivo roda dentro de um iframe do shell único (index.html),
     que já cuida do login, da barra lateral e das abas — aqui escondemos essas partes. */
  html.embedded #view-login{display:none !important;}
  html.embedded .topbar{display:none !important;}
  html.embedded .mobile-tabbar{display:none !important;}

/* Bolinha de ajuda (?) ao lado de campos que confundem */
.ajuda-ponto{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  background:var(--accent,#662344);color:#fff;font-size:11px;font-weight:800;cursor:help;margin-left:5px;
  vertical-align:middle;position:relative;flex-shrink:0;}
.ajuda-ponto .balao{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:#1A1D24;color:#fff;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
  line-height:1.5;width:250px;text-align:left;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.25);text-transform:none;letter-spacing:0;}

function separarTelefone(str){
  const digitos = onlyDigits(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
/** Formata os dígitos do número conforme a pessoa digita — XXXXX-XXXX (celular) ou
 * XXXX-XXXX se for um fixo antigo de 8 dígitos, mantido por compatibilidade. */
function formatarNumeroTelefone(digitos){
  digitos = digitos.slice(0,9);
  if(digitos.length<=4) return digitos;
  if(digitos.length<=8) return digitos.slice(0,digitos.length-4)+'-'+digitos.slice(-4);
  return digitos.slice(0,5)+'-'+digitos.slice(5);
}
function wireTelefoneMask(prefix){
  const dddInp = document.getElementById(prefix+'_telefoneDDD');
  const numInp = document.getElementById(prefix+'_telefoneNum');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigits(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefone(onlyDigits(numInp.value)); });
}
/** Junta DDD+número num telefone só, no formato "(XX) XXXXX-XXXX", pra continuar
 * gravando como sempre. Os dois em branco = válido, salva vazio. Só um preenchido
 * ou número incompleto = erro — avisa e retorna null. */
function combinarTelefoneValidado(prefix){
  const ddd = onlyDigits((document.getElementById(prefix+'_telefoneDDD')||{}).value);
  const numero = onlyDigits((document.getElementById(prefix+'_telefoneNum')||{}).value);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==9){
    showToast('Telefone incompleto — preencha o DDD (2 dígitos) e o número (9 dígitos), ou deixe os dois em branco.');
    return null;
  }
  return `(${ddd}) ${numero.slice(0,5)}-${numero.slice(5)}`;
}

/**
 * A partir daqui o app NÃO fala mais direto com o banco usando a anon key.
 * Toda leitura/escrita passa pela Edge Function "db-gateway", que exige a senha
 * de um acesso válido antes de fazer qualquer coisa (a anon key sozinha não abre
 * mais nenhuma porta). `__gatewaySenha` guarda a senha da pessoa logada nesta aba.
 */
let __gatewaySenha = null;
async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}

/** Shim com a mesma "forma" do cliente Supabase antigo, pra não precisar reescrever
 * cada chamada existente — só troca o que acontece por baixo dos panos. */
/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 5000 } });
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

/** Orçamentos ainda em aberto (status que não "encerra") do mesmo cliente — por telefone ou nome. */
function orcamentosAbertosDoCliente(cliente){
  if(!cliente) return [];
  const telDigits = onlyDigits(cliente.telefone||'');
  const nomeLower = (cliente.nome||cliente.cliente||'').trim().toLowerCase();
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    const mesmoTelefone = telDigits && onlyDigits(o.telefone||'') === telDigits;
    const mesmoNome = nomeLower && (o.cliente||'').trim().toLowerCase() === nomeLower;
    return mesmoTelefone || mesmoNome;
  });
}

/** Gera o próximo código sequencial de via (formato "<número>-P" pra pedido/O.S.), usado

/* ============================================================
   CANCELAMENTO DE O.S.
   - O.S. não consome produtos_estoque (é baseada em serviço), então cancelar
     não mexe em estoque — só reverte crédito/fiado do cliente e registra o
     valor que sai do caixa (se já tinha sido recebido).
   ============================================================ */
function podeCancelarOrdem(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
async function reverterFiadoECreditoOrdem(order){
  const telD = onlyDigits(order.telefone||'');
  const nomeL = (order.cliente||'').trim().toLowerCase();
  // Procura o cliente no servidor (telefone; se não achar, nome) — sem lista completa em memória.
  let cliCad = clientes.find(c=> (telD && onlyDigits(c.telefone||'')===telD) || (nomeL && (c.nome||'').trim().toLowerCase()===nomeL)) || null;
  if(!cliCad && telD) cliCad = await buscarClientePorTelefoneOuCpf(order.telefone, '');
  if(!cliCad && nomeL){
    try{
      const r = await gatewayCall({ op:'searchClients', params:{ termo: (order.cliente||'').trim() } });
      cliCad = ((r && r.data) || []).find(c=> (c.nome||'').trim().toLowerCase()===nomeL) || null;
    }catch(e){ cliCad = null; }
  }
  if(!cliCad) return;
  let mudou = false;
  if(order.creditoUsado > 0){
    cliCad.credito = (Number(cliCad.credito)||0) + order.creditoUsado;
    if(!cliCad.creditoMovimentos) cliCad.creditoMovimentos = [];
    cliCad.creditoMovimentos.push({ data: hojeStr(), valor: order.creditoUsado, tipo:'estorno', obs:`Cancelamento O.S. ${order.via||''}` });
    mudou = true;
  }
  if(order.fiadoDebitoId && Array.isArray(cliCad.fiadoDebitos)){
    const idx = cliCad.fiadoDebitos.findIndex(d=>d.id===order.fiadoDebitoId);
    if(idx > -1){
      const debito = cliCad.fiadoDebitos[idx];
      const jaPago = Number(debito.valorPago)||0;
      if(jaPago > 0){
        if(!cliCad.creditoMovimentos) cliCad.creditoMovimentos = [];
        cliCad.credito = (Number(cliCad.credito)||0) + jaPago;
        cliCad.creditoMovimentos.push({ data: hojeStr(), valor: jaPago, tipo:'estorno', obs:`Cancelamento O.S. ${order.via||''} (parcela de fiado já paga)` });
      }
      cliCad.fiadoDebitos.splice(idx,1);
      mudou = true;
    }
  }
  if(mudou) await salvarUmCliente(cliCad);
}
function hojeStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/** Aplica o cancelamento em cima do objeto `order` em memória (não salva sozinho —
 * quem chama decide quando persistir, pra poder combinar com outras alterações). */
async function aplicarCancelamentoOrdem(order, motivo){
  const recebido = valorRecebidoDe(order);
  await reverterFiadoECreditoOrdem(order);
  order.status = 'cancelado';
  order.motivoCancelamento = motivo;
  order.canceladoPor = currentUser.nome;
  order.canceladoEm = Date.now();
  order.caixaSaidaCancelamento = recebido;
}
/** Botão dedicado "Cancelar O.S." na lista — abre modal pedindo motivo. */
function abrirCancelarOrdem(order){
  if(!order || order.status==='cancelado') return;
  if(!podeCancelarOrdem()){ showToast('Só gerente ou diretoria podem cancelar uma O.S.'); return; }
  const recebido = valorRecebidoDe(order);
  openModal(`
    <h3>Cancelar O.S.</h3>
    <p class="muted">${escapeHtml(order.cliente||'cliente não identificado')} · Via ${escapeHtml(order.via||'—')} · <b>R$ ${(Number(order.valorTotal)||0).toFixed(2)}</b></p>
    ${recebido>0 ? `<p style="color:var(--danger); font-weight:700;">Essa O.S. já recebeu R$ ${recebido.toFixed(2)} — esse valor vai sair do caixa como estorno.</p>` : ''}
    <div class="field"><label>Motivo do cancelamento <span class="muted">(obrigatório)</span></label><textarea id="co_motivo" style="min-height:70px;" placeholder="Ex: cliente desistiu, erro de lançamento..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="co_fechar">Voltar</button>
      <button class="btn btn-accent" id="co_confirmar" style="background:var(--danger); border-color:var(--danger);">Confirmar cancelamento</button>
    </div>
  `);
  document.getElementById('co_fechar').addEventListener('click', closeModal);

    const motivo = maiusc(document.getElementById('co_motivo').value);
    if(!motivo){ showToast('Informe o motivo do cancelamento.'); return; }

    closeModal();
    renderView();
  });
}

/**
 * Abre a tela de cliente com busca (lupa): digitando, filtra os clientes já
 * cadastrados; clicar num resultado preenche o formulário abaixo com os dados
 * dele; ou preenche do zero pra cadastrar alguém novo. Ao confirmar, salva
 * (cria ou atualiza) e chama `onConfirmar(cliente)` com o registro final.
 */
let __debounceClienteTimer = null;
function buscarClientesComDebounce(termo, aoAchar){
  clearTimeout(__debounceClienteTimer);
  __debounceClienteTimer = setTimeout(async ()=>{
    const r = await gatewayCall({ op:'searchClients', params:{ termo } });
    aoAchar((r && r.data) || []);

// Gera o HTML de um card de resultado de busca de cliente
function clienteCardHtml(c, idx){
  const partes = (c.nome||'').trim().split(/\s+/);
  const iniciais = partes.length>=2 ? partes[0][0]+partes[partes.length-1][0] : (partes[0]||'?')[0];
  const cpfFmt = c.cpf ? String(c.cpf).replace(/[^\d]/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : '';
  const tags = [
    c.telefone ? `<span class="cli-result-tag">📞 ${escapeHtml(c.telefone)}</span>` : '',
    cpfFmt     ? `<span class="cli-result-tag">· ${escapeHtml(cpfFmt)}</span>` : '',
    c.cidade   ? `<span class="cli-result-tag">· 📍 ${escapeHtml(c.cidade)}</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="cli-result-card" data-idx="${idx}">
    <div class="cli-result-avatar">${escapeHtml(iniciais.toUpperCase())}</div>
    <div class="cli-result-info">
      <div class="cli-result-nome">${escapeHtml(c.nome||'')}</div>
      ${tags ? `<div class="cli-result-sub">${tags}</div>` : ''}
    </div>
  </div>`;
}

function montarClienteAutocomplete(wrap, onSel, inicial){

    if(clienteSel){

      wrap.querySelector('#cliAcCad_os').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    } else {
      wrap.innerHTML=`<div class="cli-ac-wrap"><input class="cli-ac-input" id="cliAcInp_os" placeholder="Digite nome, telefone ou CPF..." autocomplete="off" spellcheck="false"><div class="cli-ac-dropdown" id="cliAcDrop_os" style="display:none;"></div></div>
      <button type="button" class="btn btn-ghost btn-sm" id="cliAcCad_os" style="margin-top:6px;">+ Cadastrar cliente novo</button>`;
      const inp=wrap.querySelector('#cliAcInp_os'), drop=wrap.querySelector('#cliAcDrop_os');
      function fechar(){drop.style.display='none';focusIdx=-1;}
      function msg(t){drop.innerHTML=`<div class="cli-ac-msg">${t}</div>`;drop.style.display='block';}
      function renderRes(ach){
        if(ach.length){
          drop.innerHTML=ach.map((c,i)=>clienteCardHtml(c,i)).join('');
          drop.style.display='block';
          drop.querySelectorAll('.cli-result-card').forEach((el,i)=>{
            el.addEventListener('mousedown',e=>{e.preventDefault();clienteSel=ach[i];onSel(ach[i]);fechar();renderWrap();});
            el.addEventListener('mouseover',()=>{focusIdx=i;drop.querySelectorAll('.cli-result-card').forEach((e,k)=>e.classList.toggle('focused',k===i));});
          });
        } else {
          const t=inp.value.trim();
          const parece_cpf=/^[\d.\-]+$/.test(t)&&onlyDigits(t).length===11;
          drop.innerHTML=`
            <div style="padding:10px 12px;">
              <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:8px;">Nenhum cliente encontrado no cadastro.</div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${parece_cpf?`<button type="button" class="btn btn-ghost btn-sm" id="cliAcBtnReceita" style="justify-content:flex-start;gap:8px;">🔎 Buscar na Receita Federal</button><div id="cliAcReceitaResult" style="font-size:12px;padding:0 2px;display:none;"></div>`:''}
                <button type="button" class="btn btn-ghost btn-sm" id="cliAcBtnCad2" style="justify-content:flex-start;gap:8px;">＋ Cadastrar novo cliente</button>
              </div>
            </div>`;
          drop.style.display='block';
          if(parece_cpf){
            drop.querySelector('#cliAcBtnReceita')?.addEventListener('mousedown',async e=>{
              e.preventDefault();
              const btn=drop.querySelector('#cliAcBtnReceita');
              const div=drop.querySelector('#cliAcReceitaResult');
              btn.disabled=true;btn.textContent='⏳ Consultando...';
              const res=await buscarCpfReceita(onlyDigits(t));
              btn.disabled=false;
              if(!res||!res.nome){
                div.style.display='block';
                div.innerHTML='<span style="color:var(--danger);">CPF não encontrado ou serviço indisponível.</span>';
                btn.textContent='🔎 Buscar na Receita Federal';
              } else {
                fechar();
                abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();},{nome:res.nome,cpf:t});
              }
            });
          }
          drop.querySelector('#cliAcBtnCad2')?.addEventListener('mousedown',e=>{
            e.preventDefault();fechar();
            abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});
          });
        }
      }
      inp.addEventListener('input',()=>{
        const t=inp.value.trim();focusIdx=-1;
        if(t.length<2){fechar();return;}
        msg('Buscando...');clearTimeout(timer);
        timer=setTimeout(async()=>{
          const r=await gatewayCall({op:'searchClients',params:{termo:t}});
          if(inp.value.trim()!==t)return;
          renderRes((r&&r.data)||[]);
        },280);
      });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.cli-ac-item');if(!items.length)return;
        if(e.key==='ArrowDown'){e.preventDefault();focusIdx=Math.min(focusIdx+1,items.length-1);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='ArrowUp'){e.preventDefault();focusIdx=Math.max(focusIdx-1,0);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='Enter'&&focusIdx>=0){e.preventDefault();items[focusIdx].dispatchEvent(new MouseEvent('mousedown'));}
        else if(e.key==='Escape'){fechar();}
      });
      document.addEventListener('mousedown',function h(e){if(!wrap.contains(e.target)){fechar();document.removeEventListener('mousedown',h);}});
      wrap.querySelector('#cliAcCad_os').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    }
  }
  renderWrap();
  return {getCliente:()=>clienteSel};
}

/**
 * Mounts a "valor total + formas de pagamento" widget bound to `holder` ({valorTotal, pagamentos:[{formaId,valor}]}).
 * Supports more than one payment method per order (ex: parte no cartão, parte no PIX).

/**
 * Mounts o widget de pagamento vinculado ao `holder`:
 * { momentoPagamento:'na_encomenda'|'na_volta', valorTotal, pagamentos:[{formaId,valor}],
 *   emissaoNota:'sim'|'nao', numeroNota, lojaNotaId }
 * Regras:
 * - "Pago no ato da encomenda" ou "Pagar na volta (retirada)".
 * - Só quando "pago no ato" é que aparece a pergunta de emissão de nota; se sim, número + loja da nota.
 * - Valores recebidos/a receber são calculados a partir da soma dos pagamentos vs valor total,
 *   usados no Painel e no Dashboard para os filtros de "Recebido"/"A receber".
 */
/**
 * Valida a exigência: quando emite nota, a empresa que RECEBEU o pagamento
 * precisa ser a mesma que EMITIU a nota (mesmo CNPJ pagando e faturando).
 * Retorna null se estiver tudo certo, ou uma mensagem de erro pra mostrar.
 */
function notaEmpresasErro(holder){
  if(holder.emissaoNota !== 'sim') return null;
  if(!holder.lojaSaidaId || !holder.lojaPagamentoId || !holder.lojaNotaId){
    return 'Selecione as 3 empresas (saída da joia, pagamento e nota).';
  }
  if(holder.lojaPagamentoId !== holder.lojaNotaId){
    return 'A empresa que recebeu o pagamento precisa ser a mesma que emitiu a nota.';
  }
  return null;
}

  if(!holder.emissaoNota) holder.emissaoNota = ''; // sem pré-seleção

  function draw(){
    container.innerHTML = `

        <div class="pag-info-cel" style="flex:1 1 auto;min-width:120px;">

          <div class="pag-info-cel-val">
            <input type="number" step="0.01" min="0" id="pagValorTotal" placeholder="0,00"
              style="border:none;background:transparent;font-size:18px;font-weight:800;width:110px;padding:0;outline:none;color:var(--ink);"
              value="${holder.valorTotal!==undefined && holder.valorTotal!==null ? holder.valorTotal : ''}">
          </div>
        </div>
        <div class="pag-toggle-cel" style="flex:0 0 auto;">
          <div class="pag-info-cel-label">Quando paga?</div>
          <div class="pag-toggle-inner toggle-group">
            <div class="toggle-opt">
              <input type="radio" name="pagMomento" id="pagMomEnc" value="na_encomenda" ${holder.momentoPagamento==='na_encomenda'?'checked':''}>
              <label for="pagMomEnc">💳 Pago agora</label>
            </div>
            <div class="toggle-opt">
              <input type="radio" name="pagMomento" id="pagMomVolta" value="na_volta" ${holder.momentoPagamento==='na_volta'?'checked':''}>
              <label for="pagMomVolta">🔄 Na volta</label>
            </div>
          </div>
        </div>
        <div class="pag-toggle-cel" style="flex:0 0 auto;">
          <div class="pag-info-cel-label">Nota fiscal</div>
          <div class="pag-toggle-inner toggle-group">
            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaSim" value="sim" ${holder.emissaoNota==='sim'?'checked':''}>
              <label for="pagNotaSim">✅ Sim</label>
            </div>
            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaNao" value="nao" ${holder.emissaoNota==='nao'?'checked':''}>
              <label for="pagNotaNao">❌ Não</label>
            </div>
          </div>
        </div>
      </div>
      <div id="pagRows"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddPagamento">+ Adicionar forma de pagamento</button>
      <div class="muted" id="pagSomaHint" style="margin-top:6px;"></div>
      <div id="pagNotaWrap" style="display:none;">
        <div class="field">
          <label>Emitiu nota fiscal?</label>
          <div class="toggle-group" style="max-width:220px;">
            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaSim2" value="sim" ${holder.emissaoNota==='sim'?'checked':''}>
              <label for="pagNotaSim2">✅ Sim</label>
            </div>
            <div class="toggle-opt">
              <input type="radio" name="pagEmiteNota" id="pagNotaNao2" value="nao" ${holder.emissaoNota==='nao'?'checked':''}>
              <label for="pagNotaNao2">❌ Não</label>
            </div>
          </div>
        </div>
        <div id="pagNotaCamposWrap" style="display:none;">
          <div class="field"><label>Número da nota</label><input id="pagNumeroNota" placeholder="Ex: 12345" value="${escapeHtml(holder.numeroNota||'')}"></div>
          <div class="grid-3">
            <div class="field"><label>Empresa de onde sai a joia</label><select id="pagLojaSaida">${lojaOptionsHtml(holder.lojaSaidaId||'')}</select></div>
            <div class="field"><label>Empresa que recebeu o pagamento</label><select id="pagLojaPagamento">${lojaOptionsHtml(holder.lojaPagamentoId||'')}</select></div>
            <div class="field"><label>Empresa que emitiu a nota</label><select id="pagLojaNota">${lojaOptionsHtml(holder.lojaNotaId||'')}</select></div>
          </div>
          <div class="muted" id="pagNotaErroHint" style="margin-top:2px;"></div>
        </div>
      </div>
    `;
    drawRows();
    atualizarVisibilidadeNota();
    container.querySelectorAll('input[name="pagMomento"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.momentoPagamento = r.value; atualizarVisibilidadeNota(); });
    });
    container.querySelector('#pagValorTotal').addEventListener('input', (e)=>{
      holder.valorTotal = e.target.value === '' ? null : parseFloat(e.target.value);
      updateHint();
    });
    container.querySelector('#btnAddPagamento').addEventListener('click', ()=>{
      const primeiraForma = (config.paymentTypes && config.paymentTypes[0]) ? config.paymentTypes[0].id : '';
      holder.pagamentos.push({ formaId: primeiraForma, valor: '' });
      drawRows();
    });
    container.querySelectorAll('input[name="pagEmiteNota"]').forEach(r=>{
      r.addEventListener('change', ()=>{ holder.emissaoNota = r.value; atualizarVisibilidadeNota(); });
    });
    const numNotaEl = container.querySelector('#pagNumeroNota');
    if(numNotaEl) numNotaEl.addEventListener('input', ()=>{ holder.numeroNota = numNotaEl.value.trim(); });
    const lojaSaidaEl = container.querySelector('#pagLojaSaida');
    if(lojaSaidaEl) lojaSaidaEl.addEventListener('change', ()=>{ holder.lojaSaidaId = lojaSaidaEl.value; atualizarErroEmpresas(); });
    const lojaPagamentoEl = container.querySelector('#pagLojaPagamento');
    if(lojaPagamentoEl) lojaPagamentoEl.addEventListener('change', ()=>{ holder.lojaPagamentoId = lojaPagamentoEl.value; atualizarErroEmpresas(); });
    const lojaNotaEl = container.querySelector('#pagLojaNota');
    if(lojaNotaEl) lojaNotaEl.addEventListener('change', ()=>{ holder.lojaNotaId = lojaNotaEl.value; atualizarErroEmpresas(); });
    atualizarErroEmpresas();
  }

  function atualizarErroEmpresas(){
    const hint = container.querySelector('#pagNotaErroHint');
    if(!hint) return;
    const msg = notaEmpresasErro(holder);
    hint.innerHTML = msg ? `<span style="color:var(--danger); font-weight:700;">⚠ ${escapeHtml(msg)}</span>` : '';
  }

  function atualizarVisibilidadeNota(){
    const notaWrap = container.querySelector('#pagNotaWrap');
    const camposWrap = container.querySelector('#pagNotaCamposWrap');
    if(!notaWrap) return;
    if(holder.momentoPagamento === 'na_encomenda'){
      notaWrap.style.display = '';
      camposWrap.style.display = holder.emissaoNota === 'sim' ? '' : 'none';
    }else{
      notaWrap.style.display = 'none';
      holder.emissaoNota = 'nao';
      holder.numeroNota = '';
      holder.lojaSaidaId = '';
      holder.lojaPagamentoId = '';
      holder.lojaNotaId = '';
    }
    atualizarErroEmpresas();
  }

  function drawRows(){
    const wrap = container.querySelector('#pagRows');
    wrap.innerHTML = holder.pagamentos.map((p,i)=>`
      <div class="grid-2" style="margin-bottom:6px;">
        <select data-pagform="${i}">${(config.paymentTypes||[]).map(pt=>`<option value="${pt.id}" ${p.formaId===pt.id?'selected':''}>${escapeHtml(pt.nome)}</option>`).join('')}<option value="__credito" ${p.formaId==='__credito'?'selected':''}>💳 Crédito do cliente</option><option value="__fiado" ${p.formaId==='__fiado'?'selected':''}>📝 Fiado</option></select>
        <div style="display:flex; gap:6px;">
          <input type="number" step="0.01" min="0" data-pagvalor="${i}" placeholder="Valor" value="${p.valor!==undefined && p.valor!==null && p.valor!=='' ? p.valor : ''}" style="flex:1;">
          <button type="button" class="icon-btn" data-pagdel="${i}" title="Remover">✕</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-pagform]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ holder.pagamentos[Number(sel.dataset.pagform)].formaId = sel.value; });
    });
    wrap.querySelectorAll('[data-pagvalor]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        holder.pagamentos[Number(inp.dataset.pagvalor)].valor = inp.value === '' ? '' : parseFloat(inp.value);
        updateHint();
      });
    });
    wrap.querySelectorAll('[data-pagdel]').forEach(b=>{
      b.addEventListener('click', ()=>{
        holder.pagamentos.splice(Number(b.dataset.pagdel),1);
        drawRows();
        updateHint();
      });
    });
    updateHint();
  }

  function updateHint(){
    const hint = container.querySelector('#pagSomaHint');
    if(!hint) return;
    if(holder.pagamentos.length === 0){ hint.textContent = ''; return; }
    const soma = holder.pagamentos.reduce((acc,p)=> acc + (Number(p.valor)||0), 0);
    const total = Number(holder.valorTotal)||0;
    if(Math.abs(soma - total) > 0.009){
      hint.innerHTML = `<span style="color:var(--danger);">Soma dos pagamentos (R$ ${soma.toFixed(2)}) diferente do valor total (R$ ${total.toFixed(2)}).</span>`;
    }else{
      hint.innerHTML = `<span style="color:var(--ok);">Soma dos pagamentos confere com o valor total (R$ ${total.toFixed(2)}).</span>`;
    }
  }

  draw();
}

/** Soma já paga de uma ordem/venda (a partir dos pagamentos lançados). */
function valorRecebidoDe(o){ return (o.pagamentos||[]).reduce((acc,p)=> acc + ((p.formaId==='__fiado'||p.formaId==='__credito') ? 0 : (Number(p.valor)||0)), 0); }
/* Fiado/crédito não entram como recebido: fiado movimenta o caixa só quando as parcelas
   são pagas (Cadastro → Clientes → Débitos); crédito entrou no caixa na recarga. */
/** Valor ainda pendente (nunca negativo). */
function valorAReceberDe(o){ return Math.max(0, (Number(o.valorTotal)||0) - valorRecebidoDe(o)); }
/** true quando NENHUMA informação de pagamento foi lançada — dispara o aviso vermelho e o filtro. */
function semPagamentoLancado(o){ return !o.valorTotal && (!o.pagamentos || o.pagamentos.length===0); }

function promptCiente(callback){
  openModal(`
    <h3>Marcar como ciente</h3>
    <p>Informe o nome de quem está tomando ciência desta observação.</p>
    <div class="field"><label>Nome</label><input id="cienteNomeInp" placeholder="Nome"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cienteCancel">Cancelar</button>
      <button class="btn btn-accent" id="cienteConfirm">Confirmar</button>
    </div>
  `);
  document.getElementById('cienteCancel').addEventListener('click', closeModal);
  document.getElementById('cienteConfirm').addEventListener('click', ()=>{
    const nome = maiusc(document.getElementById('cienteNomeInp').value);
    if(!nome){ showToast('Informe o nome.'); return; }
    closeModal();
    callback(nome);
  });
}

/**
 * Asks who received the product before an order can be marked as "Entregue".
 * onCancel fires if the modal is dismissed (Cancelar button OR clicking outside),
 * so callers can revert a <select> that already changed value visually.
 */
function promptRecebidoPor(onConfirm, onCancel){
  modalOnClose = onCancel || null;
  openModal(`
    <h3>Marcar como entregue</h3>
    <p>Informe o nome de quem recebeu o produto.</p>
    <div class="field"><label>Recebido por</label><input id="recebidoNomeInp" placeholder="Nome de quem recebeu"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="recebidoCancel">Cancelar</button>
      <button class="btn btn-accent" id="recebidoConfirm">Confirmar</button>
    </div>
  `);
  document.getElementById('recebidoCancel').addEventListener('click', closeModal);
  document.getElementById('recebidoConfirm').addEventListener('click', ()=>{
    const nome = maiusc(document.getElementById('recebidoNomeInp').value);
    if(!nome){ showToast('Informe o nome de quem recebeu.'); return; }
    modalOnClose = null;
    closeModal();
    onConfirm(nome);
  });
}

function renderAlerts(){
  const bar = document.getElementById('alertBar');
  if(!bar) return;
  if(!currentUser){ bar.innerHTML = ''; return; }
  const pending = [];
  orders.forEach(o=>{
    (o.observacoes||[]).forEach(ob=>{
      if(!ob.ciente && ob.notificarPara && ob.notificarPara.includes(currentUser.id)){
        pending.push({ order:o, obs:ob });
      }
    });
  });
  if(pending.length===0){ bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <div class="alert-bar">
      <div class="alert-inner">
        <div class="alert-title">⚠ ${pending.length} observação(ões) aguardando sua ciência</div>
        ${pending.map(p=>`
          <div class="alert-item">
            <div><b>${escapeHtml(p.order.cliente)}</b> — ${escapeHtml(p.obs.nome)}: ${escapeHtml(p.obs.descricao)}</div>
            <button class="btn btn-primary btn-sm" data-alertciente="${p.order.id}|${p.obs.id}">Marcar ciente</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  bar.querySelectorAll('[data-alertciente]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [oid, obid] = b.dataset.alertciente.split('|');
      promptCiente(async (nome)=>{
        const order = orders.find(x=>x.id===oid);
        const obs = order.observacoes.find(x=>x.id===obid);
        obs.ciente = true; obs.cienteNome = nome; obs.cienteEm = Date.now();
        await saveOrders();
        renderAlerts();
        renderView();
      });
    });
  });
}

/**
 * Mounts a self-contained observations UI (list + add/edit form) into `container`.
 * `orderLike` is either a real persisted order (persisted=true, changes are saved to storage)
 * or a temporary plain object { observacoes: [] } used while a new order is still being drafted
 * (persisted=false, changes only live in memory until the order itself is created).
 */
function mountObservacoes(container, orderLike, persisted){
  if(!orderLike.observacoes) orderLike.observacoes = [];
  let editingId = null;

  async function persistIfNeeded(){
    if(persisted){ await saveOrders(); renderAlerts(); }
  }

  function draw(){
    container.innerHTML = `
      <div class="section-label" style="margin-top:18px;">Observações <span class="muted" style="text-transform:none; font-weight:600; letter-spacing:0;">(uso interno — o cliente NÃO vê isso)</span></div>
      <div id="obsListInner"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnNovaObsInner">+ Lançar nova observação</button>
      <div id="obsFormInner" style="display:none; margin-top:12px; border:1px solid var(--line); border-radius:9px; padding:14px; background:var(--surface-2);"></div>
    `;
    drawList();
    container.querySelector('#btnNovaObsInner').addEventListener('click', ()=>{
      editingId = null;
      openForm();
    });
  }

  function drawList(){
    const listEl = container.querySelector('#obsListInner');
    const list = orderLike.observacoes;
    if(list.length===0){
      listEl.innerHTML = `<div class="muted" style="margin-bottom:8px;">Nenhuma observação registrada.</div>`;
      return;
    }
    listEl.innerHTML = list.slice().sort((a,b)=>b.criadoEm-a.criadoEm).map(o=>`
      <div class="obs-item ${!o.ciente && o.notificarPara.length>0 ? 'obs-pending':''}">
        <div style="display:flex; justify-content:space-between; gap:8px;">
          <div><b>${escapeHtml(o.nome)}</b> <span class="muted">${new Date(o.criadoEm).toLocaleString('pt-BR')}</span></div>
          <div style="display:flex; gap:4px; flex-shrink:0;">
            <button type="button" class="icon-btn" data-obsedit="${o.id}" title="Editar">✎</button>
            <button type="button" class="icon-btn" data-obsdel="${o.id}" title="Excluir observação">🗑</button>
          </div>
        </div>
        <div style="margin:6px 0; font-size:13px;">${escapeHtml(o.descricao)}</div>
        ${o.fotos && o.fotos.length>0 ? `<div class="foto-grid" data-obsfotos="${o.id}"></div>` : ''}
        ${o.notificarPara.length>0 ? `<div class="muted" style="margin-bottom:6px;">Notificar: ${o.notificarPara.map(id=>{const u=config.users.find(x=>x.id===id); return u?escapeHtml(u.nome):'—';}).join(', ')}</div>` : ''}
        ${o.ciente
          ? `<span class="badge" style="background:var(--ok-soft); color:var(--ok);">Ciente: ${escapeHtml(o.cienteNome)} · ${new Date(o.cienteEm).toLocaleDateString('pt-BR')}</span>`
          : (o.notificarPara.length>0 ? `<button type="button" class="btn btn-danger btn-sm" data-obsciente="${o.id}">⚠ Marcar ciente</button>` : `<span class="badge" style="background:var(--surface-2); color:var(--ink-faint);">Sem notificação</span>`)
        }
      </div>
    `).join('');

    listEl.querySelectorAll('[data-obsfotos]').forEach(el=>{
      const obs = list.find(x=>x.id===el.dataset.obsfotos);
      if(obs) mountFotosInline(el, obs.fotos);
    });
    listEl.querySelectorAll('[data-obsedit]').forEach(b=>{
      b.addEventListener('click', ()=>{ editingId = b.dataset.obsedit; openForm(); });
    });
    listEl.querySelectorAll('[data-obsdel]').forEach(b=>{
      b.addEventListener('click', ()=>{
        openModal(`
          <h3>Excluir observação</h3>
          <p>Tem certeza que deseja excluir esta observação? Essa ação não pode ser desfeita.</p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="obsDelCancel">Cancelar</button>
            <button class="btn btn-danger" id="obsDelConfirm">Excluir</button>
          </div>
        `);
        document.getElementById('obsDelCancel').addEventListener('click', closeModal);
        document.getElementById('obsDelConfirm').addEventListener('click', async ()=>{
          orderLike.observacoes = orderLike.observacoes.filter(x=>x.id!==b.dataset.obsdel);
          await persistIfNeeded();
          closeModal();
          draw();
          showToast('Observação excluída.');
        });
      });
    });
    listEl.querySelectorAll('[data-obsciente]').forEach(b=>{
      b.addEventListener('click', ()=>{
        promptCiente(async (nome)=>{
          const obs = orderLike.observacoes.find(x=>x.id===b.dataset.obsciente);
          obs.ciente = true; obs.cienteNome = nome; obs.cienteEm = Date.now();
          await persistIfNeeded();
          draw();
        });
      });
    });
  }

  function openForm(){
    const formEl = container.querySelector('#obsFormInner');
    const editing = editingId ? orderLike.observacoes.find(o=>o.id===editingId) : null;
    const obsFotoHolder = editing || { fotos: [] };
    formEl.style.display = 'block';
    formEl.innerHTML = `
      <div class="field"><label>Nome</label><select id="obsNomeInp">${funcionarioOptionsTodosHtml(editing?editing.nome:'')}</select></div>
      <div class="field"><label>Descrição</label><textarea id="obsDescInp" style="min-height:80px;">${editing?escapeHtml(editing.descricao):''}</textarea></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnToggleNotif">🔔 Notificar</button>
      <div id="notifyBoxInner" style="display:none; margin-top:10px;">
        <div class="muted" style="margin-bottom:6px;">Selecione quem deve ser notificado:</div>
        ${config.users.map(u=>`
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;">
            <input type="checkbox" value="${u.id}" class="obsNotifChk" ${editing && editing.notificarPara.includes(u.id) ? 'checked':''}>
            ${escapeHtml(u.nome)} <span class="muted">(${levelLabel(u.nivel)})</span>
          </label>
        `).join('')}
      </div>
      <div id="obsFotoContainer"></div>
      <div class="modal-actions" style="justify-content:flex-start; margin-top:12px;">
        <button type="button" class="btn btn-accent btn-sm" id="btnConcluirObsInner">Concluir</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnCancelObsInner">Cancelar</button>
      </div>
    `;
    mountFotos(formEl.querySelector('#obsFotoContainer'), obsFotoHolder, persisted && !!editing, false);
    if(editing && editing.notificarPara.length>0){
      formEl.querySelector('#notifyBoxInner').style.display = 'block';
    }
    formEl.querySelector('#btnToggleNotif').addEventListener('click', ()=>{
      const box = formEl.querySelector('#notifyBoxInner');
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    });
    formEl.querySelector('#btnCancelObsInner').addEventListener('click', ()=>{
      formEl.style.display = 'none'; formEl.innerHTML = ''; editingId = null;
    });
    formEl.querySelector('#btnConcluirObsInner').addEventListener('click', async ()=>{
      const nome = formEl.querySelector('#obsNomeInp').value.trim();
      const descricao = maiusc(formEl.querySelector('#obsDescInp').value);
      if(!nome || !descricao){ showToast('Preencha nome e descrição da observação.'); return; }
      const notificarPara = Array.from(formEl.querySelectorAll('.obsNotifChk:checked')).map(c=>c.value);
      if(editing){
        editing.nome = nome; editing.descricao = descricao; editing.notificarPara = notificarPara;
      } else {
        orderLike.observacoes.push({
          id: uid('obs'), nome, descricao, notificarPara,
          criadoEm: Date.now(), ciente:false, cienteNome:null, cienteEm:null,
          fotos: obsFotoHolder.fotos
        });
      }
      await persistIfNeeded();
      formEl.style.display = 'none'; formEl.innerHTML = ''; editingId = null;
      draw();
      showToast('Observação registrada.');
    });
  }

  draw();
}

/* ============================================================
   MODO EMBUTIDO — quando este arquivo é aberto dentro do shell
   único (index.html), a senha já foi pedida lá; aqui a gente só
   escuta a autenticação e os comandos de troca de aba via postMessage,
   e não mostra a tela de login nem a barra de abas/topo próprias
   (o shell já tem a barra lateral e as abas por cima).
   ============================================================ */
const EMBEDDED = window.self !== window.top;
let pendingAbrirId = null;
function atualizarFaixaLoja(){
  const faixa = document.getElementById('lojaFaixa');
  if(!faixa) return;
  if(window.__lojaAtual && window.__lojaAtual.nome){
    faixa.style.display = 'block';
    faixa.style.background = window.__lojaAtual.cor || '#7a1f3d';
    faixa.textContent = '🏬 ' + window.__lojaAtual.nome;
  } else {
    faixa.style.display = 'none';
  }
}
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  function mensagemConfiavel(ev){
    try{
      if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
      return true;
    }catch(e){ return false; }
  }

  window.addEventListener('message', async (ev)=>{
    if(!mensagemConfiavel(ev)) return;
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'pedirRascunho'){
      if(modalAberto) closeModal();
      if(EMBEDDED) parent.postMessage({ type:'semRascunho', modulo:'os' }, '*');
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    } else if(ev.data.type === 'abrirRegistro'){
      // Veio do "Leitor de código" no menu — abre a O.S. assim que os dados estiverem
      // carregados (se já estiverem, abre na hora).
      pendingAbrirId = ev.data.id;
      if(currentUser && Array.isArray(orders) && orders.length){
        const alvo = orders.find(o=>o.id===pendingAbrirId);
        if(alvo){ openEditModal(alvo.id, false); pendingAbrirId = null; }
      }
    } else if(ev.data.type === 'clientesAtualizados'){
      // O módulo Cadastro mexeu no cadastro de clientes. Como este módulo fica
      // vivo no iframe, a lista em memória ficaria velha — recarrega na hora.
      clientes = []; // sem lista completa em memória: só limpa o cache local
    } else if(ev.data.type === 'lojaAtual'){
      window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
      atualizarFaixaLoja();
      if(currentUser) renderView();
    }
  });
}

async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass){ return; }
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  enterApp();
}

function tabsForLevel(){
  const t = [];
  t.push({ id:'painel', label:'Painel', icon:'📋' });
  t.push({ id:'agenda', label:'Agenda', icon:'🗓️' });
  if(currentUser.nivel==='oficina' || currentUser.nivel==='diretoria'){
    t.push({ id:'codigo', label:'Código', icon:'🔑' });
  }
  if(window.__permissoesAbasOverride){
    return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();

  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; modoNovaOrdem = false; renderTabs(); renderView(); });
    nav.appendChild(b);
  });

  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; modoNovaOrdem = false; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'os', tabId: currentTab }, '*');
}
function renderView(){
  renderAlerts();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(modoNovaOrdem) renderNovaOrdem(main);
  else if(currentTab==='painel') renderPainel(main);
  else if(currentTab==='agenda') renderAgenda(main);
  else if(currentTab==='codigo') renderGerarCodigo(main);
}

function checkSlot(serviceTypeId, dateStr, excludeOrderId){
  const st = config.serviceTypes.find(s=>s.id===serviceTypeId);
  if(!st || !dateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateStr+'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  const prazoOk = diffDays >= st.prazoMinimoDias;
  const countDay = orders.filter(o=> o.serviceTypeId===serviceTypeId && o.data===dateStr && o.status===STATUS.AGUARDANDO && o.id!==excludeOrderId).length;
  const quantidadeOk = countDay < st.maxPorDia;
  return {
    st, prazoOk, quantidadeOk, ok: prazoOk && quantidadeOk,
    ocupadas:countDay, vagas: st.maxPorDia, diffDays
  };
}

/** Cargos de um funcionário do cadastro central, sempre como array (aceita registros antigos com 'area'). */
function cargosDoFuncionario(f){
  if(Array.isArray(f.cargos) && f.cargos.length) return f.cargos;
  return f.area ? [f.area] : [];
}
/**
 * Diz se o funcionário atende a uma área da tela.
 * 'vendedora' = quem vende: Vendedora, Gerente e Diretor(a) (definido em Cadastro → Funcionários).
 * 'oficina'   = quem tem a função Oficina marcada.
 */
function funcionarioAtendeArea(f, area){
  const cargos = cargosDoFuncionario(f);
  if(area==='oficina') return cargos.includes('oficina');
  return cargos.includes('vendedora') || cargos.includes('gerente') || cargos.includes('diretor');
}
/** Nome que aparece nas listas dos módulos: o apelido do cadastro, ou o nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Um nome gravado numa O.S. antiga pode ser o nome completo; aqui bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** Converte um nome gravado (completo ou apelido) pro apelido atual do cadastro. */
function nomeGravadoParaExibicao(lista, nomeGravado){
  const f = (lista||[]).find(x=>funcionarioBateComNome(x, nomeGravado));
  return f ? nomeExibicaoFuncionario(f) : nomeGravado;
}
/** Rótulo curto da função principal, usado nas listas que misturam áreas. */
function cargoLabelFuncionario(f){
  const cargos = cargosDoFuncionario(f);
  if(cargos.includes('diretor')) return 'Diretor(a)';
  if(cargos.includes('gerente')) return 'Gerente';
  if(cargos.includes('vendedora')) return 'Vendedora';
  if(cargos.includes('oficina')) return 'Oficina';
  return 'Funcionário';
}
/** Monta as <option> de funcionários com acesso Oficina OU Diretoria — usado no gerador
 * de código de autorização, já que só esses dois níveis podem autorizar um encaixe. */
function funcionarioOptionsOficinaOuDiretoriaHtml(selected){
  const lista = (config.funcionarios||[]).filter(f=>{
    const cargos = cargosDoFuncionario(f);
    return cargos.includes('oficina') || cargos.includes('diretor');
  });
  const vazio = lista.length===0 ? `<option value="" disabled>Nenhum(a) funcionário(a) de Oficina ou Diretoria cadastrado(a)</option>` : '';
  const sel = nomeGravadoParaExibicao(config.funcionarios||[], selected);

  const extra = naoEstaNaLista ? `<option value="${escapeHtml(sel)}" selected>${escapeHtml(sel)} (não cadastrado)</option>` : '';
  return `<option value="">Selecione</option>${vazio}${extra}` + lista.map(f=>{
    const n = nomeExibicaoFuncionario(f);
    return `<option value="${escapeHtml(n)}" ${sel===n?'selected':''}>${escapeHtml(n)} (${cargoLabelFuncionario(f)})</option>`;
  }).join('');
}

function funcionarioOptionsHtml(area, selected){

let produtosEstoque = [];

function unidadeEstoqueLabel(u){ return u==='g' ? 'g' : u==='kg' ? 'kg' : 'un'; }

/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`,
 * explodindo pela composição (receita) em cascata quando falta estoque em
 * qualquer nível — ex: falta o produto pronto -> usa o insumo secundário ->
 * se também faltar, usa os insumos primários que compõem o secundário.
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
/**
 * Planeja o consumo de `quantidadeNecessaria` unidades do produto `produtoId`, NA
 * LOJA `lojaId` (estoque agora é por loja, não mais um número global), explodindo
 * pela composição (receita) em cascata quando falta estoque em qualquer nível —
 * ex: falta o produto pronto -> usa o insumo secundário -> se também faltar, usa
 * os insumos primários que compõem o secundário (sempre dentro da mesma loja).
 * `reservas` acumula quanto de cada produto já foi planejado consumir nesta
 * venda (pra não contar duas vezes o mesmo estoque entre itens diferentes).
 * Retorna { ok, faltando:[{produtoId, nome, quantidade}] }.
 */
function planejarConsumoEstoque(produtoId, quantidadeNecessaria, reservas, lojaId){
  const produto = produtosEstoque.find(p=>p.id===produtoId);
  if(!produto) return { ok:false, faltando:[{ produtoId, nome:'(produto não encontrado)', quantidade:quantidadeNecessaria }] };

  const estoqueNaLoja = Number((produto.estoquePorLoja||{})[lojaId]) || 0;
  const jaReservado = reservas[produtoId] || 0;
  const disponivel = Math.max(0, estoqueNaLoja - jaReservado);
  const usarDoProprio = Math.min(disponivel, quantidadeNecessaria);
  if(usarDoProprio > 0) reservas[produtoId] = jaReservado + usarDoProprio;

  const faltaAinda = quantidadeNecessaria - usarDoProprio;
  if(faltaAinda <= 1e-9) return { ok:true, faltando:[] };

  if(!produto.composicao || produto.composicao.length===0){
    return { ok:false, faltando:[{ produtoId, nome:produto.nome, quantidade:faltaAinda }] };
  }

  let tudoOk = true;
  const faltandoTotal = [];
  produto.composicao.forEach(comp=>{
    const qtdComponente = (Number(comp.quantidade)||0) * faltaAinda;
    const resultado = planejarConsumoEstoque(comp.insumoId, qtdComponente, reservas, lojaId);
    if(!resultado.ok){ tudoOk = false; faltandoTotal.push(...resultado.faltando); }
  });
  return { ok: tudoOk, faltando: faltandoTotal };
}

function mountItens(container, holder, getLojaId){
  if(!holder.itens) holder.itens = [];
  getLojaId = getLojaId || (()=>'');

  function totalItens(){ return holder.itens.reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0); }

  /** Recalcula valorUnitario a partir do preço original + desconto/acréscimo (se algum
   * ajuste estiver configurado). Se não houver ajuste, não mexe no que já está lá — a
   * pessoa ainda pode digitar o valor unitário na mão, direto. */
  /* Recalcula o valor final após um ajuste de desconto/acréscimo via botões.
   Atualiza o campo de valor e o span de total inline sem redesenhar a linha. */
function recalcularAjusteNovo(it, idx, row){
  if(it.ajusteTipo==='nenhum'||it.ajusteQtd===''||it.ajusteQtd==null){ return; }
  const base = Number(it.precoOriginal)||0;
  if(!base) return;
  const qtd = Number(it.ajusteQtd)||0;
  const delta = it.ajusteModo==='percentual' ? base*qtd/100 : qtd;
  it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
  const inpVal=row ? row.querySelector('[data-itfield="valorUnitario"]') : null;
  if(inpVal) inpVal.value=Number(it.valorUnitario).toFixed(2);
  const span=document.getElementById('descTotal_'+idx);
  if(span) span.textContent='= R$ '+Number(it.valorUnitario).toFixed(2);
  updateTotalHint();
}
function recalcularValorAjustado(it){
    if(it.ajusteTipo==='desconto' || it.ajusteTipo==='acrescimo'){
      const base = Number(it.precoOriginal)||0;
      const qtdAjuste = Number(it.ajusteQtd)||0;
      const delta = it.ajusteModo==='percentual' ? base*qtdAjuste/100 : qtdAjuste;
      it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
