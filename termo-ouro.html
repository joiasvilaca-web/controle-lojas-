<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termo de compra de ouro — Vilaça Joias</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--vinho:#662344;--vinho-esc:#3d1428;--vinho-medio:#7a2d52;--ouro:#d9b26a;--ouro-claro:#f3dfae;--creme:#fbf6ee;--apoio:rgba(251,246,238,.82)}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;color:var(--creme);
  background:radial-gradient(1100px 650px at 50% -10%,#8a3560 0%,transparent 60%),linear-gradient(165deg,var(--vinho-medio),var(--vinho) 45%,var(--vinho-esc));
  background-attachment:fixed;min-height:100vh;padding:22px 14px 40px;display:flex;justify-content:center}
.cartao{width:100%;max-width:440px;display:grid;gap:14px;align-content:start}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif}p,h1,h2{margin:0}
.apoio{font-size:13px;color:var(--apoio)}
.topo{text-align:center}.logo{display:block;width:200px;height:auto;margin:0 auto;color:var(--ouro-claro)}
.topo h1{font-style:italic;font-weight:500;font-size:30px;line-height:1.1;margin:16px 0 0}.topo h1 b{color:var(--ouro-claro)}
.filete{display:block;width:56px;height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--ouro),transparent)}
.sec{border-radius:18px;padding:18px 16px;background:rgba(251,246,238,.08);border:1px solid rgba(251,246,238,.14)}
.sec>h2{font-weight:600;font-size:24px;line-height:1.15;margin-bottom:10px}.sec>h2 em{font-style:italic;color:var(--ouro-claro)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv span:nth-child(odd){color:var(--apoio);font-size:13px;align-self:center}.kv span:nth-child(even){text-align:right;font-weight:500;word-break:break-word}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.16)}.item:last-of-type{border-bottom:0}
.item .d{min-width:0}.item .v{text-align:right;white-space:nowrap}.item .v b{font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:12px;border-top:1px solid rgba(217,178,106,.4)}
.total .serif{font-size:34px;font-weight:700;color:var(--ouro-claro)}
.termo{max-height:280px;overflow:auto;padding:12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(251,246,238,.14);font-size:13.5px;line-height:1.5;color:rgba(251,246,238,.92);-webkit-overflow-scrolling:touch}
.termo h3{font-size:13.5px;margin:12px 0 4px;color:var(--ouro-claro)}.termo h3:first-child{margin-top:0}.termo p{margin:0 0 6px}
.guia{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--apoio)}
.prog{height:4px;border-radius:99px;background:rgba(255,255,255,.14);flex:1;margin-left:10px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--ouro);transition:width .15s}
.foto{display:flex;gap:12px;align-items:center}
.mini{width:64px;height:64px;border-radius:12px;border:1px dashed var(--ouro);background:rgba(0,0,0,.25) center/cover no-repeat;flex:none}
.ciente{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px dashed var(--ouro);background:rgba(0,0,0,.2);opacity:.45;transition:.25s}
.ciente.liberado{opacity:1}.ciente input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--ouro);flex:none}.ciente label{font-size:15px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:700;font-size:17px;color:var(--vinho-esc);
  background:linear-gradient(160deg,#f7e6b9,var(--ouro) 80%);box-shadow:0 14px 28px -14px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.secundario{width:auto;padding:12px 16px;font-size:15px}
.codigo{text-align:center;border-color:rgba(217,178,106,.6);background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.16))}
.codigo .num{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:60px;letter-spacing:.14em;color:var(--ouro-claro);line-height:1;margin:10px 0 6px;padding-left:.14em}
.ok{display:inline-flex;align-items:center;gap:8px;background:rgba(217,178,106,.18);border:1px solid var(--ouro);color:var(--ouro-claro);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600}
.erro{color:#ffd4d4;background:rgba(160,30,30,.3);border:1px solid rgba(255,120,120,.5);border-radius:12px;padding:12px 14px;font-size:14.5px}
.carregando{text-align:center;padding:50px 0;color:var(--apoio)}
</style></head>

function ligar(){
  const t = document.getElementById('termo'), chk = document.getElementById('chk'), bt = document.getElementById('aceitar');
  let leu = false, temFoto = false;
  const atualiza = ()=>{ bt.disabled = !(chk.checked && temFoto); };
  const rolou = ()=>{
    const fim = t.scrollTop + t.clientHeight >= t.scrollHeight - 6;
    document.getElementById('prog').style.width = Math.min(100,(t.scrollTop + t.clientHeight)/t.scrollHeight*100)+'%';
    if(fim && !leu){ leu = true; document.getElementById('ciente').classList.add('liberado'); chk.disabled = false; document.getElementById('guiaTxt').textContent = 'Termo lido'; }
  };
  t.addEventListener('scroll', rolou); rolou();
  chk.addEventListener('change', atualiza);
  document.getElementById('foto').addEventListener('change', e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{ const im = new Image(); im.onload = ()=>{
      // quadrada e leve: o que vai para o Drive e para o PDF
      const c = document.createElement('canvas'); c.width = c.height = 520;
      const x = c.getContext('2d'); const m = Math.min(im.width, im.height);
      x.drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, 0, 520, 520);
      const url = c.toDataURL('image/jpeg', .82);
      fotoB64 = url.split(',')[1];
      document.getElementById('mini').style.backgroundImage = 'url('+url+')';
      temFoto = true; atualiza();
    }; im.src = fr.result; };
    fr.readAsDataURL(f);
  });
  bt.addEventListener('click', async ()=>{
    bt.disabled = true; bt.textContent = 'Registrando…';
    const r = await api({ op:'aceitar', foto: fotoB64 });
    if(!r || r.error){ bt.disabled = false; bt.textContent = 'Aceitar e gerar código'; document.getElementById('msg').innerHTML = '<div class="erro">'+esc(r&&r.error||'Não consegui registrar.')+'</div>'; return; }
    document.getElementById('num').textContent = r.codigo || '——————';
    document.getElementById('quando').textContent = r.aceiteEm ? ('Aceito em ' + r.aceiteEm) : '';
    document.getElementById('cod').hidden = false;
    bt.hidden = true; document.getElementById('ciente').hidden = true; document.getElementById('fotoSec').hidden = true;
    document.getElementById('msg').innerHTML = '';
    document.getElementById('cod').scrollIntoView({ behavior:'smooth' });
  });
}

(async function(){
  if(!T){ falha('Link inválido. Abra pelo botão da mensagem que a loja enviou.'); return; }
  const d = await api({ op:'cartao' });
  if(!d || d.error){ falha((d && d.error) || 'Não consegui abrir o termo.'); return; }
  if(d.status === 'cancelado'){ falha('Este termo foi cancelado pela loja. Peça um novo.'); return; }
  desenhar(d);
})();
