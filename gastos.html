<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos — Gestão e Controle</title>
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#F5F7F9;
  --ink:#151C28;--ink-soft:#4B5563;--ink-faint:#8B93A1;
  --line:#D7DCE2;--accent:#662344;--accent-soft:#FDD49E;
  --ok:#188A54;--ok-soft:#D7F3E3;
  --danger:#C4272B;--danger-soft:#FADADA;
  --wait:#B8650A;--wait-soft:#FBE6C7;
  --gold-ink:#8a6a1f;--gold-soft:#f6ecd6;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.tabs-bar{display:flex;gap:2px;padding:14px 16px 0;background:var(--surface);border-bottom:1.5px solid var(--line);overflow-x:auto;}
.tabs-bar button{padding:8px 14px;border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink-faint);border-bottom:2.5px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0;transition:all .15s;white-space:nowrap;}
.tabs-bar button.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-content{display:none;padding:18px 16px;max-width:1000px;margin:0 auto;}
.tab-content.active{display:block;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid var(--line);}
.page-title{font-size:22px;font-weight:700;margin:0 0 3px;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;}
.muted{color:var(--ink-faint);}
.empty{padding:32px;text-align:center;color:var(--ink-faint);font-size:14px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{filter:brightness(1.1);}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--line);}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);border-bottom:1.5px solid var(--line);}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);}
.filters input[type=text]{flex:1;min-width:160px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border-radius:14px;padding:24px;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field input[readonly]{background:var(--surface-2);color:var(--ink-faint);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.grid-2{grid-template-columns:1fr;}}
.combo{display:flex;gap:6px;align-items:stretch;}
.combo select{flex:1;}
.btn-mini{padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;font-weight:700;color:var(--accent);}
.btn-mini:hover{background:var(--accent-soft);}
.alerta-box{background:var(--wait-soft);border:1.5px solid #f5c842;border-radius:12px;padding:14px 18px;margin-bottom:16px;}
.alerta-box.danger{background:var(--danger-soft);border-color:#f5b8b8;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.kpi-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;}
.kpi-card .kpi-val{font-size:18px;font-weight:800;}
.kpi-card .kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-top:2px;}
.agenda-dia{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 4px;min-height:72px;font-size:11px;}
.agenda-dia.hoje{border-color:var(--accent);background:rgba(102,35,68,.06);}
.agenda-dia .dia-num{font-weight:700;font-size:12px;margin-bottom:3px;}
.agenda-item{border-radius:3px;padding:1px 4px;margin-bottom:1px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:#fff;}
.agenda-item.vencido-borda{outline:1.5px solid var(--danger);}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer;}
.icon-btn:hover{background:var(--line);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.recorrencia-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--gold-ink);}
.rec-menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:6px;z-index:50;display:flex;flex-direction:column;gap:2px;min-width:170px;}
.rec-menu button{border:none;background:transparent;text-align:left;padding:8px 12px;border-radius:6px;font-size:13px;}
.rec-menu button:hover{background:var(--surface-2);}
.rec-menu button.sel{background:var(--accent-soft);color:var(--gold-ink);font-weight:700;}
.legenda-status{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
</style>
</head>
<body>

<div class="tabs-bar" id="tabsBar">
  <button class="active" data-tab="lancamentos">📋 Lançamentos</button>
  <button data-tab="agenda">📅 Agenda</button>
</div>

<!-- LANÇAMENTOS -->
<div class="tab-content active" id="tab-lancamentos">
  <div class="page-head">
    <div><h1 class="page-title">💸 Gastos e Despesas</h1><p class="page-sub">Todos os lançamentos — avulsos, recorrentes e parcelados.</p></div>
    <button class="btn btn-accent" id="btnNovoGasto">+ Adicionar</button>
  </div>
  <div id="alertasVencimento"></div>
  <div id="kpisGastos" class="kpi-grid"></div>
  <div class="filters">
    <input type="text" id="gastoBusca" placeholder="Buscar por nome ou categoria...">
    <select id="gastoFiltroStatus"><option value="">Todos os status</option></select>
    <select id="gastoFiltroCategoria"><option value="">Todas as categorias</option></select>
    <select id="gastoFiltroLoja"><option value="">Todas as lojas</option></select>
    <input type="month" id="gastoFiltroMes" title="Filtrar por mês">
    <button class="btn btn-ghost btn-sm" id="btnLimparFiltroGasto">Limpar</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto;"><div id="gastosTabela"></div></div>
</div>

<!-- AGENDA -->
<div class="tab-content" id="tab-agenda">
  <div class="page-head">
    <div><h1 class="page-title">📅 Agenda de Contas</h1><p class="page-sub">Visão mensal — cores conforme o status de cada conta.</p></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost btn-sm" id="btnAgendaMesAnt">‹ Anterior</button>
      <span id="agendaMesLabel" style="font-weight:700;font-size:14px;min-width:130px;text-align:center;"></span>
      <button class="btn btn-ghost btn-sm" id="btnAgendaMesPro">Próximo ›</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;">
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Dom</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Seg</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Ter</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Qua</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Qui</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Sex</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Sáb</div>
  </div>
  <div id="agendaCalendario"></div>
  <div class="legenda-status" id="legendaStatus"></div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
let __gatewaySenha = null;
let currentUser = null;
let config = {};
let gastos = [];
let fixos = [];
let agendaMesAtual = new Date();

/* ===== Config de gastos (categorias, formas de pagamento e status customizáveis) ===== */
const CATEGORIAS_PADRAO = ['Aluguel','Energia Elétrica','Água e Saneamento','Internet / Telefone','Folha de Pagamento','Pró-labore','Fornecedores','Material de Escritório','Marketing e Publicidade','Manutenção','Impostos e Taxas','Contador','Seguro','Transporte / Frete','Equipamentos','Software / Assinatura','Outros'];
const FORMAS_PG_PADRAO = ['Dinheiro','PIX','Boleto','Cartão de Crédito','Cartão de Débito','Transferência','Débito Automático'];
const STATUS_PADRAO = [
  { id:'apagar', nome:'A pagar', cor:'#B8650A', tipoPago:false },
  { id:'pago',   nome:'Pago',    cor:'#188A54', tipoPago:true  },
  { id:'cancelado', nome:'Cancelado', cor:'#8B93A1', tipoPago:false },
];
function gastosCfg(){
  if(!config.gastosConfig) config.gastosConfig = {};
  const gc = config.gastosConfig;
  if(!Array.isArray(gc.categorias) || gc.categorias.length===0) gc.categorias = [...CATEGORIAS_PADRAO];
  if(!Array.isArray(gc.formasPagamento) || gc.formasPagamento.length===0) gc.formasPagamento = [...FORMAS_PG_PADRAO];
  if(!Array.isArray(gc.status) || gc.status.length===0) gc.status = JSON.parse(JSON.stringify(STATUS_PADRAO));
  return gc;
}
async function salvarConfigGastos(){
  const r = await gw({ op:'mergeConfigKey', params:{ key:'gastosConfig', value: gastosCfg() } });
  if(r && r.error) showToast('⚠️ Não foi possível salvar a configuração de gastos: '+r.error, 4500);
}
function statusDe(id){ const gc=gastosCfg(); return gc.status.find(s=>s.id===id) || gc.status[0]; }
function ehPago(g){ return !!(statusDe(g.status).tipoPago); }

/* ===== Gateway / helpers ===== */
async function gw(body){
  try{
    const r = await fetch(GATEWAY_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({senha:__gatewaySenha,...body})});
    const out = await r.json();
    if(out && out.error && (body.op==='upsert'||body.op==='delete')){
      console.error('Falha ao gravar no banco:', out.error, body);
      showToast('⚠️ ERRO AO SALVAR: '+String(out.error).slice(0,120), 5000);
    }
    return out;
  }catch(e){
    if(body.op==='upsert'||body.op==='delete') showToast('⚠️ SEM CONEXÃO — o lançamento NÃO foi salvo!', 5000);
    return{error:'Sem conexão'};
  }
}
const esc = s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtMoeda = v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d=>{if(!d)return'—';const[y,m,di]=d.split('-');return`${di}/${m}/${y}`;};
const hoje = ()=>new Date().toISOString().slice(0,10);
const uid = p=>(p||'g')+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
function showToast(msg,dur=2800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalOverlay').classList.add('show');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function estaVencido(g){ return !ehPago(g) && statusDe(g.status).id!=='cancelado' && g.vencimento && g.vencimento < hoje(); }
function addMeses(dataISO, n){ const d=new Date(dataISO+'T12:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function addAnos(dataISO, n){ const d=new Date(dataISO+'T12:00:00'); d.setFullYear(d.getFullYear()+n); return d.toISOString().slice(0,10); }
function recLabel(g){
  if(g.parcelaInfo) return `${g.parcelaInfo.numero}/${g.parcelaInfo.total}`;
  if(g.recorrencia==='mensal') return 'Mensal';
  if(g.recorrencia==='anual') return 'Anual';
  return null;
}

/* ===== Tabs ===== */
document.querySelectorAll('.tabs-bar button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tabs-bar button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
    parent.postMessage({type:'activeTab',modulo:'gastos',tabId:b.dataset.tab},'*');
    if(b.dataset.tab==='agenda') renderAgenda();
  });
});

/* ===== Init ===== */
window.addEventListener('message',async ev=>{
  if(ev.data&&ev.data.type==='auth'){
    currentUser=ev.data.user;
    __gatewaySenha=currentUser?currentUser.senha:null;
    await loadAll();
    renderLancamentos();
    parent.postMessage({type:'tabs',modulo:'gastos',tabs:[
      {id:'lancamentos',label:'📋 Lançamentos'},{id:'agenda',label:'📅 Agenda'}
    ],active:'lancamentos'},'*');
  }
  if(ev.data&&ev.data.type==='gotoTab'){
    const btn=[...document.querySelectorAll('.tabs-bar button')].find(b=>b.dataset.tab===ev.data.tabId);
    if(btn) btn.click();
  }
});
window.addEventListener('load',()=>parent.postMessage({type:'ready',modulo:'gastos'},'*'));

/* ===== Carga ===== */
async function loadAll(){
  const [rCfg,rG,rF]=await Promise.all([
    gw({op:'getConfig'}),
    gw({op:'selectAll',table:'gastos'}),
    gw({op:'selectAll',table:'gastos_fixos'}),
  ]);
  config=rCfg.data||{};
  gastos=(rG.data||[]).map(r=>r.payload).filter(Boolean);
  fixos=(rF.data||[]).map(r=>r.payload).filter(Boolean);
  gastosCfg(); // garante defaults
  for(const g of gastos){
    if(!g.status || !gastosCfg().status.some(s=>s.id===g.status)){
      g.status = g.pago ? 'pago' : 'apagar';
    }
  }
  await gerarInstanciasFixos();
  preencherFiltros();
  renderAlertasVencimento();
}
function preencherFiltros(){
  const gc=gastosCfg();
  const selSt=document.getElementById('gastoFiltroStatus');
  selSt.innerHTML='<option value="">Todos os status</option>'+gc.status.map(s=>`<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')+'<option value="__vencido">⚠️ Vencidos</option>';
  const cats=[...new Set([...gc.categorias,...gastos.map(g=>g.categoria).filter(Boolean)])].sort();
  document.getElementById('gastoFiltroCategoria').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const lojas=(config.lojas||[]);
  document.getElementById('gastoFiltroLoja').innerHTML='<option value="">Todas as lojas</option>'+lojas.map(l=>`<option value="${esc(l.nome)}">${esc(l.nome)}</option>`).join('');
}

/* ===== Recorrências mensais/anuais (instâncias) ===== */
async function gerarInstanciasFixos(){
  const hj=hoje();
  for(const f of fixos){
    if(f.ativo===false) continue;
    if(!['mensal','anual'].includes(f.recorrencia)) continue;
    let vc = f.dataInicio;
    let seguranca=0;
    const limite = addMeses(hj, 12);
    while(vc <= limite && seguranca<60){
      seguranca++;
      if(vc >= f.dataInicio){
        const jaExiste = gastos.some(g=>g.fixoId===f.id && g.vencimento===vc);
        if(!jaExiste && vc >= addMeses(hj,-1)){
          const novo={ id:uid('g'), fixoId:f.id, nome:f.nome, categoria:f.categoria, valor:f.valor, loja:f.loja,
            vencimento:vc, formaPagamento:f.formaPagamento, obs:f.obs, responsavel:f.responsavel,
            status:'apagar', pago:false, recorrencia:f.recorrencia, criadoEm:hj };
          await gw({op:'upsert',table:'gastos',params:{row:{id:novo.id,payload:novo}}});
          gastos.push(novo);
        }
      }
      vc = f.recorrencia==='mensal' ? addMeses(vc,1) : addAnos(vc,1);
    }
  }
}

/* ===== Alertas ===== */
function renderAlertasVencimento(){
  const hj=hoje();
  const vencidos=gastos.filter(g=>estaVencido(g));
  const vencemHoje=gastos.filter(g=>!ehPago(g)&&statusDe(g.status).id!=='cancelado'&&g.vencimento===hj);
  const el=document.getElementById('alertasVencimento');
  let html='';
  if(vencidos.length>0){
    html+=`<div class="alerta-box danger" style="margin-bottom:12px;"><b>⚠️ ${vencidos.length} conta(s) VENCIDA(S)!</b>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
      ${vencidos.slice(0,5).map(g=>`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid #f5b8b8;border-radius:8px;padding:8px 12px;">
        <div><b>${esc(g.nome)}</b> <span class="muted">· ${fmtDate(g.vencimento)}</span></div>
        <div style="display:flex;gap:6px;align-items:center;">${fmtMoeda(g.valor)}<button class="btn btn-sm btn-accent" data-marcar-pago="${esc(g.id)}">Marcar pago</button></div>
      </div>`).join('')}
      ${vencidos.length>5?`<div class="muted" style="font-size:12px;">… e mais ${vencidos.length-5}.</div>`:''}
      </div></div>`;
  }
  if(vencemHoje.length>0){
    html+=`<div class="alerta-box" style="margin-bottom:12px;"><b>🔔 ${vencemHoje.length} conta(s) vencem HOJE!</b>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
      ${vencemHoje.map(g=>`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid #f5c842;border-radius:8px;padding:8px 12px;">
        <div><b>${esc(g.nome)}</b> <span class="muted">· ${esc(g.categoria||'')}</span></div>
        <div style="display:flex;gap:6px;align-items:center;">${fmtMoeda(g.valor)}<button class="btn btn-sm btn-accent" data-marcar-pago="${esc(g.id)}">Marcar pago</button></div>
      </div>`).join('')}
      </div></div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('[data-marcar-pago]').forEach(b=>b.addEventListener('click',async()=>{await marcarStatus(b.dataset.marcarPago,'pago');renderLancamentos();}));
}

/* ===== KPIs ===== */
function renderKpis(lista){
  const pagos=lista.filter(g=>ehPago(g));
  const aPagar=lista.filter(g=>!ehPago(g)&&statusDe(g.status).id!=='cancelado');
  const vencidos=lista.filter(g=>estaVencido(g));
  const totalPago=pagos.reduce((a,g)=>a+Number(g.valor||0),0);
  const totalAPagar=aPagar.reduce((a,g)=>a+Number(g.valor||0),0);
  const porCat={};
  pagos.forEach(g=>{const c=g.categoria||'Outros';porCat[c]=(porCat[c]||0)+Number(g.valor||0);});
  const topCat=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,1);
  document.getElementById('kpisGastos').innerHTML=`
    <div class="kpi-card"><div class="kpi-val" style="color:var(--ok);">${fmtMoeda(totalPago)}</div><div class="kpi-label">Total pago</div></div>
    <div class="kpi-card"><div class="kpi-val" style="color:var(--wait);">${fmtMoeda(totalAPagar)}</div><div class="kpi-label">A pagar</div></div>
    <div class="kpi-card"><div class="kpi-val" style="color:var(--danger);">${vencidos.length}</div><div class="kpi-label">Vencidos</div></div>
    <div class="kpi-card"><div class="kpi-val">${lista.length}</div><div class="kpi-label">Lançamentos</div></div>
    ${topCat.length?`<div class="kpi-card"><div class="kpi-val" style="font-size:13px;">${esc(topCat[0][0])}</div><div class="kpi-label">Maior categoria</div></div>`:''}
  `;
}

/* ===== Lista de lançamentos ===== */
function renderLancamentos(){
  function filtrar(){
    const q=(document.getElementById('gastoBusca').value||'').toLowerCase();
    const st=document.getElementById('gastoFiltroStatus').value;
    const cat=document.getElementById('gastoFiltroCategoria').value;
    const loja=document.getElementById('gastoFiltroLoja').value;
    const mes=document.getElementById('gastoFiltroMes').value;
    let l=[...gastos];
    if(q) l=l.filter(g=>(g.nome||'').toLowerCase().includes(q)||(g.categoria||'').toLowerCase().includes(q));
    if(st==='__vencido') l=l.filter(g=>estaVencido(g));
    else if(st) l=l.filter(g=>g.status===st);
    if(cat) l=l.filter(g=>g.categoria===cat);
    if(loja) l=l.filter(g=>g.loja===loja);
    if(mes) l=l.filter(g=>(g.vencimento||g.criadoEm||'').startsWith(mes));
    l.sort((a,b)=>(b.vencimento||b.criadoEm||'').localeCompare(a.vencimento||a.criadoEm||''));
    return l;
  }
  function render(){
    const l=filtrar();
    renderKpis(l);
    const el=document.getElementById('gastosTabela');
    if(l.length===0){el.innerHTML='<div class="empty">Nenhum gasto encontrado.</div>';return;}
    el.innerHTML=`<table>
      <thead><tr><th>Nome</th><th>Categoria</th><th>Loja</th><th>Vencimento</th><th style="text-align:right">Valor</th><th>Forma pg.</th><th>Status</th><th>Responsável</th><th>Ações</th></tr></thead>
      <tbody>${l.map(g=>{
        const s=statusDe(g.status);
        const venc=estaVencido(g);
        const rec=recLabel(g);
        return `<tr style="${venc?'background:rgba(196,39,43,.05)':''}">
          <td><b>${esc(g.nome)}</b>${rec?` <span class="recorrencia-chip">${rec}</span>`:''}</td>
          <td>${esc(g.categoria||'—')}</td>
          <td>${esc(g.loja||'—')}</td>
          <td>${fmtDate(g.vencimento)}${venc?' <span style="color:var(--danger);font-weight:700;">⚠️</span>':''}</td>
          <td style="text-align:right;font-weight:700;">${fmtMoeda(g.valor)}</td>
          <td>${esc(g.formaPagamento||'—')}</td>
          <td><span class="badge" style="background:${esc(s.cor)}22;color:${esc(s.cor)};border:1px solid ${esc(s.cor)}55;">${esc(s.nome)}</span></td>
          <td style="font-size:12px;">${esc(g.responsavel||'—')}</td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" data-status="${esc(g.id)}" title="Mudar status">🔄</button>
            <button class="icon-btn" data-edit="${esc(g.id)}" title="Editar">✎</button>
            <button class="icon-btn" data-del="${esc(g.id)}" title="Excluir">🗑</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
    el.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>abrirTrocaStatus(b.dataset.status,render)));
    el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>abrirModalGasto(gastos.find(g=>g.id===b.dataset.edit),render)));
    el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>excluirGasto(b.dataset.del,render)));
  }
  ['gastoBusca'].forEach(id=>document.getElementById(id).oninput=render);
  ['gastoFiltroStatus','gastoFiltroCategoria','gastoFiltroLoja','gastoFiltroMes'].forEach(id=>document.getElementById(id).onchange=render);
  document.getElementById('btnLimparFiltroGasto').onclick=()=>{
    document.getElementById('gastoBusca').value='';document.getElementById('gastoFiltroMes').value='';
    ['gastoFiltroStatus','gastoFiltroCategoria','gastoFiltroLoja'].forEach(id=>document.getElementById(id).value='');
    render();
  };
  document.getElementById('btnNovoGasto').onclick=()=>abrirModalGasto(null,render);
  render();
}

async function marcarStatus(id,statusId){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  g.status=statusId;
  g.pago=ehPago(g);
  if(g.pago) g.dataPagamento=hoje();
  await gw({op:'upsert',table:'gastos',params:{row:{id:g.id,payload:g}}});
  showToast('Status atualizado!');
  renderAlertasVencimento();
  parent.postMessage({type:'gastoAtualizado'},'*');
}
function abrirTrocaStatus(id,onDone){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  const gc=gastosCfg();
  openModal(`
    <h3 style="margin:0 0 14px;">Status — ${esc(g.nome)}</h3>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${gc.status.map(s=>`<button class="btn btn-ghost" style="justify-content:flex-start;border-left:5px solid ${esc(s.cor)};" data-setst="${esc(s.id)}">${esc(s.nome)}${g.status===s.id?' ✓':''}</button>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>
  `);
  document.querySelectorAll('[data-setst]').forEach(b=>b.addEventListener('click',async()=>{
    await marcarStatus(id,b.dataset.setst);closeModal();if(onDone)onDone();
  }));
}
async function excluirGasto(id,onDone){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  if(g.fixoId){
    openModal(`
      <h3 style="margin:0 0 12px;">Excluir recorrência</h3>
      <p style="font-size:13.5px;">"<b>${esc(g.nome)}</b>" faz parte de uma despesa recorrente. O que você quer excluir?</p>
      <div class="modal-actions" style="flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-ghost" id="btnExcSo">Só este lançamento</button>
        <button class="btn" style="background:var(--danger);color:#fff;" id="btnExcTudo">Toda a recorrência</button>
      </div>
    `);
    document.getElementById('btnExcSo').addEventListener('click',async()=>{
      await gw({op:'delete',table:'gastos',params:{column:'id',value:id}});
      gastos=gastos.filter(x=>x.id!==id);closeModal();showToast('Lançamento excluído.');if(onDone)onDone();renderAlertasVencimento();
    });
    document.getElementById('btnExcTudo').addEventListener('click',async()=>{
      await gw({op:'delete',table:'gastos_fixos',params:{column:'id',value:g.fixoId}});
      fixos=fixos.filter(f=>f.id!==g.fixoId);
      const remover=gastos.filter(x=>x.fixoId===g.fixoId&&!ehPago(x));
      for(const r of remover){ await gw({op:'delete',table:'gastos',params:{column:'id',value:r.id}}); }
      gastos=gastos.filter(x=>!(x.fixoId===g.fixoId&&!ehPago(x)));
      closeModal();showToast('Recorrência excluída (pagos foram mantidos).');if(onDone)onDone();renderAlertasVencimento();
    });
    return;
  }
  if(!confirm('Excluir este lançamento?'))return;
  await gw({op:'delete',table:'gastos',params:{column:'id',value:id}});
  gastos=gastos.filter(x=>x.id!==id);
  showToast('Excluído.');if(onDone)onDone();renderAlertasVencimento();
}

/* ===== Combo com botão + (adicionar item novo à lista) ===== */
function comboHtml(idSel, itens, valorAtual, idBtn){
  return `<div class="combo">
    <select id="${idSel}">${itens.map(i=>`<option value="${esc(i)}"${i===valorAtual?' selected':''}>${esc(i)}</option>`).join('')}</select>
    <button type="button" class="btn-mini" id="${idBtn}" title="Adicionar novo">＋</button>
  </div>`;
}
function ligarComboAdd(idSel, idBtn, lista, aoSalvar){
  document.getElementById(idBtn).addEventListener('click',()=>{
    const nome=prompt('Digite o novo item:');
    if(!nome||!nome.trim())return;
    const v=nome.trim();
    if(!lista.includes(v)) lista.push(v);
    const sel=document.getElementById(idSel);
    const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=true;sel.appendChild(o);
    if(aoSalvar) aoSalvar();
  });
}

/* ===== Modal Adicionar/Editar ===== */
function abrirModalGasto(g,onSave){
  const gc=gastosCfg();
  const lojas=(config.lojas||[]);
  const isEdit=!!g;
  const respNome=(g&&g.responsavel)||((currentUser&&currentUser.nome)||'—');
  openModal(`
    <h3 style="margin:0 0 16px;">${isEdit?'Editar lançamento':'Adicionar gasto'}</h3>
    <div class="grid-2">
      <div class="field"><label>Loja</label>
        <select id="gLoja"><option value="">— Geral (todas) —</option>${lojas.map(l=>`<option value="${esc(l.nome)}"${g?.loja===l.nome?' selected':''}>${esc(l.nome)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Nome (identificação curta) *</label><input id="gNome" maxlength="60" value="${esc(g?.nome||'')}" placeholder="Ex: Aluguel MC"></div>
      <div class="field"><label>Categoria *</label>${comboHtml('gCat', gc.categorias, g?.categoria||gc.categorias[0], 'gCatAdd')}</div>
      <div class="field"><label>Valor (R$) *</label><input type="number" id="gValor" step="0.01" min="0" value="${g?.valor||''}"></div>
      <div class="field"><label>Vencimento *</label>
        <div class="combo" style="position:relative;">
          <input type="date" id="gVenc" style="flex:1;" value="${g?.vencimento||hoje()}">
          <button type="button" class="btn-mini" id="gRecBtn" title="Recorrência">🔁</button>
          <div class="rec-menu" id="gRecMenu" style="display:none;right:0;top:44px;"></div>
        </div>
        <div id="gRecInfo" class="muted" style="font-size:12px;"></div>
        <div id="gParcelasWrap" style="display:none;margin-top:6px;">
          <label style="font-size:11px;">Total de parcelas (contando esta)</label>
          <input type="number" id="gParcelas" min="2" max="120" value="2" style="width:100px;">
        </div>
      </div>
      <div class="field"><label>Forma de pagamento</label>${comboHtml('gFormaPg', gc.formasPagamento, g?.formaPagamento||gc.formasPagamento[0], 'gFormaPgAdd')}</div>
      <div class="field" style="grid-column:1/-1;"><label>Observação</label><textarea id="gObs" style="min-height:56px;">${esc(g?.obs||'')}</textarea></div>
      <div class="field"><label>Responsável pelo lançamento</label><input id="gResp" readonly value="${esc(respNome)}"></div>
      <div class="field"><label>Status</label>
        <div class="combo">
          <select id="gStatus">${gc.status.map(s=>`<option value="${esc(s.id)}"${(g?.status||'apagar')===s.id?' selected':''}>${esc(s.nome)}</option>`).join('')}</select>
          <button type="button" class="btn-mini" id="gStatusAdd" title="Adicionar status">＋</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="btnSalvarGasto">${isEdit?'Salvar':'Adicionar'}</button>
    </div>
  `);

  let recorrenciaSel = g?.recorrencia && ['mensal','anual'].includes(g.recorrencia) ? g.recorrencia : (g?.parcelaInfo ? 'parcelas' : null);
  const menu=document.getElementById('gRecMenu');
  function renderRecMenu(){
    const ops=[[null,'Sem recorrência'],['mensal','Mensal'],['anual','Anual'],['parcelas','Parcelas']];
    menu.innerHTML=ops.map(([v,l])=>`<button data-rec="${v===null?'':v}" class="${recorrenciaSel===v?'sel':''}">${l}</button>`).join('');
    menu.querySelectorAll('[data-rec]').forEach(b=>b.addEventListener('click',()=>{
      recorrenciaSel=b.dataset.rec||null;
      menu.style.display='none';
      atualizarRecInfo();
    }));
  }
  function atualizarRecInfo(){
    const info=document.getElementById('gRecInfo');
    const pw=document.getElementById('gParcelasWrap');
    pw.style.display = recorrenciaSel==='parcelas' ? '' : 'none';
    if(recorrenciaSel==='mensal') info.textContent='🔁 Repete todo mês (gera lançamentos automáticos).';
    else if(recorrenciaSel==='anual') info.textContent='🔁 Repete todo ano.';
    else if(recorrenciaSel==='parcelas') info.textContent='🔁 Parcelado — as parcelas serão criadas com vencimentos mensais.';
    else info.textContent='';
  }
  renderRecMenu(); atualizarRecInfo();
  document.getElementById('gRecBtn').addEventListener('click',(e)=>{
    e.stopPropagation();
    renderRecMenu();
    menu.style.display = menu.style.display==='none' ? 'flex' : 'none';
  });
  document.addEventListener('click',(e)=>{ if(menu && !menu.contains(e.target) && e.target.id!=='gRecBtn') menu.style.display='none'; });

  if(isEdit && (g.fixoId || g.parcelaInfo)){
    document.getElementById('gRecBtn').disabled=true;
    document.getElementById('gRecInfo').textContent = g.parcelaInfo ? `Parcela ${g.parcelaInfo.numero}/${g.parcelaInfo.total}` : '🔁 Parte de uma recorrência (edite só este lançamento).';
  }

  ligarComboAdd('gCat','gCatAdd',gastosCfg().categorias, salvarConfigGastos);
  ligarComboAdd('gFormaPg','gFormaPgAdd',gastosCfg().formasPagamento, salvarConfigGastos);

  document.getElementById('gStatusAdd').addEventListener('click',()=>{
    const nome=prompt('Nome do novo status:');
    if(!nome||!nome.trim())return;
    const cores=['#662344','#B8650A','#188A54','#C4272B','#2563EB','#7C3AED','#0D9488','#8B93A1'];
    const cor=prompt('Cor (deixe em branco pra automática, ou digite um código como #2563EB):')||cores[gastosCfg().status.length%cores.length];
    const pago=confirm('Esse status conta como PAGO nas métricas? (OK = sim, Cancelar = não)');
    const novo={ id:'st_'+Date.now(), nome:nome.trim(), cor:cor.trim(), tipoPago:pago };
    gastosCfg().status.push(novo);
    salvarConfigGastos();
    const sel=document.getElementById('gStatus');
    const o=document.createElement('option');o.value=novo.id;o.textContent=novo.nome;o.selected=true;sel.appendChild(o);
    preencherFiltros();
  });

  document.getElementById('btnSalvarGasto').addEventListener('click',async()=>{
    const nome=document.getElementById('gNome').value.trim();
    const valor=parseFloat(document.getElementById('gValor').value);
    const venc=document.getElementById('gVenc').value;
    if(!nome||isNaN(valor)||valor<0||!venc){showToast('Preencha nome, valor e vencimento.');return;}
    const base={
      loja:document.getElementById('gLoja').value,
      nome, categoria:document.getElementById('gCat').value,
      valor, vencimento:venc,
      formaPagamento:document.getElementById('gFormaPg').value,
      obs:document.getElementById('gObs').value.trim(),
      responsavel:respNome,
      status:document.getElementById('gStatus').value,
    };
    base.pago = !!(gastosCfg().status.find(s=>s.id===base.status)||{}).tipoPago;
    if(base.pago) base.dataPagamento=hoje();

    if(isEdit){
      const atualizado={...g,...base};
      await gw({op:'upsert',table:'gastos',params:{row:{id:atualizado.id,payload:atualizado}}});
      const idx=gastos.findIndex(x=>x.id===atualizado.id);
      if(idx>=0)gastos[idx]=atualizado;
      showToast('Lançamento atualizado!');
    } else if(recorrenciaSel==='mensal'||recorrenciaSel==='anual'){
      const fixo={ id:uid('f'), ...base, recorrencia:recorrenciaSel, dataInicio:venc, ativo:true, criadoEm:hoje() };
      await gw({op:'upsert',table:'gastos_fixos',params:{row:{id:fixo.id,payload:fixo}}});
      fixos.push(fixo);
      await gerarInstanciasFixos();
      showToast('Despesa recorrente criada!');
    } else if(recorrenciaSel==='parcelas'){
      const total=parseInt(document.getElementById('gParcelas').value)||2;
      const grupoId=uid('pg');
      for(let i=1;i<=total;i++){
        const p={ id:uid('g'), ...base, nome:base.nome, vencimento:addMeses(venc,i-1),
          parcelaInfo:{numero:i,total,grupoId}, criadoEm:hoje(),
          status: i===1 ? base.status : 'apagar', pago: i===1 ? base.pago : false };
        if(!p.pago) delete p.dataPagamento;
        await gw({op:'upsert',table:'gastos',params:{row:{id:p.id,payload:p}}});
        gastos.push(p);
      }
      showToast(`${total} parcelas criadas!`);
    } else {
      const novo={ id:uid('g'), ...base, criadoEm:hoje() };
      await gw({op:'upsert',table:'gastos',params:{row:{id:novo.id,payload:novo}}});
      gastos.push(novo);
      showToast('Gasto adicionado!');
    }
    closeModal();
    preencherFiltros();
    if(onSave)onSave();
    renderAlertasVencimento();
    parent.postMessage({type:'gastoAtualizado'},'*');
  });
}

/* ===== Agenda (cores por status) ===== */
function renderAgenda(){
  const mes=agendaMesAtual.getMonth();
  const ano=agendaMesAtual.getFullYear();
  const nomeMes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes];
  document.getElementById('agendaMesLabel').textContent=`${nomeMes} ${ano}`;
  const primeiroDia=new Date(ano,mes,1).getDay();
  const ultimoDia=new Date(ano,mes+1,0).getDate();
  const hj=hoje();
  const prefixo=`${ano}-${String(mes+1).padStart(2,'0')}`;
  const gastosMes={};
  gastos.filter(g=>g.vencimento&&g.vencimento.startsWith(prefixo)).forEach(g=>{
    const dia=parseInt(g.vencimento.split('-')[2]);
    (gastosMes[dia]=gastosMes[dia]||[]).push(g);
  });
  let html='';
  for(let i=0;i<primeiroDia;i++) html+=`<div style="min-height:72px;"></div>`;
  for(let d=1;d<=ultimoDia;d++){
    const dataStr=`${prefixo}-${String(d).padStart(2,'0')}`;
    const isHoje=dataStr===hj;
    const itens=gastosMes[d]||[];
    html+=`<div class="agenda-dia${isHoje?' hoje':''}">
      <div class="dia-num" style="${isHoje?'color:var(--accent);':''}">${d}</div>
      ${itens.slice(0,3).map(g=>{
        const s=statusDe(g.status);
        return `<div class="agenda-item${estaVencido(g)?' vencido-borda':''}" style="background:${esc(s.cor)};" title="${esc(g.nome)} — ${fmtMoeda(g.valor)} — ${esc(s.nome)}" data-agitem="${esc(g.id)}">${esc((g.nome||'').slice(0,13))}</div>`;
      }).join('')}
      ${itens.length>3?`<div style="font-size:9px;color:var(--ink-faint);margin-top:1px;">+${itens.length-3}</div>`:''}
    </div>`;
  }
  document.getElementById('agendaCalendario').innerHTML=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${html}</div>`;
  document.getElementById('legendaStatus').innerHTML = gastosCfg().status.map(s=>
    `<span class="agenda-item" style="background:${esc(s.cor)};padding:4px 10px;border-radius:6px;">${esc(s.nome)}</span>`
  ).join('') + `<span class="agenda-item vencido-borda" style="background:var(--surface-2);color:var(--danger);padding:4px 10px;border-radius:6px;">borda = vencido</span>`;
  document.querySelectorAll('[data-agitem]').forEach(b=>b.addEventListener('click',()=>{
    const g=gastos.find(x=>x.id===b.dataset.agitem);
    if(!g)return;
    const s=statusDe(g.status);
    openModal(`
      <h3 style="margin:0 0 12px;">${esc(g.nome)}</h3>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;">
        <div><b>Valor:</b> ${fmtMoeda(g.valor)}</div>
        <div><b>Vencimento:</b> ${fmtDate(g.vencimento)}${estaVencido(g)?' <span style="color:var(--danger);font-weight:700;">⚠️ vencido</span>':''}</div>
        <div><b>Categoria:</b> ${esc(g.categoria||'—')}</div>
        <div><b>Loja:</b> ${esc(g.loja||'—')}</div>
        <div><b>Forma pg.:</b> ${esc(g.formaPagamento||'—')}</div>
        <div><b>Status:</b> <span class="badge" style="background:${esc(s.cor)}22;color:${esc(s.cor)};border:1px solid ${esc(s.cor)}55;">${esc(s.nome)}</span></div>
        <div><b>Responsável:</b> ${esc(g.responsavel||'—')}</div>
        ${g.obs?`<div><b>Obs:</b> ${esc(g.obs)}</div>`:''}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
        <button class="btn btn-accent" id="btnAgStatus">🔄 Mudar status</button>
      </div>
    `);
    document.getElementById('btnAgStatus').addEventListener('click',()=>{closeModal();abrirTrocaStatus(g.id,()=>renderAgenda());});
  }));
  document.getElementById('btnAgendaMesAnt').onclick=()=>{agendaMesAtual.setMonth(agendaMesAtual.getMonth()-1);renderAgenda();};
  document.getElementById('btnAgendaMesPro').onclick=()=>{agendaMesAtual.setMonth(agendaMesAtual.getMonth()+1);renderAgenda();};
}
</script>
</body>
