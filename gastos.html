<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* ===== Linguagem visual das telas financeiras do CAIXA (igual em caixa.html, gastos.html e conciliacao.html) ===== */
:root{ --radius:12px; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--t-font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px;}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 2px;line-height:1.25;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;max-width:640px;}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.muted{color:var(--ink-faint);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* botões (cores vêm do tema.css) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;font-size:13.5px;line-height:1.3;white-space:nowrap;}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.btn .ico{width:15px;height:15px;}

/* barra de filtros: período, loja e ações numa faixa só */
.barra{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;box-shadow:var(--t-shadow-sm);}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0;}
.campo > label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.campo input,.campo select{height:36px;padding:0 10px;font-size:13.5px;min-width:0;}
.campo.busca{flex:1 1 220px;}
.barra .acoes{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.barra .btn{height:36px;}
.barra-linha{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-top:10px;border-top:1px solid var(--line);}
.barra-linha .rot{font-size:12px;font-weight:600;color:var(--ink-soft);margin-right:4px;}

/* chips de liga/desliga (checkbox dentro) */
.chip-check{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);cursor:pointer;user-select:none;}
.chip-check input{margin:0;width:15px;height:15px;}
.chip-check:has(input:checked){background:var(--accent-soft);border-color:var(--t-primary-line);color:var(--accent);}

/* cartões e seções */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--t-shadow-sm);margin-bottom:16px;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);}
.card-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.card-head h2 .ico{color:var(--accent);}
.card-body{padding:14px 16px;}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}

/* valores: entrada em verde com "+", saída em vermelho com "−", zero apagado */
.val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.val.entra{color:var(--ok);}
.val.sai{color:var(--danger);}
.val.zero{color:var(--ink-faint);font-weight:500;}
.val.forte{font-weight:700;}
.r{text-align:right;}

/* tabelas (no celular viram cartões: .tabela.cartoes + data-label em cada td) */
.tabela-wrap{overflow-x:auto;}
table.tabela{width:100%;border-collapse:collapse;font-size:13px;}
.tabela th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
.tabela td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tabela tbody tr:last-child td{border-bottom:none;}
.tabela :is(th,td).r{text-align:right;}
.tabela tfoot td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:none;background:var(--surface-2);}
.tabela .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px;}
.tabela tr.apagada td{color:var(--ink-faint);}
.acoes-linha{display:flex;gap:2px;justify-content:flex-end;}

/* selos de status */
.selo{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px;}
.selo .ico{width:13px;height:13px;}
.selo-ok{background:var(--ok-soft);color:var(--ok);}
.selo-wait{background:var(--wait-soft);color:var(--wait);}
.selo-danger{background:var(--danger-soft);color:var(--danger);}
.selo-info{background:var(--t-info-soft);color:var(--info);}
.selo-neutro{background:var(--surface-2);color:var(--ink-soft);}
.selo .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* estados: vazio, carregando, erro */
.estado{padding:36px 20px;text-align:center;color:var(--ink-faint);}
.estado-ico{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);margin-bottom:10px;}
.estado-ico .ico{width:22px;height:22px;}
.estado .t{display:block;font-size:16px;color:var(--ink);font-weight:700;margin-bottom:4px;}
.estado p{margin:0 auto;max-width:460px;font-size:13.5px;line-height:1.5;}
.estado-erro .estado-ico{background:var(--danger-soft);color:var(--danger);}
.estado-mini{padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* alertas de contas (vencidas / vencendo) */
.alerta{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--t-shadow-sm);}
.alerta-head{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;font-weight:700;}
.alerta-head .ico{width:18px;height:18px;}
.alerta-head .total{margin-left:auto;}
.alerta-danger .alerta-head{background:var(--danger-soft);color:var(--danger);}
.alerta-wait .alerta-head{background:var(--wait-soft);color:var(--wait);}
.alerta-item{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:13.5px;}
.alerta-item .nome{flex:1 1 200px;min-width:0;}
.alerta-item .nome b{font-weight:600;}
.alerta-mais{padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);}

/* campos de formulário (popups) */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0;}
.field > label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field input,.field select,.field textarea{padding:8px 11px;font-size:14px;width:100%;}
html[data-ds] .field input[readonly]{background:var(--surface-2);color:var(--ink-soft);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

/* popups */
.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:200;padding:16px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
:is(.modal,.modal-box){width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:22px 24px;}
:is(.modal,.modal-box) h3{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.01em;padding-right:24px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

@media (prefers-reduced-motion:no-preference){ .esq{animation:pulsar 1.2s ease-in-out infinite;} @keyframes pulsar{50%{opacity:.5;}} }

/* celular */
@media (max-width:760px){
  .wrap{padding:14px 12px 48px;}
  .page-head{align-items:stretch;}
  .page-actions{width:100%;}
  .page-actions > .btn-accent{flex:1 1 auto;}
  .barra{padding:12px;}
  .barra .campo{flex:1 1 calc(50% - 6px);}
  .barra .campo.busca{flex-basis:100%;}
  .barra .acoes{margin-left:0;width:100%;}
  .barra .acoes .btn{flex:1 1 auto;}
  .barra .btn{height:44px;}
  .campo input,.campo select{height:44px;}
  .grid-2{grid-template-columns:minmax(0,1fr);}
  .tabela.cartoes thead{display:none;}
  .tabela.cartoes, .tabela.cartoes :is(tbody,tfoot,tr,td){display:block;width:100%;}
  .tabela.cartoes tr{padding:10px 14px;border-bottom:1px solid var(--line);}
  .tabela.cartoes tbody tr:last-child{border-bottom:none;}
  .tabela.cartoes td{border:none;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;background:transparent;}
  .tabela.cartoes td::before{content:attr(data-label);font-size:12.5px;color:var(--ink-faint);font-weight:500;text-align:left;flex-shrink:0;}
  .tabela.cartoes td.principal{display:block;text-align:left;font-size:14px;padding-bottom:4px;}
  .tabela.cartoes td.principal::before{display:none;}
  .tabela.cartoes td:is(:empty,.vazio-cel){display:none;}
  .tabela.cartoes tfoot tr{background:var(--surface-2);border-top:1px solid var(--line-strong);}
  .tabela.cartoes .acoes-linha{justify-content:flex-start;}
  .tabela.cartoes td.acoes-td{justify-content:flex-end;padding-top:6px;}
  .tabela.cartoes td.acoes-td::before{display:none;}
}

/* ===== Gastos ===== */
.vista[hidden]{display:none !important;}
.abas-std{margin-bottom:16px;}
.totais{display:flex;flex-wrap:wrap;gap:8px 28px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:baseline;}
.totais .item{display:flex;flex-direction:column;gap:1px;min-width:0;}
.totais .rot{font-size:12px;font-weight:600;color:var(--ink-faint);}
.totais .num{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;}
.totais .num.ok{color:var(--ok);} .totais .num.wait{color:var(--wait);} .totais .num.danger{color:var(--danger);}
.totais .num.txt{font-size:14px;font-weight:600;color:var(--ink);white-space:normal;}
.totais .ctx{margin-left:auto;font-size:12.5px;color:var(--ink-faint);align-self:center;}
.tabela tr.linha-vencida > td{background:var(--danger-soft);}
.tabela td .prazo{display:flex;width:fit-content;margin-top:3px;}
.recorrencia-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px;white-space:nowrap;}
.recorrencia-chip .ico{width:12px;height:12px;}
/* combos do popup (select + botões pequenos) */
.combo{display:flex;gap:6px;align-items:stretch;}
.combo select,.combo input{flex:1;min-width:0;}
.btn-mini{display:inline-flex;align-items:center;justify-content:center;width:38px;flex-shrink:0;padding:0;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);}
.btn-mini:hover{background:var(--accent-soft);}
.btn-mini:disabled{opacity:.45;cursor:not-allowed;}
.rec-menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--t-shadow-lg);padding:6px;z-index:50;display:flex;flex-direction:column;gap:2px;min-width:170px;}
.rec-menu button{border:none;background:transparent;text-align:left;padding:8px 12px;border-radius:6px;font-size:13.5px;color:var(--ink);}
.rec-menu button:hover{background:var(--surface-2);}
.rec-menu button.sel{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.status-opcoes{display:flex;flex-direction:column;gap:6px;}
.status-opcoes .btn{justify-content:flex-start;gap:10px;padding:10px 14px;}
.status-opcoes .btn .dot{width:10px;height:10px;border-radius:50%;}
.status-opcoes .btn .atual{margin-left:auto;color:var(--accent);display:inline-flex;align-items:center;gap:4px;font-size:12.5px;}
.detalhe-lista{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;}
.detalhe-lista dt{color:var(--ink-faint);}
.detalhe-lista dd{margin:0;}
/* agenda do mês */
.agenda-nav{display:flex;align-items:center;gap:8px;}
#agendaMesLabel{font-weight:700;font-size:15px;min-width:140px;text-align:center;}
.agenda-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 12px 0;}
.agenda-sem div{text-align:center;font-size:12px;font-weight:600;color:var(--ink-faint);padding:4px;}
#agendaCalendario{padding:6px 12px 12px;}
.agenda-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.agenda-dia{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:84px;font-size:12px;min-width:0;}
.agenda-dia.fora{border:none;background:transparent;}
.agenda-dia.hoje{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.agenda-dia .dia-num{font-weight:700;font-size:12.5px;margin-bottom:4px;color:var(--ink-soft);}
.agenda-dia.hoje .dia-num{color:var(--accent);}
.agenda-dia .dia-sem{display:none;}
.agenda-item{display:flex;align-items:center;gap:5px;width:100%;border:1px solid transparent;background:var(--surface-2);color:var(--ink);border-radius:5px;padding:2px 5px;margin-bottom:2px;font-size:11.5px;line-height:1.35;text-align:left;cursor:pointer;min-width:0;}
.agenda-item:hover{border-color:var(--line-strong);}
.agenda-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.agenda-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.agenda-item .vl{display:none;}
.agenda-item.vencido-borda{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);font-weight:600;}
.agenda-item.extra{display:none;}
.agenda-mais{font-size:11px;color:var(--ink-faint);padding-left:4px;}
.legenda-status{display:flex;gap:8px 16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
.legenda-status .leg{display:inline-flex;align-items:center;gap:6px;}
.legenda-status .dot{width:9px;height:9px;border-radius:50%;}
.legenda-status .leg-venc{color:var(--danger);font-weight:600;}
.legenda-status .leg-venc .dot{background:var(--danger-soft);box-shadow:inset 0 0 0 1.5px var(--danger);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;font-size:13.5px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;}

@media (max-width:760px){
  .totais{gap:10px 20px;}
  .totais .item{flex:1 1 40%;}
  .totais .ctx{margin-left:0;flex-basis:100%;}
  .tabela.cartoes tr.linha-vencida{background:var(--danger-soft);}
  .tabela.cartoes tr.linha-vencida > td{background:transparent;}
  .tabela td .prazo{display:inline-flex;margin:0 0 0 6px;}
  .barra .quebra{display:none;}
  .agenda-head{flex-direction:column;align-items:stretch;}
  .agenda-nav{justify-content:space-between;}
  #agendaMesLabel{min-width:0 !important;flex:1;}
  /* no celular a agenda vira lista dos dias que têm conta */
  .agenda-sem{display:none;}
  .agenda-grade{display:block;}
  .agenda-dia{display:flex;gap:12px;min-height:0;padding:10px 12px;margin-bottom:6px;}
  .agenda-dia.fora,.agenda-dia.vazio{display:none;}
  .agenda-dia.hoje{display:flex;}
  .agenda-dia .dia-num{width:44px;flex-shrink:0;font-size:18px;margin:0;line-height:1.1;}
  .agenda-dia .dia-sem{display:block;font-size:11.5px;font-weight:600;color:var(--ink-faint);}
  .agenda-dia .itens{flex:1;min-width:0;}
  .agenda-item{font-size:13.5px;padding:8px 10px;margin-bottom:4px;}
  .agenda-item.extra{display:flex;}
  .agenda-item .vl{display:inline;font-variant-numeric:tabular-nums;font-weight:600;}
  .agenda-mais{display:none;}
}
</style>
</head>
<body>

<div id="lojaFaixa" style="display:none;"></div>
<main class="wrap">
  <div class="page-head">
    <div><h1 class="page-title">Gastos</h1><p class="page-sub">Contas a pagar das lojas: lançamentos avulsos, recorrentes e parcelados.</p></div>
    <div class="page-actions"><button class="btn btn-accent" id="btnNovoGasto"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Lançar gasto</button></div>
  </div>

  <!-- Contas vencidas / vencendo (sempre visível, nas duas vistas) -->
  <div id="alertasVencimento"></div>

  <div class="abas-std" role="tablist" aria-label="Vista dos gastos">
    <button type="button" role="tab" data-vista="lancamentos" class="on" aria-selected="true">Lançamentos</button>
    <button type="button" role="tab" data-vista="agenda" aria-selected="false">Agenda do mês</button>
  </div>

  <!-- LANÇAMENTOS -->
  <section class="vista" id="tab-lancamentos">
    <div class="barra" role="search">
      <div class="campo busca"><label for="gastoBusca">Buscar</label><input type="text" id="gastoBusca" placeholder="Nome ou categoria da conta"></div>
      <div class="campo"><label for="gastoFiltroStatus">Status</label><select id="gastoFiltroStatus"><option value="">Todos os status</option></select></div>
      <div class="campo"><label for="gastoFiltroCategoria">Categoria</label><select id="gastoFiltroCategoria"><option value="">Todas as categorias</option></select></div>
      <div class="campo"><label for="gastoFiltroLoja">Loja</label><select id="gastoFiltroLoja"><option value="">Todas as lojas</option></select></div>
      <div class="quebra" style="flex-basis:100%;height:0;"></div>
      <div class="campo"><label for="gastoFiltroDe">Vencimento de</label><input type="date" id="gastoFiltroDe"></div>
      <div class="campo"><label for="gastoFiltroAte">até</label><input type="date" id="gastoFiltroAte"></div>
      <div class="acoes"><button class="btn btn-ghost" id="btnLimparFiltroGasto" title="Limpar todos os filtros">Limpar filtros</button></div>
    </div>
    <div class="card">
      <div id="kpisGastos" class="totais"></div>
      <div id="gastosTabela"><div class="estado-mini">Carregando gastos…</div></div>
    </div>
  </section>

  <!-- AGENDA -->
  <section class="vista" id="tab-agenda" hidden>
    <div class="card">
      <div class="card-head agenda-head">
        <h2><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg> Agenda de contas</h2>
        <div class="agenda-nav">
          <button class="btn btn-ghost btn-sm" id="btnAgendaMesAnt" aria-label="Mês anterior">‹ Anterior</button>
          <span id="agendaMesLabel" aria-live="polite"></span>
          <button class="btn btn-ghost btn-sm" id="btnAgendaMesPro" aria-label="Próximo mês">Próximo ›</button>
        </div>
      </div>
      <div class="agenda-sem" aria-hidden="true"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>
      <div id="agendaCalendario"></div>
      <div class="legenda-status" id="legendaStatus"></div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>


<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{

/** Selo de status: Pago verde, A pagar âmbar, Cancelado cinza; status criados pela loja usam a cor deles só na bolinha. */
function seloStatus(s){
  if(!s) return '';
  const cls = s.id==='pago' ? 'selo-ok' : s.id==='apagar' ? 'selo-wait' : s.id==='cancelado' ? 'selo-neutro' : (s.tipoPago ? 'selo-ok' : 'selo-neutro');
  const dot = ['pago','apagar','cancelado'].includes(s.id) ? '' : `<span class="dot" style="background:${esc(s.cor)}"></span>`;
  return `<span class="selo ${cls}">${dot}${esc(s.nome)}</span>`;
}
/** Dias entre hoje e o vencimento (negativo = já venceu). */
function diasAteVencer(g){
  if(!g.vencimento) return null;
  const a = new Date(hoje()+'T12:00:00'), b = new Date(g.vencimento+'T12:00:00');
  return Math.round((b-a)/864e5);
}
/** Aviso de prazo para conta em aberto: vencida (vermelho), vence hoje / em até 7 dias (âmbar). */
function prazoHtml(g){
  if(ehPago(g) || statusDe(g.status).id==='cancelado') return '';
  const d = diasAteVencer(g); if(d===null) return '';
  if(d < 0) return `<span class="selo selo-danger prazo">${ic('alerta')} Vencida há ${-d} dia${d===-1?'':'s'}</span>`;
  if(d === 0) return `<span class="selo selo-wait prazo">${ic('relogio')} Vence hoje</span>`;
  if(d <= 7) return `<span class="selo selo-wait prazo">Vence em ${d} dia${d===1?'':'s'}</span>`;
  return '';
}
const fmtDate = d=>{if(!d)return'—';const[y,m,di]=d.split('-');return`${di}/${m}/${y}`;};
const hoje = ()=>new Date().toISOString().slice(0,10);
const uid = p=>(p||'g')+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
// Ordena uma cópia da lista alfabeticamente (nunca muta a lista original — a ordem de
// gravação/config continua intacta, só a exibição nos selects muda).
function ordenarAlfa(lista, chave){
  return [...lista].sort((a,b)=>{
    const av=chave?String(a[chave]||''):String(a||'');
    const bv=chave?String(b[chave]||''):String(b||'');
    return av.localeCompare(bv,'pt-BR',{sensitivity:'base'});
  });
}

function estaVencido(g){ return !ehPago(g) && statusDe(g.status).id!=='cancelado' && g.vencimento && g.vencimento < hoje(); }
function addMeses(dataISO, n){ const d=new Date(dataISO+'T12:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function addAnos(dataISO, n){ const d=new Date(dataISO+'T12:00:00'); d.setFullYear(d.getFullYear()+n); return d.toISOString().slice(0,10); }
function recLabel(g){
  if(g.parcelaInfo) return `${g.parcelaInfo.numero}/${g.parcelaInfo.total}`;

  if(g.recorrencia==='anual') return 'Anual';
  return null;
}

/* ===== Carga ===== */
async function loadAll(){
  const [rCfg,rG,rF]=await Promise.all([
    gw({op:'getConfig'}),
    gw({op:'selectAll',table:'gastos'}),
    gw({op:'selectAll',table:'gastos_fixos'}),
  ]);
  config=rCfg.data||{};
  gastos=(rG.data||[]).map(r=>r.payload).filter(Boolean);
  fixos=(rF.data||[]).map(r=>r.payload).filter(Boolean);
  gastosCfg(); // garante defaults
  for(const g of gastos){
    if(!g.status || !gastosCfg().status.some(s=>s.id===g.status)){
      g.status = g.pago ? 'pago' : 'apagar';
    }
  }
  await gerarInstanciasFixos();
  preencherFiltros();
  renderAlertasVencimento();
}
function preencherFiltros(){
  const gc=gastosCfg();
  const selSt=document.getElementById('gastoFiltroStatus');
  selSt.innerHTML='<option value="">Todos os status</option>'+ordenarAlfa(gc.status,'nome').map(s=>`<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')+'<option value="__vencido">Vencidos</option>';
  const cats=[...new Set([...gc.categorias,...gastos.map(g=>g.categoria).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
  document.getElementById('gastoFiltroCategoria').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const lojas=ordenarAlfa(config.lojas||[],'nome');
  document.getElementById('gastoFiltroLoja').innerHTML='<option value="">Todas as lojas</option>'+lojas.map(l=>`<option value="${esc(l.id)}">${esc(l.nome)}</option>`).join('');
}
/** Resolve o nome de exibição da loja de um gasto — pelo lojaId (padrão atual) ou,
 * pra registros antigos que só tinham o nome gravado direto, cai pro nome salvo. */
function nomeLojaGasto(g){
  if(!g) return '';
  if(g.lojaId){
    const l=(config.lojas||[]).find(x=>x.id===g.lojaId);
    if(l) return l.nome;
  }
  return g.loja||'';
}

/* ===== Recorrências mensais/anuais (instâncias) ===== */
async function gerarInstanciasFixos(){
  const hj=hoje();
  for(const f of fixos){
    if(f.ativo===false) continue;
    if(!['mensal','anual'].includes(f.recorrencia)) continue;
    let vc = f.dataInicio;
    let seguranca=0;
    const limite = addMeses(hj, 12);
    while(vc <= limite && seguranca<60){
      seguranca++;
      if(vc >= f.dataInicio){
        const jaExiste = gastos.some(g=>g.fixoId===f.id && g.vencimento===vc);
        if(!jaExiste && vc >= addMeses(hj,-1)){
          const novo={ id:uid('g'), fixoId:f.id, nome:f.nome, categoria:f.categoria, valor:f.valor, lojaId:f.lojaId,
            vencimento:vc, formaPagamento:f.formaPagamento, obs:f.obs, responsavel:f.responsavel,
            status:'apagar', pago:false, recorrencia:f.recorrencia, criadoEm:hj };
          await gw({op:'upsert',table:'gastos',params:{row:{id:novo.id,payload:novo}}});
          gastos.push(novo);
        }
      }
      vc = f.recorrencia==='mensal' ? addMeses(vc,1) : addAnos(vc,1);
    }
  }
}

function renderAlertasVencimento(){
  const hj=hoje();
  const vencidos=gastos.filter(g=>estaVencido(g));
  const vencemHoje=gastos.filter(g=>!ehPago(g)&&statusDe(g.status).id!=='cancelado'&&g.vencimento===hj);
  const el=document.getElementById('alertasVencimento');
  const soma=l=>l.reduce((a,g)=>a+Number(g.valor||0),0);
  const linha=(g,extra)=>`<div class="alerta-item">
        <div class="nome"><b>${esc(g.nome)}</b> <span class="muted">· ${extra}</span></div>
        <span class="val">${fmtMoeda(g.valor)}</span>
        <button class="btn btn-sm btn-ghost" data-marcar-pago="${esc(g.id)}">${ic('check')} Marcar como pago</button>
      </div>`;
  let html='';
  if(vencidos.length>0){
    const ord=[...vencidos].sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||''));
    html+=`<div class="alerta alerta-danger" role="alert">
      <div class="alerta-head">${ic('alerta')} ${vencidos.length} conta${vencidos.length>1?'s':''} vencida${vencidos.length>1?'s':''} <span class="total val">${fmtMoeda(soma(vencidos))}</span></div>
      ${ord.slice(0,5).map(g=>linha(g, `venceu em ${fmtDate(g.vencimento)}${nomeLojaGasto(g)?' · '+esc(nomeLojaGasto(g)):''}`)).join('')}
      ${vencidos.length>5?`<div class="alerta-mais">E mais ${vencidos.length-5}. Para ver todas, escolha o status <b>Vencidos</b> no filtro.</div>`:''}
    </div>`;
  }
  if(vencemHoje.length>0){
    html+=`<div class="alerta alerta-wait">
      <div class="alerta-head">${ic('relogio')} ${vencemHoje.length} conta${vencemHoje.length>1?'s':''} vence${vencemHoje.length>1?'m':''} hoje <span class="total val">${fmtMoeda(soma(vencemHoje))}</span></div>
      ${vencemHoje.map(g=>linha(g, esc(g.categoria||'Sem categoria'))).join('')}
    </div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('[data-marcar-pago]').forEach(b=>b.addEventListener('click',async()=>{await marcarStatus(b.dataset.marcarPago,'pago');}));
}

/* ===== KPIs ===== */
function renderKpis(lista){
  // "lista" já vem filtrada pelo período selecionado (padrão: mês vigente) — Total pago,
  // A pagar e Maior categoria respeitam esse período. Total vencido é sempre global
  // (independe do período escolhido), porque é um alerta que deve continuar visível.
  const pagos=lista.filter(g=>ehPago(g));
  const aPagar=lista.filter(g=>!ehPago(g)&&statusDe(g.status).id!=='cancelado');
  const totalPago=pagos.reduce((a,g)=>a+Number(g.valor||0),0);
  const totalAPagar=aPagar.reduce((a,g)=>a+Number(g.valor||0),0);
  const vencidosGlobal=gastos.filter(g=>estaVencido(g));
  const totalVencido=vencidosGlobal.reduce((a,g)=>a+Number(g.valor||0),0);
  const porCat={};
  pagos.forEach(g=>{const c=g.categoria||'Outros';porCat[c]=(porCat[c]||0)+Number(g.valor||0);});
  const topCat=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,1);
  const de=document.getElementById('gastoFiltroDe').value, ate=document.getElementById('gastoFiltroAte').value;
  const periodo = de&&ate ? `${fmtDate(de)} a ${fmtDate(ate)}` : de ? `a partir de ${fmtDate(de)}` : ate ? `até ${fmtDate(ate)}` : 'todas as datas';
  document.getElementById('kpisGastos').innerHTML=`
    <div class="item"><span class="rot">Pago no período</span><span class="num ok">${fmtMoeda(totalPago)}</span></div>
    <div class="item"><span class="rot">A pagar no período</span><span class="num wait">${fmtMoeda(totalAPagar)}</span></div>
    <div class="item"><span class="rot">Vencido (todas as datas)</span><span class="num${totalVencido>0?' danger':''}">${fmtMoeda(totalVencido)}</span></div>
    ${topCat.length?`<div class="item"><span class="rot">Maior categoria paga</span><span class="num txt">${esc(topCat[0][0])} · ${fmtMoeda(topCat[0][1])}</span></div>`:''}
    <span class="ctx">${lista.length} lançamento${lista.length===1?'':'s'} · vencimento ${periodo}</span>
  `;
}

async function marcarStatus(id,statusId){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  g.status=statusId;
  g.pago=ehPago(g);
  if(g.pago) g.dataPagamento=hoje(); else g.dataPagamento=null;
  await gw({op:'upsert',table:'gastos',params:{row:{id:g.id,payload:g}}});
  showToast('Status atualizado!');
  // Sincroniza TUDO que depende do status deste gasto — notificação, lista de
  // Lançamentos e Agenda — não importa qual tela iniciou a troca.
  renderAlertasVencimento();
  if(typeof window.__renderListaGastosAtual==='function') window.__renderListaGastosAtual();
  renderAgenda();
  parent.postMessage({type:'gastoAtualizado'},'*');
}
function abrirTrocaStatus(id,onDone){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  const gc=gastosCfg();
  openModal(`
    <h3>Mudar status</h3>
    <p class="muted" style="margin:-8px 0 14px;font-size:13.5px;">${esc(g.nome)} · ${fmtMoeda(g.valor)} · vence ${fmtDate(g.vencimento)}</p>
    <div class="status-opcoes">
      ${ordenarAlfa(gc.status,'nome').map(s=>`<button class="btn btn-ghost" data-setst="${esc(s.id)}"><span class="dot" style="background:${esc(s.cor)}"></span>${esc(s.nome)}${g.status===s.id?`<span class="atual">${ic('check')} atual</span>`:''}</button>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>
  `);
  document.querySelectorAll('[data-setst]').forEach(b=>b.addEventListener('click',async()=>{
    await marcarStatus(id,b.dataset.setst);closeModal();if(onDone)onDone();
  }));
}
async function excluirGasto(id,onDone){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  if(g.fixoId){
    openModal(`
      <h3>Excluir conta recorrente</h3>
      <p style="font-size:14px;margin:0;">"<b>${esc(g.nome)}</b>" faz parte de uma despesa que se repete. O que você quer excluir?</p>
      <p class="muted" style="font-size:13px;margin:8px 0 0;">Excluir toda a recorrência apaga os lançamentos que ainda não foram pagos. Os pagos ficam guardados.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-ghost" id="btnExcSo">Só este lançamento</button>
        <button class="btn btn-danger" id="btnExcTudo">Excluir toda a recorrência</button>
      </div>
    `);
    document.getElementById('btnExcSo').addEventListener('click',async()=>{
      await gw({op:'delete',table:'gastos',params:{column:'id',value:id}});
      gastos=gastos.filter(x=>x.id!==id);closeModal();showToast('Lançamento excluído.');if(onDone)onDone();renderAlertasVencimento();
    });
    document.getElementById('btnExcTudo').addEventListener('click',async()=>{
      await gw({op:'delete',table:'gastos_fixos',params:{column:'id',value:g.fixoId}});
      fixos=fixos.filter(f=>f.id!==g.fixoId);
      const remover=gastos.filter(x=>x.fixoId===g.fixoId&&!ehPago(x));
      for(const r of remover){ await gw({op:'delete',table:'gastos',params:{column:'id',value:r.id}}); }
      gastos=gastos.filter(x=>!(x.fixoId===g.fixoId&&!ehPago(x)));
      closeModal();showToast('Recorrência excluída (pagos foram mantidos).');if(onDone)onDone();renderAlertasVencimento();
    });
    return;
  }
  if(!confirm('Excluir o lançamento "'+(g.nome||'')+'"? Essa ação não pode ser desfeita.'))return;
  await gw({op:'delete',table:'gastos',params:{column:'id',value:id}});
  gastos=gastos.filter(x=>x.id!==id);
  showToast('Excluído.');if(onDone)onDone();renderAlertasVencimento();
}

/* ===== Combo com botão + (adicionar item novo à lista) ===== */
function comboHtml(idSel, itens, valorAtual, idBtn, idBtnEdit){
  return `<div class="combo">
    <select id="${idSel}">${itens.map(i=>`<option value="${esc(i)}"${i===valorAtual?' selected':''}>${esc(i)}</option>`).join('')}</select>
    <button type="button" class="btn-mini" id="${idBtn}" title="Adicionar novo item à lista" aria-label="Adicionar novo item à lista">${ic('mais')}</button>
    ${idBtnEdit?`<button type="button" class="btn-mini" id="${idBtnEdit}" title="Renomear o item escolhido" aria-label="Renomear o item escolhido">${ic('lapis')}</button>`:''}
  </div>`;
}
function ligarComboAdd(idSel, idBtn, lista, aoSalvar){
  document.getElementById(idBtn).addEventListener('click',()=>{
    const nome=prompt('Digite o novo item:');
    if(!nome||!nome.trim())return;
    const v=nome.trim();
    if(!lista.includes(v)) lista.push(v);
    const sel=document.getElementById(idSel);
    const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=true;sel.appendChild(o);
    if(aoSalvar) aoSalvar();
  });
}
// Renomeia, na lista de configuração real (por referência), o item atualmente
// selecionado no combo — e persiste. Só se aplica a listas de strings simples
// (categoria); status usa sua própria lógica porque é lista de objetos {id,nome}.
function ligarComboEditar(idSel, idBtnEdit, lista, aoSalvar){
  const btn=document.getElementById(idBtnEdit);
  if(!btn) return;
  btn.addEventListener('click',()=>{
    const sel=document.getElementById(idSel);
    const atual=sel.value;
    if(!atual){ showToast('Selecione um item para editar.'); return; }
    const novoNome=prompt('Novo nome para "'+atual+'":', atual);
    if(!novoNome||!novoNome.trim()||novoNome.trim()===atual) return;
    const v=novoNome.trim();
    const idx=lista.indexOf(atual);
    if(idx>=0) lista[idx]=v; else lista.push(v);
    const opt=[...sel.options].find(o=>o.value===atual);
    if(opt){ opt.value=v; opt.textContent=v; }
    if(aoSalvar) aoSalvar();
    showToast('Categoria atualizada! Vale para os próximos lançamentos.');
  });
}

/* ===== Modal Adicionar/Editar ===== */
function abrirModalGasto(g,onSave){
  const gc=gastosCfg();
  const lojas=ordenarAlfa(config.lojas||[],'nome');
  const categoriasOrdenadas=ordenarAlfa(gc.categorias);
  const formasOrdenadas=ordenarAlfa(gc.formasPagamento);
  const statusOrdenados=ordenarAlfa(gc.status,'nome');
  const isEdit=!!g;
  const respNome=(g&&g.responsavel)||((currentUser&&currentUser.nome)||'—');
  openModal(`
    <h3>${isEdit?'Editar lançamento':'Lançar gasto'}</h3>
    <div class="grid-2">
      <div class="field"><label>Loja</label>
        <select id="gLoja"><option value="">Geral (todas as lojas)</option>${lojas.map(l=>`<option value="${esc(l.id)}"${g?.lojaId===l.id?' selected':''}>${esc(l.nome)}</option>`).join('')}</select>
      </div>
      <div class="field"><label for="gNome">Nome da conta *</label><input id="gNome" maxlength="60" value="${esc(g?.nome||'')}" placeholder="Ex: Aluguel MC"></div>
      <div class="field"><label>Categoria *</label>${comboHtml('gCat', categoriasOrdenadas, g?.categoria||categoriasOrdenadas[0], 'gCatAdd', 'gCatEdit')}</div>
      <div class="field"><label for="gValor">Valor (R$) *</label><input type="number" id="gValor" step="0.01" min="0" value="${g?.valor||''}"></div>
      <div class="field"><label>Vencimento *</label>
        <div class="combo" style="position:relative;">
          <input type="date" id="gVenc" style="flex:1;" value="${g?.vencimento||hoje()}">
          <button type="button" class="btn-mini" id="gRecBtn" title="Repetir: mensal, anual ou parcelas" aria-label="Repetir: mensal, anual ou parcelas">${ic('atualizar')}</button>
          <div class="rec-menu" id="gRecMenu" style="display:none;right:0;top:44px;"></div>
        </div>
        <div id="gRecInfo" class="muted" style="font-size:12.5px;"></div>
        <div id="gParcelasWrap" style="display:none;margin-top:6px;">
          <label for="gParcelas" style="font-size:12px;font-weight:600;color:var(--ink-soft);">Total de parcelas (contando esta)</label>
          <input type="number" id="gParcelas" min="2" max="120" value="2" style="width:100px;">
        </div>
      </div>
      <div class="field"><label>Forma de pagamento</label>${comboHtml('gFormaPg', formasOrdenadas, g?.formaPagamento||formasOrdenadas[0], 'gFormaPgAdd')}</div>
      <div class="field" style="grid-column:1/-1;"><label>Observação</label><textarea id="gObs" style="min-height:56px;">${esc(g?.obs||'')}</textarea></div>
      <div class="field"><label>Lançado por</label><input id="gResp" readonly value="${esc(respNome)}"></div>
      <div class="field"><label>Status</label>
        <div class="combo">
          <select id="gStatus">${statusOrdenados.map(s=>`<option value="${esc(s.id)}"${(g?.status||'apagar')===s.id?' selected':''}>${esc(s.nome)}</option>`).join('')}</select>
          <button type="button" class="btn-mini" id="gStatusAdd" title="Criar um status novo" aria-label="Criar um status novo">${ic('mais')}</button>
          <button type="button" class="btn-mini" id="gStatusEdit" title="Renomear o status escolhido" aria-label="Renomear o status escolhido">${ic('lapis')}</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="btnSalvarGasto">${isEdit?'Salvar alterações':'Lançar gasto'}</button>
    </div>
  `);

  let recorrenciaSel = g?.recorrencia && ['mensal','anual'].includes(g.recorrencia) ? g.recorrencia : (g?.parcelaInfo ? 'parcelas' : null);
  const menu=document.getElementById('gRecMenu');
  function renderRecMenu(){
    const ops=[[null,'Sem recorrência'],['mensal','Mensal'],['anual','Anual'],['parcelas','Parcelas']];
    menu.innerHTML=ops.map(([v,l])=>`<button data-rec="${v===null?'':v}" class="${recorrenciaSel===v?'sel':''}">${l}</button>`).join('');
    menu.querySelectorAll('[data-rec]').forEach(b=>b.addEventListener('click',()=>{
      recorrenciaSel=b.dataset.rec||null;
      menu.style.display='none';
      atualizarRecInfo();
    }));
  }
  function atualizarRecInfo(){
    const info=document.getElementById('gRecInfo');
    const pw=document.getElementById('gParcelasWrap');
    pw.style.display = recorrenciaSel==='parcelas' ? '' : 'none';
    if(recorrenciaSel==='mensal') info.textContent='Repete todo mês (os lançamentos são criados sozinhos).';
    else if(recorrenciaSel==='anual') info.textContent='Repete todo ano.';
    else if(recorrenciaSel==='parcelas') info.textContent='Parcelado: as parcelas são criadas com vencimento a cada mês.';
    else info.textContent='';
  }
  renderRecMenu(); atualizarRecInfo();
  document.getElementById('gRecBtn').addEventListener('click',(e)=>{
    e.stopPropagation();
    renderRecMenu();
    menu.style.display = menu.style.display==='none' ? 'flex' : 'none';
  });
  document.addEventListener('click',(e)=>{ if(menu && !menu.contains(e.target) && e.target.id!=='gRecBtn') menu.style.display='none'; });

  if(isEdit && (g.fixoId || g.parcelaInfo)){
    document.getElementById('gRecBtn').disabled=true;
    document.getElementById('gRecInfo').textContent = g.parcelaInfo ? `Parcela ${g.parcelaInfo.numero}/${g.parcelaInfo.total}` : 'Faz parte de uma conta que se repete (a edição vale só para este lançamento).';
  }

  ligarComboAdd('gCat','gCatAdd',gastosCfg().categorias, ()=>{ salvarConfigGastos(); preencherFiltros(); });
  ligarComboEditar('gCat','gCatEdit',gastosCfg().categorias, ()=>{ salvarConfigGastos(); preencherFiltros(); });
  ligarComboAdd('gFormaPg','gFormaPgAdd',gastosCfg().formasPagamento, salvarConfigGastos);

  document.getElementById('gStatusAdd').addEventListener('click',()=>{
    const nome=prompt('Nome do novo status:');
    if(!nome||!nome.trim())return;
    const cores=['#1F6F8B','#B8650A','#188A54','#B42318','#2563EB','#7C3AED','#0D9488','#8B93A1'];
    const cor=prompt('Cor (deixe em branco pra automática, ou digite um código como #2563EB):')||cores[gastosCfg().status.length%cores.length];
    const pago=confirm('Esse status conta como PAGO nas métricas? (OK = sim, Cancelar = não)');
    const novo={ id:'st_'+Date.now(), nome:nome.trim(), cor:cor.trim(), tipoPago:pago };
    gastosCfg().status.push(novo);
    salvarConfigGastos();
    const sel=document.getElementById('gStatus');
    const o=document.createElement('option');o.value=novo.id;o.textContent=novo.nome;o.selected=true;sel.appendChild(o);
    preencherFiltros();
  });

  document.getElementById('gStatusEdit').addEventListener('click',()=>{
    const sel=document.getElementById('gStatus');
    const idAtual=sel.value;
    const st=gastosCfg().status.find(s=>s.id===idAtual);
    if(!st){ showToast('Selecione um status para editar.'); return; }
    const novoNome=prompt('Novo nome para "'+st.nome+'":', st.nome);
    if(!novoNome||!novoNome.trim()||novoNome.trim()===st.nome) return;
    st.nome=novoNome.trim();
    salvarConfigGastos();
    const opt=[...sel.options].find(o=>o.value===idAtual);
    if(opt) opt.textContent=st.nome;
    preencherFiltros();
    showToast('Status atualizado! Vale para os próximos lançamentos (os antigos continuam vinculados pelo id, então nada muda neles).');
  });

  document.getElementById('btnSalvarGasto').addEventListener('click',async()=>{
    const btnSalvar=document.getElementById('btnSalvarGasto');
    if(btnSalvar.disabled) return; // proteção extra contra clique duplo
    const nome=maiusc(document.getElementById('gNome').value);
    const valor=parseFloat(document.getElementById('gValor').value);
    const venc=document.getElementById('gVenc').value;
    if(!nome||isNaN(valor)||valor<0||!venc){showToast('Preencha o nome, o valor e o vencimento da conta.');return;}
    const textoOriginalBtn=btnSalvar.textContent;
    btnSalvar.disabled=true;
    btnSalvar.textContent='Salvando...';
    try{
      const base={
        lojaId:document.getElementById('gLoja').value,
        nome, categoria:document.getElementById('gCat').value,
        valor, vencimento:venc,
        formaPagamento:document.getElementById('gFormaPg').value,
        obs:maiusc(document.getElementById('gObs').value),
        responsavel:respNome,
        status:document.getElementById('gStatus').value,
      };
      base.pago = !!(gastosCfg().status.find(s=>s.id===base.status)||{}).tipoPago;
      if(base.pago) base.dataPagamento=hoje();

      if(isEdit){
        const atualizado={...g,...base};
        await gw({op:'upsert',table:'gastos',params:{row:{id:atualizado.id,payload:atualizado}}});
        const idx=gastos.findIndex(x=>x.id===atualizado.id);
        if(idx>=0)gastos[idx]=atualizado;
        showToast('Lançamento atualizado!');
      } else if(recorrenciaSel==='mensal'||recorrenciaSel==='anual'){
        const fixo={ id:uid('f'), ...base, recorrencia:recorrenciaSel, dataInicio:venc, ativo:true, criadoEm:hoje() };
        await gw({op:'upsert',table:'gastos_fixos',params:{row:{id:fixo.id,payload:fixo}}});
        fixos.push(fixo);
        await gerarInstanciasFixos();
        showToast('Despesa recorrente criada!');
      } else if(recorrenciaSel==='parcelas'){
        const total=parseInt(document.getElementById('gParcelas').value)||2;
        const grupoId=uid('pg');
        for(let i=1;i<=total;i++){
          const p={ id:uid('g'), ...base, nome:base.nome, vencimento:addMeses(venc,i-1),
            parcelaInfo:{numero:i,total,grupoId}, criadoEm:hoje(),
            status: i===1 ? base.status : 'apagar', pago: i===1 ? base.pago : false };
          if(!p.pago) delete p.dataPagamento;
          await gw({op:'upsert',table:'gastos',params:{row:{id:p.id,payload:p}}});
          gastos.push(p);
        }
        showToast(`${total} parcelas criadas!`);
      } else {
        const novo={ id:uid('g'), ...base, criadoEm:hoje() };
        await gw({op:'upsert',table:'gastos',params:{row:{id:novo.id,payload:novo}}});
        gastos.push(novo);
        showToast('Gasto adicionado!');
      }
      closeModal();
      preencherFiltros();
      if(onSave)onSave();
      renderAlertasVencimento();
      parent.postMessage({type:'gastoAtualizado'},'*');
    }catch(e){
      showToast('Não foi possível salvar. Confira a internet e tente de novo.');
    }finally{
      btnSalvar.disabled=false;
      btnSalvar.textContent=textoOriginalBtn;
    }
  });
}

/* ===== Agenda (cores por status) ===== */
function renderAgenda(){
  const mes=agendaMesAtual.getMonth();
  const ano=agendaMesAtual.getFullYear();
  const nomeMes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes];
  document.getElementById('agendaMesLabel').textContent=`${nomeMes} ${ano}`;
  const primeiroDia=new Date(ano,mes,1).getDay();
  const ultimoDia=new Date(ano,mes+1,0).getDate();
  const hj=hoje();
  const prefixo=`${ano}-${String(mes+1).padStart(2,'0')}`;
  const gastosMes={};
  gastos.filter(g=>g.vencimento&&g.vencimento.startsWith(prefixo)).forEach(g=>{
    const dia=parseInt(g.vencimento.split('-')[2]);
    (gastosMes[dia]=gastosMes[dia]||[]).push(g);
  });
  const SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let html='';
  for(let i=0;i<primeiroDia;i++) html+=`<div class="agenda-dia fora" aria-hidden="true"></div>`;
  for(let d=1;d<=ultimoDia;d++){
    const dataStr=`${prefixo}-${String(d).padStart(2,'0')}`;
    const isHoje=dataStr===hj;
    const itens=gastosMes[d]||[];
    html+=`<div class="agenda-dia${isHoje?' hoje':''}${itens.length?'':' vazio'}">
      <div class="dia-num">${d}<span class="dia-sem">${SEM[(primeiroDia+d-1)%7]}${isHoje?' · hoje':''}</span></div>
      <div class="itens">
      ${itens.map((g,i)=>{
        const s=statusDe(g.status);
        const venc=estaVencido(g);
        return `<button type="button" class="agenda-item${venc?' vencido-borda':''}${i>=3?' extra':''}" title="${esc(g.nome)} — ${fmtMoeda(g.valor)} — ${esc(s.nome)}${venc?' — vencida':''}" data-agitem="${esc(g.id)}"><span class="dot" style="background:${esc(s.cor)}"></span><span class="nm">${esc(g.nome||'')}</span><span class="vl">${fmtMoeda(g.valor)}</span></button>`;
      }).join('')}
      ${itens.length>3?`<div class="agenda-mais">+${itens.length-3} conta${itens.length-3>1?'s':''}</div>`:''}
      </div>
    </div>`;
  }
  const temItens=Object.keys(gastosMes).length>0;
  document.getElementById('agendaCalendario').innerHTML=`<div class="agenda-grade">${html}</div>${temItens?'':`<div class="estado-mini">Nenhuma conta com vencimento em ${nomeMes.toLowerCase()} de ${ano}.</div>`}`;
  document.getElementById('legendaStatus').innerHTML = ordenarAlfa(gastosCfg().status,'nome').map(s=>
    `<span class="leg"><span class="dot" style="background:${esc(s.cor)}"></span>${esc(s.nome)}</span>`
  ).join('') + `<span class="leg leg-venc"><span class="dot"></span>Vencida (em vermelho)</span>`;
  document.querySelectorAll('[data-agitem]').forEach(b=>b.addEventListener('click',()=>{
    const g=gastos.find(x=>x.id===b.dataset.agitem);
    if(!g)return;
    const s=statusDe(g.status);
    openModal(`
      <h3>${esc(g.nome)}</h3>
      <dl class="detalhe-lista">
        <dt>Valor</dt><dd><span class="val forte">${fmtMoeda(g.valor)}</span></dd>
        <dt>Vencimento</dt><dd>${fmtDate(g.vencimento)} ${prazoHtml(g)}</dd>
        <dt>Status</dt><dd>${seloStatus(s)}</dd>
        <dt>Categoria</dt><dd>${esc(g.categoria||'—')}</dd>
        <dt>Loja</dt><dd>${esc(nomeLojaGasto(g)||'Geral')}</dd>
        <dt>Forma pg.</dt><dd>${esc(g.formaPagamento||'—')}</dd>
        <dt>Lançado por</dt><dd>${esc(g.responsavel||'—')}</dd>
        ${g.obs?`<dt>Observação</dt><dd>${esc(g.obs)}</dd>`:''}
      </dl>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
        <button class="btn btn-accent" id="btnAgStatus">${ic('etiqueta')} Mudar status</button>
      </div>
    `);
    document.getElementById('btnAgStatus').addEventListener('click',()=>{closeModal();abrirTrocaStatus(g.id,()=>renderAgenda());});
  }));
  document.getElementById('btnAgendaMesAnt').onclick=()=>{agendaMesAtual.setMonth(agendaMesAtual.getMonth()-1);renderAgenda();};
  document.getElementById('btnAgendaMesPro').onclick=()=>{agendaMesAtual.setMonth(agendaMesAtual.getMonth()+1);renderAgenda();};
}

/* Abas internas: Lançamentos × Agenda do mês (a escolha fica guardada neste navegador). */
(function ligarVistas(){
  const abas=[...document.querySelectorAll('[data-vista]')];
  function mostrar(v){
    abas.forEach(b=>{ const on=b.dataset.vista===v; b.classList.toggle('on',on); b.setAttribute('aria-selected',on?'true':'false'); });
    document.getElementById('tab-lancamentos').hidden = v!=='lancamentos';
    document.getElementById('tab-agenda').hidden = v!=='agenda';
    try{ localStorage.setItem('gastos_vista', v); }catch(e){}
  }
  abas.forEach(b=>b.addEventListener('click',()=>mostrar(b.dataset.vista)));
  let ini='lancamentos'; try{ ini=localStorage.getItem('gastos_vista')||'lancamentos'; }catch(e){}
  mostrar(ini==='agenda'?'agenda':'lancamentos');
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
