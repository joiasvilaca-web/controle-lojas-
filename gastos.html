<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos — Gestão e Controle</title>
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#F5F7F9;
  --ink:#151C28;--ink-soft:#4B5563;--ink-faint:#8B93A1;
  --line:#D7DCE2;--accent:#662344;--accent-soft:#FDD49E;
  --ok:#188A54;--ok-soft:#D7F3E3;
  --danger:#C4272B;--danger-soft:#FADADA;
  --wait:#B8650A;--wait-soft:#FBE6C7;
  --gold-ink:#8a6a1f;--gold-soft:#f6ecd6;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.tabs-bar{display:flex;gap:2px;padding:14px 16px 0;background:var(--surface);border-bottom:1.5px solid var(--line);overflow-x:auto;}
.tabs-bar button{padding:8px 14px;border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink-faint);border-bottom:2.5px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0;transition:all .15s;white-space:nowrap;}
.tabs-bar button.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-content{display:none;padding:18px 16px;max-width:980px;margin:0 auto;}
.tab-content.active{display:block;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid var(--line);}
.page-title{font-size:22px;font-weight:700;margin:0 0 3px;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;}
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:8px;}
.muted{color:var(--ink-faint);}
.empty{padding:32px;text-align:center;color:var(--ink-faint);font-size:14px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{filter:brightness(1.1);}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--line);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-ok{background:var(--ok-soft);color:var(--ok);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-wait{background:var(--wait-soft);color:var(--wait);}
.badge-neutral{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);border-bottom:1.5px solid var(--line);}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);}
.filters input{flex:1;min-width:160px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border-radius:14px;padding:24px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.grid-2{grid-template-columns:1fr;}}
.alerta-box{background:var(--wait-soft);border:1.5px solid #f5c842;border-radius:12px;padding:14px 18px;margin-bottom:16px;}
.alerta-box.danger{background:var(--danger-soft);border-color:#f5b8b8;}
.alerta-box.ok{background:var(--ok-soft);border-color:#a8dfc0;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.kpi-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;}
.kpi-card .kpi-val{font-size:18px;font-weight:800;}
.kpi-card .kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-top:2px;}
.agenda-mes{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px;}
.agenda-dia{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 4px;min-height:70px;font-size:11px;}
.agenda-dia.hoje{border-color:var(--accent);background:rgba(102,35,68,.06);}
.agenda-dia .dia-num{font-weight:700;font-size:12px;margin-bottom:3px;}
.agenda-item{border-radius:3px;padding:1px 4px;margin-bottom:1px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.agenda-item.pago{background:var(--ok-soft);color:var(--ok);}
.agenda-item.pendente{background:var(--wait-soft);color:var(--wait);}
.agenda-item.vencido{background:var(--danger-soft);color:var(--danger);}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer;}
.icon-btn:hover{background:var(--line);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.recorrencia-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--gold-ink);}
</style>
</head>
<body>

<div class="tabs-bar" id="tabsBar">
  <button class="active" data-tab="lancamentos">📋 Lançamentos</button>
  <button data-tab="fixos">🔁 Despesas Fixas</button>
  <button data-tab="agenda">📅 Agenda</button>
</div>

<!-- LANÇAMENTOS -->
<div class="tab-content active" id="tab-lancamentos">
  <div class="page-head">
    <div><h1 class="page-title">💸 Gastos e Despesas</h1><p class="page-sub">Todos os lançamentos de gastos da empresa.</p></div>
    <button class="btn btn-accent" id="btnNovoGasto">+ Novo gasto</button>

  <div class="filters">

    <select id="gastoFiltroCategoria"><option value="">Todas as categorias</option></select>
    <select id="gastoFiltroLoja"><option value="">Todas as lojas</option></select>

  <div class="card" style="padding:0;overflow-x:auto;"><div id="gastosTabela"></div></div>
</div>

<!-- DESPESAS FIXAS -->
<div class="tab-content" id="tab-fixos">
  <div class="page-head">
    <div><h1 class="page-title">🔁 Despesas Fixas</h1><p class="page-sub">Despesas recorrentes — geram lançamentos automaticamente.</p></div>
    <button class="btn btn-accent" id="btnNovoFixo">+ Nova despesa fixa</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto;"><div id="fixosTabela"></div></div>
</div>

<!-- AGENDA -->
<div class="tab-content" id="tab-agenda">
  <div class="page-head">
    <div><h1 class="page-title">📅 Agenda de Contas</h1><p class="page-sub">Visão mensal de contas pagas e a pagar.</p></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost btn-sm" id="btnAgendaMesAnt">‹ Anterior</button>
      <span id="agendaMesLabel" style="font-weight:700;font-size:14px;min-width:130px;text-align:center;"></span>
      <button class="btn btn-ghost btn-sm" id="btnAgendaMesPro">Próximo ›</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;">
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Dom</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Seg</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Ter</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Qua</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Qui</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Sex</div>
    <div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px;">Sáb</div>
  </div>
  <div id="agendaCalendario"></div>
  <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">
    <span class="agenda-item pago" style="padding:4px 10px;border-radius:6px;">✓ Pago</span>
    <span class="agenda-item pendente" style="padding:4px 10px;border-radius:6px;">⏳ Pendente</span>
    <span class="agenda-item vencido" style="padding:4px 10px;border-radius:6px;">⚠️ Vencido</span>
  </div>
</div>

<!-- MODAL GENÉRICO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
let __gatewaySenha = null;
let currentUser = null;
let config = {};
let gastos = [];
let fixos = [];
let agendaMesAtual = new Date();

// ── Categorias padrão ──────────────────────────────────────────
const CATEGORIAS_PADRAO = [
  'Aluguel','Energia Elétrica','Água e Saneamento','Internet / Telefone',
  'Folha de Pagamento','Pró-labore','Fornecedores','Material de Escritório',
  'Marketing e Publicidade','Manutenção','Impostos e Taxas','Contador',
  'Seguro','Transporte / Frete','Equipamentos','Software / Assinatura',
  'Outros'
];

// ── Gateway ────────────────────────────────────────────────────
async function gw(body){
  try{
    const r = await fetch(GATEWAY_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({senha:__gatewaySenha,...body})});
    return await r.json();
  }catch(e){return{error:'Sem conexão'};}
}

// ── Helpers ────────────────────────────────────────────────────
const esc = s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtMoeda = v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d=>{if(!d)return'—';const[y,m,di]=d.split('-');return`${di}/${m}/${y}`;};
const hoje = ()=>new Date().toISOString().slice(0,10);
const uid = p=>(p||'g')+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
function showToast(msg,dur=2800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalOverlay').classList.add('show');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

// ── Status calculado ────────────────────────────────────────────
function calcStatus(g){
  if(g.pago) return 'pago';
  if(g.vencimento && g.vencimento < hoje()) return 'vencido';
  return 'pendente';
}
function badgeStatus(g){
  const s=calcStatus(g);
  if(s==='pago') return `<span class="badge badge-ok">✓ Pago</span>`;
  if(s==='vencido') return `<span class="badge badge-danger">⚠️ Vencido</span>`;
  return `<span class="badge badge-wait">⏳ Pendente</span>`;
}
function recLabel(r){
  return {diario:'Diário',semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal',anual:'Anual'}[r]||r;
}

// ── Tabs ────────────────────────────────────────────────────────
document.querySelectorAll('.tabs-bar button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tabs-bar button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
    parent.postMessage({type:'activeTab',modulo:'gastos',tabId:b.dataset.tab},'*');
    if(b.dataset.tab==='agenda') renderAgenda();
  });
});

// ── Init ────────────────────────────────────────────────────────
window.addEventListener('message',async ev=>{
  if(ev.data&&ev.data.type==='auth'){
    currentUser=ev.data.user;
    __gatewaySenha=currentUser?currentUser.senha:null;
    await loadAll();
    renderLancamentos();
    renderFixos();
    parent.postMessage({type:'tabs',modulo:'gastos',tabs:[
      {id:'lancamentos',label:'📋 Lançamentos'},{id:'fixos',label:'🔁 Despesas Fixas'},{id:'agenda',label:'📅 Agenda'}
    ],active:'lancamentos'},'*');
  }
});
window.addEventListener('load',()=>parent.postMessage({type:'ready',modulo:'gastos'},'*'));

// ── Carga ────────────────────────────────────────────────────────
async function loadAll(){
  const [rCfg,rG,rF]=await Promise.all([
    gw({op:'getConfig'}),
    gw({op:'selectAll',table:'gastos'}),
    gw({op:'selectAll',table:'gastos_fixos'}),
  ]);
  config=rCfg.data||{};
  gastos=(rG.data||[]).map(r=>r.payload).filter(Boolean);
  fixos=(rF.data||[]).map(r=>r.payload).filter(Boolean);
  // Gerar instâncias de despesas fixas que ainda não foram lançadas
  await gerarInstanciasFixos();
  // Preencher filtros
  const todasCats=[...new Set([...CATEGORIAS_PADRAO,...gastos.map(g=>g.categoria).filter(Boolean)])].sort();
  const selCat=document.getElementById('gastoFiltroCategoria');
  selCat.innerHTML='<option value="">Todas as categorias</option>'+todasCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const lojas=(config.lojas||[]);
  const selLoja=document.getElementById('gastoFiltroLoja');
  selLoja.innerHTML='<option value="">Todas as lojas</option>'+lojas.map(l=>`<option value="${esc(l.nome)}">${esc(l.nome)}</option>`).join('');
  renderAlertasVencimento();
}

// ── Gerar instâncias de fixos ────────────────────────────────────
async function gerarInstanciasFixos(){
  const hj=hoje();
  for(const f of fixos){
    if(!f.ativo) continue;
    const vencimentos=proxVencimentos(f,hj,12);// até 12 meses à frente
    for(const vc of vencimentos){
      const jaExiste=gastos.some(g=>g.fixoId===f.id&&g.vencimento===vc);
      if(!jaExiste){
        const novo={id:uid('g'),fixoId:f.id,descricao:f.descricao,valor:f.valor,categoria:f.categoria,loja:f.loja,vencimento:vc,pago:false,recorrencia:f.recorrencia,criadoEm:hj};
        await gw({op:'upsert',table:'gastos',params:{row:{id:novo.id,payload:novo}}});
        gastos.push(novo);
      }
    }
  }
}

// ── Calcular próximos vencimentos ────────────────────────────────
function proxVencimentos(fixo,dataRef,quantos){
  const dInicio=new Date(fixo.dataInicio+'T12:00:00');
  const dRef=new Date(dataRef+'T12:00:00');
  const dLimite=new Date(dRef);
  dLimite.setMonth(dLimite.getMonth()+quantos);
  const resultado=[];
  let cursor=new Date(dInicio);
  let seguranca=0;
  while(cursor<=dLimite&&seguranca<500){
    seguranca++;
    if(cursor>=dRef){
      resultado.push(cursor.toISOString().slice(0,10));
      if(resultado.length>=quantos) break;
    }
    // avançar
    switch(fixo.recorrencia){
      case'diario': cursor.setDate(cursor.getDate()+1); break;
      case'semanal': cursor.setDate(cursor.getDate()+7); break;
      case'quinzenal': cursor.setDate(cursor.getDate()+15); break;
      case'mensal': cursor.setMonth(cursor.getMonth()+1); break;
      case'anual': cursor.setFullYear(cursor.getFullYear()+1); break;
      default: cursor=new Date(dLimite+1);
    }
  }
  return resultado;
}

// ── Alertas de vencimento ────────────────────────────────────────
function renderAlertasVencimento(){
  const hj=hoje();
  const vencemHoje=gastos.filter(g=>!g.pago&&g.vencimento===hj);
  const vencidos=gastos.filter(g=>!g.pago&&g.vencimento&&g.vencimento<hj);
  const el=document.getElementById('alertasVencimento');
  let html='';
  if(vencidos.length>0){
    html+=`<div class="alerta-box danger" style="margin-bottom:12px;">
      <b>⚠️ ${vencidos.length} conta(s) VENCIDA(S) sem pagamento!</b>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
        ${vencidos.slice(0,5).map(g=>`
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid #f5b8b8;border-radius:8px;padding:8px 12px;">
            <div><b>${esc(g.descricao)}</b> <span class="muted">· ${fmtDate(g.vencimento)}</span></div>
            <div style="display:flex;gap:6px;align-items:center;">${fmtMoeda(g.valor)}<button class="btn btn-sm btn-accent" data-marcarPago="${esc(g.id)}">Marcar pago</button></div>
          </div>`).join('')}
        ${vencidos.length>5?`<div class="muted" style="font-size:12px;">… e mais ${vencidos.length-5} vencido(s).</div>`:''}
      </div>
    </div>`;
  }
  if(vencemHoje.length>0){
    html+=`<div class="alerta-box" style="margin-bottom:12px;">
      <b>🔔 ${vencemHoje.length} conta(s) vencem HOJE!</b>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
        ${vencemHoje.map(g=>`
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid #f5c842;border-radius:8px;padding:8px 12px;">
            <div><b>${esc(g.descricao)}</b> <span class="muted">· ${esc(g.categoria||'')}</span></div>
            <div style="display:flex;gap:6px;align-items:center;">${fmtMoeda(g.valor)}<button class="btn btn-sm btn-accent" data-marcarPago="${esc(g.id)}">Marcar pago</button></div>
          </div>`).join('')}
      </div>
    </div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('[data-marcarPago]').forEach(b=>b.addEventListener('click',()=>marcarPago(b.dataset.marcarPago)));
}

// ── KPIs ─────────────────────────────────────────────────────────
function renderKpis(lista){
  const pagos=lista.filter(g=>g.pago);
  const pendentes=lista.filter(g=>!g.pago&&calcStatus(g)==='pendente');
  const vencidos=lista.filter(g=>calcStatus(g)==='vencido');
  const totalPago=pagos.reduce((a,g)=>a+Number(g.valor||0),0);
  const totalPendente=[...pendentes,...vencidos].reduce((a,g)=>a+Number(g.valor||0),0);
  // Agrupamento por categoria (pagos)
  const porCat={};
  pagos.forEach(g=>{const c=g.categoria||'Outros';porCat[c]=(porCat[c]||0)+Number(g.valor||0);});
  const topCat=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,1);
  document.getElementById('kpisGastos').innerHTML=`
    <div class="kpi-card"><div class="kpi-val" style="color:var(--ok);">${fmtMoeda(totalPago)}</div><div class="kpi-label">Total pago</div></div>
    <div class="kpi-card"><div class="kpi-val" style="color:var(--wait);">${fmtMoeda(totalPendente)}</div><div class="kpi-label">A pagar</div></div>
    <div class="kpi-card"><div class="kpi-val" style="color:var(--danger);">${vencidos.length}</div><div class="kpi-label">Vencidos</div></div>
    <div class="kpi-card"><div class="kpi-val">${lista.length}</div><div class="kpi-label">Lançamentos</div></div>
    ${topCat.length?`<div class="kpi-card"><div class="kpi-val" style="font-size:13px;">${esc(topCat[0][0])}</div><div class="kpi-label">Maior categoria</div></div>`:''}
  `;
}

// ── Render lançamentos ────────────────────────────────────────────
function renderLancamentos(){
  function filtrar(){
    const q=(document.getElementById('gastoBusca').value||'').toLowerCase();
    const st=document.getElementById('gastoFiltroStatus').value;
    const cat=document.getElementById('gastoFiltroCategoria').value;
    const loja=document.getElementById('gastoFiltroLoja').value;
    const mes=document.getElementById('gastoFiltroMes').value;
    let l=[...gastos];
    if(q) l=l.filter(g=>(g.descricao||'').toLowerCase().includes(q)||(g.categoria||'').toLowerCase().includes(q));
    if(st) l=l.filter(g=>calcStatus(g)===st);
    if(cat) l=l.filter(g=>g.categoria===cat);
    if(loja) l=l.filter(g=>g.loja===loja);
    if(mes) l=l.filter(g=>(g.vencimento||g.criadoEm||'').startsWith(mes));
    l.sort((a,b)=>(b.vencimento||b.criadoEm||'').localeCompare(a.vencimento||a.criadoEm||''));
    return l;
  }
  function render(){
    const l=filtrar();
    renderKpis(l);
    const el=document.getElementById('gastosTabela');
    if(l.length===0){el.innerHTML='<div class="empty">Nenhum gasto encontrado.</div>';return;}
    el.innerHTML=`<table>
      <thead><tr><th>Descrição</th><th>Categoria</th><th>Loja</th><th>Vencimento</th><th style="text-align:right">Valor</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${l.map(g=>{
        const st=calcStatus(g);
        return `<tr style="${st==='vencido'?'background:rgba(196,39,43,.04)':''}">
          <td><b>${esc(g.descricao)}</b>${g.recorrencia?` <span class="recorrencia-chip">${recLabel(g.recorrencia)}</span>`:''}</td>
          <td>${esc(g.categoria||'—')}</td>
          <td>${esc(g.loja||'—')}</td>
          <td>${fmtDate(g.vencimento)}</td>
          <td style="text-align:right;font-weight:700;">${fmtMoeda(g.valor)}</td>
          <td>${badgeStatus(g)}</td>
          <td style="white-space:nowrap;">
            ${!g.pago?`<button class="icon-btn" data-pago="${esc(g.id)}" title="Marcar pago">✓</button>`:`<button class="icon-btn" data-despago="${esc(g.id)}" title="Desmarcar pago" style="color:var(--ok);">✓</button>`}
            <button class="icon-btn" data-edit="${esc(g.id)}" title="Editar">✎</button>
            <button class="icon-btn" data-del="${esc(g.id)}" title="Excluir">🗑</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
    el.querySelectorAll('[data-pago]').forEach(b=>b.addEventListener('click',async()=>{await marcarPago(b.dataset.pago);render();}));
    el.querySelectorAll('[data-despago]').forEach(b=>b.addEventListener('click',async()=>{await desmarcarPago(b.dataset.despago);render();}));
    el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>abrirModalGasto(gastos.find(g=>g.id===b.dataset.edit),render)));
    el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Excluir este lançamento?')) return;
      await gw({op:'delete',table:'gastos',params:{column:'id',value:b.dataset.del}});
      gastos=gastos.filter(g=>g.id!==b.dataset.del);
      showToast('Excluído.');render();renderAlertasVencimento();
    }));
  }
  document.getElementById('gastoBusca').oninput=render;
  document.getElementById('gastoFiltroStatus').onchange=render;
  document.getElementById('gastoFiltroCategoria').onchange=render;
  document.getElementById('gastoFiltroLoja').onchange=render;
  document.getElementById('gastoFiltroMes').onchange=render;
  document.getElementById('btnLimparFiltroGasto').onclick=()=>{
    ['gastoBusca','gastoFiltroMes'].forEach(id=>document.getElementById(id).value='');
    ['gastoFiltroStatus','gastoFiltroCategoria','gastoFiltroLoja'].forEach(id=>document.getElementById(id).value='');
    render();
  };
  document.getElementById('btnNovoGasto').onclick=()=>abrirModalGasto(null,render);
  render();
}

async function marcarPago(id){
  const g=gastos.find(x=>x.id===id);if(!g) return;
  g.pago=true;g.dataPagamento=hoje();
  await gw({op:'upsert',table:'gastos',params:{row:{id:g.id,payload:g}}});
  showToast('Marcado como pago!');
  renderAlertasVencimento();
  // Notifica dashboard via postMessage
  parent.postMessage({type:'gastoAtualizado'},'*');
}
async function desmarcarPago(id){
  const g=gastos.find(x=>x.id===id);if(!g) return;
  g.pago=false;g.dataPagamento=null;
  await gw({op:'upsert',table:'gastos',params:{row:{id:g.id,payload:g}}});
  showToast('Pagamento removido.');
}

// ── Modal gasto ───────────────────────────────────────────────────
function abrirModalGasto(g,onSave){
  const lojas=(config.lojas||[]);
  const catUsadas=[...new Set([...CATEGORIAS_PADRAO,...gastos.map(x=>x.categoria).filter(Boolean)])].sort();
  const isEdit=!!g;
  openModal(`
    <h3 style="margin:0 0 16px;">${isEdit?'Editar gasto':'Novo gasto'}</h3>
    <div class="grid-2">
      <div class="field" style="grid-column:1/-1;"><label>Descrição *</label><input id="gDesc" value="${esc(g?.descricao||'')}"></div>
      <div class="field">
        <label>Categoria *</label>
        <select id="gCatSel">
          ${catUsadas.map(c=>`<option value="${esc(c)}"${g?.categoria===c?' selected':''}>${esc(c)}</option>`).join('')}
          <option value="__outro">+ Outra categoria...</option>
        </select>
      </div>
      <div class="field" id="gCatLivreWrap" style="display:none;"><label>Nova categoria</label><input id="gCatLivre" placeholder="Digite o nome da categoria"></div>
      <div class="field"><label>Valor (R$) *</label><input type="number" id="gValor" step="0.01" min="0" value="${g?.valor||''}"></div>
      <div class="field"><label>Vencimento</label><input type="date" id="gVenc" value="${g?.vencimento||''}"></div>
      <div class="field"><label>Loja</label>
        <select id="gLoja">
          <option value="">— Geral (todas as lojas) —</option>
          ${lojas.map(l=>`<option value="${esc(l.nome)}"${g?.loja===l.nome?' selected':''}>${esc(l.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Forma de pagamento</label><input id="gFormaPg" value="${esc(g?.formaPagamento||'')}"></div>
      <div class="field"><label>Observação</label><textarea id="gObs" style="min-height:56px;">${esc(g?.obs||'')}</textarea></div>
      <div class="field"><label>Status</label>
        <select id="gPago">
          <option value="0"${!g?.pago?' selected':''}>⏳ Pendente</option>
          <option value="1"${g?.pago?' selected':''}>✓ Pago</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="btnSalvarGasto">Salvar</button>
    </div>
  `);
  document.getElementById('gCatSel').addEventListener('change',e=>{
    document.getElementById('gCatLivreWrap').style.display=e.target.value==='__outro'?'':'none';
  });
  document.getElementById('btnSalvarGasto').addEventListener('click',async()=>{
    const desc=document.getElementById('gDesc').value.trim();
    const valor=parseFloat(document.getElementById('gValor').value);
    if(!desc||isNaN(valor)||valor<0){showToast('Preencha descrição e valor.');return;}
    const catSel=document.getElementById('gCatSel').value;
    const cat=catSel==='__outro'?document.getElementById('gCatLivre').value.trim()||'Outros':catSel;
    const pago=document.getElementById('gPago').value==='1';
    const novo={
      id:g?.id||uid('g'),
      descricao:desc,categoria:cat,
      valor,vencimento:document.getElementById('gVenc').value,
      loja:document.getElementById('gLoja').value,
      formaPagamento:document.getElementById('gFormaPg').value.trim(),
      obs:document.getElementById('gObs').value.trim(),
      pago,dataPagamento:pago?(g?.dataPagamento||hoje()):null,
      criadoEm:g?.criadoEm||hoje(),
      fixoId:g?.fixoId||null,recorrencia:g?.recorrencia||null,
    };
    await gw({op:'upsert',table:'gastos',params:{row:{id:novo.id,payload:novo}}});
    const idx=gastos.findIndex(x=>x.id===novo.id);
    if(idx>=0) gastos[idx]=novo; else gastos.push(novo);
    showToast(isEdit?'Gasto atualizado!':'Gasto salvo!');
    closeModal();
    if(onSave) onSave();
    renderAlertasVencimento();
    parent.postMessage({type:'gastoAtualizado'},'*');
  });
}

// ── Render despesas fixas ─────────────────────────────────────────
function renderFixos(){
  function render(){
    const el=document.getElementById('fixosTabela');
    if(fixos.length===0){el.innerHTML='<div class="empty">Nenhuma despesa fixa cadastrada ainda.<br><span style="font-size:12px;">As despesas fixas geram lançamentos automáticos conforme a recorrência.</span></div>';return;}
    el.innerHTML=`<table>
      <thead><tr><th>Descrição</th><th>Categoria</th><th>Recorrência</th><th>Próximo venc.</th><th style="text-align:right">Valor</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${fixos.map(f=>{
        const proxVenc=proxVencimentos(f,hoje(),1)[0]||'—';
        return `<tr>
          <td><b>${esc(f.descricao)}</b></td>
          <td>${esc(f.categoria||'—')}</td>
          <td><span class="recorrencia-chip">${recLabel(f.recorrencia)}</span></td>
          <td>${fmtDate(proxVenc)}</td>
          <td style="text-align:right;font-weight:700;">${fmtMoeda(f.valor)}</td>
          <td><span class="badge ${f.ativo?'badge-ok':'badge-neutral'}">${f.ativo?'✓ Ativa':'Pausada'}</span></td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" data-togglefixo="${esc(f.id)}" title="${f.ativo?'Pausar':'Ativar'}">${f.ativo?'⏸':'▶'}</button>
            <button class="icon-btn" data-editfixo="${esc(f.id)}" title="Editar">✎</button>
            <button class="icon-btn" data-delfixo="${esc(f.id)}" title="Excluir">🗑</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
    el.querySelectorAll('[data-togglefixo]').forEach(b=>b.addEventListener('click',async()=>{
      const f=fixos.find(x=>x.id===b.dataset.togglefixo);if(!f) return;
      f.ativo=!f.ativo;
      await gw({op:'upsert',table:'gastos_fixos',params:{row:{id:f.id,payload:f}}});
      showToast(f.ativo?'Despesa ativada.':'Despesa pausada.');render();
    }));
    el.querySelectorAll('[data-editfixo]').forEach(b=>b.addEventListener('click',()=>abrirModalFixo(fixos.find(f=>f.id===b.dataset.editfixo),render)));
    el.querySelectorAll('[data-delfixo]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Excluir esta despesa fixa? Os lançamentos já criados não serão removidos.')) return;
      await gw({op:'delete',table:'gastos_fixos',params:{column:'id',value:b.dataset.delfixo}});
      fixos=fixos.filter(f=>f.id!==b.dataset.delfixo);
      showToast('Despesa fixa excluída.');render();
    }));
  }
  document.getElementById('btnNovoFixo').onclick=()=>abrirModalFixo(null,render);
  render();
}

function abrirModalFixo(f,onSave){
  const lojas=(config.lojas||[]);
  const catUsadas=[...new Set([...CATEGORIAS_PADRAO,...gastos.map(x=>x.categoria).filter(Boolean)])].sort();
  openModal(`
    <h3 style="margin:0 0 16px;">${f?'Editar despesa fixa':'Nova despesa fixa'}</h3>
    <div class="grid-2">
      <div class="field" style="grid-column:1/-1;"><label>Descrição *</label><input id="ffDesc" value="${esc(f?.descricao||'')}"></div>
      <div class="field"><label>Categoria</label>
        <select id="ffCat">
          ${catUsadas.map(c=>`<option value="${esc(c)}"${f?.categoria===c?' selected':''}>${esc(c)}</option>`).join('')}
          <option value="__outro">+ Outra...</option>
        </select>
      </div>
      <div class="field" id="ffCatLivreWrap" style="display:none;"><label>Nova categoria</label><input id="ffCatLivre" placeholder="Nome da categoria"></div>
      <div class="field"><label>Valor (R$) *</label><input type="number" id="ffValor" step="0.01" min="0" value="${f?.valor||''}"></div>
      <div class="field"><label>Recorrência *</label>
        <select id="ffRec">
          <option value="diario"${f?.recorrencia==='diario'?' selected':''}>Diário</option>
          <option value="semanal"${f?.recorrencia==='semanal'?' selected':''}>Semanal</option>
          <option value="quinzenal"${f?.recorrencia==='quinzenal'?' selected':''}>Quinzenal</option>
          <option value="mensal"${(!f||f?.recorrencia==='mensal')?' selected':''}>Mensal</option>
          <option value="anual"${f?.recorrencia==='anual'?' selected':''}>Anual</option>
        </select>
      </div>
      <div class="field"><label>Data início *</label><input type="date" id="ffInicio" value="${f?.dataInicio||hoje()}"></div>
      <div class="field"><label>Loja</label>
        <select id="ffLoja">
          <option value="">— Geral —</option>
          ${lojas.map(l=>`<option value="${esc(l.nome)}"${f?.loja===l.nome?' selected':''}>${esc(l.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Observação</label><textarea id="ffObs" style="min-height:56px;">${esc(f?.obs||'')}</textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="btnSalvarFixo">Salvar</button>
    </div>
  `);
  document.getElementById('ffCat').addEventListener('change',e=>{
    document.getElementById('ffCatLivreWrap').style.display=e.target.value==='__outro'?'':'none';
  });
  document.getElementById('btnSalvarFixo').addEventListener('click',async()=>{
    const desc=document.getElementById('ffDesc').value.trim();
    const valor=parseFloat(document.getElementById('ffValor').value);
    const inicio=document.getElementById('ffInicio').value;
    if(!desc||isNaN(valor)||!inicio){showToast('Preencha descrição, valor e data início.');return;}
    const catSel=document.getElementById('ffCat').value;
    const cat=catSel==='__outro'?document.getElementById('ffCatLivre').value.trim()||'Outros':catSel;
    const novo={
      id:f?.id||uid('f'),
      descricao:desc,categoria:cat,valor,
      recorrencia:document.getElementById('ffRec').value,
      dataInicio:inicio,
      loja:document.getElementById('ffLoja').value,
      obs:document.getElementById('ffObs').value.trim(),
      ativo:f?.ativo!==false,criadoEm:f?.criadoEm||hoje(),
    };
    await gw({op:'upsert',table:'gastos_fixos',params:{row:{id:novo.id,payload:novo}}});
    const idx=fixos.findIndex(x=>x.id===novo.id);
    if(idx>=0) fixos[idx]=novo; else fixos.push(novo);
    // Gera próximos lançamentos imediatamente
    await gerarInstanciasFixos();
    showToast(f?'Despesa fixa atualizada!':'Despesa fixa criada!');
    closeModal();if(onSave) onSave();
  });
}

// ── Agenda ────────────────────────────────────────────────────────
function renderAgenda(){
  const mes=agendaMesAtual.getMonth();
  const ano=agendaMesAtual.getFullYear();
  const nomeMes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes];
  document.getElementById('agendaMesLabel').textContent=`${nomeMes} ${ano}`;
  const primeiroDia=new Date(ano,mes,1).getDay();
  const ultimoDia=new Date(ano,mes+1,0).getDate();
  const hj=hoje();
  // Indexar gastos do mês
  const gastosMes={};
  gastos.filter(g=>g.vencimento&&g.vencimento.startsWith(`${ano}-${String(mes+1).padStart(2,'0')}`)).forEach(g=>{
    const dia=parseInt(g.vencimento.split('-')[2]);
    if(!gastosMes[dia]) gastosMes[dia]=[];
    gastosMes[dia].push(g);
  });
  let html='';
  // Células vazias antes do primeiro dia
  for(let i=0;i<primeiroDia;i++) html+=`<div style="min-height:70px;"></div>`;
  // Dias
  for(let d=1;d<=ultimoDia;d++){
    const dataStr=`${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isHoje=dataStr===hj;
    const itens=gastosMes[d]||[];
    html+=`<div class="agenda-dia${isHoje?' hoje':''}">
      <div class="dia-num" style="${isHoje?'color:var(--accent);':''}">${d}</div>
      ${itens.slice(0,3).map(g=>{
        const st=calcStatus(g);
        return `<div class="agenda-item ${st}" title="${esc(g.descricao)} — ${fmtMoeda(g.valor)}" data-agitem="${esc(g.id)}">${esc(g.descricao.slice(0,12))}</div>`;
      }).join('')}
      ${itens.length>3?`<div style="font-size:9px;color:var(--ink-faint);margin-top:1px;">+${itens.length-3}</div>`:''}
    </div>`;
  }
  document.getElementById('agendaCalendario').innerHTML=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${html}</div>`;
  // Click em item abre detalhes
  document.querySelectorAll('[data-agitem]').forEach(b=>b.addEventListener('click',()=>{
    const g=gastos.find(x=>x.id===b.dataset.agitem);
    if(!g) return;
    openModal(`
      <h3 style="margin:0 0 12px;">${esc(g.descricao)}</h3>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;">
        <div><b>Valor:</b> ${fmtMoeda(g.valor)}</div>
        <div><b>Vencimento:</b> ${fmtDate(g.vencimento)}</div>
        <div><b>Categoria:</b> ${esc(g.categoria||'—')}</div>
        <div><b>Loja:</b> ${esc(g.loja||'—')}</div>
        <div><b>Status:</b> ${badgeStatus(g)}</div>
        ${g.obs?`<div><b>Obs:</b> ${esc(g.obs)}</div>`:''}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
        ${!g.pago?`<button class="btn btn-accent" id="btnAgPago">✓ Marcar pago</button>`:''}
      </div>
    `);
    document.getElementById('btnAgPago')?.addEventListener('click',async()=>{
      await marcarPago(g.id);closeModal();renderAgenda();
    });
  }));
  // Botões de navegação
  document.getElementById('btnAgendaMesAnt').onclick=()=>{agendaMesAtual.setMonth(agendaMesAtual.getMonth()-1);renderAgenda();};
  document.getElementById('btnAgendaMesPro').onclick=()=>{agendaMesAtual.setMonth(agendaMesAtual.getMonth()+1);renderAgenda();};
}
</script>
