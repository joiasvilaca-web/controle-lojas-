<!DOCTYPE html>
<html lang="pt-BR" data-ds data-sem-maiuscula>
<head>
<script src="supabase-config.js"></script>
<script src="tema.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisos — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="tema.css">
<script src="icones.js"></script>
<script src="avaliacoes-ui.js"></script>
<script src="marketing-off.js"></script>
<script src="recado-cliente.js"></script>
<script src="avisos-core.js"></script>
<style>
:root{ --radius:12px; --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
.wrap{padding:20px 16px 48px;max-width:960px;margin:0 auto;}

/* Cabeçalho */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;}
.page-title{font-size:20px;font-weight:700;margin:0 0 2px;letter-spacing:-.015em;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;line-height:1.4;}
.btn:hover{background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:4px 10px;font-size:12.5px;}
.muted{color:var(--ink-faint);}
#btnAtualizar{flex-shrink:0;}

/* Resumo: um atalho por área com pendência */
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:24px;}
.resumo:empty{display:none;}
.resumo-item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--t-shadow-sm);color:var(--ink);transition:border-color .15s,background-color .15s;}
.resumo-item:hover{border-color:var(--line-strong);background:var(--surface-2);}
.resumo-ico{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
.resumo-txt{flex:1;min-width:0;}
.resumo-nome{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.resumo-det{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px;}
.resumo-det.perigo{color:var(--danger);font-weight:600;}
.resumo-num{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);}
.resumo-item.tem-perigo .resumo-num{color:var(--danger);}

/* Módulo (CAIXA, CONFIGURAÇÕES) e área (Pedido, Orçamento…) */
.modulo{margin-bottom:24px;}
.modulo-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px;}
.modulo-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.aba{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--t-shadow-sm);overflow:hidden;margin-bottom:12px;scroll-margin-top:40px;}
.aba.destaque{border-color:var(--accent);box-shadow:var(--t-ring);}
.aba-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.aba-head h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--ink);}
.aba-head h3 .ico{color:var(--accent);}
.grupo{padding:4px 0 0;}
.grupo + .grupo{border-top:1px solid var(--line);}
.grupo-title{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:0;padding:10px 16px 6px;display:flex;align-items:center;gap:8px;}
.grupo-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.grupo-title .n{color:var(--ink-faint);font-weight:600;}
.dot-danger{background:var(--danger);} .dot-wait{background:var(--wait);} .dot-info{background:var(--info);}

/* Linha de aviso: a linha inteira abre o registro */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background-color .15s;}
.grupo-title + .item{border-top:none;}
.item:hover{background:var(--surface-2);}
.item[hidden]{display:none;}
.item .txt{min-width:0;font-size:14px;}
.item .txt b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .sub{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.tag .ico{width:13px;height:13px;}
.tag-danger{background:var(--danger-soft);color:var(--danger);}
.tag-wait{background:var(--wait-soft);color:var(--wait);}
.tag-info{background:var(--surface-2);color:var(--ink-soft);}
.item-ver{padding:4px 8px 4px 12px;}
.item-ver .ico{width:15px;height:15px;}
.mais{display:block;width:100%;padding:9px 16px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--accent);font-size:13px;font-weight:600;text-align:left;}
.mais:hover{background:var(--surface-2);}

/* Estados */
.estado{padding:40px 20px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.estado-ico{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;margin-bottom:12px;}
.estado-ok .estado-ico{background:var(--ok-soft);color:var(--ok);}
.estado-erro .estado-ico{background:var(--danger-soft);color:var(--danger);}
.estado h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.015em;}
.estado p{margin:0 auto;max-width:420px;color:var(--ink-faint);font-size:14px;line-height:1.5;}
.estado .btn{margin-top:16px;}
.esq{display:block;height:12px;border-radius:6px;background:var(--surface-2);}
.esq-linha{padding:14px 16px;border-top:1px solid var(--line);}
.esq-linha .esq + .esq{margin-top:8px;}
@media (prefers-reduced-motion:no-preference){
  .esq{animation:pulsar 1.2s ease-in-out infinite;}
  @keyframes pulsar{50%{opacity:.5;}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* 18/11: observações da pendência (com recado ao cliente) e ciente da agenda dentro do item */
.item .obs-av{margin-top:8px;display:grid;gap:8px;white-space:normal;}
.item .obs-av-i{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.45;cursor:default;}
.item .obs-av b{display:inline;white-space:normal;font-weight:700;}
.item .obs-av-t{font-size:12.5px;margin-bottom:2px;}
.item .item-ciente{margin-top:6px;}
.toast-av{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:9700;max-width:92vw;text-align:center;}
/* Celular: linha inteira é o alvo, com seta à direita */
@media (max-width:760px){
  .wrap{padding:16px 16px 40px;}
  html[data-ds] .page-head{flex-direction:row;align-items:flex-start;gap:12px;}
  .page-head > div{flex:1;min-width:0;}
  #btnAtualizar .rot{display:none;}
  #btnAtualizar{width:40px;height:40px;padding:0;justify-content:center;}
  .resumo{grid-template-columns:1fr 1fr;}
  .resumo-item{padding:10px 12px;gap:8px;}
  .resumo-ico{display:none;}
  .resumo-num{font-size:20px;}
  .aba-head{padding:12px 14px;}
  .aba-head .rot-longo{display:none;}
  .grupo-title{padding:10px 14px 6px;}
  .item{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"txt ver" "tag ver";row-gap:6px;column-gap:8px;padding:12px 6px 12px 14px;min-height:56px;}
  .item .txt{grid-area:txt;}
  .item .txt b{white-space:normal;}
  .item .tag{grid-area:tag;justify-self:start;}
  html[data-ds] .item .item-ver{grid-area:ver;border:0;background:transparent;box-shadow:none;width:40px;height:40px;min-height:40px;padding:0;justify-content:center;color:var(--ink-faint);}
  .item-ver .ver-txt{display:none;}
  .item-ver .ico{width:20px;height:20px;}
  .mais{padding:12px 14px;}
}
@media (max-width:360px){ .resumo{grid-template-columns:1fr;} }
  .item .sub.falha{color:var(--danger,#c0392b) !important;font-weight:600;display:flex;gap:6px;align-items:flex-start;margin-top:2px;white-space:normal;} .item .sub.falha svg{flex:none;margin-top:2px;}

/* 25/11 — toque 44px no celular */
@media (max-width:760px){ html[data-ds] .item-ver, html[data-ds] #btnAtualizar{ width:auto; height:auto; min-width:44px; min-height:44px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div>
      <h1 class="page-title">Avisos</h1>
      <p class="page-sub" id="subtitulo" aria-live="polite">Procurando pendências…</p>
    </div>
    <button class="btn" id="btnAtualizar" type="button" title="Atualizar avisos" aria-label="Atualizar avisos"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg><span class="rot">Atualizar</span></button>
  </div>
  <div id="avaliacoesBox" style="margin:0 0 12px;"></div>
  <nav class="resumo" id="resumo" aria-label="Resumo das pendências"></nav>
  <div id="conteudo"></div>
</div>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = window.SUPABASE_URL;        // vem de supabase-config.js
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;  // vem de supabase-config.js
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
const EMBEDDED = window.parent !== window;

let __gatewaySenha = null;
let currentUser = null;
let config = {};

/* 23/11 (Felipe): o Vilacinha vira o portador de avisos. Esta aba é onde a diretoria escreve o recado
   e escolhe quem recebe (todas as vendedoras, gerentes, oficina, ou pessoa por pessoa). Função: copiloto-extra. */
let abaAtual = 'pendencias';
let __pessoasRecado = null;
async function apiRecado(body){
  try{
    const r = await fetch(SUPABASE_URL + '/functions/v1/copiloto-extra', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) });
    return await r.json();
  }catch(e){ return { error:'Sem conexão.' }; }
}
function ehDiretoria(){ return !!(currentUser && currentUser.nivel === 'diretoria'); }
function abasDoModulo(){
  const t = [{ id:'pendencias', label:'Pendências' }];
  if(ehDiretoria()) t.push({ id:'vilacinha', label:'Recado pelo Vilacinha' });
  return t;
}
const DESTINOS = [['todos','Todo mundo'],['vendedoras','Só as vendedoras'],['gerentes','Gerentes e diretoria'],['oficina','Só a oficina'],['pessoas','Escolher quem recebe']];
function rotDestino(d, ids){
  const r = (DESTINOS.find(x=>x[0]===d)||[])[1] || d;
  return d==='pessoas' ? r + ' (' + ((ids||[]).length) + ')' : r;
}
async function renderVilacinha(){
  const cont = document.getElementById('conteudo');
  const resumo = document.getElementById('resumo'); if(resumo) resumo.innerHTML = '';
  const av = document.getElementById('avaliacoesBox'); if(av) av.innerHTML = '';
  document.getElementById('subtitulo').textContent = 'Escreva um recado: o Vilacinha mostra na tela de quem você escolher, até a pessoa dizer que entendeu.';
  cont.innerHTML = `
    <div class="aba" id="abaRecado">
      <div class="aba-head"><b>Novo recado</b></div>
      <div style="display:grid;gap:10px;padding:4px 0 10px;">
        <label style="display:block;"><span style="font-size:12.5px;font-weight:600;">Título (opcional)</span>
          <input id="recTitulo" maxlength="120" placeholder="Ex.: Reunião quinta às 9h" style="width:100%;border:1px solid var(--line-strong,#bcc);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface,#fff);color:inherit;"></label>
        <label style="display:block;"><span style="font-size:12.5px;font-weight:600;">Recado</span>
          <textarea id="recTexto" maxlength="1200" rows="4" placeholder="Escreva como você falaria com a equipe." style="width:100%;border:1px solid var(--line-strong,#bcc);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface,#fff);color:inherit;"></textarea></label>
        <label style="display:block;"><span style="font-size:12.5px;font-weight:600;">Quem recebe</span>
          <select id="recDestino" style="width:100%;max-width:320px;border:1px solid var(--line-strong,#bcc);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface,#fff);color:inherit;">
            ${DESTINOS.map(d=>`<option value="${d[0]}">${escapeHtml(d[1])}</option>`).join('')}
          </select></label>
        <div id="recPessoas" style="display:none;border:1px solid var(--line,#dde);border-radius:10px;padding:10px;max-height:260px;overflow:auto;"></div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
          <label style="display:flex;gap:6px;align-items:center;font-size:13px;"><input type="checkbox" id="recUrgente"> Marcar como urgente (vermelho)</label>
          <label style="display:flex;gap:6px;align-items:center;font-size:13px;">Sai da tela depois de <input type="number" id="recDias" min="0" max="60" value="0" style="width:64px;border:1px solid var(--line-strong,#bcc);border-radius:8px;padding:6px 8px;font:inherit;background:var(--surface,#fff);color:inherit;"> dias (0 = fica até lerem)</label>
        </div>
        <div><button class="btn" id="recEnviar" type="button" style="background:var(--accent,#8a3560);border-color:var(--accent,#8a3560);color:#fff;">Mandar pelo Vilacinha</button></div>
      </div>
    </div>
    <div class="aba" id="abaRecadosEnviados"><div class="aba-head"><b>Recados mandados</b></div><div id="recLista"><div class="esq-linha"><span class="esq" style="width:60%"></span></div></div></div>`;

  const sel = document.getElementById('recDestino'), box = document.getElementById('recPessoas');
  sel.addEventListener('change', async ()=>{
    if(sel.value !== 'pessoas'){ box.style.display = 'none'; return; }
    box.style.display = 'block';
    if(!__pessoasRecado){ box.innerHTML = 'Carregando…'; const r = await apiRecado({ op:'pessoas' }); __pessoasRecado = (r && r.ok && r.pessoas) || []; }
    box.innerHTML = __pessoasRecado.length
      ? __pessoasRecado.map(p=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px;"><input type="checkbox" value="${escapeHtml(p.id)}"> ${escapeHtml(p.nome||'—')} <span style="color:var(--ink-faint);font-size:12px;">${escapeHtml(p.nivel||'')}</span></label>`).join('')
      : '<span style="color:var(--ink-faint);">Ninguém encontrado.</span>';
  });

  document.getElementById('recEnviar').addEventListener('click', async (e)=>{
    const b = e.currentTarget; b.disabled = true;
    const destino = sel.value;
    const userIds = destino==='pessoas' ? Array.from(box.querySelectorAll('input:checked')).map(x=>x.value) : [];
    const r = await apiRecado({ op:'recadoEnviar', titulo: document.getElementById('recTitulo').value, texto: document.getElementById('recTexto').value,
      destino, userIds, urgente: document.getElementById('recUrgente').checked, dias: Number(document.getElementById('recDias').value)||0 });
    b.disabled = false;
    if(r && r.ok){ document.getElementById('recTitulo').value = ''; document.getElementById('recTexto').value = ''; listarRecados(); alert('Recado mandado. Ele aparece no Vilacinha de quem você escolheu.'); }
    else alert((r && r.error) || 'Não consegui mandar agora.');
  });
  listarRecados();
}
async function listarRecados(){
  const box = document.getElementById('recLista'); if(!box) return;
  const r = await apiRecado({ op:'recadoListar' });
  const L = (r && r.ok && r.recados) || [];
  if(!L.length){ box.innerHTML = '<div style="color:var(--ink-faint);padding:6px 0;">Nenhum recado mandado ainda.</div>'; return; }
  box.innerHTML = L.map(x=>`
    <div class="item" style="align-items:flex-start;">
      <div class="txt"><b>${escapeHtml(x.titulo||'Recado')}</b>
        <span class="sub" style="white-space:pre-wrap;">${escapeHtml(x.texto||'')}</span>
        <span class="sub">${escapeHtml(rotDestino(x.destino, x.user_ids))} · ${new Date(x.criado_em).toLocaleDateString('pt-BR')} · lido por ${x.lidos}${x.quemLeu && x.quemLeu.length ? ' (' + escapeHtml(x.quemLeu.join(', ')) + ')' : ''}${x.ativo ? '' : ' · tirado da tela'}</span></div>
      <span class="tag tag-${x.tipo==='urgente'?'danger':'info'}">${x.tipo==='urgente'?'Urgente':'Recado'}</span>
      ${x.ativo ? `<button class="btn btn-sm" type="button" data-recoff="${escapeHtml(x.id)}">Tirar da tela</button>` : '<span></span>'}
    </div>`).join('');
  box.querySelectorAll('[data-recoff]').forEach(b=> b.addEventListener('click', async ()=>{ b.disabled = true; await apiRecado({ op:'recadoApagar', id:b.dataset.recoff }); listarRecados(); }));
}

/* ===== Regras (dias) ===== */
const DIAS_ORCAMENTO_ABERTO = 5;   // orçamento aberto há X dias sem mudar de status
const DIAS_PRONTO_SEM_RETIRADA = 7; // O.S. pronta e não retirada há X dias
const STATUS_ORC_FECHADOS = ['aprovado', 'recusado'];
const CAMPOS_FICHA_OBRIGATORIOS = [
  ['cpf','CPF'], ['rg','RG'], ['dataNascimento','Data de nascimento'], ['celularParticular','Celular'],
  ['endereco','Endereço'], ['numero','Número'], ['bairro','Bairro'], ['cidade','Cidade'], ['estado','Estado'], ['cep','CEP'],
  ['dataAdmissao','Data de admissão'], ['contatoEmergenciaNome','Contato de emergência'], ['contatoEmergenciaTelefone','Telefone de emergência'],
];

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){ return { error:String(e) }; }
}
function showToast(msg){ let t = document.getElementById('toastAv'); if(!t){ t = document.createElement('div'); t.id = 'toastAv'; t.className = 'toast-av'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; t.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(()=>{ t.style.display = 'none'; }, 4200); }
async function agendaCall(body){
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/agenda-tarefas', { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) });
    return await res.json();
  }catch(e){ return { error:String(e) }; }
}
function dhAv(ms){ if(!ms) return ''; const d = new Date(ms); return isNaN(d) ? '' : d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
let __ordensAv = [];
/** Todas as observações da via (a da Oficina é interna) + o recado para o cliente quando a observação pede ciência da loja. */
function obsBlocoHtml(o){
  const obs = (o.observacoes||[]).filter(x=> x && typeof x==='object').slice().sort((a,b)=> (b.criadoEm||0)-(a.criadoEm||0));
  if(!obs.length) return '';
  return `<div class="obs-av">${obs.map(ob=>{
    const of = ob.origem==='oficina';
    const txt = String(ob.descricao||'').replace(/^\[OFICINA\]\s*/,'');
    const pode = window.RecadoCliente && o.telefone && (of || (ob.notificarPara||[]).length>0);
    const podeCiente = window.RecadoCliente && RecadoCliente.cienteHtml && (of || (ob.notificarPara||[]).length>0);   // 22/11: Ciente na observação da pendência
    return `<div class="obs-av-i"><div class="obs-av-t"><b>${of?'Oficina':escapeHtml(ob.nome||'Observação')}</b> <span class="muted">${of?'· interno · ':'· '}${escapeHtml(dhAv(ob.criadoEm))}</span></div><div>${escapeHtml(txt)}</div>${podeCiente ? `<div class="rc-btns">${RecadoCliente.cienteHtml(o, ob)}</div>` : (ob.ciente?`<span class="muted">ciente ${escapeHtml(ob.cienteNome||'')}</span>`:'')}${pode ? RecadoCliente.linhaHtml(o, ob) : ''}</div>`;
  }).join('')}</div>`;
}
/** Contexto do recado para o cliente nesta tela: relê a via no servidor antes de gravar (não sobrescreve o que mudou enquanto a tela estava aberta). */
function recadoCtxAv(){
  const nomeLoja = id=>{ const l = (config.lojas||[]).find(x=>x.id===id); return l ? (l.nomeFantasia || l.nome) : ''; };
  return {
    senha: __gatewaySenha, nomeUsuario: (currentUser && (currentUser.apelido || currentUser.nome)) || '',
    achar: (oid, obid)=>{ const order = __ordensAv.find(x=>x.id===oid); const ob = order && (order.observacoes||[]).find(x=>x.id===obid); return ob ? { order, ob } : null; },
    gravar: async (oid, obid, recado)=>{
      const r = await gatewayCall({ op:'selectOne', table:'ordens_servico', params:{ column:'id', value:oid } });
      const row = r && r.data; if(!row || !row.payload) return false;
      const o = row.payload; const ob = (o.observacoes||[]).find(x=>x.id===obid); if(!ob) return false;
      if(recado) ob.recado = recado; else delete ob.recado;
      const w = await gatewayCall({ op:'upsert', table:'ordens_servico', params:{ row:{ id:oid, payload:o, updated_at:new Date().toISOString() } } });
      if(!w || w.error) return false;
      const loc = __ordensAv.find(x=>x.id===oid); const lo = loc && (loc.observacoes||[]).find(x=>x.id===obid); if(lo){ if(recado) lo.recado = recado; else delete lo.recado; }
      return true;
    },
    lojaNome: nomeLoja,
    ciente: async (oid, obid)=>{   // 22/11: relê a via no servidor e grava só o ciente desta observação
      const nome = (currentUser && (currentUser.apelido || currentUser.nome)) || '';
      const r = await gatewayCall({ op:'selectOne', table:'ordens_servico', params:{ column:'id', value:oid } });
      const row = r && r.data; if(!row || !row.payload) return false;
      const ob = (row.payload.observacoes||[]).find(x=>x.id===obid); if(!ob) return false;
      if(!ob.ciente){ ob.ciente = true; ob.cienteNome = String(nome).toUpperCase(); ob.cienteEm = Date.now(); }
      const w = await gatewayCall({ op:'upsert', table:'ordens_servico', params:{ row:{ id:oid, payload:row.payload, updated_at:new Date().toISOString() } } });
      if(!w || w.error) return false;
      const lo = __ordensAv.find(x=>x.id===oid); const lob = lo && (lo.observacoes||[]).find(x=>x.id===obid); if(lob){ lob.ciente = true; lob.cienteNome = ob.cienteNome; lob.cienteEm = ob.cienteEm; }
      return true;
    },
    statusNome: o=> ({ pendencia:'PENDÊNCIA', em_producao:'EM PRODUÇÃO', enviado_fabrica:'ENVIADO P/ FÁBRICA', oficina_pronto:'LIBERADO FÁBRICA', pronto:'DISPONÍVEL PARA RETIRADA', aguardando:'APROVADO' }[o.status] || String(o.status||'').toUpperCase()),
    aoMudar: ()=>{ render(__avisosAtuais); },
  };
}
async function lerTabela(table){
  const r = await gatewayCall({ op:'selectAll', table });
  if(!r || r.error) return null; // sem permissão / erro: a seção simplesmente não aparece
  return (r.data||[]).map(x=>x.payload).filter(Boolean);
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diasDesde(iso){ if(!iso) return null; const a=new Date(iso.slice(0,10)+'T00:00:00'); const h=new Date(todayStr()+'T00:00:00'); return Math.round((h-a)/86400000); }
function fmtDate(s){ if(!s) return '—'; const p=String(s).slice(0,10).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function plural(n, s, p){ return n+' '+(n===1?s:p); }
function nomeExibicaoFuncionario(f){ const ap=(f&&f.apelido||'').trim(); return ap || (f&&f.nome) || ''; }
function ehGestao(){ return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente'); }
/** Nomes pelos quais o usuário logado pode aparecer como "vendedora" nos registros. */
function meusNomes(){
  const out = new Set();
  if(!currentUser) return out;
  const f = (config.funcionarios||[]).find(x=>x.id===currentUser.funcionarioId);
  [currentUser.nome, f&&f.nome, f&&f.apelido].filter(Boolean).forEach(n=>out.add(String(n).trim().toLowerCase()));
  return out;
}
function nomeStatusOrc(id){
  const s = (config.statusOrcamento||[]).find(x=>x.id===id);
  return s ? (s.nome || s.label || id) : (id || '—');
}

/* ===== Cálculo dos avisos =====
 * Estrutura: modulos[] → abas[] → grupos[] → itens[]. Só entra o que tiver pendência. */
async function calcularAvisos(){
  const modulos = [];
  const hoje = todayStr();
  const souGestao = ehGestao();
  const meus = meusNomes();

  // ---------- CAIXA › Pedido/O.S. ----------
  let ordens = await lerTabela('ordens_servico');
  if(ordens){
    __ordensAv = ordens;
    // 04/11: vendedora = gerente — vê os avisos de todas as vias das lojas dela (o servidor já manda só as lojas dela)
    const vencidas = ordens.filter(o=> o.status==='aguardando' && o.data && o.data < hoje)
      .sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    const prontas = ordens.filter(o=> o.status==='pronto' && o.data && (diasDesde(o.data)||0) >= DIAS_PRONTO_SEM_RETIRADA)
      .sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    // 10/11: vias EM PENDÊNCIA (a Oficina parou por um problema): mostra em vermelho o que falta e abre a via para editar
    // 23/11: diretoria não vê pendência já com CIENTE da funcionária (segue para vendedora/gerente até o status mudar)
    const obsOficinaRecente = o=> (o.observacoes||[]).filter(x=> x && x.origem==='oficina').sort((a,b)=> (b.criadoEm||0)-(a.criadoEm||0))[0];
    const pendentes = ordens.filter(o=> o.status==='pendencia' && !(ehDiretoria() && (obsOficinaRecente(o)||{}).ciente===true))
      .sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    // 23/11: diretoria vê só as vias que ENTRARAM como abandonada (últimos 7 dias), no lugar das "prontas sem retirada"
    const abandonadas = ordens.filter(o=> o.status==='abandonada' && (Date.now() - (Number((o.abandono&&o.abandono.em)||o.statusEm)||0)) <= 7*86400000)
      .sort((a,b)=> (Number((b.abandono&&b.abandono.em)||b.statusEm)||0) - (Number((a.abandono&&a.abandono.em)||a.statusEm)||0));
    const motivoPendencia = o=>{
      const obs = (o.observacoes||[]).filter(x=> x && x.origem==='oficina').sort((a,b)=> (b.criadoEm||0)-(a.criadoEm||0))[0];
      return obs ? String(obs.descricao||'').replace(/^\[OFICINA\]\s*/,'').trim() : '';
    };
    const grupos = [];
    if(pendentes.length) grupos.push({ titulo:'Vias em pendência', tipo:'danger', itens: pendentes.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `${o.serviceTypeName||o.descricao||'Serviço'} · entrega prevista ${fmtDate(o.data)}${o.loja?' · '+o.loja:''}${o.vendedora?' · '+o.vendedora:''}`,
      falha: motivoPendencia(o) || 'Pendência sem motivo registrado — abra a via e confira a observação da Oficina.',
      tag: 'pendência', tagTipo:'danger',
      extraFn: ()=> obsBlocoHtml(o),
      verVia: true,
      abrir:{ alvo:'os', registroId:o.id },
    }))});
    if(vencidas.length) grupos.push({ titulo:'Vencidos ainda na oficina', tipo:'danger', itens: vencidas.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `${o.serviceTypeName||o.descricao||'Serviço'} · entrega prevista ${fmtDate(o.data)}${o.loja?' · '+o.loja:''}${o.vendedora?' · '+o.vendedora:''}`,
      tag: `${plural(diasDesde(o.data),'dia','dias')} de atraso`, tagTipo:'danger',
      abrir:{ alvo:'os', registroId:o.id },
    }))});
    if(ehDiretoria() && abandonadas.length) grupos.push({ titulo:'Vias que entraram como abandonada', tipo:'danger', itens: abandonadas.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `${o.serviceTypeName||o.descricao||'Serviço'} · abandonada em ${fmtDate(new Date(Number((o.abandono&&o.abandono.em)||o.statusEm)||Date.now()).toISOString())}${o.loja?' · '+o.loja:''}${o.abandono&&o.abandono.por?' · por '+o.abandono.por:''}`,
      tag: 'abandonada', tagTipo:'danger',
      abrir:{ alvo:'os', registroId:o.id },
    }))});
    if(!ehDiretoria() && prontas.length) grupos.push({ titulo:`Prontos há ${DIAS_PRONTO_SEM_RETIRADA}+ dias sem retirada`, tipo:'wait', itens: prontas.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `${o.serviceTypeName||o.descricao||'Serviço'} · previsto ${fmtDate(o.data)}${o.telefone?' · '+o.telefone:''}`,
      tag: `${plural(diasDesde(o.data),'dia','dias')}`, tagTipo:'wait',
      abrir:{ alvo:'os', registroId:o.id },
    }))});
    if(grupos.length) modulos.push({ nome:'CAIXA', icone:'dinheiro', abas:[{ nome:'Pedido', icone:'recibo', alvo:'os', grupos }] });
  }

  // ---------- CAIXA › Orçamento ----------
  const souAdm = !!(window.AvisosCore && AvisosCore.ehAdm(currentUser));   // 23/11: função ADMINISTRATIVO
  let orcs = (ehDiretoria() || souAdm) ? null : await lerTabela('orcamentos');   // 23/11: diretoria não recebe aviso de orçamento
  if(orcs){
    // 04/11: vendedora = gerente — vê os orçamentos de todas as vendedoras das lojas dela
    const abertos = orcs.filter(o=> !STATUS_ORC_FECHADOS.includes(o.status));
    const expirados = abertos.filter(o=> o.validade && o.validade < hoje);
    const parados = abertos.filter(o=> !(o.validade && o.validade < hoje) && (diasDesde(o.data||o.autoBaseData)||0) >= DIAS_ORCAMENTO_ABERTO);
    const grupos = [];
    if(expirados.length) grupos.push({ titulo:'Validade vencida, ainda em aberto', tipo:'danger', itens: expirados.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `Status: ${nomeStatusOrc(o.status)} · validade ${fmtDate(o.validade)}${o.vendedora?' · '+o.vendedora:''}`,
      tag: 'expirado', tagTipo:'danger',
      abrir:{ alvo:'orcamentos', tab:'lista' },
    }))});
    if(parados.length) grupos.push({ titulo:`Abertos há ${DIAS_ORCAMENTO_ABERTO}+ dias sem mudar de status`, tipo:'wait', itens: parados.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `Status: ${nomeStatusOrc(o.status)} · criado ${fmtDate(o.data)}${o.validade?' · vale até '+fmtDate(o.validade):''}${o.vendedora?' · '+o.vendedora:''}`,
      tag: `${plural(diasDesde(o.data||o.autoBaseData)||0,'dia','dias')}`, tagTipo:'wait',
      abrir:{ alvo:'orcamentos', tab:'followup' },
    }))});
    if(grupos.length) modulos.push({ nome:'CAIXA', icone:'dinheiro', abas:[{ nome:'Orçamento', icone:'documento', alvo:'orcamentos', grupos }] });
  }

  // ---------- CONTROLES do administrativo (23/11): fiscal, caixa e vias — regras em avisos-core.js › controlesAdm ----------
  if(souAdm){
    try{
      const lista = await AvisosCore.controlesAdm({ gatewayCall, config }, ordens || null);
      const abas = [];
      [['Fiscal','documento','vendas'],['Caixa','dinheiro','caixa'],['Vias','recibo','os']].forEach(([area, icone, alvo])=>{
        const daArea = lista.filter(a=>a.area===area); if(!daArea.length) return;
        const grupos = [];
        daArea.forEach(a=>{
          let g = grupos.find(x=>x.titulo===a.grupo); if(!g){ g = { titulo:a.grupo, tipo:a.nivel==='danger'?'danger':'wait', itens:[] }; grupos.push(g); }
          g.itens.push({ titulo:a.titulo, sub:a.sub, tag:a.tag, tagTipo:a.nivel==='danger'?'danger':'wait', abrir:a.abrir });
        });
        abas.push({ nome:area, icone, alvo, grupos });
      });
      if(abas.length) modulos.push({ nome:'CONTROLES', icone:'cadeado', abas });
    }catch(e){ console.error(e); }
  }

  // ---------- ADMINISTRAÇÃO › Departamento Pessoal ----------
  const fichas = await lerTabela('dp_funcionarios');
  if(fichas){
    const grupos = [];
    const incompletas = [];
    fichas.filter(f=> (f.status||'ativo')!=='desligado').forEach(f=>{
      const faltam = CAMPOS_FICHA_OBRIGATORIOS.filter(([k])=> !String(f[k]||'').trim()).map(([,label])=>label);
      const temPix = !!String(f.chavePix||'').trim();
      const temConta = !!(String(f.banco||'').trim() && String(f.agencia||'').trim() && String(f.conta||'').trim());
      if(!temPix && !temConta) faltam.push('Dados bancários ou chave Pix');
      if(faltam.length) incompletas.push({ f, faltam });
    });
    // Funcionários cadastrados (com acesso) que ainda não têm ficha de RH
    const semFicha = souGestao ? (config.funcionarios||[]).filter(fc=> !fichas.some(f=> f.funcionarioId===fc.id || (f.nome||'').trim().toLowerCase()===(fc.nome||'').trim().toLowerCase())) : [];
    if(incompletas.length) grupos.push({ titulo:'Fichas incompletas', tipo:'wait', itens: incompletas.map(({f,faltam})=>({
      titulo: nomeExibicaoFuncionario(f) || f.nome || 'Sem nome',
      sub: `Faltam: ${faltam.join(', ')}`,
      tag: plural(faltam.length,'campo','campos'), tagTipo:'wait',
      abrir:{ alvo:'dp', tab:'funcionarios' },
    }))});
    if(semFicha.length) grupos.push({ titulo:'Sem ficha de RH', tipo:'danger', itens: semFicha.map(fc=>({
      titulo: nomeExibicaoFuncionario(fc) || fc.nome,
      sub: 'Cadastrado no sistema, mas sem dados pessoais/profissionais/bancários preenchidos',
      tag: 'sem ficha', tagTipo:'danger',
      abrir:{ alvo:'dp', tab:'funcionarios' },
    }))});

    // ---- Período de experiência (90 dias): só para Gerentes e Diretoria ----
    if(souGestao){
      const MARCOS_EXPERIENCIA = [80, 70, 60, 50, 40, 30, 20, 10]; // avisos de 10 em 10 dias
      const emExperiencia = fichas.filter(f=>{
        if((f.status||'ativo')==='desligado' || !f.dataAdmissao) return false;
        const dias = diasDesde(f.dataAdmissao);
        return dias !== null && dias >= 0 && dias < 90;
      }).map(f=>{
        const dias = diasDesde(f.dataAdmissao);
        const restam = 90 - dias;
        // Verificar se está próximo a um marco de aviso (dentro de ±1 dia do múltiplo de 10)
        const marcoPerto = MARCOS_EXPERIENCIA.some(m=> restam <= m && restam > m - 2);
        return { f, restam, marcoPerto };
      });

      const urgentes = emExperiencia.filter(x=> x.restam <= 10);
      const marcos   = emExperiencia.filter(x=> !x.urgentes && x.marcoPerto && x.restam > 10);
      const demais   = emExperiencia.filter(x=> x.restam > 10 && !x.marcoPerto);

      if(urgentes.length) grupos.push({ titulo:'Experiência vencendo em até 10 dias', tipo:'danger', itens: urgentes.map(({f,restam})=>({
        titulo: f.nome || nomeExibicaoFuncionario(f),
        sub: `Admissão: ${fmtDate(f.dataAdmissao)} · Loja: ${f.loja||'—'}`,
        tag: `${plural(restam,'dia restante','dias restantes')}`, tagTipo:'danger',
        abrir:{ alvo:'dp', tab:'funcionarios' },
      }))});
      if(marcos.length) grupos.push({ titulo:'Marcas de 10 dias no período de experiência', tipo:'wait', itens: marcos.map(({f,restam})=>({
        titulo: f.nome || nomeExibicaoFuncionario(f),
        sub: `Admissão: ${fmtDate(f.dataAdmissao)} · Loja: ${f.loja||'—'}`,
        tag: `${plural(restam,'dia restante','dias restantes')}`, tagTipo:'wait',
        abrir:{ alvo:'dp', tab:'funcionarios' },
      }))});
      if(demais.length) grupos.push({ titulo:'Em período de experiência', tipo:'info', itens: demais.map(({f,restam})=>({
        titulo: f.nome || nomeExibicaoFuncionario(f),
        sub: `Admissão: ${fmtDate(f.dataAdmissao)} · Loja: ${f.loja||'—'}`,
        tag: `${plural(restam,'dia restante','dias restantes')}`, tagTipo:'info',
        abrir:{ alvo:'dp', tab:'funcionarios' },
      }))});
    }

    if(grupos.length) modulos.push({ nome:'CONFIGURAÇÕES', icone:'engrenagem', abas:[{ nome:'Departamento pessoal', icone:'usuarios', alvo:'dp', grupos }] });
  }

  // ---------- AGENDA (18/11): compartilhamento recebido (24 h, com Ciente), tarefa de amanhã, de hoje e atrasadas ----------
  try{
    const ag = await agendaCall({ op:'avisos' });
    if(ag && ag.ok && Array.isArray(ag.avisos) && ag.avisos.length){
      const quando = a=> a.data ? `${fmtDate(a.data)}${a.hora?' às '+a.hora:''}` : 'sem data';
      const item = (a, tag, tagTipo, subExtra)=>({
        titulo: a.titulo, sub: `${subExtra||''}${subExtra?' · ':''}${a.tipo==='compartilhada'?'compartilhada':a.tipo==='loja'?'da loja':'sua'} · ${quando(a)}`, tag, tagTipo,
        abrir:{ alvo:'agenda' }, ciente: a.kind==='compartilhada' ? { agenda:a.id } : null,
      });
      const grupos = [];
      const comp = ag.avisos.filter(a=>a.kind==='compartilhada'), atras = ag.avisos.filter(a=>a.kind==='atrasada'), hojeA = ag.avisos.filter(a=>a.kind==='hoje'), amanhaA = ag.avisos.filter(a=>a.kind==='amanha');
      if(comp.length) grupos.push({ titulo:'Você recebeu um compartilhamento de agenda', tipo:'wait', itens: comp.map(a=> item(a, 'novo compartilhamento', 'wait', `${a.de||'Alguém'} compartilhou com você`)) });
      if(atras.length) grupos.push({ titulo:'Tarefas da agenda atrasadas', tipo:'danger', itens: atras.map(a=> item(a, plural(diasDesde(a.data)||0,'dia','dias')+' de atraso', 'danger')) });
      if(hojeA.length) grupos.push({ titulo:'Tarefas da agenda para hoje', tipo:'wait', itens: hojeA.map(a=> item(a, 'hoje', 'wait')) });
      if(amanhaA.length) grupos.push({ titulo:'Tarefas da agenda para amanhã', tipo:'info', itens: amanhaA.map(a=> item(a, 'amanhã', 'info')) });
      if(grupos.length) modulos.push({ nome:'AGENDA', icone:'calendario', abas:[{ nome:'Agenda', icone:'calendario', alvo:'agenda', grupos }] });
    }
  }catch(e){ console.error('avisos da agenda', e); }

  // Junta abas do mesmo módulo (CAIXA aparece uma vez com Pedido e Orçamento dentro)
  const porModulo = [];
  modulos.forEach(m=>{
    const ja = porModulo.find(x=>x.nome===m.nome);
    if(ja) ja.abas.push(...m.abas); else porModulo.push({ nome:m.nome, icone:m.icone, abas:[...m.abas] });
  });
  return porModulo;
}

function contarItens(modulo){ return modulo.abas.reduce((a,aba)=> a + aba.grupos.reduce((b,g)=> b + g.itens.length, 0), 0); }

/* ===== Render ===== */
const AVISOS_POR_GRUPO = 6; // mostra os primeiros; o resto abre em "Mostrar mais"
let __avisosAtuais = [];
function ico(nome, o){ return window.Icone ? Icone(nome, o) : ''; }
function cap(s){ s = String(s||''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function contarAba(aba){ return aba.grupos.reduce((b,g)=> b + g.itens.length, 0); }
function contarPerigoAba(aba){ return aba.grupos.reduce((b,g)=> b + g.itens.filter(it=> (it.tagTipo||g.tipo)==='danger').length, 0); }
function rotuloPerigo(aba){
  if(aba.alvo==='os') return 'com atraso';
  if(aba.alvo==='orcamentos') return 'vencidos';
  if(aba.alvo==='agenda') return 'atrasadas';
  return 'urgentes';
}
function htmlItem(it, aba, escondido){
  const tipo = it.tagTipo || 'wait';
  const icoTag = tipo==='danger' ? ico('alerta') : (tipo==='wait' ? ico('relogio') : '');
  return `<div class="item"${escondido?' hidden':''} data-abrir='${escapeHtml(JSON.stringify(it.abrir||{alvo:aba.alvo}))}'>
      <div class="txt"><b>${escapeHtml(it.titulo)}</b><span class="sub">${escapeHtml(it.sub||'')}</span>${it.falha?`<span class="sub falha">${ico('alerta')} ${escapeHtml(it.falha)}</span>`:''}${it.extraFn?it.extraFn():''}${it.ciente?`<button type="button" class="btn btn-sm item-ciente" data-agciente="${escapeHtml(it.ciente.agenda)}">${ico('check',{tam:14})} Ciente</button>`:''}</div>
      ${it.tag ? `<span class="tag tag-${tipo}">${icoTag}${escapeHtml(cap(it.tag))}</span>` : '<span></span>'}
      <button class="btn btn-sm item-ver" type="button" aria-label="Abrir ${escapeHtml(it.titulo)}"><span class="ver-txt">${it.verVia?'Ver via':'Ver'}</span>${ico('direita')}</button>
    </div>`;
}
function renderEsqueleto(){
  const cont = document.getElementById('conteudo');
  const linha = `<div class="esq-linha"><span class="esq" style="width:42%"></span><span class="esq" style="width:68%"></span></div>`;
  cont.innerHTML = `<div class="aba" aria-hidden="true"><div class="aba-head"><span class="esq" style="width:140px;height:16px"></span></div>${linha}${linha}${linha}</div>`;
}
function irParaAba(id){
  const el = document.getElementById(id);
  if(!el) return;
  const suave = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  el.scrollIntoView({ behavior: suave ? 'smooth' : 'auto', block:'start' });
  el.classList.add('destaque');
  setTimeout(()=> el.classList.remove('destaque'), 1400);
}
function render(modulos){
  __avisosAtuais = modulos;
  const total = modulos.reduce((a,m)=> a+contarItens(m), 0);
  const sub = document.getElementById('subtitulo');
  const resumo = document.getElementById('resumo');
  const cont = document.getElementById('conteudo');
  const quem = ehGestao() ? 'de todas as lojas' : 'das suas lojas e dos seus registros';
  const perigoTotal = modulos.reduce((a,m)=> a + m.abas.reduce((b,aba)=> b + contarPerigoAba(aba), 0), 0);
  sub.textContent = total
    ? `${plural(total,'pendência','pendências')} ${quem}${perigoTotal ? ` · ${perigoTotal} ${perigoTotal===1?'pede':'pedem'} ação já` : ''}.`
    : `Nenhuma pendência ${quem}.`;
  if(!total){
    resumo.innerHTML = '';
    cont.innerHTML = `<div class="estado estado-ok">
      <span class="estado-ico">${ico('check',{tam:28})}</span>
      <h2>Nada pendente</h2>
      <p>Tudo em dia por aqui. Quando um pedido atrasar, um orçamento vencer ou uma ficha ficar incompleta, o aviso aparece nesta tela.</p>
    </div>`;
    return;
  }
  // Atalhos do topo: uma entrada por área (Pedido, Orçamento, Departamento pessoal)
  const atalhos = [];
  modulos.forEach((m,mi)=> m.abas.forEach((aba,ai)=>{
    const n = contarAba(aba), perigo = contarPerigoAba(aba);
    atalhos.push(`<button type="button" class="resumo-item${perigo?' tem-perigo':''}" data-ir="aba-${mi}-${ai}" title="Ir para ${escapeHtml(aba.nome)}">
        <span class="resumo-ico">${ico(aba.icone||'sino',{tam:18})}</span>
        <span class="resumo-txt"><span class="resumo-nome">${escapeHtml(aba.nome)}</span>
          <span class="resumo-det${perigo?' perigo':''}">${perigo ? `${perigo} ${rotuloPerigo(aba)}` : 'Para acompanhar'}</span></span>
        <span class="resumo-num">${n}</span>
      </button>`);
  }));
  resumo.innerHTML = atalhos.join('');
  resumo.querySelectorAll('[data-ir]').forEach(b=> b.addEventListener('click', ()=> irParaAba(b.dataset.ir)));

  cont.innerHTML = modulos.map((m,mi)=>`
    <section class="modulo" aria-label="${escapeHtml(m.nome)}">
      <div class="modulo-head"><h2>${escapeHtml(m.nome)}</h2><span class="cnt">${contarItens(m)}</span></div>
      ${m.abas.map((aba,ai)=>`
        <div class="aba" id="aba-${mi}-${ai}">
          <div class="aba-head">
            <h3>${ico(aba.icone||'sino',{tam:18})}${escapeHtml(aba.nome)} <span class="cnt">${contarAba(aba)}</span></h3>
            <button class="btn btn-sm" type="button" data-abrir='${escapeHtml(JSON.stringify({alvo:aba.alvo}))}'>Abrir<span class="rot-longo">${escapeHtml(aba.nome)}</span>${ico('direita')}</button>
          </div>
          ${aba.grupos.map(g=>{
            const resto = g.itens.length - AVISOS_POR_GRUPO;
            return `
            <div class="grupo">
              <div class="grupo-title"><span class="dot dot-${g.tipo}"></span>${escapeHtml(g.titulo)} <span class="n">(${g.itens.length})</span></div>
              ${g.itens.map((it,ii)=> htmlItem(it, aba, ii >= AVISOS_POR_GRUPO)).join('')}
              ${resto > 0 ? `<button type="button" class="mais" data-mais>Mostrar mais ${resto} ${ico('baixo')}</button>` : ''}
            </div>`; }).join('')}
        </div>`).join('')}
    </section>`).join('');
  cont.querySelectorAll('[data-abrir]').forEach(b=> b.addEventListener('click', ()=>{
    let alvo = {};
    try{ alvo = JSON.parse(b.dataset.abrir); }catch(e){}
    if(EMBEDDED) parent.postMessage({ type:'irParaModulo', modulo:'avisos', ...alvo }, '*');
  }));
  if(window.RecadoCliente) RecadoCliente.ligar(cont, recadoCtxAv());
  cont.querySelectorAll('[data-agciente]').forEach(b=> b.addEventListener('click', async e=>{
    e.stopPropagation(); b.disabled = true;
    const r = await agendaCall({ op:'agendaCiente', id:b.dataset.agciente });
    if(!r || !r.ok){ b.disabled = false; showToast((r && r.error) || 'Não foi possível dar o ciente. Tente de novo.'); return; }
    showToast('Ciente registrado.'); carregar();
  }));
  cont.querySelectorAll('[data-mais]').forEach(b=> b.addEventListener('click', ()=>{
    const grupo = b.closest('.grupo');
    grupo.querySelectorAll('.item[hidden]').forEach(it=> it.hidden = false);
    b.remove();
  }));
}

async function carregar(){
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true; btn.setAttribute('aria-busy','true');
  const rot = btn.querySelector('.rot'); if(rot) rot.textContent = 'Atualizando…';
  try{
    const modulos = await calcularAvisos();
    render(modulos);
    const total = modulos.reduce((a,m)=> a+contarItens(m), 0);
    if(EMBEDDED) parent.postMessage({ type:'avisosTotal', modulo:'avisos', total }, '*');
  }catch(e){
    console.error(e);
    document.getElementById('subtitulo').textContent = 'Os avisos não carregaram.';
    document.getElementById('resumo').innerHTML = '';
    document.getElementById('conteudo').innerHTML = `<div class="estado estado-erro">
      <span class="estado-ico">${ico('alerta',{tam:26})}</span>
      <h2>Não foi possível carregar os avisos</h2>
      <p>Confira a internet da loja e tente de novo. Se continuar, saia e entre de novo no sistema.</p>
      <button type="button" class="btn" id="btnTentarDeNovo">${ico('atualizar')} Tentar de novo</button>
    </div>`;
    const t = document.getElementById('btnTentarDeNovo'); if(t) t.addEventListener('click', carregar);
  }finally{
    btn.disabled = false; btn.removeAttribute('aria-busy');
    const rot2 = btn.querySelector('.rot'); if(rot2) rot2.textContent = 'Atualizar';
  }
}

/* ===== Init ===== */
window.addEventListener('message', async ev=>{
  const d = ev.data || {};
  if(d.type==='auth'){
    currentUser = d.user;
    __gatewaySenha = currentUser ? currentUser.senha : null;
    config = d.configCache || {};
    if(!config.funcionarios){
      const r = await gatewayCall({ op:'getConfig' });
      if(r && r.data) config = r.data;
    }
    if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'avisos', tabs: abasDoModulo(), active: abaAtual }, '*');
    carregarAvaliacoes();
    await carregar();
  } else if(d.type==='gotoTab'){
    abaAtual = (d.tabId === 'vilacinha' && ehDiretoria()) ? 'vilacinha' : 'pendencias';
    if(abaAtual === 'vilacinha') renderVilacinha();
    else { document.getElementById('subtitulo').textContent = 'Procurando pendências…'; carregarAvaliacoes(); carregar(); }
  } else if(d.type==='recarregarAvisos'){
    if(__gatewaySenha && abaAtual === 'pendencias') carregar();
  }
});
/* Avaliações dos clientes (09/11): gerente/diretoria veem aviso de nota baixa; o atendente vê só a própria média. */
async function carregarAvaliacoes(){
  const box = document.getElementById('avaliacoesBox'); if(!box || !window.AvaliacoesUI || !__gatewaySenha) return;
  const nivel = currentUser && currentUser.nivel;
  if(nivel==='diretoria' || nivel==='gerente'){
    const n = await AvaliacoesUI.contarBaixas(__gatewaySenha);
    if(!n){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="aviso aviso-perigo" role="alert" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid var(--t-danger,#b3261e);background:var(--t-danger-soft,#fdecea);"><span><b>${n===1?'1 avaliação de cliente com 3 estrelas ou menos':n+' avaliações de clientes com 3 estrelas ou menos'}</b> — leia e responda.</span><button type="button" class="btn btn-sm" id="btnVerBaixas">Ver avaliações</button></div>`;
    document.getElementById('btnVerBaixas').addEventListener('click', ()=> AvaliacoesUI.abrirBaixas({ senha:__gatewaySenha, lojaNome:id=>{ const l=(config.lojas||[]).find(x=>x.id===id); return l ? (l.abreviacao||l.nome) : id; }, aoFechar:carregarAvaliacoes }));
  } else {
    const r = await fetch((window.SUPABASE_URL||'')+'/functions/v1/retirada-terceiro',{ method:'POST', headers:{'Content-Type':'application/json',apikey:window.SUPABASE_ANON_KEY,Authorization:'Bearer '+window.SUPABASE_ANON_KEY}, body:JSON.stringify({acao:'avaliacoesMedias',senha:__gatewaySenha}) }).then(x=>x.json()).catch(()=>null);
    const m = r && r.medias && r.medias[0];
    box.innerHTML = m ? `<div style="padding:12px 14px;border-radius:12px;border:1px solid var(--t-line,#dde);background:var(--t-surface,#fff);">Sua pontuação média nas avaliações dos clientes: ${AvaliacoesUI.estrelas(Math.round(m.media))} <b>${String(m.media).replace('.',',')}</b> (${m.total} avaliações)</div>` : '';
  }
}
document.getElementById('btnAtualizar').addEventListener('click', ()=>{ if(abaAtual==='vilacinha') return renderVilacinha(); carregarAvaliacoes(); carregar(); });
renderEsqueleto();
window.addEventListener('load', ()=>{ if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'avisos' }, '*'); });

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
