<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisos — Gestão e Controle</title>
<style>
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#F1F4F7;
  --ink:#1A1D24;--ink-soft:#4B5566;--ink-faint:#7C8592;
  --line:#E1E5EA;--accent:#662344;--accent-soft:#F3E6D8;
  --ok:#17794A;--ok-soft:#E3F5EA;
  --danger:#B91C1C;--danger-soft:#FBEAEA;
  --wait:#B45309;--wait-soft:#FCEEDC;
  --gold-ink:#4A1830;--gold-soft:#F3E6D8;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
.wrap{padding:18px 16px 40px;max-width:1000px;margin:0 auto;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid var(--line);}
.page-title{font-size:22px;font-weight:700;margin:0 0 3px;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;}
.btn:hover{border-color:var(--accent);}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.muted{color:var(--ink-faint);}
.empty{padding:48px 20px;text-align:center;color:var(--ink-faint);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);}
.empty b{display:block;font-size:20px;color:var(--ok);margin-bottom:6px;}
.resumo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.pill b{color:var(--danger);}
.modulo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.modulo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--accent);color:#fff;}
.modulo-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.modulo-head .cnt{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;}
.aba{border-top:1px solid var(--line);}
.aba-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--surface-2);}
.aba-head h3{margin:0;font-size:13.5px;font-weight:700;color:var(--gold-ink);}
.grupo{padding:10px 16px 4px;}
.grupo-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:6px 0 8px;display:flex;align-items:center;gap:8px;}
.grupo-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-danger{background:var(--danger);} .dot-wait{background:var(--wait);}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item .txt{flex:1;min-width:0;font-size:13.5px;}
.item .txt b{font-weight:700;}
.item .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;}
.item .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.tag-danger{background:var(--danger-soft);color:var(--danger);} .tag-wait{background:var(--wait-soft);color:var(--wait);}
.item .btn{white-space:nowrap;}
@media(max-width:560px){ .item{flex-wrap:wrap;} .item .btn{width:100%;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div>
      <h1 class="page-title">🔔 Avisos</h1>
      <p class="page-sub" id="subtitulo">Carregando pendências…</p>
    </div>
    <button class="btn" id="btnAtualizar">↻ Atualizar</button>
  </div>
  <div class="resumo" id="resumo"></div>
  <div id="conteudo"><p class="muted">Só um instante…</p></div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
const EMBEDDED = window.parent !== window;

let __gatewaySenha = null;
let currentUser = null;
let config = {};

/* ===== Regras (dias) ===== */
const DIAS_ORCAMENTO_ABERTO = 5;   // orçamento aberto há X dias sem mudar de status
const DIAS_PRONTO_SEM_RETIRADA = 7; // O.S. pronta e não retirada há X dias
const STATUS_ORC_FECHADOS = ['aprovado', 'recusado'];
const CAMPOS_FICHA_OBRIGATORIOS = [
  ['cpf','CPF'], ['rg','RG'], ['dataNascimento','Data de nascimento'], ['celularParticular','Celular'],
  ['endereco','Endereço'], ['numero','Número'], ['bairro','Bairro'], ['cidade','Cidade'], ['estado','Estado'], ['cep','CEP'],
  ['dataAdmissao','Data de admissão'], ['contatoEmergenciaNome','Contato de emergência'], ['contatoEmergenciaTelefone','Telefone de emergência'],
];

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){ return { error:String(e) }; }
}
async function lerTabela(table){
  const r = await gatewayCall({ op:'selectAll', table });
  if(!r || r.error) return null; // sem permissão / erro: a seção simplesmente não aparece
  return (r.data||[]).map(x=>x.payload).filter(Boolean);
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diasDesde(iso){ if(!iso) return null; const a=new Date(iso.slice(0,10)+'T00:00:00'); const h=new Date(todayStr()+'T00:00:00'); return Math.round((h-a)/86400000); }
function fmtDate(s){ if(!s) return '—'; const p=String(s).slice(0,10).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function plural(n, s, p){ return n+' '+(n===1?s:p); }
function nomeExibicaoFuncionario(f){ const ap=(f&&f.apelido||'').trim(); return ap || (f&&f.nome) || ''; }
function ehGestao(){ return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente'); }
/** Nomes pelos quais o usuário logado pode aparecer como "vendedora" nos registros. */
function meusNomes(){
  const out = new Set();
  if(!currentUser) return out;
  const f = (config.funcionarios||[]).find(x=>x.id===currentUser.funcionarioId);
  [currentUser.nome, f&&f.nome, f&&f.apelido].filter(Boolean).forEach(n=>out.add(String(n).trim().toLowerCase()));
  return out;
}
function nomeStatusOrc(id){
  const s = (config.statusOrcamento||[]).find(x=>x.id===id);
  return s ? (s.nome || s.label || id) : (id || '—');
}

/* ===== Cálculo dos avisos =====
 * Estrutura: modulos[] → abas[] → grupos[] → itens[]. Só entra o que tiver pendência. */
async function calcularAvisos(){
  const modulos = [];
  const hoje = todayStr();
  const souGestao = ehGestao();
  const meus = meusNomes();

  // ---------- CUPOM › Pedido/O.S. ----------
  let ordens = await lerTabela('ordens_servico');
  if(ordens){
    if(!souGestao && currentUser.nivel==='vendedora'){
      ordens = ordens.filter(o=> meus.has(String(o.vendedora||'').trim().toLowerCase()));
    }
    const vencidas = ordens.filter(o=> o.status==='aguardando' && o.data && o.data < hoje)
      .sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    const prontas = ordens.filter(o=> o.status==='pronto' && o.data && (diasDesde(o.data)||0) >= DIAS_PRONTO_SEM_RETIRADA)
      .sort((a,b)=> (a.data||'').localeCompare(b.data||''));
    const grupos = [];
    if(vencidas.length) grupos.push({ titulo:'Vencidos ainda na oficina', tipo:'danger', itens: vencidas.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `${o.serviceTypeName||o.descricao||'Serviço'} · entrega prevista ${fmtDate(o.data)}${o.loja?' · '+o.loja:''}${o.vendedora?' · '+o.vendedora:''}`,
      tag: `${plural(diasDesde(o.data),'dia','dias')} de atraso`, tagTipo:'danger',
      abrir:{ alvo:'os', registroId:o.id },
    }))});
    if(prontas.length) grupos.push({ titulo:`Prontos há ${DIAS_PRONTO_SEM_RETIRADA}+ dias sem retirada`, tipo:'wait', itens: prontas.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `${o.serviceTypeName||o.descricao||'Serviço'} · previsto ${fmtDate(o.data)}${o.telefone?' · '+o.telefone:''}`,
      tag: `${plural(diasDesde(o.data),'dia','dias')}`, tagTipo:'wait',
      abrir:{ alvo:'os', registroId:o.id },
    }))});
    if(grupos.length) modulos.push({ nome:'CUPOM', icone:'🛒', abas:[{ nome:'Pedido / O.S.', icone:'🧾', alvo:'os', grupos }] });
  }

  // ---------- CUPOM › Orçamento ----------
  let orcs = await lerTabela('orcamentos');
  if(orcs){
    if(!souGestao && currentUser.nivel==='vendedora'){
      orcs = orcs.filter(o=> meus.has(String(o.vendedora||'').trim().toLowerCase()));
    }
    const abertos = orcs.filter(o=> !STATUS_ORC_FECHADOS.includes(o.status));
    const expirados = abertos.filter(o=> o.validade && o.validade < hoje);
    const parados = abertos.filter(o=> !(o.validade && o.validade < hoje) && (diasDesde(o.data||o.autoBaseData)||0) >= DIAS_ORCAMENTO_ABERTO);
    const grupos = [];
    if(expirados.length) grupos.push({ titulo:'Validade vencida, ainda em aberto', tipo:'danger', itens: expirados.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `Status: ${nomeStatusOrc(o.status)} · validade ${fmtDate(o.validade)}${o.vendedora?' · '+o.vendedora:''}`,
      tag: 'expirado', tagTipo:'danger',
      abrir:{ alvo:'orcamentos', tab:'lista' },
    }))});
    if(parados.length) grupos.push({ titulo:`Abertos há ${DIAS_ORCAMENTO_ABERTO}+ dias sem mudar de status`, tipo:'wait', itens: parados.map(o=>({
      titulo: `${o.codigoVia ? o.codigoVia+' — ' : ''}${o.cliente||'Sem cliente'}`,
      sub: `Status: ${nomeStatusOrc(o.status)} · criado ${fmtDate(o.data)}${o.validade?' · vale até '+fmtDate(o.validade):''}${o.vendedora?' · '+o.vendedora:''}`,
      tag: `${plural(diasDesde(o.data||o.autoBaseData)||0,'dia','dias')}`, tagTipo:'wait',
      abrir:{ alvo:'orcamentos', tab:'lista' },
    }))});
    if(grupos.length) modulos.push({ nome:'CUPOM', icone:'🛒', abas:[{ nome:'Orçamento', icone:'📝', alvo:'orcamentos', grupos }] });
  }

  // ---------- ADMINISTRAÇÃO › Departamento Pessoal ----------
  const fichas = await lerTabela('dp_funcionarios');
  if(fichas){
    const grupos = [];
    const incompletas = [];
    fichas.filter(f=> (f.status||'ativo')!=='desligado').forEach(f=>{
      const faltam = CAMPOS_FICHA_OBRIGATORIOS.filter(([k])=> !String(f[k]||'').trim()).map(([,label])=>label);
      const temPix = !!String(f.chavePix||'').trim();
      const temConta = !!(String(f.banco||'').trim() && String(f.agencia||'').trim() && String(f.conta||'').trim());
      if(!temPix && !temConta) faltam.push('Dados bancários ou chave Pix');
      if(faltam.length) incompletas.push({ f, faltam });
    });
    // Funcionários cadastrados (com acesso) que ainda não têm ficha de RH
    const semFicha = souGestao ? (config.funcionarios||[]).filter(fc=> !fichas.some(f=> f.funcionarioId===fc.id || (f.nome||'').trim().toLowerCase()===(fc.nome||'').trim().toLowerCase())) : [];
    if(incompletas.length) grupos.push({ titulo:'Fichas incompletas', tipo:'wait', itens: incompletas.map(({f,faltam})=>({
      titulo: nomeExibicaoFuncionario(f) || f.nome || 'Sem nome',
      sub: `Faltam: ${faltam.join(', ')}`,
      tag: plural(faltam.length,'campo','campos'), tagTipo:'wait',
      abrir:{ alvo:'dp', tab:'funcionarios' },
    }))});
    if(semFicha.length) grupos.push({ titulo:'Sem ficha de RH', tipo:'danger', itens: semFicha.map(fc=>({
      titulo: nomeExibicaoFuncionario(fc) || fc.nome,
      sub: 'Cadastrado no sistema, mas sem dados pessoais/profissionais/bancários preenchidos',
      tag: 'sem ficha', tagTipo:'danger',
      abrir:{ alvo:'dp', tab:'funcionarios' },
    }))});
    if(grupos.length) modulos.push({ nome:'Administração', icone:'⚙️', abas:[{ nome:'Departamento Pessoal', icone:'👤', alvo:'dp', grupos }] });
  }

  // Junta abas do mesmo módulo (CUPOM aparece uma vez com O.S. e Orçamento dentro)
  const porModulo = [];
  modulos.forEach(m=>{
    const ja = porModulo.find(x=>x.nome===m.nome);
    if(ja) ja.abas.push(...m.abas); else porModulo.push({ nome:m.nome, icone:m.icone, abas:[...m.abas] });
  });
  return porModulo;
}

function contarItens(modulo){ return modulo.abas.reduce((a,aba)=> a + aba.grupos.reduce((b,g)=> b + g.itens.length, 0), 0); }

/* ===== Render ===== */
let __avisosAtuais = [];
function render(modulos){
  __avisosAtuais = modulos;
  const total = modulos.reduce((a,m)=> a+contarItens(m), 0);
  const sub = document.getElementById('subtitulo');
  const resumo = document.getElementById('resumo');
  const cont = document.getElementById('conteudo');
  const quem = ehGestao() ? 'de todas as lojas' : 'das suas lojas e dos seus registros';
  sub.textContent = total ? `${plural(total,'pendência','pendências')} ${quem}. Só aparecem os módulos e abas que têm algo a resolver.` : `Nenhuma pendência ${quem}.`;
  resumo.innerHTML = modulos.map(m=>`<span class="pill">${m.icone} ${escapeHtml(m.nome)}: <b>${contarItens(m)}</b></span>`).join('');
  if(!total){
    cont.innerHTML = `<div class="empty"><b>✓ Tudo em dia</b>Nenhum aviso pendente pra você agora.</div>`;
    return;
  }
  cont.innerHTML = modulos.map(m=>`
    <section class="modulo">
      <div class="modulo-head"><h2>${m.icone} ${escapeHtml(m.nome)}</h2><span class="cnt">${contarItens(m)}</span></div>
      ${m.abas.map(aba=>`
        <div class="aba">
          <div class="aba-head">
            <h3>${aba.icone} ${escapeHtml(aba.nome)}</h3>
            <button class="btn" data-abrir='${escapeHtml(JSON.stringify({alvo:aba.alvo}))}'>Abrir ${escapeHtml(aba.nome)} →</button>
          </div>
          ${aba.grupos.map(g=>`
            <div class="grupo">
              <div class="grupo-title"><span class="dot dot-${g.tipo}"></span>${escapeHtml(g.titulo)} (${g.itens.length})</div>
              ${g.itens.map(it=>`
                <div class="item">
                  <div class="txt"><b>${escapeHtml(it.titulo)}</b><span class="sub">${escapeHtml(it.sub||'')}</span></div>
                  ${it.tag ? `<span class="tag tag-${it.tagTipo||'wait'}">${escapeHtml(it.tag)}</span>` : ''}
                  <button class="btn btn-accent" data-abrir='${escapeHtml(JSON.stringify(it.abrir||{alvo:aba.alvo}))}'>Ver</button>
                </div>`).join('')}
            </div>`).join('')}
        </div>`).join('')}
    </section>`).join('');
  cont.querySelectorAll('[data-abrir]').forEach(b=> b.addEventListener('click', ()=>{
    let alvo = {};
    try{ alvo = JSON.parse(b.dataset.abrir); }catch(e){}
    if(EMBEDDED) parent.postMessage({ type:'irParaModulo', modulo:'avisos', ...alvo }, '*');
  }));
}

async function carregar(){
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true; btn.textContent = 'Atualizando…';
  try{
    const modulos = await calcularAvisos();
    render(modulos);
    const total = modulos.reduce((a,m)=> a+contarItens(m), 0);
    if(EMBEDDED) parent.postMessage({ type:'avisosTotal', modulo:'avisos', total }, '*');
  }catch(e){
    console.error(e);
    document.getElementById('conteudo').innerHTML = `<div class="empty">Não foi possível carregar os avisos agora. Tente atualizar.</div>`;
  }finally{
    btn.disabled = false; btn.textContent = '↻ Atualizar';
  }
}

/* ===== Init ===== */
window.addEventListener('message', async ev=>{
  const d = ev.data || {};
  if(d.type==='auth'){
    currentUser = d.user;
    __gatewaySenha = currentUser ? currentUser.senha : null;
    config = d.configCache || {};
    if(!config.funcionarios){
      const r = await gatewayCall({ op:'getConfig' });
      if(r && r.data) config = r.data;
    }
    if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'avisos', tabs:[], active:null }, '*');
    await carregar();
  } else if(d.type==='recarregarAvisos'){
    if(__gatewaySenha) carregar();
  }
});
document.getElementById('btnAtualizar').addEventListener('click', carregar);
window.addEventListener('load', ()=>{ if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'avisos' }, '*'); });
</script>
</body>
</html>
