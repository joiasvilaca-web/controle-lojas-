<body>
<a class="pular" href="#conteudo">Ir para o conteúdo</a>

<div class="faixa" id="faixa" aria-live="polite"></div>

<header class="topo">
  <div class="topo-linha">
    <button class="icone menu-btn" id="btnMenu" aria-label="Abrir menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
    </button>
    <a href="/" class="marca" data-link aria-label="Vilaça Joias, página inicial">
      <span class="marca-nome">VILAÇA</span>
      <span class="marca-sub">Joias · Juiz de Fora</span>
    </a>
    <div class="topo-acoes">
      <button class="icone" id="btnBusca" aria-label="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <button class="icone sacola-btn" id="btnSacola" aria-label="Abrir sacola">

    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Categorias"></nav>
  <form class="busca" id="formBusca" role="search" hidden>
    <label class="sr" for="campoBusca">Buscar joias</label>
    <input id="campoBusca" type="search" placeholder="Buscar anel, cordão, nome do modelo…" autocomplete="off">

<main id="conteudo" tabindex="-1"></main>

<footer class="rodape" id="rodape"></footer>

<aside class="gaveta" id="gaveta" aria-label="Sacola de compras" hidden>
  <div class="gaveta-fundo" data-fechar></div>
  <div class="gaveta-painel" role="dialog" aria-modal="true" aria-labelledby="tituloSacola">
    <div class="gaveta-topo">
      <h2 id="tituloSacola">Sua sacola</h2>
      <button class="icone" data-fechar aria-label="Fechar sacola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="gaveta-corpo" id="sacolaCorpo"></div>
  </div>
</aside>

<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

<script src="/assets/app.js" defer></script>
<script src="/assets/vitrine.js" defer></script>
