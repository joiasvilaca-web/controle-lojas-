<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhar gravação</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F5F8">
<script>
/* Página do cliente: claro por padrão; escuro só se o aparelho do cliente estiver no modo escuro. */
try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches){ document.documentElement.setAttribute('data-theme','dark'); document.documentElement.style.colorScheme='dark'; } }catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="icones.js"></script>
<script src="formato.js"></script>
<style>
  /* Página pública do cliente. Cores só pelos tokens do tema.css (claro e escuro). */
  :root{ --delivered:var(--t-info); --delivered-soft:var(--t-info-soft); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--t-font); background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:460px; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:28px 24px 22px; box-shadow:var(--t-shadow);
  }
  .brand{ display:flex; justify-content:center; margin-bottom:12px; }
  .brand-ico{ width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; text-align:center; }
  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; }

  .stepper{ display:flex; justify-content:space-between; margin:0 0 22px; position:relative; }
  .stepper::before{ content:''; position:absolute; top:14px; left:10%; right:10%; height:2px; background:var(--line); z-index:0; }
  .step{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0; }
  .step .dot{ width:28px; height:28px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; }
  .step.done .dot{ background:var(--ok); border-color:var(--ok); color:var(--t-surface); }
  .step.current .dot{ background:var(--accent); border-color:var(--accent); color:var(--t-surface); box-shadow:0 0 0 4px var(--accent-soft); }
  .step .label{ font-size:11.5px; color:var(--muted); font-weight:600; text-align:center; }
  .step.done .label, .step.current .label{ color:var(--ink); }

  .status-banner{ display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px 14px; border-radius:12px; margin-bottom:20px; font-weight:700; font-size:15px; }
  .status-banner.pedido, .status-banner.fabrica, .status-banner.upcase{ background:var(--wait-soft); color:var(--wait); }
  .status-msg{ text-align:center; font-size:14px; color:var(--ink-soft); line-height:1.55; margin:-8px 0 20px; }
  .status-banner.pronto{ background:var(--ok-soft); color:var(--ok); }
  .status-banner.entregue{ background:var(--delivered-soft); color:var(--delivered); }
  .status-banner.cancelado{ background:var(--danger-soft); color:var(--danger); }

  .details{ font-size:14px; border-top:1px solid var(--line); }
  .details div{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .details div:last-child{ border-bottom:none; }
  .details .k{ color:var(--muted); flex-shrink:0; }
  .details .v{ font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }

  .pag-aberto{ display:flex; gap:10px; align-items:flex-start; margin-top:16px; padding:12px 14px; border-radius:12px; background:var(--wait-soft); color:var(--wait); font-size:14px; font-weight:700; line-height:1.45; text-align:left; }
  .pag-aberto small{ display:block; font-weight:500; font-size:13px; margin-top:2px; color:var(--ink-soft); }
  .pag-aberto .ico{ margin-top:2px; }
  .pag-ok{ display:flex; gap:8px; align-items:center; justify-content:center; margin-top:16px; padding:11px 14px; border-radius:12px; background:var(--ok-soft); color:var(--ok); font-size:14px; font-weight:700; }
  .etapas{ margin-top:20px; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .etapas > b{ display:block; color:var(--ink); font-size:14px; margin-bottom:6px; }
  .etapas div{ display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .etapas div.atual{ color:var(--ink); }
  .etapas div b{ color:var(--ink); }
  .etapas .marc{ flex:0 0 18px; display:flex; justify-content:center; padding-top:1px; color:var(--line-strong); }
  .etapas div.atual .marc{ color:var(--accent); }
  .confirm-box{ text-align:center; background:var(--surface-2); border-radius:12px; padding:22px 16px 18px; margin-top:6px; }
  .confirm-icon{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .confirm-box p{ font-size:14px; color:var(--ink-soft); line-height:1.55; margin:0 0 16px; }
  .confirm-btn{ width:100%; border:none; border-radius:10px; padding:13px 16px; font-size:15px; font-weight:600; background:var(--t-primary-strong); color:#fff; cursor:pointer; font-family:inherit; min-height:48px; }
  .confirm-btn:hover:not(:disabled){ background:var(--t-primary-dark); }
  .confirm-btn:focus-visible{ outline:none; box-shadow:var(--t-ring); }
  .confirm-btn:disabled{ opacity:.6; cursor:default; }
  .loading, .error{ text-align:center; color:var(--muted); font-size:14px; padding:24px 0; line-height:1.55; }
  .error{ color:var(--ink-soft); }
  .refresh-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; }
  @media (max-width:480px){
    body{ align-items:flex-start; padding:16px 12px; }
    .card{ padding:24px 16px 20px; }
    .step .label{ font-size:10.5px; }
  }
</style>
</head>
<body>
  <div class="card" id="card" aria-live="polite">
    <div class="loading" id="loading">Carregando a sua gravação…</div>
  </div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s){
    return (s === null || s === undefined ? "" : String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function fmtDate(s){
    if(!s) return "—";
    const partes = s.split("-");
    if(partes.length !== 3) return s;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  function fmtMoeda(v){
    if(window.Fmt) return Fmt.brl(v);
    return "R$ " + Number(v||0).toFixed(2).replace(".", ",");
  }
  function ico(nome, tam){ return window.Icone ? Icone(nome, { tam: tam || 16 }) : ""; }
  function marcaHtml(){ return `<div class="brand"><span class="brand-ico">${ico("joia", 22)}</span></div>`; }
  function statusIcone(s){
    return ico(s==="pronto" ? "check" : s==="entregue" ? "pacote" : s==="cancelado" ? "cancelar" : "relogio", 18);
  }
  function getId(){
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }
  /* Etapas do pedido e o texto que o cliente vê em cada uma */
  const STATUS_INFO = {
    pedido:    { label:"Pedido realizado",        msg:"Seu pedido foi realizado com sucesso e em breve será enviado para a fábrica." },
    fabrica:   { label:"Na fábrica",              msg:"Seu pedido foi enviado para a fábrica e está em produção." },
    upcase:    { label:"A caminho da Up Case",    msg:"Seu pedido foi liberado pela fábrica e chegará em breve na loja Up Case." },
    pronto:    { label:"Pronto para retirada",    msg:"Seu pedido está pronto! Já pode ser retirado na loja Up Case." },
    entregue:  { label:"Entregue",                msg:"Seu pedido foi entregue e conferido. Obrigado pela preferência!" },
    cancelado: { label:"Pedido cancelado",        msg:"Seu pedido foi cancelado. Em caso de dúvida, fale com a loja." },
  };
  function normStatus(s){ return s==="em_aberto" ? "pedido" : s; }
  function statusLabel(s){ return (STATUS_INFO[normStatus(s)]||{}).label || s; }
  function statusMsg(s){ return (STATUS_INFO[normStatus(s)]||{}).msg || ""; }
  function stepperHtml(status){
    const steps = [
      { key:"pedido", label:"Pedido" },
      { key:"fabrica", label:"Fábrica" },
      { key:"upcase", label:"Up Case" },
      { key:"pronto", label:"Pronto" },
      { key:"entregue", label:"Entregue" },
    ];
    const order = steps.map(s=>s.key);
    const currentIdx = order.indexOf(normStatus(status));
    return `<div class="stepper">${steps.map((s,i)=>{
      let cls = "";
      if(i < currentIdx) cls = "done";
      else if(i === currentIdx) cls = "current";
      return `<div class="step ${cls}"><div class="dot">${i < currentIdx ? ico("check", 15) : (i+1)}</div><div class="label">${s.label}</div></div>`;
    }).join("")}</div>`;
  }

  function showError(msg){
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <div class="error" role="alert">${escapeHtml(msg)}</div>
    `;
  }

  function render(g){
    g.status = normStatus(g.status);
    const isFinal = g.status === "entregue" || g.status === "cancelado";
    const cancelada = g.status === "cancelado";
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <h1>Olá, ${escapeHtml(g.cliente)}!</h1>
      <div class="sub">Gravação · via nº ${escapeHtml(g.viaNumero)}</div>
      <div class="status-banner ${escapeHtml(g.status)}">${statusIcone(g.status)}${statusLabel(g.status)}</div>
      <div class="status-msg">${escapeHtml(statusMsg(g.status))}</div>
      ${cancelada ? "" : stepperHtml(g.status)}
      <div class="details">
        <div><span class="k">Entrada</span><span class="v">${fmtDate(g.dataEntrada)} às ${escapeHtml(g.horaEntrada)}</span></div>
        <div><span class="k">Previsão de entrega</span><span class="v">${fmtDate(g.dataEntrega)} às ${escapeHtml(g.horaEntrega)}</span></div>
        <div><span class="k">Quantidade de itens</span><span class="v">${escapeHtml(g.quantidadeItens)}</span></div>
        <div><span class="k">Valor total</span><span class="v">${fmtMoeda(g.valorTotal)}</span></div>
      </div>
      ${cancelada ? "" : (g.pagamentoStatus === "pago"
        ? `<div class="pag-ok">${ico("check", 18)} Pagamento confirmado</div>`
        : `<div class="pag-aberto">${ico("carteira", 18)}<div>Pagamento em aberto: ${fmtMoeda(g.valorTotal)}<small>Você paga na retirada.</small></div></div>`)}
      ${cancelada ? "" : `<div class="etapas"><b>Etapas do seu pedido</b>${["pedido","fabrica","upcase","pronto","entregue"].map(k=>`<div class="${normStatus(g.status)===k?"atual":""}"><span class="marc">${normStatus(g.status)===k?ico("direita", 16):ico("menos", 14)}</span><span><b>${STATUS_INFO[k].label}</b> — ${STATUS_INFO[k].msg}</span></div>`).join("")}</div>`}
      <div class="refresh-note">${cancelada ? "Essa gravação foi cancelada. Em caso de dúvida, fale com a loja." : isFinal ? "Essa gravação já foi entregue." : "Esta página se atualiza sozinha — não precisa recarregar."}</div>
    `;
  }

  /* Confirmação de leitura — mesmo padrão da página de acompanhamento de O.S.:
     a cada nova etapa (status) o cliente precisa confirmar que recebeu a atualização
     antes de ver os detalhes; a confirmação fica registrada no módulo Gravações. */
  let gateStatusExibido = null;
  function renderConfirmGate(g){
    g.status = normStatus(g.status);
    if(gateStatusExibido === g.status) return; // já está na tela — não reinicia o botão a cada atualização automática
    gateStatusExibido = g.status;
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <h1>Olá, ${escapeHtml(g.cliente)}!</h1>
      <div class="sub">Há uma novidade na sua gravação (via nº ${escapeHtml(g.viaNumero)})</div>
      <div class="confirm-box">
        <div class="confirm-icon">${ico("sino", 24)}</div>
        <p>Para ver como está a sua gravação, confirme que recebeu este aviso.</p>
        <button class="confirm-btn" id="btnConfirmarLeitura" disabled>Carregando…</button>
      </div>
    `;
    // Espera um instante antes de liberar o botão: robôs de varredura de link agem na hora,
    // sem esperar — isso evita que a confirmação seja "gasta" antes do cliente abrir de verdade.
    setTimeout(()=>{
      const btn = document.getElementById("btnConfirmarLeitura");
      if(!btn) return;
      btn.disabled = false;
      btn.textContent = "Sim, recebi esta atualização";
    }, 1500);
    document.getElementById("btnConfirmarLeitura").addEventListener("click", async ()=>{
      const btn = document.getElementById("btnConfirmarLeitura");
      btn.disabled = true;
      btn.textContent = "Confirmando…";
      try{
        await supabaseClient.functions.invoke("confirmar-leitura-gravacao", { body: { id: getId(), status: g.status } });
      }catch(e){
        console.error("Falha ao registrar confirmação de leitura:", e);
      }
      gateStatusExibido = null;
      render(g);
    });
  }

  async function loadStatus(){
    const id = getId();
    if(!id){
      showError("Este link está incompleto. Abra de novo o link que a loja enviou ou fale com a loja.");
      return;
    }
    try{
      const { data, error } = await supabaseClient.functions.invoke("get-gravacao-status", { body: { id } });
      if(error) throw error;
      if(!data || data.error) throw new Error((data && data.error) || "Gravação não encontrada.");
      if(!data.confirmadoStatusAtual){
        renderConfirmGate(data);
      }else{
        gateStatusExibido = null;
        render(data);
      }
    }catch(e){
      showError("Não foi possível abrir esta gravação agora. Confira se abriu o link completo e tente de novo em alguns minutos.");
    }
  }

  loadStatus();
  setInterval(loadStatus, 45000);
})();
</script>
</body>
</html>
