<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="supabase-config.js"></script>
<script src="tema.js"></script>
<script src="maiusculas.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha da loja — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="tema.css">
<style>
  /* FICHA DA LOJA (memorial descritivo) — 16/11/2026. Cores só pelas variáveis do tema (tema.css). */
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.45;}
  button,input,select,textarea{font-family:inherit;}
  .wrap{padding:20px 24px 96px;max-width:1240px;margin:0 auto;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .page-title{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.015em;}
  .page-sub{font-size:13px;color:var(--ink-faint);margin:0;max-width:720px;}
  .muted{color:var(--ink-faint);} .small{font-size:12.5px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;min-height:38px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-sm{padding:4px 10px;min-height:32px;font-size:12.5px;} .btn:disabled{opacity:.5;cursor:default;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .empty{padding:36px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px;}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px;} .empty .ico{display:block;margin:0 auto 8px;}

  /* lojas (uma ficha por loja) */
  .lojas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .loja-chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 14px;min-height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;}
  .loja-chip small{font-weight:500;font-size:11.5px;color:var(--ink-faint);}
  .loja-chip:hover{background:var(--surface-2);}
  .loja-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);} .loja-chip.on small{color:var(--accent);}

  .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start;}
  .nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;}
  .nav button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;min-height:38px;border:0;border-radius:8px;background:none;color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;}
  .nav button:hover{background:var(--surface-2);color:var(--ink);}
  .nav button.on{background:var(--accent-soft);color:var(--accent);}
  .nav .n{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .nav button.on .n{color:var(--accent);}
  .nav .sep{height:1px;background:var(--line);margin:6px 4px;}

  .sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;scroll-margin-top:12px;}
  .sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .sec-tit{font-size:16px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
  .sec-dica{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0;max-width:680px;}
  .sub-tit{font-size:13.5px;font-weight:700;margin:18px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .sub-dica{font-size:12.5px;color:var(--ink-faint);margin:0 0 10px;}
  .grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field.larg{grid-column:1 / -1;}
  .field > label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);}
  .field textarea{min-height:72px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .field .dica{font-size:11.5px;color:var(--ink-faint);}
  .ro{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .ro div{min-width:0;} .ro span{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:600;} .ro b{font-weight:600;overflow-wrap:anywhere;}
  .com-cor{display:flex;gap:6px;align-items:center;} .com-cor input[type=color]{flex:0 0 44px;width:44px;height:40px;padding:3px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;} .com-cor input[type=text]{flex:1;min-width:0;font-variant-numeric:tabular-nums;}
  .loja-chip.geral{border-style:dashed;}
  .com-olho{display:flex;gap:6px;} .com-olho input{flex:1;min-width:0;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink-soft);cursor:pointer;}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);} .icon-btn.perigo:hover{color:var(--danger);border-color:var(--danger);}

  /* listas (equipamentos, lâmpadas, contatos…): uma linha por item, abre para editar */
  .item{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px;}
  .item > summary{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:46px;cursor:pointer;list-style:none;border-radius:10px;}
  .item > summary::-webkit-details-marker{display:none;}
  .item > summary:hover{background:var(--surface-2);}
  .item[open] > summary{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;background:var(--surface-2);}
  .item .seta{color:var(--ink-faint);transition:transform .15s;flex-shrink:0;} .item[open] .seta{transform:rotate(90deg);}
  .item .nome{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .res{color:var(--ink-faint);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .item .mini{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:var(--surface-2);}
  .item .corpo{padding:14px 12px 12px;}
  .item .rodape{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .selo{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .selo.ok{background:var(--ok-soft);color:var(--ok);} .selo.no{background:var(--danger-soft);color:var(--danger);} .selo.wait{background:var(--wait-soft);color:var(--wait);}
  .extra-linha{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,2fr) 40px;align-items:end;margin-bottom:8px;}
  .sug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;}
  .sug .rot{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;min-height:32px;border:1px dashed var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip:hover{border-style:solid;border-color:var(--accent);color:var(--accent);}
  .pessoas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .pessoa{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;}
  .pessoa small{font-weight:500;color:var(--ink-faint);font-size:11.5px;}

  /* fotos */
  .fotos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .foto{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);}
  .foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;background:var(--surface-2);}
  .foto .leg{padding:6px 8px;display:grid;gap:4px;}
  .foto .leg select,.foto .leg input{width:100%;min-height:32px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--ink);}
  .foto .tirar{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(8,20,30,.62);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .fotos.peq{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-top:8px;}
  .enviando{font-size:12.5px;color:var(--ink-faint);margin-top:6px;}

  /* APRESENTAÇÃO (17/11): a loja contada de forma visual, montada sozinha com o que está na ficha. Só leitura. */
  .ap-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .ap-nome{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;text-wrap:balance;}
  .ap-onde{font-size:14px;color:var(--ink-soft);margin:6px 0 0;} .ap-end{font-size:13px;color:var(--ink-faint);margin:2px 0 0;display:flex;gap:6px;align-items:flex-start;}
  .ap-capa{display:grid;gap:8px;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);margin-top:16px;}
  .ap-capa.so{grid-template-columns:minmax(0,1fr);}
  .ap-capa img{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--surface-2);}
  .ap-capa .principal{aspect-ratio:16/9;max-height:420px;} .ap-capa .lado{display:grid;gap:8px;grid-template-rows:repeat(2,minmax(0,1fr));}
  .ap-semfoto{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--ink-faint);font-size:13px;}
  .ap-fatos{display:grid;gap:14px 24px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:20px 0 0;padding:16px 0 0;border-top:1px solid var(--line);}
  .ap-fatos div{min-width:0;} .ap-fatos dt{font-size:12px;color:var(--ink-faint);font-weight:600;} .ap-fatos dd{margin:2px 0 0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
  .ap-bloco{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);}
  .ap-bloco > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;}
  .ap-bloco h3{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;} .ap-bloco .ap-res{font-size:13px;color:var(--ink-faint);margin:-6px 0 12px;}
  .ap-ir{border:0;background:none;padding:6px 0;min-height:32px;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;} .ap-ir:hover{text-decoration:underline;text-underline-offset:3px;}
  .ap-cores{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .ap-cor{display:flex;align-items:center;gap:10px;min-width:0;} .ap-cor i{display:block;width:52px;height:52px;border-radius:10px;border:1px solid var(--line-strong);flex-shrink:0;}
  .ap-cor b{display:block;font-size:13px;font-weight:600;} .ap-cor small{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .ap-def{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 20px;margin:0;}
  .ap-def dt{font-size:12.5px;color:var(--ink-faint);font-weight:600;} .ap-def dd{margin:0;font-size:13.5px;line-height:1.5;max-width:75ch;overflow-wrap:anywhere;}
  .ap-lista{list-style:none;margin:0;padding:0;display:grid;gap:0 28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .ap-lista li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-width:0;}
  .ap-lista img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:zoom-in;border:1px solid var(--line);}
  .ap-lista .tx{min-width:0;flex:1;} .ap-lista b{display:block;font-size:13.5px;font-weight:600;} .ap-lista span{display:block;font-size:12.5px;color:var(--ink-faint);overflow-wrap:anywhere;}
  .ap-lista .q{font-size:13px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;}
  .ap-galeria{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
  .ap-galeria figure{margin:0;} .ap-galeria img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--surface-2);} .ap-galeria figcaption{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .ap-texto{font-size:13.5px;line-height:1.6;max-width:75ch;margin:0;white-space:pre-line;}
  @media (max-width:900px){ .ap-nome{font-size:20px;} .ap-capa{grid-template-columns:minmax(0,1fr);} .ap-capa .lado{grid-template-rows:none;grid-template-columns:repeat(2,minmax(0,1fr));} .ap-capa .lado img{aspect-ratio:4/3;} .ap-def{grid-template-columns:minmax(0,1fr);gap:2px 0;} .ap-def dd{margin-bottom:10px;} }

  .aviso{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;background:var(--wait-soft);display:flex;gap:10px;align-items:flex-start;}
  .aviso.err{background:var(--danger-soft);} .aviso b{font-weight:700;}
  .aviso ul{margin:4px 0 0;padding-left:18px;}

  /* barra de salvar, fixa embaixo */
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .barra .estado{font-size:13px;color:var(--ink-faint);min-width:0;} .barra .estado.sujo{color:var(--wait);font-weight:600;}

  #modal{position:fixed;inset:0;background:rgba(8,20,30,.48);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
  #modal .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:980px;width:100%;max-height:90vh;overflow:auto;}
  #modal .box h3{font-size:18px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;}
  #modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  #modal img.zoom{display:block;max-width:100%;max-height:74vh;margin:0 auto;border-radius:8px;}
  #toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;display:none;z-index:80;max-width:92vw;text-align:center;}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  tr.grupo td{background:var(--surface-2);font-weight:700;} tr.total td{font-weight:700;border-bottom:0;}
  .check-linha{display:flex;gap:8px;align-items:center;min-height:36px;font-size:13.5px;cursor:pointer;}
  #impressao{display:none;}

  @media (max-width:900px){
    .wrap{padding:14px 14px 110px;}
    .layout{grid-template-columns:minmax(0,1fr);gap:12px;}
    .nav{position:static;flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px;gap:4px;}
    .nav button{width:auto;white-space:nowrap;flex-shrink:0;} .nav .sep{display:none;}
    .sec{padding:14px;} .barra{padding:10px 14px;}
    .item .res{display:none;}
    .extra-linha{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;}
  }
  @media print{
    body{background:#fff;color:#000;font-size:11.5px;}
    .wrap > *:not(#impressao), .barra, #modal, #toast{display:none !important;}
    .wrap{padding:0;max-width:none;}
    #impressao{display:block;}
    #impressao h1{font-size:18px;margin:0 0 2px;} #impressao h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #999;padding-bottom:3px;}
    #impressao h3{font-size:12px;margin:10px 0 4px;}
    #impressao table{font-size:11px;margin-bottom:6px;} #impressao th,#impressao td{border:1px solid #bbb;padding:4px 6px;color:#000;}
    #impressao .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 16px;} #impressao .kv div{break-inside:avoid;}
    #impressao .pf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;} #impressao .pf img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #bbb;}
    #impressao .pf figure{margin:0;break-inside:avoid;} #impressao figcaption{font-size:10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="semAcesso" class="empty"><b>Carregando a ficha da loja…</b></div>
  <div id="app" style="display:none">
    <div class="page-head">
      <div>
        <h1 class="page-title">Ficha da loja</h1>
        <p class="page-sub">Tudo sobre cada loja num lugar só: fotos, equipamentos, lâmpadas, internet, contatos, equipe e documentos. Serve de memorial descritivo e de lista de compras para montar uma loja nova.</p>
      </div>
      <div class="acoes">
        <button class="btn btn-ghost" id="bCompras" type="button"><span data-ico="carrinho"></span>Lista para nova loja</button>
        <button class="btn btn-ghost" id="bCopiar" type="button"><span data-ico="copiar"></span>Copiar de outra loja</button>
        <button class="btn btn-ghost" id="bHist" type="button"><span data-ico="relogio"></span>Histórico</button>
        <button class="btn btn-ghost" id="bImprimir" type="button"><span data-ico="impressora"></span>Imprimir</button>
      </div>
    </div>
    <div class="lojas" id="lojas" role="tablist" aria-label="Loja"></div>
    <div id="alertas"></div>
    <div class="layout">
      <nav class="nav" id="nav" aria-label="Seções da ficha"></nav>
      <div id="conteudo"></div>
    </div>
  </div>
  <div id="impressao"></div>
</div>
<div class="barra" id="barra" style="display:none">
  <div class="estado" id="estado"></div>
  <div class="acoes">
    <button class="btn btn-ghost" id="bDescartar" type="button" style="display:none">Descartar alterações</button>
    <button class="btn btn-accent" id="bSalvar" type="button"><span data-ico="check"></span>Salvar ficha</button>
  </div>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="arq" accept="image/*" multiple style="display:none">

<script>
const SUPABASE_URL = window.SUPABASE_URL, SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
const API_URL = SUPABASE_URL + '/functions/v1/ficha-loja-api';
const EMBEDDED = window.parent !== window;
let __senha = null, currentUser = null;

/* ---------- utilitários ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ico = (n, tam) => (window.Icone ? Icone(n, { tam: tam || 16 }) : '');
function hidratarIcones(raiz){ (raiz || document).querySelectorAll('[data-ico]').forEach(el => { el.outerHTML = ico(el.dataset.ico, Number(el.dataset.tam) || 16); }); }
hidratarIcones();
const uid = p => (p || 'i') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = Number(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };

  else { el.className = 'estado'; el.textContent = E.em ? 'Salva por ' + (E.por || '—') + ' em ' + (window.Fmt ? Fmt.dataHora(E.em) : E.em) : 'Ficha ainda não preenchida.'; }
  $('bDescartar').style.display = E.sujo ? '' : 'none';
  $('bSalvar').disabled = !E.sujo || !!E.enviando;
}

/* ---------- vencimentos ---------- */
function diasAte(d){ if(!d) return null; const t = new Date(String(d).slice(0, 10) + 'T12:00:00'); if(isNaN(t)) return null; const h = new Date(); h.setHours(12, 0, 0, 0); return Math.round((t - h) / 86400000); }
function seloVenc(d){ const n = diasAte(d); if(n == null) return ''; if(n < 0) return `<span class="selo no">${ico('alerta', 12)}Venceu ${dataBR(d)}</span>`; if(n <= 60) return `<span class="selo wait">${ico('relogio', 12)}Vence ${dataBR(d)}</span>`; return ''; }
function listarVencimentos(){
  const out = []; const f = E.ficha; if(!f) return out;
  secoesVis().forEach(s => {
    (s.campos || []).filter(c => c.venc).forEach(c => { const v = (f.campos[s.id] || {})[c.id]; const n = diasAte(v); if(n != null && n <= 60) out.push({ n, txt: c.rot, data: v, sec: s.id }); });
    (s.listas || []).forEach(l => { const cv = l.cols.filter(c => c.venc); if(!cv.length) return; (f.listas[l.id] || []).forEach(r => cv.forEach(c => { const n = diasAte(r[c.id]); if(n != null && n <= 60) out.push({ n, txt: (r[l.principal] || l.titulo) + ' — ' + c.rot.toLowerCase(), data: r[c.id], sec: s.id }); })); });
  });
  return out.sort((a, b) => a.n - b.n);
}
function pintarAlertas(){
  const v = listarVencimentos(); const el = $('alertas');
  if(!v.length){ el.innerHTML = ''; return; }
  const venc = v.filter(x => x.n < 0).length;
  el.innerHTML = `<div class="aviso ${venc ? 'err' : ''}">${ico('alerta', 18)}<div><b>${venc ? venc + (venc === 1 ? ' item vencido' : ' itens vencidos') + (v.length > venc ? ' e ' + (v.length - venc) + ' vencendo em até 60 dias' : '') : v.length + (v.length === 1 ? ' item vence' : ' itens vencem') + ' em até 60 dias'}</b>
    <ul>${v.slice(0, 8).map(x => `<li>${esc(x.txt)}: <b>${dataBR(x.data)}</b> ${x.n < 0 ? '(vencido há ' + (-x.n) + ' dias)' : x.n === 0 ? '(vence hoje)' : '(em ' + x.n + ' dias)'}</li>`).join('')}${v.length > 8 ? '<li>e mais ' + (v.length - 8) + '…</li>' : ''}</ul></div></div>`;
}

/* ---------- campos ---------- */
function inputHtml(c, valor, attrs){
  const v = valor == null ? '' : valor; const a = attrs + ` aria-label="${esc(c.rot)}"`;
  if(c.tipo === 'area') return `<textarea ${a} rows="2" data-maiuscula>${esc(v)}</textarea>`;
  if(c.tipo === 'data') return `<input type="date" ${a} value="${esc(v)}">`;
  if(c.tipo === 'num') return `<input type="number" step="any" min="0" inputmode="decimal" ${a} value="${esc(v)}">`;
  if(c.tipo === 'valor') return `<input type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" ${a} value="${esc(v)}">`;
  if(c.tipo === 'sel') return `<select ${a}><option value=""></option>${(c.ops || []).concat(v && !(c.ops || []).includes(v) ? [v] : []).map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  if(c.tipo === 'pessoa'){ const eq = (E.equipe[E.lojaId] || []).map(p => p.nome); const lista = eq.concat(v && !eq.includes(v) ? [v] : []); return `<select ${a}><option value=""></option>${lista.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; }
  if(c.tipo === 'cor'){ const ok = /^#[0-9a-f]{6}$/i.test(v); return `<div class="com-cor"><input type="color" data-corpick value="${ok ? esc(v.toLowerCase()) : '#000000'}" aria-label="Escolher a cor de ${esc(c.rot)}"><input type="text" autocomplete="off" data-minusculo maxlength="7" placeholder="#662344" ${a} value="${esc(v)}"></div>`; }
  if(c.tipo === 'fornecedor'){ const fs = E.fornecedores.map(x => x.empresa); const lista = fs.concat(v && !fs.includes(v) ? [v] : []); return `<select ${a}><option value=""></option>${lista.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${fs.length ? '' : '<span class="dica">Nenhum fornecedor no cadastro. Cadastre em Configurações › Cadastro › Fornecedor.</span>'}`; }
  if(c.tipo === 'lojasel'){ const ls = E.lojas.filter(l => !l.geral).map(l => l.nome || l.abreviacao); const lista = ['TODAS AS LOJAS'].concat(ls, v && !ls.includes(v) && v !== 'TODAS AS LOJAS' ? [v] : []); return `<select ${a}><option value=""></option>${lista.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; }
  if(c.tipo === 'senha') return `<div class="com-olho"><input type="password" autocomplete="off" data-minusculo ${a} value="${esc(v)}"><button type="button" class="icon-btn" data-olho title="Mostrar ou esconder" aria-label="Mostrar ou esconder a senha">${ico('olho')}</button></div>`;
  if(c.tipo === 'livre') return `<input type="text" autocomplete="off" data-minusculo ${a} value="${esc(v)}">`;
  return `<input type="text" autocomplete="off" ${a} value="${esc(v)}">`;
}
const campoHtml = (c, valor, attrs) => `<div class="field ${c.larg ? 'larg' : ''}"><label>${esc(c.rot)}</label>${inputHtml(c, valor, attrs)}${c.dica ? `<span class="dica">${esc(c.dica)}</span>` : ''}</div>`;

/* ---------- listas ---------- */
function defLista(listaId){ for(const s of SECOES) for(const l of (s.listas || [])) if(l.id === listaId) return l; const sx = E.ficha.secoes.find(x => 'sx_' + x.id === listaId); return sx ? { id:listaId, titulo:sx.titulo, cols:COLS_LIVRE, principal:'item', compra:true, foto:true, novo:'Adicionar item' } : null; }
function linhasDe(listaId){ if(!E.ficha.listas[listaId]) E.ficha.listas[listaId] = []; return E.ficha.listas[listaId]; }
function resumoLinha(l, r){ return l.cols.filter(c => c.id !== l.principal && c.tipo !== 'area' && c.tipo !== 'senha' && r[c.id] !== '' && r[c.id] != null && !c.venc).slice(0, 4).map(c => c.tipo === 'valor' ? brl(numBR(r[c.id])) : c.tipo === 'data' ? dataBR(r[c.id]) : (c.id === 'qtd' ? r[c.id] + ' un.' : c.id === 'potencia' ? r[c.id] + ' W' : r[c.id])).join(' · '); }
function itemHtml(l, r){
  const aberto = E.abertos.has(r._id); const fotos = r.fotos || [];

      <div class="rodape">
        <div class="acoes">${l.foto ? `<button type="button" class="btn btn-ghost btn-sm" data-fotoitem>${ico('camera', 14)}Adicionar foto</button>` : ''}<button type="button" class="btn btn-ghost btn-sm" data-duplicar>${ico('copiar', 14)}Duplicar</button></div>
        <button type="button" class="btn btn-ghost btn-sm" data-excluir>${ico('lixeira', 14)}Excluir</button>

function listaHtml(l){

}

/* ---------- seções ---------- */
function contarSecao(s){
  const f = E.ficha; let n = 0;
  Object.values(f.campos[s.id] || {}).forEach(v => { if(String(v == null ? '' : v).trim()) n++; });
  n += (f.extras[s.id] || []).filter(x => String(x.val || '').trim()).length;
  (s.listas || []).forEach(l => n += (f.listas[l.id] || []).length);
  return n;
}
function pintarNav(){
  const f = E.ficha;
  const bt = (id, icone, titulo, n) => `<button type="button" data-sec="${esc(id)}" class="${E.secao === id ? 'on' : ''}" ${E.secao === id ? 'aria-current="true"' : ''}>${ico(icone)}<span>${esc(titulo)}</span><span class="n">${n || ''}</span></button>`;
  $('nav').innerHTML = bt('apres', 'olho', 'Apresentação', 0) + (ehGeral() ? '' : bt('fotos', 'imagem', 'Fotos da loja', f.fotos.length))
    + secoesVis().map(s => bt(s.id, s.icone, s.titulo, contarSecao(s))).join('')
    + f.secoes.map(s => bt('sx_' + s.id, 'lista', s.titulo, (f.listas['sx_' + s.id] || []).length)).join('')
    + `<div class="sep"></div><button type="button" data-novasecao>${ico('mais')}<span>Nova seção</span></button>`;
}
/* ---------- APRESENTAÇÃO: mostra a loja de forma visual, como quem apresenta o ponto a alguém. Só leitura; nunca mostra senhas nem a seção Segurança. ---------- */
function coresDaFicha(){
  const f = E.ficha;
  /* primeiro as cores cadastradas na Identidade visual (ficha GERAL), depois as que aparecem escritas na ficha da loja */
  const g = ehGeral() ? E.ficha : E.geral; const out0 = ((g && g.listas.cores) || []).filter(r => /^#[0-9a-f]{6}$/i.test(String(r.hex || '').trim())).map(r => ({ cor: String(r.hex).trim().toUpperCase(), nome: r.nome || '', uso: r.uso || '' }));
  const fontes = Object.values(f.campos.obra || {}).concat((f.extras.obra || []).map(x => x.val), (f.listas.materiais || []).map(r => r.especificacao));
  const out = out0.slice(); const vistos = new Set(out0.map(c => c.cor));
  fontes.forEach(txt => String(txt || '').split(/[·;\n]/).forEach(seg => {
    const hx = seg.match(/#[0-9a-f]{6}\b/gi); if(!hx) return;
    const nome = seg.replace(/#[0-9a-f]{6}\b/gi, '').replace(/\(\s*\)/g, '').replace(/^.*:/, '').replace(/\s+/g, ' ').trim();
    hx.forEach(c => { c = c.toUpperCase(); if(vistos.has(c)) return; vistos.add(c); out.push({ cor: c, nome: hx.length === 1 ? nome : '' }); });
  }));
  return out;
}
function apresHtml(){
  const l = lojaAtual(), f = E.ficha; if(!l || !f) return '';
  if(ehGeral()) return apresGeralHtml();
  const cp = (sec, id) => String((f.campos[sec] || {})[id] == null ? '' : (f.campos[sec] || {})[id]).trim();
  const semHex = s => String(s || '').replace(/\s*\(?#[0-9a-f]{6}\b\)?/gi, '').trim();
  const ir = (sec, txt) => `<button type="button" class="ap-ir" data-ir="${sec}">${txt || 'Editar'}</button>`;
  const bloco = (tit, sec, corpo, res) => `<section class="ap-bloco"><header><h3>${tit}</h3>${ir(sec)}</header>${res ? `<p class="ap-res">${res}</p>` : ''}${corpo}</section>`;
  const nd = n => String(n).replace('.', ',');

  const vazioCedo = !(f.fotos || []).length && !Object.values(f.campos).some(o => Object.values(o || {}).some(v => String(v == null ? '' : v).trim())) && !Object.values(f.listas).some(x => (x || []).length);
  /* topo */
  const onde = [cp('geral', 'tipoPonto'), cp('geral', 'condominio'), cp('geral', 'numeroLoja')].filter(Boolean).join(' · ');
  const end = [l.endereco, l.bairro, l.cidade].filter(x => String(x || '').trim()).join(' · ');
  const fotos = f.fotos || []; const capa = fotos.find(p => p.ambiente === 'FACHADA') || fotos[0]; const resto = fotos.filter(p => p !== capa);
  const img = (p, cls) => `<img ${cls ? `class="${cls}" ` : ''}src="${esc(p.url)}" alt="${esc(p.legenda || p.ambiente || 'Foto da loja')}" loading="lazy" data-zoom="${esc(p.url)}">`;
  let h = `<section class="sec" id="sec_apres"><div class="ap-topo"><div><h2 class="ap-nome">${esc(l.nome || l.abreviacao || '')}</h2>${onde ? `<p class="ap-onde">${esc(onde)}</p>` : ''}${end ? `<p class="ap-end">${esc(end)}</p>` : ''}</div></div>`;
  h += capa ? `<div class="ap-capa ${resto.length >= 2 ? '' : 'so'}">${img(capa, 'principal')}${resto.length >= 2 ? `<div class="lado">${resto.slice(0, 2).map(p => img(p)).join('')}</div>` : ''}</div>`
    : vazioCedo ? '' : `<div class="ap-semfoto"><span>Ainda não há fotos desta loja. Com a fachada e a vitrine, a apresentação fica completa.</span><button type="button" class="btn btn-ghost btn-sm" data-ir="fotos">${ico('camera', 14)}Adicionar fotos</button></div>`;

  /* números do ponto */
  const eq = E.equipe[E.lojaId] || [];
  const fatos = [['Área', cp('geral', 'area') && nd(cp('geral', 'area')) + ' m²'], ['Pé-direito', cp('geral', 'peDireito') && nd(cp('geral', 'peDireito')) + ' m'], ['Inauguração', cp('geral', 'inauguracao') && dataBR(cp('geral', 'inauguracao'))], ['Horário', cp('geral', 'horario')],
    ['Energia', [cp('luz', 'tensao'), cp('luz', 'padrao')].filter(Boolean).join(' · ')], ['Equipe', eq.length ? eq.length + (eq.length === 1 ? ' pessoa' : ' pessoas') : '']].filter(x => x[1]);
  if(fatos.length) h += `<dl class="ap-fatos">${fatos.map(x => `<div><dt>${x[0]}</dt><dd>${esc(x[1])}</dd></div>`).join('')}</dl>`;

  /* cores e acabamentos */
  const cores = coresDaFicha();
  const acab = [['Piso', 'piso'], ['Paredes', 'tintaParede'], ['Teto', 'tintaTeto'], ['Forro e gesso', 'forro'], ['Letreiro e fachada', 'letreiro'], ['Vidros', 'vidro'], ['Porta', 'porta'], ['Marcenaria', 'marcenaria']].map(x => [x[0], semHex(cp('obra', x[1]))]).filter(x => x[1]);
  const mats = (f.listas.materiais || []).filter(r => String(r.item || '').trim());
  if(cores.length || acab.length || mats.length) h += bloco('Cores e acabamentos', 'obra',
    (cores.length ? `<div class="ap-cores">${cores.map(c => `<div class="ap-cor"><i style="background:${c.cor}"></i><div>${c.nome ? `<b>${esc(c.nome)}</b>` : ''}<small>${c.cor}${c.uso ? ' · ' + esc(c.uso) : ''}</small></div></div>`).join('')}</div>` : '')
    + `<dl class="ap-def">${acab.map(x => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}${mats.map(r => `<dt>${esc(r.item)}</dt><dd>${esc(semHex(r.especificacao) || '')}</dd>`).join('')}</dl>`);

  /* fotos por ambiente */
  if(resto.length > 2 || (resto.length && !(resto.length >= 2))) { const gal = resto.length >= 2 ? resto.slice(2) : resto;
    if(gal.length) h += bloco('Ambientes', 'fotos', `<div class="ap-galeria">${gal.map(p => `<figure>${img(p)}${(p.ambiente || p.legenda) ? `<figcaption>${esc([p.ambiente, p.legenda].filter(Boolean).join(' — '))}</figcaption>` : ''}</figure>`).join('')}</div>`); }

  /* móveis e equipamentos */
  const linha = (r, nome, det) => `<li>${(r.fotos || [])[0] ? `<img src="${esc(r.fotos[0].url)}" alt="" loading="lazy" data-zoom="${esc(r.fotos[0].url)}">` : ''}<div class="tx"><b>${esc(nome)}</b>${det ? `<span>${esc(det)}</span>` : ''}</div>${numBR(r.qtd) > 1 ? `<span class="q">${esc(r.qtd)} un.</span>` : ''}</li>`;
  const moveis = (f.listas.moveis || []).filter(r => String(r.item || '').trim());
  if(moveis.length) h += bloco('Mobiliário e exposição', 'equip', `<ul class="ap-lista">${moveis.map(r => linha(r, r.item, [r.material, r.medidas].filter(Boolean).join(' · '))).join('')}</ul>`);
  const equips = (f.listas.equipamentos || []).concat(f.listas.ti || []).filter(r => String(r.item || '').trim());
  if(equips.length) h += bloco('Equipamentos', 'equip', `<ul class="ap-lista">${equips.map(r => linha(r, r.item, [r.marca, r.capacidade].filter(Boolean).join(' · '))).join('')}</ul>`);

  /* iluminação */
  const lamp = (f.listas.lampadas || []).filter(r => String(r.local || '').trim());
  if(lamp.length){ const pontos = lamp.reduce((a, r) => a + (numBR(r.qtd) || 1), 0);
    h += bloco('Iluminação', 'luz', `<ul class="ap-lista">${lamp.map(r => linha(r, r.local, [r.tipo, r.base, r.potencia ? r.potencia + ' W' : '', r.cor].filter(Boolean).join(' · '))).join('')}</ul>`, pontos + (pontos === 1 ? ' ponto de luz' : ' pontos de luz') + ' em ' + lamp.length + (lamp.length === 1 ? ' local' : ' locais') + (cp('luz', 'quadro') ? '. Quadro: ' + esc(cp('luz', 'quadro')) : '')); }

  /* equipe e contatos (sem telefone pessoal) */
  const nv = { diretoria:'Diretoria', gerente:'Gerente', vendedora:'Vendedora', oficina:'Oficina' };
  const cont = (f.listas.contatos || []).filter(r => String(r.nome || '').trim());
  if(eq.length || cont.length) h += bloco('Equipe e contatos', eq.length ? 'equipe' : 'contatos',
    (eq.length ? `<div class="pessoas" style="margin-bottom:${cont.length ? 12 : 0}px;">${eq.map(p => `<span class="pessoa">${ico('usuario', 14)}${esc(p.nome)}<small>${esc(nv[p.nivel] || p.nivel || '')}</small></span>`).join('')}</div>` : '')
    + (cont.length ? `<ul class="ap-lista">${cont.map(r => linha(r, r.nome, [r.pessoa, r.telefone, r.telefone2].filter(Boolean).join(' · '))).join('')}</ul>` : ''));

  /* projeto e documentos */
  const docs = (f.listas.documentos || []).filter(r => String(r.documento || '').trim());
  if(docs.length) h += bloco('Projeto e documentos', 'docs', `<ul class="ap-lista">${docs.map(r => linha(r, r.documento, [r.orgao, r.numero, r.emissao ? 'emitido em ' + dataBR(r.emissao) : '', r.vencimento ? 'vence em ' + dataBR(r.vencimento) : ''].filter(Boolean).join(' · '))).join('')}</ul>`);

  if(cp('geral', 'obs')) h += bloco('Sobre a loja', 'geral', `<p class="ap-texto">${esc(cp('geral', 'obs'))}</p>`);
  if(vazioCedo) h += `<div class="empty">${ico('olho', 28)}<b>A apresentação se monta sozinha</b>Preencha os dados, os acabamentos e as fotos desta loja: tudo aparece aqui, pronto para mostrar.<br><button type="button" class="btn btn-accent" data-ir="geral" style="margin-top:12px;">Começar pelos dados da loja</button></div>`;
  return h + `</section>`;
}
/* Apresentação da ficha GERAL: logos, cores, site/e-mails e embalagens, para mostrar a marca a alguém. */

async function abrirLoja(id){
  if(E.sujo && !confirm('Há alterações não salvas nesta ficha. Trocar de loja e perder o que não foi salvo?')) return;

  if(E.secao.startsWith('sx_') && !E.ficha.secoes.some(x => 'sx_' + x.id === E.secao)) E.secao = 'apres';

async function salvar(){

  if(r && r.ok){ if(ehGeral()) E.geral = E.ficha; E.versao = r.versao; E.por = r.por; E.em = r.em; E.sujo = false; E.resumo[E.lojaId] = { versao:r.versao, por:r.por, em:r.em }; pintarLojas(); pintarEstado(); toast('Ficha salva.'); return; }

}

/* ---------- fotos (vão para o Drive pela função upload-foto-drive; a ficha guarda só o endereço) ---------- */
function comprimir(file, maxDim, q){
  return new Promise((ok, erro) => { const rd = new FileReader(); rd.onerror = () => erro(new Error('leitura')); rd.onload = () => { const img = new Image(); img.onerror = () => erro(new Error('imagem'));
    img.onload = () => { let w = img.width, h = img.height; if(w > maxDim || h > maxDim){ if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } } const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); ok(c.toDataURL('image/jpeg', q)); };
    img.src = rd.result; }; rd.readAsDataURL(file); });
}
async function enviarFoto(file){
  const dataUrl = await comprimir(file, 1600, 0.82);
  const res = await fetch(SUPABASE_URL + '/functions/v1/upload-foto-drive', { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer ' + SUPABASE_ANON_KEY }, body: JSON.stringify({ dataUrl, filename: 'ficha_' + (E.lojaId || 'loja') + '_' + Date.now() + '.jpg', senha: __senha }) });
  const j = await res.json().catch(() => ({}));
  if(!res.ok || !j || !j.url) throw new Error((j && (j.error || j.message)) || ('envio recusado (' + res.status + ')'));
  return { id: uid('f'), url: j.url, fileId: j.fileId || null, em: Date.now() };
}

  if(t.closest('[data-excluir]')){ const x = ctxItem(t); if(x && confirm('Excluir "' + (x.r[x.l.principal] || 'este item') + '"?')){ x.linhas.splice(x.linhas.indexOf(x.r), 1); marcarSujo(); repintarLista(x.l.id); } return; }
  const sec = t.closest('[data-secao]');
  if(t.closest('[data-novoextra]') && sec){ (E.ficha.extras[sec.dataset.secao] = E.ficha.extras[sec.dataset.secao] || []).push({ id: uid('x'), rot:'', val:'' }); marcarSujo(); pintarConteudo(); const ins = C.querySelectorAll('[data-extrarot]'); if(ins.length) ins[ins.length - 1].focus(); return; }
  if(t.closest('[data-tirarextra]') && sec){ const g = t.closest('[data-extra]'); E.ficha.extras[sec.dataset.secao] = (E.ficha.extras[sec.dataset.secao] || []).filter(y => y.id !== g.dataset.extra); marcarSujo(); pintarConteudo(); pintarNav(); return; }
  const sl = t.closest('[data-secaolivre]');
  if(t.closest('[data-renomearsecao]') && sl){ const sx = E.ficha.secoes.find(y => y.id === sl.dataset.secaolivre); const n = (prompt('Novo nome da seção:', sx.titulo) || '').trim().toUpperCase(); if(n){ sx.titulo = n; marcarSujo(); pintarNav(); pintarConteudo(); } return; }
  if(t.closest('[data-excluirsecao]') && sl){ const sx = E.ficha.secoes.find(y => y.id === sl.dataset.secaolivre); const q = (E.ficha.listas['sx_' + sx.id] || []).length; if(confirm('Excluir a seção "' + sx.titulo + '"' + (q ? ' e os ' + q + ' itens dela' : '') + '?')){ E.ficha.secoes = E.ficha.secoes.filter(y => y !== sx); delete E.ficha.listas['sx_' + sx.id]; E.secao = 'geral'; marcarSujo(); pintarNav(); pintarConteudo(); } }
});
$('bSalvar').addEventListener('click', salvar);
$('bDescartar').addEventListener('click', () => { if(confirm('Descartar tudo o que não foi salvo nesta ficha?')){ E.sujo = false; abrirLoja(E.lojaId); } });
window.addEventListener('beforeunload', e => { if(E.sujo){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); salvar(); } });

/* ---------- LISTA PARA NOVA LOJA: tudo o que é comprável, com quantidade, fornecedor e valor ---------- */
function listasDeCompra(){ const out = []; secoesVis().forEach(s => (s.listas || []).filter(l => l.compra).forEach(l => out.push(l))); E.ficha.secoes.forEach(sx => out.push(defLista('sx_' + sx.id))); return out; }
function linhasCompra(){
  const grupos = [];
  listasDeCompra().forEach(l => {
    const itens = (E.ficha.listas[l.id] || []).map(r => {
      const espec = l.cols.filter(c => !['qtd','valor','fornecedor','obs','compra','garantia','manutencao','estado','serie', l.principal].includes(c.id) && String(r[c.id] == null ? '' : r[c.id]).trim()).map(c => (c.id === 'potencia' ? r[c.id] + ' W' : r[c.id])).join(' · ');
      const qtd = numBR(r.qtd) || 1, valor = numBR(r.valor);
      return { item: r[l.principal] || '', espec, qtd, fornecedor: r.fornecedor || '', valor, total: qtd * valor, obs: r.obs || '' };
    }).filter(x => String(x.item).trim());
    if(itens.length) grupos.push({ titulo: l.titulo, itens });
  });
  return grupos;
}
function abrirCompras(){
  const g = linhasCompra(); const l = lojaAtual();
  if(!g.length){ abrirModal(`<h3>Lista para nova loja</h3><div class="empty">${ico('carrinho', 28)}<b>Ainda não há itens</b>Lance lâmpadas, equipamentos, móveis e materiais nesta ficha. A lista sai pronta daqui.</div><div class="modal-actions"><button class="btn btn-accent" id="lcF" type="button">Fechar</button></div>`); $('lcF').onclick = fecharModal; return; }
  const total = g.reduce((a, x) => a + x.itens.reduce((b, i) => b + i.total, 0), 0);
  const semValor = g.reduce((a, x) => a + x.itens.filter(i => !i.valor).length, 0);
  abrirModal(`<h3>Lista para nova loja</h3><p class="muted">Baseada na ficha de <b>${esc(l ? l.nome : '')}</b>. ${semValor ? semValor + (semValor === 1 ? ' item está' : ' itens estão') + ' sem valor: o total considera só os que têm.' : ''}</p>
    <div class="scroll"><table><thead><tr><th>Item</th><th>Especificação</th><th class="num">Qtd.</th><th>Fornecedor</th><th class="num">Valor un.</th><th class="num">Total</th></tr></thead><tbody>
    ${g.map(x => `<tr class="grupo"><td colspan="5">${esc(x.titulo)}</td><td class="num">${brl(x.itens.reduce((b, i) => b + i.total, 0))}</td></tr>` + x.itens.map(i => `<tr><td>${esc(i.item)}</td><td>${esc(i.espec)}</td><td class="num">${i.qtd}</td><td>${esc(i.fornecedor)}</td><td class="num">${i.valor ? brl(i.valor) : '—'}</td><td class="num">${i.valor ? brl(i.total) : '—'}</td></tr>`).join('')).join('')}
    <tr class="total"><td colspan="5">Total estimado</td><td class="num">${brl(total)}</td></tr></tbody></table></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="lcCsv" type="button">${ico('baixar', 14)}Baixar planilha (CSV)</button><button class="btn btn-ghost" id="lcImp" type="button">${ico('impressora', 14)}Imprimir</button><button class="btn btn-accent" id="lcF" type="button">Fechar</button></div>`);
  $('lcF').onclick = fecharModal;
  $('lcCsv').onclick = () => { const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; const n = v => String(v || '').replace('.', ',');
    const linhas = [['Grupo','Item','Especificação','Quantidade','Fornecedor','Valor unitário','Total','Observações'].map(q).join(';')];
    g.forEach(x => x.itens.forEach(i => linhas.push([x.titulo, i.item, i.espec, i.qtd, i.fornecedor, n(i.valor ? i.valor.toFixed(2) : ''), n(i.valor ? i.total.toFixed(2) : ''), i.obs].map(q).join(';'))));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + linhas.join('\r\n')], { type:'text/csv;charset=utf-8' })); a.download = 'lista-nova-loja-' + (l ? (l.abreviacao || l.id) : 'loja') + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('lcImp').onclick = () => { montarImpressao(true); fecharModal(); window.print(); };
}

/* ---------- copiar itens de outra loja (para montar a ficha de uma loja nova) ---------- */
function abrirCopiar(){
  const outras = E.lojas.filter(l => l.id !== E.lojaId && l.id !== GERAL && E.resumo[l.id]);
  if(ehGeral()){ toast('A ficha geral vale para todas as lojas: não há outra para copiar.'); return; }
  if(!outras.length){ abrirModal(`<h3>Copiar de outra loja</h3><div class="empty">${ico('copiar', 28)}<b>Nenhuma outra loja com ficha preenchida</b>Preencha e salve a ficha de uma loja para usá-la de modelo.</div><div class="modal-actions"><button class="btn btn-accent" id="cpF" type="button">Fechar</button></div>`); $('cpF').onclick = fecharModal; return; }
  const todas = []; secoesVis().forEach(s => (s.listas || []).forEach(l => todas.push(l)));
  abrirModal(`<h3>Copiar de outra loja</h3><p class="muted">Os itens escolhidos são <b>acrescentados</b> a esta ficha (nada é apagado). Número de série, datas e fotos não são copiados.</p>
    <div class="field" style="max-width:360px;margin-bottom:12px;"><label for="cpLoja">Copiar da loja</label><select id="cpLoja">${outras.map(l => `<option value="${esc(l.id)}">${esc(l.nome)}</option>`).join('')}</select></div>
    <div id="cpListas">${todas.map(l => `<label class="check-linha"><input type="checkbox" value="${esc(l.id)}" ${l.compra ? 'checked' : ''}> ${esc(l.titulo)}</label>`).join('')}</div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cpF" type="button">Cancelar</button><button class="btn btn-accent" id="cpOk" type="button">Copiar itens</button></div>`);
  $('cpF').onclick = fecharModal;
  $('cpOk').onclick = async () => {
    const ids = Array.from(document.querySelectorAll('#cpListas input:checked')).map(i => i.value); if(!ids.length){ toast('Marque ao menos uma lista.'); return; }
    $('cpOk').disabled = true;
    const r = await api({ op:'abrir', lojaId: $('cpLoja').value });
    if(!r || !r.ok){ $('cpOk').disabled = false; toast((r && r.error) || 'Não foi possível ler a outra ficha.'); return; }
    const origem = normalizar(r.payload); let n = 0;
    ids.forEach(id => (origem.listas[id] || []).forEach(o => { const c = { ...o, _id: uid('r') }; delete c.fotos; ['serie','compra','garantia','manutencao','emissao','vencimento','numero','link','telefone','pessoa'].forEach(k => { if(id !== 'contatos' || !['telefone','pessoa'].includes(k)) delete c[k]; }); linhasDe(id).push(c); n++; }));
    fecharModal(); if(n){ marcarSujo(); pintarNav(); pintarConteudo(); pintarAlertas(); } toast(n ? (n === 1 ? '1 item copiado' : n + ' itens copiados') + '. Confira e salve a ficha.' : 'A outra loja não tem itens nessas listas.');
  };
}

/* ---------- histórico ---------- */
async function abrirHistorico(){
  abrirModal(`<h3>Histórico da ficha</h3><p class="muted">Carregando…</p>`);
  const r = await api({ op:'historico', lojaId:E.lojaId });
  const h = (r && r.historico) || [];
  abrirModal(`<h3>Histórico da ficha</h3><p class="muted">Cada vez que alguém salva, a versão anterior fica guardada aqui (as 40 mais recentes).</p>
    ${h.length ? `<div class="scroll"><table><thead><tr><th>Versão</th><th>Salva por</th><th>Quando</th><th></th></tr></thead><tbody>${h.map(x => `<tr><td>${x.versao}</td><td>${esc(x.por || '—')}</td><td>${window.Fmt ? Fmt.dataHora(x.em) : esc(x.em)}</td><td class="num"><button class="btn btn-ghost btn-sm" data-restaurar="${x.id}" type="button">Trazer de volta</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><b>Sem versões anteriores</b>${esc((r && r.error) || 'A ficha ainda não foi alterada depois de criada.')}</div>`}
    <div class="modal-actions"><button class="btn btn-accent" id="hF" type="button">Fechar</button></div>`);
  $('hF').onclick = fecharModal;
  $('modalBox').querySelectorAll('[data-restaurar]').forEach(b => b.onclick = async () => {
    if(!confirm('Trazer esta versão de volta para a tela? Ela só vale depois que você clicar em Salvar ficha.')) return;
    const v = await api({ op:'versao', lojaId:E.lojaId, id:Number(b.dataset.restaurar) });
    if(!v || !v.ok){ toast((v && v.error) || 'Não foi possível ler a versão.'); return; }
    E.ficha = normalizar(v.payload); E.abertos = new Set(); fecharModal(); marcarSujo(); pintarTudo(); toast('Versão antiga na tela. Confira e clique em Salvar ficha.', 5000);
  });
}

/* ---------- impressão (memorial completo, ou só a lista de compras) ---------- */
function montarImpressao(soCompras){
  const l = lojaAtual(), f = E.ficha; if(!l || !f) return;
  let h = `<h1>${soCompras ? 'Lista para nova loja' : 'Ficha da loja'} — ${esc(l.nome)}</h1><div>${esc([l.razaoSocial, l.cnpj, l.endereco, l.cidade].filter(Boolean).join(' · '))}</div><div>Impresso em ${new Date().toLocaleString('pt-BR')}${E.em ? ' · ficha salva por ' + esc(E.por || '') + ' em ' + (window.Fmt ? Fmt.dataHora(E.em) : '') : ''}</div>`;
  if(soCompras){
    const g = linhasCompra(); const total = g.reduce((a, x) => a + x.itens.reduce((b, i) => b + i.total, 0), 0);
    h += g.map(x => `<h2>${esc(x.titulo)}</h2><table><thead><tr><th>Item</th><th>Especificação</th><th>Qtd.</th><th>Fornecedor</th><th>Valor un.</th><th>Total</th></tr></thead><tbody>${x.itens.map(i => `<tr><td>${esc(i.item)}</td><td>${esc(i.espec)}</td><td>${i.qtd}</td><td>${esc(i.fornecedor)}</td><td>${i.valor ? brl(i.valor) : ''}</td><td>${i.valor ? brl(i.total) : ''}</td></tr>`).join('')}</tbody></table>`).join('') + `<h2>Total estimado: ${brl(total)}</h2>`;
  } else {
    const val = (c, v) => c.tipo === 'senha' ? (v ? '••••••' : '') : c.tipo === 'data' ? dataBR(v) : c.tipo === 'valor' ? (v !== '' && v != null ? brl(numBR(v)) : '') : (v == null ? '' : v);
    const tabela = (lst) => { const linhas = f.listas[lst.id] || []; if(!linhas.length) return ''; const cols = lst.cols.filter(c => linhas.some(r => String(r[c.id] == null ? '' : r[c.id]).trim())); return `<h3>${esc(lst.titulo)}</h3><table><thead><tr>${cols.map(c => `<th>${esc(c.rot)}</th>`).join('')}</tr></thead><tbody>${linhas.map(r => `<tr>${cols.map(c => `<td>${esc(val(c, r[c.id]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`; };
    secoesVis().forEach(s => {
      const campos = (s.campos || []).filter(c => String((f.campos[s.id] || {})[c.id] || '').trim()); const extras = (f.extras[s.id] || []).filter(x => String(x.val || '').trim());
      const tabs = (s.listas || []).map(tabela).join(''); const eq = s.id === 'equipe' ? (E.equipe[E.lojaId] || []) : [];
      if(!campos.length && !extras.length && !tabs && !eq.length) return;
      h += `<h2>${esc(s.titulo)}</h2>` + (eq.length ? `<div>Equipe: ${eq.map(p => esc(p.nome)).join(', ')}</div>` : '')
        + ((campos.length || extras.length) ? `<div class="kv">${campos.map(c => `<div><b>${esc(c.rot)}:</b> ${esc(val(c, f.campos[s.id][c.id]))}</div>`).join('')}${extras.map(x => `<div><b>${esc(x.rot || 'Campo')}:</b> ${esc(x.val)}</div>`).join('')}</div>` : '') + tabs;
    });
    f.secoes.forEach(sx => { const t = tabela(defLista('sx_' + sx.id)); if(t) h += `<h2>${esc(sx.titulo)}</h2>` + t; });
    if(f.fotos.length) h += `<h2>Fotos da loja</h2><div class="pf">${f.fotos.map(p => `<figure><img src="${esc(p.url)}" alt=""><figcaption>${esc([p.ambiente, p.legenda].filter(Boolean).join(' — '))}</figcaption></figure>`).join('')}</div>`;
  }
  $('impressao').innerHTML = h;
}
$('bImprimir').addEventListener('click', () => { montarImpressao(false); window.print(); });
$('bCompras').addEventListener('click', abrirCompras);
$('bCopiar').addEventListener('click', abrirCopiar);
$('bHist').addEventListener('click', abrirHistorico);

/* ---------- entrada ---------- */
async function iniciar(){
  const r = await api({ op:'init' });
  if(!r || !r.ok){ $('semAcesso').innerHTML = `${ico(r && r.offline ? 'alerta' : 'cadeado', 28)}<b>${r && r.offline ? 'Sem conexão' : 'Sem acesso à ficha da loja'}</b>${esc((r && r.error) || 'Tente de novo.')}`; return; }
  E.lojas = r.lojas || []; E.equipe = r.equipe || {}; E.resumo = r.resumo || {}; E.fornecedores = r.fornecedores || [];
  if(E.lojas.some(l => l.id === GERAL)) api({ op:'abrir', lojaId:GERAL }).then(g => { if(g && g.ok && !ehGeral()){ E.geral = normalizar(g.payload); if(E.ficha && E.secao === 'apres') pintarConteudo(); } });
  if(!E.lojas.some(l => !l.geral)){ $('semAcesso').innerHTML = `${ico('loja', 28)}<b>Nenhuma loja liberada</b>Seu usuário não está vinculado a nenhuma loja.`; return; }
  $('semAcesso').style.display = 'none'; $('app').style.display = ''; $('barra').style.display = '';
  let alvo = null; try{ alvo = sessionStorage.getItem('ficha_loja_atual'); }catch(e){}
  const lojaShell = currentUser && currentUser.lojaAtualId;
  const id = [alvo, lojaShell].find(x => x && E.lojas.some(l => l.id === x)) || (E.lojas.find(l => !l.geral) || E.lojas[0]).id;
  await abrirLoja(id);
}
window.addEventListener('message', ev => {
  if(!mensagemConfiavel(ev)) return;
  const d = ev.data || {};
  if(d.type === 'auth'){
    const primeira = !currentUser;
    currentUser = d.user; __senha = currentUser ? currentUser.senha : null;
    if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'fichaloja', tabs:[], active:null }, '*');
    if(!currentUser){ $('semAcesso').innerHTML = `${ico('cadeado', 28)}<b>Entre no app</b>Faça login para abrir a ficha da loja.`; return; }
    if(primeira) iniciar();
  }
});
window.addEventListener('load', () => { if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'fichaloja' }, '*'); else $('semAcesso').innerHTML = `${ico('cadeado', 28)}<b>Abra pelo app</b>A ficha da loja fica em ADM › Ficha da loja.`; });
/* mantém a sessão viva enquanto há uso aqui dentro */
(function(){ var ultimo = 0; function avisar(){ var a = Date.now(); if(a - ultimo < 5000) return; ultimo = a; try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){} } ['click','keydown','touchstart'].forEach(function(t){ document.addEventListener(t, avisar, { passive:true }); }); })();
</script>
