<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="marketing-off.js"></script>
<script src="cliente-lojas.js"></script>
<style>
/* Cores: só variáveis do sistema (tema.css). Nada de hex solto nesta tela. */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--t-font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.ico{flex-shrink:0;}

/* ── Acesso avulso (fora do app) ───────────────────────────── */
.hub-back-link{color:var(--ink-faint); text-decoration:none; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
.hub-back-link:hover{color:var(--accent);}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--t-dark);}
.login-card{background:var(--surface); border-radius:16px; padding:32px 28px; max-width:380px; width:100%; box-shadow:var(--t-shadow-lg);}
.login-tag{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:6px;}
.login-title{font-size:20px; letter-spacing:-.015em; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 20px; background:var(--t-dark); color:white; flex-wrap:wrap;}
.topbar .hub-back-link{color:inherit; opacity:.8;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:8px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:transparent; color:inherit; opacity:.75; border:none; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--t-primary-strong); color:white; opacity:1;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{border:1px solid currentColor; opacity:.85; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
.icon-btn{background:none; border:none; color:inherit; cursor:pointer; padding:6px; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;}
.icon-btn-sair{opacity:.85;}
.icon-btn-sair:hover{opacity:1;}

/* ── Página ─────────────────────────────────────────────────── */
#mainContent{max-width:1240px; margin:0 auto; padding:20px 20px 40px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.page-title{font-size:20px; letter-spacing:-.015em; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0; max-width:70ch;}
.head-acoes{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid transparent; border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; line-height:1.2; white-space:nowrap;}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px; font-size:12.5px; gap:5px;}

.card{background:var(--surface); border-radius:12px; padding:20px; margin-bottom:16px; border:1px solid var(--line);}
.card-titulo{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px;}
.section-label{font-size:15px; font-weight:700; color:var(--ink); margin:0 0 14px; letter-spacing:-.01em;}
.card-titulo .section-label{margin:0;}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:12px; min-width:0;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], input[type=email], select{padding:9px 10px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:14px;}
textarea{border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:14px; padding:9px 10px;}
.grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px;}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 12px;}
.grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0 12px;}
@media (max-width:900px){ .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }

/* ── Selos de status ────────────────────────────────────────── */
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; line-height:1.4;}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.badge-pendente{background:var(--wait-soft); color:var(--wait);}
.badge-aprovado{background:var(--ok-soft); color:var(--ok);}
.badge-recusado{background:var(--danger-soft); color:var(--danger);}
.badge-expirado{background:var(--surface-2); color:var(--muted);}
.badge-vencido{background:var(--danger-soft); color:var(--danger); box-shadow:inset 0 0 0 1px var(--danger);}
.badge-cutucado{background:var(--t-info-soft); color:var(--info);}
.badge-recusado-status{background:var(--surface-2); color:var(--ink-soft); box-shadow:inset 0 0 0 1px var(--line-strong);}
.badge-rascunho{background:transparent; color:var(--muted); border:1px dashed var(--line-strong);}
.badge-avulso{background:var(--surface-2); color:var(--muted); font-size:10.5px; padding:1px 7px;}
.badge-semcat{background:var(--wait-soft); color:var(--wait); font-size:10.5px; padding:1px 7px;}
.selo-status{cursor:pointer; border:none; font-family:inherit;}
.selo-status .ico{opacity:.7;}
.selo-status:hover{filter:brightness(.97); box-shadow:inset 0 0 0 1px currentColor;}

/* ── Avisos (atrasos, vencimentos) ──────────────────────────── */
.aviso{display:flex; gap:12px; align-items:flex-start; border-radius:12px; padding:14px 16px; margin-bottom:16px; font-size:13.5px; border:1px solid transparent;}
.aviso > .ico{margin-top:2px;}
.aviso-corpo{flex:1; min-width:0;}
.aviso-titulo{font-weight:700; margin:0 0 2px;}
.aviso-texto{margin:0; color:var(--ink-soft);}
.aviso-perigo{background:var(--danger-soft); border-color:color-mix(in srgb, var(--danger) 30%, transparent); color:var(--danger);}
.aviso-atencao{background:var(--wait-soft); border-color:color-mix(in srgb, var(--wait) 30%, transparent); color:var(--wait);}
.aviso-ok{background:var(--ok-soft); border-color:color-mix(in srgb, var(--ok) 30%, transparent); color:var(--ok);}
.alerta-vencimento{background:var(--danger-soft); border:1px solid color-mix(in srgb, var(--danger) 30%, transparent); color:var(--danger); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:13.5px;}
.chips-vendedora{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.chip-vendedora{display:inline-flex; align-items:center; gap:6px; background:var(--surface); color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 45%, transparent); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; transition:background .15s var(--t-ease),color .15s var(--t-ease);}
.chip-vendedora .n{background:var(--danger-soft); border-radius:999px; padding:0 7px; font-size:11.5px;}
.chip-vendedora:hover{background:var(--danger); color:white;}
.chip-vendedora:hover .n{background:transparent;}
.link-msg-auto{display:inline-flex; align-items:center; gap:5px; background:var(--danger-soft); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent); color:var(--danger); font-size:12px; font-weight:600; cursor:pointer; padding:5px 10px; border-radius:999px; white-space:nowrap;}
.link-msg-auto:hover{background:var(--danger); color:white;}
.msg-enviada-tag{display:inline-flex; align-items:center; gap:4px; color:var(--ok); font-size:12px; font-weight:600; white-space:nowrap; padding:0 6px;}

/* ── Barra de filtros ───────────────────────────────────────── */
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
.filters select, .filters input[type=text]{padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; min-height:38px;}
.filters .busca-campo{position:relative; flex:1 1 220px; min-width:180px;}
.filters .busca-campo .ico{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
.filters .busca-campo input{width:100%; padding-left:32px;}
.filters .check-filtro{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
.filters .contagem{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap;}

/* ── Tabelas ────────────────────────────────────────────────── */
.card-tabela{padding:0; overflow:hidden;}
.card-tabela .tabela-rolagem{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap;}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
th.num, td.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
td.nowrap{white-space:nowrap;}
.td-cliente b{font-weight:600; color:var(--ink);}
.td-cliente .sub{display:block; font-size:11.5px; color:var(--muted); margin-top:2px;}
tr.linha-atrasada > td{background:var(--danger-soft);}
.acoes-linha{display:inline-flex; align-items:center; justify-content:flex-end; gap:2px; flex-wrap:nowrap;}
.acoes-linha .sep{width:1px; height:20px; background:var(--line); margin:0 4px;}
.btn-icone.wa{color:var(--ok);}
.estado{padding:32px 20px; text-align:center; color:var(--muted); font-size:13.5px;}
.estado .ico{display:block; margin:0 auto 8px; color:var(--line-strong);}
.estado b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px;}
.estado .btn{margin-top:12px;}
.estado-erro .ico{color:var(--danger);}

/* Celular: listas viram cartões */
@media (max-width:760px){
  #mainContent{padding:14px 12px 32px;}
  .filters{display:grid; grid-template-columns:1fr 1fr; padding:10px;}
  .filters .busca-campo{grid-column:1 / -1;}
  .filters select{width:100%; min-width:0;}
  .filters .contagem{grid-column:1 / -1; margin-left:0;}
  .card-tabela{background:transparent; border:none; box-shadow:none !important; overflow:visible;}
  table.tabela-cartoes, table.tabela-cartoes tbody{display:block;}
  table.tabela-cartoes thead{display:none;}
  table.tabela-cartoes tr{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  table.tabela-cartoes tr.linha-atrasada{border-color:color-mix(in srgb, var(--danger) 40%, transparent); background:var(--danger-soft);}
  table.tabela-cartoes tr.linha-atrasada > td{background:transparent;}
  table.tabela-cartoes td{display:block; padding:0; border:none; font-size:12.5px;}
  table.tabela-cartoes tbody tr:hover > td{background:transparent;}
  table.tabela-cartoes td.td-meta{order:5; color:var(--ink-soft);}
  table.tabela-cartoes td.td-meta[data-label=Data]::before, table.tabela-cartoes td.td-meta[data-label=Vendedora]::before, table.tabela-cartoes td.td-meta[data-label=Validade]::before, table.tabela-cartoes td.td-meta[data-label="Parado há"]::before{content:attr(data-label) " "; color:var(--muted);}
  table.tabela-cartoes td.td-cliente{order:1; flex:1 1 55%; min-width:0; font-size:14px;}
  table.tabela-cartoes td.td-valor{order:2; text-align:right; font-weight:700; font-size:15px;}
  table.tabela-cartoes tr::before{content:""; order:3; flex-basis:100%; height:0;}
  table.tabela-cartoes td.td-status{order:4;}
  table.tabela-cartoes td.td-acoes{order:6; flex-basis:100%; border-top:1px solid var(--line); padding-top:8px; margin-top:4px; text-align:left !important;}
  table.tabela-cartoes td.td-acoes .acoes-linha{justify-content:flex-start; flex-wrap:wrap; gap:4px; width:100%;}
  table.tabela-cartoes td.td-acoes .acoes-linha > .btn:last-child, table.tabela-cartoes td.td-acoes .acoes-linha > [data-ver]{margin-left:auto;}
  table.tabela-cartoes td.td-vazio{flex-basis:100%;}
  table.tabela-cartoes tr.tr-vazio::before{display:none;}
  table.tabela-cartoes tr.tr-vazio{display:block;}
  .page-head{align-items:stretch;}
  .head-acoes .btn{flex:1 1 auto;}
}

/* ── Itens do orçamento ─────────────────────────────────────── */
.item-row-desc .campo-perc,.item-row-desc .campo-val{width:72px;padding:6px 7px;border:1px solid var(--line-strong);border-radius:8px;font-size:12.5px;height:36px;background:var(--surface);color:var(--ink);}
.item-row-desc{display:flex; gap:5px; align-items:center; flex-shrink:0; flex-wrap:wrap;}
.item-row-desc .desc-sep{font-size:11.5px;color:var(--ink-faint);}
.item-row-desc .desc-total{font-size:12.5px; font-weight:700; color:var(--ok); white-space:nowrap; min-width:70px;}
.item-row-obs{margin-top:8px;}
.item-row-obs input{width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);}
.item-row{border:1px solid var(--t-primary-line); background:color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); border-radius:12px; padding:12px; margin-bottom:10px;}
.item-row-topo{display:flex; gap:8px; align-items:center; flex-wrap:nowrap;}
.item-row-produto{flex:1; min-width:160px;}
.item-row-valor{width:120px; flex-shrink:0; position:relative;}
.item-row-valor::before{content:"R$"; position:absolute; left:9px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--muted); pointer-events:none;}
.item-row-valor input{width:100%;padding:7px 8px 7px 28px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px;height:36px;text-align:right;font-variant-numeric:tabular-nums;}
.item-row-estoque{margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.item-row-estoque .ico{color:var(--muted);}
.item-aviso-estoque{margin-top:8px;padding:8px 10px;background:var(--wait-soft);border:1px solid color-mix(in srgb, var(--wait) 35%, transparent);border-radius:8px;font-size:12.5px;color:var(--wait);font-weight:600;display:flex;gap:8px;align-items:flex-start;}
.item-aviso-estoque .det{font-weight:500;margin-top:3px;}
.item-avulso-check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;cursor:pointer;color:var(--ink-soft);}
@media (max-width:640px){
  .item-row-produto{min-width:100%;} .item-row-topo{flex-wrap:wrap;} .item-row-valor{flex:1 1 100%;}
  .item-row-desc{flex:1 1 100%; display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .item-row-desc .btn-ajuste{height:44px;}
  .item-row-desc .campo-perc, .item-row-desc .campo-val{width:100%; height:44px;}
  .item-row-desc .desc-sep{display:none;}
  .item-row-desc .desc-total:empty{display:none;}
  .item-row-desc .desc-total{grid-column:1 / -1; text-align:right;}
  .btn-add-item{flex:1 1 auto; justify-content:center; height:44px;}
  #mainContent .venda-item-compact{flex-wrap:wrap;}
  #mainContent .venda-compact-nome{white-space:normal; flex-basis:100%;}
  #mainContent .venda-compact-val{margin-right:auto;}
  .modal .grupo-acoes{display:grid; grid-template-columns:1fr 1fr;}
  .modal .grupo-acoes .btn{white-space:normal; padding-left:8px; padding-right:8px;}
}
.btn-ajuste{padding:5px 9px;border:1px solid var(--line-strong);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-soft);height:36px;white-space:nowrap;transition:background .15s var(--t-ease),color .15s var(--t-ease),border-color .15s var(--t-ease);}
.btn-ajuste.ativo-desc{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
.btn-ajuste.ativo-acr{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);}
.btn-add-item{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.btn-add-item:hover{background:var(--t-primary-strong);color:white;border-color:var(--t-primary-strong);}
/* Item já adicionado (linha compacta) */
.venda-item-compact{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface);font-size:13.5px;}
.venda-compact-nome{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.venda-compact-val{font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;}
.venda-compact-val .aj{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px;}
.venda-compact-icones{display:flex;gap:2px;flex-shrink:0;}
.venda-compact-btn.tem-obs{color:var(--accent);}
.venda-compact-obs{display:none;font-size:12.5px;color:var(--ink-soft);margin:-2px 0 8px;padding:6px 10px;background:var(--surface-2);border-radius:8px;}
.itens-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.itens-total .rot{font-size:13px;color:var(--ink-soft);}
.itens-total .val{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.itens-total .dica{flex-basis:100%;font-size:12px;color:var(--muted);}

/* Barra de salvar (fica presa embaixo enquanto rola o formulário) */
.barra-salvar{position:sticky; bottom:0; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; box-shadow:var(--t-shadow); margin-top:4px;}
.barra-salvar .total-resumo{margin-right:auto; display:flex; flex-direction:column; line-height:1.2;}
.barra-salvar .total-resumo span{font-size:12px; color:var(--muted);}
.barra-salvar .total-resumo b{font-size:18px; font-variant-numeric:tabular-nums;}
@media (max-width:760px){ .barra-salvar{padding:10px 12px; border-radius:12px 12px 0 0; margin:4px -12px 0;} .barra-salvar .btn{flex:1 1 auto;} .barra-salvar .total-resumo{flex-basis:100%;flex-direction:row;justify-content:space-between;align-items:baseline;} }

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); padding:11px 18px; border-radius:10px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s var(--t-ease), transform .2s var(--t-ease); z-index:200; max-width:calc(100vw - 32px);}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:24px;}
.modal h3{font-size:18px; letter-spacing:-.015em; margin:0 0 6px; padding-right:36px;}
.modal .modal-sub{margin:0 0 14px; color:var(--muted); font-size:13px;}
.modal-actions{display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; justify-content:flex-end; align-items:center; padding-top:14px; border-top:1px solid var(--line);}
.modal-actions .esquerda{margin-right:auto;}

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),

    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 5000 } });
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

/* Prazos do acompanhamento automático (dias desde a criação do orçamento) — editáveis em
 * Configurações de mensagens de orçamento. Guardado em gestao_config, chave própria
 * (não mexe nas chaves usadas por outros módulos). */
const PRAZOS_AUTO_MSG_PADRAO = { t1:3, t2:6, t3:9, tFinal:15, diasValidade:15 };
function prazosAutoMsg(){
  const p = config && config.orcamentoAutoMsgConfig;
  if(!p || p.t1==null || p.t2==null || p.t3==null || p.tFinal==null) return PRAZOS_AUTO_MSG_PADRAO;
  return { diasValidade: PRAZOS_AUTO_MSG_PADRAO.diasValidade, ...p };
}
async function salvarPrazosAutoMsg(prazos){
  if(!config) config = {};
  config.orcamentoAutoMsgConfig = prazos;

  if(r && r.error){ showToast('Não foi possível salvar os prazos: '+r.error); return false; }

}
function diasDesdeCriacao(o){
  const base = o.autoBaseData || o.data || (o.criadoEm ? new Date(o.criadoEm).toISOString().slice(0,10) : null);
  if(!base) return 0;
  const hoje = new Date(todayStr()+'T00:00:00');
  const d0 = new Date(base+'T00:00:00');
  return Math.max(0, Math.floor((hoje - d0) / 86400000));
}
/** Reinicia o acompanhamento automático a partir de hoje — chamado sempre que o status é
 * trocado manualmente (qualquer direção). Assim, um orçamento que já tinha passado do prazo
 * (ex: virou "Recusado" sozinho) e volta pra um status em aberto começa a contar os prazos
 * de novo a partir dessa mudança, em vez de continuar usando a data de criação original. */
function reiniciarAutoAposMudancaManual(o){
  o.autoBaseData = todayStr();
  o.autoMensagensEnviadas = 0;
  o.editadoManualmente = false;
}
/* Acompanhamento automático (local a este módulo — não escreve nos status configuráveis
 * de Cadastro, só sobrepõe o rótulo/cor enquanto o orçamento está em aberto):
 *  - Aberto → no prazo 1 (padrão 3 dias) fica vermelho, precisa mandar mensagem.
 *  - Ao enviar, vira "Ação de fixação" (verde) até o prazo 2 (padrão 6 dias), aí fica vermelho de novo.
 *  - Ao enviar, vira "Prorrogado à ação" (verde) até o prazo 3 (padrão 9 dias), vermelho de novo.
 *  - Ao enviar essa 3ª mensagem, fica verde e para por aí — não pede mais mensagem.
 * O contador (quantas mensagens automáticas já foram enviadas) fica em o.autoMensagensEnviadas. */
function estagioAutoOrcamento(o){
  if(o.rascunho) return null;
  const info = statusInfoDe(o.status);
  if(info && info.encerra) return null; // aprovado/recusado (manual ou automático): desativa
  const prazos = prazosAutoMsg();
  const dias = diasDesdeCriacao(o);
  const N = o.autoMensagensEnviadas || 0;
  const limites = [prazos.t1, prazos.t2, prazos.t3];
  const nomes = ['Aberto', 'Ação de fixação', 'Prorrogado à ação'];
  const nome = nomes[Math.min(N,2)];
  const limiteAtual = N<3 ? limites[N] : null;
  const precisaEnviar = limiteAtual!=null && dias>=limiteAtual;
  const enviadoRecente = N>0 && !precisaEnviar;
  const cor = precisaEnviar ? 'vermelho' : (enviadoRecente ? 'verde' : 'neutro');
  return { nome, dias, N, limiteAtual, precisaEnviar, enviadoRecente, cor, prazoFinal: prazos.tFinal };
}
/* Se passou do prazo final (padrão 15 dias) sem edição/aprovação manual, encerra sozinho
 * como Recusado — esse é um status real (já existe na configuração), então grava de verdade. */
function aplicarPrazoFinalAutoSeNecessario(o){
  if(o.rascunho) return false;
  const info = statusInfoDe(o.status);
  if(info && info.encerra) return false;
  if(o.editadoManualmente) return false;
  const prazos = prazosAutoMsg();
  if(diasDesdeCriacao(o) >= prazos.tFinal){
    o.status = 'recusado';
    orcamentoSalvar(o).catch(()=>{});
    return true;
  }
  return false;
}
function diasParaVencer(o){
  if(!o.validade) return null;
  const hoje = new Date(todayStr()+'T00:00:00');
  const val = new Date(o.validade+'T00:00:00');
  return Math.round((val-hoje)/86400000);
}
/** Orçamentos ainda em aberto (status não-encerrado) que vencem em até 3 dias, ou já venceram. */
function orcamentosParaAvisar(){
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    const dias = diasParaVencer(o);
    return dias !== null && dias <= 3;
  });
}
/** Há quantos dias o orçamento foi criado (baseado na data de criação, não na validade). */
function diasAberto(o){
  const hoje = new Date(todayStr()+'T00:00:00');
  const criado = new Date((o.data||todayStr())+'T00:00:00');
  return Math.round((hoje-criado)/86400000);
}
/** Orçamentos em aberto (status não-encerrado) criados há mais de 5 dias, sem resposta. */
function orcamentosAbertosMaisDe5Dias(){
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    return diasAberto(o) > 5;
  });
}

/** Nome que aparece nas listas: apelido do cadastro, ou nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
function nomeGravadoParaExibicao(lista, nomeGravado){
  const f = (lista||[]).find(x=>funcionarioBateComNome(x, nomeGravado));
  return f ? nomeExibicaoFuncionario(f) : nomeGravado;
}
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
function separarTelefone(str){
  const digitos = onlyDigits(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
function formatarNumeroTelefone(digitos){
  digitos = digitos.slice(0,9);
  if(digitos.length<=4) return digitos;
  if(digitos.length<=8) return digitos.slice(0,digitos.length-4)+'-'+digitos.slice(-4);
  return digitos.slice(0,5)+'-'+digitos.slice(5);
}
function wireTelefoneMask(prefix){
  const dddInp = document.getElementById(prefix+'_telefoneDDD');
  const numInp = document.getElementById(prefix+'_telefoneNum');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigits(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefone(onlyDigits(numInp.value)); });
}
function combinarTelefoneValidado(prefix){
  const ddd = onlyDigits((document.getElementById(prefix+'_telefoneDDD')||{}).value);
  const numero = onlyDigits((document.getElementById(prefix+'_telefoneNum')||{}).value);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==9){
    showToast('Telefone incompleto — preencha o DDD (2 dígitos) e o número (9 dígitos), ou deixe os dois em branco.');
    return null;
  }
  return `(${ddd}) ${numero.slice(0,5)}-${numero.slice(5)}`;
}
function findClienteIndex(telefone, cpf){

  const doc = onlyDigitsCpf(cpf);
  return clientes.findIndex(c=>

  );
}

/** Busca sob demanda no banco (não pré-carrega os 20 mil+ clientes de uma vez).
 * Aceita nome (parcial) ou telefone/CPF (dígitos, casamento parcial). */
async function buscarClientesRemoto(termo){
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    // Guarda no cache local (pra o clique no resultado e o botão "editar cadastro" acharem na hora).
    achados.forEach(c=>{ if(!clientes.some(x=>x.id===c.id)) clientes.push(c); });
    return achados;
  }catch(e){ console.error('erro ao buscar clientes', e); return []; }
}
/** Localiza no banco um cliente por telefone ou CPF (usado pra evitar duplicar cadastro
 * e pra achar o cliente de um orçamento já salvo, sem precisar de tudo em memória). */
async function buscarClientePorTelefoneOuCpf(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  if(!tel && !doc) return null;
  const cacheado = clientes.find(c=>
    (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
  );
  if(cacheado) return cacheado;
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo: doc || tel } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    const achado = achados.find(c=>
      (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
    ) || null;
    if(achado) clientes.push(achado);
    return achado;
  }catch(e){ console.error('erro ao localizar cliente', e); return null; }
}

async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  // Tenta ViaCEP primeiro, BrasilAPI como fallback
  const fontes = [
    async () => {
      const r = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
      const d = await r.json();
      if(d.erro) return null;
      return { endereco: d.logradouro||'', bairro: d.bairro||'', cidade: d.localidade||'', estado: d.uf||'' };
    },
    async () => {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${cepDigits}`);
      if(!r.ok) return null;
      const d = await r.json();
      return { endereco: d.street||'', bairro: d.neighborhood||'', cidade: d.city||'', estado: d.state||'' };
    }
  ];
  for(const fn of fontes){
    try{ const res = await fn(); if(res) return res; }catch(e){}
  }
  return null;
}

// Busca CPF na Receita Federal via BrasilAPI — retorna { nome, situacao } ou null
async function buscarCpfReceita(cpf){
  const digits = onlyDigits(cpf);
  if(digits.length !== 11) return null;
  try{
    const r = await fetch(`https://brasilapi.com.br/api/cpf/v1/${digits}`);
    if(!r.ok) return null;
    const d = await r.json();
    // BrasilAPI retorna { cpf, name, birthday, situation }
    if(!d || !d.name) return null;
    return { nome: d.name, situacao: d.situation||'' };
  }catch(e){ return null; }
}

function wireClienteFields(prefix){
  wireTelefoneMask(prefix);

  // Auto-fill de endereço ao digitar/sair do CEP
  const cepInp = document.getElementById(prefix+'_cep');
  if(cepInp){
    cepInp.addEventListener('blur', async ()=>{
      const cepDigits = onlyDigits(cepInp.value);
      if(cepDigits.length !== 8) return;
      cepInp.placeholder = 'Buscando endereço…';
      const endereco = await buscarEnderecoPorCep(cepDigits);
      cepInp.placeholder = '00000-000';
      if(!endereco){ showToast('CEP não encontrado. Confira os números ou preencha o endereço à mão.'); return; }
      const f = k => document.getElementById(prefix+'_'+k);
      if(f('endereco') && !f('endereco').value) f('endereco').value = endereco.endereco;
      if(f('bairro')   && !f('bairro').value)   f('bairro').value   = endereco.bairro;
      if(f('cidade')   && !f('cidade').value)    f('cidade').value   = endereco.cidade;
      if(f('estado')   && !f('estado').value)    f('estado').value   = endereco.estado;
      // focar no número após preencher
      const numInp = f('numero'); if(numInp) numInp.focus();
      showToast('Endereço preenchido — informe o número.');
    });
  }

  // Auto-busca de nome na Receita Federal ao sair do campo CPF
  const cpfInp = document.getElementById(prefix+'_cpf');
  const nomeInp = document.getElementById(prefix+'_cliente');
  if(cpfInp && nomeInp){
    cpfInp.addEventListener('blur', async ()=>{
      const digits = onlyDigits(cpfInp.value);
      if(digits.length !== 11) return;
      if(nomeInp.value.trim()) return; // já tem nome preenchido, não sobrescreve
      cpfInp.style.background = 'var(--wait-soft)';
      const res = await buscarCpfReceita(digits);
      cpfInp.style.background = '';
      if(res && res.nome){
        nomeInp.value = res.nome;
        showToast('Nome preenchido pela Receita Federal — confira.');
      }
    });
  }
}
// Gera o HTML de um card de resultado de busca de cliente
function clienteCardHtml(c, idx){
  const partes = (c.nome||'').trim().split(/\s+/);
  const iniciais = partes.length>=2 ? partes[0][0]+partes[partes.length-1][0] : (partes[0]||'?')[0];
  const cpfFmt = c.cpf ? String(c.cpf).replace(/[^\d]/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : '';
  const tags = [
    c.telefone ? `<span class="cli-result-tag">${ic('telefone',12)} ${escapeHtml(c.telefone)}</span>` : '',
    cpfFmt     ? `<span class="cli-result-tag">CPF ${escapeHtml(cpfFmt)}</span>` : '',
    c.cidade   ? `<span class="cli-result-tag">${ic('pin',12)} ${escapeHtml(c.cidade)}</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="cli-result-card" data-idx="${idx}">
    <div class="cli-result-avatar">${escapeHtml(iniciais.toUpperCase())}</div>
    <div class="cli-result-info">
      <div class="cli-result-nome">${escapeHtml(c.nome||'')}${window.ClienteLojas?ClienteLojas.html(c):''}</div>
      ${tags ? `<div class="cli-result-sub">${tags}</div>` : ''}
    </div>
  </div>`;
}

function montarClienteAutocomplete(wrap, onSel, inicial){
  if(window.ClienteLojas) ClienteLojas.iniciar(gatewayCall, ()=>(config&&config.lojas)||[]);
  let clienteSel=inicial||null, timer=null, focusIdx=-1;
  function renderWrap(){
    if(clienteSel){
      wrap.innerHTML=`<div class="cli-ac-selecionado">
        ${ic('usuario')}
        <b>${escapeHtml(clienteSel.nome)}${window.ClienteLojas?ClienteLojas.html(clienteSel):""}</b>
        ${clienteSel.telefone?`<span class="tel">${escapeHtml(clienteSel.telefone)}</span>`:''}
        <button type="button" class="cli-ac-edit" id="cliAcEdit_orc" title="Editar o cadastro deste cliente">${ic('lapis',14)} Editar cadastro</button>
        <button type="button" class="cli-ac-clear" id="cliAcClear_orc" title="Trocar cliente" aria-label="Trocar cliente">${ic('x')}</button>
      </div>
      <button type="button" class="btn btn-ghost btn-sm btn-cad-cliente" id="cliAcCad_orc">${ic('mais',14)} Cadastrar cliente novo</button>`;
      wrap.querySelector('#cliAcClear_orc').addEventListener('click',()=>{clienteSel=null;onSel(null);renderWrap();});
      wrap.querySelector('#cliAcEdit_orc').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();},clienteSel);});
      wrap.querySelector('#cliAcCad_orc').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    } else {
      wrap.innerHTML=`<div class="cli-ac-wrap"><input class="cli-ac-input" id="cliAcInp_orc" placeholder="Busque pelo nome, telefone ou CPF" aria-label="Buscar cliente" autocomplete="off" spellcheck="false"><div class="cli-ac-dropdown" id="cliAcDrop_orc" style="display:none;"></div></div>
      <button type="button" class="btn btn-ghost btn-sm btn-cad-cliente" id="cliAcCad_orc">${ic('mais',14)} Cadastrar cliente novo</button>`;
      const inp=wrap.querySelector('#cliAcInp_orc'),drop=wrap.querySelector('#cliAcDrop_orc');
      function fechar(){drop.style.display='none';focusIdx=-1;}
      function msg(t){drop.innerHTML=`<div class="cli-ac-msg">${t}</div>`;drop.style.display='block';}
      function renderRes(ach){
        if(ach.length){
          drop.innerHTML=ach.map((c,i)=>clienteCardHtml(c,i)).join('');
          drop.style.display='block';
          drop.querySelectorAll('.cli-result-card').forEach((el,i)=>{
            el.addEventListener('mousedown',e=>{e.preventDefault();clienteSel=ach[i];onSel(ach[i]);fechar();renderWrap();});
            el.addEventListener('mouseover',()=>{focusIdx=i;drop.querySelectorAll('.cli-result-card').forEach((e,k)=>e.classList.toggle('focused',k===i));});
          });
        } else {
          const t=inp.value.trim();
          const parece_cpf=/^[\d.\-]+$/.test(t)&&onlyDigits(t).length===11;
          drop.innerHTML=`
            <div class="cli-ac-vazio">
              <p>Nenhum cliente com esse nome, telefone ou CPF.</p>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${parece_cpf?`<button type="button" class="btn btn-ghost btn-sm" id="cliAcBtnReceita">${ic('busca',14)} Buscar CPF na Receita Federal</button><div id="cliAcReceitaResult" style="font-size:12px;padding:0 2px;display:none;"></div>`:''}
                <button type="button" class="btn btn-ghost btn-sm" id="cliAcBtnCad2">${ic('mais',14)} Cadastrar novo cliente</button>
              </div>
            </div>`;
          drop.style.display='block';
          if(parece_cpf){
            drop.querySelector('#cliAcBtnReceita')?.addEventListener('mousedown',async e=>{
              e.preventDefault();
              const btn=drop.querySelector('#cliAcBtnReceita');
              const div=drop.querySelector('#cliAcReceitaResult');
              btn.disabled=true;btn.textContent='Consultando a Receita…';
              const res=await buscarCpfReceita(onlyDigits(t));
              btn.disabled=false;
              if(!res||!res.nome){
                div.style.display='block';
                div.innerHTML='<span style="color:var(--danger);">CPF não encontrado ou serviço fora do ar. Cadastre o cliente digitando o nome.</span>';
                btn.innerHTML=ic('busca',14)+' Buscar CPF na Receita Federal';
              } else {
                fechar();
                abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();},{nome:res.nome,cpf:t});
              }
            });
          }
          drop.querySelector('#cliAcBtnCad2')?.addEventListener('mousedown',e=>{
            e.preventDefault();fechar();
            abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});
          });
        }
      }
      inp.addEventListener('input',()=>{
        const t=inp.value.trim();focusIdx=-1;
        if(t.length<2){fechar();return;}
        msg('Buscando…');clearTimeout(timer);
        timer=setTimeout(async()=>{
          const r=await gatewayCall({op:'searchClients',params:{termo:t}});
          if(inp.value.trim()!==t)return;
          renderRes((r&&r.data)||[]);
        },280);
      });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.cli-result-card, .cli-ac-item');if(!items.length)return;
        if(e.key==='ArrowDown'){e.preventDefault();focusIdx=Math.min(focusIdx+1,items.length-1);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='ArrowUp'){e.preventDefault();focusIdx=Math.max(focusIdx-1,0);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='Enter'&&focusIdx>=0){e.preventDefault();items[focusIdx].dispatchEvent(new MouseEvent('mousedown'));}
        else if(e.key==='Escape'){fechar();}
      });
      document.addEventListener('mousedown',function h(e){if(!wrap.contains(e.target)){fechar();document.removeEventListener('mousedown',h);}});
      wrap.querySelector('#cliAcCad_orc').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    }
  }
  renderWrap();
  return {getCliente:()=>clienteSel};
}

function abrirSeletorCliente(onConfirmar, clienteAtual){
  let selecionado = clienteAtual ? { ...clienteAtual } : null;
  openModal(`
    <h3>${clienteAtual && clienteAtual.id ? 'Editar cliente' : 'Cliente do orçamento'}</h3>
    <p class="modal-sub">Procure um cliente já cadastrado ou preencha os dados para cadastrar.</p>
    <div class="field"><label for="busca_cliente">Buscar cliente cadastrado</label><input id="busca_cliente" placeholder="Nome, telefone ou CPF" autocomplete="off"></div>
    <div id="resultados_cliente" style="max-height:200px; overflow-y:auto; margin-bottom:12px;"></div>
    <div style="border-top:1px solid var(--line); padding-top:14px;">
      <div class="section-label" style="font-size:14px;">Dados do cliente</div>
      ${clienteFieldsHtml('sel', clienteAtual || {})}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarSelecaoCliente">Cancelar</button>
      <button class="btn btn-accent" id="btnConfirmarSelecaoCliente">${ic('check')} Usar este cliente</button>
    </div>
  `);
  wireClienteFields('sel');

  function preencherFormulario(c){
    const map = { cpf:c.cpf, cliente:c.nome, email:c.email, nascimento:c.dataNascimento,
      cep:c.cep, endereco:c.endereco, numero:c.numero, complemento:c.complemento, bairro:c.bairro, cidade:c.cidade, estado:c.estado };
    Object.keys(map).forEach(campo=>{
      const el = document.getElementById('sel_'+campo);
      if(el) el.value = map[campo] || '';
    });
    const tel = separarTelefone(c.telefone||'');
    const dddEl = document.getElementById('sel_telefoneDDD');
    const numEl = document.getElementById('sel_telefoneNum');
    if(dddEl) dddEl.value = tel.ddd;
    if(numEl) numEl.value = formatarNumeroTelefone(tel.numero);
    selecionado = c;
  }
  let buscaClienteTimeout = null;
  // Busca no servidor (o cadastro de clientes não fica mais inteiro no navegador).
  function buscarClientesComDebounce(termo, cb){
    clearTimeout(buscaClienteTimeout);
    buscaClienteTimeout = setTimeout(async ()=>{
      const r = await gatewayCall({ op:'searchClients', params:{ termo } });
      cb(Array.isArray(r && r.data) ? r.data : []);
    }, 300);
  }
function renderResultados(termo){
    const wrap = document.getElementById('resultados_cliente');
    if(!termo || termo.length<2){ wrap.innerHTML=''; return; }
    wrap.innerHTML = `<div class="muted" style="padding:6px;">Buscando…</div>`;
    buscarClientesComDebounce(termo, (achados)=>{
      if(achados.length > 0){
        wrap.innerHTML = achados.map(c=>`<div class="code-list-item" style="cursor:pointer;" data-selcli="${c.id}">
          <div><b>${escapeHtml(c.nome)}</b> <span class="muted">${escapeHtml(c.telefone||'Sem telefone')}</span>${c.cpf?` <span class="muted">· CPF ${escapeHtml(c.cpf)}</span>`:''}</div>
        </div>`).join('');
        wrap.querySelectorAll('[data-selcli]').forEach(el=>{
          el.addEventListener('click', ()=>{
            const c = achados.find(x=>x.id===el.dataset.selcli);
            if(c){ preencherFormulario(c); showToast('Dados preenchidos — confira e confirme.'); }
          });
        });
      } else {
        // Verificar se o termo parece um CPF (11 dígitos, com ou sem pontos/traço)
        const digits = onlyDigits(termo);
        const parece_cpf = digits.length === 11;
        wrap.innerHTML = `
          <div class="empty" style="padding:10px 0 6px;">
            Nenhum cliente com esse nome, telefone ou CPF.
            ${parece_cpf ? `
            <div style="margin-top:8px;">
              <button type="button" class="btn btn-ghost btn-sm" id="btnBuscarCpfReceita" style="width:100%;">
                ${ic('busca',14)} Buscar CPF na Receita Federal
              </button>
              <div id="receitaResult" style="margin-top:6px;font-size:12.5px;"></div>
            </div>` : ''}
            <div class="muted" style="margin-top:8px;font-size:12px;">Preencha os dados abaixo para cadastrar o cliente.</div>
          </div>`;
        if(parece_cpf){
          document.getElementById('btnBuscarCpfReceita')?.addEventListener('click', async ()=>{
            const btn = document.getElementById('btnBuscarCpfReceita');
            const div = document.getElementById('receitaResult');
            btn.disabled = true; btn.textContent = 'Consultando a Receita Federal…';
            const resultado = await buscarCpfReceita(termo);
            btn.disabled = false; btn.innerHTML = ic('busca',14) + ' Buscar CPF na Receita Federal';
            if(!resultado){
              div.innerHTML = '<span style="color:var(--danger);">CPF não encontrado ou serviço fora do ar. Preencha o nome à mão.</span>';
            } else {
              div.innerHTML = `<span style="color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:4px;">${ic('check',14)} ${escapeHtml(resultado.nome)}</span>
                ${resultado.situacao?`<span class="muted"> — ${escapeHtml(resultado.situacao)}</span>`:''}
                <button type="button" class="btn btn-ghost btn-sm" id="btnUsarNomeReceita" style="margin-left:8px;">Usar este nome</button>`;
              document.getElementById('btnUsarNomeReceita')?.addEventListener('click', ()=>{
                const nomeInp = document.getElementById('sel_cliente');
                const cpfInp = document.getElementById('sel_cpf');
                if(nomeInp) nomeInp.value = resultado.nome;
                if(cpfInp) cpfInp.value = termo; // preenche o CPF digitado também
                div.innerHTML = '<span class="muted">Nome e CPF preenchidos nos campos abaixo.</span>';
              });
            }
          });
        }
      }
    });
  }
  document.getElementById('busca_cliente').addEventListener('input', e=> renderResultados(e.target.value.trim()));

  document.getElementById('btnCancelarSelecaoCliente').addEventListener('click', closeModal);
  document.getElementById('btnConfirmarSelecaoCliente').addEventListener('click', async ()=>{
    const nome = maiusc(document.getElementById('sel_cliente').value);
    if(!nome){ showToast('Informe o nome do cliente para continuar.'); return; }
    const telefoneCombinado = combinarTelefoneValidado('sel');
    if(telefoneCombinado === null) return;
    const patch = {
      nome,
      telefone: telefoneCombinado,
      email: document.getElementById('sel_email').value.trim(),
      cpf: document.getElementById('sel_cpf').value.trim(),
      dataNascimento: document.getElementById('sel_nascimento').value,
      cep: document.getElementById('sel_cep').value.trim(),
      endereco: maiusc(document.getElementById('sel_endereco').value),
      numero: maiusc(document.getElementById('sel_numero').value),
      complemento: maiusc(document.getElementById('sel_complemento').value),
      bairro: maiusc(document.getElementById('sel_bairro').value),
      cidade: maiusc(document.getElementById('sel_cidade').value),
      estado: maiusc(document.getElementById('sel_estado').value),
    };
    let clienteFinal;
    if(selecionado && selecionado.id){
      clienteFinal = { ...selecionado, ...patch };
      const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
      if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
    } else {
      const existente = await buscarClientePorTelefoneOuCpf(patch.telefone, patch.cpf);
      if(existente){
        clienteFinal = { ...existente, ...patch };
        const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
        if(idx>=0) clientes[idx] = clienteFinal;
      } else {
        clienteFinal = { id: uid('cli'), ...patch, criadoEm: Date.now() };
        clientes.unshift(clienteFinal);
      }
    }
    await salvarUmCliente(clienteFinal);
    closeModal();
    onConfirmar(clienteFinal);
  });
}

function unidadeEstoqueLabel(u){ return u==='g' ? 'g' : u==='kg' ? 'kg' : 'un'; }

/* ============================================================
   ESTOQUE-API — reservas ativas (Pedidos/O.S. e Transferências).
   A peça reservada continua no saldo da loja, mas já está prometida:
   disponível = em estoque − reservado. Cache por loja, recarregado quando
   o módulo abre, a loja muda ou depois de uma venda.
   ============================================================ */
const ESTOQUE_API_URL = SUPABASE_URL + "/functions/v1/estoque-api";
async function estoqueApi(op, params){
  try{
    const res = await fetch(ESTOQUE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, op, ...(params||{}) }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com estoque-api', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
let __reservadasPorLoja = {};      // lojaId -> { produtoId: qtdReservada }
let __reservadasCarregando = {};   // lojaId -> Promise
let __reservadasFalhou = {};       // lojaId -> true (não tenta de novo em loop)
function reservadasMapaDeLinhas(linhas, lojaId){
  const mapa = {};
  (linhas||[]).forEach(x=>{
    if(!x || !x.produto_id) return;
    if(lojaId && x.loja_id && String(x.loja_id)!==String(lojaId)) return;
    mapa[x.produto_id] = (mapa[x.produto_id]||0) + (Number(x.quantidade)||0);
  });
  return mapa;
}
function invalidarReservadas(){ __reservadasPorLoja = {}; __reservadasFalhou = {}; }
function carregarReservadas(lojaId){
  if(!lojaId) return Promise.resolve(null);
  if(__reservadasCarregando[lojaId]) return __reservadasCarregando[lojaId];
  const p = (async ()=>{
    const r = await estoqueApi('reservadas', { lojaId });
    if(r && r.ok && Array.isArray(r.data)){
      __reservadasPorLoja[lojaId] = reservadasMapaDeLinhas(r.data, lojaId);
      delete __reservadasFalhou[lojaId];
      return __reservadasPorLoja[lojaId];
    }
    console.error('erro ao carregar reservas de estoque', r && r.error);
    __reservadasFalhou[lojaId] = true;
    return null;
  })().finally(()=>{ delete __reservadasCarregando[lojaId]; });
  __reservadasCarregando[lojaId] = p;
  return p;
}
function reservadoDe(produtoId, lojaId){
  const m = __reservadasPorLoja[lojaId];
  return m ? (Number(m[produtoId])||0) : 0;
}

/* ============================================================
   CATÁLOGO OBRIGATÓRIO — todo item precisa estar vinculado a um produto
   do catálogo (produtoEstoqueId) ou marcado como "Item avulso (sem estoque)"
   com descrição. Registros antigos só são cobrados quando o formulário é salvo.
   ============================================================ */
function itemTemConteudo(it){
  return !!(it && ((it.produto||'').trim() || it.produtoEstoqueId || (it.valorUnitario!=='' && it.valorUnitario!=null && Number(it.valorUnitario)) || it.avulso));
}
function itensSemCatalogo(lista){
  const problemas = [];
  (lista||[]).forEach((it, i)=>{
    if(!itemTemConteudo(it)) return;
    if(it.produtoEstoqueId) return;
    if(it.avulso && (it.produto||'').trim()) return;
    problemas.push(it.avulso ? `item avulso sem descrição (linha ${i+1})` : `"${(it.produto||'').trim() || ('item ' + (i+1) + ' sem nome')}"`);
  });
  return problemas;
}
function mensagemItensSemCatalogo(problemas){
  return `Itens sem produto do catálogo: ${problemas.join(', ')}. Escolha o produto na lista de busca ou marque "Item avulso (sem estoque)" e descreva o item.`;
}

function mountItens(container, holder, getLojaId){
  if(!holder.itens) holder.itens = [];
  getLojaId = getLojaId || (()=>'');

  function totalItens(){ return holder.itens.reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0); }

  /** Recalcula valorUnitario a partir do preço original + desconto/acréscimo (se algum
   * ajuste estiver configurado). Se não houver ajuste, não mexe no que já está lá — a
   * pessoa ainda pode digitar o valor unitário na mão, direto. */
  /* Recalcula o valor final após um ajuste de desconto/acréscimo via botões.
   Atualiza o campo de valor e o span de total inline sem redesenhar a linha. */
function recalcularAjusteNovo(it, idx, row){
  if(it.ajusteTipo==='nenhum'||it.ajusteQtd===''||it.ajusteQtd==null){ return; }
  const base = Number(it.precoOriginal)||0;
  if(!base) return;
  const qtd = Number(it.ajusteQtd)||0;
  const delta = it.ajusteModo==='percentual' ? base*qtd/100 : qtd;
  it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
  const inpVal=row ? row.querySelector('[data-itfield="valorUnitario"]') : null;
  if(inpVal) inpVal.value=Number(it.valorUnitario).toFixed(2);
  const span=document.getElementById('descTotal_'+idx);
  if(span) span.textContent='= '+fmtMoeda(it.valorUnitario);
  updateTotalHint();
}
function recalcularValorAjustado(it){
    if(it.ajusteTipo==='desconto' || it.ajusteTipo==='acrescimo'){
      const base = Number(it.precoOriginal)||0;
      const qtdAjuste = Number(it.ajusteQtd)||0;
      const delta = it.ajusteModo==='percentual' ? base*qtdAjuste/100 : qtdAjuste;
      it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
    }
  }
  function outrasLojasComEstoque(produto, lojaAtualId){
    const porLoja = (produto && produto.estoquePorLoja) || {};
    return (config.lojas||[]).filter(l=> l.id!==lojaAtualId && (Number(porLoja[l.id])||0) > 0)
      .map(l=> `${l.abreviacao} (${Number(porLoja[l.id])||0})`);

                :`<input class="prod-ac-input" id="pacInp_${i}" placeholder="Busque o produto pelo nome ou código, ou bipe o código de barras" autocomplete="off" spellcheck="false" data-pac="${i}" value="${escapeHtml(it.produto||'')}">
                   <div class="prod-ac-drop" id="pacDrop_${i}" style="display:none;"></div>`}

                value="${it.ajusteValR!==undefined&&it.ajusteValR!==''?it.ajusteValR:''}">
              <span class="desc-total" id="descTotal_${i}">${(()=>{
                if(it.ajusteTipo!=='nenhum'&&it.valorUnitario!==''&&it.valorUnitario!=null) return '= '+fmtMoeda(it.valorUnitario);

              })()}</span>
            </div>
            <button type="button" class="btn-add-item" data-itadd="${i}" title="Confirmar este item e abrir outra linha">${ic('mais',14)} Adicionar</button>
            ${holder.itens.length>1?`<button type="button" class="btn-icone perigo" data-itdel="${i}" title="Remover esta linha" aria-label="Remover esta linha">${ic('lixeira')}</button>`:''}
          </div>
          ${produtoAtual?`
          <div class="item-row-estoque">
            <span class="muted" style="font-size:12px;display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;">${ic('pacote',14)} Nesta loja: <b>${estoqueAqui}</b> ${escapeHtml(unidadeEstoqueLabel(produtoAtual.unidade))} em estoque${__reservadasPorLoja[lojaAtual]?(()=>{ const res=reservadoDe(produtoAtual.id,lojaAtual); const disp=estoqueAqui-res; return ` · <b>${res}</b> reservado · <b style="color:${disp>0?'var(--ok)':'var(--danger)'};">${disp}</b> disponível`; })():''}</span>
            ${outras.length>0?`<span class="muted" style="font-size:12px;">· também tem em: ${outras.join(', ')}</span>`:`<span class="muted" style="font-size:12px;">· sem estoque em outras lojas</span>`}

      function fecharDrop(){ drop.style.display='none'; pacFocus=-1; }

          if(porCod){ selecionarProduto(i,porCod); fecharDrop(); return; }

        renderDrop(vendaveis.filter(p=>{
          const campos=[p.nome,p.codigo,p.codigoBarras,String(p.fator||''),p.fornecedor];

    });

    // Botão × limpa produto
    wrap.querySelectorAll('[data-paclear]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.paclear);
        const it=holder.itens[i];
        it.produtoEstoqueId=''; it.produto=''; it.precoOriginal=''; it.valorUnitario=''; it.ajusteTipo='nenhum'; it.ajusteQtd='';
        drawRows(); updateTotalHint();
      });
    });

    // ── Botões Desconto / Acréscimo ──
    wrap.querySelectorAll('[data-aidbtn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.idx2);
        const it=holder.itens[idx];
        const tipo=btn.dataset.aidbtn;
        // toggle: clicar no mesmo botão ativo desativa
        it.ajusteTipo = it.ajusteTipo===tipo ? 'nenhum' : tipo;
        // atualiza aparência dos botões sem redesenhar a linha inteira
        const row=wrap.querySelector('[data-idx="'+idx+'"]');
        row.querySelectorAll('[data-aidbtn]').forEach(b=>{
          b.classList.remove('ativo-desc','ativo-acr');
          if(it.ajusteTipo==='desconto'&&b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
          if(it.ajusteTipo==='acrescimo'&&b.dataset.aidbtn==='acrescimo') b.classList.add('ativo-acr');
        });
        if(it.ajusteTipo==='nenhum'){
          it.ajustePerc=''; it.ajusteValR='';
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          // restaura valor original
          if(it.precoOriginal!==''&&it.precoOriginal!=null){
            it.valorUnitario=it.precoOriginal;
            const inpVal=row.querySelector('[data-itfield="valorUnitario"]');
            if(inpVal) inpVal.value=Number(it.precoOriginal).toFixed(2);
          }
          updateTotalHint();
        } else {
          recalcularAjusteNovo(it, idx, row);
        }
      });
    });

    // ── Campos de valor e desconto ──
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input',()=>{
        const row=el.closest('[data-idx]');
        const idx=Number(row.dataset.idx);
        const field=el.dataset.itfield;
        const it=holder.itens[idx];

        if(field==='valorUnitario'){
          it.valorUnitario=el.value===''?'':parseFloat(el.value);
          it.precoOriginal=it.valorUnitario;
          // limpa desconto ao editar valor manualmente
          it.ajustePerc=''; it.ajusteValR=''; it.ajusteTipo='nenhum';
          row.querySelectorAll('[data-aidbtn]').forEach(b=>b.classList.remove('ativo-desc','ativo-acr'));
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          updateTotalHint(); return;
        }
        if(field==='ajustePerc'){
          it.ajustePerc=el.value===''?'':parseFloat(el.value);
          it.ajusteValR='';
          it.ajusteModo='percentual'; it.ajusteQtd=it.ajustePerc;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajustePerc!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='ajusteValR'){
          it.ajusteValR=el.value===''?'':parseFloat(el.value);
          it.ajustePerc='';
          it.ajusteModo='valor'; it.ajusteQtd=it.ajusteValR;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajusteValR!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='observacaoItem'){ it.observacaoItem=el.value; return; }
        it[field]=el.value; updateTotalHint();
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click',()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }

  // Seleciona produto pelo autocomplete
  function selecionarProduto(idx, produto){
    const it=holder.itens[idx];
    it.produtoEstoqueId=produto.id; it.produto=produto.nome; it.avulso=false;
    it.precoOriginal=produto.precoVenda!=null?produto.precoVenda:'';
    if(it.valorUnitario===''||it.valorUnitario==null) it.valorUnitario=it.precoOriginal||'';
    drawRows();
    // Foca no campo de valor após selecionar produto
    setTimeout(()=>{
      const row=container.querySelector('[data-idx="'+idx+'"]');
      if(row){ const v=row.querySelector('[data-itfield="valorUnitario"]'); if(v) v.focus(); }
    },50);
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    const totalConfirmado = holder.itens.filter(x=>x._modo==='ok'&&x.produto).reduce((acc,x)=>acc+(Number(x.quantidade)||1)*(Number(x.valorUnitario)||0),0);
    if(hint) hint.innerHTML = `<div class="itens-total"><span class="rot">Total das peças adicionadas</span><span class="val">${fmtMoeda(totalConfirmado)}</span><span class="dica">A linha que você está preenchendo entra no total quando clica em "Adicionar". Desconto ou acréscimo: use os botões de cada item.</span></div>`;
    const barra = document.getElementById('orcTotalBarra');
    if(barra) barra.textContent = fmtMoeda(totalConfirmado);
    // Avisa o bloco de pagamento para recalcular o total
    if(typeof window.__pagRedraw==='function') window.__pagRedraw();
  }
  draw();
  return { totalItens, refreshEstoque: drawRows };
}

/* ============================================================
   FOLLOW-UP (veio do antigo Marketing › Orçamentos)
   Só orçamentos em aberto (status que não encerram, os 3 primeiros). Regra de atraso:
   2º status aberto parado há 2+ dias, 3º status aberto há 7+ dias.
   ============================================================ */
function followupStatusAbertos(){ return statusList().filter(x=>!x.encerra).slice(0,3); }
function followupDias(o){
  const ref = o.statusAtualizadoEm || o.criadoEm || o.data;
  if(!ref) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(ref).getTime()) / 86400000));
}
function followupLimite(o){
  const pos = followupStatusAbertos().findIndex(s=>s.id===o.status);
  return pos===1 ? 2 : pos>=2 ? 7 : null;
}
function followupAtrasado(o){ const lim = followupLimite(o); return lim!==null && followupDias(o) >= lim; }
function followupAbertos(){
  const ids = new Set(followupStatusAbertos().map(s=>s.id));
  return (orcamentos||[]).filter(o=> ids.has(o.status));
}
function followupAtrasados(){ return followupAbertos().filter(followupAtrasado); }
function nomeLojaOrc(o){
  const l = (config.lojas||[]).find(x=>x.id===o.lojaId);
  return l ? l.nome : (o.loja || '—');
}
function renderFollowup(main){
  const abertos = followupStatusAbertos();
  const atrasados = followupAtrasados();
  main.innerHTML = `
    <div class="page-head">

      : `<div class="aviso aviso-ok" role="status">${ic('check',18)}<div class="aviso-corpo"><p class="aviso-titulo">Nenhum contato atrasado</p><p class="aviso-texto">Todos os orçamentos em aberto estão dentro do prazo.</p></div></div>`}

      el.innerHTML = followupAbertos().length===0

        : `<div class="estado">${ic('filtro',28)}<b>Nenhum orçamento com esses filtros</b>Mude a loja, o status ou apague a busca para ver os demais.</div>`;

    el.innerHTML = `<div class="tabela-rolagem"><table class="tabela-cartoes"><thead><tr>

      ${lista.map(o=>{

        return `<tr class="${atras?'linha-atrasada':''}">
          <td class="td-cliente" data-label="Cliente"><b>${escapeHtml(o.cliente||'—')}</b>${o.codigoVia?`<span class="sub">${escapeHtml(o.codigoVia)}</span>`:''}</td>

          <td class="num td-acoes"><div class="acoes-linha">
            ${o.telefone?`<button type="button" class="btn-icone wa" data-fuwa="${escapeHtml(o.id)}" title="Chamar no WhatsApp" aria-label="Chamar no WhatsApp">${waIconSvg(17)}</button>`:''}
            ${o.email?`<button type="button" class="btn-icone" data-fumail="${escapeHtml(o.id)}" title="Enviar e-mail" aria-label="Enviar e-mail">${ic('email')}</button>`:''}
            <button type="button" class="btn btn-ghost btn-sm" data-fuabrir="${escapeHtml(o.id)}">${ic('olho',14)} Abrir</button>
          </div></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
    el.querySelectorAll('[data-fuabrir]').forEach(b=> b.addEventListener('click', ()=>{ const o = orcamentos.find(x=>x.id===b.dataset.fuabrir); if(o) abrirDetalheOrcamento(o); }));
    el.querySelectorAll('[data-fuwa]').forEach(b=> b.addEventListener('click', ()=> enviarWhatsAppOrcId(b.dataset.fuwa)));
    el.querySelectorAll('[data-fumail]').forEach(b=> b.addEventListener('click', ()=> enviarEmailOrcId(b.dataset.fumail)));
  }
  ['fuBusca','fuLoja','fuStatus','fuSoAtrasados'].forEach(id=>{

    e.addEventListener(e.tagName==='INPUT' && e.type==='text' ? 'input' : 'change', atualizar);

          <button type="button" class="badge selo-status ${classeBadge}" data-orcstatus="${o.id}" title="${o.rascunho ? 'Clique para continuar preenchendo' : 'Clique para mudar o status'}">${escapeHtml(rotuloStatus)}${ic('baixo',12)}</button>

    }).join('');
    tbody.querySelectorAll('[data-ver]').forEach(b=>{
      b.addEventListener('click', ()=> abrirDetalheOrcamento(orcamentos.find(o=>o.id===b.dataset.ver)) );
    });
    ligarBotoesConversao(tbody);

    tbody.querySelectorAll('[data-editar]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const alvo = orcamentos.find(o=>o.id===b.dataset.editar);
        if(!podeEditarRegistro(alvo)){ showToast(motivoSemEdicao(alvo)); return; }
        orcamentoEmEdicao = alvo;
        currentTab = 'novo';
        renderTabs();
        renderView();
      });
    });
    tbody.querySelectorAll('[data-orcstatus]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const o = orcamentos.find(x=>x.id===b.dataset.orcstatus);
        if(o && o.rascunho){
          orcamentoEmEdicao = o;
          currentTab = 'novo';
          renderTabs();
          renderView();
        } else {
          mudarStatusOrcRapido(b.dataset.orcstatus);
        }
      });
    });
    tbody.querySelectorAll('[data-orcwa]').forEach(b=>{
      b.addEventListener('click', ()=> enviarWhatsAppOrcId(b.dataset.orcwa) );
    });
    tbody.querySelectorAll('[data-orcmail]').forEach(b=>{
      b.addEventListener('click', ()=> enviarEmailOrcId(b.dataset.orcmail) );
    });
    tbody.querySelectorAll('[data-excluir]').forEach(b=>{
      b.addEventListener('click', ()=> confirmarExcluirOrcamento(b.dataset.excluir) );
    });
  }
  draw();
  document.getElementById('fLoja').addEventListener('change', draw);
  document.getElementById('fStatus').addEventListener('change', draw);
  document.getElementById('fVendedora').addEventListener('change', draw);
  document.getElementById('fBusca').addEventListener('input', draw);
  const restringirPorLojaAtiva = currentUser && (currentUser.nivel==='vendedora' || currentUser.nivel==='oficina');
  if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id){
    const fLoja = document.getElementById('fLoja');
    fLoja.value = window.__lojaAtual.id;
    fLoja.title = 'Filtrando pela loja ativa — selecione outra loja ou "Todas as lojas" pra ver as demais.';
    draw();
  }
}

/* Mensagens do acompanhamento automático — uma pra cada "envio" (a 1ª leva de Aberto pra
 * Ação de fixação, a 2ª de Ação de fixação pra Prorrogado à ação, a 3ª fecha o ciclo). */
const MENSAGENS_AUTO_PADRAO = [
  'Olá {cliente}! Passando pra saber se ficou alguma dúvida sobre o seu orçamento na Vilaça Joias, no valor de {valor}. Posso ajudar a fechar?',
  'Olá {cliente}! Seu orçamento na Vilaça Joias, no valor de {valor}, já está em aberto há um tempinho. Podemos fechar?',
  'Olá {cliente}, seu orçamento na Vilaça Joias (valor {valor}) ainda está aberto — se ainda tiver interesse, é só chamar 💛',
];
/** Popup de escolha: WhatsApp ou e-mail. Desabilita o que o cliente não tiver cadastrado. */
function abrirPopupEnviarMensagemAuto(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  const auto = estagioAutoOrcamento(o);
  if(!auto || !auto.precisaEnviar) return;
  const temTel = !!o.telefone;
  const temEmail = !!o.email;
  openModal(`
    <h3>Enviar mensagem de acompanhamento</h3>
    <p class="modal-sub">${escapeHtml(o.cliente||'—')} · ${fmtMoeda(o.valorTotal)} · etapa ${escapeHtml(auto.nome)} (${auto.dias===1?'1 dia':auto.dias+' dias'} desde a criação)</p>
    <p style="margin:0 0 6px; font-size:13.5px;">Escolha por onde enviar. A mensagem já vai pronta com o nome do cliente e o valor.</p>
    <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
      <button class="btn btn-wa" id="btnEnvioAutoWA" ${temTel?'':'disabled'}>${waIconSvg(16)} Enviar pelo WhatsApp</button>
      <button class="btn btn-ghost" id="btnEnvioAutoEmail" ${temEmail?'':'disabled'}>${ic('email')} Enviar por e-mail</button>
    </div>
    ${!temTel ? `<p class="muted" style="color:var(--danger); margin-top:10px;">Sem WhatsApp no cadastro deste cliente. Edite o orçamento para incluir o telefone.</p>` : ''}
    ${!temEmail ? `<p class="muted" style="margin-top:6px;">Sem e-mail no cadastro deste cliente.</p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarEnvioAuto">Cancelar</button>
    </div>
  `);
  document.getElementById('btnCancelarEnvioAuto').addEventListener('click', closeModal);
  if(temTel){
    document.getElementById('btnEnvioAutoWA').addEventListener('click', async ()=>{
      if(!(await MarketingOff.permitir({ telefone:o.telefone, nome:o.cliente }))) return;
      const template = MENSAGENS_AUTO_PADRAO[Math.min(auto.N,2)];
      const msg = encodeURIComponent(montarMensagemStatus(o, template));
      const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      avancarEstagioAutoAposEnvio(o);
    });
  }
  if(temEmail){
    document.getElementById('btnEnvioAutoEmail').addEventListener('click', async ()=>{
      if(!(await MarketingOff.permitir({ telefone:o.telefone, nome:o.cliente }))) return;
      const template = MENSAGENS_AUTO_PADRAO[Math.min(auto.N,2)];
      const corpo = montarMensagemStatus(o, template);
      try{
        const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
          body: JSON.stringify({ to:o.email, subject:MENSAGEM_EMAIL_ASSUNTO_PADRAO, body:corpo, senha:__gatewaySenha })
        });
        if(!r.ok) throw new Error('falha no envio');
      }catch(e){ showToast('Não foi possível enviar o e-mail. Confira a internet e tente de novo.'); return; }
      avancarEstagioAutoAposEnvio(o);
    });
  }
}
async function avancarEstagioAutoAposEnvio(o){
  o.autoMensagensEnviadas = (o.autoMensagensEnviadas || 0) + 1;
  await orcamentoSalvar(o);
  closeModal();
  renderView();
  showToast('Mensagem enviada.');
}

async function enviarWhatsAppOrcId(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o || !o.telefone){ showToast('Este orçamento não tem telefone. Edite o orçamento e escolha o cliente com WhatsApp.'); return; }
  if(!(await MarketingOff.permitir({ telefone:o.telefone, nome:o.cliente }))) return;
  const info = statusInfoDe(o.status);
  const template = (info && info.mensagemWhatsapp) || MENSAGEM_WHATSAPP_PADRAO;
  const msg = encodeURIComponent(montarMensagemStatus(o, template));
  const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
async function enviarEmailOrcId(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o || !o.email){ showToast('Este orçamento não tem e-mail. Edite o cadastro do cliente para incluir.'); return; }
  if(!(await MarketingOff.permitir({ telefone:o.telefone, nome:o.cliente }))) return;
  const info = statusInfoDe(o.status);
  const assunto = montarMensagemStatus(o, (info && info.assuntoEmail) || MENSAGEM_EMAIL_ASSUNTO_PADRAO);
  const corpo = montarMensagemStatus(o, (info && info.mensagemEmail) || MENSAGEM_EMAIL_PADRAO);
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ to:o.email, subject:assunto, body:corpo, senha:__gatewaySenha })
    });
    if(!r.ok) throw new Error('falha no envio');
    showToast('E-mail enviado.');
  }catch(e){
    showToast('Não foi possível enviar o e-mail. Confira a internet e tente de novo.');
  }
}

/* ============================================================
   CONVERTER ORÇAMENTO → VENDA / PEDIDO
   Pede ao shell para abrir o PDV ou o Pedido/O.S. já com este orçamento; quem salva
   a venda/pedido grava no orçamento o "convertidoEm" e o status aprovado.
   ============================================================ */
function htmlConversaoOrcamento(o, compacto){
  if(!o) return '';
  if(o.convertidoEm){
    const tipo = o.convertidoEm.tipo==='pedido' ? 'Pedido' : 'Venda';
    return `<span class="badge badge-aprovado" style="white-space:nowrap;" title="${o.convertidoEm.data ? 'Em ' + escapeHtml(fmtDate(String(o.convertidoEm.data).slice(0,10))) : ''}">Convertido em ${tipo} ${escapeHtml(o.convertidoEm.codigo||'')}</span>`;
  }
  if(o.status==='recusado') return '';
  return compacto
    ? `<span class="sep" aria-hidden="true"></span><button type="button" class="btn-icone" data-converterorc="${o.id}" data-alvo="pdv" title="Converter em venda" aria-label="Converter em venda">${ic('carrinho')}</button><button type="button" class="btn-icone" data-converterorc="${o.id}" data-alvo="os" title="Converter em pedido" aria-label="Converter em pedido">${ic('recibo')}</button>`
    : `<button type="button" class="btn btn-ok" data-converterorc="${o.id}" data-alvo="pdv">${ic('carrinho')} Converter em venda</button><button type="button" class="btn btn-ghost" data-converterorc="${o.id}" data-alvo="os">${ic('recibo')} Converter em pedido</button>`;
}
function ligarBotoesConversao(raiz){
  (raiz||document).querySelectorAll('[data-converterorc]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); converterOrcamentoEm(b.dataset.converterorc, b.dataset.alvo); });
  });
}
function converterOrcamentoEm(orcId, alvo){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  if(o.convertidoEm){ showToast('Este orçamento já foi convertido.'); return; }
  if(window.parent===window){ showToast('Abra o sistema pelo menu principal para converter o orçamento.'); return; }
  { const ov = document.getElementById('modalOverlay'); if(ov && ov.classList.contains('show')) closeModal(); }
  parent.postMessage({ type:'irParaModulo', alvo: alvo==='os' ? 'os' : 'pdv', converterOrcamento: o.id }, '*');
}
