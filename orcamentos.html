          ${nFotos?`<span style="font-size:12px;color:var(--ink-faint);">📷${nFotos}</span>`:''}
          <div class="orc-compact-icones">
            <button class="orc-compact-btn ${temObs?'tem-obs':''}" data-obsToggle="${i}" title="${temObs?it.observacaoItem:'Observação'}">💬</button>
            <button class="orc-compact-btn" data-orceditar="${i}" title="Editar item">✏️</button>
            <button class="orc-compact-btn" data-orcitdel="${i}" title="Remover" style="color:var(--danger);">✕</button>
          </div>
        </div>
        ${temObs?`<div class="orc-compact-obs" id="orcObs_${i}">${escapeHtml(it.observacaoItem)}</div>`:'<div class="orc-compact-obs" id="orcObs_'+i+'"></div>'}`;
      } else {
        // ── LINHA COMPLETA (editando) ──
        const prod = it.produtoId ? (produtosEstoque||[]).find(p=>p.id===it.produtoId) : null;
        html += `
        <div class="orc-item-row" data-orcidx="${i}">
          <div class="orc-item-topo">
            <div class="orc-prod-wrap" style="flex:1;min-width:160px;" id="orcPacWrap_${i}">
              ${prod
                ? `<div class="orc-prod-sel"><b>${escapeHtml(prod.nome)}</b>${prod.fator?`<span class="orc-prod-fator">· Fator ${prod.fator}</span>`:''}<button type="button" class="pa-clr" data-orcpaclear="${i}">×</button></div>`
                : `<input class="orc-prod-input" id="orcPacInp_${i}" placeholder="Digite o produto..." autocomplete="off" data-orcpac="${i}" value="${escapeHtml(it.produto||'')}"><div class="orc-prod-drop" id="orcPacDrop_${i}" style="display:none;"></div>`}
            </div>
            <div class="orc-item-valor">
              <input type="number" min="0" step="0.01" placeholder="Valor" data-ival="${i}"
                value="${it.valorUnitario!==undefined&&it.valorUnitario!==''?it.valorUnitario:''}">
            </div>
            <button type="button" class="orc-item-add" data-orcadd="${i}" title="Confirmar e adicionar outro">＋</button>
            <button type="button" class="icon-btn" data-orcitdel="${i}">✕</button>
          </div>
          <div class="orc-item-obs">
            <input type="text" placeholder="Observação do item (opcional)" data-iobs="${i}"
              value="${escapeHtml(it.observacaoItem||'')}">
          </div>
          <div class="orc-item-fotos" id="orcFotos_${i}">
            ${(it.fotos||[]).map(f=>`<img class="orc-thumb" src="${escapeHtml(f.url)}" title="${escapeHtml(f.nome||'')}" onclick="window.open('${escapeHtml(f.url)}','_blank')">`).join('')}
            <label style="cursor:pointer;padding:5px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--accent,#662344);">
              📷 Foto/vídeo
              <input type="file" accept="image/*,video/*" multiple capture="environment" style="display:none;" data-orcfoto="${i}">
            </label>
          </div>
        </div>`;
      }
    });
    wrap.innerHTML = html;

    // ── WIRING ──
    // Autocomplete
    wrap.querySelectorAll('[data-orcpac]').forEach(inp=>ligarAutocompleteProd(Number(inp.dataset.orcpac)));
    // × limpa produto
    wrap.querySelectorAll('[data-orcpaclear]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.orcpaclear);
        itens[i].produtoId=''; itens[i].produto=''; itens[i].fator=''; itens[i].valorBase=''; itens[i].valorUnitario='';
        drawItens(); updateTotal();
      });
    });
    // Valor
    wrap.querySelectorAll('[data-ival]').forEach(inp=>{
      inp.addEventListener('input',()=>{ itens[Number(inp.dataset.ival)].valorUnitario=inp.value===''?'':parseFloat(inp.value); updateTotal(); });
    });
    // Obs item (linha completa)
    wrap.querySelectorAll('[data-iobs]').forEach(inp=>{
      inp.addEventListener('input',()=>{ itens[Number(inp.dataset.iobs)].observacaoItem=inp.value; });
    });
    // ＋ confirma → vira compacto + novo vazio no topo
    wrap.querySelectorAll('[data-orcadd]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.orcadd);
        if(!itens[i].produto&&!itens[i].valorUnitario) return;
        itens[i]._modo='ok';
        itens.splice(0,0,{ id:uid('oi'), produto:'', produtoId:'', fator:'', valorBase:'', valorUnitario:'', observacaoItem:'', fotos:[], _modo:'editar' });
        drawItens(); updateTotal();
      });
    });
    // ✏️ volta ao modo editar
    wrap.querySelectorAll('[data-orceditar]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.orceditar);
        itens[i]._modo='editar';
        drawItens(); updateTotal();
      });
    });
    // 💬 toggle observação
    wrap.querySelectorAll('[data-obsToggle]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.obsToggle);
        const box=document.getElementById('orcObs_'+i);
        if(box){ box.style.display=box.style.display==='block'?'none':'block'; }
      });
    });
    // ✕ remove
    wrap.querySelectorAll('[data-orcitdel]').forEach(b=>{
      b.addEventListener('click',()=>{
        itens.splice(Number(b.dataset.orcitdel),1);
        if(!itens.length) itens.push({ id:uid('oi'), produto:'', produtoId:'', fator:'', valorBase:'', valorUnitario:'', observacaoItem:'', fotos:[] });
        drawItens(); updateTotal();
      });
    });
    // Upload fotos
    wrap.querySelectorAll('[data-orcfoto]').forEach(inp=>{
      inp.addEventListener('change',async()=>{
        const i=Number(inp.dataset.orcfoto);
        if(!inp.files||!inp.files.length) return;
        const thumb=document.getElementById('orcFotos_'+i);
        if(thumb){ const prog=document.createElement('span'); prog.textContent='⏳ Enviando...'; thumb.appendChild(prog); }
        for(const file of inp.files){
          try{
            const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
            const resp=await fetch(SUPABASE_URL+'/functions/v1/upload-foto-drive',{
              method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
              body:JSON.stringify({ senha:__gatewaySenha, base64:b64, mimeType:file.type, fileName:'orc_'+Date.now()+'_'+file.name, folder:'orcamentos' })
            });
            const rj=await resp.json();
            if(rj.url){ itens[i].fotos=itens[i].fotos||[]; itens[i].fotos.push({ url:rj.url, nome:file.name }); }
          }catch(e){ showToast('Erro ao enviar '+file.name); }
        }
        drawItens(); updateTotal();
      });
    });
    updateTotal();
  }

  // ajuste total (desconto/acréscimo sobre o total)
  let ajusteTotal = editando ? (orcamentoEditando.ajusteTotal||{tipo:'nenhum',modo:'percentual',percVal:'',rVal:''}) : {tipo:'nenhum',modo:'percentual',percVal:'',rVal:''};

  function calcParcelamento(base){
    // 12x sem juros, arredondado PARA CIMA sem centavos
    return Math.ceil(base/12);
  }
  function updateTotal(){
    const subtotal = itens.reduce((acc,it)=> acc + (Number(it.valorUnitario)||0), 0);
    let totalFinal = subtotal;
    if(ajusteTotal.tipo!=='nenhum'){
      const qtd = Number(ajusteTotal.percVal||ajusteTotal.rVal)||0;
      const delta = ajusteTotal.modo==='percentual' ? subtotal*qtd/100 : qtd;
      totalFinal = Math.max(0, ajusteTotal.tipo==='desconto' ? subtotal-delta : subtotal+delta);
    }
    const parcela = calcParcelamento(subtotal); // sempre sobre o valor sem desconto
    const box = document.getElementById('totalHint');
    if(box) box.innerHTML = `
      <div class="orc-total-box">
        <div style="margin-bottom:4px;font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;">Subtotal</div>
        <div style="font-size:17px;font-weight:800;">${fmtMoeda(subtotal)}</div>
        <div class="orc-desc-btns" id="orcDescBtns">
          <span style="font-size:12px;font-weight:700;color:var(--ink-faint);">Ajuste:</span>
          <button type="button" class="orc-btn-ajuste ${ajusteTotal.tipo==='desconto'?'ativo-desc':''}" data-otipo="desconto">Desconto</button>
          <button type="button" class="orc-btn-ajuste ${ajusteTotal.tipo==='acrescimo'?'ativo-acr':''}" data-otipo="acrescimo">Acrésc.</button>
          <input type="number" class="orc-desc-campo" id="orcDescPerc" placeholder="%" value="${escapeHtml(String(ajusteTotal.percVal||''))}">
          <span class="orc-desc-sep">ou</span>
          <input type="number" class="orc-desc-campo" id="orcDescR" placeholder="R$" value="${escapeHtml(String(ajusteTotal.rVal||''))}">
        </div>
        ${ajusteTotal.tipo!=='nenhum' ? `
        <div style="margin-top:6px;font-size:15px;font-weight:800;color:${ajusteTotal.tipo==='desconto'?'#b91c1c':'#17794a'};">
          ${ajusteTotal.tipo==='desconto'?'Com desconto':'Com acréscimo'}: <b>${fmtMoeda(totalFinal)}</b>
        </div>` : ''}
        <div class="orc-parcela-box">12× ${fmtMoeda(parcela)} <span style="font-size:12px;font-weight:500;color:var(--ok,#17794a);">(sem juros, sobre o valor de tabela)</span></div>
      </div>
    `;
    // wiring dos controles de desconto total
    document.querySelectorAll('[data-otipo]').forEach(b=>{
      b.addEventListener('click',()=>{
        ajusteTotal.tipo=ajusteTotal.tipo===b.dataset.otipo?'nenhum':b.dataset.otipo;
        ajusteTotal.percVal=''; ajusteTotal.rVal=''; updateTotal();
      });
    });
    const dp=document.getElementById('orcDescPerc');
    const dr=document.getElementById('orcDescR');
    if(dp) dp.addEventListener('input',()=>{ ajusteTotal.percVal=dp.value; ajusteTotal.rVal=''; ajusteTotal.modo='percentual'; if(dr) dr.value=''; updateTotal(); });
    if(dr) dr.addEventListener('input',()=>{ ajusteTotal.rVal=dr.value; ajusteTotal.percVal=''; ajusteTotal.modo='valor'; if(dp) dp.value=''; updateTotal(); });
  }
  drawItens();
  // item adicionado pelo botão ＋ na linha (sem botão separado)

  // Guarda o registro completo do cliente escolhido, pra o ✎ abrir o cadastro preenchido.
  // Começa com o que já sabemos (do próprio orçamento) e, em segundo plano, tenta achar
  // o cadastro completo no banco pelo telefone — sem bloquear a tela esperando isso.
  // Autocomplete inline de cliente
  montarClienteAutocomplete(
    document.getElementById('o_clienteAcWrap'),
    (clienteFinal)=>{
      if(clienteFinal){
        document.getElementById('o_cliente').value=clienteFinal.nome||'';
        document.getElementById('o_telefone').value=clienteFinal.telefone||'';
        document.getElementById('o_email').value=clienteFinal.email||'';
      } else {
        document.getElementById('o_cliente').value='';
        document.getElementById('o_telefone').value='';
        document.getElementById('o_email').value='';
      }
    },
    editando?{nome:orcamentoEditando.cliente,telefone:orcamentoEditando.telefone,email:orcamentoEditando.email}:null
  );

  document.getElementById('btnSalvarOrcamento').addEventListener('click', async ()=>{
    const dataOrcamento = document.getElementById('o_data').value || todayStr();
    const lojaId = document.getElementById('o_loja').value;
    const vendedora = document.getElementById('o_vendedora').value;
    const validade = document.getElementById('o_validade').value;
    const cliente = maiusc(document.getElementById('o_cliente').value);
    const telefone = document.getElementById('o_telefone').value.trim();
    const email = document.getElementById('o_email').value.trim();
    const itensValidos = itens.filter(it=>it.produto||it.valorUnitario);
    if(!lojaId || !vendedora || !validade){ showToast('Preencha loja, vendedora e validade.'); return; }
    if(!cliente){ showToast('Informe o nome do cliente.'); return; }
    if(itensValidos.length===0){ showToast('Adicione ao menos um item com produto ou valor.'); return; }
    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    const valorTotal = itensValidos.reduce((acc,it)=> acc + (Number(it.valorUnitario)||0), 0);
    const orcamento = editando ? {
      ...orcamentoEditando,
      data: dataOrcamento, loja: loja?loja.nome:'', lojaId, vendedora, validade,
      cliente, telefone, email, itens: itensValidos, valorTotal, ajusteTotal,
      observacoes: maiusc(document.getElementById('o_obs').value),
      infoInterna: (document.getElementById('o_infoInterna')?.value||'').trim(),
      rascunho: false,
      // Editar um orçamento que já era "de verdade" (não um rascunho sendo concluído agora)
      // pausa o encerramento automático do prazo final (15 dias) — sinal de que alguém
      // está cuidando dele. Concluir um rascunho conta como criação, não como edição.
      editadoManualmente: orcamentoEditando.rascunho ? (orcamentoEditando.editadoManualmente||false) : true,
    } : {
      id: uid('orc'), loja: loja?loja.nome:'', lojaId, vendedora, validade,
      data: dataOrcamento, cliente, telefone, email, itens: itensValidos, valorTotal, ajusteTotal,
      observacoes: maiusc(document.getElementById('o_obs').value),
      infoInterna: (document.getElementById('o_infoInterna')?.value||'').trim(),
      status: statusInicialId(), criadoPor: currentUser.nome, criadoEm: Date.now(),
      codigoVia: await bumpCodigoVia('orcamento', lojaId||''),
      rascunho: false,
    };
    const ok = await orcamentoSalvar(orcamento);
    if(ok){
      if(editando){
        const idx = orcamentos.findIndex(x=>x.id===orcamento.id);
        if(idx>=0) orcamentos[idx] = orcamento; else orcamentos.unshift(orcamento);
        showToast('Orçamento atualizado.');
      } else {
        orcamentos.unshift(orcamento);
        showToast('Orçamento salvo.');
      }
      orcamentoEmEdicao = null;
      currentTab = 'lista'; renderTabs(); renderView();
    }
  });
}

/* ============================================================
   TELA DE NOVO / EDITAR ORÇAMENTO
   ============================================================ */
function renderNovo(main){
  const editando = !!orcamentoEmEdicao;
  const orcamentoEditando = orcamentoEmEdicao;
  const validadePadrao = new Date(); validadePadrao.setDate(validadePadrao.getDate()+7);
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;

  // Holder de itens — mesmo schema do O.S. para usar mountItens
  const orcItensHolder = { itens: editando
    ? (orcamentoEditando.itens||[]).map(it=>({
        id:it.id||uid('it'), produto:it.produto||'', metal:it.metal||'',
        quantidade:Number(it.quantidade)||1, valorUnitario:it.valorUnitario||'',
        produtoEstoqueId:it.produtoEstoqueId||'', precoOriginal:it.precoOriginal||'',
        ajusteTipo:it.ajusteTipo||'nenhum', ajusteModo:it.ajusteModo||'percentual',
        ajusteQtd:it.ajusteQtd||'', ajustePerc:it.ajustePerc||'', ajusteValR:it.ajusteValR||'',
        observacaoItem:it.observacaoItem||'', _modo:'ok'
      }))
    : [{ id:uid('it'), produto:'', metal:'', quantidade:1, valorUnitario:'',
         produtoEstoqueId:'', precoOriginal:'', ajusteTipo:'nenhum',
         ajusteModo:'percentual', ajusteQtd:'', ajustePerc:'', ajusteValR:'',
         observacaoItem:'', _modo:'editar' }]
  };

  let ajusteTotal = editando
    ? (orcamentoEditando.ajusteTotal||{tipo:'nenhum',modo:'percentual',percVal:'',rVal:''})
    : {tipo:'nenhum',modo:'percentual',percVal:'',rVal:''};

  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">${editando ? 'Editar orçamento' : 'Novo orçamento'}</h1>
      <p class="page-sub">Registre os itens e o valor estimado para o cliente.</p>
    </div>
    <div class="card">
      <div class="section-label">Cliente</div>
      <div id="o_clienteAcWrap"></div>
      <input type="hidden" id="o_cliente" value="${escapeHtml(editando?orcamentoEditando.cliente:'')}" >
      <input type="hidden" id="o_telefone" value="${escapeHtml(editando?orcamentoEditando.telefone:'')}" >
      <input type="hidden" id="o_email"    value="${escapeHtml(editando?orcamentoEditando.email:'')}" >
      <div class="grid-3" style="margin-top:14px;">
        <div class="field"><label>Loja</label>
          <select id="o_loja"><option value="">Selecione</option>${(config.lojas||[]).map(l=>`<option value="${l.id}" ${(editando?orcamentoEditando.lojaId:lojaAtiva)===l.id?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Vendedora</label>
          <select id="o_vendedora"><option value="">Selecione</option>${(config.funcionarios||[]).filter(f=>(f.cargos||[]).some(c=>['vendedora','gerente'].includes(c))||f.nivel==='gerente'||f.nivel==='diretoria').map(f=>`<option value="${escapeHtml(nomeExibicaoFuncionario(f))}" ${(editando?orcamentoEditando.vendedora:'')===nomeExibicaoFuncionario(f)?'selected':''}>${escapeHtml(nomeExibicaoFuncionario(f))}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Validade</label>
          <input type="date" id="o_validade" value="${editando?orcamentoEditando.validade:validadePadrao.toISOString().slice(0,10)}">
        </div>
      </div>
      <div class="field">
        <label>Data do orçamento</label>
        <input type="date" id="o_data" value="${editando?orcamentoEditando.data:todayStr()}">
      </div>
    </div>
    <div class="card"><div id="orcItensContainer"></div></div>
    <div class="card">
      <div class="field">
        <label>Observações</label>
        <textarea id="o_obs" rows="2" placeholder="Observações visíveis no orçamento...">${escapeHtml(editando?orcamentoEditando.observacoes:'')}</textarea>
      </div>
      <div class="info-interna-box" id="orcInfoInternaBox" style="display:${editando&&orcamentoEditando.infoInterna?'block':'none'};margin-top:10px;">
        <div class="info-interna-badge">🔒 Informação interna — visível só para usuários do sistema</div>
        <textarea id="o_infoInterna" placeholder="Anotações internas (não aparece para o cliente)...">${escapeHtml(editando?orcamentoEditando.infoInterna:'')}</textarea>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnToggleInfoInternaOrc" style="margin-top:8px;font-size:12px;">${editando&&orcamentoEditando.infoInterna?'🔒 − Ocultar informação interna':'🔒 + Adicionar informação interna'}</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      <button class="btn btn-accent" id="btnSalvarOrcamento">${editando ? 'Salvar alterações' : 'Salvar orçamento'}</button>
      <button class="btn btn-ghost" id="btnCancelarNovo">Cancelar</button>
    </div>
  `;
  // Autocomplete de cliente
  const clienteInicial = editando ? {nome:orcamentoEditando.cliente,telefone:orcamentoEditando.telefone,email:orcamentoEditando.email} : null;
  const acCliente = montarClienteAutocomplete(
    document.getElementById('o_clienteAcWrap'),
    (c)=>{
      if(c){ document.getElementById('o_cliente').value=c.nome||''; document.getElementById('o_telefone').value=c.telefone||''; document.getElementById('o_email').value=c.email||''; }
      else { document.getElementById('o_cliente').value=''; document.getElementById('o_telefone').value=''; document.getElementById('o_email').value=''; }
    },
    clienteInicial
  );

  document.getElementById('btnCancelarNovo').addEventListener('click', ()=>{ orcamentoEmEdicao=null; currentTab='lista'; renderTabs(); renderView(); });

  // Itens: mesma lógica do O.S. — autocomplete de produto + visual igual
  try {
    mountItens(document.getElementById('orcItensContainer'), orcItensHolder,
      ()=>(window.__lojaAtual ? window.__lojaAtual.id : ''));
  } catch(e){ console.error('mountItens orc:', e); }

  // Toggle info interna
  document.getElementById('btnToggleInfoInternaOrc').addEventListener('click',()=>{
    const box=document.getElementById('orcInfoInternaBox');
    const btn=document.getElementById('btnToggleInfoInternaOrc');
    const vis=box.style.display!=='none';
    box.style.display=vis?'none':'block';
    btn.textContent=vis?'🔒 + Adicionar informação interna':'🔒 − Ocultar informação interna';
    if(!vis) document.getElementById('o_infoInterna').focus();
  });

  document.getElementById('btnSalvarOrcamento').addEventListener('click', async ()=>{
    const dataOrcamento = document.getElementById('o_data').value || todayStr();
    const lojaId = document.getElementById('o_loja').value;
    const vendedora = document.getElementById('o_vendedora').value;
    const validade = document.getElementById('o_validade').value;
    const clienteAc = acCliente ? acCliente.getCliente() : null;
    const cliente = maiusc(clienteAc ? clienteAc.nome : document.getElementById('o_cliente').value);
    const telefone = clienteAc ? clienteAc.telefone||'' : document.getElementById('o_telefone').value;
    const email = clienteAc ? clienteAc.email||'' : document.getElementById('o_email').value;
    const itensValidos = (orcItensHolder.itens||[]).filter(it=>it._modo==='ok'&&it.produto);
    const valorTotal = itensValidos.reduce((acc,it)=>(acc+(Number(it.quantidade)||1)*(Number(it.valorUnitario)||0)),0);
    if(!lojaId || !vendedora || !validade){ showToast('Preencha loja, vendedora e validade.'); return; }
    if(!cliente){ showToast('Informe o nome do cliente.'); return; }
    if(itensValidos.length===0){ showToast('Adicione ao menos um item confirmado (clique em ＋).'); return; }
    if(!validade){ showToast('Preencha a validade do orçamento.'); return; }
    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    const orcamento = editando ? {
      ...orcamentoEditando,
      loja: loja?loja.nome:'', lojaId, vendedora, validade, data: dataOrcamento, cliente, telefone, email,
      itens: itensValidos, valorTotal, ajusteTotal,
      observacoes: maiusc(document.getElementById('o_obs').value),
      infoInterna: (document.getElementById('o_infoInterna')?.value||'').trim(),
      editadoManualmente: true,
    } : {
      id: uid('orc'), loja: loja?loja.nome:'', lojaId, vendedora, validade,
      data: dataOrcamento, cliente, telefone, email, itens: itensValidos, valorTotal, ajusteTotal,
      observacoes: maiusc(document.getElementById('o_obs').value),
      infoInterna: (document.getElementById('o_infoInterna')?.value||'').trim(),
      status: statusInicialId(), criadoPor: currentUser.nome, criadoEm: Date.now(),
      codigoVia: await bumpCodigoVia('orcamento', lojaId||''),
      rascunho: false,
    };
    const ok = await orcamentoSalvar(orcamento);
    if(ok){
      if(editando){ const idx=orcamentos.findIndex(x=>x.id===orcamento.id); if(idx>=0) orcamentos[idx]=orcamento; else orcamentos.unshift(orcamento); showToast('Orçamento atualizado.'); }
      else { orcamentos.unshift(orcamento); showToast('Orçamento salvo.'); }
      orcamentoEmEdicao = null;
      currentTab='lista'; renderTabs(); renderView();
    }
  });
}

function unidadeEstoqueLabel(u){ return u==='g' ? 'g' : u==='kg' ? 'kg' : 'un'; }

function mountItens(container, holder, getLojaId){
  if(!holder.itens) holder.itens = [];
  getLojaId = getLojaId || (()=>'');

  function totalItens(){ return holder.itens.reduce((acc,it)=> acc + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0), 0); }

  /** Recalcula valorUnitario a partir do preço original + desconto/acréscimo (se algum
   * ajuste estiver configurado). Se não houver ajuste, não mexe no que já está lá — a
   * pessoa ainda pode digitar o valor unitário na mão, direto. */
  /* Recalcula o valor final após um ajuste de desconto/acréscimo via botões.
   Atualiza o campo de valor e o span de total inline sem redesenhar a linha. */
function recalcularAjusteNovo(it, idx, row){
  if(it.ajusteTipo==='nenhum'||it.ajusteQtd===''||it.ajusteQtd==null){ return; }
  const base = Number(it.precoOriginal)||0;
  if(!base) return;
  const qtd = Number(it.ajusteQtd)||0;
  const delta = it.ajusteModo==='percentual' ? base*qtd/100 : qtd;
  it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
  const inpVal=row ? row.querySelector('[data-itfield="valorUnitario"]') : null;
  if(inpVal) inpVal.value=Number(it.valorUnitario).toFixed(2);
  const span=document.getElementById('descTotal_'+idx);
  if(span) span.textContent='= R$ '+Number(it.valorUnitario).toFixed(2);
  updateTotalHint();
}
function recalcularValorAjustado(it){
    if(it.ajusteTipo==='desconto' || it.ajusteTipo==='acrescimo'){
      const base = Number(it.precoOriginal)||0;
      const qtdAjuste = Number(it.ajusteQtd)||0;
      const delta = it.ajusteModo==='percentual' ? base*qtdAjuste/100 : qtdAjuste;
      it.valorUnitario = Math.max(0, it.ajusteTipo==='desconto' ? base-delta : base+delta);
    }
  }
  function outrasLojasComEstoque(produto, lojaAtualId){
    const porLoja = (produto && produto.estoquePorLoja) || {};
    return (config.lojas||[]).filter(l=> l.id!==lojaAtualId && (Number(porLoja[l.id])||0) > 0)
      .map(l=> `${l.abreviacao} (${Number(porLoja[l.id])||0})`);
  }

  function draw(){
    container.innerHTML = `
      <div class="section-label">Itens do orçamento</div>
      <div id="itensRows"></div>
      <div class="muted" id="itensTotalHint" style="margin-top:8px;"></div>
    `;
    drawRows();
  }
  function drawRows(){
    const wrap = container.querySelector('#itensRows');
    const vendaveis = (produtosEstoque||[]).filter(p=>p.vendavel!==false);
    const lojaAtual = getLojaId();
    if(vendaveis.length===0){
      wrap.innerHTML = `<div class="empty" style="padding:16px;">Nenhum produto cadastrado ainda — cadastre em <b>Cadastro → Produtos</b> antes de lançar uma venda.</div>`;
      return;
    }
    let __html='';
    holder.itens.forEach((it,i)=>{
      if(it._modo==='ok'){
        const temObs=!!(it.observacaoItem||'').trim();
        const descInfo=it.ajusteTipo!=='nenhum'&&it.valorUnitario!==''&&it.valorUnitario!=null
          ?` (${it.ajusteTipo==='desconto'?'−':'+'}${it.ajustePerc?it.ajustePerc+'%':('R$ '+it.ajusteValR)})`:'';
        __html+=`<div class="venda-item-compact" data-idx="${i}">
          <span class="venda-compact-nome" title="${escapeHtml(it.produto||'')}">${escapeHtml(it.produto||'Item')}</span>
          <span class="venda-compact-val">${it.valorUnitario!==''&&it.valorUnitario!=null?'R$ '+Number(it.valorUnitario).toFixed(2):''}${escapeHtml(descInfo)}</span>
          <div class="venda-compact-icones">
            ${temObs?`<button class="venda-compact-btn tem-obs" data-itobstoggle="${i}" title="${escapeHtml(it.observacaoItem)}">💬</button>`:''}
            <button class="venda-compact-btn" data-iteditar="${i}" title="Editar">✏️</button>
            <button class="venda-compact-btn" data-itdel="${i}" title="Remover" style="color:var(--danger);">✕</button>
          </div>
        </div>
        <div class="venda-compact-obs" id="vendaObs_${i}">${temObs?escapeHtml(it.observacaoItem):''}</div>`;
      } else {
        const produtoAtual=it.produtoEstoqueId?vendaveis.find(p=>p.id===it.produtoEstoqueId):null;
        const estoqueAqui=produtoAtual?(Number((produtoAtual.estoquePorLoja||{})[lojaAtual])||0):null;
        const outras=produtoAtual?outrasLojasComEstoque(produtoAtual,lojaAtual):[];
        __html+=`<div class="item-row" data-idx="${i}">
          <div class="item-row-topo">
            <div class="prod-ac-wrap item-row-produto" id="pacWrap_${i}">
              ${produtoAtual
                ?`<div class="prod-ac-sel">
                     <b title="${escapeHtml(produtoAtual.nome)}">${escapeHtml(produtoAtual.nome)}</b>
                     ${produtoAtual.fator!=null&&produtoAtual.fator!==''?`<span class="prod-ac-fator-inline">· Fator ${produtoAtual.fator}</span>`:''}
                     <button type="button" class="pa-clr" data-paclear="${i}" title="Trocar produto">×</button>
                   </div>`
                :`<input class="prod-ac-input" id="pacInp_${i}" placeholder="Nome, código, tipo, fornecedor ou bipe o código de barras..." autocomplete="off" spellcheck="false" data-pac="${i}">
                   <div class="prod-ac-drop" id="pacDrop_${i}" style="display:none;"></div>`}
            </div>
            <div class="item-row-valor">
              <input type="number" min="0" step="0.01" data-itfield="valorUnitario" placeholder="0,00"
                value="${it.valorUnitario!==undefined&&it.valorUnitario!==''?it.valorUnitario:''}">
            </div>
            <div class="item-row-desc">
              <button type="button" class="btn-ajuste ${it.ajusteTipo==='desconto'?'ativo-desc':''}" data-aidbtn="desconto" data-idx2="${i}">Desc.</button>
              <button type="button" class="btn-ajuste ${it.ajusteTipo==='acrescimo'?'ativo-acr':''}" data-aidbtn="acrescimo" data-idx2="${i}">Acrés.</button>
              <input type="number" min="0" step="0.01" class="campo-perc" data-itfield="ajustePerc" placeholder="%" title="Percentual"
                value="${it.ajustePerc!==undefined&&it.ajustePerc!==''?it.ajustePerc:''}">
              <span class="desc-sep">ou</span>
              <input type="number" min="0" step="0.01" class="campo-val" data-itfield="ajusteValR" placeholder="R$" title="Valor em reais"
                value="${it.ajusteValR!==undefined&&it.ajusteValR!==''?it.ajusteValR:''}">
              <span class="desc-total" id="descTotal_${i}">${(()=>{
                if(it.ajusteTipo!=='nenhum'&&it.valorUnitario!==''&&it.valorUnitario!=null) return '= R$ '+Number(it.valorUnitario).toFixed(2);
                return '';
              })()}</span>
            </div>
            <button type="button" class="btn-add-item" data-itadd="${i}" title="Confirmar este item e adicionar outro">Adicionar</button>
            <button type="button" class="icon-btn" data-itdel="${i}" title="Remover">✕</button>
          </div>
          ${produtoAtual?`
          <div class="item-row-estoque">
            <span class="muted" style="font-size:12px;">📦 <b>${estoqueAqui}</b> ${escapeHtml(unidadeEstoqueLabel(produtoAtual.unidade))} nesta loja</span>
            ${outras.length>0?`<span class="muted" style="font-size:12px;">· também tem em: ${outras.join(', ')}</span>`:`<span class="muted" style="font-size:12px;">· sem estoque em outras lojas</span>`}
          </div>
          ${estoqueAqui<=0&&outras.length>0?`
          <div style="margin-top:6px;padding:8px 10px;background:var(--wait-soft,#fceedc);border:1px solid var(--wait,#b45309);border-radius:8px;font-size:12.5px;color:var(--wait,#b45309);font-weight:600;">
            ⚠️ Sem estoque nesta loja, mas <b>tem em ${outras.join(', ')}</b>.
            <div style="font-weight:500;margin-top:3px;">A peça é de outro CNPJ — verifique com a gerência a baixa de estoque correta.</div>
          </div>`:''}
          `:''}
          <div class="item-row-obs">
            <input type="text" data-itfield="observacaoItem" placeholder="Observação do item (opcional)"
              value="${escapeHtml(it.observacaoItem||'')}">
          </div>
        </div>`;
      }
    });
    wrap.innerHTML=__html;

    // ── Autocomplete de produto ──
    wrap.querySelectorAll('[data-pac]').forEach(inp=>{
      const i = Number(inp.dataset.pac);
      const drop = document.getElementById('pacDrop_'+i);
      let pacTimer=null, pacFocus=-1, pacAchados=[];
      function fecharDrop(){ drop.style.display='none'; pacFocus=-1; }
      function renderDrop(lista){
        pacAchados=lista;
        if(!lista.length){ drop.innerHTML='<div class="prod-ac-item" style="color:var(--ink-faint);">Nenhum produto encontrado.</div>'; drop.style.display='block'; return; }
        drop.innerHTML=lista.map((p,k)=>`<div class="prod-ac-item" data-pk="${k}"><b>${escapeHtml(p.nome)}</b><span>${[p.codigo?'Cód. '+p.codigo:null,p.fator!=null&&p.fator!==''?'Fator '+p.fator:null,p.tipo||null,p.fornecedor||null,p.precoVenda!=null?'R$ '+Number(p.precoVenda).toFixed(2):null].filter(Boolean).join(' · ')}</span></div>`).join('');
        drop.style.display='block';
        drop.querySelectorAll('.prod-ac-item[data-pk]').forEach(el=>{
          el.addEventListener('mouseover',()=>{ pacFocus=Number(el.dataset.pk); drop.querySelectorAll('.prod-ac-item').forEach((e,k)=>e.classList.toggle('pf',k===pacFocus)); });
          el.addEventListener('mousedown',e=>{ e.preventDefault(); selecionarProduto(i,pacAchados[Number(el.dataset.pk)]); });
        });
      }
      inp.addEventListener('input',()=>{ clearTimeout(pacTimer); pacTimer=setTimeout(()=>{
        const t=inp.value.toLowerCase().trim();
        if(!t){ fecharDrop(); return; }
        const codigoExato=/^\d{6,}$/.test(inp.value.trim());
        if(codigoExato){
          const porCod=vendaveis.find(p=>(p.codigoBarras&&String(p.codigoBarras).trim()===inp.value.trim())||(p.codigo&&String(p.codigo).trim()===inp.value.trim()));
          if(porCod){ selecionarProduto(i,porCod); fecharDrop(); return; }
        }
        renderDrop(vendaveis.filter(p=>{
          const campos=[p.nome,p.codigo,p.codigoBarras,String(p.fator||''),p.tipo,p.fornecedor];
          return campos.some(c=>c&&String(c).toLowerCase().includes(t));
        }).slice(0,15));
      },120); });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.prod-ac-item[data-pk]');
        if(!items.length) return;
        if(e.key==='ArrowDown'){ e.preventDefault(); pacFocus=Math.min(pacFocus+1,items.length-1); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); pacFocus=Math.max(pacFocus-1,0); items.forEach((el,k)=>el.classList.toggle('pf',k===pacFocus)); }
        else if(e.key==='Enter'){ e.preventDefault();
          if(pacFocus>=0) selecionarProduto(i,pacAchados[pacFocus]);
          else if(pacAchados.length===1) selecionarProduto(i,pacAchados[0]);
        }
        else if(e.key==='Escape'){ fecharDrop(); }
      });
      inp.addEventListener('blur',()=>{ setTimeout(fecharDrop,150); });
      inp.focus();
    });
    // ＋ confirma → compacto + nova linha vazia
    wrap.querySelectorAll('[data-itadd]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.itadd);
        const it=holder.itens[idx];
        if(!it.produtoEstoqueId&&!it.valorUnitario) return;
        it._modo='ok';
        holder.itens.splice(0,0,{id:uid('it'),produto:'',metal:'',quantidade:1,valorUnitario:'',produtoEstoqueId:'',precoOriginal:'',ajusteTipo:'nenhum',ajusteModo:'percentual',ajusteQtd:'',ajustePerc:'',ajusteValR:'',observacaoItem:'',_modo:'editar'});
        drawRows(); updateTotalHint();
      });
    });
    // ✏️ volta ao modo editar
    wrap.querySelectorAll('[data-iteditar]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        holder.itens[Number(btn.dataset.iteditar)]._modo='editar';
        drawRows(); updateTotalHint();
      });
    });
    // 💬 toggle obs
    wrap.querySelectorAll('[data-itobstoggle]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const box=document.getElementById('vendaObs_'+btn.dataset.itobstoggle);
        if(box) box.style.display=box.style.display==='block'?'none':'block';
      });
    });

    // Botão × limpa produto
    wrap.querySelectorAll('[data-paclear]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.paclear);
        const it=holder.itens[i];
        it.produtoEstoqueId=''; it.produto=''; it.precoOriginal=''; it.valorUnitario=''; it.ajusteTipo='nenhum'; it.ajusteQtd='';
        drawRows(); updateTotalHint();
      });
    });

    // ── Botões Desconto / Acréscimo ──
    wrap.querySelectorAll('[data-aidbtn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=Number(btn.dataset.idx2);
        const it=holder.itens[idx];
        const tipo=btn.dataset.aidbtn;
        // toggle: clicar no mesmo botão ativo desativa
        it.ajusteTipo = it.ajusteTipo===tipo ? 'nenhum' : tipo;
        // atualiza aparência dos botões sem redesenhar a linha inteira
        const row=wrap.querySelector('[data-idx="'+idx+'"]');
        row.querySelectorAll('[data-aidbtn]').forEach(b=>{
          b.classList.remove('ativo-desc','ativo-acr');
          if(it.ajusteTipo==='desconto'&&b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
          if(it.ajusteTipo==='acrescimo'&&b.dataset.aidbtn==='acrescimo') b.classList.add('ativo-acr');
        });
        if(it.ajusteTipo==='nenhum'){
          it.ajustePerc=''; it.ajusteValR='';
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          // restaura valor original
          if(it.precoOriginal!==''&&it.precoOriginal!=null){
            it.valorUnitario=it.precoOriginal;
            const inpVal=row.querySelector('[data-itfield="valorUnitario"]');
            if(inpVal) inpVal.value=Number(it.precoOriginal).toFixed(2);
          }
          updateTotalHint();
        } else {
          recalcularAjusteNovo(it, idx, row);
        }
      });
    });

    // ── Campos de valor e desconto ──
    wrap.querySelectorAll('[data-itfield]').forEach(el=>{
      el.addEventListener('input',()=>{
        const row=el.closest('[data-idx]');
        const idx=Number(row.dataset.idx);
        const field=el.dataset.itfield;
        const it=holder.itens[idx];

        if(field==='valorUnitario'){
          it.valorUnitario=el.value===''?'':parseFloat(el.value);
          it.precoOriginal=it.valorUnitario;
          // limpa desconto ao editar valor manualmente
          it.ajustePerc=''; it.ajusteValR=''; it.ajusteTipo='nenhum';
          row.querySelectorAll('[data-aidbtn]').forEach(b=>b.classList.remove('ativo-desc','ativo-acr'));
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          const span=document.getElementById('descTotal_'+idx); if(span) span.textContent='';
          updateTotalHint(); return;
        }
        if(field==='ajustePerc'){
          it.ajustePerc=el.value===''?'':parseFloat(el.value);
          it.ajusteValR='';
          it.ajusteModo='percentual'; it.ajusteQtd=it.ajustePerc;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajustePerc!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cv=row.querySelector('[data-itfield="ajusteValR"]'); if(cv) cv.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='ajusteValR'){
          it.ajusteValR=el.value===''?'':parseFloat(el.value);
          it.ajustePerc='';
          it.ajusteModo='valor'; it.ajusteQtd=it.ajusteValR;
          // Se não clicou em nenhum botão, ativa desconto automaticamente ao digitar
          if(it.ajusteTipo==='nenhum' && it.ajusteValR!==''){
            it.ajusteTipo='desconto';
            row.querySelectorAll('[data-aidbtn]').forEach(b=>{
              b.classList.remove('ativo-desc','ativo-acr');
              if(b.dataset.aidbtn==='desconto') b.classList.add('ativo-desc');
            });
          }
          const cp=row.querySelector('[data-itfield="ajustePerc"]'); if(cp) cp.value='';
          recalcularAjusteNovo(it, idx, row); return;
        }
        if(field==='observacaoItem'){ it.observacaoItem=el.value; return; }
        it[field]=el.value; updateTotalHint();
      });
    });
    wrap.querySelectorAll('[data-itdel]').forEach(b=>{
      b.addEventListener('click',()=>{ holder.itens.splice(Number(b.dataset.itdel),1); drawRows(); updateTotalHint(); });
    });
    updateTotalHint();
  }

  // Seleciona produto pelo autocomplete
  function selecionarProduto(idx, produto){
    const it=holder.itens[idx];
    it.produtoEstoqueId=produto.id; it.produto=produto.nome;
    it.precoOriginal=produto.precoVenda!=null?produto.precoVenda:'';
    if(it.valorUnitario===''||it.valorUnitario==null) it.valorUnitario=it.precoOriginal||'';
    drawRows();
    // Foca no campo de valor após selecionar produto
    setTimeout(()=>{
      const row=container.querySelector('[data-idx="'+idx+'"]');
      if(row){ const v=row.querySelector('[data-itfield="valorUnitario"]'); if(v) v.focus(); }
    },50);
    updateTotalHint();
  }
  function updateTotalHint(){
    const hint = container.querySelector('#itensTotalHint');
    if(hint) hint.innerHTML = `Total dos itens: <b>R$ ${totalItens().toFixed(2)}</b> <span class="muted">(você pode ajustar o valor total do pagamento manualmente se houver desconto/acréscimo)</span>`;
    // Avisa o bloco de pagamento para recalcular o total
    if(typeof window.__pagRedraw==='function') window.__pagRedraw();
  }
  draw();
  return { totalItens, refreshEstoque: drawRows };
}

      <select id="fStatus">

        <option value="__vencido__">Vencidos (sem decisão)</option>
      </select>
      <select id="fVendedora">
        <option value="">Todas as vendedoras</option>
        ${[...new Set(orcamentos.map(o=>o.vendedora).filter(Boolean))].sort().map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('')}
      </select>
      <input type="text" id="fBusca" placeholder="Buscar cliente...">
    </div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <table id="tabelaOrc">
        <thead><tr><th>Cliente</th><th>Loja</th><th>Vendedora</th><th>Data</th><th>Validade</th><th>Valor</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead>
        <tbody id="tbodyOrc"></tbody>
      </table>
    </div>
  `;
  const btnNovo = document.getElementById('btnNovoOrcamento');
  if(btnNovo){
    btnNovo.addEventListener('click', ()=>{ orcamentoEmEdicao = null; currentTab = 'novo'; renderTabs(); renderView(); });
  }
  document.getElementById('btnConfigMsgAuto').addEventListener('click', abrirConfigMsgAuto);
  document.querySelectorAll('[data-filtrovend]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.getElementById('fVendedora').value = b.dataset.filtrovend;
      document.getElementById('fStatus').value = '';
      draw();
      document.getElementById('tabelaOrc').scrollIntoView({ behavior:'smooth', block:'center' });
    });
  });
  function draw(){
    const lojaFiltro = document.getElementById('fLoja').value;
    const statusFiltro = document.getElementById('fStatus').value;
    const vendedoraFiltro = document.getElementById('fVendedora').value;
    const busca = document.getElementById('fBusca').value.trim().toLowerCase();
    const lista = orcamentos.filter(o=>{
      if(lojaFiltro && o.lojaId!==lojaFiltro) return false;
      if(statusFiltro==='__vencido__' && !estaVencido(o)) return false;
      if(statusFiltro && statusFiltro!=='__vencido__' && o.status!==statusFiltro) return false;
      if(vendedoraFiltro && o.vendedora!==vendedoraFiltro) return false;
      if(busca && !(o.cliente||'').toLowerCase().includes(busca)) return false;
      return true;
    }).slice().reverse();
    const tbody = document.getElementById('tbodyOrc');
    if(lista.length===0){ tbody.innerHTML = `<tr><td colspan="8" class="empty">Nenhum orçamento encontrado.</td></tr>`; return; }
    // Aplica o encerramento automático (prazo final) antes de desenhar, se algum já bateu o prazo.
    lista.forEach(o=> aplicarPrazoFinalAutoSeNecessario(o));
    tbody.innerHTML = lista.map(o=>{
      const info = statusInfoDe(o.status);
      const auto = estagioAutoOrcamento(o);
      let classeBadge, rotuloStatus;
      if(o.rascunho){ classeBadge = 'badge-rascunho'; rotuloStatus = 'Rascunho'; }
      else if(auto){ classeBadge = auto.cor==='vermelho' ? 'badge-vencido' : (auto.cor==='verde' ? 'badge-aprovado' : 'badge-pendente'); rotuloStatus = auto.nome; }
      else if(info && info.encerra){ classeBadge = (o.status==='recusado') ? 'badge-vencido' : 'badge-aprovado'; rotuloStatus = info.nome; }
      else { classeBadge = 'badge-pendente'; rotuloStatus = info ? info.nome : o.status; }
      // No lugar dos ícones de WhatsApp/e-mail: aviso discreto de mensagem pendente/enviada.
      let acaoMsgHtml;
      if(auto && auto.precisaEnviar){
        acaoMsgHtml = `<button class="link-msg-auto" data-enviarmsgauto="${o.id}" title="Enviar mensagem de acompanhamento">✉️ Enviar mensagem</button>`;
      } else if(auto && auto.enviadoRecente){
        acaoMsgHtml = `<span class="msg-enviada-tag" title="Mensagem já enviada nesta etapa">✓ Mensagem enviada</span>`;
      } else {
        acaoMsgHtml = `${o.telefone ? `<button class="icon-btn icon-btn-wa" data-orcwa="${o.id}" title="WhatsApp">${waIconSvg()}</button>` : ''}${o.email ? `<button class="icon-btn" data-orcmail="${o.id}" title="E-mail">✉️</button>` : ''}`;
      }
      return `<tr>
        <td>${escapeHtml(o.cliente)}</td>
        <td><span class="badge badge-loja">${escapeHtml(o.loja||'—')}</span></td>
        <td>${escapeHtml(o.vendedora)}</td>
        <td>${fmtDate(o.data)}</td>
        <td>${fmtDate(o.validade)}</td>
        <td>${fmtMoeda(o.valorTotal)}</td>
        <td>
          <span class="badge ${classeBadge}" data-orcstatus="${o.id}" title="${o.rascunho ? 'Clique para continuar preenchendo' : 'Clique para mudar o status'}" style="cursor:pointer;">${escapeHtml(rotuloStatus)}</span>
        </td>
        <td style="white-space:nowrap; text-align:right;">
          <div style="display:inline-flex; align-items:center; justify-content:flex-end; gap:4px;">
            ${acaoMsgHtml}
            <button class="btn btn-ghost btn-sm" data-ver="${o.id}" title="Ver detalhes e ações">👁️ Ver</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('[data-ver]').forEach(b=>{
      b.addEventListener('click', ()=> abrirDetalheOrcamento(orcamentos.find(o=>o.id===b.dataset.ver)) );
    });
    tbody.querySelectorAll('[data-enviarmsgauto]').forEach(b=>{
      b.addEventListener('click', ()=> abrirPopupEnviarMensagemAuto(b.dataset.enviarmsgauto) );
    });
    // data-excluir foi movido para dentro do modal (botão no detalhe)
    tbody.querySelectorAll('[data-editar]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const alvo = orcamentos.find(o=>o.id===b.dataset.editar);
        if(!podeEditarRegistro(alvo)){ showToast(motivoSemEdicao(alvo)); return; }
        orcamentoEmEdicao = alvo;
        currentTab = 'novo';
        renderTabs();
        renderView();
      });
    });
    tbody.querySelectorAll('[data-orcstatus]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const o = orcamentos.find(x=>x.id===b.dataset.orcstatus);
        if(o && o.rascunho){
          orcamentoEmEdicao = o;
          currentTab = 'novo';
          renderTabs();
          renderView();
        } else {
          mudarStatusOrcRapido(b.dataset.orcstatus);
        }
      });
    });
    tbody.querySelectorAll('[data-orcwa]').forEach(b=>{
      b.addEventListener('click', ()=> enviarWhatsAppOrcId(b.dataset.orcwa) );
    });
    tbody.querySelectorAll('[data-orcmail]').forEach(b=>{
      b.addEventListener('click', ()=> enviarEmailOrcId(b.dataset.orcmail) );
    });
    tbody.querySelectorAll('[data-excluir]').forEach(b=>{
      b.addEventListener('click', ()=> confirmarExcluirOrcamento(b.dataset.excluir) );
    });
  }
  draw();
  document.getElementById('fLoja').addEventListener('change', draw);
  document.getElementById('fStatus').addEventListener('change', draw);
  document.getElementById('fVendedora').addEventListener('change', draw);
  document.getElementById('fBusca').addEventListener('input', draw);
  const restringirPorLojaAtiva = currentUser && (currentUser.nivel==='vendedora' || currentUser.nivel==='oficina');
  if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id){
    const fLoja = document.getElementById('fLoja');
    fLoja.value = window.__lojaAtual.id;
    fLoja.title = 'Filtrando pela loja ativa — selecione outra loja ou "Todas as lojas" pra ver as demais.';
    draw();
  }
}

/* Ações rápidas direto na linha da lista (mesmo padrão usado no módulo Marketing):
 * mudar status, WhatsApp e e-mail sem precisar abrir o detalhe completo. */
async function mudarStatusOrcRapido(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  openModal(`
    <h3 style="margin:0 0 16px;">Mudar status — ${escapeHtml(o.cliente||'—')}</h3>
    <div class="field"><label>Novo status</label>
      <select id="novoStatusSelRapido">${statusList().map(s=>`<option value="${s.id}" ${s.id===o.status?'selected':''}>${escapeHtml(s.nome)}${s.encerra?' (encerra)':''}</option>`).join('')}</select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnSalvarStatusRapido">Salvar</button>
      <button class="btn btn-ghost" id="btnCancelarStatusRapido">Cancelar</button>
    </div>
  `);
  document.getElementById('btnCancelarStatusRapido').addEventListener('click', closeModal);
  document.getElementById('btnSalvarStatusRapido').addEventListener('click', async ()=>{
    o.status = document.getElementById('novoStatusSelRapido').value;
    o.rascunho = false;
    reiniciarAutoAposMudancaManual(o);
    const ok = await orcamentoSalvar(o);
    if(ok){ closeModal(); renderView(); showToast('Status atualizado.'); }
  });
}
/* Mensagens do acompanhamento automático — uma pra cada "envio" (a 1ª leva de Aberto pra
 * Ação de fixação, a 2ª de Ação de fixação pra Prorrogado à ação, a 3ª fecha o ciclo). */
const MENSAGENS_AUTO_PADRAO = [
  'Olá {cliente}! Passando pra saber se ficou alguma dúvida sobre o seu orçamento na Vilaça Joias, no valor de {valor}. Posso ajudar a fechar?',
  'Olá {cliente}! Seu orçamento na Vilaça Joias, no valor de {valor}, já está em aberto há um tempinho. Podemos fechar?',
  'Olá {cliente}, seu orçamento na Vilaça Joias (valor {valor}) ainda está aberto — se ainda tiver interesse, é só chamar 💛',
];
/** Popup de escolha: WhatsApp ou e-mail. Desabilita o que o cliente não tiver cadastrado. */
function abrirPopupEnviarMensagemAuto(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  const auto = estagioAutoOrcamento(o);
  if(!auto || !auto.precisaEnviar) return;
  const temTel = !!o.telefone;
  const temEmail = !!o.email;
  openModal(`
    <h3 style="margin:0 0 6px;">Enviar mensagem — ${escapeHtml(o.cliente||'—')}</h3>
    <p class="muted" style="margin-top:0;">Lembrete de acompanhamento (${escapeHtml(auto.nome)}). Escolha por onde enviar:</p>
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
      <button class="btn btn-wa" id="btnEnvioAutoWA" ${temTel?'':'disabled'} style="${temTel?'':'opacity:.45; cursor:not-allowed;'}">${waIconSvg(16)} WhatsApp</button>
      <button class="btn btn-accent" id="btnEnvioAutoEmail" ${temEmail?'':'disabled'} style="${temEmail?'':'opacity:.45; cursor:not-allowed;'}">✉️ E-mail</button>
    </div>
    ${!temTel ? `<p style="color:var(--danger); font-size:13px; margin-top:10px;">Este cliente não tem WhatsApp cadastrado.</p>` : ''}
    ${!temEmail ? `<p style="color:var(--danger); font-size:13px; margin-top:4px;">Este cliente não tem e-mail cadastrado.</p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarEnvioAuto">Cancelar</button>
    </div>
  `);
  document.getElementById('btnCancelarEnvioAuto').addEventListener('click', closeModal);
  if(temTel){
    document.getElementById('btnEnvioAutoWA').addEventListener('click', ()=>{
      const template = MENSAGENS_AUTO_PADRAO[Math.min(auto.N,2)];
      const msg = encodeURIComponent(montarMensagemStatus(o, template));
      const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      avancarEstagioAutoAposEnvio(o);
    });
  }
  if(temEmail){
    document.getElementById('btnEnvioAutoEmail').addEventListener('click', async ()=>{
      const template = MENSAGENS_AUTO_PADRAO[Math.min(auto.N,2)];
      const corpo = montarMensagemStatus(o, template);
      try{
        const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
          body: JSON.stringify({ to:o.email, subject:MENSAGEM_EMAIL_ASSUNTO_PADRAO, body:corpo, senha:__gatewaySenha })
        });
        if(!r.ok) throw new Error('falha no envio');
      }catch(e){ showToast('Falha ao enviar e-mail.'); return; }
      avancarEstagioAutoAposEnvio(o);
    });
  }
}
async function avancarEstagioAutoAposEnvio(o){
  o.autoMensagensEnviadas = (o.autoMensagensEnviadas || 0) + 1;
  await orcamentoSalvar(o);
  closeModal();
  renderView();
  showToast('Mensagem enviada.');
}

/** Tela de configuração dos prazos do acompanhamento automático (Diretoria/Gerente). */
function abrirConfigMsgAuto(){
  const p = prazosAutoMsg();
  openModal(`
    <h3 style="margin:0 0 6px;">Configurações de mensagens de orçamento</h3>
    <div class="field" style="margin-top:14px;">
      <label>Validade padrão dos orçamentos (dias)</label>
      <input type="number" min="1" id="cfgDiasValidade" value="${p.diasValidade}">
    </div>
    <p class="muted" style="margin-top:4px; font-size:12.5px;">Ao abrir "Novo orçamento", o campo Validade já vem preenchido com a data do orçamento + esses dias.</p>
    <p class="muted" style="margin-top:14px;">Prazos (em dias, contados a partir da criação do orçamento) pra cada aviso automático de acompanhamento.</p>
    <div class="grid-2" style="margin-top:10px;">
      <div class="field"><label>1ª mensagem — "Aberto" → "Ação de fixação"</label><input type="number" min="1" id="cfgT1" value="${p.t1}"></div>
      <div class="field"><label>2ª mensagem — "Ação de fixação" → "Prorrogado à ação"</label><input type="number" min="1" id="cfgT2" value="${p.t2}"></div>
      <div class="field"><label>3ª mensagem — fecha o ciclo de avisos</label><input type="number" min="1" id="cfgT3" value="${p.t3}"></div>
      <div class="field"><label>Prazo final — encerra sozinho como "Recusado"</label><input type="number" min="1" id="cfgTFinal" value="${p.tFinal}"></div>
    </div>
    <p class="muted" style="margin-top:10px; font-size:12.5px;">O prazo final só entra em ação se o orçamento não tiver sido editado nem aprovado manualmente até lá.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarCfgMsgAuto">Cancelar</button>
      <button class="btn btn-accent" id="btnSalvarCfgMsgAuto">Salvar</button>
    </div>
  `);
  document.getElementById('btnCancelarCfgMsgAuto').addEventListener('click', closeModal);
  document.getElementById('btnSalvarCfgMsgAuto').addEventListener('click', async ()=>{
    const diasValidade = Number(document.getElementById('cfgDiasValidade').value)||PRAZOS_AUTO_MSG_PADRAO.diasValidade;
    const t1 = Number(document.getElementById('cfgT1').value)||PRAZOS_AUTO_MSG_PADRAO.t1;
    const t2 = Number(document.getElementById('cfgT2').value)||PRAZOS_AUTO_MSG_PADRAO.t2;
    const t3 = Number(document.getElementById('cfgT3').value)||PRAZOS_AUTO_MSG_PADRAO.t3;
    const tFinal = Number(document.getElementById('cfgTFinal').value)||PRAZOS_AUTO_MSG_PADRAO.tFinal;
    if(!(t1<t2 && t2<t3 && t3<=tFinal)){ showToast('Os prazos precisam estar em ordem crescente (1ª < 2ª < 3ª ≤ final).'); return; }
    const ok = await salvarPrazosAutoMsg({ t1, t2, t3, tFinal, diasValidade });
    if(ok){ closeModal(); renderView(); showToast('Configurações salvas.'); }
  });
}

function enviarWhatsAppOrcId(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o || !o.telefone){ showToast('Este orçamento não tem telefone salvo.'); return; }
  const info = statusInfoDe(o.status);
  const template = (info && info.mensagemWhatsapp) || MENSAGEM_WHATSAPP_PADRAO;
  const msg = encodeURIComponent(montarMensagemStatus(o, template));
  const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
async function enviarEmailOrcId(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o || !o.email){ showToast('Este orçamento não tem e-mail salvo.'); return; }
  const info = statusInfoDe(o.status);
  const assunto = montarMensagemStatus(o, (info && info.assuntoEmail) || MENSAGEM_EMAIL_ASSUNTO_PADRAO);
  const corpo = montarMensagemStatus(o, (info && info.mensagemEmail) || MENSAGEM_EMAIL_PADRAO);
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ to:o.email, subject:assunto, body:corpo, senha:__gatewaySenha })
    });
    if(!r.ok) throw new Error('falha no envio');
    showToast('E-mail enviado!');
  }catch(e){
    showToast('Falha ao enviar e-mail.');
  }
}

function confirmarExcluirOrcamento(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  openModal(`
    <h3 style="margin:0 0 12px;">Excluir orçamento?</h3>
    <p class="muted">Tem certeza que quer excluir o orçamento de <b>${escapeHtml(o.cliente||'—')}</b>${o.valorTotal ? ` (${fmtMoeda(o.valorTotal)})` : ''}? Essa ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarExcluirOrc">Cancelar</button>
      <button class="btn" style="background:var(--danger); color:#fff;" id="btnConfirmarExcluirOrc">🗑️ Excluir</button>
    </div>
  `);
  document.getElementById('btnCancelarExcluirOrc').addEventListener('click', closeModal);
  document.getElementById('btnConfirmarExcluirOrc').addEventListener('click', async ()=>{
    const ok = await orcamentoExcluir(orcId);
    if(ok){
      orcamentos = orcamentos.filter(x=>x.id!==orcId);
      closeModal();
      renderView();
      showToast('Orçamento excluído.');

}

function abrirDetalheOrcamento(o){
  if(!o) return;
  const infoAtual = statusInfoDe(o.status);
  openModal(`
    <h3>Orçamento — ${escapeHtml(o.cliente)}</h3>
    <p class="muted">${fmtDate(o.data)} · ${escapeHtml(o.loja)} · Vendedora ${escapeHtml(o.vendedora)} · Validade ${fmtDate(o.validade)}${estaVencido(o) ? ' · <b style="color:var(--danger);">Vencido</b>' : ''}</p>
    <table style="margin-top:10px;">
      <thead><tr><th>Produto</th><th>Qtd.</th><th>Valor unit.</th></tr></thead>
      <tbody>${(o.itens||[]).map(it=>`<tr><td>${escapeHtml(it.produto)}</td><td>${it.quantidade}</td><td>${fmtMoeda(it.valorUnitario)}</td></tr>`).join('')}</tbody>
    </table>
    <p style="margin-top:10px; font-weight:700;">Total: ${fmtMoeda(o.valorTotal)}</p>
    ${o.observacoes ? `<p class="muted">${escapeHtml(o.observacoes)}</p>` : ''}
    <div class="section-label" style="margin-top:16px;">Mudar status</div>
    <div class="field">
      <select id="orcStatusSel">${statusList().map(s=>`<option value="${s.id}" ${o.status===s.id?'selected':''}>${escapeHtml(s.nome)}</option>`).join('')}</select>
    </div>
    <div class="modal-actions" style="flex-wrap:wrap; gap:8px;">
      <button class="btn btn-accent" id="btnSalvarStatusOrc">💾 Salvar status</button>
      <button class="btn btn-ghost" id="btnEditarOrc">✏️ Editar</button>
      <button class="btn btn-accent" style="background:#17794a;border-color:#17794a;" id="btnVenderOrc">🛒 Vender</button>
      ${o.telefone ? `<button class="btn btn-wa" id="btnWhatsappOrc">${waIconSvg(16)} WhatsApp</button>` : ''}
      ${o.email ? `<button class="btn btn-accent" id="btnEmailOrc">✉️ E-mail</button>` : ''}
      <button class="btn btn-ghost" id="btnImprimirOrc">🖨️ Imprimir</button>
      <button class="btn btn-ghost" style="color:var(--danger);" id="btnExcluirOrc">🗑️ Excluir</button>
      <button class="btn btn-ghost" id="btnFecharDetalheOrc">✕ Fechar</button>
    </div>
  `);
  document.getElementById('btnFecharDetalheOrc').addEventListener('click', closeModal);

  // Converter orçamento em venda
  const btnVender = document.getElementById('btnVenderOrc');
  if(btnVender){ btnVender.addEventListener('click', ()=>{
    closeModal();
    // Preenche os itens do orçamento na tela de nova venda via postMessage ao shell
    // Alternativa simples: navega pro módulo Vendas com os dados do orçamento
    if(window.parent!==window){
      parent.postMessage({ type:'navegarPara', modulo:'vendas', orcamentoParaVenda: o }, '*');
    } else {
      showToast('Abra o módulo Vendas e use o orçamento como referência.');
    }
  }); }

  // Excluir dentro do modal
  const btnExcluirOrc = document.getElementById('btnExcluirOrc');
  if(btnExcluirOrc){ btnExcluirOrc.addEventListener('click', async ()=>{
    if(!confirm('Excluir este orçamento?')) return;
    const r = await gatewayCall({ op:'delete', table:'orcamentos', params:{ column:'id', value:o.id } });
    if(r && r.ok){
      orcamentos.splice(orcamentos.findIndex(x=>x.id===o.id),1);
      closeModal(); renderView(); showToast('Orçamento excluído.');
    } else showToast('Não foi possível excluir.');
  }); }
  document.getElementById('btnImprimirOrc').addEventListener('click', ()=> printOrcamento(o));
  document.getElementById('btnEditarOrc').addEventListener('click', ()=>{
    orcamentoEmEdicao = o;
    closeModal();
    currentTab = 'novo';
    renderTabs();
    renderView();
  });

  document.getElementById('btnSalvarStatusOrc').addEventListener('click', async ()=>{
    o.status = document.getElementById('orcStatusSel').value;
    o.rascunho = false;
    reiniciarAutoAposMudancaManual(o);
    const ok = await orcamentoSalvar(o);
    if(ok){ closeModal(); renderView(); showToast('Status atualizado.'); }
  });
  const btnWhatsapp = document.getElementById('btnWhatsappOrc');
  if(btnWhatsapp){
    btnWhatsapp.addEventListener('click', ()=>{
      const template = (infoAtual && infoAtual.mensagemWhatsapp) || MENSAGEM_WHATSAPP_PADRAO;
      const msg = encodeURIComponent(montarMensagemStatus(o, template));
      const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }
  const btnEmail = document.getElementById('btnEmailOrc');
  if(btnEmail){
    btnEmail.addEventListener('click', async ()=>{
      btnEmail.disabled = true; btnEmail.textContent = 'Enviando...';
      try{
        const assunto = montarMensagemStatus(o, (infoAtual && infoAtual.assuntoEmail) || MENSAGEM_EMAIL_ASSUNTO_PADRAO);
        const corpo = montarMensagemStatus(o, (infoAtual && infoAtual.mensagemEmail) || MENSAGEM_EMAIL_PADRAO);
        const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
          body: JSON.stringify({ to:o.email, subject:assunto, body:corpo, senha:__gatewaySenha })
        });
        if(!r.ok) throw new Error('falha no envio');
        showToast('E-mail enviado!');
      }catch(e){
        showToast('Falha ao enviar e-mail.');
      }
      btnEmail.disabled = false; btnEmail.textContent = '✉️ Enviar e-mail';
    });
  }
}

/** Abre uma janela de impressão em formato de bobina (recibo térmico), com a largura configurada. */
const ESCALA_BOBINA_PX = {
  pequena: { base:12, titulo:14, sub:11 },
  media:   { base:14, titulo:17, sub:12.5 },
  grande:  { base:16.5, titulo:20, sub:14.5 },
};
function getLojaAbrev(lojaId){
  const l = (config.lojas||[]).find(x=>x.id===lojaId);
  return l && l.abreviacao ? String(l.abreviacao).toUpperCase().trim() : 'XX';
}
async function bumpCodigoVia(tipo, lojaId){
  try{
    const lojaAbrev = getLojaAbrev(lojaId);
    const r = await gatewayCall({ op:'bumpCodigoViaSequence', params:{ tipo, lojaAbrev } });
    if(r && r.ok) return r.codigo;
  }catch(e){}
  return null;
}

function abrirImpressaoBobina(titulo, conteudoHtml, larguraMm, codigoVia){
  const impCfg = config.impressao || {};
  const px = ESCALA_BOBINA_PX[impCfg.escalaTexto] || ESCALA_BOBINA_PX.media;
  const peso = impCfg.negrito!==false ? 700 : 400;
  const reforcoCss = impCfg.reforcoTraco ? 'text-shadow:0.3px 0 0 currentColor, -0.3px 0 0 currentColor;' : '';
  const rodape = (impCfg.mensagemRodape||'').trim();
  const codigoHtml = codigoVia ? `<div style='text-align:center;margin-bottom:4px;'><svg id='barcodeSvgOrc'></svg><div style='text-align:center;font-weight:800;letter-spacing:.04em;margin-top:2px;'>${codigoVia}</div></div><hr style='border:1px solid #000;margin:4px 0;'>` : '';
  const barcodeScript = codigoVia ? `<script src=\"https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js\"><\/script>` : '';
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titulo)}</title>
${barcodeScript}
<style>
  @page{ size:${larguraMm}mm auto; margin:0; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ font-family:'Courier New', monospace; width:${larguraMm}mm; margin:0 auto; padding:4mm 3mm; color:#000; font-weight:${peso}; font-size:${px.base}px; line-height:1.42; -webkit-font-smoothing:none; ${reforcoCss} }
  .titulo{ font-size:${px.titulo}px; font-weight:800; text-align:center; letter-spacing:.02em; }
  .sub{ font-size:${px.sub}px; color:#000; text-align:center; }
  .linha{ border-top:1px dashed #000; margin:6px 0; }
  .rodape{ text-align:center; margin-top:10px; font-size:${px.sub}px; }
  b{ font-weight:800; }
  @media print{ body{ padding:1mm 2mm; } }
</style>
</head>
<body>
  ${conteudoHtml}
  ${rodape ? `<div class="linha"></div><div class="rodape">${escapeHtml(rodape)}</div>` : ''}
</body>
</html>`;
  const printWin = window.open('', '_blank', 'width=420,height=700');
  if(!printWin){ showToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups do navegador.'); return; }
  printWin.document.open();
  const htmlFinal = codigoVia ? html.replace('<body>', '<body>' + codigoHtml) : html;
  printWin.document.write(htmlFinal);
  printWin.document.close();
  printWin.focus();
  if(codigoVia){
    setTimeout(()=>{
      try{ if(printWin.JsBarcode) printWin.JsBarcode(printWin.document.getElementById('barcodeSvgOrc'), codigoVia, { format:'CODE128', width:2, height:42, displayValue:false, margin:0 }); }catch(e){}
      setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 150);
    }, 400);
  } else {
    setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 300);
  }
}

function printOrcamento(o){
  const imp = (config.impressao && config.impressao.orcamentos) || {};
  const larguraMm = (config.impressao && config.impressao.larguraBobina) || 80;

  const linhas = [];
  linhas.push(`<div class="titulo">ORÇAMENTO</div>`);
  linhas.push(`<div class="sub">${escapeHtml(o.loja)}</div>`);
  linhas.push(`<div class="sub">${fmtDate(o.data)}</div>`);
  linhas.push(`<div class="linha"></div>`);

  if(imp.cliente !== false){
    linhas.push(`<div><b>Cliente:</b> ${escapeHtml(o.cliente||'—')}</div>`);
  }
  if(imp.telefone !== false && o.telefone){
    linhas.push(`<div><b>Telefone:</b> ${escapeHtml(o.telefone)}</div>`);
  }
  if(imp.vendedora !== false){
    linhas.push(`<div><b>Vendedora:</b> ${escapeHtml(o.vendedora||'—')}</div>`);
  }
  if(imp.validade !== false){
    linhas.push(`<div><b>Válido até:</b> ${fmtDate(o.validade)}</div>`);
  }

  if(imp.itens !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>ITENS</b></div>`);
    (o.itens||[]).forEach(it=>{
      linhas.push(`<div>${escapeHtml(it.produto)} x${it.quantidade} — ${fmtMoeda(it.valorUnitario)}</div>`);
    });
  }
  if(imp.valores !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>Total estimado: ${fmtMoeda(o.valorTotal)}</b></div>`);
  }
  if(o.observacoes){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div>${escapeHtml(o.observacoes)}</div>`);
  }

  abrirImpressaoBobina('Orçamento', linhas.join(''), larguraMm, o.codigoVia||null);
}

const EMBEDDED = window.self !== window.top;

function tabsForLevel(){
  const t = [
    { id:'novo', label:'Novo orçamento', icon:'📝' },
    { id:'lista', label:'Orçamentos', icon:'📋' },
  ];
  if(window.__permissoesAbasOverride) return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  if(nav){ nav.innerHTML = ''; tabs.forEach(t=>{ const b=document.createElement('button'); b.textContent=t.label; b.dataset.tab=t.id; b.addEventListener('click',()=>{ currentTab=t.id; renderTabs(); renderView(); }); nav.appendChild(b); }); }
  const mobileNav = document.getElementById('mobileTabbar');
  if(mobileNav){ mobileNav.innerHTML = ''; tabs.forEach(t=>{ const b=document.createElement('button'); b.dataset.tab=t.id; b.innerHTML=`<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`; b.addEventListener('click',()=>{ currentTab=t.id; renderTabs(); renderView(); }); mobileNav.appendChild(b); }); }
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===currentTab); });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'orcamentos', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  if(!main) return;
  main.innerHTML = '';
  if(currentTab==='novo') renderNovo(main);
  else renderLista(main);
}
function podeCriarOrcamento(){
  if(!currentUser) return false;
  if(currentUser.nivel==='oficina') return false;
  if(window.__permissoesAbasOverride && window.__permissoesAbasOverride['novo']===false) return false;
  return true;
}

(async function init(){
  if(EMBEDDED){
    document.documentElement.classList.add('embedded');
    // Registra ouvinte ANTES de enviar ready, para não perder o 'auth' do shell
    window.addEventListener('message', async (ev)=>{
      if(!mensagemConfiavel(ev)) return;
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === 'auth'){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user.senha;
        window.__permissoesAbasOverride = ev.data.abas || null;
        await loadAll();
        document.getElementById('view-login').style.display = 'none';
        document.getElementById('view-app').style.display = 'block';
        document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
        document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
        buildTabs();
        currentTab = 'lista';
        renderTabs();
        renderView();
        const tabs = tabsForLevel();
        parent.postMessage({ type:'tabs', modulo:'orcamentos', tabs, active: currentTab }, '*');
      } else if(ev.data.type === 'gotoTab'){
        currentTab = ev.data.tabId;
        renderTabs();
        renderView();
      } else if(ev.data.type === 'lojaAtual'){
        window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
        if(currentUser && config) renderView();
      } else if(ev.data.type === 'abrirRegistro'){
        if(ev.data.id && Array.isArray(orcamentos)){
          const alvo = orcamentos.find(o=>o.id===ev.data.id);
          if(alvo) abrirDetalheOrcamento(alvo);
        }
      }
    });
    parent.postMessage({ type:'ready', modulo:'orcamentos' }, '*');
    return;
  }
  // Modo standalone: wire do botão de login
  document.getElementById('btnLogin').addEventListener('click', doLoginStandalone);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLoginStandalone(); });
})();

async function doLoginStandalone(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  buildTabs();
  currentTab = 'lista';
  renderTabs();
  renderView();
}

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
