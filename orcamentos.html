      btnEmail.disabled = true; btnEmail.textContent = 'Enviando…';
      try{
        const assunto = montarMensagemStatus(o, (infoAtual && infoAtual.assuntoEmail) || MENSAGEM_EMAIL_ASSUNTO_PADRAO);
        const corpo = montarMensagemStatus(o, (infoAtual && infoAtual.mensagemEmail) || MENSAGEM_EMAIL_PADRAO);
        const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
          body: JSON.stringify({ to:o.email, subject:assunto, body:corpo, senha:__gatewaySenha })
        });
        if(!r.ok) throw new Error('falha no envio');
        showToast('E-mail enviado.');
      }catch(e){
        showToast('Não foi possível enviar o e-mail. Confira a internet e tente de novo.');
      }
      btnEmail.disabled = false; btnEmail.innerHTML = ic('email') + ' Enviar e-mail';
    });
  }
}

/** Abre uma janela de impressão em formato de bobina (recibo térmico), com a largura configurada. */
const ESCALA_BOBINA_PX = {
  pequena: { base:12, titulo:14, sub:11 },
  media:   { base:14, titulo:17, sub:12.5 },
  grande:  { base:16.5, titulo:20, sub:14.5 },
};
function getLojaAbrev(lojaId){
  const l = (config.lojas||[]).find(x=>x.id===lojaId);
  return l && l.abreviacao ? String(l.abreviacao).toUpperCase().trim() : 'XX';
}
async function bumpCodigoVia(tipo, lojaId){
  try{
    const lojaAbrev = getLojaAbrev(lojaId);
    const r = await gatewayCall({ op:'bumpCodigoViaSequence', params:{ tipo, lojaAbrev } });
    if(r && r.ok) return r.codigo;
  }catch(e){}
  return null;
}

function abrirImpressaoBobina(titulo, conteudoHtml, larguraMm, codigoVia){
  const impCfg = config.impressao || {};
  const px = ESCALA_BOBINA_PX[impCfg.escalaTexto] || ESCALA_BOBINA_PX.media;
  const peso = impCfg.negrito!==false ? 700 : 400;
  const reforcoCss = impCfg.reforcoTraco ? 'text-shadow:0.3px 0 0 currentColor, -0.3px 0 0 currentColor;' : '';
  const rodape = (impCfg.mensagemRodape||'').trim();
  const codigoHtml = codigoVia ? `<div style='text-align:center;margin-bottom:4px;'><svg id='barcodeSvgOrc'></svg><div style='text-align:center;font-weight:800;letter-spacing:.04em;margin-top:2px;'>${codigoVia}</div></div><hr style='border:1px solid #000;margin:4px 0;'>` : '';
  const barcodeScript = codigoVia ? `<script src=\"https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js\"><\/script>` : '';
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titulo)}</title>
${barcodeScript}
<style>
  @page{ size:${larguraMm}mm auto; margin:0; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ font-family:'Courier New', monospace; width:${larguraMm}mm; margin:0 auto; padding:4mm 3mm; color:#000; font-weight:${peso}; font-size:${px.base}px; line-height:1.42; -webkit-font-smoothing:none; ${reforcoCss} }
  .titulo{ font-size:${px.titulo}px; font-weight:800; text-align:center; letter-spacing:.02em; }
  .sub{ font-size:${px.sub}px; color:#000; text-align:center; }
  .linha{ border-top:1px dashed #000; margin:6px 0; }
  .rodape{ text-align:center; margin-top:10px; font-size:${px.sub}px; }
  b{ font-weight:800; }
  @media print{ body{ padding:1mm 2mm; } }
</style>
</head>
<body>
  ${conteudoHtml}
  ${rodape ? `<div class="linha"></div><div class="rodape">${escapeHtml(rodape)}</div>` : ''}
</body>
</html>`;
  const printWin = window.open('', '_blank', 'width=420,height=700');
  if(!printWin){ showToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups do navegador.'); return; }
  printWin.document.open();
  const htmlFinal = codigoVia ? html.replace('<body>', '<body>' + codigoHtml) : html;
  printWin.document.write(htmlFinal);
  printWin.document.close();
  printWin.focus();
  if(codigoVia){
    setTimeout(()=>{
      try{ if(printWin.JsBarcode) printWin.JsBarcode(printWin.document.getElementById('barcodeSvgOrc'), codigoVia, { format:'CODE128', width:2, height:42, displayValue:false, margin:0 }); }catch(e){}
      setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 150);
    }, 400);
  } else {
    setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 300);
  }
}

function printOrcamento(o){
  const imp = (config.impressao && config.impressao.orcamentos) || {};
  const larguraMm = (config.impressao && config.impressao.larguraBobina) || 80;

  const linhas = [];
  linhas.push(`<div class="titulo">ORÇAMENTO</div>`);
  linhas.push(`<div class="sub">${escapeHtml(o.loja)}</div>`);
  linhas.push(`<div class="sub">${fmtDate(o.data)}</div>`);
  linhas.push(`<div class="linha"></div>`);

  if(imp.cliente !== false){
    linhas.push(`<div><b>Cliente:</b> ${escapeHtml(o.cliente||'—')}</div>`);
  }
  if(imp.telefone !== false && o.telefone){
    linhas.push(`<div><b>Telefone:</b> ${escapeHtml(o.telefone)}</div>`);
  }
  if(imp.vendedora !== false){
    linhas.push(`<div><b>Vendedora:</b> ${escapeHtml(o.vendedora||'—')}</div>`);
  }
  if(imp.validade !== false){
    linhas.push(`<div><b>Válido até:</b> ${fmtDate(o.validade)}</div>`);
  }

  if(imp.itens !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>ITENS</b></div>`);
    (o.itens||[]).forEach(it=>{
      linhas.push(`<div>${escapeHtml(it.produto)} x${it.quantidade} — ${fmtMoeda(it.valorUnitario)}</div>`);
    });
  }
  if(imp.valores !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>Total estimado: ${fmtMoeda(o.valorTotal)}</b></div>`);
  }
  if(o.observacoes){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div>${escapeHtml(o.observacoes)}</div>`);
  }

  abrirImpressaoBobina('Orçamento', linhas.join(''), larguraMm, o.codigoVia||null);
}

const EMBEDDED = window.self !== window.top;

function tabsForLevel(){
  const t = [
    { id:'novo', label:'Novo orçamento', icon:'documento' },
    { id:'lista', label:'Lançados', icon:'lista' },
    { id:'followup', label:'Follow-up', icon:'relogio', badge: (config ? followupAtrasados().length : 0) || null },
  ];
  if(window.__permissoesAbasOverride) return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  if(nav){ nav.innerHTML = ''; tabs.forEach(t=>{ const b=document.createElement('button'); b.textContent=t.label; b.dataset.tab=t.id; b.addEventListener('click',()=>{ currentTab=t.id; renderTabs(); renderView(); }); nav.appendChild(b); }); }
  const mobileNav = document.getElementById('mobileTabbar');
  if(mobileNav){ mobileNav.innerHTML = ''; tabs.forEach(t=>{ const b=document.createElement('button'); b.dataset.tab=t.id; b.innerHTML=`<span class="mt-icon">${ic(t.icon,20)}</span><span>${t.label}</span>`; b.addEventListener('click',()=>{ currentTab=t.id; renderTabs(); renderView(); }); mobileNav.appendChild(b); }); }
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===currentTab); });
  if(EMBEDDED && currentUser) parent.postMessage({ type:'tabs', modulo:'orcamentos', tabs: tabsForLevel(), active: currentTab }, '*');
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'orcamentos', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  if(!main) return;
  main.innerHTML = '';
  if(currentTab==='novo') renderNovo(main);
  else if(currentTab==='followup') renderFollowup(main);
  else renderLista(main);
}
function podeCriarOrcamento(){
  if(!currentUser) return false;
  if(currentUser.nivel==='oficina') return false;
  if(window.__permissoesAbasOverride && window.__permissoesAbasOverride['novo']===false) return false;
  return true;
}

(async function init(){
  if(EMBEDDED){
    document.documentElement.classList.add('embedded');
    // Registra ouvinte ANTES de enviar ready, para não perder o 'auth' do shell
    window.addEventListener('message', async (ev)=>{
      if(!mensagemConfiavel(ev)) return;
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === 'auth'){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user.senha;
        window.__permissoesAbasOverride = ev.data.abas || null;
        invalidarReservadas();
        await loadAll();
        document.getElementById('view-login').style.display = 'none';
        document.getElementById('view-app').style.display = 'block';
        document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
        document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
        buildTabs();
        currentTab = 'lista';
        renderTabs();
        renderView();
        const tabs = tabsForLevel();
        parent.postMessage({ type:'tabs', modulo:'orcamentos', tabs, active: currentTab }, '*');
      } else if(ev.data.type === 'gotoTab'){
        currentTab = ev.data.tabId;
        renderTabs();
        renderView();
      } else if(ev.data.type === 'lojaAtual'){
        window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
        invalidarReservadas();
        if(currentUser && config) renderView();
      } else if(ev.data.type === 'abrirRegistro'){
        if(ev.data.id && Array.isArray(orcamentos)){
          const alvo = orcamentos.find(o=>o.id===ev.data.id);
          if(alvo) abrirDetalheOrcamento(alvo);
        }
      }
    });
    parent.postMessage({ type:'ready', modulo:'orcamentos' }, '*');
    return;
  }
  // Modo standalone: wire do botão de login
  document.getElementById('btnLogin').addEventListener('click', doLoginStandalone);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLoginStandalone(); });
})();

async function doLoginStandalone(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  buildTabs();
  currentTab = 'lista';
  renderTabs();
  renderView();
}

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
