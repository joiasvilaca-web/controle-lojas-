<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos · Vilaça Joias</title>

<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}

#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-wa{background:#e8faf0; border:1px solid #a8e6c5;}
.icon-btn:hover{background:rgba(255,255,255,0.1);}
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
.btn-wa{ background:#25D366; color:#08380F; }
.btn-wa:hover{ background:#1DA851; }

#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}

.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); box-shadow:0 2px 10px -4px rgba(43,15,31,0.08);}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.badge-pendente{background:var(--wait-soft); color:var(--wait);}
.badge-aprovado{background:var(--ok-soft); color:var(--ok);}
.badge-recusado{background:var(--danger-soft); color:var(--danger);}
.badge-expirado{background:#EDEDED; color:#666;}
.badge-vencido{background:var(--danger); color:#fff;}
.badge-cutucado{background:#EAE0FB; color:#6B3FA0;}
.badge-recusado-status{background:#3A3F44; color:#fff;}
.badge-rascunho{background:#EDEDED; color:#666; border:1px dashed #b3b3b3;}
.chip-vendedora{display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--danger); border:1.5px solid var(--danger); border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:800; cursor:pointer; transition:background .15s,color .15s;}
.chip-vendedora:hover{background:var(--danger); color:#fff;}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.alerta-vencimento{background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13.5px;}
.item-row{border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; display:grid; grid-template-columns:1.4fr 70px 100px 34px; gap:8px; align-items:center;}
@media (max-width:640px){ .item-row{grid-template-columns:1fr 1fr; grid-template-areas:"produto produto" "qtd valor" "del del";} }
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>
</head>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

let config = null;
let orcamentos = [];
let currentUser = null;
let currentTab = 'lista';
let orcamentoEmEdicao = null;
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 1000 } });
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/** Ícone do WhatsApp de verdade (SVG), pra usar nos botões de envio em vez do emoji genérico. */
function waIconSvg(tamanho){
  tamanho = tamanho || 15;
  return `<svg viewBox="0 0 24 24" width="${tamanho}" height="${tamanho}" fill="currentColor" style="vertical-align:-3px;"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 4.99L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.92 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2m0 1.67a8.24 8.24 0 0 1 8.23 8.24c0 4.54-3.7 8.23-8.24 8.23a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23M8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.26 3.73.59.27 1.06.42 1.42.54.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.16-.48-.28-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.78.98-.14.17-.29.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.36-.78-1.85-.2-.48-.4-.42-.56-.42h-.44Z"/></svg>`;
}
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML='';
  if(history.state && history.state.modalAberto) history.back();
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  history.pushState({ modalAberto:true }, '');
}
window.addEventListener('popstate', ()=>{
  const overlay = document.getElementById('modalOverlay');
  if(overlay && overlay.classList.contains('show')) history.pushState({ modalAberto:true }, '');
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const overlay = document.getElementById('modalOverlay');
    if(overlay && overlay.classList.contains('show')){ e.preventDefault(); e.stopPropagation(); }
  }
});

async function configGetUnificada(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar config', e); return null; }
}
async function orcamentosGet(){
  try{
    const { data, error } = await supabaseClient.from('orcamentos').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar orçamentos', e); return []; }
}
async function orcamentoSalvar(o){
  try{
    const { error } = await supabaseClient.from('orcamentos').upsert({ id: o.id, payload: o });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar orçamento', e); showToast('Não foi possível salvar. Tente novamente.'); return false; }
}
async function orcamentoExcluir(id){
  try{
    const { error } = await supabaseClient.from('orcamentos').delete().eq('id', id);
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao excluir orçamento', e); showToast('Não foi possível excluir. Tente novamente.'); return false; }
}

/* Status configuráveis — mesmo padrão-semente usado em Configurações, caso ainda não tenha sido salvo. */
const STATUS_ORCAMENTO_PADRAO = [
  { id:'pendente', nome:'Pendente', inicial:true, encerra:false, mensagemWhatsapp:'Olá {cliente}! Segue o orçamento da Vilaça Joias no valor de {valor}, válido até {validade}. Qualquer dúvida, é só chamar por aqui 💛' },
  { id:'cutucado', nome:'Cutucado', inicial:false, encerra:false, mensagemWhatsapp:'Oi {cliente}, tudo bem? Passando pra lembrar do seu orçamento de {valor} na Vilaça Joias — ainda está de pé até {validade}. Posso te ajudar a fechar?' },
  { id:'aprovado', nome:'Aprovado', inicial:false, encerra:true, mensagemWhatsapp:'' },
  { id:'recusado', nome:'Recusado', inicial:false, encerra:true, mensagemWhatsapp:'' },
];
function statusList(){
  return (config.statusOrcamento && config.statusOrcamento.length>0) ? config.statusOrcamento : STATUS_ORCAMENTO_PADRAO;
}
function statusInfoDe(id){
  return statusList().find(s=>s.id===id) || statusList()[0];
}
function statusInicialId(){
  const lista = statusList();
  const inicial = lista.find(s=>s.inicial);
  return inicial ? inicial.id : lista[0].id;
}
/** Um orçamento está "vencido" quando o status atual não encerra o fluxo e a validade já passou. */
function estaVencido(o){
  const info = statusInfoDe(o.status);
  if(info && info.encerra) return false;
  return !!(o.validade && o.validade < todayStr());
}
function diasParaVencer(o){
  if(!o.validade) return null;
  const hoje = new Date(todayStr()+'T00:00:00');
  const val = new Date(o.validade+'T00:00:00');
  return Math.round((val-hoje)/86400000);
}
/** Orçamentos ainda em aberto (status não-encerrado) que vencem em até 3 dias, ou já venceram. */
function orcamentosParaAvisar(){
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    const dias = diasParaVencer(o);
    return dias !== null && dias <= 3;
  });
}
/** Há quantos dias o orçamento foi criado (baseado na data de criação, não na validade). */
function diasAberto(o){
  const hoje = new Date(todayStr()+'T00:00:00');
  const criado = new Date((o.data||todayStr())+'T00:00:00');
  return Math.round((hoje-criado)/86400000);
}
/** Orçamentos em aberto (status não-encerrado) criados há mais de 5 dias, sem resposta. */
function orcamentosAbertosMaisDe5Dias(){
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    return diasAberto(o) > 5;
  });
}
/** Agrupa uma lista de orçamentos por nome de vendedora. */
function agruparPorVendedora(lista){
  const map = {};
  lista.forEach(o=>{
    const v = o.vendedora || 'Sem vendedora';
    if(!map[v]) map[v] = [];
    map[v].push(o);
  });
  return map;
}
/** Troca {cliente}, {loja}, {valor} e {validade} pelos dados reais do orçamento. */
function montarMensagemStatus(o, mensagem){
  return (mensagem||'')
    .replaceAll('{cliente}', o.cliente||'')
    .replaceAll('{loja}', o.loja||'')
    .replaceAll('{valor}', fmtMoeda(o.valorTotal))
    .replaceAll('{validade}', fmtDate(o.validade));
}

/** Nome que aparece nas listas: apelido do cadastro, ou nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
function nomeGravadoParaExibicao(lista, nomeGravado){
  const f = (lista||[]).find(x=>funcionarioBateComNome(x, nomeGravado));
  return f ? nomeExibicaoFuncionario(f) : nomeGravado;
}
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
function findClienteIndex(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  return clientes.findIndex(c=>
    (tel && onlyDigits(c.telefone) === tel) ||
    (doc && onlyDigitsCpf(c.cpf) === doc)
  );
}
async function clientesGet(){
  try{
    const { data, error } = await supabaseClient.from('clientes_cadastro').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar clientes', e); return []; }
}
async function salvarUmCliente(cliente){
  try{
    const { error } = await supabaseClient.from('clientes_cadastro').upsert({ id: cliente.id, payload: cliente });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar cliente', e); showToast('Não foi possível salvar o cliente.'); return false; }
}
async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  try{
    const res = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
    const data = await res.json();
    if(data.erro) return null;
    return { endereco: data.logradouro || '', bairro: data.bairro || '', cidade: data.localidade || '', estado: data.uf || '' };
  }catch(e){ return null; }
}
function clienteFieldsHtml(prefix, c){
  c = c || {};
  const nome = c.cliente !== undefined ? c.cliente : (c.nome || '');
  return `
    <div class="grid-2">
      <div class="field"><label>CPF</label><input id="${prefix}_cpf" placeholder="000.000.000-00" value="${escapeHtml(c.cpf||'')}"></div>
      <div class="field"><label>Nome do cliente</label><input id="${prefix}_cliente" placeholder="Nome completo" value="${escapeHtml(nome)}"></div>
      <div class="field"><label>Telefone</label><input id="${prefix}_telefone" placeholder="(00) 00000-0000" value="${escapeHtml(c.telefone||'')}"></div>
      <div class="field"><label>E-mail do cliente</label><input type="email" id="${prefix}_email" placeholder="cliente@email.com" value="${escapeHtml(c.email||'')}"></div>
      <div class="field"><label>Data de nascimento</label><input type="date" id="${prefix}_nascimento" value="${c.dataNascimento||''}"></div>
      <div class="field"><label>CEP</label><input id="${prefix}_cep" placeholder="00000-000" value="${escapeHtml(c.cep||'')}"></div>
    </div>
    <div class="grid-2" style="margin-top:10px;">
      <div class="field"><label>Endereço</label><input id="${prefix}_endereco" placeholder="Rua / Avenida" value="${escapeHtml(c.endereco||'')}"></div>
      <div class="field"><label>Número</label><input id="${prefix}_numero" placeholder="Nº" value="${escapeHtml(c.numero||'')}"></div>
      <div class="field"><label>Complemento</label><input id="${prefix}_complemento" placeholder="Apto, bloco…" value="${escapeHtml(c.complemento||'')}"></div>
      <div class="field"><label>Bairro</label><input id="${prefix}_bairro" placeholder="Bairro" value="${escapeHtml(c.bairro||'')}"></div>
      <div class="field"><label>Cidade</label><input id="${prefix}_cidade" placeholder="Cidade" value="${escapeHtml(c.cidade||'')}"></div>
      <div class="field"><label>Estado</label><input id="${prefix}_estado" placeholder="UF" maxlength="2" style="text-transform:uppercase;" value="${escapeHtml((c.estado||'').toUpperCase())}"></div>
    </div>
  `;
}
function wireClienteFields(prefix){
  const cepInp = document.getElementById(prefix+'_cep');
  if(cepInp){
    cepInp.addEventListener('blur', async ()=>{
      const cepDigits = onlyDigits(cepInp.value);
      if(cepDigits.length !== 8) return;
      const endereco = await buscarEnderecoPorCep(cepDigits);
      if(!endereco) return;
      const enderecoInp = document.getElementById(prefix+'_endereco');
      const bairroInp = document.getElementById(prefix+'_bairro');
      const cidadeInp = document.getElementById(prefix+'_cidade');
      const estadoInp = document.getElementById(prefix+'_estado');
      if(enderecoInp) enderecoInp.value = endereco.endereco;
      if(bairroInp) bairroInp.value = endereco.bairro;
      if(cidadeInp) cidadeInp.value = endereco.cidade;
      if(estadoInp) estadoInp.value = endereco.estado;
      showToast('Endereço preenchido — falta só número e complemento.');
    });
  }
}
function abrirSeletorCliente(onConfirmar, clienteAtual){
  let selecionado = clienteAtual ? { ...clienteAtual } : null;
  openModal(`
    <h3>Cliente</h3>
    <div class="field"><label>🔍 Buscar cliente já cadastrado</label><input id="busca_cliente" placeholder="Nome, telefone ou CPF..." autocomplete="off"></div>
    <div id="resultados_cliente" style="max-height:180px; overflow-y:auto; margin-bottom:12px;"></div>
    <div style="border-top:1px solid var(--line); padding-top:12px;">
      <p class="muted" style="margin:0 0 8px;">Ou preencha os dados abaixo pra cadastrar um cliente novo:</p>
      ${clienteFieldsHtml('sel', clienteAtual || {})}
    </div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnConfirmarSelecaoCliente">Confirmar</button>
      <button class="btn btn-ghost" id="btnCancelarSelecaoCliente">Cancelar</button>
    </div>
  `);
  wireClienteFields('sel');

  function preencherFormulario(c){
    const map = { cpf:c.cpf, cliente:c.nome, telefone:c.telefone, email:c.email, nascimento:c.dataNascimento,
      cep:c.cep, endereco:c.endereco, numero:c.numero, complemento:c.complemento, bairro:c.bairro, cidade:c.cidade, estado:c.estado };
    Object.keys(map).forEach(campo=>{
      const el = document.getElementById('sel_'+campo);
      if(el) el.value = map[campo] || '';
    });
    selecionado = c;
  }
  function renderResultados(termo){
    const wrap = document.getElementById('resultados_cliente');
    if(!termo){ wrap.innerHTML=''; return; }
    const termoDigits = onlyDigits(termo);
    const termoLower = termo.toLowerCase();
    const achados = clientes.filter(c=>
      (c.nome||'').toLowerCase().includes(termoLower) ||
      (termoDigits.length>=4 && onlyDigits(c.telefone||'').includes(termoDigits)) ||
      (termoDigits.length>=4 && onlyDigitsCpf(c.cpf||'').includes(termoDigits))
    ).slice(0,8);
    wrap.innerHTML = achados.length===0
      ? `<div class="empty">Nenhum cliente encontrado — preencha abaixo pra cadastrar um novo.</div>`
      : achados.map(c=>`<div class="code-list-item" style="cursor:pointer;" data-selcli="${c.id}"><div><b>${escapeHtml(c.nome)}</b> <span class="muted">${escapeHtml(c.telefone||'—')}</span></div></div>`).join('');
    wrap.querySelectorAll('[data-selcli]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const c = clientes.find(x=>x.id===el.dataset.selcli);
        if(c){ preencherFormulario(c); showToast('Dados preenchidos — confira e confirme.'); }
      });
    });
  }
  document.getElementById('busca_cliente').addEventListener('input', e=> renderResultados(e.target.value.trim()));

  document.getElementById('btnCancelarSelecaoCliente').addEventListener('click', closeModal);
  document.getElementById('btnConfirmarSelecaoCliente').addEventListener('click', async ()=>{
    const nome = document.getElementById('sel_cliente').value.trim();
    if(!nome){ showToast('Informe o nome do cliente.'); return; }
    const patch = {
      nome,
      telefone: document.getElementById('sel_telefone').value.trim(),
      email: document.getElementById('sel_email').value.trim(),
      cpf: document.getElementById('sel_cpf').value.trim(),
      dataNascimento: document.getElementById('sel_nascimento').value,
      cep: document.getElementById('sel_cep').value.trim(),
      endereco: document.getElementById('sel_endereco').value.trim(),
      numero: document.getElementById('sel_numero').value.trim(),
      complemento: document.getElementById('sel_complemento').value.trim(),
      bairro: document.getElementById('sel_bairro').value.trim(),
      cidade: document.getElementById('sel_cidade').value.trim(),
      estado: document.getElementById('sel_estado').value.trim(),
    };
    let clienteFinal;
    if(selecionado && selecionado.id){
      clienteFinal = { ...selecionado, ...patch };
      const idx = clientes.findIndex(x=>x.id===clienteFinal.id);
      if(idx>=0) clientes[idx] = clienteFinal; else clientes.unshift(clienteFinal);
    } else {
      const idxExistente = findClienteIndex(patch.telefone, patch.cpf);
      if(idxExistente >= 0){
        clienteFinal = { ...clientes[idxExistente], ...patch };
        clientes[idxExistente] = clienteFinal;
      } else {
        clienteFinal = { id: uid('cli'), ...patch, criadoEm: Date.now() };
        clientes.unshift(clienteFinal);
      }
    }
    await salvarUmCliente(clienteFinal);
    closeModal();
    onConfirmar(clienteFinal);
  });
}

const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    } else if(ev.data.type === 'clientesAtualizados'){
      // O módulo Cadastro mexeu no cadastro de clientes. Como este módulo fica
      // vivo no iframe, a lista em memória ficaria velha — recarrega na hora.
      if(__gatewaySenha){ clientes = await clientesGet(); }
    } else if(ev.data.type === 'lojaAtual'){
      window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
      if(currentUser) renderView();
    }
  });
}

async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  enterApp();
}

function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;

  buildTabs();

  if(EMBEDDED){
    const permitido = tabsForLevel();
    if(!permitido.some(t=>t.id===currentTab)) currentTab = permitido[0] ? permitido[0].id : (podeCriarOrcamento() ? 'novo' : 'lista');
    parent.postMessage({ type:'tabs', modulo:'orcamentos', tabs: permitido, active: currentTab }, '*');
  }
  renderTabs();
  renderView();

/* "Novo orçamento" deixou de ser aba própria (agora é um botão dentro de "Orçamentos"),
 * mas a permissão por perfil (Cadastro → Perfis de Acesso) continua sendo respeitada aqui. */
function podeCriarOrcamento(){
  if(!window.__permissoesAbasOverride) return true;
  return window.__permissoesAbasOverride.novo !== false;
}
function tabsForLevel(){
  const t = [
    { id:'lista', label:'Orçamentos', icon:'📋' },
  ];
  if(window.__permissoesAbasOverride) return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'orcamentos', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='novo') renderNovo(main, orcamentoEmEdicao);
  else if(currentTab==='lista') renderLista(main);
}

  /* Considera "preenchimento iniciado" quando já tem cliente, observação ou algum item com produto/qtd. */
  function formOrcTemDados(){

    const nome = document.getElementById('o_cliente').value;
    const tel = document.getElementById('o_telefone').value;
    const email = document.getElementById('o_email').value;
    const resumo = document.getElementById('o_clienteResumo');
    resumo.innerHTML = nome
      ? `<div style="display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap;">
           <div><b>${escapeHtml(nome)}</b>${tel ? ' — '+escapeHtml(tel) : ''}${email ? ' — '+escapeHtml(email) : ''}</div>
           ${clienteSelecionadoOrc && clienteSelecionadoOrc.id ? `<button type="button" class="btn btn-ghost btn-sm" id="btnEditarClienteOrc" title="Editar cadastro deste cliente">✎ Editar cadastro</button>` : ''}
         </div>`
      : `<span class="muted">Nenhum cliente selecionado.</span>`;
    const btnEd = document.getElementById('btnEditarClienteOrc');
    if(btnEd) btnEd.addEventListener('click', abrirEdicaoClienteOrc);
  }
  function aplicarClienteOrc(clienteFinal){
    clienteSelecionadoOrc = clienteFinal;
    document.getElementById('o_cliente').value = clienteFinal.nome || '';
    document.getElementById('o_telefone').value = clienteFinal.telefone || '';
    document.getElementById('o_email').value = clienteFinal.email || '';
    atualizarResumoClienteOrc();
  }
  /** O que for alterado aqui vale pro cadastro central, ou seja, pra todos os módulos. */
  function abrirEdicaoClienteOrc(){
    if(!clienteSelecionadoOrc) return;
    abrirSeletorCliente((clienteFinal)=>{
      aplicarClienteOrc(clienteFinal);
      showToast('Cadastro do cliente atualizado.');
    }, clienteSelecionadoOrc);
  }
  document.getElementById('btnSelecionarClienteOrc').addEventListener('click', ()=>{
    abrirSeletorCliente((clienteFinal)=>{ aplicarClienteOrc(clienteFinal); });
  });
  if(editando) atualizarResumoClienteOrc();

  document.getElementById('btnSalvarOrcamento').addEventListener('click', async ()=>{
    const lojaId = document.getElementById('o_loja').value;
    const vendedora = document.getElementById('o_vendedora').value;
    const validade = document.getElementById('o_validade').value;
    const cliente = document.getElementById('o_cliente').value.trim();
    const telefone = document.getElementById('o_telefone').value.trim();
    const email = document.getElementById('o_email').value.trim();
    const itensValidos = itens.filter(it=>it.produto && Number(it.quantidade)>0);
    if(!lojaId || !vendedora || !validade){ showToast('Preencha loja, vendedora e validade.'); return; }
    if(!cliente){ showToast('Informe o nome do cliente.'); return; }
    if(itensValidos.length===0){ showToast('Adicione ao menos um item.'); return; }
    const loja = (config.lojas||[]).find(l=>l.id===lojaId);
    const valorTotal = itensValidos.reduce((acc,it)=> acc + (Number(it.quantidade)||0)*(Number(it.valorUnitario)||0), 0);
    const orcamento = editando ? {
      ...orcamentoEditando,
      loja: loja?loja.nome:'', lojaId, vendedora, validade,
      cliente, telefone, email, itens: itensValidos, valorTotal,
      observacoes: document.getElementById('o_obs').value.trim(),
      rascunho: false,
    } : {
      id: uid('orc'), loja: loja?loja.nome:'', lojaId, vendedora, validade,
      data: todayStr(), cliente, telefone, email, itens: itensValidos, valorTotal,
      observacoes: document.getElementById('o_obs').value.trim(),
      status: statusInicialId(), criadoPor: currentUser.nome, criadoEm: Date.now(),
      rascunho: false,
    };
    const ok = await orcamentoSalvar(orcamento);
    if(ok){
      if(editando){
        const idx = orcamentos.findIndex(x=>x.id===orcamento.id);
        if(idx>=0) orcamentos[idx] = orcamento; else orcamentos.unshift(orcamento);
        showToast('Orçamento atualizado.');
      } else {
        orcamentos.unshift(orcamento);
        showToast('Orçamento salvo.');
      }
      orcamentoEmEdicao = null;
      currentTab = 'lista'; renderTabs(); renderView();
    }
  });
}

/* ============================================================
   LISTA DE ORÇAMENTOS
   ============================================================ */
function renderLista(main){
  const avisos = orcamentosParaAvisar();
  const abertos5dias = orcamentosAbertosMaisDe5Dias();
  const porVendedora = agruparPorVendedora(abertos5dias);
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">Orçamentos</h1>
      <p class="page-sub">Acompanhe o status de cada orçamento (configurável em Configurações → Status de Orçamento).</p>
    </div>
    ${podeCriarOrcamento() ? `<button type="button" class="btn btn-accent" id="btnNovoOrcamento" style="margin-bottom:18px;">📝 Novo orçamento</button>` : ''}
    ${avisos.length>0 ? `<div class="alerta-vencimento">⚠️ ${avisos.length} orçamento(s) vencendo em até 3 dias ou já vencido(s) sem decisão. Dá uma olhada na lista abaixo.</div>` : ''}
    ${abertos5dias.length>0 ? `
      <div class="card" style="border:1px solid var(--danger); background:var(--danger-soft);">
        <div class="section-label" style="color:var(--danger);">⏰ ${abertos5dias.length} orçamento(s) aberto(s) há mais de 5 dias sem resposta</div>
        <p class="muted" style="margin:-2px 0 10px;">Clique numa vendedora pra ver só os orçamentos pendentes dela.</p>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${Object.entries(porVendedora).map(([nome,lista])=>`<button type="button" class="chip-vendedora" data-filtrovend="${escapeHtml(nome)}">${escapeHtml(nome)} <span style="opacity:.75;">(${lista.length})</span></button>`).join('')}
        </div>
      </div>
    ` : ''}
    <div class="filters">
      <select id="fLoja"><option value="">Todas as lojas</option>${(config.lojas||[]).map(l=>`<option value="${l.id}">${escapeHtml(l.nome)}</option>`).join('')}</select>
      <select id="fStatus">
        <option value="">Todos os status</option>
        ${statusList().map(s=>`<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('')}
        <option value="__vencido__">Vencidos (sem decisão)</option>
      </select>
      <select id="fVendedora">
        <option value="">Todas as vendedoras</option>
        ${[...new Set(orcamentos.map(o=>o.vendedora).filter(Boolean))].sort().map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('')}
      </select>
      <input type="text" id="fBusca" placeholder="Buscar cliente...">
    </div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <table id="tabelaOrc">
        <thead><tr><th>Cliente</th><th>Loja</th><th>Vendedora</th><th>Validade</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tbodyOrc"></tbody>
      </table>
    </div>
  `;
  const btnNovo = document.getElementById('btnNovoOrcamento');
  if(btnNovo){
    btnNovo.addEventListener('click', ()=>{ orcamentoEmEdicao = null; currentTab = 'novo'; renderTabs(); renderView(); });
  }
  document.querySelectorAll('[data-filtrovend]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.getElementById('fVendedora').value = b.dataset.filtrovend;
      document.getElementById('fStatus').value = '';
      draw();
      document.getElementById('tabelaOrc').scrollIntoView({ behavior:'smooth', block:'center' });
    });
  });
  function draw(){
    const lojaFiltro = document.getElementById('fLoja').value;
    const statusFiltro = document.getElementById('fStatus').value;
    const vendedoraFiltro = document.getElementById('fVendedora').value;
    const busca = document.getElementById('fBusca').value.trim().toLowerCase();
    const lista = orcamentos.filter(o=>{
      if(lojaFiltro && o.lojaId!==lojaFiltro) return false;
      if(statusFiltro==='__vencido__' && !estaVencido(o)) return false;
      if(statusFiltro && statusFiltro!=='__vencido__' && o.status!==statusFiltro) return false;
      if(vendedoraFiltro && o.vendedora!==vendedoraFiltro) return false;
      if(busca && !(o.cliente||'').toLowerCase().includes(busca)) return false;
      return true;
    }).slice().reverse();
    const tbody = document.getElementById('tbodyOrc');
    if(lista.length===0){ tbody.innerHTML = `<tr><td colspan="7" class="empty">Nenhum orçamento encontrado.</td></tr>`; return; }
    tbody.innerHTML = lista.map(o=>{
      const info = statusInfoDe(o.status);
      const vencido = estaVencido(o);
      let classeBadge, rotuloStatus;
      if(o.rascunho){ classeBadge = 'badge-rascunho'; rotuloStatus = 'Rascunho'; }
      else if(vencido){ classeBadge = 'badge-vencido'; rotuloStatus = info ? info.nome : o.status; }
      else if(o.status==='cutucado'){ classeBadge = 'badge-cutucado'; rotuloStatus = info ? info.nome : o.status; }
      else if(o.status==='recusado'){ classeBadge = 'badge-recusado-status'; rotuloStatus = info ? info.nome : o.status; }
      else if(o.status==='aprovado' || (info && info.encerra)){ classeBadge = 'badge-aprovado'; rotuloStatus = info ? info.nome : o.status; }
      else { classeBadge = 'badge-pendente'; rotuloStatus = info ? info.nome : o.status; }
      return `<tr>
        <td>${escapeHtml(o.cliente)}</td>
        <td><span class="badge badge-loja">${escapeHtml(o.loja||'—')}</span></td>
        <td>${escapeHtml(o.vendedora)}</td>
        <td>${fmtDate(o.validade)}</td>
        <td>${fmtMoeda(o.valorTotal)}</td>
        <td>
          <span class="badge ${classeBadge}" data-orcstatus="${o.id}" title="${o.rascunho ? 'Clique para continuar preenchendo' : 'Clique para mudar o status'}" style="cursor:pointer;">${escapeHtml(rotuloStatus)}</span>
        </td>
        <td style="white-space:nowrap;">
          ${o.telefone ? `<button class="icon-btn icon-btn-wa" data-orcwa="${o.id}" title="WhatsApp">${waIconSvg()}</button>` : ''}
          ${o.email ? `<button class="icon-btn" data-orcmail="${o.id}" title="E-mail">✉️</button>` : ''}
          <button class="icon-btn" data-editar="${o.id}" title="Editar">✎</button>
          <button class="icon-btn" data-ver="${o.id}" title="Ver / editar">👁️</button>
          <button class="icon-btn" data-excluir="${o.id}" title="Excluir" style="color:var(--danger);">🗑️</button>
        </td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('[data-ver]').forEach(b=>{
      b.addEventListener('click', ()=> abrirDetalheOrcamento(orcamentos.find(o=>o.id===b.dataset.ver)) );
    });
    tbody.querySelectorAll('[data-editar]').forEach(b=>{
      b.addEventListener('click', ()=>{
        orcamentoEmEdicao = orcamentos.find(o=>o.id===b.dataset.editar);
        currentTab = 'novo';
        renderTabs();
        renderView();
      });
    });
    tbody.querySelectorAll('[data-orcstatus]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const o = orcamentos.find(x=>x.id===b.dataset.orcstatus);
        if(o && o.rascunho){
          orcamentoEmEdicao = o;
          currentTab = 'novo';
          renderTabs();
          renderView();
        } else {
          mudarStatusOrcRapido(b.dataset.orcstatus);
        }
      });
    });
    tbody.querySelectorAll('[data-orcwa]').forEach(b=>{
      b.addEventListener('click', ()=> enviarWhatsAppOrcId(b.dataset.orcwa) );
    });
    tbody.querySelectorAll('[data-orcmail]').forEach(b=>{
      b.addEventListener('click', ()=> enviarEmailOrcId(b.dataset.orcmail) );
    });
    tbody.querySelectorAll('[data-excluir]').forEach(b=>{
      b.addEventListener('click', ()=> confirmarExcluirOrcamento(b.dataset.excluir) );
    });
  }
  draw();
  document.getElementById('fLoja').addEventListener('change', draw);
  document.getElementById('fStatus').addEventListener('change', draw);
  document.getElementById('fVendedora').addEventListener('change', draw);
  document.getElementById('fBusca').addEventListener('input', draw);
  if(window.__lojaAtual && window.__lojaAtual.id){
    const fLoja = document.getElementById('fLoja');
    fLoja.value = window.__lojaAtual.id;
    fLoja.title = 'Filtrando pela loja ativa — selecione outra loja ou "Todas as lojas" pra ver as demais.';
    draw();
  }
}

/* Ações rápidas direto na linha da lista (mesmo padrão usado no módulo Marketing):
 * mudar status, WhatsApp e e-mail sem precisar abrir o detalhe completo. */
async function mudarStatusOrcRapido(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  openModal(`
    <h3 style="margin:0 0 16px;">Mudar status — ${escapeHtml(o.cliente||'—')}</h3>
    <div class="field"><label>Novo status</label>
      <select id="novoStatusSelRapido">${statusList().map(s=>`<option value="${s.id}" ${s.id===o.status?'selected':''}>${escapeHtml(s.nome)}${s.encerra?' (encerra)':''}</option>`).join('')}</select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnSalvarStatusRapido">Salvar</button>
      <button class="btn btn-ghost" id="btnCancelarStatusRapido">Cancelar</button>
    </div>
  `);
  document.getElementById('btnCancelarStatusRapido').addEventListener('click', closeModal);
  document.getElementById('btnSalvarStatusRapido').addEventListener('click', async ()=>{
    o.status = document.getElementById('novoStatusSelRapido').value;
    o.rascunho = false;
    const ok = await orcamentoSalvar(o);
    if(ok){ closeModal(); renderView(); showToast('Status atualizado.'); }
  });
}
function enviarWhatsAppOrcId(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o || !o.telefone){ showToast('Este orçamento não tem telefone salvo.'); return; }
  const info = statusInfoDe(o.status);
  const template = (info && info.mensagemWhatsapp) || MENSAGEM_WHATSAPP_PADRAO;
  const msg = encodeURIComponent(montarMensagemStatus(o, template));
  const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
async function enviarEmailOrcId(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o || !o.email){ showToast('Este orçamento não tem e-mail salvo.'); return; }
  const info = statusInfoDe(o.status);
  const assunto = montarMensagemStatus(o, (info && info.assuntoEmail) || MENSAGEM_EMAIL_ASSUNTO_PADRAO);
  const corpo = montarMensagemStatus(o, (info && info.mensagemEmail) || MENSAGEM_EMAIL_PADRAO);
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-email-gmail`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ to:o.email, subject:assunto, body:corpo })
    });
    if(!r.ok) throw new Error('falha no envio');
    showToast('E-mail enviado!');
  }catch(e){
    showToast('Falha ao enviar e-mail.');
  }
}

function confirmarExcluirOrcamento(orcId){
  const o = orcamentos.find(x=>x.id===orcId);
  if(!o) return;
  openModal(`
    <h3 style="margin:0 0 12px;">Excluir orçamento?</h3>
    <p class="muted">Tem certeza que quer excluir o orçamento de <b>${escapeHtml(o.cliente||'—')}</b>${o.valorTotal ? ` (${fmtMoeda(o.valorTotal)})` : ''}? Essa ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarExcluirOrc">Cancelar</button>
      <button class="btn" style="background:var(--danger); color:#fff;" id="btnConfirmarExcluirOrc">🗑️ Excluir</button>
    </div>
  `);
  document.getElementById('btnCancelarExcluirOrc').addEventListener('click', closeModal);
  document.getElementById('btnConfirmarExcluirOrc').addEventListener('click', async ()=>{
    const ok = await orcamentoExcluir(orcId);
    if(ok){
      orcamentos = orcamentos.filter(x=>x.id!==orcId);
      closeModal();
      renderView();
      showToast('Orçamento excluído.');
    }
  });
}

      const url = `https://wa.me/55${onlyDigits(o.telefone)}?text=${msg}`;
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);

/** Abre uma janela de impressão em formato de bobina (recibo térmico), com a largura configurada. */
const ESCALA_BOBINA_PX = {
  pequena: { base:12, titulo:14, sub:11 },
  media:   { base:14, titulo:17, sub:12.5 },
  grande:  { base:16.5, titulo:20, sub:14.5 },
};
function abrirImpressaoBobina(titulo, conteudoHtml, larguraMm){
  const impCfg = config.impressao || {};
  const px = ESCALA_BOBINA_PX[impCfg.escalaTexto] || ESCALA_BOBINA_PX.media;
  const peso = impCfg.negrito!==false ? 700 : 400;
  const reforcoCss = impCfg.reforcoTraco ? 'text-shadow:0.3px 0 0 currentColor, -0.3px 0 0 currentColor;' : '';
  const rodape = (impCfg.mensagemRodape||'').trim();
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titulo)}</title>
<style>
  @page{ size:${larguraMm}mm auto; margin:0; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ font-family:'Courier New', monospace; width:${larguraMm}mm; margin:0 auto; padding:4mm 3mm; color:#000; font-weight:${peso}; font-size:${px.base}px; line-height:1.42; -webkit-font-smoothing:none; ${reforcoCss} }
  .titulo{ font-size:${px.titulo}px; font-weight:800; text-align:center; letter-spacing:.02em; }
  .sub{ font-size:${px.sub}px; color:#000; text-align:center; }
  .linha{ border-top:1px dashed #000; margin:6px 0; }
  .rodape{ text-align:center; margin-top:10px; font-size:${px.sub}px; }
  b{ font-weight:800; }
  @media print{ body{ padding:1mm 2mm; } }
</style>
</head>
<body>
  ${conteudoHtml}
  ${rodape ? `<div class="linha"></div><div class="rodape">${escapeHtml(rodape)}</div>` : ''}
</body>
</html>`;
  const printWin = window.open('', '_blank', 'width=420,height=700');
  if(!printWin){ showToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups do navegador.'); return; }
  printWin.document.open();
  printWin.document.write(html);
  printWin.document.close();
  printWin.focus();
  setTimeout(()=>{ try{ printWin.print(); }catch(e){} }, 300);
}

function printOrcamento(o){
  const imp = (config.impressao && config.impressao.orcamentos) || {};
  const larguraMm = (config.impressao && config.impressao.larguraBobina) || 80;

  const linhas = [];
  linhas.push(`<div class="titulo">ORÇAMENTO</div>`);
  linhas.push(`<div class="sub">${escapeHtml(o.loja)}</div>`);
  linhas.push(`<div class="sub">${fmtDate(o.data)}</div>`);
  linhas.push(`<div class="linha"></div>`);

  if(imp.cliente !== false){
    linhas.push(`<div><b>Cliente:</b> ${escapeHtml(o.cliente||'—')}</div>`);
  }
  if(imp.telefone !== false && o.telefone){
    linhas.push(`<div><b>Telefone:</b> ${escapeHtml(o.telefone)}</div>`);
  }
  if(imp.vendedora !== false){
    linhas.push(`<div><b>Vendedora:</b> ${escapeHtml(o.vendedora||'—')}</div>`);
  }
  if(imp.validade !== false){
    linhas.push(`<div><b>Válido até:</b> ${fmtDate(o.validade)}</div>`);
  }

  if(imp.itens !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>ITENS</b></div>`);
    (o.itens||[]).forEach(it=>{
      linhas.push(`<div>${escapeHtml(it.produto)} x${it.quantidade} — ${fmtMoeda(it.valorUnitario)}</div>`);
    });
  }
  if(imp.valores !== false){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div><b>Total estimado: ${fmtMoeda(o.valorTotal)}</b></div>`);
  }
  if(o.observacoes){
    linhas.push(`<div class="linha"></div>`);
    linhas.push(`<div>${escapeHtml(o.observacoes)}</div>`);
  }

  abrirImpressaoBobina('Orçamento', linhas.join(''), larguraMm);
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'orcamentos' }, '*');
    return;
  }
})();
</script>
</body>
