<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#F1F4F7;
  --ink:#1A1D24; --ink-soft:#4B5566; --ink-faint:#7C8592; --muted:#7C8592; --line:#E1E5EA;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#F3E6D8;
  --danger:#B91C1C; --danger-soft:#FBEAEA;
  --ok:#17794A; --ok-soft:#E3F5EA;
  --wait:#B45309; --wait-soft:#FCEEDC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}

#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#24101B,#301722);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-wa{background:#e8faf0; border:1px solid #a8e6c5;}
.icon-btn:hover{background:rgba(255,255,255,0.1);}
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
.btn-wa{ background:#25D366; color:#08380F; }
.btn-wa:hover{ background:#1DA851; }

#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}

.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); box-shadow:0 2px 10px -4px rgba(43,15,31,0.08);}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.badge-pendente{background:var(--wait-soft); color:var(--wait);}
.badge-aprovado{background:var(--ok-soft); color:var(--ok);}
.badge-recusado{background:var(--danger-soft); color:var(--danger);}
.badge-expirado{background:#EDEDED; color:#666;}
.badge-vencido{background:var(--danger); color:#fff;}
.badge-cutucado{background:#EAE0FB; color:#6B3FA0;}
.badge-recusado-status{background:#3A3F44; color:#fff;}
.badge-rascunho{background:#EDEDED; color:#666; border:1px dashed #b3b3b3;}
.chip-vendedora{display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--danger); border:1.5px solid var(--danger); border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:800; cursor:pointer; transition:background .15s,color .15s;}
.chip-vendedora:hover{background:var(--danger); color:#fff;}
.link-msg-auto{background:none; border:none; color:var(--danger); font-size:12px; font-weight:700; cursor:pointer; padding:4px 2px; text-decoration:underline; text-underline-offset:2px; white-space:nowrap;}
.msg-enviada-tag{color:var(--ok); font-size:11.5px; font-weight:600; white-space:nowrap;}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.alerta-vencimento{background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13.5px;}
/* ── CSS itens (igual O.S.) ──────────────────────────── */
.item-row-desc .campo-perc,.item-row-desc .campo-val{width:72px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;height:34px;box-sizing:border-box;background:var(--surface);color:var(--ink);}
.item-row-desc .campo-perc:focus,.item-row-desc .campo-val:focus{border-color:var(--accent,#662344);outline:none;}
.item-row-desc{display:flex; gap:5px; align-items:center; flex-shrink:0; flex-wrap:wrap;}
.item-row-desc .desc-sep{font-size:11px;color:var(--ink-faint);font-weight:700;}
.item-row-desc .desc-total{font-size:12.5px; font-weight:700; color:var(--ok,#17794a); white-space:nowrap; min-width:70px;}
.item-row-obs{margin-top:6px;}
.item-row-obs input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);box-sizing:border-box;}
.item-row-obs input:focus{border-color:var(--accent,#662344);outline:none;}
.item-row{border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px;}
.item-row-topo{display:flex; gap:8px; align-items:center; flex-wrap:nowrap;}
.item-row-produto{flex:1; min-width:160px;}
.item-row-valor{width:110px; flex-shrink:0;}
.item-row-valor input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;height:36px;box-sizing:border-box;}
.item-row-valor input:focus{border-color:var(--accent,#662344);outline:none;}
.item-row-estoque{margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
@media (max-width:640px){ .item-row-produto{min-width:100%;}
@media (max-width:640px){ .item-row-produto{min-width:100%;} .item-row-topo{flex-wrap:wrap;}
.btn-ajuste{padding:5px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--ink-soft);height:34px;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;}
.btn-ajuste.ativo-desc{background:#fbeaea;color:#b91c1c;border-color:#b91c1c;}
.btn-ajuste.ativo-acr{background:#e3f5ea;color:#17794a;border-color:#17794a;}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#24101B; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}

/* Bolinha de ajuda (?) ao lado de campos que confundem */
.ajuda-ponto{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  background:var(--accent,#662344);color:#fff;font-size:11px;font-weight:800;cursor:help;margin-left:5px;
  vertical-align:middle;position:relative;flex-shrink:0;}
.ajuda-ponto .balao{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:#1A1D24;color:#fff;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
  line-height:1.5;width:250px;text-align:left;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.25);text-transform:none;letter-spacing:0;}
.ajuda-ponto:hover .balao,.ajuda-ponto.aberto .balao{display:block;}
.ajuda-ponto .balao::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#1A1D24;}
@media(max-width:600px){ .ajuda-ponto .balao{width:200px;} }
/* Autocomplete inline de cliente */
.cli-ac-wrap{position:relative;}
.cli-ac-input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#f8f6ff;color:var(--ink);outline:none;box-sizing:border-box;}
.cli-ac-input:focus{border-color:var(--accent,#662344);box-shadow:0 0 0 2px rgba(102,35,68,.12);}
.cli-ac-dropdown{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:200px;overflow-y:auto;z-index:1200;}
.cli-ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
.cli-ac-item:last-child{border-bottom:none;}
.cli-ac-item:hover,.cli-ac-item.focused{background:var(--surface-2);}
.cli-ac-item b{font-size:13.5px;}
.cli-ac-item span{font-size:12px;color:var(--muted);}
.cli-ac-msg{padding:10px 12px;font-size:12.5px;color:var(--muted);}
.cli-ac-selecionado{display:flex;align-items:center;gap:8px;background:var(--ok-soft,#e3f5ea);border:1px solid var(--ok,#17794a);border-radius:8px;padding:8px 10px;font-size:13.5px;}
.cli-ac-selecionado b{color:var(--ok,#17794a);flex:1;}
.cli-ac-selecionado .cli-ac-clear{background:none;border:none;cursor:pointer;font-size:16px;color:var(--ok,#17794a);padding:0 2px;line-height:1;font-weight:700;}
.cli-ac-selecionado .cli-ac-edit{background:none;border:none;cursor:pointer;font-size:12px;color:var(--ok,#17794a);text-decoration:underline;padding:0;font-weight:600;}
.field input:not([readonly]):not([type=hidden]),.field select,.field textarea{background:#f8f6ff!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.07);}


/* Cards de resultado de busca de cliente */
.cli-result-card{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s;}
.cli-result-card:last-child{border-bottom:none;}
.cli-result-card:hover,.cli-result-card.focused{background:var(--surface-2);}
.cli-result-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent,#662344);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.01em;}
.cli-result-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.cli-result-nome{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cli-result-sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.cli-result-tag{font-size:11.5px;color:var(--ink-faint);}

/* ── Autocomplete de produto (igual vendas) ─────────────────── */
.prod-ac-fator-inline{font-size:11.5px;color:var(--ok,#17794a);margin-left:6px;white-space:nowrap;flex-shrink:0;}
.prod-ac-wrap{position:relative;}
.prod-ac-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);outline:none;box-sizing:border-box;min-width:0;}
.prod-ac-input:focus{border-color:var(--accent,#662344);box-shadow:0 0 0 2px rgba(102,35,68,.1);}
.prod-ac-drop{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:1300;}
.prod-ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
.prod-ac-item:last-child{border-bottom:none;}
.prod-ac-item:hover,.prod-ac-item.pf{background:var(--surface-2);}
.prod-ac-item b{display:block;font-size:13px;}
.prod-ac-item span{font-size:11.5px;color:var(--ink-faint);}
.prod-ac-sel{display:flex;align-items:center;gap:6px;background:var(--ok-soft,#e3f5ea);border:1px solid var(--ok,#17794a);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0;}
.prod-ac-sel b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ok,#17794a);}
.prod-ac-sel .pa-clr{background:none;border:none;cursor:pointer;font-size:15px;color:var(--ok,#17794a);padding:0 2px;font-weight:700;flex-shrink:0;}
.prod-ac-fator{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.cli-ac-input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--ink);outline:none;box-sizing:border-box;}
.cli-ac-item span{font-size:12px;color:var(--ink-faint);}
.cli-ac-msg{padding:10px 12px;font-size:12.5px;color:var(--ink-faint);}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Orçamentos</div>
    <div class="login-title">Acessar orçamentos</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira com a diretoria.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint">Use a mesma senha do restante do sistema.</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">📝</div>
      <div class="brand-name">Orçamentos</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair">🚪</button>
    </div>
  </header>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

let config = null;
let orcamentos = [];
let currentUser = null;
let currentTab = 'lista';
/* ── PERMISSÃO POR LOJA ────────────────────────────────────────────────────── */
function ehGestaoLoja(){
  return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente');
}
function podeEditarRegistro(reg){
  if(!currentUser || !reg) return false;
  if(ehGestaoLoja()) return true;
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return false;
  return (reg.lojaId||null) === lojaAtiva;
}
function motivoSemEdicao(reg){
  if(ehGestaoLoja()) return '';
  const lojaAtiva = window.__lojaAtual ? window.__lojaAtual.id : null;
  if(!lojaAtiva) return 'Selecione uma loja no topo para editar.';
  const l = (config.lojas||[]).find(x=>x.id===(reg&&reg.lojaId));
  return 'Este orçamento é da loja ' + (l ? l.nome : 'outra') + ' — você pode visualizar e imprimir, mas não editar.';
}

let orcamentoEmEdicao = null;
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',

/**
 * Lê a tabela inteira, em páginas de 1000. O servidor devolve no máximo 1000 linhas por
 * requisição, então tabelas grandes (clientes_cadastro tem dezenas de milhares) vinham
 * truncadas — a busca de cliente simplesmente não encontrava quem estava fora dessas
 * primeiras mil linhas. Tabela pequena continua custando uma requisição só.
 */
async function gatewaySelectTudo(table){
  const linhas = [];
  for(let pagina=0; pagina<500; pagina++){
    const r = await gatewayCall({ op:'selectPage', table, params:{ from: linhas.length, tamanho: 5000 } });
    if(!r || r.error){ console.error('erro lendo '+table, r && r.error); return { data: linhas, error: r && r.error }; }
    const lote = r.data || [];
    linhas.push(...lote);
    if(r.fim || lote.length === 0) break;
  }
  return { data: linhas, error: null };
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewaySelectTudo(table); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

/* Prazos do acompanhamento automático (dias desde a criação do orçamento) — editáveis em
 * Configurações de mensagens de orçamento. Guardado em gestao_config, chave própria

const PRAZOS_AUTO_MSG_PADRAO = { t1:3, t2:6, t3:9, tFinal:15, diasValidade:15 };
function prazosAutoMsg(){
  const p = config && config.orcamentoAutoMsgConfig;
  if(!p || p.t1==null || p.t2==null || p.t3==null || p.tFinal==null) return PRAZOS_AUTO_MSG_PADRAO;
  return { diasValidade: PRAZOS_AUTO_MSG_PADRAO.diasValidade, ...p };
}
async function salvarPrazosAutoMsg(prazos){
  if(!config) config = {};
  config.orcamentoAutoMsgConfig = prazos;
  const r = await gatewayCall({ op:'saveConfig', params:{ payload: config } });
  if(r && r.error){ showToast('Não foi possível salvar os prazos: '+r.error); return false; }

function diasDesdeCriacao(o){
  const base = o.autoBaseData || o.data || (o.criadoEm ? new Date(o.criadoEm).toISOString().slice(0,10) : null);
  if(!base) return 0;
  const hoje = new Date(todayStr()+'T00:00:00');
  const d0 = new Date(base+'T00:00:00');
  return Math.max(0, Math.floor((hoje - d0) / 86400000));
}
/** Reinicia o acompanhamento automático a partir de hoje — chamado sempre que o status é
 * trocado manualmente (qualquer direção). Assim, um orçamento que já tinha passado do prazo
 * (ex: virou "Recusado" sozinho) e volta pra um status em aberto começa a contar os prazos
 * de novo a partir dessa mudança, em vez de continuar usando a data de criação original. */
function reiniciarAutoAposMudancaManual(o){
  o.autoBaseData = todayStr();
  o.autoMensagensEnviadas = 0;
  o.editadoManualmente = false;
}
/* Acompanhamento automático (local a este módulo — não escreve nos status configuráveis
 * de Cadastro, só sobrepõe o rótulo/cor enquanto o orçamento está em aberto):
 *  - Aberto → no prazo 1 (padrão 3 dias) fica vermelho, precisa mandar mensagem.
 *  - Ao enviar, vira "Ação de fixação" (verde) até o prazo 2 (padrão 6 dias), aí fica vermelho de novo.
 *  - Ao enviar, vira "Prorrogado à ação" (verde) até o prazo 3 (padrão 9 dias), vermelho de novo.
 *  - Ao enviar essa 3ª mensagem, fica verde e para por aí — não pede mais mensagem.
 * O contador (quantas mensagens automáticas já foram enviadas) fica em o.autoMensagensEnviadas. */
function estagioAutoOrcamento(o){
  if(o.rascunho) return null;
  const info = statusInfoDe(o.status);
  if(info && info.encerra) return null; // aprovado/recusado (manual ou automático): desativa
  const prazos = prazosAutoMsg();
  const dias = diasDesdeCriacao(o);
  const N = o.autoMensagensEnviadas || 0;
  const limites = [prazos.t1, prazos.t2, prazos.t3];
  const nomes = ['Aberto', 'Ação de fixação', 'Prorrogado à ação'];
  const nome = nomes[Math.min(N,2)];
  const limiteAtual = N<3 ? limites[N] : null;
  const precisaEnviar = limiteAtual!=null && dias>=limiteAtual;
  const enviadoRecente = N>0 && !precisaEnviar;
  const cor = precisaEnviar ? 'vermelho' : (enviadoRecente ? 'verde' : 'neutro');
  return { nome, dias, N, limiteAtual, precisaEnviar, enviadoRecente, cor, prazoFinal: prazos.tFinal };
}
/* Se passou do prazo final (padrão 15 dias) sem edição/aprovação manual, encerra sozinho
 * como Recusado — esse é um status real (já existe na configuração), então grava de verdade. */
function aplicarPrazoFinalAutoSeNecessario(o){
  if(o.rascunho) return false;
  const info = statusInfoDe(o.status);
  if(info && info.encerra) return false;
  if(o.editadoManualmente) return false;
  const prazos = prazosAutoMsg();
  if(diasDesdeCriacao(o) >= prazos.tFinal){
    o.status = 'recusado';
    orcamentoSalvar(o).catch(()=>{});
    return true;
  }
  return false;
}
function diasParaVencer(o){
  if(!o.validade) return null;
  const hoje = new Date(todayStr()+'T00:00:00');
  const val = new Date(o.validade+'T00:00:00');
  return Math.round((val-hoje)/86400000);
}
/** Orçamentos ainda em aberto (status não-encerrado) que vencem em até 3 dias, ou já venceram. */
function orcamentosParaAvisar(){
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    const dias = diasParaVencer(o);
    return dias !== null && dias <= 3;
  });
}
/** Há quantos dias o orçamento foi criado (baseado na data de criação, não na validade). */
function diasAberto(o){
  const hoje = new Date(todayStr()+'T00:00:00');
  const criado = new Date((o.data||todayStr())+'T00:00:00');
  return Math.round((hoje-criado)/86400000);
}
/** Orçamentos em aberto (status não-encerrado) criados há mais de 5 dias, sem resposta. */
function orcamentosAbertosMaisDe5Dias(){
  return orcamentos.filter(o=>{
    const info = statusInfoDe(o.status);
    if(info && info.encerra) return false;
    return diasAberto(o) > 5;
  });
}
/** Agrupa uma lista de orçamentos por nome de vendedora. */
function agruparPorVendedora(lista){
  const map = {};
  lista.forEach(o=>{
    const v = o.vendedora || 'Sem vendedora';
    if(!map[v]) map[v] = [];

}

function montarMensagemStatus(o, mensagem){
  return (mensagem||'')

    .replaceAll('{loja}', o.loja||'')
    .replaceAll('{valor}', fmtMoeda(o.valorTotal))

}

/** Nome que aparece nas listas: apelido do cadastro, ou nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
function nomeGravadoParaExibicao(lista, nomeGravado){
  const f = (lista||[]).find(x=>funcionarioBateComNome(x, nomeGravado));
  return f ? nomeExibicaoFuncionario(f) : nomeGravado;
}
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function onlyDigitsCpf(s){ return (s||'').replace(/\D/g,''); }
function separarTelefone(str){
  const digitos = onlyDigits(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
function formatarNumeroTelefone(digitos){
  digitos = digitos.slice(0,9);
  if(digitos.length<=4) return digitos;
  if(digitos.length<=8) return digitos.slice(0,digitos.length-4)+'-'+digitos.slice(-4);
  return digitos.slice(0,5)+'-'+digitos.slice(5);
}
function wireTelefoneMask(prefix){
  const dddInp = document.getElementById(prefix+'_telefoneDDD');
  const numInp = document.getElementById(prefix+'_telefoneNum');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigits(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefone(onlyDigits(numInp.value)); });
}
function combinarTelefoneValidado(prefix){
  const ddd = onlyDigits((document.getElementById(prefix+'_telefoneDDD')||{}).value);
  const numero = onlyDigits((document.getElementById(prefix+'_telefoneNum')||{}).value);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==9){
    showToast('Telefone incompleto — preencha o DDD (2 dígitos) e o número (9 dígitos), ou deixe os dois em branco.');
    return null;
  }
  return `(${ddd}) ${numero.slice(0,5)}-${numero.slice(5)}`;
}
function findClienteIndex(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  return clientes.findIndex(c=>
    (tel && onlyDigits(c.telefone) === tel) ||
    (doc && onlyDigitsCpf(c.cpf) === doc)
  );
}
async function clientesGet(){
  try{
    const { data, error } = await supabaseClient.from('clientes_cadastro').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar clientes', e); return []; }
}
/** Busca sob demanda no banco (não pré-carrega os 20 mil+ clientes de uma vez).
 * Aceita nome (parcial) ou telefone/CPF (dígitos, casamento parcial). */
async function buscarClientesRemoto(termo){
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    // Guarda no cache local (pra o clique no resultado e o botão "editar cadastro" acharem na hora).
    achados.forEach(c=>{ if(!clientes.some(x=>x.id===c.id)) clientes.push(c); });
    return achados;
  }catch(e){ console.error('erro ao buscar clientes', e); return []; }
}
/** Localiza no banco um cliente por telefone ou CPF (usado pra evitar duplicar cadastro
 * e pra achar o cliente de um orçamento já salvo, sem precisar de tudo em memória). */
async function buscarClientePorTelefoneOuCpf(telefone, cpf){
  const tel = onlyDigits(telefone);
  const doc = onlyDigitsCpf(cpf);
  if(!tel && !doc) return null;
  const cacheado = clientes.find(c=>
    (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
  );
  if(cacheado) return cacheado;
  try{
    const r = await gatewayCall({ op:'searchClients', params:{ termo: doc || tel } });
    if(r && r.error) throw new Error(r.error);
    const achados = (r && r.data) || [];
    const achado = achados.find(c=>
      (tel && onlyDigits(c.telefone||'')===tel) || (doc && onlyDigitsCpf(c.cpf||'')===doc)
    ) || null;
    if(achado) clientes.push(achado);
    return achado;
  }catch(e){ console.error('erro ao localizar cliente', e); return null; }
}
async function salvarUmCliente(cliente){
  try{
    const { error } = await supabaseClient.from('clientes_cadastro').upsert({ id: cliente.id, payload: cliente });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar cliente', e); showToast('Não foi possível salvar o cliente.'); return false; }
}
async function buscarEnderecoPorCep(cep){
  const cepDigits = onlyDigits(cep);
  if(cepDigits.length !== 8) return null;
  // Tenta ViaCEP primeiro, BrasilAPI como fallback
  const fontes = [
    async () => {
      const r = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
      const d = await r.json();
      if(d.erro) return null;
      return { endereco: d.logradouro||'', bairro: d.bairro||'', cidade: d.localidade||'', estado: d.uf||'' };
    },
    async () => {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${cepDigits}`);
      if(!r.ok) return null;
      const d = await r.json();
      return { endereco: d.street||'', bairro: d.neighborhood||'', cidade: d.city||'', estado: d.state||'' };
    }
  ];
  for(const fn of fontes){
    try{ const res = await fn(); if(res) return res; }catch(e){}
  }
  return null;
}

// Busca CPF na Receita Federal via BrasilAPI — retorna { nome, situacao } ou null
async function buscarCpfReceita(cpf){
  const digits = onlyDigits(cpf);
  if(digits.length !== 11) return null;
  try{
    const r = await fetch(`https://brasilapi.com.br/api/cpf/v1/${digits}`);
    if(!r.ok) return null;
    const d = await r.json();
    // BrasilAPI retorna { cpf, name, birthday, situation }
    if(!d || !d.name) return null;
    return { nome: d.name, situacao: d.situation||'' };
  }catch(e){ return null; }
}

  c = c || {};
  const nome = c.cliente !== undefined ? c.cliente : (c.nome || '');
  const tel = separarTelefone(c.telefone||'');
  return `
    <div class="grid-2">
      <div class="field"><label>CPF</label><input id="${prefix}_cpf" placeholder="000.000.000-00" value="${escapeHtml(c.cpf||'')}"></div>
      <div class="field"><label>Nome do cliente</label><input id="${prefix}_cliente" placeholder="Nome completo" value="${escapeHtml(nome)}"></div>
      <div class="field"><label>Telefone / WhatsApp</label><div style="display:flex; gap:6px;">
        <input id="${prefix}_telefoneDDD" placeholder="DDD" maxlength="2" inputmode="numeric" style="width:56px; flex-shrink:0;" value="${escapeHtml(tel.ddd)}">
        <input id="${prefix}_telefoneNum" placeholder="00000-0000" maxlength="10" inputmode="numeric" value="${escapeHtml(tel.numero.length>=8 ? formatarNumeroTelefone(tel.numero) : tel.numero)}">
      </div></div>
      <div class="field"><label>E-mail do cliente</label><input type="email" id="${prefix}_email" placeholder="cliente@email.com" value="${escapeHtml(c.email||'')}"></div>
      <div class="field"><label>Data de nascimento</label><input type="date" id="${prefix}_nascimento" value="${c.dataNascimento||''}"></div>
      <div class="field"><label>CEP</label><input id="${prefix}_cep" placeholder="00000-000" value="${escapeHtml(c.cep||'')}"></div>
    </div>
    <div class="grid-2" style="margin-top:10px;">
      <div class="field"><label>Endereço</label><input id="${prefix}_endereco" placeholder="Rua / Avenida" value="${escapeHtml(c.endereco||'')}"></div>
      <div class="field"><label>Número</label><input id="${prefix}_numero" placeholder="Nº" value="${escapeHtml(c.numero||'')}"></div>
      <div class="field"><label>Complemento</label><input id="${prefix}_complemento" placeholder="Apto, bloco…" value="${escapeHtml(c.complemento||'')}"></div>
      <div class="field"><label>Bairro</label><input id="${prefix}_bairro" placeholder="Bairro" value="${escapeHtml(c.bairro||'')}"></div>
      <div class="field"><label>Cidade</label><input id="${prefix}_cidade" placeholder="Cidade" value="${escapeHtml(c.cidade||'')}"></div>
      <div class="field"><label>Estado</label><input id="${prefix}_estado" placeholder="UF" maxlength="2" style="text-transform:uppercase;" value="${escapeHtml((c.estado||'').toUpperCase())}"></div>
    </div>
  `;
}
function wireClienteFields(prefix){
  wireTelefoneMask(prefix);

  // Auto-fill de endereço ao digitar/sair do CEP
  const cepInp = document.getElementById(prefix+'_cep');
  if(cepInp){
    cepInp.addEventListener('blur', async ()=>{
      const cepDigits = onlyDigits(cepInp.value);
      if(cepDigits.length !== 8) return;
      cepInp.placeholder = '⏳ buscando...';
      const endereco = await buscarEnderecoPorCep(cepDigits);
      cepInp.placeholder = '00000-000';
      if(!endereco){ showToast('CEP não encontrado.'); return; }
      const f = k => document.getElementById(prefix+'_'+k);
      if(f('endereco') && !f('endereco').value) f('endereco').value = endereco.endereco;
      if(f('bairro')   && !f('bairro').value)   f('bairro').value   = endereco.bairro;
      if(f('cidade')   && !f('cidade').value)    f('cidade').value   = endereco.cidade;
      if(f('estado')   && !f('estado').value)    f('estado').value   = endereco.estado;
      // focar no número após preencher
      const numInp = f('numero'); if(numInp) numInp.focus();
      showToast('Endereço preenchido — informe o número.');
    });
  }

  // Auto-busca de nome na Receita Federal ao sair do campo CPF
  const cpfInp = document.getElementById(prefix+'_cpf');
  const nomeInp = document.getElementById(prefix+'_cliente');
  if(cpfInp && nomeInp){
    cpfInp.addEventListener('blur', async ()=>{
      const digits = onlyDigits(cpfInp.value);
      if(digits.length !== 11) return;
      if(nomeInp.value.trim()) return; // já tem nome preenchido, não sobrescreve
      cpfInp.style.background = '#fffbe6';
      const res = await buscarCpfReceita(digits);
      cpfInp.style.background = '';
      if(res && res.nome){
        nomeInp.value = res.nome;
        showToast('Nome preenchido pela Receita Federal — confira.');
      }
    });
  }
}
// Gera o HTML de um card de resultado de busca de cliente
function clienteCardHtml(c, idx){
  const partes = (c.nome||'').trim().split(/\s+/);
  const iniciais = partes.length>=2 ? partes[0][0]+partes[partes.length-1][0] : (partes[0]||'?')[0];
  const cpfFmt = c.cpf ? String(c.cpf).replace(/[^\d]/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : '';
  const tags = [
    c.telefone ? `<span class="cli-result-tag">📞 ${escapeHtml(c.telefone)}</span>` : '',
    cpfFmt     ? `<span class="cli-result-tag">· ${escapeHtml(cpfFmt)}</span>` : '',
    c.cidade   ? `<span class="cli-result-tag">· 📍 ${escapeHtml(c.cidade)}</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="cli-result-card" data-idx="${idx}">
    <div class="cli-result-avatar">${escapeHtml(iniciais.toUpperCase())}</div>
    <div class="cli-result-info">
      <div class="cli-result-nome">${escapeHtml(c.nome||'')}</div>
      ${tags ? `<div class="cli-result-sub">${tags}</div>` : ''}
    </div>
  </div>`;
}

function montarClienteAutocomplete(wrap, onSel, inicial){
  let clienteSel=inicial||null, timer=null, focusIdx=-1;
  function renderWrap(){
    if(clienteSel){
      wrap.innerHTML=`<div class="cli-ac-selecionado">
        <b>${escapeHtml(clienteSel.nome)}</b>
        ${clienteSel.telefone?`<span style="color:var(--ink-soft);font-size:12.5px;">${escapeHtml(clienteSel.telefone)}</span>`:''}
        <button type="button" class="cli-ac-edit" id="cliAcEdit_orc">✎ Editar</button>
        <button type="button" class="cli-ac-clear" id="cliAcClear_orc">×</button>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="cliAcCad_orc" style="margin-top:6px;">+ Cadastrar cliente novo</button>`;
      wrap.querySelector('#cliAcClear_orc').addEventListener('click',()=>{clienteSel=null;onSel(null);renderWrap();});
      wrap.querySelector('#cliAcEdit_orc').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();},clienteSel);});
      wrap.querySelector('#cliAcCad_orc').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    } else {
      wrap.innerHTML=`<div class="cli-ac-wrap"><input class="cli-ac-input" id="cliAcInp_orc" placeholder="Digite nome, telefone ou CPF..." autocomplete="off" spellcheck="false"><div class="cli-ac-dropdown" id="cliAcDrop_orc" style="display:none;"></div></div>
      <button type="button" class="btn btn-ghost btn-sm" id="cliAcCad_orc" style="margin-top:6px;">+ Cadastrar cliente novo</button>`;
      const inp=wrap.querySelector('#cliAcInp_orc'),drop=wrap.querySelector('#cliAcDrop_orc');
      function fechar(){drop.style.display='none';focusIdx=-1;}
      function msg(t){drop.innerHTML=`<div class="cli-ac-msg">${t}</div>`;drop.style.display='block';}
      function renderRes(ach){
        if(ach.length){
          drop.innerHTML=ach.map((c,i)=>clienteCardHtml(c,i)).join('');
          drop.style.display='block';
          drop.querySelectorAll('.cli-result-card').forEach((el,i)=>{
            el.addEventListener('mousedown',e=>{e.preventDefault();clienteSel=ach[i];onSel(ach[i]);fechar();renderWrap();});
            el.addEventListener('mouseover',()=>{focusIdx=i;drop.querySelectorAll('.cli-result-card').forEach((e,k)=>e.classList.toggle('focused',k===i));});
          });
        } else {
          const t=inp.value.trim();
          const parece_cpf=/^[\d.\-]+$/.test(t)&&onlyDigits(t).length===11;
          drop.innerHTML=`
            <div style="padding:10px 12px;">
              <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:8px;">Nenhum cliente encontrado no cadastro.</div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${parece_cpf?`<button type="button" class="btn btn-ghost btn-sm" id="cliAcBtnReceita" style="justify-content:flex-start;gap:8px;">🔎 Buscar na Receita Federal</button><div id="cliAcReceitaResult" style="font-size:12px;padding:0 2px;display:none;"></div>`:''}
                <button type="button" class="btn btn-ghost btn-sm" id="cliAcBtnCad2" style="justify-content:flex-start;gap:8px;">＋ Cadastrar novo cliente</button>
              </div>
            </div>`;
          drop.style.display='block';
          if(parece_cpf){
            drop.querySelector('#cliAcBtnReceita')?.addEventListener('mousedown',async e=>{
              e.preventDefault();
              const btn=drop.querySelector('#cliAcBtnReceita');
              const div=drop.querySelector('#cliAcReceitaResult');
              btn.disabled=true;btn.textContent='⏳ Consultando...';
              const res=await buscarCpfReceita(onlyDigits(t));
              btn.disabled=false;
              if(!res||!res.nome){
                div.style.display='block';
                div.innerHTML='<span style="color:var(--danger);">CPF não encontrado ou serviço indisponível.</span>';
                btn.textContent='🔎 Buscar na Receita Federal';
              } else {
                fechar();
                abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();},{nome:res.nome,cpf:t});
              }
            });
          }
          drop.querySelector('#cliAcBtnCad2')?.addEventListener('mousedown',e=>{
            e.preventDefault();fechar();
            abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});
          });
        }
      }
      inp.addEventListener('input',()=>{
        const t=inp.value.trim();focusIdx=-1;
        if(t.length<2){fechar();return;}
        msg('Buscando...');clearTimeout(timer);
        timer=setTimeout(async()=>{
          const r=await gatewayCall({op:'searchClients',params:{termo:t}});
          if(inp.value.trim()!==t)return;
          renderRes((r&&r.data)||[]);
        },280);
      });
      inp.addEventListener('keydown',e=>{
        const items=drop.querySelectorAll('.cli-ac-item');if(!items.length)return;
        if(e.key==='ArrowDown'){e.preventDefault();focusIdx=Math.min(focusIdx+1,items.length-1);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='ArrowUp'){e.preventDefault();focusIdx=Math.max(focusIdx-1,0);items.forEach((el,k)=>el.classList.toggle('focused',k===focusIdx));}
        else if(e.key==='Enter'&&focusIdx>=0){e.preventDefault();items[focusIdx].dispatchEvent(new MouseEvent('mousedown'));}
        else if(e.key==='Escape'){fechar();}
      });
      document.addEventListener('mousedown',function h(e){if(!wrap.contains(e.target)){fechar();document.removeEventListener('mousedown',h);}});
      wrap.querySelector('#cliAcCad_orc').addEventListener('click',()=>{abrirSeletorCliente(c=>{clienteSel=c;onSel(c);renderWrap();});});
    }
  }
  renderWrap();
  return {getCliente:()=>clienteSel};
}

function abrirSeletorCliente(onConfirmar, clienteAtual){
  let selecionado = clienteAtual ? { ...clienteAtual } : null;
  openModal(`
    <h3>Cliente</h3>
    <div class="field"><label>🔍 Buscar cliente já cadastrado</label><input id="busca_cliente" placeholder="Nome, telefone ou CPF..." autocomplete="off"></div>
    <div id="resultados_cliente" style="max-height:180px; overflow-y:auto; margin-bottom:12px;"></div>
    <div style="border-top:1px solid var(--line); padding-top:12px;">
      <p class="muted" style="margin:0 0 8px;">Ou preencha os dados abaixo pra cadastrar um cliente novo:</p>
      ${clienteFieldsHtml('sel', clienteAtual || {})}
    </div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnConfirmarSelecaoCliente">Confirmar</button>
      <button class="btn btn-ghost" id="btnCancelarSelecaoCliente">Cancelar</button>
    </div>
  `);
  wireClienteFields('sel');

  function preencherFormulario(c){
    const map = { cpf:c.cpf, cliente:c.nome, email:c.email, nascimento:c.dataNascimento,
      cep:c.cep, endereco:c.endereco, numero:c.numero, complemento:c.complemento, bairro:c.bairro, cidade:c.cidade, estado:c.estado };
    Object.keys(map).forEach(campo=>{
      const el = document.getElementById('sel_'+campo);
      if(el) el.value = map[campo] || '';
    });
    const tel = separarTelefone(c.telefone||'');
    const dddEl = document.getElementById('sel_telefoneDDD');
    const numEl = document.getElementById('sel_telefoneNum');
    if(dddEl) dddEl.value = tel.ddd;
    if(numEl) numEl.value = formatarNumeroTelefone(tel.numero);
    selecionado = c;
  }
  let buscaClienteTimeout = null;
function renderResultados(termo){
    const wrap = document.getElementById('resultados_cliente');
    if(!termo || termo.length<2){ wrap.innerHTML=''; return; }
    wrap.innerHTML = `<div class="muted" style="padding:6px;">Buscando...</div>`;
    buscarClientesComDebounce(termo, (achados)=>{
      if(achados.length > 0){
        wrap.innerHTML = achados.map((c,i)=>{
          const card = clienteCardHtml(c,i);
          return card.replace('data-idx="'+i+'"','data-selcli="'+(c.id||'')+'"');
        }).join('');
        wrap.querySelectorAll('[data-selcli]').forEach(el=>{
          el.addEventListener('click', ()=>{
            const c = achados.find(x=>x.id===el.dataset.selcli);
            if(c){ preencherFormulario(c); showToast('Dados preenchidos — confira e confirme.'); }
          });

    inp.addEventListener('input',()=>{ clearTimeout(timer); timer=setTimeout(()=>{
      const t=inp.value.toLowerCase().trim();
      if(!t){ fechar(); return; }
      const __lista=(produtosEstoque||[]).filter(p=>p.vendavel!==false&&p.nome&&p.nome.toLowerCase().includes(t)).slice(0,15); window.__orcListaProd=__lista; renderDrop(__lista);
    },120); });
    inp.addEventListener('keydown',e=>{
      const items=drop.querySelectorAll('[data-pk]');
      if(!items.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); focus=Math.min(focus+1,items.length-1); items.forEach((el,k)=>el.classList.toggle('pf',k===focus)); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); focus=Math.max(focus-1,0); items.forEach((el,k)=>el.classList.toggle('pf',k===focus)); }
      else if(e.key==='Enter'&&focus>=0){ e.preventDefault(); if(window.__orcListaProd && window.__orcListaProd[focus]) orcSelecionarProduto(idx,window.__orcListaProd[focus]); }
      else if(e.key==='Escape'){ fechar(); }

    inp.addEventListener('blur',()=>setTimeout(fechar,150));

  /* Cada item tem dois modos:
     - editando (it._modo==='editar' ou undefined): linha completa com autocomplete, valor, ＋

     O ✏️ na linha compacta volta ao modo editar. */
  function drawItens(){
    const wrap = document.getElementById('itensRows');
    let html = '';
    itens.forEach((it,i)=>{
      if(it._modo==='ok'){
        // ── LINHA COMPACTA ──
        const temObs = !!(it.observacaoItem||'').trim();
        const nFotos = (it.fotos||[]).length;
        html += `
        <div class="orc-item-compact" data-orcidx="${i}">
          <span class="orc-compact-nome" title="${escapeHtml(it.produto||'')}">${escapeHtml(it.produto||'Item')}</span>
