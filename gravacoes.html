<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravações — Gestão e Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="marketing-off.js"></script>
<style>
  /* Cores: só variáveis do tema (tema.css). Nada de hex aqui — o tema escuro depende disso. */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--t-font); font-size:14px;
    background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- login (só quando a tela é aberta fora do app) ---------- */
  #view-login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px 24px; box-shadow:var(--t-shadow); }
  .login-title{ font-size:20px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; }
  .login-sub{ color:var(--ink-faint); font-size:13px; margin:0 0 20px; line-height:1.5; }
  .login-error{ background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px; display:none; }
  .login-error.show{ display:block; }
  .back-link{ display:inline-block; font-size:12px; font-weight:600; color:var(--ink-soft); text-decoration:none; margin-bottom:16px; }
  .hub-back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-faint); text-decoration:none; font-size:13px; font-weight:600; }
  .hub-back-link:hover{ color:var(--ink); }

  /* ---------- campos ---------- */
  .field{ margin-bottom:14px; min-width:0; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{ width:100%; padding:9px 12px; font-size:14px; border-radius:8px; }
  .field textarea{ resize:vertical; min-height:64px; line-height:1.45; }
  .dica{ font-size:12px; color:var(--ink-faint); margin-top:4px; line-height:1.4; }
  .obrig{ color:var(--danger); font-weight:700; }

  /* ---------- botões ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; line-height:1.2; white-space:nowrap; }
  .btn-primary{ width:100%; }
  .btn-sm{ padding:6px 12px; font-size:13px; }
  .btn-xs{ padding:5px 10px; font-size:12px; }
  .btn-icone.wa{ color:var(--ok); }
  .btn-icone.wa:hover{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }

  /* ---------- barra própria (fora do app; dentro do app fica escondida) ---------- */
  #view-grav{ display:none; }
  header.topbar{
    background:var(--t-dark); color:var(--t-text); padding:0 20px; height:56px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:0; z-index:20;
  }
  html:not([data-theme=dark]) header.topbar{ color:var(--t-surface); }
  header.topbar a{ color:inherit; opacity:.8; text-decoration:none; font-size:13px; font-weight:600; }
  header.topbar a:hover{ opacity:1; color:inherit; }
  .who{ font-size:13px; display:flex; align-items:center; gap:10px; }
  .level-pill{ font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid currentColor; opacity:.85; }
  header.topbar .btn-sair{ background:transparent; color:inherit; border-color:currentColor; padding:6px 12px; font-size:13px; box-shadow:none; opacity:.9; }
  header.topbar .btn-sair:hover{ background:var(--t-danger); border-color:var(--t-danger); color:var(--t-surface); opacity:1; }
  html.embedded header.topbar{ display:none !important; }

  main{ max-width:1200px; margin:0 auto; padding:24px 24px 64px; }

  /* ---------- cabeçalho da tela ---------- */
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .page-title{ font-size:20px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; }
  .page-sub{ color:var(--ink-faint); font-size:13px; margin:0; line-height:1.5; max-width:720px; }
  .section-label{ font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--ink); margin:4px 0 12px; }
  .section-label .dica{ font-weight:400; margin:2px 0 0; }
  .muted{ color:var(--ink-faint); font-size:13px; }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px; line-height:1.5; }
  .empty > .ico{ display:block; margin:0 auto 10px; color:var(--ink-faint); }
  .empty b{ display:block; color:var(--ink); font-size:15px; margin-bottom:4px; }
  .empty .btn{ margin-top:14px; }
  .empty.erro b{ color:var(--danger); }

  /* ---------- barra de filtros ---------- */
  .filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; align-items:center; }
  .filters select, .filters input{ padding:8px 12px; font-size:14px; border-radius:8px; min-height:38px; }
  .filters .busca{ position:relative; flex:1 1 260px; max-width:380px; }
  .filters .busca .ico{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  .filters .busca input{ width:100%; padding-left:34px; }
  .filters .contador{ margin-left:auto; font-size:13px; color:var(--ink-faint); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:var(--t-shadow-sm); }
  .card.card-tabela{ padding:0; overflow-x:auto; }
  .grid-2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 14px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  @media(max-width:640px){ .grid-2,.grid-3{ grid-template-columns:minmax(0,1fr); } }

  /* ---------- tabela ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; padding:12px 10px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2); }
  tbody td{ padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  thead th:first-child, tbody td:first-child{ padding-left:16px; }
  thead th:last-child, tbody td:last-child{ padding-right:12px; }
  td.col-valor{ white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  th.r, td.r{ text-align:right; }
  td .via{ font-weight:700; color:var(--ink); white-space:nowrap; }
  td .cli{ font-weight:600; color:var(--ink); }
  td .sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; }
  td .selos{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  tbody select{ padding:6px 8px; font-size:13px; border-radius:8px; width:100%; min-width:132px; max-width:160px; }
  .acoes-linha{ display:flex; gap:2px; justify-content:flex-end; flex-wrap:nowrap; }

  /* select de status pintado pela etapa (cor + o próprio texto da etapa) */
  html[data-ds] select.sel-status{ font-weight:600; }
  html[data-ds] select.sel-status.st-pedido{ background-color:var(--wait-soft) !important; color:var(--wait) !important; border-color:transparent !important; }
  html[data-ds] select.sel-status.st-fabrica{ background-color:var(--accent-soft) !important; color:var(--accent) !important; border-color:transparent !important; }
  html[data-ds] select.sel-status.st-upcase{ background-color:var(--t-info-soft) !important; color:var(--info) !important; border-color:transparent !important; }
  html[data-ds] select.sel-status.st-pronto{ background-color:var(--ok-soft) !important; color:var(--ok) !important; border-color:transparent !important; }
  html[data-ds] select.sel-status.st-entregue{ background-color:var(--surface-2) !important; color:var(--ink-soft) !important; }
  html[data-ds] select.sel-status.st-cancelado{ background-color:var(--danger-soft) !important; color:var(--danger) !important; border-color:transparent !important; }
  html[data-ds] select.sel-pagamento.st-aberto{ background-color:var(--wait-soft) !important; color:var(--wait) !important; border-color:transparent !important; font-weight:600; }
  html[data-ds] select.sel-status option, html[data-ds] select.sel-pagamento option{ background:var(--surface); color:var(--ink); }

  /* ---------- selos ---------- */
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; line-height:1.5; white-space:nowrap; }
  .badge-wait{ background:var(--wait-soft); color:var(--wait); }
  .badge-ok{ background:var(--ok-soft); color:var(--ok); }
  .badge-just{ background:var(--t-info-soft); color:var(--info); }
  .badge-danger{ background:var(--danger-soft); color:var(--danger); }
  .badge-info{ background:var(--t-gold-soft); color:var(--t-gold); }
  .badge-neutro{ background:var(--surface-2); color:var(--ink-soft); }
  .badge-accent{ background:var(--accent-soft); color:var(--accent); }

  /* ---------- formulário (nova / editar) ---------- */
  .form-grav{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  .form-grav .resumo{ position:sticky; top:16px; }
  .resumo .linha{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; color:var(--ink-soft); }
  .resumo .linha:last-of-type{ border-bottom:none; }
  .resumo .valor{ font-size:24px; font-weight:700; color:var(--ink); letter-spacing:-.015em; }
  .resumo .qtd{ font-size:16px; font-weight:700; color:var(--ink); }
  .resumo .regra{ font-size:12px; color:var(--ink-faint); line-height:1.45; margin:10px 0 14px; }
  .resumo .btn{ width:100%; margin:0 0 8px; }
  .modal .form-grav{ grid-template-columns:minmax(0,1fr); }
  .modal .form-grav > .card{ border:none; box-shadow:none; padding:0; margin-bottom:12px; }
  .modal .form-grav .resumo{ position:static; background:var(--surface-2); padding:16px; border:none; }
  @media(max-width:900px){ .form-grav{ grid-template-columns:minmax(0,1fr); } .form-grav .resumo{ position:static; } }

  .item-card{ border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--surface-2); }
  .item-card-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .item-card-head b{ font-size:14px; min-width:56px; }
  .item-card-head select{ max-width:150px; padding:7px 10px; font-size:14px; border-radius:8px; }
  .item-toggle{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); }
  .item-toggle:hover{ border-color:var(--accent); color:var(--ink); }
  .item-toggle.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .item-sub{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); }
  .item-sub .field{ margin-bottom:0; }
  .orient-group{ display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; margin-left:auto; }
  .orient-btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; font-size:13px; font-weight:600; background:var(--surface); color:var(--ink-soft); border:none; cursor:pointer; font-family:inherit; }
  .orient-btn + .orient-btn{ border-left:1px solid var(--line-strong); }
  .orient-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .orient-btn.active{ background:var(--accent-soft); color:var(--accent); }
  .orient-btn svg{ width:16px; height:16px; }
  .orient-mini{ display:inline-flex; align-items:center; gap:4px; vertical-align:middle; }
  .orient-mini svg{ width:14px; height:14px; }
  .logo-status{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-faint); margin-top:6px; }
  .logo-status.ok{ color:var(--ok); font-weight:600; }

  .pag-detalhes{ display:flex; align-items:flex-start; gap:4px; font-size:12px; color:var(--ink-faint); margin-top:4px; max-width:190px; white-space:normal; line-height:1.4; }
  .pag-detalhes a{ color:var(--accent); flex-shrink:0; display:inline-flex; padding:1px; border-radius:4px; }
  .pag-detalhes a:hover{ background:var(--accent-soft); }
  .leitura-info{ display:flex; align-items:center; gap:4px; font-size:12px; margin-top:6px; white-space:nowrap; font-weight:600; }
  .leitura-info.ok{ color:var(--ok); }
  .leitura-info.wait{ color:var(--ink-faint); font-weight:500; }
  tr.linha-cancelada td{ background:color-mix(in srgb, var(--danger-soft) 55%, transparent); color:var(--ink-faint); }
  tr.linha-cancelada td .cli, tr.linha-cancelada td.col-valor{ text-decoration:line-through; color:var(--ink-faint); }
  .cancel-info{ font-size:12px; color:var(--danger); margin-top:6px; white-space:normal; max-width:200px; line-height:1.4; }

  /* ---------- via completa (popup Ver) ---------- */
  .ver-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 20px; font-size:14px; margin-bottom:16px; padding:16px; background:var(--surface-2); border-radius:12px; }
  .ver-grid .k{ font-size:12px; color:var(--ink-faint); font-weight:500; margin-bottom:2px; }
  .ver-grid .v{ font-weight:600; color:var(--ink); }
  .ver-item{ border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--surface); font-size:14px; display:grid; gap:6px; }
  .ver-item .titulo{ font-weight:700; display:flex; justify-content:space-between; gap:8px; }
  .ver-item .kv{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ver-item .kv > b{ font-weight:600; color:var(--ink-soft); }
  .ver-item img{ max-width:180px; max-height:140px; border-radius:8px; border:1px solid var(--line); display:block; margin-top:6px; background:var(--t-surface); }
  .leituras-lista div{ display:flex; align-items:center; gap:6px; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line); }
  .leituras-lista div:last-child{ border-bottom:none; }
  .leituras-lista .ico{ color:var(--ok); }

  /* ---------- informações internas (nunca vão para o cliente) ---------- */
  .info-interna{ background:var(--t-gold-soft); border:1px solid color-mix(in srgb, var(--t-gold) 45%, transparent); border-radius:12px; padding:14px 16px; margin:14px 0; }
  .info-interna .titulo{ font-size:14px; font-weight:600; color:var(--ink); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .info-interna .titulo > span{ display:inline-flex; align-items:center; gap:8px; }
  .info-interna .titulo > span .ico{ color:var(--t-gold); }
  .info-interna .titulo small{ font-weight:400; color:var(--ink-faint); font-size:12px; }
  .info-interna .nota{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:14px; white-space:pre-wrap; }
  .info-interna .nota .meta{ font-size:12px; color:var(--ink-faint); margin-top:4px; white-space:normal; }
  .info-interna .nota .meta a{ color:var(--danger); }
  .info-interna textarea{ width:100%; padding:9px 12px; font-size:14px; font-family:inherit; resize:vertical; min-height:64px; border-radius:8px; }
  .info-interna .acoes-form{ display:flex; gap:8px; margin-top:8px; justify-content:flex-end; }

  /* ---------- relatório ---------- */
  .kpi-card .rot{ font-size:13px; color:var(--ink-faint); }
  .kpi-card .num-grande{ font-size:24px; font-weight:700; letter-spacing:-.015em; color:var(--ink); margin-top:4px; }
  .kpi-card.destaque{ border-color:var(--accent); background:var(--accent-soft); }
  .repasse .num-medio, .situacao .num-medio{ font-size:20px; font-weight:700; color:var(--ink); margin-top:2px; }
  .situacao .grid-3{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  @media(max-width:760px){ .situacao .grid-3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .aviso-linha{ display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--ink-soft); padding:10px 12px; border-radius:8px; margin-bottom:8px; line-height:1.45; }
  .aviso-linha.wait{ background:var(--wait-soft); }
  .aviso-linha.wait .ico{ color:var(--wait); }
  .aviso-linha.danger{ background:var(--danger-soft); }
  .aviso-linha.danger .ico{ color:var(--danger); }
  .aviso-linha .ico{ margin-top:2px; }

  /* ---------- popups ---------- */
  .modal-overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:24px; position:relative;}
  .modal.largo{ max-width:820px; }
  .modal-title{ font-size:18px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; padding-right:28px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .modal-sub{ font-size:13px; color:var(--ink-faint); margin:0 0 16px; }
  .modal-title.perigo{ color:var(--danger); }
  .modal-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:flex-end; padding-top:16px; border-top:1px solid var(--line);}
  .modal-actions .esq{ margin-right:auto; display:flex; gap:10px; flex-wrap:wrap; }
  .modal-actions.oculto{ display:none; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:11px 18px; font-size:14px; z-index:100; max-width:calc(100vw - 32px); }

  /* ---------- celular: lista vira cartões ---------- */
  @media(max-width:760px){
    main{ padding:16px 16px 48px; }
    .page-head{ margin-bottom:8px; }
    .filters .busca{ max-width:none; flex-basis:100%; }
    .filters select{ flex:1 1 auto; }
    .filters .contador{ margin-left:0; flex-basis:100%; }
    .card.card-tabela{ background:transparent; border:none; box-shadow:none; overflow:visible; }
    table.tabela-grav, table.tabela-grav tbody{ display:block; }
    table.tabela-grav thead{ display:none; }
    table.tabela-grav tr{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:var(--t-shadow-sm); }
    table.tabela-grav tr.linha-cancelada{ background:color-mix(in srgb, var(--danger-soft) 55%, var(--surface)); }
    table.tabela-grav td{ display:block; padding:0; border:none; background:transparent !important; text-align:left; min-width:0; }
    table.tabela-grav td[data-label]::before{ content:attr(data-label); display:block; font-size:12px; color:var(--ink-faint); font-weight:500; margin-bottom:3px; }
    table.tabela-grav td.col-via{ grid-column:1 / -1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    table.tabela-grav td.col-via::before{ display:none; }
    table.tabela-grav td.col-via .selos{ margin-top:0; }
    table.tabela-grav td.col-via .via{ font-size:16px; }
    table.tabela-grav td.col-cliente{ grid-column:1 / -1; }
    table.tabela-grav td.col-cliente::before{ display:none !important; }
    table.tabela-grav td.col-cliente .cli{ font-size:15px; }
    table.tabela-grav td.col-status, table.tabela-grav td.col-pag{ grid-column:1 / -1; }
    table.tabela-grav td.col-acoes{ grid-column:1 / -1; border-top:1px solid var(--line); padding-top:10px; }
    table.tabela-grav td.col-acoes::before{ display:none; }
    table.tabela-grav .acoes-linha{ justify-content:space-between; }
    tbody select{ max-width:none; min-width:0; }
    .leitura-info{ white-space:normal; }
    .pag-detalhes, .cancel-info{ max-width:none; }
    .orient-group{ margin-left:0; }
    .item-card-head select{ max-width:none; flex:1 1 120px; }
    .ver-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); padding:12px; }
    .modal-actions .esq{ margin-right:0; }
  }

  #cupomImpressao{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #cupomImpressao, #cupomImpressao *{ visibility:visible; }
    #cupomImpressao{ display:block; position:absolute; top:0; left:0; width:100%; padding:16px; font-family:Arial,sans-serif; }
  }
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="margin-bottom:16px;"><script>document.write(Icone('voltar'))</script> Gestão e Controle</a>
    <h1 class="login-title">Entrar em Gravações</h1>
    <p class="login-sub">Use a mesma senha que você usa no resto do sistema.</p>

  <header class="topbar">
    <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle" aria-label="Voltar para Gestão e Controle"><script>document.write(Icone('voltar',{tam:18}))</script> Gestão e Controle</a>
    <div class="who">
      <span id="whoName"></span>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
  const APP_BASE_URL = "https://vilaca-controle-lojas.vercel.app";
  // A biblioteca supabase-js só é usada no upload do logo; carrega com "defer" pra não
  // segurar a abertura da tela, e o client é criado na primeira vez que for preciso.
  let __supabaseClient = null;
  function getSupabaseClient(){
    if(!__supabaseClient){
      if(!window.supabase){ throw new Error('Biblioteca do Supabase ainda não carregou — tente de novo em instantes.'); }
      __supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    return __supabaseClient;
  }

  let __gatewaySenha = null;
  async function gatewayCall(body){
    try{
      const res = await fetch(GATEWAY_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, ...body }),
      });
      return await res.json();
    }catch(e){
      console.error("erro ao falar com o servidor", e);
      return { error: "Não foi possível conectar. Verifique sua internet." };
    }
  }
  async function gatewayLogin(senhaTentativa){
    return gatewayCall({ op:"login", senha: senhaTentativa });
  }

  let currentUser = null;
  let config = null;
  let registros = [];
  let erroCarga = null; // só para a tela mostrar "não carregou" em vez de "lista vazia"
  let abaAtiva = 'lista';
  const VIA_SEQ_KEY = 'grav_upcase'; // sequência única — este módulo não é dividido por loja física

  /* Etapas do pedido. `cliente` é o texto que o cliente vê (cupom e link de acompanhamento). */
  const STATUS_INFO = {
    pedido:    { label:'Pedido',    cliente:'Seu pedido foi realizado com sucesso e em breve será enviado para a fábrica.' },
    fabrica:   { label:'Fábrica',   cliente:'Seu pedido foi enviado para a fábrica e está em produção.' },
    upcase:    { label:'Up Case',   cliente:'Seu pedido foi liberado pela fábrica e chegará em breve na loja Up Case.' },
    pronto:    { label:'Pronto',    cliente:'Seu pedido está pronto! Já pode ser retirado na loja Up Case.' },
    entregue:  { label:'Entregue',  cliente:'Seu pedido foi entregue e conferido. Obrigado pela preferência!' },
    cancelado: { label:'Cancelado', cliente:'Seu pedido foi cancelado. Em caso de dúvida, fale com a loja.' },
  };
  const STATUS_ORDEM = ['pedido','fabrica','upcase','pronto','entregue','cancelado'];
  function statusLabel(s){ return (STATUS_INFO[s]||{}).label || s; }
  /* Orientação da gravação no item: vertical ou horizontal (desenho de uma linha). */
  const ORIENT = { vertical:'Vertical', horizontal:'Horizontal' };
  function orientSvg(o){
    return o==='vertical'
      ? `<svg viewBox="0 0 16 16" aria-hidden="true"><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`
      : `<svg viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  }
  function orientHtml(o){
    if(!ORIENT[o]) return '';
    return `<span class="orient-mini" title="${ORIENT[o]}">${orientSvg(o)} ${ORIENT[o]}</span>`;
  }
  // registros antigos usavam "em_aberto" como primeira etapa — agora é "pedido"
  function normalizarStatus(g){
    if(g.status==='em_aberto') g.status='pedido';
    if(Array.isArray(g.leituras)) g.leituras.forEach(l=>{ if(l.status==='em_aberto') l.status='pedido'; });
    return g;
  }

  function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtMoeda(v){ return window.Fmt ? Fmt.brl(v) : "R$ " + (Number(v)||0).toFixed(2).replace(".", ","); }
  /* Ícone do sistema (icones.js); vazio se o arquivo não carregou — a tela continua funcionando. */
  function ic(nome, o){ return window.Icone ? Icone(nome, o) : ''; }
  function fmtDataHoraBr(v){ if(!v) return ''; if(window.Fmt){ const t = Fmt.dataHora(v); if(t) return t; } const d = new Date(v); return isNaN(d.getTime()) ? String(v) : d.toLocaleString('pt-BR'); }
  function fmtDataBr(iso){ if(!iso) return "—"; const p=iso.split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
  function uid(pfx){ return pfx+"_"+Math.random().toString(36).slice(2,11); }
  function isoHoje(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function horaAgora(d){ d=d||new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function somenteDigitos(s){ return (s||"").replace(/\D/g,""); }
  function nomeLojaUpCase(){
    const l = (config.lojas||[]).find(x=> (x.nome||'').toUpperCase().includes('UP CASE'));
    return l ? l.id : 'up_case';
  }
  function showToast(msg){
    let el = document.getElementById('toastBox');
    if(!el){ el = document.createElement('div'); el.id='toastBox'; el.className='toast'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
    el.textContent = msg; el.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>{ el.style.display='none'; }, 3200);
  }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); const box = document.getElementById('modalBox'); box.innerHTML=''; box.classList.remove('largo'); }
  function openModal(html){ const box = document.getElementById('modalBox'); box.classList.remove('largo'); box.innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }

  function readFileAsDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  async function uploadArquivoDrive(dataUrl, filename){
    const { data, error } = await getSupabaseClient().functions.invoke('upload-foto-drive', {
      body: { dataUrl, filename, pasta:'gravacoes', tratar:false, senha: __gatewaySenha }
    });
    if(error) throw error;
    if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
    return data;
  }

  /* Regra fixa: O.S. aberta até meio-dia (11:59) entrega no MESMO dia às 18h.
     O.S. aberta a partir do meio-dia (12:00) entrega no dia SEGUINTE até meio-dia (12h). */
  /* Domingo não conta: se a entrega cair num domingo, passa pra segunda-feira até meio-dia. */
  function calcularEntrega(agora){
    agora = agora || new Date();
    const entrega = new Date(agora);
    if(agora.getHours() < 12){ entrega.setHours(18,0,0,0); }
    else { entrega.setDate(entrega.getDate()+1); entrega.setHours(12,0,0,0); }
    if(entrega.getDay() === 0){ entrega.setDate(entrega.getDate()+1); entrega.setHours(12,0,0,0); }
    return { dataEntrega: isoHoje(entrega), horaEntrega: horaAgora(entrega) };
  }

  /* ================= CARREGAMENTO ================= */
  async function carregarConfig(){
    const r = await gatewayCall({ op:"getConfig" });
    config = (r && r.data) ? r.data : { lojas:[] };
  }
  async function carregarRegistros(){
    const r = await gatewayCall({ op:'selectAll', table:'gravacoes_pedidos' });
    if(r && r.error){ console.error('erro ao carregar gravações', r.error); registros = []; erroCarga = r.error; return; }
    erroCarga = null;
    registros = ((r && r.data) || []).map(row=>row.payload).map(normalizarStatus);
  }
  async function salvarRegistros(){
    let ok = true;
    for(const g of registros){
      if(!g || !g.id) continue;
      const r = await gatewayCall({ op:'upsert', table:'gravacoes_pedidos', params:{ row:{ id:g.id, payload:g, updated_at:new Date().toISOString() } } });
      if(!r || r.error){ console.error('erro ao salvar gravações', g.id, r && r.error); ok = false; }
    }
    if(!ok) showToast('Não foi possível salvar uma ou mais gravações — tente de novo.');
    return ok;
  }
  /* Salva UM registro sem sobrescrever o que outros usuários (ou a confirmação de leitura do
     cliente) gravaram nesse meio-tempo nessa MESMA gravação: recarrega só essa linha do banco,
     une as confirmações de leitura, e grava só ela — nunca mexe nas outras gravações. */
  async function salvarRegistro(g){
    const r = await gatewayCall({ op:'selectOne', table:'gravacoes_pedidos', params:{ column:'id', value:g.id } });
    if(r && r.error){
      console.error('salvarRegistro: falha ao recarregar antes de salvar', r.error);
      showToast('Sem conexão com o banco — nada foi salvo. Tente de novo.');
      return false;
    }
    const noBanco = (r && r.data) ? normalizarStatus(r.data.payload) : null;
    if(noBanco){
      // une as confirmações de leitura: o cliente pode ter confirmado enquanto a via era editada
      const doBanco = Array.isArray(noBanco.leituras) ? noBanco.leituras : [];
      const locais = Array.isArray(g.leituras) ? g.leituras : [];
      const uniao = [...doBanco];
      locais.forEach(l=>{ if(!uniao.some(u=> u.status===l.status)) uniao.push(l); });
      if(uniao.length) g.leituras = uniao;
    }
    const idx = registros.findIndex(x=>x.id===g.id);
    if(idx>=0) registros[idx] = g; else registros.push(g);
    const rSalvar = await gatewayCall({ op:'upsert', table:'gravacoes_pedidos', params:{ row:{ id:g.id, payload:g, updated_at:new Date().toISOString() } } });
    if(!rSalvar || rSalvar.error){
      console.error('erro ao salvar gravação', g.id, rSalvar && rSalvar.error);
      showToast('Não foi possível salvar — tente de novo.');
      return false;
    }
    return true;
  }
  function leituraStatusHtml(g){
    const leituras = Array.isArray(g.leituras) ? g.leituras : [];
    const conf = leituras.find(l=> l.status===g.status);
    if(conf){
      const dtFmt = fmtDataHoraBr(conf.confirmadoEm);
      return `<div class="leitura-info ok" title="O cliente confirmou que leu esta etapa pelo link">${ic('checkDuplo',{tam:14})} Cliente leu em ${escapeHtml(dtFmt)}</div>`;
    }
    return `<div class="leitura-info wait" title="O cliente ainda não abriu o link desta etapa">${ic('relogio',{tam:14})} Cliente ainda não leu</div>`;
  }
  /* Quem pode editar a via inteira (dados do cliente, itens, pagamento): o login vinculado
     à loja Up Case e a Diretoria. Os demais só mudam o status e acrescentam informação interna. */
  function podeEditarVia(){
    if(!currentUser) return false;
    if(currentUser.nivel==='diretoria') return true;
    const lojas = Array.isArray(currentUser.lojas) ? currentUser.lojas : [];
    const idUp = nomeLojaUpCase();
    return lojas.includes(idUp) || lojas.some(l=> String(l).toUpperCase().replace(/[^A-Z]/g,'').includes('UPCASE'));
  }
  /* Perfil Oficina (a fábrica que produz a gravação, sem vínculo com a loja Up Case):
     não cria gravação, na lista só abre "Ver via" (e adiciona informação interna) e
     a única mudança de status permitida é marcar "Up Case" (liberado pela fábrica). */
  function perfilOficina(){
    if(!currentUser || currentUser.nivel!=='oficina') return false;
    const lojas = Array.isArray(currentUser.lojas) ? currentUser.lojas : [];
    const idUp = nomeLojaUpCase();
    const vinculadoUpCase = lojas.includes(idUp) || lojas.some(l=> String(l).toUpperCase().replace(/[^A-Z]/g,'').includes('UPCASE'));
    return !vinculadoUpCase;
  }
  /* Informações internas: nunca vão pro cupom nem pro link do cliente. */
  function infoInternaHtml(g, opts){
    opts = opts || {};
    const notas = Array.isArray(g.infoInterna) ? g.infoInterna : [];
    const lista = notas.length ? notas.map((n,i)=>`
      <div class="nota">${escapeHtml(n.texto)}<div class="meta">${escapeHtml(n.por||'—')} · ${escapeHtml(n.em ? fmtDataHoraBr(n.em) : '')}${opts.removivel?` · <a href="#" data-rminfo="${i}">Remover</a>`:''}</div></div>`).join('')
      : `<div class="muted" style="margin-bottom:2px;">Nenhuma informação interna ainda.</div>`;
    return `
      <div class="info-interna" id="${opts.id||'blocoInfoInterna'}">
        <div class="titulo"><span>${ic('cadeado')} <span>Informações internas <small>· o cliente não vê</small></span></span><button type="button" class="btn btn-ghost btn-xs" data-addinfo="1">${ic('mais',{tam:14})} Adicionar informação</button></div>
        <div data-listainfo="1">${lista}</div>
        <div data-forminfo="1" style="display:none; margin-top:8px;">
          <textarea data-txtinfo="1" aria-label="Nova informação interna" placeholder="Ex.: fornecedor, custo, problema na peça, combinado com o cliente…"></textarea>
          <div class="acoes-form">
            <button type="button" class="btn btn-ghost btn-sm" data-cancelinfo="1">Descartar</button>
            <button type="button" class="btn btn-accent btn-sm" data-saveinfo="1">Salvar informação</button>
          </div>
        </div>
      </div>`;
  }
  /* Liga os eventos do bloco; aoSalvar(texto) recebe a nota nova e decide o que fazer
     (gravar na hora, no modal Ver; ou só acumular, no formulário). */
  function ligarInfoInterna(bloco, aoSalvar, aoRemover){
    if(!bloco) return;
    const form = bloco.querySelector('[data-forminfo]');
    const txt = bloco.querySelector('[data-txtinfo]');
    bloco.querySelector('[data-addinfo]').addEventListener('click', ()=>{ form.style.display='block'; txt.focus(); });
    bloco.querySelector('[data-cancelinfo]').addEventListener('click', ()=>{ form.style.display='none'; txt.value=''; });
    bloco.querySelector('[data-saveinfo]').addEventListener('click', async ()=>{
      const texto = txt.value.trim();
      if(!texto){ showToast('Escreva a informação antes de salvar.'); return; }
      await aoSalvar(texto);
    });
    bloco.querySelectorAll('[data-rminfo]').forEach(a=> a.addEventListener('click', (e)=>{ e.preventDefault(); if(aoRemover) aoRemover(Number(a.dataset.rminfo)); }));
  }
  /* Baixa a imagem anexa; se o Drive bloquear o download direto, abre numa aba nova. */
  async function baixarImagem(url, nomeArquivo){
    try{
      const res = await fetch(url, { mode:'cors' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nomeArquivo || 'imagem.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    }catch(e){
      window.open(url, '_blank');
      showToast('Abrindo a imagem em nova aba — use "Salvar imagem como".');
    }
  }
  const FORMAS_PAG = { dinheiro:'Dinheiro', cartao:'Cartão', pix:'Pix' };
  function pagamentoTexto(g){
    if(!(g.pagamento && g.pagamento.status==='pago')) return 'EM ABERTO';
    return 'Pago — ' + (FORMAS_PAG[g.pagamento.forma] || '');
  }

  /* ================= LOGIN ================= */
  const EMBEDDED = window.self !== window.top;
  if(EMBEDDED){
    document.documentElement.classList.add('embedded');
    window.addEventListener('message', async (ev)=>{
    if(!mensagemConfiavel(ev)) return;
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === 'auth'){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user ? ev.data.user.senha : null;
        await iniciarApp();
      }
    });
    parent.postMessage({ type:'ready', modulo:'gravacoes' }, '*');
  } else {
    document.getElementById('btnLogin').addEventListener('click', fazerLogin);
    document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });
  }
  async function fazerLogin(){
    const pass = document.getElementById('loginPass').value;
    const r = await gatewayLogin(pass);
    if(!r.ok){ document.getElementById('loginError').classList.add('show'); return; }
    document.getElementById('loginError').classList.remove('show');
    __gatewaySenha = pass;
    currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass, lojas: Array.isArray(r.user.lojas) ? r.user.lojas : [] };
    await iniciarApp();
  }
  /* Abertura rápida: mostra a tela na hora (com "Carregando…") e busca config + gravações
     em PARALELO, numa única rodada de rede. Antes eram três chamadas em sequência
     (config → gravações → gravações de novo ao desenhar a lista). */
  let carregamentoInicial = null;
  let dadosFrescosAte = 0;
  async function iniciarApp(){
    config = { lojas:[] };
    carregamentoInicial = Promise.all([carregarConfig(), carregarRegistros()]).then(()=>{
      dadosFrescosAte = Date.now() + 3000; // a lista/relatório não refaz a busca logo em seguida
      carregamentoInicial = null;
    });
    enterApp();               // tela aparece imediatamente
    await carregamentoInicial; // ...e é redesenhada com permissões e dados reais
    render();
  }
  // Recarrega do banco, exceto se os dados acabaram de chegar (evita chamada duplicada na abertura)
  function recarregarSePreciso(){
    if(carregamentoInicial) return carregamentoInicial;
    if(Date.now() < dadosFrescosAte) return Promise.resolve();
    return carregarRegistros();
  }
  document.getElementById('btnLogout').addEventListener('click', ()=>{ window.location.href = 'index.html'; });

  function enterApp(){
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-grav').style.display = 'block';
    document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
    document.getElementById('whoLevel').textContent = currentUser.nivel==='diretoria'?'Diretoria':currentUser.nivel==='gerente'?'Gerente':currentUser.nivel==='oficina'?'Oficina':'Vendedora';
    render();
  }

  /* ================= RENDER PRINCIPAL ================= */
  function render(){
    if(perfilOficina() && abaAtiva==='nova') abaAtiva = 'lista';
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">Gravações</h1>
          <p class="page-sub">Personalização feita em parceria com a Up Case. Controle interno: não entra no faturamento das lojas.</p>
        </div>
      </div>
      <div class="mini-tabs abas-std" role="tablist">
        <button data-aba="lista" role="tab" aria-selected="${abaAtiva==='lista'}" class="${abaAtiva==='lista'?'active':''}">Lista</button>
        ${perfilOficina() ? '' : `<button data-aba="nova" role="tab" aria-selected="${abaAtiva==='nova'}" class="${abaAtiva==='nova'?'active':''}">Nova gravação</button>`}
        <button data-aba="relatorio" role="tab" aria-selected="${abaAtiva==='relatorio'}" class="${abaAtiva==='relatorio'?'active':''}">Relatório mensal</button>
      </div>
      <div id="corpoGrav"></div>
    `;
    main.querySelectorAll('[data-aba]').forEach(b=> b.addEventListener('click', ()=>{ abaAtiva = b.dataset.aba; render(); }));
    if(abaAtiva==='lista') renderLista(document.getElementById('corpoGrav'));
    else if(abaAtiva==='nova') renderFormulario(document.getElementById('corpoGrav'), null);
    else renderRelatorio(document.getElementById('corpoGrav'));
  }

  /* ================= LISTA ================= */
  function pagamentoValorSelect(g){
    if(g.pagamento && g.pagamento.status==='pago') return 'pago:'+g.pagamento.forma;
    return 'aberto';
  }
  function renderLista(wrap){
    wrap.innerHTML = `
      <div class="filters">
        <label class="busca">${ic('busca')}<input type="search" id="f_busca" placeholder="Buscar por cliente" aria-label="Buscar por cliente"></label>
        <select id="f_status" aria-label="Filtrar por etapa"><option value="">Todas as etapas</option>${STATUS_ORDEM.map(k=>`<option value="${k}">${statusLabel(k)}</option>`).join('')}</select>
        <span class="contador" id="contadorGrav" aria-live="polite"></span>
      </div>
      <div id="tabelaGrav"><div class="empty">${ic('relogio',{tam:22})}Carregando gravações…</div></div>
    `;
    const fStatus = document.getElementById('f_status');
    const fBusca = document.getElementById('f_busca');
    function desenhar(){
      const tabela = document.getElementById('tabelaGrav');
      if(!tabela) return; // aba trocada enquanto carregava
      const status = fStatus.value, busca = fBusca.value.trim().toLowerCase();
      const lista = registros.filter(g=>{
        if(status && g.status!==status) return false;
        if(busca && !(g.cliente||'').toLowerCase().includes(busca)) return false;
        return true;
      }).sort((a,b)=> (b.criadoEm||0)-(a.criadoEm||0));
      const contador = document.getElementById('contadorGrav');
      if(contador) contador.textContent = erroCarga ? '' : (lista.length===1 ? '1 gravação' : lista.length+' gravações') + ((status||busca) ? ' com esses filtros' : '');
      if(erroCarga && registros.length===0){
        tabela.innerHTML = `<div class="card empty erro">${ic('alerta',{tam:22})}<b>Não foi possível carregar as gravações.</b>Confira a internet e abra a aba Lista de novo. Se continuar, avise a diretoria.</div>`;
        return;
      }
      if(lista.length===0){
        tabela.innerHTML = (status||busca)
          ? `<div class="card empty">${ic('busca',{tam:22})}<b>Nenhuma gravação com esses filtros.</b>Confira o nome digitado ou escolha "Todas as etapas".</div>`
          : `<div class="card empty">${ic('documento',{tam:22})}<b>Nenhuma gravação registrada ainda.</b>${perfilOficina() ? 'As vias criadas pela Up Case aparecem aqui.' : 'Quando o cliente deixar uma peça, registre em Nova gravação.'}${perfilOficina() ? '' : `<div><button class="btn btn-accent" data-irnova="1">${ic('mais')} Nova gravação</button></div>`}</div>`;
        const bNova = tabela.querySelector('[data-irnova]');
        if(bNova) bNova.addEventListener('click', ()=>{ abaAtiva='nova'; render(); });
        return;
      }
      tabela.innerHTML = `
        <div class="card card-tabela"><table class="tabela-grav">
          <thead><tr><th>Via</th><th>Cliente</th><th>Funcionário</th><th class="r">Itens</th><th class="r">Valor</th><th>Entrega</th><th>Etapa</th><th>Pagamento</th><th class="r">Ações</th></tr></thead>
          <tbody>${lista.map(g=>`
            <tr data-linha="${g.id}" class="${g.status==='cancelado'?'linha-cancelada':''}">
              <td class="col-via"><span class="via">${escapeHtml(g.viaNumero)}</span>${(g.status==='cancelado' || (Array.isArray(g.infoInterna)&&g.infoInterna.length)) ? `<div class="selos">${g.status==='cancelado'?'<span class="badge badge-danger">Cancelada</span>':''}${Array.isArray(g.infoInterna)&&g.infoInterna.length?`<span class="badge badge-info" title="Tem ${g.infoInterna.length} informação(ões) interna(s)">${ic('cadeado',{tam:12})} ${g.infoInterna.length}</span>`:''}</div>` : ''}</td>
              <td class="col-cliente" data-label="Cliente"><div class="cli">${escapeHtml(g.cliente)}</div><div class="sub">${escapeHtml(g.whatsapp)}</div></td>
              <td data-label="Funcionário">${escapeHtml(g.funcionario||'—')}</td>
              <td class="r" data-label="Itens">${escapeHtml(g.quantidadeItens)}</td>
              <td class="r col-valor" data-label="Valor"><b>${fmtMoeda(g.valorTotal)}</b></td>
              <td data-label="Entrega">${fmtDataBr(g.dataEntrega)}<div class="sub">às ${escapeHtml(g.horaEntrega)}</div></td>
              <td class="col-status" data-label="Etapa">
                ${perfilOficina() ? `
                  <div><span class="badge ${({pedido:'badge-wait',fabrica:'badge-accent',upcase:'badge-just',pronto:'badge-ok',entregue:'badge-neutro',cancelado:'badge-danger'})[g.status]||'badge-neutro'}">${escapeHtml(statusLabel(g.status))}</span></div>
                  ${(g.status==='pedido'||g.status==='fabrica') ? `<button class="btn btn-accent btn-xs" data-marcarupcase="${g.id}" style="margin-top:6px;" title="A fábrica terminou e a peça vai para a Up Case">${ic('check',{tam:14})} Marcar como Up Case</button>` : ''}
                ` : `
                <select class="sel-status st-${escapeHtml(g.status)}" data-id="${g.id}" aria-label="Etapa da via ${escapeHtml(g.viaNumero)}">
                  ${STATUS_ORDEM.map(k=>`<option value="${k}" ${g.status===k?'selected':''}>${statusLabel(k)}</option>`).join('')}
                </select>`}
                ${leituraStatusHtml(g)}
                ${g.status==='cancelado' && g.cancelamento ? `<div class="cancel-info">${g.cancelamento.motivo?escapeHtml(g.cancelamento.motivo)+' · ':''}por ${escapeHtml(g.cancelamento.por||'—')} em ${escapeHtml(fmtDataBr((g.cancelamento.em||'').slice(0,10)))}</div>` : ''}
              </td>
              <td class="col-pag" data-label="Pagamento">
                ${!podeEditarVia() ? `<div><span class="badge ${g.pagamento && g.pagamento.status==='pago'?'badge-ok':'badge-wait'}">${escapeHtml(g.pagamento && g.pagamento.status==='pago' ? pagamentoTexto(g) : 'Em aberto')}</span></div>` : ''}
                <select class="sel-pagamento ${pagamentoValorSelect(g)==='aberto'?'st-aberto':''}" data-id="${g.id}" aria-label="Pagamento da via ${escapeHtml(g.viaNumero)}" style="${podeEditarVia()?'':'display:none;'}">
                  <option value="aberto" ${pagamentoValorSelect(g)==='aberto'?'selected':''}>Em aberto</option>
                  <option value="pago:dinheiro" ${pagamentoValorSelect(g)==='pago:dinheiro'?'selected':''}>Pago — Dinheiro</option>
                  <option value="pago:cartao" ${pagamentoValorSelect(g)==='pago:cartao'?'selected':''}>Pago — Cartão</option>
                  <option value="pago:pix" ${pagamentoValorSelect(g)==='pago:pix'?'selected':''}>Pago — Pix</option>
                </select>
                ${g.pagamento && g.pagamento.status==='pago' ? `<div class="pag-detalhes"><span>${g.pagamento.detalhes ? escapeHtml(g.pagamento.detalhes) : 'Sem detalhes'}</span>${podeEditarVia()?`<a href="#" data-pagdet="${g.id}" title="Editar detalhes do pagamento" aria-label="Editar detalhes do pagamento">${ic('lapis',{tam:13})}</a>`:''}</div>` : ''}
              </td>
              <td class="col-acoes"><div class="acoes-linha">
                <button class="btn-icone" data-ver="${g.id}" title="Ver via completa" aria-label="Ver via completa">${ic('olho',{tam:18})}</button>
                ${perfilOficina() ? '' : `
                ${podeEditarVia() ? `<button class="btn-icone" data-editar="${g.id}" title="Editar via" aria-label="Editar via">${ic('lapis',{tam:18})}</button>` : ''}
                <button class="btn-icone" data-imprimir="${g.id}" title="Imprimir via" aria-label="Imprimir via">${ic('impressora',{tam:18})}</button>
                <button class="btn-icone wa" data-whats="${g.id}" title="Avisar o cliente no WhatsApp" aria-label="Avisar o cliente no WhatsApp">${ic('whatsapp',{tam:18})}</button>
                ${g.status!=='cancelado' ? `<button class="btn-icone perigo" data-cancelar="${g.id}" title="Cancelar esta gravação" aria-label="Cancelar esta gravação">${ic('cancelar',{tam:18})}</button>` : ''}`}
              </div></td>
            </tr>
          `).join('')}</tbody>
        </table></div>
      `;
      tabela.querySelectorAll('[data-marcarupcase]').forEach(b=> b.addEventListener('click', async ()=>{
        const g = registros.find(r=>r.id===b.dataset.marcarupcase);
        if(!g) return;
        const anterior = g.status;
        b.disabled = true; b.textContent = 'Salvando...';
        g.status = 'upcase';
        const ok = await salvarRegistro(g);
        if(ok){ showToast('Gravação '+g.viaNumero+' marcada como Up Case (liberada pela fábrica).'); desenhar(); }
        else { g.status = anterior; desenhar(); }
      }));
      tabela.querySelectorAll('.sel-status').forEach(sel=> sel.addEventListener('change', async ()=>{
        const g = registros.find(r=>r.id===sel.dataset.id);
        if(!g) return;
        const anterior = g.status;
        if(sel.value==='cancelado'){ abrirCancelamento(g, anterior); return; }
        g.status = sel.value;
        const ok = await salvarRegistro(g);
        if(ok){ showToast('Etapa atualizada.'); desenhar(); }
        else { g.status = anterior; desenhar(); }
      }));
      tabela.querySelectorAll('.sel-pagamento').forEach(sel=> sel.addEventListener('change', async ()=>{
        const g = registros.find(r=>r.id===sel.dataset.id);
        if(!g) return;
        const anterior = g.pagamento ? { ...g.pagamento } : { status:'em_aberto', forma:null };
        if(sel.value==='aberto'){
          g.pagamento = { status:'em_aberto', forma:null };
          const ok = await salvarRegistro(g);
          if(ok){ showToast('Pagamento marcado como em aberto.'); desenhar(); }
          else { g.pagamento = anterior; desenhar(); }
          return;
        }
        const forma = sel.value.split(':')[1];
        // escolhido o tipo de pagamento, abre o campo livre pra registrar quem recebeu / cupom / conta do Pix
        abrirDetalhesPagamento(g, forma, anterior);
      }));
      tabela.querySelectorAll('[data-pagdet]').forEach(a=> a.addEventListener('click', (e)=>{
        e.preventDefault();
        const g = registros.find(r=>r.id===a.dataset.pagdet);
        if(!g || !g.pagamento) return;
        abrirDetalhesPagamento(g, g.pagamento.forma, { ...g.pagamento });
      }));
      tabela.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', ()=>{
        const g = registros.find(r=>r.id===b.dataset.cancelar);
        if(g) abrirCancelamento(g, g.status);
      }));
      tabela.querySelectorAll('[data-ver]').forEach(b=> b.addEventListener('click', ()=> abrirVer(b.dataset.ver)));
      tabela.querySelectorAll('[data-editar]').forEach(b=> b.addEventListener('click', ()=> abrirEditar(b.dataset.editar)));
      tabela.querySelectorAll('[data-imprimir]').forEach(b=> b.addEventListener('click', ()=> imprimirVia(registros.find(r=>r.id===b.dataset.imprimir))));
      tabela.querySelectorAll('[data-whats]').forEach(b=> b.addEventListener('click', ()=> enviarWhatsapp(registros.find(r=>r.id===b.dataset.whats))));
    }
    /* Cancelamento: a gravação continua no sistema (com tudo visível), mas marcada como
       cancelada e fora do relatório mensal. Cancelar no modal volta o select ao status anterior. */
    function abrirCancelamento(g, anterior){
      openModal(`
        <h2 class="modal-title perigo">Cancelar a via ${escapeHtml(g.viaNumero)}</h2>
        <p class="modal-sub">${escapeHtml(g.cliente)} · ${fmtMoeda(g.valorTotal)}</p>
        ${g.pagamento&&g.pagamento.status==='pago'?`<div class="aviso-linha danger">${ic('alerta')}<span>Esta gravação já está marcada como <b>paga</b>. Combine a devolução com o cliente.</span></div>`:''}
        <div class="field">
          <label for="cancel_motivo">Motivo do cancelamento <span class="obrig">*</span></label>
          <textarea id="cancel_motivo" placeholder="Ex.: cliente desistiu, a peça não comporta gravação…"></textarea>
          <div class="dica">Obrigatório. A via continua na lista marcada como Cancelada e o valor sai do relatório mensal.</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="btnVoltarCancel">Voltar</button>
          <button class="btn btn-danger" id="btnConfirmarCancel">${ic('cancelar')} Cancelar gravação</button>
        </div>
      `);
      document.getElementById('btnVoltarCancel').addEventListener('click', ()=>{ g.status = anterior; closeModal(); desenhar(); });
      document.getElementById('btnConfirmarCancel').addEventListener('click', async ()=>{
        const btn = document.getElementById('btnConfirmarCancel');
        const motivo = document.getElementById('cancel_motivo').value.trim();
        if(!motivo){
          showToast('Escreva o motivo do cancelamento para continuar.');
          const ta = document.getElementById('cancel_motivo');
          ta.style.borderColor = 'var(--danger)'; ta.focus();
          return;
        }
        btn.disabled = true; btn.textContent = 'Cancelando…';
        const cancelAntes = g.cancelamento;
        g.status = 'cancelado';
        g.cancelamento = { motivo, por: currentUser ? currentUser.nome : '', em: new Date().toISOString(), statusAnterior: anterior };
        const ok = await salvarRegistro(g);
        if(!ok){ g.status = anterior; g.cancelamento = cancelAntes; btn.disabled=false; btn.innerHTML=ic('cancelar')+' Cancelar gravação'; return; }
        closeModal(); showToast(`Gravação ${g.viaNumero} cancelada.`); desenhar();
      });
    }
    /* Modal do campo livre de pagamento. Cancelar volta o select ao valor anterior;
       salvar grava forma + detalhes + quem/quando registrou. */
    function abrirDetalhesPagamento(g, forma, anterior){
      const jaTinha = g.pagamento && g.pagamento.status==='pago' ? (g.pagamento.detalhes||'') : '';
      openModal(`
        <h2 class="modal-title">Pagamento em ${escapeHtml(FORMAS_PAG[forma]||forma)}</h2>
        <p class="modal-sub">Via ${escapeHtml(g.viaNumero)} · ${escapeHtml(g.cliente)} · <b>${fmtMoeda(g.valorTotal)}</b></p>
        <div class="field">
          <label for="pag_detalhes">Detalhes do recebimento</label>
          <textarea id="pag_detalhes" placeholder="Ex.: quem recebeu, número do cupom, conta do Pix…">${escapeHtml(jaTinha)}</textarea>
          <div class="dica">Opcional, mas ajuda a conferir o caixa depois.</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="btnCancelarPag">Cancelar</button>
          <button class="btn btn-accent" id="btnSalvarPag">${ic('check')} Salvar pagamento</button>
        </div>
      `);
      document.getElementById('pag_detalhes').focus();
      document.getElementById('btnCancelarPag').addEventListener('click', ()=>{
        g.pagamento = anterior;
        closeModal(); desenhar();
      });
      document.getElementById('btnSalvarPag').addEventListener('click', async ()=>{
        const btn = document.getElementById('btnSalvarPag');
        btn.disabled = true; btn.textContent = 'Salvando…';
        const detalhes = document.getElementById('pag_detalhes').value.trim();
        g.pagamento = {
          status:'pago', forma, detalhes,
          registradoPor: currentUser ? currentUser.nome : '',
          registradoEm: new Date().toISOString(),
          dataPagamento: (anterior && anterior.status==='pago' && anterior.dataPagamento) ? anterior.dataPagamento : isoHoje(),
        };
        const ok = await salvarRegistro(g);
        if(!ok){ g.pagamento = anterior; btn.disabled=false; btn.innerHTML=ic('check')+' Salvar pagamento'; return; }
        closeModal(); showToast('Pagamento registrado.'); desenhar();
      });
    }
    [fStatus,fBusca].forEach(el=> el.addEventListener('input', desenhar));
    // recarrega do banco ao abrir a lista: o cliente pode ter confirmado a leitura, ou outro
    // funcionário pode ter alterado algo em outro aparelho (mesmo padrão do Painel de O.S.)
    recarregarSePreciso().then(desenhar);
  }

  /* ================= FORMULÁRIO (nova / editar) ================= */
  const OPCOES_VALOR = [10,20,30,40,50];
  function renderFormulario(wrap, registroExistente, aoSalvarComSucesso){
    const editando = !!registroExistente;
    let itensState = editando
      ? (registroExistente.itens||[]).map(it=>({ valor: it.valor||'', nome: it.nome||'', logoUrl: it.logoUrl||'', observacoes: it.observacoes||'', orientacao: it.orientacao||'', nomeAtivo: !!it.nome, logoAtivo: !!it.logoUrl }))
      : [{ valor:'', nome:'', logoUrl:'', observacoes:'', orientacao:'', nomeAtivo:false, logoAtivo:false }];
    if(itensState.length===0) itensState = [{ valor:'', nome:'', logoUrl:'', observacoes:'', orientacao:'', nomeAtivo:false, logoAtivo:false }];
    let infoState = editando && Array.isArray(registroExistente.infoInterna) ? registroExistente.infoInterna.map(n=>({...n})) : [];
    const pagIni = editando ? pagamentoValorSelect(registroExistente) : 'aberto';

    const previsao = editando
      ? { dataEntrega: registroExistente.dataEntrega, horaEntrega: registroExistente.horaEntrega }
      : calcularEntrega(new Date());
    wrap.innerHTML = `
      <div class="form-grav">
      <div class="card">
        <h2 class="section-label">Cliente</h2>
        <div class="grid-2">
          <div class="field"><label for="n_cliente">Nome <span class="obrig">*</span></label><input id="n_cliente" autocomplete="off" value="${editando?escapeHtml(registroExistente.cliente):''}"></div>
          <div class="field"><label for="n_whatsapp">WhatsApp <span class="obrig">*</span></label><input id="n_whatsapp" inputmode="tel" placeholder="(32) 90000-0000" value="${editando?escapeHtml(registroExistente.whatsapp):''}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="n_funcionario">Funcionário que fez a via <span class="obrig">*</span></label><input id="n_funcionario" placeholder="Nome do funcionário" value="${escapeHtml(editando ? (registroExistente.funcionario||'') : (currentUser ? currentUser.nome : ''))}"></div>
          <div class="field"><label for="n_qtd">Quantidade de itens <span class="obrig">*</span></label><input id="n_qtd" type="number" min="1" max="50" inputmode="numeric" value="${editando?registroExistente.quantidadeItens:1}"><div class="dica">Cada item ganha um quadro abaixo para valor e o que gravar.</div></div>
        </div>
        <h2 class="section-label" style="margin-top:8px;">Itens</h2>
        <div id="areaItens"></div>
        ${infoInternaHtml({ infoInterna: infoState }, { id:'infoInternaForm', removivel:true })}
        <h2 class="section-label">Pagamento</h2>
        <div class="grid-2">
          <div class="field">
            <label for="n_pagamento">Situação do pagamento</label>
            <select id="n_pagamento">
              <option value="aberto" ${pagIni==='aberto'?'selected':''}>Em aberto (paga na retirada)</option>
              <option value="pago:dinheiro" ${pagIni==='pago:dinheiro'?'selected':''}>Pago — Dinheiro</option>
              <option value="pago:cartao" ${pagIni==='pago:cartao'?'selected':''}>Pago — Cartão</option>
              <option value="pago:pix" ${pagIni==='pago:pix'?'selected':''}>Pago — Pix</option>
            </select>
          </div>
          <div class="field" id="wrapPagDetalhes" style="display:${pagIni==='aberto'?'none':'block'};">
            <label for="n_pag_detalhes">Detalhes do recebimento</label>
            <textarea id="n_pag_detalhes" placeholder="Ex.: quem recebeu, número do cupom, conta do Pix…">${escapeHtml(editando && registroExistente.pagamento ? (registroExistente.pagamento.detalhes||'') : '')}</textarea>
          </div>
        </div>
      </div>
      <aside class="card resumo" aria-label="Resumo da gravação">
        <h2 class="section-label">Resumo</h2>
        <div class="linha"><span>Itens</span><span class="qtd" id="resumoQtd">1</span></div>
        <div class="linha"><span>Valor total</span><span class="valor" id="resumoValor">${fmtMoeda(0)}</span></div>
        <p class="regra">${ic('calendario',{tam:14})} Entrega prevista: <b>${escapeHtml(fmtDataBr(previsao.dataEntrega))} às ${escapeHtml(previsao.horaEntrega||'—')}</b>${editando ? '' : '<br>Até 11h59 entrega no mesmo dia às 18h; a partir das 12h, no dia seguinte ao meio-dia (domingo passa para segunda).'}</p>
        <button class="btn btn-accent" id="btnSalvarForm">${ic('check')} ${editando?'Salvar alterações':'Salvar gravação'}</button>
        ${editando ? `<button class="btn btn-ghost" id="btnCancelarForm">Cancelar</button>` : ''}
      </aside>
      </div>
    `;

    function itemRowHtml(i){
      const it = itensState[i];
      return `
        <div class="item-card" data-itemcard="${i}">
          <div class="item-card-head">
            <b>Item ${i+1}</b>
            <select data-itemvalor="${i}" aria-label="Valor do item ${i+1}">
              <option value="">Escolha o valor</option>
              ${OPCOES_VALOR.map(v=>`<option value="${v}" ${String(it.valor)===String(v)?'selected':''}>${fmtMoeda(v)}</option>`).join('')}
            </select>
            <button type="button" class="item-toggle ${it.nomeAtivo?'active':''}" data-toggle-nome="${i}" aria-pressed="${it.nomeAtivo}" title="Gravar um nome ou frase">${ic(it.nomeAtivo?'check':'mais',{tam:14})} Nome</button>
            <button type="button" class="item-toggle ${it.logoAtivo?'active':''}" data-toggle-logo="${i}" aria-pressed="${it.logoAtivo}" title="Gravar um logo ou imagem">${ic(it.logoAtivo?'check':'imagem',{tam:14})} Logo</button>
            <div class="orient-group" title="Orientação da gravação">
              <button type="button" class="orient-btn ${it.orientacao==='vertical'?'active':''}" data-orient="${i}" data-val="vertical">${orientSvg('vertical')} Vertical</button>
              <button type="button" class="orient-btn ${it.orientacao==='horizontal'?'active':''}" data-orient="${i}" data-val="horizontal">${orientSvg('horizontal')} Horizontal</button>
            </div>
          </div>
          <div class="item-sub" data-sub-nome="${i}" style="display:${it.nomeAtivo?'block':'none'};">
            <div class="field"><label>Nome ou frase para gravar</label><input data-itemnome="${i}" value="${escapeHtml(it.nome||'')}" placeholder="Ex.: Maria, Sempre Juntos…"></div>
          </div>
          <div class="item-sub" data-sub-logo="${i}" style="display:${it.logoAtivo?'block':'none'};">
            <div class="field">
              <label>Arquivo do logo ou imagem</label>
              <input type="file" accept="image/*" data-itemlogo="${i}">
              <div class="logo-status ${it.logoUrl?'ok':''}" data-logostatus="${i}">${it.logoUrl?(ic('check',{tam:14})+' Arquivo enviado · <a href="'+escapeHtml(it.logoUrl)+'" target="_blank">ver</a>'):''}</div>
            </div>
          </div>
          <div class="item-sub">
            <div class="field"><label>Observações do item</label><textarea data-itemobs="${i}" placeholder="Ex.: fonte cursiva, gravar na parte interna, posição do logo…">${escapeHtml(it.observacoes||'')}</textarea></div>
          </div>
        </div>
      `;
    }
    function desenharItens(){
      document.getElementById('areaItens').innerHTML = itensState.map((_,i)=>itemRowHtml(i)).join('');
      ligarEventosItens();
      atualizarResumo();
    }
    function ligarEventosItens(){
      document.querySelectorAll('[data-itemvalor]').forEach(sel=> sel.addEventListener('change', ()=>{
        itensState[Number(sel.dataset.itemvalor)].valor = sel.value ? Number(sel.value) : '';
        atualizarResumo();
      }));
      document.querySelectorAll('[data-toggle-nome]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.toggleNome);
        itensState[i].nomeAtivo = !itensState[i].nomeAtivo;
        desenharItens();
      }));
      document.querySelectorAll('[data-toggle-logo]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.toggleLogo);
        itensState[i].logoAtivo = !itensState[i].logoAtivo;
        desenharItens();
      }));
      document.querySelectorAll('[data-itemnome]').forEach(inp=> inp.addEventListener('input', ()=>{
        itensState[Number(inp.dataset.itemnome)].nome = inp.value;
      }));
      document.querySelectorAll('[data-orient]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.orient), val = b.dataset.val;
        itensState[i].orientacao = (itensState[i].orientacao===val) ? '' : val; // clicar de novo desmarca
        document.querySelectorAll(`[data-orient="${i}"]`).forEach(x=> x.classList.toggle('active', x.dataset.val===itensState[i].orientacao));
      }));
      document.querySelectorAll('[data-itemobs]').forEach(ta=> ta.addEventListener('input', ()=>{
        itensState[Number(ta.dataset.itemobs)].observacoes = ta.value;
      }));
      document.querySelectorAll('[data-itemlogo]').forEach(inp=> inp.addEventListener('change', async (e)=>{
        const i = Number(inp.dataset.itemlogo);
        const file = e.target.files[0];
        if(!file) return;
        const status = document.querySelector(`[data-logostatus="${i}"]`);
        status.className = 'logo-status'; status.textContent = 'Enviando arquivo…';
        try{
          const dataUrl = await readFileAsDataUrl(file);
          const resultado = await uploadArquivoDrive(dataUrl, 'gravacao_item_'+Date.now()+'.jpg');
          itensState[i].logoUrl = resultado.url;
          status.className = 'logo-status ok'; status.innerHTML = ic('check',{tam:14})+' Arquivo enviado · <a href="'+escapeHtml(resultado.url)+'" target="_blank">ver</a>';
        }catch(err){
          console.error('erro ao enviar logo', err);
          status.className = 'logo-status'; status.style.color = 'var(--danger)'; status.textContent = 'Não foi possível enviar o arquivo. Confira a internet e escolha o arquivo de novo.';
        }
      }));
    }
    function atualizarResumo(){
      const total = itensState.reduce((a,it)=> a + (Number(it.valor)||0), 0);
      document.getElementById('resumoQtd').textContent = itensState.length;
      document.getElementById('resumoValor').textContent = fmtMoeda(total);
    }
    function desenharInfoInterna(){
      const velho = document.getElementById('infoInternaForm');
      const tmp = document.createElement('div'); tmp.innerHTML = infoInternaHtml({ infoInterna: infoState }, { id:'infoInternaForm', removivel:true });
      velho.replaceWith(tmp.firstElementChild);
      ligarInfoInterna(document.getElementById('infoInternaForm'), async (texto)=>{
        infoState.push({ texto, por: currentUser ? currentUser.nome : '', em: new Date().toISOString() });
        desenharInfoInterna();
      }, (i)=>{ infoState.splice(i,1); desenharInfoInterna(); });
    }
    desenharInfoInterna();
    // ao escolher uma forma paga, abre o campo livre (quem recebeu / cupom / conta Pix)
    document.getElementById('n_pagamento').addEventListener('change', ()=>{
      const v = document.getElementById('n_pagamento').value;
      document.getElementById('wrapPagDetalhes').style.display = v==='aberto' ? 'none' : 'block';
      if(v!=='aberto') document.getElementById('n_pag_detalhes').focus();
    });
    document.getElementById('n_qtd').addEventListener('input', ()=>{
      const qtd = Math.max(1, Math.min(50, parseInt(document.getElementById('n_qtd').value)||1));
      if(qtd > itensState.length){ while(itensState.length<qtd) itensState.push({ valor:'', nome:'', logoUrl:'', observacoes:'', orientacao:'', nomeAtivo:false, logoAtivo:false }); }
      else if(qtd < itensState.length){ itensState = itensState.slice(0,qtd); }
      desenharItens();
    });
    desenharItens();

    if(editando){
      document.getElementById('btnCancelarForm').addEventListener('click', ()=>{ if(aoSalvarComSucesso) aoSalvarComSucesso(); else { abaAtiva='lista'; render(); } });
    }
    document.getElementById('btnSalvarForm').addEventListener('click', async ()=>{
      const cliente = document.getElementById('n_cliente').value.trim();
      const whatsapp = document.getElementById('n_whatsapp').value.trim();
      const funcionario = document.getElementById('n_funcionario').value.trim();
      if(!funcionario){ showToast('Informe o funcionário que fez a via.'); document.getElementById('n_funcionario').focus(); return; }
      const pagSel = document.getElementById('n_pagamento').value;
      const pagAnterior = editando && registroExistente.pagamento ? registroExistente.pagamento : null;
      let pagamento;
      if(pagSel==='aberto'){ pagamento = { status:'em_aberto', forma:null }; }
      else {
        const forma = pagSel.split(':')[1];
        const jaPago = pagAnterior && pagAnterior.status==='pago';
        pagamento = {
          status:'pago', forma, detalhes: document.getElementById('n_pag_detalhes').value.trim(),
          registradoPor: jaPago && pagAnterior.forma===forma ? (pagAnterior.registradoPor||(currentUser?currentUser.nome:'')) : (currentUser ? currentUser.nome : ''),
          registradoEm: jaPago && pagAnterior.forma===forma ? (pagAnterior.registradoEm||new Date().toISOString()) : new Date().toISOString(),
          dataPagamento: jaPago && pagAnterior.dataPagamento ? pagAnterior.dataPagamento : isoHoje(),
        };
      }
      if(!cliente){ showToast('Informe o nome do cliente.'); return; }
      if(!whatsapp){ showToast('Informe o WhatsApp do cliente.'); return; }
      if(itensState.some(it=>!it.valor)){ showToast('Escolha o valor de cada item.'); return; }
      const iNome = itensState.findIndex(it=> it.nomeAtivo && !(it.nome||'').trim());
      if(iNome>=0){ showToast(`Item ${iNome+1}: escreva o nome ou frase a gravar, ou desmarque "Nome".`); return; }
      const iLogo = itensState.findIndex(it=> it.logoAtivo && !it.logoUrl);
      if(iLogo>=0){ showToast(`Item ${iLogo+1}: envie o arquivo do logo (aguarde o "Arquivo enviado") ou desmarque "Logo".`); return; }

      const btn = document.getElementById('btnSalvarForm');
      btn.disabled = true; btn.textContent = 'Salvando…';
      const itensFinal = itensState.map(it=>({ valor: Number(it.valor), nome: it.nomeAtivo ? (it.nome||'').trim() : '', logoUrl: it.logoAtivo ? (it.logoUrl||'') : '', observacoes: (it.observacoes||'').trim(), orientacao: ORIENT[it.orientacao] ? it.orientacao : '' }));
      const valorTotal = itensFinal.reduce((a,it)=>a+it.valor,0);

      if(editando){
        const antes = JSON.parse(JSON.stringify(registroExistente));
        Object.assign(registroExistente, {
          cliente, whatsapp, funcionario,
          quantidadeItens: itensFinal.length, itens: itensFinal, valorTotal,
          infoInterna: infoState, pagamento,
        });
        const ok = await salvarRegistro(registroExistente);
        btn.disabled = false; btn.innerHTML = ic('check')+' Salvar alterações';
        if(!ok){ Object.assign(registroExistente, antes); return; }
        showToast(`Gravação ${registroExistente.viaNumero} atualizada.`);
        abaAtiva = 'lista'; render();
        if(aoSalvarComSucesso) aoSalvarComSucesso();
      }else{
        const rSeq = await gatewayCall({ op:'bumpViaSequence', params:{ loja: VIA_SEQ_KEY } });
        if(!rSeq || rSeq.error || !rSeq.proximo){
          // sem número de via não salva: um número improvisado poderia repetir uma via já existente
          btn.disabled = false; btn.innerHTML = ic('check')+' Salvar gravação';
          showToast('Não foi possível gerar o número da via — ' + ((rSeq && rSeq.error) || 'tente de novo.'));
          return;
        }
        const viaNumero = rSeq.proximo;
        const agora = new Date();
        const { dataEntrega, horaEntrega } = calcularEntrega(agora);
        const novoRegistro = {
          id: uid('grav'),
          viaNumero, loja: nomeLojaUpCase(), cliente, whatsapp, funcionario,
          dataEntrada: isoHoje(agora), horaEntrada: horaAgora(agora),
          dataEntrega, horaEntrega,
          quantidadeItens: itensFinal.length, itens: itensFinal, valorTotal,
          status: 'pedido',
          pagamento,
          infoInterna: infoState,
          criadoEm: Date.now(), criadoPor: currentUser.nome,
        };
        const ok = await salvarRegistro(novoRegistro);
        btn.disabled = false; btn.innerHTML = ic('check')+' Salvar gravação';
        if(!ok){ registros = registros.filter(r=>r.id!==novoRegistro.id); return; }
        showToast(`Gravação ${viaNumero} salva!`);
        abaAtiva = 'lista'; render();
      }
    });
  }
