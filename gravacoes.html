<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravações — Gestão e Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
  :root{
    --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#F1F4F7;
    --ink:#1A1D24; --ink-soft:#4B5566; --ink-faint:#7C8592;
    --line:#E1E5EA; --accent:#662344; --accent-ink:#4A1830; --accent-soft:#F3E6D8;
    --ok:#17794A; --ok-soft:#E3F5EA;
    --danger:#B91C1C; --danger-soft:#FBEAEA;
    --wait:#B45309; --wait-soft:#FCEEDC;
    --just:#6425C9; --just-soft:#EFE5FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  #view-login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px 28px; box-shadow:0 12px 32px -18px rgba(20,30,45,0.25); }
  .login-tag{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:8px; }
  .login-title{ font-size:20px; font-weight:750; margin:0 0 4px; }
  .login-sub{ color:var(--ink-soft); font-size:13px; margin:0 0 22px; line-height:1.5; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--surface-2); color:var(--ink); }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .btn{ border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:700; }
  .btn-primary{ background:var(--ink); color:#fff; width:100%; }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .btn-sm{ padding:6px 11px; font-size:12px; }
  .btn-xs{ padding:4px 8px; font-size:11px; }
  .login-error{ background:var(--danger-soft); color:var(--danger); font-size:12.5px; padding:9px 11px; border-radius:7px; margin-bottom:12px; display:none; }
  .login-error.show{ display:block; }
  .back-link{ display:inline-block; font-size:12px; font-weight:700; color:var(--ink-soft); text-decoration:none; margin-bottom:16px; }
  .hub-back-link{ color:var(--ink-faint); text-decoration:none; font-size:13px; font-weight:600; }
  .hub-back-link:hover{ color:var(--ink); }

  #view-grav{ display:none; }
  header.topbar{
    background:var(--ink); color:#fff; padding:0 20px; height:56px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:0; z-index:20;
  }
  header.topbar a{ color:rgba(255,255,255,.7); text-decoration:none; font-size:13px; font-weight:700; }
  .who{ font-size:12.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:10px; }
  .level-pill{ font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.04em; background:rgba(255,255,255,.14); padding:3px 9px; border-radius:20px; }
  main{ max-width:1180px; margin:0 auto; padding:24px 18px 60px; }

  .page-head{ margin-bottom:16px; }
  .page-title{ font-size:24px; font-weight:800; margin:0 0 4px; }
  .page-sub{ color:var(--ink-soft); font-size:13.5px; margin:0; }
  .section-label{ font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line); }
  .muted{ color:var(--ink-soft); font-size:13px; }
  .empty{ text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13px; }

  .mini-tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .mini-tabs button{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); padding:8px 15px; border-radius:999px; font-size:13px; font-weight:700; }
  .mini-tabs button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; align-items:flex-end; }
  .filters select, .filters input{ padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:12.5px; background:var(--surface); color:var(--ink); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; box-shadow:0 2px 10px -4px rgba(43,15,31,0.07); }
  .grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media(max-width:640px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:750; padding:10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody select{ padding:5px 7px; border:1px solid var(--line); border-radius:6px; font-size:11.5px; background:var(--surface); }

  .badge{ display:inline-block; font-size:10.5px; font-weight:750; padding:3px 9px; border-radius:999px; }
  .badge-wait{ background:var(--wait-soft); color:var(--wait); }
  .badge-ok{ background:var(--ok-soft); color:var(--ok); }
  .badge-just{ background:var(--just-soft); color:var(--just); }
  .badge-danger{ background:var(--danger-soft); color:var(--danger); }

  .item-card{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface-2); }
  .item-card-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .item-card-head b{ font-size:12.5px; min-width:56px; }
  .item-toggle{ padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); }
  .item-toggle.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .item-sub{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .orient-group{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-left:auto; }
  .orient-btn{ display:inline-flex; align-items:center; gap:5px; padding:6px 10px; font-size:12px; font-weight:700; background:var(--surface-2); color:var(--ink-soft); border:none; cursor:pointer; font-family:inherit; }
  .orient-btn + .orient-btn{ border-left:1px solid var(--line); }
  .orient-btn.active{ background:var(--accent); color:#fff; }
  .orient-btn svg{ width:16px; height:16px; }
  .orient-mini{ display:inline-flex; align-items:center; gap:4px; vertical-align:middle; }
  .orient-mini svg{ width:14px; height:14px; }
  .field textarea{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:var(--surface-2); color:var(--ink); font-family:inherit; resize:vertical; min-height:58px; }
  .field textarea:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .pag-detalhes{ font-size:11px; color:var(--ink-soft); margin-top:4px; max-width:190px; white-space:normal; line-height:1.35; }
  .pag-detalhes a{ color:var(--accent-ink); font-weight:700; text-decoration:none; }
  .leitura-info{ font-size:10.5px; margin-top:4px; white-space:nowrap; font-weight:700; }
  .leitura-info.ok{ color:var(--ok); }
  .leitura-info.wait{ color:var(--ink-faint); font-weight:600; }
  tr.linha-cancelada td{ background:#FBF3F3; color:var(--ink-faint); }
  tr.linha-cancelada td:nth-child(2), tr.linha-cancelada td:nth-child(5){ text-decoration:line-through; }
  .ver-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px 16px; font-size:13px; margin-bottom:14px; }
  .ver-grid .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:750; }
  .ver-grid .v{ font-weight:650; }
  .ver-item{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface-2); font-size:13px; }
  .ver-item .titulo{ font-weight:800; margin-bottom:6px; display:flex; justify-content:space-between; }
  .ver-item img{ max-width:180px; max-height:140px; border-radius:8px; border:1px solid var(--line); display:block; margin-top:6px; background:#fff; }
  .info-interna{ background:#FFF6D6; border:2px solid #E7B93C; border-radius:10px; padding:12px 14px; margin:12px 0; }
  .info-interna .titulo{ font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#8A5A00; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .info-interna .nota{ background:#fff; border:1px solid #F0D48A; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:13px; white-space:pre-wrap; }
  .info-interna .nota .meta{ font-size:11px; color:var(--ink-faint); margin-top:4px; }
  .info-interna textarea{ width:100%; padding:9px 11px; border:1px solid #E7B93C; border-radius:8px; font-size:13.5px; font-family:inherit; resize:vertical; min-height:60px; background:#fff; }
  .badge-info{ background:#FFF6D6; color:#8A5A00; border:1px solid #E7B93C; }
  .cancel-info{ font-size:10.5px; color:var(--danger); margin-top:4px; white-space:normal; max-width:190px; line-height:1.35; }

  .modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}

  #cupomImpressao{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #cupomImpressao, #cupomImpressao *{ visibility:visible; }
    #cupomImpressao{ display:block; position:absolute; top:0; left:0; width:100%; padding:16px; font-family:Arial,sans-serif; }
  }
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="display:block; margin-bottom:14px;">← Gestão e Controle</a>
    <div class="login-tag">Gravações</div>
    <div class="login-title">Acessar Gravações</div>
    <p class="login-sub">Use a mesma senha do resto do sistema.</p>
    <div class="login-error" id="loginError">Senha não encontrada.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary" id="btnLogin">Entrar</button>
  </div>
</div>

<div id="view-grav">
  <header class="topbar">
    <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
    <div class="who">
      <span id="whoName"></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="btn btn-ghost" id="btnLogout" style="padding:5px 10px; background:rgba(179,38,30,0.18); color:#ffb3ac;">🚪 Sair</button>
    </div>
  </header>
  <main id="mainContent"></main>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div id="cupomImpressao"></div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
  const APP_BASE_URL = "https://vilaca-controle-lojas.vercel.app";
  // A biblioteca supabase-js só é usada no upload do logo; carrega com "defer" pra não
  // segurar a abertura da tela, e o client é criado na primeira vez que for preciso.
  let __supabaseClient = null;
  function getSupabaseClient(){
    if(!__supabaseClient){
      if(!window.supabase){ throw new Error('Biblioteca do Supabase ainda não carregou — tente de novo em instantes.'); }
      __supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    return __supabaseClient;
  }

  let __gatewaySenha = null;
  async function gatewayCall(body){
    try{
      const res = await fetch(GATEWAY_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, ...body }),
      });
      return await res.json();
    }catch(e){
      console.error("erro ao falar com o servidor", e);
      return { error: "Não foi possível conectar. Verifique sua internet." };
    }
  }
  async function gatewayLogin(senhaTentativa){
    return gatewayCall({ op:"login", senha: senhaTentativa });
  }

  let currentUser = null;
  let config = null;
  let registros = [];
  let abaAtiva = 'lista';
  const VIA_SEQ_KEY = 'grav_upcase'; // sequência única — este módulo não é dividido por loja física

  /* Etapas do pedido. `cliente` é o texto que o cliente vê (cupom e link de acompanhamento). */
  const STATUS_INFO = {
    pedido:    { label:'Pedido',    cliente:'Seu pedido foi realizado com sucesso e em breve será enviado para a fábrica.' },
    fabrica:   { label:'Fábrica',   cliente:'Seu pedido foi enviado para a fábrica e está em produção.' },
    upcase:    { label:'Up Case',   cliente:'Seu pedido foi liberado pela fábrica e chegará em breve na loja Up Case.' },
    pronto:    { label:'Pronto',    cliente:'Seu pedido está pronto! Já pode ser retirado na loja Up Case.' },
    entregue:  { label:'Entregue',  cliente:'Seu pedido foi entregue e conferido. Obrigado pela preferência!' },
    cancelado: { label:'Cancelado', cliente:'Seu pedido foi cancelado. Em caso de dúvida, fale com a loja.' },
  };
  const STATUS_ORDEM = ['pedido','fabrica','upcase','pronto','entregue','cancelado'];
  function statusLabel(s){ return (STATUS_INFO[s]||{}).label || s; }
  /* Orientação da gravação no item: vertical ou horizontal (desenho de uma linha). */
  const ORIENT = { vertical:'Vertical', horizontal:'Horizontal' };
  function orientSvg(o){
    return o==='vertical'
      ? `<svg viewBox="0 0 16 16" aria-hidden="true"><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`
      : `<svg viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  }
  function orientHtml(o){
    if(!ORIENT[o]) return '';
    return `<span class="orient-mini" title="${ORIENT[o]}">${orientSvg(o)} ${ORIENT[o]}</span>`;
  }
  // registros antigos usavam "em_aberto" como primeira etapa — agora é "pedido"
  function normalizarStatus(g){
    if(g.status==='em_aberto') g.status='pedido';
    if(Array.isArray(g.leituras)) g.leituras.forEach(l=>{ if(l.status==='em_aberto') l.status='pedido'; });
    return g;
  }

  function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtMoeda(v){ return "R$ " + (Number(v)||0).toFixed(2).replace(".", ","); }
  function fmtDataBr(iso){ if(!iso) return "—"; const p=iso.split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
  function uid(pfx){ return pfx+"_"+Math.random().toString(36).slice(2,11); }
  function isoHoje(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function horaAgora(d){ d=d||new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function somenteDigitos(s){ return (s||"").replace(/\D/g,""); }
  function nomeLojaUpCase(){
    const l = (config.lojas||[]).find(x=> (x.nome||'').toUpperCase().includes('UP CASE'));
    return l ? l.id : 'up_case';
  }
  function showToast(msg){
    let el = document.getElementById('toastBox');
    if(!el){ el = document.createElement('div'); el.id='toastBox'; el.style.cssText='position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 10px 30px -10px rgba(0,0,0,.4);'; document.body.appendChild(el); }
    el.textContent = msg; el.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>{ el.style.display='none'; }, 3200);
  }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modalBox').innerHTML=''; }
  function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }

  function readFileAsDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  async function uploadArquivoDrive(dataUrl, filename){
    const { data, error } = await getSupabaseClient().functions.invoke('upload-foto-drive', {
      body: { dataUrl, filename, pasta:'gravacoes', tratar:false, senha: __gatewaySenha }
    });
    if(error) throw error;
    if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
    return data;
  }

  /* Regra fixa: O.S. aberta até meio-dia (11:59) entrega no MESMO dia às 18h.
     O.S. aberta a partir do meio-dia (12:00) entrega no dia SEGUINTE até meio-dia (12h). */
  /* Domingo não conta: se a entrega cair num domingo, passa pra segunda-feira até meio-dia. */
  function calcularEntrega(agora){
    agora = agora || new Date();
    const entrega = new Date(agora);
    if(agora.getHours() < 12){ entrega.setHours(18,0,0,0); }
    else { entrega.setDate(entrega.getDate()+1); entrega.setHours(12,0,0,0); }
    if(entrega.getDay() === 0){ entrega.setDate(entrega.getDate()+1); entrega.setHours(12,0,0,0); }
    return { dataEntrega: isoHoje(entrega), horaEntrega: horaAgora(entrega) };
  }

  /* ================= CARREGAMENTO ================= */
  async function carregarConfig(){
    const r = await gatewayCall({ op:"getConfig" });
    config = (r && r.data) ? r.data : { lojas:[] };
  }
  async function carregarRegistros(){
    const r = await gatewayCall({ op:'selectAll', table:'gravacoes_pedidos' });
    if(r && r.error){ console.error('erro ao carregar gravações', r.error); registros = []; return; }
    registros = ((r && r.data) || []).map(row=>row.payload).map(normalizarStatus);
  }
  async function salvarRegistros(){
    let ok = true;
    for(const g of registros){
      if(!g || !g.id) continue;
      const r = await gatewayCall({ op:'upsert', table:'gravacoes_pedidos', params:{ row:{ id:g.id, payload:g, updated_at:new Date().toISOString() } } });
      if(!r || r.error){ console.error('erro ao salvar gravações', g.id, r && r.error); ok = false; }
    }
    if(!ok) showToast('Não foi possível salvar uma ou mais gravações — tente de novo.');
    return ok;
  }
  /* Salva UM registro sem sobrescrever o que outros usuários (ou a confirmação de leitura do
     cliente) gravaram nesse meio-tempo nessa MESMA gravação: recarrega só essa linha do banco,
     une as confirmações de leitura, e grava só ela — nunca mexe nas outras gravações. */
  async function salvarRegistro(g){
    const r = await gatewayCall({ op:'selectOne', table:'gravacoes_pedidos', params:{ column:'id', value:g.id } });
    if(r && r.error){
      console.error('salvarRegistro: falha ao recarregar antes de salvar', r.error);
      showToast('Sem conexão com o banco — nada foi salvo. Tente de novo.');
      return false;
    }
    const noBanco = (r && r.data) ? normalizarStatus(r.data.payload) : null;
    if(noBanco){
      // une as confirmações de leitura: o cliente pode ter confirmado enquanto a via era editada
      const doBanco = Array.isArray(noBanco.leituras) ? noBanco.leituras : [];
      const locais = Array.isArray(g.leituras) ? g.leituras : [];
      const uniao = [...doBanco];
      locais.forEach(l=>{ if(!uniao.some(u=> u.status===l.status)) uniao.push(l); });
      if(uniao.length) g.leituras = uniao;
    }
    const idx = registros.findIndex(x=>x.id===g.id);
    if(idx>=0) registros[idx] = g; else registros.push(g);
    const rSalvar = await gatewayCall({ op:'upsert', table:'gravacoes_pedidos', params:{ row:{ id:g.id, payload:g, updated_at:new Date().toISOString() } } });
    if(!rSalvar || rSalvar.error){
      console.error('erro ao salvar gravação', g.id, rSalvar && rSalvar.error);
      showToast('Não foi possível salvar — tente de novo.');
      return false;
    }
    return true;
  }
  function leituraStatusHtml(g){
    const leituras = Array.isArray(g.leituras) ? g.leituras : [];
    const conf = leituras.find(l=> l.status===g.status);
    if(conf){
      const dt = new Date(conf.confirmadoEm);
      const dtFmt = isNaN(dt.getTime()) ? conf.confirmadoEm : dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      return `<div class="leitura-info ok" title="Cliente confirmou a leitura desta etapa">✓ Cliente confirmou ${escapeHtml(dtFmt)}</div>`;
    }
    return `<div class="leitura-info wait" title="Cliente ainda não confirmou a leitura desta etapa">⏳ Sem confirmação</div>`;
  }
  /* Quem pode editar a via inteira (dados do cliente, itens, pagamento): o login vinculado
     à loja Up Case e a Diretoria. Os demais só mudam o status e acrescentam informação interna. */
  function podeEditarVia(){
    if(!currentUser) return false;
    if(currentUser.nivel==='diretoria') return true;
    const lojas = Array.isArray(currentUser.lojas) ? currentUser.lojas : [];
    const idUp = nomeLojaUpCase();
    return lojas.includes(idUp) || lojas.some(l=> String(l).toUpperCase().replace(/[^A-Z]/g,'').includes('UPCASE'));
  }
  /* Perfil Oficina (a fábrica que produz a gravação, sem vínculo com a loja Up Case):
     não cria gravação, na lista só abre "Ver via" (e adiciona informação interna) e
     a única mudança de status permitida é marcar "Up Case" (liberado pela fábrica). */
  function perfilOficina(){
    if(!currentUser || currentUser.nivel!=='oficina') return false;
    const lojas = Array.isArray(currentUser.lojas) ? currentUser.lojas : [];
    const idUp = nomeLojaUpCase();
    const vinculadoUpCase = lojas.includes(idUp) || lojas.some(l=> String(l).toUpperCase().replace(/[^A-Z]/g,'').includes('UPCASE'));
    return !vinculadoUpCase;
  }
  /* Informações internas: nunca vão pro cupom nem pro link do cliente. */
  function infoInternaHtml(g, opts){
    opts = opts || {};
    const notas = Array.isArray(g.infoInterna) ? g.infoInterna : [];
    const lista = notas.length ? notas.map((n,i)=>`
      <div class="nota">${escapeHtml(n.texto)}<div class="meta">${escapeHtml(n.por||'—')} · ${escapeHtml(n.em ? new Date(n.em).toLocaleString('pt-BR') : '')}${opts.removivel?` · <a href="#" data-rminfo="${i}" style="color:var(--danger);">remover</a>`:''}</div></div>`).join('')
      : `<div class="muted" style="margin-bottom:6px;">Nenhuma informação interna registrada.</div>`;
    return `
      <div class="info-interna" id="${opts.id||'blocoInfoInterna'}">
        <div class="titulo"><span>🔒 Informações internas (não aparecem para o cliente)</span><button type="button" class="btn btn-ghost btn-xs" data-addinfo="1">➕ Adicionar informação</button></div>
        <div data-listainfo="1">${lista}</div>
        <div data-forminfo="1" style="display:none; margin-top:6px;">
          <textarea data-txtinfo="1" placeholder="Informação de uso interno (fornecedor, custo, problema na peça, combinado com o cliente...)"></textarea>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" class="btn btn-accent btn-sm" data-saveinfo="1">Salvar informação</button>
            <button type="button" class="btn btn-ghost btn-sm" data-cancelinfo="1">Cancelar</button>
          </div>
        </div>
      </div>`;
  }
  /* Liga os eventos do bloco; aoSalvar(texto) recebe a nota nova e decide o que fazer
     (gravar na hora, no modal Ver; ou só acumular, no formulário). */
  function ligarInfoInterna(bloco, aoSalvar, aoRemover){
    if(!bloco) return;
    const form = bloco.querySelector('[data-forminfo]');
    const txt = bloco.querySelector('[data-txtinfo]');
    bloco.querySelector('[data-addinfo]').addEventListener('click', ()=>{ form.style.display='block'; txt.focus(); });
    bloco.querySelector('[data-cancelinfo]').addEventListener('click', ()=>{ form.style.display='none'; txt.value=''; });
    bloco.querySelector('[data-saveinfo]').addEventListener('click', async ()=>{
      const texto = txt.value.trim();
      if(!texto){ showToast('Escreva a informação antes de salvar.'); return; }
      await aoSalvar(texto);
    });
    bloco.querySelectorAll('[data-rminfo]').forEach(a=> a.addEventListener('click', (e)=>{ e.preventDefault(); if(aoRemover) aoRemover(Number(a.dataset.rminfo)); }));
  }
  /* Baixa a imagem anexa; se o Drive bloquear o download direto, abre numa aba nova. */
  async function baixarImagem(url, nomeArquivo){
    try{
      const res = await fetch(url, { mode:'cors' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nomeArquivo || 'imagem.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    }catch(e){
      window.open(url, '_blank');
      showToast('Abrindo a imagem em nova aba — use "Salvar imagem como".');
    }
  }
  const FORMAS_PAG = { dinheiro:'Dinheiro', cartao:'Cartão', pix:'Pix' };
  function pagamentoTexto(g){
    if(!(g.pagamento && g.pagamento.status==='pago')) return 'EM ABERTO';
    return 'Pago — ' + (FORMAS_PAG[g.pagamento.forma] || '');
  }

  /* ================= LOGIN ================= */
  const EMBEDDED = window.self !== window.top;
  if(EMBEDDED){
    document.documentElement.classList.add('embedded');
    window.addEventListener('message', async (ev)=>{
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === 'auth'){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user ? ev.data.user.senha : null;
        await iniciarApp();
      }
    });
    parent.postMessage({ type:'ready', modulo:'gravacoes' }, '*');
  } else {
    document.getElementById('btnLogin').addEventListener('click', fazerLogin);
    document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });
  }
  async function fazerLogin(){
    const pass = document.getElementById('loginPass').value;
    const r = await gatewayLogin(pass);
    if(!r.ok){ document.getElementById('loginError').classList.add('show'); return; }
    document.getElementById('loginError').classList.remove('show');
    __gatewaySenha = pass;
    currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass, lojas: Array.isArray(r.user.lojas) ? r.user.lojas : [] };
    await iniciarApp();
  }
  /* Abertura rápida: mostra a tela na hora (com "Carregando…") e busca config + gravações
     em PARALELO, numa única rodada de rede. Antes eram três chamadas em sequência
     (config → gravações → gravações de novo ao desenhar a lista). */
  let carregamentoInicial = null;
  let dadosFrescosAte = 0;
  async function iniciarApp(){
    config = { lojas:[] };
    carregamentoInicial = Promise.all([carregarConfig(), carregarRegistros()]).then(()=>{
      dadosFrescosAte = Date.now() + 3000; // a lista/relatório não refaz a busca logo em seguida
      carregamentoInicial = null;
    });
    enterApp();               // tela aparece imediatamente
    await carregamentoInicial; // ...e é redesenhada com permissões e dados reais
    render();
  }
  // Recarrega do banco, exceto se os dados acabaram de chegar (evita chamada duplicada na abertura)
  function recarregarSePreciso(){
    if(carregamentoInicial) return carregamentoInicial;
    if(Date.now() < dadosFrescosAte) return Promise.resolve();
    return carregarRegistros();
  }
  document.getElementById('btnLogout').addEventListener('click', ()=>{ window.location.href = 'index.html'; });

  function enterApp(){
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-grav').style.display = 'block';
    document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
    document.getElementById('whoLevel').textContent = currentUser.nivel==='diretoria'?'Diretoria':currentUser.nivel==='gerente'?'Gerente':currentUser.nivel==='oficina'?'Oficina':'Vendedora';
    render();
  }

  /* ================= RENDER PRINCIPAL ================= */
  function render(){
    if(perfilOficina() && abaAtiva==='nova') abaAtiva = 'lista';
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="page-head">
        <div class="page-title">✍️ Gravações</div>
        <p class="page-sub">Serviço de personalização prestado em parceria com a Up Case — controle interno, não entra no faturamento das lojas.</p>
      </div>
      <div class="mini-tabs">
        ${perfilOficina() ? '' : `<button data-aba="nova" class="${abaAtiva==='nova'?'active':''}">+ Nova gravação</button>`}
        <button data-aba="lista" class="${abaAtiva==='lista'?'active':''}">📋 Lista</button>
        <button data-aba="relatorio" class="${abaAtiva==='relatorio'?'active':''}">📊 Relatório mensal</button>
      </div>
      <div id="corpoGrav"></div>
    `;
    main.querySelectorAll('[data-aba]').forEach(b=> b.addEventListener('click', ()=>{ abaAtiva = b.dataset.aba; render(); }));
    if(abaAtiva==='lista') renderLista(document.getElementById('corpoGrav'));
    else if(abaAtiva==='nova') renderFormulario(document.getElementById('corpoGrav'), null);
    else renderRelatorio(document.getElementById('corpoGrav'));
  }

  /* ================= LISTA ================= */
  function pagamentoValorSelect(g){
    if(g.pagamento && g.pagamento.status==='pago') return 'pago:'+g.pagamento.forma;
    return 'aberto';
  }
  function renderLista(wrap){
    wrap.innerHTML = `
      <div class="filters">
        <select id="f_status"><option value="">Todos os status</option>${STATUS_ORDEM.map(k=>`<option value="${k}">${statusLabel(k)}</option>`).join('')}</select>
        <input type="text" id="f_busca" placeholder="Buscar cliente...">
      </div>
      <div id="tabelaGrav"><div class="empty">Carregando…</div></div>
    `;
    const fStatus = document.getElementById('f_status');
    const fBusca = document.getElementById('f_busca');
    function desenhar(){
      const tabela = document.getElementById('tabelaGrav');
      if(!tabela) return; // aba trocada enquanto carregava
      const status = fStatus.value, busca = fBusca.value.trim().toLowerCase();
      const lista = registros.filter(g=>{
        if(status && g.status!==status) return false;
        if(busca && !(g.cliente||'').toLowerCase().includes(busca)) return false;
        return true;
      }).sort((a,b)=> (b.criadoEm||0)-(a.criadoEm||0));
      if(lista.length===0){ tabela.innerHTML = `<div class="empty">Nenhuma gravação encontrada.</div>`; return; }
      tabela.innerHTML = `
        <table>
          <thead><tr><th>Via</th><th>Cliente</th><th>Funcionário</th><th>Itens</th><th>Valor</th><th>Entrega</th><th>Status</th><th>Pagamento</th><th>Ações</th></tr></thead>
          <tbody>${lista.map(g=>`
            <tr data-linha="${g.id}" class="${g.status==='cancelado'?'linha-cancelada':''}">
              <td>${escapeHtml(g.viaNumero)}${g.status==='cancelado'?'<br><span class="badge badge-danger">Cancelada</span>':''}${Array.isArray(g.infoInterna)&&g.infoInterna.length?`<br><span class="badge badge-info" title="Possui informação interna">🔒 ${g.infoInterna.length}</span>`:''}</td>
              <td>${escapeHtml(g.cliente)}<div class="muted" style="font-size:11px;">${escapeHtml(g.whatsapp)}</div></td>
              <td>${escapeHtml(g.funcionario||'—')}</td>
              <td>${escapeHtml(g.quantidadeItens)}</td>
              <td>${fmtMoeda(g.valorTotal)}</td>
              <td>${fmtDataBr(g.dataEntrega)}<br><b>${escapeHtml(g.horaEntrega)}</b></td>
              <td>
                ${perfilOficina() ? `
                  <div><b>${escapeHtml(statusLabel(g.status))}</b></div>
                  ${(g.status==='pedido'||g.status==='fabrica') ? `<button class="btn btn-accent btn-xs" data-marcarupcase="${g.id}" style="margin-top:4px;">✔ Marcar: Up Case</button>` : ''}
                ` : `
                <select class="sel-status" data-id="${g.id}">
                  ${STATUS_ORDEM.map(k=>`<option value="${k}" ${g.status===k?'selected':''}>${statusLabel(k)}</option>`).join('')}
                </select>`}
                ${leituraStatusHtml(g)}
                ${g.status==='cancelado' && g.cancelamento ? `<div class="cancel-info">${g.cancelamento.motivo?escapeHtml(g.cancelamento.motivo)+' · ':''}por ${escapeHtml(g.cancelamento.por||'—')} em ${escapeHtml(fmtDataBr((g.cancelamento.em||'').slice(0,10)))}</div>` : ''}
              </td>
              <td>
                ${!podeEditarVia() ? `<div>${escapeHtml(pagamentoTexto(g))}</div>` : ''}
                <select class="sel-pagamento" data-id="${g.id}" style="${podeEditarVia()?'':'display:none;'}">
                  <option value="aberto" ${pagamentoValorSelect(g)==='aberto'?'selected':''}>Em aberto</option>
                  <option value="pago:dinheiro" ${pagamentoValorSelect(g)==='pago:dinheiro'?'selected':''}>Pago — Dinheiro</option>
                  <option value="pago:cartao" ${pagamentoValorSelect(g)==='pago:cartao'?'selected':''}>Pago — Cartão</option>
                  <option value="pago:pix" ${pagamentoValorSelect(g)==='pago:pix'?'selected':''}>Pago — Pix</option>
                </select>
                ${g.pagamento && g.pagamento.status==='pago' ? `<div class="pag-detalhes">${g.pagamento.detalhes ? escapeHtml(g.pagamento.detalhes) : '<span class="muted">Sem detalhes</span>'} ${podeEditarVia()?`<a href="#" data-pagdet="${g.id}" title="Editar detalhes do pagamento">✎</a>`:''}</div>` : ''}
              </td>
              <td style="white-space:nowrap;">
                <button class="btn btn-ghost btn-xs" data-ver="${g.id}" title="Ver via completa">👁 Ver</button>
                ${perfilOficina() ? '' : `
                ${podeEditarVia() ? `<button class="btn btn-ghost btn-xs" data-editar="${g.id}">✎ Editar</button>` : ''}
                <button class="btn btn-ghost btn-xs" data-imprimir="${g.id}">🖨️</button>
                <button class="btn btn-ghost btn-xs" data-whats="${g.id}" style="background:#dcf8c6; color:#1f5c1f;">💬</button>
                ${g.status!=='cancelado' ? `<button class="btn btn-ghost btn-xs" data-cancelar="${g.id}" title="Cancelar esta gravação" style="background:var(--danger-soft); color:var(--danger);">🚫</button>` : ''}`}
              </td>
            </tr>
          `).join('')}</tbody>
        </table>
      `;
      tabela.querySelectorAll('[data-marcarupcase]').forEach(b=> b.addEventListener('click', async ()=>{
        const g = registros.find(r=>r.id===b.dataset.marcarupcase);
        if(!g) return;
        const anterior = g.status;
        b.disabled = true; b.textContent = 'Salvando...';
        g.status = 'upcase';
        const ok = await salvarRegistro(g);
        if(ok){ showToast('Gravação '+g.viaNumero+' marcada como Up Case (liberada pela fábrica).'); desenhar(); }
        else { g.status = anterior; desenhar(); }
      }));
      tabela.querySelectorAll('.sel-status').forEach(sel=> sel.addEventListener('change', async ()=>{
        const g = registros.find(r=>r.id===sel.dataset.id);
        if(!g) return;
        const anterior = g.status;
        if(sel.value==='cancelado'){ abrirCancelamento(g, anterior); return; }
        g.status = sel.value;
        const ok = await salvarRegistro(g);
        if(ok){ showToast('Status atualizado.'); desenhar(); }
        else { g.status = anterior; desenhar(); }
      }));
      tabela.querySelectorAll('.sel-pagamento').forEach(sel=> sel.addEventListener('change', async ()=>{
        const g = registros.find(r=>r.id===sel.dataset.id);
        if(!g) return;
        const anterior = g.pagamento ? { ...g.pagamento } : { status:'em_aberto', forma:null };
        if(sel.value==='aberto'){
          g.pagamento = { status:'em_aberto', forma:null };
          const ok = await salvarRegistro(g);
          if(ok){ showToast('Pagamento marcado como em aberto.'); desenhar(); }
          else { g.pagamento = anterior; desenhar(); }
          return;
        }
        const forma = sel.value.split(':')[1];
        // escolhido o tipo de pagamento, abre o campo livre pra registrar quem recebeu / cupom / conta do Pix
        abrirDetalhesPagamento(g, forma, anterior);
      }));
      tabela.querySelectorAll('[data-pagdet]').forEach(a=> a.addEventListener('click', (e)=>{
        e.preventDefault();
        const g = registros.find(r=>r.id===a.dataset.pagdet);
        if(!g || !g.pagamento) return;
        abrirDetalhesPagamento(g, g.pagamento.forma, { ...g.pagamento });
      }));
      tabela.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', ()=>{
        const g = registros.find(r=>r.id===b.dataset.cancelar);
        if(g) abrirCancelamento(g, g.status);
      }));
      tabela.querySelectorAll('[data-ver]').forEach(b=> b.addEventListener('click', ()=> abrirVer(b.dataset.ver)));
      tabela.querySelectorAll('[data-editar]').forEach(b=> b.addEventListener('click', ()=> abrirEditar(b.dataset.editar)));
      tabela.querySelectorAll('[data-imprimir]').forEach(b=> b.addEventListener('click', ()=> imprimirVia(registros.find(r=>r.id===b.dataset.imprimir))));
      tabela.querySelectorAll('[data-whats]').forEach(b=> b.addEventListener('click', ()=> enviarWhatsapp(registros.find(r=>r.id===b.dataset.whats))));
    }
    /* Cancelamento: a gravação continua no sistema (com tudo visível), mas marcada como
       cancelada e fora do relatório mensal. Cancelar no modal volta o select ao status anterior. */
    function abrirCancelamento(g, anterior){
      openModal(`
        <div class="section-label" style="color:var(--danger);">Cancelar gravação · Via ${escapeHtml(g.viaNumero)}</div>
        <div class="muted" style="margin-bottom:10px;">Cliente: <b>${escapeHtml(g.cliente)}</b> · Valor: <b>${fmtMoeda(g.valorTotal)}</b>${g.pagamento&&g.pagamento.status==='pago'?' · <b style="color:var(--danger);">já consta como paga</b>':''}</div>
        <div class="field">
          <label>Motivo do cancelamento *</label>
          <textarea id="cancel_motivo" placeholder="Ex.: cliente desistiu, peça não comporta gravação..."></textarea>
          <div class="muted" style="margin-top:4px;">Obrigatório — o cancelamento só é registrado com o motivo preenchido.</div>
        </div>
        <div class="muted" style="margin-bottom:6px;">A gravação fica registrada como <b>Cancelada</b>, continua visível na lista, e o valor sai do relatório mensal.</div>
        <div class="modal-actions">
          <button class="btn btn-accent" id="btnConfirmarCancel" style="background:var(--danger);">🚫 Confirmar cancelamento</button>
          <button class="btn btn-ghost" id="btnVoltarCancel">Voltar</button>
        </div>
      `);
      document.getElementById('btnVoltarCancel').addEventListener('click', ()=>{ g.status = anterior; closeModal(); desenhar(); });
      document.getElementById('btnConfirmarCancel').addEventListener('click', async ()=>{
        const btn = document.getElementById('btnConfirmarCancel');
        const motivo = document.getElementById('cancel_motivo').value.trim();
        if(!motivo){
          showToast('Informe o motivo do cancelamento.');
          const ta = document.getElementById('cancel_motivo');
          ta.style.borderColor = 'var(--danger)'; ta.focus();
          return;
        }
        btn.disabled = true; btn.textContent = 'Cancelando...';
        const cancelAntes = g.cancelamento;
        g.status = 'cancelado';
        g.cancelamento = { motivo, por: currentUser ? currentUser.nome : '', em: new Date().toISOString(), statusAnterior: anterior };
        const ok = await salvarRegistro(g);
        if(!ok){ g.status = anterior; g.cancelamento = cancelAntes; btn.disabled=false; btn.textContent='🚫 Confirmar cancelamento'; return; }
        closeModal(); showToast(`Gravação ${g.viaNumero} cancelada.`); desenhar();
      });
    }
    /* Modal do campo livre de pagamento. Cancelar volta o select ao valor anterior;
       salvar grava forma + detalhes + quem/quando registrou. */
    function abrirDetalhesPagamento(g, forma, anterior){
      const jaTinha = g.pagamento && g.pagamento.status==='pago' ? (g.pagamento.detalhes||'') : '';
      openModal(`
        <div class="section-label">Pagamento — ${escapeHtml(FORMAS_PAG[forma]||forma)} · Via ${escapeHtml(g.viaNumero)}</div>
        <div class="muted" style="margin-bottom:10px;">Cliente: <b>${escapeHtml(g.cliente)}</b> · Valor: <b>${fmtMoeda(g.valorTotal)}</b></div>
        <div class="field">
          <label>Detalhes do recebimento</label>
          <textarea id="pag_detalhes" placeholder="Ex.: quem recebeu, número do cupom, conta do Pix...">${escapeHtml(jaTinha)}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-accent" id="btnSalvarPag">💾 Salvar pagamento</button>
          <button class="btn btn-ghost" id="btnCancelarPag">Cancelar</button>
        </div>
      `);
      document.getElementById('pag_detalhes').focus();
      document.getElementById('btnCancelarPag').addEventListener('click', ()=>{
        g.pagamento = anterior;
        closeModal(); desenhar();
      });
      document.getElementById('btnSalvarPag').addEventListener('click', async ()=>{
        const btn = document.getElementById('btnSalvarPag');
        btn.disabled = true; btn.textContent = 'Salvando...';
        const detalhes = document.getElementById('pag_detalhes').value.trim();
        g.pagamento = {
          status:'pago', forma, detalhes,
          registradoPor: currentUser ? currentUser.nome : '',
          registradoEm: new Date().toISOString(),
          dataPagamento: (anterior && anterior.status==='pago' && anterior.dataPagamento) ? anterior.dataPagamento : isoHoje(),
        };
        const ok = await salvarRegistro(g);
        if(!ok){ g.pagamento = anterior; btn.disabled=false; btn.textContent='💾 Salvar pagamento'; return; }
        closeModal(); showToast('Pagamento registrado.'); desenhar();
      });
    }
    [fStatus,fBusca].forEach(el=> el.addEventListener('input', desenhar));
    // recarrega do banco ao abrir a lista: o cliente pode ter confirmado a leitura, ou outro
    // funcionário pode ter alterado algo em outro aparelho (mesmo padrão do Painel de O.S.)
    recarregarSePreciso().then(desenhar);
  }

  /* ================= FORMULÁRIO (nova / editar) ================= */
  const OPCOES_VALOR = [10,20,30,40,50];
  function renderFormulario(wrap, registroExistente, aoSalvarComSucesso){
    const editando = !!registroExistente;
    let itensState = editando
      ? (registroExistente.itens||[]).map(it=>({ valor: it.valor||'', nome: it.nome||'', logoUrl: it.logoUrl||'', observacoes: it.observacoes||'', orientacao: it.orientacao||'', nomeAtivo: !!it.nome, logoAtivo: !!it.logoUrl }))
      : [{ valor:'', nome:'', logoUrl:'', observacoes:'', orientacao:'', nomeAtivo:false, logoAtivo:false }];
    if(itensState.length===0) itensState = [{ valor:'', nome:'', logoUrl:'', observacoes:'', orientacao:'', nomeAtivo:false, logoAtivo:false }];
    let infoState = editando && Array.isArray(registroExistente.infoInterna) ? registroExistente.infoInterna.map(n=>({...n})) : [];
    const pagIni = editando ? pagamentoValorSelect(registroExistente) : 'aberto';

    wrap.innerHTML = `
      <div class="card">
        <div class="section-label">Cliente</div>
        <div class="grid-2">
          <div class="field"><label>Nome *</label><input id="n_cliente" value="${editando?escapeHtml(registroExistente.cliente):''}"></div>
          <div class="field"><label>WhatsApp *</label><input id="n_whatsapp" placeholder="(32) 90000-0000" value="${editando?escapeHtml(registroExistente.whatsapp):''}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Funcionário que fez a via *</label><input id="n_funcionario" placeholder="Nome do funcionário" value="${escapeHtml(editando ? (registroExistente.funcionario||'') : (currentUser ? currentUser.nome : ''))}"></div>
          <div class="field"><label>Quantidade de itens *</label><input id="n_qtd" type="number" min="1" max="50" value="${editando?registroExistente.quantidadeItens:1}"></div>
        </div>
        <div class="section-label">Itens</div>
        <div id="areaItens"></div>
        ${infoInternaHtml({ infoInterna: infoState }, { id:'infoInternaForm', removivel:true })}
        <div class="section-label">Pagamento</div>
        <div class="grid-2">
          <div class="field">
            <label>Situação do pagamento</label>
            <select id="n_pagamento">
              <option value="aberto" ${pagIni==='aberto'?'selected':''}>Pendente (em aberto)</option>
              <option value="pago:dinheiro" ${pagIni==='pago:dinheiro'?'selected':''}>Pago — Dinheiro</option>
              <option value="pago:cartao" ${pagIni==='pago:cartao'?'selected':''}>Pago — Cartão</option>
              <option value="pago:pix" ${pagIni==='pago:pix'?'selected':''}>Pago — Pix</option>
            </select>
          </div>
          <div class="field" id="wrapPagDetalhes" style="display:${pagIni==='aberto'?'none':'block'};">
            <label>Detalhes do recebimento</label>
            <textarea id="n_pag_detalhes" placeholder="Ex.: quem recebeu, número do cupom, conta do Pix...">${escapeHtml(editando && registroExistente.pagamento ? (registroExistente.pagamento.detalhes||'') : '')}</textarea>
          </div>
        </div>
        <div class="card" style="background:var(--surface-2); box-shadow:none;">
          <div class="grid-2">
            <div><span class="muted">Quantidade de itens</span><div style="font-size:20px; font-weight:800;" id="resumoQtd">1</div></div>
            <div><span class="muted">Valor total</span><div style="font-size:20px; font-weight:800;" id="resumoValor">R$ 0,00</div></div>
          </div>
        </div>
        <button class="btn btn-accent" id="btnSalvarForm" style="margin-top:8px;">💾 ${editando?'Salvar alterações':'Salvar gravação'}</button>
        ${editando ? `<button class="btn btn-ghost" id="btnCancelarForm" style="margin-top:8px; margin-left:8px;">Cancelar</button>` : ''}
      </div>
    `;

    function itemRowHtml(i){
      const it = itensState[i];
      return `
        <div class="item-card" data-itemcard="${i}">
          <div class="item-card-head">
            <b>Item ${i+1}</b>
            <select data-itemvalor="${i}" style="max-width:150px;">
              <option value="">Valor...</option>
              ${OPCOES_VALOR.map(v=>`<option value="${v}" ${String(it.valor)===String(v)?'selected':''}>${fmtMoeda(v)}</option>`).join('')}
            </select>
            <button type="button" class="item-toggle ${it.nomeAtivo?'active':''}" data-toggle-nome="${i}">🔤 Nome</button>
            <button type="button" class="item-toggle ${it.logoAtivo?'active':''}" data-toggle-logo="${i}">🖼️ Logo</button>
            <div class="orient-group" title="Orientação da gravação">
              <button type="button" class="orient-btn ${it.orientacao==='vertical'?'active':''}" data-orient="${i}" data-val="vertical">${orientSvg('vertical')} Vertical</button>
              <button type="button" class="orient-btn ${it.orientacao==='horizontal'?'active':''}" data-orient="${i}" data-val="horizontal">${orientSvg('horizontal')} Horizontal</button>
            </div>
          </div>
          <div class="item-sub" data-sub-nome="${i}" style="display:${it.nomeAtivo?'block':'none'};">
            <div class="field" style="margin-bottom:0;"><label>Nome / frase pra gravar</label><input data-itemnome="${i}" value="${escapeHtml(it.nome||'')}" placeholder="Ex: Maria, Sempre Juntos..."></div>
          </div>
          <div class="item-sub" data-sub-logo="${i}" style="display:${it.logoAtivo?'block':'none'};">
            <div class="field" style="margin-bottom:0;">
              <label>Arquivo do logo/imagem</label>
              <input type="file" accept="image/*" data-itemlogo="${i}">
              <div class="muted" style="margin-top:4px;" data-logostatus="${i}">${it.logoUrl?('✅ Arquivo enviado — <a href="'+escapeHtml(it.logoUrl)+'" target="_blank">ver</a>'):''}</div>
            </div>
          </div>
          <div class="item-sub">
            <div class="field" style="margin-bottom:0;"><label>Observações do item</label><textarea data-itemobs="${i}" placeholder="Ex.: fonte cursiva, gravar na parte interna, posição do logo...">${escapeHtml(it.observacoes||'')}</textarea></div>
          </div>
        </div>
      `;
    }
    function desenharItens(){
      document.getElementById('areaItens').innerHTML = itensState.map((_,i)=>itemRowHtml(i)).join('');
      ligarEventosItens();
      atualizarResumo();
    }
    function ligarEventosItens(){
      document.querySelectorAll('[data-itemvalor]').forEach(sel=> sel.addEventListener('change', ()=>{
        itensState[Number(sel.dataset.itemvalor)].valor = sel.value ? Number(sel.value) : '';
        atualizarResumo();
      }));
      document.querySelectorAll('[data-toggle-nome]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.toggleNome);
        itensState[i].nomeAtivo = !itensState[i].nomeAtivo;
        desenharItens();
      }));
      document.querySelectorAll('[data-toggle-logo]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.toggleLogo);
        itensState[i].logoAtivo = !itensState[i].logoAtivo;
        desenharItens();
      }));
      document.querySelectorAll('[data-itemnome]').forEach(inp=> inp.addEventListener('input', ()=>{
        itensState[Number(inp.dataset.itemnome)].nome = inp.value;
      }));
      document.querySelectorAll('[data-orient]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.orient), val = b.dataset.val;
        itensState[i].orientacao = (itensState[i].orientacao===val) ? '' : val; // clicar de novo desmarca
        document.querySelectorAll(`[data-orient="${i}"]`).forEach(x=> x.classList.toggle('active', x.dataset.val===itensState[i].orientacao));
      }));
      document.querySelectorAll('[data-itemobs]').forEach(ta=> ta.addEventListener('input', ()=>{
        itensState[Number(ta.dataset.itemobs)].observacoes = ta.value;
      }));
      document.querySelectorAll('[data-itemlogo]').forEach(inp=> inp.addEventListener('change', async (e)=>{
        const i = Number(inp.dataset.itemlogo);
        const file = e.target.files[0];
        if(!file) return;
        const status = document.querySelector(`[data-logostatus="${i}"]`);
        status.textContent = 'Enviando...';
        try{
          const dataUrl = await readFileAsDataUrl(file);
          const resultado = await uploadArquivoDrive(dataUrl, 'gravacao_item_'+Date.now()+'.jpg');
          itensState[i].logoUrl = resultado.url;
          status.innerHTML = '✅ Arquivo enviado — <a href="'+escapeHtml(resultado.url)+'" target="_blank">ver</a>';
        }catch(err){
          console.error('erro ao enviar logo', err);
          status.textContent = 'Não foi possível enviar o arquivo.';
        }
      }));
    }
    function atualizarResumo(){
      const total = itensState.reduce((a,it)=> a + (Number(it.valor)||0), 0);
      document.getElementById('resumoQtd').textContent = itensState.length;
      document.getElementById('resumoValor').textContent = fmtMoeda(total);
    }
    function desenharInfoInterna(){
      const velho = document.getElementById('infoInternaForm');
      const tmp = document.createElement('div'); tmp.innerHTML = infoInternaHtml({ infoInterna: infoState }, { id:'infoInternaForm', removivel:true });
      velho.replaceWith(tmp.firstElementChild);
      ligarInfoInterna(document.getElementById('infoInternaForm'), async (texto)=>{
        infoState.push({ texto, por: currentUser ? currentUser.nome : '', em: new Date().toISOString() });
        desenharInfoInterna();
      }, (i)=>{ infoState.splice(i,1); desenharInfoInterna(); });
    }
    desenharInfoInterna();
    // ao escolher uma forma paga, abre o campo livre (quem recebeu / cupom / conta Pix)
    document.getElementById('n_pagamento').addEventListener('change', ()=>{
      const v = document.getElementById('n_pagamento').value;
      document.getElementById('wrapPagDetalhes').style.display = v==='aberto' ? 'none' : 'block';
      if(v!=='aberto') document.getElementById('n_pag_detalhes').focus();
    });
    document.getElementById('n_qtd').addEventListener('input', ()=>{
      const qtd = Math.max(1, Math.min(50, parseInt(document.getElementById('n_qtd').value)||1));
      if(qtd > itensState.length){ while(itensState.length<qtd) itensState.push({ valor:'', nome:'', logoUrl:'', observacoes:'', orientacao:'', nomeAtivo:false, logoAtivo:false }); }
      else if(qtd < itensState.length){ itensState = itensState.slice(0,qtd); }
      desenharItens();
    });
    desenharItens();

    if(editando){
      document.getElementById('btnCancelarForm').addEventListener('click', ()=>{ if(aoSalvarComSucesso) aoSalvarComSucesso(); else { abaAtiva='lista'; render(); } });
    }
    document.getElementById('btnSalvarForm').addEventListener('click', async ()=>{
      const cliente = document.getElementById('n_cliente').value.trim();
      const whatsapp = document.getElementById('n_whatsapp').value.trim();
      const funcionario = document.getElementById('n_funcionario').value.trim();
      if(!funcionario){ showToast('Informe o funcionário que fez a via.'); document.getElementById('n_funcionario').focus(); return; }
      const pagSel = document.getElementById('n_pagamento').value;
      const pagAnterior = editando && registroExistente.pagamento ? registroExistente.pagamento : null;
      let pagamento;
      if(pagSel==='aberto'){ pagamento = { status:'em_aberto', forma:null }; }
      else {
        const forma = pagSel.split(':')[1];
        const jaPago = pagAnterior && pagAnterior.status==='pago';
        pagamento = {
          status:'pago', forma, detalhes: document.getElementById('n_pag_detalhes').value.trim(),
          registradoPor: jaPago && pagAnterior.forma===forma ? (pagAnterior.registradoPor||(currentUser?currentUser.nome:'')) : (currentUser ? currentUser.nome : ''),
          registradoEm: jaPago && pagAnterior.forma===forma ? (pagAnterior.registradoEm||new Date().toISOString()) : new Date().toISOString(),
          dataPagamento: jaPago && pagAnterior.dataPagamento ? pagAnterior.dataPagamento : isoHoje(),
        };
      }
      if(!cliente){ showToast('Informe o nome do cliente.'); return; }
      if(!whatsapp){ showToast('Informe o WhatsApp do cliente.'); return; }
      if(itensState.some(it=>!it.valor)){ showToast('Selecione o valor de todos os itens.'); return; }
      const iNome = itensState.findIndex(it=> it.nomeAtivo && !(it.nome||'').trim());
      if(iNome>=0){ showToast(`Item ${iNome+1}: escreva o nome/frase a gravar ou desmarque "Nome".`); return; }
      const iLogo = itensState.findIndex(it=> it.logoAtivo && !it.logoUrl);
      if(iLogo>=0){ showToast(`Item ${iLogo+1}: envie o arquivo do logo (aguarde o "Arquivo enviado") ou desmarque "Logo".`); return; }

      const btn = document.getElementById('btnSalvarForm');
      btn.disabled = true; btn.textContent = 'Salvando...';
      const itensFinal = itensState.map(it=>({ valor: Number(it.valor), nome: it.nomeAtivo ? (it.nome||'').trim() : '', logoUrl: it.logoAtivo ? (it.logoUrl||'') : '', observacoes: (it.observacoes||'').trim(), orientacao: ORIENT[it.orientacao] ? it.orientacao : '' }));
      const valorTotal = itensFinal.reduce((a,it)=>a+it.valor,0);

      if(editando){
        const antes = JSON.parse(JSON.stringify(registroExistente));
        Object.assign(registroExistente, {
          cliente, whatsapp, funcionario,
          quantidadeItens: itensFinal.length, itens: itensFinal, valorTotal,
          infoInterna: infoState, pagamento,
        });
        const ok = await salvarRegistro(registroExistente);
        btn.disabled = false; btn.textContent = '💾 Salvar alterações';
        if(!ok){ Object.assign(registroExistente, antes); return; }
        showToast(`Gravação ${registroExistente.viaNumero} atualizada.`);
        abaAtiva = 'lista'; render();
        if(aoSalvarComSucesso) aoSalvarComSucesso();
      }else{
        const rSeq = await gatewayCall({ op:'bumpViaSequence', params:{ loja: VIA_SEQ_KEY } });
        if(!rSeq || rSeq.error || !rSeq.proximo){
          // sem número de via não salva: um número improvisado poderia repetir uma via já existente
          btn.disabled = false; btn.textContent = '💾 Salvar gravação';
          showToast('Não foi possível gerar o número da via — ' + ((rSeq && rSeq.error) || 'tente de novo.'));
          return;
        }
        const viaNumero = rSeq.proximo;
        const agora = new Date();
        const { dataEntrega, horaEntrega } = calcularEntrega(agora);
        const novoRegistro = {
          id: uid('grav'),
          viaNumero, loja: nomeLojaUpCase(), cliente, whatsapp, funcionario,
          dataEntrada: isoHoje(agora), horaEntrada: horaAgora(agora),
          dataEntrega, horaEntrega,
          quantidadeItens: itensFinal.length, itens: itensFinal, valorTotal,
          status: 'pedido',
          pagamento,
          infoInterna: infoState,
          criadoEm: Date.now(), criadoPor: currentUser.nome,
        };
        const ok = await salvarRegistro(novoRegistro);
        btn.disabled = false; btn.textContent = '💾 Salvar gravação';
        if(!ok){ registros = registros.filter(r=>r.id!==novoRegistro.id); return; }
        showToast(`Gravação ${viaNumero} salva!`);
        abaAtiva = 'lista'; render();
      }
    });
  }
  /* Visualização completa da via (somente leitura). */
  function abrirVer(id){
    const g = registros.find(r=>r.id===id);
    if(!g) return;
    const itens = g.itens || [];
    const pago = !!(g.pagamento && g.pagamento.status==='pago');
    openModal(`
      <div class="section-label">Via ${escapeHtml(g.viaNumero)} — ${escapeHtml(g.cliente)} ${g.status==='cancelado'?'<span class="badge badge-danger" style="margin-left:6px;">Cancelada</span>':''}</div>
      <div class="ver-grid">
        <div><div class="k">Cliente</div><div class="v">${escapeHtml(g.cliente)}</div></div>
        <div><div class="k">WhatsApp</div><div class="v">${escapeHtml(g.whatsapp||'—')}</div></div>
        <div><div class="k">Entrada</div><div class="v">${fmtDataBr(g.dataEntrada)} às ${escapeHtml(g.horaEntrada||'—')}</div></div>
        <div><div class="k">Entrega prevista</div><div class="v">${fmtDataBr(g.dataEntrega)} às ${escapeHtml(g.horaEntrega||'—')}</div></div>
        <div><div class="k">Status</div><div class="v">${escapeHtml(statusLabel(g.status))}</div></div>
        <div><div class="k">Pagamento</div><div class="v">${escapeHtml(pagamentoTexto(g))}${pago&&g.pagamento.detalhes?('<div class="muted" style="font-size:12px;">'+escapeHtml(g.pagamento.detalhes)+'</div>'):''}</div></div>
        <div><div class="k">Funcionário</div><div class="v">${escapeHtml(g.funcionario||'—')}</div></div>
        <div><div class="k">Valor total</div><div class="v">${fmtMoeda(g.valorTotal)} · ${escapeHtml(g.quantidadeItens)} item(ns)</div></div>
        ${g.criadoPor?`<div><div class="k">Registrado por</div><div class="v">${escapeHtml(g.criadoPor)}</div></div>`:''}
        ${g.status==='cancelado'&&g.cancelamento?`<div style="grid-column:1/-1;"><div class="k">Cancelamento</div><div class="v" style="color:var(--danger);">${g.cancelamento.motivo?escapeHtml(g.cancelamento.motivo)+' · ':''}por ${escapeHtml(g.cancelamento.por||'—')} em ${escapeHtml(fmtDataBr((g.cancelamento.em||'').slice(0,10)))}</div></div>`:''}
      </div>
      ${infoInternaHtml(g, { id:'infoInternaVer' })}
      <div class="section-label">Itens</div>
      ${itens.length ? itens.map((it,i)=>`
        <div class="ver-item">
          <div class="titulo"><span>Item ${i+1}</span><span>${fmtMoeda(it.valor)}</span></div>
          <div><b>Nome / frase:</b> ${it.nome ? escapeHtml(it.nome) : '<span class="muted">— sem texto</span>'}</div>
          <div><b>Orientação:</b> ${it.orientacao ? orientHtml(it.orientacao) : '<span class="muted">—</span>'}</div>
          <div><b>Arquivo anexo:</b> ${it.logoUrl ? `<a href="${escapeHtml(it.logoUrl)}" target="_blank">abrir arquivo</a> · <button type="button" class="btn btn-ghost btn-xs" data-baixar="${i}">💾 Salvar imagem</button><img src="${escapeHtml(it.logoUrl)}" alt="Logo do item ${i+1}" onerror="this.style.display='none'">` : '<span class="muted">— sem arquivo</span>'}</div>
          <div><b>Observações:</b> ${it.observacoes ? escapeHtml(it.observacoes) : '<span class="muted">—</span>'}</div>
        </div>`).join('') : '<div class="muted">Nenhum item registrado.</div>'}
      ${leiturasHistoricoHtml(g)}
      <div class="modal-actions">
        ${perfilOficina() ? '' : `<button class="btn btn-ghost" id="btnVerImprimir">🖨️ Imprimir</button>`}
        ${podeEditarVia() ? `<button class="btn btn-ghost" id="btnVerEditar">✎ Editar</button>` : ''}
        <button class="btn btn-ghost" id="btnFecharVer">Fechar</button>
      </div>
    `);
    document.getElementById('btnFecharVer').addEventListener('click', closeModal);
    const bImp = document.getElementById('btnVerImprimir');
    if(bImp) bImp.addEventListener('click', ()=> imprimirVia(g));
    const bEd = document.getElementById('btnVerEditar');
    if(bEd) bEd.addEventListener('click', ()=>{ closeModal(); abrirEditar(g.id); });
    document.querySelectorAll('#modalBox [data-baixar]').forEach(b=> b.addEventListener('click', ()=>{
      const it = itens[Number(b.dataset.baixar)];
      if(it && it.logoUrl) baixarImagem(it.logoUrl, `via_${g.viaNumero}_item_${Number(b.dataset.baixar)+1}.jpg`);
    }));
    // informação interna: salva na hora e redesenha o modal
    ligarInfoInterna(document.getElementById('infoInternaVer'), async (texto)=>{
      if(!Array.isArray(g.infoInterna)) g.infoInterna = [];
      g.infoInterna.push({ texto, por: currentUser ? currentUser.nome : '', em: new Date().toISOString() });
      const ok = await salvarRegistro(g);
      if(!ok){ g.infoInterna.pop(); return; }
      showToast('Informação interna salva.');
      abrirVer(g.id);
    });
  }
  function abrirEditar(id){
    const g = registros.find(r=>r.id===id);
    if(!g) return;
    if(!podeEditarVia()){ showToast('Somente o login da Up Case pode editar a via. Você pode alterar o status e adicionar informação interna.'); return; }
    openModal(`<div id="areaEditarModal"></div>${leiturasHistoricoHtml(g)}<div class="modal-actions"><button class="btn btn-ghost" id="btnFecharEditar">Fechar</button></div>`);
    document.getElementById('btnFecharEditar').addEventListener('click', closeModal);
    renderFormulario(document.getElementById('areaEditarModal'), g, closeModal);
  }

  /* Histórico de confirmações de leitura do cliente (mesmo padrão do Painel de O.S.). */
  function leiturasHistoricoHtml(g){
    const leituras = Array.isArray(g.leituras) ? g.leituras : [];
    const rotulo = { pedido:'Pedido', fabrica:'Fábrica', upcase:'Up Case', pronto:'Pronto', entregue:'Entregue', cancelado:'Cancelamento' };
    if(leituras.length===0){
      return `<div class="section-label" style="margin-top:18px;">Confirmações do cliente</div><div class="muted" style="margin-bottom:8px;">O cliente ainda não confirmou nenhuma atualização pelo link.</div>`;
    }
    const linhas = leituras.map(l=>{
      const dt = new Date(l.confirmadoEm);
      const dtFmt = isNaN(dt.getTime()) ? l.confirmadoEm : dt.toLocaleString('pt-BR');
      return `<div style="font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--line);">✓ Confirmou <b>${escapeHtml(rotulo[l.status]||l.status)}</b> em ${escapeHtml(dtFmt)}</div>`;
    }).join('');
    return `<div class="section-label" style="margin-top:18px;">Confirmações do cliente</div><div style="margin-bottom:8px;">${linhas}</div>`;
  }

  /* ================= IMPRESSÃO ================= */
  function imprimirVia(g){
    if(!g) return;
    const cupom = document.getElementById('cupomImpressao');
    const pago = !!(g.pagamento && g.pagamento.status==='pago');
    cupom.innerHTML = `
      <div style="text-align:center; margin-bottom:10px;">
        <div style="font-size:18px; font-weight:800;">UP CASE</div>
        <div style="font-size:15px;">Personalizado pela <b>Vilaça Joias</b></div>
        <div>Via nº ${escapeHtml(g.viaNumero)}</div>
        ${g.status==='cancelado' ? `<div style="margin-top:6px; padding:6px; border:2px solid #000; font-weight:800; font-size:15px;">*** GRAVAÇÃO CANCELADA ***${g.cancelamento&&g.cancelamento.motivo?('<div style="font-size:11px; font-weight:400;">Motivo: '+escapeHtml(g.cancelamento.motivo)+'</div>'):''}</div>` : ''}
      </div>
      <hr>
      <div>Cliente: <b>${escapeHtml(g.cliente)}</b></div>
      <div>WhatsApp: ${escapeHtml(g.whatsapp)}</div>
      ${g.funcionario?`<div>Funcionário: ${escapeHtml(g.funcionario)}</div>`:''}
      <hr>
      <div>Entrada: <b>${fmtDataBr(g.dataEntrada)}</b> às <b>${escapeHtml(g.horaEntrada)}</b></div>
      <div>Entrega prevista: <b>${fmtDataBr(g.dataEntrega)}</b> às <b>${escapeHtml(g.horaEntrega)}</b></div>
      <div style="margin-top:6px;">Situação atual: <b>${escapeHtml(statusLabel(g.status))}</b> — ${escapeHtml((STATUS_INFO[g.status]||{}).cliente||'')}</div>
      <hr>
      <div>Quantidade de itens: <b>${escapeHtml(g.quantidadeItens)}</b></div>
      ${(g.itens||[]).map((it,i)=>`<div>Item ${i+1}: <b>${fmtMoeda(it.valor)}</b>${it.nome?(' — "'+escapeHtml(it.nome)+'"'):''}${it.logoUrl?' — (com logo)':''}${it.orientacao?(' — '+orientHtml(it.orientacao)):''}${it.observacoes?('<div style="font-size:12px; margin-left:12px;">Obs.: '+escapeHtml(it.observacoes)+'</div>'):''}</div>`).join('')}
      <div style="margin-top:6px;">Valor total: <b>${fmtMoeda(g.valorTotal)}</b></div>
      ${pago
        ? `<div>Pagamento: <b>${escapeHtml(pagamentoTexto(g))}</b>${g.pagamento.detalhes?(' — '+escapeHtml(g.pagamento.detalhes)):''}</div>`
        : `<div style="margin-top:8px; padding:8px; border:2px solid #000; text-align:center; font-weight:800; font-size:14px;">⚠ PAGAMENTO EM ABERTO — ${fmtMoeda(g.valorTotal)}<div style="font-size:11px; font-weight:400;">Pagamento a ser efetuado na retirada.</div></div>`}
      <hr>
      <div style="font-size:11px; margin-top:6px;">
        <b>Etapas do seu pedido:</b>
        ${['pedido','fabrica','upcase','pronto','entregue'].map(k=>`<div>• <b>${escapeHtml(statusLabel(k))}</b> — ${escapeHtml(STATUS_INFO[k].cliente)}</div>`).join('')}
        <div style="margin-top:4px;">Acompanhe pelo link enviado no seu WhatsApp: ${escapeHtml(APP_BASE_URL)}/acompanhar-gravacao.html?id=${escapeHtml(g.id)}</div>
      </div>
      <div style="margin-top:30px;">Assinatura de autorização:</div>
      <div style="margin-top:26px; border-top:1px solid #000; width:80%;"></div>
    `;
    window.print();
  }

  /* ================= WHATSAPP ================= */
  function enviarWhatsapp(g){
    if(!g) return;
    const link = `${APP_BASE_URL}/acompanhar-gravacao.html?id=${g.id}`;
    const primeiroNome = (g.cliente||'').trim().split(/\s+/)[0] || '';
    const saud = primeiroNome ? `Olá, ${primeiroNome}! ` : 'Olá! ';
    const emAberto = !(g.pagamento && g.pagamento.status==='pago');
    const textos = {
      pedido:    `${saud}Sua O.S. de gravação (via ${g.viaNumero}) foi gerada com sucesso e em breve será enviada para a fábrica. Previsão de entrega: ${fmtDataBr(g.dataEntrega)} às ${g.horaEntrega}.`,
      fabrica:   `${saud}Sua gravação (via ${g.viaNumero}) foi enviada para a fábrica e está em produção. Previsão de entrega: ${fmtDataBr(g.dataEntrega)} às ${g.horaEntrega}.`,
      upcase:    `${saud}Sua gravação (via ${g.viaNumero}) foi liberada pela fábrica e chegará em breve na loja Up Case.`,
      pronto:    `${saud}Sua gravação (via ${g.viaNumero}) está pronta! Já pode ser retirada na loja Up Case.${emAberto ? ` Valor a pagar na retirada: ${fmtMoeda(g.valorTotal)}.` : ''}`,
      entregue:  `${saud}Sua gravação (via ${g.viaNumero}) foi entregue e conferida. Obrigado pela preferência!`,
      cancelado: `${saud}Sua gravação (via ${g.viaNumero}) foi cancelada. Em caso de dúvida, fale com a loja.`,
    };
    const corpo = textos[g.status] || textos.pedido;
    const msg = g.status==='cancelado' ? corpo : `${corpo}\n\nAcompanhe o andamento pelo link:\n${link}`;
    const numero = somenteDigitos(g.whatsapp).replace(/^0+/, ''); // tira zero de operadora (032...)
    if(numero.length < 10){ showToast('WhatsApp do cliente parece incompleto: ' + (g.whatsapp||'—')); return; }
    const numeroCom55 = (numero.startsWith('55') && numero.length>=12) ? numero : ('55'+numero);
    window.open(`https://wa.me/${numeroCom55}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  /* ================= RELATÓRIO MENSAL ================= */
  function renderRelatorio(wrap){
    const agora = new Date();
    const mesPadrao = agora.getFullYear()+"-"+String(agora.getMonth()+1).padStart(2,"0");
    wrap.innerHTML = `
      <div class="filters">
        <input type="month" id="r_mes" value="${mesPadrao}">
        <span class="muted">Loja: Up Case (único vínculo deste módulo)</span>
      </div>
      <div id="corpoRelatorio"><div class="empty">Carregando…</div></div>
    `;
    function desenhar(){
      if(!document.getElementById('corpoRelatorio')) return; // aba trocada enquanto carregava
      const mes = document.getElementById('r_mes').value;
      const todasDoMes = registros.filter(g=> g.dataEntrada && g.dataEntrada.startsWith(mes));
      // canceladas ficam totalmente fora do relatório (mesmo que constem como pagas)
      const canceladas = todasDoMes.filter(g=> g.status==='cancelado');
      const ativas = todasDoMes.filter(g=> g.status!=='cancelado');
      // só entra no relatório o que já está PAGO; pagamentos em aberto ficam de fora
      const doMes = ativas.filter(g=> g.pagamento && g.pagamento.status==='pago');
      const emAberto = ativas.filter(g=> !(g.pagamento && g.pagamento.status==='pago'));
      const valorCanceladas = canceladas.reduce((a,g)=>a+(Number(g.valorTotal)||0),0);
      const contaItens = (lista)=> lista.reduce((a,g)=>a+(Number(g.quantidadeItens)||0),0);
      const prontos = ativas.filter(g=> g.status==='pronto');
      const entregues = ativas.filter(g=> g.status==='entregue');
      const itensCanceladas = contaItens(canceladas), itensEmAberto = contaItens(emAberto), itensProntos = contaItens(prontos), itensEntregues = contaItens(entregues);
      const valorEmAberto = emAberto.reduce((a,g)=>a+(Number(g.valorTotal)||0),0);
      const totalItens = doMes.reduce((a,g)=>a+(Number(g.quantidadeItens)||0),0);
      const totalValor = doMes.reduce((a,g)=>a+(Number(g.valorTotal)||0),0);
      const valorOficina = totalItens * 1;
      const restante = totalValor - valorOficina;
      const valorVilaca = restante / 2;
      const valorUpcase = restante / 2;
      document.getElementById('corpoRelatorio').innerHTML = `
        <div class="grid-3">
          <div class="card"><span class="muted">Quantidade de itens pagos no mês</span><div style="font-size:26px; font-weight:800;">${totalItens}</div></div>
          <div class="card"><span class="muted">Valor total pago no mês</span><div style="font-size:26px; font-weight:800;">${fmtMoeda(totalValor)}</div></div>
          <div class="card"><span class="muted">Gravações pagas no mês</span><div style="font-size:26px; font-weight:800;">${doMes.length}</div></div>
        </div>
        ${emAberto.length ? `<div class="muted" style="margin:-4px 0 8px;">⚠ ${emAberto.length} gravação(ões) do mês com pagamento em aberto (${fmtMoeda(valorEmAberto)}) não entram neste relatório até serem marcadas como pagas.</div>` : ''}
        ${canceladas.length ? `<div class="muted" style="margin:0 0 14px;">🚫 ${canceladas.length} gravação(ões) do mês cancelada(s) (${fmtMoeda(valorCanceladas)}) — fora do relatório.</div>` : ''}
        <div class="card">
          <div class="section-label">Repasse</div>
          <div class="grid-3">
            <div><span class="muted">Oficina</span><div style="font-size:19px; font-weight:800;">${fmtMoeda(valorOficina)}</div></div>
            <div><span class="muted">Vilaça Joias</span><div style="font-size:19px; font-weight:800;">${fmtMoeda(valorVilaca)}</div></div>
            <div><span class="muted">Up Case</span><div style="font-size:19px; font-weight:800;">${fmtMoeda(valorUpcase)}</div></div>
          </div>
        </div>
        <div class="card">
          <div class="section-label">Situação das gravações do mês</div>
          <div class="grid-3">
            <div><span class="muted">Cancelados</span><div style="font-size:19px; font-weight:800;">${canceladas.length} <span class="muted" style="font-size:12px;">(${itensCanceladas} itens · ${fmtMoeda(valorCanceladas)})</span></div></div>
            <div><span class="muted">Pagamento em aberto</span><div style="font-size:19px; font-weight:800;">${emAberto.length} <span class="muted" style="font-size:12px;">(${itensEmAberto} itens · ${fmtMoeda(valorEmAberto)})</span></div></div>
            <div><span class="muted">Pronto</span><div style="font-size:19px; font-weight:800;">${prontos.length} <span class="muted" style="font-size:12px;">(${itensProntos} itens)</span></div></div>
            <div><span class="muted">Entregues</span><div style="font-size:19px; font-weight:800;">${entregues.length} <span class="muted" style="font-size:12px;">(${itensEntregues} itens)</span></div></div>
          </div>
        </div>
      `;
    }
    document.getElementById('r_mes').addEventListener('input', desenhar);
    // recarrega do banco ao abrir o relatório (mesmo padrão da Lista)
    recarregarSePreciso().then(desenhar);
  }

  if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'gravacoes', tabs: [], active: null }, '*');
})();
</script>
