  /* ================= WHATSAPP ================= */
  async function enviarWhatsapp(g){
    if(!g) return;
    if(!(await MarketingOff.permitir({ telefone:g.whatsapp, nome:g.cliente }))) return;
    const link = `${APP_BASE_URL}/acompanhar-gravacao.html?id=${g.id}`;
    const primeiroNome = (g.cliente||'').trim().split(/\s+/)[0] || '';
    const saud = primeiroNome ? `Olá, ${primeiroNome}! ` : 'Olá! ';
    const emAberto = !(g.pagamento && g.pagamento.status==='pago');
    const textos = {
      pedido:    `${saud}Sua O.S. de gravação (via ${g.viaNumero}) foi gerada com sucesso e em breve será enviada para a fábrica. Previsão de entrega: ${fmtDataBr(g.dataEntrega)} às ${g.horaEntrega}.`,
      fabrica:   `${saud}Sua gravação (via ${g.viaNumero}) foi enviada para a fábrica e está em produção. Previsão de entrega: ${fmtDataBr(g.dataEntrega)} às ${g.horaEntrega}.`,
      upcase:    `${saud}Sua gravação (via ${g.viaNumero}) foi liberada pela fábrica e chegará em breve na loja Up Case.`,
      pronto:    `${saud}Sua gravação (via ${g.viaNumero}) está pronta! Já pode ser retirada na loja Up Case.${emAberto ? ` Valor a pagar na retirada: ${fmtMoeda(g.valorTotal)}.` : ''}`,
      entregue:  `${saud}Sua gravação (via ${g.viaNumero}) foi entregue e conferida. Obrigado pela preferência!`,
      cancelado: `${saud}Sua gravação (via ${g.viaNumero}) foi cancelada. Em caso de dúvida, fale com a loja.`,
    };
    const corpo = textos[g.status] || textos.pedido;
    const msg = g.status==='cancelado' ? corpo : `${corpo}\n\nAcompanhe o andamento pelo link:\n${link}`;
    const numero = somenteDigitos(g.whatsapp).replace(/^0+/, ''); // tira zero de operadora (032...)
    if(numero.length < 10){ showToast('WhatsApp do cliente parece incompleto: ' + (g.whatsapp||'—')); return; }
    const numeroCom55 = (numero.startsWith('55') && numero.length>=12) ? numero : ('55'+numero);
    window.open(`https://wa.me/${numeroCom55}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  /* ================= RELATÓRIO MENSAL ================= */
  function renderRelatorio(wrap){
    const agora = new Date();
    const mesPadrao = agora.getFullYear()+"-"+String(agora.getMonth()+1).padStart(2,"0");
    wrap.innerHTML = `
      <div class="filters">
        <label class="muted" for="r_mes">Mês</label>
        <input type="month" id="r_mes" value="${mesPadrao}">
        <span class="contador">${ic('loja',{tam:14})} Loja Up Case</span>
      </div>
      <div id="corpoRelatorio"><div class="empty">${ic('relogio',{tam:22})}Carregando relatório…</div></div>
    `;
    function desenhar(){
      if(!document.getElementById('corpoRelatorio')) return; // aba trocada enquanto carregava
      const mes = document.getElementById('r_mes').value;
      const todasDoMes = registros.filter(g=> g.dataEntrada && g.dataEntrada.startsWith(mes));
      // canceladas ficam totalmente fora do relatório (mesmo que constem como pagas)
      const canceladas = todasDoMes.filter(g=> g.status==='cancelado');
      const ativas = todasDoMes.filter(g=> g.status!=='cancelado');
      // só entra no relatório o que já está PAGO; pagamentos em aberto ficam de fora
      const doMes = ativas.filter(g=> g.pagamento && g.pagamento.status==='pago');
      const emAberto = ativas.filter(g=> !(g.pagamento && g.pagamento.status==='pago'));
      const valorCanceladas = canceladas.reduce((a,g)=>a+(Number(g.valorTotal)||0),0);
      const contaItens = (lista)=> lista.reduce((a,g)=>a+(Number(g.quantidadeItens)||0),0);
      const prontos = ativas.filter(g=> g.status==='pronto');
      const entregues = ativas.filter(g=> g.status==='entregue');
      const itensCanceladas = contaItens(canceladas), itensEmAberto = contaItens(emAberto), itensProntos = contaItens(prontos), itensEntregues = contaItens(entregues);
      const valorEmAberto = emAberto.reduce((a,g)=>a+(Number(g.valorTotal)||0),0);
      const totalItens = doMes.reduce((a,g)=>a+(Number(g.quantidadeItens)||0),0);
      const totalValor = doMes.reduce((a,g)=>a+(Number(g.valorTotal)||0),0);
      const valorOficina = totalItens * 1;
      const restante = totalValor - valorOficina;
      const valorVilaca = restante / 2;
      const valorUpcase = restante / 2;
      if(erroCarga && registros.length===0){
        document.getElementById('corpoRelatorio').innerHTML = `<div class="card empty erro">${ic('alerta',{tam:22})}<b>Não foi possível carregar as gravações.</b>Confira a internet e abra a aba Relatório mensal de novo.</div>`;
        return;
      }
      const qtd = (n, um, varios)=> n + ' ' + (n===1 ? um : varios);
      document.getElementById('corpoRelatorio').innerHTML = `
        <div class="grid-3" style="margin-bottom:16px;">
          <div class="card kpi-card destaque" style="margin:0;"><div class="rot">Valor pago no mês</div><div class="num-grande valor">${fmtMoeda(totalValor)}</div></div>
          <div class="card kpi-card" style="margin:0;"><div class="rot">Gravações pagas</div><div class="num-grande num">${doMes.length}</div></div>
          <div class="card kpi-card" style="margin:0;"><div class="rot">Itens pagos</div><div class="num-grande num">${totalItens}</div></div>
        </div>
        ${emAberto.length ? `<div class="aviso-linha wait">${ic('alerta')}<span>${qtd(emAberto.length,'gravação','gravações')} do mês com pagamento em aberto (${fmtMoeda(valorEmAberto)}) só ${emAberto.length===1?'entra':'entram'} no relatório quando ${emAberto.length===1?'for marcada':'forem marcadas'} como paga${emAberto.length===1?'':'s'}.</span></div>` : ''}
        ${canceladas.length ? `<div class="aviso-linha danger">${ic('cancelar')}<span>${qtd(canceladas.length,'gravação cancelada','gravações canceladas')} no mês (${fmtMoeda(valorCanceladas)}) ${canceladas.length===1?'fica':'ficam'} fora do relatório.</span></div>` : ''}
        <div class="card repasse" style="margin-top:${(emAberto.length||canceladas.length)?'8px':'0'};">
          <h2 class="section-label">Repasse <span class="dica" style="display:block;">R$ 1,00 por item para a Oficina; o restante é dividido igualmente entre Vilaça Joias e Up Case.</span></h2>
          <div class="grid-3">
            <div><span class="muted">Oficina</span><div class="num-medio valor">${fmtMoeda(valorOficina)}</div></div>
            <div><span class="muted">Vilaça Joias</span><div class="num-medio valor">${fmtMoeda(valorVilaca)}</div></div>
            <div><span class="muted">Up Case</span><div class="num-medio valor">${fmtMoeda(valorUpcase)}</div></div>
          </div>
        </div>
        <div class="card situacao">
          <h2 class="section-label">Situação das gravações do mês</h2>
          <div class="grid-3">
            <div><span class="muted">Canceladas</span><div class="num-medio num">${canceladas.length}</div><div class="dica">${qtd(itensCanceladas,'item','itens')} · ${fmtMoeda(valorCanceladas)}</div></div>
            <div><span class="muted">Pagamento em aberto</span><div class="num-medio num">${emAberto.length}</div><div class="dica">${qtd(itensEmAberto,'item','itens')} · ${fmtMoeda(valorEmAberto)}</div></div>
            <div><span class="muted">Prontas</span><div class="num-medio num">${prontos.length}</div><div class="dica">${qtd(itensProntos,'item','itens')}</div></div>
            <div><span class="muted">Entregues</span><div class="num-medio num">${entregues.length}</div><div class="dica">${qtd(itensEntregues,'item','itens')}</div></div>
          </div>
        </div>
      `;
    }
    document.getElementById('r_mes').addEventListener('input', desenhar);
    // recarrega do banco ao abrir o relatório (mesmo padrão da Lista)
    recarregarSePreciso().then(desenhar);
  }

  if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'gravacoes', tabs: [], active: null }, '*');
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
<script src="modal-x.js"></script>
</body>
