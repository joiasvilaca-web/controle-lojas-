<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conciliação de Cartão · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* ===== Linguagem visual das telas financeiras do CAIXA (igual em caixa.html, gastos.html e conciliacao.html) ===== */
:root{ --radius:12px; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--t-font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px;}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 2px;line-height:1.25;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;max-width:640px;}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.muted{color:var(--ink-faint);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* botões (cores vêm do tema.css) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;font-size:13.5px;line-height:1.3;white-space:nowrap;}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.btn .ico{width:15px;height:15px;}

/* barra de filtros: período, loja e ações numa faixa só */
.barra{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;box-shadow:var(--t-shadow-sm);}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0;}
.campo > label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.campo input,.campo select{height:36px;padding:0 10px;font-size:13.5px;min-width:0;}
.campo.busca{flex:1 1 220px;}
.barra .acoes{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.barra .btn{height:36px;}
.barra-linha{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-top:10px;border-top:1px solid var(--line);}
.barra-linha .rot{font-size:12px;font-weight:600;color:var(--ink-soft);margin-right:4px;}

/* chips de liga/desliga (checkbox dentro) */
.chip-check{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);cursor:pointer;user-select:none;}
.chip-check input{margin:0;width:15px;height:15px;}
.chip-check:has(input:checked){background:var(--accent-soft);border-color:var(--t-primary-line);color:var(--accent);}

/* cartões e seções */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--t-shadow-sm);margin-bottom:16px;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);}
.card-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.card-head h2 .ico{color:var(--accent);}
.card-body{padding:14px 16px;}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}

/* valores: entrada em verde com "+", saída em vermelho com "−", zero apagado */
.val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.val.entra{color:var(--ok);}
.val.sai{color:var(--danger);}
.val.zero{color:var(--ink-faint);font-weight:500;}
.val.forte{font-weight:700;}
.r{text-align:right;}

/* tabelas (no celular viram cartões: .tabela.cartoes + data-label em cada td) */
.tabela-wrap{overflow-x:auto;}
table.tabela{width:100%;border-collapse:collapse;font-size:13px;}
.tabela th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
.tabela td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tabela tbody tr:last-child td{border-bottom:none;}
.tabela :is(th,td).r{text-align:right;}
.tabela tfoot td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:none;background:var(--surface-2);}
.tabela .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px;}
.tabela tr.apagada td{color:var(--ink-faint);}
.acoes-linha{display:flex;gap:2px;justify-content:flex-end;}

/* selos de status */
.selo{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px;}
.selo .ico{width:13px;height:13px;}
.selo-ok{background:var(--ok-soft);color:var(--ok);}
.selo-wait{background:var(--wait-soft);color:var(--wait);}
.selo-danger{background:var(--danger-soft);color:var(--danger);}
.selo-info{background:var(--t-info-soft);color:var(--info);}
.selo-neutro{background:var(--surface-2);color:var(--ink-soft);}
.selo .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* estados: vazio, carregando, erro */
.estado{padding:36px 20px;text-align:center;color:var(--ink-faint);}
.estado-ico{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);margin-bottom:10px;}
.estado-ico .ico{width:22px;height:22px;}
.estado .t{display:block;font-size:16px;color:var(--ink);font-weight:700;margin-bottom:4px;}
.estado p{margin:0 auto;max-width:460px;font-size:13.5px;line-height:1.5;}
.estado-erro .estado-ico{background:var(--danger-soft);color:var(--danger);}
.estado-mini{padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* alertas de contas (vencidas / vencendo) */
.alerta{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--t-shadow-sm);}
.alerta-head{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;font-weight:700;}
.alerta-head .ico{width:18px;height:18px;}
.alerta-head .total{margin-left:auto;}
.alerta-danger .alerta-head{background:var(--danger-soft);color:var(--danger);}
.alerta-wait .alerta-head{background:var(--wait-soft);color:var(--wait);}
.alerta-item{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:13.5px;}
.alerta-item .nome{flex:1 1 200px;min-width:0;}
.alerta-item .nome b{font-weight:600;}
.alerta-mais{padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);}

/* campos de formulário (popups) */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0;}
.field > label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field input,.field select,.field textarea{padding:8px 11px;font-size:14px;width:100%;}
html[data-ds] .field input[readonly]{background:var(--surface-2);color:var(--ink-soft);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

/* popups */
.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:200;padding:16px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
:is(.modal,.modal-box){width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:22px 24px;}
:is(.modal,.modal-box) h3{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.01em;padding-right:24px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

@media (prefers-reduced-motion:no-preference){ .esq{animation:pulsar 1.2s ease-in-out infinite;} @keyframes pulsar{50%{opacity:.5;}} }

/* celular */
@media (max-width:760px){
  .wrap{padding:14px 12px 48px;}
  .page-head{align-items:stretch;}
  .page-actions{width:100%;}
  .page-actions > .btn-accent{flex:1 1 auto;}
  .barra{padding:12px;}
  .barra .campo{flex:1 1 calc(50% - 6px);}
  .barra .campo.busca{flex-basis:100%;}
  .barra .acoes{margin-left:0;width:100%;}
  .barra .acoes .btn{flex:1 1 auto;}
  .barra .btn{height:44px;}
  .campo input,.campo select{height:44px;}
  .grid-2{grid-template-columns:minmax(0,1fr);}
  .tabela.cartoes thead{display:none;}
  .tabela.cartoes, .tabela.cartoes :is(tbody,tfoot,tr,td){display:block;width:100%;}
  .tabela.cartoes tr{padding:10px 14px;border-bottom:1px solid var(--line);}
  .tabela.cartoes tbody tr:last-child{border-bottom:none;}
  .tabela.cartoes td{border:none;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;background:transparent;}
  .tabela.cartoes td::before{content:attr(data-label);font-size:12.5px;color:var(--ink-faint);font-weight:500;text-align:left;flex-shrink:0;}
  .tabela.cartoes td.principal{display:block;text-align:left;font-size:14px;padding-bottom:4px;}
  .tabela.cartoes td.principal::before{display:none;}
  .tabela.cartoes td:is(:empty,.vazio-cel){display:none;}
  .tabela.cartoes tfoot tr{background:var(--surface-2);border-top:1px solid var(--line-strong);}
  .tabela.cartoes .acoes-linha{justify-content:flex-start;}
  .tabela.cartoes td.acoes-td{justify-content:flex-end;padding-top:6px;}
  .tabela.cartoes td.acoes-td::before{display:none;}
}

/* ===== Conciliação de cartão ===== */
.passo-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.passo-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;}
.passo-n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;flex-shrink:0;}
.passo-corpo{padding:14px 16px;}
.passo-corpo > p.muted{margin:0 0 12px;font-size:13px;}
.passos-topo{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:0 16px;align-items:start;}
.linha-campos{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px;}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:12.5px;margin:8px 6px 0 0;}
.file-chip .btn-icone{width:24px;height:24px;}
.mapa-arq{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.mapa-arq:last-of-type{border-bottom:none;margin-bottom:6px;padding-bottom:0;}
.mapa-arq > b{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px;}
.barra-acao{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding:12px 16px;}
#cTransacoesResumo{font-size:13px;}
/* resultado */
.result-topo{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding:16px 18px 12px;}
.result-topo .rot{font-size:13px;font-weight:600;color:var(--ink-soft);}
.result-topo .grande{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;}
.result-topo .ctx{font-size:12.5px;color:var(--ink-faint);}
.barra-prop{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:0 18px;gap:2px;}
.barra-prop span{display:block;height:100%;min-width:0;}
.barra-prop .p-ok{background:var(--ok);} .barra-prop .p-wait{background:var(--wait);} .barra-prop .p-danger{background:var(--danger);}
.legenda-prop{display:flex;flex-wrap:wrap;gap:8px 28px;padding:12px 18px 16px;}
.legenda-prop .it{display:flex;flex-direction:column;gap:1px;}
.legenda-prop .rot{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.legenda-prop .rot i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.legenda-prop .num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
.legenda-prop .ok{color:var(--ok);} .legenda-prop .wait{color:var(--wait);} .legenda-prop .danger{color:var(--danger);}
.badge-loja{background:var(--surface-2);color:var(--ink-soft);}
/* taxas */
.tabela-taxas input{width:110px;height:36px;padding:0 10px;text-align:right;font-variant-numeric:tabular-nums;}
.tabela-taxas .sufixo{display:inline-block;width:30px;margin-left:6px;text-align:left;color:var(--ink-faint);font-size:12.5px;}
.rodape-form{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);padding:11px 18px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:250;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* login e barra própria (só fora do app) */
#view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--t-dark);}
.login-card{background:var(--surface);border-radius:16px;padding:28px 24px;max-width:380px;width:100%;box-shadow:var(--t-shadow-lg);}
.login-tag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin:14px 0 6px;}
.login-title{font-size:20px;font-weight:700;margin:0 0 4px;}
.login-sub{color:var(--ink-faint);font-size:13px;margin:0 0 18px;}
.login-error{display:none;background:var(--danger-soft);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint);font-size:12.5px;margin-top:12px;line-height:1.5;}
.btn-block{width:100%;}
.hub-back-link{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;background:var(--t-dark);color:#fff;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.brand-name{font-weight:700;font-size:15px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);border:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;}
.tabs button.active{background:var(--t-primary-strong);color:#fff;}
.who{display:flex;align-items:center;gap:10px;font-size:13px;}
.level-pill{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.icon-btn{background:none;border:none;color:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:5px 9px;border-radius:7px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.icon-btn:hover{background:rgba(255,255,255,.1);}
.mobile-tabbar{display:none;}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}

@media (max-width:760px){
  .grid-3{grid-template-columns:minmax(0,1fr);}
  .passos-topo{grid-template-columns:minmax(0,1fr);}
  .linha-campos .campo{flex:1 1 calc(50% - 6px);}
  .barra-acao .btn-accent{flex:1 1 100%;}
  .result-topo .grande{font-size:22px;}
  .legenda-prop .it{flex:1 1 40%;}
  .tabela-taxas input{width:100%;height:44px;}
  .tabela.cartoes.tabela-taxas td{gap:8px;}
  .tabela.cartoes.tabela-taxas td .entrada{display:flex;align-items:center;max-width:170px;}
  .rodape-form .btn{flex:1;}
  .mobile-tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--t-dark);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;}
  .mobile-tabbar button{flex:1;background:none;border:none;color:rgba(255,255,255,.65);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;}
  .mobile-tabbar button.active{color:#fff;}
  .tabs{display:none;}
}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag">CONCILIAÇÃO DE CARTÃO</div>
    <div class="login-title">Entrar na conciliação</div>
    <p class="login-sub">Informe sua senha para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira e tente de novo, ou fale com a diretoria.</div>
    <div class="field"><label for="loginPass">Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-accent btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint" id="loginHint">Use a mesma senha do restante do sistema.</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle" aria-label="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">R$</div>
      <div class="brand-name">Conciliação de Cartão</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <a class="icon-btn" id="linkConfigHub" href="index.html" title="Configurações (Gestão e Controle)" style="display:none;">Configurações</a>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair">Sair</button>
    </div>
  </header>
  <div id="lojaFaixa" style="display:none;"></div>
  <main id="mainContent" class="wrap"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

/* ============================================================
   ESTADO / STORAGE — mesma config unificada do resto do ecossistema;
   as vendas ficam na tabela "vendas_pdv" (mesma do módulo Vendas).
   Tudo passa pela Edge Function "db-gateway", autenticada por senha.
   ============================================================ */
let config = null;
let vendas = [];
let currentUser = null;
let currentTab = 'conciliar';
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);

/* ============================================================
   CÁLCULO — quanto se espera receber, e quando, por venda
   ============================================================ */
function taxaDe(formaPagamentoId){
  return (config.conciliacao.taxas||[]).find(t=>t.formaPagamentoId===formaPagamentoId) || { taxaPercentual:0, prazoDias:0 };
}
function nomeForma(formaPagamentoId){
  const f = (config.formasPagamento||[]).find(p=>p.id===formaPagamentoId);
  return f ? f.nome : '—';
}
/** Data prevista de recebimento = data da venda + prazo em dias (da forma de pagamento com maior prazo entre os pagamentos). */
function dataPrevistaDe(venda){
  const prazos = (venda.pagamentos||[]).map(p=> taxaDe(p.formaId).prazoDias || 0);
  const prazoMax = prazos.length ? Math.max(...prazos) : 0;
  const d = new Date(venda.data + 'T00:00:00');
  d.setDate(d.getDate() + prazoMax);
  return d.toISOString().slice(0,10);
}
/** Valor líquido esperado = soma de cada pagamento menos a taxa da sua forma de pagamento. */
function valorLiquidoEsperado(venda){
  return (venda.pagamentos||[]).reduce((acc,p)=>{
    const taxa = taxaDe(p.formaId).taxaPercentual || 0;
    const valor = Number(p.valor)||0;
    return acc + valor * (1 - taxa/100);
  }, 0);
}
/** Só faz sentido conciliar vendas com pelo menos uma forma de pagamento com taxa/prazo configurado (cartão). */
function vendaEhConciliavel(venda){
  return (venda.pagamentos||[]).some(p=> (taxaDe(p.formaId).taxaPercentual||0) > 0 || (taxaDe(p.formaId).prazoDias||0) > 0);
}
function statusConciliacaoDe(venda){
  if(venda.conciliacao && venda.conciliacao.status) return venda.conciliacao.status;
  const prevista = dataPrevistaDe(venda);
  return prevista < todayStr() ? 'falha' : 'pendente';
}

/* ============================================================
   IMPORTAÇÃO DE ARQUIVOS (extrato bancário / relatório da maquininha)
   Aceita CSV simples; a pessoa mapeia manualmente qual coluna é
   qual (funciona com qualquer banco/adquirente, sem parser específico
   pra um banco só).
   ============================================================ */
let arquivosImportados = []; // [{ nome, cabecalho:[...], linhas:[[...]] }]
let transacoesImportadas = []; // [{ data, valor, descricao, origem }]

function parseCsvTexto(texto){
  const sep = (texto.split(';').length > texto.split(',').length) ? ';' : ',';
  const linhas = texto.split(/\r?\n/).filter(l=>l.trim()!=='');
  return linhas.map(l=> l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
}
function parseValorBr(v){
  if(v==null) return NaN;
  let s = String(v).trim().replace(/[^\d,.\-]/g,'');
  if(s.includes(',') && s.includes('.')){ s = s.replace(/\./g,'').replace(',','.'); }
  else if(s.includes(',')){ s = s.replace(',','.'); }
  return parseFloat(s);
}
function parseDataFlexivel(v){
  if(!v) return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

/** Tenta adivinhar qual coluna é qual, olhando palavras-chave no cabeçalho. Retorna o índice ou -1. */
function adivinharColuna(cabecalho, palavrasChave){
  for(let i=0;i<cabecalho.length;i++){
    const h = (cabecalho[i]||'').toLowerCase();
    if(palavrasChave.some(p=> h.includes(p))) return i;
  }
  return -1;
}

function processarArquivosMapeados(){
  transacoesImportadas = [];
  arquivosImportados.forEach((a, i)=>{
    const colData = Number(document.querySelector(`[data-map="data"][data-arq="${i}"]`).value);
    const colValor = Number(document.querySelector(`[data-map="valor"][data-arq="${i}"]`).value);
    const colDescSel = document.querySelector(`[data-map="descricao"][data-arq="${i}"]`).value;
    const colDesc = colDescSel === '' ? null : Number(colDescSel);
    a.linhas.forEach(linha=>{
      const data = parseDataFlexivel(linha[colData]);
      const valor = parseValorBr(linha[colValor]);
      if(!data || isNaN(valor)) return;
      transacoesImportadas.push({
        data, valor: Math.abs(valor),
        descricao: colDesc!==null ? (linha[colDesc]||'') : '',
        origem: a.nome,
      });
    });
  });
  document.getElementById('cTransacoesResumo').textContent = `${transacoesImportadas.length} transações lidas dos arquivos, prontas para conciliar.`;
  showToast(`${transacoesImportadas.length} transações lidas.`);
}

function rodarConciliacao(){
  const ini = document.getElementById('cReferenciaIni').value;
  const fim = document.getElementById('cReferenciaFim').value;
  const tolerancia = config.conciliacao.toleranciaDias || 3;

  const vendasNoPeriodo = vendas.filter(v=> v.data >= ini && v.data <= fim && vendaEhConciliavel(v));
  const usadas = new Set();

  vendasNoPeriodo.forEach(venda=>{
    if(venda.conciliacao && venda.conciliacao.status === 'recebido') return; // já conciliada antes
    const esperado = valorLiquidoEsperado(venda);
    const prevista = dataPrevistaDe(venda);
    const dIni = new Date(prevista); dIni.setDate(dIni.getDate()-tolerancia);
    const dFim = new Date(prevista); dFim.setDate(dFim.getDate()+tolerancia);

    let melhor = null;
    transacoesImportadas.forEach((t, ti)=>{
      if(usadas.has(ti)) return;
      const dt = new Date(t.data);
      if(dt < dIni || dt > dFim) return;
      if(Math.abs(t.valor - esperado) > Math.max(0.02, esperado*0.01)) return;
      if(!melhor || Math.abs(t.valor-esperado) < Math.abs(melhor.t.valor-esperado)) melhor = { t, ti };
    });

    if(melhor){
      usadas.add(melhor.ti);
      venda.conciliacao = { status:'recebido', dataRecebimento: melhor.t.data, valorRecebido: melhor.t.valor, origem: melhor.t.origem };
    }else{
      venda.conciliacao = { status: prevista < todayStr() ? 'falha' : 'pendente' };
    }
  });

  renderResultado(vendasNoPeriodo);
  if(vendasNoPeriodo.length===0){
    const w = document.getElementById('cResultado');
    if(w) w.innerHTML = `<div class="card">${estadoHtml('cartao', 'Nenhuma venda no cartão nesse período', 'Só entram vendas pagas com uma forma que tenha taxa ou prazo em <b>Taxas e prazos</b>. Confira o período e as taxas.')}</div>`;
  }
  Promise.all(vendasNoPeriodo.map(v=> vendaAtualizar(v))).then(()=>{
    showToast('Conciliação concluída e salva.');
  });
}

function renderResultado(lista){
  const wrap = document.getElementById('cResultado');
  if(!wrap) return;
  if(lista.length===0){ wrap.innerHTML = ''; return; }

  const totalBruto = lista.reduce((acc,v)=> acc + (v.pagamentos||[]).reduce((a,p)=>a+(Number(p.valor)||0),0), 0);
  const recebidas = lista.filter(v=> (v.conciliacao||{}).status==='recebido');
  const pendentes = lista.filter(v=> (v.conciliacao||{}).status==='pendente' || !v.conciliacao);
  const falhas = lista.filter(v=> (v.conciliacao||{}).status==='falha');
  const totalRecebido = recebidas.reduce((acc,v)=> acc + (v.conciliacao.valorRecebido||0), 0);
  const totalAReceber = pendentes.reduce((acc,v)=> acc + valorLiquidoEsperado(v), 0);
  const totalFalha = falhas.reduce((acc,v)=> acc + valorLiquidoEsperado(v), 0);

  const totalLiq = totalRecebido + totalAReceber + totalFalha;
  const pct = v=> totalLiq>0 ? (v/totalLiq*100) : 0;
  const ini = document.getElementById('cReferenciaIni'), fim = document.getElementById('cReferenciaFim');
  wrap.innerHTML = `
    <section class="card" aria-label="Resultado da conciliação">
      <div class="result-topo">
        <div>
          <div class="rot">Vendido no cartão (bruto)</div>
          <div class="grande">${fmtMoeda(totalBruto)}</div>
          <div class="ctx">${lista.length} venda${lista.length===1?'':'s'}${ini&&fim?` · ${fmtDate(ini.value)} a ${fmtDate(fim.value)}`:''}</div>
        </div>
      </div>
      <div class="barra-prop" role="img" aria-label="Recebido ${fmtMoeda(totalRecebido)}, a receber ${fmtMoeda(totalAReceber)}, atrasado ${fmtMoeda(totalFalha)}">
        ${totalRecebido>0?`<span class="p-ok" style="width:${pct(totalRecebido)}%"></span>`:''}
        ${totalAReceber>0?`<span class="p-wait" style="width:${pct(totalAReceber)}%"></span>`:''}
        ${totalFalha>0?`<span class="p-danger" style="width:${pct(totalFalha)}%"></span>`:''}
      </div>
      <div class="legenda-prop">
        <div class="it"><span class="rot"><i style="background:var(--ok)"></i>Recebido (líquido) · ${recebidas.length}</span><span class="num ok">${fmtMoeda(totalRecebido)}</span></div>
        <div class="it"><span class="rot"><i style="background:var(--wait)"></i>A receber · ${pendentes.length}</span><span class="num wait">${fmtMoeda(totalAReceber)}</span></div>
        <div class="it"><span class="rot"><i style="background:var(--danger)"></i>Não caiu / atrasado · ${falhas.length}</span><span class="num${totalFalha>0?' danger':''}">${fmtMoeda(totalFalha)}</span></div>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><h2>${ic('lista')} Vendas conferidas</h2><span class="cnt">${lista.length}</span></div>
      <div class="tabela-wrap">
      <table class="tabela cartoes">
        <thead><tr><th>Data da venda</th><th>Loja</th><th class="r">Bruto</th><th class="r">Líquido esperado</th><th>Previsão</th><th>Status</th><th>Recebido em</th></tr></thead>
        <tbody>
          ${lista.map(v=>{
            const bruto = (v.pagamentos||[]).reduce((a,p)=>a+(Number(p.valor)||0),0);
            const status = statusConciliacaoDe(v);
            const badge = status==='recebido' ? `<span class="selo selo-ok">${ic('check')} Recebido</span>`
              : status==='falha' ? `<span class="selo selo-danger">${ic('alerta')} Não caiu / atrasado</span>`
              : `<span class="selo selo-wait">${ic('relogio')} A receber</span>`;
            return `<tr>
              <td class="principal" data-label="Data da venda">${fmtDate(v.data)}</td>
              <td data-label="Loja"><span class="selo selo-neutro">${escapeHtml(v.loja||'—')}</span></td>
              <td class="r" data-label="Bruto"><span class="val">${fmtMoeda(bruto)}</span></td>
              <td class="r" data-label="Líquido esperado"><span class="val">${fmtMoeda(valorLiquidoEsperado(v))}</span></td>
              <td data-label="Previsão">${fmtDate(dataPrevistaDe(v))}</td>
              <td data-label="Status">${badge}</td>
              <td data-label="Recebido em">${v.conciliacao && v.conciliacao.dataRecebimento ? fmtDate(v.conciliacao.dataRecebimento) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </section>
  `;
}

/* ============================================================
   ABA: TAXAS E PRAZOS
   ============================================================ */
function renderTaxas(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Taxas e prazos</h1>
        <p class="page-sub">Quanto a maquininha desconta e em quantos dias o dinheiro cai, por forma de pagamento. A conciliação usa isso para calcular o valor líquido e a data prevista de cada venda.</p>
      </div>
    </div>
    <section class="card">
      <div class="passo-corpo" style="border-bottom:1px solid var(--line);">
        <div class="campo" style="max-width:260px;"><label for="tTolerancia">Tolerância de dias na conciliação</label><input type="number" min="0" id="tTolerancia" value="${config.conciliacao.toleranciaDias||3}"></div>
        <p class="muted" style="margin:6px 0 0;font-size:12.5px;">Aceita o crédito até esse número de dias antes ou depois da data prevista.</p>
      </div>
      <div id="tTaxasRows"></div>
      <div class="rodape-form"><button class="btn btn-accent" id="btnSalvarTaxas">Salvar taxas e prazos</button></div>
    </section>
  `;
  function renderRows(){
    const wrap = document.getElementById('tTaxasRows');
    const formas = config.formasPagamento || [];
    if(formas.length===0){ wrap.innerHTML = estadoHtml('cartao', 'Nenhuma forma de pagamento cadastrada', 'Cadastre as formas de pagamento em CONFIGURAÇÕES › Cadastro e volte aqui para informar as taxas.'); return; }
    wrap.innerHTML = `
      <div class="tabela-wrap">
      <table class="tabela cartoes tabela-taxas">
        <thead><tr><th>Forma de pagamento</th><th class="r">Taxa</th><th class="r">Prazo para cair</th></tr></thead>
        <tbody>
      ${formas.map(f=>{
        const t = taxaDe(f.id);
        return `
        <tr data-forma="${f.id}">
          <td class="principal" data-label="Forma de pagamento">${escapeHtml(f.nome)}</td>
          <td class="r" data-label="Taxa"><span class="entrada"><input type="number" step="0.01" min="0" data-campo="taxaPercentual" value="${t.taxaPercentual||0}" aria-label="Taxa de ${escapeHtml(f.nome)} em %"><span class="sufixo">%</span></span></td>
          <td class="r" data-label="Prazo para cair"><span class="entrada"><input type="number" min="0" data-campo="prazoDias" value="${t.prazoDias||0}" aria-label="Prazo de ${escapeHtml(f.nome)} em dias"><span class="sufixo">dias</span></span></td>
        </tr>`;
      }).join('')}
        </tbody>
      </table>
      </div>
    `;
  }
  renderRows();
  document.getElementById('btnSalvarTaxas').addEventListener('click', async ()=>{
    config.conciliacao.toleranciaDias = Math.max(0, parseInt(document.getElementById('tTolerancia').value)||0);
    const novasTaxas = [];
    document.querySelectorAll('[data-forma]').forEach(row=>{
      const formaPagamentoId = row.dataset.forma;
      const taxaPercentual = parseFloat(row.querySelector('[data-campo="taxaPercentual"]').value)||0;
      const prazoDias = parseInt(row.querySelector('[data-campo="prazoDias"]').value)||0;
      novasTaxas.push({ formaPagamentoId, taxaPercentual, prazoDias });
    });
    config.conciliacao.taxas = novasTaxas;
    const ok = await configSaveUnificada();
    if(ok) showToast('Taxas e prazos salvos.');
  });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'conciliacao' }, '*');
    return;
  }
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
