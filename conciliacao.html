<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conciliação de Cartão · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
  --delivered:#4A1830; --delivered-soft:#F0DDE6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}

#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
.icon-btn:hover{background:rgba(255,255,255,0.1);}
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}

#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}

.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); box-shadow:0 2px 10px -4px rgba(43,15,31,0.08);}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], input[type=file], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media (max-width:640px){ .grid-3,.grid-4{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-wait{background:var(--wait-soft); color:var(--wait);}
.badge-falha{background:var(--danger-soft); color:var(--danger);}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
@media (max-width:760px){ .kpis{grid-template-columns:1fr 1fr;} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px;}
.kpi .num{font-size:22px; font-weight:800; font-family:'Cormorant Garamond',serif;}
.kpi .lbl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-top:2px;}
.kpi.ok .num{color:var(--ok);}
.kpi.wait .num{color:var(--wait);}
.kpi.danger .num{color:var(--danger);}
.file-chip{display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:12.5px; margin:4px 6px 0 0;}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Conciliação de Cartão</div>
    <div class="login-title">Acessar conciliação</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira com a diretoria.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint" id="loginHint">Use a mesma senha do restante do sistema.</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">R$</div>
      <div class="brand-name">Conciliação de Cartão</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <a class="icon-btn" id="linkConfigHub" href="index.html" title="Configurações (Gestão e Controle)" style="display:none;">⚙️</a>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair">🚪</button>
    </div>
  </header>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

/* ============================================================
   ESTADO / STORAGE — mesma config unificada do resto do ecossistema;
   as vendas ficam na tabela "vendas_pdv" (mesma do módulo Vendas).
   Tudo passa pela Edge Function "db-gateway", autenticada por senha.
   ============================================================ */
let config = null;
let vendas = [];
let currentUser = null;
let currentTab = 'conciliar';
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){
  return gatewayCall({ op:'login', senha: senhaTentativa });
}
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML='';
  if(history.state && history.state.modalAberto) history.back();
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  history.pushState({ modalAberto:true }, '');
}
window.addEventListener('popstate', ()=>{
  const overlay = document.getElementById('modalOverlay');
  if(overlay && overlay.classList.contains('show')) history.pushState({ modalAberto:true }, '');
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const overlay = document.getElementById('modalOverlay');
    if(overlay && overlay.classList.contains('show')){ e.preventDefault(); e.stopPropagation(); }
  }
});

async function configGetUnificada(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar config', e); return null; }
}
async function configSaveUnificada(){
  try{
    const { error } = await supabaseClient.from('gestao_config').upsert({ id:'config', payload: config });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar config', e); showToast('Não foi possível salvar. Tente novamente.'); return false; }
}
async function vendasGet(){
  try{
    const { data, error } = await supabaseClient.from('vendas_pdv').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar vendas', e); return []; }
}
async function vendaAtualizar(venda){
  try{
    const { error } = await supabaseClient.from('vendas_pdv').upsert({ id: venda.id, payload: venda });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao atualizar venda', e); return false; }
}

async function loadAll(){
  config = await configGetUnificada();
  if(!config){ config = { lojas:[], formasPagamento:[] }; }
  if(!config.conciliacao){
    config.conciliacao = {
      taxas: (config.formasPagamento||[]).map(pt=>({ formaPagamentoId: pt.id, taxaPercentual: 0, prazoDias: 0 })),
      toleranciaDias: 3,
    };
  }
  vendas = await vendasGet();
}

/* ============================================================
   MODO EMBUTIDO — mesma lógica dos demais módulos.
   ============================================================ */
const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      window.__permissoesAbasOverride = ev.data.abas || null;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    }
  });
}

/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null;
  __gatewaySenha = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  document.getElementById('linkConfigHub').style.display = currentUser.nivel==='diretoria' ? '' : 'none';
  buildTabs();
  currentTab = 'conciliar';
  if(EMBEDDED){
    const permitido = tabsForLevel();
    if(!permitido.some(t=>t.id===currentTab)) currentTab = permitido[0] ? permitido[0].id : 'conciliar';
    parent.postMessage({ type:'tabs', modulo:'conciliacao', tabs: permitido, active: currentTab }, '*');
  }
  renderTabs();
  renderView();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function tabsForLevel(){
  const t = [
    { id:'conciliar', label:'Conciliar', icon:'🔄' },
    { id:'taxas', label:'Taxas e Prazos', icon:'⚙️' },
  ];
  if(window.__permissoesAbasOverride){
    return t.filter(tab => window.__permissoesAbasOverride[tab.id] !== false);
  }
  return t;
}
function buildTabs(){
  const tabs = tabsForLevel();
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'conciliacao', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='conciliar') renderConciliar(main);
  else if(currentTab==='taxas') renderTaxas(main);
}

/* ============================================================
   CÁLCULO — quanto se espera receber, e quando, por venda
   ============================================================ */
function taxaDe(formaPagamentoId){
  return (config.conciliacao.taxas||[]).find(t=>t.formaPagamentoId===formaPagamentoId) || { taxaPercentual:0, prazoDias:0 };
}
function nomeForma(formaPagamentoId){
  const f = (config.formasPagamento||[]).find(p=>p.id===formaPagamentoId);
  return f ? f.nome : '—';
}
/** Data prevista de recebimento = data da venda + prazo em dias (da forma de pagamento com maior prazo entre os pagamentos). */
function dataPrevistaDe(venda){
  const prazos = (venda.pagamentos||[]).map(p=> taxaDe(p.formaId).prazoDias || 0);
  const prazoMax = prazos.length ? Math.max(...prazos) : 0;
  const d = new Date(venda.data + 'T00:00:00');
  d.setDate(d.getDate() + prazoMax);
  return d.toISOString().slice(0,10);
}
/** Valor líquido esperado = soma de cada pagamento menos a taxa da sua forma de pagamento. */
function valorLiquidoEsperado(venda){
  return (venda.pagamentos||[]).reduce((acc,p)=>{
    const taxa = taxaDe(p.formaId).taxaPercentual || 0;
    const valor = Number(p.valor)||0;
    return acc + valor * (1 - taxa/100);
  }, 0);
}
/** Só faz sentido conciliar vendas com pelo menos uma forma de pagamento com taxa/prazo configurado (cartão). */
function vendaEhConciliavel(venda){
  return (venda.pagamentos||[]).some(p=> (taxaDe(p.formaId).taxaPercentual||0) > 0 || (taxaDe(p.formaId).prazoDias||0) > 0);
}
function statusConciliacaoDe(venda){
  if(venda.conciliacao && venda.conciliacao.status) return venda.conciliacao.status;
  const prevista = dataPrevistaDe(venda);
  return prevista < todayStr() ? 'falha' : 'pendente';
}

/* ============================================================
   IMPORTAÇÃO DE ARQUIVOS (extrato bancário / relatório da maquininha)
   Aceita CSV simples; a pessoa mapeia manualmente qual coluna é
   qual (funciona com qualquer banco/adquirente, sem parser específico
   pra um banco só).
   ============================================================ */
let arquivosImportados = []; // [{ nome, cabecalho:[...], linhas:[[...]] }]
let transacoesImportadas = []; // [{ data, valor, descricao, origem }]

function parseCsvTexto(texto){
  const sep = (texto.split(';').length > texto.split(',').length) ? ';' : ',';
  const linhas = texto.split(/\r?\n/).filter(l=>l.trim()!=='');
  return linhas.map(l=> l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
}
function parseValorBr(v){
  if(v==null) return NaN;
  let s = String(v).trim().replace(/[^\d,.\-]/g,'');
  if(s.includes(',') && s.includes('.')){ s = s.replace(/\./g,'').replace(',','.'); }
  else if(s.includes(',')){ s = s.replace(',','.'); }
  return parseFloat(s);
}
function parseDataFlexivel(v){
  if(!v) return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

/* ============================================================
   ABA: CONCILIAR
   ============================================================ */
function renderConciliar(main){
  const hoje = todayStr();
  const inicioPadrao = new Date(); inicioPadrao.setDate(inicioPadrao.getDate()-60);
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">Conciliar recebimentos de cartão</h1>
      <p class="page-sub">Cruza as vendas do PDV com o extrato do banco e/ou o relatório da maquininha.</p>
    </div>

    <div class="card">
      <div class="section-label">1. Período das vendas a conciliar</div>
      <div class="grid-2">
        <div class="field"><label>De</label><input type="date" id="cReferenciaIni" value="${inicioPadrao.toISOString().slice(0,10)}"></div>
        <div class="field"><label>Até</label><input type="date" id="cReferenciaFim" value="${hoje}"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">2. Importar extrato bancário e/ou relatório da maquininha</div>
      <p class="muted" style="margin:-4px 0 12px;">Aceita arquivo CSV exportado do internet banking ou do painel da adquirente (Stone, Cielo, Rede etc). Depois de carregar, você indica qual coluna é qual.</p>
      <input type="file" id="cArquivo" accept=".csv,text/csv" multiple>
      <div id="cArquivosLista" style="margin-top:10px;"></div>
    </div>

    <div id="cMapeamentoWrap"></div>

    <div class="card">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <button class="btn btn-accent" id="btnRodarConciliacao">🔄 Rodar conciliação</button>
        <span class="muted" id="cTransacoesResumo"></span>
      </div>
    </div>

    <div id="cResultado"></div>
  `;

  renderArquivosLista();
  document.getElementById('cArquivo').addEventListener('change', async (e)=>{
    for(const file of e.target.files){
      const texto = await file.text();
      const linhas = parseCsvTexto(texto);
      if(linhas.length < 2){ showToast(`${file.name}: arquivo vazio ou sem linhas suficientes.`); continue; }
      arquivosImportados.push({ nome: file.name, cabecalho: linhas[0], linhas: linhas.slice(1) });
    }
    e.target.value = '';
    renderArquivosLista();
    renderMapeamento();
  });

  renderMapeamento();
  renderResultado([]);

  document.getElementById('btnRodarConciliacao').addEventListener('click', rodarConciliacao);
}

function renderArquivosLista(){
  const wrap = document.getElementById('cArquivosLista');
  if(!wrap) return;
  if(arquivosImportados.length===0){ wrap.innerHTML = `<span class="muted">Nenhum arquivo carregado ainda.</span>`; return; }
  wrap.innerHTML = arquivosImportados.map((a,i)=>`
    <span class="file-chip">📄 ${escapeHtml(a.nome)} <span class="muted">(${a.linhas.length} linhas)</span> <button type="button" class="icon-btn" data-rmarq="${i}" title="Remover" style="padding:0 0 0 4px;">✕</button></span>
  `).join('');
  wrap.querySelectorAll('[data-rmarq]').forEach(b=>{
    b.addEventListener('click', ()=>{
      arquivosImportados.splice(Number(b.dataset.rmarq),1);
      renderArquivosLista();
      renderMapeamento();
    });
  });
}

/** Tenta adivinhar qual coluna é qual, olhando palavras-chave no cabeçalho. Retorna o índice ou -1. */
function adivinharColuna(cabecalho, palavrasChave){
  for(let i=0;i<cabecalho.length;i++){
    const h = (cabecalho[i]||'').toLowerCase();
    if(palavrasChave.some(p=> h.includes(p))) return i;
  }
  return -1;
}
function renderMapeamento(){
  const wrap = document.getElementById('cMapeamentoWrap');
  if(!wrap) return;
  if(arquivosImportados.length===0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <div class="card">
      <div class="section-label">3. Indique as colunas de cada arquivo</div>
      ${arquivosImportados.map((a,i)=>{
        const palpiteData = adivinharColuna(a.cabecalho, ['data','date','dt']);
        const palpiteValor = adivinharColuna(a.cabecalho, ['valor','value','amount','credito','crédito']);
        const palpiteDesc = adivinharColuna(a.cabecalho, ['descri','histor','memo','detalhe']);
        return `
        <div style="margin-bottom:14px; padding-bottom:14px; ${i<arquivosImportados.length-1?'border-bottom:1px solid var(--line);':''}">
          <b>${escapeHtml(a.nome)}</b>
          <div class="grid-3" style="margin-top:8px;">
            <div class="field"><label>Coluna da data</label><select data-map="data" data-arq="${i}">${a.cabecalho.map((h,ci)=>`<option value="${ci}" ${ci===(palpiteData>=0?palpiteData:0)?'selected':''}>${escapeHtml(h||'(coluna '+(ci+1)+')')}</option>`).join('')}</select></div>
            <div class="field"><label>Coluna do valor</label><select data-map="valor" data-arq="${i}">${a.cabecalho.map((h,ci)=>`<option value="${ci}" ${ci===(palpiteValor>=0?palpiteValor:(a.cabecalho.length>1?1:0))?'selected':''}>${escapeHtml(h||'(coluna '+(ci+1)+')')}</option>`).join('')}</select></div>
            <div class="field"><label>Coluna da descrição <span class="muted">(opcional)</span></label><select data-map="descricao" data-arq="${i}"><option value="">—</option>${a.cabecalho.map((h,ci)=>`<option value="${ci}" ${ci===palpiteDesc?'selected':''}>${escapeHtml(h||'(coluna '+(ci+1)+')')}</option>`).join('')}</select></div>
          </div>
        </div>
      `;}).join('')}
      <button class="btn btn-ghost btn-sm" id="btnProcessarArquivos">Processar arquivos com esse mapeamento</button>
    </div>
  `;
  document.getElementById('btnProcessarArquivos').addEventListener('click', processarArquivosMapeados);
}

function processarArquivosMapeados(){
  transacoesImportadas = [];
  arquivosImportados.forEach((a, i)=>{
    const colData = Number(document.querySelector(`[data-map="data"][data-arq="${i}"]`).value);
    const colValor = Number(document.querySelector(`[data-map="valor"][data-arq="${i}"]`).value);
    const colDescSel = document.querySelector(`[data-map="descricao"][data-arq="${i}"]`).value;
    const colDesc = colDescSel === '' ? null : Number(colDescSel);
    a.linhas.forEach(linha=>{
      const data = parseDataFlexivel(linha[colData]);
      const valor = parseValorBr(linha[colValor]);
      if(!data || isNaN(valor)) return;
      transacoesImportadas.push({
        data, valor: Math.abs(valor),
        descricao: colDesc!==null ? (linha[colDesc]||'') : '',
        origem: a.nome,
      });
    });
  });
  document.getElementById('cTransacoesResumo').textContent = `${transacoesImportadas.length} transações prontas para conciliar.`;
  showToast(`${transacoesImportadas.length} transações processadas.`);
}

function rodarConciliacao(){
  const ini = document.getElementById('cReferenciaIni').value;
  const fim = document.getElementById('cReferenciaFim').value;
  const tolerancia = config.conciliacao.toleranciaDias || 3;

  const vendasNoPeriodo = vendas.filter(v=> v.data >= ini && v.data <= fim && vendaEhConciliavel(v));
  const usadas = new Set();

  vendasNoPeriodo.forEach(venda=>{
    if(venda.conciliacao && venda.conciliacao.status === 'recebido') return; // já conciliada antes
    const esperado = valorLiquidoEsperado(venda);
    const prevista = dataPrevistaDe(venda);
    const dIni = new Date(prevista); dIni.setDate(dIni.getDate()-tolerancia);
    const dFim = new Date(prevista); dFim.setDate(dFim.getDate()+tolerancia);

    let melhor = null;
    transacoesImportadas.forEach((t, ti)=>{
      if(usadas.has(ti)) return;
      const dt = new Date(t.data);
      if(dt < dIni || dt > dFim) return;
      if(Math.abs(t.valor - esperado) > Math.max(0.02, esperado*0.01)) return;
      if(!melhor || Math.abs(t.valor-esperado) < Math.abs(melhor.t.valor-esperado)) melhor = { t, ti };
    });

    if(melhor){
      usadas.add(melhor.ti);
      venda.conciliacao = { status:'recebido', dataRecebimento: melhor.t.data, valorRecebido: melhor.t.valor, origem: melhor.t.origem };
    }else{
      venda.conciliacao = { status: prevista < todayStr() ? 'falha' : 'pendente' };
    }
  });

  renderResultado(vendasNoPeriodo);
  Promise.all(vendasNoPeriodo.map(v=> vendaAtualizar(v))).then(()=>{
    showToast('Conciliação concluída e salva.');
  });
}

function renderResultado(lista){
  const wrap = document.getElementById('cResultado');
  if(!wrap) return;
  if(lista.length===0){ wrap.innerHTML = ''; return; }

  const totalBruto = lista.reduce((acc,v)=> acc + (v.pagamentos||[]).reduce((a,p)=>a+(Number(p.valor)||0),0), 0);
  const recebidas = lista.filter(v=> (v.conciliacao||{}).status==='recebido');
  const pendentes = lista.filter(v=> (v.conciliacao||{}).status==='pendente' || !v.conciliacao);
  const falhas = lista.filter(v=> (v.conciliacao||{}).status==='falha');
  const totalRecebido = recebidas.reduce((acc,v)=> acc + (v.conciliacao.valorRecebido||0), 0);
  const totalAReceber = pendentes.reduce((acc,v)=> acc + valorLiquidoEsperado(v), 0);
  const totalFalha = falhas.reduce((acc,v)=> acc + valorLiquidoEsperado(v), 0);

  wrap.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="num">${fmtMoeda(totalBruto)}</div><div class="lbl">Vendido bruto</div></div>
      <div class="kpi ok"><div class="num">${fmtMoeda(totalRecebido)}</div><div class="lbl">Recebido (líquido)</div></div>
      <div class="kpi wait"><div class="num">${fmtMoeda(totalAReceber)}</div><div class="lbl">A receber</div></div>
      <div class="kpi danger"><div class="num">${fmtMoeda(totalFalha)}</div><div class="lbl">Falha / atraso</div></div>
    </div>
    <div class="card" style="padding:14px 18px; overflow-x:auto;">
      <table>
        <thead><tr><th>Data venda</th><th>Loja</th><th>Bruto</th><th>Líquido esperado</th><th>Previsão</th><th>Status</th><th>Recebido em</th></tr></thead>
        <tbody>
          ${lista.map(v=>{
            const bruto = (v.pagamentos||[]).reduce((a,p)=>a+(Number(p.valor)||0),0);
            const status = statusConciliacaoDe(v);
            const badge = status==='recebido' ? '<span class="badge badge-ok">Recebido</span>'
              : status==='falha' ? '<span class="badge badge-falha">Falha/atraso</span>'
              : '<span class="badge badge-wait">Pendente</span>';
            return `<tr>
              <td>${fmtDate(v.data)}</td>
              <td><span class="badge badge-loja">${escapeHtml(v.loja||'—')}</span></td>
              <td>${fmtMoeda(bruto)}</td>
              <td>${fmtMoeda(valorLiquidoEsperado(v))}</td>
              <td>${fmtDate(dataPrevistaDe(v))}</td>
              <td>${badge}</td>
              <td>${v.conciliacao && v.conciliacao.dataRecebimento ? fmtDate(v.conciliacao.dataRecebimento) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   ABA: TAXAS E PRAZOS
   ============================================================ */
function renderTaxas(main){
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">Taxas e prazos por forma de pagamento</h1>
      <p class="page-sub">Usados para calcular o valor líquido esperado e a data prevista de recebimento de cada venda.</p>
    </div>
    <div class="card">
      <div class="grid-2" style="max-width:360px;">
        <div class="field"><label>Tolerância de dias na conciliação</label><input type="number" min="0" id="tTolerancia" value="${config.conciliacao.toleranciaDias||3}"></div>
      </div>
      <div id="tTaxasRows"></div>
      <button class="btn btn-accent btn-sm" id="btnSalvarTaxas" style="margin-top:12px;">Salvar</button>
    </div>
  `;
  function renderRows(){
    const wrap = document.getElementById('tTaxasRows');
    const formas = config.formasPagamento || [];
    if(formas.length===0){ wrap.innerHTML = `<div class="empty">Nenhuma forma de pagamento cadastrada em Configurações.</div>`; return; }
    wrap.innerHTML = `
      <div class="grid-3" style="border-bottom:none; padding-top:0; margin-top:16px;">
        <div class="muted">Forma de pagamento</div><div class="muted">Taxa (%)</div><div class="muted">Prazo (dias)</div>
      </div>
      ${formas.map(f=>{
        const t = taxaDe(f.id);
        return `
        <div class="grid-3" data-forma="${f.id}" style="align-items:center; margin-bottom:6px;">
          <div>${escapeHtml(f.nome)}</div>
          <input type="number" step="0.01" min="0" data-campo="taxaPercentual" value="${t.taxaPercentual||0}">
          <input type="number" min="0" data-campo="prazoDias" value="${t.prazoDias||0}">
        </div>`;
      }).join('')}
    `;
  }
  renderRows();
  document.getElementById('btnSalvarTaxas').addEventListener('click', async ()=>{
    config.conciliacao.toleranciaDias = Math.max(0, parseInt(document.getElementById('tTolerancia').value)||0);
    const novasTaxas = [];
    document.querySelectorAll('[data-forma]').forEach(row=>{
      const formaPagamentoId = row.dataset.forma;
      const taxaPercentual = parseFloat(row.querySelector('[data-campo="taxaPercentual"]').value)||0;
      const prazoDias = parseInt(row.querySelector('[data-campo="prazoDias"]').value)||0;
      novasTaxas.push({ formaPagamentoId, taxaPercentual, prazoDias });
    });
    config.conciliacao.taxas = novasTaxas;
    const ok = await configSaveUnificada();
    if(ok) showToast('Taxas e prazos salvos.');
  });
}

  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'conciliacao' }, '*');
    return;
  }
})();
