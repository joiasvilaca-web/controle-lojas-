<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
  /* Cores: só variáveis do sistema (tema.css). "Justificado" usa o tom de informação. */
  :root{ --just:var(--t-info); --just-soft:var(--t-info-soft); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:var(--t-font); font-size:14px; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  h1,h2,h3{ letter-spacing:-.015em; }

  /* ---------- botões (aparência vem do tema.css) ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; font-size:13.5px; font-weight:600; line-height:1.2; border-radius:8px; white-space:nowrap; }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }
  .btn-bloco{ width:100%; }

  /* ---------- login (só fora do app) ---------- */
  #view-login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px 28px; box-shadow:var(--t-shadow); }
  .login-title{ font-size:20px; font-weight:700; margin:0 0 4px; }
  .login-sub{ color:var(--ink-soft); font-size:13px; margin:0 0 22px; line-height:1.5; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:10px 12px; font-size:14px; }
  .login-error{ background:var(--danger-soft); color:var(--danger); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:12px; display:none; }
  .login-error.show{ display:block; }
  .hub-back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-faint); text-decoration:none; font-size:13px; font-weight:600; }
  .hub-back-link:hover{ color:var(--ink); }

  /* ---------- cabeçalho próprio (só fora do app) ---------- */
  #view-dashboard{ display:none; }
  header.topbar{ background:var(--t-dark); color:rgba(255,255,255,.92); padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:0; z-index:20; }
  header.topbar .hub-back-link{ color:rgba(255,255,255,.75); }
  header.topbar .hub-back-link:hover{ color:rgba(255,255,255,1); }
  .who{ font-size:13px; color:rgba(255,255,255,.8); display:flex; align-items:center; gap:10px; }
  .level-pill{ font-size:11px; font-weight:600; background:rgba(255,255,255,.14); padding:3px 9px; border-radius:999px; }
  header.topbar #btnLogout{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.18); color:rgba(255,255,255,.92); box-shadow:none; padding:6px 10px; }
  header.topbar #btnLogout:hover{ background:rgba(255,255,255,.16); }
  html.embedded #view-login{ display:none !important; }
  html.embedded header.topbar{ display:none !important; }

  main{ max-width:1180px; margin:0 auto; padding:20px 24px 64px; }

  /* ---------- cabeçalho da tela + abas ---------- */
  .dash-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .dash-titulo{ font-size:20px; font-weight:700; margin:0; }
  .dash-sub{ font-size:13px; color:var(--ink-faint); margin:2px 0 0; }
  .dash-painel[hidden]{ display:none !important; }
  .dash-painel > .section:last-child{ margin-bottom:0; }

  /* ---------- seções ---------- */
  .section{ margin-bottom:32px; }
  .sec-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .section-title{ font-size:16px; font-weight:700; margin:0; }
  .section-sub{ font-size:13px; color:var(--ink-faint); margin:2px 0 0; }
  .sub-titulo{ font-size:12px; font-weight:600; color:var(--ink-faint); margin:0 0 8px; }

  /* ---------- números de destaque ---------- */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; box-shadow:var(--t-shadow-sm); }
  .kpi .lbl{ font-size:12px; color:var(--ink-faint); font-weight:600; }
  .kpi .num{ font-size:24px; font-weight:700; margin-top:4px; line-height:1.15; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .kpi .num.menor{ font-size:18px; }
  .kpi .det{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .kpi.ok .num{ color:var(--ok); } .kpi.wait .num{ color:var(--wait); } .kpi.danger .num{ color:var(--danger); } .kpi.just .num{ color:var(--just); } .kpi.accent .num{ color:var(--accent); }
  .kpis.compactos{ grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .kpis.compactos .kpi{ background:var(--surface-2); border-color:transparent; box-shadow:none; padding:12px 14px; }
  .kpis.compactos .kpi .num{ font-size:20px; }
  .kpis.compactos .kpi .num.menor{ font-size:16px; line-height:1.5; }

  /* ---------- barra de filtros ---------- */
  .filters{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 10px; margin-bottom:12px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  .filters .f{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .filters .f > span{ font-size:12px; font-weight:600; color:var(--ink-faint); }
  .filters select, .filters input[type=date], .filters input[type=text], .filters input[type=month]{ padding:8px 10px; font-size:13px; min-height:36px; }
  .filters input[type=text]{ min-width:200px; }
  .filters .chk{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft); min-height:36px; padding:0 4px; cursor:pointer; }
  .filters .limpar{ margin-left:auto; }
  .filters.leves{ padding:0; background:none; border:0; }

  /* ---------- cartões ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--t-shadow-sm); min-width:0; }
  .card.pad{ padding:16px 18px; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .card-title{ display:block; font-size:14px; font-weight:700; color:var(--ink); margin:0; }
  .card-sub{ display:block; font-size:12px; color:var(--ink-faint); margin-top:2px; font-weight:400; }
  .grade-2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; margin-bottom:12px; }
  @media(max-width:900px){ .grade-2{ grid-template-columns:minmax(0,1fr); } }
  .pilha > .card{ margin-bottom:12px; }

  /* ---------- tabelas ---------- */
  .tabela-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  th.r, td.r{ text-align:right; }
  th.c, td.c{ text-align:center; }
  td.forte{ font-weight:600; }
  .tbl-nota{ font-size:12px; color:var(--ink-faint); padding:10px 12px; border-top:1px solid var(--line); text-align:center; }
  .aviso-linha{ display:inline-flex; align-items:center; gap:4px; margin-top:3px; color:var(--danger); font-weight:600; font-size:11.5px; }
  .valor-alerta{ color:var(--danger); font-weight:700; }
  .card .tabela-wrap > table :is(th,td):first-child{ padding-left:16px; }
  .card .tabela-wrap > table :is(th,td):last-child{ padding-right:16px; }

  /* no celular, tabela vira lista de cartões (rótulo à esquerda, valor à direita) */
  @media(max-width:760px){
    .tbl thead{ display:none; }
    .tbl, .tbl tbody, .tbl td{ display:block; width:100%; }
    .tbl tr{ display:flex; flex-direction:column; width:100%; padding:10px 14px; border-bottom:1px solid var(--line); }
    .tbl td.td-princ{ order:-1; }
    .tbl tbody tr:last-child{ border-bottom:none; }
    .tbl tbody td, .card .tabela-wrap > .tbl tbody td:first-child, .card .tabela-wrap > .tbl tbody td:last-child{ border:none; padding:3px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; white-space:normal; text-align:right; }
    .tbl td::before{ content:attr(data-label); color:var(--ink-faint); font-size:12px; font-weight:600; text-align:left; flex-shrink:0; }
    .tbl td.td-princ, .card .tabela-wrap > .tbl tbody td.td-princ{ display:block; text-align:left; font-weight:600; font-size:14px; padding-bottom:4px; }
    .tbl td.td-princ::before{ display:none; }
    .tbl td:empty{ display:none; }
    .tbl tbody tr:hover > td{ background:transparent; }
  }

  /* ---------- selos de status ---------- */
  .badge{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; background:var(--surface-2); color:var(--ink-soft); }
  .badge.aguardando, .badge.wait{ background:var(--wait-soft); color:var(--wait); }
  .badge.ok, .badge.entregue{ background:var(--ok-soft); color:var(--ok); }
  .badge.pronto{ background:var(--t-info-soft); color:var(--info); }
  .badge.oficina_pronto{ background:var(--accent-soft); color:var(--accent); }
  .badge.enviado_fabrica, .badge.rascunho{ background:var(--surface-2); color:var(--ink-soft); }
  .badge.cancelado, .badge.erro, .badge.pendencia{ background:var(--danger-soft); color:var(--danger); }
  .badge.just{ background:var(--just-soft); color:var(--just); }
  .rank{ display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:22px; padding:0 6px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--surface-2); color:var(--ink-soft); }
  .rank.r1{ background:var(--accent-soft); color:var(--accent); }

  /* ---------- estados ---------- */
  .empty{ text-align:center; padding:32px 20px; color:var(--ink-faint); font-size:13px; line-height:1.5; }
  .empty b{ display:block; color:var(--ink-soft); font-size:14px; margin-bottom:2px; }
  .carregando{ display:flex; align-items:center; justify-content:center; gap:10px; padding:64px 20px; color:var(--ink-faint); font-size:14px; }
  .carregando::before{ content:""; width:18px; height:18px; border-radius:50%; border:2px solid var(--line-strong); border-top-color:var(--accent); animation:girar .8s linear infinite; }
  @keyframes girar{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .carregando::before{ animation:none; } }
  .faixa{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.5; margin-bottom:12px; background:var(--surface-2); color:var(--ink-soft); }
  .faixa .ico{ margin-top:2px; }
  .faixa b{ display:block; }
  .faixa ul{ margin:4px 0 0; padding-left:18px; }
  .faixa.erro{ background:var(--danger-soft); color:var(--danger); }
  .locked-note{ display:flex; gap:8px; align-items:center; background:var(--accent-soft); color:var(--accent); padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; }
  .alerta-rh-banner{ display:flex; gap:10px; align-items:flex-start; border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:1.6; }
  .alerta-rh-banner .ico{ margin-top:3px; }
  .alerta-rh-urgente{ background:var(--danger-soft); color:var(--danger); }
  .alerta-rh-atencao{ background:var(--wait-soft); color:var(--wait); }
  .alerta-rh-aviso{ background:var(--surface-2); color:var(--ink-soft); }
  .alerta-rh-banner b{ display:block; margin-bottom:2px; }
  .alerta-rh-banner ul{ margin:0; padding-left:18px; color:var(--ink); }

  /* ---------- contas a pagar ---------- */
  .contas-bloco{ border-radius:10px; padding:10px 12px; }
  .contas-bloco + .contas-bloco{ margin-top:8px; }
  .contas-bloco.venc{ background:var(--danger-soft); }
  .contas-bloco.hoje{ background:var(--wait-soft); }
  .contas-bloco .tit{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; margin-bottom:6px; }
  .contas-bloco.venc .tit{ color:var(--danger); } .contas-bloco.hoje .tit{ color:var(--wait); }
  .contas-linha{ display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:3px 0; color:var(--ink); }
  .contas-linha span:first-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .contas-linha b{ white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* ---------- popups ---------- */
  .modal-overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:24px;}
  .modal-titulo{ margin:0 0 4px; font-size:18px; font-weight:700; padding-right:32px; }
  .modal-sub{ color:var(--ink-faint); font-size:13px; margin:0 0 16px; }
  .modal-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:flex-end;}
  .metas-form{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px 14px; }
  @media(max-width:560px){ .metas-form{ grid-template-columns:minmax(0,1fr); } }
  .metas-form .field input{ text-align:right; font-variant-numeric:tabular-nums; }

  /* ---------- gráficos de barras ---------- */
  .btn-grafico{ display:inline-flex; align-items:center; gap:6px; }
  .barra-grafico-linha{margin-bottom:12px;}
  .barra-grafico-linha .rotulo{display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:4px;}
  .barra-grafico-linha .rotulo span:first-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barra-grafico-linha .rotulo b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .barra-grafico-fundo{background:var(--surface-2); border-radius:4px; height:10px; overflow:hidden;}
  .barra-grafico-preenchimento{height:100%; border-radius:4px; background:var(--accent);}
  .barras-dist{ display:flex; flex-direction:column; gap:8px; }
  .dist-linha{ display:grid; grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto; align-items:center; gap:10px; font-size:13px; }
  .dist-linha .nome{ color:var(--ink-soft); font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dist-linha .trilho{ background:var(--surface-2); border-radius:4px; height:10px; overflow:hidden; }
  .dist-linha .trilho div{ height:100%; border-radius:4px; }
  .dist-linha .qtd{ text-align:right; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dist-linha .qtd small{ color:var(--ink-faint); font-weight:400; font-size:12px; margin-left:2px; }
  .mini-trilho{ background:var(--surface-2); border-radius:3px; height:4px; margin:4px auto 0; width:60px; overflow:hidden; }
  .mini-trilho div{ height:100%; border-radius:3px; }
  .cor-ok{ background:var(--ok); } .cor-wait{ background:var(--wait); } .cor-danger{ background:var(--danger); } .cor-accent{ background:var(--accent); }

  /* ---------- metas ---------- */
  .meta-linha{ padding:10px 0; border-bottom:1px solid var(--line); }
  .meta-linha:last-child{ border-bottom:none; padding-bottom:0; }
  .meta-linha:first-child{ padding-top:0; }
  .meta-topo{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
  .meta-topo .nome{ font-weight:600; }
  .meta-valores{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-variant-numeric:tabular-nums; }
  .meta-trilho{ position:relative; background:var(--surface-2); border-radius:4px; height:8px; margin-top:6px; overflow:visible; }
  .meta-trilho .prog{ height:100%; border-radius:4px; max-width:100%; }
  .meta-trilho .ritmo{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-faint); border-radius:1px; }
  .meta-legenda{ font-size:12px; color:var(--ink-faint); margin-top:10px; display:flex; align-items:center; gap:6px; }
  .meta-legenda i{ display:inline-block; width:2px; height:12px; background:var(--ink-faint); }

  /* ---------- IA ---------- */
  #perguntaIa{ width:100%; padding:10px 12px; font-size:14px; resize:vertical; }
  .ia-acoes{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .ia-acoes .dica{ font-size:12px; color:var(--ink-faint); }
  #respostaIa:not(:empty){ margin-top:12px; font-size:13.5px; white-space:pre-wrap; line-height:1.55; background:var(--surface-2); border-radius:10px; padding:12px 14px; }

  /* ---------- avisos flutuantes (metas / IA) ---------- */
  .alerta-meta-popup{ position:fixed; top:16px; right:16px; max-width:360px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--t-shadow-lg); z-index:80; font-size:13px; line-height:1.5; }
  .alerta-meta-popup b{ display:flex; align-items:center; gap:6px; margin-bottom:4px; color:var(--danger); font-size:14px; }
  .alerta-meta-popup button{ display:inline-flex; margin-top:10px; background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .alerta-meta-popup button:hover{ background:var(--surface-2); color:var(--ink); }
  @media(max-width:560px){ .alerta-meta-popup{ left:12px; right:12px; max-width:none; } }

  /* ---------- Visão geral (indicadores + gráficos em SVG puro) ---------- */
  .vg-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .vg-periodo{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; }
  .vg-periodo button{ border:none; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; padding:6px 12px; border-radius:7px; min-height:32px; }
  .vg-periodo button:hover{ color:var(--ink); }
  .vg-periodo button.active{ background:var(--surface); color:var(--accent); box-shadow:var(--t-shadow-sm); }
  .vg-periodo button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .vg-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:12px; }
  .vg-kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; box-shadow:var(--t-shadow-sm); }
  .vg-kpi .lbl{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--ink-faint); font-weight:600; }
  .vg-kpi .num{ font-size:24px; font-weight:700; margin-top:4px; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vg-kpi .det{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .vg-kpi.alerta .num{ color:var(--wait); }
  .vg-grid{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:12px; }
  @media(max-width:900px){ .vg-grid{ grid-template-columns:minmax(0,1fr); } }
  .vg-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-width:0; box-shadow:var(--t-shadow-sm); }
  .vg-card h3{ margin:0 0 2px; font-size:14px; font-weight:700; }
  .vg-card .vg-sub{ margin:0 0 12px; font-size:12px; color:var(--ink-faint); }
  .vg-legenda{ display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin-bottom:8px; flex-wrap:wrap; }
  .vg-legenda i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .vg-svg{ width:100%; height:auto; display:block; overflow:visible; }
  .vg-svg text{ font-family:inherit; font-size:11px; fill:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .vg-svg .grade{ stroke:var(--line); stroke-width:1; }
  .vg-svg .base{ stroke:var(--line-strong); stroke-width:1; }
  .vg-svg .s-v{ fill:var(--accent); }
  .vg-svg .s-o{ fill:var(--wait); }
  .vg-svg .alvo{ fill:transparent; }

    .vg-kpi .det{ font-size:11.5px; }

  }

<body>

    <p class="login-sub">Use a mesma senha do Painel de Ordens. O que aparece aqui depende do seu nível de acesso.</p>
    <div class="login-error" id="loginError" role="alert">Senha não encontrada. Confira e tente de novo.</div>

</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<script>
  /* Ícones estáticos do HTML acima (os dos templates usam Icone() direto). */
  document.querySelectorAll('[data-ico]').forEach(function(el){ if(window.Icone) el.outerHTML = Icone(el.getAttribute('data-ico')); });
</script>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

  // A partir daqui o app não fala mais direto com o banco: tudo passa pela Edge
  // Function "db-gateway", que exige a senha de um acesso válido.
  let __gatewaySenha = null;
  async function gatewayCall(body){
    try{
      const res = await fetch(GATEWAY_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, ...body }),
      });
      return await res.json();
    }catch(e){
      console.error("erro ao falar com o servidor", e);
      return { error: "Não foi possível conectar. Verifique sua internet." };
    }
  }
  async function gatewayLogin(senhaTentativa){
    return gatewayCall({ op:"login", senha: senhaTentativa });
  }
  const supabaseClient = {
    from(table){
      return {
        select(){
          return {
            eq(column, value){
              return {
                maybeSingle: async ()=>{
                  if(table === "gestao_config" && column === "id" && value === "config"){
                    const r = await gatewayCall({ op:"getConfig" });
                    if(r.error) return { data:null, error:r.error };
                    return { data: { payload: r.data }, error: null };
                  }
                  return gatewayCall({ op:"selectOne", table, params:{ column, value } });
                }
              };
            },
            order(){ return gatewayCall({ op:"selectAll", table }); }
          };
        },
        upsert(row){
          if(table === "gestao_config"){
            return gatewayCall({ op:"saveConfig", params:{ payload: row.payload } });
          }
          return gatewayCall({ op:"upsert", table, params:{ row } });
        },
        delete(){
          return { eq: (column, value)=> gatewayCall({ op:"delete", table, params:{ column, value } }) };
        }
      };
    }
  };

  let currentUser = null; // { nome, nivel }
  let configCompleto = null;
  let ordersConfig = null;
  let orders = [];
  let dpFuncionariosCache = null;

  /** Carrega o perfil de RH dos funcionários (dp_funcionarios) — só usado pelo alerta de RH, diretoria/gerente. */
  async function dpFuncionariosGetDash(){
    if(dpFuncionariosCache !== null) return dpFuncionariosCache;
    try{
      const { data, error } = await supabaseClient.from("dp_funcionarios").select("id,payload").order("created_at",{ascending:true});
      if(error) throw error;
      dpFuncionariosCache = (data||[]).map(r=>r.payload);
    }catch(e){ console.error("erro ao carregar perfis de RH", e); dpFuncionariosCache = []; }
    return dpFuncionariosCache;
  }
  function diasEntre(dataFutura){
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const alvo = new Date(dataFutura+"T00:00:00");
    return Math.round((alvo - hoje) / 86400000);
  }
  function somarDias(dataStr, dias){
    const d = new Date(dataStr+"T00:00:00");
    d.setDate(d.getDate() + Number(dias||0));
    return d.toISOString().slice(0,10);
  }
  /**
   * Monta o banner de alertas de RH no topo do Dashboard: avisa 60/30/10 dias antes de um
   * funcionário completar 1 ano de registro (direito a férias), e 10/5/1 dias antes de vencer
   * cada período de experiência (a CLT permite até 2). Só diretoria/gerente veem isso.
   */
  async function renderAlertasRH(){
    const el = document.getElementById("secAlertasRH");
    if(!el) return;
    const funcionariosRH = await dpFuncionariosGetDash();
    const ativos = funcionariosRH.filter(f=>f.status!=="desligado");

    const alertasFerias = [];
    ativos.forEach(f=>{
      if(!f.dataAdmissao) return;
      const umAno = somarDias(f.dataAdmissao, 365);
      const dias = diasEntre(umAno);
      if(dias>=0 && dias<=60) alertasFerias.push({ nome:f.nome, dias });
    });

    const alertasExperiencia = [];
    ativos.forEach(f=>{
      [[f.experiencia1Data,f.experiencia1Dias,"1"],[f.experiencia2Data,f.experiencia2Dias,"2"]].forEach(([data,duracao,numero])=>{
        if(!data || !duracao) return;
        const vencimento = somarDias(data, duracao);
        const dias = diasEntre(vencimento);
        if(dias>=0 && dias<=10) alertasExperiencia.push({ nome:f.nome, dias, numero });
      });
    });

    if(alertasFerias.length===0 && alertasExperiencia.length===0){ el.innerHTML = ""; return; }

    function classeUrgencia(dias, limiarUrgente, limiarAtencao){
      if(dias<=limiarUrgente) return "alerta-rh-urgente";
      if(dias<=limiarAtencao) return "alerta-rh-atencao";
      return "alerta-rh-aviso";
    }
    let html = "";
    if(alertasFerias.length>0){
      alertasFerias.sort((a,b)=>a.dias-b.dias);
      const maisUrgente = alertasFerias[0];
      html += `
        <div class="alerta-rh-banner ${classeUrgencia(maisUrgente.dias,10,30)}" role="status">
          ${ico("calendario")}
          <div><b>Férias: funcionário completando 1 ano de registro</b>
          <ul>${alertasFerias.map(a=>`<li>${escapeHtml(a.nome)} — ${a.dias===0?"completa hoje":`em ${a.dias} dia(s)`}</li>`).join("")}</ul></div>
        </div>
      `;
    }
    if(alertasExperiencia.length>0){
      alertasExperiencia.sort((a,b)=>a.dias-b.dias);
      const maisUrgente = alertasExperiencia[0];
      html += `
        <div class="alerta-rh-banner ${classeUrgencia(maisUrgente.dias,1,5)}" role="status">
          ${ico("relogio")}
          <div><b>Período de experiência vencendo</b>
          <ul>${alertasExperiencia.map(a=>`<li>${escapeHtml(a.nome)} — experiência ${a.numero} ${a.dias===0?"vence hoje":`vence em ${a.dias} dia(s)`}</li>`).join("")}</ul></div>
        </div>
      `;
    }
    el.innerHTML = html;
  }

  let transfConfig = null;
  let transferencias = [];
  let reposicoes = [];
  let vendas = [];
  let orcamentos = [];
  let gastosDash = [];

  function escapeHtml(s){ return (s===null||s===undefined?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  /** Resolve o nome de uma loja a partir do lojaId — usado pra O.S. (que agora só
   * guarda lojaId), mantendo o resto do dashboard (Metas, filtro de Vendas) do jeito
   * que já estava, indexado por nome. */
  function nomeLojaDash(lojaId){
    if(!lojaId) return "";
    const l=(configCompleto&&configCompleto.lojas||[]).find(x=>x.id===lojaId);
    return l?l.nome:lojaId;
  }
  function fmtDate(s){ if(!s) return "—"; if(window.Fmt){ const r = Fmt.data(s); if(r) return r; } const p=String(s).split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
  function fmtMoeda(v){ return window.Fmt ? Fmt.brl(v) : "R$ " + (Number(v)||0).toFixed(2).replace(".", ","); }
  /* ---------- apresentação (só montam HTML; não leem nem gravam nada) ---------- */
  function ico(nome, tam){ return window.Icone ? Icone(nome, tam ? { tam } : undefined) : ""; }
  function fmtNum(v){ return window.Fmt ? Fmt.num(v) : String(Number(v)||0); }
  /** Cartão de número de destaque: rótulo em cima, número grande, detalhe opcional embaixo. */
  function kpiHtml(rotulo, valor, tom, detalhe, extraClasse){
    return `<div class="kpi${tom?" "+tom:""}"><div class="lbl">${escapeHtml(rotulo)}</div><div class="num${extraClasse?" "+extraClasse:""}" title="${escapeHtml(String(valor))}">${valor}</div>${detalhe?`<div class="det">${detalhe}</div>`:""}</div>`;
  }
  const STATUS_OS_LABEL = { aguardando:"Aguardando", enviado_fabrica:"Enviado p/ fábrica", pendencia:"Pendência", oficina_pronto:"Fábrica pronto", pronto:"Pronto", entregue:"Entregue", cancelado:"Cancelado", rascunho:"Rascunho" };
  function statusOsLabel(st){ return STATUS_OS_LABEL[st] || (st ? String(st) : "—"); }
  const STATUS_TRANSF_LABEL = { OK:"OK", ERRO:"Pendência", JUST:"Justificado", PEND:"Em aberto" };
  function vazioHtml(titulo, dica){ return `<div class="empty"><b>${escapeHtml(titulo)}</b>${dica?escapeHtml(dica):""}</div>`; }
  function valorRecebidoDe(o){ return (o.pagamentos||[]).reduce((acc,p)=> acc + (Number(p.valor)||0), 0); }
  function valorAReceberDe(o){ return Math.max(0, (Number(o.valorTotal)||0) - valorRecebidoDe(o)); }
  function semPagamentoLancado(o){ return !o.valorTotal && (!o.pagamentos || o.pagamentos.length===0); }

  /* ================= MODAL DE GRÁFICO (reutilizável em qualquer seção) ================= */
  function closeModal(){
    document.getElementById("modalOverlay").classList.remove("show");
    document.getElementById("modalBox").innerHTML = "";
    if(history.state && history.state.modalAberto) history.back();
  }
  function openModal(html){
    document.getElementById("modalBox").innerHTML = html;
    document.getElementById("modalOverlay").classList.add("show");
    history.pushState({ modalAberto:true }, "");
  }
  window.addEventListener("popstate", ()=>{
    const overlay = document.getElementById("modalOverlay");
    if(overlay && overlay.classList.contains("show")) history.pushState({ modalAberto:true }, "");
  });
  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){
      const overlay = document.getElementById("modalOverlay");
      if(overlay && overlay.classList.contains("show")){ e.preventDefault(); e.stopPropagation(); }
    }
  });
  /**
   * Gráfico de barra horizontal simples (sem biblioteca externa), pra comparar itens.
   * itens: [{ nome, valor }], formatoValor: função opcional pra formatar o número exibido.
   */
  function barrasHtml(itens, formatoValor){
    if(!itens || itens.length===0) return `<p class="vg-vazio">Ainda não há dados para este gráfico.</p>`;
    const fmt = formatoValor || (v=> fmtNum(v));
    const max = Math.max(...itens.map(i=>Number(i.valor)||0), 1);
    return itens.map(i=>{
      const pct = Math.max((Number(i.valor)||0)/max*100, 2);
      return `
        <div class="barra-grafico-linha">
          <div class="rotulo"><span title="${escapeHtml(i.nome)}">${escapeHtml(i.nome)}</span><b>${fmt(i.valor)}</b></div>
          <div class="barra-grafico-fundo"><div class="barra-grafico-preenchimento" style="width:${pct}%;"></div></div>
        </div>
      `;
    }).join("");
  }
  /** Abre o modal já com o título e o gráfico de barras montado a partir de uma lista de {nome, valor}. */
  function abrirGraficoBarras(titulo, subtitulo, itens, formatoValor){
    openModal(`
      <h3 class="modal-titulo">${escapeHtml(titulo)}</h3>
      ${subtitulo ? `<p class="modal-sub">${escapeHtml(subtitulo)}</p>` : ''}
      <div>${barrasHtml(itens, formatoValor)}</div>
      <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharGrafico">Fechar</button></div>
    `);
    document.getElementById("btnFecharGrafico").addEventListener("click", closeModal);
  }

  /* ================= LOGIN ================= */
  /* ================= MODO EMBUTIDO ================= */
  const EMBEDDED = window.self !== window.top;
  function atualizarFaixaLoja(){
    const faixa = document.getElementById("lojaFaixa");
    if(!faixa) return;
    if(window.__lojaAtual && window.__lojaAtual.nome){
      faixa.style.display = "block";
      faixa.style.setProperty('--loja-cor', window.__lojaAtual.cor || 'var(--accent)');
      faixa.textContent = window.__lojaAtual.nome;
    } else {
      faixa.style.display = "none";
    }
  }
  if(EMBEDDED){
    document.documentElement.classList.add("embedded");
    window.addEventListener("message", async (ev)=>{
      // Segurança: só aceita mensagens do mesmo domínio (shell → módulo)
      if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return;
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === "auth"){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user ? ev.data.user.senha : null;
        mostrarCarregandoDash();
        try{
          const { data } = await supabaseClient.from("gestao_config").select("payload").eq("id","config").maybeSingle();
          const unificado = data ? data.payload : null;
          configCompleto = unificado;
          ordersConfig = unificado ? { lojas: unificado.lojas||[], serviceTypes: unificado.tiposServico||[], users: unificado.users||[] } : null;
          transfConfig = unificado ? { stores: (unificado.lojas||[]).map(l=>l.abreviacao) } : { stores: [] };
        }catch(e){ console.error("Erro ao carregar config no dashboard embutido:", e); }
        await loadAllData();
        enterDashboard();
        parent.postMessage({ type:"tabs", modulo:"dashboard", tabs: [], active: null }, "*");
      } else if(ev.data.type === "lojaAtual"){
        window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
        atualizarFaixaLoja();
      }
    });
    parent.postMessage({ type:"ready", modulo:"dashboard" }, "*");
  }

  document.getElementById("btnLogin").addEventListener("click", doLogin);
  document.getElementById("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

  async function doLogin(){
    const pass = document.getElementById("loginPass").value.trim();
    const err = document.getElementById("loginError");
    const btn = document.getElementById("btnLogin");
    if(!pass) return;
    err.classList.remove("show");
    btn.disabled = true;
    try{
      const r = await gatewayLogin(pass);
      if(!r || !r.ok){ err.classList.add("show"); return; }
      __gatewaySenha = pass;
      currentUser = { nome: r.user.nome, nivel: r.user.nivel };
      mostrarCarregandoDash();
      const { data } = await supabaseClient.from("gestao_config").select("payload").eq("id","config").maybeSingle();
      const unificado = data ? data.payload : null;
      configCompleto = unificado;
      ordersConfig = unificado ? { lojas: unificado.lojas||[], serviceTypes: unificado.tiposServico||[], users: unificado.users||[] } : null;
      transfConfig = unificado ? { stores: (unificado.lojas||[]).map(l=>l.abreviacao) } : { stores: [] };
      await loadAllData();
      enterDashboard();
    }catch(e){
      console.error("Erro no login do dashboard:", e);
      err.textContent = "Não foi possível verificar a senha agora. Confira sua internet e tente de novo.";
      document.getElementById("view-dashboard").style.display = "none";
      document.getElementById("view-login").style.display = "flex";
      err.classList.add("show");
    }finally{
      btn.disabled = false;
    }
  }

  document.getElementById("btnLogout").addEventListener("click", ()=>{
    currentUser = null;
    __gatewaySenha = null;
    document.getElementById("loginPass").value = "";
    document.getElementById("view-dashboard").style.display = "none";
    document.getElementById("view-login").style.display = "flex";
  });

  /* ================= CARREGAMENTO DE DADOS ================= */
  /** Partes que não carregaram (para o aviso de erro no topo). Só apresentação. */
  let falhasCargaDash = [];
  function mostrarCarregandoDash(){
    document.getElementById("view-login").style.display = "none";
    document.getElementById("view-dashboard").style.display = "block";
    const main = document.getElementById("mainContent");
    if(main) main.innerHTML = `<div class="carregando" role="status">Carregando o painel…</div>`;
  }
  async function loadAllData(){
    falhasCargaDash = [];
    const rOrdens = await gatewayCall({ op:'selectAll', table:'ordens_servico' });
    if(!rOrdens || rOrdens.error) falhasCargaDash.push("ordens de serviço");
    orders = ((rOrdens && rOrdens.data) || []).map(row=>row.payload);

    if(currentUser.nivel !== "oficina"){
      try{
        const { data: tData, error: etData } = await supabaseClient.from("transferencias_controle").select("id,payload").order("created_at",{ascending:true});
        if(etData && /conectar|internet|fetch/i.test(String(etData))) falhasCargaDash.push("transferências");
        transferencias = (tData||[]).map(r=>r.payload);
      }catch(e){ transferencias = []; }
      try{
        const { data: rData, error: erData } = await supabaseClient.from("reposicao_controle").select("id,payload").order("created_at",{ascending:true});
        if(erData && /conectar|internet|fetch/i.test(String(erData))) falhasCargaDash.push("reposições");
        reposicoes = (rData||[]).map(r=>r.payload);
      }catch(e){ reposicoes = []; }
      try{
        const { data: vData, error: evData } = await supabaseClient.from("vendas_pdv").select("id,payload").order("created_at",{ascending:true});
        if(evData && /conectar|internet|fetch/i.test(String(evData))) falhasCargaDash.push("vendas");
        vendas = (vData||[]).map(r=>r.payload);
      }catch(e){ vendas = []; }
      try{
        const { data: oData, error: eoData } = await supabaseClient.from("orcamentos").select("id,payload").order("created_at",{ascending:true});
        if(eoData && /conectar|internet|fetch/i.test(String(eoData))) falhasCargaDash.push("orçamentos");
        orcamentos = (oData||[]).map(r=>r.payload);
      }catch(e){ orcamentos = []; }
      try{
        const { data: gData, error: egData } = await supabaseClient.from("gastos").select("id,payload").order("created_at",{ascending:true});
        if(egData && /conectar|internet|fetch/i.test(String(egData))) falhasCargaDash.push("gastos");
        gastosDash = (gData||[]).map(r=>r.payload).filter(Boolean);
      }catch(e){ gastosDash = []; }
    }
  }

  /**
   * Aviso de "Contas a pagar" fixo na primeira linha do Dashboard — mesma informação do
   * popup que já aparece ao logar (verificarAlertaGastos, se existir no shell), só que

  /* ================= LÓGICA DE STATUS (Transferências/Reposição) — mesma regra do app original ================= */
  function stepDone(visto, nome, data){
    if(!visto) return false;
    if(nome !== undefined && String(nome||"").trim()==="") return false;
    if(data !== undefined && String(data||"").trim()==="") return false;
    return true;
  }
  function multisetEqual(a,b){
    if(a.length!==b.length) return false;
    const sa=[...a].sort(), sb=[...b].sort();
    return JSON.stringify(sa)===JSON.stringify(sb);
  }
  function sumByProduto(items, withFator){
    const map = new Map();
    (items||[]).forEach(it=>{
      if(!it.produto || it.quantidade==="" || it.quantidade===null || it.quantidade===undefined) return;
      if(!map.has(it.produto)) map.set(it.produto, {qty:0, fatores:[]});
      const e = map.get(it.produto);
      e.qty += Number(it.quantidade);
      if(withFator && it.fator && String(it.fator).trim()!=="") e.fatores.push(String(it.fator).trim());
    });
    return map;
  }
  function sumVendaByProduto(items){
    const map = new Map();
    (items||[]).forEach(it=>{
      if(!it.produto) return;
      const qtdLoja = it.qtdLoja===""||it.qtdLoja===null||it.qtdLoja===undefined?0:Number(it.qtdLoja);
      const qtdEco = it.qtdEcommerce===""||it.qtdEcommerce===null||it.qtdEcommerce===undefined?0:Number(it.qtdEcommerce);
      if(it.qtdLoja==="" && it.qtdEcommerce==="") return;
      if(!map.has(it.produto)) map.set(it.produto, {qty:0, fatores:[]});
      map.get(it.produto).qty += qtdLoja+qtdEco;
    });
    return map;
  }
  function computeStatusTransfer(r){
    if(!r.tipoTransf) return "PEND";
    const itemsValid = (r.transferItens||[]).some(it=>it.produto && it.quantidade!=="" && it.quantidade!==null && it.quantidade!==undefined);
    const stepSaida = stepDone(r.vistoSaida, r.nomeSaida, r.dataSaida);
    const stepEntrada = stepDone(r.vistoEntrada, r.nomeEntrada, r.dataEntrada);
    const stepRetornoSaida = r.tipoTransf==="TROCA" ? stepDone(r.vistoRetornoSaida, r.nomeRetornoSaida, r.dataRetornoSaida) : true;
    const stepRetornoEntrada = r.tipoTransf==="TROCA" ? stepDone(r.vistoRetornoEntrada, r.nomeRetornoEntrada, r.dataRetornoEntrada) : true;
    const stepBaixa = r.tipoTransf==="SAÍDA" ? stepDone(r.vistoBaixaEstoque, r.nomeBaixaEstoque, r.dataBaixaEstoque) : true;
    const stepEntradaEstoque = r.tipoTransf==="SAÍDA" ? stepDone(r.vistoEntradaEstoque, r.nomeEntradaEstoque, r.dataEntradaEstoque) : true;
    const stepSup = stepDone(r.vistoDiretoria, r.nomeDiretoria, r.dataDiretoria);
    if(itemsValid && stepSaida && stepEntrada && stepRetornoSaida && stepRetornoEntrada && stepBaixa && stepEntradaEstoque && stepSup) return "OK";
    return "ERRO";
  }
  function computeStatusReposicao(r){
    const pedidoMap = sumByProduto(r.pedidoItens, false);
    if(pedidoMap.size===0) return "PEND";
    const vendaMap = sumVendaByProduto(r.vendaItens);
    const dispMap = sumByProduto(r.disponibilizadoItens, true);
    const recMap = sumByProduto(r.recebimentoItens, true);
    let divergente = false;
    pedidoMap.forEach((v,produto)=>{ if(vendaMap.has(produto) && vendaMap.get(produto).qty!==v.qty) divergente = true; });
    const dispProdutos = new Set([...dispMap.keys(), ...recMap.keys()]);
    dispProdutos.forEach(produto=>{
      if(dispMap.has(produto) && recMap.has(produto)){
        const d=dispMap.get(produto), rr=recMap.get(produto);
        if(d.qty!==rr.qty || !multisetEqual(d.fatores, rr.fatores)) divergente = true;
      }
    });
    const stepDir = stepDone(r.vistoDiretoria, r.nomeDiretoria, r.dataDiretoria);
    const stepAdm = stepDone(r.vistoAdministrativo, r.nomeAdministrativo, r.dataAdministrativo);
    const stepRecLoja = stepDone(r.vistoRecebimentoLoja, r.nomeRecebimentoLoja, r.dataRecebimentoLoja);
    const stepSist = stepDone(r.vistoSistema, r.nomeSistema, r.dataSistema);
    const allDone = stepDir && stepAdm && stepRecLoja && stepSist;
    if(!divergente && allDone) return "OK";
    const justOk = r.justificativa && r.justificativa.trim()!=="" && stepDone(r.vistoDiretoriaCorrecao, r.nomeDiretoriaCorrecao, r.dataDiretoriaCorrecao);
    if(divergente && justOk) return "JUST";
    return "ERRO";
  }

  /* ================= RENDER ================= */
  let filtrosOrdens = { loja:"", status:"", servico:"", dataIni:"", dataFim:"", busca:"" };
  let filtrosTransf = { loja:"", tipo:"", status:"", dataIni:"", dataFim:"" };
  let filtrosVendas = { loja:"", dataIni:"", dataFim:"", busca:"", semPagamento:false };
  let filtrosPagamentos = { modulo:"", loja:"", dataIni:"", dataFim:"", semPagamento:false };

  function filtrarVendas(){
    return vendas.filter(v=>{
      if(filtrosVendas.loja && v.loja!==filtrosVendas.loja) return false;
      if(filtrosVendas.dataIni && v.data < filtrosVendas.dataIni) return false;
      if(filtrosVendas.dataFim && v.data > filtrosVendas.dataFim) return false;
      if(filtrosVendas.busca){
        const q = filtrosVendas.busca.toLowerCase();
        if(!(v.cliente||"").toLowerCase().includes(q) && !(v.vendedora||"").toLowerCase().includes(q)) return false;
      }
      if(filtrosVendas.semPagamento && !semPagamentoLancado(v)) return false;
      return true;
    });
  }

  /** Lista combinada de O.S. + Vendas com um formato comum, usada na seção de Pagamentos. */
  function itensPagamentoCombinados(){
    const dasOrdens = ordensVisiveis().map(o=>({
      modulo:"O.S.", loja:nomeLojaDash(o.lojaId), data:o.data, cliente:o.cliente,
      valorTotal:o.valorTotal, pagamentos:o.pagamentos, momentoPagamento:o.momentoPagamento
    }));
    const dasVendas = vendas.map(v=>({
      modulo:"Vendas", loja:v.loja, data:v.data, cliente:v.cliente||v.vendedora,
      valorTotal:v.valorTotal, pagamentos:v.pagamentos, momentoPagamento:v.momentoPagamento
    }));
    return [...dasOrdens, ...dasVendas];
  }
  function filtrarPagamentos(){
    return itensPagamentoCombinados().filter(x=>{
      if(filtrosPagamentos.modulo && x.modulo!==filtrosPagamentos.modulo) return false;
      if(filtrosPagamentos.loja && x.loja!==filtrosPagamentos.loja) return false;
      if(filtrosPagamentos.dataIni && x.data < filtrosPagamentos.dataIni) return false;
      if(filtrosPagamentos.dataFim && x.data > filtrosPagamentos.dataFim) return false;
      if(filtrosPagamentos.semPagamento && !semPagamentoLancado(x)) return false;
      return true;
    });
  }

  function ordensVisiveis(){
    // rascunho nunca conta como "lançado" no dashboard
    return orders.filter(o=>o.status!=="rascunho");
  }

  function filtrarOrdens(){
    return ordensVisiveis().filter(o=>{
      if(filtrosOrdens.loja && o.lojaId!==filtrosOrdens.loja) return false;
      if(filtrosOrdens.status && o.status!==filtrosOrdens.status) return false;
      if(filtrosOrdens.servico && o.serviceTypeId!==filtrosOrdens.servico) return false;
      if(filtrosOrdens.dataIni && o.data < filtrosOrdens.dataIni) return false;
      if(filtrosOrdens.dataFim && o.data > filtrosOrdens.dataFim) return false;
      if(filtrosOrdens.busca && !(o.cliente||"").toLowerCase().includes(filtrosOrdens.busca.toLowerCase())) return false;
      return true;
    });
  }

  function filtrarTransf(){
    const todas = [
      ...transferencias.map(r=>({...r, __tipo:"Transferência", __status: computeStatusTransfer(r), __loja: r.lojaOrigem})),
      ...reposicoes.map(r=>({...r, __tipo:"Reposição", __status: computeStatusReposicao(r), __loja: r.loja})),
    ];
    return todas.filter(r=>{
      if(filtrosTransf.loja && r.__loja!==filtrosTransf.loja) return false;
      if(filtrosTransf.tipo && r.__tipo!==filtrosTransf.tipo) return false;
      if(filtrosTransf.status && r.__status!==filtrosTransf.status) return false;
      if(filtrosTransf.dataIni && r.data < filtrosTransf.dataIni) return false;
      if(filtrosTransf.dataFim && r.data > filtrosTransf.dataFim) return false;
      return true;
    });
  }

  /* Abas internas do Dashboard (só mostram/escondem blocos já montados). */

  /* ================= INTELIGÊNCIA (Curva ABC / avisos / metas / IA) ================= */
  const STATUS_ORCAMENTO_PADRAO_DASH = [
    { id:'pendente', nome:'Pendente', inicial:true, encerra:false },
    { id:'cutucado', nome:'Cutucado', inicial:false, encerra:false },
    { id:'aprovado', nome:'Aprovado', inicial:false, encerra:true },
    { id:'recusado', nome:'Recusado', inicial:false, encerra:true },
  ];
  /**
   * Nome de exibição da vendedora nos relatórios. Lançamento antigo foi salvo com o
   * nome completo e o novo com o apelido — sem normalizar, a mesma pessoa apareceria
   * em duas linhas. Aqui os dois viram o apelido atual do cadastro.
   */
  function nomeVendedoraNormalizado(nomeGravado){
    const alvo = String(nomeGravado||'').trim().toLowerCase();
    if(!alvo) return nomeGravado;
    const lista = (configCompleto && configCompleto.funcionarios) || [];
    const f = lista.find(x=> String(x.nome||'').trim().toLowerCase()===alvo || String(x.apelido||'').trim().toLowerCase()===alvo);
    if(!f) return nomeGravado;
    return (f.apelido||'').trim() || f.nome;
  }
  function statusListDash(){ return (configCompleto && configCompleto.statusOrcamento && configCompleto.statusOrcamento.length>0) ? configCompleto.statusOrcamento : STATUS_ORCAMENTO_PADRAO_DASH; }
  function statusInfoDeDash(id){ return statusListDash().find(s=>s.id===id) || statusListDash()[0]; }
  /** Métricas de orçamentos por vendedora: total, valor, contagem por status, e taxa de conversão (aprovado/total). */
  function metricasOrcamentosPorVendedora(){
    const map = {};
    orcamentos.forEach(o=>{
      const v = nomeVendedoraNormalizado(o.vendedora) || "Sem vendedora";
      if(!map[v]) map[v] = { total:0, valorTotal:0, porStatus:{}, aprovados:0, recusados:0 };
      map[v].total++;
      map[v].valorTotal += Number(o.valorTotal)||0;
      const info = statusInfoDeDash(o.status);
      const nomeStatus = info ? info.nome : (o.status||"—");
      map[v].porStatus[nomeStatus] = (map[v].porStatus[nomeStatus]||0) + 1;
      if(o.status==="aprovado") map[v].aprovados++;
      if(o.status==="recusado") map[v].recusados++;
    });
    return map;
  }
  function curvaAbcProdutos(){
    const totais = {};
    vendas.forEach(v=>{
      (v.itens||[]).forEach(it=>{
        if(!it.produto) return;
        const valor = (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0);
        totais[it.produto] = (totais[it.produto]||0) + valor;
      });
    });
    const lista = Object.entries(totais).map(([produto,total])=>({produto,total})).sort((a,b)=>b.total-a.total);
    const somaGeral = lista.reduce((acc,x)=>acc+x.total,0);
    let acumulado = 0;
    return lista.map(item=>{
      acumulado += item.total;
      const pctAcumulado = somaGeral>0 ? acumulado/somaGeral : 0;
      const classe = pctAcumulado<=0.8 ? "A" : pctAcumulado<=0.95 ? "B" : "C";
      return { ...item, classe, pctAcumulado };
    });
  }

  function curvaAbcVendedoras(){
    const totais = {};
    vendas.forEach(v=>{
      if(!v.vendedora) return;
      const nv = nomeVendedoraNormalizado(v.vendedora);
      totais[nv] = (totais[nv]||0) + (Number(v.valorTotal)||0);
    });
    orders.forEach(o=>{
      if(!o.vendedora) return;
      const no = nomeVendedoraNormalizado(o.vendedora);
      totais[no] = (totais[no]||0) + (Number(o.valorTotal)||0);
    });
    const lista = Object.entries(totais).map(([vendedora,total])=>({vendedora,total})).sort((a,b)=>b.total-a.total);
    const somaGeral = lista.reduce((acc,x)=>acc+x.total,0);
    let acumulado = 0;
    return lista.map(item=>{
      acumulado += item.total;
      const pctAcumulado = somaGeral>0 ? acumulado/somaGeral : 0;
      const classe = pctAcumulado<=0.8 ? "A" : pctAcumulado<=0.95 ? "B" : "C";
      return { ...item, classe, pctAcumulado };
    });
  }

  function avisosDadosIncompletos(){
    const avisos = [];
    orders.forEach(o=>{
      if(!o.telefone) avisos.push({ tipo:"O.S.", ref:o.via||o.id, problema:"Sem telefone do cliente" });
      if(o.emissaoNota==="sim"){
        if(!o.numeroNota) avisos.push({ tipo:"O.S.", ref:o.via||o.id, problema:"Marcou nota mas não tem número" });
        if(!o.lojaSaidaId || !o.lojaPagamentoId || !o.lojaNotaId) avisos.push({ tipo:"O.S.", ref:o.via||o.id, problema:"Nota sem as 3 empresas preenchidas" });
        else if(o.lojaPagamentoId !== o.lojaNotaId) avisos.push({ tipo:"O.S.", ref:o.via||o.id, problema:"Empresa do pagamento diferente da empresa da nota" });
      }
    });
    vendas.forEach(v=>{
      if(v.emissaoNota==="sim"){
        if(!v.numeroNota) avisos.push({ tipo:"Venda", ref:v.id, problema:"Marcou nota mas não tem número" });
        if(!v.lojaSaidaId || !v.lojaPagamentoId || !v.lojaNotaId) avisos.push({ tipo:"Venda", ref:v.id, problema:"Nota sem as 3 empresas preenchidas" });
        else if(v.lojaPagamentoId !== v.lojaNotaId) avisos.push({ tipo:"Venda", ref:v.id, problema:"Empresa do pagamento diferente da empresa da nota" });
      }
    });
    return avisos;
  }

  function totalDoMesPorLoja(){
    const hoje = new Date();
    const mesRef = hoje.toISOString().slice(0,7); // YYYY-MM
    const totais = {};
    orders.forEach(o=>{
      if((o.data||"").slice(0,7) !== mesRef) return;
      const nomeL = nomeLojaDash(o.lojaId);
      totais[nomeL] = (totais[nomeL]||0) + valorRecebidoDe(o);
    });
    vendas.forEach(v=>{
      if((v.data||"").slice(0,7) !== mesRef) return;
      totais[v.loja] = (totais[v.loja]||0) + valorRecebidoDe(v);
    });
    return totais;
  }

  /* ══════════════════════════════════════════════════════════════════════════
     VISÃO GERAL — painel de indicadores no topo do Dashboard (diretoria/gerente)
     Usa só os dados já carregados (vendas_pdv + ordens_servico): nada novo no banco.
     Vendas canceladas e O.S. em rascunho/canceladas ficam de fora; datas futuras
     (O.S. com data de entrega lançada à frente) também.
     ══════════════════════════════════════════════════════════════════════════ */
  let vgDias = 30;
  function vgDataStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  /** Valor curto para eixo de gráfico: R$ 2,5 mil · R$ 12 mil · R$ 1,2 mi. */
  function vgMoedaCurta(v){
    v = Number(v)||0;
    const n = (x, c)=> window.Fmt ? Fmt.num(x, c) : x.toFixed(c).replace(".", ",");
    const casas = x=> (Math.round(x*10)%10===0 ? 0 : 1);
    if(v >= 1000000) return "R$ " + n(v/1000000, casas(v/1000000)) + " mi";
    if(v >= 1000) return "R$ " + n(v/1000, v >= 10000 ? 0 : casas(v/1000)) + " mil";
    return "R$ " + n(v, 0);
  }
  function vgLojaDe(reg){
    const lojas = (configCompleto && configCompleto.lojas) || [];
    return lojas.find(l=> l.id === reg.lojaId) || lojas.find(l=> l.nome === reg.loja) || null;
  }
  function renderVisaoGeral(){

    if(!box) return;
    const hoje = new Date();
    const fim = vgDataStr(hoje);
    const iniD = new Date(hoje); iniD.setDate(iniD.getDate() - (vgDias-1));
    const ini = vgDataStr(iniD);
    const noPeriodo = d=> d && d >= ini && d <= fim;

    const vendasP = (vendas||[]).filter(v=> v.status !== "cancelada" && noPeriodo(v.data));
    const ordensP = ordensVisiveis().filter(o=> o.status !== "cancelado" && noPeriodo(o.data));
    const totVendas = vendasP.reduce((s,v)=> s + (Number(v.valorTotal)||0), 0);
    const totOrdens = ordensP.reduce((s,o)=> s + (Number(o.valorTotal)||0), 0);
    const total = totVendas + totOrdens;
    const ticket = vendasP.length ? totVendas / vendasP.length : 0;
    const osAbertas = ordensVisiveis().filter(o=> o.status !== "entregue" && o.status !== "cancelado").length;
    const aReceber = ordensVisiveis().filter(o=> o.status !== "cancelado").reduce((s,o)=> s + valorAReceberDe(o), 0)
                   + (vendas||[]).filter(v=> v.status !== "cancelada").reduce((s,v)=> s + valorAReceberDe(v), 0);

    // Série diária (vendas + O.S. empilhadas)
    const dias = [];
    for(let i=0;i<vgDias;i++){ const d = new Date(iniD); d.setDate(d.getDate()+i); dias.push({ data:vgDataStr(d), v:0, o:0 }); }
    const idx = {}; dias.forEach((d,i)=> idx[d.data] = i);
    vendasP.forEach(v=>{ if(idx[v.data]!==undefined) dias[idx[v.data]].v += Number(v.valorTotal)||0; });
    ordensP.forEach(o=>{ if(idx[o.data]!==undefined) dias[idx[o.data]].o += Number(o.valorTotal)||0; });

    // Por loja
    const porLoja = {};
    const somaLoja = (reg, valor)=>{
      const l = vgLojaDe(reg);
      const chave = l ? l.id : (reg.loja || reg.lojaId || "Sem loja");

      porLoja[chave].valor += valor;
    };
    vendasP.forEach(v=> somaLoja(v, Number(v.valorTotal)||0));
    ordensP.forEach(o=> somaLoja(o, Number(o.valorTotal)||0));
    const lojasLista = Object.values(porLoja).filter(x=> x.valor>0).sort((a,b)=> b.valor-a.valor);

    // Produtos mais vendidos (valor) no período
    const prod = {};

      if(!it.produto) return;
      prod[it.produto] = (prod[it.produto]||0) + (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0);
    }));
    const prodLista = Object.entries(prod).map(([nome,valor])=>({nome,valor})).filter(x=>x.valor>0).sort((a,b)=> b.valor-a.valor).slice(0,5);

    const barras = (lista, comLoja)=>{

          <div class="fundo"><div style="width:${Math.max(x.valor/max*100,2).toFixed(1)}%;"></div></div>
        </div>`).join("");
    };

    box.innerHTML = `
      <div class="vg-head">
        <div>
          <h2 class="section-title">Visão geral</h2>
          <p class="section-sub">${fmtDate(ini)} a ${fmtDate(fim)} · todas as lojas</p>
        </div>
        <div class="vg-periodo" role="group" aria-label="Período">
          ${[7,30,90].map(n=>`<button type="button" data-vg-dias="${n}" class="${n===vgDias?"active":""}" aria-pressed="${n===vgDias}">${n} dias</button>`).join("")}
        </div>
      </div>
      <div class="vg-kpis">
        <div class="vg-kpi"><div class="lbl">Movimento no período</div><div class="num" title="${escapeHtml(fmtMoeda(total))}">${fmtMoeda(total)}</div><div class="det">Vendas ${fmtMoeda(totVendas)} · O.S. ${fmtMoeda(totOrdens)}</div></div>
        <div class="vg-kpi"><div class="lbl">Vendas no PDV</div><div class="num">${fmtNum(vendasP.length)}</div><div class="det">Ticket médio ${fmtMoeda(ticket)}</div></div>
        <div class="vg-kpi${osAbertas?" alerta":""}"><div class="lbl">O.S. em aberto${osAbertas?` <span class="badge wait">Acompanhar</span>`:""}</div><div class="num">${fmtNum(osAbertas)}</div><div class="det">Ainda não entregues (todas as datas)</div></div>
        <div class="vg-kpi${aReceber>0?" alerta":""}"><div class="lbl">A receber${aReceber>0?` <span class="badge wait">Em aberto</span>`:""}</div><div class="num" title="${escapeHtml(fmtMoeda(aReceber))}">${fmtMoeda(aReceber)}</div><div class="det">Saldo de O.S. e vendas (todas as datas)</div></div>
      </div>

          <h3>Movimento por dia</h3>

    `;
    const grafBox = document.getElementById("vgGraficoBox");
    grafBox.innerHTML = vgGraficoDiario(dias, grafBox.clientWidth);
    box.querySelectorAll("[data-vg-dias]").forEach(b=> b.addEventListener("click", ()=>{
      vgDias = Number(b.dataset.vgDias) || 30;
      renderVisaoGeral();
    }));
  }
  /** Colunas empilhadas (vendas embaixo, O.S. em cima) em SVG puro, com escala única.
   *  largura = largura real do cartão em px (1 unidade do SVG = 1 px: o texto fica sempre legível). */
  function vgGraficoDiario(dias, largura){
    const total = dias.reduce((s,d)=> s + d.v + d.o, 0);
    if(total <= 0) return `<div class="vg-vazio">Nada lançado neste período. Troque para um período maior.</div>`;
    const W = Math.max(280, Math.round(largura || 640));
    const H = W < 480 ? 200 : 230, padL = 62, padR = 6, padT = 12, padB = 24;
    const areaW = W - padL - padR, areaH = H - padT - padB;
    const maxDia = Math.max(...dias.map(d=> d.v + d.o), 1);
    // topo "redondo" do eixo: 1 · 1,5 · 2 · 2,5 · 3 · 4 · 5 · 6 · 8 × potência de 10
    const pot = Math.pow(10, Math.floor(Math.log10(maxDia)));
    const topo = [1,1.5,2,2.5,3,4,5,6,8,10].map(m=> m*pot).find(x=> x >= maxDia);
    const y = v=> padT + areaH - (v/topo)*areaH;
    const passo = areaW / dias.length;
    const larg = Math.max(Math.min(passo * 0.68, 28), 1);
    let svg = "";
    [0.25, 0.75].forEach(f=>{
      const yy = y(topo*f);
      svg += `<line class="grade" x1="${padL}" x2="${W-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke-dasharray="2 4"/>`;
    });
    [0, 0.5, 1].forEach(f=>{
      const yy = y(topo*f);
      svg += `<line class="${f===0?"base":"grade"}" x1="${padL}" x2="${W-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>`;
      svg += `<text x="${padL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end">${escapeHtml(vgMoedaCurta(topo*f))}</text>`;
    });
    // quantos rótulos de data cabem (≈ 48 px cada), contando a partir do dia de hoje
    const cabem = Math.max(2, Math.floor(areaW / 48));
    const cadaRotulo = dias.length <= cabem ? 1 : [2,3,7,10,14,15,30].find(n=> Math.ceil(dias.length/n) <= cabem) || Math.ceil(dias.length/cabem);
    dias.forEach((d,i)=>{
      const x = padL + i*passo + (passo-larg)/2;
      const yV = y(d.v), yO = y(d.v + d.o);
      const dica = `${fmtDate(d.data)}\nVendas: ${fmtMoeda(d.v)}\nO.S.: ${fmtMoeda(d.o)}\nTotal: ${fmtMoeda(d.v + d.o)}`;
      svg += `<g class="dia"><title>${escapeHtml(dica)}</title>`;
      svg += `<rect class="alvo" x="${(padL + i*passo).toFixed(1)}" y="${padT}" width="${passo.toFixed(1)}" height="${areaH}"/>`;
      if(d.v > 0) svg += `<rect class="s-v" x="${x.toFixed(1)}" y="${yV.toFixed(1)}" width="${larg.toFixed(1)}" height="${Math.max(y(0)-yV, 0.5).toFixed(1)}" rx="1.5"/>`;
      if(d.o > 0) svg += `<rect class="s-o" x="${x.toFixed(1)}" y="${yO.toFixed(1)}" width="${larg.toFixed(1)}" height="${Math.max(yV-yO, 0.5).toFixed(1)}" rx="1.5"/>`;
      svg += `</g>`;
      if((dias.length-1-i) % cadaRotulo === 0){
        svg += `<text x="${(padL + i*passo + passo/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${escapeHtml(window.Fmt ? Fmt.dataCurta(d.data) : d.data.slice(8,10)+"/"+d.data.slice(5,7))}</text>`;
      }
    });
    return `<svg class="vg-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Movimento por dia: vendas e O.S. empilhadas, total ${escapeHtml(fmtMoeda(total))} no período">${svg}</svg>`;
  }

  /* ══════════════════════════════════════════════════════════════════════════
     COMPARATIVO POR LOJA — visão de rede para a diretoria
     Cada loja é um CNPJ próprio: mostra lado a lado faturamento, nº de vendas,
     ticket médio, O.S. abertas e orçamentos em aberto no mês corrente.
     ══════════════════════════════════════════════════════════════════════════ */
  function renderComparativoLojas(){
    const box = document.getElementById("secComparativoLojas");
    if(!box) return;
    const hojeD = new Date();
    const mesIni = `${hojeD.getFullYear()}-${String(hojeD.getMonth()+1).padStart(2,"0")}-01`;

    const lojas = (configCompleto && configCompleto.lojas) || [];
    if(lojas.length === 0){ box.innerHTML = ""; return; }

    const dados = lojas.map(l=>{
      const vLoja = (vendas||[]).filter(v=>
        v.status !== "cancelada" &&
        (v.lojaId === l.id || v.loja === l.nome) &&
        (v.data||"") >= mesIni && (v.data||"") <= mesFim
      );
      const fat = vLoja.reduce((s,v)=> s + (Number(v.valorTotal)||0), 0);
      const qtd = vLoja.length;
      const osAbertas = (orders||[]).filter(o=>
        (o.lojaId === l.id) && o.status !== "entregue" && o.status !== "cancelado"
      ).length;
      const orcAbertos = (orcamentos||[]).filter(o=>
        (o.lojaId === l.id) && o.status && !["aprovado","recusado"].includes(o.status)
      ).length;
      const semNota = vLoja.filter(v=> v.emissaoNota !== "sim").length;
      return { loja:l, fat, qtd, ticket: qtd ? fat/qtd : 0, osAbertas, orcAbertos, semNota };
    }).filter(d=> d.fat>0 || d.qtd>0 || d.osAbertas>0 || d.orcAbertos>0);

    if(dados.length === 0){ box.innerHTML = ""; return; }
    dados.sort((a,b)=> b.fat - a.fat);

            <span><b>${fmtNum(totalVendas)}</b> ${totalVendas===1?"venda":"vendas"}</span>
            <span>Ticket médio: <b>${fmtMoeda(totalVendas ? totalRede/totalVendas : 0)}</b></span>
          </div>
        </div>
        <div class="tabela-wrap" style="border-top:1px solid var(--line);">
        <table class="tbl">
          <thead>
            <tr>
              <th>Loja</th>
              <th class="r">Faturamento</th>
              <th class="r">Vendas</th>
              <th class="r">Ticket médio</th>
              <th class="r">O.S. abertas</th>
              <th class="r">Orç. abertos</th>
              <th class="r" title="Vendas do mês sem nota emitida">Sem nota</th>
            </tr>
          </thead>
          <tbody>
            ${dados.map(d=>`
            <tr>
              <td class="td-princ loja-cel">
                <span class="loja-dot" style="--c:${escapeHtml(d.loja.cor||"var(--accent)")}"></span><span class="sig">${escapeHtml(d.loja.abreviacao||"")}</span><span class="nm">${escapeHtml(d.loja.nome)}</span>
                <div class="trilho"><div style="width:${Math.round((d.fat/maxFat)*100)}%;"></div></div>
              </td>
              <td class="r forte" data-label="Faturamento">${fmtMoeda(d.fat)}</td>
              <td class="r" data-label="Vendas">${fmtNum(d.qtd)}</td>
              <td class="r" data-label="Ticket médio">${fmtMoeda(d.ticket)}</td>
              <td class="r" data-label="O.S. abertas">${d.osAbertas || "—"}</td>
              <td class="r" data-label="Orç. abertos">${d.orcAbertos || "—"}</td>
              <td class="r" data-label="Sem nota">${d.semNota ? `<span class="badge cancelado">${d.semNota}</span>` : "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  /**
   * Uma vez por dia (não a cada abertura do Dashboard, pra não gastar API à toa),
   * manda um resumo amplo do sistema pra IA analisar e apontar, se houver, UM ponto
   * que realmente mereça atenção da diretoria agora. Só roda pra quem tem acesso
   * financeiro (ou seja, só diretoria — essa função só é chamada de dentro da
   * seção de Inteligência, que já é diretoria-only).
   */
  async function verificarMonitoramentoIA(abc, abcVend, avisos, metas, totaisMes){
    const hoje = new Date().toISOString().slice(0,10);
    const chaveLocal = "vilaca_monitoramento_ia_ultimo_dia";
    try{
      if(localStorage.getItem(chaveLocal) === hoje) return; // já rodou hoje
    }catch(e){ /* localStorage indisponível — segue sem cache, sem travar nada */ }

    const metOrc = (typeof metricasOrcamentosPorVendedora === "function") ? metricasOrcamentosPorVendedora() : {};
    const resumoAmplo = {
      curvaAbcProdutosTop10: abc.slice(0,10).map(x=>({produto:x.produto, faturamento:x.total, classe:x.classe})),
      curvaAbcVendedoras: abcVend.map(x=>({vendedora:x.vendedora, faturamento:x.total, classe:x.classe})),
      avisosDadosIncompletos: { total: avisos.length, exemplos: avisos.slice(0,5) },
      metasDoMes: Object.keys(metas).map(loja=>({ loja, meta: metas[loja], atual: totaisMes[loja]||0 })),
      orcamentosPorVendedora: Object.keys(metOrc).map(nome=>({ vendedora:nome, ...metOrc[nome] })),
      totalDeVendasRegistradas: vendas.length,
      totalDeOrdensRegistradas: orders.length,
      dataDeHoje: hoje,
    };
    try{
      const res = await fetch("https://wxiokmqnjtgbejgoepch.supabase.co/functions/v1/gemini-agente", {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, modo:"monitoramento", resumoDados: resumoAmplo }),
      });
      const data = await res.json();
      try{ localStorage.setItem(chaveLocal, hoje); }catch(e){}
      if(data && data.temAlerta){
        const popup = document.createElement("div");
        popup.className = "alerta-meta-popup";
        popup.innerHTML = `
          <b>${ico("info")} ${escapeHtml(data.titulo || "A IA encontrou algo")}</b>
          ${escapeHtml(data.mensagem || "")}
          <br><button id="btnFecharAlertaIA">Entendi</button>
        `;
        document.body.appendChild(popup);
        document.getElementById("btnFecharAlertaIA").addEventListener("click", ()=> popup.remove());
      }
    }catch(e){
      console.error("monitoramento IA falhou (silencioso, não atrapalha o resto do dashboard):", e);
    }
  }

  let alertaDeMetasJaMostrado = false;
  /** Mostra um aviso (uma vez por sessão) se alguma loja estiver bem atrás do ritmo esperado da meta do mês. */
  function verificarAlertaDeMetas(metas, totaisMes, fracaoDoMes){
    if(alertaDeMetasJaMostrado) return;
    const lojas = (ordersConfig && ordersConfig.lojas) || [];
    const atrasadas = lojas.filter(l=>{
      const meta = Number(metas[l.nome])||0;
      if(meta<=0) return false;
      const pctAtual = (totaisMes[l.nome]||0) / meta;
      return pctAtual < fracaoDoMes - 0.15; // mais de 15 pontos percentuais atrás do esperado
    });
    if(atrasadas.length===0) return;
    alertaDeMetasJaMostrado = true;
    const popup = document.createElement("div");
    popup.className = "alerta-meta-popup";
    popup.innerHTML = `
      <b>${ico("alerta")} Meta do mês fora do ritmo</b>
      ${atrasadas.map(l=>`${escapeHtml(l.nome)}`).join(", ")} ${atrasadas.length===1?"está":"estão"} abaixo do ritmo para bater a meta deste mês. Veja em Análises › Metas do mês.
      <br><button id="btnFecharAlertaMeta">Entendi</button>
    `;
    document.body.appendChild(popup);
    document.getElementById("btnFecharAlertaMeta").addEventListener("click", ()=> popup.remove());
  }

        <p class="sub-titulo">Por loja</p>
        <div style="margin-bottom:20px;">${barrasHtml(itensLoja, fmtMoeda)}</div>
        <p class="sub-titulo">Por vendedora</p>
        <div>${barrasHtml(itensVend, fmtMoeda)}</div>
        <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharGrafico">Fechar</button></div>
      `);
      document.getElementById("btnFecharGrafico").addEventListener("click", closeModal);
    });

    atualizar();
  }

  function renderSecaoTransf(){
    const el = document.getElementById("secTransf");
    const lojas = (transfConfig && transfConfig.stores) || [];

    el.innerHTML = `
      <div class="sec-head">
        <div>
          <h2 class="section-title">Transferências e reposições</h2>
          <p class="section-sub">Movimento de peças entre as lojas e a situação de cada registro.</p>
        </div>
        <button class="btn btn-ghost btn-sm btn-grafico" id="btnGraficoTransf">${ico("grafico")} Ver gráfico</button>
      </div>
      <div class="kpis" id="kpisTransf"></div>
      <div class="filters" role="search" aria-label="Filtros de transferências">
        <label class="f"><span>Loja</span><select id="tLoja"><option value="">Todas as lojas</option>${lojas.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("")}</select></label>
        <label class="f"><span>Tipo</span><select id="tTipo"><option value="">Transferência e reposição</option><option value="Transferência">Só transferência</option><option value="Reposição">Só reposição</option></select></label>
        <label class="f"><span>Situação</span><select id="tStatus"><option value="">Todas</option><option value="OK">OK</option><option value="ERRO">Pendência</option><option value="JUST">Justificado</option><option value="PEND">Em aberto</option></select></label>
        <label class="f"><span>De</span><input type="date" id="tDataIni" title="De"></label>
        <label class="f"><span>Até</span><input type="date" id="tDataFim" title="Até"></label>
        <button class="btn btn-ghost btn-sm limpar" id="btnLimparFiltroTransf">${ico("x")} Limpar filtros</button>
      </div>
      <div class="card"><div id="tabelaTransf"></div></div>
    `;
    document.getElementById("tLoja").value = filtrosTransf.loja;
    document.getElementById("tTipo").value = filtrosTransf.tipo;
    document.getElementById("tStatus").value = filtrosTransf.status;
    document.getElementById("tDataIni").value = filtrosTransf.dataIni;
    document.getElementById("tDataFim").value = filtrosTransf.dataFim;

    function atualizar(){
      const lista = filtrarTransf();
      const kpisWrap = document.getElementById("kpisTransf");
      const total = lista.length;
      const ok = lista.filter(r=>r.__status==="OK").length;
      const erro = lista.filter(r=>r.__status==="ERRO").length;
      const just = lista.filter(r=>r.__status==="JUST").length;

      kpisWrap.innerHTML = `
        ${kpiHtml("Total", fmtNum(total))}
        ${kpiHtml("OK", fmtNum(ok), "ok")}
        ${kpiHtml("Pendência", fmtNum(erro), "danger")}
        ${kpiHtml("Justificado", fmtNum(just), "just")}
      `;

      const wrap = document.getElementById("tabelaTransf");
      if(lista.length===0){ wrap.innerHTML = vazioHtml("Nenhum registro com esses filtros.", "Troque a loja, o tipo ou as datas, ou clique em Limpar filtros."); return; }
      const listaOrdenada = [...lista].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
      wrap.innerHTML = `
        <div class="tabela-wrap">
        <table class="tbl">
          <thead><tr><th>Tipo</th><th>Data</th><th>Loja</th><th>Solicitante</th><th>Situação</th></tr></thead>
          <tbody>
            ${listaOrdenada.slice(0,200).map(r=>`
              <tr>
                <td class="td-princ">${escapeHtml(r.__tipo)}</td>
                <td data-label="Data">${fmtDate(r.data)}</td>
                <td data-label="Loja">${escapeHtml(r.__loja||"—")}</td>
                <td data-label="Solicitante">${escapeHtml(r.solicitante||"—")}</td>
                <td data-label="Situação"><span class="badge ${r.__status==="OK"?"ok":r.__status==="ERRO"?"erro":r.__status==="JUST"?"just":"wait"}">${escapeHtml(STATUS_TRANSF_LABEL[r.__status]||r.__status)}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        </div>
        ${listaOrdenada.length>200?`<div class="tbl-nota">Mostrando os 200 mais recentes de ${fmtNum(listaOrdenada.length)}. Use os filtros para achar os outros.</div>`:""}
      `;
    }

    document.getElementById("tLoja").addEventListener("change", e=>{ filtrosTransf.loja=e.target.value; atualizar(); });
    document.getElementById("tTipo").addEventListener("change", e=>{ filtrosTransf.tipo=e.target.value; atualizar(); });
    document.getElementById("tStatus").addEventListener("change", e=>{ filtrosTransf.status=e.target.value; atualizar(); });
    document.getElementById("tDataIni").addEventListener("change", e=>{ filtrosTransf.dataIni=e.target.value; atualizar(); });
    document.getElementById("tDataFim").addEventListener("change", e=>{ filtrosTransf.dataFim=e.target.value; atualizar(); });
    document.getElementById("btnLimparFiltroTransf").addEventListener("click", ()=>{
      filtrosTransf = { loja:"", tipo:"", status:"", dataIni:"", dataFim:"" };
      renderSecaoTransf();
    });
    document.getElementById("btnGraficoTransf").addEventListener("click", ()=>{
      const lista = filtrarTransf();
      const porStatus = {}, porLoja = {};
      const labelStatus = { OK:"OK", ERRO:"Pendência", JUST:"Justificado", PEND:"Em aberto" };
      lista.forEach(r=>{
        const s = labelStatus[r.__status] || r.__status || "—"; porStatus[s]=(porStatus[s]||0)+1;
        const l = r.__loja || "—"; porLoja[l]=(porLoja[l]||0)+1;
      });
      const itensStatus = Object.entries(porStatus).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
      const itensLoja = Object.entries(porLoja).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
      openModal(`
        <h3 class="modal-titulo">Transferências e reposições</h3>
        <p class="modal-sub">${fmtNum(lista.length)} ${lista.length===1?"registro":"registros"}, com os filtros atuais</p>
        <p class="sub-titulo">Por situação</p>
        <div style="margin-bottom:20px;">${barrasHtml(itensStatus)}</div>
        <p class="sub-titulo">Por loja</p>
        <div>${barrasHtml(itensLoja)}</div>
        <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharGrafico">Fechar</button></div>
      `);
      document.getElementById("btnFecharGrafico").addEventListener("click", closeModal);
    });

    atualizar();
  }
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
