<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Gestão e Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#151C28; --ink-soft:#4B5563; --ink-faint:#8B93A1;
    --line:#D7DCE2; --accent:#662344; --accent-ink:#4A1830; --accent-soft:#FDD49E;
    --ok:#188A54; --ok-soft:#D7F3E3;
    --danger:#C4272B; --danger-soft:#FADADA;
    --wait:#B8650A; --wait-soft:#FBE6C7;
    --just:#6425C9; --just-soft:#E9DBFA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* login */
  #view-login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px 28px; box-shadow:0 12px 32px -18px rgba(20,30,45,0.25); }
  .login-tag{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:8px; }
  .login-title{ font-size:20px; font-weight:750; margin:0 0 4px; }
  .login-sub{ color:var(--ink-soft); font-size:13px; margin:0 0 22px; line-height:1.5; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--surface-2); color:var(--ink); }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .btn{ border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:700; }
  .btn-primary{ background:var(--ink); color:#fff; width:100%; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .login-error{ background:var(--danger-soft); color:var(--danger); font-size:12.5px; padding:9px 11px; border-radius:7px; margin-bottom:12px; display:none; }
  .login-error.show{ display:block; }
  .back-link{ display:inline-block; font-size:12px; font-weight:700; color:var(--ink-soft); text-decoration:none; margin-bottom:16px; }

  /* dashboard shell */
  #view-dashboard{ display:none; }
  header.topbar{
    background:var(--ink); color:#fff; padding:0 20px; height:56px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:0; z-index:20;
  }
  header.topbar a{ color:rgba(255,255,255,.7); text-decoration:none; font-size:13px; font-weight:700; }
  .who{ font-size:12.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:10px; }
  .level-pill{ font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.04em; background:rgba(255,255,255,.14); padding:3px 9px; border-radius:20px; }
  main{ max-width:1120px; margin:0 auto; padding:24px 18px 60px; }

  .section{ margin-bottom:36px; }
  .section-title{ font-size:17px; font-weight:750; margin:0 0 4px; }
  .section-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .kpi .num{ font-size:22px; font-weight:800; }
  .kpi .lbl{ font-size:11px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }
  .kpi.ok .num{ color:var(--ok); } .kpi.wait .num{ color:var(--wait); } .kpi.danger .num{ color:var(--danger); } .kpi.just .num{ color:var(--just); } .kpi.accent .num{ color:var(--accent-ink); }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .filters select, .filters input{ padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:12.5px; background:var(--surface); color:var(--ink); }
  .filters input[type="text"]{ min-width:160px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow-x:auto; box-shadow:0 2px 10px -4px rgba(43,15,31,0.07); }
  .modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .btn-grafico{background:var(--surface-2, #F7E9DA); border:1px solid var(--line); color:var(--accent-ink); border-radius:8px; padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .btn-grafico:hover{background:var(--line);}
  .barra-grafico-linha{margin-bottom:10px;}
  .barra-grafico-linha .rotulo{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;}
  .barra-grafico-fundo{background:var(--surface-2, #F7E9DA); border-radius:6px; height:14px; overflow:hidden;}
  .barra-grafico-preenchimento{height:100%; border-radius:6px; background:var(--accent);}
  .card-title{ display:block; font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:750; padding:10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  .badge{ display:inline-block; font-size:10.5px; font-weight:750; padding:3px 8px; border-radius:20px; }
  .badge.aguardando, .badge.wait{ background:var(--wait-soft); color:var(--wait); }
  .badge.pronto, .badge.ok{ background:var(--ok-soft); color:var(--ok); }
  .badge.entregue{ background:#D9E6FB; color:#1257C4; }
  .badge.cancelado, .badge.erro{ background:var(--danger-soft); color:var(--danger); }
  .badge.rascunho{ background:#EDEFF2; color:#6B7280; }
  .badge.just{ background:var(--just-soft); color:var(--just); }
  .empty{ text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13px; }
  .locked-note{ background:var(--accent-soft); color:var(--accent-ink); padding:11px 13px; border-radius:8px; font-size:12.5px; margin-bottom:16px; }
  .alerta-rh-banner{ border-radius:10px; padding:13px 16px; margin-bottom:16px; font-size:13px; line-height:1.6; }
  .alerta-rh-urgente{ background:#FBE7E5; color:#B3261E; border:1px solid #f2b8b5; }
  .alerta-rh-atencao{ background:#FFF4DE; color:#8A5A00; border:1px solid #f2d99b; }
  .alerta-rh-aviso{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .alerta-rh-banner b{ display:block; margin-bottom:4px; }
  .alerta-rh-banner ul{ margin:0; padding-left:18px; }
  html.embedded #view-login{ display:none !important; }
  html.embedded header.topbar{ display:none !important; }
  .alerta-meta-popup{ position:fixed; top:18px; right:18px; max-width:360px; background:#fff; border:1px solid var(--danger); border-left:5px solid var(--danger); border-radius:10px; padding:14px 16px; box-shadow:0 20px 45px -18px rgba(0,0,0,0.35); z-index:80; font-size:13px; }
  .alerta-meta-popup b{ display:block; margin-bottom:4px; color:var(--danger); }
  .alerta-meta-popup button{ background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:5px 10px; font-size:12px; margin-top:8px; cursor:pointer; }
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="back-link">← Gestão e Controle</a>
    <div class="login-tag">Dashboard</div>
    <div class="login-title">Acessar painel geral</div>
    <p class="login-sub">Use a mesma senha do Painel de Ordens. O que você vê aqui depende do seu nível de acesso.</p>
    <div class="login-error" id="loginError">Senha não encontrada.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary" id="btnLogin">Entrar</button>
  </div>
</div>

<div id="view-dashboard">
  <header class="topbar">
    <a href="index.html">← Gestão e Controle</a>
    <div class="who">
      <span id="whoName"></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="btn btn-ghost" id="btnLogout" style="padding:5px 10px; background:rgba(179,38,30,0.18); color:#ffb3ac;">🚪 Sair</button>
    </div>
  </header>
  <main id="mainContent"></main>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

  // A partir daqui o app não fala mais direto com o banco: tudo passa pela Edge
  // Function "db-gateway", que exige a senha de um acesso válido.
  let __gatewaySenha = null;
  async function gatewayCall(body){
    try{
      const res = await fetch(GATEWAY_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, ...body }),
      });
      return await res.json();
    }catch(e){
      console.error("erro ao falar com o servidor", e);
      return { error: "Não foi possível conectar. Verifique sua internet." };
    }
  }
  async function gatewayLogin(senhaTentativa){
    return gatewayCall({ op:"login", senha: senhaTentativa });
  }
  const supabaseClient = {
    from(table){
      return {
        select(){
          return {
            eq(column, value){
              return {
                maybeSingle: async ()=>{
                  if(table === "gestao_config" && column === "id" && value === "config"){
                    const r = await gatewayCall({ op:"getConfig" });
                    if(r.error) return { data:null, error:r.error };
                    return { data: { payload: r.data }, error: null };
                  }
                  return gatewayCall({ op:"selectOne", table, params:{ column, value } });
                }
              };
            },
            order(){ return gatewayCall({ op:"selectAll", table }); }
          };
        },
        upsert(row){
          if(table === "gestao_config"){
            return gatewayCall({ op:"saveConfig", params:{ payload: row.payload } });
          }
          return gatewayCall({ op:"upsert", table, params:{ row } });
        },
        delete(){
          return { eq: (column, value)=> gatewayCall({ op:"delete", table, params:{ column, value } }) };
        }
      };
    }
  };

  let currentUser = null; // { nome, nivel }
  let configCompleto = null;
  let ordersConfig = null;
  let orders = [];
  let dpFuncionariosCache = null;

  /** Carrega o perfil de RH dos funcionários (dp_funcionarios) — só usado pelo alerta de RH, diretoria/gerente. */
  async function dpFuncionariosGetDash(){
    if(dpFuncionariosCache !== null) return dpFuncionariosCache;
    try{
      const { data, error } = await supabaseClient.from("dp_funcionarios").select("id,payload").order("created_at",{ascending:true});
      if(error) throw error;
      dpFuncionariosCache = (data||[]).map(r=>r.payload);
    }catch(e){ console.error("erro ao carregar perfis de RH", e); dpFuncionariosCache = []; }
    return dpFuncionariosCache;
  }
  function diasEntre(dataFutura){
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const alvo = new Date(dataFutura+"T00:00:00");
    return Math.round((alvo - hoje) / 86400000);
  }
  function somarDias(dataStr, dias){
    const d = new Date(dataStr+"T00:00:00");
    d.setDate(d.getDate() + Number(dias||0));
    return d.toISOString().slice(0,10);
  }
  /**
   * Monta o banner de alertas de RH no topo do Dashboard: avisa 60/30/10 dias antes de um
   * funcionário completar 1 ano de registro (direito a férias), e 10/5/1 dias antes de vencer
   * cada período de experiência (a CLT permite até 2). Só diretoria/gerente veem isso.
   */
  async function renderAlertasRH(){
    const el = document.getElementById("secAlertasRH");
    if(!el) return;
    const funcionariosRH = await dpFuncionariosGetDash();
    const ativos = funcionariosRH.filter(f=>f.status!=="desligado");

    const alertasFerias = [];
    ativos.forEach(f=>{
      if(!f.dataAdmissao) return;
      const umAno = somarDias(f.dataAdmissao, 365);
      const dias = diasEntre(umAno);
      if(dias>=0 && dias<=60) alertasFerias.push({ nome:f.nome, dias });
    });

    const alertasExperiencia = [];
    ativos.forEach(f=>{
      [[f.experiencia1Data,f.experiencia1Dias,"1"],[f.experiencia2Data,f.experiencia2Dias,"2"]].forEach(([data,duracao,numero])=>{
        if(!data || !duracao) return;
        const vencimento = somarDias(data, duracao);
        const dias = diasEntre(vencimento);
        if(dias>=0 && dias<=10) alertasExperiencia.push({ nome:f.nome, dias, numero });
      });
    });

    if(alertasFerias.length===0 && alertasExperiencia.length===0){ el.innerHTML = ""; return; }

    function classeUrgencia(dias, limiarUrgente, limiarAtencao){
      if(dias<=limiarUrgente) return "alerta-rh-urgente";
      if(dias<=limiarAtencao) return "alerta-rh-atencao";
      return "alerta-rh-aviso";
    }
    let html = "";
    if(alertasFerias.length>0){
      alertasFerias.sort((a,b)=>a.dias-b.dias);
      const maisUrgente = alertasFerias[0];
      html += `
        <div class="alerta-rh-banner ${classeUrgencia(maisUrgente.dias,10,30)}">
          <b>🏖️ Férias — completando 1 ano de registro</b>
          <ul>${alertasFerias.map(a=>`<li>${escapeHtml(a.nome)} — ${a.dias===0?"completa hoje":`em ${a.dias} dia(s)`}</li>`).join("")}</ul>
        </div>
      `;
    }
    if(alertasExperiencia.length>0){
      alertasExperiencia.sort((a,b)=>a.dias-b.dias);
      const maisUrgente = alertasExperiencia[0];
      html += `
        <div class="alerta-rh-banner ${classeUrgencia(maisUrgente.dias,1,5)}">
          <b>⏳ Período de experiência vencendo</b>
          <ul>${alertasExperiencia.map(a=>`<li>${escapeHtml(a.nome)} — experiência ${a.numero} ${a.dias===0?"vence hoje":`vence em ${a.dias} dia(s)`}</li>`).join("")}</ul>
        </div>
      `;
    }
    el.innerHTML = html;
  }

  let transfConfig = null;
  let transferencias = [];
  let reposicoes = [];
  let vendas = [];
  let orcamentos = [];
  let gastosDash = [];

  function escapeHtml(s){ return (s===null||s===undefined?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtDate(s){ if(!s) return "—"; const p=s.split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
  function fmtMoeda(v){ return "R$ " + (Number(v)||0).toFixed(2).replace(".", ","); }
  function valorRecebidoDe(o){ return (o.pagamentos||[]).reduce((acc,p)=> acc + (Number(p.valor)||0), 0); }
  function valorAReceberDe(o){ return Math.max(0, (Number(o.valorTotal)||0) - valorRecebidoDe(o)); }
  function semPagamentoLancado(o){ return !o.valorTotal && (!o.pagamentos || o.pagamentos.length===0); }

  /* ================= MODAL DE GRÁFICO (reutilizável em qualquer seção) ================= */
  function closeModal(){
    document.getElementById("modalOverlay").classList.remove("show");
    document.getElementById("modalBox").innerHTML = "";
    if(history.state && history.state.modalAberto) history.back();
  }
  function openModal(html){
    document.getElementById("modalBox").innerHTML = html;
    document.getElementById("modalOverlay").classList.add("show");
    history.pushState({ modalAberto:true }, "");
  }
  window.addEventListener("popstate", ()=>{
    const overlay = document.getElementById("modalOverlay");
    if(overlay && overlay.classList.contains("show")) history.pushState({ modalAberto:true }, "");
  });
  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){
      const overlay = document.getElementById("modalOverlay");
      if(overlay && overlay.classList.contains("show")){ e.preventDefault(); e.stopPropagation(); }
    }
  });
  /**
   * Gráfico de barra horizontal simples (sem biblioteca externa), pra comparar itens.
   * itens: [{ nome, valor }], formatoValor: função opcional pra formatar o número exibido.
   */
  function barrasHtml(itens, formatoValor){
    if(!itens || itens.length===0) return `<p style="color:var(--ink-faint,#8A6A78); font-size:13px;">Sem dados suficientes ainda.</p>`;
    const fmt = formatoValor || (v=> (Number(v)||0).toLocaleString("pt-BR"));
    const max = Math.max(...itens.map(i=>Number(i.valor)||0), 1);
    return itens.map(i=>{
      const pct = Math.max((Number(i.valor)||0)/max*100, 2);
      return `
        <div class="barra-grafico-linha">
          <div class="rotulo"><span>${escapeHtml(i.nome)}</span><span><b>${fmt(i.valor)}</b></span></div>
          <div class="barra-grafico-fundo"><div class="barra-grafico-preenchimento" style="width:${pct}%;"></div></div>
        </div>
      `;
    }).join("");
  }
  /** Abre o modal já com o título e o gráfico de barras montado a partir de uma lista de {nome, valor}. */
  function abrirGraficoBarras(titulo, subtitulo, itens, formatoValor){
    openModal(`
      <h3 style="margin:0 0 4px;">📊 ${escapeHtml(titulo)}</h3>
      ${subtitulo ? `<p style="color:var(--muted,#7A5A68); font-size:13px; margin:0 0 16px;">${escapeHtml(subtitulo)}</p>` : ''}
      <div>${barrasHtml(itens, formatoValor)}</div>
      <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharGrafico">Fechar</button></div>
    `);
    document.getElementById("btnFecharGrafico").addEventListener("click", closeModal);
  }

  /* ================= LOGIN ================= */
  /* ================= MODO EMBUTIDO ================= */
  const EMBEDDED = window.self !== window.top;
  if(EMBEDDED){
    document.documentElement.classList.add("embedded");
    window.addEventListener("message", async (ev)=>{
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === "auth"){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user ? ev.data.user.senha : null;
        try{
          const { data } = await supabaseClient.from("gestao_config").select("payload").eq("id","config").maybeSingle();
          const unificado = data ? data.payload : null;
          configCompleto = unificado;
          ordersConfig = unificado ? { lojas: unificado.lojas||[], serviceTypes: unificado.tiposServico||[], users: unificado.users||[] } : null;
          transfConfig = unificado ? { stores: (unificado.lojas||[]).map(l=>l.abreviacao) } : { stores: [] };
        }catch(e){ console.error("Erro ao carregar config no dashboard embutido:", e); }
        await loadAllData();
        enterDashboard();
        parent.postMessage({ type:"tabs", modulo:"dashboard", tabs: [], active: null }, "*");
      }
    });
    parent.postMessage({ type:"ready", modulo:"dashboard" }, "*");
  }

  document.getElementById("btnLogin").addEventListener("click", doLogin);
  document.getElementById("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

  async function doLogin(){
    const pass = document.getElementById("loginPass").value.trim();
    const err = document.getElementById("loginError");
    const btn = document.getElementById("btnLogin");
    if(!pass) return;
    err.classList.remove("show");
    btn.disabled = true;
    try{
      const r = await gatewayLogin(pass);
      if(!r || !r.ok){ err.classList.add("show"); return; }
      __gatewaySenha = pass;
      currentUser = { nome: r.user.nome, nivel: r.user.nivel };
      const { data } = await supabaseClient.from("gestao_config").select("payload").eq("id","config").maybeSingle();
      const unificado = data ? data.payload : null;
      configCompleto = unificado;
      ordersConfig = unificado ? { lojas: unificado.lojas||[], serviceTypes: unificado.tiposServico||[], users: unificado.users||[] } : null;
      transfConfig = unificado ? { stores: (unificado.lojas||[]).map(l=>l.abreviacao) } : { stores: [] };
      await loadAllData();
      enterDashboard();
    }catch(e){
      console.error("Erro no login do dashboard:", e);
      err.textContent = "Não foi possível verificar a senha agora. Tente novamente.";
      err.classList.add("show");
    }finally{
      btn.disabled = false;
    }
  }

  document.getElementById("btnLogout").addEventListener("click", ()=>{
    currentUser = null;

  /* ================= LÓGICA DE STATUS (Transferências/Reposição) — mesma regra do app original ================= */
  function stepDone(visto, nome, data){
    if(!visto) return false;
    if(nome !== undefined && String(nome||"").trim()==="") return false;
    if(data !== undefined && String(data||"").trim()==="") return false;
    return true;
  }
  function multisetEqual(a,b){
    if(a.length!==b.length) return false;
    const sa=[...a].sort(), sb=[...b].sort();
    return JSON.stringify(sa)===JSON.stringify(sb);
  }
  function sumByProduto(items, withFator){
    const map = new Map();
    (items||[]).forEach(it=>{
      if(!it.produto || it.quantidade==="" || it.quantidade===null || it.quantidade===undefined) return;
      if(!map.has(it.produto)) map.set(it.produto, {qty:0, fatores:[]});
      const e = map.get(it.produto);
      e.qty += Number(it.quantidade);
      if(withFator && it.fator && String(it.fator).trim()!=="") e.fatores.push(String(it.fator).trim());
    });
    return map;
  }
  function sumVendaByProduto(items){
    const map = new Map();
    (items||[]).forEach(it=>{
      if(!it.produto) return;
      const qtdLoja = it.qtdLoja===""||it.qtdLoja===null||it.qtdLoja===undefined?0:Number(it.qtdLoja);
      const qtdEco = it.qtdEcommerce===""||it.qtdEcommerce===null||it.qtdEcommerce===undefined?0:Number(it.qtdEcommerce);
      if(it.qtdLoja==="" && it.qtdEcommerce==="") return;
      if(!map.has(it.produto)) map.set(it.produto, {qty:0, fatores:[]});
      map.get(it.produto).qty += qtdLoja+qtdEco;
    });
    return map;
  }
  function computeStatusTransfer(r){
    if(!r.tipoTransf) return "PEND";
    const itemsValid = (r.transferItens||[]).some(it=>it.produto && it.quantidade!=="" && it.quantidade!==null && it.quantidade!==undefined);
    const stepSaida = stepDone(r.vistoSaida, r.nomeSaida, r.dataSaida);
    const stepEntrada = stepDone(r.vistoEntrada, r.nomeEntrada, r.dataEntrada);
    const stepRetornoSaida = r.tipoTransf==="TROCA" ? stepDone(r.vistoRetornoSaida, r.nomeRetornoSaida, r.dataRetornoSaida) : true;
    const stepRetornoEntrada = r.tipoTransf==="TROCA" ? stepDone(r.vistoRetornoEntrada, r.nomeRetornoEntrada, r.dataRetornoEntrada) : true;
    const stepBaixa = r.tipoTransf==="SAÍDA" ? stepDone(r.vistoBaixaEstoque, r.nomeBaixaEstoque, r.dataBaixaEstoque) : true;
    const stepEntradaEstoque = r.tipoTransf==="SAÍDA" ? stepDone(r.vistoEntradaEstoque, r.nomeEntradaEstoque, r.dataEntradaEstoque) : true;
    const stepSup = stepDone(r.vistoDiretoria, r.nomeDiretoria, r.dataDiretoria);
    if(itemsValid && stepSaida && stepEntrada && stepRetornoSaida && stepRetornoEntrada && stepBaixa && stepEntradaEstoque && stepSup) return "OK";
    return "ERRO";
  }
  function computeStatusReposicao(r){
    const pedidoMap = sumByProduto(r.pedidoItens, false);
    if(pedidoMap.size===0) return "PEND";
    const vendaMap = sumVendaByProduto(r.vendaItens);
    const dispMap = sumByProduto(r.disponibilizadoItens, true);
    const recMap = sumByProduto(r.recebimentoItens, true);
    let divergente = false;
    pedidoMap.forEach((v,produto)=>{ if(vendaMap.has(produto) && vendaMap.get(produto).qty!==v.qty) divergente = true; });
    const dispProdutos = new Set([...dispMap.keys(), ...recMap.keys()]);
    dispProdutos.forEach(produto=>{
      if(dispMap.has(produto) && recMap.has(produto)){
        const d=dispMap.get(produto), rr=recMap.get(produto);
        if(d.qty!==rr.qty || !multisetEqual(d.fatores, rr.fatores)) divergente = true;
      }
    });
    const stepDir = stepDone(r.vistoDiretoria, r.nomeDiretoria, r.dataDiretoria);
    const stepAdm = stepDone(r.vistoAdministrativo, r.nomeAdministrativo, r.dataAdministrativo);
    const stepRecLoja = stepDone(r.vistoRecebimentoLoja, r.nomeRecebimentoLoja, r.dataRecebimentoLoja);
    const stepSist = stepDone(r.vistoSistema, r.nomeSistema, r.dataSistema);
    const allDone = stepDir && stepAdm && stepRecLoja && stepSist;
    if(!divergente && allDone) return "OK";
    const justOk = r.justificativa && r.justificativa.trim()!=="" && stepDone(r.vistoDiretoriaCorrecao, r.nomeDiretoriaCorrecao, r.dataDiretoriaCorrecao);
    if(divergente && justOk) return "JUST";
    return "ERRO";
  }

  /* ================= RENDER ================= */
  let filtrosOrdens = { loja:"", status:"", servico:"", dataIni:"", dataFim:"", busca:"" };

  function filtrarVendas(){
    return vendas.filter(v=>{
      if(filtrosVendas.loja && v.loja!==filtrosVendas.loja) return false;
      if(filtrosVendas.dataIni && v.data < filtrosVendas.dataIni) return false;
      if(filtrosVendas.dataFim && v.data > filtrosVendas.dataFim) return false;
      if(filtrosVendas.busca){
        const q = filtrosVendas.busca.toLowerCase();
        if(!(v.cliente||"").toLowerCase().includes(q) && !(v.vendedora||"").toLowerCase().includes(q)) return false;
      }
      if(filtrosVendas.semPagamento && !semPagamentoLancado(v)) return false;
      return true;
    });
  }

  /** Lista combinada de O.S. + Vendas com um formato comum, usada na seção de Pagamentos. */
  function itensPagamentoCombinados(){
    const dasOrdens = ordensVisiveis().map(o=>({
      modulo:"O.S.", loja:o.loja, data:o.data, cliente:o.cliente,
      valorTotal:o.valorTotal, pagamentos:o.pagamentos, momentoPagamento:o.momentoPagamento
    }));
    const dasVendas = vendas.map(v=>({
      modulo:"Vendas", loja:v.loja, data:v.data, cliente:v.cliente||v.vendedora,
      valorTotal:v.valorTotal, pagamentos:v.pagamentos, momentoPagamento:v.momentoPagamento
    }));
    return [...dasOrdens, ...dasVendas];
  }
  function filtrarPagamentos(){
    return itensPagamentoCombinados().filter(x=>{
      if(filtrosPagamentos.modulo && x.modulo!==filtrosPagamentos.modulo) return false;
      if(filtrosPagamentos.loja && x.loja!==filtrosPagamentos.loja) return false;
      if(filtrosPagamentos.dataIni && x.data < filtrosPagamentos.dataIni) return false;
      if(filtrosPagamentos.dataFim && x.data > filtrosPagamentos.dataFim) return false;
      if(filtrosPagamentos.semPagamento && !semPagamentoLancado(x)) return false;
      return true;
    });
  }

  function ordensVisiveis(){
    // rascunho nunca conta como "lançado" no dashboard
    return orders.filter(o=>o.status!=="rascunho");

  function filtrarOrdens(){
    return ordensVisiveis().filter(o=>{
      if(filtrosOrdens.loja && o.loja!==filtrosOrdens.loja) return false;
      if(filtrosOrdens.status && o.status!==filtrosOrdens.status) return false;

      if(filtrosOrdens.dataIni && o.data < filtrosOrdens.dataIni) return false;
      if(filtrosOrdens.dataFim && o.data > filtrosOrdens.dataFim) return false;
      if(filtrosOrdens.busca && !(o.cliente||"").toLowerCase().includes(filtrosOrdens.busca.toLowerCase())) return false;
      return true;

  function filtrarTransf(){
    const todas = [
      ...transferencias.map(r=>({...r, __tipo:"Transferência", __status: computeStatusTransfer(r), __loja: r.lojaOrigem})),
      ...reposicoes.map(r=>({...r, __tipo:"Reposição", __status: computeStatusReposicao(r), __loja: r.loja})),

  /* ================= INTELIGÊNCIA (Curva ABC / avisos / metas / IA) ================= */
  const STATUS_ORCAMENTO_PADRAO_DASH = [
    { id:'pendente', nome:'Pendente', inicial:true, encerra:false },
    { id:'cutucado', nome:'Cutucado', inicial:false, encerra:false },
    { id:'aprovado', nome:'Aprovado', inicial:false, encerra:true },
    { id:'recusado', nome:'Recusado', inicial:false, encerra:true },
  ];
  /**
   * Nome de exibição da vendedora nos relatórios. Lançamento antigo foi salvo com o
   * nome completo e o novo com o apelido — sem normalizar, a mesma pessoa apareceria
   * em duas linhas. Aqui os dois viram o apelido atual do cadastro.
   */
  function nomeVendedoraNormalizado(nomeGravado){
    const alvo = String(nomeGravado||'').trim().toLowerCase();
    if(!alvo) return nomeGravado;
    const lista = (configCompleto && configCompleto.funcionarios) || [];
    const f = lista.find(x=> String(x.nome||'').trim().toLowerCase()===alvo || String(x.apelido||'').trim().toLowerCase()===alvo);
    if(!f) return nomeGravado;
    return (f.apelido||'').trim() || f.nome;
  }
  function statusListDash(){ return (configCompleto && configCompleto.statusOrcamento && configCompleto.statusOrcamento.length>0) ? configCompleto.statusOrcamento : STATUS_ORCAMENTO_PADRAO_DASH; }
  function statusInfoDeDash(id){ return statusListDash().find(s=>s.id===id) || statusListDash()[0]; }
  /** Métricas de orçamentos por vendedora: total, valor, contagem por status, e taxa de conversão (aprovado/total). */
  function metricasOrcamentosPorVendedora(){
    const map = {};
    orcamentos.forEach(o=>{
      const v = nomeVendedoraNormalizado(o.vendedora) || "Sem vendedora";
      if(!map[v]) map[v] = { total:0, valorTotal:0, porStatus:{}, aprovados:0, recusados:0 };
      map[v].total++;
      map[v].valorTotal += Number(o.valorTotal)||0;
      const info = statusInfoDeDash(o.status);
      const nomeStatus = info ? info.nome : (o.status||"—");
      map[v].porStatus[nomeStatus] = (map[v].porStatus[nomeStatus]||0) + 1;
      if(o.status==="aprovado") map[v].aprovados++;
      if(o.status==="recusado") map[v].recusados++;
    });
    return map;
  }
  function curvaAbcProdutos(){
    const totais = {};
    vendas.forEach(v=>{
      (v.itens||[]).forEach(it=>{
        if(!it.produto) return;
        const valor = (Number(it.quantidade)||0) * (Number(it.valorUnitario)||0);
        totais[it.produto] = (totais[it.produto]||0) + valor;
      });
    });
    const lista = Object.entries(totais).map(([produto,total])=>({produto,total})).sort((a,b)=>b.total-a.total);
    const somaGeral = lista.reduce((acc,x)=>acc+x.total,0);
    let acumulado = 0;
    return lista.map(item=>{
      acumulado += item.total;
      const pctAcumulado = somaGeral>0 ? acumulado/somaGeral : 0;
      const classe = pctAcumulado<=0.8 ? "A" : pctAcumulado<=0.95 ? "B" : "C";
      return { ...item, classe, pctAcumulado };
    });
  }

  function curvaAbcVendedoras(){
    const totais = {};
    vendas.forEach(v=>{
      if(!v.vendedora) return;
      const nv = nomeVendedoraNormalizado(v.vendedora);
      totais[nv] = (totais[nv]||0) + (Number(v.valorTotal)||0);
    });
    orders.forEach(o=>{
      if(!o.vendedora) return;
      const no = nomeVendedoraNormalizado(o.vendedora);
      totais[no] = (totais[no]||0) + (Number(o.valorTotal)||0);
    });
    const lista = Object.entries(totais).map(([vendedora,total])=>({vendedora,total})).sort((a,b)=>b.total-a.total);
    const somaGeral = lista.reduce((acc,x)=>acc+x.total,0);
    let acumulado = 0;
    return lista.map(item=>{
      acumulado += item.total;
      const pctAcumulado = somaGeral>0 ? acumulado/somaGeral : 0;
      const classe = pctAcumulado<=0.8 ? "A" : pctAcumulado<=0.95 ? "B" : "C";
      return { ...item, classe, pctAcumulado };
    });
  }

      if(!configCompleto){ alert("Configuração ainda não carregada."); return; }

      try{
        const { error } = await supabaseClient.from("gestao_config").upsert({ id:"config", payload });
        if(error) throw error;
        configCompleto = payload;
        renderMetasLista();

  /**
   * Uma vez por dia (não a cada abertura do Dashboard, pra não gastar API à toa),
   * manda um resumo amplo do sistema pra IA analisar e apontar, se houver, UM ponto
   * que realmente mereça atenção da diretoria agora. Só roda pra quem tem acesso
   * financeiro (ou seja, só diretoria — essa função só é chamada de dentro da
   * seção de Inteligência, que já é diretoria-only).
   */
  async function verificarMonitoramentoIA(abc, abcVend, avisos, metas, totaisMes){
    const hoje = new Date().toISOString().slice(0,10);
    const chaveLocal = "vilaca_monitoramento_ia_ultimo_dia";
    try{
      if(localStorage.getItem(chaveLocal) === hoje) return; // já rodou hoje
    }catch(e){ /* localStorage indisponível — segue sem cache, sem travar nada */ }

    const metOrc = (typeof metricasOrcamentosPorVendedora === "function") ? metricasOrcamentosPorVendedora() : {};
    const resumoAmplo = {
      curvaAbcProdutosTop10: abc.slice(0,10).map(x=>({produto:x.produto, faturamento:x.total, classe:x.classe})),
      curvaAbcVendedoras: abcVend.map(x=>({vendedora:x.vendedora, faturamento:x.total, classe:x.classe})),
      avisosDadosIncompletos: { total: avisos.length, exemplos: avisos.slice(0,5) },
      metasDoMes: Object.keys(metas).map(loja=>({ loja, meta: metas[loja], atual: totaisMes[loja]||0 })),
      orcamentosPorVendedora: Object.keys(metOrc).map(nome=>({ vendedora:nome, ...metOrc[nome] })),
      totalDeVendasRegistradas: vendas.length,
      totalDeOrdensRegistradas: orders.length,
      dataDeHoje: hoje,
    };
    try{
      const res = await fetch("https://wxiokmqnjtgbejgoepch.supabase.co/functions/v1/gemini-agente", {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, modo:"monitoramento", resumoDados: resumoAmplo }),
      });
      const data = await res.json();
      try{ localStorage.setItem(chaveLocal, hoje); }catch(e){}
      if(data && data.temAlerta){
        const popup = document.createElement("div");
        popup.className = "alerta-meta-popup";
        popup.innerHTML = `
          <b>🧠 ${escapeHtml(data.titulo || "A IA encontrou algo")}</b>
          ${escapeHtml(data.mensagem || "")}
          <br><button id="btnFecharAlertaIA">Entendi</button>
        `;
        document.body.appendChild(popup);
        document.getElementById("btnFecharAlertaIA").addEventListener("click", ()=> popup.remove());
      }
    }catch(e){
      console.error("monitoramento IA falhou (silencioso, não atrapalha o resto do dashboard):", e);
    }
  }

  let alertaDeMetasJaMostrado = false;
  /** Mostra um aviso (uma vez por sessão) se alguma loja estiver bem atrás do ritmo esperado da meta do mês. */
  function verificarAlertaDeMetas(metas, totaisMes, fracaoDoMes){
    if(alertaDeMetasJaMostrado) return;
    const lojas = (ordersConfig && ordersConfig.lojas) || [];
    const atrasadas = lojas.filter(l=>{
      const meta = Number(metas[l.nome])||0;
      if(meta<=0) return false;
      const pctAtual = (totaisMes[l.nome]||0) / meta;
      return pctAtual < fracaoDoMes - 0.15; // mais de 15 pontos percentuais atrás do esperado
    });
    if(atrasadas.length===0) return;
    alertaDeMetasJaMostrado = true;
    const popup = document.createElement("div");
    popup.className = "alerta-meta-popup";
    popup.innerHTML = `
      <b>⚠️ Meta do mês fora do ritmo</b>
      ${atrasadas.map(l=>`${escapeHtml(l.nome)}`).join(", ")} ${atrasadas.length===1?"está":"estão"} abaixo do ritmo esperado pra bater a meta esse mês.
      <br><button id="btnFecharAlertaMeta">Entendi</button>
    `;
    document.body.appendChild(popup);
    document.getElementById("btnFecharAlertaMeta").addEventListener("click", ()=> popup.remove());
  }

      const total = lista.length;
      const recebido = lista.reduce((acc,v)=> acc + valorRecebidoDe(v), 0);
      const aReceber = lista.reduce((acc,v)=> acc + valorAReceberDe(v), 0);

      document.getElementById("kpisVendas").innerHTML = `
        <div class="kpi"><div class="num">${total}</div><div class="lbl">Vendas</div></div>
        ${mostraFinanceiro ? `<div class="kpi ok"><div class="num">${fmtMoeda(recebido)}</div><div class="lbl">Recebido</div></div>` : ""}
        ${mostraFinanceiro ? `<div class="kpi danger"><div class="num">${fmtMoeda(aReceber)}</div><div class="lbl">A receber</div></div>` : ""}
      `;

      const wrap = document.getElementById("tabelaVendas");
      if(lista.length===0){ wrap.innerHTML = `<div class="empty">Nenhuma venda encontrada com esses filtros.</div>`; return; }
      const ordenada = [...lista].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
      wrap.innerHTML = `
        <table>
          <thead><tr><th>Data</th><th>Loja</th><th>Vendedora</th><th>Cliente</th>${mostraFinanceiro?"<th>Recebido</th><th>A receber</th>":""}</tr></thead>
          <tbody>
            ${ordenada.slice(0,200).map(v=>`
              <tr>
                <td>${fmtDate(v.data)}</td>
                <td>${escapeHtml(v.loja||"—")}</td>
                <td>${escapeHtml(v.vendedora||"—")}</td>
                <td>${escapeHtml(v.cliente||"—")}${semPagamentoLancado(v) ? `<div style="margin-top:3px; color:var(--danger); font-weight:750; font-size:10.5px;">⚠ Sem pagamento lançado</div>` : ""}</td>
                ${mostraFinanceiro?`<td>${fmtMoeda(valorRecebidoDe(v))}</td><td>${valorAReceberDe(v)>0?`<b style="color:var(--danger);">${fmtMoeda(valorAReceberDe(v))}</b>`:fmtMoeda(0)}</td>`:""}
              </tr>
            `).join("")}
          </tbody>
        </table>
        ${ordenada.length>200?`<div class="empty">Mostrando as 200 mais recentes de ${ordenada.length}.</div>`:""}
      `;
    }

    document.getElementById("vLoja").addEventListener("change", e=>{ filtrosVendas.loja=e.target.value; atualizar(); });
    document.getElementById("vDataIni").addEventListener("change", e=>{ filtrosVendas.dataIni=e.target.value; atualizar(); });
    document.getElementById("vDataFim").addEventListener("change", e=>{ filtrosVendas.dataFim=e.target.value; atualizar(); });
    document.getElementById("vBusca").addEventListener("input", e=>{ filtrosVendas.busca=e.target.value; atualizar(); });
    document.getElementById("vSemPagamento").addEventListener("change", e=>{ filtrosVendas.semPagamento=e.target.checked; atualizar(); });
    document.getElementById("btnLimparFiltroVendas").addEventListener("click", ()=>{
      filtrosVendas = { loja:"", dataIni:"", dataFim:"", busca:"", semPagamento:false };
      renderSecaoVendas(mostraFinanceiro);
    });
    document.getElementById("btnGraficoVendas").addEventListener("click", ()=>{
      const porLoja = {}, porVendedora = {};
      vendas.forEach(v=>{
        const l=v.loja||"—"; porLoja[l]=(porLoja[l]||0)+(Number(v.valorTotal)||0);
        const vd=nomeVendedoraNormalizado(v.vendedora)||"—"; porVendedora[vd]=(porVendedora[vd]||0)+(Number(v.valorTotal)||0);
      });
      const itensLoja = Object.entries(porLoja).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
      const itensVend = Object.entries(porVendedora).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
      openModal(`
        <h3 style="margin:0 0 4px;">📊 Vendas (PDV)</h3>
        <p style="color:var(--muted,#7A5A68); font-size:13px; margin:0 0 14px;">Faturamento total: ${fmtMoeda(vendas.reduce((a,v)=>a+(Number(v.valorTotal)||0),0))}</p>
        <b style="font-size:12.5px;">Por loja</b>
        <div style="margin-top:8px; margin-bottom:18px;">${barrasHtml(itensLoja, fmtMoeda)}</div>
        <b style="font-size:12.5px;">Por vendedora</b>
        <div style="margin-top:8px;">${barrasHtml(itensVend, fmtMoeda)}</div>
        <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharGrafico">Fechar</button></div>
      `);
      document.getElementById("btnFecharGrafico").addEventListener("click", closeModal);
    });

    atualizar();
  }

  function renderSecaoTransf(){
    const el = document.getElementById("secTransf");
    const lojas = (transfConfig && transfConfig.stores) || [];

    el.innerHTML = `
      <h2 class="section-title">🔁 Transferências e Reposições <button class="btn-grafico" id="btnGraficoTransf">📊 Ver gráfico</button></h2>
      <p class="section-sub">Dados do app de Transferências e Reposições entre lojas.</p>
      <div class="kpis" id="kpisTransf"></div>
      <div class="filters">
        <select id="tLoja"><option value="">Todas as lojas</option>${lojas.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("")}</select>
        <select id="tTipo"><option value="">Transferência e Reposição</option><option value="Transferência">Só Transferência</option><option value="Reposição">Só Reposição</option></select>
        <select id="tStatus"><option value="">Todos os status</option><option value="OK">OK</option><option value="ERRO">Pendência</option><option value="JUST">Justificado</option><option value="PEND">Em aberto</option></select>
        <input type="date" id="tDataIni" title="De">
        <input type="date" id="tDataFim" title="Até">
        <button class="btn btn-ghost" id="btnLimparFiltroTransf">Limpar</button>
      </div>
      <div class="card"><div id="tabelaTransf"></div></div>
    `;

    function atualizar(){
      const lista = filtrarTransf();
      const kpisWrap = document.getElementById("kpisTransf");
      const total = lista.length;
      const ok = lista.filter(r=>r.__status==="OK").length;
      const erro = lista.filter(r=>r.__status==="ERRO").length;
      const just = lista.filter(r=>r.__status==="JUST").length;

      kpisWrap.innerHTML = `
        <div class="kpi"><div class="num">${total}</div><div class="lbl">Total</div></div>
        <div class="kpi ok"><div class="num">${ok}</div><div class="lbl">OK</div></div>
        <div class="kpi danger"><div class="num">${erro}</div><div class="lbl">Pendência</div></div>
        <div class="kpi just"><div class="num">${just}</div><div class="lbl">Justificado</div></div>
      `;

      const wrap = document.getElementById("tabelaTransf");
      if(lista.length===0){ wrap.innerHTML = `<div class="empty">Nenhum registro encontrado com esses filtros.</div>`; return; }
      const listaOrdenada = [...lista].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
      wrap.innerHTML = `
        <table>
          <thead><tr><th>Tipo</th><th>Data</th><th>Loja</th><th>Solicitante</th><th>Status</th></tr></thead>
          <tbody>
            ${listaOrdenada.slice(0,200).map(r=>`
              <tr>
                <td>${escapeHtml(r.__tipo)}</td>
                <td>${fmtDate(r.data)}</td>
                <td>${escapeHtml(r.__loja||"—")}</td>
                <td>${escapeHtml(r.solicitante||"—")}</td>
                <td><span class="badge ${r.__status==="OK"?"ok":r.__status==="ERRO"?"erro":r.__status==="JUST"?"just":"wait"}">${r.__status}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        ${listaOrdenada.length>200?`<div class="empty">Mostrando os 200 mais recentes de ${listaOrdenada.length}.</div>`:""}
      `;
    }

    document.getElementById("tLoja").addEventListener("change", e=>{ filtrosTransf.loja=e.target.value; atualizar(); });
    document.getElementById("tTipo").addEventListener("change", e=>{ filtrosTransf.tipo=e.target.value; atualizar(); });
    document.getElementById("tStatus").addEventListener("change", e=>{ filtrosTransf.status=e.target.value; atualizar(); });
    document.getElementById("tDataIni").addEventListener("change", e=>{ filtrosTransf.dataIni=e.target.value; atualizar(); });
    document.getElementById("tDataFim").addEventListener("change", e=>{ filtrosTransf.dataFim=e.target.value; atualizar(); });
    document.getElementById("btnLimparFiltroTransf").addEventListener("click", ()=>{
      filtrosTransf = { loja:"", tipo:"", status:"", dataIni:"", dataFim:"" };
      renderSecaoTransf();
    });
    document.getElementById("btnGraficoTransf").addEventListener("click", ()=>{
      const lista = filtrarTransf();
      const porStatus = {}, porLoja = {};
      const labelStatus = { OK:"OK", ERRO:"Pendência", JUST:"Justificado", PEND:"Em aberto" };
      lista.forEach(r=>{
        const s = labelStatus[r.__status] || r.__status || "—"; porStatus[s]=(porStatus[s]||0)+1;
        const l = r.__loja || "—"; porLoja[l]=(porLoja[l]||0)+1;
      });
      const itensStatus = Object.entries(porStatus).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
      const itensLoja = Object.entries(porLoja).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
      openModal(`
        <h3 style="margin:0 0 4px;">📊 Transferências e Reposições</h3>
        <p style="color:var(--muted,#7A5A68); font-size:13px; margin:0 0 14px;">${lista.length} registros (considerando os filtros atuais)</p>
        <b style="font-size:12.5px;">Por status</b>
        <div style="margin-top:8px; margin-bottom:18px;">${barrasHtml(itensStatus)}</div>
        <b style="font-size:12.5px;">Por loja</b>
        <div style="margin-top:8px;">${barrasHtml(itensLoja)}</div>
        <div class="modal-actions"><button class="btn btn-ghost" id="btnFecharGrafico">Fechar</button></div>
      `);
      document.getElementById("btnFecharGrafico").addEventListener("click", closeModal);
    });

    atualizar();
  }
})();
</script>
</body>
</html>
