<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departamento Pessoal · Vilaça Joias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* Cores: só variáveis do sistema (tema.css). Nada de hex aqui — o tema escuro depende disso. */
:root{ --dp-sobre-marinho:rgba(255,255,255,.92); --dp-sobre-marinho-fraco:rgba(255,255,255,.62); --dp-marinho-hover:rgba(255,255,255,.10); }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--t-font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
svg.ic, .btn svg, .btn-icone svg{flex-shrink:0;}

/* ---------- entrada avulsa (fora do app) ---------- */
.hub-back-link{color:var(--dp-sobre-marinho-fraco); text-decoration:none; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
.hub-back-link:hover{color:var(--dp-sobre-marinho);}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--t-dark);}
.login-card{background:var(--surface); border-radius:16px; padding:32px 28px; max-width:380px; width:100%; box-shadow:var(--t-shadow-lg);}
.login-card .hub-back-link{color:var(--ink-faint);}
.login-tag{font-size:13px; font-weight:600; color:var(--accent); margin:14px 0 6px;}
.login-title{font-size:22px; letter-spacing:-.015em; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:14px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 20px; background:var(--t-dark); color:var(--dp-sobre-marinho); flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:4px; flex-wrap:wrap;}
.tabs button{background:transparent; color:var(--dp-sobre-marinho-fraco); border:none; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600;}
.tabs button:hover{background:var(--dp-marinho-hover); color:var(--dp-sobre-marinho);}
.tabs button.active{background:var(--dp-marinho-hover); color:var(--dp-sobre-marinho); box-shadow:inset 0 -2px 0 var(--dp-sobre-marinho);}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{display:inline-flex; align-items:center; background:var(--surface-2); color:var(--ink-soft); padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;}
.topbar .level-pill{background:var(--dp-marinho-hover); color:var(--dp-sobre-marinho);}
.level-pill.loja{background:var(--accent-soft); color:var(--accent);}
.icon-btn{background:none; border:none; color:inherit; cursor:pointer; padding:6px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center;}
.icon-btn:hover{background:var(--dp-marinho-hover);}
.icon-btn-sair{color:var(--dp-sobre-marinho);}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--t-dark); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40; overflow-x:auto;}
  .mobile-tabbar button{flex:1 0 64px; background:none; border:none; color:var(--dp-sobre-marinho-fraco); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; min-height:44px;}
  .mobile-tabbar button.active{color:var(--dp-sobre-marinho); font-weight:700;}
  .mt-icon{display:inline-flex;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}

/* ---------- página ---------- */
#mainContent{max-width:1120px; margin:0 auto; padding:24px 24px 90px;}
html.embedded #mainContent{padding-bottom:40px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap; margin-bottom:16px;}
.page-head > div:first-child{min-width:0; flex:1 1 320px;}
.page-title{font-size:20px; letter-spacing:-.015em; font-weight:700; margin:0 0 4px; color:var(--ink);}
.page-sub{color:var(--muted); font-size:13.5px; margin:0; max-width:72ch;}
.page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.card{background:var(--surface); border-radius:12px; padding:16px 20px; margin-bottom:16px; border:1px solid var(--line); box-shadow:var(--t-shadow-sm);}
.card.sem-pad{padding:0;}
.section-label{font-size:15px; font-weight:600; color:var(--ink); margin:0 0 12px; letter-spacing:-.005em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.section-label .muted{font-weight:400; font-size:13px;}
.muted{color:var(--muted); font-size:13px;}
.dica{color:var(--muted); font-size:12.5px; margin:4px 0 0; line-height:1.45;}
.empty{color:var(--ink-faint); font-size:13.5px; padding:20px 4px; text-align:center;}
.estado{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:28px 16px; color:var(--ink-faint); font-size:13.5px;}
.estado b{color:var(--ink); font-size:14.5px;}
.estado .ic-estado{width:40px; height:40px; border-radius:50%; background:var(--surface-2); color:var(--ink-faint); display:inline-flex; align-items:center; justify-content:center; margin-bottom:4px;}
.estado.carregando .ic-estado{animation:dpGira 1.2s linear infinite;}
@keyframes dpGira{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){ .estado.carregando .ic-estado{animation:none;} }

/* ---------- campos ---------- */
.field{margin-bottom:12px; min-width:0;}
.field > label, .field label.rot{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:none; letter-spacing:0;}
.field label .muted, .field label .opc{font-weight:400; color:var(--muted);}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea{width:100%; padding:9px 11px; font-size:14px; min-height:38px;}
.field textarea{resize:vertical; min-height:72px;}
input[type=text], input[type=number], input[type=password], input[type=date], input[type=month], input[type=email], input:not([type]), select{padding:8px 10px; font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 14px;}
.span-2{grid-column:1 / -1;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.tel-par{display:flex; gap:6px;}
.tel-par input:first-child{width:58px !important; flex:0 0 58px;}
.campo-com-botoes{display:flex; gap:6px; align-items:center;}
.campo-com-botoes select{flex:1;}

/* caixas de marcar (funções, lojas, módulos) */
.cargo-checks{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.cargo-checks > label{display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer; text-transform:none; letter-spacing:0; margin:0; min-height:36px; transition:border-color .15s, background-color .15s;}
.cargo-checks > label:hover{border-color:var(--accent);}
.cargo-checks > label:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
.cargo-checks > label:has(input:disabled){cursor:not-allowed; opacity:.75;}
.cargo-checks input{margin:0;}
.cargo-checks.lista{flex-direction:column; align-items:stretch; gap:6px;}
.cargo-checks.lista > label{border:0; padding:4px 0; min-height:0; background:none !important;}

/* ---------- botões ---------- */
.btn{border:1px solid var(--line); border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap; line-height:1.2;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:13px;}
.btn.perigo, .btn-ghost.perigo{color:var(--danger);}
html[data-ds] .btn.perigo:hover{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
.acoes-linha{display:flex; gap:4px; align-items:center; justify-content:flex-end; flex-wrap:nowrap;}
.barra-acoes{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px;}
.barra-acoes .esp{flex:1;}

/* ---------- selos ---------- */
.badge, .chip{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; line-height:1.5; white-space:nowrap; vertical-align:middle;}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-wait{background:var(--wait-soft); color:var(--wait);}
.badge-erro{background:var(--danger-soft); color:var(--danger);}
.badge-info{background:var(--t-info-soft); color:var(--info);}
.badge-loja, .badge-neutro, .chip{background:var(--surface-2); color:var(--ink-soft);}
.chip.chip-erro{background:var(--danger-soft); color:var(--danger);}

/* ---------- filtros ---------- */
.filters{display:flex; gap:10px 12px; flex-wrap:wrap; margin-bottom:16px; align-items:flex-end;}
.filters .field{margin-bottom:0;}
.filtro-barra{padding:12px 16px;}

/* ---------- tabelas ---------- */
.tabela-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:10px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
th span{text-transform:none; letter-spacing:0;}
td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tfoot th{color:var(--ink); font-size:13px; text-transform:none; letter-spacing:0; border-top:1px solid var(--line-strong); border-bottom:0;}
td.r, th.r, .r{text-align:right;}
td.r, th.r{white-space:nowrap;}
td.acoes, th.acoes{text-align:right; width:1%; white-space:nowrap;}
td .sub{display:block; color:var(--muted); font-size:12px; margin-top:2px;}
tr.linha-atencao > td{background:var(--wait-soft);}
.neg{color:var(--danger);}
.nome-func{font-weight:600; color:var(--ink);}
.apelido{color:var(--muted); font-weight:400;}
/* no celular, listas viram cartões */
@media (max-width:760px){
  #mainContent{padding:16px 12px 90px;}
  .card{padding:14px;}
  table.tabela-cartoes, table.tabela-cartoes tbody, table.tabela-cartoes tr, table.tabela-cartoes td{display:block; width:100%;}
  table.tabela-cartoes thead{display:none;}
  table.tabela-cartoes tr{padding:12px 0; border-bottom:1px solid var(--line);}
  table.tabela-cartoes tbody tr:last-child{border-bottom:0;}
  table.tabela-cartoes td{border:0; padding:3px 0; display:flex; justify-content:space-between; gap:12px; text-align:right;}
  table.tabela-cartoes td::before{content:attr(data-label); color:var(--muted); font-size:12px; font-weight:600; text-align:left; flex-shrink:0;}
  table.tabela-cartoes td.cel-titulo{display:block; text-align:left; font-size:14.5px; padding-bottom:6px;}
  table.tabela-cartoes td.cel-titulo::before, table.tabela-cartoes td.acoes::before{content:none;}
  table.tabela-cartoes td.acoes{justify-content:flex-start; width:100%; padding-top:8px;}
  table.tabela-cartoes td.acoes .acoes-linha{justify-content:flex-start; flex-wrap:wrap;}
  table.tabela-cartoes td.empty{display:block; text-align:center;}
  table.tabela-cartoes td.empty::before{content:none;}
  html[data-ds] table.tabela-cartoes tbody tr:hover > td{background:transparent;}
  .page-head > div:first-child{flex:0 0 auto;}
  .page-actions > .btn{flex:1 1 auto;}
}

/* ---------- avisos em faixa ---------- */
.aviso-faixa{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--wait-soft); color:var(--ink); margin-bottom:16px; font-size:13.5px; border:1px solid transparent;}
.aviso-faixa > svg{color:var(--wait); margin-top:1px;}
.aviso-faixa.perigo{background:var(--danger-soft);}
.aviso-faixa.perigo > svg{color:var(--danger);}
.aviso-faixa.info{background:var(--accent-soft);}
.aviso-faixa.info > svg{color:var(--accent);}
.aviso-faixa .btn{margin-left:auto;}
.texto-perigo{color:var(--danger); font-size:12.5px; margin-top:6px;}

/* ---------- lista de perfis de acesso ---------- */
.code-list-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
.code-list-item:first-child{padding-top:2px;}
.code-list-item:last-child{border-bottom:0;}
.perfil-topo{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px;}
.perfil-chips{margin-top:8px; display:flex; gap:5px; flex-wrap:wrap;}

/* módulos e abas (popup de acesso) */
.mod-lista{border:1px solid var(--line); border-radius:10px; padding:4px 14px; max-height:46vh; overflow:auto;}
.mod-item{padding:10px 0; border-bottom:1px solid var(--line);}
.mod-item:last-child{border-bottom:0;}
.mod-lista-alta{max-height:52vh;}
.grp-mod{padding:4px 0;}
.grp-mod > header{display:flex; align-items:center; justify-content:space-between; gap:8px; position:sticky; top:0; z-index:1; background:var(--surface); padding:8px 0 6px; border-bottom:1px solid var(--line);}
.grp-mod > header h4{margin:0; font-size:12px; letter-spacing:.04em; color:var(--ink-faint); font-weight:700;}
.grp-acoes{display:flex; gap:6px;}
.mod-item.ajustado{background:var(--wait-soft); border-radius:8px; padding-left:8px; padding-right:8px;}
.cargo-checks > label.ajustado{border-color:var(--wait); background:var(--wait-soft);}
.tag-ajuste{display:inline-block; padding:1px 8px; border-radius:999px; background:var(--wait-soft); color:var(--wait); font-size:11.5px; font-weight:700;}
.barra-pers{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 8px; flex-wrap:wrap;}
.pers-linha{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 10px;}
.mod-item > label{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; color:var(--ink); cursor:pointer;}
.mod-abas{margin:8px 0 2px 26px;}
.atd-perfil{margin:8px 0 2px 26px; display:flex; flex-direction:column; gap:8px;}
.atd-perfil label.rot-atd{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.atd-perfil select{display:block; margin-top:4px; width:100%; max-width:100%;}

/* ---------- popups ---------- */
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); padding:11px 18px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s var(--t-ease), transform .2s var(--t-ease); z-index:90; max-width:calc(100vw - 32px);}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:720px; width:100%; max-height:90vh; overflow:auto; padding:22px 24px 0;}
.modal > :last-child:not(.modal-actions):not(.modal-foot){margin-bottom:22px;}
.modal-head{margin:0 0 14px;}
.modal-head h2{font-size:18px; font-weight:700; letter-spacing:-.015em; margin:0; color:var(--ink); padding-right:24px;}
.modal-head p{margin:4px 0 0; color:var(--muted); font-size:13px;}
.modal-body{min-width:0;}
.modal-actions, .modal-foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; position:sticky; bottom:0; z-index:2; background:var(--surface); margin:18px -24px 0; padding:14px 24px 16px; border-top:1px solid var(--line);}
.modal .mini-tabs{margin-bottom:16px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.bloco{padding:16px 0; border-top:1px solid var(--line);}
.bloco:first-child{border-top:0; padding-top:0;}
.bloco > h3{font-size:14.5px; font-weight:600; margin:0 0 10px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.bloco.risco{border:1px solid var(--danger); border-radius:10px; padding:14px; margin-top:12px; background:var(--danger-soft);}
.bloco.risco > h3{color:var(--danger);}
.caixa-alerta{border:1px solid var(--danger); background:var(--danger-soft); border-radius:10px; padding:12px 14px; margin:10px 0;}
.caixa-alerta p{margin:0 0 8px; color:var(--ink); font-size:13px;}
.foto-func{width:84px; height:84px; border-radius:50%; object-fit:cover; border:1px solid var(--line); cursor:pointer;}
.foto-vazia{width:84px; height:84px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
.foto-lightbox-overlay{position:fixed; inset:0; background:rgba(8,20,30,.82); display:none; align-items:center; justify-content:center; z-index:80; padding:24px;}
.foto-lightbox-overlay.show{display:flex;}
.foto-lightbox-box{position:relative; max-width:min(90vw,560px); max-height:88vh;}
.foto-lightbox-box img{display:block; max-width:100%; max-height:88vh; border-radius:12px; box-shadow:var(--t-shadow-lg);}
.foto-lightbox-fechar{position:absolute; top:-14px; right:-14px; width:36px; height:36px; border-radius:50%; background:var(--surface); color:var(--ink); border:none; cursor:pointer; box-shadow:var(--t-shadow); display:flex; align-items:center; justify-content:center;}
@media (max-width:760px){
  .modal{padding:18px 16px 0;}
  .modal-actions, .modal-foot{margin:16px -16px calc(-16px - env(safe-area-inset-bottom)); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); bottom:calc(-16px - env(safe-area-inset-bottom));}
  .modal-foot > .btn{flex:1 1 auto;}
  .aviso-faixa{flex-wrap:wrap;}
  .aviso-faixa .btn{margin-left:0;}
  .mod-lista{max-height:none;}
}
/* faixas de comissão */
table.com-fx td{padding:6px 8px;}
table.com-fx input{width:120px; text-align:right;}
.fx-perc{display:inline-flex; align-items:center; gap:6px;}
.fx-perc input{width:80px !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link"><span aria-hidden="true">←</span> Gestão e Controle</a>
    <div class="login-tag">Departamento pessoal</div>
    <div class="login-title">Entrar no DP</div>
    <p class="login-sub">Digite sua senha de acesso para continuar.</p>
    <div class="login-error" id="loginError">Senha incorreta ou sem acesso a este módulo. Confira a senha ou peça acesso à diretoria.</div>
    <div class="field"><label for="loginPass">Senha</label><input type="password" id="loginPass" placeholder="Sua senha" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint">Este módulo tem dados pessoais da equipe e só é liberado para quem tem permissão.</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle" aria-label="Voltar para Gestão e Controle"><span aria-hidden="true">←</span></a>
      <div class="brand-mark">DP</div>
      <div class="brand-name">Departamento pessoal</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair" aria-label="Sair"></button>
    </div>
  </header>
  <div id="lojaFaixa" style="display:none;"></div>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>

<script>

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function permissoesDoUsuario(u){
  const padrao = permissoesPadrao(u.nivel);
  if(!u.permissoes) return padrao;
  const mesclado = {};
  Object.keys(padrao).forEach(moduloId=>{
    const salvo = u.permissoes[moduloId];
    if(!salvo){ mesclado[moduloId] = padrao[moduloId]; return; }
    const abasPadrao = padrao[moduloId].abas || {};
    const abasSalvas = salvo.abas || {};
    // ...salvo preserva campos extras do módulo (ex.: atendimento.papel / atendimento.bots)
    mesclado[moduloId] = { ...salvo, ativo: salvo.ativo, abas: { ...abasPadrao, ...abasSalvas } };
  });
  return mesclado;
}

async function carregarBotsAtd(container){
  const box = container.querySelector('.atd-perfil'); if(!box) return;
  const alvo = box.querySelector('.atd-bots');
  if(!__botsAtd){
    try{
      const res = await fetch(SUPABASE_URL + '/functions/v1/atendimento-api', { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, op:'botsLista' }) });
      const r = await res.json();
      if(r && r.ok) __botsAtd = r.bots || [];
      else { alvo.innerHTML = `<span class="muted">Não foi possível carregar as instâncias (${escapeHtml((r&&r.error)||'erro')}). Ao salvar, as instâncias atuais são mantidas.</span>`; alvo.dataset.falhou = '1'; return; }
    }catch(e){ alvo.innerHTML = '<span class="muted">Sem conexão para carregar as instâncias. Ao salvar, as instâncias atuais são mantidas.</span>'; alvo.dataset.falhou = '1'; return; }
  }
  let sel = null; try{ sel = JSON.parse(box.dataset.atdbots || 'null'); }catch(e){ sel = null; }
  alvo.innerHTML = __botsAtd.length ? __botsAtd.map(b=>`<label><input type="checkbox" class="chk-atd-bot" value="${escapeHtml(b.id)}" ${(!Array.isArray(sel) || sel.includes(b.id))?'checked':''}> ${escapeHtml(b.nome)}${b.ativo===false?' <span class="muted">(inativa)</span>':''}</label>`).join('') : '<span class="muted">Nenhuma instância cadastrada no Atendimento.</span>';
}
function lerAtendimentoPerfil(container, base){
  const box = container.querySelector('.atd-perfil'); if(!box) return base;
  const out = { ...base };
  const papel = box.querySelector('.atd-papel').value;
  if(papel) out.papel = papel;
  const alvo = box.querySelector('.atd-bots');
  let anterior = null; try{ anterior = JSON.parse(box.dataset.atdbots || 'null'); }catch(e){}
  const chks = [...alvo.querySelectorAll('.chk-atd-bot')];
  if(((box.querySelector('.atd-modo')||{}).value||'auto')==='auto'){ delete out.bots; return out; }
  if(alvo.dataset.falhou || !chks.length){ if(Array.isArray(anterior)) out.bots = anterior; return out; }
  const modo = (box.querySelector('.atd-modo')||{}).value || 'auto';
  delete out.bots;
  if(modo === 'manual') out.bots = chks.filter(c=>c.checked).map(c=>c.value); // lista explícita
  return out; // automático: sem chave bots → o servidor usa as lojas do funcionário
}

}

/* ============================================================
   FUNÇÕES DE ACESSO (30/out/2026)
   Uma função = um tipo de acesso (Diretoria, Gerente, Vendedora, Oficina e as que a diretoria criar) com o padrão de módulos/abas
   liberados. Cada funcionário recebe uma função (Funcionários › Acesso) e a diretoria pode PERSONALIZAR por pessoa (tirar/incluir
   acessos). Guardado em config.funcoesAcesso; em cada users[]: funcaoId + ajustes (só a diferença para a função).
   O que vale de verdade continua em users[].permissoes (o servidor e o shell leem só isso): é recalculado a partir de
   função + ajustes sempre que algo muda. Usuário que sempre seguiu o padrão do nível mantém permissoes = null (como era).
   ============================================================ */
const NIVEIS_BASE = [['diretoria','Diretoria'],['gerente','Gerente'],['vendedora','Vendedora'],['oficina','Oficina']];
const GRUPOS_MODULOS = [
  { nome:'PAINEL', mods:['dashboard','ia'] },
  { nome:'CAIXA', mods:['vendas','os','orcamentos','transferencias','gravacoes','caixa','gastos','conciliacao','reforma','insumos','marketing'] },
  { nome:'CHAT', mods:['atendimento'] },
  { nome:'CONFIGURAÇÕES', mods:['config','dp'] },
  { nome:'OUTROS', mods:['lancamentos','site'] },
];
/** Grupos de módulos para a tela de permissões; módulo novo em MODULOS_APP que não esteja listado cai em OUTROS. */
function gruposDeModulos(){
  const vistos = new Set();
  const out = GRUPOS_MODULOS.map(g=>({ nome:g.nome, mods:g.mods.filter(m=>MODULOS_APP[m]) }));
  out.forEach(g=>g.mods.forEach(m=>vistos.add(m)));
  const sobra = Object.keys(MODULOS_APP).filter(m=>!vistos.has(m));
  if(sobra.length){ out.find(g=>g.nome==='OUTROS').mods.push(...sobra); }
  return out.filter(g=>g.mods.length);
}
function copiarJson(o){ return o==null ? null : JSON.parse(JSON.stringify(o)); }
function funcaoSistema(nivel, nome){ return { id:'fn_'+nivel, nome, nivelBase:nivel, sistema:true, descricao:'', permissoes:permissoesPadrao(nivel) }; }
/** Funções cadastradas; antes de a diretoria abrir a tela pela primeira vez, mostra as 4 padrões (sem gravar). */
function funcoesAcesso(){
  return (Array.isArray(config && config.funcoesAcesso) && config.funcoesAcesso.length) ? config.funcoesAcesso : NIVEIS_BASE.map(([n,l])=>funcaoSistema(n,l));
}
function funcaoPorId(id){ return id ? (funcoesAcesso().find(f=>f.id===id) || null) : null; }
function funcaoDoUsuario(u){ return u ? (funcaoPorId(u.funcaoId) || (u.funcaoId ? null : funcaoPorId('fn_'+u.nivel))) : null; }
function nomeFuncaoUsuario(u){ const f = funcaoDoUsuario(u); return f ? f.nome : levelLabel(u && u.nivel); }
function usuariosDaFuncao(id){ return (config.users||[]).filter(u=>u && u.funcaoId===id); }
/** Quantos itens (módulos/abas/extras) a pessoa tem diferentes da função. */
function qtdAjustes(aj){
  let n = 0;
  Object.keys(aj||{}).forEach(m=>{ const d = aj[m]; if(!d) return; if('ativo' in d) n++; n += Object.keys(d.abas||{}).length; Object.keys(d).forEach(k=>{ if(k!=='ativo' && k!=='abas') n++; }); });
  return n;
}
/** Permissões finais = função + ajustes da pessoa. */
function permissoesEfetivas(funcao, ajustes){
  const base = copiarJson((funcao && funcao.permissoes) || permissoesPadrao('vendedora'));
  const aj = ajustes || {};
  Object.keys(MODULOS_APP).forEach(m=>{
    if(!base[m]) base[m] = MODULOS_APP[m].abas.length ? { ativo:false, abas:{} } : { ativo:false };
    const a = aj[m]; if(!a) return;
    const b = base[m];
    Object.keys(a).forEach(k=>{
      if(k==='abas'){ b.abas = { ...(b.abas||{}), ...a.abas }; return; }
      if(a[k]===null) delete b[k]; else b[k] = copiarJson(a[k]);
    });
  });
  return base;
}
/** Diferença entre as permissões finais e as da função (é o que fica em users[].ajustes). */
function calcularAjustes(efetivas, funcao){
  const base = (funcao && funcao.permissoes) || {};
  const out = {};
  Object.keys(MODULOS_APP).forEach(m=>{
    const e = efetivas[m] || {}; const b = base[m] || {}; const d = {};
    if(!!e.ativo !== !!b.ativo) d.ativo = !!e.ativo;
    const abasE = e.abas || {}, abasB = b.abas || {}; const da = {};
    MODULOS_APP[m].abas.forEach(a=>{ if(!!abasE[a.id] !== !!abasB[a.id]) da[a.id] = !!abasE[a.id]; });
    if(Object.keys(da).length) d.abas = da;
    Object.keys(e).forEach(k=>{ if(k==='ativo'||k==='abas') return; if(JSON.stringify(e[k]) !== JSON.stringify(b[k])) d[k] = copiarJson(e[k]); });
    Object.keys(b).forEach(k=>{ if(k==='ativo'||k==='abas') return; if(!(k in e)) d[k] = null; });
    if(Object.keys(d).length) out[m] = d;
  });
  return out;
}
/** Dá a função à pessoa e recalcula users[].permissoes (e o nível, que é o nível base da função). */
function aplicarFuncaoAoUsuario(u, fn){
  u.funcaoId = fn.id; u.nivel = fn.nivelBase;
  if(u.ajustes && !Object.keys(u.ajustes).length) delete u.ajustes;
  const efetivas = permissoesEfetivas(fn, u.ajustes);
  const igualAoPadrao = Object.keys(calcularAjustes(efetivas, { permissoes: permissoesPadrao(fn.nivelBase) })).length === 0;
  if(u.permissoes == null && igualAoPadrao) return;   // sempre seguiu o padrão do nível: continua null
  u.permissoes = efetivas;
}
function reaplicarFuncao(fn){ usuariosDaFuncao(fn.id).forEach(u=>aplicarFuncaoAoUsuario(u, fn)); }
/** Primeira abertura: cria as 4 funções padrão e liga cada usuário à função do nível dele SEM mudar o que ele acessa hoje
 *  (o que já era diferente do padrão vira "ajustes"). Devolve true se mudou algo (precisa salvar). */
function garantirFuncoes(){
  let mudou = false;
  if(!Array.isArray(config.funcoesAcesso) || !config.funcoesAcesso.length){
    config.funcoesAcesso = NIVEIS_BASE.map(([n,l])=>funcaoSistema(n,l)); mudou = true;
  }
  (config.users||[]).forEach(u=>{
    if(!u || u.funcaoId) return;
    const fn = config.funcoesAcesso.find(f=>f.id==='fn_'+u.nivel);
    if(!fn) return;   // nível antigo "personalizado": continua sem função até a diretoria escolher uma
    const aj = calcularAjustes(permissoesDoUsuario(u), fn);
    u.funcaoId = fn.id;
    if(Object.keys(aj).length) u.ajustes = aj; else delete u.ajustes;
    mudou = true;
  });
  return mudou;
}
/** Relê a configuração do servidor antes de alterar (evita gravar por cima de mudança feita em outra tela). */
async function recarregarConfig(){
  const f = await configGetUnificada();
  if(!f) return false;
  config = f; return true;
}
/** Lê a config fresca, aplica `mutar()` e grava. `mutar` pode devolver false para cancelar. */
async function alterarFuncoesEGravar(mutar){
  if(!(await recarregarConfig())){ showToast('Não consegui atualizar a configuração. Tente de novo.'); return false; }
  garantirFuncoes();
  if(mutar() === false) return false;
  return await configSave();
}
/** Dá uma função a um funcionário (cria o acesso se ainda não existir) e grava as permissões resultantes. */
async function atribuirFuncaoAoFuncionario(funcionarioId, funcaoId, lojas){
  const fn = funcaoPorId(funcaoId); if(!fn) return false;
  const r = await chamarFuncionarioAcesso({ op:'salvarAcesso', senha: __gatewaySenha, funcionarioId, nivel: fn.nivelBase, lojas: lojas||[] });
  if(!r || !r.ok){ showToast((r && r.error) || 'Não foi possível salvar o acesso.'); return false; }
  return await alterarFuncoesEGravar(()=>{
    const u = (config.users||[]).find(x=>x.funcionarioId===funcionarioId); if(!u) return false;
    const mudou = u.funcaoId !== fn.id;
    if(mudou) delete u.ajustes;
    const f = funcaoPorId(fn.id) || fn; aplicarFuncaoAoUsuario(u, f);
  });
}

  document.getElementById('fnCancelar').addEventListener('click', closeModal);
  document.getElementById('fnSalvar').addEventListener('click', async ()=>{

    if(!travarNivel && nivel==='diretoria' && !confirm('O nível Diretoria dá poderes totais de gestão no servidor (inclusive alterar acessos). Criar mesmo assim?')) return;
    if(emUso && !confirm(`Isto muda o acesso de ${emUso} funcionário${emUso===1?'':'s'} que usa${emUso===1?'':'m'} esta função. Continuar?`)) return;

    });
    btn.disabled = false;
    if(!ok) return;
    closeModal();
    if(window.__redrawAcessos) window.__redrawAcessos();
    showToast(fn ? 'Função salva.' : 'Função criada.');
  });

async function excluirFuncao(fn){
  if(fn.sistema){ showToast('As funções padrão do sistema não podem ser excluídas.'); return; }
  const n = usuariosDaFuncao(fn.id).length;
  if(n){ showToast(`Esta função está em uso por ${n} funcionário${n===1?'':'s'}. Mude a função deles antes de excluir.`); return; }
  if(!confirm(`Excluir a função “${fn.nome}”? Essa ação não pode ser desfeita.`)) return;
  const ok = await alterarFuncoesEGravar(()=>{
    if(usuariosDaFuncao(fn.id).length){ showToast('Esta função passou a ter funcionários. Nada foi excluído.'); return false; }
    const i = config.funcoesAcesso.findIndex(f=>f.id===fn.id); if(i<0) return false;
    config.funcoesAcesso.splice(i,1);
  });
  if(ok){ if(window.__redrawAcessos) window.__redrawAcessos(); showToast('Função excluída.'); }
}
/** Personalizar o acesso de UMA pessoa (só diretoria): tira ou inclui módulos/abas por cima da função dela. */
function abrirPersonalizarModal(userId, aoVoltar){
  const u = (config.users||[]).find(x=>x.id===userId);
  const fn = u && funcaoDoUsuario(u);
  if(!u || !fn){ showToast('Salve a função desta pessoa antes de personalizar.'); return; }
  openModal(`

    const n = qtdAjustes(aj);

  }

  wrap.addEventListener('change', marcar);
  marcar();
  document.getElementById('persRestaurar').addEventListener('click', ()=>{ desenharEditorPermissoes(wrap, copiarJson(fn.permissoes), marcar); marcar(); });
  const voltar = ()=>{ if(aoVoltar) aoVoltar(); else closeModal(); };
  document.getElementById('persCancelar').addEventListener('click', voltar);
  document.getElementById('persSalvar').addEventListener('click', async ()=>{
    const aj = calcularAjustes(lerPermissoesDoFormulario(wrap), fn);
    const btn = document.getElementById('persSalvar'); btn.disabled = true;
    const ok = await alterarFuncoesEGravar(()=>{
      const alvo = (config.users||[]).find(x=>x.id===userId); const f = alvo && funcaoDoUsuario(alvo);
      if(!alvo || !f){ showToast('Não encontrei o acesso desta pessoa. Recarregue a página.'); return false; }
      if(Object.keys(aj).length) alvo.ajustes = aj; else delete alvo.ajustes;
      aplicarFuncaoAoUsuario(alvo, f);
    });
    btn.disabled = false;
    if(!ok) return;
    showToast(Object.keys(aj).length ? 'Acesso personalizado salvo.' : 'Acesso igual ao da função.');
    voltar();
  });
}

const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function funcionarioBateComNome(f, nomeGravado){

/** Rótulo de cargo a partir dos cargos marcados em Cadastro → Funcionários. */
function cargoLabelDosCargos(cargos){
  const c = cargos || [];
  if(c.includes('diretor')) return 'Diretor(a)';
  if(c.includes('gerente')) return 'Gerente';
  if(c.includes('vendedora')) return 'Vendedora';
  if(c.includes('oficina')) return 'Oficina';

}
/**
 * Junta o cadastro central (config.funcionarios, criado em Cadastro → Funcionários) com as
 * fichas de RH (dp_funcionarios). Quem já tem ficha aparece com a ficha; quem foi cadastrado
 * só com nome + função aparece aqui mesmo assim, com a ficha ainda em branco, pronta pra
 * ser preenchida no ✎. Assim o DP nunca fica com uma lista menor que a do Cadastro.
 */
function mesclarFuncionariosDoCadastro(fichas, cfg){
  const doCadastro = (cfg && Array.isArray(cfg.funcionarios)) ? cfg.funcionarios : [];
  const jaTemFicha = new Set();
  fichas.forEach(p=>{
    if(p.funcionarioId) jaTemFicha.add(p.funcionarioId);
    if(p.nome) jaTemFicha.add('nome:' + p.nome.trim().toLowerCase());
  });
  const pendentes = doCadastro
    .filter(f=> !jaTemFicha.has(f.id) && !jaTemFicha.has('nome:' + (f.nome||'').trim().toLowerCase()))
    .map(f=>({
      id: 'dpf_' + f.id,          // id estável: ao salvar o ✎ vira uma ficha de verdade, sem duplicar
      funcionarioId: f.id,
      nome: f.nome,
      apelido: f.apelido||'',
      cargo: cargoLabelDosCargos(f.cargos),
      status: 'ativo',
      semFicha: true,             // só pra mostrar o aviso na lista
      criadoEm: Date.now(),
    }));
  return fichas.concat(pendentes);
}

/* ============================================================
   FUNCIONÁRIOS (cadastro completo)
   ============================================================ */
/** Aba Vendas: total vendido por funcionário direto do PDV e das O.S. entregues (dado real, não depende de sync manual). */
/* ============================================================================================
   VENDAS E COMISSÕES (aba "vendas" do DP) — regime de caixa, comissão progressiva por faixas
   Regras (definidas pelo Felipe em 01/10/2026):
   • Base = líquido do mês = dinheiro RECEBIDO no mês (vendas PDV + pedidos/O.S.) − DEVOLUÇÕES do mês.
     Venda a prazo/fiado, crédito de cliente e pedido ainda a receber não entram.
   • Recebimento: venda "na encomenda" → data da venda; pedido "na encomenda" → data de criação;
     pedido "na volta" → data em que foi entregue (recebidoEm). Venda cancelada = devolução no mês do cancelamento.
   • Comissão progressiva: cada faixa paga o seu % sobre a parte do líquido que cai nela.
   • Soma tudo o que a vendedora vendeu em todas as lojas e aplica a tabela da LOJA-BASE dela
     (ou a tabela própria dela, se tiver). Faixas por loja e por mês; 7 níveis padrão (pode incluir/remover).
   Armazenamento: dp_registros — tipo 'comissaoFaixas' (id comfx_AAAA-MM), 'comissaoCadastro' (id comcad_geral),
   'comissaoFechamento' (id comfech_AAAA-MM). Sem tabela nova.
   ============================================================================================ */
const COM_NIVEIS_PADRAO = 7;
const COM_FORMAS_NAO_RECEBIDAS = ['__fiado','__credito','__sem_custo'];
let comCache = { produtos:null, ordens:null };
let comEstado = { mes: new Date().toISOString().slice(0,7), sub:'vendedoras', calc:null };

function comNumBR(v){ let s = String(v==null?'':v).trim(); if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = Number(s); return isNaN(n) ? 0 : n; }
function comR2(v){ return Math.round((Number(v)||0)*100)/100; }
function comPct(v){ return (Math.round((Number(v)||0)*100)/100).toString().replace('.',',') + '%'; }
/** Data local AAAA-MM-DD a partir de ms, ISO ou "AAAA-MM-DD". */
function comDataLocal(v){
  if(v==null || v==='') return '';
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(typeof v==='number' ? v : (/^\d+$/.test(String(v)) ? Number(v) : v));
  if(isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function comMesAnterior(mes){ const [a,m] = mes.split('-').map(Number); const d = new Date(a, m-2, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function comNomeMes(mes){ const [a,m] = mes.split('-'); return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][Number(m)-1] + '/' + a; }
function comLojasFisicas(){ return (config.lojas||[]); }
function comNomeLoja(id){ if(!id) return 'Sem loja'; const l=(config.lojas||[]).find(x=>x.id===id); return l ? (l.abreviacao||l.nome) : id; }
function comRegistro(id){ return registros.find(r=>r.id===id) || null; }
async function comSalvarRegistro(r){
  const ok = await registroSalvar(r);
  if(ok){ const i = registros.findIndex(x=>x.id===r.id); if(i>=0) registros[i]=r; else registros.push(r); }
  return ok;
}

/* ---------- dados ---------- */
async function comProdutosGet(){

async function comOrdensGet(){

  const r = await gatewayCall({ op:'selectAll', table:'ordens_servico' });
  if(r && r.error){ console.error('ordens', r.error); comCache.ordens = []; return []; }
  comCache.ordens = ((r && r.data)||[]).map(row=>row.payload); return comCache.ordens;
}
function comValorRecebido(reg){
  return comR2((reg.pagamentos||[]).reduce((acc,p)=> acc + (COM_FORMAS_NAO_RECEBIDAS.includes(p.formaId) ? 0 : comNumBR(p.valor)), 0));
}
function comValorAReceber(reg){
  return comR2((reg.pagamentos||[]).reduce((acc,p)=> acc + (p.formaId==='__fiado' ? comNumBR(p.valor) : 0), 0));
}
/** Encontra o funcionário pelo nome gravado na venda (nome completo ou apelido). */
function comFuncionarioDaVenda(nomeGravado){
  const ativos = funcionarios.filter(f=>f.status!=='desligado'); const todos = funcionarios;
  return ativos.find(f=>funcionarioBateComNome(f, nomeGravado)) || todos.find(f=>funcionarioBateComNome(f, nomeGravado)) || null;
}
function comIdFunc(f){ return f ? (f.funcionarioId || f.id) : null; }
/** Classifica os itens (categoria, subcategoria, fornecedor, tipo) com o peso de cada item no valor. */
function comItensClassificados(reg, origem, produtos){
  const cats = (config.produtosOtica && config.produtosOtica.categorias) || [];
  const subs = (config.produtosOtica && config.produtosOtica.subcategorias) || [];
  const nomeCat = id=> (cats.find(c=>c.id===id)||{}).nome || '';
  const nomeSub = id=> (subs.find(c=>c.id===id)||{}).nome || '';
  const itens = (reg.itens||[]).map(it=>{
    const p = it.produtoEstoqueId ? produtos[it.produtoEstoqueId] : null;
    const peso = Math.max(0, comNumBR(it.quantidade||1) * comNumBR(it.valorUnitario));
    return {
      peso,
      categoria: (p && nomeCat(p.categoriaId)) || (origem==='os' ? 'PEDIDO/O.S. (sem catálogo)' : 'SEM CATEGORIA'),
      subcategoria: (p && nomeSub(p.subcategoriaId)) || 'SEM SUBCATEGORIA',
      fornecedor: (p && String(p.fornecedor||'').trim().toUpperCase()) || 'SEM FORNECEDOR',
      tipo: (p && p.tipo) || (origem==='os' ? (reg.serviceTypeName ? 'PEDIDO — ' + String(reg.serviceTypeName).toUpperCase() : 'PEDIDO/O.S.') : 'SEM TIPO'),
    };
  });
  const total = itens.reduce((a,i)=>a+i.peso,0);
  if(!itens.length || total<=0) return [{ fracao:1, categoria: origem==='os'?'PEDIDO/O.S. (sem catálogo)':'SEM CATEGORIA', subcategoria:'SEM SUBCATEGORIA', fornecedor:'SEM FORNECEDOR', tipo: origem==='os'?'PEDIDO/O.S.':'SEM TIPO' }];
  return itens.map(i=>({ ...i, fracao: i.peso/total }));
}
/** Funcionário a partir do registro: prefere o código gravado (vendedoraId); senão, pelo nome (completo ou apelido). */
function comFuncionarioDoRegistro(reg){
  if(reg && reg.vendedoraId){ const f = funcionarios.find(x=>comIdFunc(x)===reg.vendedoraId); if(f) return f; }
  return comFuncionarioDaVenda(reg && reg.vendedora);
}
/** Monta os lançamentos do mês: entradas (recebido) e devoluções, cada um com loja, vendedora e classificação.
    Movimentos de dinheiro considerados (os mesmos que o Caixa enxerga):
    • venda/pedido: cada pagamento em dinheiro/PIX/cartão, na data do próprio pagamento (ou na data da venda/pedido);
    • recebimento de fiado: na data em que foi recebido, atribuído à vendedora e loja da venda de origem;
    • troca: diferença paga pelo cliente (entrada) ou devolvida em dinheiro (devolução) na data da troca;
    • devolução de item: valor devolvido em dinheiro na data da devolução;
    • cancelamento: o valor que saiu do caixa, na data do cancelamento.
    Crédito do cliente e fiado não entram como dinheiro. */
function comLancamentosDoMes(mes, vendas, ordens, produtos){
  const lanc = []; const aReceber = [];
  const noMes = d=> d && d.slice(0,7)===mes;
  const origemPorDebito = {};
  (vendas||[]).forEach(v=>{ if(v.tipo!=='recebimentoFiado' && v.fiadoDebitoId) origemPorDebito[v.fiadoDebitoId] = { reg:v, origem:'venda' }; });
  (ordens||[]).forEach(o=>{ if(o && o.fiadoDebitoId) origemPorDebito[o.fiadoDebitoId] = { reg:o, origem:'os' }; });
  const baseDe = (reg, origem)=>{ const f = comFuncionarioDoRegistro(reg);
    return { origem, id:reg.id, codigo:reg.codigoVia||'', lojaId:reg.lojaId||'', vendedoraNome:reg.vendedora||'', funcId:comIdFunc(f), cliente:(reg.cliente||''), classes: comItensClassificados(reg, origem, produtos) }; };
  const entrada = (base, data, valor, extra)=>{ if(valor>0.004 && noMes(data)) lanc.push({ ...base, tipoMov:'entrada', data, valor:comR2(valor), ...(extra||{}) }); };
  const devol = (base, data, valor, motivo)=>{ if(valor>0.004 && noMes(data)) lanc.push({ ...base, tipoMov:'devolucao', data, valor:comR2(valor), motivo:motivo||'' }); };
  const pagamentosEmDinheiro = reg=> (reg.pagamentos||[]).filter(p=>!COM_FORMAS_NAO_RECEBIDAS.includes(p.formaId) && comNumBR(p.valor)>0);

  (vendas||[]).forEach(v=>{
    if(!v) return;
    if(v.tipo==='recebimentoFiado'){
      const ref = v.refFiado && v.refFiado.debitoId ? origemPorDebito[v.refFiado.debitoId] : null;
      const base = ref ? { ...baseDe(ref.reg, ref.origem), codigo:(ref.reg.codigoVia||'') + ' (fiado)' }
                       : { ...baseDe(v,'venda'), codigo:'Recebimento de fiado', semOrigem:true };
      if(v.status!=='cancelada') entrada(base, comDataLocal(v.data), comValorRecebido(v), { fiadoRecebido:true });
      return;
    }
    const base = baseDe(v,'venda');
    const dataVenda = comDataLocal(v.data);
    pagamentosEmDinheiro(v).forEach(p=>{ entrada(base, comDataLocal(p.data) || dataVenda, comNumBR(p.valor), { estimada: !p.data && v.momentoPagamento==='na_volta' }); });
    if(v.status==='cancelada'){
      const saiu = v.caixaSaidaCancelamento!=null && v.caixaSaidaCancelamento!=='' ? comNumBR(v.caixaSaidaCancelamento) : comValorRecebido(v);
      devol(base, comDataLocal(v.canceladoEm), saiu, v.motivoCancelamento);
    } else {
      (v.trocas||[]).forEach(t=>{
        const dif = comNumBR(t.diferenca); const dt = comDataLocal(t.data);
        if(dif>0 && !COM_FORMAS_NAO_RECEBIDAS.includes(t.formaDiferenca)) entrada(base, dt, dif, { troca:true });
        else if(dif<0 && t.formaDiferenca!=='__credito') devol(base, dt, Math.abs(dif), t.tipoMov==='devolucao' ? 'Devolução de item' : 'Troca com devolução de diferença');
      });
      const fiado = comValorAReceber(v); if(fiado>0 && noMes(dataVenda)) aReceber.push({ ...base, data:dataVenda, valor:fiado, motivo:'fiado' });
    }
  });
  (ordens||[]).forEach(o=>{
    if(!o || o.status==='rascunho') return;
    const base = baseDe(o,'os');
    const cancelada = /^cancel/.test(String(o.status||''));
    const naVolta = o.momentoPagamento==='na_volta';
    const dataEntrega = o.status==='entregue' ? comDataLocal(o.recebidoEm) : '';
    const dataCriacao = comDataLocal(o.criadoEm) || comDataLocal(o.data);
    let houveEntrada = false;
    pagamentosEmDinheiro(o).forEach(p=>{
      const dt = naVolta ? dataEntrega : (comDataLocal(p.data) || dataCriacao);
      if(dt){ entrada(base, dt, comNumBR(p.valor), {}); houveEntrada = true; }
    });
    if(cancelada && houveEntrada){
      const saiu = o.caixaSaidaCancelamento!=null && o.caixaSaidaCancelamento!=='' ? comNumBR(o.caixaSaidaCancelamento) : comValorRecebido(o);
      devol(base, comDataLocal(o.canceladoEm), saiu, o.motivoCancelamento);
    }
    if(!cancelada && naVolta && o.status!=='entregue' && comNumBR(o.valorTotal)>0) aReceber.push({ ...base, data:dataCriacao, valor:comNumBR(o.valorTotal), motivo:'pedido a receber na entrega' });
  });
  return { lanc, aReceber };
}

/* ---------- faixas / comissão ---------- */
function comFaixasVazias(){ return Array.from({length:COM_NIVEIS_PADRAO}, ()=>({ ate:null, perc:null })); }
function comCadastro(){ return comRegistro('comcad_geral') || { id:'comcad_geral', tipo:'comissaoCadastro', vendedoras:{} }; }
function comFaixasDoMes(mes){ return comRegistro('comfx_'+mes); }
function comFechamento(mes){ return comRegistro('comfech_'+mes); }
/** Loja-base: a escolhida no cadastro de comissão; se não houver e o acesso for a uma loja só, essa loja. */
function comLojaBase(f){
  const cad = comCadastro(); const id = comIdFunc(f); const c = (cad.vendedoras||{})[id];
  if(c && c.lojaBase) return c.lojaBase;
  const u = (config.users||[]).find(u=> u.funcionarioId===id);
  if(u && Array.isArray(u.lojas) && u.lojas.length===1) return u.lojas[0];
  return '';
}
/** Normaliza faixas: ordena, remove vazias; a última pode não ter teto (até = sem limite). */
function comFaixasValidas(faixas){
  const fx = (faixas||[]).filter(x=> x && x.perc!=null && x.perc!=='' && !isNaN(Number(x.perc)))
    .map(x=>({ ate: (x.ate==null || x.ate==='' ) ? null : Number(x.ate), perc:Number(x.perc) }));
  const comTeto = fx.filter(x=>x.ate!=null).sort((a,b)=>a.ate-b.ate); const semTeto = fx.filter(x=>x.ate==null);
  return comTeto.concat(semTeto.length ? [semTeto[0]] : []);
}
/** Comissão progressiva com o detalhe de cada faixa. */
function comCalcularProgressiva(base, faixas){
  const fx = comFaixasValidas(faixas); let anterior = 0; let total = 0; const detalhe = []; let nivelAtingido = 0;
  if(!(base>0) || !fx.length) return { total:0, detalhe, nivelAtingido:0 };
  for(let i=0;i<fx.length;i++){
    const teto = fx[i].ate==null ? Infinity : fx[i].ate;
    if(teto <= anterior) continue;
    const parte = Math.max(0, Math.min(base, teto) - anterior);
    if(parte>0){ const v = comR2(parte * fx[i].perc / 100); total += v; nivelAtingido = i+1; detalhe.push({ nivel:i+1, de:anterior, ate:teto, perc:fx[i].perc, parte:comR2(parte), valor:v }); }
    anterior = teto; if(base <= teto) break;
  }
  if(base > anterior && anterior>0 && fx[fx.length-1].ate!=null){ detalhe.push({ nivel:null, de:anterior, ate:Infinity, perc:0, parte:comR2(base-anterior), valor:0, foraDaTabela:true }); }
  return { total:comR2(total), detalhe, nivelAtingido };
}
function comTabelaDaVendedora(mes, f){
  const reg = comFaixasDoMes(mes); if(!reg) return { faixas:null, fonte:'sem tabela no mês' };
  const id = comIdFunc(f); const prop = reg.vendedoras && reg.vendedoras[id];
  if(prop && Array.isArray(prop.faixas) && comFaixasValidas(prop.faixas).length) return { faixas:prop.faixas, fonte:'tabela própria' };
  const lb = comLojaBase(f); if(!lb) return { faixas:null, fonte:'sem loja-base' };
  const tl = reg.lojas && reg.lojas[lb];
  if(tl && comFaixasValidas(tl.faixas).length) return { faixas:tl.faixas, fonte:'tabela da ' + comNomeLoja(lb) };
  return { faixas:null, fonte:'loja ' + comNomeLoja(lb) + ' sem faixas no mês' };
}

/* ---------- cálculo do mês ---------- */
async function comCalcularMes(mes){
  const [vendas, ordens, produtos] = await Promise.all([vendasPdvGet(), comOrdensGet(), comProdutosGet()]);
  const { lanc, aReceber } = comLancamentosDoMes(mes, vendas, ordens, produtos);
  const lojasIds = Array.from(new Set(lanc.map(l=>l.lojaId||''))).sort((a,b)=>comNomeLoja(a).localeCompare(comNomeLoja(b)));
  // por vendedora × loja
  const porVend = {};
  lanc.forEach(l=>{
    const chave = l.funcId || ('?' + (l.vendedoraNome||'SEM VENDEDORA').toUpperCase());
    if(!porVend[chave]){ const f = l.funcId ? funcionarios.find(x=>comIdFunc(x)===l.funcId) : null;
      porVend[chave] = { chave, funcId:l.funcId, f, nome: f ? nomeExibicaoFuncionario(f) : (l.vendedoraNome ? l.vendedoraNome.toUpperCase() + ' (não identificada)' : 'SEM VENDEDORA'), lojas:{}, recebido:0, devolvido:0 }; }
    const pv = porVend[chave]; const lj = l.lojaId||''; pv.lojas[lj] = pv.lojas[lj] || { recebido:0, devolvido:0 };
    if(l.tipoMov==='entrada'){ pv.lojas[lj].recebido += l.valor; pv.recebido += l.valor; } else { pv.lojas[lj].devolvido += l.valor; pv.devolvido += l.valor; }
  });
  const vendedoras = Object.values(porVend).map(v=>{
    v.liquido = comR2(v.recebido - v.devolvido);
    let tab = { faixas:null, fonte:'não identificada no DP' }; let com = { total:0, detalhe:[], nivelAtingido:0 };
    if(v.f){ tab = comTabelaDaVendedora(mes, v.f); if(tab.faixas) com = comCalcularProgressiva(v.liquido, tab.faixas); v.lojaBase = comLojaBase(v.f); }
    return { ...v, recebido:comR2(v.recebido), devolvido:comR2(v.devolvido), tabela:tab, comissao:com };
  }).sort((a,b)=> (a.funcId?0:1)-(b.funcId?0:1) || b.liquido-a.liquido);
  // por loja
  const lojas = lojasIds.map(id=>{
    const ls = lanc.filter(l=>(l.lojaId||'')===id);
    const recebido = comR2(ls.filter(l=>l.tipoMov==='entrada').reduce((a,l)=>a+l.valor,0)); const devolvido = comR2(ls.filter(l=>l.tipoMov==='devolucao').reduce((a,l)=>a+l.valor,0));
    const semVend = ls.filter(l=>!l.funcId); const semVendLiq = comR2(semVend.reduce((a,l)=> a + (l.tipoMov==='entrada'?l.valor:-l.valor), 0));
    return { id, recebido, devolvido, liquido:comR2(recebido-devolvido), qtdEntradas: ls.filter(l=>l.tipoMov==='entrada').length, qtdDevol: ls.filter(l=>l.tipoMov==='devolucao').length, semVendLiq, aReceber: comR2(aReceber.filter(a=>(a.lojaId||'')===id).reduce((s,a)=>s+a.valor,0)) };
  });
  // classificação
  const dims = { categoria:{}, subcategoria:{}, fornecedor:{}, tipo:{} };
  lanc.forEach(l=>{ const sinal = l.tipoMov==='entrada' ? 1 : -1; l.classes.forEach(c=>{
    Object.keys(dims).forEach(d=>{ const k = c[d]; dims[d][k] = dims[d][k] || { total:0, porLoja:{} }; const v = sinal * l.valor * c.fracao; dims[d][k].total += v; dims[d][k].porLoja[l.lojaId||''] = (dims[d][k].porLoja[l.lojaId||'']||0) + v; });
  }); });
  return { mes, lanc, aReceber, lojasIds, vendedoras, lojas, dims, calculadoEm: Date.now() };
}

function comPrecisaCalcular(corpo){
  if(comEstado.calc && comEstado.calc.mes===comEstado.mes) return false;

function comDesenharSub(){
  const corpo = document.getElementById('com_corpo'); if(!corpo) return;
  const s = comEstado.sub;

      ${pode ? `<div class="filters" style="margin:10px 0 0;"><select id="com_addVend" aria-label="Criar tabela própria"><option value="">Criar tabela própria para…</option>${funcionarios.filter(f=>f.status!=='desligado' && !vendComPropria.includes(comIdFunc(f))).map(f=>`<option value="${comIdFunc(f)}">${escapeHtml(nomeExibicaoFuncionario(f))}</option>`).join('')}</select></div>` : ''}

  if(!pode) return;
  const ler = ()=>{ corpo.querySelectorAll('table.com-fx').forEach(t=>{ const [tp,id] = t.dataset.chave.split(':'); const alvo = tp==='loja' ? rascunho.lojas[id] : rascunho.vendedoras[id];

  corpo.querySelectorAll('table.com-fx').forEach(t=>{

    const add = bloco.querySelector('[data-add]'); if(add) add.addEventListener('click', ()=>{ ler(); alvo().faixas.push({ ate:null, perc:null }); redesenhar(); });
    const cp = bloco.querySelector('[data-copiar]'); if(cp) cp.addEventListener('change', ()=>{ if(!cp.value) return; ler(); alvo().faixas = JSON.parse(JSON.stringify(rascunho.lojas[cp.value].faixas)); redesenhar(); });

  });
}
/** Redesenha a aba de faixas mantendo o rascunho em edição (sem perder o que foi digitado). */
function comRenderFaixasDe(corpo, rascunho){
  const original = registros.findIndex(r=>r.id===rascunho.id); const backup = original>=0 ? registros[original] : null;
  if(original>=0) registros[original] = rascunho; else registros.push(rascunho);
  try{ comRenderFaixas(corpo); } finally { if(original>=0) registros[original] = backup; else registros.splice(registros.findIndex(r=>r===rascunho),1); }
}

function comExportarCSV(c){

  const L = [];
  L.push(['VENDAS E COMISSÕES — ' + comNomeMes(c.mes).toUpperCase()].map(q).join(';')); L.push('');
  L.push(['Vendedora','Loja-base', ...c.lojasIds.flatMap(l=>[comNomeLoja(l)+' recebido', comNomeLoja(l)+' devolvido']), 'Recebido','Devolvido','Líquido','Nível','Comissão','Faixas usadas'].map(q).join(';'));
  c.vendedoras.forEach(v=>L.push([q(v.nome), q(v.lojaBase?comNomeLoja(v.lojaBase):''), ...c.lojasIds.flatMap(l=>{ const x=v.lojas[l]; return [n(x?x.recebido:0), n(x?x.devolvido:0)]; }), n(v.recebido), n(v.devolvido), n(v.liquido), q(v.comissao.nivelAtingido||''), n(v.funcId&&v.tabela.faixas?v.comissao.total:null), q(v.tabela.fonte)].join(';')));
  L.push(''); L.push(['LOJA','Recebido','Devolvido','Líquido','Sem vendedora identificada','A receber'].map(q).join(';'));
  c.lojas.forEach(l=>L.push([q(comNomeLoja(l.id)), n(l.recebido), n(l.devolvido), n(l.liquido), n(l.semVendLiq), n(l.aReceber)].join(';')));
  [['CATEGORIA','categoria'],['SUBCATEGORIA','subcategoria'],['FORNECEDOR','fornecedor'],['TIPO','tipo']].forEach(([t,d])=>{
    L.push(''); L.push([t, ...c.lojasIds.map(comNomeLoja), 'Total'].map(q).join(';'));
    Object.entries(c.dims[d]).sort((a,b)=>b[1].total-a[1].total).forEach(([k,v])=>L.push([q(k), ...c.lojasIds.map(l=>n(v.porLoja[l]||0)), n(v.total)].join(';')));
  });
  const blob = new Blob(['\ufeff' + L.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `vendas-comissoes-${c.mes}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* Retorna quantos dias faltam para completar 90 dias a partir de dataAdmissao (string YYYY-MM-DD).
   Retorna null se dataAdmissao for inválida ou se já passaram os 90 dias. */
function diasParaCompletarExperiencia(dataAdmissao){
  if(!dataAdmissao) return null;
  const admissao = new Date(dataAdmissao + 'T00:00:00');
  if(isNaN(admissao)) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diff = Math.floor((hoje - admissao) / 86400000);
  const restam = 90 - diff;
  return restam > 0 ? restam : null;
}

    // 1) Bloqueia o acesso (reutiliza op bloquearAcesso se existir, senão apenas seta bloqueado via saveConfig)
    try{
      await chamarFuncionarioAcesso({ op:'bloquearAcesso', senha: __gatewaySenha, funcionarioId: funcId });
    }catch(e){ console.warn('bloquearAcesso indisponível:', e); }

    // 2) Fallback: garante bloqueado=true no users do config
    const userConfig = (config.users||[]).find(u=>u.funcionarioId===funcId);
    if(userConfig){ userConfig.bloqueado = true; await configSave(); }

    // 3) Atualiza perfil de RH com status=desligado + motivo
    const perfisFrescos = await funcionariosGet();
    const perfilAtual = perfisFrescos.find(p=>p.funcionarioId===funcId);
    if(perfilAtual){
      await funcionarioSalvar({ ...perfilAtual, status:'desligado', dataDesligamento, motivoDesligamento: motivo });
    }

    funcionarios = mesclarFuncionariosDoCadastro(await funcionariosGet(), config);
    closeModal();
    showToast(`${escapeHtml(f.nome)} foi inativado(a).`);
    if(onConcluido) onConcluido();
  });
}

const ABAS_FUNC_COMPLETO = ['Básico','Pessoais','Profissionais','Bancários','Acesso'];
/**
 * Cadastro completo e unificado de um funcionário: a função/cargo (usada em todo o
 * app pros módulos de venda/O.S./Venda PG) fica na mesma tela que os dados de RH
 * (pessoais/profissionais/bancários). Migrado do módulo Cadastro pro Departamento
 * Pessoal a pedido do Felipe — o cadastro é um só, compartilhado entre os dois.
 */
const ESCOLARIDADE_PADRAO = ['Fundamental incompleto','Fundamental completo','Ensino médio incompleto','Ensino médio completo','Superior incompleto','Superior completo','Pós-graduação','Mestrado','Doutorado'];
/** Lista de opções de escolaridade, editável pela diretoria/gerência (＋ adiciona, ✎ edita) — mesmo padrão do módulo Gastos. Fica em config.escolaridadeOpcoes. */
function escolaridadeOpcoes(){
  if(!Array.isArray(config.escolaridadeOpcoes) || config.escolaridadeOpcoes.length===0){
    config.escolaridadeOpcoes = [...ESCOLARIDADE_PADRAO];
  }
  return config.escolaridadeOpcoes;
}

  let abaAtiva = (abaInicial && abasVisiveis.includes(abaInicial)) ? abaInicial : 'Básico';
  openModal(`

      async function processarFotoFuncionario(file){
        if(!file) return;
        const status = document.getElementById('fc_fotoStatus');
        status.textContent = 'Enviando foto…';

function renderRegistros(main, tipo){

    <div class="page-head">

        <p class="page-sub">${podeEditar ? (SUB_ROTULO[tipo] || 'Histórico por funcionário.') : 'Seu histórico.'}</p>
      </div>
      ${podeEditar ? `<div class="page-actions"><button class="btn btn-accent" id="btnNovoRegistro">${ic('mais')} ${NOVO_ROTULO[tipo] || 'Novo registro'}</button></div>` : ''}
    </div>
    <div class="card filtro-barra">
      <div class="filters" style="margin-bottom:0;">
        <div class="field" style="min-width:240px;"><label for="fFunc">Funcionário</label>
          <select id="fFunc" ${soProprioDP()?'disabled':''}><option value="">Todos os funcionários</option>${funcionarios.map(f=>`<option value="${f.funcionarioId||f.id}">${escapeHtml(nomeExibicaoFuncionario(f))}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="card">
      <table class="tabela-cartoes">
        <thead><tr><th>Funcionário</th>${meta.colunas.map(c=>`<th class="${colunaNum(c)?'r':''}">${tituloColuna(c)}</th>`).join('')}${tipo==='aviso'?'<th>Situação</th>':''}<th class="acoes"><span class="sr">Ações</span></th></tr></thead>
        <tbody id="tbodyReg"></tbody>
      </table>
    </div>

  function valorFmt(reg, campoId){
    if(campoId==='valorLiquido'){
      const liquido = (Number(reg.salarioBase)||0) + (Number(reg.horasExtras)||0) + (Number(reg.adicionais)||0) - (Number(reg.descontos)||0);
      return fmtMoeda(liquido);
    }
    if(campoId==='totalItens'){
      const total = ['alianca','fabricacao','servico','represOuro','represPrata','relogio'].reduce((acc,c)=> acc + (Number(reg[c])||0), 0);
      return fmtMoeda(total);
    }
    const campo = meta.campos.find(c=>c.id===campoId);
    const val = reg[campoId];
    if(campo && campo.tipo==='date') return fmtDate(val);
    if(campo && campo.tipo==='month') return fmtMes(val);
    if(campo && campo.tipo==='number') return val!==undefined && val!==null && val!=='' ? val : '—';

  function statusAdvertencia(r){

    if(r.notificadoEm) return { texto:'Notificado', classe:'badge-info' };
    return { texto:'Pendente', classe:'badge-wait' };

  function draw(){
    const lista = registros.filter(r=>r.tipo===tipo && (!soProprioDP() || r.funcionarioId===currentUser.funcionarioId));
    const filtroFunc = document.getElementById('fFunc').value;
    const filtrada = lista.filter(r=> !filtroFunc || r.funcionarioId===filtroFunc).slice().reverse();

    tbody.innerHTML = filtrada.map(r=>{
      const st = tipo==='aviso' ? statusAdvertencia(r) : null;
      return `
      <tr>
        <td class="cel-titulo"><span class="nome-func">${escapeHtml(nomeFuncionario(r.funcionarioId))}</span></td>
        ${meta.colunas.map(c=>`<td data-label="${escapeHtml(tituloColuna(c))}" class="${colunaNum(c)?'r':''}">${valorFmt(r,c)}</td>`).join('')}
        ${tipo==='aviso' ? `<td data-label="Situação"><span class="badge ${st.classe}">${st.texto}</span></td>` : ''}
        <td class="acoes"><div class="acoes-linha">
          ${btnIcone(podeEditar?'lapis':'olho', podeEditar?'Abrir e editar':'Ver', `data-verreg="${r.id}"`)}
          ${tipo==='aviso' && podeEditar ? `
            ${btnIcone('whatsapp', 'Notificar por WhatsApp', `data-notwa="${r.id}"`)}
            ${btnIcone('email', 'Notificar por e-mail', `data-notemail="${r.id}"`)}
          ` : ''}
          ${podeEditar ? btnIcone('lixeira', 'Excluir registro', `data-delreg="${r.id}"`, true) : ''}

    `;
    }).join('');
    tbody.querySelectorAll('[data-verreg]').forEach(b=> b.addEventListener('click', ()=> abrirRegistroModal(tipo, registros.find(r=>r.id===b.dataset.verreg), draw) ));
    tbody.querySelectorAll('[data-notwa]').forEach(b=> b.addEventListener('click', ()=> notificarPorWhatsapp(registros.find(r=>r.id===b.dataset.notwa), draw) ));
    tbody.querySelectorAll('[data-notemail]').forEach(b=> b.addEventListener('click', ()=> notificarPorEmail(registros.find(r=>r.id===b.dataset.notemail), draw, b) ));
    tbody.querySelectorAll('[data-delreg]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Excluir este registro? Essa ação não pode ser desfeita.')) return;
        await registroExcluir(b.dataset.delreg);
        registros = registros.filter(r=>r.id!==b.dataset.delreg);
        draw();
        showToast('Registro excluído.');
      });
    });
  }
  draw();
  document.getElementById('fFunc').addEventListener('change', draw);
  if(document.getElementById('btnNovoRegistro')) document.getElementById('btnNovoRegistro').addEventListener('click', ()=> abrirRegistroModal(tipo, null, draw));
}

/** O telefone usado pra notificar é sempre o celular particular — nunca o fixo ou o da loja. */
function onlyDigitsDp(s){ return (s||'').replace(/\D/g,''); }
function maiusc(s){ return (s==null?'':String(s)).trim().toUpperCase(); }
/** Separa um telefone salvo em {ddd, numero} — funciona tanto pra fixo (10 dígitos
 * no total) quanto celular (11 dígitos no total). */
function separarTelefoneDp(str){
  const digitos = onlyDigitsDp(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
/** Formata o número conforme a pessoa digita. tamanho=8 (fixo, XXXX-XXXX) ou
 * tamanho=9 (celular, XXXXX-XXXX). */
function formatarNumeroTelefoneDp(digitos, tamanho){
  digitos = digitos.slice(0, tamanho);
  const corte = tamanho - 4;
  if(digitos.length<=4) return digitos;
  return digitos.slice(0,corte)+'-'+digitos.slice(corte);
}
function wireTelefoneMaskDp(prefix, tamanho){
  const dddInp = document.getElementById(prefix+'DDD');
  const numInp = document.getElementById(prefix+'Num');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigitsDp(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefoneDp(onlyDigitsDp(numInp.value), tamanho); });
}
/** Lê DDD+número direto do DOM (não confia no objeto `d`, que o ligarCampos genérico
 * só preenche com os nomes separados) e valida: os dois vazios = ok (retorna ''); só
 * um preenchido ou incompleto = erro (avisa e retorna null). */
/** DDD e número de um telefone da ficha, pra salvar: usa o que a pessoa digitou nesta
 * edição (d.campoDDD / d.campoNum) e, se ela não tocou nesse campo, o que já estava
 * salvo em d.campo. Sem isso, qualquer telefone não editado era gravado em branco. */
function partesTelefoneDp(d, campo){
  const sep = separarTelefoneDp(d[campo]);
  return {
    ddd: d[campo+'DDD'] !== undefined ? d[campo+'DDD'] : sep.ddd,
    numero: d[campo+'Num'] !== undefined ? d[campo+'Num'] : sep.numero,
  };
}
function combinarTelefoneValidadoDp(ddd, numero, tamanho, label){
  ddd = onlyDigitsDp(ddd); numero = onlyDigitsDp(numero);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==tamanho){
    showToast(`${label} incompleto — preencha o DDD (2 dígitos) e o número (${tamanho} dígitos), ou deixe os dois em branco.`);
    return null;
  }
  return `(${ddd}) ${numero.slice(0,numero.length-4)}-${numero.slice(-4)}`;
}
async function marcarNotificado(registro){
  if(!registro.notificadoEm){
    registro.notificadoEm = new Date().toISOString();
    await registroSalvar(registro);
  }
}
function notificarPorWhatsapp(registro, redesenhar){
  const funcionario = funcionarios.find(f=>f.id===registro.funcionarioId);
  const tel = onlyDigitsDp(funcionario && funcionario.celularParticular);
  if(!tel){ showToast('Esse funcionário não tem celular particular cadastrado (Cadastro → Funcionários).'); return; }
  const linkConfirmacao = window.location.origin + '/advertencia.html?id=' + registro.id;
  const msg = `Olá, ${funcionario.nome}! Você recebeu uma notificação de advertência. Por favor, confirme o recebimento no link: ${linkConfirmacao}`;
  window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
  marcarNotificado(registro).then(redesenhar);
}
async function notificarPorEmail(registro, redesenhar, botao){
  const funcionario = funcionarios.find(f=>f.id===registro.funcionarioId);
  const email = funcionario && funcionario.email;
  if(!email){ showToast('Esse funcionário não tem e-mail cadastrado.'); return; }
  if(botao){ botao.disabled = true; }
  const linkConfirmacao = window.location.origin + '/advertencia.html?id=' + registro.id;
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-email-gmail', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({
        to: email, subject: 'Notificação de Advertência — Vilaça Joias',
        body: `Olá, ${funcionario.nome}!\n\nVocê recebeu uma notificação de advertência. Por favor, acesse o link abaixo pra confirmar o recebimento:\n${linkConfirmacao}\n\nAtenciosamente,\nVilaça Joias`,
        senha: __gatewaySenha,
      }),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'falha');
    showToast('E-mail enviado.');
    await marcarNotificado(registro);
    redesenhar();
  }catch(e){ showToast('Não foi possível enviar o e-mail.'); }
  if(botao){ botao.disabled = false; }
}

function abrirRegistroModal(tipo, r, onSalvo){
  const meta = CAMPOS_POR_TIPO[tipo];
  const editando = !!r;
  const podeEditar = podeEditarDP();
  const funcionarioAtual = r ? funcionarios.find(f=>f.id===r.funcionarioId) : null;
  openModal(`
    <div class="modal-head"><h2>${podeEditar ? ((editando?'Editar':'Novo')+': '+meta.titulo.charAt(0).toLowerCase()+meta.titulo.slice(1)) : meta.titulo}</h2></div>
    <div class="field"><label for="rg_funcionarioId">Funcionário</label><select id="rg_funcionarioId" ${podeEditar?'':'disabled'}>${funcionarioOptionsHtml(r?r.funcionarioId:'')}</select></div>
    <div class="grid-2">
    ${meta.campos.map(c=>{
      const val = r ? (r[c.id]!==undefined?r[c.id]:'') : '';
      const dis = podeEditar?'':'disabled';
      if(c.tipo==='textarea') return `<div class="field span-2"><label for="rg_${c.id}">${c.label}</label><textarea id="rg_${c.id}" rows="3" ${dis}>${escapeHtml(val)}</textarea></div>`;
      if(c.tipo==='select') return `<div class="field"><label for="rg_${c.id}">${c.label}</label><select id="rg_${c.id}" ${dis}>${c.opcoes.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      if(c.tipo==='number') return `<div class="field"><label for="rg_${c.id}">${c.label}</label><input type="number" step="0.01" id="rg_${c.id}" value="${val}" ${dis}></div>`;
      if(c.tipo==='date') return `<div class="field"><label for="rg_${c.id}">${c.label}</label><input type="date" id="rg_${c.id}" value="${val||''}" ${dis}></div>`;
      if(c.tipo==='month') return `<div class="field"><label for="rg_${c.id}">${c.label}</label><input type="month" id="rg_${c.id}" value="${val||''}" ${dis}></div>`;
      return `<div class="field"><label for="rg_${c.id}">${c.label}</label><input id="rg_${c.id}" value="${escapeHtml(val)}" ${dis}></div>`;
    }).join('')}
    </div>
    ${tipo==='aviso' && editando ? `
      <div class="bloco" style="border-top:1px solid var(--line); margin-top:4px;">
        <h3>Situação da notificação</h3>
        <p style="margin:0;">
          ${r.confirmadoEm ? `<span class="badge badge-ok">Ciente</span> <span class="muted">confirmado em ${escapeHtml(fmtDataHora(r.confirmadoEm))}</span>`
            : r.notificadoEm ? `<span class="badge badge-info">Notificado</span> <span class="muted">em ${escapeHtml(fmtDataHora(r.notificadoEm))}, aguardando confirmação</span>`
            : `<span class="badge badge-wait">Pendente</span> <span class="muted">ainda não foi notificado</span>`}
        </p>
        ${podeEditar ? `<p class="dica">Para notificar, use os botões de WhatsApp ou e-mail na lista de advertências.</p>` : ''}
      </div>
    ` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelarReg">${podeEditar?'Cancelar':'Fechar'}</button>
      ${podeEditar ? `<button class="btn btn-accent" id="btnSalvarReg">Salvar</button>` : ''}
    </div>
  `);
  document.getElementById('btnCancelarReg').addEventListener('click', closeModal);
  if(document.getElementById('btnSalvarReg'))
  document.getElementById('btnSalvarReg').addEventListener('click', async ()=>{
    const funcionarioId = document.getElementById('rg_funcionarioId').value;
    if(!funcionarioId){ showToast('Selecione o funcionário.'); return; }
    const funcSelecionado = funcionarios.find(f=>f.id===funcionarioId);
    const dados = { id: r?r.id:uid('dpreg'), tipo, funcionarioId, data: todayStr(), criadoEm: r?r.criadoEm:Date.now() };
    if(tipo==='aviso'){
      dados.nomeFuncionarioSnapshot = funcSelecionado?funcSelecionado.nome:'';
      dados.confirmadoEm = r?r.confirmadoEm:null;
      dados.notificadoEm = r?r.notificadoEm:null;
    }
    meta.campos.forEach(c=>{
      const el = document.getElementById('rg_'+c.id);
      dados[c.id] = c.tipo==='number' ? (el.value===''?null:parseFloat(el.value)) : el.value;
    });
    const ok = await registroSalvar(dados);
    if(ok){
      const idx = registros.findIndex(x=>x.id===dados.id);
      if(idx>=0) registros[idx] = dados; else registros.push(dados);
      closeModal();
      onSalvo();
      showToast(editando ? 'Registro atualizado.' : 'Registro salvo.');
    }
  });
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'dp' }, '*');
    return;
  }
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
