<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departamento Pessoal · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn:hover{background:rgba(255,255,255,0.1);}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}
.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); box-shadow:0 2px 10px -4px rgba(43,15,31,0.08); overflow-x:auto;}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-wait{background:var(--wait-soft); color:var(--wait);}
.badge-erro{background:var(--danger-soft); color:var(--danger);}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.mini-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Departamento Pessoal</div>
    <div class="login-title">Acessar DP</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada, ou sem acesso a este módulo.</div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-hint">Só a diretoria tem acesso a este módulo (dados sensíveis).</div>
  </div>
</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">DP</div>
      <div class="brand-name">Departamento Pessoal</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair">🚪</button>
    </div>
  </header>
  <main id="mainContent"></main>
  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

let config = null;
let funcionarios = [];
let registros = [];
let currentUser = null;
let currentTab = 'funcionarios';
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML = '';
  if(history.state && history.state.modalAberto) history.back();
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  history.pushState({ modalAberto:true }, '');
}
window.addEventListener('popstate', ()=>{
  const overlay = document.getElementById('modalOverlay');
  if(overlay && overlay.classList.contains('show')) history.pushState({ modalAberto:true }, '');
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const overlay = document.getElementById('modalOverlay');
    if(overlay && overlay.classList.contains('show')){ e.preventDefault(); e.stopPropagation(); }
  }
});

async function configGetUnificada(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    return data ? data.payload : null;
  }catch(e){ console.error('erro ao carregar config', e); return null; }
}
async function funcionariosGet(){
  try{
    const { data, error } = await supabaseClient.from('dp_funcionarios').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar funcionários', e); return []; }
}
async function funcionarioSalvar(f){
  try{
    const { error } = await supabaseClient.from('dp_funcionarios').upsert({ id: f.id, payload: f });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar funcionário', e); showToast('Não foi possível salvar.'); return false; }
}
async function funcionarioExcluir(id){
  try{
    const { error } = await supabaseClient.from('dp_funcionarios').delete().eq('id', id);
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao excluir', e); return false; }
}
async function registrosGet(){
  try{
    const { data, error } = await supabaseClient.from('dp_registros').select('id,payload').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>r.payload);
  }catch(e){ console.error('erro ao carregar registros', e); return []; }
}
async function registroSalvar(r){
  try{
    const { error } = await supabaseClient.from('dp_registros').upsert({ id: r.id, payload: r });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar registro', e); showToast('Não foi possível salvar.'); return false; }
}
async function registroExcluir(id){
  try{
    const { error } = await supabaseClient.from('dp_registros').delete().eq('id', id);
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao excluir registro', e); return false; }
}

async function loadAll(){
  config = await configGetUnificada();
  if(!config){ config = { lojas:[] }; }
  funcionarios = await funcionariosGet();
  registros = await registrosGet();
}

const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      await loadAll();
      enterApp();
    } else if(ev.data.type === 'gotoTab'){
      currentTab = ev.data.tabId;
      renderTabs();
      renderView();
    }
  });
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok || r.user.nivel !== 'diretoria'){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await loadAll();
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null; __gatewaySenha = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'block';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  buildTabs();
  currentTab = 'funcionarios';
  if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'dp', tabs: TABS, active: currentTab }, '*');
  renderTabs();
  renderView();
}

const TABS = [
  { id:'funcionarios', label:'Funcionários', icon:'🧑‍💼' },
  { id:'pagamentos', label:'Pagamentos', icon:'💰' },
  { id:'ferias', label:'Férias', icon:'🌴' },
  { id:'avisos', label:'Avisos', icon:'⚠️' },
  { id:'atestados', label:'Atestados', icon:'🩺' },
];
function buildTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    nav.appendChild(b);
  });
  const mobileNav = document.getElementById('mobileTabbar');
  mobileNav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="mt-icon">${t.icon}</span><span>${t.label}</span>`;
    b.addEventListener('click', ()=>{ currentTab = t.id; renderTabs(); renderView(); });
    mobileNav.appendChild(b);
  });
}
function renderTabs(){
  document.querySelectorAll('nav.tabs button, .mobile-tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
  if(EMBEDDED) parent.postMessage({ type:'activeTab', modulo:'dp', tabId: currentTab }, '*');
}
function renderView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  if(currentTab==='funcionarios') renderFuncionarios(main);
  else if(currentTab==='pagamentos') renderRegistros(main, 'pagamento');
  else if(currentTab==='ferias') renderRegistros(main, 'ferias');
  else if(currentTab==='avisos') renderRegistros(main, 'aviso');
  else if(currentTab==='atestados') renderRegistros(main, 'atestado');
}

function nomeFuncionario(id){ const f = funcionarios.find(x=>x.id===id); return f ? f.nome : '—'; }
function funcionarioOptionsHtml(selected){
  return `<option value="">Selecione</option>` + funcionarios.filter(f=>f.status!=='desligado').map(f=>`<option value="${f.id}" ${selected===f.id?'selected':''}>${escapeHtml(f.nome)}</option>`).join('');
}

/* ============================================================
   FUNCIONÁRIOS (cadastro completo)
   ============================================================ */
function renderFuncionarios(main){
  main.innerHTML = `
    <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 class="page-title">Funcionários</h1>
        <p class="page-sub">Cadastro completo: dados pessoais, profissionais e bancários.</p>
      </div>
      <button class="btn btn-accent" id="btnNovoFuncionario">+ Novo funcionário</button>
    </div>
    <div class="card" style="padding:14px 18px;">
      <table>
        <thead><tr><th>Nome</th><th>Cargo</th><th>Loja</th><th>Admissão</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbodyFunc"></tbody>
      </table>
    </div>
  `;
  function draw(){
    const tbody = document.getElementById('tbodyFunc');
    if(funcionarios.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="empty">Nenhum funcionário cadastrado ainda.</td></tr>`; return; }
    tbody.innerHTML = funcionarios.slice().reverse().map(f=>`
      <tr>
        <td><b>${escapeHtml(f.nome)}</b></td>
        <td>${escapeHtml(f.cargo||'—')}</td>
        <td>${escapeHtml(f.loja||'—')}</td>
        <td>${fmtDate(f.dataAdmissao)}</td>
        <td><span class="badge ${f.status==='desligado'?'badge-erro':'badge-ok'}">${f.status==='desligado'?'Desligado':'Ativo'}</span></td>
        <td>
          <button class="icon-btn" data-verfunc="${f.id}" title="Ver/editar">✎</button>
          <button class="icon-btn" data-delfunc="${f.id}" title="Excluir" style="color:var(--danger);">✕</button>
        </td>
      </tr>
    `).join('');
    tbody.querySelectorAll('[data-verfunc]').forEach(b=> b.addEventListener('click', ()=> abrirFuncionarioModal(funcionarios.find(f=>f.id===b.dataset.verfunc)) ));
    tbody.querySelectorAll('[data-delfunc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        openModal(`
          <h3>Excluir funcionário?</h3>
          <p class="muted">O histórico de pagamentos/férias/avisos/atestados dele não será apagado, só o cadastro.</p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="btnCancelDelFunc">Cancelar</button>
            <button class="btn btn-accent" style="background:var(--danger);" id="btnConfirmDelFunc">Excluir</button>
          </div>
        `);
        document.getElementById('btnCancelDelFunc').addEventListener('click', closeModal);
        document.getElementById('btnConfirmDelFunc').addEventListener('click', async ()=>{
          await funcionarioExcluir(b.dataset.delfunc);
          funcionarios = funcionarios.filter(f=>f.id!==b.dataset.delfunc);
          closeModal(); draw();
          showToast('Funcionário excluído.');
        });
      });
    });
  }
  draw();
  document.getElementById('btnNovoFuncionario').addEventListener('click', ()=> abrirFuncionarioModal(null, draw));
  window.__redrawFuncionarios = draw;
}

const ABAS_FUNC = ['Pessoais','Profissionais','Bancários'];
function abrirFuncionarioModal(f, onSalvarExtra){
  const editando = !!f;
  const d = {
    nome: f?f.nome:'', cpf: f?f.cpf:'', rg: f?f.rg:'', dataNascimento: f?f.dataNascimento:'', estadoCivil: f?f.estadoCivil:'',
    telefone: f?f.telefone:'', email: f?f.email:'', endereco: f?f.endereco:'', numero: f?f.numero:'', complemento: f?f.complemento:'',
    bairro: f?f.bairro:'', cidade: f?f.cidade:'', estado: f?f.estado:'', cep: f?f.cep:'',
    contatoEmergenciaNome: f?f.contatoEmergenciaNome:'', contatoEmergenciaTelefone: f?f.contatoEmergenciaTelefone:'',
    cargo: f?f.cargo:'', loja: f?f.loja:'', dataAdmissao: f?f.dataAdmissao:'', tipoContrato: f?(f.tipoContrato||'CLT'):'CLT',
    salario: f&&f.salario!==undefined?f.salario:null, ctpsNumero: f?f.ctpsNumero:'', ctpsSerie: f?f.ctpsSerie:'', pis: f?f.pis:'',
    status: f?(f.status||'ativo'):'ativo', dataDesligamento: f?f.dataDesligamento:'',
    banco: f?f.banco:'', agencia: f?f.agencia:'', conta: f?f.conta:'', tipoConta: f?(f.tipoConta||'corrente'):'corrente',
  };
  let abaAtiva = 'Pessoais';
  openModal(`
    <div class="section-label">${editando?'Editar funcionário':'Novo funcionário'}</div>
    <div class="mini-tabs" id="funcAbas">${ABAS_FUNC.map(a=>`<button type="button" class="btn btn-ghost btn-sm" data-fatab="${a}">${a}</button>`).join('')}</div>
    <div id="funcAbaBody"></div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnSalvarFunc">Salvar</button>
      <button class="btn btn-ghost" id="btnCancelarFunc">Cancelar</button>
    </div>
  `);
  function renderAbas(){
    document.querySelectorAll('#funcAbas [data-fatab]').forEach(b=>{
      b.classList.toggle('btn-accent', b.dataset.fatab===abaAtiva);
      b.classList.toggle('btn-ghost', b.dataset.fatab!==abaAtiva);
    });
  }
  document.querySelectorAll('#funcAbas [data-fatab]').forEach(b=> b.addEventListener('click', ()=>{ abaAtiva=b.dataset.fatab; renderCorpo(); renderAbas(); }));

  function renderCorpo(){
    const body = document.getElementById('funcAbaBody');
    if(abaAtiva==='Pessoais'){
      body.innerHTML = `
        <div class="grid-2">
          <div class="field"><label>Nome completo</label><input id="fu_nome" value="${escapeHtml(d.nome)}"></div>
          <div class="field"><label>CPF</label><input id="fu_cpf" value="${escapeHtml(d.cpf)}"></div>
          <div class="field"><label>RG</label><input id="fu_rg" value="${escapeHtml(d.rg)}"></div>
          <div class="field"><label>Data de nascimento</label><input type="date" id="fu_dataNascimento" value="${d.dataNascimento||''}"></div>
          <div class="field"><label>Estado civil</label><input id="fu_estadoCivil" value="${escapeHtml(d.estadoCivil)}"></div>
          <div class="field"><label>Telefone</label><input id="fu_telefone" value="${escapeHtml(d.telefone)}"></div>
          <div class="field"><label>E-mail</label><input type="email" id="fu_email" value="${escapeHtml(d.email)}"></div>
          <div class="field"><label>CEP</label><input id="fu_cep" value="${escapeHtml(d.cep)}"></div>
        </div>
        <div class="grid-3">
          <div class="field"><label>Endereço</label><input id="fu_endereco" value="${escapeHtml(d.endereco)}"></div>
          <div class="field"><label>Número</label><input id="fu_numero" value="${escapeHtml(d.numero)}"></div>
          <div class="field"><label>Complemento</label><input id="fu_complemento" value="${escapeHtml(d.complemento)}"></div>
        </div>
        <div class="grid-3">
          <div class="field"><label>Bairro</label><input id="fu_bairro" value="${escapeHtml(d.bairro)}"></div>
          <div class="field"><label>Cidade</label><input id="fu_cidade" value="${escapeHtml(d.cidade)}"></div>
          <div class="field"><label>Estado</label><input id="fu_estado" maxlength="2" style="text-transform:uppercase;" value="${escapeHtml(d.estado)}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Contato de emergência</label><input id="fu_contatoEmergenciaNome" value="${escapeHtml(d.contatoEmergenciaNome)}"></div>
          <div class="field"><label>Telefone do contato</label><input id="fu_contatoEmergenciaTelefone" value="${escapeHtml(d.contatoEmergenciaTelefone)}"></div>
        </div>
      `;
    } else if(abaAtiva==='Profissionais'){
      body.innerHTML = `
        <div class="grid-2">
          <div class="field"><label>Cargo</label><input id="fu_cargo" value="${escapeHtml(d.cargo)}"></div>
          <div class="field"><label>Loja</label>
            <select id="fu_loja"><option value="">—</option>${(config.lojas||[]).map(l=>`<option value="${escapeHtml(l.nome)}" ${d.loja===l.nome?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Data de admissão</label><input type="date" id="fu_dataAdmissao" value="${d.dataAdmissao||''}"></div>
          <div class="field"><label>Tipo de contrato</label>
            <select id="fu_tipoContrato">${['CLT','Estágio','PJ','Autônomo'].map(t=>`<option value="${t}" ${d.tipoContrato===t?'selected':''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Salário (R$)</label><input type="number" step="0.01" id="fu_salario" value="${d.salario!==null?d.salario:''}"></div>
          <div class="field"><label>PIS/PASEP</label><input id="fu_pis" value="${escapeHtml(d.pis)}"></div>
          <div class="field"><label>CTPS — número</label><input id="fu_ctpsNumero" value="${escapeHtml(d.ctpsNumero)}"></div>
          <div class="field"><label>CTPS — série</label><input id="fu_ctpsSerie" value="${escapeHtml(d.ctpsSerie)}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Status</label>
            <select id="fu_status"><option value="ativo" ${d.status==='ativo'?'selected':''}>Ativo</option><option value="desligado" ${d.status==='desligado'?'selected':''}>Desligado</option></select>
          </div>
          <div class="field"><label>Data de desligamento <span class="muted">(se houver)</span></label><input type="date" id="fu_dataDesligamento" value="${d.dataDesligamento||''}"></div>
        </div>
      `;
    } else if(abaAtiva==='Bancários'){
      body.innerHTML = `
        <div class="grid-2">
          <div class="field"><label>Banco</label><input id="fu_banco" value="${escapeHtml(d.banco)}"></div>
          <div class="field"><label>Tipo de conta</label>
            <select id="fu_tipoConta"><option value="corrente" ${d.tipoConta==='corrente'?'selected':''}>Corrente</option><option value="poupanca" ${d.tipoConta==='poupanca'?'selected':''}>Poupança</option></select>
          </div>
          <div class="field"><label>Agência</label><input id="fu_agencia" value="${escapeHtml(d.agencia)}"></div>
          <div class="field"><label>Conta</label><input id="fu_conta" value="${escapeHtml(d.conta)}"></div>
        </div>
      `;
    }
    // religa os campos já preenchidos com o holder `d`, pra não perder ao trocar de aba
    body.querySelectorAll('input, select').forEach(el=>{
      const campo = el.id.replace('fu_','');
      el.addEventListener('input', ()=>{ d[campo] = el.value; });
      el.addEventListener('change', ()=>{ d[campo] = el.value; });
    });
  }
  renderCorpo(); renderAbas();

  document.getElementById('btnCancelarFunc').addEventListener('click', closeModal);
  document.getElementById('btnSalvarFunc').addEventListener('click', async ()=>{
    if(!d.nome || !d.nome.trim()){ abaAtiva='Pessoais'; renderCorpo(); renderAbas(); showToast('Informe o nome do funcionário.'); return; }
    const dados = { id: f?f.id:uid('func'), ...d, salario: d.salario===''||d.salario===null?null:parseFloat(d.salario), criadoEm: f?f.criadoEm:Date.now() };
    const ok = await funcionarioSalvar(dados);
    if(ok){
      const idx = funcionarios.findIndex(x=>x.id===dados.id);
      if(idx>=0) funcionarios[idx] = dados; else funcionarios.push(dados);
      closeModal();
      if(onSalvarExtra) onSalvarExtra(); else if(window.__redrawFuncionarios) window.__redrawFuncionarios();
      showToast(editando ? 'Funcionário atualizado.' : 'Funcionário cadastrado.');
    }
  });
}

/* ============================================================
   REGISTROS (Pagamentos / Férias / Avisos / Atestados) — mesma estrutura de tela, campos por tipo
   ============================================================ */
const CAMPOS_POR_TIPO = {
  pagamento: {
    titulo: 'Pagamento', tituloPlural: 'Pagamentos',
    campos: [
      { id:'mesReferencia', label:'Mês de referência', tipo:'month' },
      { id:'salarioBase', label:'Salário base (R$)', tipo:'number' },
      { id:'horasExtras', label:'Horas extras (R$)', tipo:'number' },
      { id:'adicionais', label:'Adicionais (R$)', tipo:'number' },
      { id:'descontos', label:'Descontos — INSS/FGTS/faltas (R$)', tipo:'number' },
      { id:'dataPagamento', label:'Data do pagamento', tipo:'date' },
      { id:'observacoes', label:'Observações', tipo:'textarea' },
    ],
    colunas: ['mesReferencia','valorLiquido','dataPagamento'],
  },
  ferias: {
    titulo: 'Período de férias', tituloPlural: 'Férias',
    campos: [
      { id:'periodoAquisitivoInicio', label:'Período aquisitivo — início', tipo:'date' },
      { id:'periodoAquisitivoFim', label:'Período aquisitivo — fim', tipo:'date' },
      { id:'dataInicio', label:'Início das férias', tipo:'date' },
      { id:'dataFim', label:'Fim das férias', tipo:'date' },
      { id:'diasTirados', label:'Dias tirados', tipo:'number' },
      { id:'abonoPecuniario', label:'Vendeu 1/3 (abono pecuniário)?', tipo:'select', opcoes:['Não','Sim'] },
      { id:'observacoes', label:'Observações', tipo:'textarea' },
    ],
    colunas: ['dataInicio','dataFim','diasTirados'],
  },
  aviso: {
    titulo: 'Aviso/Advertência', tituloPlural: 'Avisos',
    campos: [
      { id:'tipoAviso', label:'Tipo', tipo:'select', opcoes:['Verbal','Escrita'] },
      { id:'motivo', label:'Motivo', tipo:'text' },
      { id:'descricao', label:'Descrição', tipo:'textarea' },
    ],
    colunas: ['tipoAviso','motivo'],
  },
  atestado: {
    titulo: 'Atestado médico', tituloPlural: 'Atestados',
    campos: [
      { id:'dataInicio', label:'Início do afastamento', tipo:'date' },
      { id:'dataFim', label:'Fim do afastamento', tipo:'date' },
      { id:'diasAfastamento', label:'Dias de afastamento', tipo:'number' },
      { id:'cid', label:'CID (opcional)', tipo:'text' },
      { id:'motivo', label:'Motivo', tipo:'text' },
      { id:'observacoes', label:'Observações', tipo:'textarea' },
    ],
    colunas: ['dataInicio','dataFim','diasAfastamento'],
  },
};

function renderRegistros(main, tipo){
  const meta = CAMPOS_POR_TIPO[tipo];
  main.innerHTML = `
    <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 class="page-title">${meta.tituloPlural}</h1>
        <p class="page-sub">Histórico por funcionário.</p>
      </div>
      <button class="btn btn-accent" id="btnNovoRegistro">+ Novo</button>
    </div>
    <div class="filters">
      <select id="fFunc"><option value="">Todos os funcionários</option>${funcionarios.map(f=>`<option value="${f.id}">${escapeHtml(f.nome)}</option>`).join('')}</select>
    </div>
    <div class="card" style="padding:14px 18px;">
      <table>
        <thead><tr><th>Funcionário</th>${meta.colunas.map(c=>`<th>${meta.campos.find(x=>x.id===c)?meta.campos.find(x=>x.id===c).label:(c==='valorLiquido'?'Valor líquido':c)}</th>`).join('')}<th></th></tr></thead>
        <tbody id="tbodyReg"></tbody>
      </table>
    </div>
  `;
  function valorFmt(reg, campoId){
    if(campoId==='valorLiquido'){
      const liquido = (Number(reg.salarioBase)||0) + (Number(reg.horasExtras)||0) + (Number(reg.adicionais)||0) - (Number(reg.descontos)||0);
      return fmtMoeda(liquido);
    }
    const campo = meta.campos.find(c=>c.id===campoId);
    const val = reg[campoId];
    if(campo && campo.tipo==='date') return fmtDate(val);
    if(campo && campo.tipo==='month') return val||'—';
    if(campo && campo.tipo==='number') return val!==undefined && val!==null && val!=='' ? val : '—';
    return escapeHtml(val||'—');
  }
  function draw(){
    const lista = registros.filter(r=>r.tipo===tipo);
    const filtroFunc = document.getElementById('fFunc').value;
    const filtrada = lista.filter(r=> !filtroFunc || r.funcionarioId===filtroFunc).slice().reverse();
    const tbody = document.getElementById('tbodyReg');
    if(filtrada.length===0){ tbody.innerHTML = `<tr><td colspan="${meta.colunas.length+2}" class="empty">Nenhum registro ainda.</td></tr>`; return; }
    tbody.innerHTML = filtrada.map(r=>`
      <tr>
        <td><b>${escapeHtml(nomeFuncionario(r.funcionarioId))}</b></td>
        ${meta.colunas.map(c=>`<td>${valorFmt(r,c)}</td>`).join('')}
        <td>
          <button class="icon-btn" data-verreg="${r.id}" title="Ver/editar">✎</button>
          <button class="icon-btn" data-delreg="${r.id}" title="Excluir" style="color:var(--danger);">✕</button>
        </td>
      </tr>
    `).join('');
    tbody.querySelectorAll('[data-verreg]').forEach(b=> b.addEventListener('click', ()=> abrirRegistroModal(tipo, registros.find(r=>r.id===b.dataset.verreg), draw) ));
    tbody.querySelectorAll('[data-delreg]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        await registroExcluir(b.dataset.delreg);
        registros = registros.filter(r=>r.id!==b.dataset.delreg);
        draw();
        showToast('Registro excluído.');
      });
    });
  }
  draw();
  document.getElementById('fFunc').addEventListener('change', draw);
  document.getElementById('btnNovoRegistro').addEventListener('click', ()=> abrirRegistroModal(tipo, null, draw));
}

function abrirRegistroModal(tipo, r, onSalvo){
  const meta = CAMPOS_POR_TIPO[tipo];
  const editando = !!r;
  openModal(`
    <div class="section-label">${editando?'Editar':'Novo'} — ${meta.titulo}</div>
    <div class="field"><label>Funcionário</label><select id="rg_funcionarioId">${funcionarioOptionsHtml(r?r.funcionarioId:'')}</select></div>
    ${meta.campos.map(c=>{
      const val = r ? (r[c.id]!==undefined?r[c.id]:'') : '';
      if(c.tipo==='textarea') return `<div class="field"><label>${c.label}</label><textarea id="rg_${c.id}" rows="2">${escapeHtml(val)}</textarea></div>`;
      if(c.tipo==='select') return `<div class="field"><label>${c.label}</label><select id="rg_${c.id}">${c.opcoes.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      if(c.tipo==='number') return `<div class="field"><label>${c.label}</label><input type="number" step="0.01" id="rg_${c.id}" value="${val}"></div>`;
      if(c.tipo==='date') return `<div class="field"><label>${c.label}</label><input type="date" id="rg_${c.id}" value="${val||''}"></div>`;
      if(c.tipo==='month') return `<div class="field"><label>${c.label}</label><input type="month" id="rg_${c.id}" value="${val||''}"></div>`;
      return `<div class="field"><label>${c.label}</label><input id="rg_${c.id}" value="${escapeHtml(val)}"></div>`;
    }).join('')}
    <div class="modal-actions">
      <button class="btn btn-accent" id="btnSalvarReg">Salvar</button>
      <button class="btn btn-ghost" id="btnCancelarReg">Cancelar</button>
    </div>
  `);
  document.getElementById('btnCancelarReg').addEventListener('click', closeModal);
  document.getElementById('btnSalvarReg').addEventListener('click', async ()=>{
    const funcionarioId = document.getElementById('rg_funcionarioId').value;
    if(!funcionarioId){ showToast('Selecione o funcionário.'); return; }
    const dados = { id: r?r.id:uid('dpreg'), tipo, funcionarioId, data: todayStr(), criadoEm: r?r.criadoEm:Date.now() };
    meta.campos.forEach(c=>{
      const el = document.getElementById('rg_'+c.id);
      dados[c.id] = c.tipo==='number' ? (el.value===''?null:parseFloat(el.value)) : el.value;
    });
    const ok = await registroSalvar(dados);
    if(ok){
      const idx = registros.findIndex(x=>x.id===dados.id);
      if(idx>=0) registros[idx] = dados; else registros.push(dados);
      closeModal();
      onSalvo();
      showToast(editando ? 'Registro atualizado.' : 'Registro salvo.');
    }
  });
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'dp' }, '*');
    return;
  }
})();
</script>
</body>
