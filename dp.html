<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departamento Pessoal · Vilaça Joias</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5;
  --ok:#1E7A46; --ok-soft:#E3F5EA;
  --wait:#8A5A1F; --wait-soft:#FDD49E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-wa{ background:#25D366; color:#fff; }
.icon-btn-wa:hover{ background:#1DA851; }
.icon-btn:hover{background:rgba(255,255,255,0.1);}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}
.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); box-shadow:0 2px 10px -4px rgba(43,15,31,0.08); overflow-x:auto;}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-wait{background:var(--wait-soft); color:var(--wait);}
.badge-erro{background:var(--danger-soft); color:var(--danger);}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.mini-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#2B0F1F; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>
</head>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>

    <div class="login-title">Acessar DP</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>

</div>

<div id="view-app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">DP</div>

  <nav class="mobile-tabbar" id="mobileTabbar"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
const FUNCIONARIO_ACESSO_URL = SUPABASE_URL + "/functions/v1/funcionario-acesso";
const realSupabaseClient = (window.supabase && typeof window.supabase.createClient==='function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let config = null;
let __configCarregadaOk = false; // só permite salvar depois de carregar a config de verdade — evita sobrescrever com vazio
let funcionarios = [];
let registros = [];
let currentUser = null;
let currentTab = 'funcionarios';
let __gatewaySenha = null;

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
async function chamarFuncionarioAcesso(body){
  try{
    const res = await fetch(FUNCIONARIO_ACESSO_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    return await res.json();
  }catch(e){
    console.error('erro ao falar com o servidor (acesso)', e);
    return { error: 'Não foi possível conectar. Verifique sua internet.' };
  }
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFotoParaDrive(dataUrl, filename, pasta, tratar){
  if(!realSupabaseClient) throw new Error('upload indisponível');
  const { data, error } = await realSupabaseClient.functions.invoke('upload-foto-drive', {
    body: { dataUrl, filename, pasta, tratar }
  });
  if(error) throw error;
  if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
  return data;
}
async function configSave(){
  if(!__configCarregadaOk){ showToast('Configuração não carregada — recarregue a página antes de salvar.'); return false; }
  try{
    const { error } = await supabaseClient.from('gestao_config').upsert({ id:'config', payload: config });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar config', e); showToast('Erro ao salvar. Tente novamente.'); return false; }
}
function cargoLabelPrincipal(cargos){
  const c = cargos||[];
  if(c.includes('diretor')) return 'Diretor(a)';
  if(c.includes('gerente')) return 'Gerente';
  if(c.includes('vendedora')) return 'Vendedora';
  if(c.includes('oficina')) return 'Oficina';
  return '';
}

/* ============================================================
   PERFIS DE ACESSO — migrado do módulo Cadastro a pedido do Felipe.
   MODULOS_APP/permissoesPadrao/permissoesDoUsuario são cópias das mesmas funções
   do index.html (cada módulo do app mantém sua própria cópia dessas definições,
   seguindo o padrão já usado no resto do projeto).
   ============================================================ */
const MODULOS_APP = {
  transferencias: { nome:'Transferências e Reposições', abas:[
    { id:'transferencias', label:'Transferências' },
    { id:'reposicao', label:'Reposição' },
  ]},
  os: { nome:'Painel de O.S.', abas:[
    { id:'painel', label:'Painel' },
    { id:'agenda', label:'Agenda' },
    { id:'clientes', label:'Clientes' },
    { id:'codigo', label:'Código' },
  ]},
  vendas: { nome:'Vendas (PDV)', abas:[
    { id:'vendas', label:'Vendas' },
  ]},
  caixa: { nome:'Caixa', abas:[] },
  orcamentos: { nome:'Orçamentos', abas:[
    { id:'novo', label:'Novo orçamento' },
    { id:'lista', label:'Orçamentos' },
  ]},
  vendapg: { nome:'Venda PG', abas:[] },
  conciliacao: { nome:'Conciliação de Cartão', abas:[
    { id:'conciliar', label:'Conciliar' },
    { id:'taxas', label:'Taxas e Prazos' },
  ]},
  dp: { nome:'Departamento Pessoal', abas:[] },
  ia: { nome:'Inteligência Artificial', abas:[] },
  gastos: { nome:'Gastos', abas:[
    { id:'lancamentos', label:'Lançamentos' },
    { id:'agenda', label:'Agenda' },
  ]},
  marketing: { nome:'Marketing', abas:[
    { id:'aniversario', label:'Aniversário' },
    { id:'orcamentos', label:'Orçamentos' },
    { id:'maladire', label:'Mala Direta' },
  ]},
  dashboard: { nome:'Dashboard', abas:[] },
  config: { nome:'Cadastro', abas:[
    { id:'clientes', label:'Clientes' },
    { id:'produto', label:'Produto' },
    { id:'lojas', label:'Lojas' },
    { id:'pagamento', label:'Formas de Pagamento' },
    { id:'impressao', label:'Impressão & Etiquetas' },
    { id:'statusOrcamento', label:'Status de Orçamento' },
    { id:'mensagens', label:'Mensagens' },
  ]},
};
function permissoesPadrao(nivel){
  const todasAbas = (moduloId)=>{ const o={}; MODULOS_APP[moduloId].abas.forEach(a=>o[a.id]=true); return o; };
  if(nivel==='diretoria' || nivel==='gerente'){
    return {
      transferencias:{ ativo:true, abas:todasAbas('transferencias') },
      os:{ ativo:true, abas:todasAbas('os') },
      vendas:{ ativo:true, abas:todasAbas('vendas') },
      caixa:{ ativo:true },
      orcamentos:{ ativo:true, abas:todasAbas('orcamentos') },
      vendapg:{ ativo:true },
      conciliacao:{ ativo:true, abas:todasAbas('conciliacao') },
      dp:{ ativo:true },
      ia:{ ativo:true },
      gastos:{ ativo:true, abas:todasAbas('gastos') },
      marketing:{ ativo:true, abas:todasAbas('marketing') },
      dashboard:{ ativo:true }, config:{ ativo:true, abas:todasAbas('config') },
    };
  }
  if(nivel==='oficina'){
    return {
      transferencias:{ ativo:false, abas:{} },
      os:{ ativo:true, abas:{ painel:true, agenda:true, clientes:false, codigo:true } },
      vendas:{ ativo:false, abas:{} },
      caixa:{ ativo:false },
      orcamentos:{ ativo:false, abas:{} },
      vendapg:{ ativo:false },
      conciliacao:{ ativo:false, abas:{} },
      dp:{ ativo:true },
      ia:{ ativo:true },
      gastos:{ ativo:false, abas:{} },
      marketing:{ ativo:false, abas:{} },
      dashboard:{ ativo:true }, config:{ ativo:false, abas:{} },
    };
  }
  return {
    transferencias:{ ativo:true, abas:todasAbas('transferencias') },
    os:{ ativo:true, abas:{ painel:true, agenda:true, clientes:true, codigo:false } },
    vendas:{ ativo:true, abas:todasAbas('vendas') },
    caixa:{ ativo:true },
    orcamentos:{ ativo:true, abas:todasAbas('orcamentos') },
    vendapg:{ ativo:true },
    conciliacao:{ ativo:false, abas:{} },
    dp:{ ativo:true },
    ia:{ ativo:true },
    gastos:{ ativo:true, abas:{ lancamentos:true, agenda:true } },
    marketing:{ ativo:true, abas:todasAbas('marketing') },
    dashboard:{ ativo:true }, config:{ ativo:true, abas:{ clientes:true, produto:false, lojas:false, pagamento:false, impressao:false, statusOrcamento:false, mensagens:false } },
  };
}
function permissoesDoUsuario(u){
  const padrao = permissoesPadrao(u.nivel);
  if(!u.permissoes) return padrao;
  const mesclado = {};
  Object.keys(padrao).forEach(moduloId=>{
    const salvo = u.permissoes[moduloId];
    if(!salvo){ mesclado[moduloId] = padrao[moduloId]; return; }
    const abasPadrao = padrao[moduloId].abas || {};
    const abasSalvas = salvo.abas || {};
    mesclado[moduloId] = { ativo: salvo.ativo, abas: { ...abasPadrao, ...abasSalvas } };
  });
  return mesclado;
}
function resumoPermissoesHtml(u){
  const p = permissoesDoUsuario(u);
  const chips = Object.keys(MODULOS_APP).filter(m=> p[m] && p[m].ativo).map(m=>MODULOS_APP[m].nome);
  return chips.length ? chips.map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join(' ') : `<span class="chip" style="background:var(--danger-soft); color:var(--danger);">Nenhum acesso</span>`;
}
function abasChecklistHtml(moduloId, permissoesModulo){
  const mod = MODULOS_APP[moduloId];
  if(!mod.abas.length) return '';
  const abasAtuais = (permissoesModulo && permissoesModulo.abas) || {};
  return `
    <div class="cargo-checks" style="margin:6px 0 2px 22px; flex-direction:column; align-items:flex-start; gap:6px;" data-abaswrap="${moduloId}">
      ${mod.abas.map(a=>`
        <label><input type="checkbox" class="chk-aba" data-modulo="${moduloId}" data-aba="${a.id}" ${abasAtuais[a.id]?'checked':''}> ${escapeHtml(a.label)}</label>
      `).join('')}
    </div>
  `;
}
function modulosChecklistHtml(permissoes){
  return Object.keys(MODULOS_APP).map(moduloId=>{
    const mod = MODULOS_APP[moduloId];
    const ativo = permissoes[moduloId] && permissoes[moduloId].ativo;
    return `
      <div style="margin-bottom:10px;">
        <label style="display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; text-transform:none; letter-spacing:0;">
          <input type="checkbox" class="chk-modulo" data-modulo="${moduloId}" ${ativo?'checked':''}> ${escapeHtml(mod.nome)}
        </label>
        <div data-abasslot="${moduloId}" style="display:${ativo?'':'none'};">${abasChecklistHtml(moduloId, permissoes[moduloId])}</div>
      </div>
    `;
  }).join('');
}
function wirePermissoesChecklist(container){
  container.querySelectorAll('.chk-modulo').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const slot = container.querySelector(`[data-abasslot="${chk.dataset.modulo}"]`);
      if(slot) slot.style.display = chk.checked ? '' : 'none';
    });
  });
}
function lerPermissoesDoFormulario(container){
  const permissoes = {};
  Object.keys(MODULOS_APP).forEach(moduloId=>{
    const chkModulo = container.querySelector(`.chk-modulo[data-modulo="${moduloId}"]`);
    const ativo = !!(chkModulo && chkModulo.checked);
    const abas = {};
    container.querySelectorAll(`.chk-aba[data-modulo="${moduloId}"]`).forEach(chkAba=>{
      abas[chkAba.dataset.aba] = chkAba.checked;
    });
    permissoes[moduloId] = MODULOS_APP[moduloId].abas.length ? { ativo, abas } : { ativo };
  });
  return permissoes;
}
function openAcessoModal(usuario){
  const permissoesIniciais = usuario ? permissoesDoUsuario(usuario) : permissoesPadrao('vendedora');
  openModal(`
    <div class="section-label">${usuario ? 'Editar acesso' : 'Novo acesso'}</div>
    <div class="grid-3">
      <div class="field"><label>Nome</label><input id="ac_nome" value="${escapeHtml(usuario?usuario.nome:'')}" placeholder="Nome"></div>
      <div class="field"><label>Senha</label><input id="ac_senha" value="${escapeHtml(usuario?usuario.senha:'')}" placeholder="Senha"></div>
      <div class="field"><label>Nível (referência)</label>
        <select id="ac_nivel">

async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function levelLabel(n){ return n==='diretoria'?'Diretoria':n==='gerente'?'Gerente':n==='oficina'?'Oficina':n==='vendedora'?'Vendedora':'Personalizado'; }
/** Só diretoria/gerente podem criar, editar ou excluir no DP — vendedora/oficina só visualizam a própria ficha. */
function podeEditarDP(){ return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente'); }

/** Nome que aparece nas listas: apelido do cadastro, ou nome completo se não tiver. */
function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Venda antiga foi salva com o nome completo, venda nova com o apelido: bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** Rótulo de cargo a partir dos cargos marcados em Cadastro → Funcionários. */
function cargoLabelDosCargos(cargos){
  const c = cargos || [];
  if(c.includes('diretor')) return 'Diretor(a)';
  if(c.includes('gerente')) return 'Gerente';
  if(c.includes('vendedora')) return 'Vendedora';
  if(c.includes('oficina')) return 'Oficina';
  return '';
}
/**
 * Junta o cadastro central (config.funcionarios, criado em Cadastro → Funcionários) com as
 * fichas de RH (dp_funcionarios). Quem já tem ficha aparece com a ficha; quem foi cadastrado
 * só com nome + função aparece aqui mesmo assim, com a ficha ainda em branco, pronta pra
 * ser preenchida no ✎. Assim o DP nunca fica com uma lista menor que a do Cadastro.
 */
function mesclarFuncionariosDoCadastro(fichas, cfg){
  const doCadastro = (cfg && Array.isArray(cfg.funcionarios)) ? cfg.funcionarios : [];
  const jaTemFicha = new Set();
  fichas.forEach(p=>{
    if(p.funcionarioId) jaTemFicha.add(p.funcionarioId);
    if(p.nome) jaTemFicha.add('nome:' + p.nome.trim().toLowerCase());
  });
  const pendentes = doCadastro
    .filter(f=> !jaTemFicha.has(f.id) && !jaTemFicha.has('nome:' + (f.nome||'').trim().toLowerCase()))
    .map(f=>({
      id: 'dpf_' + f.id,          // id estável: ao salvar o ✎ vira uma ficha de verdade, sem duplicar
      funcionarioId: f.id,
      nome: f.nome,
      apelido: f.apelido||'',
      cargo: cargoLabelDosCargos(f.cargos),
      status: 'ativo',
      semFicha: true,             // só pra mostrar o aviso na lista
      criadoEm: Date.now(),
    }));
  return fichas.concat(pendentes);
}

/** Aba Vendas: total vendido por funcionário direto do PDV e das O.S. entregues (dado real, não depende de sync manual). */
async function renderVendasDP(main){
  main.innerHTML = `<div class="page-head"><h1 class="page-title">Vendas</h1><p class="page-sub">Carregando...</p></div>`;
  const podeVerTodos = podeEditarDP();
  const [vendasPdv, ordensEntregues] = await Promise.all([vendasPdvGet(), ordensEntreguesGet()]);
  let mesFiltro = new Date().toISOString().slice(0,7);

  function desenhar(){
    const vendasDoMes = vendasPdv.filter(v=> (v.data||'').startsWith(mesFiltro));
    const ordensDoMes = ordensEntregues.filter(o=> (o.data||'').startsWith(mesFiltro));
    let listaFuncionarios = funcionarios.filter(f=>f.status!=='desligado');
    // vendedora/oficina só podem ver a própria linha aqui — não o comparativo de todo mundo
    if(!podeVerTodos){
      listaFuncionarios = listaFuncionarios.filter(f=> funcionarioBateComNome(f, currentUser && currentUser.nome));
    }
    const linhas = listaFuncionarios.map(f=>{
      const minhasVendas = vendasDoMes.filter(v=> funcionarioBateComNome(f, v.vendedora));
      const minhasOrdens = ordensDoMes.filter(o=> funcionarioBateComNome(f, o.vendedora));
      const totalPdv = minhasVendas.reduce((acc,v)=> acc + (Number(v.valorTotal)||0), 0);
      const totalOs = minhasOrdens.reduce((acc,o)=> acc + (Number(o.valorTotal)||0), 0);
      return { nome:nomeExibicaoFuncionario(f), qtdPdv:minhasVendas.length, totalPdv, qtdOs:minhasOrdens.length, totalOs, total:totalPdv+totalOs };
    }).sort((a,b)=>b.total-a.total);

    const historicoConferencias = podeVerTodos
      ? registros.filter(r=>r.tipo==='vendaspg').filter(r=> r.mesReferencia===mesFiltro).slice().reverse()
      : [];

    main.innerHTML = `
      <div class="page-head">
        <h1 class="page-title">Vendas</h1>
        <p class="page-sub">${podeVerTodos ? 'Direto do PDV e das O.S. entregues — atualizado em tempo real, não depende de conferência manual.' : 'Suas vendas, direto do PDV e das O.S. entregues.'}</p>
      </div>
      <div class="card" style="max-width:220px; padding:14px 18px;">
        <div class="field" style="margin-bottom:0;"><label>Mês</label><input type="month" id="vdp_mes" value="${mesFiltro}"></div>
      </div>
      <div class="card" style="padding:14px 18px;">
        <table>
          <thead><tr><th>Funcionário</th><th>Vendas PDV</th><th>Valor PDV</th><th>O.S. entregues</th><th>Valor O.S.</th><th>Total</th></tr></thead>
          <tbody>
            ${linhas.length===0 ? `<tr><td colspan="6" class="empty">Nenhum funcionário cadastrado ainda.</td></tr>` : linhas.map(l=>`
              <tr>
                <td><b>${escapeHtml(l.nome)}</b></td>
                <td>${l.qtdPdv}</td>
                <td>${fmtMoeda(l.totalPdv)}</td>
                <td>${l.qtdOs}</td>
                <td>${fmtMoeda(l.totalOs)}</td>
                <td><b>${fmtMoeda(l.total)}</b></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      ${historicoConferencias.length>0 ? `
        <div class="card" style="padding:14px 18px;">
          <div class="section-label" style="border:none; padding:0; margin-bottom:10px;">Conferências do Venda PG nesse mês <span class="muted" style="text-transform:none; font-weight:400;">(por categoria, confirmadas pela diretoria)</span></div>
          <table>
            <thead><tr><th>Funcionário</th><th>Loja</th><th>Total (categorias)</th></tr></thead>
            <tbody>
              ${historicoConferencias.map(r=>{
                const total = ['alianca','fabricacao','servico','represOuro','represPrata','relogio'].reduce((acc,c)=> acc + (Number(r[c])||0), 0);
                return `<tr><td>${escapeHtml(nomeFuncionario(r.funcionarioId))}</td><td>${escapeHtml(r.loja||'—')}</td><td>${fmtMoeda(total)}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      ` : ''}
    `;
    document.getElementById('vdp_mes').addEventListener('change', e=>{ mesFiltro = e.target.value; desenhar(); });
  }
  desenhar();
}

function renderFuncionarios(main){
  const podeEditar = podeEditarDP();
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">Funcionários</h1>
      <p class="page-sub">${podeEditar ? 'Cadastro único por funcionário: função (usada nos módulos), dados pessoais, profissionais, bancários e acesso — tudo numa aba só.' : 'Suas informações cadastradas.'}</p>
    </div>
    <div class="card" style="padding:14px 18px;">
      <table>
        <thead><tr><th>Nome</th><th>Cargo</th><th>Loja</th><th>Admissão</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbodyFunc"></tbody>
      </table>
    </div>
    ${podeEditar ? `
    <div class="card" style="padding:14px 18px;">
      <div class="section-label" style="margin-top:0;">Novo funcionário</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
        <div class="field" style="flex:1; min-width:180px; margin-bottom:0;"><input id="func_nome" placeholder="Nome do funcionário"></div>
        <div class="field" style="flex:0 1 150px; min-width:120px; margin-bottom:0;"><input id="func_apelido" placeholder="Apelido (opcional)"></div>
        <div class="cargo-checks">
          <label><input type="checkbox" value="vendedora" class="func_cargo_new"> Vendedora</label>
          <label><input type="checkbox" value="oficina" class="func_cargo_new"> Oficina</label>
          <label><input type="checkbox" value="gerente" class="func_cargo_new"> Gerente</label>
          <label><input type="checkbox" value="diretor" class="func_cargo_new"> Diretor(a)</label>
        </div>
        <div class="field" style="flex:0 1 200px; min-width:170px; margin-bottom:0;">
          <select id="func_lojaNova"><option value="">Loja de acesso...</option>${(config.lojas||[]).map(l=>`<option value="${l.id}">${escapeHtml(l.nome)}</option>`).join('')}</select>
        </div>
        <div class="field" style="flex:0 1 220px; min-width:180px; margin-bottom:0;"><input type="email" id="func_emailNovo" placeholder="E-mail (opcional — envia link de cadastro)"></div>
        <button class="btn btn-accent btn-sm" id="btnAddFunc">+ Adicionar</button>
      </div>
    </div>
    ` : ''}
  `;
  function draw(){
    const tbody = document.getElementById('tbodyFunc');
    if(funcionarios.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="empty">${podeEditar?'Nenhum funcionário cadastrado ainda.':'Nenhuma informação encontrada.'}</td></tr>`; return; }
    tbody.innerHTML = funcionarios.slice().reverse().map(f=>`
      <tr>
        <td><b>${escapeHtml(f.nome)}</b>${(f.apelido||'').trim()?` <span class="muted">(${escapeHtml(f.apelido)})</span>`:''}${f.semFicha?` <span class="badge" style="margin-left:6px; font-size:11px;">ficha em branco</span>`:''}</td>
        <td>${escapeHtml(f.cargo||'—')}</td>
        <td>${escapeHtml(f.loja||'—')}</td>
        <td>${fmtDate(f.dataAdmissao)}</td>
        <td><span class="badge ${f.status==='desligado'?'badge-erro':'badge-ok'}">${f.status==='desligado'?'Desligado':'Ativo'}</span></td>
        <td>
          <button class="icon-btn" data-verfunc="${f.id}" title="${podeEditar?'Ver/editar':'Ver'}">${podeEditar?'✎':'👁'}</button>
        </td>
      </tr>
    `).join('');
    tbody.querySelectorAll('[data-verfunc]').forEach(b=> b.addEventListener('click', async ()=>{
      // Busca fresca antes de abrir: evita mostrar uma ficha desatualizada (ex: o
      // funcionário acabou de preencher o link de autocadastro dele) e nunca duplica.
      const idClicado = b.dataset.verfunc;
      const alvoAntigo = funcionarios.find(f=>f.id===idClicado);
      const funcionarioIdAlvo = alvoAntigo ? alvoAntigo.funcionarioId : null;
      funcionarios = mesclarFuncionariosDoCadastro(await funcionariosGet(), config);
      if(window.__redrawFuncionarios) window.__redrawFuncionarios();
      const atualizado = funcionarios.find(f=> (funcionarioIdAlvo && f.funcionarioId===funcionarioIdAlvo) || f.id===idClicado);
      const funcionarioCadastro = (config.funcionarios||[]).find(fc=> fc.id === (funcionarioIdAlvo || (atualizado&&atualizado.funcionarioId)) );
      abrirFuncionarioCompletoModal(funcionarioCadastro || { id: funcionarioIdAlvo, nome: (atualizado||alvoAntigo).nome, apelido: (atualizado||alvoAntigo).apelido||'', cargos: [] });
    }));
  }
  draw();
  window.__redrawFuncionarios = draw;

  if(podeEditar){
    document.getElementById('btnAddFunc').addEventListener('click', async ()=>{
      const nome = document.getElementById('func_nome').value.trim();
      const apelido = document.getElementById('func_apelido').value.trim();
      const cargos = Array.from(document.querySelectorAll('.func_cargo_new:checked')).map(c=>c.value);
      const lojaEscolhida = document.getElementById('func_lojaNova').value;
      const email = document.getElementById('func_emailNovo').value.trim();
      if(!nome){ showToast('Informe o nome do funcionário.'); return; }
      if(cargos.length===0){ showToast('Selecione ao menos uma função.'); return; }
      if(!lojaEscolhida){ showToast('Selecione a loja de acesso do funcionário.'); return; }
      const novoId = uid('func');
      config.funcionarios = Array.isArray(config.funcionarios) ? config.funcionarios : [];
      config.funcionarios.push({ id: novoId, nome, apelido, cargos });
      const ok = await configSave();
      if(!ok) return;
      // Já deixa o acesso inicializado (nível Vendedora + a loja escolhida aqui).
      // A diretoria pode ajustar depois pela aba Acesso do cadastro completo.
      await chamarFuncionarioAcesso({ op:'inicializarAcesso', senha: __gatewaySenha, funcionarioId: novoId, loja: lojaEscolhida });
      let mensagem = 'Funcionário cadastrado.';
      if(email){
        const rConvite = await chamarFuncionarioAcesso({ op:'enviarConviteCadastro', senha: __gatewaySenha, funcionarioId: novoId, email });
        mensagem = (rConvite && rConvite.ok)
          ? 'Funcionário cadastrado! Link de cadastro enviado por e-mail (válido por 1 dia).'
          : 'Funcionário cadastrado, mas não foi possível enviar o link por e-mail: ' + ((rConvite && rConvite.error) || 'erro desconhecido');
      }
      funcionarios = mesclarFuncionariosDoCadastro(await funcionariosGet(), config);
      renderFuncionarios(main);
      showToast(mensagem);
    });
  }
}

const ABAS_FUNC_COMPLETO = ['Básico','Pessoais','Profissionais','Bancários','Acesso'];
/**
 * Cadastro completo e unificado de um funcionário: a função/cargo (usada em todo o
 * app pros módulos de venda/O.S./Venda PG) fica na mesma tela que os dados de RH
 * (pessoais/profissionais/bancários). Migrado do módulo Cadastro pro Departamento
 * Pessoal a pedido do Felipe — o cadastro é um só, compartilhado entre os dois.
 */
async function abrirFuncionarioCompletoModal(funcionario){
  const podeEditar = podeEditarDP();
  const todosPerfis = await funcionariosGet(); // sempre busca fresco (funcionariosGet não usa cache)
  let perfil = todosPerfis.find(p=>p.funcionarioId===funcionario.id);
  const abasVisiveis = currentUser.nivel==='diretoria' ? ABAS_FUNC_COMPLETO : ABAS_FUNC_COMPLETO.filter(a=>a!=='Acesso');
  const usuarioAcesso = (config.users||[]).find(u=>u.funcionarioId===funcionario.id);
  const d = {
    nome: funcionario.nome, apelido: funcionario.apelido||'', cargos: [...(funcionario.cargos||[])], foto: perfil?(perfil.foto||''):'',
    cpf: perfil?perfil.cpf:'', rg: perfil?perfil.rg:'', dataNascimento: perfil?perfil.dataNascimento:'', estadoCivil: perfil?perfil.estadoCivil:'',
    telefoneFixo: perfil?perfil.telefoneFixo:'', celularParticular: perfil?perfil.celularParticular:'', celularLoja: perfil?perfil.celularLoja:'',
    temFilhos: perfil?(perfil.temFilhos||'nao'):'nao', filhos: perfil&&Array.isArray(perfil.filhos)?perfil.filhos.map(f=>({...f})):[],
    email: perfil?perfil.email:'', endereco: perfil?perfil.endereco:'', numero: perfil?perfil.numero:'',
    complemento: perfil?perfil.complemento:'', bairro: perfil?perfil.bairro:'', cidade: perfil?perfil.cidade:'', estado: perfil?perfil.estado:'', cep: perfil?perfil.cep:'',
    contatoEmergenciaNome: perfil?perfil.contatoEmergenciaNome:'', contatoEmergenciaTelefone: perfil?perfil.contatoEmergenciaTelefone:'',
    loja: perfil?perfil.loja:'', dataAdmissao: perfil?perfil.dataAdmissao:'', tipoContrato: perfil?(perfil.tipoContrato||'CLT'):'CLT',
    experiencia1Data: perfil?perfil.experiencia1Data:'', experiencia1Dias: perfil?perfil.experiencia1Dias:'',
    experiencia2Data: perfil?perfil.experiencia2Data:'', experiencia2Dias: perfil?perfil.experiencia2Dias:'',
    salario: perfil&&perfil.salario!==undefined?perfil.salario:null, ctpsNumero: perfil?perfil.ctpsNumero:'', ctpsSerie: perfil?perfil.ctpsSerie:'', pis: perfil?perfil.pis:'',
    status: perfil?(perfil.status||'ativo'):'ativo', dataDesligamento: perfil?perfil.dataDesligamento:'',
    banco: perfil?perfil.banco:'', agencia: perfil?perfil.agencia:'', conta: perfil?perfil.conta:'', tipoConta: perfil?(perfil.tipoConta||'corrente'):'corrente',
    tipoPix: perfil?(perfil.tipoPix||''):'', chavePix: perfil?perfil.chavePix:'',
    nivelAcesso: usuarioAcesso?usuarioAcesso.nivel:'vendedora',
    lojasAcesso: usuarioAcesso&&Array.isArray(usuarioAcesso.lojas)?[...usuarioAcesso.lojas]:[],
  };
  let abaAtiva = 'Básico';
  openModal(`
    <div class="section-label">${podeEditar?'Cadastro completo':'Meus dados'} — ${escapeHtml(funcionario.nome)}</div>
    <div class="mini-tabs" id="fcAbas" style="display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;">${abasVisiveis.map(a=>`<button type="button" class="btn btn-ghost btn-sm" data-fctab="${a}">${a}</button>`).join('')}</div>
    <div id="fcAbaBody"></div>
    <div class="modal-actions">
      ${podeEditar ? `<button class="btn btn-accent" id="btnSalvarFuncCompleto">Salvar</button>` : ''}
      <button class="btn btn-ghost" id="btnCancelarFuncCompleto">${podeEditar?'Cancelar':'Fechar'}</button>
    </div>
  `);
  function renderAbas(){
    document.querySelectorAll('#fcAbas [data-fctab]').forEach(b=>{
      b.classList.toggle('btn-accent', b.dataset.fctab===abaAtiva);
      b.classList.toggle('btn-ghost', b.dataset.fctab!==abaAtiva);
    });
  }
  document.querySelectorAll('#fcAbas [data-fctab]').forEach(b=> b.addEventListener('click', ()=>{ abaAtiva=b.dataset.fctab; renderCorpo(); renderAbas(); }));

  function desabilitarSeSomenteLeitura(body){
    if(podeEditar) return;
    body.querySelectorAll('input, select, button:not(#btnCancelarFuncCompleto)').forEach(el=>{ el.disabled = true; });
  }

  function renderCorpo(){
    const body = document.getElementById('fcAbaBody');
    if(!body) return; // modal já foi fechado (ex: usuário saiu enquanto uma ação assíncrona ainda rodava)
    if(abaAtiva==='Básico'){
      body.innerHTML = `
        <div class="field"><label>Nome completo</label><input id="fc_nome" value="${escapeHtml(d.nome)}"></div>
        <div class="field"><label>Apelido</label><input id="fc_apelido" value="${escapeHtml(d.apelido||'')}" placeholder="Como aparece nas listas dos módulos">
          <p class="muted" style="margin:4px 0 0; font-size:12px;">É este nome que aparece nas listas de seleção dos outros módulos (venda, O.S., orçamento, transferências, Venda PG). Se ficar em branco, usa o nome completo.</p>
        </div>
        <div class="section-label" style="margin-top:6px; border:none; padding:0;">Função (usada nos módulos de venda, O.S., Venda PG...)</div>
        <div class="cargo-checks">
          <label><input type="checkbox" value="vendedora" class="fc_cargo" ${d.cargos.includes('vendedora')?'checked':''}> Vendedora</label>
          <label><input type="checkbox" value="oficina" class="fc_cargo" ${d.cargos.includes('oficina')?'checked':''}> Oficina</label>
          <label><input type="checkbox" value="gerente" class="fc_cargo" ${d.cargos.includes('gerente')?'checked':''}> Gerente</label>
          <label><input type="checkbox" value="diretor" class="fc_cargo" ${d.cargos.includes('diretor')?'checked':''}> Diretor(a)</label>
        </div>
        <div id="fc_fotoArea"></div>
      `;
      montarFotoFuncionario();
      document.getElementById('fc_nome').addEventListener('input', e=> d.nome = e.target.value);
      document.querySelectorAll('.fc_cargo').forEach(el=>{
        el.addEventListener('change', ()=>{
          d.cargos = Array.from(document.querySelectorAll('.fc_cargo:checked')).map(c=>c.value);
        });
      });
      function montarFotoFuncionario(){
        const area = document.getElementById('fc_fotoArea');
        area.innerHTML = `
          <div class="section-label" style="margin-top:14px;">Foto do funcionário</div>
          <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
            ${d.foto ? `<img src="${escapeHtml(d.foto)}" style="width:84px; height:84px; border-radius:50%; object-fit:cover; border:1px solid var(--line);">` : `<div style="width:84px; height:84px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:11px; text-align:center;">Sem foto</div>`}
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <input type="file" accept="image/*" id="fc_inputAnexarFoto" style="display:none;">
              <input type="file" accept="image/*" capture="user" id="fc_inputTirarFoto" style="display:none;">
              <button type="button" class="btn btn-ghost btn-sm" id="fc_btnAnexarFoto">📎 Anexar foto</button>
              <button type="button" class="btn btn-ghost btn-sm" id="fc_btnTirarFoto">📷 Tirar foto</button>
              ${d.foto ? `<button type="button" class="btn btn-ghost btn-sm" id="fc_btnRemoverFoto" style="color:var(--danger);">Remover</button>` : ''}
            </div>
          </div>
          <div class="muted" id="fc_fotoStatus" style="margin-top:6px;"></div>
        `;
        document.getElementById('fc_btnAnexarFoto').addEventListener('click', ()=> document.getElementById('fc_inputAnexarFoto').click());
        document.getElementById('fc_btnTirarFoto').addEventListener('click', ()=> document.getElementById('fc_inputTirarFoto').click());
        document.getElementById('fc_inputAnexarFoto').addEventListener('change', e=> processarFotoFuncionario(e.target.files[0]));
        document.getElementById('fc_inputTirarFoto').addEventListener('change', e=> processarFotoFuncionario(e.target.files[0]));
        const btnRemover = document.getElementById('fc_btnRemoverFoto');
        if(btnRemover) btnRemover.addEventListener('click', ()=>{ d.foto = ''; montarFotoFuncionario(); });
        desabilitarSeSomenteLeitura(area);
      }
      async function processarFotoFuncionario(file){
        if(!file) return;
        const status = document.getElementById('fc_fotoStatus');
        status.textContent = 'Enviando foto...';
        try{
          const dataUrl = await readFileAsDataUrl(file);
          const nomeArquivo = 'funcionario_' + (funcionario.id||'novo') + '_' + Date.now() + '.jpg';
          const resultado = await uploadFotoParaDrive(dataUrl, nomeArquivo, 'funcionarios', false);
          d.foto = resultado.url;
          status.textContent = '';
          montarFotoFuncionario();
        }catch(e){
          console.error('erro ao enviar foto do funcionário', e);
          status.textContent = 'Não foi possível enviar a foto. Tente novamente.';
        }
      }
    } else if(abaAtiva==='Pessoais'){
      body.innerHTML = `
        <div class="grid-2">
          <div class="field"><label>CPF</label><input id="fc_cpf" value="${escapeHtml(d.cpf)}"></div>
          <div class="field"><label>RG</label><input id="fc_rg" value="${escapeHtml(d.rg)}"></div>
          <div class="field"><label>Data de nascimento</label><input type="date" id="fc_dataNascimento" value="${d.dataNascimento||''}"></div>
          <div class="field"><label>Estado civil</label><select id="fc_estadoCivil">
            <option value="">—</option>
            ${['Solteiro(a)','Casado(a)','União estável','Divorciado(a)','Viúvo(a)'].map(o=>`<option value="${o}" ${d.estadoCivil===o?'selected':''}>${o}</option>`).join('')}
          </select></div>
          <div class="field"><label>E-mail</label><input type="email" id="fc_email" value="${escapeHtml(d.email)}"></div>
          <div class="field"><label>CEP</label><input id="fc_cep" value="${escapeHtml(d.cep)}"></div>
        </div>
        <div class="section-label" style="margin-top:6px; border:none; padding:0;">Telefones</div>
        <div class="grid-3">
          <div class="field"><label>Fixo</label><input id="fc_telefoneFixo" value="${escapeHtml(d.telefoneFixo)}"></div>
          <div class="field"><label>Celular particular</label><input id="fc_celularParticular" value="${escapeHtml(d.celularParticular)}"></div>
          <div class="field"><label>Celular da loja</label><input id="fc_celularLoja" value="${escapeHtml(d.celularLoja)}"></div>
        </div>
        <div class="grid-3">
          <div class="field"><label>Endereço</label><input id="fc_endereco" value="${escapeHtml(d.endereco)}"></div>
          <div class="field"><label>Número</label><input id="fc_numero" value="${escapeHtml(d.numero)}"></div>
          <div class="field"><label>Complemento</label><input id="fc_complemento" value="${escapeHtml(d.complemento)}"></div>
        </div>
        <div class="grid-3">
          <div class="field"><label>Bairro</label><input id="fc_bairro" value="${escapeHtml(d.bairro)}"></div>
          <div class="field"><label>Cidade</label><input id="fc_cidade" value="${escapeHtml(d.cidade)}"></div>
          <div class="field"><label>Estado</label><input id="fc_estado" maxlength="2" style="text-transform:uppercase;" value="${escapeHtml(d.estado)}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Contato de emergência</label><input id="fc_contatoEmergenciaNome" value="${escapeHtml(d.contatoEmergenciaNome)}"></div>
          <div class="field"><label>Telefone do contato</label><input id="fc_contatoEmergenciaTelefone" value="${escapeHtml(d.contatoEmergenciaTelefone)}"></div>
        </div>
        <div class="section-label" style="margin-top:6px; border:none; padding:0;">Filhos</div>
        <div class="field"><label>Tem filhos?</label>
          <select id="fc_temFilhos">
            <option value="nao" ${d.temFilhos==='nao'?'selected':''}>Não</option>
            <option value="sim" ${d.temFilhos==='sim'?'selected':''}>Sim</option>
          </select>
        </div>
        <div id="fc_filhosArea"></div>
      `;
      ligarCampos(body);
      montarSecaoFilhos();
      document.getElementById('fc_temFilhos').addEventListener('change', e=>{
        d.temFilhos = e.target.value;
        if(d.temFilhos==='sim' && d.filhos.length===0) d.filhos = [{ dataNascimento:'' }];
        if(d.temFilhos==='nao') d.filhos = [];
        montarSecaoFilhos();
      });
      function montarSecaoFilhos(){
        const area = document.getElementById('fc_filhosArea');
        if(d.temFilhos!=='sim'){ area.innerHTML=''; return; }
        area.innerHTML = `
          <div class="field" style="max-width:160px;"><label>Quantos filhos?</label><input type="number" min="1" id="fc_qtdFilhos" value="${d.filhos.length||1}"></div>
          <div id="fc_filhosLista"></div>
        `;
        desenharListaFilhos();
        document.getElementById('fc_qtdFilhos').addEventListener('input', e=>{
          const qtd = Math.max(1, parseInt(e.target.value)||1);
          const atual = d.filhos.length;
          if(qtd > atual){ for(let i=atual;i<qtd;i++) d.filhos.push({ dataNascimento:'' }); }
          else if(qtd < atual){ d.filhos = d.filhos.slice(0, qtd); }
          desenharListaFilhos();
        });
        desabilitarSeSomenteLeitura(area);
      }
      function calcularIdade(dataNasc){
        if(!dataNasc) return null;
        const hoje = new Date(); const nasc = new Date(dataNasc+'T00:00:00');
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if(m<0 || (m===0 && hoje.getDate()<nasc.getDate())) idade--;
        return idade>=0 ? idade : null;
      }
      function desenharListaFilhos(){
        const lista = document.getElementById('fc_filhosLista');
        lista.innerHTML = d.filhos.map((f,i)=>{
          const idade = calcularIdade(f.dataNascimento);
          return `
          <div class="grid-2" style="align-items:end;">
            <div class="field"><label>Data de nascimento — filho(a) ${i+1}</label><input type="date" data-filhodata="${i}" value="${f.dataNascimento||''}"></div>

        lista.querySelectorAll('[data-filhodata]').forEach(el=>{
          el.addEventListener('input', ()=>{
            d.filhos[Number(el.dataset.filhodata)].dataNascimento = el.value;
            desenharListaFilhos();
          });
        });
        desabilitarSeSomenteLeitura(lista);
      }
    } else if(abaAtiva==='Profissionais'){
      body.innerHTML = `
        <div class="grid-2">
          <div class="field"><label>Loja</label><select id="fc_loja"><option value="">—</option>${(config.lojas||[]).map(l=>`<option value="${escapeHtml(l.nome)}" ${d.loja===l.nome?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select></div>
          <div class="field"><label>Data de admissão</label><input type="date" id="fc_dataAdmissao" value="${d.dataAdmissao||''}"></div>
          <div class="field"><label>Tipo de contrato</label><select id="fc_tipoContrato">${['CLT','Estágio','PJ','Autônomo'].map(t=>`<option value="${t}" ${d.tipoContrato===t?'selected':''}>${t}</option>`).join('')}</select></div>
          ${currentUser.nivel==='diretoria' ? `<div class="field"><label>Salário (R$)</label><input type="number" step="0.01" id="fc_salario" value="${d.salario!==null?d.salario:''}"></div>` : ''}
          <div class="field"><label>PIS/PASEP</label><input id="fc_pis" value="${escapeHtml(d.pis)}"></div>
          <div class="field"><label>CTPS — número</label><input id="fc_ctpsNumero" value="${escapeHtml(d.ctpsNumero)}"></div>
          <div class="field"><label>CTPS — série</label><input id="fc_ctpsSerie" value="${escapeHtml(d.ctpsSerie)}"></div>

      document.getElementById('btnSalvarAcesso').addEventListener('click', async ()=>{

        const btn = document.getElementById('btnEnviarConviteCadastro');

          showToast('Link de cadastro completo enviado! Válido por 24 horas.');

          if(configAtualizada) config.users = configAtualizada.users || [];

        } else {

  function ligarCampos(body){
    body.querySelectorAll('input, select').forEach(el=>{
      const campo = el.id.replace('fc_','');
      const handler = ()=>{ d[campo] = el.value; };
      el.addEventListener('input', handler);
      el.addEventListener('change', handler);
    });
  }
  renderCorpo(); renderAbas();

  document.getElementById('btnCancelarFuncCompleto').addEventListener('click', closeModal);
  if(podeEditar)
  document.getElementById('btnSalvarFuncCompleto').addEventListener('click', async ()=>{
    if(!d.nome || !d.nome.trim()){ abaAtiva='Básico'; renderCorpo(); renderAbas(); showToast('Informe o nome.'); return; }
    if(d.cargos.length===0){ abaAtiva='Básico'; renderCorpo(); renderAbas(); showToast('Selecione ao menos uma função.'); return; }
    // 1) Atualiza o básico (config.funcionarios) — usado em todo o app
    const funcCadastro = (config.funcionarios||[]).find(f=>f.id===funcionario.id);
    if(funcCadastro){
      funcCadastro.nome = d.nome.trim();
      funcCadastro.apelido = (d.apelido||'').trim();
      funcCadastro.cargos = d.cargos;
    }
    const okConfig = await configSave();
    // 2) Atualiza/cria o perfil de RH (dp_funcionarios), ligado por funcionarioId — confere de
    // novo, fresco, se já não existe uma ficha (ex: o funcionário preencheu o link de
    // autocadastro dele enquanto esta tela estava aberta), pra nunca duplicar o cadastro.
    const perfisFrescos = await funcionariosGet();
    const perfilAtual = perfisFrescos.find(p=>p.funcionarioId===funcionario.id) || perfil;
    const perfilFinal = {
      id: perfilAtual ? perfilAtual.id : uid('func'),
      funcionarioId: funcionario.id,
      nome: d.nome.trim(), apelido: (d.apelido||'').trim(), foto: d.foto, cpf:d.cpf, rg:d.rg, dataNascimento:d.dataNascimento, estadoCivil:d.estadoCivil,
      telefoneFixo:d.telefoneFixo, celularParticular:d.celularParticular, celularLoja:d.celularLoja,
      temFilhos:d.temFilhos, filhos: d.temFilhos==='sim' ? d.filhos : [],
      email:d.email, endereco:d.endereco, numero:d.numero, complemento:d.complemento,
      bairro:d.bairro, cidade:d.cidade, estado:d.estado, cep:d.cep,
      contatoEmergenciaNome:d.contatoEmergenciaNome, contatoEmergenciaTelefone:d.contatoEmergenciaTelefone,
      cargo: cargoLabelPrincipal(d.cargos), loja:d.loja, dataAdmissao:d.dataAdmissao, tipoContrato:d.tipoContrato,
      experiencia1Data:d.experiencia1Data, experiencia1Dias: d.experiencia1Dias===''?null:parseInt(d.experiencia1Dias),
      experiencia2Data:d.experiencia2Data, experiencia2Dias: d.experiencia2Dias===''?null:parseInt(d.experiencia2Dias),
      salario: d.salario===''||d.salario===null?null:parseFloat(d.salario), ctpsNumero:d.ctpsNumero, ctpsSerie:d.ctpsSerie, pis:d.pis,
      status:d.status, dataDesligamento:d.dataDesligamento,
      banco:d.banco, agencia:d.agencia, conta:d.conta, tipoConta:d.tipoConta, tipoPix:d.tipoPix, chavePix:d.chavePix,
      criadoEm: perfilAtual ? perfilAtual.criadoEm : Date.now(),
    };
    const okPerfil = await funcionarioSalvar(perfilFinal);
    if(okConfig && okPerfil){
      closeModal();
      funcionarios = mesclarFuncionariosDoCadastro(await funcionariosGet(), config);
      if(window.__redrawFuncionarios) window.__redrawFuncionarios();
      showToast('Cadastro do funcionário atualizado.');
    }
  });
}

function renderRegistros(main, tipo){
  const meta = CAMPOS_POR_TIPO[tipo];
  const podeEditar = podeEditarDP();
  main.innerHTML = `
    <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 class="page-title">${meta.tituloPlural}</h1>
        <p class="page-sub">${podeEditar ? 'Histórico por funcionário.' : 'Seu histórico.'}</p>
      </div>
      ${podeEditar ? `<button class="btn btn-accent" id="btnNovoRegistro">+ Novo</button>` : ''}
    </div>
    <div class="filters">
      <select id="fFunc"><option value="">Todos os funcionários</option>${funcionarios.map(f=>`<option value="${f.funcionarioId||f.id}">${escapeHtml(nomeExibicaoFuncionario(f))}</option>`).join('')}</select>
    </div>
    <div class="card" style="padding:14px 18px;">
      <table>
        <thead><tr><th>Funcionário</th>${meta.colunas.map(c=>`<th>${meta.campos.find(x=>x.id===c)?meta.campos.find(x=>x.id===c).label:(c==='valorLiquido'?'Valor líquido':c==='totalItens'?'Total Itens':c)}</th>`).join('')}${tipo==='aviso'?'<th>Status</th>':''}<th></th></tr></thead>
        <tbody id="tbodyReg"></tbody>
      </table>
    </div>
  `;
  function valorFmt(reg, campoId){
    if(campoId==='valorLiquido'){
      const liquido = (Number(reg.salarioBase)||0) + (Number(reg.horasExtras)||0) + (Number(reg.adicionais)||0) - (Number(reg.descontos)||0);
      return fmtMoeda(liquido);
    }
    if(campoId==='totalItens'){
      const total = ['alianca','fabricacao','servico','represOuro','represPrata','relogio'].reduce((acc,c)=> acc + (Number(reg[c])||0), 0);
      return fmtMoeda(total);
    }
    const campo = meta.campos.find(c=>c.id===campoId);
    const val = reg[campoId];
    if(campo && campo.tipo==='date') return fmtDate(val);
    if(campo && campo.tipo==='month') return val||'—';
    if(campo && campo.tipo==='number') return val!==undefined && val!==null && val!=='' ? val : '—';
    return escapeHtml(val||'—');
  }
  function statusAdvertencia(r){
    if(r.confirmadoEm) return { texto:'Ciente', classe:'badge-ok' };
    if(r.notificadoEm) return { texto:'Notificado', classe:'badge-wait' };
    return { texto:'Pendente', classe:'badge-loja' };
  }
  function draw(){
    const lista = registros.filter(r=>r.tipo===tipo);
    const filtroFunc = document.getElementById('fFunc').value;
    const filtrada = lista.filter(r=> !filtroFunc || r.funcionarioId===filtroFunc).slice().reverse();
    const tbody = document.getElementById('tbodyReg');
    if(filtrada.length===0){ tbody.innerHTML = `<tr><td colspan="${meta.colunas.length+2}" class="empty">Nenhum registro ainda.</td></tr>`; return; }
    tbody.innerHTML = filtrada.map(r=>{
      const st = tipo==='aviso' ? statusAdvertencia(r) : null;
      return `
      <tr>
        <td><b>${escapeHtml(nomeFuncionario(r.funcionarioId))}</b></td>
        ${meta.colunas.map(c=>`<td>${valorFmt(r,c)}</td>`).join('')}
        ${tipo==='aviso' ? `<td><span class="badge ${st.classe}">${st.texto}</span></td>` : ''}
        <td>
          <button class="icon-btn" data-verreg="${r.id}" title="${podeEditar?'Ver/editar':'Ver'}">${podeEditar?'✎':'👁'}</button>
          ${tipo==='aviso' && podeEditar ? `
            <button class="icon-btn icon-btn-wa" data-notwa="${r.id}" title="Notificar por WhatsApp">💬</button>
            <button class="icon-btn" data-notemail="${r.id}" title="Notificar por e-mail">✉️</button>
          ` : ''}
          ${podeEditar ? `<button class="icon-btn" data-delreg="${r.id}" title="Excluir" style="color:var(--danger);">✕</button>` : ''}
        </td>
      </tr>
    `;
    }).join('');
    tbody.querySelectorAll('[data-verreg]').forEach(b=> b.addEventListener('click', ()=> abrirRegistroModal(tipo, registros.find(r=>r.id===b.dataset.verreg), draw) ));
    tbody.querySelectorAll('[data-notwa]').forEach(b=> b.addEventListener('click', ()=> notificarPorWhatsapp(registros.find(r=>r.id===b.dataset.notwa), draw) ));
    tbody.querySelectorAll('[data-notemail]').forEach(b=> b.addEventListener('click', ()=> notificarPorEmail(registros.find(r=>r.id===b.dataset.notemail), draw, b) ));
    tbody.querySelectorAll('[data-delreg]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        await registroExcluir(b.dataset.delreg);
        registros = registros.filter(r=>r.id!==b.dataset.delreg);
        draw();
        showToast('Registro excluído.');
      });
    });
  }
  draw();
  document.getElementById('fFunc').addEventListener('change', draw);
  if(document.getElementById('btnNovoRegistro')) document.getElementById('btnNovoRegistro').addEventListener('click', ()=> abrirRegistroModal(tipo, null, draw));
}

/** O telefone usado pra notificar é sempre o celular particular — nunca o fixo ou o da loja. */
function onlyDigitsDp(s){ return (s||'').replace(/\D/g,''); }
async function marcarNotificado(registro){
  if(!registro.notificadoEm){
    registro.notificadoEm = new Date().toISOString();
    await registroSalvar(registro);
  }
}
function notificarPorWhatsapp(registro, redesenhar){
  const funcionario = funcionarios.find(f=>f.id===registro.funcionarioId);
  const tel = onlyDigitsDp(funcionario && funcionario.celularParticular);
  if(!tel){ showToast('Esse funcionário não tem celular particular cadastrado (Cadastro → Funcionários).'); return; }
  const linkConfirmacao = window.location.origin + '/advertencia.html?id=' + registro.id;
  const msg = `Olá, ${funcionario.nome}! Você recebeu uma notificação de advertência. Por favor, confirme o recebimento no link: ${linkConfirmacao}`;
  window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
  marcarNotificado(registro).then(redesenhar);
}
async function notificarPorEmail(registro, redesenhar, botao){
  const funcionario = funcionarios.find(f=>f.id===registro.funcionarioId);
  const email = funcionario && funcionario.email;
  if(!email){ showToast('Esse funcionário não tem e-mail cadastrado.'); return; }
  if(botao){ botao.disabled = true; }
  const linkConfirmacao = window.location.origin + '/advertencia.html?id=' + registro.id;
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-email-gmail', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({
        to: email, subject: 'Notificação de Advertência — Vilaça Joias',
        body: `Olá, ${funcionario.nome}!\n\nVocê recebeu uma notificação de advertência. Por favor, acesse o link abaixo pra confirmar o recebimento:\n${linkConfirmacao}\n\nAtenciosamente,\nVilaça Joias`,
      }),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'falha');
    showToast('E-mail enviado.');
    await marcarNotificado(registro);
    redesenhar();
  }catch(e){ showToast('Não foi possível enviar o e-mail.'); }
  if(botao){ botao.disabled = false; }
}

function abrirRegistroModal(tipo, r, onSalvo){
  const meta = CAMPOS_POR_TIPO[tipo];
  const editando = !!r;
  const podeEditar = podeEditarDP();
  const funcionarioAtual = r ? funcionarios.find(f=>f.id===r.funcionarioId) : null;
  openModal(`
    <div class="section-label">${podeEditar ? ((editando?'Editar':'Novo')+' — '+meta.titulo) : meta.titulo}</div>
    <div class="field"><label>Funcionário</label><select id="rg_funcionarioId" ${podeEditar?'':'disabled'}>${funcionarioOptionsHtml(r?r.funcionarioId:'')}</select></div>
    ${meta.campos.map(c=>{
      const val = r ? (r[c.id]!==undefined?r[c.id]:'') : '';
      const dis = podeEditar?'':'disabled';
      if(c.tipo==='textarea') return `<div class="field"><label>${c.label}</label><textarea id="rg_${c.id}" rows="2" ${dis}>${escapeHtml(val)}</textarea></div>`;
      if(c.tipo==='select') return `<div class="field"><label>${c.label}</label><select id="rg_${c.id}" ${dis}>${c.opcoes.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      if(c.tipo==='number') return `<div class="field"><label>${c.label}</label><input type="number" step="0.01" id="rg_${c.id}" value="${val}" ${dis}></div>`;
      if(c.tipo==='date') return `<div class="field"><label>${c.label}</label><input type="date" id="rg_${c.id}" value="${val||''}" ${dis}></div>`;
      if(c.tipo==='month') return `<div class="field"><label>${c.label}</label><input type="month" id="rg_${c.id}" value="${val||''}" ${dis}></div>`;
      return `<div class="field"><label>${c.label}</label><input id="rg_${c.id}" value="${escapeHtml(val)}" ${dis}></div>`;
    }).join('')}
    ${tipo==='aviso' && editando ? `
      <div class="section-label" style="margin-top:16px;">Status da notificação</div>
      <p class="muted" style="margin:-4px 0 10px;">
        ${r.confirmadoEm ? `<span class="badge badge-ok">Ciente</span> — confirmado em ${new Date(r.confirmadoEm).toLocaleString('pt-BR')}`
          : r.notificadoEm ? `<span class="badge badge-wait">Notificado</span> — em ${new Date(r.notificadoEm).toLocaleString('pt-BR')}, aguardando confirmação`
          : `<span class="badge badge-loja">Pendente</span> — ainda não foi notificado`}
      </p>
      ${podeEditar ? `<p class="muted" style="margin-top:-4px;">Pra notificar, use os botões 💬/✉️ na lista de advertências.</p>` : ''}
    ` : ''}
    <div class="modal-actions">
      ${podeEditar ? `<button class="btn btn-accent" id="btnSalvarReg">Salvar</button>` : ''}
      <button class="btn btn-ghost" id="btnCancelarReg">${podeEditar?'Cancelar':'Fechar'}</button>
    </div>
  `);
  document.getElementById('btnCancelarReg').addEventListener('click', closeModal);
  if(document.getElementById('btnSalvarReg'))
  document.getElementById('btnSalvarReg').addEventListener('click', async ()=>{
    const funcionarioId = document.getElementById('rg_funcionarioId').value;
    if(!funcionarioId){ showToast('Selecione o funcionário.'); return; }
    const funcSelecionado = funcionarios.find(f=>f.id===funcionarioId);
    const dados = { id: r?r.id:uid('dpreg'), tipo, funcionarioId, data: todayStr(), criadoEm: r?r.criadoEm:Date.now() };
    if(tipo==='aviso'){
      dados.nomeFuncionarioSnapshot = funcSelecionado?funcSelecionado.nome:'';
      dados.confirmadoEm = r?r.confirmadoEm:null;
      dados.notificadoEm = r?r.notificadoEm:null;
    }
    meta.campos.forEach(c=>{
      const el = document.getElementById('rg_'+c.id);
      dados[c.id] = c.tipo==='number' ? (el.value===''?null:parseFloat(el.value)) : el.value;
    });
    const ok = await registroSalvar(dados);
    if(ok){
      const idx = registros.findIndex(x=>x.id===dados.id);
      if(idx>=0) registros[idx] = dados; else registros.push(dados);
      closeModal();
      onSalvo();
      showToast(editando ? 'Registro atualizado.' : 'Registro salvo.');
    }
  });
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'dp' }, '*');
    return;
  }
})();
</script>
