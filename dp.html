<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#F1F4F7;
  --ink:#1A1D24; --ink-soft:#4B5566; --ink-faint:#7C8592; --muted:#7C8592; --line:#E1E5EA;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#F3E6D8;
  --danger:#B91C1C; --danger-soft:#FBEAEA;
  --ok:#17794A; --ok-soft:#E3F5EA;
  --wait:#B45309; --wait-soft:#FCEEDC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;

.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.login-hint{color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;}
.brand-name{font-weight:700; font-size:15px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tabs button{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.75); border:none; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.tabs button.active{background:var(--gold); color:#fff;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-wa{ background:#25D366; color:#fff; }
.icon-btn-wa:hover{ background:#1DA851; }
.icon-btn:hover{background:rgba(255,255,255,0.1);}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
#mainContent .icon-btn{color:var(--ink-faint);}
#mainContent .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
#mainContent{max-width:1100px; margin:0 auto; padding:22px 18px 90px;}
.page-head{margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 4px;}
.page-sub{color:var(--muted); font-size:13.5px; margin:0;}
.card{background:var(--surface); border-radius:14px; padding:20px; margin-bottom:22px; border:1px solid var(--line); box-shadow:0 2px 10px -4px rgba(43,15,31,0.08); overflow-x:auto;}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line);}
.muted{color:var(--muted); font-size:13px;}
.empty{color:var(--ink-faint); font-size:13px; padding:14px 0;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
input[type=text], input[type=number], input[type=password], input[type=date], select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:14px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} }
.btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:700;}
.btn-primary, .btn-accent{background:var(--gold); color:#fff;}
.btn-accent:hover, .btn-primary:hover{background:#4A1830;}
.btn-ghost{background:var(--surface-2); color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-wait{background:var(--wait-soft); color:var(--wait);}
.badge-erro{background:var(--danger-soft); color:var(--danger);}
.badge-loja{background:var(--surface-2); color:var(--ink-soft);}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filters select, .filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.mini-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.mini-tabs button.active{background:var(--accent,#7a1f3d); color:#fff; border-color:transparent;}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#24101B; color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:all .2s ease; z-index:50;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; overflow-y:auto;}
.modal-overlay.show{display:flex;}
.foto-lightbox-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.82); display:none; align-items:center; justify-content:center; z-index:80; padding:24px;}
.foto-lightbox-overlay.show{display:flex;}
.foto-lightbox-box{position:relative; max-width:min(90vw,560px); max-height:88vh;}
.foto-lightbox-box img{display:block; max-width:100%; max-height:88vh; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.foto-lightbox-fechar{position:absolute; top:-14px; right:-14px; width:34px; height:34px; border-radius:50%; background:var(--surface); color:var(--ink); border:none; font-size:16px; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;}
.modal{background:var(--surface); color:var(--ink); border-radius:16px; max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:26px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.mobile-tabbar{display:none;}
@media (max-width:760px){
  .mobile-tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40;}
  .mobile-tabbar button{flex:1; background:none; border:none; color:rgba(255,255,255,0.6); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;}
  .mobile-tabbar button.active{color:var(--gold);}
  .mt-icon{font-size:17px;}
  .tabs{display:none;}
}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
html.embedded .mobile-tabbar{display:none !important;}
</style>

<script>

function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
const FUNCIONARIO_ACESSO_URL = SUPABASE_URL + "/functions/v1/funcionario-acesso";
const realSupabaseClient = (window.supabase && typeof window.supabase.createClient==='function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let config = null;
let __configCarregadaOk = false; // só permite salvar depois de carregar a config de verdade — evita sobrescrever com vazio

let registros = [];

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },

}
async function chamarFuncionarioAcesso(body){
  try{
    const res = await fetch(FUNCIONARIO_ACESSO_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFotoParaDrive(dataUrl, filename, pasta, tratar){
  if(!realSupabaseClient) throw new Error('upload indisponível');
  const { data, error } = await realSupabaseClient.functions.invoke('upload-foto-drive', {
    body: { dataUrl, filename, pasta, tratar, senha: __gatewaySenha }
  });
  if(error) throw error;
  if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
  return data;
}
async function configSave(){
  if(!__configCarregadaOk){ showToast('Configuração não carregada — recarregue a página antes de salvar.'); return false; }
  try{
    const { error } = await supabaseClient.from('gestao_config').upsert({ id:'config', payload: config });
    if(error) throw error;
    return true;
  }catch(e){ console.error('erro ao salvar config', e); showToast('Erro ao salvar. Tente novamente.'); return false; }
}
function cargoLabelPrincipal(cargos){
  const c = cargos||[];
  if(c.includes('diretor')) return 'Diretor(a)';

  if(c.includes('vendedora')) return 'Vendedora';

}

/* ============================================================
   PERFIS DE ACESSO — migrado do módulo Cadastro a pedido do Felipe.
   MODULOS_APP/permissoesPadrao/permissoesDoUsuario são cópias das mesmas funções
   do index.html (cada módulo do app mantém sua própria cópia dessas definições,

const MODULOS_APP = {
  transferencias: { nome:'Transferências e Reposições', abas:[
    { id:'transferencias', label:'Transferências' },
    { id:'reposicao', label:'Reposição' },
  ]},
  os: { nome:'Painel de O.S.', abas:[

  ]},

  ]},
  dp: { nome:'Departamento Pessoal', abas:[] },

  gastos: { nome:'Gastos', abas:[

  ]},

    { id:'maladire', label:'Mala Direta' },
  ]},
  reforma: { nome:'Reforma (cliente → O.S.)', abas:[] },
  dashboard: { nome:'Dashboard', abas:[] },
  config: { nome:'Cadastro', abas:[
    { id:'clientes', label:'Clientes' },
    { id:'produto', label:'Produto' },
    { id:'lojas', label:'Lojas' },
    { id:'pagamento', label:'Formas de Pagamento' },
    { id:'impressao', label:'Impressão & Etiquetas' },

};
function permissoesPadrao(nivel){
  const todasAbas = (moduloId)=>{ const o={}; MODULOS_APP[moduloId].abas.forEach(a=>o[a.id]=true); return o; };
  if(nivel==='diretoria' || nivel==='gerente'){
    return {
      transferencias:{ ativo:true, abas:todasAbas('transferencias') },
      os:{ ativo:true, abas:todasAbas('os') },
      vendas:{ ativo:true, abas:todasAbas('vendas') },
      caixa:{ ativo:true },
      gravacoes:{ ativo:true },
      orcamentos:{ ativo:true, abas:todasAbas('orcamentos') },
      conciliacao:{ ativo:true, abas:todasAbas('conciliacao') },
      dp:{ ativo:true },
      atendimento:{ ativo:true },
      ia:{ ativo:true },
      gastos:{ ativo:true, abas:todasAbas('gastos') },
      marketing:{ ativo:true, abas:todasAbas('marketing') },
      reforma:{ ativo:true },
      dashboard:{ ativo:true }, config:{ ativo:true, abas:todasAbas('config') },
    };
  }
  if(nivel==='oficina'){
    return {
      transferencias:{ ativo:false, abas:{} },
      os:{ ativo:true, abas:{ painel:true, agenda:true, clientes:false, codigo:true } },
      vendas:{ ativo:false, abas:{} },
      caixa:{ ativo:false },
      gravacoes:{ ativo:true },
      orcamentos:{ ativo:false, abas:{} },
      conciliacao:{ ativo:false, abas:{} },
      dp:{ ativo:true },
      atendimento:{ ativo:true },
      ia:{ ativo:true },
      gastos:{ ativo:false, abas:{} },
      marketing:{ ativo:false, abas:{} },
      reforma:{ ativo:false },
      dashboard:{ ativo:true }, config:{ ativo:false, abas:{} },
    };
  }
  return {
    transferencias:{ ativo:true, abas:todasAbas('transferencias') },
    os:{ ativo:true, abas:{ painel:true, agenda:true, clientes:true, codigo:false } },
    vendas:{ ativo:true, abas:todasAbas('vendas') },
    caixa:{ ativo:true },
    gravacoes:{ ativo:true },
    orcamentos:{ ativo:true, abas:todasAbas('orcamentos') },
    conciliacao:{ ativo:false, abas:{} },
    dp:{ ativo:true },

    ia:{ ativo:true },
    gastos:{ ativo:true, abas:{ lancamentos:true, agenda:true } },
    marketing:{ ativo:true, abas:todasAbas('marketing') },
    reforma:{ ativo:true },
    dashboard:{ ativo:true }, config:{ ativo:true, abas:{ clientes:true, produto:false, lojas:false, pagamento:false, impressao:false, statusOrcamento:false, mensagens:false } },
  };
}
function permissoesDoUsuario(u){
  const padrao = permissoesPadrao(u.nivel);
  if(!u.permissoes) return padrao;
  const mesclado = {};
  Object.keys(padrao).forEach(moduloId=>{
    const salvo = u.permissoes[moduloId];
    if(!salvo){ mesclado[moduloId] = padrao[moduloId]; return; }
    const abasPadrao = padrao[moduloId].abas || {};
    const abasSalvas = salvo.abas || {};
    mesclado[moduloId] = { ativo: salvo.ativo, abas: { ...abasPadrao, ...abasSalvas } };
  });
  return mesclado;
}
function resumoPermissoesHtml(u){
  const p = permissoesDoUsuario(u);
  const chips = Object.keys(MODULOS_APP).filter(m=> p[m] && p[m].ativo).map(m=>MODULOS_APP[m].nome);
  return chips.length ? chips.map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join(' ') : `<span class="chip" style="background:var(--danger-soft); color:var(--danger);">Nenhum acesso</span>`;
}
function abasChecklistHtml(moduloId, permissoesModulo){
  const mod = MODULOS_APP[moduloId];
  if(!mod.abas.length) return '';
  const abasAtuais = (permissoesModulo && permissoesModulo.abas) || {};
  return `
    <div class="cargo-checks" style="margin:6px 0 2px 22px; flex-direction:column; align-items:flex-start; gap:6px;" data-abaswrap="${moduloId}">
      ${mod.abas.map(a=>`
        <label><input type="checkbox" class="chk-aba" data-modulo="${moduloId}" data-aba="${a.id}" ${abasAtuais[a.id]?'checked':''}> ${escapeHtml(a.label)}</label>
      `).join('')}
    </div>
  `;
}
function modulosChecklistHtml(permissoes){

function wirePermissoesChecklist(container){
  container.querySelectorAll('.chk-modulo').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const slot = container.querySelector(`[data-abasslot="${chk.dataset.modulo}"]`);
      if(slot) slot.style.display = chk.checked ? '' : 'none';
    });
  });
}
function lerPermissoesDoFormulario(container){
  const permissoes = {};
  Object.keys(MODULOS_APP).forEach(moduloId=>{
    const chkModulo = container.querySelector(`.chk-modulo[data-modulo="${moduloId}"]`);
    const ativo = !!(chkModulo && chkModulo.checked);
    const abas = {};
    container.querySelectorAll(`.chk-aba[data-modulo="${moduloId}"]`).forEach(chkAba=>{
      abas[chkAba.dataset.aba] = chkAba.checked;
    });
    permissoes[moduloId] = MODULOS_APP[moduloId].abas.length ? { ativo, abas } : { ativo };
  });

}

async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
      upsert(row){
        if(table === 'gestao_config'){
          return gatewayCall({ op:'saveConfig', params:{ payload: row.payload } });
        }
        return gatewayCall({ op:'upsert', table, params:{ row } });
      },
      delete(){
        return { eq: (column, value)=> gatewayCall({ op:'delete', table, params:{ column, value } }) };
      }
    };
  }
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const p=(s||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nomeLojaPorId(id){ const l=(config.lojas||[]).find(x=>x.id===id); return l?(l.abreviacao||l.nome):id; }
function levelLabel(n){ return n==='diretoria'?'Diretoria':n==='gerente'?'Gerente':n==='oficina'?'Oficina':n==='vendedora'?'Vendedora':'Personalizado'; }
/** Diretoria/gerente podem editar QUALQUER funcionário. Vendedora/oficina só podem editar o PRÓPRIO perfil (podem ver todos os outros, só leitura). */
function podeEditarDP(){ return currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente'); }

function nomeExibicaoFuncionario(f){
  const ap = (f && f.apelido || '').trim();
  return ap || (f && f.nome) || '';
}
/** Venda antiga foi salva com o nome completo, venda nova com o apelido: bate com os dois. */
function funcionarioBateComNome(f, nomeGravado){
  const alvo = String(nomeGravado||'').trim().toLowerCase();
  if(!alvo) return false;
  return String(f.nome||'').trim().toLowerCase()===alvo || String(f.apelido||'').trim().toLowerCase()===alvo;
}
/** Rótulo de cargo a partir dos cargos marcados em Cadastro → Funcionários. */
function cargoLabelDosCargos(cargos){
  const c = cargos || [];
  if(c.includes('diretor')) return 'Diretor(a)';
  if(c.includes('gerente')) return 'Gerente';
  if(c.includes('vendedora')) return 'Vendedora';
  if(c.includes('oficina')) return 'Oficina';
  return '';
}
/**
 * Junta o cadastro central (config.funcionarios, criado em Cadastro → Funcionários) com as
 * fichas de RH (dp_funcionarios). Quem já tem ficha aparece com a ficha; quem foi cadastrado
 * só com nome + função aparece aqui mesmo assim, com a ficha ainda em branco, pronta pra
 * ser preenchida no ✎. Assim o DP nunca fica com uma lista menor que a do Cadastro.
 */
function mesclarFuncionariosDoCadastro(fichas, cfg){
  const doCadastro = (cfg && Array.isArray(cfg.funcionarios)) ? cfg.funcionarios : [];
  const jaTemFicha = new Set();
  fichas.forEach(p=>{
    if(p.funcionarioId) jaTemFicha.add(p.funcionarioId);
    if(p.nome) jaTemFicha.add('nome:' + p.nome.trim().toLowerCase());
  });
  const pendentes = doCadastro
    .filter(f=> !jaTemFicha.has(f.id) && !jaTemFicha.has('nome:' + (f.nome||'').trim().toLowerCase()))
    .map(f=>({
      id: 'dpf_' + f.id,          // id estável: ao salvar o ✎ vira uma ficha de verdade, sem duplicar
      funcionarioId: f.id,
      nome: f.nome,
      apelido: f.apelido||'',
      cargo: cargoLabelDosCargos(f.cargos),
      status: 'ativo',
      semFicha: true,             // só pra mostrar o aviso na lista
      criadoEm: Date.now(),
    }));
  return fichas.concat(pendentes);
}

/* ============================================================
   FUNCIONÁRIOS (cadastro completo)
   ============================================================ */
/** Aba Vendas: total vendido por funcionário direto do PDV e das O.S. entregues (dado real, não depende de sync manual). */
/* ============================================================================================
   VENDAS E COMISSÕES (aba "vendas" do DP) — regime de caixa, comissão progressiva por faixas
   Regras (definidas pelo Felipe em 01/10/2026):
   • Base = líquido do mês = dinheiro RECEBIDO no mês (vendas PDV + pedidos/O.S.) − DEVOLUÇÕES do mês.
     Venda a prazo/fiado, crédito de cliente e pedido ainda a receber não entram.
   • Recebimento: venda "na encomenda" → data da venda; pedido "na encomenda" → data de criação;
     pedido "na volta" → data em que foi entregue (recebidoEm). Venda cancelada = devolução no mês do cancelamento.
   • Comissão progressiva: cada faixa paga o seu % sobre a parte do líquido que cai nela.
   • Soma tudo o que a vendedora vendeu em todas as lojas e aplica a tabela da LOJA-BASE dela
     (ou a tabela própria dela, se tiver). Faixas por loja e por mês; 7 níveis padrão (pode incluir/remover).
   Armazenamento: dp_registros — tipo 'comissaoFaixas' (id comfx_AAAA-MM), 'comissaoCadastro' (id comcad_geral),
   'comissaoFechamento' (id comfech_AAAA-MM). Sem tabela nova.
   ============================================================================================ */
const COM_NIVEIS_PADRAO = 7;
const COM_FORMAS_NAO_RECEBIDAS = ['__fiado','__credito','__sem_custo'];
let comCache = { produtos:null, ordens:null };
let comEstado = { mes: new Date().toISOString().slice(0,7), sub:'vendedoras', calc:null };

function comNumBR(v){ let s = String(v==null?'':v).trim(); if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = Number(s); return isNaN(n) ? 0 : n; }
function comR2(v){ return Math.round((Number(v)||0)*100)/100; }
function comPct(v){ return (Math.round((Number(v)||0)*100)/100).toString().replace('.',',') + '%'; }
/** Data local AAAA-MM-DD a partir de ms, ISO ou "AAAA-MM-DD". */
function comDataLocal(v){
  if(v==null || v==='') return '';
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(typeof v==='number' ? v : (/^\d+$/.test(String(v)) ? Number(v) : v));
  if(isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function comMesAnterior(mes){ const [a,m] = mes.split('-').map(Number); const d = new Date(a, m-2, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function comNomeMes(mes){ const [a,m] = mes.split('-'); return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][Number(m)-1] + '/' + a; }
function comLojasFisicas(){ return (config.lojas||[]); }
function comNomeLoja(id){ if(!id) return 'Sem loja'; const l=(config.lojas||[]).find(x=>x.id===id); return l ? (l.abreviacao||l.nome) : id; }
function comRegistro(id){ return registros.find(r=>r.id===id) || null; }
async function comSalvarRegistro(r){
  const ok = await registroSalvar(r);
  if(ok){ const i = registros.findIndex(x=>x.id===r.id); if(i>=0) registros[i]=r; else registros.push(r); }
  return ok;
}

function comValorRecebido(reg){
  return comR2((reg.pagamentos||[]).reduce((acc,p)=> acc + (COM_FORMAS_NAO_RECEBIDAS.includes(p.formaId) ? 0 : comNumBR(p.valor)), 0));
}
function comValorAReceber(reg){
  return comR2((reg.pagamentos||[]).reduce((acc,p)=> acc + (p.formaId==='__fiado' ? comNumBR(p.valor) : 0), 0));
}
/** Encontra o funcionário pelo nome gravado na venda (nome completo ou apelido). */
function comFuncionarioDaVenda(nomeGravado){
  const ativos = funcionarios.filter(f=>f.status!=='desligado'); const todos = funcionarios;
  return ativos.find(f=>funcionarioBateComNome(f, nomeGravado)) || todos.find(f=>funcionarioBateComNome(f, nomeGravado)) || null;
}
function comIdFunc(f){ return f ? (f.funcionarioId || f.id) : null; }
/** Classifica os itens (categoria, subcategoria, fornecedor, tipo) com o peso de cada item no valor. */
function comItensClassificados(reg, origem, produtos){
  const cats = (config.produtosOtica && config.produtosOtica.categorias) || [];
  const subs = (config.produtosOtica && config.produtosOtica.subcategorias) || [];
  const nomeCat = id=> (cats.find(c=>c.id===id)||{}).nome || '';
  const nomeSub = id=> (subs.find(c=>c.id===id)||{}).nome || '';
  const itens = (reg.itens||[]).map(it=>{
    const p = it.produtoEstoqueId ? produtos[it.produtoEstoqueId] : null;
    const peso = Math.max(0, comNumBR(it.quantidade||1) * comNumBR(it.valorUnitario));
    return {
      peso,
      categoria: (p && nomeCat(p.categoriaId)) || (origem==='os' ? 'PEDIDO/O.S. (sem catálogo)' : 'SEM CATEGORIA'),
      subcategoria: (p && nomeSub(p.subcategoriaId)) || 'SEM SUBCATEGORIA',
      fornecedor: (p && String(p.fornecedor||'').trim().toUpperCase()) || 'SEM FORNECEDOR',
      tipo: (p && p.tipo) || (origem==='os' ? (reg.serviceTypeName ? 'PEDIDO — ' + String(reg.serviceTypeName).toUpperCase() : 'PEDIDO/O.S.') : 'SEM TIPO'),
    };
  });
  const total = itens.reduce((a,i)=>a+i.peso,0);
  if(!itens.length || total<=0) return [{ fracao:1, categoria: origem==='os'?'PEDIDO/O.S. (sem catálogo)':'SEM CATEGORIA', subcategoria:'SEM SUBCATEGORIA', fornecedor:'SEM FORNECEDOR', tipo: origem==='os'?'PEDIDO/O.S.':'SEM TIPO' }];
  return itens.map(i=>({ ...i, fracao: i.peso/total }));
}
/** Funcionário a partir do registro: prefere o código gravado (vendedoraId); senão, pelo nome (completo ou apelido). */
function comFuncionarioDoRegistro(reg){
  if(reg && reg.vendedoraId){ const f = funcionarios.find(x=>comIdFunc(x)===reg.vendedoraId); if(f) return f; }
  return comFuncionarioDaVenda(reg && reg.vendedora);
}
/** Monta os lançamentos do mês: entradas (recebido) e devoluções, cada um com loja, vendedora e classificação.
    Movimentos de dinheiro considerados (os mesmos que o Caixa enxerga):
    • venda/pedido: cada pagamento em dinheiro/PIX/cartão, na data do próprio pagamento (ou na data da venda/pedido);
    • recebimento de fiado: na data em que foi recebido, atribuído à vendedora e loja da venda de origem;
    • troca: diferença paga pelo cliente (entrada) ou devolvida em dinheiro (devolução) na data da troca;
    • devolução de item: valor devolvido em dinheiro na data da devolução;
    • cancelamento: o valor que saiu do caixa, na data do cancelamento.
    Crédito do cliente e fiado não entram como dinheiro. */
function comLancamentosDoMes(mes, vendas, ordens, produtos){
  const lanc = []; const aReceber = [];
  const noMes = d=> d && d.slice(0,7)===mes;
  const origemPorDebito = {};
  (vendas||[]).forEach(v=>{ if(v.tipo!=='recebimentoFiado' && v.fiadoDebitoId) origemPorDebito[v.fiadoDebitoId] = { reg:v, origem:'venda' }; });
  (ordens||[]).forEach(o=>{ if(o && o.fiadoDebitoId) origemPorDebito[o.fiadoDebitoId] = { reg:o, origem:'os' }; });
  const baseDe = (reg, origem)=>{ const f = comFuncionarioDoRegistro(reg);
    return { origem, id:reg.id, codigo:reg.codigoVia||'', lojaId:reg.lojaId||'', vendedoraNome:reg.vendedora||'', funcId:comIdFunc(f), cliente:(reg.cliente||''), classes: comItensClassificados(reg, origem, produtos) }; };
  const entrada = (base, data, valor, extra)=>{ if(valor>0.004 && noMes(data)) lanc.push({ ...base, tipoMov:'entrada', data, valor:comR2(valor), ...(extra||{}) }); };
  const devol = (base, data, valor, motivo)=>{ if(valor>0.004 && noMes(data)) lanc.push({ ...base, tipoMov:'devolucao', data, valor:comR2(valor), motivo:motivo||'' }); };
  const pagamentosEmDinheiro = reg=> (reg.pagamentos||[]).filter(p=>!COM_FORMAS_NAO_RECEBIDAS.includes(p.formaId) && comNumBR(p.valor)>0);

  (vendas||[]).forEach(v=>{
    if(!v) return;
    if(v.tipo==='recebimentoFiado'){
      const ref = v.refFiado && v.refFiado.debitoId ? origemPorDebito[v.refFiado.debitoId] : null;
      const base = ref ? { ...baseDe(ref.reg, ref.origem), codigo:(ref.reg.codigoVia||'') + ' (fiado)' }
                       : { ...baseDe(v,'venda'), codigo:'Recebimento de fiado', semOrigem:true };
      if(v.status!=='cancelada') entrada(base, comDataLocal(v.data), comValorRecebido(v), { fiadoRecebido:true });
      return;
    }
    const base = baseDe(v,'venda');
    const dataVenda = comDataLocal(v.data);
    pagamentosEmDinheiro(v).forEach(p=>{ entrada(base, comDataLocal(p.data) || dataVenda, comNumBR(p.valor), { estimada: !p.data && v.momentoPagamento==='na_volta' }); });
    if(v.status==='cancelada'){
      const saiu = v.caixaSaidaCancelamento!=null && v.caixaSaidaCancelamento!=='' ? comNumBR(v.caixaSaidaCancelamento) : comValorRecebido(v);
      devol(base, comDataLocal(v.canceladoEm), saiu, v.motivoCancelamento);
    } else {
      (v.trocas||[]).forEach(t=>{
        const dif = comNumBR(t.diferenca); const dt = comDataLocal(t.data);
        if(dif>0 && !COM_FORMAS_NAO_RECEBIDAS.includes(t.formaDiferenca)) entrada(base, dt, dif, { troca:true });
        else if(dif<0 && t.formaDiferenca!=='__credito') devol(base, dt, Math.abs(dif), t.tipoMov==='devolucao' ? 'Devolução de item' : 'Troca com devolução de diferença');
      });
      const fiado = comValorAReceber(v); if(fiado>0 && noMes(dataVenda)) aReceber.push({ ...base, data:dataVenda, valor:fiado, motivo:'fiado' });
    }
  });
  (ordens||[]).forEach(o=>{
    if(!o || o.status==='rascunho') return;
    const base = baseDe(o,'os');
    const cancelada = /^cancel/.test(String(o.status||''));
    const naVolta = o.momentoPagamento==='na_volta';
    const dataEntrega = o.status==='entregue' ? comDataLocal(o.recebidoEm) : '';
    const dataCriacao = comDataLocal(o.criadoEm) || comDataLocal(o.data);
    let houveEntrada = false;
    pagamentosEmDinheiro(o).forEach(p=>{
      const dt = naVolta ? dataEntrega : (comDataLocal(p.data) || dataCriacao);
      if(dt){ entrada(base, dt, comNumBR(p.valor), {}); houveEntrada = true; }
    });
    if(cancelada && houveEntrada){
      const saiu = o.caixaSaidaCancelamento!=null && o.caixaSaidaCancelamento!=='' ? comNumBR(o.caixaSaidaCancelamento) : comValorRecebido(o);
      devol(base, comDataLocal(o.canceladoEm), saiu, o.motivoCancelamento);
    }
    if(!cancelada && naVolta && o.status!=='entregue' && comNumBR(o.valorTotal)>0) aReceber.push({ ...base, data:dataCriacao, valor:comNumBR(o.valorTotal), motivo:'pedido a receber na entrega' });
  });
  return { lanc, aReceber };
}

/* ---------- faixas / comissão ---------- */
function comFaixasVazias(){ return Array.from({length:COM_NIVEIS_PADRAO}, ()=>({ ate:null, perc:null })); }
function comCadastro(){ return comRegistro('comcad_geral') || { id:'comcad_geral', tipo:'comissaoCadastro', vendedoras:{} }; }
function comFaixasDoMes(mes){ return comRegistro('comfx_'+mes); }
function comFechamento(mes){ return comRegistro('comfech_'+mes); }
/** Loja-base: a escolhida no cadastro de comissão; se não houver e o acesso for a uma loja só, essa loja. */
function comLojaBase(f){
  const cad = comCadastro(); const id = comIdFunc(f); const c = (cad.vendedoras||{})[id];
  if(c && c.lojaBase) return c.lojaBase;
  const u = (config.users||[]).find(u=> u.funcionarioId===id);
  if(u && Array.isArray(u.lojas) && u.lojas.length===1) return u.lojas[0];
  return '';
}
/** Normaliza faixas: ordena, remove vazias; a última pode não ter teto (até = sem limite). */
function comFaixasValidas(faixas){
  const fx = (faixas||[]).filter(x=> x && x.perc!=null && x.perc!=='' && !isNaN(Number(x.perc)))
    .map(x=>({ ate: (x.ate==null || x.ate==='' ) ? null : Number(x.ate), perc:Number(x.perc) }));
  const comTeto = fx.filter(x=>x.ate!=null).sort((a,b)=>a.ate-b.ate); const semTeto = fx.filter(x=>x.ate==null);
  return comTeto.concat(semTeto.length ? [semTeto[0]] : []);
}
/** Comissão progressiva com o detalhe de cada faixa. */
function comCalcularProgressiva(base, faixas){
  const fx = comFaixasValidas(faixas); let anterior = 0; let total = 0; const detalhe = []; let nivelAtingido = 0;
  if(!(base>0) || !fx.length) return { total:0, detalhe, nivelAtingido:0 };
  for(let i=0;i<fx.length;i++){
    const teto = fx[i].ate==null ? Infinity : fx[i].ate;
    if(teto <= anterior) continue;
    const parte = Math.max(0, Math.min(base, teto) - anterior);
    if(parte>0){ const v = comR2(parte * fx[i].perc / 100); total += v; nivelAtingido = i+1; detalhe.push({ nivel:i+1, de:anterior, ate:teto, perc:fx[i].perc, parte:comR2(parte), valor:v }); }
    anterior = teto; if(base <= teto) break;
  }
  if(base > anterior && anterior>0 && fx[fx.length-1].ate!=null){ detalhe.push({ nivel:null, de:anterior, ate:Infinity, perc:0, parte:comR2(base-anterior), valor:0, foraDaTabela:true }); }
  return { total:comR2(total), detalhe, nivelAtingido };
}
function comTabelaDaVendedora(mes, f){
  const reg = comFaixasDoMes(mes); if(!reg) return { faixas:null, fonte:'sem tabela no mês' };
  const id = comIdFunc(f); const prop = reg.vendedoras && reg.vendedoras[id];
  if(prop && Array.isArray(prop.faixas) && comFaixasValidas(prop.faixas).length) return { faixas:prop.faixas, fonte:'tabela própria' };
  const lb = comLojaBase(f); if(!lb) return { faixas:null, fonte:'sem loja-base' };
  const tl = reg.lojas && reg.lojas[lb];
  if(tl && comFaixasValidas(tl.faixas).length) return { faixas:tl.faixas, fonte:'tabela da ' + comNomeLoja(lb) };
  return { faixas:null, fonte:'loja ' + comNomeLoja(lb) + ' sem faixas no mês' };
}

/* ---------- cálculo do mês ---------- */
async function comCalcularMes(mes){
  const [vendas, ordens, produtos] = await Promise.all([vendasPdvGet(), comOrdensGet(), comProdutosGet()]);
  const { lanc, aReceber } = comLancamentosDoMes(mes, vendas, ordens, produtos);
  const lojasIds = Array.from(new Set(lanc.map(l=>l.lojaId||''))).sort((a,b)=>comNomeLoja(a).localeCompare(comNomeLoja(b)));
  // por vendedora × loja
  const porVend = {};
  lanc.forEach(l=>{
    const chave = l.funcId || ('?' + (l.vendedoraNome||'SEM VENDEDORA').toUpperCase());
    if(!porVend[chave]){ const f = l.funcId ? funcionarios.find(x=>comIdFunc(x)===l.funcId) : null;
      porVend[chave] = { chave, funcId:l.funcId, f, nome: f ? nomeExibicaoFuncionario(f) : (l.vendedoraNome ? l.vendedoraNome.toUpperCase() + ' (não identificada)' : 'SEM VENDEDORA'), lojas:{}, recebido:0, devolvido:0 }; }
    const pv = porVend[chave]; const lj = l.lojaId||''; pv.lojas[lj] = pv.lojas[lj] || { recebido:0, devolvido:0 };
    if(l.tipoMov==='entrada'){ pv.lojas[lj].recebido += l.valor; pv.recebido += l.valor; } else { pv.lojas[lj].devolvido += l.valor; pv.devolvido += l.valor; }
  });
  const vendedoras = Object.values(porVend).map(v=>{
    v.liquido = comR2(v.recebido - v.devolvido);
    let tab = { faixas:null, fonte:'não identificada no DP' }; let com = { total:0, detalhe:[], nivelAtingido:0 };
    if(v.f){ tab = comTabelaDaVendedora(mes, v.f); if(tab.faixas) com = comCalcularProgressiva(v.liquido, tab.faixas); v.lojaBase = comLojaBase(v.f); }
    return { ...v, recebido:comR2(v.recebido), devolvido:comR2(v.devolvido), tabela:tab, comissao:com };
  }).sort((a,b)=> (a.funcId?0:1)-(b.funcId?0:1) || b.liquido-a.liquido);
  // por loja
  const lojas = lojasIds.map(id=>{
    const ls = lanc.filter(l=>(l.lojaId||'')===id);
    const recebido = comR2(ls.filter(l=>l.tipoMov==='entrada').reduce((a,l)=>a+l.valor,0)); const devolvido = comR2(ls.filter(l=>l.tipoMov==='devolucao').reduce((a,l)=>a+l.valor,0));
    const semVend = ls.filter(l=>!l.funcId); const semVendLiq = comR2(semVend.reduce((a,l)=> a + (l.tipoMov==='entrada'?l.valor:-l.valor), 0));
    return { id, recebido, devolvido, liquido:comR2(recebido-devolvido), qtdEntradas: ls.filter(l=>l.tipoMov==='entrada').length, qtdDevol: ls.filter(l=>l.tipoMov==='devolucao').length, semVendLiq, aReceber: comR2(aReceber.filter(a=>(a.lojaId||'')===id).reduce((s,a)=>s+a.valor,0)) };
  });
  // classificação
  const dims = { categoria:{}, subcategoria:{}, fornecedor:{}, tipo:{} };
  lanc.forEach(l=>{ const sinal = l.tipoMov==='entrada' ? 1 : -1; l.classes.forEach(c=>{
    Object.keys(dims).forEach(d=>{ const k = c[d]; dims[d][k] = dims[d][k] || { total:0, porLoja:{} }; const v = sinal * l.valor * c.fracao; dims[d][k].total += v; dims[d][k].porLoja[l.lojaId||''] = (dims[d][k].porLoja[l.lojaId||'']||0) + v; });
  }); });
  return { mes, lanc, aReceber, lojasIds, vendedoras, lojas, dims, calculadoEm: Date.now() };
}

    ${c.aReceber.length ? `<div class="section-label" style="border:none;padding:0;margin:14px 0 8px;">A receber (fora da conta)</div><table><thead><tr><th>Data</th><th>Origem</th><th>Código</th><th>Loja</th><th>Vendedora</th><th>Motivo</th><th style="text-align:right;">Valor</th></tr></thead><tbody>${c.aReceber.map(a=>`<tr><td>${fmtDate(a.data)}</td><td>${a.origem==='venda'?'Venda':'Pedido/O.S.'}</td><td>${escapeHtml(a.codigo)}</td><td>${escapeHtml(comNomeLoja(a.lojaId))}</td><td>${escapeHtml(a.vendedoraNome||'—')}</td><td>${escapeHtml(a.motivo)}</td><td style="text-align:right;">${fmtMoeda(a.valor)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`;

/* ---- faixas ---- */
function comRenderFaixas(corpo){
  const mes = comEstado.mes; const reg = comFaixasDoMes(mes); const ant = comFaixasDoMes(comMesAnterior(mes));
  const lojas = comLojasFisicas(); const pode = currentUser.nivel==='diretoria';
  const rascunho = JSON.parse(JSON.stringify(reg || { id:'comfx_'+mes, tipo:'comissaoFaixas', mes, lojas:{}, vendedoras:{} }));
  lojas.forEach(l=>{ if(!rascunho.lojas[l.id]) rascunho.lojas[l.id] = { faixas: comFaixasVazias() }; });
  const fech = comFechamento(mes);
  const tabelaHtml = (chave, faixas)=> `<table class="com-fx" data-chave="${chave}"><thead><tr><th>Nível</th><th>De (R$)</th><th>Até (R$)</th><th>% comissão</th>${pode?'<th></th>':''}</tr></thead><tbody>${faixas.map((f,i)=>{
      const de = i===0 ? 0 : (faixas[i-1].ate!=null && faixas[i-1].ate!=='' ? faixas[i-1].ate : null);
      return `<tr><td>${i+1}</td><td class="muted">${de==null?'—':fmtMoeda(de)}</td><td><input class="com-in" data-i="${i}" data-k="ate" inputmode="decimal" placeholder="${i===faixas.length-1?'sem limite':''}" value="${f.ate!=null&&f.ate!==''?String(f.ate).replace('.',','):''}" ${pode?'':'disabled'} style="width:130px;"></td><td><input class="com-in" data-i="${i}" data-k="perc" inputmode="decimal" value="${f.perc!=null&&f.perc!==''?String(f.perc).replace('.',','):''}" ${pode?'':'disabled'} style="width:80px;"> %</td>${pode?`<td><button class="btn btn-ghost btn-sm" data-rm="${i}" title="Remover nível">✕</button></td>`:''}</tr>`; }).join('')}</tbody></table>
      ${pode?`<div class="filters" style="margin-top:8px;"><button class="btn btn-ghost btn-sm" data-add="1">＋ Nível</button><select data-copiar="1"><option value="">Copiar faixas de…</option>${lojas.filter(l=>'loja:'+l.id!==chave).map(l=>`<option value="${l.id}">${escapeHtml(l.abreviacao||l.nome)}</option>`).join('')}</select></div>`:''}`;
  const vendComPropria = Object.keys(rascunho.vendedoras||{}).filter(id=>rascunho.vendedoras[id] && rascunho.vendedoras[id].faixas);
  corpo.innerHTML = `
    ${fech ? '<div class="card" style="padding:12px 16px;border-left:4px solid var(--wait);">🔒 Mês fechado — mudar as faixas não altera o fechamento já gravado.</div>' : ''}
    <div class="card" style="padding:14px 18px;">
      <p style="margin:0 0 6px;"><b>Faixas de ${comNomeMes(mes)}</b> — comissão progressiva: cada faixa paga o seu % sobre a parte do líquido que cai nela. Deixe o "até" do último nível em branco para valer sem limite.</p>
      ${pode ? `<div class="filters" style="margin-bottom:0;"><button class="btn btn-ghost" id="com_copiarAnt" ${ant?'':'disabled'}>📋 Copiar tudo de ${comNomeMes(comMesAnterior(mes))}</button><span class="muted" style="font-size:12.5px;">${ant?'':'(mês anterior sem faixas)'}</span></div>` : '<p class="muted">Só a diretoria altera as faixas.</p>'}
    </div>
    ${lojas.map(l=>`<div class="card" style="padding:14px 18px;" data-bloco="loja:${l.id}"><div class="section-label" style="border:none;padding:0;margin-bottom:8px;">🏬 ${escapeHtml(l.nome)} ${l.abreviacao?'('+escapeHtml(l.abreviacao)+')':''}</div>${tabelaHtml('loja:'+l.id, rascunho.lojas[l.id].faixas)}</div>`).join('')}
    <div class="card" style="padding:14px 18px;">
      <div class="section-label" style="border:none;padding:0;margin-bottom:8px;">👩 Tabelas próprias (exceção)</div>
      <p class="muted" style="font-size:12.5px;margin:0 0 8px;">Use só quando uma vendedora tiver faixas diferentes das da loja dela neste mês.</p>
      ${vendComPropria.map(id=>`<div data-bloco="vend:${id}" style="margin-bottom:12px;"><b>${escapeHtml(nomeFuncionario(id))}</b> ${pode?`<button class="btn btn-ghost btn-sm" data-rmvend="${id}">remover tabela própria</button>`:''}${tabelaHtml('vend:'+id, rascunho.vendedoras[id].faixas)}</div>`).join('') || '<p class="muted">Nenhuma.</p>'}
      ${pode ? `<div class="filters"><select id="com_addVend"><option value="">Criar tabela própria para…</option>${funcionarios.filter(f=>f.status!=='desligado' && !vendComPropria.includes(comIdFunc(f))).map(f=>`<option value="${comIdFunc(f)}">${escapeHtml(nomeExibicaoFuncionario(f))}</option>`).join('')}</select></div>` : ''}
    </div>
    ${pode ? `<div class="filters"><button class="btn btn-accent" id="com_salvarFx">💾 Salvar faixas de ${comNomeMes(mes)}</button></div>` : ''}`;
  if(!pode) return;
  const ler = ()=>{ corpo.querySelectorAll('table.com-fx').forEach(t=>{ const [tp,id] = t.dataset.chave.split(':'); const alvo = tp==='loja' ? rascunho.lojas[id] : rascunho.vendedoras[id];
    t.querySelectorAll('.com-in').forEach(inp=>{ const i=Number(inp.dataset.i); const v = inp.value.trim(); alvo.faixas[i][inp.dataset.k] = v==='' ? null : comNumBR(v); }); }); };
  const redesenhar = ()=>{ comEstado.rascunhoFx = rascunho; comRenderFaixasDe(corpo, rascunho); };
  corpo.querySelectorAll('table.com-fx').forEach(t=>{
    const [tp,id] = t.dataset.chave.split(':'); const alvo = ()=> tp==='loja' ? rascunho.lojas[id] : rascunho.vendedoras[id];
    const bloco = t.parentElement;
    t.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{ ler(); if(alvo().faixas.length<=1) return showToast('Mantenha pelo menos um nível.'); alvo().faixas.splice(Number(b.dataset.rm),1); redesenhar(); }));
    const add = bloco.querySelector('[data-add]'); if(add) add.addEventListener('click', ()=>{ ler(); alvo().faixas.push({ ate:null, perc:null }); redesenhar(); });
    const cp = bloco.querySelector('[data-copiar]'); if(cp) cp.addEventListener('change', ()=>{ if(!cp.value) return; ler(); alvo().faixas = JSON.parse(JSON.stringify(rascunho.lojas[cp.value].faixas)); redesenhar(); });
    t.querySelectorAll('.com-in').forEach(inp=>inp.addEventListener('change', ()=>{ ler(); redesenhar(); }));
  });
  corpo.querySelectorAll('[data-rmvend]').forEach(b=>b.addEventListener('click', ()=>{ ler(); delete rascunho.vendedoras[b.dataset.rmvend]; redesenhar(); }));
  const av = document.getElementById('com_addVend'); if(av) av.addEventListener('change', ()=>{ if(!av.value) return; ler(); const lb = comLojaBase(funcionarios.find(f=>comIdFunc(f)===av.value)); rascunho.vendedoras[av.value] = { faixas: JSON.parse(JSON.stringify((lb && rascunho.lojas[lb] && rascunho.lojas[lb].faixas) || comFaixasVazias())) }; redesenhar(); });
  const ca = document.getElementById('com_copiarAnt'); if(ca) ca.addEventListener('click', ()=>{ if(!confirm(`Substituir as faixas de ${comNomeMes(mes)} pelas de ${comNomeMes(comMesAnterior(mes))}? (só grava ao clicar em Salvar)`)) return; const novo = JSON.parse(JSON.stringify(ant)); rascunho.lojas = novo.lojas || {}; rascunho.vendedoras = novo.vendedoras || {}; lojas.forEach(l=>{ if(!rascunho.lojas[l.id]) rascunho.lojas[l.id] = { faixas: comFaixasVazias() }; }); redesenhar(); });
  document.getElementById('com_salvarFx').addEventListener('click', async ()=>{
    ler();
    // validação: tetos crescentes, % entre 0 e 100, só o último pode ficar sem teto
    const erros = [];
    const checar = (nome, fx)=>{ const usadas = fx.filter(x=>x.perc!=null); let anterior = 0;
      usadas.forEach((x,i)=>{ if(x.perc<0 || x.perc>100) erros.push(`${nome}: nível ${i+1} com % inválido.`);
        if(x.ate==null && i<usadas.length-1) erros.push(`${nome}: só o último nível pode ficar sem "até".`);
        if(x.ate!=null){ if(x.ate<=anterior) erros.push(`${nome}: o "até" do nível ${i+1} precisa ser maior que o do nível anterior.`); anterior = x.ate; } });
      fx.forEach((x,i)=>{ if(x.perc==null && x.ate!=null) erros.push(`${nome}: nível ${i+1} sem %.`); }); };
    Object.entries(rascunho.lojas).forEach(([id,v])=>checar(comNomeLoja(id), v.faixas));
    Object.entries(rascunho.vendedoras).forEach(([id,v])=>checar(nomeFuncionario(id), v.faixas));
    if(erros.length){ alert('Corrija antes de salvar:\n\n' + erros.slice(0,12).join('\n')); return; }
    rascunho.atualizadoEm = Date.now(); rascunho.atualizadoPor = currentUser.nome;
    const ok = await comSalvarRegistro(rascunho);
    if(ok){ showToast('Faixas de ' + comNomeMes(mes) + ' salvas.'); comEstado.rascunhoFx = null; if(comEstado.calc) comEstado.calc = await comCalcularMes(mes); comRenderFaixas(corpo); }
  });
}
/** Redesenha a aba de faixas mantendo o rascunho em edição (sem perder o que foi digitado). */
function comRenderFaixasDe(corpo, rascunho){
  const original = registros.findIndex(r=>r.id===rascunho.id); const backup = original>=0 ? registros[original] : null;
  if(original>=0) registros[original] = rascunho; else registros.push(rascunho);
  try{ comRenderFaixas(corpo); } finally { if(original>=0) registros[original] = backup; else registros.splice(registros.findIndex(r=>r===rascunho),1); }
}

/* ---- fechamento, exportação, impressão ---- */
function comLinhasExport(c){
  return c.vendedoras.map(v=>({ vendedora:v.nome, lojaBase:v.lojaBase?comNomeLoja(v.lojaBase):'', porLoja:c.lojasIds.map(l=>{ const x=v.lojas[l]; return x ? { loja:comNomeLoja(l), recebido:comR2(x.recebido), devolvido:comR2(x.devolvido) } : null; }).filter(Boolean),
    recebido:v.recebido, devolvido:v.devolvido, liquido:v.liquido, nivel:v.comissao.nivelAtingido||'', comissao:v.funcId&&v.tabela.faixas?v.comissao.total:null, fonte:v.tabela.fonte, detalhe:v.comissao.detalhe }));

async function comFecharMes(c){
  const semTabela = c.vendedoras.filter(v=>v.funcId && !v.tabela.faixas); const naoId = c.vendedoras.filter(v=>!v.funcId);
  let aviso = `Fechar ${comNomeMes(c.mes)}? Os valores de hoje ficam gravados como oficiais.`;
  if(semTabela.length) aviso += `\n\n⚠️ ${semTabela.length} vendedora(s) sem faixas (sem comissão): ${semTabela.map(v=>v.nome).join(', ')}.`;
  if(naoId.length) aviso += `\n\n⚠️ Há vendas com vendedora não identificada: ${naoId.map(v=>v.nome).join(', ')}.`;
  if(!confirm(aviso)) return;
  const reg = { id:'comfech_'+c.mes, tipo:'comissaoFechamento', mes:c.mes, fechadoEm:Date.now(), por:currentUser.nome, lojas:c.lojas.map(l=>({ loja:comNomeLoja(l.id), recebido:l.recebido, devolvido:l.devolvido, liquido:l.liquido, semVendedora:l.semVendLiq })), vendedoras:comLinhasExport(c), faixasUsadas: comFaixasDoMes(c.mes) || null };
  if(await comSalvarRegistro(reg)){ showToast('Mês fechado.'); renderVendasDP(document.getElementById('mainContent')); }
}

function comExportarCSV(c){
  const q = s=>'"' + String(s==null?'':s).replace(/"/g,'""') + '"'; const n = v=> v==null ? '' : String(comR2(v)).replace('.',',');
  const L = [];
  L.push(['VENDAS E COMISSÕES — ' + comNomeMes(c.mes).toUpperCase()].map(q).join(';')); L.push('');
  L.push(['Vendedora','Loja-base', ...c.lojasIds.flatMap(l=>[comNomeLoja(l)+' recebido', comNomeLoja(l)+' devolvido']), 'Recebido','Devolvido','Líquido','Nível','Comissão','Faixas usadas'].map(q).join(';'));
  c.vendedoras.forEach(v=>L.push([q(v.nome), q(v.lojaBase?comNomeLoja(v.lojaBase):''), ...c.lojasIds.flatMap(l=>{ const x=v.lojas[l]; return [n(x?x.recebido:0), n(x?x.devolvido:0)]; }), n(v.recebido), n(v.devolvido), n(v.liquido), q(v.comissao.nivelAtingido||''), n(v.funcId&&v.tabela.faixas?v.comissao.total:null), q(v.tabela.fonte)].join(';')));
  L.push(''); L.push(['LOJA','Recebido','Devolvido','Líquido','Sem vendedora identificada','A receber'].map(q).join(';'));
  c.lojas.forEach(l=>L.push([q(comNomeLoja(l.id)), n(l.recebido), n(l.devolvido), n(l.liquido), n(l.semVendLiq), n(l.aReceber)].join(';')));
  [['CATEGORIA','categoria'],['SUBCATEGORIA','subcategoria'],['FORNECEDOR','fornecedor'],['TIPO','tipo']].forEach(([t,d])=>{
    L.push(''); L.push([t, ...c.lojasIds.map(comNomeLoja), 'Total'].map(q).join(';'));
    Object.entries(c.dims[d]).sort((a,b)=>b[1].total-a[1].total).forEach(([k,v])=>L.push([q(k), ...c.lojasIds.map(l=>n(v.porLoja[l]||0)), n(v.total)].join(';')));
  });
  const blob = new Blob(['\ufeff' + L.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `vendas-comissoes-${c.mes}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

  const cats = tab(['Categoria', ...c.lojasIds.map(comNomeLoja), 'Total'], Object.entries(c.dims.categoria).sort((a,b)=>b[1].total-a[1].total).map(([k,v])=>[escapeHtml(k), ...c.lojasIds.map(l=>fmtMoeda(v.porLoja[l]||0)), '<b>'+fmtMoeda(v.total)+'</b>']));

/* Retorna quantos dias faltam para completar 90 dias a partir de dataAdmissao (string YYYY-MM-DD).
   Retorna null se dataAdmissao for inválida ou se já passaram os 90 dias. */
function diasParaCompletarExperiencia(dataAdmissao){
  if(!dataAdmissao) return null;
  const admissao = new Date(dataAdmissao + 'T00:00:00');
  if(isNaN(admissao)) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diff = Math.floor((hoje - admissao) / 86400000);
  const restam = 90 - diff;
  return restam > 0 ? restam : null;
}

/* Abre o popup de inativação e, ao confirmar, bloqueia o acesso e salva status=desligado. */
async function abrirModalInativar(f, onConcluido){
  const funcId = f.funcionarioId || f.id;
  openModal(`
    <div class="modal-head"><h2>Inativar funcionário</h2></div>
    <div class="modal-body">
      <p style="margin:0 0 16px;">Você está prestes a inativar <b>${escapeHtml(f.nome)}</b>.<br>
      O acesso ao sistema será desabilitado imediatamente.</p>
      <div class="field">
        <label>Motivo do desligamento <span style="color:var(--danger);">*</span></label>
        <textarea id="inativar_motivo" rows="3" placeholder="Descreva o motivo..." style="width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; resize:vertical;"></textarea>
      </div>
      <div class="field">
        <label>Data de desligamento</label>
        <input type="date" id="inativar_data" value="${todayStr()}" style="padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px;">
      </div>
    </div>
    <div class="modal-foot" style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-ghost" id="btnInativarCancelar">Cancelar</button>
      <button class="btn" style="background:var(--danger,#c0392b); color:#fff;" id="btnInativarConfirmar">🔒 Inativar</button>
    </div>
  `);
  document.getElementById('btnInativarCancelar').addEventListener('click', closeModal);
  document.getElementById('btnInativarConfirmar').addEventListener('click', async ()=>{
    const motivo = document.getElementById('inativar_motivo').value.trim();
    const dataDesligamento = document.getElementById('inativar_data').value;
    if(!motivo){ showToast('Informe o motivo do desligamento.'); return; }
    const btn = document.getElementById('btnInativarConfirmar');
    btn.disabled = true; btn.textContent = 'Inativando...';

    // 1) Bloqueia o acesso (reutiliza op bloquearAcesso se existir, senão apenas seta bloqueado via saveConfig)
    try{
      await chamarFuncionarioAcesso({ op:'bloquearAcesso', senha: __gatewaySenha, funcionarioId: funcId });
    }catch(e){ console.warn('bloquearAcesso indisponível:', e); }

    // 2) Fallback: garante bloqueado=true no users do config
    const userConfig = (config.users||[]).find(u=>u.funcionarioId===funcId);
    if(userConfig){ userConfig.bloqueado = true; await configSave(); }

    // 3) Atualiza perfil de RH com status=desligado + motivo
    const perfisFrescos = await funcionariosGet();
    const perfilAtual = perfisFrescos.find(p=>p.funcionarioId===funcId);
    if(perfilAtual){
      await funcionarioSalvar({ ...perfilAtual, status:'desligado', dataDesligamento, motivoDesligamento: motivo });
    }

    funcionarios = mesclarFuncionariosDoCadastro(await funcionariosGet(), config);
    closeModal();
    showToast(`${escapeHtml(f.nome)} foi inativado(a).`);
    if(onConcluido) onConcluido();
  });
}

        if(!lojaEscolhida){ showToast('Selecione a loja de acesso do funcionário.'); return; }

const ABAS_FUNC_COMPLETO = ['Básico','Pessoais','Profissionais','Bancários','Acesso'];
/**
 * Cadastro completo e unificado de um funcionário: a função/cargo (usada em todo o
 * app pros módulos de venda/O.S./Venda PG) fica na mesma tela que os dados de RH
 * (pessoais/profissionais/bancários). Migrado do módulo Cadastro pro Departamento
 * Pessoal a pedido do Felipe — o cadastro é um só, compartilhado entre os dois.
 */
const ESCOLARIDADE_PADRAO = ['Fundamental incompleto','Fundamental completo','Ensino médio incompleto','Ensino médio completo','Superior incompleto','Superior completo','Pós-graduação','Mestrado','Doutorado'];
/** Lista de opções de escolaridade, editável pela diretoria/gerência (＋ adiciona, ✎ edita) — mesmo padrão do módulo Gastos. Fica em config.escolaridadeOpcoes. */
function escolaridadeOpcoes(){
  if(!Array.isArray(config.escolaridadeOpcoes) || config.escolaridadeOpcoes.length===0){
    config.escolaridadeOpcoes = [...ESCOLARIDADE_PADRAO];
  }
  return config.escolaridadeOpcoes;
}

        if(!dataNasc) return null;
        const hoje = new Date(); const nasc = new Date(dataNasc+'T00:00:00');
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if(m<0 || (m===0 && hoje.getDate()<nasc.getDate())) idade--;
        return idade>=0 ? idade : null;
      }

    </div>
    <div class="filters">
      <select id="fFunc"><option value="">Todos os funcionários</option>${funcionarios.map(f=>`<option value="${f.funcionarioId||f.id}">${escapeHtml(nomeExibicaoFuncionario(f))}</option>`).join('')}</select>

        <tbody id="tbodyReg"></tbody>
      </table>
    </div>
  `;
  function valorFmt(reg, campoId){
    if(campoId==='valorLiquido'){
      const liquido = (Number(reg.salarioBase)||0) + (Number(reg.horasExtras)||0) + (Number(reg.adicionais)||0) - (Number(reg.descontos)||0);
      return fmtMoeda(liquido);
    }
    if(campoId==='totalItens'){
      const total = ['alianca','fabricacao','servico','represOuro','represPrata','relogio'].reduce((acc,c)=> acc + (Number(reg[c])||0), 0);
      return fmtMoeda(total);
    }
    const campo = meta.campos.find(c=>c.id===campoId);
    const val = reg[campoId];
    if(campo && campo.tipo==='date') return fmtDate(val);
    if(campo && campo.tipo==='month') return val||'—';
    if(campo && campo.tipo==='number') return val!==undefined && val!==null && val!=='' ? val : '—';
    return escapeHtml(val||'—');
  }
  function statusAdvertencia(r){
    if(r.confirmadoEm) return { texto:'Ciente', classe:'badge-ok' };
    if(r.notificadoEm) return { texto:'Notificado', classe:'badge-wait' };
    return { texto:'Pendente', classe:'badge-loja' };
  }
  function draw(){
    const lista = registros.filter(r=>r.tipo===tipo);
    const filtroFunc = document.getElementById('fFunc').value;
    const filtrada = lista.filter(r=> !filtroFunc || r.funcionarioId===filtroFunc).slice().reverse();
    const tbody = document.getElementById('tbodyReg');
    if(filtrada.length===0){ tbody.innerHTML = `<tr><td colspan="${meta.colunas.length+2}" class="empty">Nenhum registro ainda.</td></tr>`; return; }
    tbody.innerHTML = filtrada.map(r=>{
      const st = tipo==='aviso' ? statusAdvertencia(r) : null;
      return `
      <tr>
        <td><b>${escapeHtml(nomeFuncionario(r.funcionarioId))}</b></td>
        ${meta.colunas.map(c=>`<td>${valorFmt(r,c)}</td>`).join('')}
        ${tipo==='aviso' ? `<td><span class="badge ${st.classe}">${st.texto}</span></td>` : ''}
        <td>
          <button class="icon-btn" data-verreg="${r.id}" title="${podeEditar?'Ver/editar':'Ver'}">${podeEditar?'✎':'👁'}</button>
          ${tipo==='aviso' && podeEditar ? `
            <button class="icon-btn icon-btn-wa" data-notwa="${r.id}" title="Notificar por WhatsApp">💬</button>
            <button class="icon-btn" data-notemail="${r.id}" title="Notificar por e-mail">✉️</button>
          ` : ''}
          ${podeEditar ? `<button class="icon-btn" data-delreg="${r.id}" title="Excluir" style="color:var(--danger);">✕</button>` : ''}
        </td>
      </tr>

    tbody.querySelectorAll('[data-verreg]').forEach(b=> b.addEventListener('click', ()=> abrirRegistroModal(tipo, registros.find(r=>r.id===b.dataset.verreg), draw) ));
    tbody.querySelectorAll('[data-notwa]').forEach(b=> b.addEventListener('click', ()=> notificarPorWhatsapp(registros.find(r=>r.id===b.dataset.notwa), draw) ));
    tbody.querySelectorAll('[data-notemail]').forEach(b=> b.addEventListener('click', ()=> notificarPorEmail(registros.find(r=>r.id===b.dataset.notemail), draw, b) ));
    tbody.querySelectorAll('[data-delreg]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        await registroExcluir(b.dataset.delreg);
        registros = registros.filter(r=>r.id!==b.dataset.delreg);
        draw();
        showToast('Registro excluído.');
      });
    });
  }
  draw();
  document.getElementById('fFunc').addEventListener('change', draw);
  if(document.getElementById('btnNovoRegistro')) document.getElementById('btnNovoRegistro').addEventListener('click', ()=> abrirRegistroModal(tipo, null, draw));
}

/** O telefone usado pra notificar é sempre o celular particular — nunca o fixo ou o da loja. */
function onlyDigitsDp(s){ return (s||'').replace(/\D/g,''); }
function maiusc(s){ return (s==null?'':String(s)).trim().toUpperCase(); }
/** Separa um telefone salvo em {ddd, numero} — funciona tanto pra fixo (10 dígitos
 * no total) quanto celular (11 dígitos no total). */
function separarTelefoneDp(str){
  const digitos = onlyDigitsDp(str||'');
  if(digitos.length===11 || digitos.length===10) return { ddd: digitos.slice(0,2), numero: digitos.slice(2) };
  return { ddd:'', numero:'' };
}
/** Formata o número conforme a pessoa digita. tamanho=8 (fixo, XXXX-XXXX) ou
 * tamanho=9 (celular, XXXXX-XXXX). */
function formatarNumeroTelefoneDp(digitos, tamanho){
  digitos = digitos.slice(0, tamanho);
  const corte = tamanho - 4;
  if(digitos.length<=4) return digitos;
  return digitos.slice(0,corte)+'-'+digitos.slice(corte);
}
function wireTelefoneMaskDp(prefix, tamanho){
  const dddInp = document.getElementById(prefix+'DDD');
  const numInp = document.getElementById(prefix+'Num');
  if(dddInp) dddInp.addEventListener('input', ()=>{ dddInp.value = onlyDigitsDp(dddInp.value).slice(0,2); });
  if(numInp) numInp.addEventListener('input', ()=>{ numInp.value = formatarNumeroTelefoneDp(onlyDigitsDp(numInp.value), tamanho); });
}
/** Lê DDD+número direto do DOM (não confia no objeto `d`, que o ligarCampos genérico
 * só preenche com os nomes separados) e valida: os dois vazios = ok (retorna ''); só
 * um preenchido ou incompleto = erro (avisa e retorna null). */
/** DDD e número de um telefone da ficha, pra salvar: usa o que a pessoa digitou nesta
 * edição (d.campoDDD / d.campoNum) e, se ela não tocou nesse campo, o que já estava
 * salvo em d.campo. Sem isso, qualquer telefone não editado era gravado em branco. */
function partesTelefoneDp(d, campo){
  const sep = separarTelefoneDp(d[campo]);
  return {
    ddd: d[campo+'DDD'] !== undefined ? d[campo+'DDD'] : sep.ddd,
    numero: d[campo+'Num'] !== undefined ? d[campo+'Num'] : sep.numero,
  };
}
function combinarTelefoneValidadoDp(ddd, numero, tamanho, label){
  ddd = onlyDigitsDp(ddd); numero = onlyDigitsDp(numero);
  if(!ddd && !numero) return '';
  if(ddd.length!==2 || numero.length!==tamanho){
    showToast(`${label} incompleto — preencha o DDD (2 dígitos) e o número (${tamanho} dígitos), ou deixe os dois em branco.`);
    return null;
  }
  return `(${ddd}) ${numero.slice(0,numero.length-4)}-${numero.slice(-4)}`;
}
async function marcarNotificado(registro){
  if(!registro.notificadoEm){
    registro.notificadoEm = new Date().toISOString();
    await registroSalvar(registro);
  }
}
function notificarPorWhatsapp(registro, redesenhar){
  const funcionario = funcionarios.find(f=>f.id===registro.funcionarioId);
  const tel = onlyDigitsDp(funcionario && funcionario.celularParticular);
  if(!tel){ showToast('Esse funcionário não tem celular particular cadastrado (Cadastro → Funcionários).'); return; }
  const linkConfirmacao = window.location.origin + '/advertencia.html?id=' + registro.id;
  const msg = `Olá, ${funcionario.nome}! Você recebeu uma notificação de advertência. Por favor, confirme o recebimento no link: ${linkConfirmacao}`;
  window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
  marcarNotificado(registro).then(redesenhar);
}
async function notificarPorEmail(registro, redesenhar, botao){
  const funcionario = funcionarios.find(f=>f.id===registro.funcionarioId);
  const email = funcionario && funcionario.email;
  if(!email){ showToast('Esse funcionário não tem e-mail cadastrado.'); return; }
  if(botao){ botao.disabled = true; }
  const linkConfirmacao = window.location.origin + '/advertencia.html?id=' + registro.id;
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-email-gmail', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({
        to: email, subject: 'Notificação de Advertência — Vilaça Joias',
        body: `Olá, ${funcionario.nome}!\n\nVocê recebeu uma notificação de advertência. Por favor, acesse o link abaixo pra confirmar o recebimento:\n${linkConfirmacao}\n\nAtenciosamente,\nVilaça Joias`,
        senha: __gatewaySenha,
      }),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'falha');
    showToast('E-mail enviado.');
    await marcarNotificado(registro);
    redesenhar();
  }catch(e){ showToast('Não foi possível enviar o e-mail.'); }
  if(botao){ botao.disabled = false; }
}

    <div class="field"><label>Funcionário</label><select id="rg_funcionarioId" ${podeEditar?'':'disabled'}>${funcionarioOptionsHtml(r?r.funcionarioId:'')}</select></div>
    ${meta.campos.map(c=>{
      const val = r ? (r[c.id]!==undefined?r[c.id]:'') : '';
      const dis = podeEditar?'':'disabled';
      if(c.tipo==='textarea') return `<div class="field"><label>${c.label}</label><textarea id="rg_${c.id}" rows="2" ${dis}>${escapeHtml(val)}</textarea></div>`;
      if(c.tipo==='select') return `<div class="field"><label>${c.label}</label><select id="rg_${c.id}" ${dis}>${c.opcoes.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      if(c.tipo==='number') return `<div class="field"><label>${c.label}</label><input type="number" step="0.01" id="rg_${c.id}" value="${val}" ${dis}></div>`;
      if(c.tipo==='date') return `<div class="field"><label>${c.label}</label><input type="date" id="rg_${c.id}" value="${val||''}" ${dis}></div>`;
      if(c.tipo==='month') return `<div class="field"><label>${c.label}</label><input type="month" id="rg_${c.id}" value="${val||''}" ${dis}></div>`;
      return `<div class="field"><label>${c.label}</label><input id="rg_${c.id}" value="${escapeHtml(val)}" ${dis}></div>`;
    }).join('')}
    ${tipo==='aviso' && editando ? `
      <div class="section-label" style="margin-top:16px;">Status da notificação</div>
      <p class="muted" style="margin:-4px 0 10px;">
        ${r.confirmadoEm ? `<span class="badge badge-ok">Ciente</span> — confirmado em ${new Date(r.confirmadoEm).toLocaleString('pt-BR')}`
          : r.notificadoEm ? `<span class="badge badge-wait">Notificado</span> — em ${new Date(r.notificadoEm).toLocaleString('pt-BR')}, aguardando confirmação`
          : `<span class="badge badge-loja">Pendente</span> — ainda não foi notificado`}
      </p>
      ${podeEditar ? `<p class="muted" style="margin-top:-4px;">Pra notificar, use os botões 💬/✉️ na lista de advertências.</p>` : ''}
    ` : ''}
    <div class="modal-actions">
      ${podeEditar ? `<button class="btn btn-accent" id="btnSalvarReg">Salvar</button>` : ''}
      <button class="btn btn-ghost" id="btnCancelarReg">${podeEditar?'Cancelar':'Fechar'}</button>
    </div>
  `);
  document.getElementById('btnCancelarReg').addEventListener('click', closeModal);
  if(document.getElementById('btnSalvarReg'))
  document.getElementById('btnSalvarReg').addEventListener('click', async ()=>{
    const funcionarioId = document.getElementById('rg_funcionarioId').value;
    if(!funcionarioId){ showToast('Selecione o funcionário.'); return; }
    const funcSelecionado = funcionarios.find(f=>f.id===funcionarioId);
    const dados = { id: r?r.id:uid('dpreg'), tipo, funcionarioId, data: todayStr(), criadoEm: r?r.criadoEm:Date.now() };
    if(tipo==='aviso'){
      dados.nomeFuncionarioSnapshot = funcSelecionado?funcSelecionado.nome:'';
      dados.confirmadoEm = r?r.confirmadoEm:null;
      dados.notificadoEm = r?r.notificadoEm:null;
    }
    meta.campos.forEach(c=>{
      const el = document.getElementById('rg_'+c.id);
      dados[c.id] = c.tipo==='number' ? (el.value===''?null:parseFloat(el.value)) : el.value;
    });
    const ok = await registroSalvar(dados);
    if(ok){
      const idx = registros.findIndex(x=>x.id===dados.id);
      if(idx>=0) registros[idx] = dados; else registros.push(dados);
      closeModal();
      onSalvo();
      showToast(editando ? 'Registro atualizado.' : 'Registro salvo.');
    }
  });
}

(async function init(){
  if(EMBEDDED){
    parent.postMessage({ type:'ready', modulo:'dp' }, '*');
    return;
  }
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
