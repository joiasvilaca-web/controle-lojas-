<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --surface-2:#F7E9DA;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5; --ok:#1E7A46; --ok-soft:#E3F5EA;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.hub-back-link{color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;}
.hub-back-link:hover{color:#fff;}
#view-login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830);}
.login-card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:380px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.login-tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
.login-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin:0 0 6px;}
.login-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.login-error{display:none; background:var(--danger-soft); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
.login-error.show{display:block;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 20px; background:var(--ink); color:#fff; flex-wrap:wrap; flex-shrink:0;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;}
.brand-name{font-weight:700; font-size:15px;}
.who{display:flex; align-items:center; gap:10px; font-size:13px;}
.level-pill{background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.icon-btn{background:none; border:none; color:inherit; font-size:16px; cursor:pointer; padding:5px 7px; border-radius:7px; text-decoration:none;}
.icon-btn-sair{ background:rgba(179,38,30,0.18) !important; color:#ffb3ac !important; }
.icon-btn-sair:hover{ background:rgba(179,38,30,0.32) !important; }
#chatArea{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; max-width:820px; margin:0 auto; width:100%;}
.msg{max-width:82%; padding:12px 15px; border-radius:14px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
.msg-user{align-self:flex-end; background:var(--gold); color:#fff; border-bottom-right-radius:4px;}
.msg-ia{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px;}
.msg img{max-width:100%; border-radius:10px; margin-top:8px; display:block;}
.msg-img-anexo{max-width:180px; border-radius:10px; margin-bottom:6px; display:block;}
.msg-loading{align-self:flex-start; color:var(--ink-faint); font-size:13px; font-style:italic;}
.empty-state{margin:auto; text-align:center; color:var(--ink-faint); max-width:420px;}
.empty-state h2{font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--ink-soft); margin-bottom:8px;}
#inputArea{flex-shrink:0; border-top:1px solid var(--line); background:var(--surface); padding:12px 18px; max-width:820px; margin:0 auto; width:100%;}
#previewAnexo{display:none; align-items:center; gap:10px; background:var(--surface-2); border-radius:10px; padding:8px 10px; margin-bottom:8px;}
#previewAnexo.show{display:flex;}
#previewAnexo img{width:42px; height:42px; border-radius:8px; object-fit:cover;}
.modo-toggle{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;}
.modo-toggle button{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;}
.modo-toggle button.active{background:var(--gold); color:#fff; border-color:var(--gold);}
.input-row{display:flex; align-items:flex-end; gap:8px;}
.input-row textarea{flex:1; resize:none; border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:14px; background:var(--surface-2); color:var(--ink); max-height:120px;}
.input-row button{border:none; border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.btn-anexo{background:var(--surface-2); color:var(--ink-soft);}
.btn-enviar{background:var(--gold); color:#fff;}
.btn-enviar:disabled{opacity:0.5; cursor:default;}
html.embedded #view-login{display:none !important;}
html.embedded .topbar{display:none !important;}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link" style="color:var(--ink-faint);">← Gestão e Controle</a>
    <div class="login-tag" style="margin-top:14px;">Inteligência Artificial</div>
    <div class="login-title">Acessar IA</div>
    <p class="login-sub">Informe sua senha de acesso para entrar.</p>
    <div class="login-error" id="loginError">Senha não encontrada, ou sem acesso a este módulo.</div>
    <div class="field"><label style="display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;">Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off" style="width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); font-size:14px;"></div>
    <button class="btn" id="btnLogin" style="width:100%; margin-top:14px; padding:11px; border:none; border-radius:9px; background:var(--gold); color:#fff; font-weight:700; font-size:14px;">Entrar</button>
    <div style="color:var(--ink-faint); font-size:12.5px; margin-top:12px; line-height:1.5;">Só a diretoria e gerência têm acesso a este módulo (ele enxerga todos os dados do negócio).</div>
  </div>
</div>

<div id="view-app" style="display:none; flex-direction:column; height:100%;">
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle">←</a>
      <div class="brand-mark">IA</div>
      <div class="brand-name">Assistente Inteligente</div>
    </div>
    <div class="who">
      <span id="whoName"><b></b></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="icon-btn icon-btn-sair" id="btnLogout" title="Sair">🚪</button>
    </div>
  </header>
  <div id="chatArea"></div>
  <div id="inputArea">
    <div id="previewAnexo">
      <img id="previewImg" src="">
      <span class="muted" style="font-size:12.5px; color:var(--muted); flex:1;">Foto anexada</span>
      <button type="button" id="btnRemoverAnexo" style="background:none; border:none; color:var(--danger); font-size:13px; font-weight:700;">Remover</button>
    </div>
    <div class="modo-toggle" id="modoToggle">
      <button type="button" data-modo="chat" class="active">💬 Conversar</button>
      <button type="button" data-modo="editar">🪄 Editar foto (padrão editorial)</button>
    </div>
    <div class="input-row">
      <input type="file" accept="image/*" id="inputAnexar" style="display:none;">
      <input type="file" accept="image/*" capture="environment" id="inputTirarFoto" style="display:none;">
      <button type="button" class="btn-anexo" id="btnAnexar" title="Anexar foto">📎</button>
      <button type="button" class="btn-anexo" id="btnTirarFoto" title="Tirar foto">📷</button>
      <textarea id="campoMensagem" rows="1" placeholder="Pergunte qualquer coisa, sobre o negócio ou não..."></textarea>
      <button type="button" class="btn-enviar" id="btnEnviar" title="Enviar">➤</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";
const IA_URL = SUPABASE_URL + "/functions/v1/ia-chat";

let config = null;
let currentUser = null;
let __gatewaySenha = null;
let anexoAtual = null; // { base64, mimeType, dataUrl }
let modoAtual = 'chat';

async function gatewayCall(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ senha: __gatewaySenha, ...body }),
    });
    return await res.json();
  }catch(e){ console.error('erro ao falar com o servidor', e); return { error: 'Não foi possível conectar. Verifique sua internet.' }; }
}
async function gatewayLogin(senhaTentativa){ return gatewayCall({ op:'login', senha: senhaTentativa }); }
const supabaseClient = {
  from(table){
    return {
      select(){
        return {
          eq(column, value){
            return {
              maybeSingle: async ()=>{
                if(table === 'gestao_config' && column === 'id' && value === 'config'){
                  const r = await gatewayCall({ op:'getConfig' });
                  if(r.error) return { data:null, error:r.error };
                  return { data: { payload: r.data }, error: null };
                }
                return gatewayCall({ op:'selectOne', table, params:{ column, value } });
              }
            };
          },
          order(){ return gatewayCall({ op:'selectAll', table }); }
        };
      },
    };
  }
};

function levelLabel(n){ return n==='diretoria' ? 'Diretoria' : n==='gerente' ? 'Gerente' : n==='oficina' ? 'Oficina' : 'Vendedora'; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }

/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!pass) return;
  err.classList.remove('show');
  btn.disabled = true;
  const r = await gatewayLogin(pass);
  btn.disabled = false;
  if(!r || !r.ok || (r.user.nivel!=='diretoria' && r.user.nivel!=='gerente')){ err.classList.add('show'); return; }
  __gatewaySenha = pass;
  currentUser = { id:r.user.id, nome:r.user.nome, nivel:r.user.nivel, senha:pass };
  await carregarConfig();
  enterApp();
}
document.getElementById('btnLogout').addEventListener('click', ()=>{
  currentUser = null; __gatewaySenha = null;
  document.getElementById('loginPass').value = '';
  document.getElementById('view-app').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
});
async function carregarConfig(){
  try{
    const { data, error } = await supabaseClient.from('gestao_config').select('payload').eq('id','config').maybeSingle();
    if(error) throw error;
    config = data ? data.payload : {};
  }catch(e){ console.error('erro ao carregar config', e); config = {}; }
}
function enterApp(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-app').style.display = 'flex';
  document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
  document.getElementById('whoLevel').textContent = levelLabel(currentUser.nivel);
  renderEmptyState();
}
function renderEmptyState(){
  const area = document.getElementById('chatArea');
  area.innerHTML = `
    <div class="empty-state">
      <h2>Como posso ajudar?</h2>
      <p>Pergunte sobre vendas, estoque, funcionários, metas — ou qualquer outra coisa. Também posso analisar ou editar fotos.</p>
    </div>
  `;
}

/* ============================================================
   RESUMO DE DADOS — reúne um panorama do negócio pra IA usar de contexto
   ============================================================ */
async function montarResumoDados(){
  const resumo = { dataDeHoje: new Date().toISOString().slice(0,10), lojas: (config.lojas||[]).map(l=>l.nome) };
  async function buscar(table){
    try{
      const r = await gatewayCall({ op:'selectAll', table });
      if(r.error) return [];
      return (r.data||[]).map(row=>row.payload);
    }catch(e){ return []; }
  }
  const [vendas, ordens, orcamentos, produtos, funcionariosDp, registrosDp] = await Promise.all([
    buscar('vendas_pdv'), buscar('painel_ordens_kv'), buscar('orcamentos'), buscar('produtos_estoque'), buscar('dp_funcionarios'), buscar('dp_registros'),
  ]);
  // vendas_pdv e painel_ordens_kv podem vir vazios ou em formatos diferentes — protege com Array.isArray
  const listaVendas = Array.isArray(vendas) ? vendas : [];
  const listaOrdens = Array.isArray(ordens) ? ordens : [];
  resumo.totalVendasRegistradas = listaVendas.length;
  resumo.faturamentoTotalVendas = listaVendas.reduce((acc,v)=> acc + (Number(v.valorTotal)||0), 0);
  resumo.totalOrdensServico = listaOrdens.length;
  resumo.orcamentosAbertos = (orcamentos||[]).filter(o=>o.status && !['aprovado','recusado'].includes(o.status)).length;
  resumo.totalOrcamentos = (orcamentos||[]).length;
  resumo.totalProdutosCadastrados = (produtos||[]).length;
  resumo.produtosEstoqueBaixo = (produtos||[]).filter(p=> Number(p.estoque)<=2).map(p=>p.nome).slice(0,15);
  resumo.totalFuncionarios = (funcionariosDp||[]).length;
  resumo.funcionarios = (funcionariosDp||[]).map(f=>({ nome:f.nome, cargo:f.cargo, loja:f.loja, status:f.status }));
  resumo.advertenciasRecentes = (registrosDp||[]).filter(r=>r.tipo==='aviso').length;
  return resumo;
}

/* ============================================================
   ANEXO DE FOTO
   ============================================================ */
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
document.getElementById('btnAnexar').addEventListener('click', ()=> document.getElementById('inputAnexar').click());
document.getElementById('btnTirarFoto').addEventListener('click', ()=> document.getElementById('inputTirarFoto').click());
document.getElementById('inputAnexar').addEventListener('change', e=> processarAnexo(e.target.files[0]));
document.getElementById('inputTirarFoto').addEventListener('change', e=> processarAnexo(e.target.files[0]));
document.getElementById('btnRemoverAnexo').addEventListener('click', ()=>{ anexoAtual = null; atualizarPreviewAnexo(); });
async function processarAnexo(file){
  if(!file) return;
  const dataUrl = await readFileAsDataUrl(file);
  const match = dataUrl.match(/^data:(.+);base64,(.*)$/);
  if(!match) return;
  anexoAtual = { mimeType: match[1], base64: match[2], dataUrl };
  atualizarPreviewAnexo();
}
function atualizarPreviewAnexo(){
  const wrap = document.getElementById('previewAnexo');
  if(anexoAtual){
    document.getElementById('previewImg').src = anexoAtual.dataUrl;
    wrap.classList.add('show');
  } else {
    wrap.classList.remove('show');
  }
}

/* ============================================================
   MODO (conversar / editar foto)
   ============================================================ */
document.querySelectorAll('#modoToggle [data-modo]').forEach(b=>{
  b.addEventListener('click', ()=>{
    modoAtual = b.dataset.modo;
    document.querySelectorAll('#modoToggle [data-modo]').forEach(x=> x.classList.toggle('active', x===b));
    const campo = document.getElementById('campoMensagem');
    campo.placeholder = modoAtual==='editar' ? 'Instrução extra (opcional) — a foto vira o padrão de catálogo: fundo branco, ouro quente, prata neutra...'
      : 'Pergunte qualquer coisa, sobre o negócio ou não...';
  });
});

/* ============================================================
   ENVIO DE MENSAGEM
   ============================================================ */
document.getElementById('campoMensagem').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarMensagem(); }
});
document.getElementById('btnEnviar').addEventListener('click', enviarMensagem);

function adicionarMensagem(html, classe){
  const area = document.getElementById('chatArea');
  const vazio = area.querySelector('.empty-state');
  if(vazio) area.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg ' + classe;
  div.innerHTML = html;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function enviarMensagem(){
  const campo = document.getElementById('campoMensagem');
  const texto = campo.value.trim();
  if(!texto && !anexoAtual) return;
  if(modoAtual==='editar' && !anexoAtual){ alert('Anexe ou tire uma foto pra editar.'); return; }

  let htmlUsuario = '';
  if(anexoAtual) htmlUsuario += `<img class="msg-img-anexo" src="${anexoAtual.dataUrl}">`;
  if(texto) htmlUsuario += escapeHtml(texto);
  if(!texto && modoAtual==='editar') htmlUsuario += '<i>Editar no padrão editorial</i>';
  adicionarMensagem(htmlUsuario, 'msg-user');

  const anexoParaEnvio = anexoAtual;
  const modoParaEnvio = modoAtual;
  campo.value = '';
  anexoAtual = null;
  atualizarPreviewAnexo();
  document.getElementById('btnEnviar').disabled = true;

  const loading = adicionarMensagem(modoParaEnvio==='editar' ? 'Editando a foto, isso pode levar alguns segundos...' : 'Pensando...', 'msg-loading');

  try{
    const body = { senha: __gatewaySenha, mensagem: texto };
    if(anexoParaEnvio){ body.imagemBase64 = anexoParaEnvio.base64; body.imagemMimeType = anexoParaEnvio.mimeType; }
    if(modoParaEnvio==='editar') body.modoImagem = 'editar';
    if(modoParaEnvio==='chat'){ body.resumoDados = await montarResumoDados(); }

    const res = await fetch(IA_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    loading.remove();
    if(data.error){
      adicionarMensagem('Não consegui responder agora: ' + escapeHtml(data.error), 'msg-ia');
    } else if(data.tipo === 'imagem'){
      adicionarMensagem(`<img src="data:${data.mimeType};base64,${data.imagemBase64}">`, 'msg-ia');
    } else {
      adicionarMensagem(escapeHtml(data.resposta), 'msg-ia');
    }
  }catch(e){
    loading.remove();
    adicionarMensagem('Não foi possível conectar. Tente de novo.', 'msg-ia');
  }
  document.getElementById('btnEnviar').disabled = false;
}

const EMBEDDED = window.self !== window.top;
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', async (ev)=>{
    if(!ev.data || !ev.data.type) return;
    if(ev.data.type === 'auth'){
      currentUser = ev.data.user;
      __gatewaySenha = ev.data.user.senha;
      await carregarConfig();
      enterApp();
      parent.postMessage({ type:'tabs', modulo:'ia', tabs: [], active: null }, '*');
    }
  });
}
(async function init(){
  if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'ia' }, '*');
})();
</script>
</body>
</html>
