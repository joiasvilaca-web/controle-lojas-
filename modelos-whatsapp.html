<!DOCTYPE html>
<html lang="pt-BR" data-ds data-sem-maiuscula>
<head>
<script src="supabase-config.js"></script>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos WhatsApp — Gestão e Controle</title>
<link rel="stylesheet" href="tema.css">
<style>
  :root{ --radius:12px; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.4;}
  button,input,select,textarea{font-family:inherit;}
  .wrap{padding:20px 24px 60px;max-width:1180px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .page-title{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.015em;} .page-sub{font-size:13px;color:var(--ink-faint);margin:0 0 16px;max-width:820px;line-height:1.45;}
  .muted{color:var(--ink-faint);} .small{font-size:12px;}
  .abas{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .aba{padding:9px 16px;border:0;background:none;color:var(--ink-soft);font-weight:600;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .aba.on{color:var(--accent);border-bottom-color:var(--accent);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;min-height:36px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-sm{padding:4px 10px;min-height:30px;font-size:12.5px;} .btn:disabled{opacity:.5;cursor:default;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .selo{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .selo.ok{background:var(--ok-soft);color:var(--ok);} .selo.no{background:var(--danger-soft);color:var(--danger);}
  .selo.wait{background:var(--wait-soft);color:var(--wait);} .selo.info{background:var(--accent-soft);color:var(--accent);}
  .selo.cinza{background:var(--surface-2);color:var(--ink-soft);}
  .mod-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px;}
  .mod-head h3{margin:0 0 2px;font-size:16px;} .mod-head p{margin:0;font-size:12.5px;color:var(--ink-faint);max-width:640px;}
  textarea.txt{width:100%;min-height:150px;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.5;resize:vertical;}
  .vars{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;} .vars span{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;}
  .prev{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13px;line-height:1.5;margin-top:8px;}
  .aviso{border-radius:8px;padding:9px 12px;font-size:13px;margin:8px 0;background:var(--wait-soft);color:var(--ink);border:1px solid var(--line);}
  .aviso.err{background:var(--danger-soft);}
  .grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .kpi small{display:block;color:var(--ink-faint);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .kpi b{font-size:22px;letter-spacing:-.01em;} .kpi span{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;} .field > label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select{width:100%;padding:8px 10px !important;min-height:38px;border-radius:8px;font-size:14px;}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
  tfoot td{font-weight:700;border-top:2px solid var(--line);}
  .barra{height:8px;border-radius:4px;background:var(--accent);min-width:2px;}
  .barras{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px;}
  .barras div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:.85;} .barras div:hover{opacity:1;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;padding:10px 16px;z-index:90;font-size:13.5px;transition:all .2s;background:var(--ink);color:var(--bg);border-radius:8px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:760px){ .wrap{padding:14px 12px 60px;} }
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none;">
  <h1 class="page-title">Modelos de mensagem (WhatsApp oficial)</h1>
  <p class="page-sub">Um modelo para cada lugar do app que manda mensagem. Edite o texto e envie para a Meta aprovar. Enquanto a Meta analisa, o modelo atual continua valendo; quando aprova, o app passa a usar o novo sozinho. Só a Diretoria vê esta tela.</p>
  <div class="abas">
    <button class="aba on" data-aba="modelos" type="button">Modelos</button>
    <button class="aba" data-aba="custos" type="button">Custos da Meta</button>
  </div>
  <div id="abaModelos"></div>
  <div id="abaCustos" style="display:none;"></div>
</div>
<div id="toast"></div>

<script>
const EMBEDDED = window.parent !== window;
function mensagemConfiavel(ev){ try{ if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false; return true; }catch(e){ return false; } }
const SUPABASE_URL = window.SUPABASE_URL, SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
const API = SUPABASE_URL + '/functions/v1/modelos-api';
let __senha = null, currentUser = null, modelos = [], tarifas = {}, custoLinhas = [], periodoSel = 'mes', refData = new Date();
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl4 = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
const CAT = { MARKETING:['Marketing','info'], UTILITY:['Utilidade','ok'], AUTHENTICATION:['Autenticação','cinza'] };
const STATUS = { APPROVED:['Aprovado','ok'], PENDING:['Em análise na Meta','wait'], REJECTED:['Rejeitado','no'], PAUSED:['Pausado pela Meta','no'], DISABLED:['Desativado','no'], IN_APPEAL:['Em recurso','wait'] };
function showToast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),3200); }
async function api(body){
  try{
    const r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __senha, ...body }) });
    return await r.json();
  }catch(e){ return { error:'Não foi possível conectar. Verifique sua internet.' }; }
}
function seloCat(c){ const x = CAT[c]||[c,'cinza']; return `<span class="selo ${x[1]}">${esc(x[0])}</span>`; }
function seloSt(s){ const x = STATUS[s]||[s||'—','cinza']; return `<span class="selo ${x[1]}">${esc(x[0])}</span>`; }
function previa(corpo, exemplos){ return String(corpo||'').replace(/\{\{\s*(\d+)\s*\}\}/g,(_m,n)=> (exemplos && exemplos[Number(n)-1]) || '…'); }

/* ───────── Aba Modelos ───────── */
function desenharModelos(){
  const box = $('abaModelos');
  if(!modelos.length){ box.innerHTML = '<div class="card muted">Nenhum modelo cadastrado.</div>'; return; }
  box.innerHTML = modelos.map(m=>{
    const vars = (m.variaveis||[]).map((v,i)=>`<span><b>{{${i+1}}}</b> = ${esc(v)}</span>`).join('');
    const emAnalise = m.rascunho_nome && m.rascunho_status && m.rascunho_status!=='APPROVED';
    const tarifa = tarifas[m.categoria];
    let rasc = '';
    if(m.rascunho_nome){
      const rej = m.rascunho_status==='REJECTED';
      rasc = `<div class="aviso ${rej?'err':''}"><b>Nova versão (${esc(m.rascunho_nome)}):</b> ${seloSt(m.rascunho_status)}${rej && m.rascunho_motivo && m.rascunho_motivo!=='NONE' ? ' — motivo: '+esc(m.rascunho_motivo) : ''}
        <div class="prev">${esc(previa(m.rascunho_corpo, m.exemplos))}</div>
        <div class="acoes" style="margin-top:8px;"><button class="btn btn-sm" data-cancelar="${esc(m.chave)}" type="button">${rej?'Descartar':'Cancelar esta versão'}</button>
        <span class="small muted">${rej?'Ajuste o texto abaixo e envie de novo.':'O modelo atual continua sendo usado até a Meta aprovar.'}</span></div></div>`;
    }
    return `<div class="card" data-chave="${esc(m.chave)}">
      <div class="mod-head"><div><h3>${esc(m.local_nome)}</h3><p>${esc(m.descricao||'')}</p></div>
        <div class="acoes">${seloCat(m.categoria)} ${seloSt(m.status)} <span class="selo cinza" title="Nome do modelo na Meta">${esc(m.nome_template)}</span></div></div>
      ${rasc}
      <div class="small muted">Texto ativo agora${tarifa?` · custa cerca de ${brl4(tarifa.valor_brl)} por mensagem`:''}</div>
      <textarea class="txt" data-txt="${esc(m.chave)}" ${emAnalise&&m.rascunho_status==='PENDING'?'disabled':''}>${esc(m.corpo||'')}</textarea>
      <div class="vars">${vars}</div>
      <div class="small muted">Mantenha as variáveis {{1}}, {{2}}… no texto (o sistema preenche). Não pode começar nem terminar com variável. A Meta pode mudar a categoria e cobrar mais caro (Marketing).</div>
      <div class="prev" data-prev="${esc(m.chave)}">${esc(previa(m.corpo, m.exemplos))}</div>
      <div class="acoes" style="margin-top:10px;"><button class="btn btn-accent" data-enviar="${esc(m.chave)}" type="button" ${emAnalise&&m.rascunho_status==='PENDING'?'disabled':''}>Enviar para aprovação da Meta</button>
        <button class="btn" data-reset="${esc(m.chave)}" type="button">Desfazer edição</button></div>
    </div>`;
  }).join('');
  box.querySelectorAll('textarea[data-txt]').forEach(t=> t.addEventListener('input', ()=>{ const m = modelos.find(x=>x.chave===t.dataset.txt); box.querySelector(`[data-prev="${t.dataset.txt}"]`).textContent = previa(t.value, m && m.exemplos); }));
  box.querySelectorAll('[data-reset]').forEach(b=> b.addEventListener('click', ()=>{ const m = modelos.find(x=>x.chave===b.dataset.reset); const t = box.querySelector(`textarea[data-txt="${b.dataset.reset}"]`); t.value = m.corpo||''; t.dispatchEvent(new Event('input')); }));
  box.querySelectorAll('[data-enviar]').forEach(b=> b.addEventListener('click', async ()=>{
    const chave = b.dataset.enviar, corpo = box.querySelector(`textarea[data-txt="${chave}"]`).value;
    if(!confirm('Enviar este texto para a Meta aprovar? A análise leva de minutos a algumas horas e a Meta pode classificar como Marketing (mais caro).')) return;
    b.disabled = true; b.textContent = 'Enviando…';
    const r = await api({ op:'salvar_rascunho', chave, corpo });
    if(r && r.ok){ showToast('Enviado à Meta ('+r.nome+'). Aguarde a aprovação.'); await carregar(); }
    else { showToast((r && (r.erro||r.error)) || 'Não foi possível enviar.'); b.disabled = false; b.textContent = 'Enviar para aprovação da Meta'; }
  }));
  box.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', async ()=>{
    const r = await api({ op:'cancelar_rascunho', chave:b.dataset.cancelar });
    if(r && r.ok){ showToast('Versão descartada.'); await carregar(); }
  }));
}
async function carregar(){
  const r = await api({ op:'listar' });
  if(!r || !r.ok){ $('abaModelos').innerHTML = `<div class="card"><b>Não foi possível carregar.</b><div class="muted small">${esc((r&&(r.error||r.erro))||'')}</div></div>`; return; }
  modelos = r.modelos||[]; tarifas = {}; (r.tarifas||[]).forEach(t=> tarifas[t.categoria] = t);
  desenharModelos();
  if($('abaCustos').style.display!=='none') carregarCustos();
}

/* ───────── Aba Custos ───────── */
const pad = n => String(n).padStart(2,'0');
const isoDia = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function intervalo(sel){
  const r = new Date(refData), y = r.getFullYear(), m = r.getMonth();
  if(sel==='dia') return { de: isoDia(r), ate: isoDia(r) };
  if(sel==='ano') return { de: `${y}-01-01`, ate: `${y}-12-31` };
  return { de: isoDia(new Date(y,m,1)), ate: isoDia(new Date(y,m+1,0)) };
}
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function rotuloPeriodo(){
  const r = new Date(refData), h = new Date();
  if(periodoSel==='dia'){
    const d0 = new Date(h.getFullYear(),h.getMonth(),h.getDate()), d1 = new Date(r.getFullYear(),r.getMonth(),r.getDate()), dif = Math.round((d0-d1)/86400000);
    const nome = dif===0?'Hoje':dif===1?'Ontem':dif===-1?'Amanhã':['domingo','segunda','terça','quarta','quinta','sexta','sábado'][r.getDay()];
    return `${nome} · ${pad(r.getDate())}/${pad(r.getMonth()+1)}/${r.getFullYear()}`;
  }
  if(periodoSel==='ano') return String(r.getFullYear());
  return `${MESES[r.getMonth()]} de ${r.getFullYear()}`;
}
function ehAtual(){
  const r = new Date(refData), h = new Date();
  if(periodoSel==='dia') return isoDia(r)===isoDia(h);
  if(periodoSel==='ano') return r.getFullYear()===h.getFullYear();
  return r.getFullYear()===h.getFullYear() && r.getMonth()===h.getMonth();
}
function mover(n){
  const r = new Date(refData);
  if(periodoSel==='dia') r.setDate(r.getDate()+n);
  else if(periodoSel==='ano') r.setFullYear(r.getFullYear()+n);
  else { r.setDate(1); r.setMonth(r.getMonth()+n); }
  refData = r;
}
function desenharCustosEsqueleto(){
  const op = (v,t)=> `<button class="btn btn-sm ${periodoSel===v?'btn-accent':''}" data-per="${v}" type="button">${t}</button>`;
  $('abaCustos').innerHTML = `
    <div class="card"><div class="acoes">${op('dia','Dia')}${op('mes','Mês')}${op('ano','Ano')}
      <span style="display:inline-flex;gap:6px;align-items:center;margin-left:8px;"><button class="btn btn-sm" id="cAnt" type="button" aria-label="Anterior" title="Anterior">◀</button><b id="cRot" style="min-width:150px;text-align:center;text-transform:capitalize;">${esc(rotuloPeriodo())}</b><button class="btn btn-sm" id="cProx" type="button" aria-label="Próximo" title="Próximo">▶</button><button class="btn btn-sm" id="cHoje" type="button" ${ehAtual()?'disabled':''}>${periodoSel==='dia'?'Hoje':periodoSel==='mes'?'Este mês':'Este ano'}</button></span>
      <button class="btn btn-sm" id="cCsv" type="button" style="margin-left:auto;">Exportar CSV</button></div></div>
    <div id="custoCorpo"><div class="card muted">Carregando…</div></div>
    <div class="card"><b>Valores por mensagem (editáveis)</b>
      <p class="small muted" style="margin:4px 0 10px;">São estimativas: a Meta cobra por mensagem entregue, na categoria em que ela classificou o modelo. Confira a tabela de preços da Meta para o Brasil e ajuste aqui. Mensagem de utilidade enviada dentro de uma conversa aberta (cliente falou com você nas últimas 24h) é grátis na Meta — aqui ela é contada como paga, então o total é um teto.</p>
      <div class="grid" id="tarifasBox"></div></div>`;
  $('abaCustos').querySelectorAll('[data-per]').forEach(b=> b.addEventListener('click', ()=>{ periodoSel = b.dataset.per; desenharCustosEsqueleto(); carregarCustos(); }));
  $('cAnt').addEventListener('click', ()=>{ mover(-1); desenharCustosEsqueleto(); carregarCustos(); });
  $('cProx').addEventListener('click', ()=>{ mover(1); desenharCustosEsqueleto(); carregarCustos(); });
  $('cHoje').addEventListener('click', ()=>{ refData = new Date(); desenharCustosEsqueleto(); carregarCustos(); });
  $('cCsv').addEventListener('click', csv);
  desenharTarifas();
}
function desenharTarifas(){
  const cats = ['MARKETING','UTILITY'];
  $('tarifasBox').innerHTML = cats.map(c=>{ const t = tarifas[c]||{valor_brl:0}; return `<div class="field"><label>${CAT[c][0]} — R$ por mensagem</label><div class="acoes"><input type="number" step="0.0001" min="0" value="${Number(t.valor_brl)}" data-tar="${c}" style="max-width:130px;"><button class="btn btn-sm" data-salvartar="${c}" type="button">Salvar</button></div></div>`; }).join('');
  $('tarifasBox').querySelectorAll('[data-salvartar]').forEach(b=> b.addEventListener('click', async ()=>{
    const c = b.dataset.salvartar, v = $('tarifasBox').querySelector(`[data-tar="${c}"]`).value;
    const r = await api({ op:'tarifa', categoria:c, valor:v });
    if(r && r.ok){ showToast('Valor salvo.'); tarifas[c] = { ...(tarifas[c]||{}), categoria:c, valor_brl:Number(v) }; renderCustos(); } else showToast((r&&r.error)||'Não foi possível salvar.');
  }));
}
async function carregarCustos(){
  const { de, ate } = intervalo(periodoSel);
  if(!de || !ate){ return; }
  $('custoCorpo').innerHTML = '<div class="card muted">Carregando…</div>';
  const r = await api({ op:'custos', de, ate });
  if(!r || !r.ok){ $('custoCorpo').innerHTML = `<div class="card"><b>Não foi possível carregar.</b> ${esc((r&&(r.error||r.erro))||'')}</div>`; return; }
  custoLinhas = r.linhas||[]; (r.tarifas||[]).forEach(t=> tarifas[t.categoria] = t);
  renderCustos();
}
const unit = cat => Number((tarifas[cat]||{}).valor_brl)||0;
function renderCustos(){
  if(!$('custoCorpo')) return;
  const L = custoLinhas;
  if(!L.length){ $('custoCorpo').innerHTML = '<div class="card muted">Nenhuma mensagem enviada pela API oficial neste período.</div>'; return; }
  let totN = 0, totC = 0; const porCat = {}, porMod = {}, porDia = {};
  for(const l of L){
    const c = l.n * unit(l.categoria);
    totN += l.n; totC += c;
    (porCat[l.categoria] = porCat[l.categoria] || {n:0,c:0}); porCat[l.categoria].n += l.n; porCat[l.categoria].c += c;
    const k = l.chave; (porMod[k] = porMod[k] || { local:l.local, categoria:l.categoria, modelo:l.modelo, n:0, c:0 }); porMod[k].n += l.n; porMod[k].c += c;
    (porDia[l.dia] = porDia[l.dia] || {n:0,c:0,det:{}}); porDia[l.dia].n += l.n; porDia[l.dia].c += c; porDia[l.dia].det[l.local] = (porDia[l.dia].det[l.local]||0) + l.n;
  }
  const dias = Object.keys(porDia).sort(), maxC = Math.max(...dias.map(d=>porDia[d].c), 0.0001);
  const mods = Object.values(porMod).sort((a,b)=> b.c - a.c);
  const cats = Object.entries(porCat);
  const fmtD = d => d.split('-').reverse().slice(0,2).join('/');
  $('custoCorpo').innerHTML = `
    <div class="grid" style="margin-bottom:16px;">
      <div class="kpi"><small>Custo estimado</small><b>${brl(totC)}</b><span>${totN} mensagens</span></div>
      ${cats.map(([c,v])=>`<div class="kpi"><small>${esc(CAT[c]?CAT[c][0]:c)}</small><b>${brl(v.c)}</b><span>${v.n} msgs × ${brl4(unit(c))}</span></div>`).join('')}
      <div class="kpi"><small>Média por dia</small><b>${brl(totC/dias.length)}</b><span>${dias.length} dia(s) com envio</span></div>
    </div>
    <div class="card"><b>Custo por dia</b><div class="barras" title="">${dias.map(d=>`<div style="height:${Math.max(2,Math.round(porDia[d].c/maxC*100))}%" title="${fmtD(d)}: ${brl(porDia[d].c)} (${porDia[d].n} msgs)"></div>`).join('')}</div>
      <div class="small muted" style="display:flex;justify-content:space-between;"><span>${fmtD(dias[0])}</span><span>${fmtD(dias[dias.length-1])}</span></div></div>
    <div class="card"><b>Por modelo (local de envio)</b><div class="scroll"><table><thead><tr><th>Local</th><th>Categoria</th><th class="n">Mensagens</th><th class="n">Por msg</th><th class="n">Custo</th><th>% do total</th></tr></thead><tbody>
      ${mods.map(m=>`<tr><td>${esc(m.local)}</td><td>${seloCat(m.categoria)}</td><td class="n">${m.n}</td><td class="n">${brl4(unit(m.categoria))}</td><td class="n">${brl(m.c)}</td><td style="min-width:110px;"><div class="barra" style="width:${Math.round(m.c/(totC||1)*100)}%"></div></td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="2">Total</td><td class="n">${totN}</td><td></td><td class="n">${brl(totC)}</td><td></td></tr></tfoot></table></div></div>
    <div class="card"><b>Dia a dia</b><div class="scroll"><table><thead><tr><th>Dia</th><th class="n">Mensagens</th><th class="n">Custo</th><th>Onde</th></tr></thead><tbody>
      ${dias.slice().reverse().map(d=>`<tr><td>${d.split('-').reverse().join('/')}</td><td class="n">${porDia[d].n}</td><td class="n">${brl(porDia[d].c)}</td><td class="small muted">${Object.entries(porDia[d].det).map(([k,v])=>esc(k)+': '+v).join(' · ')}</td></tr>`).join('')}
      </tbody></table></div></div>`;
}
function csv(){
  const linhas = [['dia','local','modelo','categoria','mensagens','valor_unit','custo']].concat(custoLinhas.map(l=>[l.dia,l.local,l.modelo,l.categoria,l.n,unit(l.categoria),(l.n*unit(l.categoria)).toFixed(4)]));
  const txt = '﻿' + linhas.map(r=> r.map(v=> '"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download = 'custos-meta.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

function iniciar(){
  document.querySelectorAll('.aba').forEach(b=> b.addEventListener('click', ()=>{
    document.querySelectorAll('.aba').forEach(x=> x.classList.toggle('on', x===b));
    const custos = b.dataset.aba==='custos';
    $('abaModelos').style.display = custos?'none':''; $('abaCustos').style.display = custos?'':'none';
    if(custos){ desenharCustosEsqueleto(); carregarCustos(); }
  }));
  $('app').style.display = 'block';
  carregar();
}
if(EMBEDDED){
  document.documentElement.classList.add('embedded');
  window.addEventListener('message', ev=>{
    if(!mensagemConfiavel(ev) || !ev.data || ev.data.type!=='auth') return;
    currentUser = ev.data.user; __senha = currentUser && currentUser.senha;
    if(!currentUser || currentUser.nivel!=='diretoria'){ document.body.innerHTML = '<div style="padding:32px;text-align:center;color:#888;"><b>Acesso restrito</b><br>Só a Diretoria vê os modelos de mensagem.</div>'; return; }
    if(!$('app').dataset.ok){ $('app').dataset.ok = '1'; iniciar(); }
  });
  parent.postMessage({ type:'tabs', modulo:'modelos', tabs:[], active:null }, '*');
  parent.postMessage({ type:'ready', modulo:'modelos' }, '*');
}
(function(){
  var ultimoAviso = 0;
  function avisar(){ var agora = Date.now(); if(agora - ultimoAviso < 5000) return; ultimoAviso = agora; try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){} }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){ document.addEventListener(ev, avisar, { passive:true, capture:true }); });
})();
</script>
