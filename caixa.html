  }
  async function abrirFecharCaixa(de, ate, lojaId){
    const gestao = currentUser && (currentUser.nivel==='diretoria' || currentUser.nivel==='gerente' || (currentUser.nivel==='vendedora' && (currentUser.lojas||[]).includes(lojaId)));
    const umDia = de && de===ate && !!lojaId;
    const fech = umDia ? await lerFechamento(lojaId, de) : null;
    const fechado = !!(fech && fech.fechado);
    const todos = registrosFiscais(de, ate, lojaId);
    const semPagto = r=> r.momentoPagamento==='na_volta' && !(r.pagamentos||[]).some(p=>Number(p.valor)>0);   // pagar depois ainda sem pagamento: nada de nota pendente
    const emitir = todos.filter(x=> !semPagto(x.reg) && (x.reg.emissaoNota!=='sim' && (x.reg.emissaoNota!=='nao' || (x.reg.pagamentos||[]).some(formaExigeNota))) && pagouPixOuCartao(x.reg));   // 'não' escolhido na via vale (só LINK ECO sempre exige nota)
    // Só Pix pessoa física (PF): não cobra o número da nota, mesmo se marcaram nota.
    const soPixPF = r=>{ const v=(r.pagamentos||[]).filter(p=>(Number(p.valor)||0)>0); return v.length>0 && v.every(p=> /pix/i.test(nomeForma(p)) && p.pessoa==='PF'); };
    const faltaNum = todos.filter(x=> x.reg.emissaoNota==='sim' && !semPagto(x.reg) && !String(x.reg.numeroNota||'').trim() && !soPixPF(x.reg));
    const faltaEntrada = todos.filter(x=> x.reg.notaEntrada && x.reg.status!=='cancelada' && x.reg.status!=='cancelado' && !String(x.reg.notaEntrada.numero||'').trim());
    const tudoOk = !emitir.length && !faltaNum.length && !faltaEntrada.length;
    // 05/11: cancelamentos do período aparecem no fechamento (informativo — não trava o fechamento)
    const noPeriodoC = ms=>{ const d0 = dataDeTimestamp(ms); return d0 && d0>=de && d0<=ate; };
    const cancelados = [
      ...vendas.filter(v=> v.status==='cancelada' && (!lojaId || v.lojaId===lojaId) && noPeriodoC(v.canceladoEm)).map(v=>({ origem:'Venda', via:v.codigoVia||'', reg:v })),
      ...caixaOrdens.filter(o=> o.status==='cancelado' && (!lojaId || o.lojaId===lojaId) && noPeriodoC(o.canceladoEm)).map(o=>({ origem:'O.S.', via:o.via||'', reg:o }))
    ];
    const destinoC = r=>{ const t = r.cancelamentoDestino && r.cancelamentoDestino.tipo; const v = Number(r.cancelamentoDestino && r.cancelamentoDestino.valor)||0; if(!v) return 'sem valor recebido'; return t==='credito' ? fmtMoeda(v)+' viraram crédito do cliente' : t==='pix' ? fmtMoeda(v)+' devolvidos por Pix' : fmtMoeda(v)+' devolvidos em dinheiro'; };
    const linha = (x,motivo,i,grupo)=>`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;">
      <div><b>${escapeHtml(x.origem)} ${escapeHtml(viaDe(x.reg))}</b> · ${fmtDate(x.reg.data)} · ${escapeHtml(nomeLojaCaixa(x.reg.lojaId)||'')}<div class="muted" style="font-size:12.5px;">${escapeHtml(x.reg.cliente||'')} · ${fmtMoeda(x.reg.valorTotal)}${motivo?' · '+motivo:''}</div></div>
      <button class="btn btn-ghost btn-sm" data-fc="${grupo}:${i}" type="button">${grupo==='e'?'Nota emitida':'Informar nº'}</button></div>`;
    const periodo = de===ate ? fmtDate(de) : fmtDate(de)+' a '+fmtDate(ate);
    const quando = ms=> ms ? new Date(ms).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '';
    let acao = '';
    if(!umDia) acao = `<div class="muted" style="margin:10px 0;">Para fechar o caixa, escolha <b>um único dia</b> e <b>uma loja</b> nos filtros.</div>`;
    else if(fechado) acao = `<div style="padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin:10px 0;">${ic('cadeado')} Caixa fechado por ${escapeHtml(fech.por||'—')} em ${quando(fech.em)}.</div>
      ${gestao ? '' : `<div class="muted" style="margin-bottom:8px;">Para reabrir, use a senha de um gerente ou da diretoria.</div>`}`;
    else if(!tudoOk) acao = `<div class="muted" style="margin:10px 0;">Resolva as pendências abaixo para poder fechar o caixa do dia.</div>`;
    else acao = `<div style="padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin:10px 0;">Nenhuma pendência de nota fiscal. Caixa pronto para fechar.</div>`;
    openModal(`<h3>Fechar caixa · ${periodo}${lojaId?' · '+escapeHtml(nomeLojaCaixa(lojaId)):' · todas as lojas'}</h3>
      ${acao}
      ${htmlPainelCaixa(dadosPainelCaixa(de, ate, lojaId), !lojaId)}
      ${emitir.length ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--danger-soft);"><div style="font-weight:700;color:var(--danger);margin-bottom:4px;">Emitir nota fiscal — ${emitir.length} em Pix/cartão/LINK ECO sem nota</div>${emitir.map((x,i)=>linha(x,(x.reg.pagamentos||[]).some(formaExigeNota) ? 'LINK ECO: nota pela '+escapeHtml(nomeLojaCaixa(lojaNotaDaForma(x.reg))||'Ecommerce') : 'pago em Pix/cartão',i,'e')).join('')}</div>` : ''}
      ${faltaNum.length ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--wait-soft);"><div style="font-weight:700;color:var(--wait);margin-bottom:4px;">Falta o número da nota — ${faltaNum.length} marcado(s) com nota</div>${faltaNum.map((x,i)=>linha(x,'marcado com nota, sem número',i,'n')).join('')}</div>` : ''}
      ${faltaEntrada.length ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--danger-soft);"><div style="font-weight:700;color:var(--danger);margin-bottom:4px;">Falta o número da nota de ENTRADA (ouro) — ${faltaEntrada.length} via(s)</div>${faltaEntrada.map((x,i)=>linha(x,'pagou em ouro, sem número da nota de entrada',i,'o')).join('')}</div>` : ''}
      ${cancelados.length ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);"><div style="font-weight:700;margin-bottom:4px;">Cancelamentos do período — ${cancelados.length} via(s) <span class="muted" style="font-weight:500;">(informativo)</span></div>${cancelados.map(c=>`<div style="padding:6px 0;border-bottom:1px solid var(--line);"><b>${escapeHtml(c.origem)} ${escapeHtml(c.via)}</b> · ${escapeHtml(c.reg.cliente||'')} · ${fmtMoeda(c.reg.valorTotal)}<div class="muted" style="font-size:12.5px;">${escapeHtml(destinoC(c.reg))} · por ${escapeHtml(c.reg.canceladoPor||'—')}${c.reg.motivoCancelamento?' · '+escapeHtml(c.reg.motivoCancelamento):''}</div></div>`).join('')}</div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-ghost" id="fc_fechar" type="button" data-fechar>Voltar</button>
        <button class="btn btn-ghost" id="fc_imprimir" type="button">${ic('impressora')} Imprimir conferência</button>
        ${umDia && fechado ? `<button class="btn btn-ghost" id="fc_imprimir_fech" type="button">${ic('impressora')} Imprimir via do fechamento</button>` : ''}
        ${umDia && fechado ? `<button class="btn btn-danger" id="fc_reabrir" type="button">${gestao ? 'Reabrir caixa' : 'Reabrir caixa (senha da gerência)'}</button>` : ''}
        ${umDia && !fechado && tudoOk ? `<button class="btn btn-accent" id="fc_confirmar" type="button">Fechar caixa do dia</button>` : ''}
      </div>`);
    document.getElementById('modalBox').classList.add('largo'); ativarDicasPainel();
    document.getElementById('fc_fechar').addEventListener('click', closeModal);
    document.getElementById('fc_imprimir').addEventListener('click', ()=> imprimirRelatorioCaixa(de, ate, lojaId, 'conferencia'));
    { const bf = document.getElementById('fc_imprimir_fech'); if(bf) bf.addEventListener('click', ()=> imprimirRelatorioCaixa(de, ate, lojaId, 'fechamento')); }
    document.querySelectorAll('[data-fc]').forEach(b=> b.addEventListener('click', ()=>{ const [g,i]=b.dataset.fc.split(':'); const x=(g==='e'?emitir:g==='o'?faltaEntrada:faltaNum)[+i]; (g==='o'?abrirNotaEntrada:abrirNotaEmitida)(x, ()=> abrirFecharCaixa(de, ate, lojaId)); }));
    const bc = document.getElementById('fc_confirmar');
    if(bc) bc.addEventListener('click', async ()=>{
      bc.disabled = true;
      const r = await gravarFechamento(lojaId, de, { fechado:true, por:currentUser.nome, em:Date.now(), historico:[...((fech&&fech.historico)||[])] });
      if(r && r.error){ bc.disabled = false; showToast('Não consegui fechar o caixa: '+r.error); return; }
      showToast('Caixa do dia fechado.');
      imprimirRelatorioCaixa(de, ate, lojaId, 'fechamento');   // sai sozinha a via do fechamento (totais por forma e total da loja)
      abrirFecharCaixa(de, ate, lojaId);
      enviarResumoCaixa(lojaId, de);
    });
    const br = document.getElementById('fc_reabrir');
    if(br) br.addEventListener('click', async ()=>{
      let autorizadoPor = currentUser.nome;
      if(gestao){ if(!confirm('Reabrir o caixa de '+periodo+'? Vendas e pedidos poderão ser lançados e cancelados de novo nesta loja.')) return; }
      else {
        if(!window.Autorizacao){ showToast('Recarregue a página (Ctrl+F5).'); return; }
        const a = await Autorizacao.pedir({ sessao: __gatewaySenha, acao:'reabrir_caixa', modulo:'Caixa', registroId: lojaId+':'+de, resumo:'Reabrir o caixa de '+periodo+' · '+nomeLojaCaixa(lojaId) });
        if(!a) return; autorizadoPor = a.nome;
      }
      br.disabled = true;
      const hist = [...((fech&&fech.historico)||[]), { fechadoPor:fech.por, fechadoEm:fech.em, reabertoPor:currentUser.nome, autorizadoPor, reabertoEm:Date.now() }];
      const r = await gravarFechamento(lojaId, de, { fechado:false, reabertoPor:currentUser.nome, autorizadoPor, reabertoEm:Date.now(), historico:hist });
      if(r && r.error){ br.disabled = false; showToast('Não consegui reabrir: '+r.error); return; }
      showToast('Caixa reaberto.'); abrirFecharCaixa(de, ate, lojaId);
    });
  }
  /* Resumo do dia para a diretoria pelo WhatsApp (Configurações › Resumo do caixa). Não bloqueia o fechamento. */
  function textoResumoCaixa(lojaId, dia){
    // 06/11: mesma conta do Fechar caixa (movimentosCaixa) — antes ignorava vendas canceladas depois, devoluções e pedidos pagos sem data
    const m = v => fmtMoeda(v);
    const d = dadosPainelCaixa(dia, dia, lojaId);
    const L = [];
    L.push('*Fechamento de caixa — ' + (nomeLojaCaixa(lojaId)||'Loja') + '*');
    L.push(fmtDate(dia) + ' · fechado por ' + ((currentUser&&currentUser.nome)||'—') + ' às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    L.push('');
    L.push('🛍️ Vendas: ' + d.vendasQtd + ' · ' + m(d.vendasValor));
    L.push('🔧 Pedidos (O.S.): ' + d.pedidosQtd + ' · ' + m(d.pedidosValor));
    L.push('');
    L.push('*Entradas: ' + m(d.recebido) + '*');
    d.formasTodas.forEach(k=> L.push('• ' + k + ': ' + m(d.totFormaTodas[k])));
    if(d.saidasTot > 0){
      L.push('');
      L.push('*Saídas: ' + m(d.saidasTot) + '*');
      Object.keys(d.saiForma).forEach(k=> L.push('• ' + k + ': ' + m(d.saiForma[k])));
    }
    L.push('');
    L.push('*Saldo do caixa: ' + m(d.saldo) + '*');
    L.push('A receber: ' + m(d.aReceber));
    return L.join('\n');
  }
  async function enviarResumoCaixa(lojaId, dia){
    try{
      const texto = textoResumoCaixa(lojaId, dia);
      const r = await fetch(SUPABASE_URL + '/functions/v1/caixa-resumo', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ op:'enviar', senha: __gatewaySenha, texto }) });
      const j = await r.json().catch(()=>null);
      if(j && j.enviados) showToast('Resumo enviado à diretoria pelo WhatsApp.');
      else if(j && j.error) showToast('Resumo não enviado: ' + j.error);
    }catch(e){ showToast('Resumo não enviado ao WhatsApp (sem conexão).'); }
  }
  function destinoCancelHtml(d){
    if(!d) return '';
    const t = d.tipo==='credito' ? 'Virou crédito do cliente' : d.tipo==='pix' ? 'Devolvido por Pix (conta da loja)' : 'Devolvido em dinheiro (caixa)';
    return `<span class="sub">${t}</span>`;
  }
  function renderRelatorioCaixa(de, ate, lojaId, tipos){
    const dentroPeriodo = (s)=> !!s && s>=de && s<=ate;
    const lojaNomeFiltro = lojaId ? nomeLojaCaixa(lojaId) : '';

    let contasPagasBase = caixaGastos.filter(g=> g.pago && dentroPeriodo(g.dataPagamento));
    /* Caixa do dia = dinheiro que ENTROU no dia: cada pagamento conta na data em que foi recebido
       (pagamento incluído depois numa via "pagar depois" entra no caixa do dia em que foi lançado). */
    const recebidoNoPeriodo = v=> (v.pagamentos||[]).reduce((acc,p)=> acc + ((!p || FORMAS_NAO_DINHEIRO.includes(p.formaId)) ? 0 : (dentroPeriodo(String(p.data || (caixaOrdens.includes(v) ? dataLancamentoVia(v) : v.data) || '').slice(0,10)) ? CaixaCalc.valorEntrada(p) : 0)), 0);   // 06/11: mesma regra do caixa-calc.js (pedido sem data no pagamento = dia do lançamento; valor "1.234,50" lido certo)
    /* 05/11: no Pedido o campo "data" é a data de ENTREGA; a data do pedido é criadoEm. "Pago depois" = pagamento feito depois do dia em que a via foi lançada. */
    const dataLancamento = r=> (r && r.criadoEm) ? (dataDeTimestamp(Number(r.criadoEm)||r.criadoEm) || r.data) : r.data;
    let vendasRecBase = vendas.filter(v=> recebidoNoPeriodo(v) > 0);
    let osRecBase = caixaOrdens.filter(o=> recebidoNoPeriodo(o) > 0);
    let aReceberVendasBase = vendas.filter(v=> v.status==='ativa' && dentroPeriodo(v.data) && valorAReceberDe(v) > 0);
    let aReceberOSBase = caixaOrdens.filter(o=> o.status!=='cancelado' && o.status!=='entregue' && o.status!=='rascunho' && dentroPeriodo(o.data) && valorAReceberDe(o) > 0);
    let canceladasVendasBase = vendas.filter(v=> v.status==='cancelada' && dentroPeriodo(dataDeTimestamp(v.canceladoEm)));
    let canceladasOSBase = caixaOrdens.filter(o=> o.status==='cancelado' && dentroPeriodo(dataDeTimestamp(o.canceladoEm)));
    let trocasBase = [];
    vendas.forEach(v=> (v.trocas||[]).forEach(t=>{ if(dentroPeriodo(t.data)) trocasBase.push({...t, venda:v}); }));

    if(lojaId){
      contasPagasBase = contasPagasBase.filter(g=> lojaIdDoGasto(g) === lojaId);
      vendasRecBase = vendasRecBase.filter(v=> v.lojaId === lojaId);
      osRecBase = osRecBase.filter(o=> o.lojaId === lojaId);
      aReceberVendasBase = aReceberVendasBase.filter(v=> v.lojaId === lojaId);
      aReceberOSBase = aReceberOSBase.filter(o=> o.lojaId === lojaId);
      canceladasVendasBase = canceladasVendasBase.filter(v=> v.lojaId === lojaId);
      canceladasOSBase = canceladasOSBase.filter(o=> o.lojaId === lojaId);
      trocasBase = trocasBase.filter(t=> t.venda.lojaId === lojaId);
    }

    const grupos = {};
    function grupo(nome){ if(!grupos[nome]) grupos[nome] = { nome, vendasRec:[], osRec:[], gastos:[], canceladasV:[], canceladasO:[], trocas:[] }; return grupos[nome]; }
    vendasRecBase.forEach(v=> grupo(v.loja||'—').vendasRec.push(v));
    osRecBase.forEach(o=> grupo(nomeLojaCaixa(o.lojaId)||'—').osRec.push(o));
    contasPagasBase.forEach(g=>{ const lid = lojaIdDoGasto(g); grupo(lid ? (nomeLojaCaixa(lid)||'—') : '__geral__').gastos.push(g); });
    canceladasVendasBase.forEach(v=> grupo(v.loja||'—').canceladasV.push(v));
    canceladasOSBase.forEach(o=> grupo(nomeLojaCaixa(o.lojaId)||'—').canceladasO.push(o));
    trocasBase.forEach(t=> grupo(t.venda.loja||'—').trocas.push(t));

    function metricasGrupo(g){
      const contasPagas = g.gastos.reduce((a,x)=>a+(Number(x.valor)||0),0);
      const recVendas = g.vendasRec.reduce((a,x)=>a+recebidoNoPeriodo(x),0);
      const recOS = g.osRec.reduce((a,x)=>a+recebidoNoPeriodo(x),0);
      const saidaCanceladas = g.canceladasV.reduce((a,x)=>a+(Number(x.caixaSaidaCancelamento)||0),0) + g.canceladasO.reduce((a,x)=>a+(Number(x.caixaSaidaCancelamento)||0),0);
      const trocasDif = g.trocas.reduce((a,t)=>a+(Number(t.diferenca)||0),0);
      const saldo = recVendas + recOS + trocasDif - contasPagas - saidaCanceladas;
      return { contasPagas, recVendas, recOS, saidaCanceladas, trocasDif, saldo };
    }

    const nomesLoja = Object.keys(grupos).filter(n=>n!=='__geral__').sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const temGeral = !!grupos['__geral__'];

    /* Uma linha do quadro "Por loja" (destaque = linha de total, no rodapé da tabela). */
    function cardHtml(titulo, g, destaque){
      const m = metricasGrupo(g);
      const saldoHtml = m.saldo < 0 ? `<span class="val sai forte">${fmtMoeda(m.saldo)}</span>` : `<span class="val forte">${fmtMoeda(m.saldo)}</span>`;
      return `<tr>
        ${celula('Loja', destaque ? `<b>${escapeHtml(titulo)}</b>` : escapeHtml(titulo), 'principal')}
        ${celula('Vendas recebidas', vEntrada(m.recVendas), 'r')}
        ${celula('O.S. recebidas', vEntrada(m.recOS), 'r')}
        ${celula('Trocas (diferença)', vDiferenca(m.trocasDif), 'r')}
        ${celula('Contas pagas', vSaida(m.contasPagas), 'r')}
        ${celula('Cancelamentos', vSaida(m.saidaCanceladas), 'r')}
        ${celula('Saldo', saldoHtml, 'r')}
      </tr>`;
    }

    const resumoEl = document.getElementById('caixaResumo');
    if(resumoEl){
      let html = '';
      if(nomesLoja.length===0 && !temGeral){
        html = `<div class="card">${estadoHtml('busca', 'Nenhuma movimentação nesse período', 'Confira as datas e a loja. Se alguém acabou de lançar algo, clique em <b>Atualizar dados</b>.')}</div>`;
      } else {
        const consolidado = { vendasRec:[], osRec:[], gastos:[], canceladasV:[], canceladasO:[], trocas:[] };
        Object.values(grupos).forEach(g=>{
          ['vendasRec','osRec','gastos','canceladasV','canceladasO','trocas'].forEach(k=> consolidado[k].push(...g[k]));
        });
        // Saldo do período em destaque (entradas − saídas do consolidado)
        const mc = metricasGrupo(consolidado);
        const entradas = mc.recVendas + mc.recOS + Math.max(0, mc.trocasDif);
        const saidas = mc.contasPagas + mc.saidaCanceladas + Math.max(0, -mc.trocasDif);
        const periodoTxt = de === ate ? fmtDate(de) : `${fmtDate(de)} a ${fmtDate(ate)}`;
        html += `
          <section class="card saldo-card" aria-label="Saldo do período">
            <div>
              <div class="saldo-rot">Saldo do período</div>
              <div class="saldo-valor val${mc.saldo<0?' sai':''}">${fmtMoeda(mc.saldo)}</div>
              <div class="saldo-ctx">${periodoTxt} · ${escapeHtml(lojaNomeFiltro || 'Todas as lojas')}</div>
            </div>
            <dl class="saldo-conta">
              <dt>Entradas</dt><dd>${vEntrada(entradas)}</dd>
              <dt>Saídas</dt><dd>${vSaida(saidas)}</dd>
              <dt class="igual">Saldo</dt><dd class="igual val">${fmtMoeda(mc.saldo)}</dd>
            </dl>
          </section>`;
        let linhas = '';
        nomesLoja.forEach(nome=>{ linhas += cardHtml(nome, grupos[nome]); });
        if(temGeral) linhas += cardHtml('Despesas gerais (sem loja)', grupos['__geral__']);
        const varias = nomesLoja.length>1 || (nomesLoja.length===1 && temGeral);
        html += `
          <section class="card">
            <div class="card-head"><h2>${ic('loja')} Por loja</h2><span class="muted" style="font-size:12.5px;">Entradas com +, saídas com −</span></div>
            <div class="tabela-wrap">
              <table class="tabela cartoes">
                <thead><tr><th>Loja</th><th class="r">Vendas recebidas</th><th class="r">O.S. recebidas</th><th class="r">Trocas (diferença)</th><th class="r">Contas pagas</th><th class="r">Cancelamentos</th><th class="r">Saldo</th></tr></thead>
                <tbody>${linhas}</tbody>
                ${varias ? `<tfoot>${cardHtml('Total de todas as lojas', consolidado, true)}</tfoot>` : ''}
              </table>
            </div>
          </section>`;
        // 06/11: conferência — TODA entrada do período por forma de pagamento (ouro, pix, cartão, dinheiro, crédito…), dia a dia e via a via.
        // Sai da mesma conta do Fechar caixa (caixa-calc.js); se o total dos cartões acima não fechar com ela, avisa.
        const dPainel = dadosPainelCaixa(de, ate, lojaId);
        const difConf = (mc.recVendas + mc.recOS) - dPainel.recebido;
        const alertaConf = Math.abs(difConf) > 0.009
          ? `<div class="aviso-conf erro" role="alert"><b>Atenção:</b> o total de Vendas + O.S. recebidas (${fmtMoeda(mc.recVendas + mc.recOS)}) não bate com a soma das formas de pagamento (${fmtMoeda(dPainel.recebido)}). Diferença de ${fmtMoeda(Math.abs(difConf))}. Me avise com o período e a loja.</div>`
          : `<div class="aviso-conf ok">Conferido: Vendas + O.S. recebidas = soma de todas as formas de pagamento (${fmtMoeda(dPainel.recebido)}).</div>`;
        html += `
          <section class="card" aria-label="Todas as entradas por forma de pagamento">
            <div class="card-head"><h2>${ic('carteira')} Todas as entradas por forma de pagamento</h2><span class="muted" style="font-size:12.5px;">Cada pagamento conta no dia em que foi recebido</span></div>
            ${alertaConf}
            ${htmlPorDiaCaixa(dPainel)}
            ${htmlPainelCaixa(dPainel, !lojaId)}
          </section>`;
      }
      resumoEl.innerHTML = html;
      try{ ativarDicasPainel(); }catch(e){}
    }

    const det = document.getElementById('caixaDetalhes');
    if(!det) return;
    let html = '';
    const soma = (lista, fn)=> lista.reduce((a,x)=> a + (Number(fn(x))||0), 0);
    const selo = (txt, tipo)=> `<span class="selo selo-${tipo||'neutro'}">${escapeHtml(txt)}</span>`;
    /* 06/11: etiqueta mostra a situação ATUAL da via (depois de editada): Pago (nada a receber) ou Parcial (falta receber). */
    const seloPagamento = v=>{ const falta = valorAReceberDe(v); return falta > 0.009 ? selo('Parcial · falta '+fmtMoeda(falta),'wait') : selo('Pago','ok'); };
    if(tipos.includes('vendasRecebidas')){
      html += detalheSecao('Vendas recebidas', vendasRecBase, v=>`
        <tr${v.status==='cancelada'?' class="apagada"':''}>${celula('Cliente', `${escapeHtml(v.cliente||'—')}${v.status==='cancelada'?' '+selo('Cancelada depois','neutro'):''}`, 'principal')}${celula('Incluída em', fmtDate(dataInclusao(v)))}${celula('Data', fmtDate(v.data)+(v.status!=='cancelada'?' '+seloPagamento(v):''))}${celula('Loja', escapeHtml(v.loja))}${celula('Recebido', vEntrada(recebidoNoPeriodo(v)), 'r')}</tr>
      `, ['Cliente','Incluída em','Data','Loja','Recebido'], { icone:'carrinho', total: vEntrada(soma(vendasRecBase, recebidoNoPeriodo)) });
    }
    if(tipos.includes('osRecebidas')){
      html += detalheSecao('O.S. recebidas', osRecBase, o=>`
        <tr${o.status==='cancelado'?' class="apagada"':''}>${celula('Cliente', `${escapeHtml(o.cliente||'—')}${o.status==='cancelado'?' '+selo('Cancelada depois','neutro'):''}`, 'principal')}${celula('Incluída em', fmtDate(dataInclusao(o))+(o.status!=='cancelado'?' '+seloPagamento(o):''))}${celula('Agendada p/', o.data && o.data!==dataInclusao(o) ? fmtDate(o.data) : '—')}${celula('Loja', escapeHtml(nomeLojaCaixa(o.lojaId)))}${celula('Recebido', vEntrada(recebidoNoPeriodo(o)), 'r')}</tr>
      `, ['Cliente','Incluída em','Agendada p/','Loja','Recebido'], { icone:'recibo', total: vEntrada(soma(osRecBase, recebidoNoPeriodo)) });
    }
    if(tipos.includes('contasPagas')){
      html += detalheSecao('Contas pagas', contasPagasBase, g=>`
        <tr>${celula('Descrição', `${escapeHtml(g.nome)}<span class="sub">${escapeHtml(g.categoria||'Sem categoria')}</span>`, 'principal')}${celula('Incluída em', fmtDate(dataInclusao(g)))}${celula('Agendada p/', g.vencimento ? fmtDate(g.vencimento) : '—')}${celula('Pago em', fmtDate(g.dataPagamento))}${celula('Loja', escapeHtml(g.lojaId?(nomeLojaCaixa(g.lojaId)||'Geral'):'Geral'))}${celula('Valor', vSaida(g.valor), 'r')}</tr>
      `, ['Descrição','Incluída em','Agendada p/','Pago em','Loja','Valor'], { icone:'carteira', total: vSaida(soma(contasPagasBase, g=>g.valor)) });
    }
    if(tipos.includes('canceladas')){
      const canceladasTodas = [
        ...canceladasVendasBase.map(v=>({origem:'Venda', data:dataDeTimestamp(v.canceladoEm), loja:v.loja, cliente:v.cliente, motivo:v.motivoCancelamento, por:v.canceladoPor, valor:v.caixaSaidaCancelamento, destino:v.cancelamentoDestino})),
        ...canceladasOSBase.map(o=>({origem:'O.S.', data:dataDeTimestamp(o.canceladoEm), loja:nomeLojaCaixa(o.lojaId), cliente:o.cliente, motivo:o.motivoCancelamento, por:o.canceladoPor, valor:o.caixaSaidaCancelamento, destino:o.cancelamentoDestino})),
      ];
      html += detalheSecao('Canceladas', canceladasTodas, x=>`
        <tr>${celula('Cliente', `${escapeHtml(x.cliente||'—')}<span class="sub">${x.motivo?escapeHtml(x.motivo)+' · ':''}por ${escapeHtml(x.por||'—')}</span>`, 'principal')}${celula('Tipo', selo(x.origem))}${celula('Cancelada em', fmtDate(x.data))}${celula('Loja', escapeHtml(x.loja))}${celula('Saiu do caixa', vSaida(x.valor)+destinoCancelHtml(x.destino), 'r')}</tr>
      `, ['Cliente / motivo','Tipo','Cancelada em','Loja','Saiu do caixa'], { icone:'cancelar', total: vSaida(soma(canceladasTodas, x=>x.valor)) });
    }
    if(tipos.includes('trocas')){
      html += detalheSecao('Trocas', trocasBase, t=>`
        <tr>${celula('Cliente', `${escapeHtml(t.venda.cliente||'—')}<span class="sub">${escapeHtml(t.itemAntigoDescricao)} → ${escapeHtml(t.itemNovo.quantidade)}x ${escapeHtml(t.itemNovo.produto)}</span>`, 'principal')}${celula('Data', fmtDate(t.data))}${celula('Loja', escapeHtml(t.venda.loja))}${celula('Diferença', vDiferenca(t.diferenca), 'r')}</tr>
      `, ['Cliente / item antigo → novo','Data','Loja','Diferença'], { icone:'trocar', total: vDiferenca(soma(trocasBase, t=>t.diferenca)) });
    }
    if(tipos.includes('aReceber')){
      const aReceberTodos = [
        ...aReceberVendasBase.map(v=>({origem:'Venda', data:v.data, incl:dataInclusao(v), loja:v.loja, cliente:v.cliente, valor:valorAReceberDe(v)})),
        ...aReceberOSBase.map(o=>({origem:'O.S.', data:o.data, incl:dataInclusao(o), agend:(o.data && o.data!==dataInclusao(o) ? o.data : ''), loja:nomeLojaCaixa(o.lojaId), cliente:o.cliente, valor:valorAReceberDe(o)})),
      ];
      html += detalheSecao('A receber em aberto', aReceberTodos, x=>`
        <tr>${celula('Cliente', escapeHtml(x.cliente||'—'), 'principal')}${celula('Tipo', selo(x.origem))}${celula('Incluída em', fmtDate(x.incl||x.data))}${celula('Agendada p/', x.agend ? fmtDate(x.agend) : '—')}${celula('Loja', escapeHtml(x.loja))}${celula('Falta receber', `<span class="val" style="color:var(--wait);">${fmtMoeda(x.valor)}</span>`, 'r')}</tr>
      `, ['Cliente','Tipo','Incluída em','Agendada p/','Loja','Falta receber'], { icone:'relogio', nota:'Venda fechada ou O.S. aberta com saldo. Ainda não entrou no caixa.', total: `<span class="val" style="color:var(--wait);">${fmtMoeda(soma(aReceberTodos, x=>x.valor))}</span> <span class="muted" style="font-size:12.5px;">em aberto</span>` });
    }
    det.innerHTML = html || `<div class="card">${estadoHtml('filtro', 'Nenhum detalhe marcado', 'Marque ao menos um item em <b>Mostrar detalhes</b> e clique em Pesquisar.')}</div>`;
  }
  /* Seção recolhível de detalhes. extra (opcional): { icone, total (html), nota } */
  function detalheSecao(titulo, lista, linhaHtml, colunas, extra){
    extra = extra || {};
    const ultima = colunas.length - 1;
    return `
      <details class="card secao" ${lista.length>0 && lista.length<=15 ? 'open' : ''}>
        <summary>
          <h2>${extra.icone ? ic(extra.icone) : ''}${escapeHtml(titulo)}</h2>
          <span class="cnt" title="${lista.length} lançamento(s)">${lista.length}</span>
          ${extra.nota ? `<span class="muted" style="font-size:12.5px;">${escapeHtml(extra.nota)}</span>` : ''}
          <span class="total">${lista.length ? (extra.total||'') : ''}</span>
          <span class="seta">${ic('baixo')}</span>
        </summary>
        ${lista.length===0 ? `<div class="estado-mini">Nenhum lançamento no período.</div>` : `
        <div class="secao-corpo">
          <table class="tabela cartoes">
            <thead><tr>${colunas.map((c,i)=>`<th${i===ultima?' class="r"':''}>${escapeHtml(c)}</th>`).join('')}</tr></thead>
            <tbody>${lista.map(linhaHtml).join('')}</tbody>
          </table>
        </div>`}
      </details>
    `;
  }

  /* ================= LOGIN / MODO EMBUTIDO ================= */
  const EMBEDDED = window.self !== window.top;
  function atualizarFaixaLoja(){
    const faixa = document.getElementById('lojaFaixa');
    if(!faixa) return;
    if(window.__lojaAtual && window.__lojaAtual.nome){
      faixa.style.display = 'block';
      faixa.style.setProperty('--loja-cor', window.__lojaAtual.cor || '#1F6F8B');
      faixa.textContent = window.__lojaAtual.nome;
    } else {
      faixa.style.display = 'none';
    }
  }
  if(EMBEDDED){
    document.documentElement.classList.add('embedded');
    window.addEventListener('message', async (ev)=>{
    if(!mensagemConfiavel(ev)) return;
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === 'auth'){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user ? ev.data.user.senha : null;
        await carregarTudo();
        enterCaixa();
        parent.postMessage({ type:'tabs', modulo:'caixa', tabs: [], active: null }, '*');
      } else if(ev.data.type === 'lojaAtual'){
        window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
        atualizarFaixaLoja();
        // Não reconstrói o mainContent — apenas atualiza o select de loja se já estiver montado
        if(currentUser){
          const sel = document.getElementById('cx_loja');
          if(sel){
            const restringir = currentUser.nivel === 'vendedora' || currentUser.nivel === 'oficina';
            if(restringir && window.__lojaAtual && window.__lojaAtual.id){
              sel.value = window.__lojaAtual.id;
              sel.disabled = true;
            } else if(!restringir){
              sel.disabled = false;
            }
          }
        }
      }
    });
    parent.postMessage({ type:'ready', modulo:'caixa' }, '*');
  }

  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  async function doLogin(){
    const pass = document.getElementById('loginPass').value.trim();
    const err = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');
    if(!pass) return;
    err.classList.remove('show');
    btn.disabled = true;
    try{
      const r = await gatewayLogin(pass);
      if(!r || !r.ok){ err.classList.add('show'); return; }
      __gatewaySenha = pass;
      currentUser = { nome: r.user.nome, nivel: r.user.nivel };
      await carregarTudo();
      enterCaixa();
    }catch(e){
      console.error('erro no login do caixa', e);
      err.textContent = 'Não foi possível verificar a senha agora. Tente novamente.';
      err.classList.add('show');
    }finally{
      btn.disabled = false;
    }
  }
  document.getElementById('btnLogout').addEventListener('click', ()=>{
    currentUser = null;
    __gatewaySenha = null;
    document.getElementById('loginPass').value = '';
    document.getElementById('view-caixa').style.display = 'none';
    document.getElementById('view-login').style.display = 'flex';
  });
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
<script>
/* ===== Ordenar listas (crescente/decrescente) — clique no título da coluna ou use "Ordenar por" ===== */
(function(){
  var CSS = '.ord-bar{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;color:var(--ink-faint,#6b7280);flex-wrap:wrap}'+
    '.ord-bar select{height:32px;border:1px solid var(--line,#d1d5db);border-radius:8px;padding:0 8px;background:var(--surface,#fff);color:inherit;font:inherit}'+
    '.ord-bar button{height:32px;min-width:36px;border:1px solid var(--line,#d1d5db);border-radius:8px;background:var(--surface,#fff);color:inherit;cursor:pointer;font:inherit}'+
    'th.ord-th{cursor:pointer;user-select:none}th.ord-th .ord-seta{opacity:.35;margin-left:4px}th.ord-th.ord-on .ord-seta{opacity:1}';
  var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  function txt(td){ if(!td) return ''; var sel=td.querySelector('select'); var s = sel ? (sel.selectedOptions[0]?sel.selectedOptions[0].textContent:'') : td.textContent; return s.replace(/\s+/g,' ').trim(); }
  function parseVal(t){
    if(!t || t==='—' || t==='-') return {v:null};
    var d = t.match(/(\d{2})\/(\d{2})\/(\d{4})(?:\D{0,3}(\d{1,2}):(\d{2}))?/); if(d) return {v:+(d[3]+d[2]+d[1])*10000 + (d[4]?(+d[4])*100+(+d[5]):0), k:'d'};
    var m = t.match(/^([+\-−]?)\s*R\$\s*([+\-−]?)\s*([\d.]+(?:,\d+)?)/);
    if(m){ var n=parseFloat(m[3].replace(/\./g,'').replace(',','.')); if(/[-−]/.test(m[1]+m[2])) n=-n; return {v:n,k:'n'}; }
    if(/^[+\-−]?\d+([.,]\d+)?$/.test(t)) return {v:parseFloat(t.replace('−','-').replace(',','.')),k:'n'};
    return {v:t.toLowerCase(), k:'t'};
  }
  function ordenar(table, col, dir){
    var tb = table.tBodies[0]; if(!tb) return;
    var rows = Array.prototype.slice.call(tb.rows);
    var itens = rows.map(function(r,i){ return {r:r, i:i, p:parseVal(txt(r.cells[col]))}; });
    var tipos = itens.map(function(x){return x.p.k;}).filter(Boolean);
    var tipo = tipos.length && tipos.every(function(k){return k===tipos[0];}) ? tipos[0] : 't';
    itens.forEach(function(x){ if(x.p.v!==null && x.p.k!==tipo) x.p = {v:String(txt(x.r.cells[col])).toLowerCase(), k:'t'}; });
    itens.sort(function(a,b){
      if(a.p.v===null && b.p.v===null) return a.i-b.i;
      if(a.p.v===null) return 1; if(b.p.v===null) return -1;
      var c = tipo==='t' ? String(a.p.v).localeCompare(String(b.p.v),'pt-BR',{numeric:true}) : (a.p.v-b.p.v);
      return (dir==='desc' ? -c : c) || (a.i-b.i);
    });
    itens.forEach(function(x){ tb.appendChild(x.r); });
  }
  function marcar(table, col, dir){
    var ths = table.querySelectorAll('thead th');
    Array.prototype.forEach.call(ths, function(th,i){
      th.classList.toggle('ord-on', i===col);
      var s = th.querySelector('.ord-seta'); if(s) s.textContent = i===col ? (dir==='desc'?'▼':'▲') : '↕';
    });
    var bar = table.__ordBar;
    if(bar){ bar.querySelector('select').value = String(col); bar.querySelector('button').textContent = dir==='desc'?'▼':'▲'; bar.querySelector('button').title = dir==='desc'?'Decrescente':'Crescente'; }
  }
  function ativar(table){
    if(table.dataset.ord || table.hasAttribute('data-nosort')) return;
    var ths = table.querySelectorAll('thead th'); var tb = table.tBodies[0];
    if(!ths.length || !tb || tb.rows.length<2) return;
    if(table.classList.contains('tabela-kv') || table.closest('#modalOverlay,#modalBox,.modal,.modal-overlay,[role="dialog"]') || table.querySelector('tbody input,tbody textarea') || (table.querySelector('tbody select') && !table.classList.contains('tabela-os'))) return;
    for(var k=0;k<tb.rows.length;k++){ if(tb.rows[k].cells.length!==ths.length || tb.rows[k].querySelector('[colspan]')) return; }
    table.dataset.ord = '1';
    var estado = {col:-1, dir:'asc'};
    function aplicar(col, dir){ estado.col=col; estado.dir=dir; ordenar(table,col,dir); marcar(table,col,dir); }
    var opts = '';
    Array.prototype.forEach.call(ths, function(th,i){
      var nome = th.textContent.trim(); if(!nome || th.querySelector('.sr-only')) return;
      th.classList.add('ord-th'); th.setAttribute('title','Clique para ordenar');
      var s = document.createElement('span'); s.className='ord-seta'; s.textContent='↕'; th.appendChild(s);
      th.addEventListener('click', function(){ aplicar(i, (estado.col===i && estado.dir==='asc') ? 'desc' : 'asc'); });
      opts += '<option value="'+i+'">'+nome.replace(/</g,'&lt;')+'</option>';
    });
    var bar = document.createElement('div'); bar.className='ord-bar';
    bar.innerHTML = '<span>Ordenar por</span><select aria-label="Ordenar por">'+opts+'</select><button type="button" aria-label="Inverter ordem" title="Crescente">▲</button>';
    bar.querySelector('select').value = '-1';
    bar.querySelector('select').selectedIndex = -1;
    bar.querySelector('select').addEventListener('change', function(e){ aplicar(+e.target.value, estado.dir); });
    bar.querySelector('button').addEventListener('click', function(){
      if(estado.col<0){ var sel=bar.querySelector('select'); estado.col = +(sel.options[0] && sel.options[0].value) || 0; }
      aplicar(estado.col, estado.dir==='asc'?'desc':'asc');
    });
    table.__ordBar = bar;
    var alvo = table.parentNode && table.parentNode.style && table.parentNode.style.overflowX ? table.parentNode : table;
    alvo.parentNode.insertBefore(bar, alvo);
  }
  var agendado = false;
  function varrer(){ agendado=false; Array.prototype.forEach.call(document.querySelectorAll('table'), ativar); }
  new MutationObserver(function(){ if(!agendado){ agendado=true; setTimeout(varrer, 80); } }).observe(document.body, {childList:true, subtree:true});
  varrer();
})();
</script>
