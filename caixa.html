<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* ===== Linguagem visual das telas financeiras do CAIXA (igual em caixa.html, gastos.html e conciliacao.html) ===== */
:root{ --radius:12px; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--t-font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px;}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 2px;line-height:1.25;}
.page-sub{font-size:13px;color:var(--ink-faint);margin:0;max-width:640px;}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.muted{color:var(--ink-faint);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* botões (cores vêm do tema.css) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;font-size:13.5px;line-height:1.3;white-space:nowrap;}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.btn .ico{width:15px;height:15px;}

/* barra de filtros: período, loja e ações numa faixa só */
.barra{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;box-shadow:var(--t-shadow-sm);}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0;}
.campo > label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.campo input,.campo select{height:36px;padding:0 10px;font-size:13.5px;min-width:0;}
.campo.busca{flex:1 1 220px;}
.barra .acoes{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.barra .btn{height:36px;}
.barra-linha{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-top:10px;border-top:1px solid var(--line);}
.barra-linha .rot{font-size:12px;font-weight:600;color:var(--ink-soft);margin-right:4px;}

/* chips de liga/desliga (checkbox dentro) */
.chip-check{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);cursor:pointer;user-select:none;}
.chip-check input{margin:0;width:15px;height:15px;}
.chip-check:has(input:checked){background:var(--accent-soft);border-color:var(--t-primary-line);color:var(--accent);}

/* cartões e seções */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--t-shadow-sm);margin-bottom:16px;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);}
.card-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.card-head h2 .ico{color:var(--accent);}
.card-body{padding:14px 16px;}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}

/* valores: entrada em verde com "+", saída em vermelho com "−", zero apagado */
.val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.val.entra{color:var(--ok);}
.val.sai{color:var(--danger);}
.val.zero{color:var(--ink-faint);font-weight:500;}
.val.forte{font-weight:700;}
.r{text-align:right;}

/* tabelas (no celular viram cartões: .tabela.cartoes + data-label em cada td) */
.tabela-wrap{overflow-x:auto;}
table.tabela{width:100%;border-collapse:collapse;font-size:13px;}
.tabela th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
.tabela td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tabela tbody tr:last-child td{border-bottom:none;}
.tabela :is(th,td).r{text-align:right;}
.tabela tfoot td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:none;background:var(--surface-2);}
.tabela .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px;}
.tabela tr.apagada td{color:var(--ink-faint);}
.acoes-linha{display:flex;gap:2px;justify-content:flex-end;}

/* selos de status */
.selo{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px;}
.selo .ico{width:13px;height:13px;}
.selo-ok{background:var(--ok-soft);color:var(--ok);}
.selo-wait{background:var(--wait-soft);color:var(--wait);}
.selo-danger{background:var(--danger-soft);color:var(--danger);}
.selo-info{background:var(--t-info-soft);color:var(--info);}
.selo-neutro{background:var(--surface-2);color:var(--ink-soft);}
.selo .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* estados: vazio, carregando, erro */
.estado{padding:36px 20px;text-align:center;color:var(--ink-faint);}
.estado-ico{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);margin-bottom:10px;}
.estado-ico .ico{width:22px;height:22px;}
.estado .t{display:block;font-size:16px;color:var(--ink);font-weight:700;margin-bottom:4px;}
.estado p{margin:0 auto;max-width:460px;font-size:13.5px;line-height:1.5;}
.estado-erro .estado-ico{background:var(--danger-soft);color:var(--danger);}
.estado-mini{padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* alertas de contas (vencidas / vencendo) */
.alerta{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--t-shadow-sm);}
.alerta-head{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;font-weight:700;}
.alerta-head .ico{width:18px;height:18px;}
.alerta-head .total{margin-left:auto;}
.alerta-danger .alerta-head{background:var(--danger-soft);color:var(--danger);}
.alerta-wait .alerta-head{background:var(--wait-soft);color:var(--wait);}
.alerta-item{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:13.5px;}
.alerta-item .nome{flex:1 1 200px;min-width:0;}
.alerta-item .nome b{font-weight:600;}
.alerta-mais{padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);}

/* campos de formulário (popups) */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0;}
.field > label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field input,.field select,.field textarea{padding:8px 11px;font-size:14px;width:100%;}
html[data-ds] .field input[readonly]{background:var(--surface-2);color:var(--ink-soft);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

/* popups */
.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:200;padding:16px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
:is(.modal,.modal-box){width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:22px 24px;}
:is(.modal,.modal-box) h3{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.01em;padding-right:24px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

@media (prefers-reduced-motion:no-preference){ .esq{animation:pulsar 1.2s ease-in-out infinite;} @keyframes pulsar{50%{opacity:.5;}} }

/* celular */
@media (max-width:760px){
  .wrap{padding:14px 12px 48px;}
  .page-head{align-items:stretch;}
  .page-actions{width:100%;}
  .page-actions > .btn-accent{flex:1 1 auto;}
  .barra{padding:12px;}
  .barra .campo{flex:1 1 calc(50% - 6px);}
  .barra .campo.busca{flex-basis:100%;}
  .barra .acoes{margin-left:0;width:100%;}
  .barra .acoes .btn{flex:1 1 auto;}
  .barra .btn{height:44px;}
  .campo input,.campo select{height:44px;}
  .grid-2{grid-template-columns:minmax(0,1fr);}
  .tabela.cartoes thead{display:none;}
  .tabela.cartoes, .tabela.cartoes :is(tbody,tfoot,tr,td){display:block;width:100%;}
  .tabela.cartoes tr{padding:10px 14px;border-bottom:1px solid var(--line);}
  .tabela.cartoes tbody tr:last-child{border-bottom:none;}
  .tabela.cartoes td{border:none;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;background:transparent;}
  .tabela.cartoes td::before{content:attr(data-label);font-size:12.5px;color:var(--ink-faint);font-weight:500;text-align:left;flex-shrink:0;}
  .tabela.cartoes td.principal{display:block;text-align:left;font-size:14px;padding-bottom:4px;}
  .tabela.cartoes td.principal::before{display:none;}
  .tabela.cartoes td:is(:empty,.vazio-cel){display:none;}
  .tabela.cartoes tfoot tr{background:var(--surface-2);border-top:1px solid var(--line-strong);}
  .tabela.cartoes .acoes-linha{justify-content:flex-start;}
  .tabela.cartoes td.acoes-td{justify-content:flex-end;padding-top:6px;}
  .tabela.cartoes td.acoes-td::before{display:none;}
}

/* ===== Resumo do caixa ===== */
.saldo-card{padding:18px 20px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;}
.saldo-rot{font-size:13px;font-weight:600;color:var(--ink-soft);}
.saldo-valor{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 4px;color:var(--ink);}
.saldo-valor.sai{color:var(--danger);}
.saldo-ctx{font-size:12.5px;color:var(--ink-faint);}
.saldo-conta{display:grid;grid-template-columns:auto auto;gap:4px 20px;margin:0;font-size:14px;align-items:baseline;}
.saldo-conta dt{color:var(--ink-soft);}
.saldo-conta dd{margin:0;text-align:right;font-size:16px;}
.saldo-conta .igual{border-top:1px solid var(--line-strong);padding-top:4px;font-weight:700;color:var(--ink);}
.secao > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 16px;}
.secao > summary::-webkit-details-marker{display:none;}
.secao > summary h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.secao > summary h2 .ico{color:var(--accent);}
.secao > summary .seta{color:var(--ink-faint);transition:transform .16s var(--t-ease);}
.secao[open] > summary .seta{transform:rotate(180deg);}
.secao > summary .total{margin-left:auto;font-size:14px;}
.secao > summary:hover{background:var(--surface-2);}
.secao[open] > summary{border-bottom:1px solid var(--line);}
.secao-corpo{overflow-x:auto;}

/* login (só fora do app) */
#view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--t-shadow);}
.login-tag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin:12px 0 6px;}
.login-title{font-size:20px;font-weight:700;margin:0 0 4px;}
.login-sub{color:var(--ink-faint);font-size:13px;margin:0 0 18px;}
.login-error{background:var(--danger-soft);color:var(--danger);font-size:13px;padding:9px 11px;border-radius:8px;margin-bottom:12px;display:none;}
.login-error.show{display:block;}
.hub-back-link{color:var(--ink-faint);text-decoration:none;font-size:13px;font-weight:600;}
.hub-back-link:hover{color:var(--ink);}
#btnLogin{width:100%;}
#view-caixa{display:none;}
header.topbar{background:var(--t-dark);color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;}
header.topbar .hub-back-link{color:rgba(255,255,255,.75);}
.who{font-size:13px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:10px;}
.level-pill{font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px;}
html.embedded #view-login{display:none !important;}
html.embedded header.topbar{display:none !important;}

@media (max-width:760px){
  .saldo-card{padding:16px;}
  .saldo-valor{font-size:26px;}
  .saldo-conta{width:100%;}
  .secao > summary .total{margin-left:0;width:100%;}
  .secao > summary{position:relative;padding-right:44px;}
  .secao > summary .seta{position:absolute;right:16px;top:14px;}
  .barra .campo{max-width:none !important;}
}
</style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <a href="index.html" class="hub-back-link">← Gestão e Controle</a>
    <div class="login-tag">CAIXA</div>
    <div class="login-title">Entrar no Resumo do caixa</div>
    <p class="login-sub">Use a mesma senha do resto do sistema.</p>
    <div class="login-error" id="loginError">Senha não encontrada. Confira e tente de novo.</div>
    <div class="field"><label for="loginPass">Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    <button class="btn btn-accent" id="btnLogin">Entrar</button>
  </div>
</div>

<div id="view-caixa">
  <header class="topbar">
    <a href="index.html" class="hub-back-link" title="Voltar para Gestão e Controle" aria-label="Voltar para Gestão e Controle">←</a>
    <div class="who">
      <span id="whoName"></span>
      <span class="level-pill" id="whoLevel"></span>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Sair</button>
    </div>
  </header>
  <div id="lojaFaixa" style="display:none;"></div>
  <main id="mainContent" class="wrap"></main>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const GATEWAY_URL = SUPABASE_URL + "/functions/v1/db-gateway";

  let __gatewaySenha = null;
  async function gatewayCall(body){
    try{
      const res = await fetch(GATEWAY_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization":"Bearer "+SUPABASE_ANON_KEY },
        body: JSON.stringify({ senha: __gatewaySenha, ...body }),
      });
      return await res.json();
    }catch(e){
      console.error("erro ao falar com o servidor", e);
      return { error: "Não foi possível conectar. Verifique sua internet." };
    }
  }
  async function gatewayLogin(senhaTentativa){
    return gatewayCall({ op:"login", senha: senhaTentativa });
  }
  const supabaseClient = {
    from(table){
      return {
        select(){
          return {
            eq(column, value){
              return {
                maybeSingle: async ()=>{
                  if(table === "gestao_config" && column === "id" && value === "config"){
                    const r = await gatewayCall({ op:"getConfig" });
                    if(r.error) return { data:null, error:r.error };
                    return { data: { payload: r.data }, error: null };
                  }
                  return gatewayCall({ op:"selectOne", table, params:{ column, value } });
                }
              };
            },
            order(){ return gatewayCall({ op:"selectAll", table }); }
          };
        },
      };
    }
  };

  let currentUser = null; // { nome, nivel }
  let config = null;
  let vendas = [];
  let caixaGastos = [];
  let caixaOrdens = [];

  function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtDate(s){ if(!s) return "—"; const p=(s||"").split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
  function fmtMoeda(v){ return window.Fmt ? Fmt.brl(v) : "R$ " + (Number(v)||0).toFixed(2).replace(".", ","); }
  /* ---- apresentação dos valores: entrada verde com "+", saída vermelha com "−", zero apagado ---- */
  function ic(nome){ return window.Icone ? Icone(nome) : ''; }
  function vEntrada(v){ v = Number(v)||0; return v ? `<span class="val entra">+${fmtMoeda(v)}</span>` : `<span class="val zero">${fmtMoeda(0)}</span>`; }
  function vSaida(v){ v = Math.abs(Number(v)||0); return v ? `<span class="val sai">−${fmtMoeda(v)}</span>` : `<span class="val zero">${fmtMoeda(0)}</span>`; }
  function vDiferenca(v){ v = Number(v)||0; return v >= 0 ? vEntrada(v) : vSaida(v); }
  function celula(rotulo, html, cls){ return `<td data-label="${escapeHtml(rotulo)}"${cls?` class="${cls}"`:''}>${html}</td>`; }
  function estadoHtml(icone, titulo, texto, extraCls){
    return `<div class="estado${extraCls?' '+extraCls:''}"><span class="estado-ico">${ic(icone)}</span><span class="t">${titulo}</span><p>${texto}</p></div>`;
  }
  function hoje(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  /* Fiado e crédito não entram como "recebido": fiado só entra quando as parcelas são
     recebidas; crédito entrou no caixa na recarga (não de novo no uso). */
  function valorRecebidoDe(v){ return (v.pagamentos||[]).reduce((acc,p)=> acc + ((p.formaId==='__fiado'||p.formaId==='__credito') ? 0 : (Number(p.valor)||0)), 0); }
  function valorAReceberDe(v){ return Math.max(0, (Number(v.valorTotal)||0) - valorRecebidoDe(v)); }
  function lojaOptionsHtml(selected){
    return (config.lojas||[]).filter(l=>!l.interna).map(l=>`<option value="${l.id}" ${selected===l.id?'selected':''}>${escapeHtml(l.nome)} (${escapeHtml(l.abreviacao)})</option>`).join('');
  }
  function nomeLojaCaixa(valor){
    if(!valor) return '';
    const porId = (config.lojas||[]).find(l=>l.id===valor);
    return porId ? porId.nome : valor;
  }
  function dataDeTimestamp(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function showToast(msg){
    let el = document.getElementById('toastBox');
    if(!el){ el = document.createElement('div'); el.id='toastBox'; el.className='toast'; el.setAttribute('role','status'); el.style.cssText='position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--t-text); color:var(--t-surface); padding:11px 18px; border-radius:10px; font-size:13.5px; z-index:100; box-shadow:var(--t-shadow-lg); max-width:calc(100vw - 32px);'; document.body.appendChild(el); }
    el.textContent = msg; el.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>{ el.style.display='none'; }, 3200);
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('modalBox').innerHTML='';
  }
  function openModal(html){
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('show');
  }

  /* ================= CARREGAMENTO ================= */
  async function carregarConfig(){
    const r = await gatewayCall({ op:'getConfig' });
    config = (r && r.data) ? r.data : { lojas:[] };
  }
  async function carregarTudo(forcar){
    await carregarConfig();
    try{
      const r = await gatewayCall({ op:'selectAll', table:'vendas_pdv' });
      if(r && r.error) throw new Error(r.error);
      vendas = ((r && r.data) || []).map(row=>row.payload);
    }catch(e){ console.error('erro ao carregar vendas p/ caixa', e); vendas = []; }
    try{
      const r = await gatewayCall({ op:'selectAll', table:'gastos' });
      if(r && r.error) throw new Error(r.error);
      caixaGastos = ((r && r.data) || []).map(row=>row.payload);
    }catch(e){ console.error('erro ao carregar gastos p/ caixa', e); caixaGastos = []; }
    try{
      const r = await gatewayCall({ op:'selectAll', table:'ordens_servico' });
      if(r && r.error) throw new Error(r.error);
      caixaOrdens = ((r && r.data) || []).map(row=>row.payload);
    }catch(e){ console.error('erro ao carregar O.S. p/ caixa', e); caixaOrdens = []; }
  }

  /* ================= TELA PRINCIPAL ================= */
  function enterCaixa(){
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-caixa').style.display = 'block';
    document.getElementById('whoName').innerHTML = `<b>${escapeHtml(currentUser.nome)}</b>`;
    document.getElementById('whoLevel').textContent = currentUser.nivel==='diretoria'?'Diretoria':currentUser.nivel==='gerente'?'Gerente':currentUser.nivel==='oficina'?'Oficina':'Vendedora';
    montarCaixaConteudo(document.getElementById('mainContent'));
  }
  function montarCaixaConteudo(wrap){
    const hj = hoje();
    wrap.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">Resumo do caixa</h1>
          <p class="page-sub">O que entrou e saiu do caixa no período: vendas e O.S. recebidas, contas pagas, cancelamentos e trocas.</p>
        </div>
      </div>
      <div class="barra" role="search">
        <div class="campo"><label for="cx_de">De</label><input type="date" id="cx_de" value="${hj}"></div>
        <div class="campo"><label for="cx_ate">Até</label><input type="date" id="cx_ate" value="${hj}"></div>
        <div class="campo" style="flex:1 1 200px; max-width:280px;"><label for="cx_loja">Loja</label><select id="cx_loja"><option value="">Todas as lojas</option>${lojaOptionsHtml('')}</select></div>
        <div class="acoes">
          <button class="btn btn-ghost" id="cx_hoje" title="Mostrar só o dia de hoje">${ic('calendario')} Hoje</button>
          <button class="btn btn-ghost" id="cx_atualizar" title="Buscar de novo no servidor (se alguém lançou algo agora)">${ic('atualizar')} Atualizar dados</button>
          <button class="btn btn-accent" id="cx_pesquisar">${ic('busca')} Pesquisar</button>
          <button class="btn btn-ghost" id="cx_fechar" title="Pendências de nota fiscal do período e da loja escolhidos">${ic('check')} Fechar caixa</button>
        </div>
        <div class="barra-linha" role="group" aria-label="O que mostrar">
          <span class="rot">Mostrar</span>
          <label class="chip-check"><input type="radio" name="cx_visao" value="resumo" checked> Resumo</label>
          <label class="chip-check"><input type="radio" name="cx_visao" value="semnota"> Sem nota</label>
          <label class="chip-check"><input type="radio" name="cx_visao" value="comnota"> Com nota</label>
        </div>
        <div class="barra-linha" role="group" aria-label="Detalhes a mostrar">
          <span class="rot">Mostrar detalhes</span>
          <label class="chip-check"><input type="checkbox" class="cx_tipo" value="vendasRecebidas" checked> Vendas recebidas</label>
          <label class="chip-check"><input type="checkbox" class="cx_tipo" value="osRecebidas" checked> O.S. recebidas</label>
          <label class="chip-check"><input type="checkbox" class="cx_tipo" value="contasPagas" checked> Contas pagas</label>
          <label class="chip-check"><input type="checkbox" class="cx_tipo" value="canceladas" checked> Canceladas</label>
          <label class="chip-check"><input type="checkbox" class="cx_tipo" value="trocas" checked> Trocas</label>
          <label class="chip-check"><input type="checkbox" class="cx_tipo" value="aReceber" checked> A receber em aberto</label>
        </div>
      </div>
      <div id="caixaResumo"><div class="card">${estadoHtml('calendario', 'Escolha o período e clique em Pesquisar', 'O resumo mostra o saldo do período por loja e, abaixo, cada venda, O.S., conta paga, cancelamento e troca.')}</div></div>
      <div id="caixaDetalhes"></div>
    `;
    const elDe = wrap.querySelector('#cx_de');
    const elAte = wrap.querySelector('#cx_ate');
    const elLoja = wrap.querySelector('#cx_loja');
    const tipos = ()=> [...wrap.querySelectorAll('.cx_tipo')].filter(c=>c.checked).map(c=>c.value);

    const visao = ()=> (wrap.querySelector('input[name="cx_visao"]:checked')||{value:'resumo'}).value;
    function render(){
      const v = visao();
      const det = wrap.querySelector('.barra-linha[aria-label="Detalhes a mostrar"]'); if(det) det.style.display = v==='resumo' ? '' : 'none';
      if(v==='resumo') renderRelatorioCaixa(elDe.value, elAte.value, elLoja.value, tipos());
      else renderNotas(v, elDe.value, elAte.value, elLoja.value);
    }
    wrap.querySelector('#cx_fechar').addEventListener('click', ()=> abrirFecharCaixa(elDe.value, elAte.value, elLoja.value));
    // Filtros NÃO disparam render automaticamente — lista só carrega via Pesquisar ou Hoje
    wrap.querySelector('#cx_pesquisar').addEventListener('click', render);
    wrap.querySelector('#cx_hoje').addEventListener('click', ()=>{ elDe.value = hoje(); elAte.value = hoje(); render(); });
    wrap.querySelector('#cx_atualizar').addEventListener('click', async ()=>{
      const btn = wrap.querySelector('#cx_atualizar');
      const rotulo = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = ic('atualizar') + ' Atualizando…';
      try{ await carregarTudo(true); }
      finally{ btn.disabled = false; btn.innerHTML = rotulo; }
      showToast('Dados do caixa atualizados.');
      render();
    });
    const restringirPorLojaAtiva = currentUser && (currentUser.nivel==='vendedora' || currentUser.nivel==='oficina');
    if(restringirPorLojaAtiva && window.__lojaAtual && window.__lojaAtual.id){
      elLoja.value = window.__lojaAtual.id;
      elLoja.disabled = true;
      elLoja.title = 'Filtrando pela loja ativa — pra ver outra loja, troque em "Loja" no menu.';
    }
    // NÃO chama render() automaticamente — lista só carrega via Pesquisar
  }

  /* ================= NOTAS FISCAIS (Sem nota / Com nota) E FECHAR CAIXA ================= */
  function nomeForma(p){ if(!p || !p.formaId) return ''; if(String(p.formaId).startsWith('__')) return ''; const f=(config.formasPagamento||[]).find(x=>x.id===p.formaId); return (f&&f.nome) || p.tipoNome || p.tipo || ''; }
  // Pix de pessoa física (PF) não obriga nota fiscal; Pix PJ (ou sem PF/PJ marcado) e cartão obrigam.
  function pagouPixOuCartao(r){ return (r.pagamentos||[]).some(p=>{ if((Number(p.valor)||0)<=0) return false; const n=nomeForma(p); if(/pix/i.test(n)) return p.pessoa!=='PF'; return /cart|d[eé]bito|cr[eé]dito|maquin/i.test(n); }); }
  function registrosFiscais(de, ate, lojaId){
    const dentro = s=> !!s && s>=de && s<=ate;
    const v = vendas.filter(x=> x.status!=='cancelada' && dentro(x.data) && (!lojaId || x.lojaId===lojaId)).map(x=>({ origem:'Venda', tabela:'vendas_pdv', reg:x }));
    const o = caixaOrdens.filter(x=> x.status!=='cancelado' && x.status!=='rascunho' && dentro(x.data) && (!lojaId || x.lojaId===lojaId)).map(x=>({ origem:'Pedido', tabela:'ordens_servico', reg:x }));
    return v.concat(o).sort((a,b)=> (b.reg.data||'').localeCompare(a.reg.data||''));
  }
  const viaDe = r => r.codigoVia || r.via || '—';
  function renderNotas(visao, de, ate, lojaId){
    const com = visao==='comnota';
    const todos = registrosFiscais(de, ate, lojaId);
    const lista = todos.filter(x=> com ? x.reg.emissaoNota==='sim' : x.reg.emissaoNota!=='sim');
    const total = lista.reduce((s,x)=> s + (Number(x.reg.valorTotal)||0), 0);
    const semNumero = lista.filter(x=> com && !String(x.reg.numeroNota||'').trim()).length;
    const box = document.getElementById('caixaResumo'); document.getElementById('caixaDetalhes').innerHTML = '';
    box.innerHTML = `<div class="card">
      <div class="section-label" style="margin-bottom:8px;">${com?'Com nota fiscal':'Sem nota fiscal'} · ${lista.length} ${lista.length===1?'registro':'registros'} · ${fmtMoeda(total)}${semNumero?` · <span style="color:var(--danger);font-weight:600;">${semNumero} sem número da nota</span>`:''}</div>
      ${lista.length===0 ? estadoHtml('check', com?'Nenhuma venda ou pedido com nota':'Nenhuma venda ou pedido sem nota', 'Nada neste período e loja.') : `
      <div style="overflow-x:auto;"><table class="tabela-cartoes"><thead><tr><th>Origem</th><th>Data</th><th>Via</th><th>Loja</th><th>Cliente</th>${com?'<th>Nota nº</th>':''}<th class="r">Valor</th><th></th></tr></thead><tbody>
      ${lista.map((x,i)=>{ const r=x.reg; return `<tr>
        ${celula('Origem', escapeHtml(x.origem))}${celula('Data', fmtDate(r.data))}${celula('Via', escapeHtml(viaDe(r)))}${celula('Loja', escapeHtml(nomeLojaCaixa(r.lojaId)||'—'))}${celula('Cliente', escapeHtml(r.cliente||'—'))}
        ${com ? celula('Nota nº', r.numeroNota ? escapeHtml(r.numeroNota) : '<span style="color:var(--danger);font-weight:600;">falta o número</span>') : ''}
        ${celula('Valor', fmtMoeda(r.valorTotal), 'r')}
        <td><button class="btn btn-ghost btn-sm" data-nota="${i}" type="button">${com ? (r.numeroNota?'Editar nº':'Informar nº') : 'Nota emitida'}</button></td></tr>`; }).join('')}
      </tbody></table></div>`}
    </div>`;
    box.querySelectorAll('[data-nota]').forEach(b=> b.addEventListener('click', ()=> abrirNotaEmitida(lista[+b.dataset.nota], ()=> renderNotas(visao, de, ate, lojaId))));
  }
  function abrirNotaEmitida(x, aoSalvar){
    const r = x.reg;
    openModal(`<h3>Nota fiscal · ${escapeHtml(x.origem)} ${escapeHtml(viaDe(r))}</h3>
      <p class="muted">${fmtDate(r.data)} · ${fmtMoeda(r.valorTotal)} · ${escapeHtml(r.cliente||'')}</p>
      <div class="field" style="margin-top:12px;"><label for="nf_numero">Número da nota fiscal</label><input id="nf_numero" autocomplete="off" placeholder="Ex.: 12345" value="${escapeHtml(r.numeroNota||'')}"></div>
      <div class="field"><label for="nf_loja">Empresa que emitiu</label><select id="nf_loja">${(config.lojas||[]).filter(l=>!l.interna).map(l=>`<option value="${l.id}" ${(r.lojaNotaId||r.lojaId)===l.id?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select></div>
      <div class="modal-actions"><button class="btn btn-ghost" id="nf_cancel" type="button">Cancelar</button><button class="btn btn-accent" id="nf_ok" type="button">Registrar nota</button></div>`);
    document.getElementById('nf_cancel').addEventListener('click', closeModal);
    document.getElementById('nf_ok').addEventListener('click', async ()=>{
      const numero = document.getElementById('nf_numero').value.trim();
      if(!numero){ showToast('Digite o número da nota fiscal.'); return; }
      const copia = { ...r, emissaoNota:'sim', numeroNota:numero, lojaNotaId: document.getElementById('nf_loja').value, notaRegularizadaEm: new Date().toISOString(), notaRegularizadaPor: currentUser ? currentUser.nome : '' };
      const res = await gatewayCall({ op:'upsert', table:x.tabela, params:{ row:{ id:r.id, payload:copia, updated_at:new Date().toISOString() } } });
      if(res && res.error){ showToast('Não foi possível salvar: ' + res.error); return; }
      Object.assign(r, copia);   // passa para a lista "Com nota" sozinho
      closeModal(); showToast('Nota registrada.'); if(aoSalvar) aoSalvar();
    });
  }
  function abrirFecharCaixa(de, ate, lojaId){
    const todos = registrosFiscais(de, ate, lojaId);
    const emitir = todos.filter(x=> x.reg.emissaoNota!=='sim' && pagouPixOuCartao(x.reg));
    const faltaNum = todos.filter(x=> x.reg.emissaoNota==='sim' && !String(x.reg.numeroNota||'').trim());
    const linha = (x,motivo,i,grupo)=>`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;">
      <div><b>${escapeHtml(x.origem)} ${escapeHtml(viaDe(x.reg))}</b> · ${fmtDate(x.reg.data)} · ${escapeHtml(nomeLojaCaixa(x.reg.lojaId)||'')}<div class="muted" style="font-size:12.5px;">${escapeHtml(x.reg.cliente||'')} · ${fmtMoeda(x.reg.valorTotal)}${motivo?' · '+motivo:''}</div></div>
      <button class="btn btn-ghost btn-sm" data-fc="${grupo}:${i}" type="button">${grupo==='e'?'Nota emitida':'Informar nº'}</button></div>`;
    const periodo = de===ate ? fmtDate(de) : fmtDate(de)+' a '+fmtDate(ate);
    openModal(`<h3>Fechar caixa · ${periodo}${lojaId?' · '+escapeHtml(nomeLojaCaixa(lojaId)):''}</h3>
      ${(!emitir.length && !faltaNum.length) ? `<div style="padding:14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin:10px 0;">Nenhuma pendência de nota fiscal. Caixa pronto para fechar.</div>` : ''}
      ${emitir.length ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--danger-soft);"><div style="font-weight:700;color:var(--danger);margin-bottom:4px;">Emitir nota fiscal — ${emitir.length} em Pix/cartão sem nota</div>${emitir.map((x,i)=>linha(x,'pago em Pix/cartão',i,'e')).join('')}</div>` : ''}
      ${faltaNum.length ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--wait-soft);"><div style="font-weight:700;color:var(--wait);margin-bottom:4px;">Falta o número da nota — ${faltaNum.length} marcado(s) com nota</div>${faltaNum.map((x,i)=>linha(x,'marcado com nota, sem número',i,'n')).join('')}</div>` : ''}
      <div class="modal-actions"><button class="btn" id="fc_fechar" type="button">Fechar</button></div>`);
    document.getElementById('fc_fechar').addEventListener('click', closeModal);
    document.querySelectorAll('[data-fc]').forEach(b=> b.addEventListener('click', ()=>{ const [g,i]=b.dataset.fc.split(':'); const x=(g==='e'?emitir:faltaNum)[+i]; abrirNotaEmitida(x, ()=> abrirFecharCaixa(de, ate, lojaId)); }));
  }
  function renderRelatorioCaixa(de, ate, lojaId, tipos){
    const dentroPeriodo = (s)=> !!s && s>=de && s<=ate;
    const lojaNomeFiltro = lojaId ? nomeLojaCaixa(lojaId) : '';

    let contasPagasBase = caixaGastos.filter(g=> g.pago && dentroPeriodo(g.dataPagamento));
    let vendasRecBase = vendas.filter(v=> dentroPeriodo(v.data) && valorRecebidoDe(v) > 0);
    let osRecBase = caixaOrdens.filter(o=> dentroPeriodo(o.data) && valorRecebidoDe(o) > 0);
    let aReceberVendasBase = vendas.filter(v=> v.status==='ativa' && dentroPeriodo(v.data) && valorAReceberDe(v) > 0);
    let aReceberOSBase = caixaOrdens.filter(o=> o.status!=='cancelado' && o.status!=='entregue' && o.status!=='rascunho' && dentroPeriodo(o.data) && valorAReceberDe(o) > 0);
    let canceladasVendasBase = vendas.filter(v=> v.status==='cancelada' && dentroPeriodo(dataDeTimestamp(v.canceladoEm)));
    let canceladasOSBase = caixaOrdens.filter(o=> o.status==='cancelado' && dentroPeriodo(dataDeTimestamp(o.canceladoEm)));
    let trocasBase = [];
    vendas.forEach(v=> (v.trocas||[]).forEach(t=>{ if(dentroPeriodo(t.data)) trocasBase.push({...t, venda:v}); }));

    if(lojaId){
      contasPagasBase = contasPagasBase.filter(g=> g.lojaId === lojaId);
      vendasRecBase = vendasRecBase.filter(v=> v.lojaId === lojaId);
      osRecBase = osRecBase.filter(o=> o.lojaId === lojaId);
      aReceberVendasBase = aReceberVendasBase.filter(v=> v.lojaId === lojaId);
      aReceberOSBase = aReceberOSBase.filter(o=> o.lojaId === lojaId);
      canceladasVendasBase = canceladasVendasBase.filter(v=> v.lojaId === lojaId);
      canceladasOSBase = canceladasOSBase.filter(o=> o.lojaId === lojaId);
      trocasBase = trocasBase.filter(t=> t.venda.lojaId === lojaId);
    }

    const grupos = {};
    function grupo(nome){ if(!grupos[nome]) grupos[nome] = { nome, vendasRec:[], osRec:[], gastos:[], canceladasV:[], canceladasO:[], trocas:[] }; return grupos[nome]; }
    vendasRecBase.forEach(v=> grupo(v.loja||'—').vendasRec.push(v));
    osRecBase.forEach(o=> grupo(nomeLojaCaixa(o.lojaId)||'—').osRec.push(o));
    contasPagasBase.forEach(g=> grupo(g.lojaId ? (nomeLojaCaixa(g.lojaId)||'—') : '__geral__').gastos.push(g));
    canceladasVendasBase.forEach(v=> grupo(v.loja||'—').canceladasV.push(v));
    canceladasOSBase.forEach(o=> grupo(nomeLojaCaixa(o.lojaId)||'—').canceladasO.push(o));
    trocasBase.forEach(t=> grupo(t.venda.loja||'—').trocas.push(t));

    function metricasGrupo(g){
      const contasPagas = g.gastos.reduce((a,x)=>a+(Number(x.valor)||0),0);
      const recVendas = g.vendasRec.reduce((a,x)=>a+valorRecebidoDe(x),0);
      const recOS = g.osRec.reduce((a,x)=>a+valorRecebidoDe(x),0);
      const saidaCanceladas = g.canceladasV.reduce((a,x)=>a+(Number(x.caixaSaidaCancelamento)||0),0) + g.canceladasO.reduce((a,x)=>a+(Number(x.caixaSaidaCancelamento)||0),0);
      const trocasDif = g.trocas.reduce((a,t)=>a+(Number(t.diferenca)||0),0);
      const saldo = recVendas + recOS + trocasDif - contasPagas - saidaCanceladas;
      return { contasPagas, recVendas, recOS, saidaCanceladas, trocasDif, saldo };
    }

    const nomesLoja = Object.keys(grupos).filter(n=>n!=='__geral__').sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const temGeral = !!grupos['__geral__'];

    /* Uma linha do quadro "Por loja" (destaque = linha de total, no rodapé da tabela). */
    function cardHtml(titulo, g, destaque){
      const m = metricasGrupo(g);
      const saldoHtml = m.saldo < 0 ? `<span class="val sai forte">${fmtMoeda(m.saldo)}</span>` : `<span class="val forte">${fmtMoeda(m.saldo)}</span>`;
      return `<tr>
        ${celula('Loja', destaque ? `<b>${escapeHtml(titulo)}</b>` : escapeHtml(titulo), 'principal')}
        ${celula('Vendas recebidas', vEntrada(m.recVendas), 'r')}
        ${celula('O.S. recebidas', vEntrada(m.recOS), 'r')}
        ${celula('Trocas (diferença)', vDiferenca(m.trocasDif), 'r')}
        ${celula('Contas pagas', vSaida(m.contasPagas), 'r')}
        ${celula('Cancelamentos', vSaida(m.saidaCanceladas), 'r')}
        ${celula('Saldo', saldoHtml, 'r')}
      </tr>`;
    }

    const resumoEl = document.getElementById('caixaResumo');
    if(resumoEl){
      let html = '';
      if(nomesLoja.length===0 && !temGeral){
        html = `<div class="card">${estadoHtml('busca', 'Nenhuma movimentação nesse período', 'Confira as datas e a loja. Se alguém acabou de lançar algo, clique em <b>Atualizar dados</b>.')}</div>`;
      } else {
        const consolidado = { vendasRec:[], osRec:[], gastos:[], canceladasV:[], canceladasO:[], trocas:[] };
        Object.values(grupos).forEach(g=>{
          ['vendasRec','osRec','gastos','canceladasV','canceladasO','trocas'].forEach(k=> consolidado[k].push(...g[k]));
        });
        // Saldo do período em destaque (entradas − saídas do consolidado)
        const mc = metricasGrupo(consolidado);
        const entradas = mc.recVendas + mc.recOS + Math.max(0, mc.trocasDif);
        const saidas = mc.contasPagas + mc.saidaCanceladas + Math.max(0, -mc.trocasDif);
        const periodoTxt = de === ate ? fmtDate(de) : `${fmtDate(de)} a ${fmtDate(ate)}`;
        html += `
          <section class="card saldo-card" aria-label="Saldo do período">
            <div>
              <div class="saldo-rot">Saldo do período</div>
              <div class="saldo-valor val${mc.saldo<0?' sai':''}">${fmtMoeda(mc.saldo)}</div>
              <div class="saldo-ctx">${periodoTxt} · ${escapeHtml(lojaNomeFiltro || 'Todas as lojas')}</div>
            </div>
            <dl class="saldo-conta">
              <dt>Entradas</dt><dd>${vEntrada(entradas)}</dd>
              <dt>Saídas</dt><dd>${vSaida(saidas)}</dd>
              <dt class="igual">Saldo</dt><dd class="igual val">${fmtMoeda(mc.saldo)}</dd>
            </dl>
          </section>`;
        let linhas = '';
        nomesLoja.forEach(nome=>{ linhas += cardHtml(nome, grupos[nome]); });
        if(temGeral) linhas += cardHtml('Despesas gerais (sem loja)', grupos['__geral__']);
        const varias = nomesLoja.length>1 || (nomesLoja.length===1 && temGeral);
        html += `
          <section class="card">
            <div class="card-head"><h2>${ic('loja')} Por loja</h2><span class="muted" style="font-size:12.5px;">Entradas com +, saídas com −</span></div>
            <div class="tabela-wrap">
              <table class="tabela cartoes">
                <thead><tr><th>Loja</th><th class="r">Vendas recebidas</th><th class="r">O.S. recebidas</th><th class="r">Trocas (diferença)</th><th class="r">Contas pagas</th><th class="r">Cancelamentos</th><th class="r">Saldo</th></tr></thead>
                <tbody>${linhas}</tbody>
                ${varias ? `<tfoot>${cardHtml('Total de todas as lojas', consolidado, true)}</tfoot>` : ''}
              </table>
            </div>
          </section>`;
      }
      resumoEl.innerHTML = html;
    }

    const det = document.getElementById('caixaDetalhes');
    if(!det) return;
    let html = '';
    const soma = (lista, fn)=> lista.reduce((a,x)=> a + (Number(fn(x))||0), 0);
    const selo = (txt, tipo)=> `<span class="selo selo-${tipo||'neutro'}">${escapeHtml(txt)}</span>`;
    if(tipos.includes('vendasRecebidas')){
      html += detalheSecao('Vendas recebidas', vendasRecBase, v=>`
        <tr${v.status==='cancelada'?' class="apagada"':''}>${celula('Cliente', `${escapeHtml(v.cliente||'—')}${v.status==='cancelada'?' '+selo('Cancelada depois','neutro'):''}`, 'principal')}${celula('Data', fmtDate(v.data))}${celula('Loja', escapeHtml(v.loja))}${celula('Recebido', vEntrada(valorRecebidoDe(v)), 'r')}</tr>
      `, ['Cliente','Data','Loja','Recebido'], { icone:'carrinho', total: vEntrada(soma(vendasRecBase, valorRecebidoDe)) });
    }
    if(tipos.includes('osRecebidas')){
      html += detalheSecao('O.S. recebidas', osRecBase, o=>`
        <tr${o.status==='cancelado'?' class="apagada"':''}>${celula('Cliente', `${escapeHtml(o.cliente||'—')}${o.status==='cancelado'?' '+selo('Cancelada depois','neutro'):''}`, 'principal')}${celula('Data', fmtDate(o.data))}${celula('Loja', escapeHtml(nomeLojaCaixa(o.lojaId)))}${celula('Recebido', vEntrada(valorRecebidoDe(o)), 'r')}</tr>
      `, ['Cliente','Data','Loja','Recebido'], { icone:'recibo', total: vEntrada(soma(osRecBase, valorRecebidoDe)) });
    }
    if(tipos.includes('contasPagas')){
      html += detalheSecao('Contas pagas', contasPagasBase, g=>`
        <tr>${celula('Descrição', `${escapeHtml(g.nome)}<span class="sub">${escapeHtml(g.categoria||'Sem categoria')}</span>`, 'principal')}${celula('Pago em', fmtDate(g.dataPagamento))}${celula('Loja', escapeHtml(g.lojaId?(nomeLojaCaixa(g.lojaId)||'Geral'):'Geral'))}${celula('Valor', vSaida(g.valor), 'r')}</tr>
      `, ['Descrição','Pago em','Loja','Valor'], { icone:'carteira', total: vSaida(soma(contasPagasBase, g=>g.valor)) });
    }
    if(tipos.includes('canceladas')){
      const canceladasTodas = [
        ...canceladasVendasBase.map(v=>({origem:'Venda', data:dataDeTimestamp(v.canceladoEm), loja:v.loja, cliente:v.cliente, motivo:v.motivoCancelamento, por:v.canceladoPor, valor:v.caixaSaidaCancelamento})),
        ...canceladasOSBase.map(o=>({origem:'O.S.', data:dataDeTimestamp(o.canceladoEm), loja:nomeLojaCaixa(o.lojaId), cliente:o.cliente, motivo:o.motivoCancelamento, por:o.canceladoPor, valor:o.caixaSaidaCancelamento})),
      ];
      html += detalheSecao('Canceladas', canceladasTodas, x=>`
        <tr>${celula('Cliente', `${escapeHtml(x.cliente||'—')}<span class="sub">${x.motivo?escapeHtml(x.motivo)+' · ':''}por ${escapeHtml(x.por||'—')}</span>`, 'principal')}${celula('Tipo', selo(x.origem))}${celula('Cancelada em', fmtDate(x.data))}${celula('Loja', escapeHtml(x.loja))}${celula('Saiu do caixa', vSaida(x.valor), 'r')}</tr>
      `, ['Cliente / motivo','Tipo','Cancelada em','Loja','Saiu do caixa'], { icone:'cancelar', total: vSaida(soma(canceladasTodas, x=>x.valor)) });
    }
    if(tipos.includes('trocas')){
      html += detalheSecao('Trocas', trocasBase, t=>`
        <tr>${celula('Cliente', `${escapeHtml(t.venda.cliente||'—')}<span class="sub">${escapeHtml(t.itemAntigoDescricao)} → ${escapeHtml(t.itemNovo.quantidade)}x ${escapeHtml(t.itemNovo.produto)}</span>`, 'principal')}${celula('Data', fmtDate(t.data))}${celula('Loja', escapeHtml(t.venda.loja))}${celula('Diferença', vDiferenca(t.diferenca), 'r')}</tr>
      `, ['Cliente / item antigo → novo','Data','Loja','Diferença'], { icone:'trocar', total: vDiferenca(soma(trocasBase, t=>t.diferenca)) });
    }
    if(tipos.includes('aReceber')){
      const aReceberTodos = [
        ...aReceberVendasBase.map(v=>({origem:'Venda', data:v.data, loja:v.loja, cliente:v.cliente, valor:valorAReceberDe(v)})),
        ...aReceberOSBase.map(o=>({origem:'O.S.', data:o.data, loja:nomeLojaCaixa(o.lojaId), cliente:o.cliente, valor:valorAReceberDe(o)})),
      ];
      html += detalheSecao('A receber em aberto', aReceberTodos, x=>`
        <tr>${celula('Cliente', escapeHtml(x.cliente||'—'), 'principal')}${celula('Tipo', selo(x.origem))}${celula('Data', fmtDate(x.data))}${celula('Loja', escapeHtml(x.loja))}${celula('Falta receber', `<span class="val" style="color:var(--wait);">${fmtMoeda(x.valor)}</span>`, 'r')}</tr>
      `, ['Cliente','Tipo','Data','Loja','Falta receber'], { icone:'relogio', nota:'Venda fechada ou O.S. aberta com saldo. Ainda não entrou no caixa.', total: `<span class="val" style="color:var(--wait);">${fmtMoeda(soma(aReceberTodos, x=>x.valor))}</span> <span class="muted" style="font-size:12.5px;">em aberto</span>` });
    }
    det.innerHTML = html || `<div class="card">${estadoHtml('filtro', 'Nenhum detalhe marcado', 'Marque ao menos um item em <b>Mostrar detalhes</b> e clique em Pesquisar.')}</div>`;
  }
  /* Seção recolhível de detalhes. extra (opcional): { icone, total (html), nota } */
  function detalheSecao(titulo, lista, linhaHtml, colunas, extra){
    extra = extra || {};
    const ultima = colunas.length - 1;
    return `
      <details class="card secao" ${lista.length>0 && lista.length<=15 ? 'open' : ''}>
        <summary>
          <h2>${extra.icone ? ic(extra.icone) : ''}${escapeHtml(titulo)}</h2>
          <span class="cnt" title="${lista.length} lançamento(s)">${lista.length}</span>
          ${extra.nota ? `<span class="muted" style="font-size:12.5px;">${escapeHtml(extra.nota)}</span>` : ''}
          <span class="total">${lista.length ? (extra.total||'') : ''}</span>
          <span class="seta">${ic('baixo')}</span>
        </summary>
        ${lista.length===0 ? `<div class="estado-mini">Nenhum lançamento no período.</div>` : `
        <div class="secao-corpo">
          <table class="tabela cartoes">
            <thead><tr>${colunas.map((c,i)=>`<th${i===ultima?' class="r"':''}>${escapeHtml(c)}</th>`).join('')}</tr></thead>
            <tbody>${lista.map(linhaHtml).join('')}</tbody>
          </table>
        </div>`}
      </details>
    `;
  }

  /* ================= LOGIN / MODO EMBUTIDO ================= */
  const EMBEDDED = window.self !== window.top;
  function atualizarFaixaLoja(){
    const faixa = document.getElementById('lojaFaixa');
    if(!faixa) return;
    if(window.__lojaAtual && window.__lojaAtual.nome){
      faixa.style.display = 'block';
      faixa.style.setProperty('--loja-cor', window.__lojaAtual.cor || '#1F6F8B');
      faixa.textContent = window.__lojaAtual.nome;
    } else {
      faixa.style.display = 'none';
    }
  }
  if(EMBEDDED){
    document.documentElement.classList.add('embedded');
    window.addEventListener('message', async (ev)=>{
    if(!mensagemConfiavel(ev)) return;
      if(!ev.data || !ev.data.type) return;
      if(ev.data.type === 'auth'){
        currentUser = ev.data.user;
        __gatewaySenha = ev.data.user ? ev.data.user.senha : null;
        await carregarTudo();
        enterCaixa();
        parent.postMessage({ type:'tabs', modulo:'caixa', tabs: [], active: null }, '*');
      } else if(ev.data.type === 'lojaAtual'){
        window.__lojaAtual = { id: ev.data.lojaId||null, cor: ev.data.cor||null, nome: ev.data.nome||null };
        atualizarFaixaLoja();
        // Não reconstrói o mainContent — apenas atualiza o select de loja se já estiver montado
        if(currentUser){
          const sel = document.getElementById('cx_loja');
          if(sel){
            const restringir = currentUser.nivel === 'vendedora' || currentUser.nivel === 'oficina';
            if(restringir && window.__lojaAtual && window.__lojaAtual.id){
              sel.value = window.__lojaAtual.id;
              sel.disabled = true;
            } else if(!restringir){
              sel.disabled = false;
            }
          }
        }
      }
    });
    parent.postMessage({ type:'ready', modulo:'caixa' }, '*');
  }

  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  async function doLogin(){
    const pass = document.getElementById('loginPass').value.trim();
    const err = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');
    if(!pass) return;
    err.classList.remove('show');
    btn.disabled = true;
    try{
      const r = await gatewayLogin(pass);
      if(!r || !r.ok){ err.classList.add('show'); return; }
      __gatewaySenha = pass;
      currentUser = { nome: r.user.nome, nivel: r.user.nivel };
      await carregarTudo();
      enterCaixa();
    }catch(e){
      console.error('erro no login do caixa', e);
      err.textContent = 'Não foi possível verificar a senha agora. Tente novamente.';
      err.classList.add('show');
    }finally{
      btn.disabled = false;
    }
  }
  document.getElementById('btnLogout').addEventListener('click', ()=>{
    currentUser = null;
    __gatewaySenha = null;
    document.getElementById('loginPass').value = '';
    document.getElementById('view-caixa').style.display = 'none';
    document.getElementById('view-login').style.display = 'flex';
  });
})();

/* Avisa o shell que houve atividade aqui dentro, para o contador de inatividade
   de 10 minutos não encerrar a sessão de quem está trabalhando dentro do módulo. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;   // no máximo 1 aviso a cada 5s
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
