<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Conectar WhatsApp</title>
<style>body{font-family:system-ui,sans-serif;background:#0b1f24;color:#f3e9c8;text-align:center;padding:24px}img{width:min(86vw,360px);background:#fff;padding:12px;border-radius:12px}p{max-width:420px;margin:12px auto}.ok{font-size:22px;color:#6fe3a0}</style>
<script src="supabase-config.js"></script></head><body>
<h2>Conectar WhatsApp da Vilaça</h2><div id="a"><p>Carregando o QR…</p></div>
<p style="opacity:.8;font-size:14px">No celular do chip: WhatsApp › Aparelhos conectados › Conectar um aparelho › leia este QR (ele se renova sozinho).</p>
<script>
var t=new URLSearchParams(location.search).get('t')||'', parar=false;
async function ciclo(){
  if(parar) return;
  try{
    var r=await fetch(window.SUPABASE_URL+'/functions/v1/qr-instancia?t='+encodeURIComponent(t),{headers:{apikey:window.SUPABASE_ANON_KEY,Authorization:'Bearer '+window.SUPABASE_ANON_KEY}});
    var j=await r.json();
    if(j.state==='open'){ parar=true; document.getElementById('a').innerHTML='<p class="ok">✔ Conectado! Pode fechar esta página.</p>'; return; }
    if(j.error){ parar=true; document.getElementById('a').innerHTML='<p>Link vencido. Peça um novo.</p>'; return; }
    if(j.base64) document.getElementById('a').innerHTML='<img alt="QR code" src="'+j.base64+'">';
  }catch(e){}
  setTimeout(ciclo,12000);
}
ciclo();
</script></body></html>
