<!DOCTYPE html>
<html lang="pt-BR" data-sem-maiuscula>
<head>
<script src="supabase-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua via — Vilaça Joias</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vilaça Joias">
<meta property="og:image" content="https://vilaca.app/logo-vilaca.webp?v=6">
<meta property="og:title" content="Sua via — Vilaça Joias">
<meta name="theme-color" content="#F3F5F8">
<script>
/* Página do cliente: claro por padrão; escuro só se o aparelho do cliente estiver no modo escuro. */
try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches){ document.documentElement.setAttribute('data-theme','dark'); document.documentElement.style.colorScheme='dark'; } }catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript></noscript>
<link rel="stylesheet" href="tema.css">
<script src="icones.js"></script>
<script src="formato.js"></script>
<script src="retirada-publica.js"></script>
<script src="ciente-via.js"></script>
<script src="avaliacao-via.js"></script>
<style>
  /* Página pública do cliente. Cores só pelos tokens do tema.css (claro e escuro). */
  :root{ --delivered:var(--t-info); --delivered-soft:var(--t-info-soft); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--t-font); background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:28px 24px 22px; box-shadow:var(--t-shadow);
  }
  .brand{ display:flex; justify-content:center; margin-bottom:12px; }
  .brand img{ width:132px; height:auto; display:block; border-radius:0; }
  .brand-ico{ width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; text-align:center; }
  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; }

  .stepper{ display:flex; justify-content:space-between; margin:0 0 22px; position:relative; }
  .stepper::before{ content:''; position:absolute; top:14px; left:16%; right:16%; height:2px; background:var(--line); z-index:0; }
  .step{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .step .dot{ width:28px; height:28px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; }
  .step.done .dot{ background:var(--ok); border-color:var(--ok); color:var(--t-surface); }
  .step.current .dot{ background:var(--accent); border-color:var(--accent); color:var(--t-surface); box-shadow:0 0 0 4px var(--accent-soft); }
  .step .label{ font-size:12px; color:var(--muted); font-weight:600; text-align:center; }
  .step.done .label, .step.current .label{ color:var(--ink); }

  .status-banner{ display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px 14px; border-radius:12px; margin-bottom:20px; font-weight:700; font-size:15px; }
  .status-banner.aguardando{ background:var(--wait-soft); color:var(--wait); }
  .status-banner.pronto{ background:var(--ok-soft); color:var(--ok); }
  .status-banner.entregue{ background:var(--delivered-soft); color:var(--delivered); }
  .status-banner.cancelado{ background:var(--danger-soft); color:var(--danger); }

  .details{ font-size:14px; border-top:1px solid var(--line); }
  .details div{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .details div:last-child{ border-bottom:none; }
  .details .k{ color:var(--muted); flex-shrink:0; }
  .details .v{ font-weight:600; text-align:right; overflow-wrap:anywhere; }

  .badge-encaixe{
    display:block; text-align:center; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700;
    padding:6px 10px; border-radius:999px; margin-top:14px;
  }
  .descricao-box{ margin-top:16px; background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.55; overflow-wrap:anywhere; }
  .descricao-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .loading, .error{ text-align:center; color:var(--muted); font-size:14px; padding:24px 0; line-height:1.55; }
  .error{ color:var(--ink-soft); }
  .refresh-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; }
  .confirm-box{ text-align:center; background:var(--surface-2); border-radius:12px; padding:22px 16px 18px; margin-top:6px; }
  .confirm-icon{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .confirm-box p{ font-size:14px; color:var(--ink-soft); line-height:1.55; margin:0 0 16px; }
  .confirm-btn{
    border:none; background:var(--t-primary-strong); color:#fff; font-family:inherit; font-size:15px; font-weight:600;
    padding:13px 20px; border-radius:10px; width:100%; cursor:pointer; min-height:48px;
  }
  .confirm-btn:hover:not(:disabled){ background:var(--t-primary-dark); }
  .confirm-btn:focus-visible{ outline:none; box-shadow:var(--t-ring); }
  .confirm-btn:disabled{ opacity:.6; cursor:default; }
  @media (max-width:480px){
    body{ align-items:flex-start; padding:16px 12px; }
    .card{ padding:24px 18px 20px; }
  }
  .itens{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px; }
  .itens td{ padding:8px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .itens td.r{ text-align:right; white-space:nowrap; font-weight:600; }
  .fotos-item{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .fotos-item img{ width:92px; height:92px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; background:#fff; }
  .itens .orig{ display:block; font-size:12px; color:var(--muted); text-decoration:line-through; font-weight:400; }
  .totais{ margin-top:10px; font-size:14px; }
  .totais div{ display:flex; justify-content:space-between; padding:4px 0; }
  .totais .saldo{ font-weight:800; font-size:16px; }
</style>
</head>
<body>
  <div class="card" id="card" aria-live="polite">
    <div class="loading">Carregando a sua via…</div>
  </div>
  <div id="cienteBox" style="width:100%;max-width:440px;"></div>
  <div id="retiradaBox" style="width:100%;max-width:440px;"></div>
<script>
(function(){
  "use strict";
  const SUPABASE_URL = window.SUPABASE_URL;        // vem de supabase-config.js
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;  // vem de supabase-config.js
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const p = new URLSearchParams(location.search);
  const tipo = p.get("t") === "orc" ? "orc" : p.get("t") === "res" ? "res" : "venda";
  const id = p.get("id");
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function brl(v){ return "R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(s){ if(!s) return "—"; const a=String(s).slice(0,10).split("-"); return a.length===3?a[2]+"/"+a[1]+"/"+a[0]:s; }
  const marca = `<div class="brand"><img src="logo-vilaca.webp?v=6" alt="Vilaça Joias"></div>`;
  function erro(m){ document.getElementById("card").innerHTML = marca + `<div class="error" role="alert">${esc(m)}</div>`; }
  function render(v){
    const titulo = tipo === "orc" ? "Seu orçamento" : tipo === "res" ? "Sua reserva" : "Sua compra";
    const dh = s => { if(!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
    const nomeSt = x => { x = String(x||"").replace(/_/g," "); return x.charAt(0).toUpperCase()+x.slice(1); };
    const ORC = { pendente:["aguardando","Aguardando sua aprovação"], cutucado:["aguardando","Aguardando sua aprovação"], aprovado:["pronto","Orçamento aprovado"], recusado:["cancelado","Orçamento recusado"], vencido:["cancelado","Orçamento vencido"] };
    const banner = tipo === "venda" ? (v.status === "cancelada" ? `<div class="status-banner cancelado">Compra cancelada</div>`
        : Number(v.saldo) > 0.009 ? `<div class="status-banner aguardando">Compra registrada · saldo a pagar ${brl(v.saldo)}</div>`
        : `<div class="status-banner pronto">Compra concluída e paga</div>`)
      : tipo === "orc" ? (()=>{ const m = ORC[v.status] || ["aguardando", nomeSt(v.status) || "Aguardando sua aprovação"]; return `<div class="status-banner ${m[0]}">${esc(m[1])}</div>`; })()
      : (v.status === "reservada" ? `<div class="status-banner pronto">Reservado até ${esc(dh(v.venceEm))}</div>`
      : v.status === "vencida" ? `<div class="status-banner cancelado">Reserva vencida em ${esc(dh(v.venceEm))}</div>`
      : v.status === "convertida" ? `<div class="status-banner entregue">Reserva concluída: virou compra${v.vendaCodigo ? " (via " + esc(v.vendaCodigo) + ")" : ""}</div>`
      : `<div class="status-banner cancelado">Reserva cancelada</div>`);
    document.getElementById("card").innerHTML = `${marca}
      <h1>Olá, ${esc(String(v.cliente||"").split(" ")[0] || "cliente")}!</h1>
      <div class="sub">${titulo}${v.via ? " · via " + esc(v.via) : ""}</div>
      ${banner}
      <div class="details">
        <div><span class="k">Loja</span><span class="v">${esc(v.loja||"—")}</span></div>
        <div><span class="k">Data</span><span class="v">${fmtDate(v.data)}</span></div>
        ${tipo==="orc" && v.validade ? `<div><span class="k">Válido até</span><span class="v">${fmtDate(v.validade)}</span></div>` : ""}
        ${tipo==="res" && v.status==="reservada" ? `<div><span class="k">Reservado até</span><span class="v">${esc(dh(v.venceEm))}</span></div>` : ""}
      </div>
      <table class="itens">${(v.itens||[]).map(it=>`<tr><td>${esc(it.nome)}${it.qtd>1?` <span style="color:var(--muted)">×${it.qtd}</span>`:""}${it.obs?`<div style="color:var(--muted);font-size:12.5px;margin-top:2px;">${esc(it.obs)}</div>`:""}${(it.fotos&&it.fotos.length)?`<div class="fotos-item">${it.fotos.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Foto de ${esc(it.nome)}" loading="lazy"></a>`).join("")}</div>`:""}</td><td class="r">${it.original && it.original>it.valor ? `<span class="orig">${brl(it.original*it.qtd)}</span>` : ""}${brl(it.valor*it.qtd)}</td></tr>`).join("")}</table>
      <div class="totais">
        <div><span>Total</span><b>${brl(v.total)}</b></div>
        ${tipo==="venda" ? `<div><span>Pago</span><span>${brl(v.pago)}</span></div><div class="saldo"><span>Saldo a pagar</span><span>${brl(v.saldo)}</span></div>` : ""}
      </div>
      ${v.observacao ? `<div class="descricao-box"><div class="descricao-label">Observação</div>${esc(v.observacao)}</div>` : ""}
      <div class="refresh-note">Dúvidas? Fale com a loja ${esc(v.loja||"")}.</div>`;
  }
  async function carregar(){
    if(!id){ erro("Este link está incompleto. Abra de novo o link que a loja enviou."); return; }
    try{
      const { data, error } = tipo === "res"
        ? await supabaseClient.functions.invoke("reservas-api", { body: { op:"publico", id } })
        : await supabaseClient.functions.invoke("retirada-terceiro", { body: { acao:"estado", tipo, id, resumo:true } });
      if(error || !data || data.error || !data.via) throw new Error((data && data.error) || "erro");
      render(data.via);
      if(!window.__cv && window.CienteVia){ window.__cv = true; CienteVia.montar(document.getElementById("cienteBox"), { tipo, id, client: supabaseClient }); }
      if(!window.__av && window.AvaliacaoVia){ window.__av = true; AvaliacaoVia.montar({ tipo, id, client: supabaseClient }); }
      if(tipo !== "res" && !window.__rt){ window.__rt = true; RetiradaPublica.montar(document.getElementById("retiradaBox"), { tipo, id, via: data.via.via, client: supabaseClient }); }
    }catch(e){ erro("Não foi possível abrir esta via agora. Confira o link e tente de novo em alguns minutos."); }
  }
  carregar();
  setInterval(carregar, 60000);
})();
</script>
</body>
</html>
