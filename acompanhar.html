<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhar ordem de serviço</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F5F8">
<script>
/* Página do cliente: claro por padrão; escuro só se o aparelho do cliente estiver no modo escuro. */
try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches){ document.documentElement.setAttribute('data-theme','dark'); document.documentElement.style.colorScheme='dark'; } }catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="icones.js"></script>
<script src="formato.js"></script>
<style>
  /* Página pública do cliente. Cores só pelos tokens do tema.css (claro e escuro). */
  :root{ --delivered:var(--t-info); --delivered-soft:var(--t-info-soft); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--t-font); background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:28px 24px 22px; box-shadow:var(--t-shadow);
  }
  .brand{ display:flex; justify-content:center; margin-bottom:12px; }
  .brand-ico{ width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; text-align:center; }
  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; }

  .stepper{ display:flex; justify-content:space-between; margin:0 0 22px; position:relative; }
  .stepper::before{ content:''; position:absolute; top:14px; left:16%; right:16%; height:2px; background:var(--line); z-index:0; }
  .step{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .step .dot{ width:28px; height:28px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; }
  .step.done .dot{ background:var(--ok); border-color:var(--ok); color:var(--t-surface); }
  .step.current .dot{ background:var(--accent); border-color:var(--accent); color:var(--t-surface); box-shadow:0 0 0 4px var(--accent-soft); }
  .step .label{ font-size:12px; color:var(--muted); font-weight:600; text-align:center; }
  .step.done .label, .step.current .label{ color:var(--ink); }

  .status-banner{ display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px 14px; border-radius:12px; margin-bottom:20px; font-weight:700; font-size:15px; }
  .status-banner.aguardando{ background:var(--wait-soft); color:var(--wait); }
  .status-banner.pronto{ background:var(--ok-soft); color:var(--ok); }
  .status-banner.entregue{ background:var(--delivered-soft); color:var(--delivered); }
  .status-banner.cancelado{ background:var(--danger-soft); color:var(--danger); }

  .details{ font-size:14px; border-top:1px solid var(--line); }
  .details div{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .details div:last-child{ border-bottom:none; }
  .details .k{ color:var(--muted); flex-shrink:0; }
  .details .v{ font-weight:600; text-align:right; overflow-wrap:anywhere; }

  .badge-encaixe{
    display:block; text-align:center; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700;
    padding:6px 10px; border-radius:999px; margin-top:14px;
  }
  .descricao-box{ margin-top:16px; background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.55; overflow-wrap:anywhere; }
  .descricao-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .loading, .error{ text-align:center; color:var(--muted); font-size:14px; padding:24px 0; line-height:1.55; }
  .error{ color:var(--ink-soft); }
  .refresh-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; }
  .confirm-box{ text-align:center; background:var(--surface-2); border-radius:12px; padding:22px 16px 18px; margin-top:6px; }
  .confirm-icon{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .confirm-box p{ font-size:14px; color:var(--ink-soft); line-height:1.55; margin:0 0 16px; }
  .confirm-btn{
    border:none; background:var(--t-primary-strong); color:#fff; font-family:inherit; font-size:15px; font-weight:600;
    padding:13px 20px; border-radius:10px; width:100%; cursor:pointer; min-height:48px;
  }
  .confirm-btn:hover:not(:disabled){ background:var(--t-primary-dark); }
  .confirm-btn:focus-visible{ outline:none; box-shadow:var(--t-ring); }
  .confirm-btn:disabled{ opacity:.6; cursor:default; }
  @media (max-width:480px){
    body{ align-items:flex-start; padding:16px 12px; }
    .card{ padding:24px 18px 20px; }
  }
</style>
</head>
<body>
  <div class="card" id="card" aria-live="polite">
    <div class="loading" id="loading">Carregando a sua ordem de serviço…</div>
  </div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s){
    return (s === null || s === undefined ? "" : String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function fmtDate(s){
    if(!s) return "—";
    const partes = s.split("-");
    if(partes.length !== 3) return s;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  function ico(nome, tam){ return window.Icone ? Icone(nome, { tam: tam || 16 }) : ""; }
  function marcaHtml(){ return `<div class="brand"><span class="brand-ico">${ico("joia", 22)}</span></div>`; }
  function statusIcone(s){
    s = ["oficina_pronto","pendencia","enviado_fabrica"].includes(s) ? "aguardando" : s;
    return ico(s==="aguardando" ? "relogio" : s==="pronto" ? "check" : s==="entregue" ? "pacote" : "cancelar", 18);
  }
  function getOrderId(){
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }
  function statusLabel(s){
    if(s==="oficina_pronto" || s==="pendencia" || s==="enviado_fabrica") s = "aguardando"; // para o cliente, só fica pronto quando a loja confere
    return s==="aguardando" ? "Aguardando" : s==="pronto" ? "Pronto para retirada" : s==="entregue" ? "Entregue" : "Cancelado";
  }
  function stepperHtml(status){
    const steps = [
      { key:"aguardando", label:"Recebido" },
      { key:"pronto", label:"Pronto" },
      { key:"entregue", label:"Entregue" },
    ];
    const order = ["aguardando","pronto","entregue"];
    const currentIdx = order.indexOf(["oficina_pronto","pendencia","enviado_fabrica"].includes(status) ? "aguardando" : status);
    return `<div class="stepper">${steps.map((s,i)=>{
      let cls = "";
      if(i < currentIdx) cls = "done";
      else if(i === currentIdx) cls = "current";
      return `<div class="step ${cls}"><div class="dot">${i < currentIdx ? ico("check", 15) : (i+1)}</div><div class="label">${s.label}</div></div>`;
    }).join("")}</div>`;
  }

  function showError(msg){
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <div class="error" role="alert">${escapeHtml(msg)}</div>
    `;
  }

  function render(o){
    const isFinal = o.status === "entregue" || o.status === "cancelado";
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <h1>Olá, ${escapeHtml(o.cliente)}!</h1>
      <div class="sub">Acompanhe a sua ordem de serviço</div>
      <div class="status-banner ${escapeHtml(["oficina_pronto","pendencia","enviado_fabrica"].includes(o.status)?"aguardando":o.status)}">${statusIcone(o.status)}${statusLabel(o.status)}</div>
      ${o.status !== "cancelado" ? stepperHtml(o.status) : ""}
      <div class="details">
        <div><span class="k">Loja</span><span class="v">${escapeHtml(o.loja)}</span></div>
        <div><span class="k">Serviço</span><span class="v">${escapeHtml(o.servico)}</span></div>
        <div><span class="k">Data prevista</span><span class="v">${fmtDate(o.data)}</span></div>
        ${o.numeroNota ? `<div><span class="k">Nota</span><span class="v">${escapeHtml(o.numeroNota)}</span></div>` : ""}
        ${o.status === "entregue" && o.recebidoPor ? `<div><span class="k">Recebido por</span><span class="v">${escapeHtml(o.recebidoPor)}</span></div>` : ""}
      </div>
      ${o.encaixe ? `<div class="badge-encaixe">Encaixe autorizado</div>` : ""}
      ${o.descricao ? `<div class="descricao-box"><div class="descricao-label">Descrição do serviço</div>${escapeHtml(o.descricao)}</div>` : ""}
      <div class="refresh-note">${isFinal ? "Esta ordem já foi concluída." : "Esta página se atualiza sozinha — não precisa recarregar."}${o.loja ? `<br>Dúvidas? Fale com a loja ${escapeHtml(o.loja)}.` : ""}</div>
    `;
  }

  function renderConfirmGate(o){
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <h1>Olá, ${escapeHtml(o.cliente)}!</h1>
      <div class="sub">Há uma novidade na sua ordem de serviço</div>
      <div class="confirm-box">
        <div class="confirm-icon">${ico("sino", 24)}</div>
        <p>Para ver como está a sua ordem, confirme que recebeu este aviso.</p>
        <button class="confirm-btn" id="btnConfirmarLeitura" disabled>Carregando…</button>
      </div>
    `;
    const btnInicial = document.getElementById("btnConfirmarLeitura");
    // Espera um instante antes de liberar o botão: robôs de varredura de link (Outlook, filtros
    // de e-mail corporativos, etc.) costumam agir instantaneamente, sem esperar — isso ajuda a
    // evitar que a confirmação seja "gasta" antes do cliente de verdade abrir a página.
    setTimeout(()=>{
      const btn = document.getElementById("btnConfirmarLeitura");
      if(!btn) return;
      btn.disabled = false;
      btn.textContent = "Sim, recebi esta atualização";
    }, 1500);
    document.getElementById("btnConfirmarLeitura").addEventListener("click", async ()=>{
      const btn = document.getElementById("btnConfirmarLeitura");
      btn.disabled = true;
      btn.textContent = "Confirmando…";
      try{
        await supabaseClient.functions.invoke("confirmar-leitura-os", { body: { id: getOrderId(), status: o.status } });
      }catch(e){
        console.error("Falha ao registrar confirmação de leitura:", e);
      }
      render(o);
    });
  }

  async function loadStatus(){
    const id = getOrderId();
    if(!id){
      showError("Este link está incompleto. Abra de novo o link que a loja enviou ou fale com a loja.");
      return;
    }
    try{
      const { data, error } = await supabaseClient.functions.invoke("get-order-status", { body: { id } });
      if(error) throw error;
      if(!data || data.error) throw new Error((data && data.error) || "Ordem não encontrada.");
      if(!data.confirmadoStatusAtual){
        renderConfirmGate(data);
      }else{
        render(data);
      }
    }catch(e){
      showError("Não foi possível abrir esta ordem agora. Confira se abriu o link completo e tente de novo em alguns minutos.");
    }
  }

  loadStatus();
  setInterval(loadStatus, 45000);
})();
</script>
</body>
</html>
