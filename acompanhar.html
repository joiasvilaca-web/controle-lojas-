<!DOCTYPE html>
<html lang="pt-BR" data-sem-maiuscula>
<head>
<script src="supabase-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhar ordem de serviço</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vilaça Joias">
<meta property="og:image" content="https://vilaca.app/logo-vilaca.webp?v=6">
<meta property="og:title" content="Acompanhe sua ordem de serviço — Vilaça Joias">
<meta name="theme-color" content="#F3F5F8">
<script>
/* Página do cliente: claro por padrão; escuro só se o aparelho do cliente estiver no modo escuro. */
try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches){ document.documentElement.setAttribute('data-theme','dark'); document.documentElement.style.colorScheme='dark'; } }catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript></noscript>
<link rel="stylesheet" href="tema.css">
<script src="icones.js"></script>
<script src="formato.js"></script>
<script src="retirada-publica.js"></script>
<script src="ciente-via.js"></script>
<script src="avaliacao-via.js"></script>
<script src="instagram-link.js"></script>
<style>
  /* Página pública do cliente. Cores só pelos tokens do tema.css (claro e escuro). */
  :root{ --delivered:var(--t-info); --delivered-soft:var(--t-info-soft); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--t-font); background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:28px 24px 22px; box-shadow:var(--t-shadow);
  }
  .brand{ display:flex; justify-content:center; margin-bottom:12px; }
  .brand img{ width:132px; height:auto; display:block; border-radius:0; }
  .brand-ico{ width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.015em; margin:0 0 4px; text-align:center; }
  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; }

  .stepper{ display:flex; justify-content:space-between; margin:0 0 22px; position:relative; }
  .stepper::before{ content:''; position:absolute; top:14px; left:16%; right:16%; height:2px; background:var(--line); z-index:0; }
  .step{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .step .dot{ width:28px; height:28px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; }
  .step.done .dot{ background:var(--ok); border-color:var(--ok); color:var(--t-surface); }
  .step.current .dot{ background:var(--accent); border-color:var(--accent); color:var(--t-surface); box-shadow:0 0 0 4px var(--accent-soft); }
  .step .label{ font-size:12px; color:var(--muted); font-weight:600; text-align:center; }
  .step.done .label, .step.current .label{ color:var(--ink); }

  .status-banner{ display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px 14px; border-radius:12px; margin-bottom:20px; font-weight:700; font-size:15px; }
  .status-banner.aguardando{ background:var(--wait-soft); color:var(--wait); }
  .status-banner.pronto{ background:var(--ok-soft); color:var(--ok); }
  .status-banner.entregue{ background:var(--delivered-soft); color:var(--delivered); }
  .etapa-texto{ text-align:center; margin:-10px 0 18px; font-size:14px; color:var(--ink-soft); line-height:1.5; }
  .status-banner.cancelado{ background:var(--danger-soft); color:var(--danger); }

  .details{ font-size:14px; border-top:1px solid var(--line); }
  .details div{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .details div:last-child{ border-bottom:none; }
  .details .k{ color:var(--muted); flex-shrink:0; }
  .details .v{ font-weight:600; text-align:right; overflow-wrap:anywhere; }

  .badge-encaixe{
    display:block; text-align:center; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700;
    padding:6px 10px; border-radius:999px; margin-top:14px;
  }
  .descricao-box{ margin-top:16px; background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.55; overflow-wrap:anywhere; }
  .descricao-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .loading, .error{ text-align:center; color:var(--muted); font-size:14px; padding:24px 0; line-height:1.55; }
  .error{ color:var(--ink-soft); }
  .refresh-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; }
  .prazo-box{ margin:12px 0 4px; padding:12px 14px; border-radius:12px; background:#FFF6E0; color:#5a4300; border:1px solid #F0D48A; font-size:13.5px; line-height:1.5; }
  .prazo-box.vencido{ background:#FDECEA; color:#7a1d14; border-color:#F2B8B0; }
  .termo-retirada{ font-size:11px; color:var(--muted); margin-top:12px; padding-top:10px; border-top:1px solid rgba(127,127,127,.25); line-height:1.45; text-align:left; }
  .confirm-box{ text-align:center; background:var(--surface-2); border-radius:12px; padding:22px 16px 18px; margin-top:6px; }
  .confirm-icon{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .confirm-box p{ font-size:14px; color:var(--ink-soft); line-height:1.55; margin:0 0 16px; }
  .confirm-btn{
    border:none; background:var(--t-primary-strong); color:#fff; font-family:inherit; font-size:15px; font-weight:600;
    padding:13px 20px; border-radius:10px; width:100%; cursor:pointer; min-height:48px;
  }
  .confirm-btn:hover:not(:disabled){ background:var(--t-primary-dark); }
  .confirm-btn:focus-visible{ outline:none; box-shadow:var(--t-ring); }
  .confirm-btn:disabled{ opacity:.6; cursor:default; }
  @media (max-width:480px){
    body{ align-items:flex-start; padding:16px 12px; }
    .card{ padding:24px 18px 20px; }
  }
</style>
</head>
<body>
  <div class="card" id="card" aria-live="polite">
    <div class="loading" id="loading">Carregando a sua ordem de serviço…</div>
  </div>
  <div id="cienteBox" style="width:100%;max-width:440px;"></div>
  <div id="retiradaBox" style="width:100%;max-width:440px;"></div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = window.SUPABASE_URL;        // vem de supabase-config.js
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;  // vem de supabase-config.js
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s){
    return (s === null || s === undefined ? "" : String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function fmtDate(s){
    if(!s) return "—";
    const partes = s.split("-");
    if(partes.length !== 3) return s;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  function ico(nome, tam){ return window.Icone ? Icone(nome, { tam: tam || 16 }) : ""; }
  function marcaHtml(){ return `<div class="brand"><img src="logo-vilaca.webp?v=6" alt="Vilaça Joias"></div>`; }
  // Etapa atual da via, do jeito que o cliente entende (sem histórico).
  const ETAPAS = {
    aguardando:      { cls:"aguardando", ico:"relogio",    titulo:"APROVADO",            texto:"Recebemos a sua autorização e o seu pedido está aprovado. Ele será enviado à nossa fábrica em breve." },
    enviado_fabrica: { cls:"aguardando", ico:"ferramenta", titulo:"ENVIADO P/ FÁBRICA",  texto:"Seu pedido já foi encaminhado e está a caminho da nossa fábrica, onde será produzido." },
    em_producao:     { cls:"aguardando", ico:"ferramenta", titulo:"EM PRODUÇÃO",         texto:"Sua peça chegou à fábrica e está sendo produzida com todo o cuidado pela nossa equipe." },
    pendencia:       { cls:"aguardando", ico:"relogio",    titulo:"PENDÊNCIA",           texto:"Surgiu um detalhe que precisa ser resolvido para o serviço continuar. Se precisarmos de algo, a loja entra em contato com você." },
    oficina_pronto:  { cls:"aguardando", ico:"check",      titulo:"LIBERADO FÁBRICA",           texto:"Sua peça já foi produzida e está a caminho da loja para a conferência final. Avisaremos assim que estiver pronta para retirada." },
    pronto:          { cls:"pronto",     ico:"check",      titulo:"DISPONÍVEL PARA RETIRADA",              texto:"Sua peça está pronta! Já pode vir buscar na loja." },
    entregue:        { cls:"entregue",   ico:"pacote",     titulo:"ENTREGUE",            texto:"Sua peça foi entregue. Obrigado pela confiança!" },
    cancelado:       { cls:"cancelado",  ico:"cancelar",   titulo:"CANCELADO",           texto:"Esta ordem foi cancelada. Em caso de dúvidas, fale com a loja." },
    abandonada:      { cls:"cancelado",  ico:"cancelar",   titulo:"PRAZO DE RETIRADA ENCERRADO", texto:"O prazo para retirar esta peça terminou e ela foi destinada a desmanche, conforme o termo da via. Se houve pagamento, o crédito (valor pago menos 20% de perda da fabricação) está no seu cadastro: fale com a loja." },
  };
  function etapa(s){ return ETAPAS[s] || ETAPAS.aguardando; }
  // 22/11 (Felipe): aviso do PRAZO DE RETIRADA no cartão (o WhatsApp leva só a mensagem de pronto + este link)
  function dataBR(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||"")); return m ? m[3]+"/"+m[2]+"/"+m[1] : ""; }
  function brl(v){ return "R$ " + (Number(v)||0).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  function prazoHtml(p){
    if(!p) return "";
    if(p.abandonada) return p.credito > 0.009 ? `<div class="prazo-box vencido"><b>Crédito no seu cadastro: ${brl(p.credito)}</b><br>Valor pago ${brl(p.pago)} menos 20% de perda da fabricação. Use em uma nova compra ou fale com a loja.</div>` : "";
    const cred = p.comPagamento ? ` Do valor pago, <b>${brl(p.credito)}</b> ficará como crédito no seu cadastro (descontada a taxa de 20% de perda da fabricação).` : "";
    if(p.vencido) return `<div class="prazo-box vencido"><b>Prazo de retirada encerrado em ${dataBR(p.limite)}.</b><br>Conforme o termo da via, a peça será destinada a desmanche para cobrir os custos.${cred} Fale com a loja.</div>`;
    return `<div class="prazo-box"><b>Retire até ${dataBR(p.limite)}.</b><br>Após essa data, conforme o termo da via, a peça será destinada a desmanche para cobrir os custos.${cred}</div>`;
  }
  // 22/11 (Felipe): termo de retirada, curto, no rodapé do cartão do pedido (via de serviço)
  const TERMO_RETIRADA = "<b>Termo de retirada:</b> o pedido pronto deve ser retirado em até 30 dias (sem pagamento) ou 60 dias (com pagamento). Após o prazo e os avisos, a peça é destinada a desmanche para cobrir os custos e, do valor pago, 80% fica como crédito no seu cadastro (20% de taxa de perda da fabricação).";
  function getOrderId(){
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }
  function showError(msg){
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <div class="error" role="alert">${escapeHtml(msg)}</div>
    `;
  }

  function render(o){
    const isFinal = o.status === "entregue" || o.status === "cancelado" || o.status === "abandonada";
    document.getElementById("card").innerHTML = `
      ${marcaHtml()}
      <h1>Olá, ${escapeHtml(o.cliente)}!</h1>
      <div class="sub">Acompanhe a sua ordem de serviço</div>
      <div class="status-banner ${etapa(o.status).cls}">${ico(etapa(o.status).ico, 18)}${escapeHtml(etapa(o.status).titulo)}</div>
      <p class="etapa-texto">${escapeHtml(etapa(o.status).texto)}</p>
      ${prazoHtml(o.prazoRetirada)}
      <div class="details">
        <div><span class="k">Loja</span><span class="v">${escapeHtml(o.loja)}</span></div>
        <div><span class="k">Serviço</span><span class="v">${escapeHtml(o.servico)}</span></div>
        <div><span class="k">Data prevista</span><span class="v">${fmtDate(o.data)}</span></div>
        ${o.numeroNota ? `<div><span class="k">Nota</span><span class="v">${escapeHtml(o.numeroNota)}</span></div>` : ""}
        ${o.status === "entregue" && o.recebidoPor ? `<div><span class="k">Recebido por</span><span class="v">${escapeHtml(o.recebidoPor)}</span></div>` : ""}
      </div>
      ${o.encaixe ? `<div class="badge-encaixe">Encaixe autorizado</div>` : ""}
      ${o.descricao ? `<div class="descricao-box"><div class="descricao-label">Descrição do serviço</div>${escapeHtml(o.descricao)}</div>` : ""}
      <div class="refresh-note">${isFinal ? "Esta ordem já foi concluída." : "Esta página se atualiza sozinha — não precisa recarregar."}${o.loja ? `<br>Dúvidas? Fale com a loja ${escapeHtml(o.loja)}.` : ""}</div>
      <div class="termo-retirada">${TERMO_RETIRADA}</div>
      ${window.InstagramLink ? InstagramLink.html({ loja: o.loja }) : ""}
    `;
  }

  async function loadStatus(){
    // 22/11: ?demo=1 → página de EXEMPLO para a prévia em Modelos WhatsApp (sem dados reais, sem ciente/avaliação/código)
    const demo = new URLSearchParams(location.search).get("demo");
    if(demo){ const st = ETAPAS[demo] ? demo : "pronto"; render({ cliente:"Maria", status: st, loja:"VILAÇA - UNIDADE HALFELD", servico:"AJUSTE DE ARO", data: new Date(Date.now()+5*864e5).toISOString().slice(0,10), descricao:"AJUSTAR ARO DO ANEL PARA 16 E POLIR.", prazoRetirada: st === "pronto" ? { limite: new Date(Date.now()+45*864e5).toISOString().slice(0,10), comPagamento:true, vencido:false, credito: 320 } : st === "abandonada" ? { abandonada:true, pago:400, credito:320 } : null }); const n = document.createElement("div"); n.className = "refresh-note"; n.textContent = "Página de EXEMPLO (prévia). O cliente vê aqui também o \"Ciente\", a avaliação e o código de retirada."; document.getElementById("card").appendChild(n); return; }
    const id = getOrderId();
    if(!id){
      showError("Este link está incompleto. Abra de novo o link que a loja enviou ou fale com a loja.");
      return;
    }
    try{
      const { data, error } = await supabaseClient.functions.invoke("get-order-status", { body: { id } });
      if(error) throw error;
      if(!data || data.error) throw new Error((data && data.error) || "Ordem não encontrada.");
      if(!window.__cvMontado && window.CienteVia){ window.__cvMontado = true; CienteVia.montar(document.getElementById("cienteBox"), { tipo:"os", id, client: supabaseClient }); }
      if(!window.__avMontado && window.AvaliacaoVia){ window.__avMontado = true; AvaliacaoVia.montar({ tipo:"os", id, client: supabaseClient }); }
      if(!window.__rtMontado && window.RetiradaPublica){ window.__rtMontado = true; RetiradaPublica.montar(document.getElementById("retiradaBox"), { tipo:"os", id, client: supabaseClient }); }
      render(data);
    }catch(e){
      showError("Não foi possível abrir esta ordem agora. Confira se abriu o link completo e tente de novo em alguns minutos.");
    }
  }

  loadStatus();
  setInterval(loadStatus, 45000);
})();
</script>
</body>
</html>
