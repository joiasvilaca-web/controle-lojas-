<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete seu cadastro · Vilaça Joias</title>
<meta name="robots" content="noindex">
<script src="tema.js"></script>
<script src="icones.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* Página pública de funcionário (autocadastro por convite). Cores só pelo sistema (tema.css). */
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; display:flex; justify-content:center; padding:32px 16px 48px; font-family:var(--t-font); background:var(--t-bg); color:var(--ink);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:30px 28px 26px; max-width:600px; width:100%; height:fit-content; box-shadow:var(--t-shadow);}
.logo{width:96px; height:auto; display:block; margin:0 auto 16px; border-radius:10px;}
h1{font-size:21px; font-weight:700; letter-spacing:-.015em; margin:0 0 6px; text-align:center; color:var(--ink);}
.sub{color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 18px; text-align:center;}
.section-label{font-size:15px; font-weight:700; letter-spacing:-.01em; color:var(--ink); border-top:1px solid var(--line); padding-top:18px; margin:22px 0 12px;}
.section-label:first-of-type{border-top:0; padding-top:0; margin-top:4px;}
.section-label .opc, .field label .opc{font-weight:400; color:var(--muted);}
.section-label .opc{font-size:13px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
@media(max-width:480px){ .grid-2{grid-template-columns:1fr;} }
.field{margin-bottom:14px; min-width:0;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field.curto{max-width:200px;}
input, select{width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink); font-size:14.5px; font-family:inherit;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer;}
#btnSalvar{width:100%; padding:13px 16px; font-size:15px; margin-top:8px;}
.btn-perigo-suave{background:var(--surface); color:var(--danger); border-color:var(--line);}
.btn-perigo-suave:hover{background:var(--danger-soft);}
.msg{font-size:13.5px; line-height:1.5; padding:10px 12px; border-radius:10px; margin-bottom:14px; display:none;}
.msg.show{display:block;}
.msg-erro{background:var(--danger-soft); color:var(--danger);}
.msg-ok{background:var(--ok-soft); color:var(--ok); font-weight:600;}
.hint{color:var(--muted); font-size:12.5px; margin:14px 0 0; line-height:1.55;}
.foto-linha{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:10px;}
.foto-avatar{width:84px; height:84px; border-radius:50%; object-fit:cover; border:1px solid var(--line); flex-shrink:0;}
.foto-vazia{width:84px; height:84px; border-radius:50%; background:var(--surface-2); border:1px dashed var(--line-strong); display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0;}
.foto-botoes{display:flex; gap:8px; flex-wrap:wrap;}
#fotoStatus:empty{display:none;}
#fotoStatus{font-size:13px; margin-bottom:12px;}
.rodape{margin-top:20px; text-align:center; font-size:12px; color:var(--muted);}
@media (max-width:480px){ body{padding:16px 12px 32px;} .card{padding:24px 16px 20px; border-radius:16px;} .field.curto{max-width:none;} }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="logo-vilaca.png" alt="Vilaça Joias">
  <h1 id="titulo">Complete seu cadastro</h1>
  <p class="sub" id="subtitulo">Conferindo o seu link…</p>
  <div class="msg" id="msgErro" role="alert"></div>
  <div class="msg" id="msgOk" role="status"></div>
  <div id="formArea"></div>
  <div class="rodape">Gestão e Controle · Grupo Vilaça Joias</div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/funcionario-acesso";

async function call(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    return await res.json();
  }catch(e){ return { error: 'Não foi possível conectar. Verifique sua internet.' }; }
}

const realSupabaseClient = (window.supabase && typeof window.supabase.createClient==='function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFotoParaDrive(dataUrl, filename){
  if(!realSupabaseClient) throw new Error('upload indisponível');
  const { data, error } = await realSupabaseClient.functions.invoke('upload-foto-drive', {
    body: { dataUrl, filename, pasta:'funcionarios', tratar:false, tokenCadastro: token }
  });
  if(error) throw error;
  if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
  return data;
}

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function mostrarErro(msg){
  const el = document.getElementById('msgErro');
  el.textContent = msg; el.classList.add('show', 'msg-erro');
  document.getElementById('formArea').innerHTML = '';
}
function mostrarErroForm(msg){
  const el = document.getElementById('msgErro');
  el.textContent = msg; el.classList.add('show', 'msg-erro');
  if(typeof el.scrollIntoView==='function') el.scrollIntoView({ behavior:'smooth', block:'center' }); // o aviso fica no topo; o botão, no fim da página
}

(async function init(){
  if(!token){
    document.getElementById('subtitulo').textContent = 'Link inválido.';
    mostrarErro('Este link está incompleto. Peça um novo convite à diretoria ou à gerência.');
    return;
  }
  const r = await call({ op:'validarTokenCadastro', token });
  if(!r.valido){
    document.getElementById('subtitulo').textContent = 'Link inválido ou expirado.';
    mostrarErro(r.expirado ? 'Este link expirou (vale por 1 dia). Peça um novo convite à diretoria ou à gerência.' : 'Este link não vale mais: o cadastro já foi concluído ou o convite foi trocado. Se não consegue entrar, peça um novo convite.');
    return;
  }
  document.getElementById('subtitulo').textContent = `Olá, ${r.nome}! Preencha os seus dados abaixo para concluir o cadastro.${r.cargo?(' Função: '+r.cargo+'.'):''}`;
  document.getElementById('formArea').innerHTML = `
    <div class="section-label">Sua foto <span class="opc">(opcional)</span></div>
    <div id="areaFoto"></div>

    <div class="section-label">Como te chamamos</div>
    <div class="field"><label>Apelido <span class="opc">(como vai aparecer nas telas do sistema)</span></label><input id="apelido"></div>

    <div class="section-label">Dados pessoais</div>
    <div class="grid-2">
      <div class="field"><label>CPF</label><input id="cpf"></div>
      <div class="field"><label>RG</label><input id="rg"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Data de nascimento</label><input type="date" id="dataNascimento"></div>
      <div class="field"><label>Estado civil</label>
        <select id="estadoCivil"><option value="">—</option><option>Solteiro(a)</option><option>Casado(a)</option><option>Divorciado(a)</option><option>Viúvo(a)</option><option>União estável</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Celular particular</label><input id="celularParticular"></div>
      <div class="field"><label>Telefone fixo <span class="opc">(opcional)</span></label><input id="telefoneFixo"></div>
    </div>
    <div class="field"><label>Número celular profissional <span class="opc">(se for diferente do particular)</span></label><input id="celularLoja"></div>

    <div class="section-label">Endereço</div>
    <div class="grid-2">
      <div class="field"><label>CEP</label><input id="cep"></div>
      <div class="field"><label>Cidade</label><input id="cidade"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Endereço</label><input id="endereco"></div>
      <div class="field"><label>Número</label><input id="numero"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Bairro</label><input id="bairro"></div>
      <div class="field"><label>Estado (UF)</label><input id="estado" maxlength="2" style="text-transform:uppercase;" autocapitalize="characters"></div>
    </div>
    <div class="field"><label>Complemento <span class="opc">(opcional)</span></label><input id="complemento"></div>

    <div class="section-label">Filhos <span class="opc">(pra contabilidade avaliar Salário-Família)</span></div>
    <div class="field"><label>Tem filhos?</label>
      <select id="temFilhos"><option value="nao">Não</option><option value="sim">Sim</option></select>
    </div>
    <div id="areaFilhos"></div>

    <div class="section-label">Contato de emergência</div>
    <div class="grid-2">
      <div class="field"><label>Nome</label><input id="contatoEmergenciaNome"></div>
      <div class="field"><label>Telefone</label><input id="contatoEmergenciaTelefone"></div>
    </div>

    <div class="section-label">Dados profissionais</div>
    <div class="grid-2">
      <div class="field"><label>Data de admissão</label><input type="date" id="dataAdmissao"></div>
      <div class="field"><label>Tipo de contrato</label>
        <select id="tipoContrato"><option value="CLT">CLT</option><option value="PJ">PJ</option><option value="Estágio">Estágio</option><option value="Outro">Outro</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>PIS/PASEP</label><input id="pis"></div>
      <div class="field"><label>CTPS — número</label><input id="ctpsNumero"></div>
    </div>
    <div class="field curto"><label>CTPS — série</label><input id="ctpsSerie"></div>

    <div class="section-label">Dados bancários <span class="opc">(pra pagamento de salário)</span></div>
    <div class="grid-2">
      <div class="field"><label>Banco</label><input id="banco"></div>
      <div class="field"><label>Tipo de conta</label>
        <select id="tipoConta"><option value="corrente">Corrente</option><option value="poupanca">Poupança</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Agência</label><input id="agencia"></div>
      <div class="field"><label>Conta</label><input id="conta"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Tipo de PIX</label>
        <select id="tipoPix"><option value="">—</option><option>CPF</option><option>CNPJ</option><option>E-mail</option><option>Telefone</option><option>Chave aleatória</option></select>
      </div>
      <div class="field"><label>Chave PIX</label><input id="chavePix"></div>
    </div>

    <div class="section-label">Sua senha de acesso</div>
    <div class="field"><label>Nova senha</label><input type="password" id="novaSenha" autocomplete="new-password"></div>
    <div class="field"><label>Repita a senha</label><input type="password" id="confirmarSenha" autocomplete="new-password"></div>

    <button class="btn btn-accent" id="btnSalvar">Concluir cadastro</button>
    <p class="hint">A diretoria consegue ver a sua senha dentro do sistema (é assim que o acesso funciona aqui). Escolha algo simples de lembrar — não precisa ser uma senha complexa. A diretoria pode conferir e corrigir os seus dados depois, se precisar.</p>
  `;
  let foto = '';
  function montarFoto(){
    const area = document.getElementById('areaFoto');
    area.innerHTML = `
      <div class="foto-linha">
        ${foto ? `<img src="${foto}" class="foto-avatar" alt="Sua foto">` : `<div class="foto-vazia" aria-label="Sem foto">${window.Icone ? Icone('usuario',{tam:30}) : 'Sem foto'}</div>`}
        <div class="foto-botoes">
          <input type="file" accept="image/*" id="inputAnexarFoto" style="display:none;">
          <input type="file" accept="image/*" capture="user" id="inputTirarFoto" style="display:none;">
          <button type="button" class="btn btn-ghost" id="btnAnexarFoto">${window.Icone ? Icone('imagem') : ''} Escolher foto</button>
          <button type="button" class="btn btn-ghost" id="btnTirarFoto">${window.Icone ? Icone('camera') : ''} Tirar foto</button>
          ${foto ? `<button type="button" class="btn btn-perigo-suave" id="btnRemoverFoto">${window.Icone ? Icone('lixeira') : ''} Remover</button>` : ''}
        </div>
      </div>
      <div class="muted" id="fotoStatus" role="status"></div>
    `;
    document.getElementById('btnAnexarFoto').addEventListener('click', ()=> document.getElementById('inputAnexarFoto').click());
    document.getElementById('btnTirarFoto').addEventListener('click', ()=> document.getElementById('inputTirarFoto').click());
    document.getElementById('inputAnexarFoto').addEventListener('change', e=> processarFoto(e.target.files[0]));
    document.getElementById('inputTirarFoto').addEventListener('change', e=> processarFoto(e.target.files[0]));
    const btnRemover = document.getElementById('btnRemoverFoto');
    if(btnRemover) btnRemover.addEventListener('click', ()=>{ foto = ''; montarFoto(); });
  }
  async function processarFoto(file){
    if(!file) return;
    const status = document.getElementById('fotoStatus');
    status.textContent = 'Enviando a foto…';
    try{
      const dataUrl = await readFileAsDataUrl(file);
      const nomeArquivo = 'funcionario_autocadastro_' + Date.now() + '.jpg';
      const resultado = await uploadFotoParaDrive(dataUrl, nomeArquivo);
      foto = resultado.url;
      status.textContent = '';
      montarFoto();
    }catch(e){
      console.error('erro ao enviar foto', e);
      status.textContent = 'Não foi possível enviar a foto. Tente outra foto ou continue sem ela — a diretoria pode adicionar depois.';
    }
  }
  montarFoto();

  let filhos = [];
  function desenharFilhos(){
    const area = document.getElementById('areaFilhos');
    if(document.getElementById('temFilhos').value!=='sim'){ area.innerHTML=''; filhos=[]; return; }
    if(filhos.length===0) filhos = [{ idade:'' }];
    area.innerHTML = `
      <div class="field curto"><label>Quantos filhos?</label><input type="number" min="1" max="20" id="qtdFilhos" value="${filhos.length}"></div>
      <div id="listaFilhos" class="grid-2"></div>
    `;
    function desenharLista(){
      document.getElementById('listaFilhos').innerHTML = filhos.map((f,i)=>`
        <div class="field"><label>Idade — filho(a) ${i+1}</label><input type="number" min="0" max="120" data-filhoidade="${i}" value="${f.idade||''}"></div>
      `).join('');
      document.querySelectorAll('[data-filhoidade]').forEach(el=> el.addEventListener('input', ()=>{ filhos[Number(el.dataset.filhoidade)].idade = el.value; }));
    }
    desenharLista();
    document.getElementById('qtdFilhos').addEventListener('input', e=>{
      const qtd = Math.max(1, Math.min(20, parseInt(e.target.value)||1));
      const atual = filhos.length;
      if(qtd > atual){ for(let i=atual;i<qtd;i++) filhos.push({ idade:'' }); }
      else if(qtd < atual){ filhos = filhos.slice(0, qtd); }
      desenharLista();
    });
  }
  document.getElementById('temFilhos').addEventListener('change', desenharFilhos);

  document.getElementById('btnSalvar').addEventListener('click', async ()=>{
    const val = id => document.getElementById(id).value.trim();
    const novaSenha = val('novaSenha');
    const confirmarSenha = val('confirmarSenha');
    document.getElementById('msgErro').classList.remove('show');
    if(!novaSenha){ mostrarErroForm('Digite a senha que você quer usar (no fim da página).'); return; }
    if(novaSenha !== confirmarSenha){ mostrarErroForm('As duas senhas estão diferentes. Digite a mesma senha nos dois campos.'); return; }
    const dados = {
      apelido: val('apelido'), cpf: val('cpf'), rg: val('rg'), dataNascimento: val('dataNascimento'), estadoCivil: val('estadoCivil'),
      celularParticular: val('celularParticular'), telefoneFixo: val('telefoneFixo'), celularLoja: val('celularLoja'),
      foto: foto,
      temFilhos: val('temFilhos'), filhos: val('temFilhos')==='sim' ? filhos : [],
      cep: val('cep'), cidade: val('cidade'), endereco: val('endereco'), numero: val('numero'), bairro: val('bairro'), estado: val('estado').toUpperCase(), complemento: val('complemento'),
      contatoEmergenciaNome: val('contatoEmergenciaNome'), contatoEmergenciaTelefone: val('contatoEmergenciaTelefone'),
      dataAdmissao: val('dataAdmissao'), tipoContrato: val('tipoContrato'), pis: val('pis'), ctpsNumero: val('ctpsNumero'), ctpsSerie: val('ctpsSerie'),
      banco: val('banco'), tipoConta: val('tipoConta'), agencia: val('agencia'), conta: val('conta'), tipoPix: val('tipoPix'), chavePix: val('chavePix'),
    };
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const resultado = await call({ op:'salvarCadastroCompleto', token, novaSenha, dados });
    btn.disabled = false; btn.textContent = 'Concluir cadastro';
    if(!resultado.ok){ mostrarErroForm(resultado.error || 'Não foi possível salvar o cadastro. Confira a internet e tente de novo.'); return; }
    document.getElementById('formArea').innerHTML = '';
    document.getElementById('subtitulo').textContent = 'Cadastro concluído';
    const ok = document.getElementById('msgOk');
    ok.textContent = 'Pronto! Seus dados foram salvos e a sua senha já está ativa. Você já pode fechar esta página e entrar no sistema.';
    ok.classList.add('show','msg-ok');
  });
})();
</script>
</body>
</html>
