<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete seu cadastro · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5; --ok:#1E7A46; --ok-soft:#E3F5EA;
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:var(--ink);}
.card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:560px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
h1{font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; margin:0 0 6px;}
.sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.section-label{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); border-bottom:1px solid var(--line); padding-bottom:6px; margin:22px 0 12px;}
.section-label:first-of-type{margin-top:4px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:480px){.grid-2{grid-template-columns:1fr;}}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
input, select{width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:#F7E9DA; color:var(--ink); font-size:14px; font-family:inherit;}
.btn{border:none; border-radius:9px; padding:12px 18px; font-size:14.5px; font-weight:700; width:100%; cursor:pointer; background:var(--gold); color:#fff; margin-top:6px;}
.btn:disabled{opacity:0.6; cursor:default;}
.msg{font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none;}
.msg.show{display:block;}
.msg-erro{background:var(--danger-soft); color:var(--danger);}
.msg-ok{background:var(--ok-soft); color:var(--ok);}
.hint{color:var(--ink-faint); font-size:12.5px; margin-top:14px; line-height:1.5;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="tag">Vilaça Joias · Gestão e Controle</div>
  <h1 id="titulo">Complete seu cadastro</h1>
  <p class="sub" id="subtitulo">Carregando...</p>
  <div class="msg" id="msgErro"></div>
  <div class="msg" id="msgOk"></div>
  <div id="formArea"></div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/funcionario-acesso";

async function call(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    return await res.json();
  }catch(e){ return { error: 'Não foi possível conectar. Verifique sua internet.' }; }
}

const realSupabaseClient = (window.supabase && typeof window.supabase.createClient==='function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFotoParaDrive(dataUrl, filename){
  if(!realSupabaseClient) throw new Error('upload indisponível');
  const { data, error } = await realSupabaseClient.functions.invoke('upload-foto-drive', {
    body: { dataUrl, filename, pasta:'funcionarios', tratar:false }
  });
  if(error) throw error;
  if(!data || !data.url) throw new Error('Resposta inválida do upload para o Drive');
  return data;
}

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function mostrarErro(msg){
  const el = document.getElementById('msgErro');
  el.textContent = msg; el.classList.add('show', 'msg-erro');
  document.getElementById('formArea').innerHTML = '';
}
function mostrarErroForm(msg){
  const el = document.getElementById('msgErro');
  el.textContent = msg; el.classList.add('show', 'msg-erro');
}

(async function init(){
  if(!token){
    document.getElementById('subtitulo').textContent = 'Link inválido.';
    mostrarErro('Esse link não tem um token válido. Peça um novo convite pra diretoria ou gerente.');
    return;
  }
  const r = await call({ op:'validarTokenCadastro', token });
  if(!r.valido){
    document.getElementById('subtitulo').textContent = 'Link inválido ou expirado.';
    mostrarErro(r.expirado ? 'Esse link expirou (validade de 1 dia). Peça um novo convite.' : 'Esse link não é válido, ou o cadastro já foi concluído antes.');
    return;
  }
  document.getElementById('subtitulo').textContent = `Olá, ${r.nome}! Preencha seus dados abaixo pra concluir seu cadastro.${r.cargo?(' Função: '+r.cargo+'.'):''}`;
  document.getElementById('formArea').innerHTML = `
    <div class="section-label" style="margin-top:4px;">Sua foto</div>
    <div id="areaFoto"></div>

    <div class="section-label">Como te chamamos</div>
    <div class="field"><label>Apelido <span style="text-transform:none; font-weight:500;">(como vai aparecer nas telas do sistema)</span></label><input id="apelido"></div>

    <div class="section-label">Dados pessoais</div>
    <div class="grid-2">
      <div class="field"><label>CPF</label><input id="cpf"></div>
      <div class="field"><label>RG</label><input id="rg"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Data de nascimento</label><input type="date" id="dataNascimento"></div>
      <div class="field"><label>Estado civil</label>
        <select id="estadoCivil"><option value="">—</option><option>Solteiro(a)</option><option>Casado(a)</option><option>Divorciado(a)</option><option>Viúvo(a)</option><option>União estável</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Celular particular</label><input id="celularParticular"></div>
      <div class="field"><label>Telefone fixo <span style="text-transform:none; font-weight:500;">(opcional)</span></label><input id="telefoneFixo"></div>
    </div>
    <div class="field"><label>Número celular profissional <span style="text-transform:none; font-weight:500;">(se for diferente do particular)</span></label><input id="celularLoja"></div>

    <div class="section-label">Endereço</div>
    <div class="grid-2">
      <div class="field"><label>CEP</label><input id="cep"></div>
      <div class="field"><label>Cidade</label><input id="cidade"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Endereço</label><input id="endereco"></div>
      <div class="field"><label>Número</label><input id="numero"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Bairro</label><input id="bairro"></div>
      <div class="field"><label>Estado (UF)</label><input id="estado" maxlength="2" style="text-transform:uppercase;"></div>
    </div>
    <div class="field"><label>Complemento <span style="text-transform:none; font-weight:500;">(opcional)</span></label><input id="complemento"></div>

    <div class="section-label">Filhos <span style="text-transform:none; font-weight:500;">(pra contabilidade avaliar Salário-Família)</span></div>
    <div class="field"><label>Tem filhos?</label>
      <select id="temFilhos"><option value="nao">Não</option><option value="sim">Sim</option></select>
    </div>
    <div id="areaFilhos"></div>

    <div class="section-label">Contato de emergência</div>
    <div class="grid-2">
      <div class="field"><label>Nome</label><input id="contatoEmergenciaNome"></div>
      <div class="field"><label>Telefone</label><input id="contatoEmergenciaTelefone"></div>
    </div>

    <div class="section-label">Dados profissionais</div>
    <div class="grid-2">
      <div class="field"><label>Data de admissão</label><input type="date" id="dataAdmissao"></div>
      <div class="field"><label>Tipo de contrato</label>
        <select id="tipoContrato"><option value="CLT">CLT</option><option value="PJ">PJ</option><option value="Estágio">Estágio</option><option value="Outro">Outro</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>PIS/PASEP</label><input id="pis"></div>
      <div class="field"><label>CTPS — número</label><input id="ctpsNumero"></div>
    </div>
    <div class="field" style="max-width:200px;"><label>CTPS — série</label><input id="ctpsSerie"></div>

    <div class="section-label">Dados bancários <span style="text-transform:none; font-weight:500;">(pra pagamento de salário)</span></div>
    <div class="grid-2">
      <div class="field"><label>Banco</label><input id="banco"></div>
      <div class="field"><label>Tipo de conta</label>
        <select id="tipoConta"><option value="corrente">Corrente</option><option value="poupanca">Poupança</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Agência</label><input id="agencia"></div>
      <div class="field"><label>Conta</label><input id="conta"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Tipo de PIX</label>
        <select id="tipoPix"><option value="">—</option><option>CPF</option><option>CNPJ</option><option>E-mail</option><option>Telefone</option><option>Chave aleatória</option></select>
      </div>
      <div class="field"><label>Chave PIX</label><input id="chavePix"></div>
    </div>

    <div class="section-label">Sua senha de acesso</div>
    <div class="field"><label>Nova senha</label><input type="password" id="novaSenha" autocomplete="new-password"></div>
    <div class="field"><label>Confirmar senha</label><input type="password" id="confirmarSenha" autocomplete="new-password"></div>

    <button class="btn" id="btnSalvar">Concluir cadastro</button>
    <p class="hint">Sua senha fica visível pra diretoria dentro do sistema (é assim que o acesso funciona aqui), então escolha algo simples de lembrar — não precisa ser uma senha complexa. Seus dados podem ser conferidos e ajustados depois pela diretoria, se precisar.</p>
  `;
  let foto = '';
  function montarFoto(){
    const area = document.getElementById('areaFoto');
    area.innerHTML = `
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
        ${foto ? `<img src="${foto}" style="width:84px; height:84px; border-radius:50%; object-fit:cover; border:1px solid var(--line);">` : `<div style="width:84px; height:84px; border-radius:50%; background:#F7E9DA; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:11px; text-align:center;">Sem foto</div>`}
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="file" accept="image/*" id="inputAnexarFoto" style="display:none;">
          <input type="file" accept="image/*" capture="user" id="inputTirarFoto" style="display:none;">
          <button type="button" class="btn" style="width:auto; background:var(--surface-2,#F7E9DA); color:var(--ink); border:1px solid var(--line);" id="btnAnexarFoto">📎 Anexar foto</button>
          <button type="button" class="btn" style="width:auto; background:var(--surface-2,#F7E9DA); color:var(--ink); border:1px solid var(--line);" id="btnTirarFoto">📷 Tirar foto</button>
          ${foto ? `<button type="button" class="btn" style="width:auto; background:var(--danger-soft); color:var(--danger); border:1px solid var(--line);" id="btnRemoverFoto">Remover</button>` : ''}
        </div>
      </div>
      <div class="muted" id="fotoStatus" style="margin-bottom:14px;"></div>
    `;
    document.getElementById('btnAnexarFoto').addEventListener('click', ()=> document.getElementById('inputAnexarFoto').click());
    document.getElementById('btnTirarFoto').addEventListener('click', ()=> document.getElementById('inputTirarFoto').click());
    document.getElementById('inputAnexarFoto').addEventListener('change', e=> processarFoto(e.target.files[0]));
    document.getElementById('inputTirarFoto').addEventListener('change', e=> processarFoto(e.target.files[0]));
    const btnRemover = document.getElementById('btnRemoverFoto');
    if(btnRemover) btnRemover.addEventListener('click', ()=>{ foto = ''; montarFoto(); });
  }
  async function processarFoto(file){
    if(!file) return;
    const status = document.getElementById('fotoStatus');
    status.textContent = 'Enviando foto...';
    try{
      const dataUrl = await readFileAsDataUrl(file);
      const nomeArquivo = 'funcionario_autocadastro_' + Date.now() + '.jpg';
      const resultado = await uploadFotoParaDrive(dataUrl, nomeArquivo);
      foto = resultado.url;
      status.textContent = '';
      montarFoto();
    }catch(e){
      console.error('erro ao enviar foto', e);
      status.textContent = 'Não foi possível enviar a foto. Você pode continuar sem ela e a diretoria adiciona depois.';
    }
  }
  montarFoto();

  let filhos = [];
  function desenharFilhos(){
    const area = document.getElementById('areaFilhos');
    if(document.getElementById('temFilhos').value!=='sim'){ area.innerHTML=''; filhos=[]; return; }
    if(filhos.length===0) filhos = [{ idade:'' }];
    area.innerHTML = `
      <div class="field" style="max-width:160px;"><label>Quantos filhos?</label><input type="number" min="1" max="20" id="qtdFilhos" value="${filhos.length}"></div>
      <div id="listaFilhos" class="grid-2"></div>
    `;
    function desenharLista(){
      document.getElementById('listaFilhos').innerHTML = filhos.map((f,i)=>`
        <div class="field"><label>Idade — filho(a) ${i+1}</label><input type="number" min="0" max="120" data-filhoidade="${i}" value="${f.idade||''}"></div>
      `).join('');
      document.querySelectorAll('[data-filhoidade]').forEach(el=> el.addEventListener('input', ()=>{ filhos[Number(el.dataset.filhoidade)].idade = el.value; }));
    }
    desenharLista();
    document.getElementById('qtdFilhos').addEventListener('input', e=>{
      const qtd = Math.max(1, Math.min(20, parseInt(e.target.value)||1));
      const atual = filhos.length;
      if(qtd > atual){ for(let i=atual;i<qtd;i++) filhos.push({ idade:'' }); }
      else if(qtd < atual){ filhos = filhos.slice(0, qtd); }
      desenharLista();
    });
  }
  document.getElementById('temFilhos').addEventListener('change', desenharFilhos);

  document.getElementById('btnSalvar').addEventListener('click', async ()=>{
    const val = id => document.getElementById(id).value.trim();
    const novaSenha = val('novaSenha');
    const confirmarSenha = val('confirmarSenha');
    document.getElementById('msgErro').classList.remove('show');
    if(!novaSenha){ mostrarErroForm('Escolha uma senha.'); return; }
    if(novaSenha !== confirmarSenha){ mostrarErroForm('As senhas não coincidem.'); return; }
    const dados = {
      apelido: val('apelido'), cpf: val('cpf'), rg: val('rg'), dataNascimento: val('dataNascimento'), estadoCivil: val('estadoCivil'),
      celularParticular: val('celularParticular'), telefoneFixo: val('telefoneFixo'), celularLoja: val('celularLoja'),
      foto: foto,
      temFilhos: val('temFilhos'), filhos: val('temFilhos')==='sim' ? filhos : [],
      cep: val('cep'), cidade: val('cidade'), endereco: val('endereco'), numero: val('numero'), bairro: val('bairro'), estado: val('estado').toUpperCase(), complemento: val('complemento'),
      contatoEmergenciaNome: val('contatoEmergenciaNome'), contatoEmergenciaTelefone: val('contatoEmergenciaTelefone'),
      dataAdmissao: val('dataAdmissao'), tipoContrato: val('tipoContrato'), pis: val('pis'), ctpsNumero: val('ctpsNumero'), ctpsSerie: val('ctpsSerie'),
      banco: val('banco'), tipoConta: val('tipoConta'), agencia: val('agencia'), conta: val('conta'), tipoPix: val('tipoPix'), chavePix: val('chavePix'),
    };
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const resultado = await call({ op:'salvarCadastroCompleto', token, novaSenha, dados });
    btn.disabled = false; btn.textContent = 'Concluir cadastro';
    if(!resultado.ok){ mostrarErroForm(resultado.error || 'Não foi possível salvar o cadastro.'); return; }
    document.getElementById('formArea').innerHTML = '';
    document.getElementById('subtitulo').textContent = 'Cadastro concluído!';
    const ok = document.getElementById('msgOk');
    ok.textContent = 'Pronto! Seus dados foram salvos e sua senha já está ativa. Já pode fechar esta página e entrar no sistema normalmente.';
    ok.classList.add('show','msg-ok');
  });
})();
</script>
</body>
</html>
