<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definir senha · Vilaça Joias</title>
<meta name="robots" content="noindex">
<script src="tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* Página pública de funcionário (link de convite). Cores só pelo sistema (tema.css). */
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px; font-family:var(--t-font); background:var(--t-bg); color:var(--ink);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px 28px 26px; max-width:400px; width:100%; box-shadow:var(--t-shadow-lg);}
.logo{width:112px; height:auto; display:block; margin:0 auto 18px; border-radius:10px;}
h1{font-size:21px; font-weight:700; letter-spacing:-.015em; margin:0 0 6px; text-align:center; color:var(--ink);}
.sub{color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 20px; text-align:center;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
input{width:100%; padding:11px 12px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink); font-size:15px;}
.btn{display:flex; align-items:center; justify-content:center; width:100%; border:1px solid transparent; border-radius:10px; padding:12px 16px; font-size:14.5px; font-weight:600; cursor:pointer; margin-top:6px;}
.msg{font-size:13.5px; line-height:1.5; padding:10px 12px; border-radius:10px; margin-bottom:14px; display:none;}
.msg.show{display:block;}
.msg-erro{background:var(--danger-soft); color:var(--danger);}
.msg-ok{background:var(--ok-soft); color:var(--ok); font-weight:600;}
.hint{color:var(--muted); font-size:12.5px; margin:14px 0 0; line-height:1.55;}
.rodape{margin-top:20px; text-align:center; font-size:12px; color:var(--muted);}
@media (max-width:480px){ .card{padding:28px 20px 22px; border-radius:20px;} }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="logo-vilaca.png" alt="Vilaça Joias">
  <h1 id="titulo">Definir senha</h1>
  <p class="sub" id="subtitulo">Conferindo o seu link…</p>
  <div class="msg" id="msgErro" role="alert"></div>
  <div class="msg" id="msgOk" role="status"></div>
  <div id="formArea"></div>
  <div class="rodape">Gestão e Controle · Grupo Vilaça Joias</div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/funcionario-acesso";

async function call(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    return await res.json();
  }catch(e){ return { error: 'Não foi possível conectar. Verifique sua internet.' }; }
}

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function mostrarErro(msg){
  const el = document.getElementById('msgErro');
  el.textContent = msg; el.classList.add('show', 'msg-erro');
  document.getElementById('formArea').innerHTML = '';
}

(async function init(){
  if(!token){
    document.getElementById('subtitulo').textContent = 'Link inválido.';
    mostrarErro('Este link está incompleto. Peça um novo convite à diretoria.');
    return;
  }
  const r = await call({ op:'validarToken', token });
  if(!r.valido){
    document.getElementById('subtitulo').textContent = 'Link inválido ou expirado.';
    mostrarErro(r.expirado ? 'Este link expirou. Peça um novo convite à diretoria.' : 'Este link não vale mais: a senha já foi definida ou o convite foi trocado. Se não consegue entrar, peça um novo convite à diretoria.');
    return;
  }
  document.getElementById('subtitulo').textContent = `Olá, ${r.nome}! Escolha a senha que você vai usar para entrar no sistema.`;
  document.getElementById('formArea').innerHTML = `
    <div class="field"><label for="novaSenha">Nova senha</label><input type="password" id="novaSenha" autocomplete="new-password"></div>
    <div class="field"><label for="confirmarSenha">Repita a senha</label><input type="password" id="confirmarSenha" autocomplete="new-password"></div>
    <button class="btn btn-accent" id="btnDefinir">Definir senha</button>
    <p class="hint">A diretoria consegue ver a sua senha dentro do sistema (é assim que o acesso funciona aqui). Escolha algo simples de lembrar — não precisa ser uma senha complexa.</p>
  `;
  document.getElementById('btnDefinir').addEventListener('click', async ()=>{
    const novaSenha = document.getElementById('novaSenha').value.trim();
    const confirmarSenha = document.getElementById('confirmarSenha').value.trim();
    const erroEl = document.getElementById('msgErro');
    erroEl.classList.remove('show');
    if(!novaSenha){ mostrarErro2('Digite a senha que você quer usar.'); return; }
    if(novaSenha !== confirmarSenha){ mostrarErro2('As duas senhas estão diferentes. Digite a mesma senha nos dois campos.'); return; }
    const btn = document.getElementById('btnDefinir');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const resultado = await call({ op:'definirSenha', token, novaSenha });
    btn.disabled = false; btn.textContent = 'Definir senha';
    if(!resultado.ok){ mostrarErro2(resultado.error || 'Não foi possível definir a senha. Tente de novo em alguns minutos.'); return; }
    document.getElementById('formArea').innerHTML = '';
    document.getElementById('subtitulo').textContent = 'Senha definida';
    const ok = document.getElementById('msgOk');
    ok.textContent = 'Pronto! Você já pode fechar esta página e entrar no sistema com o seu apelido e a nova senha.';
    ok.classList.add('show','msg-ok');
  });
  function mostrarErro2(msg){
    const el = document.getElementById('msgErro');
    el.textContent = msg; el.classList.add('show','msg-erro');
  }
})();
</script>
</body>
</html>
