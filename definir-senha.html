<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definir senha · Vilaça Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEEDF; --surface:#FFFFFF;
  --ink:#2B0F1F; --ink-soft:#4A1830; --ink-faint:#8A6A78; --muted:#7A5A68; --line:#EBD9C6;
  --gold:#662344; --gold-ink:#4A1830; --gold-soft:#FDD49E;
  --danger:#B3261E; --danger-soft:#FBE7E5; --ok:#1E7A46; --ok-soft:#E3F5EA;
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; background:radial-gradient(circle at 15% 10%, rgba(253,212,158,0.18), transparent 42%), linear-gradient(180deg,#2B0F1F,#3A1830); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:var(--ink);}
.card{background:var(--surface); border-radius:18px; padding:32px 28px; max-width:400px; width:100%; box-shadow:0 30px 70px -30px rgba(0,0,0,0.5);}
.tag{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px;}
h1{font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; margin:0 0 6px;}
.sub{color:var(--muted); font-size:13.5px; margin:0 0 18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px;}
input{width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:#F7E9DA; color:var(--ink); font-size:14px;}
.btn{border:none; border-radius:9px; padding:11px 18px; font-size:14px; font-weight:700; width:100%; cursor:pointer; background:var(--gold); color:#fff;}
.btn:disabled{opacity:0.6; cursor:default;}
.msg{font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none;}
.msg.show{display:block;}
.msg-erro{background:var(--danger-soft); color:var(--danger);}
.msg-ok{background:var(--ok-soft); color:var(--ok);}
.hint{color:var(--ink-faint); font-size:12.5px; margin-top:14px; line-height:1.5;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="tag">Vilaça Joias · Gestão e Controle</div>
  <h1 id="titulo">Definir senha</h1>
  <p class="sub" id="subtitulo">Carregando...</p>
  <div class="msg" id="msgErro"></div>
  <div class="msg" id="msgOk"></div>
  <div id="formArea"></div>
</div>

<script>
const SUPABASE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const GATEWAY_URL = SUPABASE_URL + "/functions/v1/funcionario-acesso";

async function call(body){
  try{
    const res = await fetch(GATEWAY_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    return await res.json();
  }catch(e){ return { error: 'Não foi possível conectar. Verifique sua internet.' }; }
}

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function mostrarErro(msg){
  const el = document.getElementById('msgErro');
  el.textContent = msg; el.classList.add('show', 'msg-erro');
  document.getElementById('formArea').innerHTML = '';
}

(async function init(){
  if(!token){
    document.getElementById('subtitulo').textContent = 'Link inválido.';
    mostrarErro('Esse link não tem um token válido. Peça um novo convite pra diretoria.');
    return;
  }
  const r = await call({ op:'validarToken', token });
  if(!r.valido){
    document.getElementById('subtitulo').textContent = 'Link inválido ou expirado.';
    mostrarErro(r.expirado ? 'Esse link expirou. Peça um novo convite pra diretoria.' : 'Esse link não é válido, ou a senha já foi definida antes.');
    return;
  }
  document.getElementById('subtitulo').textContent = `Olá, ${r.nome}! Escolha sua senha de acesso.`;
  document.getElementById('formArea').innerHTML = `
    <div class="field"><label>Nova senha</label><input type="password" id="novaSenha" autocomplete="new-password"></div>
    <div class="field"><label>Confirmar senha</label><input type="password" id="confirmarSenha" autocomplete="new-password"></div>
    <button class="btn" id="btnDefinir">Definir senha</button>
    <p class="hint">Sua senha fica visível pra diretoria dentro do sistema (é assim que o acesso funciona aqui), então escolha algo simples de lembrar — não precisa ser uma senha complexa.</p>
  `;
  document.getElementById('btnDefinir').addEventListener('click', async ()=>{
    const novaSenha = document.getElementById('novaSenha').value.trim();
    const confirmarSenha = document.getElementById('confirmarSenha').value.trim();
    const erroEl = document.getElementById('msgErro');
    erroEl.classList.remove('show');
    if(!novaSenha){ mostrarErro2('Escolha uma senha.'); return; }
    if(novaSenha !== confirmarSenha){ mostrarErro2('As senhas não coincidem.'); return; }
    const btn = document.getElementById('btnDefinir');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const resultado = await call({ op:'definirSenha', token, novaSenha });
    btn.disabled = false; btn.textContent = 'Definir senha';
    if(!resultado.ok){ mostrarErro2(resultado.error || 'Não foi possível definir a senha.'); return; }
    document.getElementById('formArea').innerHTML = '';
    document.getElementById('subtitulo').textContent = 'Senha definida!';
    const ok = document.getElementById('msgOk');
    ok.textContent = 'Pronto! Já pode fechar esta página e entrar no sistema normalmente com sua nova senha.';
    ok.classList.add('show','msg-ok');
  });
  function mostrarErro2(msg){
    const el = document.getElementById('msgErro');
    el.textContent = msg; el.classList.add('show','msg-erro');
  }
})();
</script>
</body>
</html>
