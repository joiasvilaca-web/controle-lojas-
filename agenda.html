<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="supabase-config.js"></script>
<script src="tema.js"></script>
<script src="busca.js"></script>
<script src="icones.js"></script>
<script src="formato.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="tema.css">
<style>

/* =====================================================================
   CHAT (atendimento.html) — repaginação 29/out: sistema visual 2.
   Cores SÓ por variáveis do tema (tema.css). Identidade das instâncias
   (Reforma = roxo, Vilaça = dourado) e cores dos tipos de tarefa da Agenda
   ficam definidas uma vez aqui, com versão para o tema escuro.
   ===================================================================== */
:root{
  --inst-reforma:#7B2D8E; --inst-vilaca:#9A7419;
  --tp-privada:#6D3FD1; --tp-loja:#0F766E; --tp-compartilhada:#B4480F;
  --bolha-in:var(--t-surface); --bolha-out:color-mix(in srgb, var(--t-primary) 12%, var(--t-surface));
  --chat-fundo:var(--t-bg);
}
html[data-theme=dark]{
  --inst-reforma:#C792D8; --inst-vilaca:#D8B65A;
  --tp-privada:#A98BF5; --tp-loja:#4FB8AA; --tp-compartilhada:#F0965E;
  --bolha-out:color-mix(in srgb, var(--t-primary) 20%, var(--t-surface));
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px;}
button,input,textarea,select{font-family:inherit;font-size:14px;}
button{cursor:pointer;}
.muted{color:var(--ink-faint);font-size:12.5px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ico{pointer-events:none;}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap;line-height:1.2;}
.btn-sm{min-height:30px;padding:4px 10px;font-size:12.5px;gap:5px;}
.btn-accent{background:var(--t-primary-strong);color:#fff;border-color:var(--t-primary-strong);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-icone{flex-shrink:0;}
.btn-icone.on{background:var(--accent-soft);color:var(--accent);border-color:var(--t-primary-line);}

/* ---------- estrutura ---------- */
.app{display:flex;height:100vh;height:100dvh;}
.lista{width:384px;min-width:320px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;}
.lista-top{padding:14px 14px 0;display:flex;flex-direction:column;gap:10px;}
.lt-l1{display:flex;align-items:center;gap:8px;}
.lt-l1 h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;margin-right:auto;}
.conexao{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);white-space:nowrap;}
.conexao::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;}
.conexao.on{background:var(--ok-soft);color:var(--ok);} .conexao.off{background:var(--danger-soft);color:var(--danger);}
.lt-l2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
.lt-l2 #btnNova{margin-left:auto;}
.on-off{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);}
.on-off .dot{width:8px;height:8px;border-radius:50%;background:var(--t-line-strong);}
.on-off.on{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb, var(--ok) 35%, transparent);}
.on-off.on .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent);}
#btnSom{position:relative;}
#btnSom.desligado{color:var(--ink-faint);}
#btnSom.desligado::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:currentColor;transform:rotate(-40deg);border-radius:2px;}
.lista-top .filtros-abas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0 -14px;padding:0 6px;overflow:visible;}
.busca-wrap{position:relative;}
.busca-wrap .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.busca{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);}
.busca-wrap .busca{padding-left:34px;}
.filtros-sel{display:flex;gap:6px;flex-wrap:nowrap;}
.filtros-sel .busca{flex:1 1 0;min-width:0;width:auto;font-size:13px;min-height:34px;padding:5px 8px;}
.filtros-sel:not(:has(select:not([style*="display: none"]):not([style*="display:none"]))){display:none;}
/* atalhos (ferramentas do chat) */
/* 13/11: ferramentas agrupadas num menu (Meu dia / Mensagens e contatos / Administração) + faixa "o que precisa de resposta" */
.lt-l1 .menu-ferr{left:auto;right:0;width:300px;max-width:calc(100vw - 24px);}
#filtroDep,#filtroCanal{display:none !important;}
.menu-ferr #btnSom::after{display:none;}
.menu-ferr #btnSom.desligado{color:var(--ink-faint);}
.lt-l1{flex-wrap:nowrap;gap:6px;}
.redes{display:flex;gap:2px;align-items:center;}
.lista-top .filtros-abas button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:8px 1px 10px;font-size:11px;font-weight:600;letter-spacing:-.01em;}
.lista-top .filtros-abas button .ti{display:flex;} .lista-top .filtros-abas button .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.lista-top .filtros-abas button .n{position:absolute;top:2px;left:calc(50% + 3px);right:auto;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;font-variant-numeric:tabular-nums;margin:0;}
.rede-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;transition:filter .15s,opacity .15s,box-shadow .15s;}
.rede-btn svg{width:24px;height:24px;display:block;}
.rede-btn:hover{background:var(--surface-2);}
.rede-btn.off{filter:grayscale(1);opacity:.5;}
.rede-btn[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft);}
.filtros-abas button .n:empty{display:none;}
.banner-cli{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--wait-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13px;}
.banner-cli.ok{background:var(--accent-soft);} .banner-cli .btn{margin-left:auto;}
.banner-cli b{font-weight:700;}
.sem-cad{background:var(--wait-soft);color:var(--wait);font-weight:700;}
.tk-topo{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);}
.tk-topo b{flex:1;font-size:14px;}
.tk-grupo{padding:10px 14px 4px;font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
.tk-grupo .n{min-width:18px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;}
.tk-grupo .n.neutro{background:var(--surface-2);color:var(--ink-faint);}
.tk-item{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.tk-item:hover{background:var(--t-hover);}
.tk-item .info{flex:1;min-width:0;} .tk-item .tt{font-weight:600;font-size:13.5px;} .tk-item.feito .tt{text-decoration:line-through;opacity:.6;}
.tk-item .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-faint);margin-top:2px;}
.tk-item select{min-height:32px;font-size:12.5px;max-width:112px;}
.tk-hoje{background:var(--danger-soft);color:var(--danger);font-weight:700;} .tk-atraso{background:var(--danger-soft);color:var(--danger);font-weight:700;}
.linha-ativo{display:none;} .linha-ativo.on{display:flex;}
.chip-f{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:4px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink-soft);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.chip-f .n{min-width:20px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);font-size:11.5px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums;}
.chip-f[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.chip-f[aria-pressed=true] .n{background:var(--accent);color:#fff;}
.chip-f.tem .n{background:var(--danger);color:#fff;}
.td-filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:8px 0 12px;}
.td-filtros .busca{min-height:38px;width:100%;}
.td-filtros .td-q{grid-column:1/-1;}
.td-info{font-size:12.5px;color:var(--ink-faint);margin:0 0 8px;}
.td-lista{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;}
.td-row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
.td-row .info{flex:1;min-width:0;} .td-row .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.td-row .nome{font-weight:700;font-size:14px;} .td-row .tel{font-size:12.5px;color:var(--ink-faint);}
.td-row .td-prev{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.td-row .meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:11.5px;color:var(--ink-faint);}
.td-row .acs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.st-chip{display:inline-flex;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink-soft);}
.st-chip.potencial{background:var(--wait-soft);color:var(--wait);} .st-chip.ativa{background:var(--accent-soft);color:var(--accent);} .st-chip.fim{background:var(--surface-2);color:var(--ink-faint);}
@media (max-width:700px){ .td-row{flex-wrap:wrap;} .td-row .acs{justify-content:flex-start;width:100%;} }
.mais-ferr{position:relative;}
.mais-ferr > .btn{position:relative;}
.mais-ferr > .btn .n{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;}
.mais-ferr > .btn .n:empty{display:none;}
.menu-ferr{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow-lg, 0 12px 32px rgba(0,0,0,.18));max-height:70vh;overflow:auto;}
.menu-ferr[hidden]{display:none;}
.menu-ferr .mf-grupo{padding:8px 10px 4px;font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;}
.menu-ferr .mf-grupo:first-child{padding-top:4px;}
.menu-ferr .mbtn{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;width:100%;min-height:40px;padding:6px 10px;font-size:13.5px;font-weight:500;letter-spacing:0;text-align:left;border-radius:8px;}
.menu-ferr .mbtn .ic{width:22px;height:22px;flex:0 0 auto;}
.menu-ferr .mbtn .n{position:static;margin-left:auto;}
.alertas-chat{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.alerta-chip{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-faint);text-align:left;cursor:pointer;font:inherit;}
.alerta-chip .ac-n{min-width:26px;height:26px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.alerta-chip .ac-t{font-size:12.5px;line-height:1.25;font-weight:700;}
.alerta-chip .ac-t small{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);}
.alerta-chip.tem{color:var(--ink);border-color:color-mix(in srgb, var(--danger) 45%, var(--line));background:var(--danger-soft);}
.alerta-chip.tem .ac-n{background:var(--danger);color:#fff;}
.alerta-chip.tem.coment{border-color:color-mix(in srgb, var(--wait) 50%, var(--line));background:var(--wait-soft);}
.alerta-chip.tem.coment .ac-n{background:var(--wait);color:#fff;}
.alerta-chip.ativo{outline:2px solid var(--accent);outline-offset:1px;}
.alerta-chip:hover{border-color:var(--accent);}
.conv.aguard .avatar::after{content:"";position:absolute;}
.conv.aguard{background:color-mix(in srgb, var(--danger) 5%, var(--surface));}
.conv.aguard .nome{font-weight:700;}
.conv.aguard .prev{color:var(--ink);font-weight:600;}
.conv .avatar{position:relative;overflow:visible;}
.conv .avatar img{border-radius:50%;}
.conv.aguard .avatar .ponto{position:absolute;right:-1px;top:-1px;width:13px;height:13px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.menu-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding-bottom:6px;}
.mbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;padding:4px 1px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:10.5px;letter-spacing:-.01em;font-weight:600;color:var(--ink-soft);line-height:1.15;text-align:center;transition:background-color .15s var(--t-ease),color .15s var(--t-ease);}
.mbtn .ic{display:flex;align-items:center;justify-content:center;width:30px;height:24px;color:var(--accent);}
.mbtn:hover{background:var(--surface-2);color:var(--ink);}
.mbtn .n{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;line-height:16px;}
.mbtn .n:empty{display:none;}
.fx{display:none;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;background:var(--accent-soft);color:var(--accent);}
.fx span{display:flex;align-items:center;gap:6px;}
.fx .btn{margin-left:auto;}
.resumo{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
.resumo span b{color:var(--ink);font-variant-numeric:tabular-nums;}
.conversas{flex:1;overflow-y:auto;border-top:1px solid var(--line);min-height:0;}
.lista-vazia{padding:28px 20px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.5;}
.lista-vazia b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px;}

/* ---------- item da lista ---------- */
.conv{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;position:relative;transition:background-color .12s;}
.conv:hover{background:var(--t-hover);}
.conv.active{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;font-size:14.5px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.conv .info{flex:1;min-width:0;}
.conv .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.conv .nome{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .hora{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums;}
.conv.nova .hora{color:var(--accent);font-weight:700;}
.conv.nova .nome{font-weight:700;}
.conv .l2{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px;}
.conv .prev{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;min-width:0;}
.conv .prev .ico{color:var(--ink-faint);}
.conv .quem{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-faint);margin-top:4px;line-height:1.4;}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0;font-variant-numeric:tabular-nums;}
html[data-theme=dark] .badge{background:var(--t-primary-strong);}
.tagchip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);border-radius:999px;padding:1px 8px;line-height:1.5;}
.tagchip.canal{background:transparent;border:1px solid var(--line-strong);}
.tagchip.tag-int{background:var(--t-info-soft);color:var(--info);}
.espera{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--wait-soft);color:var(--wait);}
.espera.alta{background:var(--danger-soft);color:var(--danger);}
/* identidade da instância: fundo levemente tingido na lista + marca d'água no chat */
.conv.inst-reforma{background:color-mix(in srgb, var(--inst-reforma) 6%, var(--surface));}
.conv.inst-vilaca{background:color-mix(in srgb, var(--inst-vilaca) 7%, var(--surface));}
.conv.inst-reforma.active{background:color-mix(in srgb, var(--inst-reforma) 14%, var(--surface));}
.conv.inst-vilaca.active{background:color-mix(in srgb, var(--inst-vilaca) 15%, var(--surface));}
.conv.inst-reforma .avatar{background:color-mix(in srgb, var(--inst-reforma) 14%, var(--surface));color:var(--inst-reforma);}
.conv.inst-vilaca .avatar{background:color-mix(in srgb, var(--inst-vilaca) 16%, var(--surface));color:var(--inst-vilaca);}
/* conversa interna e Grupo Vilaça na lista */
.conv.interno{background:color-mix(in srgb, var(--info) 6%, var(--surface));}
.conv.interno.active{background:color-mix(in srgb, var(--info) 13%, var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--info) 40%, transparent);}
.conv.interno .avatar{background:var(--t-info-soft);color:var(--info);}
.conv.interno.grupo{background:color-mix(in srgb, var(--ok) 6%, var(--surface));border-bottom:1px solid var(--line-strong);}
.conv.interno.grupo.active{background:color-mix(in srgb, var(--ok) 13%, var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ok) 40%, transparent);}
.conv.interno.grupo .avatar{background:var(--ok-soft);color:var(--ok);}
.conv.interno.grupo .tag-int{background:var(--ok-soft);color:var(--ok);}

/* ---------- área do chat ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat-fundo);position:relative;}
.chat.arrastando{outline:3px dashed var(--accent);outline-offset:-8px;}
.chat-vazio{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink-faint);text-align:center;}
.vazio-ilu{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.vazio-ilu .circ{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
.vazio-ilu b{color:var(--ink);font-size:16px;font-weight:700;}
.vazio-ilu p{margin:0;font-size:13px;line-height:1.5;}
.chat-vazio.painel{display:block;overflow:auto;text-align:left;padding:20px 24px;color:var(--ink);font-size:13.5px;background:var(--bg);}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);min-height:64px;}
.chat-head .avatar{width:40px;height:40px;font-size:13.5px;}
.chat-head .titulo{flex:1;min-width:0;display:flex;flex-direction:column;}
.chat-head .titulo b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.chat-head .titulo .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;}
.chat-head .acoes{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;}
.acoes .sep{width:1px;height:22px;background:var(--line);margin:0 4px;}
.mais-wrap{position:relative;}
.menu-mais{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:220px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--t-shadow-lg);display:flex;flex-direction:column;gap:2px;}
.menu-mais[hidden]{display:none;}
.menu-mais button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;text-align:left;}
.menu-mais button .ico{color:var(--ink-faint);}
.menu-mais button:hover{background:var(--surface-2);}
.menu-mais .mm-grupo{padding:8px 10px 4px;font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;}
.menu-mais .mm-grupo:first-child{padding-top:4px;}
.menu-mais button.perigo{color:var(--danger);} .menu-mais button.perigo .ico{color:var(--danger);}
.msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:6px;background:var(--chat-fundo);}
.msgs.inst-reforma,.msgs.inst-vilaca{background-repeat:no-repeat;background-position:center;background-size:min(70%,520px) auto;}
.msgs.inst-reforma{background-color:color-mix(in srgb, var(--inst-reforma) 3%, var(--bg));}
.msgs.inst-vilaca{background-color:color-mix(in srgb, var(--inst-vilaca) 4%, var(--bg));}
html[data-theme=dark] .msgs.inst-reforma, html[data-theme=dark] .msgs.inst-vilaca{background-blend-mode:normal;}
.bubble{max-width:min(68%,560px);padding:8px 12px 6px;border-radius:14px;font-size:14px;line-height:1.45;box-shadow:var(--t-shadow-sm);position:relative;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ink);}
.bubble.in{align-self:flex-start;background:var(--bolha-in);border-bottom-left-radius:4px;border:1px solid var(--line);}
.bubble.out{align-self:flex-end;background:var(--bolha-out);border-bottom-right-radius:4px;}
.bubble.sis{align-self:center;background:var(--surface-2);color:var(--ink-soft);font-size:12px;border-radius:999px;padding:4px 12px;max-width:90%;box-shadow:none;}
.bubble.interna{align-self:center;background:var(--wait-soft);color:var(--ink);border:1px dashed color-mix(in srgb, var(--wait) 55%, transparent);max-width:85%;box-shadow:none;}
.bubble.interna .autor{color:var(--wait);display:flex;align-items:center;gap:5px;}
.bubble .meta{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:10.5px;color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.bubble .meta .lida{color:var(--info);display:inline-flex;}
.bubble .meta .erro{color:var(--danger);display:inline-flex;}
.bubble .autor{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:1px;}
.bubble img{max-width:100%;max-height:340px;border-radius:8px;display:block;margin:2px 0;cursor:zoom-in;background:var(--surface-2);min-width:120px;min-height:80px;object-fit:cover;}
.bubble audio,.bubble video{max-width:100%;margin-top:4px;display:block;}
.bubble .doc{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;margin:2px 0;text-decoration:none;color:var(--ink);font-weight:600;}
.bubble .doc .ico{color:var(--accent);}
.bubble a.lnk{color:var(--info);word-break:break-all;}
.sep-dia{align-self:center;background:var(--surface);color:var(--ink-faint);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin:8px 0 4px;}
.mais-antigas{align-self:center;}
.aviso-bloqueado{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wait-soft);color:var(--wait);padding:10px 14px;font-size:13px;font-weight:600;text-align:center;border-top:1px solid var(--line);}
/* campo de mensagem */
.compose{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px;}
.compose .linha{display:flex;gap:8px;align-items:flex-end;}
.compose textarea{flex:1;min-height:42px;max-height:160px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:21px;background:var(--surface);color:var(--ink);resize:none;line-height:1.4;}
#btnAnexo,#btnInterna{width:42px;min-height:42px;height:42px;padding:0;border-radius:50%;}
#btnInterna.on{width:auto;padding:0 12px;border-radius:21px;background:var(--wait-soft);border-color:color-mix(in srgb, var(--wait) 55%, transparent);color:var(--wait);}
#texto.modo-interna{background:var(--wait-soft);border:1px dashed var(--wait);}
#btnEnviar{min-height:42px;border-radius:21px;padding:0 18px;}
.compose .atalhos-msg{display:flex;gap:6px;align-items:center;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;}
.compose .atalhos-msg::-webkit-scrollbar{display:none;}
.compose .atalhos-msg:not(:has(button:not([style*="none"]))){display:none;}
.compose .rapidas{display:flex;gap:6px;flex-wrap:nowrap;}
.compose .rapidas:empty{display:none;}
.compose .rapidas button{flex-shrink:0;font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;}
.compose .rapidas button:hover{border-color:var(--accent);color:var(--accent);}
.ia-bar{display:flex;gap:6px;flex-shrink:0;margin-left:auto;}
.ia-bar .btn{border-radius:999px;color:var(--accent);}
.compose textarea.ia-sug{border-color:var(--info);background:var(--t-info-soft);}
.sugestoes{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--surface);box-shadow:var(--t-shadow);}
.sugestoes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sugestoes button:last-child{border-bottom:0;}
.sugestoes button:hover,.sugestoes button:first-child{background:var(--accent-soft);}
.sugestoes button span{color:var(--ink-soft);}

/* ---------- conversa interna (abre na área do chat) ---------- */
.int-wrap{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 90px);min-height:380px;background:var(--surface);color:var(--ink);}
.int-wrap.solo{border:none;border-radius:0;height:100%;min-height:0;}
.chat-vazio.painel:has(> .int-wrap.solo){padding:0;overflow:hidden;display:flex;}
.chat-vazio.painel > .int-wrap.solo{flex:1;}
.int-conv{flex:1;display:flex;flex-direction:column;min-width:0;}
.int-conv .hd{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);min-height:64px;font-weight:700;}
.int-conv .hd .avatar{width:40px;height:40px;background:var(--t-info-soft);color:var(--info);}
.int-conv .hd .avatar.grupo{background:var(--ok-soft);color:var(--ok);}
.int-conv .hd .tt{flex:1;min-width:0;display:flex;flex-direction:column;}
.int-conv .hd .tt b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.int-conv .hd .sub{display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;}
.int-conv .ms{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:6px;background:var(--chat-fundo);}
.int-m{max-width:min(70%,560px);padding:7px 12px 6px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bolha-in);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start;box-shadow:var(--t-shadow-sm);color:var(--ink);}
.int-m.eu{align-self:flex-end;background:var(--bolha-out);border-color:transparent;border-bottom-left-radius:14px;border-bottom-right-radius:4px;}
.int-m .q{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px;}
.int-m.eu .q{color:var(--ink-faint);font-weight:500;}
.int-conv .cp{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--surface);}
.int-conv .cp textarea{flex:1;min-height:42px;max-height:140px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:21px;resize:none;background:var(--surface);color:var(--ink);line-height:1.4;}
.int-conv .cp .anx-btn{width:42px;height:42px;min-height:42px;border-radius:50%;padding:0;}
.int-conv .cp #intEnv{min-height:42px;border-radius:21px;padding:0 18px;}
.int-conv.arrastando .ms{outline:3px dashed var(--accent);outline-offset:-6px;}
.int-vazio{margin:auto;text-align:center;color:var(--ink-faint);font-size:13px;}
.int-m .anx-img{display:block;max-width:240px;max-height:240px;border-radius:8px;margin:4px 0;cursor:zoom-in;background:var(--surface-2);min-width:80px;min-height:60px;object-fit:cover;}
.int-m .anx-arq{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0;cursor:pointer;text-decoration:none;color:inherit;max-width:280px;}
.int-m .anx-arq .ico{color:var(--accent);}
.int-m .anx-arq b{display:block;font-size:12.5px;word-break:break-all;} .int-m .anx-arq small{color:var(--ink-faint);font-size:11px;}
#bannerInt{position:fixed;top:12px;right:12px;z-index:9999;max-width:340px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--t-shadow-lg);cursor:pointer;display:none;font-size:13.5px;animation:binS .25s var(--t-ease);}
#bannerInt b{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:12.5px;color:var(--info);}
@keyframes binS{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
/* popup de instância (ao assumir) */
.inst-pop{position:fixed;inset:0;background:rgba(8,20,30,.48);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;}
.inst-pop .c{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:var(--t-shadow-lg);}
.inst-pop .selo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb, var(--ic) 14%, var(--surface));color:var(--ic);margin-bottom:6px;}
.inst-pop .l{font-size:13px;color:var(--ink-faint);}
.inst-pop .n{font-size:21px;font-weight:700;color:var(--ic);margin:6px 0;letter-spacing:.01em;}
.inst-pop .d{font-size:14px;color:var(--ink-soft);line-height:1.5;}
.inst-pop button{margin-top:18px;min-height:40px;padding:0 28px;}

/* ---------- popups ---------- */
.modal-bg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-bg.show{display:flex;}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px;}
.modal.largo{max-width:1020px;}
.modal h2{margin:0 0 16px;font-size:19px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:28px;}
.modal h2 .muted{font-weight:500;font-size:12.5px;}
.modal h3{font-size:15px;}
.field{margin-bottom:14px;}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);}
.field textarea{min-height:64px;resize:vertical;font:inherit;}
.modal .rodape{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;}
.modal .rodape .btn-danger{margin-right:auto;}
.res-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface);}
.res-item .t{font-weight:600;font-size:13.5px;} .res-item .x{font-size:12px;color:var(--ink-soft);white-space:pre-wrap;}
.aviso-dup{display:flex;align-items:center;gap:6px;margin:6px 0;color:var(--wait);font-weight:600;font-size:12.5px;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 18px;border-radius:10px;font-size:13.5px;display:none;z-index:99;max-width:calc(100% - 32px);text-align:center;}
.zoom{position:fixed;inset:0;background:rgba(5,12,18,.88);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;}
.zoom img{max-width:95vw;max-height:95vh;border-radius:8px;}
.previa{text-align:center;margin-bottom:12px;padding:12px;background:var(--surface-2);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
.previa img{max-width:100%;max-height:260px;border-radius:8px;}
.tag-sug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tag-sug .muted{width:100%;}
.tag-sug button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);}
.tag-sug button.on{background:var(--t-primary-strong);color:#fff;border-color:var(--t-primary-strong);}
.tag-sug .cor{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cor-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;}
.cartao{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);}
.cartao .t{font-weight:600;font-size:14px;} .cartao .x{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.cartao .acoes-l{display:flex;gap:4px;flex-shrink:0;align-items:center;}
.selo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;vertical-align:1px;}
.selo.ok{background:var(--ok-soft);color:var(--ok);} .selo.wait{background:var(--wait-soft);color:var(--wait);}
.selo.danger{background:var(--danger-soft);color:var(--danger);} .selo.info{background:var(--t-info-soft);color:var(--info);}
.selo.accent{background:var(--accent-soft);color:var(--accent);}
.hor-dia{display:grid;grid-template-columns:110px 1fr 1fr;gap:6px;align-items:center;margin-bottom:4px;font-size:13px;}
.hor-dia input[type=time]{padding:5px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);}
.dep-chk{display:flex;gap:6px 14px;flex-wrap:wrap;} .dep-chk label{font-weight:400;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);}
.sec{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;background:var(--surface);}
.sec>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;background:var(--surface-2);}
.sec>div{padding:14px 16px;}
.lin{display:grid;grid-template-columns:56px 1fr 1fr 36px;gap:6px;margin-bottom:6px;align-items:center;}
.lin input,.lin select{width:100%;min-height:36px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);}
.kw{border:1px dashed var(--line-strong);border-radius:10px;padding:10px;margin-bottom:8px;}
.kw input,.kw textarea,.kw select{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);}
.kw textarea{width:100%;min-height:60px;}
.prev{white-space:pre-wrap;background:color-mix(in srgb, var(--ok) 13%, var(--surface));color:var(--ink);border-radius:12px;border-top-left-radius:4px;padding:10px 12px;font-size:13px;max-width:380px;}
.conv .prev{background:none;padding:0;border-radius:0;max-width:none;}
.tb{width:100%;border-collapse:collapse;font-size:13px;}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;}
.tb th{font-size:11px;background:var(--surface-2);white-space:nowrap;}
.tb td.num,.tb th.num{text-align:right;}
.tb td.acoes-td{white-space:nowrap;text-align:right;}
.tb tr.atrasado td{background:var(--danger-soft);}
.ia-res{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin-bottom:12px;}
.ia-res b{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:3px;}
.ia-k{display:block;}
.ia-k .x{white-space:pre-wrap;max-height:4.5em;overflow:hidden;}
.ia-pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--surface-2);color:var(--ink-soft);}
.ia-pill.ap{background:var(--t-info-soft);color:var(--info);} .ia-pill.off{background:var(--danger-soft);color:var(--danger);}
.ia-sw{display:flex;gap:8px;align-items:flex-start;font-weight:400!important;margin-bottom:10px;font-size:13.5px;}
.ia-sw span{display:block;} .ia-sw small{color:var(--ink-faint);display:block;}
.aviso-txt{display:flex;align-items:flex-start;gap:6px;color:var(--wait);}
.erro-txt{color:var(--danger);}
.filtro-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
.filtro-linha .field{margin:0;}

/* ---------- painel de atendimento ---------- */
.pn{max-width:1100px;margin:0 auto;}
.pn-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}
.pn-head .tt{display:flex;align-items:flex-start;gap:8px;}
.pn-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;}
.pn-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13px;}
.pn-upd{font-size:12px;color:var(--ink-faint);white-space:nowrap;display:flex;gap:6px;align-items:center;}
.pn-sec{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:20px 0 8px;}
.pn-secflex{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pn-secflex .busca{width:auto;min-height:32px;padding:4px 8px;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:500;}
.pn-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.pn-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--t-shadow-sm);}
.pn-card.cl{cursor:pointer;transition:box-shadow .15s var(--t-ease),border-color .15s var(--t-ease);}
.pn-card.cl:hover{box-shadow:var(--t-shadow);border-color:var(--line-strong);}
.pn-card.alerta{border-color:color-mix(in srgb, var(--c) 45%, var(--line));background:color-mix(in srgb, var(--c) 5%, var(--surface));}
.pn-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--c) 13%, var(--surface));color:var(--c);flex-shrink:0;}
.pn-v{font-size:24px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;} .pn-v small{font-size:12.5px;color:var(--ink-faint);font-weight:600;}
.pn-r{font-weight:600;font-size:13px;margin-top:4px;} .pn-e{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.pn-lojas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.pn-loja{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.pn-loja .pn-lt{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:700;}
.pn-loja .pn-lt::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);}
.pn-lojan{display:flex;gap:14px;margin-top:6px;font-size:12.5px;color:var(--ink-soft);} .pn-lojan b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;}
.pn-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.pn-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;box-shadow:var(--t-shadow-sm);} .pn-cols .pn-box{margin-top:0;}

<body>
<main class="ag-pagina">
  <div class="ag-wrap" id="agWrap">
    <div class="ag-top">
      <h2>Agenda</h2>
      <div class="ag-abas" role="tablist" id="agAbas"></div>
      <button class="btn-icone" id="agAtualizar" title="Atualizar a agenda" aria-label="Atualizar a agenda"></button>
      <button class="btn btn-sm btn-accent" id="agNova"></button>
    </div>
    <div class="ag-resumo" id="agResumo"></div>
    <div id="agCorpo"><p class="muted" id="agAviso">Carregando a agenda…</p></div>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>
<script>
const SUPABASE_URL = window.SUPABASE_URL, SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
const EMBEDDED = window.parent !== window;
let __gatewaySenha = null, currentUser = null;
const estado = {};
function mensagemConfiavel(ev){ try{ if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false; return true; }catch(e){ return false; } }
function icn(nome, o){ try{ return window.Icone ? Icone(nome, o) : ''; }catch(e){ return ''; } }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._x); t._x=setTimeout(()=>t.style.display='none',3200); }
function abrirModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function fecharModal(){ document.getElementById('modalBg').classList.remove('show'); document.getElementById('modalBox').classList.remove('largo'); }
const brl = v => (window.Fmt && Fmt.brl) ? Fmt.brl(v) : 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ',');
/* ================= AGENDA: tarefas (quadro), calendário, minhas vias e assistente =================
 * Tarefas ficam na tabela agenda_tarefas, sempre pela Edge Function agenda-tarefas, que decide
 * quem enxerga cada uma: privada (só quem criou), loja (gerente e diretoria também) ou
 * compartilhada (quem criou + quem recebeu). */
const TAREFAS_URL = SUPABASE_URL + "/functions/v1/agenda-tarefas";
async function tarefasApi(body){
  try{ const res = await fetch(TAREFAS_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY }, body: JSON.stringify({ senha: __gatewaySenha, ...body }) }); return await res.json(); }
  catch(e){ return { error:'Falha de conexão' }; }
}
const AG_TIPOS = { privada:{ nome:'Privada', desc:'Só você vê' }, loja:{ nome:'Loja', desc:'Gerente e diretoria também veem' }, compartilhada:{ nome:'Compartilhada', desc:'Você e quem você escolher' } };
const AG_CLASSES = { urgente:'Urgente', importante:'Importante', normal:'Normal', baixa:'Baixa' };
const AG_COLUNAS = [ ['a_fazer','A fazer'], ['fazendo','Fazendo'], ['feito','Feito'] ];
const AG_VIA = { orcamento:{ nome:'Orçamento', alvo:'orcamentos' }, venda:{ nome:'Venda', alvo:'pdv' }, pedido:{ nome:'Pedido', alvo:'os' } };
estado.ag = { aba:'quadro', ini:null, tarefas:[], lembretes:[], vias:null, viasErro:null, filtroTipo:'', filtroCls:'', viaTipo:'', viaBusca:'', mes:null, mostrarVias:true };

function agDataISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function agFmtData(s){ if(!s) return ''; const [y,m,d] = String(s).slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function agNomePessoa(id){ const p = ((estado.ag.ini||{}).pessoas||[]).find(x=>x.id===id); return p ? p.nome : (id===((estado.ag.ini||{}).me||{}).id ? 'Você' : '—'); }
function agNomeLoja(id){ const l = ((estado.ag.ini||{}).lojas||[]).find(x=>x.id===id); return l ? l.nome : (id||''); }

async function agCarregar(forcarVias){
  if(!estado.ag.ini){
    const r = await tarefasApi({ op:'init' });
    if(!r || !r.ok){ agErro((r && r.error) || 'Não consegui abrir a agenda.'); return; }
    estado.ag.ini = r;
  }
  const [t, l] = await Promise.all([ tarefasApi({ op:'listar' }), tarefasApi({ op:'lembretes' }) ]);
  if(!t || !t.ok){ agErro((t && t.error) || 'Não consegui carregar as tarefas.'); return; }
  estado.ag.tarefas = t.data || [];
  estado.ag.lembretes = (l && l.ok && l.data) || [];
  if(forcarVias || (estado.ag.aba==='vias' && !estado.ag.vias)) await agCarregarVias(true);
  agRender();
}
async function agCarregarVias(semRender){
  const r = await tarefasApi({ op:'minhasVias' });
  if(r && r.ok){ estado.ag.vias = r.data || []; estado.ag.viasErro = null; estado.ag.viasOficina = !!r.oficina; }
  else { estado.ag.vias = []; estado.ag.viasErro = (r && r.error) || 'Não consegui buscar suas vias.'; }
  if(!semRender) agRender();
}
function agErro(msg){ const c = document.getElementById('agCorpo'); if(c) c.innerHTML = `<div class="lista-vazia"><b>${escapeHtml(msg)}</b>Confira a internet e clique em atualizar (botão ao lado de Nova tarefa).</div>`; }
function agRender(){
  const c = document.getElementById('agCorpo'); if(!c) return;
  const a = estado.ag.aba;
  if(a==='quadro') agRenderQuadro(c);
  else if(a==='calendario') agRenderCalendario(c);
  else agRenderVias(c);
}
function agLegenda(){
  return `<div class="ag-legenda">${Object.entries(AG_TIPOS).map(([k,t])=>`<span class="t-${k}"><i style="background:var(--tc)"></i>${t.nome}</span>`).join('')}</div>`;
}

/* ---------- Quadro (estilo Trello) ---------- */
function agCardHtml(t){
  const meId = ((estado.ag.ini||{}).me||{}).id;
  const quem = t.tipo==='loja' ? agNomeLoja(t.loja_id)
    : t.tipo==='compartilhada' ? (t.criador_id===meId ? 'Com '+(t.participantes||[]).map(agNomePessoa).join(', ') : 'De '+(t.criador_nome||'—'))
    : '';
  const i = AG_COLUNAS.findIndex(c=>c[0]===t.coluna);
  return `<div class="ag-card t-${t.tipo} ${t.coluna==='feito'?'feito':''}" draggable="true" data-agid="${escapeHtml(t.id)}">
    <div class="ag-tt">${escapeHtml(t.titulo)}</div>
    ${t.descricao?`<div class="ag-ds">${escapeHtml(t.descricao)}</div>`:''}
    <div class="ag-meta">
      <span class="ag-tag">${AG_TIPOS[t.tipo].nome}</span>
      ${t.origem==='chat'?`<span class="ag-chat" title="Esta tarefa foi criada numa conversa do CHAT">${icn('mensagem',{tam:12})}CHAT</span>`:''}
      ${t.classificacao!=='normal'?`<span class="ag-cls c-${t.classificacao}">${AG_CLASSES[t.classificacao]}</span>`:''}
      ${t.data?`<span class="dt">${icn('calendario',{tam:12})}${agFmtData(t.data)}${t.hora?' '+escapeHtml(t.hora):''}</span>`:''}
      ${quem?`<span>${escapeHtml(quem)}</span>`:''}
    </div>
    <div class="ag-mv">
      ${t.conversa_ativa?`<button type="button" data-agconv="${escapeHtml(t.conversa_id)}" title="A conversa ainda está ativa: abrir no CHAT">${icn('mensagem',{tam:12})}Ir para a conversa</button>`:''}
      ${i>0?`<button type="button" data-agmv="${escapeHtml(t.id)}" data-col="${AG_COLUNAS[i-1][0]}" title="Voltar para ${AG_COLUNAS[i-1][1]}">${icn('esquerda',{tam:12})}${AG_COLUNAS[i-1][1]}</button>`:''}
      ${i<AG_COLUNAS.length-1?`<button type="button" data-agmv="${escapeHtml(t.id)}" data-col="${AG_COLUNAS[i+1][0]}" title="Passar para ${AG_COLUNAS[i+1][1]}">${AG_COLUNAS[i+1][1]}${icn('direita',{tam:12})}</button>`:''}
    </div>
  </div>`;
}
function agRenderQuadro(c){
  const f = estado.ag;
  const lista = f.tarefas.filter(t=> (!f.filtroTipo || t.tipo===f.filtroTipo) && (!f.filtroCls || t.classificacao===f.filtroCls));
  const ordemCls = { urgente:0, importante:1, normal:2, baixa:3 };
  c.innerHTML = `
    <div class="ag-filtros" style="margin-bottom:10px;">
      ${[['','Todas'],['privada','Privadas'],['loja','Loja'],['compartilhada','Compartilhadas']].map(([k,n])=>`<button type="button" class="ag-chip ${f.filtroTipo===k?'on':''}" data-agft="${k}">${n}</button>`).join('')}
      <select class="busca" id="agFiltroCls" aria-label="Filtrar por classificação"><option value="">Toda classificação</option>${Object.entries(AG_CLASSES).map(([k,n])=>`<option value="${k}" ${f.filtroCls===k?'selected':''}>${n}</option>`).join('')}</select>
      ${agLegenda()}
    </div>
    <div class="ag-quadro">
      ${AG_COLUNAS.map(([col,nome])=>{
        const itens = lista.filter(t=>t.coluna===col).sort((a,b)=> col==='feito' ? 0 : (ordemCls[a.classificacao]-ordemCls[b.classificacao]) || (a.ordem-b.ordem));
        return `<div class="ag-col" data-agcol="${col}"><h3><span>${nome}</span><span>${itens.length}</span></h3>${itens.map(agCardHtml).join('') || '<div class="ag-vazio">Arraste uma tarefa para cá</div>'}</div>`;
      }).join('')}
    </div>
    ${!f.tarefas.length?`<p class="muted" style="margin-top:12px;">Nenhuma tarefa ainda. Clique em <b>Nova tarefa</b> para criar a primeira.</p>`:''}`;
  c.querySelectorAll('[data-agft]').forEach(b=> b.onclick = ()=>{ f.filtroTipo = b.dataset.agft; agRender(); });
  document.getElementById('agFiltroCls').onchange = e=>{ f.filtroCls = e.target.value; agRender(); };
  c.querySelectorAll('.ag-card').forEach(el=>{
    el.addEventListener('click', e=>{ if(e.target.closest('[data-agmv],[data-agconv]')) return; agEditar(f.tarefas.find(t=>t.id===el.dataset.agid)); });
    el.addEventListener('dragstart', e=>{ el.classList.add('arrastando'); e.dataTransfer.setData('text/plain', el.dataset.agid); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', ()=> el.classList.remove('arrastando'));
  });
  c.querySelectorAll('[data-agmv]').forEach(b=> b.onclick = ()=> agMover(b.dataset.agmv, b.dataset.col));
  c.querySelectorAll('[data-agconv]').forEach(b=> b.onclick = ()=>{ if(EMBEDDED) parent.postMessage({ type:'irParaModulo', modulo:'agenda', alvo:'atendimento', registroId:b.dataset.agconv }, '*'); });
  c.querySelectorAll('.ag-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('sobre'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('sobre'));
    col.addEventListener('drop', e=>{ e.preventDefault(); col.classList.remove('sobre'); const id = e.dataTransfer.getData('text/plain'); if(id) agMover(id, col.dataset.agcol); });
  });
}
async function agMover(id, coluna){
  const t = estado.ag.tarefas.find(x=>x.id===id); if(!t || t.coluna===coluna) return;
  const antes = t.coluna; t.coluna = coluna; agRender(); // otimista
  const ordem = Math.max(0, ...estado.ag.tarefas.filter(x=>x.coluna===coluna && x.id!==id).map(x=>Number(x.ordem)||0)) + 1;
  const r = await tarefasApi({ op:'mover', id, coluna, ordem });
  if(!r || !r.ok){ t.coluna = antes; agRender(); showToast((r && r.error) || 'Não consegui mover.'); return; }
  Object.assign(t, r.data); agRender();
}

/* ---------- Formulário da tarefa ---------- */
function agEditar(t, dataPadrao){
  const ini = estado.ag.ini || {}; const me = ini.me || {};
  const nova = !t;
  t = t || { tipo:'privada', classificacao:'normal', coluna:'a_fazer', participantes:[], data: dataPadrao || '', loja_id: (me.lojas||[])[0] || ((ini.lojas||[])[0]||{}).id || '' };
  const souCriador = nova || t.criador_id===me.id;
  abrirModal(`<h2>${nova?'Nova tarefa':'Tarefa'}</h2>
    ${!souCriador?`<p class="muted" style="margin:-6px 0 10px;">Criada por <b>${escapeHtml(t.criador_nome||'—')}</b>. Você pode mudar o andamento e os detalhes; quem enxerga a tarefa só quem criou muda.</p>`:''}
    <div class="field"><label>Título</label><input id="agfTitulo" maxlength="200" value="${escapeHtml(t.titulo||'')}" placeholder="Ex.: Ligar para a cliente da O.S. MC12P"></div>
    <div class="field"><label>Detalhes</label><textarea id="agfDesc" rows="3" maxlength="4000" placeholder="Opcional">${escapeHtml(t.descricao||'')}</textarea></div>
    <div class="field"><label>Quem vê</label><div class="ag-tipo-op" id="agfTipo">
      ${Object.entries(AG_TIPOS).map(([k,x])=>`<label class="t-${k} ${t.tipo===k?'on':''}"><input type="radio" name="agfTipo" value="${k}" ${t.tipo===k?'checked':''} ${souCriador?'':'disabled'}><b>${x.nome}</b>${x.desc}</label>`).join('')}
    </div></div>
    <div class="field" id="agfLojaBox"><label>Loja</label><select id="agfLoja" ${souCriador?'':'disabled'}>${(ini.lojas||[]).map(l=>`<option value="${escapeHtml(l.id)}" ${l.id===t.loja_id?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select></div>
    <div class="field" id="agfPessoasBox"><label>Compartilhar com</label><div class="ag-pessoas">
      ${(ini.pessoas||[]).map(p=>`<label><input type="checkbox" value="${escapeHtml(p.id)}" ${(t.participantes||[]).includes(p.id)?'checked':''} ${souCriador?'':'disabled'}> ${escapeHtml(p.nome)}</label>`).join('') || '<span class="muted">Nenhuma outra pessoa cadastrada.</span>'}
    </div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">
      <div class="field"><label>Classificação</label><select id="agfCls">${Object.entries(AG_CLASSES).map(([k,n])=>`<option value="${k}" ${t.classificacao===k?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label>Andamento</label><select id="agfCol">${AG_COLUNAS.map(([k,n])=>`<option value="${k}" ${t.coluna===k?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label>Data</label><input type="date" id="agfData" value="${escapeHtml(t.data||'')}"></div>
      <div class="field"><label>Hora</label><input type="time" id="agfHora" value="${escapeHtml(t.hora||'')}"></div>
    </div>
    <p class="muted erro-txt" id="agfErro" style="display:none;margin:4px 0 0;"></p>
    <div class="rodape">
      ${!nova && t.posso_excluir?`<button class="btn btn-danger" id="agfExcluir" style="margin-right:auto;">Excluir</button>`:''}
      <button class="btn" id="agfCancelar">Cancelar</button><button class="btn btn-accent" id="agfSalvar">Salvar</button>
    </div>`);
  const tipoAtual = ()=> (document.querySelector('input[name="agfTipo"]:checked')||{}).value || 'privada';
  const pintarTipo = ()=>{
    const tp = tipoAtual();
    document.querySelectorAll('#agfTipo label').forEach(l=> l.classList.toggle('on', l.querySelector('input').value===tp));
    document.getElementById('agfLojaBox').style.display = tp==='loja' ? '' : 'none';
    document.getElementById('agfPessoasBox').style.display = tp==='compartilhada' ? '' : 'none';
  };
  document.querySelectorAll('input[name="agfTipo"]').forEach(r=> r.onchange = pintarTipo); pintarTipo();
  document.getElementById('agfCancelar').onclick = fecharModal;
  const ex = document.getElementById('agfExcluir');
  if(ex) ex.onclick = async ()=>{
    if(ex.dataset.confirma!=='1'){ ex.dataset.confirma='1'; ex.textContent='Confirmar exclusão'; return; }
    const r = await tarefasApi({ op:'excluir', id:t.id });
    if(!r || !r.ok){ showToast((r && r.error) || 'Não consegui excluir.'); return; }
    estado.ag.tarefas = estado.ag.tarefas.filter(x=>x.id!==t.id); fecharModal(); agRender(); showToast('Tarefa excluída');
  };
  document.getElementById('agfSalvar').onclick = async ()=>{
    const tarefa = {
      id: t.id || undefined,
      titulo: document.getElementById('agfTitulo').value.trim(),
      descricao: document.getElementById('agfDesc').value.trim(),
      tipo: tipoAtual(),
      loja_id: document.getElementById('agfLoja').value,
      participantes: [...document.querySelectorAll('#agfPessoasBox input:checked')].map(x=>x.value),
      classificacao: document.getElementById('agfCls').value,
      coluna: document.getElementById('agfCol').value,
      data: document.getElementById('agfData').value || null,
      hora: document.getElementById('agfHora').value || null,
      concluida_em: t.concluida_em || undefined,
    };
    const erro = document.getElementById('agfErro');
    const r = await tarefasApi({ op:'salvar', tarefa });
    if(!r || !r.ok){ erro.textContent = (r && r.error) || 'Não consegui salvar.'; erro.style.display='block'; return; }
    const salvo = { ...r.data, posso_excluir: nova ? true : t.posso_excluir };
    const i = estado.ag.tarefas.findIndex(x=>x.id===salvo.id);
    if(i>=0) estado.ag.tarefas[i] = salvo; else estado.ag.tarefas.push(salvo);
    fecharModal(); agRender(); showToast(nova ? 'Tarefa criada' : 'Tarefa salva');
  };
  document.getElementById('agfTitulo').focus();
}

/* ---------- Calendário: tarefas + lembretes + minhas vias ---------- */
function agEventosDoDia(iso){
  const ev = [];
  estado.ag.tarefas.filter(t=>t.data===iso).sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||''))).forEach(t=> ev.push({ cls:`t-${t.tipo} ${t.coluna==='feito'?'feito':''}`, txt:(t.hora?t.hora+' ':'')+t.titulo, tarefa:t.id }));
  estado.ag.lembretes.forEach(l=>{ const d = new Date(l.disparar_em); if(agDataISO(d)===iso) ev.push({ cls:'lemb', txt:'Lembrete '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' '+(l.descricao||'') }); });
  if(estado.ag.mostrarVias) (estado.ag.vias||[]).forEach(v=>{
    const dia = v.tipo==='orcamento' ? v.validade : v.data;
    if(dia===iso && v.status!=='entregue' && v.status!=='cancelada' && v.status!=='cancelado') ev.push({ cls:'via', txt:(v.tipo==='pedido'?'Entrega ':v.tipo==='orcamento'?'Vence ':'Venda ')+(v.codigoVia||'')+' '+(v.cliente||''), via:v });
  });
  return ev;
}
function agRenderCalendario(c){
  const hoje = new Date();
  if(!estado.ag.mes) estado.ag.mes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const m = estado.ag.mes;
  const inicio = new Date(m.getFullYear(), m.getMonth(), 1 - m.getDay());
  const dias = []; for(let i=0;i<42;i++){ const d = new Date(inicio); d.setDate(inicio.getDate()+i); dias.push(d); }
  const hojeIso = agDataISO(hoje);
  c.innerHTML = `
    <div class="ag-cal-top" style="margin-bottom:8px;">
      <button class="btn-icone" id="agMesAnt" title="Mês anterior" aria-label="Mês anterior">${icn('esquerda',{tam:18})}</button><b>${(t=>t.charAt(0).toUpperCase()+t.slice(1))(m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</b><button class="btn-icone" id="agMesProx" title="Próximo mês" aria-label="Próximo mês">${icn('direita',{tam:18})}</button>
      <button class="btn btn-sm" id="agMesHoje">Hoje</button>
      <label><input type="checkbox" id="agMostrarVias" ${estado.ag.mostrarVias?'checked':''}> Mostrar minhas vias</label>
      ${agLegenda()}
    </div>
    <div class="ag-cal">
      ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${dias.map(d=>{
        const iso = agDataISO(d); const ev = agEventosDoDia(iso);
        return `<div class="ag-dia ${d.getMonth()!==m.getMonth()?'fora':''} ${iso===hojeIso?'hoje':''}" data-agdia="${iso}" title="Clique para criar uma tarefa neste dia">
          <span class="n">${d.getDate()}</span>
          ${ev.slice(0,3).map((e,i)=>`<span class="ag-ev ${e.cls}" data-agev="${i}" title="${escapeHtml(e.txt)}">${escapeHtml(e.txt)}</span>`).join('')}
          ${ev.length>3?`<span class="ag-mais">+${ev.length-3} mais</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  document.getElementById('agMesAnt').onclick = ()=>{ estado.ag.mes = new Date(m.getFullYear(), m.getMonth()-1, 1); agRender(); };
  document.getElementById('agMesProx').onclick = ()=>{ estado.ag.mes = new Date(m.getFullYear(), m.getMonth()+1, 1); agRender(); };
  document.getElementById('agMesHoje').onclick = ()=>{ estado.ag.mes = null; agRender(); };
  document.getElementById('agMostrarVias').onchange = async e=>{ estado.ag.mostrarVias = e.target.checked; if(e.target.checked && !estado.ag.vias) await agCarregarVias(true); agRender(); };
  if(estado.ag.mostrarVias && !estado.ag.vias) agCarregarVias();
  c.querySelectorAll('.ag-dia').forEach(el=> el.addEventListener('click', e=>{
    const iso = el.dataset.agdia; const evEl = e.target.closest('[data-agev]');
    if(evEl){ const ev = agEventosDoDia(iso)[+evEl.dataset.agev];
      if(ev && ev.tarefa) return agEditar(estado.ag.tarefas.find(t=>t.id===ev.tarefa));
      if(ev && ev.via) return agAbrirVia(ev.via);
      return; }
    agEditar(null, iso);
  }));
}

/* ---------- Minhas vias ---------- */
function agAbrirVia(v){
  const info = AG_VIA[v.tipo]; if(!info) return;
  if(EMBEDDED) parent.postMessage({ type:'irParaModulo', modulo:'agenda', alvo: info.alvo, registroId: v.id }, '*');
}
function agRenderVias(c){
  const f = estado.ag;
  if(!f.vias){ c.innerHTML = '<p class="muted">Buscando as vias com o seu nome…</p>'; return; }
  const seloVia = st => { const x = String(st||'').toLowerCase(); const cl = /cancel/.test(x) ? 'danger' : /entreg|pago|ativa|aprov|pronto/.test(x) ? 'ok' : /aguard|pend|oficina|fabrica|pendencia/.test(x) ? 'wait' : ''; const rot = { aguardando:'Aprovado', enviado_fabrica:'Enviado p/ fábrica', em_producao:'Em produção', pendencia:'Pendência', oficina_pronto:'Produzido', pronto:'Pronto', entregue:'Entregue', cancelado:'Cancelado', cancelada:'Cancelada', ativa:'Ativa', aberto:'Aberto' }[x] || st; return `<span class="selo ${cl}">${escapeHtml(rot||'—')}</span>`; };
  const q = f.viaBusca.trim().toLowerCase();
  const lista = Busca.filtrar(f.vias.filter(v=> (!f.viaTipo || v.tipo===f.viaTipo)), q, v=>[v.codigoVia,v.cliente,v.loja,v.vendedora,v.status]);
  const cont = t => f.vias.filter(v=>!t || v.tipo===t).length;
  c.innerHTML = `
    <div class="ag-filtros" style="margin-bottom:10px;">
      ${[['','Todas'],['orcamento','Orçamentos'],['venda','Vendas'],['pedido','Pedidos']].map(([k,n])=>`<button type="button" class="ag-chip ${f.viaTipo===k?'on':''}" data-agvt="${k}">${n} (${cont(k)})</button>`).join('')}
      <input class="busca" id="agViaBusca" type="search" placeholder="Buscar código, cliente ou loja…" value="${escapeHtml(f.viaBusca)}" style="max-width:260px;" aria-label="Buscar via">
    </div>
    ${f.viasErro?`<p class="muted erro-txt">${escapeHtml(f.viasErro)} Clique em atualizar para tentar de novo.</p>`:''}
    ${lista.length ? `<div style="overflow-x:auto;"><table class="ag-vias"><thead><tr><th>Via</th><th>Tipo</th><th>Cliente</th><th>Data</th><th>Loja</th>${f.viasOficina?'<th>Vendedora</th>':'<th class="num">Valor</th>'}<th>Status</th></tr></thead><tbody>
      ${lista.map((v,i)=>`<tr class="clic" data-agvia="${i}" tabindex="0" title="Abrir a via"><td data-l="Via"><b>${escapeHtml(v.codigoVia||'—')}</b>${v.naOficina?' <span class="selo wait" title="Esta via está em poder da Oficina">Na Oficina</span>':''}</td><td data-l="Tipo">${AG_VIA[v.tipo].nome}</td><td data-l="Cliente">${escapeHtml(v.cliente||'—')}</td><td data-l="Data"><span>${agFmtData(v.data)}${v.tipo==='pedido'&&v.data?' <span class="muted">(entrega)</span>':''}${v.tipo==='orcamento'&&v.validade?`<span class="muted" style="display:block;font-size:11px;">vale até ${agFmtData(v.validade)}</span>`:''}</span></td><td data-l="Loja">${escapeHtml(v.loja||'')}</td>${f.viasOficina?`<td data-l="Vendedora">${escapeHtml(v.vendedora||'—')}</td>`:`<td data-l="Valor" class="num">${brl(v.valorTotal)}</td>`}<td data-l="Status">${seloVia(v.status)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="lista-vazia"><b>Nenhuma via com o seu nome${f.viaTipo?' neste filtro':''}</b>${f.viaBusca?'Confira o que foi digitado na busca.':'As vendas, pedidos e orçamentos em que você é a vendedora aparecem aqui.'}</div>`}
    <p class="muted" style="font-size:11.5px;margin-top:8px;">${f.viasOficina ? 'Pedidos que estão em poder da Oficina (enviados para a fábrica, em produção, pendência ou produzidos), de todas as lojas. Clique numa linha para abrir.' : 'Vias em que você é a vendedora; as marcadas “Na Oficina” estão com a Oficina agora. Clique numa linha para abrir.'}</p>`;
  c.querySelectorAll('[data-agvt]').forEach(b=> b.onclick = ()=>{ f.viaTipo = b.dataset.agvt; agRender(); });
  const busca = document.getElementById('agViaBusca');
  busca.oninput = ()=>{ f.viaBusca = busca.value; const pos = busca.selectionStart; agRender(); const nb = document.getElementById('agViaBusca'); nb.focus(); nb.setSelectionRange(pos,pos); };
  c.querySelectorAll('[data-agvia]').forEach(tr=>{ tr.onclick = ()=> agAbrirVia(lista[+tr.dataset.agvia]); tr.onkeydown = e=>{ if(e.key==='Enter') agAbrirVia(lista[+tr.dataset.agvia]); }; });
}


/* ================= MÓDULO ================= */
const AG_ABAS = [['quadro','Tarefas'],['calendario','Calendário'],['vias','Minhas vias']];
function agRenderAbas(){
  const box = document.getElementById('agAbas');
  const rotulo = id => id==='vias' && estado.ag.viasOficina ? 'Vias na Oficina' : (AG_ABAS.find(x=>x[0]===id)||[])[1];
  box.innerHTML = AG_ABAS.map(([id])=>`<button type="button" role="tab" data-agaba="${id}" class="${estado.ag.aba===id?'on':''}" aria-selected="${estado.ag.aba===id}">${rotulo(id)}</button>`).join('');
  box.querySelectorAll('[data-agaba]').forEach(b=> b.onclick = ()=>{ estado.ag.aba = b.dataset.agaba; agRenderAbas(); agRender(); if(estado.ag.aba==='vias' && !estado.ag.vias) agCarregarVias(); });
}
function agRenderResumo(){
  const hoje = agDataISO(new Date()), f = estado.ag;
  const abertas = (f.tarefas||[]).filter(t=>t.coluna!=='feito');
  const nHoje = abertas.filter(t=>t.data===hoje).length, nAtras = abertas.filter(t=>t.data && t.data<hoje).length;
  const nOf = (f.vias||[]).filter(v=>v.naOficina).length;
  document.getElementById('agResumo').innerHTML =
    `<span class="ag-res ${nHoje?'alerta':''}">Para hoje <b>${nHoje}</b></span><span class="ag-res ${nAtras?'alerta':''}">Atrasadas <b>${nAtras}</b></span>`
    + (f.vias ? `<span class="ag-res oficina" title="${f.viasOficina?'Pedidos em poder da Oficina':'Suas vias que estão com a Oficina agora'}">Na Oficina <b>${nOf}</b></span>` : '');
}
const agRenderOrig = agRender;
agRender = function(){ agRenderResumo(); agRenderAbas(); agRenderOrig(); };
async function iniciarAgenda(){
  document.getElementById('agNova').innerHTML = icn('mais',{tam:15})+'Nova tarefa';
  document.getElementById('agAtualizar').innerHTML = icn('atualizar',{tam:16});
  document.getElementById('agNova').onclick = ()=> agEditar(null);
  document.getElementById('agAtualizar').onclick = ()=> agCarregar(true);
  agRenderAbas();
  await agCarregar(true);   // 1ª vez: já traz as vias (para o resumo "Na Oficina")
}
window.addEventListener('message', async ev=>{
  if(!mensagemConfiavel(ev)) return;
  const d = ev.data || {};
  if(d.type==='auth'){
    currentUser = d.user; __gatewaySenha = currentUser ? currentUser.senha : null;
    if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'agenda', tabs:[], active:null }, '*');
    if(!currentUser){ document.getElementById('agAviso').textContent = 'Entre no app para usar a agenda.'; return; }
    estado.ag.viasOficina = currentUser.nivel==='oficina';
    await iniciarAgenda();
  }
});
window.addEventListener('load', ()=>{ if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'agenda' }, '*'); else document.getElementById('agAviso').textContent = 'Abra a agenda pelo menu do app.'; });
(function(){
  var ultimo = 0;
  function avisar(){ var a = Date.now(); if(a - ultimo < 5000) return; ultimo = a; try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){} }
  ['click', 'keydown', 'touchstart', 'scroll'].forEach(function(e){ document.addEventListener(e, avisar, { passive:true, capture:true }); });
})();
</script>
<script src="modal-x.js"></script>
