<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajuda — Gestão e Controle</title>
<style>
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#F1F4F7;--ink:#1A1D24;--ink-soft:#4B5566;--ink-faint:#7C8592;
  --line:#E1E5EA;--accent:#662344;--accent-soft:#F3E6D8;--ok:#17794A;--ok-soft:#E3F5EA;
  --wait:#B45309;--wait-soft:#FCEEDC;--danger:#B91C1C;--danger-soft:#FBEAEA;--radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:16px;}
.wrap{max-width:860px;margin:0 auto;}
h1{font-size:22px;margin:0 0 4px;}
.sub{color:var(--ink-faint);font-size:13.5px;margin:0 0 16px;}
.busca{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:14px;background:var(--surface);}
.busca:focus{outline:none;border-color:var(--accent);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.topico{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.topico-head{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none;}
.topico-head:hover{background:var(--surface-2);}
.topico-head .ico{font-size:20px;flex-shrink:0;}
.topico-head .tit{font-weight:700;font-size:15px;flex:1;}
.topico-head .seta{color:var(--ink-faint);font-size:13px;transition:transform .18s;}
.topico.aberto .seta{transform:rotate(90deg);}
.topico-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);}
.topico.aberto .topico-body{display:block;}
.topico-body p{font-size:14px;line-height:1.6;color:var(--ink-soft);margin:12px 0 8px;}
.passos{counter-reset:p;list-style:none;padding:0;margin:10px 0;}
.passos li{counter-increment:p;position:relative;padding:8px 0 8px 34px;font-size:14px;line-height:1.6;border-bottom:1px dashed var(--line);}
.passos li:last-child{border-bottom:none;}
.passos li::before{content:counter(p);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.btn-ref{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:5px;font-weight:700;font-size:13px;}
.dica{background:var(--ok-soft);border-left:3px solid var(--ok);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px;color:#12613a;}
.aviso{background:var(--wait-soft);border-left:3px solid var(--wait);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px;color:#7a3c06;}
.perigo{background:var(--danger-soft);border-left:3px solid var(--danger);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px;color:#8a1616;}
.vazio{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:14px;}
.secao-tit{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:20px 0 8px;}
@media(max-width:600px){ body{padding:10px;} h1{font-size:19px;} }
</style>
</head>

/* ══════════════════════════════════════════════════════════════════════════════ */
let filtroCat = '';
let termoBusca = '';

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function categorias(){
  const c = [];
  TOPICOS.forEach(t=>{ if(!c.includes(t.cat)) c.push(t.cat); });
  return c;
}

function render(){
  // chips de categoria
  const chips = document.getElementById('chips');
  chips.innerHTML = '<button class="chip '+(filtroCat===''?'active':'')+'" data-cat="">Tudo</button>' +
    categorias().map(c=>'<button class="chip '+(filtroCat===c?'active':'')+'" data-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>').join('');
  chips.querySelectorAll('.chip').forEach(b=> b.addEventListener('click', ()=>{ filtroCat = b.dataset.cat; render(); }));

  // filtra
  let lista = TOPICOS;
  if(filtroCat) lista = lista.filter(t=> t.cat === filtroCat);
  if(termoBusca){
    const q = termoBusca.toLowerCase();
    lista = lista.filter(t=>
      t.tit.toLowerCase().includes(q) ||
      (t.chave||'').toLowerCase().includes(q) ||
      t.body.toLowerCase().includes(q)
    );
  }

  const box = document.getElementById('lista');
  if(lista.length === 0){
    box.innerHTML = '<div class="vazio">Não achei nada com essa palavra.<br>Tente outra, ou pergunte pro Felipe.</div>';
    return;
  }

  // agrupa por categoria quando está mostrando tudo
  let html = '';
  if(!filtroCat && !termoBusca){
    categorias().forEach(c=>{
      const doGrupo = lista.filter(t=> t.cat===c);
      if(doGrupo.length===0) return;
      html += '<div class="secao-tit">'+escapeHtml(c)+'</div>';
      doGrupo.forEach(t=>{ html += cardHtml(t); });
    });
  } else {
    lista.forEach(t=>{ html += cardHtml(t); });
  }
  box.innerHTML = html;

  box.querySelectorAll('.topico-head').forEach(h=>{
    h.addEventListener('click', ()=> h.parentNode.classList.toggle('aberto'));
  });
}

function cardHtml(t){
  const id = TOPICOS.indexOf(t);
  return '<div class="topico" data-i="'+id+'">' +
    '<div class="topico-head"><span class="ico">'+t.ico+'</span><span class="tit">'+escapeHtml(t.tit)+'</span><span class="seta">▶</span></div>' +
    '<div class="topico-body">'+t.body+'</div>' +
  '</div>';
}

let tb = null;
document.getElementById('busca').addEventListener('input', (e)=>{
  clearTimeout(tb);
  tb = setTimeout(()=>{ termoBusca = e.target.value.trim(); filtroCat = ''; render(); }, 200);
});

/* Abre um tópico específico quando o shell pedir (ajuda contextual) */
window.addEventListener('message', (ev)=>{
  const d = ev.data || {};
  if(d.type === 'auth'){
    if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'ajuda', tabs:[], active:null }, '*');
  }
  if(d.type === 'abrirAjuda' && d.busca){
    document.getElementById('busca').value = d.busca;
    termoBusca = d.busca; filtroCat = ''; render();
    const primeiro = document.querySelector('.topico');
    if(primeiro) primeiro.classList.add('aberto');
  }
});

window.addEventListener('load', ()=>{
  if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'ajuda' }, '*');
});

render();

/* Avisa o shell que houve atividade aqui dentro. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
