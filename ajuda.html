<!DOCTYPE html>
<html lang="pt-BR" data-ds>
<head>
<script src="tema.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajuda — Gestão e Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
/* AJUDA — tela de leitura. Cores só por variáveis do tema (tema.css). */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.hide{display:none!important;}
body{font-family:var(--t-font,"Inter",system-ui,sans-serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px 16px 48px;font-size:14px;}
.wrap{max-width:1040px;margin:0 auto;}
.cab{max-width:760px;margin:0 0 20px;}
h1{font-size:20px;letter-spacing:-.015em;margin:0 0 4px;}
.sub{color:var(--ink-faint);font-size:14px;margin:0 0 16px;line-height:1.5;}
.busca-wrap{position:relative;}
.busca-wrap > .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;display:inline-flex;z-index:1;}
.busca::-webkit-search-cancel-button{-webkit-appearance:none;display:none;}
html[data-ds] .busca{width:100%;padding:12px 40px 12px 42px;font-size:15px;border-radius:10px;box-shadow:var(--t-shadow-sm);}
#btnLimparBusca{position:absolute;right:6px;top:50%;transform:translateY(-50%);}

.layout > main{display:block;padding:0 !important;margin:0 !important;min-width:0;max-width:none;width:auto;}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start;}
/* índice (categorias) */
.indice{position:sticky;top:16px;}
.indice-tit{font-size:12px;font-weight:600;color:var(--ink-faint);margin:0 0 8px 10px;}
.chips{display:flex;flex-direction:column;gap:2px;}
html[data-ds] .chip{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;transition:background-color .15s var(--t-ease),color .15s var(--t-ease);}
html[data-ds] .chip:hover{background:var(--surface-2);color:var(--ink);}
html[data-ds] .chip.active{background:var(--accent-soft);color:var(--accent);}
.chip .ico{flex-shrink:0;}
.chip .rot{flex:1;min-width:0;}
.chip .qtd{font-size:12px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.chip.active .qtd{color:var(--accent);}

/* barra acima da lista */
.barra{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
.barra .contagem{font-size:13px;color:var(--ink-faint);}
.barra .btn{font-size:13px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;}

/* tópicos */
.secao-tit{font-size:16px;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:24px 0 10px;display:flex;align-items:center;gap:8px;}
.secao-tit:first-child{margin-top:0;}
.secao-tit .ico{color:var(--accent);}
.topico{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:var(--t-shadow-sm);}
.topico-head{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none;}
.topico-head:hover{background:var(--surface-2);}
.topico-head:focus-visible{outline:none;box-shadow:inset var(--t-ring);}
.topico-head .t-ico{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.topico-head .tit{font-weight:600;font-size:15px;flex:1;line-height:1.35;}
.topico-head .tit mark{background:var(--wait-soft);color:inherit;border-radius:3px;padding:0 1px;}
.topico-head .cat-mini{font-size:12px;color:var(--ink-faint);font-weight:600;white-space:nowrap;}
.topico-head .seta{color:var(--ink-faint);display:inline-flex;transition:transform .18s var(--t-ease);}
.topico.aberto .seta{transform:rotate(90deg);}
.topico.aberto .topico-head{border-bottom:1px solid var(--line);}
.topico-body{display:none;padding:4px 20px 18px 60px;max-width:760px;}
.topico.aberto .topico-body{display:block;}
.topico-body p{font-size:14.5px;line-height:1.65;color:var(--ink-soft);margin:12px 0 8px;}
.topico-body b{color:var(--ink);}
.topico-body ol:not(.passos){padding-left:20px;margin:10px 0;}
.topico-body ol:not(.passos) li{font-size:14.5px;line-height:1.65;color:var(--ink-soft);padding:3px 0;}
.passos{counter-reset:p;list-style:none;padding:0;margin:10px 0;}
.passos li{counter-increment:p;position:relative;padding:7px 0 7px 36px;font-size:14.5px;line-height:1.6;color:var(--ink-soft);}
.passos li::before{content:counter(p);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
html[data-ds] .topico-body .btn-ref{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);padding:0 7px;border-radius:6px;font-weight:600;font-size:13px;line-height:1.6;white-space:nowrap;box-shadow:none;}
html[data-ds] .topico-body .btn-ref:hover{background:var(--surface-2);}
.btn-ref .ico{width:13px;height:13px;}
.dica,.aviso,.perigo{padding:10px 14px;border-radius:10px;margin:12px 0;font-size:14px;line-height:1.55;color:var(--ink);border:1px solid transparent;}
.dica{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 25%, transparent);}
.aviso{background:var(--wait-soft);border-color:color-mix(in srgb, var(--wait) 30%, transparent);}
.perigo{background:var(--danger-soft);border-color:color-mix(in srgb, var(--danger) 25%, transparent);}
.dica b{color:var(--ok);} .aviso b{color:var(--wait);} .perigo b{color:var(--danger);}
.vazio{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:14px;line-height:1.6;background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;}
.vazio .circ{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--ink-faint);display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;}
.vazio b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px;}
.vazio .btn{margin-top:12px;}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:12px;}
  .indice{position:static;}
  .indice-tit{display:none;}
  .chips{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:6px;margin:0 -16px;padding:0 16px 4px;}
  .chips::-webkit-scrollbar{display:none;}
  html[data-ds] .chip{width:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:40px;}
  html[data-ds] .chip.active{border-color:transparent;}
  .chip > .ico{display:none;}
}
@media (max-width:600px){
  body{padding:16px 16px 40px;}
  html[data-ds] .busca{font-size:16px;}
  .topico-head{padding:12px 14px;gap:10px;}
  .topico-head .cat-mini{display:none;}
  .barra{flex-wrap:nowrap;}
  .barra .rot-d{display:none;}
  .topico-body{padding:4px 16px 16px;}
}
@media (prefers-reduced-motion:reduce){ .topico-head .seta{transition:none;} }
</style>
<script src="icones.js"></script>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <h1>Ajuda</h1>
    <p class="sub">Passo a passo para usar o sistema. Procure uma palavra ou escolha um assunto.</p>
    <div class="busca-wrap">
      <span class="lupa" data-ic="busca"></span>
      <input class="busca" id="busca" type="search" autocomplete="off" aria-label="Procurar na ajuda" placeholder="Procurar: venda, troca, senha…">
      <button type="button" class="btn-icone hide" id="btnLimparBusca" title="Limpar busca" aria-label="Limpar busca"><span data-ic="x"></span></button>
    </div>
  </div>
  <div class="layout">
    <nav class="indice" aria-label="Assuntos">
      <div class="indice-tit">Assuntos</div>
      <div class="chips" id="chips"></div>
    </nav>
    <main>
      <div class="barra">
        <span class="contagem" id="contagem"></span>
        <span style="display:flex;gap:6px;">
          <button type="button" class="btn btn-ghost" id="btnAbrirTodos"><span data-ic="baixo"></span>Abrir<span class="rot-d"> todos</span></button>
          <button type="button" class="btn btn-ghost" id="btnFecharTodos"><span data-ic="cima"></span>Fechar<span class="rot-d"> todos</span></button>
        </span>
      </div>
      <div id="lista"></div>
    </main>
  </div>
</div>

<script>
/* ── SEGURANÇA: só aceita mensagens vindas do próprio app ───────────────────
   Sem esta checagem, qualquer site que abrisse este arquivo num iframe poderia
   mandar uma mensagem 'auth' forjada e assumir a sessão. Como shell e módulos
   ficam todos no mesmo domínio, basta exigir a mesma origem.
   ────────────────────────────────────────────────────────────────────────── */
function mensagemConfiavel(ev){
  try{
    if(ev.origin && ev.origin !== 'null' && ev.origin !== window.location.origin) return false;
    return true;
  }catch(e){ return false; }
}

const EMBEDDED = window.parent !== window;
/* Ícone pequeno dentro do texto da ajuda (icones.js). */
const I = (nome)=>{ try{ return window.Icone ? Icone(nome,{tam:13}) : ''; }catch(e){ return ''; } };

/* ══════════════════════════════════════════════════════════════════════════════
   CONTEÚDO DA AJUDA
   Cada tópico tem: categoria, ícone, título, palavras-chave (pra busca) e corpo.
   Linguagem informal de propósito — quem lê é quem está no balcão.
   ══════════════════════════════════════════════════════════════════════════════ */
const TOPICOS = [

/* ─────────────── PRIMEIROS PASSOS ─────────────── */
{
  cat:'Começando', ico:'sair', tit:'Entrar no sistema',
  chave:'login entrar senha usuario acesso bloqueado',
  body:`
    <ol class="passos">
      <li>Digite seu <b>nome ou apelido</b> no campo de cima. Não precisa acento nem letra maiúscula.</li>
      <li>Digite sua <b>senha</b>.</li>
      <li>Clique em <span class="btn-ref">Entrar</span>.</li>
    </ol>
    <div class="aviso"><b>Errou a senha 6 vezes?</b> O acesso trava por segurança. Só a diretoria destrava — fale com o Felipe.</div>
    <div class="dica"><b>Pode entrar no computador e no celular ao mesmo tempo.</b> Um não derruba o outro.</div>
    <p><b>Esqueceu a senha?</b> Peça pra diretoria ou gerência cadastrar uma nova pelo módulo CONFIGURAÇÕES.</p>
  `
},
{
  cat:'Começando', ico:'loja', tit:'Em qual loja eu estou (e como operar em outra)',
  chave:'loja trocar mudar empresa filial contexto outra loja senha gerente barra vermelha',
  body:`
    <p>Você entra sempre na <b>loja de trabalho</b> que a diretoria definiu no DP. A sigla dela aparece no balão colorido no alto da tela (ex.: <b>MC</b>). <b>Tudo que você lança vale para essa loja.</b></p>
    <p>Precisa lançar algo em outra loja?</p>
    <ol class="passos">
      <li>Menu <span class="btn-ref">CAIXA</span> → cartão <span class="btn-ref">OUTRA LOJA</span>.</li>
      <li>Escolha a loja e peça para um <b>gerente ou diretor</b> digitar a senha dele.</li>
      <li>Aparece uma <b>barra vermelha</b> no topo dizendo em qual loja você está operando. Ela vale por até 4 horas.</li>
      <li>Terminou? Clique em <span class="btn-ref">Voltar para minha loja</span> na barra vermelha.</li>
    </ol>
    <div class="perigo"><b>Confira a loja antes de lançar.</b> Se a barra vermelha estiver aparecendo, a venda vai para a outra loja.</div>
    <div class="aviso">Em outra loja, o sistema desconecta depois de <b>10 minutos</b> sem uso. Cinco senhas erradas bloqueiam o usuário (a diretoria desbloqueia no DP).</div>
  `
},
{
  cat:'Começando', ico:'relogio', tit:'Sistema me desconectou sozinho',
  chave:'desconectou saiu sozinho inatividade tempo sessao expirou',
  body:`
    <p>Depois de um tempo parado (sem clicar em nada), o sistema desconecta sozinho: <b>20 minutos</b> na sua loja e <b>10 minutos</b> quando você está operando em outra loja. É proteção: se alguém sentar no seu lugar, não consegue usar o seu acesso.</p>
    <div class="dica">Um minuto antes aparece uma <b>faixa laranja no topo</b> avisando. Clique em <span class="btn-ref">Continuar conectado</span> e nada acontece.</div>
    <p>Se desconectou, é só entrar de novo. Nada do que você já salvou se perde.</p>
  `
},
{
  cat:'Começando', ico:'sino', tit:'A tela de Avisos',
  chave:'avisos pendencia inicial notificacao badge painel dashboard',
  body:`
    <p>É a primeira tela quando você entra, dentro do módulo <b>PAINEL</b>. Ela mostra <b>o que está te esperando</b>: pedido pronto pra entregar, orçamento vencendo, conta pra pagar…</p>
    <p>A bolinha vermelha no item PAINEL do menu mostra quantas coisas estão pendentes. Clicou no aviso, ele te leva direto pro lugar certo.</p>
    <p>Quem tem acesso vê também as abas <b>Dashboard</b> (indicadores, gráficos e relatórios) e <b>IA</b> no topo do PAINEL.</p>
  `
},

/* ─────────────── VENDAS ─────────────── */
{
  cat:'Vender', ico:'carrinho', tit:'Lançar uma venda',
  chave:'venda vender pdv cupom lancar item produto pagamento',
  body:`
    <ol class="passos">
      <li>Confira a <b>sigla da loja</b> no alto da tela.</li>
      <li>Menu <span class="btn-ref">CAIXA</span> → cartão <span class="btn-ref">VENDAS</span>.</li>
      <li>Clique em <span class="btn-ref">+ Nova venda</span>.</li>
      <li>Escolha a <b>vendedora</b> e confira a data.</li>
      <li><b>Cliente</b> é opcional — se quiser vincular, clique em buscar e procure pelo nome ou telefone.</li>
      <li>Em <b>Itens</b>: escolha o produto, o metal, a quantidade e o valor. Precisa de mais linhas? Clique em <span class="btn-ref">+ Adicionar item</span>.</li>
      <li>Em <b>Pagamento</b>: escolha a forma (dinheiro, cartão, pix…). Dá pra dividir em várias formas.</li>
      <li>Responda se <b>emitiu nota fiscal</b> (sim ou não).</li>
      <li>Clique em <span class="btn-ref">Salvar venda</span>.</li>
    </ol>
    <div class="dica">Embaixo de cada produto aparece <b>quanto tem em estoque nesta loja</b> e se tem em outra.</div>
  `
},
{
  cat:'Vender', ico:'alerta', tit:'O produto não tem na minha loja',
  chave:'estoque zerado outra loja peca falta cnpj entre lojas',
  body:`
    <p>Se aparecer o aviso laranja <b>"Sem estoque nesta loja, mas tem em JN"</b>, quer dizer que a peça existe, só que é de <b>outra empresa</b> (outro CNPJ).</p>
    <p>Você <b>pode vender</b>, mas precisa avisar o sistema direitinho:</p>
    <ol class="passos">
      <li>Na parte de <b>Pagamento</b>, no campo <b>Empresa joia</b>, escolha a loja <b>de onde a peça saiu de verdade</b>.</li>
      <li>O sistema vai pedir pra confirmar <b>em qual empresa a baixa de estoque será feita</b> — tem que ser a mesma de onde a peça saiu.</li>
      <li>Se emitiu nota, informe também a empresa do <b>pagamento</b> e a da <b>nota</b>.</li>
    </ol>
    <div class="aviso">Essa venda vai entrar num relatório separado (<b>Entre lojas</b>) pra diretoria acertar a parte fiscal entre as empresas depois. Você não precisa fazer mais nada além de preencher certo.</div>
  `
},
{
  cat:'Vender', ico:'impressora', tit:'Imprimir a via e o código de barras',
  chave:'imprimir via cupom codigo barras bobina impressora',
  body:`
    <p>Toda via impressa sai com o <b>código de barras no topo</b>, com o número embaixo dele.</p>
    <ol class="passos">
      <li>Abra a venda (ou pedido/orçamento) clicando nela na lista.</li>
      <li>Clique em <span class="btn-ref">${I('impressora')}Imprimir</span>.</li>
      <li>Abre uma janelinha — mande imprimir normalmente.</li>
    </ol>
    <div class="aviso">Se não abrir nada, provavelmente o navegador bloqueou a janela. Procure um aviso na barra de endereço e libere os pop-ups desse site.</div>
    <p><b>O que significa o código?</b> Ex.: <b>MC3V</b> = loja Marechal (MC), terceiro (3), Venda (V). As letras do final: <b>V</b>=venda, <b>P</b>=pedido, <b>O</b>=orçamento.</p>
  `
},
{
  cat:'Vender', ico:'leitor', tit:'Ler o código de barras da via',
  chave:'ler codigo barras scanner leitor camera celular buscar via',
  body:`
    <p>Achou uma via em papel e quer abrir ela no sistema? Tem três jeitos:</p>
    <ol class="passos">
      <li><b>Leitor de mesa:</b> é só apontar e ler, de qualquer tela. O sistema abre a via sozinho.</li>
      <li><b>Celular:</b> clique no botão <span class="btn-ref">${I('busca')}Buscar</span> → <span class="btn-ref">${I('camera')}Câmera</span> → aponte pro código.</li>
      <li><b>Digitando:</b> clique no <span class="btn-ref">${I('busca')}Buscar</span> e digite o código (ex.: MC3V).</li>
    </ol>
    <div class="dica">Se você estava no meio de um lançamento, o sistema <b>salva como rascunho</b> antes de pular pra via lida. Você não perde nada.</div>
  `
},

/* ─────────────── PEDIDOS ─────────────── */
{
  cat:'Pedidos e O.S.', ico:'recibo', tit:'Abrir um pedido (O.S.)',
  chave:'pedido os ordem servico conserto abrir cliente prazo',
  body:`
    <ol class="passos">
      <li>Confira a <b>sigla da loja</b> no alto da tela.</li>
      <li>Menu <span class="btn-ref">CAIXA</span> → cartão <span class="btn-ref">PEDIDO</span>.</li>

    </ol>
    <div class="aviso">Se a data escolhida estourar o limite de pedidos daquele dia, o sistema avisa e pede um <b>código de autorização</b> — é com a gerência.</div>
  `
},
{
  cat:'Pedidos e O.S.', ico:'check', tit:'Marcar pedido como pronto ou entregue',
  chave:'pronto entregue status pedido finalizar avisar cliente',
  body:`
    <ol class="passos">
      <li>Ache o pedido na lista (dá pra buscar pelo nome do cliente).</li>
      <li>Clique nele pra abrir.</li>
      <li>Mude o <b>Status</b> para <b>Pronto</b> (peça terminada) ou <b>Entregue</b> (cliente já levou).</li>
      <li>Salve.</li>
    </ol>
    <div class="dica">Quando marca como <b>Pronto</b>, o pedido aparece nos Avisos pra alguém ligar avisando o cliente.</div>

},

/* ─────────────── ORÇAMENTO ─────────────── */
{
  cat:'Orçamento', ico:'documento', tit:'Fazer um orçamento',
  chave:'orcamento orcar proposta validade cliente aprovar',
  body:`
    <ol class="passos">
      <li>Menu <span class="btn-ref">CAIXA</span> → <span class="btn-ref">ORÇAMENTO</span> → <span class="btn-ref">+ Novo</span>.</li>
      <li>Preencha cliente, vendedora e a <b>validade</b> (quantos dias o preço vale).</li>

      <li>Salve — e imprima ou mande pro cliente.</li>

    <p><b>Cliente aprovou?</b> Abra o orçamento e mude o status para <b>Aprovado</b>. Aí é só lançar a venda normalmente.</p>
    <div class="dica">Na hora de lançar uma venda pra um cliente que tem orçamento aberto, o sistema te avisa e pergunta se é aquele orçamento.</div>
  `
},

/* ─────────────── TRANSFERÊNCIAS ─────────────── */
{
  cat:'Transferências', ico:'trocar', tit:'Pedir peça de outra loja (transferência)',
  chave:'transferencia troca pedir peca outra loja fator igual diferente',
  body:`
    <ol class="passos">
      <li>Menu <span class="btn-ref">CAIXA</span> → <span class="btn-ref">TRANSFERÊNCIAS</span>.</li>
      <li>Clique em <span class="btn-ref">+ Nova transferência</span>.</li>
      <li>A <b>Loja que solicitou</b> já vem preenchida com a sua loja de trabalho.</li>
      <li>Em <b>Onde tem o produto</b>, escolha a loja que tem a peça.</li>
      <li>Escolha o <b>tipo</b>: Troca, Troca diferente ou Saída.</li>
      <li>Adicione a peça e tire foto.</li>
      <li>Salve.</li>

/* ══════════════════════════════════════════════════════════════════════════════ */
let filtroCat = '';
let termoBusca = '';

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function categorias(){
  const c = [];
  TOPICOS.forEach(t=>{ if(!c.includes(t.cat)) c.push(t.cat); });
  return c;
}

function render(){
  // chips de categoria
  const chips = document.getElementById('chips');
  chips.innerHTML = '<button class="chip '+(filtroCat===''?'active':'')+'" data-cat="">'+I('lista')+'<span class="rot">Tudo</span><span class="qtd">'+TOPICOS.length+'</span></button>' +
    categorias().map(c=>'<button class="chip '+(filtroCat===c?'active':'')+'" data-cat="'+escapeHtml(c)+'">'+I(ICONE_CAT[c]||'info')+'<span class="rot">'+escapeHtml(c)+'</span><span class="qtd">'+TOPICOS.filter(t=>t.cat===c).length+'</span></button>').join('');
  chips.querySelectorAll('.chip').forEach(b=> b.addEventListener('click', ()=>{ filtroCat = b.dataset.cat; render(); }));

  // filtra
  let lista = TOPICOS;
  if(filtroCat) lista = lista.filter(t=> t.cat === filtroCat);
  if(termoBusca){
    const q = termoBusca.toLowerCase();
    lista = lista.filter(t=>
      t.tit.toLowerCase().includes(q) ||
      (t.chave||'').toLowerCase().includes(q) ||
      textoPuro(t.body).toLowerCase().includes(q)
    );
  }

  const box = document.getElementById('lista');
  if(lista.length === 0){
    box.innerHTML = '<div class="vazio"><div class="circ">'+I('busca')+'</div><b>Nenhum assunto encontrado'+(termoBusca?' para “'+escapeHtml(termoBusca)+'”':'')+'</b>Tente outra palavra (ex.: venda, senha, imprimir) ou fale com o Felipe.<br><button type="button" class="btn btn-ghost" id="btnVazioLimpar">Limpar busca</button></div>';
    const lb = document.getElementById('btnVazioLimpar'); if(lb) lb.addEventListener('click', limparBusca);
    atualizarContagem(0);
    return;
  }

  // agrupa por categoria quando está mostrando tudo
  let html = '';
  if(!filtroCat && !termoBusca){
    categorias().forEach(c=>{
      const doGrupo = lista.filter(t=> t.cat===c);
      if(doGrupo.length===0) return;
      html += '<h2 class="secao-tit">'+I(ICONE_CAT[c]||'info')+escapeHtml(c)+'</h2>';
      doGrupo.forEach(t=>{ html += cardHtml(t); });
    });
  } else {
    lista.forEach(t=>{ html += cardHtml(t); });
  }
  box.innerHTML = html;

  box.querySelectorAll('.topico-head').forEach(h=>{
    h.addEventListener('click', ()=>{ h.parentNode.classList.toggle('aberto'); h.setAttribute('aria-expanded', h.parentNode.classList.contains('aberto')); });
    h.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); h.click(); } });
  });
  // busca com poucos resultados: já mostra o texto aberto
  if(termoBusca && lista.length <= 3) box.querySelectorAll('.topico').forEach(t=>{ t.classList.add('aberto'); t.querySelector('.topico-head').setAttribute('aria-expanded','true'); });
  atualizarContagem(lista.length);
}

/* ---------- apresentação (índice, contagem, abrir/fechar, busca) ---------- */
const ICONE_CAT = { 'Começando':'info', 'Vender':'carrinho', 'Pedidos e O.S.':'recibo', 'Orçamento':'documento', 'Transferências':'trocar', 'Chat':'mensagem', 'Caixa e contas':'carteira', 'Deu problema':'alerta' };
function textoPuro(html){ return String(html||'').replace(/<[^>]*>/g,' ').replace(/\$\{[^}]*\}/g,' ').replace(/\s+/g,' '); }
function marcarBusca(txt){
  const e = escapeHtml(txt); if(!termoBusca) return e;
  const q = escapeHtml(termoBusca).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return e.replace(new RegExp('('+q+')','ig'),'<mark>$1</mark>'); }catch(err){ return e; }
}
function atualizarContagem(n){
  const el = document.getElementById('contagem'); if(!el) return;
  el.textContent = n===1 ? '1 assunto' : n+' assuntos';
  const lb = document.getElementById('btnLimparBusca'); if(lb) lb.classList.toggle('hide', !termoBusca);
  ['btnAbrirTodos','btnFecharTodos'].forEach(id=>{ const b = document.getElementById(id); if(b) b.classList.toggle('hide', !n); });
}
function abrirTodos(abrir){
  document.querySelectorAll('#lista .topico').forEach(t=>{ t.classList.toggle('aberto', abrir); const h = t.querySelector('.topico-head'); if(h) h.setAttribute('aria-expanded', abrir); });
}
function limparBusca(){
  const b = document.getElementById('busca'); b.value = ''; termoBusca = ''; render(); b.focus();
}
function pintarIcones(){ document.querySelectorAll('[data-ic]').forEach(el=>{ if(!el.innerHTML) el.innerHTML = window.Icone ? Icone(el.dataset.ic,{tam:16}) : ''; }); }
pintarIcones();
document.getElementById('btnAbrirTodos').addEventListener('click', ()=> abrirTodos(true));
document.getElementById('btnFecharTodos').addEventListener('click', ()=> abrirTodos(false));
document.getElementById('btnLimparBusca').addEventListener('click', limparBusca);

function cardHtml(t){
  const id = TOPICOS.indexOf(t);
  return '<div class="topico" data-i="'+id+'">' +
    '<div class="topico-head" role="button" tabindex="0" aria-expanded="false"><span class="t-ico">'+I(t.ico).replace('width="13" height="13"','width="17" height="17"')+'</span><span class="tit">'+marcarBusca(t.tit)+'</span>'+(termoBusca?'<span class="cat-mini">'+escapeHtml(t.cat)+'</span>':'')+'<span class="seta">'+I('direita')+'</span></div>' +
    '<div class="topico-body">'+t.body+'</div>' +
  '</div>';
}

let tb = null;
document.getElementById('busca').addEventListener('input', (e)=>{
  clearTimeout(tb);
  tb = setTimeout(()=>{ termoBusca = e.target.value.trim(); filtroCat = ''; render(); }, 200);
});

/* Abre um tópico específico quando o shell pedir (ajuda contextual) */
window.addEventListener('message', (ev)=>{
    if(!mensagemConfiavel(ev)) return;
  const d = ev.data || {};
  if(d.type === 'auth'){
    if(EMBEDDED) parent.postMessage({ type:'tabs', modulo:'ajuda', tabs:[], active:null }, '*');
  }
  if(d.type === 'abrirAjuda' && d.busca){
    document.getElementById('busca').value = d.busca;
    termoBusca = d.busca; filtroCat = ''; render();
    const primeiro = document.querySelector('.topico');
    if(primeiro) primeiro.classList.add('aberto');
  }
});

window.addEventListener('load', ()=>{
  if(EMBEDDED) parent.postMessage({ type:'ready', modulo:'ajuda' }, '*');
});

render();

/* Avisa o shell que houve atividade aqui dentro. */
(function(){
  var ultimoAviso = 0;
  function avisar(){
    var agora = Date.now();
    if(agora - ultimoAviso < 5000) return;
    ultimoAviso = agora;
    try{ if(window.parent !== window) window.parent.postMessage({ type:'atividade' }, '*'); }catch(e){}
  }
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(function(ev){
    document.addEventListener(ev, avisar, { passive:true, capture:true });
  });
})();
</script>
