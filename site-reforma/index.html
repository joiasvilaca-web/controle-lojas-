      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h12M3 17h18"/></svg>

    <nav class="nav" id="nav" aria-label="Seções"></nav>

      <button class="icone" data-fechar aria-label="Fechar sacola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

<script src="/assets/app.js" defer></script>
